<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 63 · SMALL LANGUAGE MODEL (SLM 1B-8B) ON-DEVICE MOBILE NPU, SPINQUANT W4A8 &amp; HYBRID ROUTING</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">端侧小模型 (SLM) 手机 NPU、SpinQuant W4A8 与端云协同路由选型一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 10M DAU (100M Queries/Day: 75% Routine UI/Rewrite + 25% Complex Reasoning) · 3.8B NPU + Cloud 70B · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="144" height="24" rx="6" fill="#7F1D1D"/>
  <text x="128" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 100% 纯云端 70B</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">全量请求上云 API 兜底</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">网络 RTT 延迟高且云账单极其昂贵</text>
  <text x="56" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 中位首字 TTFT: 380.0 ms ✕</text>
  <text x="56" y="298" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 稳态吐字速度: 42.0 tok/s</text>
  <text x="56" y="324" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 终端计算功耗: 0.8 W (仅网卡)</text>
  <text x="56" y="350" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 混合任务准确率: 91.2% (基准)</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 云账单: $42,000/天 ($15.3M/年 ✕)</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⛔ 弱网断联即废，千万日活账单失控</text>

  <!-- Tier 2 -->
  <rect x="346" y="148" width="288" height="310" rx="12" fill="#1F2437" stroke="#F97316" stroke-width="1.5"/>
  <rect x="362" y="164" width="156" height="24" rx="6" fill="#7C2D12"/>
  <text x="440" y="180" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 2 · 端侧 GPU/WebGPU</text>
  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">通用 GGUF Q4_K_M (W4A16)</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">8.5W 功耗 90 秒烫至 44°C 触发降频</text>
  <text x="362" y="272" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 中位首字 TTFT: 245.0 ms</text>
  <text x="362" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 稳态吐字速度: 14.2 tok/s (降频 ✕)</text>
  <text x="362" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 终端计算功耗: 8.5 W (烫手掉电 ✕)</text>
  <text x="362" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 混合任务准确率: 70.8% (难题崩 ✕)</text>
  <text x="362" y="376" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 云账单: $0 / 天</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 仅适合插电桌面 PC 浏览器 WebGPU</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="168" height="24" rx="6" fill="#1E3A8A"/>
  <text x="752" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · 专用 NPU W4A8</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">SpinQuant 旋转 + NPU 静态图</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">ExecuTorch / QNN / CoreML ANE</text>
  <text x="668" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 中位首字 TTFT: 65.0 ms 🏆</text>
  <text x="668" y="298" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 稳态吐字速度: 54.0 tok/s (零降频 🏆)</text>
  <text x="668" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 终端计算功耗: 2.4 W (能效13.5x 🏆)</text>
  <text x="668" y="350" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 混合任务准确率: 71.5% (限窄域)</text>
  <text x="668" y="376" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 云账单: $0 / 天 ✅</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 100% 离线隐私窄域功能最佳选择</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
  <text x="1066" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · 端云协同级联 (推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">75% 端侧 NPU + 25% 云端 70B</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Apple Intelligence / Hybrid AI 范式</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 中位首字 TTFT: 72.0 ms (快 5.3x 🏆)</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 稳态吐字速度: 51.5 tok/s 🏆</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 终端计算功耗: 2.1 W (冰凉省电 🏆)</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 混合准确率: 89.8% (+18.3pt 🏆)</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 云账单: $10.6k/天 (年省 $1,146万 🏆)</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 千万日活智能终端与超级 App 标杆</text>

  <!-- Bottom Pipeline: SpinQuant W4A8 + Shared LoRA + Hybrid Cascade -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">⚡ 端侧 NPU 与端云协同三大核心技术机制：为什么能效比手机 GPU 高 13.5 倍且立省 75% 云账单？</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="82" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① SpinQuant 正交哈达玛旋转消峰 (无损 W4A8)</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 痛点：大模型激活存在 100x 离群尖峰，直接压 INT8 必崩</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 机制：利用 (XR)(R^T W^T) = XW^T，将正交旋转矩阵 R^T</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  离线融合进权重，把尖峰均匀摊平到全通道，解锁定点 NPU</text>
  <text x="82" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 2.4W 跑出 54 tok/s，单瓦能效比 GPU 高 13.48 倍</text>

  <!-- Step 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="468" y="562" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② AOT 静态图分桶 + 单基座多 LoRA 共享内存</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 静态图：预编译 128/512/2048 固定形状桶，中间激活常驻</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  NPU 片上高速缓存 (VTCM)，杜绝动态形状回退 CPU</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 系统只驻留 1 个 1.8GB 基座，按场景热插拔 20MB LoRA</text>
  <text x="468" y="668" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 杜绝多个 App 重复加载模型撑爆手机 8G/12G 内存</text>

  <!-- Step 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="864" y="562" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 隐私锁死 + 首词香农熵门控端云级联</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 本地私密数据 (短信/日程) 100% 强制锁死端侧 NPU 不出端</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 75% 日常低熵请求 (H&lt;0.60) 本地 65ms 零成本直接闭环；</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 25% 高熵复杂推理/代码请求 12ms 无感上云交由 70B 接管</text>
  <text x="864" y="668" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 准确率达 89.8%，每年净省 $1,146 万云算力费</text>
</svg>
