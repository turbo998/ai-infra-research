  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：少量非标大项目，投标高峰期大量弃标</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 纯 Prompt 让 LLM 全答“无偏离”</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">瞎承诺未开发功能，乱贴过期ISO证书当场废标</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 讨好型人格遇所有条款一律填“完全满足(正偏离)”</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 中标后无法交付被索赔，或引过期案例废标达 14.5%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">技术偏离表应答准确率: 64.0% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">★条款废标/虚假承诺率: 14.5% (违约 ✕)</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">单份标书初稿准备耗时: 1.2 小时</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月售前与违约索赔总成本: $440,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让无产品版本事实约束的LLM直接填偏离表</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 历史标书向量 RAG + 辅助撰写</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">常召回三年前旧版参数与超期失效合同</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 扁平向量库混杂旧产品版本与定制POC参数</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 算不清“近3年满200万合同”，废标/错引率 5.4%</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">技术偏离表应答准确率: 79.8%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">★条款废标/虚假承诺率: 5.4% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">单份标书初稿准备耗时: 14.0 小时</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月售前人力与损失成本: $145,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：一般性RFI技术交流，严肃政企招投标易踩雷</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad427)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: ★条款AST+GA事实库+资质SQL 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">区分GA与Roadmap + 资质原件对位 + 零废标</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 强制区分当前GA版本与期货Roadmap，自动附截图页码</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• SQL 精确匹配有效证书/近3年合同 + 负偏离触发SME签批</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">技术偏离表应答准确率: 98.2% 🏆 (+34.2pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">★条款废标/虚诺率: 0.0% 🏆 (证据链锁死)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">单份标书初稿耗时: 1.5 小时 🏆 (快50倍)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月售前运营总成本: $42,000 (-85.5% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：政企总包招投标、云/软件安全问卷(CAIQ/SOC2)</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业智能招投标 (RFP Agent) 架构师铁律（Star-Clause AST + GA Truth Graph + Certificate SQL Gate）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 严禁直接检索历史旧标书（旧标书充满已废弃参数与项目定制承诺）：必须以按版本号隔离的《当前 GA 产品事实图谱》为唯一技术应答源。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 废标星号条款（★）要求的资质证书有效期与历史业绩合同（签字日期/金额/行业）必须走 SQL 确定性查询并自动插入带印章扫描件页码索引 · Provenance: synthetic + anonymized_reported</text>
