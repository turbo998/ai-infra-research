  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">一份标书耗76小时，熬夜漏挂证明导致废标</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 400条点对点技术偏离表全靠Ctrl+C/V翻旧文档</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 疲劳漏附★号条款要求的检测报告页码，废标率2.8%</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fde68a" font-size="13" font-weight="700">技术偏离表应答准确率: 89.5%</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">★条款废标/虚假承诺率: 2.8% ✕</text>
