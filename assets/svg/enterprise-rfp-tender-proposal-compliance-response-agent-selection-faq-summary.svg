  <rect width="1200" height="680" fill="url(#bgGrad427)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级智能招投标、RFP 标书自动应答、废标星号条款（★）核验与资质对位 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">月均 320份企业级标书 / 16万条技术偏离表 · 售前手工复制旧标书 vs. 纯LLM全填“无偏离” vs. 扁平问答库RAG vs. ★废标条款AST + GA版本事实图谱 + 资质业绩SQL铁闸</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">98.2% Acc · 0% 废标/虚诺</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
