  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">首轮格式合规率</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">有效输出 P99</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度 TCO</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 纯 Prompt 约束 + 客户端 Pydantic 重试</text>
  <text x="450" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.0 ms</text>
  <text x="620" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.0 ms</text>
