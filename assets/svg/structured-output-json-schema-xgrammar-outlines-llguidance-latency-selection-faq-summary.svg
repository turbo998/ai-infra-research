<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#EC4899" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">大模型结构化输出与约束解码选型：XGrammar vs. llguidance vs. Outlines vs. 客户端重试</text>
  <text x="52" y="94" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="15">99.1% 上下文无关词表预计算 + 下推自动机 (PDA) + CPU/GPU 异步重叠 + 确定性键名跳跃解码 (Jump-Forward)</text>

  <!-- Left: Why Unconstrained & Legacy Masking Fail -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么复杂 JSON Schema 会拖垮 Agent 延迟与吞吐？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 A：仅靠 Prompt + 客户端 Pydantic 校验重试 (Tier 1)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 45 字段嵌套 Schema 首轮合规率仅 85.8%，14.2% 请求触发 2~3 轮重试</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• P99 端到端延迟暴增至 6,850 ms，白白浪费 +34.5% 算力 Token！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 B：朴素逐 Token 同步扫描 128K 词表生成 Mask (Tier 2)</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 每步 Decode 阻塞等待 CPU 扫描 128,256 个 Token (+18.5 ms/step)</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 动态新 Schema 首次 DFA 编译耗时长达 1,450 ms，直接卡死 GPU 批处理</text>

  <!-- Right: XGrammar & llguidance Architecture -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. XGrammar / llguidance 零开销约束解码三板斧 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 词表二分法：99.1% 上下文无关 Token 离线预存 Bitmask</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">运行时每步仅需在 CPU 上动态检查 &lt; 0.9% 上下文相关 Token，耗时仅 0.08 ms！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② CPU Mask 计算与 GPU 前向传播双线程异步流水重叠</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">GPU 算第 t 步 Transformer 层的同时，CPU 已备好 Logits 采样所需的 Bitmask</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 跳跃解码 (Jump-Forward / Compressed FSM)：固定字段名免采样直填</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">遇到唯一确定子串（如 `{"customer_id": "`）直接拼入 KV Cache，反而提速 22%！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 四档结构化输出架构性能与成本对比（128K 词表 · 45 字段 JSON Schema · 120 RPS）</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">架构方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">动态 Schema 编译</text>
