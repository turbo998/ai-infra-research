<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级深度研究 (Deep Research) 与投研尽调 Agent 选型：串行 ReAct vs. 并行 DAG Map-Reduce + 双账本溯源 (#426)</text>
  <text x="28" y="58" class="sub">为什么单线程串行 Deep Research 跑完 40 次搜索会滚雪球烧掉 120 万 Tokens 且耗时 11 分钟？用并行子智能体 DAG 提速 6.2x、省 81%！</text>

  <!-- Left Panel: Serial Monolithic ReAct Snowball vs Parallel Sub-Agent Map-Reduce DAG -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 深度研究 Agent 的头号性能杀手：串行单循环滚雪球 vs. 并行子智能体 Map-Reduce</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 死穴：单线程串行 ReAct 循环连搜 40 篇财报/网页并全塞进同一个主上下文</text>
  <text x="56" y="164" class="mono">• 二次方 Token 爆炸：第 1 步塞入 4K，第 40 步上下文滚到 160K，累计消耗 1,240,000 Tokens！</text>
  <text x="56" y="184" class="mono">• 蜗牛延迟：40 步串行搜索+阅读耗时 680 秒 (11.3 分钟)，且前序噪音淹没核心财务比率</text>
  <text x="56" y="202" class="txt">• 数字幻觉：大模型直接心算 ROE / 毛利率同比，数值计算错漏率高达 18.5%！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：Lead Planner 拆解 DAG + 8 个 8B/32B 子 Agent 隔离并发阅读 + 沙箱验算</text>
  <text x="56" y="272" class="mono">• Map 阶段 (隔离上下文)：8 个子 Agent 在各自独立的 16K 小窗口内并发精读财报/研报/新闻</text>
  <text x="56" y="292" class="mono">• Reduce 阶段：每个子 Agent 仅向主控返回 &lt;600 Tokens 的带行号引用证据卡片 (Evidence Card)</text>
  <text x="56" y="312" class="txt">• 结果：单份万字尽调报告从 11.3 分钟缩至 1.8 分钟 (快 6.2x)，Token 从 124万降至 23万 (-81.5%)！</text>

  <!-- Right Panel: 4 Deep Research Agent Architectures Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业深度研究与投研尽调 Agent 架构横向对标 (10 万份尽调报告/月)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 单线程串行 70B/R1 ReAct 循环 (40 步历史全塞单一上下文)</text>
  <text x="638" y="158" class="mono">• 耗时 680s (11.3m) ✕ | 数值准确率 81.5% ✕ | 单篇 $2.48 ($24.8万/月) ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 商业通用公网 Deep Research API (OpenAI / Perplexity Deep Research)</text>
  <text x="638" y="214" class="mono">• 公网信息检索极强，但无法直连企业内网非公开 VDR 尽调数据室 | 单篇 $1.65 ($16.5万/月)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 自建多智能体静态流水线 (LangGraph 固定 4 步检索合成)</text>
  <text x="638" y="270" class="mono">• 耗时 165s | 缺乏 Python 财务恒等式验算与溯源对齐 | 数值准确率 88.4% | $0.62/篇</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 并行 Map-Reduce DAG + Python 财务双账本验算 + 单元格级溯源门禁 (🏆旗舰)</text>
  <text x="638" y="326" class="mono">• 耗时 110s (1.8m) 🏆 | 财务数值零误差 99.4% 🏆 | 单篇仅 $0.38 ($3.8万/月, -84.7%!) 🏆</text>

  <!-- Bottom Panel: End-to-End Financial Due Diligence DAG Pipeline -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端金融投研与并购尽调 (M&amp;A Due Diligence) 四阶无幻觉参考架构</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 规划器拆解研究树 (Planner DAG)</text>
  <text x="56" y="464" class="mono">• DeepSeek-R1 / o3 将母课题拆为</text>
  <text x="56" y="484" class="mono">  6~8 个正交子问题（营收拆解/</text>
  <text x="56" y="504" class="mono">  客户集中度/诉讼风险/同业估值）</text>
  <text x="56" y="524" class="mono">• 动态生成并行执行 DAG 图</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">拒绝单线程串行死等！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 8x 子 Agent 隔离窗口并发精读</text>
  <text x="332" y="464" class="mono">• 8 个轻量 8B/32B Worker 同时查</text>
  <text x="332" y="484" class="mono">  内网 VDR 虚拟数据室 + 外部财报</text>
  <text x="332" y="504" class="mono">• 原始 200 页 PDF 留在子窗口销毁</text>
  <text x="332" y="524" class="mono">• 仅向上汇总 &lt;600 Tok 结构化证据卡</text>
  <text x="332" y="550" class="txt" fill="#34d399">主规划器上下文永远干净清爽！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ Python 沙箱财务双账本验算</text>
  <text x="620" y="464" class="mono">• 严禁大模型心算加减乘除与 CAGR！</text>
  <text x="620" y="484" class="mono">• 所有财务表格抽取后强制交由</text>
  <text x="620" y="504" class="mono">  Python Pandas 沙箱核对勾稽关系：</text>
  <text x="620" y="524" class="mono">  `资产 = 负债 + 股东权益`</text>
  <text x="620" y="550" class="txt" fill="#fde68a">发现分项加总不平立即重抽原表！</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 单元格级溯源门禁 (Citation Gate)</text>
  <text x="908" y="464" class="mono">• 报告中出现的每一个财务数字必须</text>
  <text x="908" y="484" class="mono">  绑定 `[doc_id, page, bbox_cell]`</text>
  <text x="908" y="504" class="mono">• NLI 蕴含校验器逐句核对引用真伪</text>
  <text x="908" y="524" class="mono">• 悬空无出处数字 100% 标红拦截</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">满足投行合规部 100% 审计穿行测试</text>
</svg>
