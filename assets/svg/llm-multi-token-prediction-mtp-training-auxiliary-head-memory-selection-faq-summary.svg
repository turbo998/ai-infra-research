<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 280 · DEEPSEEK-V3 MULTI-TOKEN PREDICTION (MTP) TRAINING &amp; SELF-SPECULATION</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Naive D+1 Full Logits (39.8 GB OOM) vs. Causal MTP + Shared Head + Fused Linear-CE (0.3 GB, 2.45x Decode)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1: Naive Parallel Independent MTP Heads</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Materializes all D+1 = 4 full vocab logits in HBM:</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  4 × 32,768 × 151,936 × 2B = 39.8 GB Logits OOM!</text>
  <text x="85" y="305" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Non-causal parallel heads predict t_{i+2} without</text>
  <text x="85" y="333" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  knowing sampled t_{i+1} -&gt; 61.0% SpecDecode accept</text>
  <text x="85" y="370" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Separate Output Heads add +4.3B redundant params</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Peak Logits HBM: 39.8 GB (Instant S=32K OOM!)</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Self-Speculative Accept: 61.0% (1.48x Decode Speedup)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Causal MTP + Shared Head + Fused CE</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Sequential Causal MTP Module (1 Transformer Block):</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  [RMSNorm(h^{k-1}) ; RMSNorm(Emb(t_{i+k}))] -&gt; Linear</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Shared Embedding &amp; Output Head (0 extra vocab params)</text>
  <text x="640" y="340" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Liger Fused Linear-CE per depth k (0.3 GB peak HBM!)</text>
  <text x="640" y="375" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">• Native Self-Speculative Decoding (No external draft LLM)</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Peak Logits HBM: 0.3 GB (132.7x Lower!)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">Self-Speculative Accept: 88.5% (2.45x Decode Speedup!)</text>
