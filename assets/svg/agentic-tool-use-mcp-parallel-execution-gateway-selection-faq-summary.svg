  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么不要让大模型当“人肉 for 循环和 JSON 搬运工”？怎样守住 98% 的 Prefix Cache？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔄 铁律 1：将控制流 (`for/if/gather`) 与 JSON 过滤下沉到 CodeAct 沙箱</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 传统 JSON Tool Calling 每做一次循环或条件判断都要和 GPU 往返一轮，并把</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  几百 KB 的原始 API JSON 塞进上下文；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 让大模型写 1 段 Python/TS 脚本在沙箱内跑完并发调用与过滤，仅回传 400 词摘要！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">📌 铁律 2：按需延迟加载 (`tool_search`) + 外部等待期 KV 粘性驻留锁</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 严禁在工具列表前放动态秒级时间戳（会击穿整段 Prefix Cache）；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 通过 tool_search 将 Schema 门票从 65,000 词砍至 800 词，并在等待外部 API</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  返回的 500ms 内锁死会话 KV 块 (Pin TTL=5s)，实现 98.4% 缓存命中！</text>
</svg>
