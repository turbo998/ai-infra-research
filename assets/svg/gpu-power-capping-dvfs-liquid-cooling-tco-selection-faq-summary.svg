<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="24" font-weight="800">⚡ GPU 集群功耗封顶 (Power Capping)、阶段感知 DVFS 与液冷 TCO 选型一图流总结</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">1,024×H200 SXM 集群 · 1.20 MW 机房配电硬上限 · 3 年电费 TCO ($0.10/kWh) · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="980" y="42" width="268" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1114" y="66" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">Round 28 · Power &amp; Cooling TCO</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 默认 700W 满血 + 传统风冷</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">无封顶 · 风扇耗电 18% · PUE 1.48</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 混合算力吞吐保持: <tspan fill="#f8fafc" font-weight="700">100.0% (基线)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 千卡机房总功耗: <tspan fill="#f87171" font-weight="700">1.485 MW (超标 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 1.2MW 配电最多装机: <tspan fill="#f87171" font-weight="700">824 张 GPU (-200张)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 同步训练 di/dt 跳闸: <tspan fill="#f87171" font-weight="700">+28% 尖峰高危跳闸</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 3 年千卡总电费: <tspan fill="#f87171" font-weight="700">$3,902,544</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 架构师避坑铁律：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">1620→1980MHz 位于 CMOS VF 曲线陡峭</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">立方区 (P∝V²f)：多烧 +27% 电仅换来</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">+3.5% 吞吐，且 1.2MW 少装 200 张卡！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 静态 550W 封顶 + 封闭风道</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">nvidia-smi -pl 550 · PUE 1.35</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 混合算力吞吐保持: <tspan fill="#fbbf24" font-weight="700">96.6% (-3.4%)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 单卡功耗直降: <tspan fill="#34d399" font-weight="700">-21.4% (700W→550W)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 1.2MW 配电最多装机: <tspan fill="#34d399" font-weight="700">1,024 张 (满编装下)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 每焦耳能效比: <tspan fill="#34d399" font-weight="700">1.23x (+23%)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 3 年千卡总电费: <tspan fill="#fbbf24" font-weight="700">$2,930,208 (省 $972k)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">💡 零成本存量机房急救包：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">一行命令静态锁 550W：Prefill 仅慢</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">5.8%，Decode 仅慢 0.9%，立刻把千卡</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">功耗从 1.485MW 压进 1.115MW！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 算子阶段感知动态 DVFS</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">Prefill 650W / Decode 440W / 通信 350W</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 混合算力吞吐保持: <tspan fill="#34d399" font-weight="700">99.0% (仅损 1.0%)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 千卡机房总功耗: <tspan fill="#34d399" font-weight="700">0.942 MW (PUE 1.24)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 每焦耳能效比: <tspan fill="#60a5fa" font-weight="700">1.41x (+41%)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 同步 AllReduce 尖峰: <tspan fill="#34d399" font-weight="700">通信期降频至 1350MHz</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 3 年千卡总电费: <tspan fill="#60a5fa" font-weight="700">$2,475,571 (省 $1.43M)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">⚙️ 为什么 Decode 降频到 440W 不掉速？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">Decode 与 AllReduce 卡在 HBM/NVLink 带</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">宽而非 SM 算力！将 SM 锁频至 1450MHz</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">立省 37% 功率，HBM 带宽仍 100% 跑满！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 冷板液冷 DLC + PDU 超配 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">40°C 温水冷板 (PUE 1.11) + 动态超配</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 混合算力吞吐保持: <tspan fill="#34d399" font-weight="700">99.5% 🏆</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 千卡机房总功耗: <tspan fill="#34d399" font-weight="700">0.858 MW (-42.2% 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 1.2MW 配电最多装机: <tspan fill="#6ee7b7" font-weight="700">1,248 张 (+424张 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 1.2MW 集群总有效产出: <tspan fill="#6ee7b7" font-weight="700">121.3% (+40.8pt 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 3 年千卡总电费: <tspan fill="#34d399" font-weight="700">$2,254,810 (省 $1.65M)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 新建/扩容万卡集群终极答案：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">拆掉高耗电暴力风扇 + 40°C 冷板液冷 +</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">BBU 超级电容毫秒削峰，同样 1.2MW 机房</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">多装 +424 张 H200，3 年省电费 $165万！</text>
  </g>

  <!-- Bottom Left: VF Curve Scaling Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📉 H200 SXM 功耗封顶灵敏度曲线（CMOS P ∝ V²·f 边际收益递减铁律）</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">最后 150W (550W → 700W) 消耗了 27% 额外电力，却只换来 +5.8% Prefill 与 +0.9% Decode！</text>

    <!-- Table Header -->
    <rect x="20" y="68" width="560" height="28" rx="4" fill="#1e293b"/>
    <text x="32" y="86" fill="#cbd5e1" font-size="11.5" font-weight="700">功耗封顶 (Cap)</text>
    <text x="150" y="86" fill="#cbd5e1" font-size="11.5" font-weight="700">SM 频率</text>
    <text x="255" y="86" fill="#cbd5e1" font-size="11.5" font-weight="700">Prefill 算力</text>
    <text x="365" y="86" fill="#cbd5e1" font-size="11.5" font-weight="700">Decode 吞吐</text>
    <text x="475" y="86" fill="#cbd5e1" font-size="11.5" font-weight="700">每焦耳能效</text>

    <!-- Row 700W -->
    <text x="32" y="120" fill="#f87171" font-size="12" font-weight="700">700W (满血默认)</text>
    <text x="150" y="120" fill="#cbd5e1" font-size="12">1,980 MHz</text>
    <text x="255" y="120" fill="#cbd5e1" font-size="12">100.0%</text>
    <text x="365" y="120" fill="#cbd5e1" font-size="12">100.0%</text>
    <text x="475" y="120" fill="#f87171" font-size="12" font-weight="700">1.00x (最差)</text>

    <!-- Row 600W -->
    <text x="32" y="154" fill="#cbd5e1" font-size="12" font-weight="700">600W (-14.3%)</text>
    <text x="150" y="154" fill="#cbd5e1" font-size="12">1,815 MHz</text>
    <text x="255" y="154" fill="#cbd5e1" font-size="12">97.1%</text>
    <text x="365" y="154" fill="#34d399" font-size="12">99.6%</text>
    <text x="475" y="154" fill="#cbd5e1" font-size="12">1.15x</text>

    <!-- Row 550W -->
    <rect x="20" y="168" width="560" height="30" rx="4" fill="#064e3b" opacity="0.45"/>
    <text x="32" y="188" fill="#6ee7b7" font-size="12" font-weight="700">550W (-21.4% 甜点)</text>
    <text x="150" y="188" fill="#6ee7b7" font-size="12">1,710 MHz</text>
    <text x="255" y="188" fill="#6ee7b7" font-size="12" font-weight="700">94.2%</text>
    <text x="365" y="188" fill="#6ee7b7" font-size="12" font-weight="700">99.1%</text>
    <text x="475" y="188" fill="#34d399" font-size="12" font-weight="800">1.23x (+23%)</text>

    <!-- Row 450W -->
    <text x="32" y="222" fill="#60a5fa" font-size="12" font-weight="700">450W (Decode 专享)</text>
    <text x="150" y="222" fill="#cbd5e1" font-size="12">1,455 MHz</text>
    <text x="255" y="222" fill="#fbbf24" font-size="12">83.5%</text>
    <text x="365" y="222" fill="#34d399" font-size="12" font-weight="700">97.8% 🏆</text>
    <text x="475" y="222" fill="#60a5fa" font-size="12" font-weight="700">1.44x (+44%)</text>

    <!-- Row 350W -->
    <text x="32" y="256" fill="#cbd5e1" font-size="12" font-weight="700">350W (通信等待态)</text>
    <text x="150" y="256" fill="#cbd5e1" font-size="12">1,140 MHz</text>
    <text x="255" y="256" fill="#f87171" font-size="12">66.0%</text>
    <text x="365" y="256" fill="#cbd5e1" font-size="12">91.5%</text>
    <text x="475" y="256" fill="#34d399" font-size="12" font-weight="700">1.52x</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="32" y="298" fill="#fde68a" font-size="12" font-weight="700">🎯 黄金法则：PD 分离架构下，Prefill 池锁 600~650W，Decode 池锁 440W，白捡 37% 电费！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Tree & Checklist -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师机房配电、DVFS 与散热选型黄金法则</text>

    <rect x="20" y="48" width="540" height="74" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="70" fill="#fcd34d" font-size="13" font-weight="800">1️⃣ 存量风冷机房配电告急（单机柜 ≤ 20kW）→ 选 Tier 2/3 (550W + 阶段 DVFS)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 立即下发 DaemonSet 执行 `nvidia-smi -pl 550`（或 PD 分离下 Prefill 650W / Decode 440W）。</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">• 无需改造空调，千卡总功率从 1.485 MW 降至 0.94~1.11 MW，消除同步步进跳闸风险。</text>

    <rect x="20" y="132" width="540" height="74" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="154" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 高密 H200 / Blackwell GB200 新建集群 → 必选 Tier 4 (冷板液冷 DLC + PDU 超配)</text>
    <text x="34" y="174" fill="#cbd5e1" font-size="11.5">• 单柜 ≥40kW 超过空气比热容物理极限；40°C 温水直接冷板将 PUE 压至 1.11（风扇耗电归零）。</text>
    <text x="34" y="192" fill="#cbd5e1" font-size="11.5">• 配合机柜 BBU/超级电容毫秒削峰与 10ms 遥测封顶，1.2MW 配电可超配多装 +424 张 GPU！</text>

    <rect x="20" y="216" width="540" height="92" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="238" fill="#93c5fd" font-size="13" font-weight="800">3️⃣ 防范“千卡同步训练毫秒级 di/dt 谐振跳闸”三大铁律</text>
    <text x="34" y="258" fill="#cbd5e1" font-size="11.5">• 根因：1024 张卡同时结束 AllReduce 进入 GEMM 的 2ms 内，瞬态功率从 320kW 飙至 750kW+。</text>
    <text x="34" y="276" fill="#cbd5e1" font-size="11.5">• 对策：① 开启硬件级微秒封顶 (`nvmlDeviceSetPowerManagementLimit`)；② 通信期锁 SM 频下限</text>
    <text x="34" y="294" fill="#cbd5e1" font-size="11.5">  避免电压剧烈跌落；③ 机柜侧配置锂电 BBU 吸收 &lt;100ms 瞬态脉冲。</text>
  </g>
</svg>
