<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg19" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent19" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg19)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent19)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">金融政企机密计算与隐私合规大模型推理架构选型一图流 (Round 19 · GPU TEE)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">明文容器 (100% 内存暴露) vs. PII 脱敏网关 (18.5% 残余泄露) vs. 单卡 CC-On (+4.8% 损耗) vs. 多卡 PPCIE/Blackwell NVLink TEE (+6.2% 损耗)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: GPU TEE & Bounce Buffer Physics -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#6ee7b7" font-size="16" font-weight="800">① 为什么开启 GPU 机密计算 (CC-On) 跑 70B 仅慢 4.8%，跑 TP=8 却需要 PPCIE？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 明文容器 &amp; Tier 2 应用层 PII 脱敏网关的双重盲区</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• Tier 1 宿主机 Root / 云管 Hypervisor 可直接 dump 显存提取客户核心代码与微调权重</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• Tier 2 正则/NER 脱敏存在 18.5% 准标识符残余泄露，且破坏上下文导致推理准确率掉点 6.4%</text>

  <rect x="44" y="258" width="510" height="88" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="280" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 单卡 H100/H200 CC-On + CPU CVM: 70B 模型仅 +4.8% 延迟损耗！</text>
  <text x="58" y="302" fill="#d1fae5" font-size="12">• SWIOTLB Bounce Buffer 虽将 PCIe 加密带宽压至 11.8 GB/s (小模型 ResNet 慢 58.1%)</text>
  <text x="58" y="324" fill="#d1fae5" font-size="12">• 但 70B LLM 解码 99.8% 计算在 GPU HBM 受保护区 (CPR) 内完成，跨 PCIe 仅传几个字节 Token ID</text>

  <rect x="44" y="358" width="510" height="94" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="380" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 多卡 PPCIE + Blackwell NVLink-C2C/NVLink-5 硬件线速加密 (+6.2%)</text>
  <text x="58" y="402" fill="#f3e8ff" font-size="12">• ⚠️ 若用单卡 CC-On Bounce 模式硬跑 8 卡 TP=8，160 次 PCIe 软加密归约使 TPOT 暴涨至 42.60ms (+280%)</text>
  <text x="58" y="422" fill="#f3e8ff" font-size="12">• 开启 PPCIE (NVSwitch 机密域) 或 Blackwell 硬件内联加密，TP=8 TPOT 仅 11.90ms (+6.2%)！</text>

  <rect x="44" y="464" width="510" height="80" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="58" y="486" fill="#93c5fd" font-size="13" font-weight="700">🔐 远程证明闭环 (SPDM + NRAS): 先验真身、再发密钥</text>
  <text x="58" y="508" fill="#cbd5e1" font-size="12">• 容器启动时通过 DMTF SPDM 采集 CPU SEV-SNP/TDX 与 GPU 固件签名送交 NRAS 校验</text>
  <text x="58" y="528" fill="#cbd5e1" font-size="12">• 仅当硬件 TEE 度量值 100% 匹配时，KMS 才向飞地内存直接释放模型权重解密密钥</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档机密计算与隐私推理架构定量对比 (SLA TPOT &le; 15.0 ms)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">隐私与机密计算架构档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">解码 TPOT (开销)</text>
  <text x="952" y="190" fill="#cbd5e1" font-size="12" font-weight="700">泄露率 / 精度</text>
  <text x="1060" y="190" fill="#cbd5e1" font-size="12" font-weight="700">百万Token / 合规</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: 标准明文 GPU 容器</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">仅 TLS 传输加密 · 显存/权重完全裸奔</text>
  <text x="828" y="236" fill="#f8fafc" font-size="12" font-weight="700">11.20 ms (0.0%)</text>
  <text x="828" y="256" fill="#cbd5e1" font-size="11">PCIe 52.0 GB/s</text>
  <text x="952" y="236" fill="#f87171" font-size="12" font-weight="700">100% 暴露 ✕</text>
  <text x="952" y="256" fill="#cbd5e1" font-size="11">精度 100.0%</text>
  <text x="1060" y="236" fill="#fca5a5" font-size="12" font-weight="700">$0.96 / 1M</text>
  <text x="1060" y="256" fill="#fca5a5" font-size="11">禁入涉密云 ✕</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: 应用层 PII 脱敏代理网关</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">正则/NER 替换 · 语义破损 + 权重裸奔</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">11.80 ms (+5.4%)</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">网关 +14.5ms TTFT</text>
  <text x="952" y="312" fill="#fde047" font-size="12" font-weight="700">18.5% 残余泄露</text>
  <text x="952" y="332" fill="#fca5a5" font-size="11">精度 93.6% (-6.4%)</text>
  <text x="1060" y="312" fill="#fde047" font-size="12" font-weight="700">$1.08 / 1M</text>
  <text x="1060" y="332" fill="#fde047" font-size="11">合规存疑 ⚠️</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: 单卡 CC-On + CPU CVM TEE</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">SEV-SNP/TDX + H100/H200 CPR (TP=1 &le;70B)</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">11.74 ms (+4.8%)</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">Bounce 11.8 GB/s</text>
  <text x="952" y="388" fill="#34d399" font-size="12" font-weight="700">0.0% 泄露 ✅</text>
  <text x="952" y="408" fill="#6ee7b7" font-size="11">精度 100.0% ✅</text>
  <text x="1060" y="388" fill="#6ee7b7" font-size="12" font-weight="700">$1.06 / 1M</text>
  <text x="1060" y="408" fill="#6ee7b7" font-size="11">单卡过检 ✅</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: 多卡 PPCIE + Blackwell TEE</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">8 卡 NVSwitch 机密域 / NVLink 硬件内联加密</text>
  <text x="828" y="464" fill="#e9d5ff" font-size="12" font-weight="700">11.90 ms (+6.2%)</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">(免除 42.6ms 悬崖)</text>
  <text x="952" y="464" fill="#34d399" font-size="12" font-weight="700">0.0% 泄露 🏆</text>
  <text x="952" y="484" fill="#34d399" font-size="11" font-weight="700">精度 100.0% 🏆</text>
  <text x="1060" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">$1.12 / 1M</text>
  <text x="1060" y="484" fill="#34d399" font-size="11" font-weight="700">多卡过检 🏆</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 核心洞察：大模型解码是显存内部带宽受限而非 PCIe 受限，硬件 TEE 仅需 ~5%~6% 性能代价即可换取零泄露！</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#10b981"/>
  <text x="44" y="606" fill="#6ee7b7" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for Regulated Confidential AI）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fca5a5">淘汰伤精度且漏数据的正则脱敏网关 (Tier 2)</tspan>；<tspan font-weight="700" fill="#6ee7b7">&le;70B 单卡模型直接开启 H100/H200 CC-On (Tier 3)</tspan>，仅 +4.8% 损耗。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">405B/671B 多卡 TP=8 机密推理必开 PPCIE 或 Blackwell TEE-I/O (Tier 4)</tspan>，避开 CPU Bounce Buffer +280% 减速陷阱。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/confidential_ai_tee_selection/results.json · tests/test_confidential_ai_tee_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
