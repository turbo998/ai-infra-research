<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#521 企业医疗诊室实时听写与电子病历生成 (`Ambient Clinical Scribe · HL7 FHIR R4`) 算卡指南</text>
  <text x="30" y="60" class="sub">解决药名同音误识、ICD-10 编码幻觉与患者隐私不出院红线 · 仅用 8 张 H200 支撑 2,000 名医生 (准确率 97.4% · 省 85.1% 成本)</text>

  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么通用语音+大模型写病历会出现 25.5% 药名/编码幻觉？</text>
  <text x="48" y="132" class="txt bad">• 痛点 1 (生僻药名同音误识): 通用 ASR 把化学药名/剂量听错，下游 LLM</text>
  <text x="64" y="150" class="txt bad">自由发挥编造不存在的 ICD-10 诊断码 (准确率仅 74.5% ✕)，医生改稿比手写还慢</text>
  <text x="48" y="174" class="txt warn">• 痛点 2 (按席位 SaaS 昂贵且合规难): 2,000 名医生年费高达 $144.0 万 ($60/人/月)</text>
  <text x="48" y="198" class="txt good">• 院内机密医疗 AI 黄金四件套 (准确率 97.4% · 1.6s 出病历 🏆):</text>
  <text x="64" y="218" class="txt">① 科室药典偏置流式 ASR (Contextual Biasing Trie): 药品/术式识别率 &gt;99%</text>
  <text x="64" y="238" class="txt">② 24 专科 S-LoRA 共池 + XGrammar 100% 强制遵循 HL7 FHIR R4 病历结构</text>
  <text x="64" y="258" class="txt good">③ 候选诊断后置绑定院内标准 ICD-10 / SNOMED 字典 (零虚构编码！🏆)</text>

  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 2,000 名临床医生诊室听写三套架构选型对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (通用公有云 API / 商业按席位 SaaS): 编码准确率 74.5% ✕</text>
  <text x="594" y="152" class="txt bad">FHIR 校验通过率 89.2%，2,000 名医生年费高达 $144.0 万/年 ✕</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (院内无约束 70B 大模型 + 报错重试): 准确率 82.0%，</text>
  <text x="594" y="198" class="txt warn">生成耗时 6.8s，需配 16 张 H200 ($42.8 万/年)</text>
  <text x="578" y="224" class="txt good">• 方案 3 (院内机密 H200 + 药典 ASR + 24 专科 S-LoRA + XGrammar FHIR 🏆):</text>
  <text x="594" y="246" class="txt good">- ICD-10 / 医嘱准确率: 97.4% (+22.9 pts 🏆) · FHIR 结构合规率 100.0%</text>
  <text x="594" y="268" class="txt good">- 出稿耗时 1.6s (快 5.25x 🏆) · 仅需 8 张 H200 ($21.4万/年，省 85.1% 🏆)</text>

  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 2,000 名医生规模下的 ICD-10 诊断/医嘱准确率与年化总成本对比</text>

  <text x="48" y="378" class="txt">方案 1: 通用云 API / 按席位 SaaS</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">$144.0万/年 | ICD-10 准确率仅 74.5% · 耗时 8.4s ✕</text>

  <text x="48" y="418" class="txt">方案 2: 院内无约束 70B (16 GPUs)</text>
  <rect x="305" y="404" width="142" height="16" fill="#f59e0b" rx="4"/>
  <text x="457" y="418" class="txt warn">$42.8万/年 | ICD-10 准确率 82.0% · 耗时 6.8s</text>

  <text x="48" y="458" class="txt good">方案 3: 院内 S-LoRA+XGrammar+字典锚定 🏆</text>
  <rect x="305" y="444" width="71" height="16" fill="#10b981" rx="4"/>
  <text x="386" y="458" class="txt good">$21.4万/年 (仅 8 张 H200 · 立省 85.1% 🏆) | 准确率 97.4% · 1.6s 秒出病历 🏆</text>
</svg>
