<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad75" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad75" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad75)" rx="16"/>
  <rect x="24" y="20" width="1232" height="86" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="54" fill="url(#accentGrad75)" font-size="22" font-weight="800">Round 75 · 万卡 AI 智算集群 RDMA 网络拓扑 (Rail-Optimized + PXN vs 胖树 vs OCS) 选型一图流</text>
  <text x="44" y="84" fill="#94A3B8" font-size="14">4,096 卡 (512 节点 × 8×400G RDMA · 单节点线速 400 GB/s) · 同号网卡聚合 Rail + NCCL PXN + 3D MEMS OCS (independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <g transform="translate(24, 124)">
    <!-- Tier 1 -->
    <rect x="0" y="0" width="296" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FCA5A5" font-size="15" font-weight="700">Tier 1 · 2:1 超订传统云 Spine-Leaf ✕</text>
    <text x="16" y="56" fill="#CBD5E1" font-size="12.5">上行带宽砍半 · ECMP 碰撞与 PFC 拥塞</text>
    <line x1="16" y1="70" x2="280" y2="70" stroke="#334155"/>
    <text x="16" y="98" fill="#94A3B8" font-size="12">单机有效集合带宽：</text>
    <text x="165" y="98" fill="#EF4444" font-size="15" font-weight="800">154.0 GB/s (38.5% ✕)</text>
    <text x="16" y="128" fill="#94A3B8" font-size="12">典型交换延迟：</text>
    <text x="165" y="128" fill="#FCA5A5" font-size="14" font-weight="700">14.5 µs (拥塞排队)</text>
    <text x="16" y="158" fill="#94A3B8" font-size="12">高速光模块总数：</text>
    <text x="165" y="158" fill="#FCA5A5" font-size="14" font-weight="700">6,144 个 · 0.68 MW</text>
    <text x="16" y="188" fill="#94A3B8" font-size="12">4096卡训练 MFU：</text>
    <text x="165" y="188" fill="#EF4444" font-size="15" font-weight="800">34.2% (算力空转 ✕)</text>
    <text x="16" y="218" fill="#94A3B8" font-size="12">网络硬件 CAPEX：</text>
    <text x="165" y="218" fill="#FCA5A5" font-size="14" font-weight="700">$9,200,000 (拖垮GPU)</text>
    <rect x="16" y="244" width="264" height="48" rx="8" fill="#2D1622"/>
    <text x="26" y="264" fill="#FDA4AF" font-size="11.5" font-weight="600">痛点：省了交换机却让价值上亿美元的 GPU</text>
    <text x="26" y="282" fill="#FDA4AF" font-size="11.5">卡死在 2:1 上行瓶颈，年损超 $1,400 万！</text>

    <!-- Tier 2 -->
    <rect x="312" y="0" width="296" height="310" rx="12" fill="#1E2230" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="328" y="32" fill="#FCD34D" font-size="15" font-weight="700">Tier 2 · 标准 1:1 三层胖树 ✕</text>
    <text x="328" y="56" fill="#CBD5E1" font-size="12.5">同机 8 网卡插同一 ToR · 必走 5 跳</text>
    <line x1="328" y1="70" x2="592" y2="70" stroke="#334155"/>
    <text x="328" y="98" fill="#94A3B8" font-size="12">单机有效集合带宽：</text>
    <text x="477" y="98" fill="#FCD34D" font-size="14" font-weight="700">336.0 GB/s (84.0%)</text>
    <text x="328" y="128" fill="#94A3B8" font-size="12">典型交换延迟：</text>
    <text x="477" y="128" fill="#FBBF24" font-size="14" font-weight="700">3.8 µs (5跳绕行 ✕)</text>
    <text x="328" y="158" fill="#94A3B8" font-size="12">高速光模块总数：</text>
    <text x="477" y="158" fill="#EF4444" font-size="14" font-weight="800">12,288 个 · 1.42 MW ✕</text>
    <text x="328" y="188" fill="#94A3B8" font-size="12">4096卡训练 MFU：</text>
    <text x="477" y="188" fill="#FCD34D" font-size="14" font-weight="700">52.8%</text>
    <text x="328" y="218" fill="#94A3B8" font-size="12">网络硬件 CAPEX：</text>
    <text x="477" y="218" fill="#EF4444" font-size="14" font-weight="800">$18,400,000 (极贵 ✕)</text>
    <rect x="328" y="244" width="264" height="48" rx="8" fill="#2E2418"/>
    <text x="338" y="264" fill="#FDE68A" font-size="11.5" font-weight="600">痛点：节点对齐插线迫使跨柜流量全爬三层</text>
    <text x="338" y="282" fill="#FDE68A" font-size="11.5">Core 交换机，多买 4,096 个昂贵光模块！</text>

    <!-- Tier 3 -->
    <rect x="624" y="0" width="296" height="310" rx="12" fill="#132A3E" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="640" y="32" fill="#7DD3FC" font-size="15" font-weight="700">Tier 3 · 轨优化胖树 + NCCL PXN ✅</text>
    <text x="640" y="56" fill="#CBD5E1" font-size="12.5">同号网卡插同 Rail + 机内 NVSwitch 换轨</text>
    <line x1="640" y1="70" x2="904" y2="70" stroke="#334155"/>
    <text x="640" y="98" fill="#94A3B8" font-size="12">单机有效集合带宽：</text>
    <text x="789" y="98" fill="#38BDF8" font-size="15" font-weight="800">369.6 GB/s (92.4% ✅)</text>
    <text x="640" y="128" fill="#94A3B8" font-size="12">典型交换延迟：</text>
    <text x="789" y="128" fill="#7DD3FC" font-size="14" font-weight="700">1.1 µs (1跳直达 ✅)</text>
    <text x="640" y="158" fill="#94A3B8" font-size="12">高速光模块总数：</text>
    <text x="789" y="158" fill="#38BDF8" font-size="14" font-weight="700">8,192 个 · 0.96 MW</text>
    <text x="640" y="188" fill="#94A3B8" font-size="12">4096卡训练 MFU：</text>
    <text x="789" y="188" fill="#38BDF8" font-size="14" font-weight="700">56.9% ✅</text>
    <text x="640" y="218" fill="#94A3B8" font-size="12">网络硬件 CAPEX：</text>
    <text x="789" y="218" fill="#38BDF8" font-size="14" font-weight="800">$12,600,000 (省$5.8M)</text>
    <rect x="640" y="244" width="264" height="48" rx="8" fill="#0C2238"/>
    <text x="650" y="264" fill="#BAE6FD" font-size="11.5" font-weight="600">优势：PXN 用机内 900GB/s NVSwitch 先换</text>
    <text x="650" y="282" fill="#BAE6FD" font-size="11.5">轨再出网卡，将跨轨 5 跳变 1 跳直达！</text>

    <!-- Tier 4 -->
    <rect x="936" y="0" width="296" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.2"/>
    <text x="952" y="32" fill="#6EE7B7" font-size="15" font-weight="800">Tier 4 · 轨优化 + OCS 动态光脊 🏆</text>
    <text x="952" y="56" fill="#D1FAE5" font-size="12.5">高基数 Rail + 3D MEMS OCS / Dragonfly+</text>
    <line x1="952" y1="70" x2="1216" y2="70" stroke="#334155"/>
    <text x="952" y="98" fill="#A7F3D0" font-size="12">单机有效集合带宽：</text>
    <text x="1101" y="98" fill="#34D399" font-size="15" font-weight="800">383.2 GB/s (95.8% 🏆)</text>
    <text x="952" y="128" fill="#A7F3D0" font-size="12">典型交换延迟：</text>
    <text x="1101" y="128" fill="#34D399" font-size="15" font-weight="800">0.85 µs (全光直通 🏆)</text>
    <text x="952" y="158" fill="#A7F3D0" font-size="12">高速光模块总数：</text>
    <text x="1101" y="158" fill="#6EE7B7" font-size="14" font-weight="800">6,656 个 · 0.76 MW 🏆</text>
    <text x="952" y="188" fill="#A7F3D0" font-size="12">4096卡训练 MFU：</text>
    <text x="1101" y="188" fill="#34D399" font-size="15" font-weight="800">58.4% (+24.2pt 🏆)</text>
    <text x="952" y="218" fill="#A7F3D0" font-size="12">网络硬件 CAPEX：</text>
    <text x="1101" y="218" fill="#6EE7B7" font-size="13.5" font-weight="800">$10,600,000 (省$7.8M)</text>
    <rect x="952" y="244" width="264" height="48" rx="8" fill="#062019"/>
    <text x="962" y="264" fill="#A7F3D0" font-size="11.5" font-weight="700">终极形态：消灭顶层 O-E-O 有源光模块，</text>
    <text x="962" y="282" fill="#A7F3D0" font-size="11.5">省电 46.5% + 15ms 拓扑重构与坏件绕行</text>
  </g>

  <!-- Bottom Visual Comparison -->
  <rect x="24" y="454" width="1232" height="302" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="486" fill="#F8FAFC" font-size="16" font-weight="700">核心定量洞察：单节点有效集合通信带宽 (满分 400 GB/s) &amp; NCCL PXN 机内换轨 1 跳直达原理</text>

  <!-- Left Bar Chart -->
  <g transform="translate(44, 508)">
    <text x="0" y="20" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 1 2:1 超订传统云 Spine-Leaf (154.0 GB/s · 38.5% 线速 · 训练 MFU 跌至 34.2% ✕)</text>
    <rect x="0" y="28" width="215" height="22" rx="4" fill="#EF4444"/>

    <text x="0" y="76" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 2 标准 1:1 三层胖树 (336.0 GB/s · 84.0% 线速 · 需 12,288 个光模块耗资 $18.4M ✕)</text>
    <rect x="0" y="84" width="470" height="22" rx="4" fill="#F59E0B"/>

    <text x="0" y="132" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 3 轨优化胖树 + NCCL PXN (369.6 GB/s · 92.4% 线速 · 1跳直达 · 立省 $5.8M ✅)</text>
    <rect x="0" y="140" width="517" height="22" rx="4" fill="#38BDF8"/>

    <text x="0" y="188" fill="#6EE7B7" font-size="12.5" font-weight="700">Tier 4 轨优化 + 3D MEMS OCS 动态光脊 (383.2 GB/s · 95.8% 线速 · 省电 46.5% · 省 $7.8M 🏆)</text>
    <rect x="0" y="196" width="536" height="22" rx="4" fill="#10B981"/>
  </g>

  <!-- Right Architecture Box -->
  <g transform="translate(650, 504)">
    <rect x="0" y="0" width="584" height="232" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="18" y="28" fill="#38BDF8" font-size="14" font-weight="700">第一性原理：为什么插网线改成“同号网卡聚合成 Rail”能省 $5.8M~$7.8M？</text>
    <text x="18" y="56" fill="#E2E8F0" font-size="12.5">① 同轨流量天然 1 跳闭环 (Data Parallel AllReduce)：</text>
    <text x="32" y="76" fill="#94A3B8" font-size="12">64 台机器的 GPU 0 全部插在 Rail-0 交换机上，做 DP 梯度同步时 100% 在底层交换机</text>
    <text x="32" y="94" fill="#94A3B8" font-size="12">内部 1 跳完成，压根不需要往上走 Spine/Core 层！</text>
    <text x="18" y="124" fill="#6EE7B7" font-size="12.5">② 异轨流量由 NCCL PXN 借道机内 NVSwitch 变同轨 1 跳：</text>
    <text x="32" y="144" fill="#94A3B8" font-size="12">Node A 的 GPU 0 要发给 Node B 的 GPU 3 时，先走本机 900GB/s NVSwitch 传给本机</text>
    <text x="32" y="162" fill="#94A3B8" font-size="12">NIC 3，再经 Rail-3 交换机 1 跳直达 Node B，砍掉顶层 Core 交换机与 4,096 个光模块！</text>
    <text x="18" y="192" fill="#FCD34D" font-size="12.5">③ 3D MEMS OCS 无源微镜反射 (省电 46.5% · 15ms 坏件热绕行)：</text>
    <text x="32" y="212" fill="#94A3B8" font-size="12">顶层全光直通免除 O-E-O 转换，兼容未来 800G/1.6T 平滑演进！</text>
  </g>
</svg>
