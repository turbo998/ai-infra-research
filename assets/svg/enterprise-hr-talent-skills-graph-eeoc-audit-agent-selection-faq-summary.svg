  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级 HR 人才技能图谱、智能招聘与合规审计选型：Workday/Eightfold vs. 盲审技能本体 + EEOC 门禁 (#443)</text>
  <text x="28" y="58" class="sub">为什么把原始简历直接喂给大模型打分会触犯 NYC Local Law 144 / EU AI Act 高风险红线？如何用“盲审脱敏 + ESCO 技能图谱”双赢？</text>

  <!-- Left Panel: Unmasked LLM Resume Scoring Bias vs Blind PII Masking + ESCO Skills Graph -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. AI 招聘合规红线：未脱敏简历隐性歧视 vs. 零人口学特征盲审技能图谱</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 失败做法：把包含姓名/性别/毕业年份/社团的原始 PDF 直接喂给大模型排序</text>
  <text x="56" y="164" class="mono">• 隐性人口学偏见：相同履历仅更换男女/族裔姓名，大模型通过率差异高达 14.8% ✕</text>
  <text x="56" y="184" class="mono">• 法律巨额罚单：违反欧盟 AI 法案 (高风险系统) 与纽约 AEDT 法案 4/5 公平性法则 ✕</text>
  <text x="56" y="202" class="txt">• 传统 ATS 关键词漏筛：写“精通 K8s”的候选人因没写全称“Kubernetes”被机械淘汰！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：前置盲审脱敏 + ESCO/O*NET 技能本体对齐 + 证据锚定可解释评分</text>
  <text x="56" y="272" class="mono">• 1. 解析入库瞬间剥离姓名、性别、照片、年龄、邮编与学校头衔，生成盲审简历 JSON</text>
  <text x="56" y="292" class="mono">• 2. 将项目经历映射至 13,800 个标准 ESCO 技能节点与熟练度证据链 (带原文引用)</text>
  <text x="56" y="312" class="txt">• 3. 自动计算不同群体入选率比值 (Impact Ratio &gt;= 0.96 &gt; 0.80 法定红线)，100% 过审！</text>

  <!-- Right Panel: 4 Enterprise HR Talent & Recruiting AI Architectures -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业人才寻访与智能内推方案对标 (50万份简历/年 · 15,000员工)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fde68a">Tier 1: 传统 ATS 布尔关键词精确匹配 + HR 人工海选简历</text>
  <text x="638" y="158" class="mono">• 优质候选人召回率仅 52.0% ✕ (同义词漏筛) | 招聘周期 48 天 | $82,000/月</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fca5a5">Tier 2: 未脱敏原始简历直接喂给大模型打分排序 (Unmasked Raw LLM)</text>
  <text x="638" y="214" class="mono">• 公平性比值 (Impact Ratio) 仅 0.71 ✕ (&lt;0.80 违法红线!) | 无客观评分依据</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 商业人才智能套件 (Eightfold AI / Workday Skills Cloud / Phenom)</text>
  <text x="638" y="270" class="mono">• 技能召回率 89.5% ✓ | 内置合规报表 | 1.5万人按席位订阅高达 $112,000/月</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 盲审 PII 剥离 + ESCO 技能图谱 + 证据矩阵 + EEOC 4/5 审计门禁 (🏆旗舰)</text>
  <text x="638" y="326" class="mono">• 候选人召回率 94.2% 🏆 | 公平性比值 0.96 🏆 | 招聘周期缩至 16 天 | 仅 $14,200/月!</text>

  <!-- Bottom Panel: End-to-End Blind Skills Graph & EEOC Compliance Pipeline -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端“盲审脱敏 -> ESCO 技能图谱对齐 -> 证据矩阵评分 -> EEOC 4/5 公平性审计”架构</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 零人口学盲审闸门 (Blind Gate)</text>
  <text x="56" y="464" class="mono">• MinerU/Docling 解析多栏 PDF 简历</text>
  <text x="56" y="484" class="mono">• Presidio 彻底剥离姓名、性别、年龄</text>
  <text x="56" y="504" class="mono">  照片、婚姻状况与毕业年份</text>
  <text x="56" y="524" class="mono">• 只向后续模型暴露纯工作交付与成果</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">从源头物理切断人口统计学偏见输入！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
