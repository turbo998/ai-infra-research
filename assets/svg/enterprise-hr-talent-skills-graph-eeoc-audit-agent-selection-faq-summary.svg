  <text x="332" y="464" class="mono">• 将非标描述（“搭建日活千万的</text>
  <text x="332" y="484" class="mono">  Flink 实时风控流”）归一化映射至</text>
  <text x="332" y="504" class="mono">  标准技能树节点 + 邻接可迁移技能</text>
  <text x="332" y="524" class="mono">• 区分“仅提及名词”与“主导生产落地”</text>
  <text x="332" y="550" class="txt" fill="#34d399">消除传统 ATS 关键词漏筛，召回 94.2%！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 岗位胜任力二元证据矩阵</text>
  <text x="620" y="464" class="mono">• 严禁打模糊印象分！</text>
  <text x="620" y="484" class="mono">• 按 JD 拆解 5 项硬性技能要求，逐项</text>
  <text x="620" y="504" class="mono">  提取简历原文证据句与工作年限</text>
  <text x="620" y="524" class="mono">• 自动生成面试官针对性追问题单</text>
  <text x="620" y="550" class="txt" fill="#fde68a">HR 与业务面试官一眼看清匹配依据！</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ EEOC 4/5 法则持续审计与内推</text>
  <text x="908" y="464" class="mono">• 独立合规沙箱实时监测各群体通过率</text>
  <text x="908" y="484" class="mono">  `SR_min / SR_max = 0.96 (&gt;= 0.80)`</text>
  <text x="908" y="504" class="mono">• 同步扫描内部 1.5 万员工技能图谱</text>
  <text x="908" y="524" class="mono">  优先推荐内部活水转岗候选人</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">满足 EU AI Act / NYC LL144 强制审计！</text>
