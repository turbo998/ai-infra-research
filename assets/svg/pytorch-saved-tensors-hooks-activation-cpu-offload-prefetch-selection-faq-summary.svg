<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 249 · PYTORCH SAVED_TENSORS_HOOKS (SAVE_ON_CPU): UNPACK_HOOK STALL VS LOOKAHEAD PREFETCH FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">Activation CPU Offload: 3,420ms `save_on_cpu` Stall vs 1,125ms Lookahead Prefetch (3.04x Faster)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Reactive `unpack_hook` &amp; Weight Offload</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`save_on_cpu` default): C++ Autograd calls `unpack_hook`</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  at the exact moment the backward op runs — 0% PCIe overlap! Plus</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  it mistakenly offloads `nn.Parameter` weight views (3,420 ms)! ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: Offloading all 12 intra-layer tensors saturates PCIe ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Step Time: 3,420 ms (3.14x Slowdown!) | PCIe Overlap: 0.0% ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Reactive `unpack_hook` Turns Every Backward Op Into a PCIe Wait Barrier</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Boundary-Only Offload + Lookahead Prefetch</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Combines Activation Checkpointing with CPU Offload: offloads ONLY</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  the single layer input `h_in [B, S, D]` (10x less PCIe traffic!)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Backward hook on Layer `L+1` prefetches `h_in` for Layer `L`</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  ahead of time on `stream_h2d` so `unpack_hook` returns in 0.02 ms!</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Step Time: 1,125 ms (3.04x Faster, 98.5% Overlap) | -32 GB HBM 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Saves 32 GB Activation HBM with Only 3.2% Overhead Over Zero-Offload</text>
</svg>
