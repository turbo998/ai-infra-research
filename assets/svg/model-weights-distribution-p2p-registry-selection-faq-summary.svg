<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg20" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent20" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg20)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent20)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">千卡集群百 GB 大模型权重与镜像极速分发选型一图流 (Round 20 · 512×H100 · 156GB/节点)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">中心 Registry 直拉 (2,180s) vs. 分片 CDN (440s) vs. Dragonfly P2P 树 (42.0s, 51.9x) vs. RDMA GDS + NCCL 环广播 (4.20s, 519x, -99.8% 空转)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#06b6d4"/>
  <text x="1044" y="56" fill="#67e8f9" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Stampede Physics & P2P / RDMA Ring -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#67e8f9" font-size="16" font-weight="800">① 为什么 64 节点同时拉取 140GB 模型会让 Harbor/S3 瘫痪 36 分钟？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 中心 Registry 惊群雪崩: 64 × 156GB = 9,984 GB (80 Tbps 挤爆网关)</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 64 台 H100 节点同时拉取 156GB，挤爆 40Gbps 中心网关，单次发布耗时 2,180s (36.3 分钟)</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 每日 12 次弹性扩容/RLHF 权重发布导致 512 张 GPU 每天空转 7.3 小时，月烧 $279,040！</text>

  <rect x="44" y="258" width="510" height="84" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="280" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 云原生 TCP 网络首选: CNCF Dragonfly / Kraken P2P 分片树 (42.0 s)</text>
  <text x="58" y="302" fill="#d1fae5" font-size="12">• 将 140GB Safetensors 切成 16MB 块，源站仅吐出 1 份数据 (156GB，回源流量锐减 98.4%!)</text>
  <text x="58" y="324" fill="#d1fae5" font-size="12">• 64 节点在 Leaf-Spine 内网互传分片，分发时间压至 42.0s (快 51.9x)，月空转省 98.1%</text>

  <rect x="44" y="354" width="510" height="96" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="376" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 RDMA 智算集群终局: GDS + Mooncake/NCCL 400G 环形广播 (4.20 s)</text>
  <text x="58" y="398" fill="#f3e8ff" font-size="12">• Seed 节点通过 GPUDirect Storage (GDS) 零 CPU 拷贝读入 140GB 权重至 HBM</text>
  <text x="58" y="418" fill="#f3e8ff" font-size="12">• 利用后端 400Gbps RoCEv2/IB 计算网执行 O(1) 流水线 Ring Broadcast (有效 45.0 GB/s)</text>
  <text x="58" y="438" fill="#f3e8ff" font-size="12">• 64 节点全集群就绪仅需 4.20 秒 (提速 519.05x)，月度 GPU 空转浪费从 $279k 压至 $538!</text>

  <rect x="44" y="462" width="510" height="82" rx="8" fill="#1e293b" stroke="#06b6d4"/>
  <text x="58" y="484" fill="#67e8f9" font-size="13" font-weight="700">📦 架构师黄金设计：代码镜像 (&lt;16GB) 走 Dragonfly，百 GB 权重走 RDMA 广播</text>
  <text x="58" y="506" fill="#cbd5e1" font-size="12">• 严禁把 140GB 模型权重塞进 Docker tar.gz 层 (触发单线程 gzip 解压与磁盘双写灾难)</text>
  <text x="58" y="526" fill="#cbd5e1" font-size="12">• 镜像与权重彻底解耦：容器秒级启动后通过 Mooncake RDMA P2P 从邻居节点显存直拉权重</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档百 GB 权重分发架构定量对比 (64 节点 × 156GB = 9,984 GB)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">权重与镜像分发架构档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">源站回源流量</text>
  <text x="945" y="190" fill="#cbd5e1" font-size="12" font-weight="700">64 节点耗时</text>
  <text x="1055" y="190" fill="#cbd5e1" font-size="12" font-weight="700">月度 GPU 空转浪费</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: 中心 OCI / S3 直拉</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">40Gbps 共享出口 · TCP 503 重试风暴</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">9,984.0 GB</text>
  <text x="828" y="256" fill="#fca5a5" font-size="11">0.0% 削减 ✕</text>
  <text x="945" y="236" fill="#fca5a5" font-size="12" font-weight="700">2,180.0 s ✕</text>
  <text x="945" y="256" fill="#cbd5e1" font-size="11">(36.3 分钟)</text>
  <text x="1055" y="236" fill="#fca5a5" font-size="12" font-weight="700">$279,040 / 月</text>
  <text x="1055" y="256" fill="#94a3b8" font-size="11">基准线 (1.0x)</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: 多副本 Registry + 对象 CDN</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">200Gbps 聚合出口 · 仍为 O(N) 线性瓶颈</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">9,984.0 GB</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">0.0% 削减</text>
  <text x="945" y="312" fill="#fde047" font-size="12" font-weight="700">440.0 s ✕</text>
  <text x="945" y="332" fill="#cbd5e1" font-size="11">(4.95x 提速)</text>
  <text x="1055" y="312" fill="#fde047" font-size="12" font-weight="700">$56,320 / 月</text>
  <text x="1055" y="332" fill="#cbd5e1" font-size="11">省 79.8%</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: Dragonfly / Kraken P2P 树</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">TCP 分片对等分发 + Nydus/SOCI 按需挂载</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">156.0 GB ✅</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">-98.4% 回源!</text>
  <text x="945" y="388" fill="#6ee7b7" font-size="12" font-weight="700">42.0 s</text>
  <text x="945" y="408" fill="#6ee7b7" font-size="11">(51.9x 提速)</text>
  <text x="1055" y="388" fill="#6ee7b7" font-size="12" font-weight="700">$5,376 / 月</text>
  <text x="1055" y="408" fill="#6ee7b7" font-size="11">省 98.1%</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: RDMA GDS + NCCL 环广播</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">400G RoCEv2/IB 显存直通 O(1) 流水广播</text>
  <text x="828" y="464" fill="#34d399" font-size="12" font-weight="700">156.0 GB 🏆</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">-98.4% 回源!</text>
  <text x="945" y="464" fill="#e9d5ff" font-size="12" font-weight="700">4.20 s 🏆</text>
  <text x="945" y="484" fill="#34d399" font-size="11" font-weight="700">(519.05x ✅)</text>
  <text x="1055" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">仅 $538 / 月</text>
  <text x="1055" y="484" fill="#34d399" font-size="11" font-weight="700">省 99.8% ($278.5k)</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 256 节点 (2,048 卡) 扩展：中心直拉需 2.4 小时 (8,720s)，RDMA Ring 广播仅需 5.10 秒 (快 1,709x)!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#06b6d4"/>
  <text x="44" y="606" fill="#67e8f9" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for 100GB+ Model Weight Distribution）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#6ee7b7">通用云 K8s 集群容器镜像与权重分发必上 Tier 3 (CNCF Dragonfly / Kraken P2P + Nydus)</tspan>：回源流量砍 98.4%，提速 51.9x。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">具备 RoCEv2/IB 的智算集群百 GB 权重热加载必上 Tier 4 (GDS + Mooncake/NCCL RDMA 环广播)</tspan>：4.2 秒全集群就绪，月省 $27.8 万。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/model_weight_p2p_distribution_selection/results.json · tests/test_model_weight_p2p_distribution_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
