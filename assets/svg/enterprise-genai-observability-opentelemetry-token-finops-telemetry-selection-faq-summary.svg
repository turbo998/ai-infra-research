<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业大模型全栈可观测性 (OpenTelemetry GenAI) 与 Token 级 FinOps 成本分摊选型 (#483)</text>
  <text x="28" y="58" class="sub">打破“传统 APM 看不清流式首字/吐字卡顿”与“全量采集 32K 明文 Prompt 导致月烧 $6.85万 日志账单”的两难困局</text>

  <!-- Left Panel: Why Legacy APM & Naive Full-Prompt Logging Both Fail -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么传统微服务 APM 监控不了大模型，而全量打日志又会买穿存储？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 两个常见反模式：HTTP 整包耗时失明 vs. 100% 明文 Prompt 同步写盘</text>
  <text x="56" y="164" class="mono">• 反模式 1 (传统 APM): 只看到“HTTP 200 耗时 18 秒”，完全分不清是</text>
  <text x="56" y="184" class="mono">  Prefill 排队 15 秒，还是用户本来就生成了 1,500 个词！排障耗 145 分钟！</text>
  <text x="56" y="202" class="mono">• 反模式 2 (全量录屏): 月 1 亿次请求全存 32K 明文 -&gt; 12.8 TB/月 ($6.85万)！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师解法：100% OTel 轻量数值 Span + 5% 异常尾部采样 + ClickHouse (🏆)</text>
  <text x="56" y="268" class="mono">• 1) 100% 请求采集定长 320B 元数据 (TTFT, TPOT, Cached/In/Think/Out Tokens)；</text>
  <text x="56" y="288" class="mono">• 2) 仅对 SLA 违约 (TTFT&gt;2s)、报错及 1% 抽样请求异步脱敏落盘 Prompt 正文；</text>
  <text x="56" y="308" class="mono">• 3) 排障 MTTR 缩至 3.4 分钟，观测账单从 $6.85万 暴降至 $3,800 (-94.5%)！</text>

  <!-- Right Panel: 4 GenAI Observability Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种企业 GenAI 可观测与 FinOps 架构对标 (月 1 亿次调用)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 传统 HTTP APM 监控 (仅记录 HTTP 总耗时与状态码)</text>
  <text x="638" y="158" class="mono">• 排障MTTR: 145m ✕ | 附加延迟: 1.2ms | 分账精度: 38.0% ✕ | 月费: $4,200</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 同步全量上报明文 Prompt 至商业 SaaS APM (32K 全文直传)</text>
  <text x="638" y="214" class="mono">• 排障MTTR: 18.0m | 附加延迟: +38.5ms ✕ | 分账精度: 94.0% | 月费: $68,500 ✕</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 仅采集 Prometheus 引擎聚合指标 (无单请求 Trace 关联)</text>
  <text x="638" y="270" class="mono">• 排障MTTR: 42.0m | 附加延迟: 0.4ms | 分账精度: 62.0% | 月费: $2,900</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: OTel GenAI 标准属性 + 尾部采样正文 + ClickHouse WCU (推荐 🏆)</text>
  <text x="638" y="326" class="mono">• 排障MTTR: 3.4m 🏆 | 延迟: 0.3ms 🏆 | 分账精度: 99.6% 🏆 | 月费: $3,800</text>

  <!-- Bottom Panel: OTel GenAI Span Schema & WCU FinOps Formula -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. OpenTelemetry GenAI 核心属性规范、流式 SSE 埋点公式与多租户 WCU 精确分账</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">规范 1: 必采的 8 个 OTel GenAI 黄金字段</text>
  <text x="58" y="464" class="mono">• gen_ai.request.model / lora_adapter_id</text>
  <text x="58" y="484" class="mono">• gen_ai.usage.input_tokens (含 cached_tokens)</text>
  <text x="58" y="504" class="mono">• gen_ai.usage.output_tokens (含 reasoning_tokens)</text>
  <text x="58" y="524" class="mono">• gen_ai.server.time_to_first_token (TTFT ms)</text>
  <text x="58" y="544" class="mono">• gen_ai.server.time_per_output_token (TPOT ms)</text>
  <text x="58" y="564" class="mono">• gen_ai.server.queue_wait_ms (排队时间 vs 计算时间)</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">规范 2: 严禁每个 Token 打一个 OTel Span！</text>
  <text x="436" y="464" class="mono">• 踩坑: 生成 2,000 个词如果发 2,000 个 Span，</text>
  <text x="436" y="484" class="mono">  OTel Collector 内存与网络会被直接冲垮！</text>
  <text x="436" y="504" class="mono">• 黄金准则: 1 次 LLM 调用 = 唯一 1 个 Span！</text>
  <text x="436" y="524" class="mono">  网关在流式循环中仅用局部变量累加</text>
  <text x="436" y="544" class="mono">  t_first, max_itl, count，流结束时一次性上报！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">规范 3: TraceID 贯通网关 -&gt; 引擎 -&gt; DCGM</text>
  <text x="814" y="464" class="mono">• 注入 W3C traceparent Header 穿透 AI Gateway、</text>
  <text x="814" y="484" class="mono">  RAG 向量库与 vLLM/SGLang Worker 节点</text>
  <text x="814" y="504" class="mono">• 当某条请求 P99 ITL 突刺 &gt; 80ms 时，直接通过</text>
  <text x="814" y="524" class="mono">  pod_name + 时间窗关联 DCGM 硬件指标与</text>
  <text x="814" y="544" class="mono">  PFC 暂停帧计数，3.4 分钟内锁定根因！</text>
</svg>
