<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 221 · PYTORCH FSDP1 (FLATPARAMETER &amp; RECORDSTREAM) VS. FSDP2 (DTENSOR PER-PARAMETER) FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">FSDP1 recordStream +14.8 GB HBM Bloat Trap vs FSDP2 DTensor Deterministic Free (1.29x Throughput)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: FSDP1 FlatParameter &amp; recordStream</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Monolithic 1D FlatParameter concatenates heterogeneous weights</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Breaks per-parameter LoRA freezing &amp; Float8 per-tensor scaling</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Relies on `record_stream()`: CPU runs ahead of GPU Compute Stream,</text>
  <text x="70" y="320" fill="#E2E8F0" font-size="15" font-family="Segoe UI, sans-serif">  delaying AllGather buffer free &amp; causing +14.8 GB HBM bloat ✕</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Peak HBM: 79.4 GB (OOM Risk) | 18 Allocator Retry Stalls/100 Steps</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14"> Throughput: 3,820 tok/s/GPU (Stalled by cudaMalloc Cache Flushes)</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3 &amp; 4: FSDP2 (`fully_shard`) DTensor</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Shards each parameter independently on dim-0 as a clean `DTensor`</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Zero `record_stream()` calls! Uses explicit copy-out stream sync</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Deterministic 0 MB allocator bloat &amp; zero `cudaMalloc` retry stalls</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Native 2D DeviceMesh (TP+FSDP2) + Float8 AllGather + DCP Checkpoint</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Peak HBM: 60.8 GB (-18.6 GB Saved) | 0 Allocator Retries 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Throughput: 4,940 tok/s/GPU (1.29x Speedup with FP8 AllGather)</text>
</svg>
