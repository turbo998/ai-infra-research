<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#10B981" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">多向量延迟交互检索 (Late Interaction: ColBERTv2 / ColPali) vs. 单向量稠密检索选型指南</text>
  <text x="52" y="94" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15">攻克多向量 49 倍内存爆炸 (1,030 向量/页 = 263KB/页)：单向量粗排 Prefetch + 3x 聚类池化二值化 MaxSim 重排 (-96.8% 内存)</text>

  <!-- Left: Single-Vector Bottleneck vs Multi-Vector RAM Explosion -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么单向量丢失细节，而原生 ColPali 又会把内存撑爆？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 痛点 A：单向量 Bi-Encoder 的“信息瓶颈” (Tier 1: ViDoRe 仅 72.4%)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 把整页财报的 80 个单元格数字、架构图连线与文字强行池化成 1 条 1536 维向量</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 细粒度局部特征被平均抹平；而 `ColPali / ColBERT` 保留每个 Patch/Token 的独立向量做 `MaxSim`！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 痛点 B：原生 ColPali 每页存 1,030 条向量引发 49 倍内存爆炸 (Tier 2)</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单页体积 = `1,030 patches × 128 dim × 2B = 263.7 KB / 页`（是单向量的 85 倍！）</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 存 500 万页 PDF 需建 51.5 亿条向量索引，吞噬 1,318 GB 内存 ($22,800/月)！</text>

  <!-- Right: 2-Stage Pooled Prefetch + Token-Pooled Binary MaxSim -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 多向量检索生产落地三步瘦身法 (压缩 96.8%, Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 层级 Token/Patch 聚类池化 (`Hierarchical Token Pooling 3x`)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">对每页 1,030 个视觉块做余弦相似度层次聚类合并为 340 个代表性块，体积立砍 67% 且零精度损失！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 1-Bit 二值化 (`Binary Quantization` + Hamming Bitwise `MaxSim`)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">将 `128d BF16` (256B) 压为 `128-bit` (16B)，单页多向量从 263.7 KB 骤降至 5.4 KB (缩小 48 倍)！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 两阶段检索 (Qdrant/Vespa/Milvus)：内存单向量粗排 Top-200 + NVMe Mmap 重排</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">仅在内存中为每页存 1 条均值池化向量做 HNSW 粗筛，多向量放 NVMe Mmap 按需做 MaxSim！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 500 万页图文混合工程/财务 PDF 库（ViDoRe 基准 · 300 QPS）四档检索架构对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">向量检索架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">集群内存 (DRAM)</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">检索 P99 延迟</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">ViDoRe Recall@5</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单卡入库速度</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度向量库成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 传统单向量 Bi-Encoder (`1×1536d`) + 前置 OCR</text>
  <text x="450" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">26.8 GB</text>
  <text x="620" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">9.5 ms</text>
  <text x="790" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">72.4% ✕ (丢失图表)</text>
  <text x="950" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">14 页/s (卡OCR)</text>
  <text x="1110" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$1,250/mo</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 原生未压缩 ColPali / ColBERT (`1,030×128d BF16` 全进内存)</text>
  <text x="450" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1,318.0 GB ✕</text>
  <text x="620" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">84.0 ms ✕</text>
  <text x="790" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">95.2%</text>
  <text x="950" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">68 页/s (免OCR)</text>
  <text x="1110" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$22,800/mo ✕</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: PLAID 聚类中心交互 + 2-Bit 残差量化</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">182.0 GB</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">28.0 ms</text>
  <text x="790" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">94.4%</text>
  <text x="950" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">62 页/s</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$3,800/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): 两阶段均值单向量粗排 + 3x 池化二值化 Mmap MaxSim</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">42.5 GB (-96.8%)</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">18.2 ms ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">94.6% (+22.2pt) ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">68 页/s (4.9x) ✓</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$1,950/mo (-91%)</text>
</svg>
