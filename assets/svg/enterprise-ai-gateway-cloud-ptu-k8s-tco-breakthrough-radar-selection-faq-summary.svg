<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #400 MILESTONE · CLOUD PAYGO VS. PTU VS. K8S TCO, AI GATEWAY SELECTION &amp; BREAKTHROUGH RADAR</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业 AI 平台端到端选型与能力突破雷达：PAYGO/PTU/自建 K8s 拐点与 AI Gateway 横评</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">第 400 篇里程碑：算清日均利用率 28%/58% 三大成本拐点、五款主流 AI Gateway 选型矩阵与 2026 前沿能力突破追踪</text>

  <!-- Left Box: PAYGO vs PTU vs Self-Hosted K8s Crossover -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. Serverless PAYGO vs. 预留 PTU vs. 自建 K8s 三大成本拐点公式</text>
  <rect x="76" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">拐点 1 (PAYGO -&gt; PTU): 日均包月槽位利用率 U_avg &gt;= 28% ~ 35%</text>
  <text x="90" y="242" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">拐点 2 (PTU -&gt; 自建 K8s+vLLM/SGLang): 月调用 &gt;= 2.5B Tok &amp; U_avg &gt;= 58%</text>
  <text x="90" y="260" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">终局架构: 自建 K8s (P60) + 云端 PTU (P25) + Serverless PAYGO (P15 尖峰)</text>
  <text x="76" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 初期 (&lt;5亿 Tok/月, 利用率 &lt;25%)：100% Serverless PAYGO + Batch API 最省钱</text>
  <text x="76" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 成长期 (5~25亿 Tok/月)：商业闭源模型用 PTU (吃满 50% 前缀缓存抵扣) + 溢出</text>
  <text x="76" y="346" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 规模期 (&gt;25亿 Tok/月)：自建 AKS/K8s + SGLang/vLLM FP8，单价压至 $0.21/1M！</text>

  <!-- Right Box: AI Gateway & 2026 Breakthrough Radar -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. AI Gateway 选型矩阵与 2026 前沿 AI Infra 能力突破追踪</text>
  <rect x="634" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">南北向公有云治理: Azure APIM / Kong AI  |  研发敏捷代理: LiteLLM</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">东西向 K8s 推理调度: Envoy AI Gateway (K8s GIE EPP) / Higress</text>
  <text x="648" y="260" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">双层网关黄金组合: 北向 APIM (配额/合规/PTU溢出) + 南向 GIE EPP (KV路由)</text>
  <text x="634" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 突破 1：NVIDIA Dynamo NIXL + Mooncake 跨节点零拷贝全局 KV 池成生产标配</text>
  <text x="634" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 突破 2：K8s GIE (Gateway API Inference Extension) 统一 KV 水位与 LoRA 路由</text>
  <text x="634" y="346" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 突破 3：Blackwell NVFP4 + DeepSeek NSA/MLA + Diffusion LLM 打破带宽墙！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档企业 AI 平台网关与混合算力架构实测对比 (月处理 60 亿 Tokens · 多部门共池)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">平台架构与算力组合方案</text>
  <text x="430" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">网关附加延迟</text>
  <text x="580" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">KV 缓存命中率</text>
  <text x="735" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">综合单价 ($/1M)</text>
  <text x="920" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">年度总 TCO (60B Tok/月)</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 业务直连 100% Serverless PAYGO API (无网关治理与缓存路由)</text>
  <text x="430" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">N/A (频遭 429)</text>
  <text x="580" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">22.0% ✕</text>
  <text x="735" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$2.10 / 1M ✕</text>
  <text x="920" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$1,512,000 / 年 ✕</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 单层 LiteLLM + 100% 峰值静态购买云端 PTU (无自建分流)</text>
  <text x="430" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">4.8 ms</text>
  <text x="580" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">54.0%</text>
  <text x="735" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$1.18 / 1M</text>
  <text x="920" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$849,600 / 年</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: 100% 自建 K8s + 普通轮询 Ingress (缺 KV 感知路由与云端溢出)</text>
  <text x="430" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">1.8 ms</text>
  <text x="580" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">38.5% (轮询打散)</text>
  <text x="735" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.56 / 1M</text>
  <text x="920" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$403,200 / 年</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): 双层网关 (APIM/Kong + Envoy GIE EPP) + K8s 自建 + PTU + PAYGO</text>
  <text x="430" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">0.9 ms ✓</text>
  <text x="580" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">91.8% 🏆</text>
  <text x="735" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$0.25 / 1M 🏆</text>
  <text x="920" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$180,000 / 年 (-88.1%) 🏆</text>
</svg>
