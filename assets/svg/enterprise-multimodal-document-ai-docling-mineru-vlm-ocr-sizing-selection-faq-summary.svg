<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">#496 企业日处理 1,000 万页多模态文档智能解析：Docling/MinerU + 局部裁剪 7B VLM 算卡指南</text>
  <text x="30" y="60" class="sub">拒绝把每一页纯文本 PDF 都转成 1,540 词高清图片喂给 72B VLM（需 64 张 H200），三级复杂度分流仅需 2 张 H200 (-96.9%)</text>

  <!-- Left: 3-Tier Complexity-Gated Document Pipeline -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. 页面复杂度三级分流管线 (Complexity-Gated 3-Tier Pipeline)</text>
  <text x="48" y="134" class="txt">• 65% 原生数字文本页 (Native Digital PDF):</text>
  <text x="64" y="154" class="txt">直接解析 PDF 字符流 + 版面阅读序重构，耗时 2ms/页，消耗 0 张 GPU！</text>
  <text x="48" y="178" class="txt">• 25% 复杂跨页财报表格与公式页 (MinerU / Docling TensorRT):</text>
  <text x="64" y="198" class="txt">专用小模型 YOLO-Layout + RapidTable/StructEqTable，单卡吞吐 38.5 页/秒！</text>
  <text x="48" y="222" class="txt good">• 10% 模糊扫描件 / 手写批注 / 复杂统计图表 (局部 Bounding-Box 裁剪 + 7B VLM):</text>
  <text x="64" y="244" class="txt good">只裁剪图表局部区域 (~320 视觉词 vs 整页 1,540 词) 送入 Qwen2.5-VL-7B FP8，</text>
  <text x="64" y="266" class="txt good">局部 300 DPI 高清放大让表格 TEDS 准确率反超整页 72B 模型达 96.1% 🏆</text>

  <!-- Right: 4-Tier Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 日处理 1,000 万页 PDF (115.7 页/秒) 四种架构算卡与成本横评</text>
  <text x="578" y="134" class="txt bad">• Tier 1 传统 PyPDF / 基础 OCR: 表格准确率仅 42.5% (合并单元格全乱 ✕)</text>
  <text x="578" y="158" class="txt warn">• Tier 2 全页无脑喂 72B VLM: 精度 95.8%，单卡仅 1.85 页/秒，需 64 张 H200 ✕</text>
  <text x="578" y="182" class="txt">• Tier 3 全页统一喂 7B VLM (olmOCR): 精度 94.2%，14.2 页/秒，需 10 张 H200</text>
  <text x="578" y="208" class="txt good">• Tier 4 复杂度分流 + MinerU/Docling + 局部裁剪 7B VLM (推荐 🏆):</text>
  <text x="594" y="232" class="txt good">- 表格/公式 TEDS 精度: 96.1% (局部高清裁剪消除小字号模糊 🏆)</text>
  <text x="594" y="256" class="txt good">- 等效单卡吞吐: 74.0 页/秒 (提速 40.0 倍！仅需 2 张 H200，千页成本 $0.18 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 日处理 1,000 万页文档所需 H200 GPU 卡数与每千页成本对比 (越短越省卡)</text>

  <text x="48" y="365" class="txt">Tier 1 传统 PyPDF (表格全毁)</text>
  <rect x="290" y="352" width="10" height="16" fill="#ef4444" rx="4"/>
  <text x="310" y="365" class="txt bad">0 GPU | $0.05/千页 | 但表格 TEDS 仅 42.5% (直接污染 RAG 知识库 ✕)</text>

  <text x="48" y="395" class="txt">Tier 2 全页无脑喂 72B VLM</text>
  <rect x="290" y="382" width="520" height="16" fill="#f59e0b" rx="4"/>
  <text x="820" y="395" class="txt warn">64 张 H200 | $8.50/千页 (日烧 $85,000 ✕) | TEDS 95.8%</text>

  <text x="48" y="425" class="txt">Tier 3 全页统一喂 7B VLM</text>
  <rect x="290" y="412" width="90" height="16" fill="#3b82f6" rx="4"/>
  <text x="390" y="425" class="txt">10 张 H200 | $1.15/千页 | 14.2 页/秒/卡 | TEDS 94.2%</text>

  <text x="48" y="455" class="txt good">Tier 4 三级分流 + 局部 7B VLM 🏆</text>
  <rect x="290" y="442" width="22" height="16" fill="#10b981" rx="4"/>
  <text x="325" y="455" class="txt good">2 张 H200 (-96.9% 🏆) | $0.18/千页 (-97.9% 🏆) | 74.0 页/秒/卡 | TEDS 96.1% 🏆</text>
</svg>
