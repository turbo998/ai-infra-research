  <text x="66" y="394" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">1. 前置多模态/检索漏斗 (8× L40S PCIe · $6.8K/月): 承接 100% ViT 图像编码、BGE-M3/Reranker 精排、Whisper ASR 与 8B 路由小模型 (绝不浪费 H200!)</text>
  <text x="66" y="418" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">2. 跨代 PD 分离预填充池 (8× H100 SXM · $18.4K/月): H100 的 FP8 算力 (1,979 TFLOPS) 与 H200 完全一致但便宜 28%，专职跑 Compute-Bound Prefill！</text>
  <text x="66" y="442" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="13" font-weight="700">3. 跨代 PD 分离解码池 (8× H200 141GB · $25.6K/月): 经 400G RDMA 接收 H100 推送的 KV，用 4.8 TB/s HBM3e 专职跑 Memory-Bound Decode (TPOT 12.6ms)！</text>

