  <text x="66" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 一刀切全用 H200 混跑所有模型 (36× H200 = $115,200/月)  |  错误用 L40S 跑 70B Decode (P99 TPOT 恶化至 31.8ms 违约)</text>
  <text x="66" y="558" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 黄金异构编排 [8×L40S + 8×H100 (Prefill) + 8×H200 (Decode) = 24 GPUs]: 月总成本压至 $50,800/月 (立省 55.9% · 年省 $77.28万 · P99 TPOT 12.6ms)！</text>
