<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="acc6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 26px; font-weight: 800; fill: #F8FAFC; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #94A3B8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; }
      .sec { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #34D399; }
      .ct { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #F1F5F9; }
      .cb { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; font-weight: 400; fill: #CBD5E1; }
      .cm { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #34D399; }
      .cw { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #FBBF24; }
      .cd { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #F87171; }
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg6)"/>
  <rect x="30" y="24" width="1340" height="86" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="46" y="40" width="210" height="24" rx="12" fill="url(#acc6)"/>
  <text x="151" y="56" text-anchor="middle" class="badge">AI SOLUTION ARCHITECT · ROUND 6</text>
  <text x="272" y="59" class="title">千卡 AI 训练集群故障容错与 NCCL 假死自愈架构选型一图流总结</text>
  <text x="46" y="90" class="sub">Stop-the-World Job Restart vs. Flight Recorder + Warm-Spare Swap vs. In-Place ncclCommShrink vs. TorchFT In-Memory Peer RDMA Recovery</text>

  <!-- Left Column: 4-Tier Evolution -->
  <rect x="30" y="126" width="650" height="430" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="156" class="sec">1. 1,024×H100 (MTBF = 6.0h, 4次故障/天) 四档容错架构决策树</text>

  <rect x="50" y="172" width="610" height="82" rx="10" fill="#1E293B" stroke="#F87171" stroke-width="1.5"/>
  <text x="66" y="196" class="ct">Tier 1 · 传统全量连坐重启 (30m 默认 NCCL 超时 + 冷拆毁重拉 + 30m 检查点)</text>
  <text x="66" y="218" class="cb">1,800s 假死空等 + 480s 全集群 Pod 重启 + 240s 读盘 + 900s 平均进度回滚作废</text>
  <text x="66" y="239" class="cd">单次损失: 3,420.0s (57.0 min) | 1024卡 Goodput: 84.17% | 月浪费: $295,893 / 月</text>

  <rect x="50" y="266" width="610" height="82" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="66" y="290" class="ct">Tier 2 · Flight Recorder 快检 (120s) + 暖备节点替换 + GDS 恢复 (&lt;=256卡推荐)</text>
  <text x="66" y="312" class="cb">黑匣子秒级定位坏节点 + 自动 Cordon 切换预热暖备机，无需修改训练框架源码</text>
  <text x="66" y="333" class="cw">单次损失: 1,230.0s (20.5 min · 2.78x) | Goodput: 94.31% | 月省: $189,476 / 月</text>

  <rect x="50" y="360" width="610" height="82" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="384" class="ct">Tier 3 · 定制应用层原地 ncclCommShrink + 独立扩容重分片 + 5m 异步 DCP</text>
  <text x="66" y="406" class="cb">定制捕获异常保留存活节点显存，65s 缩容/重初始化 (synthetic) + 150s 平均回滚</text>
  <text x="66" y="427" class="cm">损失: 215.0s (15.91x) | Goodput: 99.00% | 毛挽回 $277.3k (净省 $248.1k, Net ROI 8.50x)</text>

  <rect x="50" y="454" width="610" height="86" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
  <text x="66" y="478" class="ct">Tier 4 · TorchFT 副本组 400G RDMA 显存流式自愈 (&gt;=1024~2048+卡零回滚)</text>
  <text x="66" y="500" class="cb">替补节点经 400G RDMA 从兄弟 DP 副本组 HBM 直拉最新 Step 状态 (8.0s synthetic)</text>
  <text x="66" y="522" class="cm">损失: 28.0s (122.14x · 0s 回滚) | Goodput: 99.87% | 净省 $264.3k (Net ROI 9.05x)</text>

  <!-- Right Column: Quantitative Bars -->
  <rect x="700" y="126" width="670" height="430" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="720" y="156" class="sec">2. 单次故障恢复损失拆解 &amp; 跨规模有效算力率 (Synthetic Availability Model)</text>
  <text x="720" y="178" class="sub">Source: experiments/gpu_cluster_fault_recovery_selection/results.json (independently_reproduced=false)</text>

  <!-- Lost Time Bars -->
  <text x="720" y="208" class="ct">单次故障总损失时间 (停机恢复 + 进度回滚秒数，越短越好)</text>
  <text x="720" y="232" class="cb">Tier 1 Stop-World</text>
  <rect x="875" y="218" width="342" height="18" rx="4" fill="#F87171"/>
  <text x="1225" y="232" class="cd">3,420.0s (57.0 min)</text>

  <text x="720" y="258" class="cb">Tier 2 Warm-Spare</text>
  <rect x="875" y="244" width="123" height="18" rx="4" fill="#FBBF24"/>
  <text x="1008" y="258" class="cw">1,230.0s (20.5 min · 2.78x)</text>

  <text x="720" y="284" class="cb">Tier 3 CommShrink</text>
  <rect x="875" y="270" width="22" height="18" rx="4" fill="#38BDF8"/>
  <text x="907" y="284" class="cm">215.0s (3.58 min · 15.91x)</text>

  <text x="720" y="310" class="cb">Tier 4 TorchFT RDMA</text>
  <rect x="875" y="296" width="6" height="18" rx="3" fill="#34D399"/>
  <text x="891" y="310" class="cm">28.0s (0.47 min · 122.14x · Zero Rollback!)</text>

  <!-- Multi-scale Goodput Table inside SVG -->
  <text x="720" y="352" class="ct">不同集群规模下的有效训练算力率 (Effective Goodput % vs. Cluster MTBF)</text>
  <rect x="720" y="366" width="630" height="174" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="736" y="392" class="cm">GPU 规模 (MTBF)      | Tier 1 重启 | Tier 2 暖备 | Tier 3 原地重构 | Tier 4 TorchFT</text>
  <text x="736" y="420" class="cb">256 GPUs  (24.0h)   |   96.04%    |   98.58%    |     99.75%      |    99.97%</text>
  <text x="736" y="448" class="cb">512 GPUs  (12.0h)   |   92.08%    |   97.15%    |     99.50%      |    99.94%</text>
  <text x="736" y="476" class="cw">1024 GPUs ( 6.0h)   |   84.17%    |   94.31%    |     99.00%      |    99.87%</text>
  <text x="736" y="504" class="cd">2048 GPUs ( 3.0h)   |   68.33%    |   88.61%    |     98.01%      |    99.74%</text>
  <text x="736" y="528" class="sub">* 2,048 卡集群平均每 3 小时故障一次，传统全量重启直接报废近 1/3 (31.67%) 算力预算！</text>

  <!-- Bottom Row: First-Principles & Checklist -->
  <rect x="30" y="572" width="1340" height="260" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="602" class="sec">3. 核心底层机制解构 &amp; 架构师生产自检清单 (First-Principles &amp; Production Checklist)</text>

  <rect x="50" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="66" y="644" class="ct">为什么静默假死 (Hang) 比崩溃 (Crash) 可怕十倍？</text>
  <text x="66" y="668" class="cb">• 光模块闪断或 GPU Xid 挂起往往不触发进程退出。</text>
  <text x="66" y="692" class="cb">• 其余 1,023 张卡在 AllReduce 屏障处集体死等默认</text>
  <text x="66" y="712" class="cb">  1,800s (30 分钟) NCCL_TIMEOUT，且报错堆栈完全相同。</text>
  <text x="66" y="736" class="cb">• 开启 Flight Recorder 环回记录 Op ID 后，可在秒级</text>
  <text x="66" y="756" class="cb">  比对出哪个 Rank 最先停滞并自动下发 Cordon 隔离。</text>

  <rect x="490" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="506" y="644" class="ct">ncclCommShrink / TorchElastic / TorchFT 机制边界</text>
  <text x="506" y="668" class="cb">• 官方 ncclCommShrink 仅移除坏 Rank 重建存活通信组；</text>
  <text x="506" y="688" class="cb">  接入暖备需独立 Grow/Re-init，且标准 TorchElastic 默认</text>
  <text x="506" y="708" class="cb">  重启全体 Worker，原地保活需定制应用层异常与重分片。</text>
  <text x="506" y="732" class="cb">• TorchFT Peer RDMA: 替补节点从兄弟 DP 副本组 HBM 经</text>
  <text x="506" y="752" class="cb">  400G RDMA 拉取最新状态 (8.0s synthetic, 0s 回滚)。</text>
  <text x="506" y="780" class="cm">• 扣 $29.2k 暖备后净省: T3 $248.1k (8.50x) | T4 $264.3k (9.05x)</text>

  <rect x="930" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="946" y="644" class="ct">生产环境快速核验 Checklist</text>
  <text x="946" y="668" class="cb">[✓] 开启 TORCH_NCCL_TRACE_BUFFER_SIZE=2000 黑匣子</text>
  <text x="946" y="692" class="cb">[✓] 将 NCCL_TIMEOUT 从 1800s 收敛至 45~120s</text>
  <text x="946" y="716" class="cb">[✓] 升级 NCCL 2.27+ 启用 ncclCommShrink 原地通信重构</text>
  <text x="946" y="740" class="cb">[✓] 配合两阶段异步 DCP 将存盘间隔縮短至 5 分钟 (300s)</text>
  <text x="946" y="764" class="cb">[✓] 预留 1~2% 预热暖备节点 (Warm Spare) 自动热替换</text>
  <text x="946" y="788" class="cm">Provenance: synthetic + anonymized_reported (non-GPU run)</text>
</svg>
