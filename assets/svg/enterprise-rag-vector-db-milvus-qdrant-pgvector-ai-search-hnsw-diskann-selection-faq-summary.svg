<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#38BDF8" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级十亿向量 RAG 检索基础设施选型：Milvus vs. Qdrant vs. pgvector vs. Azure AI Search</text>
  <text x="52" y="94" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="15">内存 HNSW FP32 vs. SQ8/BQ 量化重排 vs. NVMe DiskANN/Vamana 内存容量手算公式与混合检索 (Dense + BM25 + RRF)</text>

  <!-- Left: Vector RAM Capacity Formula -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么 1 亿条 1536 维向量用纯内存 HNSW 会烧穿预算？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 纯内存 HNSW FP32 容量公式 (Tier 1)：</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 原始向量 = 100M × 1536 × 4B = 614.4 GB；加 HNSW 邻接图与内存水位预留 (×1.75)</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 仅 1 亿条向量就需 1,075 GB (1.08 TB!) 昂贵内存，月均成本高达 $18,400！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="64" y="314" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">✅ 三级降本破局：SQ8 (4x) / Binary BQ (32x) / NVMe DiskANN (11x)</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 方案 A (Qdrant/Milvus BQ+Mmap)：内存存 1-bit 二值图，Mmap NVMe 做 3x 过采样重排 (168GB RAM)</text>
  <text x="64" y="360" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 方案 B (DiskANN/Vamana)：内存仅驻留 PQ 压缩码 (96GB RAM)，全量图与向量放本地 NVMe！</text>

  <!-- Right: Engine Selection Decision Guide -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 四大主流向量检索引擎架构边界与黄金选型法则</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① &lt; 5,000 万向量 + 强事务关联查询：PostgreSQL + pgvectorscale</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">StreamingDiskANN + 行级权限 (RLS) 同库 ACID Join，免运维第二套分布式存储</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 5,000 万 ~ 5 亿高并发多租户过滤：Qdrant (Rust) / Milvus</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Filterable HNSW + 标量 Payload 索引 + Binary/SQ8 量化，P99 稳定在 11.2 ms</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 1 亿 ~ 100 亿混合检索或全托管 SLA：Milvus DiskANN / Azure AI Search</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">存算分离对象存储 + 本地 NVMe DiskANN + 稠密/稀疏 BM25 RRF + 语义重排器</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 1 亿条 1536 维向量（100M Vectors · 500 QPS）四档检索架构容量与 TCO 对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">检索与索引方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">集群内存 (DRAM)</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">NVMe 容量</text>
  <text x="780" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">检索 P99 延迟</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Recall@10</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度基础设施成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 纯内存 HNSW FP32 无压缩 (DRAM 全驻留)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1,075 GB ✕</text>
  <text x="620" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">1,200 GB</text>
  <text x="780" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">8.5 ms</text>
  <text x="950" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">98.4%</text>
  <text x="1110" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$18,400/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: PostgreSQL pgvector + pgvectorscale (DiskANN)</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">192 GB</text>
  <text x="620" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">950 GB</text>
  <text x="780" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">24.0 ms</text>
  <text x="950" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">96.5%</text>
  <text x="1110" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$4,800/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: Qdrant / Milvus HNSW + BQ/SQ8 量化 + Mmap 重排</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">168 GB (-84%)</text>
  <text x="620" y="612" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">880 GB</text>
  <text x="780" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">11.2 ms ✓</text>
  <text x="950" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">97.6% ✓</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$4,200/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): Milvus / AI Search 分层 DiskANN + 稠密/BM25 RRF</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">96 GB (-91%) ✓</text>
  <text x="620" y="660" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">820 GB</text>
  <text x="780" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">16.5 ms ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">97.8% ✓</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$3,100/mo (-83%)</text>
</svg>
