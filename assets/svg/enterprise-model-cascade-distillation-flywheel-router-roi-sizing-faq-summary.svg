<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#579 企业大小模型蒸馏飞轮与级联路由 (Model Cascade)：5ms 难度预路由 + 82/18 蒸馏级联与 4.2小时回本账本</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">破解“先跑小模型失败再调大模型”串行双重延迟陷阱 · 5ms 复杂度预路由 + 5万条线上日志蒸馏 8B ($180成本 4.2小时回本) · 省 75% GPU</text>

  <!-- Box 1: Why Naive Serial Cascade Fails -->
  <rect x="24" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="42" y="138" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 为什么“全调 70B”与“串行级联”都不可取？</text>
  <rect x="42" y="152" width="310" height="98" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 误区 1：100% 流量全调 70B/671B (杀鸡用牛刀)</text>
  <text x="52" y="191" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 企业 82% 流量是常规意图分类、摘要、标准问答</text>
  <text x="52" y="209" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 全调 70B 在 80 QPS 下需 48 张 H200 ($14.4万/月)</text>
  <text x="52" y="227" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">• 首字 P95 TTFT 高达 780 ms，算力浪费 75%!</text>

  <rect x="42" y="258" width="310" height="110" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="52" y="278" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 误区 2：先跑完 8B 发现不行再重跑 70B (串行惩罚)</text>
  <text x="52" y="297" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 对复杂问题：先等 8B 吐完 1.8s，判定低置信度后</text>
  <text x="52" y="315" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">  再重新调 70B (叠加双重延迟，P95 恶化至 3,420ms!)</text>
  <text x="52" y="333" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 且未蒸馏的通用 8B 在垂域格式上准确率仅 74.5%</text>

  <!-- Box 2: Pre-Routed Cascade + Distillation Flywheel -->
  <rect x="386" y="110" width="354" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="404" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 5ms 预路由 + 蒸馏飞轮 (82/18 级联) 🏆</text>
  <rect x="404" y="152" width="318" height="98" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="416" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">1. 5ms 前置难度路由器 (Pre-Execution Router)</text>
  <text x="416" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 在生成前用 5ms ONNX DeBERTa/向量分类器一次性分流</text>
  <text x="416" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 82% 常规任务直派 8B FP8 池 (P95 TTFT 仅 95ms)</text>
  <text x="416" y="227" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 18% 复杂跨表/代码/推理任务直派 70B/671B (零串行重试!)</text>

  <rect x="404" y="258" width="318" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="416" y="278" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">2. 在线影子蒸馏数据飞轮 ($180 训练 · 4.2h 回本)</text>
  <text x="416" y="297" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 异步采集 5 万条 70B/671B 高分轨迹做 RAFT/LoRA 蒸馏</text>
  <text x="416" y="315" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 蒸馏成本仅 12 卡时 ($180)，使 8B 垂域准确率达 97.2%</text>
  <text x="416" y="333" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 全盘综合准确率达 98.9% (与全量 70B 的 99.1% 持平!)</text>
  <text x="416" y="351" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 总卡数从 48 张降至 12 张 H200 (上线 4.2 小时即收回训练费!)</text>

  <!-- Box 3: Comparison -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 80 QPS 三种路由方案对标</text>
  <rect x="774" y="152" width="264" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="176" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 A (100% 全调 70B · 48x H200):</text>
  <text x="786" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 准确率: 99.1% · P95 TTFT: 780 ms</text>
  <text x="786" y="212" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 月度成本: $144,000 / 月</text>

  <text x="786" y="242" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 B (未蒸馏 8B 串行回退 70B):</text>
  <text x="786" y="260" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 长尾 P95 延迟: 3,420 ms (双重等待 ✕)</text>
  <text x="786" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 需 24 张 H200 ($72,000/月)</text>

  <text x="786" y="308" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 C (5ms预路由 + 82/18蒸馏级联) 🏆</text>
  <text x="786" y="326" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 准确率 98.9% · P95 TTFT 145 ms (快5.38x)</text>
  <text x="786" y="344" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 仅需 12 张 H200 ($36,000/月 · 省75%!)</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 企业 Teacher-Student 蒸馏与级联路由落地三步法：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. 第 1–2 周：100% 流量走 70B/671B Teacher 模型快速上线，并在网关异步落盘真实生产 Prompt-Response 金标日志。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">2. 第 3 周：用 LLM-as-a-Judge 过滤出 5 万条满分样本，花 $180 (12 H200 卡时) 微调蒸馏出专属 8B FP8 Student。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">3. 第 4 周起：开启 5ms 预路由将 82% 常规流量切给 8B Student，每月立省 $10.8 万 (蒸馏投入仅需 4.2 小时即完全回本)！</text>
</svg>
