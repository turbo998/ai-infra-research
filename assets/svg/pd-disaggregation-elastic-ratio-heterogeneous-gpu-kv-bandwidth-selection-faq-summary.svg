<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #396 · PD DISAGGREGATION P:D RATIO SIZING, HETEROGENEOUS PAIRING &amp; KV TRANSFER BANDWIDTH</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">PD 分离动态 P:D 配比手算、异构 GPU 混搭与 NIXL/Mooncake 跨机 KV 带宽选型</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">告别盲目 1:1 静态切池：用第一性原理公式算清 Prefill:Decode 黄金卡数比、异构算力/带宽卡配对与 400G RDMA 逐层流水线重叠</text>

  <!-- Left Box: P:D Ratio Formula & Diurnal Shift -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. P:D 实例配比第一性原理公式与昼夜流量漂移</text>
  <rect x="76" y="200" width="490" height="58" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="224" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700">N_P / N_D = [ RPS * S_in * (1 - eta_cache) / TPS_Prefill_Node ]</text>
  <text x="90" y="246" fill="#6ee7b7" font-family="Consolas, monospace" font-size="13" font-weight="700">          ÷ [ RPS * S_out / TPS_Decode_Node ]</text>
  <text x="76" y="282" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 日间企业 RAG (16K 输入 / 400 输出, 50% 缓存): 最佳配比 = 5P : 3D</text>
  <text x="76" y="308" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 夜间深度思考 Agent (2K 输入 / 4K CoT 输出): 最佳配比 = 2P : 6D</text>
  <text x="76" y="334" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 解决方案：保留 25% Flex 弹性双模节点，零重启秒级翻转 P/D 角色！</text>

  <!-- Right Box: KV Cache Transfer Math -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 跨机 KV Cache 搬运体积与 400G RDMA 线速账本 (16K 输入)</text>
  <rect x="634" y="200" width="490" height="58" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="224" fill="#93c5fd" font-family="Consolas, monospace" font-size="13" font-weight="700">KV_Bytes(S_in) = S_in * (1 - eta) * L * (2 * n_kv * d_h) * bytes</text>
  <text x="648" y="246" fill="#93c5fd" font-family="Consolas, monospace" font-size="13" font-weight="700">T_exposed = (KV_Bytes / BW_RDMA) * (1 - Overlap_Ratio_82%)</text>
  <text x="634" y="282" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• Llama-3.3-70B GQA-8 (FP8 KV): 163.8 KB/tok -&gt; 16K 达 2.68 GB (暴露 11.4ms)</text>
  <text x="634" y="308" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• DeepSeek-671B MLA (FP8 KV): 35.1 KB/tok -&gt; 16K 仅 0.56 GB (暴露 2.4ms!)</text>
  <text x="634" y="334" fill="#f87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 严禁在 25G TCP 上拆跨机 PD：2.68 GB 传输阻塞 1,120 ms，首字直接雪崩！</text>

  <!-- Bottom Comparison Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档 PD 架构与主流跨节点 KV 传输栈（Dynamo NIXL / Mooncake / LMCache / SGLang）实效对比</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">架构档位 / 引擎方案</text>
  <text x="380" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">P95 TTFT</text>
  <text x="515" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">P99 TPOT</text>
  <text x="660" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">昼夜综合 Goodput</text>
  <text x="850" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">百万 Token 成本 ($/1M)</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 同构混部 Colocated (无 PD 分离, 16K 长文抢占)</text>
  <text x="380" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">980 ms</text>
  <text x="515" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">84.5 ms ✕</text>
  <text x="660" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">1,420 tok/s ✕</text>
  <text x="850" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.92 / 1M</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 静态 1:1 同构 PD 分离 (昼夜流量切换时 35% 池闲置)</text>
  <text x="380" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">540 ms</text>
  <text x="515" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">22.0 ms</text>
  <text x="660" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">3,180 tok/s</text>
  <text x="850" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.54 / 1M</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: 异构算力/带宽卡配对 (H100 Prefill + H200 Decode + Mooncake)</text>
  <text x="380" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">460 ms</text>
  <text x="515" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">16.8 ms</text>
  <text x="660" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">4,650 tok/s</text>
  <text x="850" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.35 / 1M</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): 异构 PD + 25% Flex 弹性翻转 + Dynamo NIXL / SGLang 逐层 RDMA</text>
  <text x="380" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">415 ms ✓</text>
  <text x="515" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">15.2 ms ✓</text>
  <text x="660" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">5,890 tok/s (4.15x) 🏆</text>
  <text x="850" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$0.26 / 1M (-71.7%) 🏆</text>
</svg>
