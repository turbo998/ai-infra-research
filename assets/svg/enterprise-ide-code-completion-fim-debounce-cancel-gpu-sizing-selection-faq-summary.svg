<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业万人级研发 IDE 实时代码补全 (FIM &lt;= 200ms) 与防抖/断连消峰容量选型 (#491)</text>
  <text x="28" y="58" class="sub">为什么只需要 8 张 H200 就能丝滑支撑全公司 10,000 名程序员实时写代码？语法感知防抖 + 在途击键瞬时 Cancel + 7B/14B PLD 专用池</text>

  <!-- Left Panel: Why Keystroke Storms Destroy Shared 70B Pools -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么代码补全超过 300ms 就没人按 Tab 采纳？为什么不能跟 Chat 混跑？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 击键风暴与僵尸补全 (78.5% 算力浪费在已被下一个按键作废的旧请求上 ✕)</text>
  <text x="56" y="164" class="mono">• 程序员打字速度 = 每秒敲 4~6 个键 (间隔 180ms)；</text>
  <text x="56" y="184" class="mono">• 若每次按键都发请求且不 Cancel 上一次在途请求，等 1.8 秒后返回幽灵文本，</text>
  <text x="56" y="202" class="mono">  程序员早就往后打了 8 个字母！采纳率暴跌至 11.2%，且烧掉 96 张 GPU！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师四重极速法则：Tree-Sitter 语法防抖 + 瞬时 Cancel + 7B/14B PLD (🏆)</text>
  <text x="56" y="268" class="mono">• 1) 语法边界触发: 敲完 `(`、`{`、`:`、回车立即 0ms 触发，普通字母 150ms 防抖；</text>
  <text x="56" y="288" class="mono">• 2) 新键按下 1ms 内发送 HTTP/2 RST_STREAM 杀掉旧请求 (废算力降至 0.9%)；</text>
  <text x="56" y="308" class="mono">• 3) 独立 7B/14B FP8 + PLD 投机池: 8 张 H200 支撑 10,000 人 (P99 138ms 🏆)！</text>

  <!-- Right Panel: 4 IDE Completion Architecture Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 万人研发团队 (10,000 程序员) 四种 IDE 补全架构定量对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 无防抖按键直发 + 混跑 70B 对话池 (无在途请求 Cancel)</text>
  <text x="638" y="158" class="mono">• P99延迟: 1,840ms ✕ | Tab采纳率: 11.2% ✕ | 需H200: 96卡 ✕ | 废算力: 78.5%</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 固定 300ms 死板延时防抖 + 共享 32B 模型池</text>
  <text x="638" y="214" class="mono">• P99延迟: 590ms ✕ | Tab采纳率: 21.5% | 需H200: 40卡 | 废算力: 42.0%</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 独立 7B/14B FP8 补全池 + 150ms 防抖 + 在途 Cancel</text>
  <text x="638" y="270" class="mono">• P99延迟: 215ms ✓ | Tab采纳率: 33.4% ✓ | 需H200: 16卡 ✓ | 废算力: 4.8%</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: Tree-Sitter 语法防抖 + Cancel + 7B/14B PLD + 文件前缀缓存 (🏆)</text>
  <text x="638" y="326" class="mono">• P99延迟: 138ms 🏆 | Tab采纳率: 38.6% 🏆 | 需H200: 仅 8卡 (-91.7% 🏆)</text>

  <!-- Bottom Panel: 10,000-Developer Concurrency Funnel Math -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 万人研发团队 IDE 算卡漏斗公式：为什么 10,000 个席位只需要 8 张 H200？</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 从总席位到峰值 FIM RPS 漏斗</text>
  <text x="58" y="464" class="mono">• 总采购席位 N_seats = 10,000 人</text>
  <text x="58" y="484" class="mono">• 同一工作日同时在线率 = 45% (4,500 人)</text>
  <text x="58" y="504" class="mono">• 同一秒正在敲键盘率 = 12% (540 人)</text>
  <text x="58" y="524" class="mono">• 经 Tree-Sitter 语法防抖过滤后每分钟触发</text>
  <text x="58" y="544" class="mono">  8 次有效补全 -&gt; 峰值 RPS = 540 * (8/60) = 72 RPS！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: 极短驻留时间下的 Little's Law 奇迹</text>
  <text x="436" y="464" class="mono">• 单次 FIM 补全仅生成 24~48 个 Token，</text>
  <text x="436" y="484" class="mono">  端到端耗时 E2EL = 0.138 秒！</text>
  <text x="436" y="504" class="mono">• 全集群同一瞬间常驻活跃并发请求数：</text>
  <text x="436" y="524" class="mono">  B_active = 72 RPS * 0.138s = 仅 10.0 个并发！</text>
  <text x="436" y="548" class="txt" fill="#34d399">8 张 H200 (DP=8) 每卡仅跑 1~2 并发，极速丝滑！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: FIM 前后缀拼接顺序保住 Prefix Cache</text>
  <text x="814" y="464" class="mono">• 踩坑: 若采用 SPM (`&lt;SUF&gt;后缀&lt;PRE&gt;前缀&lt;MID&gt;`)</text>
  <text x="814" y="484" class="mono">  光标以上的前缀放在了变化的光标后，缓存失效</text>
  <text x="814" y="504" class="mono">• 黄金顺序: 统一采用 PSM 模式 (`&lt;fim_prefix&gt;</text>
  <text x="814" y="524" class="mono">  文件上半部 + &lt;fim_suffix&gt;文件下半部 + &lt;fim_middle&gt;`)</text>
  <text x="814" y="544" class="mono">  或固定导入头，让文件上半部 90% 命中缓存！</text>
</svg>
