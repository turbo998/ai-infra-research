  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`C = 16,384`): Piggybacked Decode tokens stall behind 16K</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  Prefill compute — P99 Decode ITL spikes to 640.0 ms (screen freeze) ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (`C = 256` on 32K prompt = 128 chunks): Chunk `k` re-reads all</text>
