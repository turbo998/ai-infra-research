  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Dynamically sizes `max_num_batched_tokens` (`1,024–2,048`) based on</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  active Decode batch &amp; target ITL SLO (`P99 ITL &lt;= 28.5 ms`)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Routes `&gt;16K` long prompts to wide-chunk / disaggregated Prefill</text>
