<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg200" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc200" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg200)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="420" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="262" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 200 · LONG-CONTEXT PARALLELISM: ULYSSES, RING &amp; HYBRID USP</text>
  <text x="488" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">百万长上下文并行（Megatron SP vs. Ulysses vs. ZigZag Ring vs. 混合 USP）选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">为什么普通 Ring Attention 会出现 7 倍因果掩码算力空转？为什么 Ulysses 跨不过 8 个 GQA 头？“机内 Ulysses=8 × 机间 ZigZag Ring”跑出 54.2% MFU</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc200)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="224" height="24" rx="6" fill="#7f1d1d"/>
  <text x="180" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 连续分块 Ring Attention</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">因果三角形 7 倍负载失衡 ✕</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">GPU0 只算 12.5% · 末卡算 87.5%</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制灾难：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">在因果下三角掩码下，把前 1/P 词分给卡 0</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">导致卡 0 绝大部分块全被 Mask 掉闲置等末卡</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 因果负载失衡比: <tspan fill="#f87171" font-weight="700">7.0x (木桶空转 ✕)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 暴露通信空泡: <tspan fill="#f87171" font-weight="700">44.5% ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32卡 512K MFU: <tspan fill="#f87171" font-weight="700">22.0% ✕</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 极限上下文长度: <tspan fill="#f87171" font-weight="700">256K</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁对因果大模型做朴素连续序列切分</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="228" height="24" rx="6" fill="#78350f"/>
  <text x="482" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 纯 Ulysses 跨 32 卡 (GQA 受限)</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">撞上 8 个 KV 头上限被迫复制</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">All-to-All 跨机细碎通信 · MFU 31.5%</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么纯 Ulysses 扩不到 32 卡？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">70B GQA 只有 8 个 KV 头！当并行度 P=32</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">时必须把 KV 头复制 4 份且跨机 All-to-All！</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 因果负载失衡比: <tspan fill="#fbbf24" font-weight="700">1.0x (按头均分 ✅)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 暴露通信空泡: <tspan fill="#fbbf24" font-weight="700">36.0% (跨机 A2A ⚠️)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32卡 512K MFU: <tspan fill="#fbbf24" font-weight="700">31.5%</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 极限上下文长度: <tspan fill="#fbbf24" font-weight="700">512K</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 极适合机内 8 卡 NVLink，不适合跨多机</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="232" height="24" rx="6" fill="#0c4a6e"/>
  <text x="784" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · 纯 ZigZag Ring Attention</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">首尾对称折纸实现 100% 均衡</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Chunk(i) + Chunk(2P-1-i) · MFU 42.8%</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制突破：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">把序列切成 2P 块，每张卡分 1 块最前 +</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">1 块最后，所有卡计算量 100% 严格相等！</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 因果负载失衡比: <tspan fill="#38bdf8" font-weight="800">1.0x (绝对均衡 ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 暴露通信空泡: <tspan fill="#38bdf8" font-weight="800">19.5% (32步环传)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32卡 512K MFU: <tspan fill="#38bdf8" font-weight="800">42.8% ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 极限上下文长度: <tspan fill="#38bdf8" font-weight="800">2,048K (2M) ✅</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 突破头数限制，但单维环太长步数多</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 混合二维 USP (Ulysses×Ring)</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">54.2% MFU (提速 2.46x 🏆)</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">机内 NVLink Ulysses=8 × 机间 Ring=4</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (硬件拓扑天作之合)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">机内 8 卡 NVLink 跑 Ulysses=8 (零 KV 复制)；</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">跨机 4 节点 RDMA 跑大块 ZigZag Ring=4！</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 因果负载失衡比: <tspan fill="#34d399" font-weight="800">1.0x 🏆</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 暴露通信空泡: <tspan fill="#34d399" font-weight="800">仅 4.2% (近乎全掩盖 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32卡 512K MFU: <tspan fill="#34d399" font-weight="800">54.2% (快 2.46x 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 极限上下文长度: <tspan fill="#34d399" font-weight="800">4,096K (4M Tokens 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 512K~4M 超长上下文黄金标准</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：一分钟分清 `Megatron SP`、`DeepSpeed Ulysses` 与 `ZigZag Ring Attention`</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：`Megatron SP` 不切 Attention，`Ulysses` 切头，`Ring` 切序列块</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• `Megatron TP+SP`：只在 LayerNorm/Dropout 切序列，进 Attention 前 `AllGather` 回全长；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• `Ulysses`：进 Attention 前用 `All-to-All` 转置为每张卡算 **1 个头 × 完整序列长 L**；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• `ZigZag Ring`：每张卡始终只存 `L/P` 个词，通过环形 P2P 传递 `KV` 块在线合并 Softmax！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：为什么 `USP (Ulysses × Ring)` 是物理网络拓扑的最优解？</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• `All-to-All` 对全互联带宽极度饥渴，恰好契合机内 `900 GB/s NVLink Switch` (`U=8`)；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• `Ring P2P` 每次只跟左右邻居单向收发大块 KV，恰好契合机间 `400G RDMA` (`R=4..16`)；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 两者正交相乘（$P = U \times R = 8 \times 4 = 32$），把跨机环传步数缩短 8 倍 🏆！</text>
</svg>
