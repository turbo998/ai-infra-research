<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="56" y="68" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1.5">#617 AUTOMOTIVE ADAS &amp; SMART COCKPIT AI · 0.5% CORNER-CASE FUNNEL · ORIN/THOR EDGE COCKPIT</text>
  <text x="56" y="102" fill="#f8fafc" font-size="23" font-weight="800">Automotive AI: -99.5% Fleet Upload Volume, 18ms In-Cabin Edge Voice &amp; -88.6% Auto-Labeling TCO</text>
  <text x="56" y="128" fill="#94a3b8" font-size="14">Why uploading raw 8-camera fleet video bankrupts cellular/storage ($2.85M/mo) vs. Shadow-Mode Trigger + SigLIP Dedup + Orin/Thor INT4 Cockpit</text>

  <!-- Left: Anti-pattern -->
  <rect x="56" y="152" width="340" height="340" rx="12" fill="#1f1218" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="76" y="184" fill="#fb7185" font-size="16" font-weight="700">❌ Anti-Pattern: Raw Fleet Upload &amp; Cloud Voice</text>
  <text x="76" y="212" fill="#fecdd3" font-size="13">• 100K vehicles logging 8 cameras + LiDAR:</text>
  <text x="76" y="232" fill="#fda4af" font-size="13">  Uploading 10% raw clips = 45 PB/mo ($1.6M/mo)</text>
  <text x="76" y="260" fill="#fecdd3" font-size="13">• Human 3D cuboid + lane labeling:</text>
  <text x="76" y="280" fill="#fda4af" font-size="13">  $0.85 per frame · 3 weeks turnaround</text>
  <text x="76" y="308" fill="#fecdd3" font-size="13">• Cloud-only in-cabin voice assistant:</text>
  <text x="76" y="328" fill="#fda4af" font-size="13">  Fails in tunnels/garages · 1,150ms latency</text>
  <rect x="76" y="380" width="300" height="88" rx="8" fill="#31101d"/>
  <text x="92" y="408" fill="#fda4af" font-size="13" font-weight="700">Legacy Cloud Data Loop + Labeling</text>
  <text x="92" y="432" fill="#ffffff" font-size="19" font-weight="800">$2,850,000 / mo · 1,150ms Voice</text>
  <text x="92" y="454" fill="#fb7185" font-size="12">96% of uploaded highway clips are redundant</text>

  <!-- Right: Reference Architecture -->
  <rect x="424" y="152" width="720" height="340" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="448" y="184" fill="#34d399" font-size="16" font-weight="700">✅ 3-Stage Corner-Case Active Funnel + 4D Auto-Labeler + In-Vehicle Edge Cockpit</text>

  <!-- Step 1 -->
  <rect x="448" y="204" width="216" height="156" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="464" y="230" fill="#38bdf8" font-size="14" font-weight="700">1. Edge Shadow-Mode Funnel</text>
  <text x="464" y="252" fill="#e2e8f0" font-size="12">• Trigger only on disengagement,</text>
  <text x="464" y="272" fill="#e2e8f0" font-size="12">  AEB brake, or entropy spike (2%)</text>
  <text x="464" y="292" fill="#e2e8f0" font-size="12">• On-board SigLIP cosine dedup</text>
  <text x="464" y="312" fill="#e2e8f0" font-size="12">  uploads via Wi-Fi at night (0.5%)</text>
  <text x="464" y="340" fill="#38bdf8" font-size="13" font-weight="700">-99.5% Cellular &amp; Storage Volume</text>

  <!-- Step 2 -->
  <rect x="676" y="204" width="216" height="156" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.2"/>
  <text x="692" y="230" fill="#c084fc" font-size="14" font-weight="700">2. 4D Teacher Auto-Labeling</text>
  <text x="692" y="252" fill="#e2e8f0" font-size="12">• Offline multi-frame LiDAR+Cam</text>
  <text x="692" y="272" fill="#e2e8f0" font-size="12">  Teacher (32× H200 + 64× L40S)</text>
  <text x="692" y="292" fill="#e2e8f0" font-size="12">• 94% frames auto-labeled ($0.004)</text>
  <text x="692" y="312" fill="#e2e8f0" font-size="12">• Only 6% low-conf to human QA</text>
  <text x="692" y="340" fill="#c084fc" font-size="13" font-weight="700">-95.2% Labeling Cost · 18h Loop</text>

  <!-- Step 3 -->
  <rect x="904" y="204" width="216" height="156" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2"/>
  <text x="920" y="230" fill="#fbbf24" font-size="14" font-weight="700">3. In-Vehicle Edge Cockpit</text>
  <text x="920" y="252" fill="#e2e8f0" font-size="12">• Orin/Thor 7B AWQ INT4 + EAGLE</text>
  <text x="920" y="272" fill="#e2e8f0" font-size="12">  speculative decoding (78 tok/s)</text>
  <text x="920" y="292" fill="#e2e8f0" font-size="12">• 100% local CAN-bus HVAC/seat/nav</text>
  <text x="920" y="312" fill="#e2e8f0" font-size="12">  function calling in 18ms TTFT</text>
  <text x="920" y="340" fill="#fbbf24" font-size="13" font-weight="700">100% Offline Tunnel Availability</text>

  <!-- Bottom KPI Banner -->
  <rect x="448" y="378" width="672" height="90" rx="10" fill="#064e3b" stroke="#10b981" stroke-width="1.2"/>
  <text x="468" y="406" fill="#a7f3d0" font-size="14" font-weight="700">100K-Vehicle Fleet Total Monthly Cost: $324,000/mo vs. $2,850,000/mo (-88.6% Savings = $30.3M/yr)</text>
  <text x="468" y="432" fill="#ecfdf5" font-size="15" font-weight="800">Corner-Case Recall: 99.1% · In-Cabin Control Latency: 18ms (Offline) · Auto-Label Cost: $0.004/frame</text>
  <text x="468" y="454" fill="#6ee7b7" font-size="12">Strict hardware/CAN firewall: Cockpit LLM can only invoke whitelisted comfort/infotainment APIs, zero direct steering/brake actuation</text>

  <!-- Footer -->
  <text x="56" y="544" fill="#cbd5e1" font-size="14" font-weight="700">Golden Rule: Filter 99.5% of boring highway miles at the vehicle edge, and keep vehicle-control voice commands 100% on-board.</text>
  <text x="56" y="572" fill="#64748b" font-size="12">cloud-and-ai-infra-research · #617 Automotive ADAS Data Factory &amp; Smart Cockpit Edge AI Sizing Playbook</text>
</svg>
