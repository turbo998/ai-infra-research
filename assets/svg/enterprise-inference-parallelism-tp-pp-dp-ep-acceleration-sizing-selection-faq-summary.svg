<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">大模型推理并行切分 (TP / PP / Attention DP / Expert EP) 与四大加速方案全景选型指南 (#445)</text>
  <text x="28" y="58" class="sub">为什么跨节点开 TP=16 会引发每词 2L 次 All-Reduce 延迟雪崩？Dense (70B/405B) 与 MoE (DeepSeek 671B) 最佳切分怎么配？</text>

  <!-- Left Panel: TP vs PP vs DP vs EP Mechanics -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 四大并行范式 (TP / PP / DP / EP) 通信代价与铁律红线</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 致命踩坑：把张量并行 (TP) 跨出单机 NVLink 域 (如双机 TP=16)</text>
  <text x="56" y="164" class="mono">• 物理机制：TP 每层 Attention 与 FFN 各需 1 次同步 All-Reduce (全网每词 2L=122~160 次)</text>
  <text x="56" y="184" class="mono">• 机内 NVLink (900GB/s, 1.5us) 仅耗 1.8ms；跨机 RoCE (5us/跳) 暴露高达 24.8ms ✕！</text>
  <text x="56" y="202" y2="202" class="txt">• 红线 1：TP 严禁跨出 NVLink/MNNVL 域！红线 2：MoE 严禁对 256 个路由专家切纯 TP！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 Dense vs. MoE 黄金并行公式与投机解码 Batch=48 关断线</text>
  <text x="56" y="272" class="mono">• Dense 70B: 单机 TP=4/8 × DP | Dense 405B: 机内 TP=8 × 跨机 PP=2 (仅 1 次 P2P 通信)</text>
  <text x="56" y="292" class="mono">• MoE 671B: Attention DP (免 KV 重复分片) + Expert EP (DeepEP 双微批乒乓掩盖 All-to-All)</text>
  <text x="56" y="312" class="txt">• 投机解码 (MTP/EAGLE-3): B&lt;=32 提速 2.45x；B&gt;=48 算力触顶必须自动关断！</text>

  <!-- Right Panel: 4 Parallelism & Acceleration Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四档并行与加速组合实测对标 (16x H200 · DeepSeek-R1 671B)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 跨节点纯 TP=16 (跨双机 RoCEv2 · 每步 122 次跨网 All-Reduce)</text>
  <text x="638" y="158" class="mono">• 暴露通信: 24.8ms/tok ✕ | P99 TPOT: 42.6ms ✕ | 单卡 Goodput: 410 tok/s ($0.94/1M)</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#93c5fd">Tier 2: 机内 NVLink TP=8 × 跨机 PP=2 (Dense 405B 跨机标准方案)</text>
  <text x="638" y="214" class="mono">• 暴露通信: 2.9ms/tok | P99 TPOT: 18.4ms | 单卡 Goodput: 1,180 tok/s ($0.42/1M) ✓</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#fde68a">Tier 3: Attention DP=16 + Expert EP=16 (DeepEP 双微批乒乓重叠)</text>
  <text x="638" y="270" class="mono">• 暴露通信: 1.4ms/tok | P99 TPOT: 13.8ms | 单卡 Goodput: 2,140 tok/s ($0.24/1M) ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: DP+EP + Block-FP8 + Radix 前缀缓存 + 原生 MTP (B&lt;=48 门控) (🏆)</text>
  <text x="638" y="326" class="mono">• 等效 TPOT: 8.9ms 🏆 | 单卡 Goodput: 2,890 tok/s (7.05x) 🏆 | 成本: $0.17/1M (-81.9%)!</text>

  <!-- Bottom Panel: 4 Parallelism + 4 Acceleration Matrix -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 四大并行维度 (TP/PP/DP/EP) × 四大推理加速方案 (MTP / Prefix Cache / FP8 / FlashMLA) 速查</text>

  <rect x="42" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① TP (张量并行) vs. PP (流水线)</text>
  <text x="56" y="464" class="mono">• TP: 切矩阵行列，同步降 TTFT 与</text>
  <text x="56" y="484" class="mono">  TPOT，但必须锁死在 NVLink 域内</text>
  <text x="56" y="504" class="mono">• PP: 按层分段，跨机仅传激活张量</text>
  <text x="56" y="524" class="mono">  (几 MB)，不降单请求延迟但扩容量</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">Dense 跨机黄金组合：TP_intra × PP_inter</text>

  <rect x="328" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="342" y="440" class="txt" font-weight="700" fill="#34d399">② Attention DP + Expert EP</text>
  <text x="342" y="464" class="mono">• Attention 层用 DP: 每卡独立跑不同</text>
  <text x="342" y="484" class="mono">  会话，消除 MLA 潜向量跨卡复制</text>
  <text x="342" y="504" class="mono">• MoE 专家层用 EP: 256 专家分散各卡</text>
  <text x="342" y="524" class="mono">  通过 DeepEP All-to-All 精准派发</text>
  <text x="342" y="550" class="txt" fill="#34d399">MoE 终局架构：吞吐暴涨 5.2 倍 🏆</text>

  <rect x="614" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="628" y="440" class="txt" font-weight="700" fill="#fde68a">③ 投机解码 (MTP / EAGLE-3)</text>
  <text x="628" y="464" class="mono">• 原理：借用 Decode 空闲 TensorCore</text>
  <text x="628" y="484" class="mono">  一次并行验证 k=3~4 个候选草稿词</text>
  <text x="628" y="504" class="mono">• 低并发 (B=8): 接收 3.12 词 (2.45x)</text>
  <text x="628" y="524" class="mono">• 高并发 (B&gt;=48): 算力饱和，自动关断</text>
  <text x="628" y="550" class="txt" fill="#fde68a">交互式代码补全与语音提速神器 🏆</text>

  <rect x="900" y="414" width="258" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="914" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ Prefix Caching + Block-FP8</text>
  <text x="914" y="464" class="mono">• Radix Prefix Cache: 直接复用多轮</text>
  <text x="914" y="484" class="mono">  历史与系统提示词 KV，省 65% Prefill</text>
  <text x="914" y="504" class="mono">• 细粒度 Block-FP8 (1x128/128x128):</text>
  <text x="914" y="524" class="mono">  权重与 KV 显存齐减半，算力翻倍</text>
  <text x="914" y="550" class="txt" fill="#d8b4fe">99.8% 无损精度，零成本翻倍吞吐 🏆</text>
</svg>
