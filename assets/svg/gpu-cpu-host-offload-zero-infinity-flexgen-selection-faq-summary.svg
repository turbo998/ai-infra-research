<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🖥️ GPU-CPU 异构内存卸载与单机跑 671B 超大 MoE 选型一图流总结（KTransformers vs. FlexGen vs. 权重搬运）</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">单台 $1.85万 服务器 (1×48GB GPU + 双路 24通道 512GB DDR5 @ 760 GB/s) 跑 DeepSeek-R1 671B · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">Round 42 · KTransformers &amp; Offload</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: CUDA Unified Memory 缺页</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">按需 64KB 缺页中断拉取 · PCIe 彻底瘫痪</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单用户交互生成速度: <tspan fill="#f87171" font-weight="700">0.35 tok/s (3秒1个字 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 离线 Batch=128 吞吐: <tspan fill="#f87171" font-weight="700">4.2 tok/s ✕</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 每 Token PCIe 搬运量: <tspan fill="#f87171" font-weight="700">21,500 MB (21.5 GB ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 16K 上下文首字延迟: <tspan fill="#f87171" font-weight="700">185.0 s ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 整机硬件成本: <tspan fill="#cbd5e1" font-weight="700">$18,500</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 严禁开 cudaMallocManaged 硬抗：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">GPU 每访问一个不在显存里的专家矩阵就触发</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">一次驱动级缺页中断，数十万次微小 PCIe 事</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">务把总线有效带宽打跌至不足 8 GB/s！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 按层权重 DMA 搬运 (accelerate)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">每生成 1 个词跨 PCIe 搬运 17GB 权重进 GPU</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单用户交互生成速度: <tspan fill="#fbbf24" font-weight="700">2.10 tok/s (卡在 PCIe ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 离线 Batch=128 吞吐: <tspan fill="#fbbf24" font-weight="700">48.0 tok/s</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 每 Token PCIe 搬运量: <tspan fill="#f87171" font-weight="700">17,000 MB (17.0 GB ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 16K 上下文首字延迟: <tspan fill="#fbbf24" font-weight="700">42.0 s</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 物理极限死锁: <tspan fill="#f87171" font-weight="700">17GB ÷ 52GB/s = 327ms/词</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 为什么“把专家搬进 GPU 算”是错的？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">为了乘一个只有 16KB 的单 Token 激活向量，</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">竟然花 330ms 把 17GB 的专家权重从内存搬</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">进 GPU，算完 1ms 又扔掉，纯属买椟还珠！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: FlexGen Zig-Zag 批量卸载</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">列优先遍历 · 搬 1 次权重连算 128 个 Batch</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单用户交互生成速度: <tspan fill="#fbbf24" font-weight="700">2.15 tok/s (交互仍慢)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 离线 Batch=128 吞吐: <tspan fill="#34d399" font-weight="700">310.0 tok/s (最高 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 平摊每 Token PCIe 量: <tspan fill="#60a5fa" font-weight="700">265.0 MB (平摊 64 倍)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 16K 上下文首字延迟: <tspan fill="#60a5fa" font-weight="700">28.0 s</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 最佳定位: <tspan fill="#34d399" font-size="12" font-weight="700">夜间离线大批量跑评测/打标 ✅</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 离线高吞吐批处理神器：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">改变循环顺序（先按层固定权重、横扫 128 个</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">Batch 的激活，再换下一层权重），将 PCIe 搬</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">运成本平摊 128 倍，但不适合单人实时聊天！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: KTransformers 异构原位算 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">GPU 跑注意力+热专家 · CPU AMX 原位算冷专家</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单用户交互生成速度: <tspan fill="#34d399" font-weight="700">18.60 tok/s (快 8.86x 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 离线 Batch=128 吞吐: <tspan fill="#34d399" font-weight="700">195.0 tok/s ✅</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 每 Token PCIe 搬运量: <tspan fill="#6ee7b7" font-weight="700">0.032 MB (缩小 53万倍 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 16K 上下文首字延迟: <tspan fill="#34d399" font-weight="700">6.8 s (快 6.18x 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 整机硬件成本: <tspan fill="#34d399" font-weight="700">$18,500 (省 $12万 8×H200 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 移动计算而非移动权重的神来之笔：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">360GB 专家权重纹丝不动躺在双路 24 通道</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">DDR5 (760GB/s) 里；PCIe 只传 32KB 激活向量</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">让 CPU AMX 矩阵核原位算完发回 GPU！</text>
  </g>

  <!-- Bottom Left: Why Move 32KB Activations Instead of 17GB Weights -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">⚖️ 第一性原理算账：跨 PCIe 搬 17 GB 权重 vs. 搬 32 KB 激活向量（相差 531,250 倍！）</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">为什么在单张 48GB 显卡 + 双路 DDR5 服务器上跑 671B MoE，必须“把计算移向数据”？</text>

    <rect x="20" y="70" width="560" height="108" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="34" y="94" fill="#fca5a5" font-size="13.5" font-weight="800">✕ 传统思路 (Tier 2 搬权重就迁 GPU)：PCIe 带宽 52 GB/s 沦为死穴</text>
    <text x="34" y="118" fill="#cbd5e1" font-size="12">• 每生成 1 个词，61 层 MoE 激活的路由专家权重约 <tspan fill="#f87171" font-weight="800">17,000 MB (17 GB)</tspan>；</text>
    <text x="34" y="140" fill="#cbd5e1" font-size="12">• 通过 PCIe Gen5 x16 (`52 GB/s`) 搬进 GPU 耗时：<tspan fill="#f87171" font-weight="800">327 毫秒/词</tspan>（速度上限被死死焊在 `2.1 tok/s`）！</text>
    <text x="34" y="162" fill="#cbd5e1" font-size="12">• 哪怕 GPU Tensor Core 算得再快（0.5ms），99.8% 的时间都在干等 PCIe 小水管搬砖！</text>

    <rect x="20" y="190" width="560" height="115" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="34" y="214" fill="#6ee7b7" font-size="13.5" font-weight="800">🏆 KTransformers / Fiddler 思路 (Tier 4 搬激活就迁 CPU DDR5)：释放 760 GB/s 内存带宽</text>
    <text x="34" y="238" fill="#cbd5e1" font-size="12">• 48GB GPU 显存常驻：**MLA 注意力层 + KV Cache + 共享专家 (Shared Experts)**（高算术强度）；</text>
    <text x="34" y="260" fill="#cbd5e1" font-size="12">• 遇到路由专家时，GPU 仅把 <tspan fill="#34d399" font-weight="800">32 KB 激活向量</tspan> 跨 PCIe 发给 CPU（耗时 `0.0006 ms`，小 **53 万倍**！）；</text>
    <text x="34" y="282" fill="#cbd5e1" font-size="12">• 双路 CPU 利用 **24 通道 DDR5 (`760 GB/s`，比 PCIe 快 14.6 倍！) + AMX 矩阵指令** 原位算完专家！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师异构内存卸载与单机 671B 部署三大黄金法则</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="70" fill="#6ee7b7" font-size="13" font-weight="800">1️⃣ 实时交互单机跑 671B MoE → 必选 Tier 4 (KTransformers / Fiddler)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 用 $1.85万 的“1×RTX PRO 6000/L40S (48G) + 双路 Xeon AMX / EPYC (512G DDR5)”服务器</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  即可跑出 `18.6 tok/s` 的满血 671B DeepSeek-R1，门槛从 $15万 8×H200 直降 88%！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="160" fill="#93c5fd" font-size="13" font-weight="800">2️⃣ 夜间离线大批量文档打标 / 评测 → 选 Tier 3 (FlexGen Zig-Zag 卸载)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 当不追求单请求毫秒响应、而是要把 10 万条数据在夜间跑完时，用 FlexGen 列优先遍历</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  （搬一次权重算 128 个 Batch），离线总吞吐高达 `310 tok/s`！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 双路 CPU 跑 MoE 专家的必配调优：NUMA 本地绑定 (`numactl`)</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 严禁让 Socket 0 的 CPU 核心去读 Socket 1 的 DDR5 内存（跨 UPI 总线带宽腰斩）！</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">• 必须将每个 MoE 专家张量按列切分均匀锁死在两颗 CPU 本地 NUMA 节点内存上并发执行！</text>
  </g>
</svg>
