<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #411 · ENTERPRISE DOCUMENT AI: AZURE DOCUMENT INTELLIGENCE VS. MINERU / DOCLING VS. VLM OCR</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业多模态文档解析选型：Azure Document Intelligence vs. MinerU/Docling vs. VLM</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">根治 RAG 80% 的“复杂合并单元格表格与双栏错位”顽疾，算清每千页成本拐点与 82/18 局部裁剪混合架构</text>

  <!-- Left Box: Why RAG Fails on PDFs & Visual Token Math -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 为什么全页硬塞 VLM 太慢太贵，而传统 PyPDF 会毁掉表格 RAG？</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">PyPDF 纯文本提取 : 丢失双栏顺序与跨行表头 -&gt; 财报表格 RAG 准确率仅 54.2%!</text>
  <text x="90" y="242" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">全页截图送大 VLM : 每页 2,400 视觉词 + 1,000 输出词 -&gt; 单卡仅 1.8 页/秒!</text>
  <text x="90" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">82/18 局部裁剪混合: DocLayout 快筛 82% + 仅裁剪 18% 复杂表送 7B VLM (0.42$/千页)</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 复杂跨行跨列表格铁律：必须输出带 `rowspan/colspan` 的 HTML `&lt;table&gt;`，严禁纯 Markdown 表</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 溯源高亮刚需：解析结果必须保留每个段落/单元格的 `[page, x0, y0, x1, y1]` 坐标框</text>
  <text x="76" y="350" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 成本拐点：月解析 &lt;=30万页用 Azure Doc Intelligence；&gt;=50万页上混合自建池！</text>

  <!-- Right Box: 4 Document AI Stacks Comparison -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 四大主流企业文档解析引擎核心定位与适用边界</text>
  <rect x="634" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">Azure Doc Intelligence : 零运维 PaaS · 原生发票/合同预置模型 + 精确坐标框</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">MinerU / IBM Docling   : 开源版面分析双雄 (YOLO/RT-DETR + 表格/公式结构恢复)</text>
  <text x="648" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">Qwen2.5-VL-7B / olmOCR : 攻克手写体、印章遮挡、无线框扫描件与复杂图表的利器</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 为什么局部裁剪 (Region Cropping) 能提速 8 倍？只把表格框裁出送 VLM，省掉 80% 空白背景词</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 双重校验门禁：对财务报表开启“行合计 == 列合计”自动算术校验，不平自动重解析</text>
  <text x="634" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：财报表格 RAG 准确率从 54.2% 跃升至 95.4%，千万页月成本降 92.5%！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档企业文档解析与 PDF OCR 流水线实效对比 (月处理 500 万页复杂财报/合同 PDF)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">文档解析流水线方案</text>
  <text x="435" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">复杂表格 RAG 准确率</text>
  <text x="605" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">单卡解析吞吐</text>
  <text x="755" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">每千页成本 ($/1K)</text>
  <text x="920" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">500万页月度总成本</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 传统规则提取 (PyMuPDF / pdfplumber 无版面视觉理解)</text>
  <text x="435" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">54.2% ✕ (表头错乱)</text>
  <text x="605" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">120 pages/s (CPU)</text>
  <text x="755" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.05 / 1K</text>
  <text x="920" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">RAG 不可用 (业务失败)</text>

  <text x="76" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 100% 全页高分截图直传大 VLM (Qwen2.5-VL-72B / GPT-4o)</text>
  <text x="435" y="512" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">93.8%</text>
  <text x="605" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">1.8 pages/s/GPU ✕</text>
  <text x="755" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$8.20 / 1K ✕</text>
  <text x="920" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$41,000 / 月 ✕</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: 100% Azure AI Document Intelligence (Layout / Prebuilt API)</text>
  <text x="435" y="540" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">94.5% ✓</text>
  <text x="605" y="540" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">云端高并发免运维 ✓</text>
  <text x="755" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$6.00 / 1K (阶梯价)</text>
  <text x="920" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$30,000 / 月 (&lt;30万页首选)</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (大规模推荐): MinerU/Docling 快筛 82% + 局部裁剪 18% 送 Qwen2.5-VL-7B</text>
  <text x="435" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">95.4% (HTML 表) 🏆</text>
  <text x="605" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">19.5 pages/s/GPU 🏆</text>
  <text x="755" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$0.42 / 1K 🏆</text>
  <text x="920" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$2,100 / 月 (-94.9%) 🏆</text>
</svg>
