<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad70" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad70" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad70)" rx="16"/>
  <rect x="24" y="20" width="1232" height="86" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="54" fill="url(#accentGrad70)" font-size="22" font-weight="800">Round 70 · GPU 显存碎片治理、CUDA VMM (expandable_segments) 与 vAttention 页表架构选型一图流</text>
  <text x="44" y="84" fill="#94A3B8" font-size="14">80GB H100 变长训练与 RL 混部 · cuMemCreate/cuMemMap 2MB 物理页缝合 + vAttention 页表连续 KV (Synthetic Calibrated · independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <g transform="translate(24, 124)">
    <!-- Tier 1 -->
    <rect x="0" y="0" width="296" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FCA5A5" font-size="15" font-weight="700">Tier 1 · 频繁调 empty_cache() ✕</text>
    <text x="16" y="56" fill="#CBD5E1" font-size="12.5">每步调 cudaFree 强制全卡同步</text>
    <line x1="16" y1="70" x2="280" y2="70" stroke="#334155"/>
    <text x="16" y="98" fill="#94A3B8" font-size="12">碎片浪费比例：</text>
    <text x="165" y="98" fill="#FCA5A5" font-size="14" font-weight="700">8.5% (6.8 GB)</text>
    <text x="16" y="128" fill="#94A3B8" font-size="12">OOM 前可用显存：</text>
    <text x="165" y="128" fill="#F87171" font-size="14" font-weight="700">73.2 GB / 80 GB</text>
    <text x="16" y="158" fill="#94A3B8" font-size="12">每步分配器同步卡顿：</text>
    <text x="165" y="158" fill="#EF4444" font-size="15" font-weight="800">145.0 ms / step ✕</text>
    <text x="16" y="188" fill="#94A3B8" font-size="12">归一化集群有效吞吐：</text>
    <text x="165" y="188" fill="#FCA5A5" font-size="14" font-weight="700">0.72x (-28% 暴跌)</text>
    <text x="16" y="218" fill="#94A3B8" font-size="12">64卡年化等效成本：</text>
    <text x="165" y="218" fill="#FCA5A5" font-size="13" font-weight="700">$1,940,000 / yr</text>
    <rect x="16" y="244" width="264" height="48" rx="8" fill="#2D1622"/>
    <text x="26" y="264" fill="#FDA4AF" font-size="11.5" font-weight="600">痛点：cudaFree 阻塞所有 CUDA Stream，</text>
    <text x="26" y="282" fill="#FDA4AF" font-size="11.5">彻底摧毁 CPU-GPU 异步流水线重叠！</text>

    <!-- Tier 2 -->
    <rect x="312" y="0" width="296" height="310" rx="12" fill="#1E2230" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="328" y="32" fill="#FCD34D" font-size="15" font-weight="700">Tier 2 · 标准 Caching Allocator ✕</text>
    <text x="328" y="56" fill="#CBD5E1" font-size="12.5">cudaMalloc 虚拟与物理地址 1:1 死锁</text>
    <line x1="328" y1="70" x2="592" y2="70" stroke="#334155"/>
    <text x="328" y="98" fill="#94A3B8" font-size="12">碎片浪费比例：</text>
    <text x="477" y="98" fill="#FBBF24" font-size="15" font-weight="800">18.5% (14.8 GB ✕)</text>
    <text x="328" y="128" fill="#94A3B8" font-size="12">OOM 前可用显存：</text>
    <text x="477" y="128" fill="#F59E0B" font-size="15" font-weight="800">65.2 GB (早发 OOM)</text>
    <text x="328" y="158" fill="#94A3B8" font-size="12">每步分配器同步卡顿：</text>
    <text x="477" y="158" fill="#FCD34D" font-size="14" font-weight="700">12.0 ms / step</text>
    <text x="328" y="188" fill="#94A3B8" font-size="12">归一化集群有效吞吐：</text>
    <text x="477" y="188" fill="#FCD34D" font-size="14" font-weight="700">1.00x (Baseline)</text>
    <text x="328" y="218" fill="#94A3B8" font-size="12">64卡年化等效成本：</text>
    <text x="477" y="218" fill="#FCD34D" font-size="13" font-weight="700">$1,400,000 / yr</text>
    <rect x="328" y="244" width="264" height="48" rx="8" fill="#2E2418"/>
    <text x="338" y="264" fill="#FDE68A" font-size="11.5" font-weight="600">痛点：明明还剩 14.8GB 未分配，却因散落</text>
    <text x="338" y="282" fill="#FDE68A" font-size="11.5">在 40 个不相邻空洞无法分配 2GB 张量！</text>

    <!-- Tier 3 -->
    <rect x="624" y="0" width="296" height="310" rx="12" fill="#132A3E" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="640" y="32" fill="#7DD3FC" font-size="15" font-weight="700">Tier 3 · expandable_segments ✅</text>
    <text x="640" y="56" fill="#CBD5E1" font-size="12.5">cuMemCreate 2MB 物理页 + MMU 页表缝合</text>
    <line x1="640" y1="70" x2="904" y2="70" stroke="#334155"/>
    <text x="640" y="98" fill="#94A3B8" font-size="12">碎片浪费比例：</text>
    <text x="789" y="98" fill="#38BDF8" font-size="14" font-weight="700">3.2% (降至 1/6 ✅)</text>
    <text x="640" y="128" fill="#94A3B8" font-size="12">OOM 前可用显存：</text>
    <text x="789" y="128" fill="#38BDF8" font-size="15" font-weight="800">77.4 GB (+12.2 GB)</text>
    <text x="640" y="158" fill="#94A3B8" font-size="12">每步分配器同步卡顿：</text>
    <text x="789" y="158" fill="#7DD3FC" font-size="14" font-weight="700">0.4 ms / step (15µs map)</text>
    <text x="640" y="188" fill="#94A3B8" font-size="12">归一化集群有效吞吐：</text>
    <text x="789" y="188" fill="#38BDF8" font-size="14" font-weight="700">1.18x (+18% 提速)</text>
    <text x="640" y="218" fill="#94A3B8" font-size="12">64卡年化等效成本：</text>
    <text x="789" y="218" fill="#7DD3FC" font-size="13" font-weight="700">$1,186,000 / yr</text>
    <rect x="640" y="244" width="264" height="48" rx="8" fill="#0C2238"/>
    <text x="650" y="264" fill="#BAE6FD" font-size="11.5" font-weight="600">优势：一行环境变量零代码开启，把分散</text>
    <text x="650" y="282" fill="#BAE6FD" font-size="11.5">2MB 物理空洞零拷贝映射为连续虚拟张量。</text>

    <!-- Tier 4 -->
    <rect x="936" y="0" width="296" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.2"/>
    <text x="952" y="32" fill="#6EE7B7" font-size="15" font-weight="800">Tier 4 · VMM + vAttention + RL 🏆</text>
    <text x="952" y="56" fill="#D1FAE5" font-size="12.5">MMU 连续 KV Cache + 保指针零拷贝休眠</text>
    <line x1="952" y1="70" x2="1216" y2="70" stroke="#334155"/>
    <text x="952" y="98" fill="#A7F3D0" font-size="12">碎片浪费比例：</text>
    <text x="1101" y="98" fill="#34D399" font-size="15" font-weight="800">1.2% (-15.4x 🏆)</text>
    <text x="952" y="128" fill="#A7F3D0" font-size="12">OOM 前可用显存：</text>
    <text x="1101" y="128" fill="#34D399" font-size="15" font-weight="800">79.0 GB (+13.8 GB 🏆)</text>
    <text x="952" y="158" fill="#A7F3D0" font-size="12">每步分配器同步卡顿：</text>
    <text x="1101" y="158" fill="#6EE7B7" font-size="14" font-weight="700">0.1 ms / step (异步池)</text>
    <text x="952" y="188" fill="#A7F3D0" font-size="12">归一化集群有效吞吐：</text>
    <text x="1101" y="188" fill="#34D399" font-size="15" font-weight="800">1.32x (+32% 🏆)</text>
    <text x="952" y="218" fill="#A7F3D0" font-size="12">64卡年化等效成本：</text>
    <text x="1101" y="218" fill="#6EE7B7" font-size="13" font-weight="800">$1,060,000 (省 $340k)</text>
    <rect x="952" y="244" width="264" height="48" rx="8" fill="#062019"/>
    <text x="962" y="264" fill="#A7F3D0" font-size="11.5" font-weight="700">终极形态：消灭 PagedAttention 查表税</text>
    <text x="962" y="282" fill="#A7F3D0" font-size="11.5">(+14.2% 算子速度) + RL 休眠不破 CUDA Graph</text>
  </g>

  <!-- Bottom Visual Comparison: Usable HBM vs Fragmented HBM + MMU Page Table Diagram -->
  <rect x="24" y="454" width="1232" height="302" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="486" fill="#F8FAFC" font-size="16" font-weight="700">核心定量洞察：80GB H100 可用显存天花板对比 &amp; GPU 硬件 MMU 页表零拷贝缝合机制</text>

  <!-- Left Bar Chart -->
  <g transform="translate(44, 508)">
    <text x="0" y="20" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 2 标准 Caching Allocator (65.2 GB 可用 · 14.8 GB 碎片死锁 OOM ✕)</text>
    <rect x="0" y="28" width="456" height="22" rx="4" fill="#F59E0B"/>
    <rect x="456" y="28" width="104" height="22" rx="4" fill="#7F1D1D" stroke="#EF4444" stroke-dasharray="4,2"/>
    <text x="464" y="44" fill="#FCA5A5" font-size="11" font-weight="700">14.8 GB 碎片浪费</text>

    <text x="0" y="76" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 1 频繁 empty_cache() (73.2 GB 可用 · 每步 145ms 全局同步卡顿吞吐暴跌 -28% ✕)</text>
    <rect x="0" y="84" width="512" height="22" rx="4" fill="#EF4444"/>
    <rect x="512" y="84" width="48" height="22" rx="4" fill="#475569"/>

    <text x="0" y="132" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 3 CUDA VMM expandable_segments:True (77.4 GB 可用 · 单卡白捡 +12.2 GB ✅)</text>
    <rect x="0" y="140" width="542" height="22" rx="4" fill="#38BDF8"/>
    <rect x="542" y="140" width="18" height="22" rx="4" fill="#334155"/>

    <text x="0" y="188" fill="#6EE7B7" font-size="12.5" font-weight="700">Tier 4 VMM + vAttention 连续 KV + RL 保指针休眠 (79.0 GB 可用 · 碎片仅 1.2% · 吞吐 1.32x 🏆)</text>
    <rect x="0" y="196" width="553" height="22" rx="4" fill="#10B981"/>
    <rect x="553" y="196" width="7" height="22" rx="4" fill="#1E293B"/>
  </g>

  <!-- Right MMU Architecture Box -->
  <g transform="translate(650, 504)">
    <rect x="0" y="0" width="584" height="232" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="18" y="28" fill="#38BDF8" font-size="14" font-weight="700">第一性原理：CUDA VMM (cuMemMap) 如何彻底消灭碎片与查表税？</text>
    <text x="18" y="56" fill="#E2E8F0" font-size="12.5">① 激活值零碎片扩容 (expandable_segments:True)：</text>
    <text x="32" y="76" fill="#94A3B8" font-size="12">预留连续虚拟地址段 (cuMemAddressReserve)，按 2MB 物理页动态挂载 (cuMemMap)，</text>
    <text x="32" y="94" fill="#94A3B8" font-size="12">15µs 内把散落在显存各处的物理空洞拼成连续大张量，零数据拷贝、零 cudaFree！</text>
    <text x="18" y="124" fill="#6EE7B7" font-size="12.5">② vAttention 硬件页表连续 KV Cache (免除 PagedAttention 软件查表)：</text>
    <text x="32" y="144" fill="#94A3B8" font-size="12">为每个请求分配连续虚拟 KV 空间，由 GPU MMU 硬件完成分页翻译，标准 FlashAttention</text>
    <text x="32" y="162" fill="#94A3B8" font-size="12">免除软件 block_table 间接寻址算术，Attention 内核直接提速 +14.2%！</text>
    <text x="18" y="192" fill="#FCD34D" font-size="12.5">③ RL 同卡切换保 CUDA Graph 虚拟指针 (verl / SGLang CuMemAllocator)：</text>
    <text x="32" y="212" fill="#94A3B8" font-size="12">cuMemUnmap 卸载物理显存给 FSDP 训练，保留虚拟指针不变，唤醒后 0 秒复用 CUDA Graph！</text>
  </g>
</svg>
