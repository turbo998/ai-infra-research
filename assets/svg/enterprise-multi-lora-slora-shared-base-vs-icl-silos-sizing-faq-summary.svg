<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg636" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr636" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg636)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr636)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#636 企业百部门微调模型共池 (Multi-LoRA Serving · 128 Adapter 共享 70B 基座) vs. 16K ICL 与独立烟囱</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Enterprise Multi-LoRA Serving (128 Adapters on 1 Shared 70B Base via S-LoRA/Punica/vLLM) vs. 16K Few-Shot ICL &amp; Dedicated Silos</text>

  <!-- Left: 2 Anti-Patterns -->
  <rect x="48" y="120" width="368" height="330" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <text x="66" y="148" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">❌ 多部门定制化的两大破产反模式</text>
  <rect x="64" y="164" width="336" height="126" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="76" y="186" fill="#f87171" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">1. 一部门一合并实例 (Merged Weight Silos)</text>
  <text x="76" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 把 LoRA 合并回 70B 底座生成 128 个 70GB 模型</text>
  <text x="76" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 每个部门独占 2 张 H200 ➔ 需 256 张 H200！</text>
  <text x="76" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 长尾部门日均请求不足 1%，显卡 98% 时间空转</text>
  <text x="76" y="270" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 月租金高达 $819,200/月 (年烧 $983万)！</text>

  <rect x="64" y="302" width="336" height="134" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="76" y="324" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2. 硬塞 16K Few-Shot 示例替代微调 (ICL Bloat)</text>
  <text x="76" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 每次请求硬塞 50 个领域示例 (16,384 Tokens)</text>
  <text x="76" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 单请求 KV Cache 膨胀至 2.68 GB，挤爆 Decode 池</text>
  <text x="76" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 复杂垂域格式遵从率仅 82.4% (比 LoRA 低 15.2 pts)</text>
  <text x="76" y="408" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 仍需 24 张 H200 且首字延迟慢 3.8 倍！</text>

  <!-- Center/Right: S-LoRA / vLLM Multi-LoRA Architecture -->
  <rect x="432" y="120" width="720" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="452" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">🏆 黄金方案：S-LoRA / Punica 共享 70B 基座 + 统一分页池 (256卡 ➔ 8卡 · 省 96.9%!)</text>

  <rect x="452" y="164" width="218" height="156" rx="10" fill="#0f172a" stroke="#38bdf8"/>
  <text x="466" y="188" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">① LoRA 显存精确手算公式</text>
  <text x="466" y="210" fill="#cbd5e1" font-size="11.5">• 70B (80层, 7模块/层, r=32):</text>
  <text x="466" y="230" fill="#6ee7b7" font-size="11.5" font-weight="700">  单个 LoRA 仅占 266 MB (BF16)</text>
  <text x="466" y="250" fill="#cbd5e1" font-size="11.5">• 128 个部门全部 LoRA 总和：</text>
  <text x="466" y="268" fill="#cbd5e1" font-size="11.5">  128 × 266 MB = 34.0 GB (放DDR5)</text>
  <text x="466" y="288" fill="#34d399" font-size="11.5" font-weight="700">• HBM 仅常驻 Top-32 热适配器</text>
  <text x="466" y="306" fill="#34d399" font-size="11.5" font-weight="700">  仅占 8.5 GB (不到单卡 1.5%！)</text>

  <rect x="684" y="164" width="218" height="156" rx="10" fill="#0f172a" stroke="#10b981"/>
  <text x="698" y="188" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">② 异构混合批处理 (BGMV/SGMV)</text>
  <text x="698" y="210" fill="#cbd5e1" font-size="11.5">• 主干计算: 64 个不同部门请求拼成</text>
  <text x="698" y="230" fill="#cbd5e1" font-size="11.5">  1 个大 Batch 跑共享 70B FP8 GEMM</text>
  <text x="698" y="250" fill="#cbd5e1" font-size="11.5">• 旁路增量: Punica SGMV 算子并行</text>
  <text x="698" y="268" fill="#cbd5e1" font-size="11.5">  叠加各自请求的 Δy = x·A_i·B_i</text>
  <text x="698" y="288" fill="#6ee7b7" font-size="11.5" font-weight="700">• 单步附加耗时仅 +1.4 ms (+11%)</text>
  <text x="698" y="306" fill="#6ee7b7" font-size="11.5" font-weight="700">  P99 TPOT 稳定 14.8 ms！</text>

  <rect x="916" y="164" width="218" height="156" rx="10" fill="#0f172a" stroke="#a855f7"/>
  <text x="930" y="188" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">③ Unified Paging + GIE 亲和路由</text>
  <text x="930" y="210" fill="#cbd5e1" font-size="11.5">• 将 LoRA 权重块与 KV Cache 统一</text>
  <text x="930" y="230" fill="#cbd5e1" font-size="11.5">  纳入 Paged 块表管理 (零外碎片)</text>
  <text x="930" y="250" fill="#cbd5e1" font-size="11.5">• Envoy GIE 网关按 lora_id 亲和</text>
  <text x="930" y="270" fill="#cbd5e1" font-size="11.5">  路由至已缓存该适配器的 Pod</text>
  <text x="930" y="290" fill="#e9d5ff" font-size="11.5" font-weight="700">• 冷切加载耗时仅 1.8 ms (PCIe5)！</text>

  <rect x="452" y="334" width="682" height="102" rx="10" fill="#0f172a" stroke="#f59e0b"/>
  <text x="468" y="358" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">💡 为什么 Multi-LoRA 同时击败了“16K Few-Shot ICL”与“独立合并实例”？</text>
  <text x="468" y="382" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">1. 把 16K Few-Shot 示例内化进 266MB LoRA 权重后，单请求输入从 16,800 词缩至 800 词 (TTFT 快 6.4x，KV 省 95%)；</text>
  <text x="468" y="404" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. 128 个部门共享同一组 8×H200 (2×TP=4) 的 70B 底座，统计复用消除了 98% 的部门闲置算力！</text>

  <!-- Bottom Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #636 百部门 Multi-LoRA 共池核心收益 (128 个微调适配器 · 总峰值 30 QPS)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 垂域任务准确率: 97.6% (较 16K ICL 提升 +15.2 pts)   |   • P99 TPOT: 14.8 ms   |   • 适配器冷切延迟: 1.8 ms</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 集群总卡数: 256× H200 (独立合并实例 $81.92万/月) ➔ 8× H200 ($2.56万/月 · 立省 96.9% GPU · 年省 $952.3万)！</text>
</svg>
