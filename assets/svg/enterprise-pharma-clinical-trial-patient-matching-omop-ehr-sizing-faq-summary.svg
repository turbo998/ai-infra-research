<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520">
  <rect width="1100" height="520" fill="#0f172a"/>
  <text x="40" y="48" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700">#547 Pharma Clinical Trial Patient-Protocol Matching (10M EHR Patients)</text>
  <text x="40" y="76" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="14">OMOP SQL Filter (Prunes 94%) + 8B Negation-Aware EHR Feature Store + 70B Criterion Verifier Hits 96.8% Recall &amp; 98.2% Precision on 12 GPUs</text>
  <rect x="40" y="105" width="320" height="365" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
  <text x="60" y="138" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">A. Brute-Force 70B on Raw EHR Notes</text>
  <text x="60" y="168" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Eligibility Recall: 91.5%</text>
  <text x="60" y="196" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Precision: 76.4% (Negation/Family Confusion)</text>
  <text x="60" y="224" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Fleet: 480x H200 GPUs</text>
  <text x="60" y="252" fill="#fca5a5" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">• Cost: $1,440,000 / mo</text>
  <rect x="390" y="105" width="320" height="365" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="138" fill="#fcd34d" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">B. Structured ICD-10 SQL Only</text>
  <text x="410" y="168" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Eligibility Recall: 38.0% (Misses 62% Notes)</text>
  <text x="410" y="196" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Precision: 89.0%</text>
  <text x="410" y="224" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Fleet: 0 GPUs (SQL Warehouse)</text>
  <text x="410" y="252" fill="#fcd34d" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">• Misses Unstructured Biomarkers &amp; ECOG</text>
  <rect x="740" y="105" width="320" height="365" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="760" y="138" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">C. OMOP SQL + 8B Feature + 70B Verify</text>
  <text x="760" y="168" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Eligibility Recall: 96.8% (+58.8 pts vs SQL)</text>
  <text x="760" y="196" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Precision: 98.2% (+21.8 pts vs Brute 70B)</text>
  <text x="760" y="224" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="13">• Fleet: 12x H200 GPUs (-97.5% GPUs)</text>
  <text x="760" y="252" fill="#6ee7b7" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700">• Cost: $36,000 / mo (-97.5% Cost)</text>
</svg>
