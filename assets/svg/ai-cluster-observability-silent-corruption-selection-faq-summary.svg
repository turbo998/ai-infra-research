<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg21" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent21" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg21)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent21)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">万卡 AI 集群可观测性、慢节点与静默数据损坏 (SDC) 排障选型一图流 (Round 21 · 2,048×H100)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">基础轮询 (145m 排障 / 68.4% Goodput) vs. DCGM+XID (82.2%) vs. FlightRecorder+NCCL RAS (650ms 定位) vs. 在线 SDC 指纹校验 (96.4%, 月省 $1.05M)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Patient Zero & Silent Data Corruption Physics -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#fcd34d" font-size="16" font-weight="800">① 为什么 1 张卡报错会让 2,048 张卡全部报 Timeout？什么是静默位翻转 (SDC)？</text>

  <rect x="44" y="168" width="510" height="80" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 传统监控失明: 2,048 卡同时报 NCCL Timeout，人工二分查找耗时 145 分钟</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 1 张卡死锁或降频，其余 2,047 张正常卡在 All-Reduce 屏障干等 30 分钟后同时抛出相同异常</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 运维被迫对 256 台服务器做二分法 (Bisect) 重启排查，单次故障烧掉 $12,373，Goodput 仅 68.4%</text>

  <rect x="44" y="260" width="510" height="82" rx="8" fill="#422006" stroke="#eab308"/>
  <text x="58" y="282" fill="#fde047" font-size="13.5" font-weight="700">🟨 Tier 2 DCGM + XID 自动隔离: 能抓硬件显存报错，但抓不住灰色慢节点与 ALU SDC</text>
  <text x="58" y="304" fill="#fef08a" font-size="12">• 秒级捕获 XID 48/79/94 与 HBM ECC 双比特错误 (MTTR 降至 12.5m)，但光模块闪断/PFC 风暴无 XID</text>
  <text x="58" y="324" fill="#fef08a" font-size="12">• ⚠️ 更致命的是：Tensor Core ALU 内部计算单元无 ECC 保护，静默位翻转 (SDC) 检出率为 0.0%！</text>

  <rect x="44" y="354" width="510" height="86" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="376" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 PyTorch FlightRecorder + NCCL RAS: 650 毫秒精准锁定“零号病人”！</text>
  <text x="58" y="398" fill="#d1fae5" font-size="12">• 每个 Rank 在环形缓冲区记录每次集合通信 op_id 与 CUDA Event 时间戳</text>
  <text x="58" y="420" fill="#d1fae5" font-size="12">• 假死发生时 NCCL RAS 带外守护进程遍历依赖图，0.65 秒揪出唯一未进入 #op_id 的慢节点 (Goodput 91.5%)</text>

  <rect x="44" y="452" width="510" height="92" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="474" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 在线张量指纹 + Golden-Step 确定性影子校验: 99.6% 拦截静默数据损坏！</text>
  <text x="58" y="496" fill="#f3e8ff" font-size="12">• 在梯度 All-Reduce 前比对跨 DP 副本激活范数与周期性确定性 Golden Batch 逐比特 Hash</text>
  <text x="58" y="516" fill="#f3e8ff" font-size="12">• 仅需 0.35% 算力开销，在坏梯度污染全局权重前当场隔离 SDC 坏卡，Goodput 高达 96.4%，</text>
  <text x="58" y="534" fill="#6ee7b7" font-size="12" font-weight="700">  在 2,048 卡集群上每月净挽回 $1,046,528.00 (-88.6% 故障损耗)！</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档集群可观测性与 SDC 防护定量对比 (2,048×H100 · 月租 $3.74M)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">可观测性与排障架构档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">根因定位 / MTTR</text>
  <text x="948" y="190" fill="#cbd5e1" font-size="12" font-weight="700">慢节点 / SDC 检出</text>
  <text x="1058" y="190" fill="#cbd5e1" font-size="12" font-weight="700">Goodput / 月浪费</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: 基础 Prometheus + 人工二分</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">30s nvidia-smi 轮询 · 无法区分主犯与从犯</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">8,700 s 定位</text>
  <text x="828" y="256" fill="#fca5a5" font-size="11">MTTR 145.0 min ✕</text>
  <text x="948" y="236" fill="#fca5a5" font-size="12">12.0% 慢节点</text>
  <text x="948" y="256" fill="#f87171" font-size="11">0.0% SDC ✕</text>
  <text x="1058" y="236" fill="#fca5a5" font-size="12" font-weight="700">68.4% Goodput</text>
  <text x="1058" y="256" fill="#cbd5e1" font-size="11">浪费 $1.18M/月</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: DCGM 硬件遥测 + XID 自愈</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">捕获硬故障 · 漏检通信死锁与 ALU 位翻转</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">45.0 s 定位</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">MTTR 12.5 min</text>
  <text x="948" y="312" fill="#fde047" font-size="12">48.0% 慢节点</text>
  <text x="948" y="332" fill="#f87171" font-size="11">0.0% SDC ✕</text>
  <text x="1058" y="312" fill="#fde047" font-size="12" font-weight="700">82.2% Goodput</text>
  <text x="1058" y="332" fill="#6ee7b7" font-size="11">省 $515.8k/月</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: FlightRecorder + NCCL RAS</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">集合通信依赖图亚秒级定位零号病人</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">0.65 s 定位 ✅</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">MTTR 1.80 min</text>
  <text x="948" y="388" fill="#34d399" font-size="12" font-weight="700">98.5% 慢节点 ✅</text>
  <text x="948" y="408" fill="#fde047" font-size="11">15.0% SDC ⚠️</text>
  <text x="1058" y="388" fill="#6ee7b7" font-size="12" font-weight="700">91.5% Goodput</text>
  <text x="1058" y="408" fill="#6ee7b7" font-size="11">省 $863.4k/月</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: Tier 3 + 在线 SDC 指纹校验</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">算子范数比对 + Golden-Step 影子验证 (0.35% 开销)</text>
  <text x="828" y="464" fill="#34d399" font-size="12" font-weight="700">0.65 s 定位 🏆</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">MTTR 0.85 min</text>
  <text x="948" y="464" fill="#34d399" font-size="12" font-weight="700">99.4% 慢节点 🏆</text>
  <text x="948" y="484" fill="#34d399" font-size="11" font-weight="700">99.6% SDC 🏆</text>
  <text x="1058" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">96.4% Goodput</text>
  <text x="1058" y="484" fill="#34d399" font-size="11" font-weight="700">省 $1.05M/月!</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 8,192 卡扩展拐点：基础监控 Goodput 崩盘至 42.0%，Tier 4 稳守 94.8% (领先 +52.8 个百分点)!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#10b981"/>
  <text x="44" y="606" fill="#6ee7b7" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for 1,000–10,000+ GPU Cluster Observability）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fde047">DCGM + XID (Tier 2) 只能抓硬件显存/掉卡硬故障</tspan>；<tspan font-weight="700" fill="#6ee7b7">抓假死与慢节点必开 FlightRecorder + NCCL RAS (Tier 3)</tspan>，650ms 锁定零号病人。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">&ge;1,024 卡预训练必上 Tier 4 (在线张量指纹 + Golden-Step 确定性校验)</tspan>：防 Tensor Core 静默位翻转污染权重导致整天训练报废。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/ai_cluster_observability_sdc_selection/results.json · tests/test_ai_cluster_observability_sdc_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
