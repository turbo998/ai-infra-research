<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg23" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent23" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg23)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent23)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">百至千级垂类微调模型 (Multi-LoRA) 在线高密推理选型一图流 (Round 23 · 128×70B LoRA)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">独立合并副本 (128卡, $233.6k/月) vs. 串行热切换 (TTFT 1,840ms) vs. vLLM BGMV (4卡) vs. S-LoRA 统一分页 + MBGMM (4卡, 省 $226.3k/月)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Multi-LoRA Decomposition & Unified Paging -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#6ee7b7" font-size="16" font-weight="800">① 为什么严禁把 LoRA 合并回底座模型部署？如何让 4 张卡同时服务 128 个微调模型？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 合并权重独立部署 &amp; Tier 2 串行热切换的两极灾难</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• Tier 1 将 320MB LoRA 合并进 70GB 底座，128 个租户被迫占用 128 张 GPU (月烧 $233,600，利用率 6.8%)</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• Tier 2 按请求串行切换适配器，打碎 Continuous Batching，队头阻塞使 P99 TTFT 飙至 1,840ms ✕</text>

  <rect x="44" y="258" width="510" height="84" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="280" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 vLLM Multi-LoRA (Punica BGMV): 共享底座 GEMM + 独立旁路增量</text>
  <text x="58" y="302" fill="#d1fae5" font-size="12">• 数学分解 Y = X·W_0 + (X·A_i)·B_i：占 98% 计算量的底座 X·W_0 全 Batch 合并执行 1 次大矩阵乘法！</text>
  <text x="58" y="324" fill="#d1fae5" font-size="12">• 仅占 2% 的各租户 A_i/B_i 通过 BGMV 算子并行追加，128 卡瞬间缩至 4 卡 ($7,300/月，省 96.9%)</text>

  <rect x="44" y="354" width="510" height="96" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="376" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 S-LoRA 统一分页显存池 + 异构秩 MBGMM 算子: 吞吐再提 1.57x!</text>
  <text x="58" y="398" fill="#f3e8ff" font-size="12">• 将 KV Cache 块与 LoRA 权重页放入同一个 Unified Paged HBM Pool，彻底消除固定槽位碎片</text>
  <text x="58" y="418" fill="#f3e8ff" font-size="12">• 定制 MBGMM 内核单次融合计算不同 Rank (r=8/16/32/64) 的异构适配器 + Attention 层异步预取</text>
  <text x="58" y="438" fill="#6ee7b7" font-size="12" font-weight="700">• P99 TTFT 压至 92.0ms，QPS 达 264.0 req/s (比串行快 6.95x)，每月净省 $226,300!</text>

  <rect x="44" y="462" width="510" height="82" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="58" y="484" fill="#93c5fd" font-size="13" font-weight="700">🔗 网关协同铁律：LoRA-ID 亲和路由 + 共享底座 System Prompt 前缀缓存</text>
  <text x="58" y="506" fill="#cbd5e1" font-size="12">• 在多实例集群上按 lora_id 一致性哈希路由，避免同一适配器在所有实例重复驻留</text>
  <text x="58" y="526" fill="#cbd5e1" font-size="12">• 未挂载 LoRA 的底层 Embedding/首层前缀可跨不同 LoRA 租户共享 RadixCache</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档 Multi-LoRA 推理架构定量对比 (128 个 70B 垂类适配器)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">Multi-LoRA 部署架构档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">所需 GPU 卡数</text>
  <text x="945" y="190" fill="#cbd5e1" font-size="12" font-weight="700">P99 TTFT / TPOT</text>
  <text x="1055" y="190" fill="#cbd5e1" font-size="12" font-weight="700">吞吐 / 月度账单</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: 合并权重独立副本部署</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">W' = W_0 + B·A · 平均利用率仅 6.8%</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">128 GPUs ✕</text>
  <text x="828" y="256" fill="#cbd5e1" font-size="11">(1.0x 基准)</text>
  <text x="945" y="236" fill="#f8fafc" font-size="12">85.0 ms</text>
  <text x="945" y="256" fill="#cbd5e1" font-size="11">TPOT 11.2 ms</text>
  <text x="1055" y="236" fill="#fca5a5" font-size="12" font-weight="700">$233,600 / 月</text>
  <text x="1055" y="256" fill="#cbd5e1" font-size="11">320.0 req/s</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: 共享底座 + 串行热切换</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">不同 LoRA 无法拼 Batch · 队头阻塞</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">8 GPUs (16x)</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">利用率 24.5%</text>
  <text x="945" y="312" fill="#f87171" font-size="12" font-weight="700">1,840.0 ms ✕</text>
  <text x="945" y="332" fill="#fca5a5" font-size="11">TPOT 34.5 ms ✕</text>
  <text x="1055" y="312" fill="#fde047" font-size="12" font-weight="700">$14,600 / 月</text>
  <text x="1055" y="332" fill="#fca5a5" font-size="11">仅 38.0 req/s</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: vLLM 固定槽位 Multi-LoRA</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">Punica BGMV 算子 · 固定显存槽位</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">4 GPUs (32x ✅)</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">利用率 78.5%</text>
  <text x="945" y="388" fill="#6ee7b7" font-size="12" font-weight="700">165.0 ms ✅</text>
  <text x="945" y="408" fill="#6ee7b7" font-size="11">TPOT 16.2 ms ✅</text>
  <text x="1055" y="388" fill="#6ee7b7" font-size="12" font-weight="700">$7,300 (-96.9%)</text>
  <text x="1055" y="408" fill="#6ee7b7" font-size="11">168.0 req/s</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: S-LoRA 统一分页 + MBGMM</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">KV+LoRA 统一页池 + 异构秩融合 + 异步预取</text>
  <text x="828" y="464" fill="#34d399" font-size="12" font-weight="700">4 GPUs (32x 🏆)</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">利用率 91.2%</text>
  <text x="945" y="464" fill="#e9d5ff" font-size="12" font-weight="700">92.0 ms 🏆</text>
  <text x="945" y="484" fill="#34d399" font-size="11" font-weight="700">TPOT 12.4 ms 🏆</text>
  <text x="1055" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">$7,300 (-96.9%)</text>
  <text x="1055" y="484" fill="#34d399" font-size="11" font-weight="700">264.0 req/s (1.57x)</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 512 个并发活跃 LoRA 压测：固定槽位 (Tier 3) 换页退化至 340ms，S-LoRA 统一分页稳守 118ms!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#10b981"/>
  <text x="44" y="606" fill="#6ee7b7" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for Multi-Tenant LoRA Serving）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fca5a5">严禁将多租户 LoRA 合并回底座模型独立部署 (Tier 1)</tspan>；<tspan font-weight="700" fill="#6ee7b7">&le;32 个同秩适配器直接开 vLLM Multi-LoRA (Tier 3)</tspan>，卡数省 32 倍。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">百至千级异构 Rank 适配器混部必上 Tier 4 (S-LoRA 统一分页池 + MBGMM + LoRA 亲和路由)</tspan>，月省 $226,300 (-96.9%)。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/multi_lora_serving_selection/results.json · tests/test_multi_lora_serving_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
