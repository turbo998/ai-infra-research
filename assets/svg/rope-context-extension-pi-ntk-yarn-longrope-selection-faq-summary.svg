  <rect width="1280" height="760" fill="url(#bg186)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="420" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="262" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 186 · ROPE CONTEXT EXTENSION: PI vs. NTK-AWARE vs. YARN vs. LONGROPE</text>
  <text x="488" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">RoPE 旋转位置编码上下文外推（8K→128K→2M）选型一图流：PI vs. NTK vs. YaRN vs. LongRoPE</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">为什么线性插值（PI）会让大模型“近视”导致代码能力暴跌 8.4 分？“高频不缩放保局部 + 低频插值 + 注意力温度”实现 128K 99.4% 召回</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc186)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="224" height="24" rx="6" fill="#7f1d1d"/>
  <text x="180" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 线性位置插值 (Linear PI)</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">高频指针压慢 16x 导致近视</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">所有维度统一除以 s=16</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制缺陷：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">负责区分相邻词顺序的高频“毫秒针”被压慢</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">16 倍，局部语法糊成一团，代码准确率暴跌</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 高频局部分辨率: <tspan fill="#f87171" font-weight="700">仅剩 6.25% ✕</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 4K 短文本准确率掉点: <tspan fill="#f87171" font-weight="700">-8.4 pts ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 密钥召回率: <tspan fill="#f87171" font-weight="700">72.0%</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 困惑度 PPL: <tspan fill="#f87171" font-weight="700">8.9</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁对 16x 跨度直接做全局线性插值</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="228" height="24" rx="6" fill="#78350f"/>
  <text x="482" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · NTK-Aware 基频缩放</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">调大 rope_theta 至 500,000</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">低频多压、高频少压 · 缺温度补偿</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么到 128K 仍会发散？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">虽然保护了部分高频，但 128K 个 Token 分摊</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Softmax 导致注意力熵过度平坦化！</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 高频局部分辨率: <tspan fill="#fbbf24" font-weight="700">78.5%</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 4K 短文本准确率掉点: <tspan fill="#fbbf24" font-weight="700">-2.1 pts</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 密钥召回率: <tspan fill="#fbbf24" font-weight="700">86.5%</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 困惑度 PPL: <tspan fill="#fbbf24" font-weight="700">6.4</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 适合 32K~64K 轻量扩窗，128K 需温度</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="232" height="24" rx="6" fill="#0c4a6e"/>
  <text x="784" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · YaRN (分段斜坡 + 温度缩放)</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">高频零缩放 + mscale=1.277</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">DeepSeek-V3 / Qwen 生产外推方案</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制突破：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">波长短于原窗口的高频维 100% 保持原样；</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">并对 Q/K 乘以 0.1*ln(s)+1 锐化注意力！</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 高频局部分辨率: <tspan fill="#38bdf8" font-weight="800">100.0% (无损 ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 4K 短文本准确率掉点: <tspan fill="#38bdf8" font-weight="800">-0.4 pts ✅</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 密钥召回率: <tspan fill="#38bdf8" font-weight="800">96.8% ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 困惑度 PPL: <tspan fill="#38bdf8" font-weight="800">5.3 ✅</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 免微调/轻量微调扩至 128K 首选</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · LongRoPE 非均匀进化搜索</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">短文零掉点 · 128K 召回 99.4%</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">逐维进化搜索 + 起始 Token 位置锚定</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (128K ~ 2M 极限扩窗)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">对 64 个旋转维度对独立进化搜索最优缩放</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">系数，且开头 Sink 词完全不缩放位置！</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 高频局部分辨率: <tspan fill="#34d399" font-weight="800">100.0% 🏆</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 4K 短文本准确率掉点: <tspan fill="#34d399" font-weight="800">0.0 pts (完全无损 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 密钥召回率: <tspan fill="#34d399" font-weight="800">99.4% 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 困惑度 PPL: <tspan fill="#34d399" font-weight="800">5.0 🏆</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 128K~2M 超长上下文扩展黄金标准</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：用“64 根表针的钟表”秒懂 RoPE 外推的三大物理定律</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 定律 1：绝不能把“快针（高频维）”和“慢针（低频维）”一起除以 s</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• RoPE 的第 0 维就像“毫秒针”（在 8K 内转上千圈，专门分辨相邻两个词谁前谁后）；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 第 63 维就像“世纪针”（在 8K 内只转 30 度，专门衡量整篇文档的宏观距离）；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• **正确做法 (YaRN / LongRoPE)**：只把没转满一圈的“慢针”按比例压慢，快针 100% 不动！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 定律 2：超过 32K 必须开启注意力温度锐化 (`mscale = 0.1*ln(s)+1`)</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 当上下文从 8K 拉长 16 倍到 128K 时，Softmax 分母里的指数项数量暴增 16 倍，</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  导致关键目标词的注意力概率被成千上万个背景词“稀释（Entropy Dilution）”；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 对 Query/Key 乘以 `mscale = 1.277`（等效降低 Softmax 温度），直接找回 10.3% 召回率 🏆！</text>
</svg>
