  <rect width="1200" height="680" fill="url(#bgGrad387)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级大模型结构化输出 (Structured Outputs) 与 JSON Schema 约束解码架构选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：XGrammar/llguidance 预编译掩码 + 推理字段前置契约 (Reasoning-First)，实现 100% 语法合法、97.8% 业务准确率且 P99 快 5.05x</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 387 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: Prompt 软提醒 + 重试</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 仅在 Prompt 写“只输出合法 JSON”</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 漏转义双引号、多逗号、乱套 Markdown</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 首轮 JSON 语法合格率：90.6% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 业务语义准确率：81.2% ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• P99 延迟：4,850 ms (报错重试拖死) ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">2,000万次月成本：$18,600 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：9.4% 的解析异常直接打崩下游</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">Java/Go 微服务强类型反序列化接口</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 传统 CPU 逐词 CFG 掩码</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 每吐 1 个词在 CPU 现算 128K 词表掩码</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 造成严重 GPU 等 CPU 的同步卡顿</text>
  <text x="332" y="212" fill="#34d399" font-size="12" font-weight="700">• 首轮 JSON 语法合格率：100.0%</text>
  <text x="332" y="232" fill="#fde68a" font-size="12" font-weight="700">• 单步掩码额外开销：+28.0 ms/tok ✕</text>
  <text x="332" y="252" fill="#fde68a" font-size="12">• P99 延迟：3,420 ms ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">2,000万次月成本：$24,200 ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">反模式：早期无预编译约束引擎的通病</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">语法虽然 100% 对了，但 GPU 吞吐腰斩</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: XGrammar + 朴素字段序</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• XGrammar / llguidance 预编译字节自动机</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 单步掩码开销仅 0.04 ms (近乎零损耗)</text>
  <text x="624" y="212" fill="#34d399" font-size="12" font-weight="700">• 首轮 JSON 语法合格率：100.0% ✅</text>
  <text x="624" y="232" fill="#fde68a" font-size="12" font-weight="700">• 业务语义准确率：84.5% (先结论后推理)</text>
  <text x="624" y="252" fill="#34d399" font-size="12">• P99 延迟：1,180 ms ✅</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">2,000万次月成本：$11,200 ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">大坑：Schema 第 1 个字段写 is_approved</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">逼迫模型“先盲猜布尔值，再编造理由”！</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 推理前置+XGrammar+校验🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 字段序：先写 rationale_steps 再写枚举结论</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 首轮 JSON 语法合格率：100.0% 🏆</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 业务语义准确率：97.8% 🏆 (+13.3pts)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• P99 延迟：960 ms 🏆 (快 5.05x)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• Pydantic 跨字段业务规则确定性复核</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">2,000万次月成本：$9,800 (省47.3%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级 ERP/CRM 微服务集成终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">语法 100% 严丝合缝 + 逻辑推理零降智</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么很多团队开了 Structured Outputs 准确率反而掉了 13%？架构师必懂的三大 JSON Schema 铁律</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad387)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 字段顺序就是思维链顺序（Reasoning-First Key Order）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 自回归模型按 JSON 字段定义的先后顺序逐字生成！</text>
  <text x="44" y="568" fill="#fca5a5" font-size="12.5">• ❌ 错误顺序：`{"risk_level": "HIGH", "analysis": "..."}`（先瞎猜结论）</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">• ✅ 黄金顺序：`{"step_by_step_evidence": "...", "risk_level": "HIGH"}`</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 仅把推理字段挪到枚举结论前面，业务准确率直接暴涨 +13.3 pts！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 零开销语法引擎选型（XGrammar / llguidance）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 在 vLLM V1 / SGLang 中显式指定 `guided_decoding_backend="xgrammar"`</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  或 `llguidance`：将固定 Schema 预编译并缓存在内存中。</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 严禁每次请求动态随机改 Schema 字段名（导致反复重编译 FSM）！</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 将嵌套层级控制在 &lt;= 3 层，禁用无界递归与开放式 `dict[str, Any]`。</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 语法合法 != 业务合法（Pydantic `@model_validator`）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• JSON Schema 只能保证“`start_date` 和 `end_date` 都是字符串”，</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">  但管不了“`end_date` 必须晚于 `start_date`”或“折扣率 &lt;= 0.3”！</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• 在网关后置毫秒级 Pydantic 跨字段业务校验器，</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">• 对违反业务不变量的 1.5% 边界请求精准返回字段级报错自愈！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 387 合成标定算例 (independently_reproduced=false)</text>
</svg>
