<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#10B981" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级 Embedding 与 Cross-Encoder Reranker 推理底座选型：TEI / Infinity vs. vLLM vs. Triton</text>
  <text x="52" y="94" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15">攻克 RAG 隐藏算力黑洞（单次查询重排 50 条切片 = 1.05 万 Tokens）：零填充 Unpadded FlashAttention (`cu_seqlens`) 提速 6.8 倍！</text>

  <!-- Left: Why Reranking Is the Hidden Bottleneck in RAG -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么小小一个 560M Reranker 会把 GPU 吃满并拖慢首字？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 隐藏乘数效应：1 次用户提问 = 50 次 `[Query + Chunk]` 交叉编码！</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 350 QPS 的 RAG 系统每秒需重排 350 × 50 = 17,500 条文档对（每秒吞吐 367 万 Tokens！）</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 手写 FastAPI + PyTorch (Tier 1) 卡在 Python GIL 分词与 `[PAD]` 矩形填充，P99 高达 168ms！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 矩形 Padding 灾难：1 条 512 字长切片害死同批 49 条短切片</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 传统 Batch 把 `[64, 120, ..., 512]` 强行补齐成 `[50, 512]` 矩形张量，59% 算力在算无效 `[PAD]`！</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 支撑 350 RAG QPS 竟需 36 张 L40S GPU ($39,600/月)！</text>

  <!-- Right: TEI / Infinity / vLLM Ragged FlashAttention Architecture -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 零填充 Unpadded FlashAttention + Token 预算合批 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 一维扁平化拼接 (`cu_seqlens` Unpadded FlashAttention-2/3)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">将 50 条不等长序列首尾相接拼成 1D 紧凑张量 `[Total_Tokens, D]`，彻底消灭 100% `[PAD]` 浪费！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② Rust 多线程分词 + 按长度排序 Token-Budget 动态合批</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">`HuggingFace TEI` (Rust Candle/ORT) 与 `Infinity` 以 `max_batch_tokens=16384` 榨干 Tensor Core</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 双轨模型选型：BERT 类选 `TEI/Infinity`；7B LLM 类选 `vLLM --task score`</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Top-50 重排 P99 从 168ms 骤降至 14.5ms (-91.4%)，GPU 卡数从 36 张砍至 6 张！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 350 RAG QPS（每秒重排 17,500 条文档对 · BGE-M3 + Reranker-v2-m3）四档对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Embedding / Reranker 推理引擎</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Top-50 重排 P99</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单卡吞吐 (条/s)</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">所需 L40S 卡数</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">NDCG@10 精度</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度集群成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 手写 FastAPI + PyTorch 矩形 Padding (`[B, 512]`)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">168.0 ms ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">620 条/s</text>
  <text x="790" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">36 GPUs ✕</text>
  <text x="950" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">86.4%</text>
  <text x="1110" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$39,600/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: NVIDIA Triton + ONNX Runtime (矩形动态合批 FP16)</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">64.0 ms</text>
  <text x="620" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">1,480 条/s</text>
  <text x="790" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">16 GPUs</text>
  <text x="950" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">86.4%</text>
  <text x="1110" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$17,600/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: vLLM (`--task embed/score` 适配 Decoder 类 4B/7B 重排)</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">28.5 ms ✓</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">2,450 条/s ✓</text>
  <text x="790" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">10 GPUs</text>
  <text x="950" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">88.2% ✓</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$11,000/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): HuggingFace TEI / Infinity (零填充 cu_seqlens + FP8)</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">14.5 ms (-91%) ✓</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">4,200 条/s (6.8x)</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">6 GPUs (-83.3%) ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">86.3% ✓</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$6,600/mo (-83%)</text>
</svg>
