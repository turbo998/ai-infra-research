  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: 65/25/10 三级难度路由 + 多轮自动剥离 &lt;think&gt; 块</text>
  <text x="435" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">960 Tok ✓</text>
  <text x="585" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">820 槽位 ✓</text>
