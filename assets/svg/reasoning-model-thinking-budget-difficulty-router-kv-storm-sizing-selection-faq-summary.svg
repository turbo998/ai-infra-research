  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 一刀切硬截断 max_tokens=1024 (复杂题未想完直接腰斩)</text>
  <text x="435" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">820 Tok</text>
  <text x="585" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">740 槽位</text>
