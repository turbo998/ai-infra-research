  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): 三级难度路由 + 动态 &lt;/think&gt; 预算门控 + 原生 MTP 投机加速</text>
  <text x="435" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">780 Tok 🏆</text>
