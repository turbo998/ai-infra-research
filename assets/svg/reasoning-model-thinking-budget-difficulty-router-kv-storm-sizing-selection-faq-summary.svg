<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #403 · REASONING MODEL (&lt;THINK&gt;) BUDGET GOVERNANCE, DIFFICULTY ROUTING &amp; KV STORM SIZING</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">推理大模型（DeepSeek-R1/o3/QwQ）思维链预算治理、难度分级路由与 KV 风暴防护</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">为什么把普通对话模型换成 R1 后并发 KV 显存会暴涨 8.5 倍？如何用三级难度路由 + 动态 &lt;/think&gt; 门控省下 78% 算力？</text>

  <!-- Left Box: Little's Law Quadratic KV Storm Equation -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 为什么思维链 (CoT) 会引发 Little's Law “二次方 KV 显存风暴”？</text>
  <rect x="76" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">E2EL = TTFT + (N_think + N_ans) * TPOT   (N_think 暴涨 6~10x!)</text>
  <text x="90" y="242" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">B_active = RPS * E2EL                    (在途并发槽位同步暴涨 6~10x!)</text>
  <text x="90" y="260" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">M_KV_total = B_active * (S_in + 0.5*(N_think+N_ans)) * KV_bytes/tok</text>
  <text x="76" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 双重乘积效应：输出变长既拉长了驻留时间 B_active，又增大了单会话序列长度</text>
  <text x="76" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 灾难现场：65% 简单翻译/抽取请求被 R1 过度思考 3,500 词，吞掉 72% GPU 预算</text>
  <text x="76" y="346" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 破解之道：入口 3ms 语义难度分类器 + 分档 Thinking Budget + MTP 加速！</text>

  <!-- Right Box: 3-Tier Difficulty Routing & Budget Enforcer -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 三级难度路由 (Difficulty Router) 与多轮剥离 &lt;think&gt; 铁律</text>
  <rect x="634" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">L1 简单任务 (65% 流量): Fast / Non-Thinking 模式 (Budget = 0 think tok)</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">L2 中等分析 (25% 流量): 受控思考模式 (Budget &lt;= 1,024 think tok)</text>
  <text x="648" y="260" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">L3 复杂数学/代码 (10%): 深度思考模式 (8K~16K think tok + KV Forking)</text>
  <text x="634" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 动态早停门控：达到思考预算或置信度收敛时自动注入 &lt;/think&gt; 引导总结输出</text>
  <text x="634" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 多轮历史瘦身铁律：下一轮请求严禁把上一轮冗长的 &lt;think&gt;..&lt;/think&gt; 塞回上下文！</text>
  <text x="634" y="346" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：准确率保持 99.4%，峰值在途 KV 槽位从 2,450 压至 580 (-76.3%)！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档推理大模型 (Reasoning Model) 预算治理与路由架构实效对比 (40 RPS 生产流量)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
