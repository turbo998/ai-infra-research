<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业测试时计算扩展 (Test-Time Compute) 与“三档思考预算路由 (Thinking Budget Router)”选型 (#482)</text>
  <text x="28" y="58" class="sub">终结“问一句你好也自我反思 4,000 个 Token (过度思考 Overthinking)”导致的 4 倍 GPU 爆仓：三档难度分级路由立省 75% 卡数</text>

  <!-- Left Panel: The Overthinking Capacity Disaster -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么把线上接口全量切到 DeepSeek-R1 / QwQ 思考模式会让集群瞬间瘫痪？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 全量无界长思维链 (Always-On Unbounded CoT = 64 张 H200 ✕)</text>
  <text x="56" y="164" class="mono">• 企业真实流量中: 70% 是简单提取/翻译/FAQ，仅 10% 是高难数学/架构推演；</text>
  <text x="56" y="184" class="mono">• 若全量开启无界 &lt;think&gt;，平均输出从 520 tok 暴涨 12.4 倍至 6,450 tok！</text>
  <text x="56" y="202" class="mono">• 根据 Little's Law: E2EL 飙至 74s -&gt; 常驻并发翻 12 倍，需 64 张卡！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师解法：三档难度分级路由器 + 动态思考 Token 预算阀门 (🏆)</text>
  <text x="56" y="268" class="mono">• AI Gateway 前置 86M/0.5B 难度分类器 (耗时 3ms)，将请求分流至三档预算：</text>
  <text x="56" y="288" class="mono">  - 70% 简单任务: 注入 &lt;think&gt;\n&lt;/think&gt; 零思考直出 (0 Thinking Tokens)</text>
  <text x="56" y="308" class="mono">  - 20% 中等任务: 限额 1,024 思考预算 | 10% 困难任务: 开放 8,192 满血思考！</text>

  <!-- Right Panel: 4 Test-Time Compute Strategies -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种测试时计算扩展策略定量对标 (20 RPS 生产负载)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 全量无界长思维链 (100% 请求跑满 6,450 平均输出 Token)</text>
  <text x="638" y="158" class="mono">• 复杂题准确率: 94.2% | 平均延迟: 74.0s ✕ | 需 H200: 64卡 ✕ | $9.80/千次</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 并行 Best-of-N (N=8 并发采样 + PRM 过程奖励模型重排)</text>
  <text x="638" y="214" class="mono">• 复杂题准确率: 92.8% | 平均延迟: 14.5s ✓ | 需 H200: 72卡 ✕ | $11.40/千次</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 纯快思考非推理模式 (100% 关闭 &lt;think&gt;，仅输出 520 Token)</text>
  <text x="638" y="270" class="mono">• 复杂题准确率: 68.5% ✕ | 平均延迟: 6.2s | 需 H200: 8卡 | $0.78/千次</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 三档难度路由 (70%零思考 / 20% 1K思考 / 10% 8K思考) (推荐 🏆)</text>
  <text x="638" y="326" class="mono">• 复杂题准确率: 93.9% 🏆 | 延迟: 12.8s 🏆 | 需 H200: 16卡 (-75%) | $1.76/千次</text>

  <!-- Bottom Panel: Serial CoT vs Parallel Best-of-N & Budget Forcing Math -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 串行长思维链 vs. 并行 Best-of-N 延迟/算力权衡与“思考预算强制收敛 (Budget Forcing)”公式</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 加权平均思考 Token 与 Little's Law</text>
  <text x="58" y="464" class="mono">• T_out_avg = p_easy * 400 + p_med * (1024+500)</text>
  <text x="58" y="484" class="mono">              + p_hard * (6000+800)</text>
  <text x="58" y="504" class="mono">  = 0.7*400 + 0.2*1524 + 0.1*6800 = 1,180 tok</text>
  <text x="58" y="526" class="txt">• 相比无脑全开 (6,450 tok)，加权输出直接削减</text>
  <text x="58" y="546" class="txt">  81.7%，所需 GPU 从 64 卡直降至 16 卡！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: 什么时候用并行 Best-of-N 替代串行 CoT？</text>
  <text x="436" y="464" class="mono">• 串行 8K CoT: 必须串行解码 8,000 步，哪怕</text>
  <text x="436" y="484" class="mono">  TPOT=10ms 也要整整 80 秒才能出最终答案！</text>
  <text x="436" y="504" class="mono">• 并行 Best-of-8 (每条 1,000 步): 共享同一次</text>
  <text x="436" y="524" class="mono">  Prompt Prefill，8 条分支在同一 Batch 内并发</text>
  <text x="436" y="544" class="mono">  解码 1,000 步，仅需 14.5 秒即出高准答案！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: 思考预算强制收敛 (Budget Forcing)</text>
  <text x="814" y="464" class="mono">• 痛点: 直接设 max_tokens=1024 会把思考过程</text>
  <text x="814" y="484" class="mono">  腰斩在 &lt;think&gt; 里，导致正文字一个没吐！</text>
  <text x="814" y="504" class="mono">• 架构师解法 (Soft Thinking Budget Stop):</text>
  <text x="814" y="524" class="mono">  当 &lt;think&gt; 内部计数达 960 Token 时，引擎自动</text>
  <text x="814" y="544" class="mono">  强制拼接 "\n思考完毕。&lt;/think&gt;\n" 并预留</text>
  <text x="814" y="564" class="mono">  512 Token 预算专供最终正式回答生成！</text>
</svg>
