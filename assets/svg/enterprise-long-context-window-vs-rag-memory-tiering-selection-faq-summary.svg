  <text x="65" y="210" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 1 Stuffing 250K Tokens into 1M Window Every Turn:</text>
  <text x="80" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">6,850ms P95 TTFT, 74.2% middle-needle accuracy &amp; $385K/mo bill</text>
  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 2 Sliding-Window Chat (`Last 10 Turns`) + 512-Tok RAG:</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Forgets 69% of early user constraints by Turn 50 (31.0% recall)</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 3 Lossy Prose Summarization Only:</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Drops exact numbers &amp; fails on contradictory fact updates over time</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
