  <text x="640" y="210" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. Single-Doc Deep Dive (`&lt;=64K` Tok, `&gt;=3` Turns) -&gt; KV Cache</text>
  <text x="655" y="232" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Loads full 90-page contract into Prefix-Cached Long-Context once</text>
  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. Multi-Doc Corpus (`&gt;100K` Tok) -&gt; Parent-Document Hybrid RAG</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Retrieves 256-tok child chunks, expands to 2K-tok parent sections (97.2%)</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. 3-Tier OS Agent Memory (`Working + Episodic + Temporal Graph`)</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Bi-temporal edges (`valid_from / invalid_at`) track evolving user facts</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (25M Turns / Month):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Multi-Needle Reasoning Accuracy: 97.2% (vs 74.2% 250K stuff)</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Turn-50 Long-Horizon Memory Recall: 98.4% (vs 31.0% window)</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• End-to-End P95 TTFT: 410.0ms (-94.0% vs 250K stuffing)</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly Context &amp; Memory TCO: $31,500 / mo (-91.8%)</text>
