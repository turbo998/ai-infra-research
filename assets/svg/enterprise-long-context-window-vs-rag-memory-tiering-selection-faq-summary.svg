  <rect width="1200" height="630" fill="url(#bg488)"/>
  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ENTERPRISE LONG-CONTEXT (1M) VS. HYBRID RAG VS. AGENT MEMORY TIERING (R488)</text>
  <text x="65" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Cached 64K Long-Context + Parent-Doc RAG + Bi-Temporal Agent Memory: -91.8% TCO</text>

  <rect x="40" y="138" width="545" height="445" rx="14" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
