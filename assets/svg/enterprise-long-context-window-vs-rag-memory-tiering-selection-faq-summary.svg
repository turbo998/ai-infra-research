  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 250K Context-Stuffing P95 TTFT: 6,850 ms</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Sliding-Window Turn-50 Memory Recall: 31.0%</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Monthly 250K Context-Stuffing Cost: $385,000 / mo</text>

  <rect x="615" y="138" width="545" height="445" rx="14" fill="#0f292a" stroke="url(#accent488)" stroke-width="2"/>
