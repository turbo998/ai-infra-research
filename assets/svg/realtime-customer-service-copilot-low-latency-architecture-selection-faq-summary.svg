  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">输入护栏(45ms)与 RAG 检索(85ms)同时跑；</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">输出边流式吐字边按 20 词滑动窗口异步审 ✅</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P50 端到端首字: <tspan fill="#38bdf8" font-weight="800">260.0 ms ✅</tspan></text>
