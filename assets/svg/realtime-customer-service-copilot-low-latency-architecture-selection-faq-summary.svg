  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">P99 达 3.42 秒 · 实时通话冷场</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">审查-&gt;70B改写-&gt;RAG-&gt;70B生成-&gt;整段审核</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么串行拼接是实时客服死敌？</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">5 个环节串行相加，且等整段回答生成完</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">才做安全审核，彻底毁掉流式秒回体验 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P50 端到端首字: <tspan fill="#f87171" font-weight="700">2,180.0 ms ✕</tspan></text>
