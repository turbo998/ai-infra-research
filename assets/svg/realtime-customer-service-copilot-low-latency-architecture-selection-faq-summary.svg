  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千次交互成本: <tspan fill="#38bdf8" font-weight="800">$0.92 / 1K 次 (-74.8% ✅)</tspan></text>
