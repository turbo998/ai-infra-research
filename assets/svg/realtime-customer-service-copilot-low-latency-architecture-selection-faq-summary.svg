  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：如何把 3,420ms 的实时客服链路一步步削减到 275ms 以内（三大并行化手术）？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 手术 1：把“串行加法”改为“乐观并行取最大值 max(A, B)”</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 严禁等输入安全审核跑完才去查向量库！同时并发启动 `Prompt Shield (35ms)` 与</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  `RAG 检索 (85ms)`，甚至乐观启动 LLM Prefill——若护栏报警则当场中断取消，0 秒白等！</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 严禁等整段话生成完才做输出审核！改为每生成 20 个 Token 异步滑动窗口审查并流式下发。</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🚀 手术 2：Pre-EOU 输入投机预取 (Speculative RAG Prefetch)</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 在语音客服或打字框中，当用户说到/打到前 80% 关键词时（尚未按回车或停顿结束），</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  后台已静默触发投机 RAG 将候选知识块预热至内存缓存并完成部分 KV 预计算；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 等用户话音刚落，检索耗时从 290ms 缩至 **12ms**，端到端 P99 首字延迟压至 **275ms** 🏆！</text>
