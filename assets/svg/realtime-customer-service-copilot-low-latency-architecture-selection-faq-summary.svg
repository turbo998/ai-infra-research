  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千次交互成本: <tspan fill="#f87171" font-weight="700">$3.65 / 1K 次 ✕</tspan></text>
