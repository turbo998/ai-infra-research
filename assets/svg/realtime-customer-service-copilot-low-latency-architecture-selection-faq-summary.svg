  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千次交互成本: <tspan fill="#fbbf24" font-weight="700">$1.52 / 1K 次</tspan></text>
