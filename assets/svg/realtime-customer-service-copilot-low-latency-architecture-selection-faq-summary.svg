  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千次交互成本: <tspan fill="#34d399" font-weight="800">$0.64 / 1K 次 (-82.5% 🏆)</tspan></text>
