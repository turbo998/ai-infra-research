  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制瓶颈：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">把几周的聊天记录全塞进 Prompt，作废的</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">旧决定还留在上下文里干扰模型判断！</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百轮会话成本: <tspan fill="#f87171" font-weight="700">$4.85 (昂贵 ✕)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 时序状态更新准度: <tspan fill="#f87171" font-weight="700">61.0% ✕</tspan></text>
