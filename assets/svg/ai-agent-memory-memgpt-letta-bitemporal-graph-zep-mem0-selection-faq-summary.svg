  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">时序准度 95.4% · 成本省 93%</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">MemGPT/Letta + Zep/Graphiti 双时态边</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (三级分层 + 双时态失效边)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">1.5K 核心块常驻 Prefix + 图谱边记录</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">`t_valid / t_invalid` 自动归档过期事实！</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百轮会话成本: <tspan fill="#34d399" font-weight="800">$0.34 (-93.0% 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 时序状态更新准度: <tspan fill="#34d399" font-weight="800">95.4% 🏆</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 精确 ID/数字保留: <tspan fill="#34d399" font-weight="800">96.8% 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 记忆检索延迟: <tspan fill="#34d399" font-weight="800">28.0 ms 🏆</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 企业级伴随式 Agent 记忆黄金标准</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：如何像设计操作系统虚拟内存（RAM + Disk + Wal）一样设计 Agent 记忆？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：MemGPT / Letta 的“L1 核心内存（Core Memory）”原位覆写</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 在 System Prompt 中开辟固定 `1,500 Token` 的结构化槽位（如 `&lt;user_profile&gt;`、</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  `&lt;project_constraints&gt;`），Agent 通过工具调用 `core_memory_replace(old, new)`</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  直接覆写当前最新状态——永远在上下文里，永远零检索失败！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：Zep / Graphiti 的“双时态关系边 (`t_valid`, `t_invalid`)”</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 知识图谱中的每条事实边不仅记录入库时间 (`t_created`)，还维护事实生效期：</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  `(System, deployed_on, AWS_EKS, t_valid=Jan, t_invalid=Mar)`；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 查询当前状态时只过滤 `t_invalid IS NULL` 的活跃边，100% 根除新旧事实自相矛盾 🏆！</text>
</svg>
