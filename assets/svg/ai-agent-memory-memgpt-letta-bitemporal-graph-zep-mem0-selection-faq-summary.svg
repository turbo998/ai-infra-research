  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 记忆检索延迟: <tspan fill="#f87171" font-weight="700">1,450 ms (长文重算 ✕)</tspan></text>
