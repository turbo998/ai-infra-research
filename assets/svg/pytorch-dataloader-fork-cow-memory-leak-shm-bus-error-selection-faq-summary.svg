<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 235 · PYTORCH DATALOADER FORK COW PYTHON REFCOUNT 64X RAM LEAK &amp; /DEV/SHM BUS ERROR FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">DataLoader Workers: 768 GB Python List CoW OOM vs 12.2 GB Shared mmap Index (62.9x Less RAM)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Python List CoW &amp; 64MB /dev/shm Crash</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1: Reading `self.samples[i]` on a Python `list/dict` increments</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  `ob_refcnt` (`Py_INCREF`), dirtying 4KB pages &amp; duplicating a 12 GB</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  index across all 64 workers (`12 GB × 64 = 768 GB` Host OOM!) ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: Docker default `64 MB /dev/shm` crashes with `SIGBUS` ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Node Host RAM: 768.0 GB (64x Duplication!) | SIGBUS / OOM Crash ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">"Read-Only" Access in Python Is a Write Operation in CPython Memory!</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Shared `np.memmap` Index + 64GiB `/dev/shm`</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Stores dataset offsets/paths in flat `np.memmap` / Arrow / Tensor</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Indexing returns a C scalar without touching shared `PyObject` headers</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• All 8 `torchrun` ranks &amp; 64 workers share 1 OS read-only `mmap` copy</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Mounts `emptyDir: {medium: Memory, sizeLimit: 64Gi}` at `/dev/shm`</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Node Host RAM: 12.2 GB (62.95x Less RAM!) | 0 Crashes 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Zero Copy-on-Write Page Faults Across Multi-Epoch Training</text>
</svg>
