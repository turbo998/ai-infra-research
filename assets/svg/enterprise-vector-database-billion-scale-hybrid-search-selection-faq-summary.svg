<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad382" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad382" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad382)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级向量数据库与亿级/十亿级混合检索引擎选型指南：内存墙破解、量化重排与多租户隔离</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：内存-NVMe(DiskANN)-对象存储三级分层 + BQ/SQ8 量化重排 + Partition-Key 隔离，将亿级向量内存砍掉 19.2x、月省 91.5%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 382 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 全量 FP32 纯内存 HNSW</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 1亿条 1536维 FP32 全塞物理内存</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 5,000 租户各建 1 张物理表/索引</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 集群内存需求：高达 920 GB ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• P95 检索延迟：68.0 ms (元数据抖动)✕</text>
  <text x="40" y="252" fill="#cbd5a5" font-size="12">• Hybrid Recall@10：94.5%</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">亿级向量月成本：$28,400 / 月 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">大坑：5,000 张表导致 HNSW 后台合并</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">直接 OOM 崩溃，且高内存机器极其昂贵</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="332" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 2: 全托管云搜索 PaaS</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• Azure AI Search / Elastic Cloud</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 开箱即用 BM25 + Vector + 语义重排</text>
  <text x="332" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 集群内存需求：240 GB (内置标量量化)</text>
  <text x="332" y="232" fill="#34d399" font-size="12" font-weight="700">• P95 检索延迟：24.0 ms ✅</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• Hybrid Recall@10：95.2% ✅</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="454" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">亿级向量月成本：$13,500 (免运维) ✅</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">定位：&lt; 5,000 万向量、无专职运维团队</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">追求与云生态安全合规无缝集成的企业首选</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#818cf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#a5b4fc" font-size="14.5" font-weight="800">🟪 Tier 3: 自建量化向量集群</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• Milvus 2.5 / Qdrant 分布式集群</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• Binary/SQ8 内存量化 + 3x 过采样重排</text>
  <text x="624" y="212" fill="#a5b4fc" font-size="12" font-weight="700">• 集群内存需求：110 GB ✅ (降 8.4x)</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• P95 检索延迟：16.0 ms ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• Hybrid Recall@10：96.0% ✅</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#312e81"/>
  <text x="746" y="296" fill="#e0e7ff" font-size="12.5" font-weight="700" text-anchor="middle">亿级向量月成本：$5,800 (省 79.6%) ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：全量热数据高频并发检索主力</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">单表 Partition-Key 轻松承载上万中小租户</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 内存-NVMe-对象存储分层 🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 热租户内存 BQ + 温数据 NVMe DiskANN</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 集群内存需求：仅 48 GB 🏆 (降 19.2x)</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• P95 检索延迟：19.0 ms 🏆</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• Hybrid Recall@10：96.5% 🏆</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 共享 Partition-Key + 鲸鱼大租户独立分片</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">亿级向量月成本：$2,400 (省 91.5%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：亿级~十亿级多租户企业知识平台终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">打破“向量数 = 昂贵 DRAM 容量”的线性诅咒</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 亿级向量架构师必算的三笔账：内存容量公理、量化过采样重排（BQ+Rescore）与多租户防雪崩</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad382)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. HNSW 内存容量速算公式（为什么 FP32 必撞墙）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 原始 FP32 向量：`1536 × 4B = 6.14 KB/条`，加 HNSW 图边膨胀 `1.5x`</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">  `1 亿条 = 920 GB 物理内存`！</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">• 开启 Binary Quantization (1-bit/维) + 磁盘 FP16 `3x 过采样重排`，</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">  内存直接压縮 24~32 倍，且 Recall@10 保持 96.5% 无损！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. DiskANN / NVMe Mmap + 对象存储冷热三级分层</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 企业知识库中 85% 的历史归档文档每周被查不到 1 次！</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 采用 `Vamana 图索引 (DiskANN)` 将邻接表与压缩向量存放在</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  `$0.08/GB` 的本地 NVMe SSD 与 `$0.02/GB` 的对象存储上，</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  内存只存轻量导航质心，单次查询仅需 1~2 次 4KB SSD 随机读！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 多租户隔离铁律（严禁 1 租户 1 物理表）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 超过 500 个租户时，“每租户建一张 Collection”必因元数据爆炸崩溃。</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 标准解法：99% 中小租户共享 1 张物理表，开启 `partition_key=tenant_id`</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  （底层自动按租户哈希路由子分片）；仅对 &gt;500万向量的</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  Top 1% 鲸鱼大租户自动晋升（Promote）至独立物理分片！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 382 合成标定算例 (independently_reproduced=false)</text>
</svg>
