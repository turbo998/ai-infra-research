  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">KV Quantization: Naive INT4 Collapse (64.0%) vs `Hadamard + Sink Guard INT4` (91.1%, 3.85x)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 3: Naive Per-Token INT4 &amp; Post-RoPE KIVI</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Physical Law: `Key` has persistent `Per-Channel` outliers (`38x` mean)</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  while `Value` is smooth and summed across tokens (`Per-Token`)!</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (Per-Token INT4 on `K`): 2 outlier dims crush 126 dims! ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 3 (Post-RoPE KIVI): `RoPE` rotates outliers across phases! ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Naive INT4 128K RULER: 64.0% (-27.5 pt) | Post-RoPE: 85.4% ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Quantizing Key Per-Token Without Outlier Smoothing Destroys Retrieval</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: `Hadamard (QH·KH^T)` INT4 + Sink Guard</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Applies fast `128x128` Walsh-Hadamard rotation $Q H (K H)^T = Q K^T$</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Flattens `Key` peak-to-mean ratio from `38.0x` down to `2.4x`!</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Preserves first `4` Attention Sink tokens + latest `32` tokens in BF16</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• `3.85x` KV Cache compression (`2.88x` decode throughput speedup!)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">128K RULER: 91.1% (vs 91.5% BF16) | KV Compression: 3.85x 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Orthogonal Outlier Dispersion + Unquantized Sink/Sliding Window</text>
