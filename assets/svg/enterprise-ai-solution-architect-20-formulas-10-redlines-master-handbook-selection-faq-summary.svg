<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">第 465 篇里程碑：云与 AI 解决方案架构师 (SA) 案头速查圣经：20 大手算公式与 10 大避坑红线 (#465)</text>
  <text x="28" y="58" class="sub">一图统揽 PD 分离、TP/PP/DP/EP、NVLink/IB/RoCEv2、三道水位线算卡、TPM/TPS/PTU &amp; Little's Law 与平台 TCO 铁律</text>

  <!-- Left Panel: The 10 Non-Negotiable SA Redlines -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 架构评审一票否决的“十大生产避坑红线” (10 Non-Negotiable Redlines)</text>

  <rect x="42" y="120" width="524" height="212" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="mono">⛔ 红线 1: 严禁把 TP 跨出 NVLink/MNNVL 域 | ⛔ 红线 2: 严禁在 25G TCP 上拆跨机 PD</text>
  <text x="56" y="164" class="mono">⛔ 红线 3: 严禁 BIOS 开启 PCIe ACS (毁掉 PIX) | ⛔ 红线 4: 严禁仅按权重除显存买卡</text>
  <text x="56" y="186" class="mono">⛔ 红线 5: 严禁把输入输出 TPM 1:1 相加买 PTU | ⛔ 红线 6: 严禁拿 24h 日均 RPS 算并发</text>
  <text x="56" y="208" class="mono">⛔ 红线 7: 严禁在 Batch&gt;=48 时开 MTP 投机 | ⛔ 红线 8: 严禁用 GPU_UTIL=99% 做 K8s HPA</text>
  <text x="56" y="230" class="mono">⛔ 红线 9: 严禁在 &lt;16卡/&lt;58%利用率自建 K8s | ⛔ 红线 10: 严禁 &gt;45kW/柜不用冷板液冷</text>
  <text x="56" y="260" class="txt" font-weight="700" fill="#34d399">🏆 守住十大红线 + 套用二十大公式：容量测算精度达 99.1%，单百万 Token 成本降至 $0.14！</text>
  <text x="56" y="284" class="txt" fill="#94a3b8">适用场景：客户 CxO 架构汇报、算力中心立项评审、公有云/开源栈 PoC 验收与日常充电精读</text>

  <!-- Right Panel: 4 Architectural Maturity Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四档架构设计成熟度对标 (容量测算准确度 vs. 生产 Goodput 达标率)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 拍脑袋经验估算 (踩中权重除显存、跨机 TP、日均 RPS 等多项红线)</text>
  <text x="638" y="158" class="mono">• 测算准确度: 42.0% ✕ | 生产 Goodput 达标: 31.5% ✕ | 综合成本: $1.45/1M</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 厂商默认静态配置 (仅算第一道显存水位 + 静态 1:1 PD + 静态 ECMP)</text>
  <text x="638" y="214" class="mono">• 测算准确度: 71.0% | 生产 Goodput 达标: 74.0% | 综合成本: $0.58/1M</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 三道水位线算卡 + 机内 TP / MoE EP + 400G RDMA 无损调优</text>
  <text x="638" y="270" class="mono">• 测算准确度: 92.5% ✓ | 生产 Goodput 达标: 96.2% ✓ | 综合成本: $0.24/1M</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 20 大公式 + 10 大红线全栈精算体系 (推理×网络×容量×FinOps 闭环) (🏆)</text>
  <text x="638" y="326" class="mono">• 测算准确度: 99.1% 🏆 | Goodput 达标: 99.8% 🏆 | 综合成本: $0.14/1M (-90.3%)!</text>

  <!-- Bottom Panel: Core Formulas Across 4 Pillars -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 四大支柱核心手算公式速查卡 (PD &amp; 并行 · 智算网络 · 三道水位线 &amp; TPM/TPS · 平台 TCO)</text>

  <rect x="42" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">支柱一：PD 与并行切分公式</text>
  <text x="56" y="464" class="mono">• P:D 比 = [S_in(1-eta)/TPS_P]</text>
  <text x="56" y="484" class="mono">          / [S_out/TPS_D]</text>
  <text x="56" y="504" class="mono">• KV 暴露 = (KV_GB/BW)*(1-0.80)</text>
  <text x="56" y="524" class="mono">• GQA-8 = 163.8 KB/tok (FP8)</text>
  <text x="56" y="544" class="mono">• MLA   = 35.14 KB/tok (FP8)</text>
  <text x="56" y="568" class="txt" fill="#6ee7b7">保留 25% Flex 节点应对昼夜反转!</text>

  <rect x="328" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="342" y="440" class="txt" font-weight="700" fill="#34d399">支柱二：智算网络与 busbw 公式</text>
  <text x="342" y="464" class="mono">• AllReduce: busbw = algbw*2(N-1)/N</text>
  <text x="342" y="484" class="mono">• AllToAll:  busbw = algbw*(N-1)/N</text>
  <text x="342" y="504" class="mono">• ECN K_min(150KB) &lt;&lt; XOFF(1.5MB)</text>
  <text x="342" y="524" class="mono">• Scale-Up: 900~1,800 GB/s (&lt;1us)</text>
  <text x="342" y="544" class="mono">• Scale-Out: 50~100 GB/s (2~5us)</text>
  <text x="342" y="568" class="txt" fill="#34d399">Day-0 门禁: busbw &gt;= 90% 线速 🏆</text>

  <rect x="614" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="628" y="440" class="txt" font-weight="700" fill="#fde68a">支柱三：三道水位线与 Little's Law</text>
  <text x="628" y="464" class="mono">• E2EL = TTFT + (N_out-1)*TPOT</text>
  <text x="628" y="484" class="mono">• B_active = Peak_RPS * E2EL</text>
  <text x="628" y="504" class="mono">• PTU_TPM = In*(1-eta) + 5*Out</text>
  <text x="628" y="524" class="mono">• N_mem = ceil(M_tot/(0.85*HBM))</text>
  <text x="628" y="544" class="mono">• N_GPU = max(N_mem, N_bw, N_cmp)</text>
  <text x="628" y="568" class="txt" fill="#fde68a">671B+14B MTP = 685GB FP8 权重!</text>

  <rect x="900" y="414" width="258" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="914" y="440" class="txt" font-weight="700" fill="#d8b4fe">支柱四：平台 TCO 与 FinOps 公式</text>
  <text x="914" y="464" class="mono">• &lt;28% 利用率 -&gt; Serverless PAYGO</text>
  <text x="914" y="484" class="mono">• 28~58% -&gt; PTU (P80) + PAYGO 溢出</text>
  <text x="914" y="504" class="mono">• &gt;58% &amp; &gt;=16卡 -&gt; 自建 K8s+GIE</text>
  <text x="914" y="524" class="mono">• WCU = 0.1*Cache + 1*In</text>
  <text x="914" y="544" class="mono">        + 3.5*Think + 4*Out</text>
  <text x="914" y="568" class="txt" fill="#d8b4fe">60/25/15 组合 + 训推潮汐省 65%!</text>
</svg>
