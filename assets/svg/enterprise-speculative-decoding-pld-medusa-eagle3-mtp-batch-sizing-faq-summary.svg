  <rect width="1200" height="630" fill="url(#bg637)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr637)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#637 大模型投机解码四大流派 (Draft 7B vs. PLD vs. Medusa vs. EAGLE-3/MTP) 接收率手算与拐点指南</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Enterprise Speculative Decoding 4 Paradigms: Acceptance Math τ(α), Scenario Matching (Code/RAG/Chat) &amp; Batch Cutoff B*=32 Sizer</text>

  <!-- 4 Speculative Decoding Paradigms -->
  <rect x="48" y="120" width="268" height="205" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.6"/>
  <text x="62" y="144" fill="#f87171" font-family="system-ui, sans-serif" font-size="14" font-weight="800">① 独立草案模型 (Draft 7B)</text>
  <text x="62" y="166" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 额外部署 7B/8B 独立小模型</text>
  <text x="62" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 需维护双份 KV Cache (+14GB)</text>
  <text x="62" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 跑 28~32 层小模型串行耗时 4.8ms</text>
  <text x="62" y="226" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 跨 TP=4/8 时小模型通信占比 42%</text>
  <text x="62" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 实测净加速比仅 1.38x (逐步淘汰)</text>

  <rect x="332" y="120" width="268" height="205" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="346" y="144" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="800">② 提示词查找 (PLD / N-gram)</text>
  <text x="346" y="166" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 0 额外模型权重 (+0.0 GB HBM!)</text>
  <text x="346" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 直接在输入 Prompt 中匹配 N-gram</text>
  <text x="346" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">  复制后续连续片段作为候选草案</text>
  <text x="346" y="226" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">🏆 代码改写 / 原文引用 RAG 达 2.25x</text>
  <text x="346" y="248" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11.5">• 局限: 开放创意写作接收率低 (1.15x)</text>

  <rect x="616" y="120" width="268" height="205" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="630" y="144" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="800">③ Medusa 多头并行预测</text>
  <text x="630" y="166" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 在顶层隐藏态挂载 K 个独立线性头</text>
  <text x="630" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 缺陷: 第 k+2 头不知道 k+1 选了谁</text>
  <text x="630" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">  (Token 间互相独立，需巨大候选树)</text>
  <text x="630" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 64节点树注意力掩码吃算力</text>
  <text x="630" y="248" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11.5">• 实测净加速比 1.72x (被 EAGLE-3 取代)</text>

  <rect x="900" y="120" width="252" height="205" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="914" y="144" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">④ EAGLE-3 / 原生 MTP 🏆</text>
  <text x="914" y="166" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 仅 1 层轻量 Transformer 特征头</text>
  <text x="914" y="186" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 同时输入 [倒数多层特征 + 已采样词]</text>
  <text x="914" y="206" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 单步接受率 α=0.84 ➔ τ=3.45 词/步</text>
  <text x="914" y="226" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 草案耗时仅 0.45ms (+1.8~14GB 显存)</text>
  <text x="914" y="248" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🏆 通用交互加速比高达 2.42 倍！</text>

  <!-- Middle: Math Formula & Batch Cutoff -->
  <rect x="48" y="340" width="1104" height="114" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="68" y="366" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📐 投机解码第一性原理公式 (完全无损主模型分布 · Rejection Sampling 100% 数学等价)：</text>
  <text x="68" y="394" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• 期望单步生成词数: τ(α, γ) = (1 - α^(γ+1)) / (1 - α)   [例: 猜 γ=4 词, 单步接受率 α=0.84 ➔ τ = (1 - 0.84^5)/0.16 = 3.63 词/步]</text>
  <text x="68" y="418" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">• 端到端加速比: Speedup(B) = τ(α, γ) / [ c_verify(B, γ) + γ · (T_draft / T_target) ]</text>
  <text x="68" y="442" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">• 黄金熔断边界: B ≤ 32 (HBM带宽受限区, c_verify≈1.15) 开启赚 2.42x 加速；B &gt; 32 (算力饱和区) 自动旁路关闭防吞吐倒挂！</text>

  <!-- Bottom Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #637 投机解码生产收益对比 (70B FP8 / 671B MoE · 交互并发 B=8~16)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 标准自回归 Decode: 1.00 词/步 · TPOT = 21.8 ms (45.9 tok/s/user)</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• EAGLE-3 / 原生 MTP (+ PLD 代码双模): 3.45 词/步 · 等效 TPOT 压至 9.0 ms (111.1 tok/s/user · 无损提速 2.42 倍)！</text>
</svg>
