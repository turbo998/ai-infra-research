<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#F59E0B" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">大模型万亿 Token 数据清洗与去重选型：NeMo Curator + Ray Data vs. Datatrove vs. Spark</text>
  <text x="52" y="94" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15">Spot CPU 跑解析正则 + GPU (RAPIDS cuDF/cuGraph) 跑 MinHash LSH 连通图与 SemDeDup 语义去重：提速 12.3 倍！</text>

  <!-- Left: Why Pure Spark CPU Collapses on 20TB Dedup -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么传统 Apache Spark CPU 集群跑全量去重会崩盘？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 瓶颈 A：MinHash LSH 哈希分桶与百亿边连通分量 (Connected Components)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 20 TB 语料 (50 亿文档) 生成 128 维签名后，多轮全网 Shuffle 触发百 TB 磁盘落盘</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• GraphFrames 迭代求连通子图在 JVM 上频发 GC OOM，跑完一次需 348 小时 (14.5 天)！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 瓶颈 B：纯字面去重漏掉“同义改写/模板灌水” (缺乏 SemDeDup)</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 网页与合成数据中存在大量换词不换意的近似重复（约占总 Token 11%~15%）</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• CPU 根本算不动 50 亿条 Embedding 提取与 K-Means 聚类（SemDeDup 必须上 GPU）！</text>

  <!-- Right: Ray Data + NeMo Curator Heterogeneous Pipeline -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. Ray Data + NeMo Curator 异构流水线四级漏斗 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① Stage 1 (Spot CPU 池)：HTML/PDF 解析 + Unicode 修复 + FastText 初筛</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">用廉价抢占式 CPU 消化 I/O 与分支密集型正则解析，绝不让昂贵 GPU 空转等解析</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② Stage 2 (RAPIDS cuDF + cuGraph GPU)：极速模糊 MinHash LSH</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">通过 NVLink / UCX RDMA 在显存内完成 LSH 分桶与连通图聚类，比 Spark 快 18 倍！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ Stage 3 (FAISS-GPU SemDeDup + 质量分类器)：剔除 38.2% 冗余低质 Token</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">花费 $3.8 万清洗费，直接为下游预训练省下 $34.5 万 GPU 算力且评测涨点 +2.4 pts！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 20 TB 原始语料（5 万亿 Raw Tokens）四档数据清洗架构耗时与 ROI 对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">数据清洗与去重架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">端到端清洗耗时</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">处理吞吐率</text>
  <text x="780" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">剔除冗余比例</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">清洗算力成本</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">下游训练净省算力</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 传统 Apache Spark 纯 CPU 集群 (JVM Shuffle)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">348.0 hrs (14.5天) ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.057 TB/h</text>
  <text x="780" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">24.0% (仅字面)</text>
  <text x="950" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$142,000 ✕</text>
  <text x="1110" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$180,000</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: HuggingFace Datatrove (Slurm Spot CPU 流式)</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">112.0 hrs (4.7天)</text>
  <text x="620" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.179 TB/h</text>
  <text x="780" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">26.5% (无语义去重)</text>
  <text x="950" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$54,000</text>
  <text x="1110" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$210,000</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 全流程独占 H100 GPU 集群 (解析也占 GPU)</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">34.0 hrs</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.588 TB/h</text>
  <text x="780" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">37.5%</text>
  <text x="950" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$68,000</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$320,000</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): Ray Data 异构流水线 + NeMo Curator (cuDF+SemDeDup)</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">28.5 hrs (-91.8%)</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.702 TB/h (12.3x)</text>
  <text x="780" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">38.2% ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$38,000 (-73%) ✓</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">省 $345,000 ✓</text>
</svg>
