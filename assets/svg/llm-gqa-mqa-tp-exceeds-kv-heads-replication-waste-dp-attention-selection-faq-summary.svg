<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 244 · GQA/MQA/MLA TENSOR PARALLELISM BOUNDARY TRAP (TP &gt; NUM_KV_HEADS REPLICATION) FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">TP &gt; num_kv_heads Trap: 8x Replicated KV Cache Waste vs Decoupled DP-Attention / DCP (3.85x)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1: The `TP_SIZE &gt; num_kv_heads` Replication Trap</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Standard TP shards KV Cache along the head dimension (`num_kv_heads`)</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• When `TP &gt; num_kv_heads` (e.g., `TP=8` on `MLA 1-head` or `GQA-2/4`</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  or `TP=16` on `GQA-8`), engines SILENTLY replicate KV heads across</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  `TP / num_kv_heads` GPUs — wasting up to 87.5% (8x) of KV HBM! ✕</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">KV Replication: 8.0x Waste | Max Concurrent 16K Reqs: Only 18 ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Doubling TP Beyond `num_kv_heads` Adds ZERO Effective KV Capacity!</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Decoupled `DP-Attention / DCP` + `TP/EP FFN`</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Keeps Attention head-TP `&lt;= num_kv_heads` (`1.0x` zero KV duplication)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• High-concurrency mode: `DP-Attention` (each GPU holds distinct reqs)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Long-context low-batch mode: `DCP` shards KV along sequence tokens!</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• FFN / MoE layers still use full 8-GPU TP or Expert Parallelism (EP)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">KV Replication: 1.0x (8x More Capacity: 144 Reqs) | 5,460 tok/s 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">3.85x Higher Throughput by Eliminating Redundant KV Head Copies</text>
</svg>
