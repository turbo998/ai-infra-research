<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="acc5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 27px; font-weight: 800; fill: #F8FAFC; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 500; fill: #94A3B8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; }
      .sec { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #38BDF8; }
      .ct { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #F1F5F9; }
      .cb { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; font-weight: 400; fill: #CBD5E1; }
      .cm { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #34D399; }
      .cw { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #FBBF24; }
      .cd { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #F87171; }
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg5)"/>
  <rect x="30" y="24" width="1340" height="86" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="46" y="40" width="210" height="24" rx="12" fill="url(#acc5)"/>
  <text x="151" y="56" text-anchor="middle" class="badge">AI SOLUTION ARCHITECT · ROUND 5</text>
  <text x="272" y="59" class="title">AI 集群以太网 RoCEv2 负载均衡与拥塞控制选型一图流总结</text>
  <text x="46" y="90" class="sub">Static ECMP + PFC/DCQCN vs. Multi-QP Scaling vs. Switch Flowlet DLB vs. Per-Packet Spraying + NIC Hardware Out-of-Order RDMA (Spectrum-X / UEC)</text>

  <!-- Left Column: Decision Tree -->
  <rect x="30" y="126" width="650" height="430" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="156" class="sec">1. 架构师四档 RoCEv2 演进选型决策树 (Single-Decision Playbook)</text>

  <rect x="50" y="172" width="610" height="82" rx="10" fill="#1E293B" stroke="#F87171" stroke-width="1.5"/>
  <text x="66" y="196" class="ct">Tier 1 · 传统静态 5 元组 ECMP + PFC + DCQCN（仅限 &lt;= 64 卡单任务同构训练）</text>
  <text x="66" y="218" class="cb">大象流少而肥，5 元组哈希极易在 Spine 上行撞车触发 PFC 死锁/反压风暴</text>
  <text x="66" y="239" class="cd">256-GPU AllReduce 有效带宽: 188.0 Gbps (47.0%) | MoE All-to-All P99: 42.5 ms | PFC: 1,420 pauses/s</text>

  <rect x="50" y="266" width="610" height="82" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="66" y="290" class="ct">Tier 2 · 存量交换机零硬件改动急救：NCCL 多 QP 拆流 (8 QPs/Rank) + ECN 前移</text>
  <text x="66" y="312" class="cb">NCCL_IB_QPS_PER_CONNECTION=8 将单条大象流拆为 8 个 UDP 源端口子流，统计摊平哈希碰撞</text>
  <text x="66" y="333" class="cw">256-GPU AllReduce 有效带宽: 268.0 Gbps (67.0%, 1.43x) | MoE All-to-All P99: 28.4 ms | 零硬件增购</text>

  <rect x="50" y="360" width="610" height="82" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="384" class="ct">Tier 3 · 标准网卡 + Broadcom Tomahawk 5 交换机：动态负载感知 Flowlet DLB</text>
  <text x="66" y="406" class="cb">ASIC 监测微突发间隙 (&gt;25us) 动态切换轻载 Spine 且不造成单流包乱序，兼容标准 ConnectX-7</text>
  <text x="66" y="427" class="cm">256-GPU AllReduce 有效带宽: 332.0 Gbps (83.0%, 1.77x) | MoE All-to-All P99: 19.6 ms (-53.9%)</text>

  <rect x="50" y="454" width="610" height="86" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
  <text x="66" y="478" class="ct">Tier 4 · 千卡级 / MoE 高频 All-to-All 终局：逐包喷洒 Adaptive Spraying + 网卡硬件乱序重排</text>
  <text x="66" y="500" class="cb">交换机将每个数据包均匀喷洒到全部 Spine，BlueField-3/ConnectX-8 Direct Data Placement 乱序直写 HBM</text>
  <text x="66" y="522" class="cm">256-GPU 有效带宽: 382.0 Gbps (95.5%, 2.03x) | MoE All-to-All P99: 11.4 ms (-73.2%) | 噪音隔离 95.3%</text>

  <!-- Right Column: Quantitative Comparison Bars -->
  <rect x="700" y="126" width="670" height="430" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="720" y="156" class="sec">2. 256×H100 (400G RoCEv2 Clos) 定量算例对比 (Synthetic Roofline · Non-GPU Run)</text>
  <text x="720" y="178" class="sub">Source: experiments/rocev2_load_balancing_selection/results.json (independently_reproduced=false)</text>

  <!-- Bar Group 1: Effective Bandwidth -->
  <text x="720" y="208" class="ct">AllReduce 有效集合通信带宽 (Gbps / 400G 线速利用率)</text>
  <text x="720" y="232" class="cb">Static ECMP</text>
  <rect x="880" y="218" width="188" height="18" rx="4" fill="#F87171"/>
  <text x="1078" y="232" class="cd">188.0 Gbps (47.0%)</text>

  <text x="720" y="258" class="cb">Multi-QP (8 QPs)</text>
  <rect x="880" y="244" width="268" height="18" rx="4" fill="#FBBF24"/>
  <text x="1158" y="258" class="cw">268.0 Gbps (67.0% · 1.43x)</text>

  <text x="720" y="284" class="cb">Switch Flowlet DLB</text>
  <rect x="880" y="270" width="332" height="18" rx="4" fill="#38BDF8"/>
  <text x="1222" y="284" class="cm">332.0 Gbps (83.0% · 1.77x)</text>

  <text x="720" y="310" class="cb">Packet Spray + OoO</text>
  <rect x="880" y="296" width="382" height="18" rx="4" fill="#34D399"/>
  <text x="1272" y="310" class="cm">382.0 Gbps (95.5% · 2.03x)</text>

  <!-- Bar Group 2: MoE All-to-All P99 Latency -->
  <text x="720" y="352" class="ct">MoE EP=32 All-to-All Dispatch+Combine P99 尾延迟 (ms，越低越好)</text>
  <text x="720" y="378" class="cb">Static ECMP</text>
  <rect x="880" y="364" width="340" height="18" rx="4" fill="#F87171"/>
  <text x="1230" y="378" class="cd">42.5 ms (1,420 PFC/s)</text>

  <text x="720" y="404" class="cb">Multi-QP (8 QPs)</text>
  <rect x="880" y="390" width="227" height="18" rx="4" fill="#FBBF24"/>
  <text x="1117" y="404" class="cw">28.4 ms (-33.2% · 410 PFC/s)</text>

  <text x="720" y="430" class="cb">Switch Flowlet DLB</text>
  <rect x="880" y="416" width="157" height="18" rx="4" fill="#38BDF8"/>
  <text x="1047" y="430" class="cm">19.6 ms (-53.9% · 95 PFC/s)</text>

  <text x="720" y="456" class="cb">Packet Spray + OoO</text>
  <rect x="880" y="442" width="91" height="18" rx="4" fill="#34D399"/>
  <text x="981" y="456" class="cm">11.4 ms (-73.2% · 12 PFC/s)</text>

  <!-- Multi-tenant callout -->
  <rect x="720" y="478" width="630" height="62" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="736" y="501" class="ct">多租户邻居噪音测试 (Noisy Neighbor Checkpoint Burst = 120 Gbps on Shared Spine)</text>
  <text x="736" y="524" class="cb">Static ECMP 吞吐跌至 116.6 Gbps (-38.0% 受害塌陷) vs. Packet Spray + 遥测 CC 保持 364.0 Gbps (仅波动 4.7%，隔离度 95.3%)</text>

  <!-- Bottom Row: First-Principles Mechanics & Production Checklist -->
  <rect x="30" y="572" width="1340" height="260" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="602" class="sec">3. 第一性原理机制解构 &amp; 架构师生产核验清单 (First-Principles Mechanics &amp; Architect Checklist)</text>

  <rect x="50" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="66" y="644" class="ct">为什么传统 RoCEv2 跑不满 400G 线速？</text>
  <text x="66" y="668" class="cb">• 熵饥饿 (Entropy Starvation): GPU 间只有寥寥几条</text>
  <text x="66" y="688" class="cb">  100~400Gbps 大象流，静态 5 元组哈希必然撞车。</text>
  <text x="66" y="712" class="cb">• Go-Back-N 乱序惩罚: 传统网卡收到 PSN 跳号立即</text>
  <text x="66" y="732" class="cb">  回 NACK 重传整段窗口，不敢开启标准交换机逐包喷洒。</text>
  <text x="66" y="756" class="cb">• PFC 头阻扩散: 队列满触发 PAUSE 帧逐跳反向传染，</text>
  <text x="66" y="776" class="cb">  无辜旁路作业被连坐冻结 (Head-of-Line Blocking)。</text>

  <rect x="490" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="506" y="644" class="ct">NIC 硬件乱序重排 (OoO RDMA) 如何破局？</text>
  <text x="506" y="668" class="cb">• 交换机逐包自适应路由 (ARS) 实时挑选最空闲 Spine。</text>
  <text x="506" y="692" class="cb">• 接收端网卡凭每个包的 RDMA 虚拟地址与 PSN 偏移，</text>
  <text x="506" y="712" class="cb">  通过 Direct Data Placement (DDP) 乱序直写 HBM。</text>
  <text x="506" y="736" class="cb">• 硬件 PSN Bitmap 追踪乱序窗口，仅当全部字节落盘</text>
  <text x="506" y="756" class="cb">  才向上层触发单次完成事件 (CQE)，彻底终结 Go-Back-N。</text>
  <text x="506" y="780" class="cm">• 年化算力有效回收价值: $1.31M / 年 (256-GPU 集群)</text>

  <rect x="930" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="946" y="644" class="ct">生产环境快速核验与售前打单 Checklist</text>
  <text x="946" y="668" class="cb">[✓] 严禁在未开启网卡 OoO 时在交换机硬开 Per-Packet Spray</text>
  <text x="946" y="692" class="cb">[✓] 存量 ECMP 集群调优 NCCL_IB_QPS_PER_CONNECTION=4~8</text>
  <text x="946" y="716" class="cb">[✓] 校验 ECN Kmin (~150-200KB) 必须早于 PFC XOFF 触发</text>
  <text x="946" y="740" class="cb">[✓] 网卡与交换机强制开启 PFC Watchdog (100~200ms 熔断)</text>
  <text x="946" y="764" class="cb">[✓] 轨道优化拓扑 (Rail-Optimized) 减少不必要跨 Spine 跳数</text>
  <text x="946" y="788" class="cm">Provenance: synthetic + anonymized_reported (non-GPU run)</text>
</svg>
