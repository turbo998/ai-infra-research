<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg632" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr632" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg632)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr632)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#632 机柜级超节点 (GB200 / GB300 NVL72 · 72卡 NVLink 5 铜背板) vs. 8卡 HGX H200/B200 选型指南</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Rack-Scale Supernodes (GB200 NVL72 130 TB/s All-Copper EP=72 &amp; Grace C2C) vs. 8-GPU HGX H200/B200: MoE Throughput, DLC &amp; Blast Radius</text>

  <!-- Left: 8-GPU HGX Multi-Node vs Right: GB200 NVL72 Rack -->
  <rect x="48" y="120" width="368" height="330" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="66" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">① 传统 8卡 HGX 跨节点拼装 (9台×8卡)</text>
  <rect x="64" y="164" width="336" height="126" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="76" y="186" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">物理架构：机内 NVLink (8卡) + 跨机 400G RDMA</text>
  <text x="76" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 机内 8卡 NVLink: 900~1,800 GB/s</text>
  <text x="76" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 跨节点 9台互联被迫降速至 400G RDMA (50 GB/s)</text>
  <text x="76" y="248" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5">• Scale-Up 与 Scale-Out 存在 18x~36x 带宽断崖！</text>
  <text x="76" y="270" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 671B MoE 单卡有效吞吐: 2,480 tok/s · TPOT 11.4ms</text>

  <rect x="64" y="302" width="336" height="134" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="76" y="324" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">✅ HGX 8卡服务器不可替代的三大优势场景：</text>
  <text x="76" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">1. 存量风冷 / ≤40kW 机柜直接上架 (无需改建 130kW 液冷)</text>
  <text x="76" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">2. 故障爆炸半径仅 8 张卡 (单台宕机不影响其余节点)</text>
  <text x="76" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">3. 中小规模 (&lt;64 GPU) 或 70B/32B 模型按需灵活扩缩容</text>
  <text x="76" y="408" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• ≤32 卡企业私有化部署仍首选 8卡 HGX H200/B200！</text>

  <!-- Center/Right: GB200 NVL72 Supernode -->
  <rect x="432" y="120" width="720" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="452" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">② 机柜级超节点 GB200 / GB300 NVL72：把 72 张 GPU 变成“单颗巨型芯片”</text>

  <rect x="452" y="164" width="330" height="148" rx="10" fill="#0f172a" stroke="#10b981"/>
  <text x="466" y="188" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">核心突破 1：130 TB/s 无源铜缆背板 (EP=72)</text>
  <text x="466" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 18 台 Compute Tray × 9 台 NVLink Switch Tray</text>
  <text x="466" y="230" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 5,000+ 根盲插铜缆，零光模块功耗与闪断故障</text>
  <text x="466" y="250" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 72卡任意两卡间全双工 1,800 GB/s (~0.5 μs)</text>
  <text x="466" y="272" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 256 个专家分摊到 72 卡 (每卡仅驻留 3~4 个专家)！</text>
  <text x="466" y="294" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 单卡有效吞吐飙至 7,240 tok/s · TPOT 4.8ms！</text>

  <rect x="800" y="164" width="334" height="148" rx="10" fill="#0f172a" stroke="#a855f7"/>
  <text x="814" y="188" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">核心突破 2：36颗 Grace CPU C2C 超大 L2 KV 池</text>
  <text x="814" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 每颗 Grace CPU 通过 900 GB/s NVLink-C2C</text>
  <text x="814" y="230" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">  直连 2 颗 Blackwell GPU (比 PCIe Gen5 快 7 倍!)</text>
  <text x="814" y="250" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 整柜聚合 17 TB LPDDR5X 一致性主机内存</text>
  <text x="814" y="272" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• L2 KV Cache 恢复带宽高达 16.2 TB/s/柜</text>
  <text x="814" y="294" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 128K 长文 KV 恢复耗时从 97ms 压至 14ms！</text>

  <rect x="452" y="326" width="682" height="110" rx="10" fill="#0f172a" stroke="#f59e0b"/>
  <text x="468" y="350" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">⚠️ 架构师必控三大风险红线 (NVL72 Production Guardrails)：</text>
  <text x="468" y="374" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">1. 132 kW/柜全冷板液冷 (DLC)：必须具备 N+1 冗余 CDU 分配单元与机柜漏液秒级关断，老旧风冷机房严禁强上；</text>
  <text x="468" y="396" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">2. 72卡原子故障域与 IMEX 隔离：K8s DRA + NMX-C 必须为每个租户动态分配独立 IMEX Channel，防跨租户显存越权；</text>
  <text x="468" y="418" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. 采购至少 ≥2 台 NVL72 机柜互备 (或配 HGX 热备池)，防止单柜 CDU/Fabric Manager 维护导致全站停服！</text>

  <!-- Bottom Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #632 机柜超节点 vs. 8卡 HGX 定量决战 (671B / 1T+ MoE 高并发深度推理)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 单卡有效吞吐: 2,480 tok/s (HGX H200) ➔ 7,240 tok/s (GB200 NVL72 EP=72 NVFP4 · 提升 2.92 倍)</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• P99 TPOT: 11.4 ms ➔ 4.8 ms (快 2.38x · 208 tok/s/user 瞬时秒出)   |   • 单百万词成本: $0.088 ➔ $0.039 / 1M (-55.7%)！</text>
</svg>
