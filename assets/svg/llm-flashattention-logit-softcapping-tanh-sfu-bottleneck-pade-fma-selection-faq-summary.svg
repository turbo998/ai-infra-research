<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 314 · FLASHATTENTION LOGIT SOFT-CAPPING (TANH) SFU BOTTLENECK &amp; PADE FMA</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">275 TFLOPS SFU MUFU.TANH Bottleneck vs. Rational Padé FMA + Folded Scale (585 TFLOPS, 2.13x Faster)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2: SFU MUFU.TANH Contention &amp; Slowdown</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (Unfused [N, N] Score Materialization):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Writes [32K, 32K] matrix to HBM for tanh -&gt; 78 TFLOPS!</text>
  <text x="85" y="305" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (Inline FlashAttention with Hardware MUFU.TANH):</text>
  <text x="85" y="333" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  MUFU.TANH competes with Online Softmax MUFU.EX2 on the</text>
  <text x="85" y="361" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  same narrow SFU pipe -&gt; TFLOPS drops 2.33x to 275 TFLOPS!</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Inline SFU MUFU.TANH: 275.0 TFLOPS (137.5 ms at 32K)</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Doubles SFU Pressure &amp; Breaks Pre-Scaled QK Multiplier</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Rational Padé FMA + Folded cap*log2(e)</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Polynomial / Padé Emulation on Idle FP32 FMA Pipes:</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Computes tanh(x) via pure FFMA instructions, freeing SFU</text>
  <text x="640" y="298" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  100% for Online Softmax MUFU.EX2!</text>
  <text x="640" y="335" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Folded Pre/Post Scaling (inv_cap &amp; cap * log2(e)):</text>
  <text x="640" y="363" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Absorbs 1/cap into Q scale &amp; cap*log2(e) into Padé numerator!</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Padé FMA Attention: 585.0 TFLOPS (2.13x Faster, 64.6 ms)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">Max Numerical Error &lt; 1.2e-5 (Bitwise BF16 Equivalence)</text>
</svg>
