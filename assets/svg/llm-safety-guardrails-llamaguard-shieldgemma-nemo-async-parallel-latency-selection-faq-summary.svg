<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#10B981" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">大模型安全护栏 (AI Guardrails) 选型：串行阻塞 vs. 异步投机并行流式拦截指南</text>
  <text x="52" y="94" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15">L1 CPU/DeBERTa 5ms 快筛 + L2 Llama-Guard-3/ShieldGemma 与主模型 Prefill 并发执行 + 32-Token 滑动窗口流式熔断</text>

  <!-- Left: Why Synchronous Guardrails Ruin Streaming -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么传统“串行安全护栏”会彻底毁掉流式交互体验？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 反模式 (Tier 1)：串行前置小模型 + 全量攒齐回复后再过审</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 请求先等 Input Guardrail (240ms) → 主模型算完 512 字 (2,800ms) → Output 审核 (260ms)</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 用户感知首字延迟从 185ms 暴涨至 3,300ms (+3.1 秒!)，流式输出彻底退化为整段干等</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">⚠️ 折中痛点 (Tier 2)：串行前置审核 + 按句缓冲输出</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 即便只做前置串行审核，99.4% 的正常用户在主模型启动前也必须白白多等 240~325ms</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 实时语音 Agent (要求 TTFT &lt; 250ms) 和 IDE 补全根本无法容忍串行前置 LLM 审核！</text>

  <!-- Right: Speculative Parallel + Sliding Window Architecture -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 零首字损耗“双层快筛 + 投机并行 + 滑动窗口流式熔断” (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① L1 极速确定性快筛 (5ms)：网关侧正则 PII 脱敏 + DeBERTa Prompt Shield</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">5ms 内直接拦截显式越狱模板与身份证/密钥泄漏，避免无谓消耗后端主模型 GPU</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② L2 输入并发投机：Llama-Guard-3-8B / ShieldGemma-2B 与主模型 Prefill 齐发</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">小模型审核 (95ms) 完全隐藏在主模型 Prefill (185ms) 阴影下！首 Token 门控仅增 +6ms！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 输出 32-Token 滑动窗口旁路流式审计：边流式下发边异步判别</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">一旦旁路检测到违规立即下发 SSE 撤回/熔断帧，兼顾 191ms 丝滑首字与 99.4% 安全召回！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 四档安全护栏架构延迟与安全召回对比（主模型基线 TTFT = 185ms · 180 RPS）</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">护栏执行架构</text>
  <text x="460" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">用户感知首字延迟</text>
  <text x="650" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">护栏附加 TTFT</text>
  <text x="820" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">风险拦截召回率</text>
  <text x="980" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">护栏算力占比</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度护栏成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 串行前置审核 + 全量回复缓冲后置审核</text>
  <text x="460" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">3,300.0 ms ✕</text>
  <text x="650" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">+3,115.0 ms ✕</text>
  <text x="820" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">99.3%</text>
  <text x="980" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14">28.0%</text>
  <text x="1120" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14">$54,000/mo</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 串行前置审核 + 按句缓冲流式输出</text>
  <text x="460" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">510.0 ms</text>
  <text x="650" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">+325.0 ms</text>
  <text x="820" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">98.8%</text>
  <text x="980" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">22.0%</text>
  <text x="1120" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$42,000/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 网关异步并行前置审核 (无输出审计)</text>
  <text x="460" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">198.0 ms</text>
  <text x="650" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">+13.0 ms</text>
  <text x="820" y="612" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">94.5% (漏输出)</text>
  <text x="980" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">14.0%</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$27,000/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): 5ms 快筛 + 并发前置门控 + 滑动窗口流式熔断</text>
  <text x="460" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">191.0 ms ✓</text>
  <text x="650" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">+6.0 ms ✓</text>
  <text x="820" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">99.4% ✓</text>
  <text x="980" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">8.5% ✓</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$16,500/mo</text>
</svg>
