<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg631" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr631" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg631)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr631)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#631 企业多模态 VLM 视觉 Token 精确手算公式与 E-P-D 三池异构解耦架构 (L40S → H100 → H200)</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Enterprise Multimodal VLM Visual Token Budget Math (Dynamic Tiles &amp; Video FPS) &amp; E-P-D 3-Pool Disaggregation Sizing Guide</text>

  <!-- Left: Visual Token Hand-Calculation Formulas -->
  <rect x="48" y="120" width="368" height="330" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="66" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">① 视觉 Token 手算公式 (1张高清图顶多少词?)</text>
  <rect x="64" y="164" width="336" height="126" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="76" y="186" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">1. 原生动态分辨率 (Qwen2.5-VL · 28×28/词)</text>
  <text x="76" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Patch 14×14 + 2×2 Pixel Merger = 784 px/tok</text>
  <text x="76" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• N_img = ceil(W/28) × ceil(H/28)</text>
  <text x="76" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 1080p (1920×1080) = 69 × 39 = 2,691 Tokens</text>
  <text x="76" y="270" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 4K 扫描件未限高分辨率 = 10,647 Tokens/页！</text>

  <rect x="64" y="302" width="336" height="134" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="76" y="324" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2. 动态分块 AnyRes (InternVL · 448×448=256词)</text>
  <text x="76" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• N_img = (N_tiles + 1 缩略图) × 256 Tokens</text>
  <text x="76" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 12 分块高清财报页 = (12 + 1) × 256 = 3,328 词</text>
  <text x="76" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 60秒视频 (2 FPS × 时空2合1) = 60 × 768 = 46K词</text>
  <text x="76" y="408" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 强制设定 max_pixels=1280×1280 防显存雪崩！</text>

  <!-- Center/Right: E-P-D 3-Pool Disaggregation -->
  <rect x="432" y="120" width="720" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="452" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">② 为什么多模态必须从 PD 分离升级为 E-P-D 三池异构解耦？</text>

  <rect x="452" y="166" width="218" height="154" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="466" y="190" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Pool E: 视觉编码池 (Encode)</text>
  <text x="466" y="212" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 硬件: 4× L40S PCIe ($850/卡)</text>
  <text x="466" y="232" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 专跑 600M~6B ViT 视觉编码器</text>
  <text x="466" y="252" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 参数极小无需 NVLink，纯拼算力</text>
  <text x="466" y="272" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• SHA-256 图像特征缓存 (命中78%)</text>
  <text x="466" y="294" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">  多轮追问同一张图 0ms 免重编！</text>

  <rect x="684" y="166" width="218" height="154" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="698" y="190" fill="#34d399" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Pool P: 语言预填充 (Prefill)</text>
  <text x="698" y="212" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 硬件: 4× H100 SXM ($2,300/卡)</text>
  <text x="698" y="232" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 接收 FP8 视觉 Embedding 向量</text>
  <text x="698" y="252" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 与文本 Token 拼接跑 72B Prefill</text>
  <text x="698" y="272" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 彻底剥离 ViT 引起的 180ms</text>
  <text x="698" y="294" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">  同卡 Tensor Core 抢占尖峰！</text>

  <rect x="916" y="166" width="218" height="154" rx="10" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="930" y="190" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Pool D: 语言解码池 (Decode)</text>
  <text x="930" y="212" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 硬件: 4× H200 SXM ($3,200/卡)</text>
  <text x="930" y="232" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 400G RDMA 接收跨模态 KV</text>
  <text x="930" y="252" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Decode 阶段无需再读原始图像</text>
  <text x="930" y="272" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• P99 TPOT 从 92.4ms 压至 13.2ms</text>
  <text x="930" y="294" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">  (流式提速 7.00 倍!)</text>

  <rect x="452" y="334" width="682" height="102" rx="10" fill="#0f172a" stroke="#f59e0b"/>
  <text x="468" y="358" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">⚠️ 为什么同卡混跑 VLM (Colocated ViT+LLM) 是生产灾难？</text>
  <text x="468" y="382" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">1. ViT 是全双向注意力 (无因果掩码)，一次传 4 张高清图会瞬间吃满 GPU 算力 210ms，卡死同卡所有文本 Decode；</text>
  <text x="468" y="404" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">2. 在 TP=4/8 大模型卡上跑仅有 600M 参数的 ViT，小张量 AllReduce 通信占比高达 45%，昂贵 H200 利用率仅 24%！</text>

  <!-- Bottom Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #631 多模态 E-P-D 三池解耦收益 (Qwen2.5-VL-72B · 20 QPS · 每请求 3 张 1080p 图 + 多轮追问)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• P95 TTFT: 3,420 ms ➔ 590 ms (提速 5.80x)   |   • P99 TPOT/ITL: 92.4 ms ➔ 13.2 ms (提速 7.00x)   |   • 图像缓存命中: 78.0%</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 集群总成本: 20× H200 同池 ($64,000/月) ➔ 4×L40S (E) + 4×H100 (P) + 4×H200 (D) = $25,400/月 (立省 60.3% TCO)！</text>
</svg>
