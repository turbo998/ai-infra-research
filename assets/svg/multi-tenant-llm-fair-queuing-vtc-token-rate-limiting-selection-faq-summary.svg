<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad74" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad74" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad74)" rx="16"/>
  <rect x="24" y="20" width="1232" height="86" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="54" fill="url(#accentGrad74)" font-size="22" font-weight="800">Round 74 · 多租户大模型公平队列 (VTC 虚拟令牌计数) 与弹性借用限流架构选型一图流</text>
  <text x="44" y="84" fill="#94A3B8" font-size="14">64×H100 混部 16 个交互对话租户 (500词) + 4 个重度批量租户 (64K词) · OSDI VTC 加权计费 + 512词分块抢占 (independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <g transform="translate(24, 124)">
    <!-- Tier 1 -->
    <rect x="0" y="0" width="296" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FCA5A5" font-size="15" font-weight="700">Tier 1 · 全局 FCFS 先来先服务 ✕</text>
    <text x="16" y="56" fill="#CBD5E1" font-size="12.5">无租户隔离 · 64K 批量洪水独占队列</text>
    <line x1="16" y1="70" x2="280" y2="70" stroke="#334155"/>
    <text x="16" y="98" fill="#94A3B8" font-size="12">交互 P99 TTFT：</text>
    <text x="165" y="98" fill="#EF4444" font-size="15" font-weight="800">4,850.0 ms (饿死 ✕)</text>
    <text x="16" y="128" fill="#94A3B8" font-size="12">Jain 公平指数：</text>
    <text x="165" y="128" fill="#FCA5A5" font-size="14" font-weight="700">0.38 (严重失衡 ✕)</text>
    <text x="16" y="158" fill="#94A3B8" font-size="12">集群 GPU 利用率：</text>
    <text x="165" y="158" fill="#FCA5A5" font-size="14" font-weight="700">88.5%</text>
    <text x="16" y="188" fill="#94A3B8" font-size="12">SLO 达标吞吐：</text>
    <text x="165" y="188" fill="#FCA5A5" font-size="14" font-weight="700">42,000 tok/s ✕</text>
    <text x="16" y="218" fill="#94A3B8" font-size="12">64卡年化等效成本：</text>
    <text x="165" y="218" fill="#EF4444" font-size="14" font-weight="800">$1,780,000 / yr ✕</text>
    <rect x="16" y="244" width="264" height="48" rx="8" fill="#2D1622"/>
    <text x="26" y="264" fill="#FDA4AF" font-size="11.5" font-weight="600">痛点：1 个批量部门并发塞入 50 个 64K 请求</text>
    <text x="26" y="282" fill="#FDA4AF" font-size="11.5">直接让全公司在线对话冻结近 5 秒！</text>

    <!-- Tier 2 -->
    <rect x="312" y="0" width="296" height="310" rx="12" fill="#1E2230" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="328" y="32" fill="#FCD34D" font-size="15" font-weight="700">Tier 2 · 按请求数 RPM 轮询 ✕</text>
    <text x="328" y="56" fill="#CBD5E1" font-size="12.5">1 请求 = 1 配额 (忽视 105x 大小差距)</text>
    <line x1="328" y1="70" x2="592" y2="70" stroke="#334155"/>
    <text x="328" y="98" fill="#94A3B8" font-size="12">交互 P99 TTFT：</text>
    <text x="477" y="98" fill="#EF4444" font-size="15" font-weight="800">1,620.0 ms (阻塞 ✕)</text>
    <text x="328" y="128" fill="#94A3B8" font-size="12">Jain 公平指数：</text>
    <text x="477" y="128" fill="#FBBF24" font-size="14" font-weight="700">0.56 ✕</text>
    <text x="328" y="158" fill="#94A3B8" font-size="12">集群 GPU 利用率：</text>
    <text x="477" y="158" fill="#FCD34D" font-size="14" font-weight="700">84.0%</text>
    <text x="328" y="188" fill="#94A3B8" font-size="12">SLO 达标吞吐：</text>
    <text x="477" y="188" fill="#FCD34D" font-size="14" font-weight="700">68,000 tok/s</text>
    <text x="328" y="218" fill="#94A3B8" font-size="12">64卡年化等效成本：</text>
    <text x="477" y="218" fill="#FCD34D" font-size="14" font-weight="700">$1,520,000 / yr</text>
    <rect x="328" y="244" width="264" height="48" rx="8" fill="#2E2418"/>
    <text x="338" y="264" fill="#FDE68A" font-size="11.5" font-weight="600">痛点：把 64K 巨型请求和 500 词短对话当成</text>
    <text x="338" y="282" fill="#FDE68A" font-size="11.5">1:1 等价轮询，大请求单回合仍堵死全场！</text>

    <!-- Tier 3 -->
    <rect x="624" y="0" width="296" height="310" rx="12" fill="#132A3E" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="640" y="32" fill="#7DD3FC" font-size="15" font-weight="700">Tier 3 · 标准 VTC + 静态硬限流 ⚠️</text>
    <text x="640" y="56" fill="#CBD5E1" font-size="12.5">加权令牌计数 + 唤醒对齐 + 死板 TPM 上限</text>
    <line x1="640" y1="70" x2="904" y2="70" stroke="#334155"/>
    <text x="640" y="98" fill="#94A3B8" font-size="12">交互 P99 TTFT：</text>
    <text x="789" y="98" fill="#38BDF8" font-size="15" font-weight="800">285.0 ms ✅</text>
    <text x="640" y="128" fill="#94A3B8" font-size="12">Jain 公平指数：</text>
    <text x="789" y="128" fill="#38BDF8" font-size="14" font-weight="700">0.96 ✅</text>
    <text x="640" y="158" fill="#94A3B8" font-size="12">集群 GPU 利用率：</text>
    <text x="789" y="158" fill="#FBBF24" font-size="15" font-weight="800">71.5% (28.5%空转 ✕)</text>
    <text x="640" y="188" fill="#94A3B8" font-size="12">SLO 达标吞吐：</text>
    <text x="789" y="188" fill="#7DD3FC" font-size="14" font-weight="700">112,000 tok/s</text>
    <text x="640" y="218" fill="#94A3B8" font-size="12">64卡年化等效成本：</text>
    <text x="789" y="218" fill="#7DD3FC" font-size="14" font-weight="700">$1,395,000 / yr</text>
    <rect x="640" y="244" width="264" height="48" rx="8" fill="#0C2238"/>
    <text x="650" y="264" fill="#BAE6FD" font-size="11.5" font-weight="600">局限：解决了饥饿，但交互租户闲时死守</text>
    <text x="650" y="282" fill="#BAE6FD" font-size="11.5">静态 TPM 上限，导致 28.5% GPU 白白空转。</text>

    <!-- Tier 4 -->
    <rect x="936" y="0" width="296" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.2"/>
    <text x="952" y="32" fill="#6EE7B7" font-size="15" font-weight="800">Tier 4 · 分层 VTC + 弹性借用 🏆</text>
    <text x="952" y="56" fill="#D1FAE5" font-size="12.5">闲时 100% 借用 + 512词分块 18ms 让路</text>
    <line x1="952" y1="70" x2="1216" y2="70" stroke="#334155"/>
    <text x="952" y="98" fill="#A7F3D0" font-size="12">交互 P99 TTFT：</text>
    <text x="1101" y="98" fill="#34D399" font-size="15" font-weight="800">210.0 ms (快 23.1x 🏆)</text>
    <text x="952" y="128" fill="#A7F3D0" font-size="12">Jain 公平指数：</text>
    <text x="1101" y="128" fill="#34D399" font-size="15" font-weight="800">0.99 (极致公平 🏆)</text>
    <text x="952" y="158" fill="#A7F3D0" font-size="12">集群 GPU 利用率：</text>
    <text x="1101" y="158" fill="#34D399" font-size="15" font-weight="800">94.8% (+23.3pt 🏆)</text>
    <text x="952" y="188" fill="#A7F3D0" font-size="12">SLO 达标吞吐：</text>
    <text x="1101" y="188" fill="#6EE7B7" font-size="14" font-weight="800">158,000 tok/s (3.76x)</text>
    <text x="952" y="218" fill="#A7F3D0" font-size="12">64卡年化等效成本：</text>
    <text x="1101" y="218" fill="#6EE7B7" font-size="13.5" font-weight="800">$1,010,000 (省 $385k)</text>
    <rect x="952" y="244" width="264" height="48" rx="8" fill="#062019"/>
    <text x="962" y="264" fill="#A7F3D0" font-size="11.5" font-weight="700">终极形态：加权 VTC + 唤醒对齐 + 闲时借用</text>
    <text x="962" y="282" fill="#A7F3D0" font-size="11.5">+ 512词分块毫秒抢占，鱼与熊掌兼得！</text>
  </g>

  <!-- Bottom Visual Comparison -->
  <rect x="24" y="454" width="1232" height="302" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="486" fill="#F8FAFC" font-size="16" font-weight="700">核心定量洞察：交互租户 P99 首字延迟与 GPU 满载率对比 &amp; OSDI VTC 加权令牌机制</text>

  <!-- Left Bar Chart -->
  <g transform="translate(44, 508)">
    <text x="0" y="20" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 1 全局 FCFS (P99 TTFT 4,850 ms · 公平度 0.38 · 在线对话彻底饿死 ✕)</text>
    <rect x="0" y="28" width="540" height="22" rx="4" fill="#EF4444"/>

    <text x="0" y="76" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 2 按请求数 RPM 轮询 (P99 TTFT 1,620 ms · 公平度 0.56 · 忽视 105x 长度差距 ✕)</text>
    <rect x="0" y="84" width="180" height="22" rx="4" fill="#F59E0B"/>

    <text x="0" y="132" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 3 标准 VTC + 静态硬限流 (P99 TTFT 285 ms · 公平度 0.96 · 但 28.5% GPU 闲置 ⚠️)</text>
    <rect x="0" y="140" width="32" height="22" rx="4" fill="#38BDF8"/>
    <text x="42" y="156" fill="#7DD3FC" font-size="11" font-weight="700">285 ms (GPU 满载率仅 71.5%)</text>

    <text x="0" y="188" fill="#6EE7B7" font-size="12.5" font-weight="700">Tier 4 分层 VTC + 弹性借用 + 512词分块抢占 (P99 TTFT 210 ms · 公平度 0.99 · 满载率 94.8% 🏆)</text>
    <rect x="0" y="196" width="24" height="22" rx="4" fill="#10B981"/>
    <text x="34" y="212" fill="#34D399" font-size="12" font-weight="800">210 ms! (满载率 94.8% · 年省 $385,000 🏆)</text>
  </g>

  <!-- Right Architecture Box -->
  <g transform="translate(650, 504)">
    <rect x="0" y="0" width="584" height="232" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="18" y="28" fill="#38BDF8" font-size="14" font-weight="700">第一性原理：三大机制实现“0.99 公平度 + 94.8% 满载率”</text>
    <text x="18" y="56" fill="#E2E8F0" font-size="12.5">① 异构 Token 加权虚拟计费 (C = 0.05*T_cache + 1.0*T_in + 2.5*T_out)：</text>
    <text x="32" y="76" fill="#94A3B8" font-size="12">精确反映 Decode 访存比 Prefill 贵 2.5 倍、缓存命中便宜 20 倍的物理 GPU 时间。</text>
    <text x="18" y="106" fill="#6EE7B7" font-size="12.5">② 唤醒虚拟计数器对齐 (v_i = max(v_i, min_j v_j))：</text>
    <text x="32" y="126" fill="#94A3B8" font-size="12">沉默一上午的批量租户重新上线时立即对齐当前活跃最小水位，严禁跨时段攒假霸占。</text>
    <text x="18" y="156" fill="#FCD34D" font-size="12.5">③ 弹性借用 (Spot Borrow) + 512-Token 分块级 18ms 秒级抢占：</text>
    <text x="32" y="176" fill="#94A3B8" font-size="12">交互租户闲时允许批量任务 100% 借用空闲算力；一旦交互请求到达，在下一个 512 词</text>
    <text x="32" y="196" fill="#94A3B8" font-size="12">微块边界 (&lt;18ms) 立即暂停借用流让路，白捡回 +23.3% 闲置 GPU 算力！</text>
  </g>
</svg>
