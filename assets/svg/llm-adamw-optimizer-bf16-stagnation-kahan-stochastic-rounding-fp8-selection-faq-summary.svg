<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 260 · LOW-PRECISION ADAMW: BF16 STAGNATION VS STOCHASTIC ROUNDING VS KAHAN &amp; FP8 MOMENTS FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">AdamW Compression: Pure BF16 Stagnation (+0.38 Loss) vs `Kahan + FP8 Moments` (-50% HBM, +0.001)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: BF16 Underflow vs 980GB FP32 Bloat</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (Pure `BF16` Master Weights): `BF16` has only `7` mantissa bits</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  ($2^{-8} \approx 0.0039$ RNE cutoff); `78%` of updates (`lr=3e-5`) evaluate</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  to `BF16(w + Δw) == w` (`+0.380` loss stagnation)! ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (Full `FP32` `w, m, v`): Eats `14 B/param` (`980 GB` on 70B)!</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Pure BF16 Loss Gap: +0.380 (Stalled!) | FP32 State: 980 GB ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Dropping FP32 Master Weights Without Compensation Halts Convergence</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: `Kahan Residual` + Block-Wise `FP8` Moments</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tracks exact sub-ULP update residual via `Kahan Summation`</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  (or retains `FP32` master weights while compressing $m, v$!)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Quantizes 1st moment $m$ to Block-Wise `FP8 (1B)` &amp; 2nd moment $v$</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  to `BF16/FP8 (1-2B)` (`14 B/param -> 7 B/param`, saving `490 GB`!)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">70B State HBM: 490.0 GB (-50.0%) | Loss Gap: +0.001 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Deterministic Sub-ULP Accumulation + 2x Faster Optimizer Step</text>
</svg>
