<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg178" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc178" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg178)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="410" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="257" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 178 · VLLM V1 &amp; SGLANG ZERO-OVERHEAD SCHEDULER</text>
  <text x="478" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">大模型推理引擎 CPU 调度开销、Python GIL 与零开销异步多进程架构选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">为什么 $30 万的 8×H200 有 52.7% 时间在干等 Python CPU？ZMQ 多进程 + 增量批状态 + 异步重叠调度将吞吐翻 2.08x</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc178)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="224" height="24" rx="6" fill="#7f1d1d"/>
  <text x="180" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 单进程同步循环 (vLLM V0)</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">GPU 52.7% 时间空转等 CPU</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">HTTP + Tokenizer + 调度共抢 1 个 GIL</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制灾难：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">GPU 算一步仅需 5.2ms，但 Python 主线程</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">做分页调度+反分词却要停顿 5.80ms ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 暴露 CPU 空泡: <tspan fill="#f87171" font-weight="700">5.80 ms / 步 ✕</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• GPU 有效满载率: <tspan fill="#f87171" font-weight="700">仅 47.3% (过半闲置 ✕)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TPOT / 吞吐: <tspan fill="#f87171" font-weight="700">14.8 ms / 11,636 tok/s</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#f87171" font-weight="700">$0.96 / 1M tok ✕</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 已淘汰 (H200/B200 算力浪费过半)</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="228" height="24" rx="6" fill="#78350f"/>
  <text x="482" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 多进程 ZMQ + 全量重建</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">拆开 GIL 但每步全量传页表</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">独立 API/Tokenizer 进程 + 2.15ms 空泡</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么拆了进程还是有 2.15ms 空泡？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">每步把 128 个请求的完整 Block Table 重建</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">并通过 IPC 发给 8 个 Worker，且同步等采样</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 暴露 CPU 空泡: <tspan fill="#fbbf24" font-weight="700">2.15 ms / 步</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• GPU 有效满载率: <tspan fill="#fbbf24" font-weight="700">70.7%</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TPOT / 吞吐: <tspan fill="#fbbf24" font-weight="700">9.6 ms / 17,415 tok/s</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#fbbf24" font-weight="700">$0.64 / 1M tok</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 仍存在同步采样与全量状态拷贝</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="232" height="24" rx="6" fill="#0c4a6e"/>
  <text x="784" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · vLLM V1 持久化增量批状态</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">仅传 1-Token 增量 (0.65ms)</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Persistent InputBatch + CachedRequestData</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (IPC 数据量砍掉 96%)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">GPU Worker 常驻保存请求页表，调度器每步</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">只通过 msgspec 发送新块 Delta 差量！</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 暴露 CPU 空泡: <tspan fill="#38bdf8" font-weight="800">0.65 ms / 步 ✅</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• GPU 有效满载率: <tspan fill="#38bdf8" font-weight="800">88.9% ✅</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TPOT / 吞吐: <tspan fill="#38bdf8" font-weight="800">7.2 ms / 21,880 tok/s ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#38bdf8" font-weight="800">$0.51 / 1M (-46.9% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ vLLM V1 默认核心架构底座</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 零开销异步重叠调度 (Overlap)</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">0.08ms 零空泡 · 98.5% 满载</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">GPU Future Token 槽位 + 双流完全隐藏</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (CPU 空泡压缩 72.5x)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">GPU 跑第 N 步时，CPU 提前排好第 N+1</text>
  <text x="980" y="327" fill="#e2e8f0" font-size="11.5" font-family="Segoe UI, Inter, sans-serif">步并指向 GPU Future Token 槽位，零等待</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 暴露 CPU 空泡: <tspan fill="#34d399" font-weight="800">仅 0.08 ms / 步 (减 72.5x 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• GPU 有效满载率: <tspan fill="#34d399" font-weight="800">98.5% (永不停机 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TPOT / 吞吐: <tspan fill="#34d399" font-weight="800">5.8 ms / 24,242 tok/s (2.08x 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#34d399" font-weight="800">$0.46 / 1M (-52.1% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 H200 / B200 高速推理引擎终局</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：第 N 步的 Token 还没算出来，CPU 怎么提前把第 N+1 步发射给 GPU？（Future Token Map 原理解密）</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：为什么传统引擎每步必须 `cudaStreamSynchronize()` 停顿？</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 传统调度器认为：必须等第 N 步 GPU 算完 Logits 并采样出 Token ID 传回 CPU，</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  CPU 才知道第 N+1 步的输入 Token 是谁、有没有生成 EOS 结束符；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 这一次同步阻塞直接让价值 $30 万的 GPU 停工干等 CPU 调度器整整 2~6 毫秒！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：GPU 显存“未来占位符（Future Token Slot）”实现 100% 异步重叠</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 在第 N 步 GPU 正在算矩阵时，CPU 直接假设请求未结束，提前分配第 N+1 步的</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  KV 页表（长度 +1），并将输入 Token ID 填为一个负数指针 `-req_idx`（Future Slot）；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 第 N 步采样器在 GPU 显存原地写好真 Token 后，第 N+1 步无缝启动，CPU 空泡仅 0.08ms 🏆！</text>
</svg>
