<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad391" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad391" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad391)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级浏览器与电脑操控 (Browser-Use / Computer-Use GUI Agent) 生产架构选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：API/MCP 优先 + 确定性 Playwright 脚本缓存回放 (仅改版时调 AXTree+SoM 自愈)，将成功率从 71.5% 提至 98.2%、快 11.1x 且省 94.6%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 391 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 纯屏幕截图坐标点击</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 每步截 1080p 图发给 VLM 猜 (x,y) 像素</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 遇到小字下拉框/滚动条偏移频繁点歪</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 15步流程成功率：仅 71.5% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 单流程平均耗时：51.0 秒 ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 单流程 Token 消耗：38,000 tok ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">20万流程月成本：$96,000 / 月 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：填一张报销单要看大模型点一分钟</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">且每步 98% 成功率连乘 15 步就掉到 74%！</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 原始 HTML DOM 全塞</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 直接把网页 `page.content()` 塞给 LLM</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 单页 React/Vue 嵌套 div 高达 80K+ Token</text>
  <text x="332" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 15步流程成功率：64.0% ✕</text>
  <text x="332" y="232" fill="#fde68a" font-size="12" font-weight="700">• 单流程平均耗时：32.5 秒</text>
  <text x="332" y="252" fill="#fca5a5" font-size="12">• 单流程 Token 消耗：145,000 tok ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">20万流程月成本：$68,000 / 月 ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">大坑：99% 是无意义的 CSS class 乱码</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">且极易被网页隐藏 `display:none` 提示词注入</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 无障碍树 AXTree + SoM</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 仅提取可见可交互元素 (1.8K Token)</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 叠加 Set-of-Marks `[#12]` 数字标签框</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 15步流程成功率：88.5% ✅</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 单流程平均耗时：14.2 秒 ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 单流程 Token 消耗：16,500 tok</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">20万流程月成本：$16,400 (省82.9%)✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：首次探索未知网页的标准感知底座</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">消除了猜像素坐标誤差，按元素 ID 精准点击</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 脚本录制回放+自愈+HITL🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 首跑编译为确定性 Playwright 脚本缓存</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 85% 步骤 0-Token 毫秒级执行，改版才自愈</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 15步流程成功率：98.2% 🏆 (+26.7pts)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 单流程平均耗时：4.6 秒 🏆 (快 11.1x)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 登录 MFA / 付款提交强制移交人类审批</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">20万流程月成本：$5,200 (省 94.6%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级新一代 AI-RPA 生产终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">平时像传统脚本一样快，网页改版时像AI一样聪明</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么企业级 Browser-Use 绝不能“每次都让大模型从头看图点鼠标”？三大生产级架构法则</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad391)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 首跑探索录制，次跑确定性回放（Compile-Once, Replay-Many）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 企业 ERP 报销与采购流程每天重复跑上万次，页面结构 99% 时间不变！</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 第 1 次由 `AXTree + SoM` Agent 探索成功后，自动沉淀为</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  参数化 Playwright 选择器脚本 (`page.getByRole('button', ...)`)</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 后续 9,999 次直接跑毫秒级确定性代码（0 Token！），仅选择器失效时唤醒 LLM 自愈！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 用 Set-of-Marks (SoM) + AXTree 取代盲猜 `(x,y)` 像素</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 严禁让大模型输出 `click(x=438, y=712)`（分辨率微调即点歪）！</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 用 JS 脚本遍历所有可见可点击 DOM 节点，在截图上画带编号的</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  红框 `[#24]` 并提取精简 Accessibility Tree 文本列表；</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 大模型只需输出 `click(element_id=24)`，由 Playwright 100% 精准点击中心！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 敏感步骤人类移交（HITL Handoff）与防隐藏注入</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 严禁把员工明文密码喂给大模型，严禁让 Agent 自动点“最终打款提交”！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 遇到 SSO/MFA 登录、图形验证码、金额确认页时，通过 WebRTC/VNC</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  把同一个浏览器 Tab 控制权无缝移交人类点击，填完切回 Agent！</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">• 同时过滤 `opacity:0 / display:none` 隐藏节点，阻断网页视觉注入！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 391 合成标定算例 (independently_reproduced=false)</text>
</svg>
