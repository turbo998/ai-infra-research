  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (OS Default: numa_balancing=1 + THP=always):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Auto-NUMA periodically unmaps pages -&gt; 128-core IPI TLB</text>
  <text x="85" y="298" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  shootdown + THP direct compaction freezes thread for 620ms!</text>
  <text x="85" y="335" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (THP=never 4KB Only + numa_balancing=1):</text>
  <text x="85" y="363" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Still suffers 340ms NUMA migration stalls + high dTLB misses!</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">CPU Launch Pause Jitter: 620.0 ms (44.5% Step Lag!)</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">512-GPU Cluster MFU Drops to 39.8% From Random Node Pauses</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: numa_balancing=0 + THP=madvise + HugeTLB</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Disable Auto-NUMA (sysctl kernel.numa_balancing=0):</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Eliminates periodic page-fault scanning &amp; TLB shootdowns</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• THP=madvise + defrag=defer+madvise:</text>
  <text x="640" y="333" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Prevents synchronous Direct Compaction on page allocation</text>
  <text x="640" y="368" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Pre-Reserved Static 2MB/1GB HugeTLB Pool for DMA/RDMA</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">CPU Pause Jitter: 0.4 ms (1,550x Lower) · Slowdown: 0.8%</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">512-GPU Cluster MFU Restored to 58.9% (+19.1% MFU Gain)</text>
