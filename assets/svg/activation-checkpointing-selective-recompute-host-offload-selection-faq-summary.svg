<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad82" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad82" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad82)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad82)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22.5" font-weight="800">♻️ 大模型训练激活重计算 (Activation Checkpointing)、选择性算子重算 (SAC) 与异步卸载选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">128×H100 80GB ($320/hr) · 70B LLM (80 层, 32K 序列, TP=8, CP=2, FSDP2; 权重+优化器=28.4GB) · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#99f6e4" font-size="13" font-weight="700" text-anchor="middle">Round 82 · SAC &amp; Async Offload</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 不开重计算 (全留激活值)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">每层保留全部 34bsh 中间张量 · 瞬间爆 OOM</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡激活值显存占用: <tspan fill="#f87171" font-weight="700">118.4 GB / GPU ✕</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 单卡总 HBM 显存需求: <tspan fill="#f87171" font-weight="700">146.8 GB (超 80GB OOM ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 额外重算 FLOP 开销: <tspan fill="#cbd5e1" font-weight="700">0.0% (根本跑不起来)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 有效训练 Goodput MFU: <tspan fill="#f87171" font-weight="700">0.0% (OOM 崩溃 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 被迫切小 Batch 损失: <tspan fill="#f87171" font-weight="700">年损 $1,420,000 ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么 FSDP 切了权重还是爆显存？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">FSDP 只分片权重、梯度和优化器（共 28.4GB）；</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">而 80 层前向传播留给反向求导用的中间激活值</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">高达 118.4GB，直接撑爆 80GB HBM！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 全量层边界重计算 (Full Ckpt)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">只存每层入口 · 反向传播把整层矩阵乘重算一遍</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡激活值显存占用: <tspan fill="#fbbf24" font-weight="700">14.2 GB / GPU</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 单卡总 HBM 显存需求: <tspan fill="#fbbf24" font-weight="700">42.6 GB / 80 GB</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 额外重算 FLOP 开销: <tspan fill="#f87171" font-weight="700">+33.3% (白送 1 次前向 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 有效 Goodput MFU / 吞吐: <tspan fill="#f87171" font-weight="700">43.2% ✕ · 148.5k tok/s</tspan></text>
    <text x="16" y="180" y2="180" fill="#94a3b8" font-size="12">• 重算白烧算力年损: <tspan fill="#f87171" font-weight="700">$698,000 / yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 一行 `gradient_checkpointing_enable()` 的代价：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">连最耗算力的 QKV/FFN 巨型矩阵乘 (GEMM) 也</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">被全部扔掉重算！每步从“1前+2反=3份算力”变</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">成“2前+2反=4份算力”，25% GPU 在做无用功！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 算子级选择性重算 (SAC)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">保留昂贵 GEMM 输出 · 只重算 FlashAttn/SwiGLU</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡激活值显存占用: <tspan fill="#60a5fa" font-weight="700">34.8 GB / GPU (-70.6% ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 单卡总 HBM 显存需求: <tspan fill="#60a5fa" font-weight="700">63.2 GB (≤32K 装得下 ✅)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 额外重算 FLOP 开销: <tspan fill="#34d399" font-weight="700">仅 +2.8% (降 11.9x 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 有效 Goodput MFU / 吞吐: <tspan fill="#60a5fa" font-weight="700">54.6% ✅ · 187.7k tok/s</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 十亿词成本: <tspan fill="#60a5fa" font-weight="700">$473.40 / 1B ✅</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 二八定律：70% 显存来自 3% 算力的算子！</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">SwiGLU、RMSNorm、RoPE 与 Attention 中间态占</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">了 70% 激活显存，但重算只需 2.8% FLOPs！保</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">留 GEMM 输出即可白捡回 +11.4pt 有效 MFU！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: SAC + 零 SM 异步 PCIe 卸载 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">Copy Engine 异步卸载 GEMM 激活 + 提前 1 层预取</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡激活值显存占用: <tspan fill="#34d399" font-weight="700">10.4 GB (-91.2% 极致压降 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 单卡总 HBM 显存需求: <tspan fill="#34d399" font-weight="700">38.8 GB (128K 也不爆 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 额外重算 FLOP 开销: <tspan fill="#34d399" font-weight="700">仅 +2.8% 🏆</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 有效 Goodput MFU / 吞吐: <tspan fill="#34d399" font-weight="700">56.8% (+13.6pt) · 195.2k 🏆</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 年净省算力: <tspan fill="#34d399" font-weight="700">$455.20/1B · 年省 $612,000 🏆</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 64K~128K 超长序列训练终极形态：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">前向用硬件 DMA 引擎把保留的 GEMM 激活流式</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">拷入主机 Pinned DRAM，反向提前 1 层异步拉回</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">100% 掩盖 PCIe 传输，比 Full Ckpt 快 1.31 倍！</text>
  </g>

  <!-- Bottom Left: Sequence Length Scaling Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📈 训练序列从 8K 扩至 128K 时的单卡总 HBM 显存占用 (GB / 80GB 上限)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">对比纯算子选择性重算 (Tier 3 SAC) 与 SAC + 异步 PCIe 主机内存卸载 (Tier 4)</text>

    <!-- 8K -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">8K 序列 (常规预训练)</text>
    <rect x="195" y="74" width="62" height="14" rx="3" fill="#10b981"/>
    <text x="265" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">31.0 GB (Tier 4 · MFU 57.5% 🏆)</text>
    <rect x="195" y="92" width="74" height="14" rx="3" fill="#3b82f6"/>
    <text x="277" y="104" fill="#93c5fd" font-size="11.5" font-weight="700">37.1 GB (Tier 3 SAC)</text>

    <!-- 32K -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">32K 序列 (长文本基线)</text>
    <rect x="195" y="124" width="78" height="14" rx="3" fill="#10b981"/>
    <text x="281" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">38.8 GB (Tier 4 · 省 24.4GB 🏆)</text>
    <rect x="195" y="142" width="126" height="14" rx="3" fill="#3b82f6"/>
    <text x="329" y="154" fill="#93c5fd" font-size="11.5" font-weight="700">63.2 GB (Tier 3 SAC)</text>

    <!-- 64K -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">64K 序列 (整仓代码 SFT)</text>
    <rect x="195" y="174" width="98" height="14" rx="3" fill="#10b981"/>
    <text x="301" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">49.2 GB (Tier 4 · MFU 55.9% 🏆)</text>
    <rect x="195" y="192" width="196" height="14" rx="3" fill="#ef4444"/>
    <text x="399" y="204" fill="#f87171" font-size="11.5" font-weight="700">98.0 GB (Tier 3 超 80GB OOM ✕)</text>

    <!-- 128K -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">128K 序列 (超长 Agent 轨迹)</text>
    <rect x="195" y="224" width="137" height="14" rx="3" fill="#10b981"/>
    <text x="340" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">68.4 GB (Tier 4 稳装进 80GB 🏆)</text>
    <rect x="195" y="242" width="315" height="14" rx="3" fill="#ef4444"/>
    <text x="516" y="254" fill="#f87171" font-size="11.5" font-weight="700">167.6 GB (OOM ✕)</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#99f6e4" font-size="11.5" font-weight="700">💡 物理洞察：单层计算耗时 (~18ms) 远大于 PCIe Gen5 搬运单层 GEMM 激活耗时 (~4.8ms)，100% 掩盖！</text>
  </g>

  <!-- Bottom Right: 3 Rules for Activation Checkpointing -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 激活重计算 (SAC) 与主机卸载架构设计三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：严禁无脑使用 `Full Layer Checkpointing` 重算线性层 GEMM</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• QKV / O / FFN 矩阵乘占了每层 97% 的 FLOPs，但它们的激活输出只占每层 30% 的显存；</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">• 使用 PyTorch `Selective Activation Checkpointing (SAC)` 永远保留 GEMM 输出 (`MUST_SAVE`)！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：精准重算 `FlashAttention + SwiGLU + RMSNorm + RoPE`</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• SwiGLU 中间维高达 `28,672`，占了巨量显存却只需极少逐元素乘法；FlashAttention 内置</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  保存 `logsumexp` 重算仅占 ~2% 算力——重算这四项即可省掉 70.6% 激活显存！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="34" y="250" fill="#99f6e4" font-size="13" font-weight="800">3️⃣ 铁律三：长序列 (≥32K) 用独立 Copy Engine Stream 异步卸载至 Pinned DRAM</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 严禁在默认计算 Stream 上跑同步拷贝；必须预分配锁页内存池并调用 `cudaMemcpyAsync`，</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  走 GPU 硬件 DMA Copy Engine（0 个 SM 占用），反向传播提前 1 层预取回 HBM！</text>
  </g>
</svg>
