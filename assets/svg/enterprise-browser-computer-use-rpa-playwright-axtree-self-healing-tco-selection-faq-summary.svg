<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级浏览器与桌面操控智能体 (Browser/Computer-Use) 选型：纯视觉 CUA vs. 传统 RPA vs. AXTree+脚本自愈 (#428)</text>
  <text x="28" y="58" class="sub">为什么每次执行都让多模态大模型看屏幕截图猜 (x,y) 像素坐标需要 48 秒且单次烧掉 $0.42？用“探索生成脚本 -&gt; 确定性回放 -&gt; 报错自愈”省 95.8%！</text>

  <!-- Left Panel: Pure Vision Pixel Clicking Trap vs Script-Compiled Replay with LLM Self-Healing -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. GUI 自动化三大误区：原始 HTML 硬塞 vs. 纯视觉猜坐标 vs. 确定性脚本缓存自愈</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 误区 A (原始 HTML DOM 硬塞 180K Tok) &amp; 误区 B (每步纯视觉截图猜 (x,y) 坐标)</text>
  <text x="56" y="164" class="mono">• 现代 React/ERP 页面含数万个隐藏 div 与随机 class，原始 HTML 塞爆 180K Tokens！</text>
  <text x="56" y="184" class="mono">• 纯视觉 Computer-Use：15 步填单截 15 张 1080p 图，耗时 48.5 秒、单次烧 $0.42，</text>
  <text x="56" y="202" class="txt">  且分辨率缩放/弹窗偏移极易点歪按钮，每天跑 10 万次账单高达 $126万/月！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：精简无障碍树 (AXTree + SoM) + 编译为 Playwright 脚本缓存 + 报错自愈</text>
  <text x="56" y="272" class="mono">• 首次探索 (1% 流量)：提取可交互节点无障碍树 (AXTree, 仅 1.8K Tok) + 编号标签 (Set-of-Marks)</text>
  <text x="56" y="292" class="mono">• 稳态回放 (98% 流量)：将成功路径固化为确定性 Playwright 脚本，0 Token 消耗、3.2s 跑完！</text>
  <text x="56" y="312" class="txt">• 动态自愈 (1% 改版)：当网页改版导致选择器失效时，自动唤醒 LLM 重新定位并热更新脚本！</text>

  <!-- Right Panel: 4 Browser / Computer-Use Architectures Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业 GUI 与浏览器自动化方案横向对标 (300 万次 15 步流程/月)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fde68a">Tier 1: 传统刚性 RPA (UiPath / Power Automate Desktop 静态 XPath)</text>
  <text x="638" y="158" class="mono">• 零 Token 费但网页一改版即全线报错停摆 (月均中断率 18.5% ✕) | 维护人力重 | $145,000/月</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fca5a5">Tier 2: 100% 在线纯视觉大模型 (Every-Run Pure Vision CUA / Screenshot Clicking)</text>
  <text x="638" y="214" class="mono">• 抗改版强，但每次跑 15 步耗时 48.5s ✕ | 完结率 86.4% | 月烧 $1,260,000/月 ✕</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 每次在线跑 AXTree + Set-of-Marks (Browser-Use / Stagehand 实时推理)</text>
  <text x="638" y="270" class="mono">• 用 [12] 编号替代像素坐标，完结率升至 94.2% | 耗时 16.5s | 月成本 $198,000/月</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: CDP API 旁路 + Playwright 确定性缓存回放 (98%) + AXTree/SoM 自愈 (2% 🏆)</text>
  <text x="638" y="326" class="mono">• 耗时 3.2s (快 15x) 🏆 | 完结率 99.3% 🏆 | 敏感步骤 HITL 移交 | 仅 $18,600/月 (-98.5%)!</text>

  <!-- Bottom Panel: End-to-End 4-Stage Self-Healing Browser Agent Architecture -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端生产级浏览器/桌面操控 Agent 参考架构：API 优先 -&gt; 确定性回放 -&gt; AXTree/SoM 自愈 -&gt; 人类敏感接管</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① CDP 网络拦截旁路 (API-First)</text>
  <text x="56" y="464" class="mono">• 别模拟翻页点 50 次表格！</text>
  <text x="56" y="484" class="mono">• 通过 Chrome DevTools Protocol</text>
  <text x="56" y="504" class="mono">  直接捕获页面底层 XHR/Fetch</text>
  <text x="56" y="524" class="mono">  JSON 接口，复用已登录 Cookie</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">把 60s UI 翻页变成 0.2s 接口拉取！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 98% 确定性 Playwright 缓存回放</text>
  <text x="332" y="464" class="mono">• 首次由 Agent 跑通后，自动导出</text>
  <text x="332" y="484" class="mono">  带语义锚点 (`getByRole/Label`)</text>
  <text x="332" y="504" class="mono">  的确定性 Playwright 脚本</text>
  <text x="332" y="524" class="mono">• 后续 98% 常规执行 0 LLM 调用</text>
  <text x="332" y="550" class="txt" fill="#34d399">端到端仅需 3.2 秒，成本趋近于 $0！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 2% 改版异常触发 AXTree+SoM 自愈</text>
  <text x="620" y="464" class="mono">• 当选择器超时报错时，不中断任务！</text>
  <text x="620" y="484" class="mono">• 提取精简无障碍树 (1.8K Tok) +</text>
  <text x="620" y="504" class="mono">  元素数字红框 (Set-of-Marks)</text>
  <text x="620" y="524" class="mono">• LLM 重新识别新按钮并自动修复脚本</text>
  <text x="620" y="550" class="txt" fill="#fde68a">彻底告别传统 RPA 改版即瘫痪顽疾</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 敏感步骤人类移交 (HITL Handoff)</text>
  <text x="908" y="464" class="mono">• 严禁把网银 U 盾/MFA 短信验证码/</text>
  <text x="908" y="484" class="mono">  最终付款确认交由大模型盲点！</text>
  <text x="908" y="504" class="mono">• 通过 WebRTC 远程浏览器视图将</text>
  <text x="908" y="524" class="mono">  当前标签页临时移交人类点击确认</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">零密码外泄，任务完结率冲上 99.3%</text>
</svg>
