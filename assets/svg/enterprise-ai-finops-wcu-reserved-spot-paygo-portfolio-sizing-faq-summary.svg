<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#574 企业 AI FinOps 成本治理：WCU 加权算力分账、Reserved/Spot/PAYGO 三层组合与三级平滑降级</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">WCU = 1.0×In + 0.1×Cached + 4.5×Out 分账精度 99.6% · 60% 预留 + 25% Spot 批处理 + 15% PAYGO · 80%/95% 平滑降级消灭月底 429 断服</text>

  <!-- Box 1: WCU Accounting -->
  <rect x="24" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 为什么按原始 Token 平摊分账必然失真？</text>
  <rect x="42" y="152" width="310" height="96" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 误区：Raw Token Count (In + Out) 平摊</text>
  <text x="52" y="191" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 部门 A 跑 16K 共享前缀 RAG (90% 命中缓存)</text>
  <text x="52" y="209" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 部门 B 跑 DeepSeek-R1 4K 长思维链生成</text>
  <text x="52" y="227" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">• 按总词数平摊导致部门 A 被多收 340% 冤枉钱!</text>

  <rect x="42" y="256" width="310" height="112" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="276" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">🏆 标准：加权算力单元 (WCU) 硬件归因公式</text>
  <text x="52" y="296" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11.5" font-weight="bold">WCU = 1.0×In_new + 0.1×In_cache + 4.5×Out</text>
  <text x="52" y="315" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 精确映射 GPU Tensor Core 与 HBM 带宽占用时长</text>
  <text x="52" y="333" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 结合 OpenCost + DCGM 实测卡时对账：精度 99.6%</text>
  <text x="52" y="351" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 激励业务部门主动做好 Prompt 前缀置顶优化!</text>

  <!-- Box 2: 3-Tier Portfolio & Graceful Downgrade -->
  <rect x="386" y="110" width="354" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="404" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 三层算力组合 + 预算三级平滑降级 🏆</text>
  <rect x="404" y="152" width="318" height="98" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="416" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">1. 60% 预留 + 25% Spot 竞价 + 15% PAYGO 组合</text>
  <text x="416" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 核心实时流量走 Reserved K8s / PTU 保 SLA</text>
  <text x="416" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 离线 ETL / 评测 / 索引构建走 3.5 折 Spot GPU 池</text>
  <text x="416" y="227" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 突发尖峰走 Serverless PAYGO (零闲置浪费)</text>

  <rect x="404" y="258" width="318" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="416" y="278" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">2. 告别月底硬切 429：80% / 95% 三级平滑降级</text>
  <text x="416" y="297" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 水位 &lt; 80%：正常按需路由 70B/671B 旗舰模型</text>
  <text x="416" y="315" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 水位 80%~95%：自动切入 82% 8B 蒸馏 + 18% 70B</text>
  <text x="416" y="333" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 水位 &gt; 95%：收敛 &lt;think&gt; 预算 + 非实时转夜间 Spot</text>
  <text x="416" y="351" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 业务连续性达 99.96%，月度账单立省 54.8%!</text>

  <!-- Box 3: Quantitative Comparison -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 三种 FinOps 治理方案对标</text>
  <rect x="774" y="152" width="264" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="176" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 A (大锅饭无配额 + 全按量/全预留):</text>
  <text x="786" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 分账误差: 34.5% · 月底超支 +68%</text>
  <text x="786" y="212" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 月度支出: $210,000 / 月</text>

  <text x="786" y="242" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 B (原始 Token 硬限额 + 超额 429):</text>
  <text x="786" y="260" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 月底最后 4 天核心业务被 429 熔断断服 ✕</text>
  <text x="786" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 业务连续性跌至 91.2% ($158,000/月)</text>

  <text x="786" y="308" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 C (WCU + 三层组合 + 平滑降级) 🏆</text>
  <text x="786" y="326" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 分账精度 99.6% · 连续性 99.96%</text>
  <text x="786" y="344" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 月度支出 $95,000 / 月 (净省 54.8%!)</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 企业级 AI FinOps 落地三板斧（OpenTelemetry GenAI + Redis WCU + Spot 抢占保护）：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. 埋点标准：网关全量注入 gen_ai.usage.{input_tokens, cached_tokens, output_tokens, tenant_id, cost_center} 标签。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">2. Spot 防抢占：Spot GPU 池配合 Ray Data 分钟级断点续传与 CRIU/vLLM Sleep Mode，30s 回收通知内无损迁移。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">3. 平滑降级：严禁对生产业务直接返回 HTTP 429 Quota Exceeded，必须通过网关策略引擎自动降档模型与思维链预算！</text>
</svg>
