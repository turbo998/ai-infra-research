<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 264 · LONG-CONTEXT ROPE EXTENSION (8K -&gt; 128K): LINEAR PI VS NTK-BY-PARTS &amp; YARN FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">RoPE 8K→128K Extension: Linear PI Blur (68.5%) vs `YaRN NTK-by-Parts + mscale` (91.8%)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Linear PI &amp; Uniform Dynamic NTK</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• RoPE has 64 clock hands: High-freq "Second Hands" ($\lambda &lt; 8\text{K}$)</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  already rotated 1,000+ full circles and NEVER go OOD!</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`Linear PI` $m \leftarrow m/16$): Slows the Second Hand by `16x`,</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  blurring adjacent tokens (`-4.8%` 4K drop, `68.5%` 128K RULER)! ✕</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Linear PI 4K Acc: 78.2% (-4.8 pt) | 128K RULER: 68.5% ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Never Downscale High-Frequency RoPE Dimensions That Already Wrap $2\pi$</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: `YaRN` (`NTK-by-Parts` + `mscale = 1.277`)</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• High-freq dims ($\lambda_d &lt; L$): `100%` untouched ($\gamma=1$, `0` local blur!)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Low-freq dims ($\lambda_d &gt; L$): Interpolated by $1/s$ to prevent OOD</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Pre-multiplies `cos/sin` tables by $\sqrt{1/t} = 0.1 \ln(s) + 1 = 1.277$</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  to counteract 128K Softmax entropy dilution (`0%` kernel cost!)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">4K Acc: 83.0% (0 Drop) | 128K RULER: 91.8% (+23.3 pt) 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Wavelength-Aware Partitioning + Zero-Overhead Temperature Scaling</text>
</svg>
