<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 325 · LLM SERVING CUDAGRAPH BUCKETING, PADDING WASTE &amp; SHARED MEMPOOL</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">8.50 GB Private Graph Pools &amp; 49.6% Pow2 Padding Waste vs. Shared Pool + Piecewise Graph (0.95 GB)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2: 8.5 GB Pool Bloat or 49.6% Dummy Padding</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (40 Graph Buckets Without Shared graph_pool_handle):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Each CUDAGraph allocates its own private intermediate HBM</text>
  <text x="85" y="298" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  pool -&gt; Consumes 8.50 GB/GPU (stealing KV Cache space)!</text>
  <text x="85" y="335" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (Coarse Power-of-Two Buckets 1..128, 256):</text>
  <text x="85" y="363" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Batch=129 pads 127 dummy tokens up to 256 (20.6 ms step)!</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Unshared Graph Memory: 8.50 GB / GPU ✕</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Pow2 Bucket Padding Waste: 28.4% Avg (49.6% at B=129!)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Shared Pool (256-&gt;1) + Piecewise CUDAGraph</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Single Shared graph_pool_handle() Captured 256 -&gt; 1:</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Since only 1 bucket runs at a time, all 35 buckets alias the</text>
  <text x="640" y="298" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  exact same 0.95 GB physical HBM pool (8.95x less memory)!</text>
  <text x="640" y="335" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Step-8 Bucketing + Piecewise CUDAGraph (vLLM V1):</text>
  <text x="640" y="363" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  B=129 pads only to 136 (2.8% avg waste, 13.8 ms step)!</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Total Graph HBM: 0.95 GB (Saves 7.55 GB/GPU for KV!)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">Padding Waste: 2.8% · B=129 Latency: 13.8 ms (1.49x Faster)</text>
</svg>
