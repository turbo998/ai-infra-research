<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#EC4899" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级大模型知识蒸馏 (Knowledge Distillation) 选型：SeqKD vs. 离线 Top-K Logit KD vs. GKD 反向 KL</text>
  <text x="52" y="94" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="15">把 671B/72B 教师大模型 98.2% 的专精能力压进 8B 学生小模型：每年净省 $114 万线上推理 GPU 账单！</text>

  <!-- Left: Why Pure SeqKD and Co-Resident Online KD Hit Bottlenecks -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么“纯文本 SFT 蒸馏”上限低、“师生同驻在线蒸馏”太烧钱？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 局限 A：纯黑盒文本蒸馏 (`SeqKD`, Tier 1) 丢弃 99.9% 概率暗知识</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 只拿教师模型吐出的 1-Hot 文本做 SFT，学生看不到“次优同义词的概率分布”</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 且正向 KL (`KL(P_T || P_S)`) 强迫 8B 小容量学生拟合多峰分布，导致中间区域生成幻觉 (79.5%)！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 局限 B：师生同时加载进显存做全词表 152K 在线蒸馏 (Tier 2)</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 训一个 8B 学生竟要在同一个训练集群常驻 720GB 的 671B 教师模型，算力成本暴涨 9 倍 ($14.8k)</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 而若把全词表 152K Logits 存盘，1.5 亿 Token 竟需 `150M × 304KB = 45.6 TB` 硬盘！</text>

  <!-- Right: Rejection Sampling + Offline Top-64 Logprobs + On-Policy GKD Reverse KL -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 企业级高保真蒸馏三步流水线 (保留教师 98.2% 精度, Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 拒绝采样合成数据清洗 (`Rejection Sampling + Verifier Filtering`)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">让 671B 教师对每题生成 N=4 条思维链，仅保留通过代码沙箱/规则校验的 100% 正确轨迹</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 离线解耦缓存 `Top-64` 稀疏 Logprobs (覆盖 99.98% 概率质量!)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">每个 Token 仅存 Top-64 `(token_id: uint32, logprob: fp16)`，1.5 亿 Token 仅占 38.4 GB (缩小 1,180 倍)！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ `GKD / MiniLLM` 在线策略反向 KL (`Reverse KL: KL(P_S || P_T)`)</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">让学生在自己生成的序列上受教师打分纠正（Mode-Seeking 锁定高置信度主峰），消除曝光偏差！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 将 671B/72B 教师（基准 91.2%）蒸馏至 8B 学生模型（1.5 亿 Tokens）四档方案对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">知识蒸馏架构方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">8B 学生垂直准确率</text>
  <text x="630" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">教师能力保留率</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">蒸馏存储/教师显存</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">一次性蒸馏成本</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">年化推理 TCO</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 未过滤纯黑盒文本蒸馏 (`SeqKD` 1-Hot SFT)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">79.5% ✕</text>
  <text x="630" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">87.2%</text>
  <text x="790" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">1.2 GB 磁盘</text>
  <text x="960" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$480</text>
  <text x="1120" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$201.6k/yr</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 师生同驻 GPU 在线全词表 152K 正向 KL 蒸馏</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">85.4%</text>
  <text x="630" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">93.6%</text>
  <text x="790" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">720.0 GB HBM ✕</text>
  <text x="960" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$14,800 ✕</text>
  <text x="1120" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$201.6k/yr</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 离线解耦缓存 `Top-64` 稀疏 Logprobs 蒸馏</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">87.2% ✓</text>
  <text x="630" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">95.6% ✓</text>
  <text x="790" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">38.4 GB 磁盘 ✓</text>
  <text x="960" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$1,650 ✓</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$201.6k/yr</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): 验证器拒绝采样 + Top-64 Logit KD + GKD 反向 KL</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">89.6% (+10.1pt) ✓</text>
  <text x="630" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">98.2% ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">42.0 GB 磁盘 ✓</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$2,850 (-81%) ✓</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">比跑教师省 $114万/年</text>
</svg>
