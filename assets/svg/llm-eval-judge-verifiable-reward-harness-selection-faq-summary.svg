<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">⚖️ 企业级大模型自动化评测、LLM-as-a-Judge 去偏与可验证奖励 (RLVR) 选型一图流总结</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">100,000 条评测集 (40% 代码/SQL/工具 + 30% 数理金融 + 30% 开放问答) · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#500724" stroke="#ec4899" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#fbcfe8" font-size="13" font-weight="700" text-anchor="middle">Round 33 · LLM Eval &amp; RLVR Judge</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#334155"/>
    <text x="16" y="27" fill="#f8fafc" font-size="14" font-weight="800">⬜ Tier 1: 传统 BLEU/ROUGE/字面匹配</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">N-gram 表面词频重合 + 死板字符串比对</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 人类专家一致率: <tspan fill="#f87171" font-weight="700">48.5% (形同抛硬币 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 位置调换翻转率: <tspan fill="#cbd5e1" font-weight="700">0.0%</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 啰嗦注水虚高率: <tspan fill="#f87171" font-weight="700">+14.5%</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• RL 刷分坍塌率: <tspan fill="#f87171" font-weight="700">42.0% (严重刷词频 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10万次评测成本: <tspan fill="#cbd5e1" font-weight="700">$0.50 (2,500 条/s)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么不能用 BLEU 测大模型？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">标准答案写 `0.5`，模型算出等价的 `1/2` 或</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">改了 Python 变量名就被判 0 分；反而把参考</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">句加个 `not`（语义完全相反）得分高达 90%！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 2: 单次直评商业大模型裁判</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">无量表 1~10 打分 / 单向 A-vs-B 盲评</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 人类专家一致率: <tspan fill="#fbbf24" font-weight="700">74.2%</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 位置调换翻转率: <tspan fill="#f87171" font-weight="700">28.4% (偏爱位置 A ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 啰嗦注水虚高率: <tspan fill="#f87171" font-weight="700">+24.0% (长文骗高分 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• RL 刷分坍塌率: <tspan fill="#f87171" font-weight="700">31.5% (Reward Hacking ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10万次评测成本: <tspan fill="#f87171" font-weight="700">$420.00 (仅 35 条/s ✕)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 裸调 GPT-4o 当裁判的三大偏见：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 调换 A/B 顺序有 28.4% 概率改判；② 错</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">误答案塞满 300 词礼貌废话与 Markdown 表</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">格就能骗过裁判；③ 做 RL 奖励会训出废话精！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 双向交换 + 原子量表专属裁判</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">自建 Prometheus-2 + (A,B)/(B,A) + 长度回归</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 人类专家一致率: <tspan fill="#34d399" font-weight="700">86.4% (+12.2pt ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 位置调换翻转率: <tspan fill="#34d399" font-weight="700">2.1% (双向一致门控 ✅)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 啰嗦注水虚高率: <tspan fill="#34d399" font-weight="700">3.8% (GLM 长度扣除 ✅)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• RL 刷分坍塌率: <tspan fill="#fbbf24" font-weight="700">9.2%</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10万次评测成本: <tspan fill="#60a5fa" font-weight="700">$18.50 (省 95.6% · 420条/s)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 开放式文科/总结类评测首选：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">强制正反跑两次 `(A,B)` 与 `(B,A)`（不一致</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">即判平局），传入 1~5 分原子扣分标准，并用</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">广义线性模型剔除字数系数，成本直降 95.6%！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: RLVR 确定性沙箱 + PRM 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">代码/SymPy/AST 验证器 + 步骤 PRM + 去偏裁判</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 人类专家一致率: <tspan fill="#34d399" font-weight="700">96.8% (+22.6pt 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 位置调换翻转率: <tspan fill="#34d399" font-weight="700">0.4% (物理级免疫 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 啰嗦注水虚高率: <tspan fill="#34d399" font-weight="700">0.6% (废话救不了错码 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• RL 刷分坍塌率: <tspan fill="#6ee7b7" font-weight="700">0.0% (零 Reward Hacking 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10万次评测成本: <tspan fill="#34d399" font-weight="700">$22.00 (680 条/s 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 DeepSeek-R1 / GRPO 时代终极范式：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">凡能用单元测试、SQL 执行、SymPy 符号化简</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">验证的任务一律走确定性 RLVR 沙箱，彻底杜绝</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">大模型靠礼貌套话骗取强化学习奖励！</text>
  </g>

  <!-- Bottom Left: Adversarial Perturbation Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🛡️ 四大对抗攻击下裁判误判率对比：单次直评 (Tier 2) vs. RLVR+去偏 (Tier 4)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">为什么强化学习 (RLHF/GRPO) 用单次神经网络裁判必然在 500 步内发生“刷分坍塌”？</text>

    <!-- Attack 1 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">1. 调换 A/B 顺序 (位置偏见攻击)</text>
    <rect x="260" y="74" width="240" height="14" rx="4" fill="#ef4444"/>
    <text x="508" y="86" fill="#f87171" font-size="11.5" font-weight="700">28.4% 误判 (Tier 2)</text>
    <rect x="260" y="92" width="6" height="14" rx="3" fill="#10b981"/>
    <text x="274" y="104" fill="#6ee7b7" font-size="11.5" font-weight="700">0.4% (Tier 4 🏆)</text>

    <!-- Attack 2 -->
    <text x="24" y="144" fill="#cbd5e1" font-size="12" font-weight="700">2. 错解注水 300 词表格 (长度偏见)</text>
    <rect x="260" y="130" width="203" height="14" rx="4" fill="#ef4444"/>
    <text x="470" y="142" fill="#f87171" font-size="11.5" font-weight="700">24.0% 误判 (Tier 2)</text>
    <rect x="260" y="148" width="8" height="14" rx="3" fill="#10b981"/>
    <text x="276" y="160" fill="#6ee7b7" font-size="11.5" font-weight="700">0.6% (Tier 4 🏆)</text>

    <!-- Attack 3 -->
    <text x="24" y="200" fill="#cbd5e1" font-size="12" font-weight="700">3. 专家口吻伪装 + 隐蔽代码 Bug</text>
    <rect x="260" y="186" width="266" height="14" rx="4" fill="#ef4444"/>
    <text x="532" y="198" fill="#f87171" font-size="11.5" font-weight="700">31.5% 误判 ✕</text>
    <rect x="260" y="204" width="4" height="14" rx="2" fill="#10b981"/>
    <text x="272" y="216" fill="#6ee7b7" font-size="11.5" font-weight="700">0.0% (沙箱单测秒抓 🏆)</text>

    <!-- Attack 4 -->
    <text x="24" y="256" fill="#cbd5e1" font-size="12" font-weight="700">4. 等价数学符号 (0.5 vs \frac{1}{2})</text>
    <rect x="260" y="242" width="55" height="14" rx="4" fill="#f59e0b"/>
    <text x="322" y="254" fill="#fde68a" font-size="11.5" font-weight="700">6.5% 误判 (Tier 2)</text>
    <rect x="260" y="260" width="4" height="14" rx="2" fill="#10b981"/>
    <text x="272" y="272" fill="#6ee7b7" font-size="11.5" font-weight="700">0.0% (SymPy 归一化 🏆)</text>

    <rect x="20" y="284" width="560" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="304" fill="#fbcfe8" font-size="11.5" font-weight="700">💡 铁律：代码/数理/SQL/JSON 严禁让 LLM 凭感觉打分，必须跑 RLVR 确定性验证器！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师企业评测与强化学习奖励 (RLVR) 分流黄金法则</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="70" fill="#6ee7b7" font-size="13" font-weight="800">1️⃣ 70% 结构化/理科任务 (代码/SQL/数学/工具调用) → 走 RLVR 确定性沙箱</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 用隔离容器跑 pytest 单元测试、DuckDB/SQLite 执行结果比对、`SymPy` 符号代数化简、</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  Pydantic Schema 校验，再叠加步骤级过程奖励模型 (PRM) 定位首个出错推理步。</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="160" fill="#93c5fd" font-size="13" font-weight="800">2️⃣ 30% 开放式任务 (公文/摘要/创意/客服语气) → 走 Tier 3 双向去偏量表裁判</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 部署自建 `Prometheus-2 / JudgeLM`（结合 SGLang Prefix Cache 共享题干与 1~5 分原子量表），</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  强制执行 `(A,B)` 与 `(B,A)` 双向一致性门控 + GLM 长度去偏回归，成本降 95.6%！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fbcfe8" font-size="13" font-weight="800">3️⃣ 杜绝“自恋偏见 (Self-Preference Bias)”与“格式投毒”</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 模型当裁判时天生偏爱自己家族生成的文风！生产评测必须采用 **跨家族异构裁判团**</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  并在送审前剥离 `Sure! Here is...` 等讨好型前缀与华丽无用的粗体格式。</text>
  </g>
</svg>
