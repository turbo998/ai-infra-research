<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
  <title id="title">AI Infrastructure 11-Layer Compute &amp; Systems Stack (turbo998/ai-infra-research)</title>
  <desc id="desc">High-contrast Linear/blueprint architecture diagram showing the 11-Layer AI Compute and Systems Stack from GPU/SM100 Blackwell Tensor Kernels and HBM3e/CXL/LMCache KV Tiering through Disaggregated PD Serving, RL Post-Training, MicroVM Sandboxes, K8s/DRA Gang Scheduling, Optical CPO, 800VDC Liquid Cooling, and the Deterministic Benchmark Harness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B19"/>
      <stop offset="55%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#091024"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="harnessGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Canvas Background & Blueprint Grid -->
  <rect width="960" height="540" fill="url(#bg)"/>
  <rect width="960" height="540" fill="url(#grid)"/>
  <rect x="8" y="8" width="944" height="524" rx="10" fill="none" stroke="#334155" stroke-width="1.2"/>

  <!-- Top Header Banner -->
  <rect x="20" y="16" width="920" height="50" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="34" y="37" fill="#F8FAFC" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700" letter-spacing="0.3">
    AI INFRASTRUCTURE 11-LAYER COMPUTE &amp; SYSTEMS STACK · 11 层全栈智算与系统工程架构图谱
  </text>
  <text x="34" y="55" fill="#94A3B8" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5">
    Phase 1–122 Verified Baseline · 381 Research Questions · 376 Python 3.12 Simulators · 1,971 Primary Sources · 682 Claims · 624 Unit Tests
  </text>
  <rect x="786" y="25" width="142" height="28" rx="6" fill="#022C22" stroke="#10B981" stroke-width="1"/>
  <text x="857" y="43" text-anchor="middle" fill="#34D399" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">
    100% REPRODUCIBLE
  </text>

  <!-- Left Column: Layers 01 to 05 (Silicon, Memory, Collectives, Serving, RL) -->
  <!-- Layer 01 -->
  <g transform="translate(20, 76)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#38BDF8"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#7DD3FC" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L01</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      GPU / SM100 Blackwell Tensor / FP8 / MXFP4 Kernels
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      tcgen05 · 512-Col TMEM · FlashAttention-4 (2,790 TFLOPS) · FlashMLA V4.1 · DeepGEMM
    </text>
    <text x="18" y="59" fill="#38BDF8" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      消除 64KiB SMEM 寄存器溢出；FFMA2 突破 MUFU.EX2 墙；NVFP4/MXFP8 块缩放算子与 CLC 动态窃取
    </text>
  </g>

  <!-- Layer 02 -->
  <g transform="translate(20, 154)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#60A5FA" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#60A5FA"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#1E3A8A" stroke="#60A5FA" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#93C5FD" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L02</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      HBM3e / HBM4 / CXL 3.0 / LMCache KV Cache Tiering
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      HBM3e 8TB/s → HBM4 13.5TB/s · CXL Device-DAX 2MiB Align · LMCache L1/L2 · KIVI/FP4
    </text>
    <text x="18" y="59" fill="#93C5FD" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      四级 KV 缓存层次（VRAM → Host Pinned DRAM → CXL DAX → GDS/3FS），消除 SIGBUS 与假命中率
    </text>
  </g>

  <!-- Layer 03 -->
  <g transform="translate(20, 232)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#818CF8" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#818CF8"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#312E81" stroke="#818CF8" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#C7D2FE" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L03</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      NVLink / IBGDA / UEC / RoCEv2 Collective Networking
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      NVLS multimem · NCCL Gin/PAT · DeepEP V2.5 IBGDA/GDAKI · ConnectX-8 Data Direct · UEC
    </text>
    <text x="18" y="59" fill="#A5B4FC" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      GPU SM 直发 RDMA 门铃聚合（10.67x 削减）；UEC 64B 包裁剪与逐包喷洒将 P99 尾延迟压降 69.9%
    </text>
  </g>

  <!-- Layer 04 -->
  <g transform="translate(20, 310)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#A78BFA" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#A78BFA"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#4C1D95" stroke="#A78BFA" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#DDD6FE" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L04</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      Disaggregated Prefill-Decode Serving (Mooncake / Dynamo / vLLM / SGLang)
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      Mooncake Auto-GID &amp; HA Drain · Dynamo kvcr &amp; NIXL UCX · vLLM HiSparse · SGLang Eagle-3
    </text>
    <text x="18" y="59" fill="#C4B5FD" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      PD 分离零拷贝 KV 传输（357.8 Gbps）+ KV 感知智能路由 + 稀疏 MLA / 投机解码联合保障 TTFT/TPOT SLO
    </text>
  </g>

  <!-- Layer 05 -->
  <g transform="translate(20, 388)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#F472B6" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#F472B6"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#831843" stroke="#F472B6" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#FBCFE8" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L05</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      RL Post-Training Engines (verl / Miles / Slime / TorchTitan)
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      verl In-Place MXFP4 Refit · Slime/Miles Async Rollout TIS · HFSDP · DualPipe / Zero-Bubble
    </text>
    <text x="18" y="59" fill="#F9A8D4" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      训推共卡零拷贝 FP4 权重重分片（避免双份 HBM 峰值）；有界陈旧度异步 Rollout 消除长尾生成空泡
    </text>
  </g>

  <!-- Right Column: Layers 06 to 10 (Sandboxes, K8s/DRA, Fault Tolerance, Optical, Power/Cooling) -->
  <!-- Layer 06 -->
  <g transform="translate(488, 76)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#34D399" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#34D399"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#064E3B" stroke="#34D399" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#6EE7B7" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L06</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      MicroVM &amp; Sandbox Isolation (Firecracker / Kata / eBPF)
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      Firecracker UFFD/NBD (80ms Cold / 108ms Restore) · Kata Pod VM (AKSClaw) · eBPF Cilium
    </text>
    <text x="18" y="59" fill="#6EE7B7" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      硬件虚拟化双轨沙箱与 Agentic RL 工具调用协同调度，阻断容器逃逸、IMDS 窃取与跨租户侧信道
    </text>
  </g>

  <!-- Layer 07 -->
  <g transform="translate(488, 154)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#2DD4BF" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#2DD4BF"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#134E4A" stroke="#2DD4BF" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#99F6E4" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L07</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      Kubernetes / DRA / Kueue GPU Gang Scheduling
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      K8s TopologyManager Bitwise-AND · Kueue TAS · K8s DRA · Slurm topology/block &amp; tree
    </text>
    <text x="18" y="59" fill="#5EEAD4" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      CPU/GPU/RDMA NIC 同 NUMA 与 NVLink/Leaf 交换机紧致分配，消除跨轨通信降级与 MIG 故障传染
    </text>
  </g>

  <!-- Layer 08 -->
  <g transform="translate(488, 232)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#FBBF24" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#FBBF24"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#78350F" stroke="#FBBF24" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#FDE68A" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L08</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      Checkpoint / Restore &amp; MegaScale Fault Tolerance
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      PyTorch DCP AsyncStager (0.048s) · NVRx Warm Standby · FlightRecorder + NCCL RAS (&lt;650ms)
    </text>
    <text x="18" y="59" fill="#FCD34D" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      持久化锁页共享内存池消除 3.74s cudaHostRegister 风暴；跨机架双副本与毫秒级灰故障/死锁定位
    </text>
  </g>

  <!-- Layer 09 -->
  <g transform="translate(488, 310)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#FB923C" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#FB923C"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#7C2D12" stroke="#FB923C" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#FED7AA" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L09</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      Optical Interconnects, Co-Packaged Optics (CPO) &amp; OCS
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      1.6T Silicon Photonics CPO (9pJ/bit) · LPO · 3D MEMS Optical Circuit Switch · ELSFP
    </text>
    <text x="18" y="59" fill="#FDBA74" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      十万卡集群光模块功耗削减 65%+、链路闪断率降低一个数量级，支持 3D Torus/Dragonfly 动态重配置
    </text>
  </g>

  <!-- Layer 10 -->
  <g transform="translate(488, 388)">
    <rect width="452" height="70" rx="7" fill="#0F172A" stroke="#F87171" stroke-width="1.3"/>
    <rect x="0" y="0" width="8" height="70" rx="3" fill="#F87171"/>
    <rect x="18" y="10" width="44" height="20" rx="4" fill="#7F1D1D" stroke="#F87171" stroke-width="0.8"/>
    <text x="40" y="24" text-anchor="middle" fill="#FECACA" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">L10</text>
    <text x="70" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="12.5" font-weight="700">
      800VDC Power Delivery &amp; Direct-to-Chip Liquid Cooling
    </text>
    <text x="18" y="43" fill="#CBD5E1" font-family="JetBrains Mono, Consolas, monospace" font-size="10">
      ±400V/800VDC Busway · 130kW+ NVL72 Cold-Plate DLC · CDU Thermal Loop · DCGM Power Brake
    </text>
    <text x="18" y="59" fill="#FCA5A5" font-family="Inter, Segoe UI, sans-serif" font-size="10">
      抑制千卡同步迭代 dP/dt 功率浪涌；隔离 MNNVL/IMEX 72-GPU 机柜级热降频与冷却液故障爆炸半径
    </text>
  </g>

  <!-- Bottom Full-Width Foundation Bar: Layer 11 -->
  <g transform="translate(20, 466)">
    <rect width="920" height="58" rx="8" fill="url(#harnessGrad)" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="0" y="0" width="10" height="58" rx="4" fill="#38BDF8"/>
    <rect x="20" y="10" width="52" height="20" rx="4" fill="#0C4A6E" stroke="#38BDF8" stroke-width="1"/>
    <text x="46" y="24" text-anchor="middle" fill="#7DD3FC" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700">L11</text>
    <text x="82" y="24" fill="#F8FAFC" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700">
      Deterministic Benchmark Harness &amp; Evidence-Driven Verification Engine (全栈确定性物理建模与证据核验底座)
    </text>
    <text x="20" y="45" fill="#E2E8F0" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5">
      Python 3.12 Stdlib Only · 376 Executable Experiments (--check) · 624 Unit Tests · 122 7-Card 4:5 Visual Benchmark Decks · Zero Unverified Claims
    </text>
  </g>
</svg>
