<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#575 里程碑：企业级生产 AI 平台五大高阶架构模式 (RAG双层缓存 · 跨区双活 · 多模态EPD · FinOps WCU) 圣经</text>
  <text x="44" y="76" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13">串联 #563–#575 十三篇架构与算卡闭环 · 可用性升至 99.995% (RTO 0.82s) · 归因精度 99.6% · 集团总 GPU 需求缩减 71.9% · 年净省 $528万</text>

  <!-- 4 Cards for #571-#574 -->
  <rect x="24" y="108" width="248" height="274" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="38" y="134" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">🛡️ 模式1：多租户 RAG 双层缓存 (#571)</text>
  <rect x="38" y="148" width="220" height="218" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="48" y="172" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• Pre-Filter ACL 位图过滤：</text>
  <text x="48" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">消灭后置过滤零召回 (Recall 96.4%)</text>
  <text x="48" y="218" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• L1 实体强校验语义缓存：</text>
  <text x="48" y="237" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">数字/日期/租户一致，串单率 0.02%</text>
  <text x="48" y="264" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• L2 Envoy GIE 前缀路由：</text>
  <text x="48" y="283" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">Prefix KV 命中 91.5%，TTFT 210ms</text>
  <text x="48" y="310" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 收益：省 62.5% GPU ($0.068/1M)</text>

  <rect x="286" y="108" width="248" height="274" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="300" y="134" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">🌍 模式2：跨区 55/55 粘性双活 (#572)</text>
  <rect x="300" y="148" width="220" height="218" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="310" y="172" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 消灭备区冷缓存重算雪崩：</text>
  <text x="310" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">双区各承接 50% 流量保持缓存温热</text>
  <text x="310" y="218" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 800ms 首包 SLA 灰故障探针：</text>
  <text x="310" y="237" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">秒级捕获 HTTP 200 慢响应 (RTO 0.82s)</text>
  <text x="310" y="264" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• SSE Token 偏移无感续传：</text>
  <text x="310" y="283" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">中途断流自动携带已生成前缀续写</text>
  <text x="310" y="310" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 收益：99.995% HA · 省 44.2% TCO</text>

  <rect x="548" y="108" width="248" height="274" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="562" y="134" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">🖼️ 模式3：多模态 EPD 三池分离 (#573)</text>
  <rect x="562" y="148" width="220" height="218" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="572" y="172" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 动态切片视觉词精确折算：</text>
  <text x="572" y="191" fill="#cbd5e1" font-family="Consolas, monospace" font-size="10.5">N_vis = (N_tiles+1) × 256</text>
  <text x="572" y="218" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 剥离 600M ViT 至 L40S 池：</text>
  <text x="572" y="237" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">TP=1 独立编图 + SHA-256 特征缓存</text>
  <text x="572" y="264" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• H100 Prefill + H200 Decode：</text>
  <text x="572" y="283" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">零 ViT 抢占，P99 TPOT 稳在 12.4ms</text>
  <text x="572" y="310" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 收益：省 58.5% 成本 ($0.81/1K)</text>

  <rect x="810" y="108" width="246" height="274" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="824" y="134" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">💰 模式4：FinOps WCU与组合 (#574)</text>
  <rect x="824" y="148" width="218" height="218" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="834" y="172" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• WCU 硬件真实耗时归因：</text>
  <text x="834" y="191" fill="#cbd5e1" font-family="Consolas, monospace" font-size="10.5">1.0×In + 0.1×Cache + 4.5×Out</text>
  <text x="834" y="218" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 60/25/15 三层算力组合：</text>
  <text x="834" y="237" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Reserved 保实时 + 3.5折 Spot 跑批处理</text>
  <text x="834" y="264" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 80% / 95% 三级平滑降档：</text>
  <text x="834" y="283" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">自动切 8B/70B 级联，零 429 断服</text>
  <text x="834" y="310" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 收益：归因 99.6% · 账单省 54.8%</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="44" y="426" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="bold">🏆 第 575 篇里程碑：企业全场景 AI 平台（RAG + 多模态 + 跨区双活 + FinOps）总账对比：</text>
  <text x="44" y="452" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 传统烟囱式未治理平台：需 96 张 GPU，可用性 99.2%，月底频繁 429 断服，年度总拥有成本高达 $6.80M/年。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• #575 五大高阶模式协同平台：仅需 28 张异构 GPU (省 70.8% 卡)，可用性 99.995%，SLA Goodput 99.4%！</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 年度基础设施总支出从 $6.80M 压降至 $1.52M/年 (降低 4.47 倍，每年为集团净省 $528 万)！</text>
</svg>
