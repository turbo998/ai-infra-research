<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级对话式 BI 与智能问数平台选型：Microsoft Fabric Data Agent vs. Databricks Genie vs. Cortex vs. WrenAI (#418)</text>
  <text x="28" y="58" class="sub">为什么把 500 张数仓物理表 DDL 裸塞给大模型只有 51% 准确率？因为缺少语义层指标口径与原生行级权限 (RLS) 下推！</text>

  <!-- Left Panel: Raw DDL Text-to-SQL Trap vs Semantic Layer BI Agent -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 裸表 Text-to-SQL 三大生产事故 vs. 语义层指标驱动 (Semantic Layer First)</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 生产死穴：把 500 张物理宽表 DDL 直接塞进 Prompt 让 LLM 自由写 SQL</text>
  <text x="56" y="164" class="mono">• 口径错乱：高管问“上季净营收”，LLM 漏掉退货表/内部抵销条件，算出假财务数据 (准确率 51.4%)</text>
  <text x="56" y="184" class="mono">• 扫表炸弹：生成漏写 WHERE dt=... 的笛卡尔积查询，1 次提问扫爆 50TB 数仓 ($250/次!)</text>
  <text x="56" y="202" class="txt">• 越权泄密：使用共享 Service Account 连接数仓，普通销售一句话查出全公司高管薪资！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 破局架构：认证语义层 (Power BI DAX / Unity Catalog / MDL) + AST 门禁 + RLS 透传</text>
  <text x="56" y="272" class="mono">• 指标锁定：LLM 只选经过财务认证的度量 (Certified Measure) 与维度，严禁即兴发明公式</text>
  <text x="56" y="292" class="mono">• AST 熔断：SQLGlot 强制校验时间分区谓词 + EXPLAIN 估算扫描量 &gt;50GB 自动拦截</text>
  <text x="56" y="312" class="txt">• 身份透传：OAuth 2.0 On-Behalf-Of (OBO) 透传提问者身份，100% 强制执行数仓原生 RLS/CLS！</text>

  <!-- Right Panel: 4 Conversational BI Platforms Comparison -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业智能问数与对话式 BI 平台横向对标 (500 表数仓 · 5,000 分析用户)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#93c5fd">1. Microsoft Fabric Data Agent (Fabric IQ + Power BI Semantic Models)</text>
  <text x="638" y="158" class="mono">• 直接复用企业现有 Power BI DAX 度量与 DirectLake RLS | 含在 F64+ 容量内 | 准确率 93.8%</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">2. Databricks AI/BI Genie (Unity Catalog Metric Views + Certified SQL)</text>
  <text x="638" y="214" class="mono">• 原生绑定 Unity Catalog 行列权限与血缘 | 擅长复杂 Spark/SQL 探索分析 | 准确率 92.6%</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#a855f7"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#d8b4fe">3. Snowflake Cortex Analyst (YAML Semantic Model on Snowflake)</text>
  <text x="638" y="270" class="mono">• 基于托管 YAML 语义文件生成高可靠 SQL | 深度绑定 Snowflake 计算点 | 准确率 93.1%</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">4. 跨源开源中立底座：WrenAI / Vanna + Cube MDL 语义层 + SQLGlot 门禁 (🏆多云/私有化)</text>
  <text x="638" y="326" class="mono">• 统一横跨 Postgres/ClickHouse/Fabric/Databricks | 预聚合加速 + 成本熔断 | 准确率 94.6%!</text>

  <!-- Bottom Panel: End-to-End 5-Stage Conversational BI Architecture -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端生产级智能问数参考架构：从 51.4% 玩具 Demo 跃升至 94.6% 财务级可信度</text>

  <rect x="42" y="414" width="214" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="54" y="440" class="txt" font-weight="700" fill="#38bdf8">① 实体值与指标链接</text>
  <text x="54" y="464" class="mono">• LSH/向量检索列枚举值</text>
  <text x="54" y="484" class="mono">  ("华东大区" -&gt; region_id=3)</text>
  <text x="54" y="504" class="mono">• 从 500 表裁剪出 Top-6</text>
  <text x="54" y="524" class="mono">  关联表与认证指标定义</text>
  <text x="54" y="550" class="txt" fill="#6ee7b7">Prompt 从 85K 压至 2.8K</text>

  <rect x="272" y="414" width="214" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="284" y="440" class="txt" font-weight="700" fill="#34d399">② 语义层 API 优先生成</text>
  <text x="284" y="464" class="mono">• 优先输出 MDL / DAX /</text>
  <text x="284" y="484" class="mono">  MetricFlow 语义查询</text>
  <text x="284" y="504" class="mono">• 由语义编译器确定性展开</text>
  <text x="284" y="524" class="mono">  为含标准 JOIN 的物理 SQL</text>
  <text x="284" y="550" class="txt" fill="#34d399">根除大模型捏造错误关联条件</text>

  <rect x="502" y="414" width="214" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="514" y="440" class="txt" font-weight="700" fill="#fde68a">③ SQLGlot AST 安全沙箱</text>
  <text x="514" y="464" class="mono">• 严禁 DDL/DML 写操作</text>
  <text x="514" y="484" class="mono">• 强制检查分区字段过滤</text>
  <text x="514" y="504" class="mono">• 先跑 EXPLAIN 估算字节：</text>
  <text x="514" y="524" class="mono">  &gt;50GB 全表扫描立即熔断</text>
  <text x="514" y="550" class="txt" fill="#fde68a">消灭 $250/次天价慢查询炸弹</text>

  <rect x="732" y="414" width="214" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="744" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ OBO 身份与 RLS 下推</text>
  <text x="744" y="464" class="mono">• 携带用户 Entra ID / JWT</text>
  <text x="744" y="484" class="mono">  建连数仓执行</text>
  <text x="744" y="504" class="mono">• 自动触发行级安全 (RLS)</text>
  <text x="744" y="524" class="mono">  与敏感列动态掩码 (CLS)</text>
  <text x="744" y="550" class="txt" fill="#d8b4fe">越权数据泄露率 0.0%</text>

  <rect x="962" y="414" width="196" height="196" rx="8" fill="#1e293b" stroke="#ec4899"/>
  <text x="974" y="440" class="txt" font-weight="700" fill="#f472b6">⑤ 空结果诊断与可视化</text>
  <text x="974" y="464" class="mono">• 报错/0行返回自动反思</text>
  <text x="974" y="484" class="mono">  修正枚举值 (最多 1 次)</text>
  <text x="974" y="504" class="mono">• 附上指标口径说明卡片</text>
  <text x="974" y="524" class="mono">  (Provenance Card)</text>
  <text x="974" y="550" class="txt" fill="#f472b6">业务口径准确率达 94.6%</text>
</svg>
