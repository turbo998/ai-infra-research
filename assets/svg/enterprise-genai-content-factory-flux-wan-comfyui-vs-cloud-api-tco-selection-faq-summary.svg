<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级营销内容生成工厂 (GenAI Content Studio) 选型：云端 API vs. 自建 Flux.1/Wan2.1 (xDiT+FP8) (#435)</text>
  <text x="28" y="58" class="sub">为什么纯文本生图会把电商商品瓶身 Logo 全部画变形？如何用“3D/原图前景抠图锁死 + 背景重绘 + TeaCache 跳步”把单张海报压到 $0.0018？</text>

  <!-- Left Panel: Product Logo Distortion Trap vs Foreground Mask Lock + LoRA + xDiT Acceleration -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 企业商业视觉生成两大痛点：商品包装文字变形 &amp; 视频 DiT 算力黑洞</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 痛点一 (直接文生图把商品画歪) &amp; 痛点二 (单卡 BF16 跑 720p 视频需 145 秒)</text>
  <text x="56" y="164" class="mono">• 品牌灾难：让通用文生图 API 直接画“某品牌精华液瓶子”，瓶身小字与 Logo 100% 变形，</text>
  <text x="56" y="184" class="mono">  根本无法通过品牌法务审核（可用率仅 18%）！</text>
  <text x="56" y="202" class="txt">• 账单灾难：每月批量生成 300 万张千人千面电商主图 + 10 万条 5s 短视频，云 API 月烧 $28.5万！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金流水线：商品像素 100% 掩码锁死 + IC-Light 光影融合 + xDiT FP8/TeaCache</text>
  <text x="56" y="272" class="mono">• 1. 商品零变形：BiRefNet 抠出真实商品原图前景 (像素 100% 锁死不动)，仅用 Flux.1 +</text>
  <text x="56" y="292" class="mono">  ControlNet Depth 生成场景背景，再用 IC-Light 统一环境反射光影（一次过审率 96.4%！）</text>
  <text x="56" y="312" class="txt">• 2. 视频加速 10.2x：`Wan2.1 / HunyuanVideo` 开 `xDiT USP + FP8 + TeaCache`，5s 视频仅 14.2s！</text>

  <!-- Right Panel: 4 GenAI Content Factory Platforms Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业视觉内容生成工厂架构横向对标 (300 万张图 + 10 万条视频/月)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 纯文本直调通用图像/视频 API (无前景像素锁死，商品文字变形)</text>
  <text x="638" y="158" class="mono">• 商品保真过审率仅 18.0% ✕ | 单张图 $0.04 / 单条视频 $1.65 | 月烧 $285,000/月 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#93c5fd">Tier 2: 商业版权安全 SaaS (Adobe Firefly Services API / Amazon Nova Canvas)</text>
  <text x="638" y="214" class="mono">• 100% 版权赔偿兜底 + 原生 C2PA 水印 | 过审率 88.5% | 月度总成本 $142,000/月 ✓</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#fde68a">Tier 3: 自建未优化 ComfyUI 容器池 (BF16 单卡串行跑 Flux.1 + Wan2.1)</text>
  <text x="638" y="270" class="mono">• 过审率 94.2% | 但 5s 视频耗时 145s、需 32 张 H200 | 月度成本 $76,000/月</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 无头 ComfyUI/xDiT (前景掩码锁死 + IC-Light + FP8 + TeaCache + C2PA 🏆)</text>
  <text x="638" y="326" class="mono">• 商品过审率 96.4% 🏆 | 单图 1.1s ($0.0018) / 视频 14.2s | 仅需 8x H200 ($21,500/月, -92%)!</text>

  <!-- Bottom Panel: End-to-End 4-Stage E-Commerce & Brand Content Factory -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端企业级商品海报与短视频生成流水线：像素级商品保真 + 10.2x 扩散加速 + C2PA 合规签名</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 商品前景像素锁死 (0 变形)</text>
  <text x="56" y="464" class="mono">• BiRefNet 毫秒级分割商品主体</text>
  <text x="56" y="484" class="mono">• 商品瓶身/Logo 像素 100% 原样保留</text>
  <text x="56" y="504" class="mono">• Flux.1-Fill + 品牌风格 LoRA</text>
  <text x="56" y="524" class="mono">  仅对外部背景做外扩重绘 (Outpaint)</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">彻底杜绝商品商标文字错乱！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② IC-Light 物理光影重打光 (Relight)</text>
  <text x="332" y="464" class="mono">• 解决“抠图贴上去像假贴纸”痛点</text>
  <text x="332" y="484" class="mono">• 根据新背景光源方向，在保持</text>
  <text x="332" y="504" class="mono">  商品文字清晰的前提下自动计算</text>
  <text x="332" y="524" class="mono">  桌面接触阴影 (Contact Shadow) 与高光</text>
  <text x="332" y="550" class="txt" fill="#34d399">摄影棚级真实感，过审率达 96.4%</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ xDiT USP + FP8 + TeaCache 加速</text>
  <text x="620" y="464" class="mono">• 针对 Wan2.1-14B 图生视频：</text>
  <text x="620" y="484" class="mono">• 开启 `CFG=2 × Ulysses=4` 序列并行</text>
  <text x="620" y="504" class="mono">• `SageAttention2 + FP8` 提速 2.6x</text>
  <text x="620" y="524" class="mono">• `TeaCache` 跳过 55% 冗余去噪步</text>
  <text x="620" y="550" class="txt" fill="#fde68a">720p 5s 视频从 145s 压至 14.2s！</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ VLM 自动质检 + C2PA 溯源水印</text>
  <text x="908" y="464" class="mono">• 出片后由 Qwen2.5-VL-7B 自动</text>
  <text x="908" y="484" class="mono">  拦截手指畸形/穿模坏片 (约 3.6%)</text>
  <text x="908" y="504" class="mono">• 自动注入符合欧盟 AI 法案与国内</text>
  <text x="908" y="524" class="mono">  标识办法的 C2PA 加密元数据签名</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">100% 合规可追溯，月省 $26.35 万！</text>
</svg>
