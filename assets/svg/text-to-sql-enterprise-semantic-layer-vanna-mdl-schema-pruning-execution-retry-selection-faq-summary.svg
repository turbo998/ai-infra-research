<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#F59E0B" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级 Text-to-SQL 与智能问数选型：全量 DDL 硬塞 vs. 动态列剪枝 vs. 语义层 (MDL) + SQLGlot 门禁</text>
  <text x="52" y="94" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15">攻克 800 张数仓表“语法对但业务口径全错”顽疾：WrenAI/Cube/MetricFlow 语义层 + 列枚举值倒排 + AST 分区强校验</text>

  <!-- Left: Why Raw DDL Fails Enterprise BI -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么在 800 张表的企业数仓里直接生成物理 SQL 必败？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 致命痛点 A：物理表字段黑话与多表 Join 幻觉 (Tier 1/2)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 物理列名如 `amt_net_v2_adj`、`status_cd=3`，大模型即使写出合法 SQL 也漏掉退款冲销与测试单过滤</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 96K 全量 DDL 硬塞准确率仅 44.5%；纯表名向量检索 (Tier 2) 业务口径准确率也仅 65.2%！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 致命痛点 B：漏写分区键 (`WHERE dt >= ...`) 扫爆 PB 级数仓账单</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 模型生成的 SQL 一旦忘加日期分区过滤或写出笛卡尔积 Join，单条查询即可扫穿 Snowflake/BigQuery</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 脏枚举值不匹配（用户问“华东区”，库里存的是 `'CN-EAST-01'`）导致查出空表 `0 rows`！</text>

  <!-- Right: Governed Semantic MDL + Column/Value Pruning + SQLGlot Gate -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 企业级智能问数三层防错架构 (Semantic MDL + SQLGlot, Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 统一指标语义层 (`MDL`: `WrenAI / Cube / dbt MetricFlow`)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">将多表 Join 路径与净营收/留存率标准公式预固化为语义视图，让模型查指标而非拼物理底表！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 动态列级子图剪枝 + 单元格枚举值倒排 + Golden SQL 范例库</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">将 18,000 列剪枝至 Top-45 相关列 (`2,950 Tokens`)，并把“华东”精准映射为库内枚举值 `'CN-EAST-01'`</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ `SQLGlot` 语法树强门禁 + `EXPLAIN` 干跑预估成本拦截</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">AST 自动注入租户 `RLS` 与分区谓词、阻断写操作；先跑 `EXPLAIN` 校验列名与扫描字节数再真正执行！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 800 张表企业数仓（18,000 列 · 月均 45 万次问数）四档 Text-to-SQL 架构对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Text-to-SQL 问数架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单次 Prompt 消耗</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">端到端 P95 延迟</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">业务口径准确率</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">全表扫库爆雷率</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度 LLM+数仓总成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 全量 800 表物理 DDL 硬塞 (96K Context)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">96,000 tok ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">5,840 ms ✕</text>
  <text x="790" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">44.5% ✕</text>
  <text x="950" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">18.5% ✕</text>
  <text x="1110" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$168,000/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 物理表 DDL 向量召回 Top-10 (无语义层/无值索引)</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">4,800 tok</text>
  <text x="620" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">1,650 ms</text>
  <text x="790" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">65.2% (口径易错)</text>
  <text x="950" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">11.2% ✕</text>
  <text x="1110" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$38,000/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 多 Agent 串行选表 + 实库报错盲目重试循环</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">18,500 tok</text>
  <text x="620" y="612" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">4,920 ms ✕</text>
  <text x="790" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">78.6%</text>
  <text x="950" y="612" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">8.4%</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$72,000/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): 语义层 MDL + 列/枚举值剪枝 + SQLGlot AST 门禁</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2,950 tok (-96.9%)</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1,120 ms (-81%) ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">93.8% ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.0% (AST 拦截) ✓</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$19,500/mo (-88%)</text>
</svg>
