<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">第 485 篇里程碑：企业智算集群从交付验收到生产上线 (Day-0 to Day-2 Acceptance) 终极手册 (#485)</text>
  <text x="28" y="58" class="sub">为什么新交付的千卡集群直接上线必有 ~3.2% 的“暗病劣质卡 (Lemon GPUs)”拖垮全群？五道严苛验收门禁揪出 99.6% 隐患</text>

  <!-- Left Panel: The 3.2% Lemon GPU & Silent Data Corruption Trap -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么 `nvidia-smi` 和 `ibstat` 全绿，一跑千卡任务就掉速一半甚至 Loss 爆炸？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 新交付硬件的三大隐形杀手 (未经 72h 烤机首月故障率高达 38.5% ✕)</text>
  <text x="56" y="164" class="mono">• 杀手 1 (热降频劣质卡 Lemon GPU): 导热垫虚贴，满载 15 分钟即降频 35%！</text>
  <text x="56" y="184" class="mono">• 杀手 2 (静默计算错 SDC): Tensor Core 在高温高压下算错浮点数却不报 Xid！</text>
  <text x="56" y="202" class="mono">• 杀手 3 (脏光纤/坏光模块): 静态 ping 全通，400G 满载 2 小时即触发闪断！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师签字收货铁律：不通过五阶段 72 小时烤机门禁，绝不签字付款！(🏆)</text>
  <text x="56" y="268" class="mono">• 在正式签收前，强制用二分配对压测 + 72h 满载热浸泡把 ~3.2% 的出厂早夭卡</text>
  <text x="56" y="288" class="mono">  (Infant Mortality) 全部逼出来由厂商免费更换 (RMA)！</text>
  <text x="56" y="308" class="mono">• 首月生产作业异常中断率从 38.5% 骤降至 0.3%，集群长期 Goodput 达 98.4%！</text>

  <!-- Right Panel: 4 Cluster Acceptance Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种智算集群交付验收标准定量对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 零烤机直接签收 (仅看 nvidia-smi 与 ibstat 状态为 Active)</text>
  <text x="638" y="158" class="mono">• 揪出暗病卡: 12.0% ✕ | 首月作业中断率: 38.5% ✕ | 长期Goodput: 54.0%</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 仅跑单机 1 小时冒烟测试 (未做跨柜成对压测与 72h 热浸泡)</text>
  <text x="638" y="214" class="mono">• 揪出暗病卡: 48.0% | 首月作业中断率: 18.2% ✕ | 长期Goodput: 74.5%</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 24 小时 DCGM Level-4 烤机 + 全群单次 nccl-tests AllReduce</text>
  <text x="638" y="270" class="mono">• 揪出暗病卡: 88.5% ✓ | 首月作业中断率: 4.1% | 长期Goodput: 91.2%</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: Day-0 至 Day-2 五阶段全栈验收门禁 (72h + 二分网络 + 混沌演练 🏆)</text>
  <text x="638" y="326" class="mono">• 揪出暗病卡: 99.6% 🏆 | 首月中断率: 0.3% 🏆 | 长期Goodput: 98.4% 🏆</text>

  <!-- Bottom Panel: The 5-Stage Acceptance Gate Pipeline -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 智算集群签字验收“五阶段黄金流水线”与硬性通过阈值 (Pass/Fail Gates)</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">Stage 1 &amp; 2: 单机热烤机与 SDC 静默错筛查</text>
  <text x="58" y="464" class="mono">• 1) 拓扑门禁: ACS=Off, Topo=PIX, PUE 液冷达标</text>
  <text x="58" y="484" class="mono">• 2) DCGM Diag Level-4 + GPU-Burn 72 小时：</text>
  <text x="58" y="504" class="mono">     要求全部卡 TFLOPS 离散度 &lt; 2%（揪出慢速</text>
  <text x="58" y="524" class="mono">     Straggler 劣质卡），结温 &lt;= 72°C，</text>
  <text x="58" y="544" class="mono">     Uncorrectable ECC = 0，确定性矩阵校验</text>
  <text x="58" y="564" class="mono">     Bitwise 100% 一致（0 SDC 静默计算错）！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">Stage 3: 二分配对网络与 GDS 存储极限压测</text>
  <text x="436" y="464" class="mono">• 3) 两两配对二分压测 (Pairwise &amp; Bisection):</text>
  <text x="436" y="484" class="mono">     AllReduce &amp; AllToAll busbw &gt;= 90% 线速</text>
  <text x="436" y="504" class="mono">     (&gt;= 45.0 GB/s on 400G)，PFC 死锁 = 0，</text>
  <text x="436" y="524" class="mono">     光模块 Pre-FEC BER &lt; 10^-7，0 闪断！</text>
  <text x="436" y="544" class="mono">• 4) 存储验收: gdsio 实测单机 GDS 读取 &gt;= 28GB/s，</text>
  <text x="436" y="564" class="mono">     671B 模型冷启加载 &lt;= 3.0s！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">Stage 4 &amp; 5: AIPerf 推理压测与混沌故障演练</text>
  <text x="814" y="464" class="mono">• 5) 推理 Goodput 验收: 用 AIPerf / GuideLLM</text>
  <text x="814" y="484" class="mono">     模拟 3x 突发洪峰，验证 PD 分离与 80/85/</text>
  <text x="814" y="504" class="mono">     90/95% 四阶降级下 Goodput &gt;= 99.0%！</text>
  <text x="814" y="524" class="mono">• 6) 混沌工程 (Chaos Drill): 现场拔掉 1 根</text>
  <text x="814" y="544" class="mono">     400G 光纤或注入 Xid 79 掉卡，验证自动隔离</text>
  <text x="814" y="564" class="mono">     Cordon + 备用节点接管恢复 &lt;= 90 秒！</text>
</svg>
