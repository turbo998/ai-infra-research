<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #401 · 128K-1M LONG-CONTEXT TIERED KV CACHE (HBM/DRAM/NVME), 2D USP &amp; MLA/HYBRID SIZING</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">128K–1M 超长上下文分层 KV 卸载、2D 上下文并行与 MLA/混合注意力精算指南</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">为什么 128K 多轮对话驱逐 HBM KV 后重算要 5.2 秒，而从 Host Pinned DRAM 零拷贝拉回仅需 47 毫秒（快 110 倍）？</text>

  <!-- Left Box: 128K-1M KV Footprint & Restore vs Recompute Math -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 128K 上下文单会话 KV 显存账本与“重算 vs. 拉回”方程</text>
  <rect x="76" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">70B GQA-8 (FP8 KV): 128K = 20.97 GB | 1M = 167.8 GB (单卡直接撑爆!)</text>
  <text x="90" y="242" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">671B MLA  (FP8 KV): 128K =  4.50 GB | 1M =  36.0 GB (省 4.67 倍!)</text>
  <text x="90" y="260" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">7:1 Hybrid SSM/GQA: 128K =  0.58 GB | 1M =   4.5 GB (省 37.3 倍!)</text>
  <text x="76" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 驱逐后重算 128K Prefill (O(S^2) 算力墙)：耗费 5,200 ms GPU 满载算力</text>
  <text x="76" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 从 2TB Host Pinned DRAM 经 8x PCIe Gen5 (448 GB/s) 拉回：仅 10~47 ms！</text>
  <text x="76" y="346" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 结论：三级 KV 池 (HBM -&gt; Pinned DRAM -&gt; 3FS/NVMe GDS) 让多轮 TTFT 降 15~50x！</text>

  <!-- Right Box: 2D USP (Ulysses x Ring) Context Parallelism -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 未命中缓存时的首字救星：2D 混合上下文并行 (Ulysses × Ring)</text>
  <rect x="634" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">机内维 (NVLink 900GB/s): DeepSpeed Ulysses SP (按注意力头 All2All)</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">跨机维 (400G RDMA)     : Ring Attention P2P (分块环状传递 K,V 与计算重叠)</text>
  <text x="648" y="260" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">硬件对齐稀疏注意力     : DeepSeek NSA / MoBA 将 128K 复杂度从 O(S^2) 压低 9x</text>
  <text x="634" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 为什么纯 Ulysses 不能跨太多卡？受限于 GQA KV 头数 (如 8 个 KV 头最多切 8 份)</text>
  <text x="634" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 为什么 2D USP 是黄金解？机内 Ulysses=8 吃满 NVLink，跨机 Ring=2/4 隐藏 RDMA</text>
  <text x="634" y="346" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：将 256K 首次未缓存 TTFT 从单机 28.4 秒暴压至 1.85 秒 (-15.3x)！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档 128K 超长上下文多轮 Agent 推理架构实效对比 (32-GPU 集群 · 128K 会话)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">长上下文架构档位</text>
  <text x="430" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">多轮恢复 TTFT</text>
  <text x="590" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">最大并发 128K 会话</text>
  <text x="765" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">集群有效 Goodput</text>
  <text x="935" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">百万 Token 成本</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 纯 HBM 缓存 + 轮询网关 (HBM 满即丢弃重算 128K Prefill)</text>
  <text x="430" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">5,200 ms ✕</text>
  <text x="590" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">仅 18 会话 ✕</text>
  <text x="765" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">640 tok/s ✕</text>
  <text x="935" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$2.85 / 1M</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: GQA-8 FP8 KV + 单机 Host Pinned DRAM 二级卸载</text>
  <text x="430" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">340 ms</text>
  <text x="590" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">96 会话</text>
  <text x="765" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">2,450 tok/s</text>
  <text x="935" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.74 / 1M</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: 2D USP (Ulysses×Ring) + Mooncake/LMCache 跨机 RDMA DRAM 池</text>
  <text x="430" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">145 ms ✓</text>
  <text x="590" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">280 会话 ✓</text>
  <text x="765" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">4,820 tok/s ✓</text>
  <text x="935" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.38 / 1M</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): MLA/Hybrid 注意力 + 2D USP + 三级 KV 池 (HBM/DRAM/3FS GDS)</text>
  <text x="430" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">78 ms (-66.7x) 🏆</text>
  <text x="590" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">640 会话 (35.5x) 🏆</text>
  <text x="765" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">6,940 tok/s (10.8x) 🏆</text>
  <text x="935" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$0.24 / 1M (-91.6%) 🏆</text>
</svg>
