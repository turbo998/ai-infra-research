<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#569 超长上下文 (128K–1M) 架构：GQA vs. MLA vs. 7:1 Hybrid、2D USP 序列并行与三级 KV 卸载</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">1M 上下文 KV 从 167.8GB (GQA-8) 压至 36.0GB (MLA) 与 5.2GB (7:1 Hybrid) · O(S) DRAM/RDMA 拉回比 O(S²) 重算快 142x · 省 75% GPU</text>

  <!-- Box 1: Attention KV Scaling at 128K & 1M -->
  <rect x="24" y="110" width="350" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 128K / 1M 单会话 KV 显存手算对标</text>
  <rect x="42" y="152" width="314" height="66" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">GQA-8 FP8 (Llama-3.3-70B · 163.84 KB/词)</text>
  <text x="52" y="191" fill="#fecaca" font-family="Consolas, monospace" font-size="11.5">• 128K = 21.47 GB | 1M = 167.77 GB / 会话 ✕</text>
  <text x="52" y="208" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11">单张 H200 (141GB) 连 1 个 1M 会话都塞不下!</text>

  <rect x="42" y="226" width="314" height="66" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="52" y="246" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">DeepSeek MLA FP8 (61层 · 35.14 KB/词)</text>
  <text x="52" y="265" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11.5">• 128K =  4.61 GB | 1M =  35.98 GB / 会话</text>
  <text x="52" y="282" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="11">矩阵吸收 W^UK 免解压，显存与带宽立省 4.66 倍!</text>

  <rect x="42" y="300" width="314" height="68" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="320" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">7:1 Hybrid Mamba/DeltaNet + Attention 🏆</text>
  <text x="52" y="339" fill="#ecfdf5" font-family="Consolas, monospace" font-size="11.5">• 128K =  2.68 GB | 1M =  20.97 GB (省 87.5%!)</text>
  <text x="52" y="357" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11">7/8 层为 O(1) 恒定大小循环状态，并发暴涨 8 倍!</text>

  <!-- Box 2: 2D Hybrid USP (Ulysses x Ring) -->
  <rect x="392" y="110" width="348" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="410" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 2D Hybrid USP (机内 Ulysses × 跨机 Ring)</text>
  <rect x="410" y="152" width="312" height="100" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="422" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">机内维度：DeepSpeed Ulysses (All-to-All 切头)</text>
  <text x="422" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 在单机 8 卡 NVLink (900GB/s) 内按注意力头切分</text>
  <text x="422" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 通信量仅 O(S/N)，延迟极低，但受限于 H_kv 头数上限</text>
  <text x="422" y="227" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 负责把 1M 序列切成 8 份 128K 子序列</text>

  <rect x="410" y="260" width="312" height="108" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="422" y="280" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">跨机维度：Striped Ring Attention (P2P 环传 KV) 🏆</text>
  <text x="422" y="299" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 突破 GQA-8 头数限制，跨节点通过 400G RDMA 环传</text>
  <text x="422" y="317" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 块计算 O(S²) 与 P2P 传输 O(S) 100% 异步重叠</text>
  <text x="422" y="335" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 128K 首字 TTFT 从 18.4s 压至 1.38s (快 13.3 倍!)</text>
  <text x="422" y="353" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 结合 DeepSeek NSA / MoBA 块稀疏再提速 4.2x</text>

  <!-- Box 3: 3-Tier KV Offload vs Recompute -->
  <rect x="758" y="110" width="298" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="776" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 三级 KV 卸载 vs. 二次方重算</text>
  <rect x="776" y="152" width="262" height="100" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="788" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">为什么长会话绝不能驱逐重算？</text>
  <text x="788" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 重算 Prefill 复杂度为 O(S²) 二次方爆炸</text>
  <text x="788" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 128K 会话重算需 14.2 秒 GPU 满载算力</text>
  <text x="788" y="227" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• PCIe/RDMA 拉回 KV 复杂度仅 O(S) 线性!</text>

  <rect x="776" y="260" width="262" height="108" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="788" y="280" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">L1 HBM ↔ L2 DRAM ↔ L3 3FS/NVMe：</text>
  <text x="788" y="299" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• L1 (GPU HBM3e)：活跃解码热会话</text>
  <text x="788" y="317" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• L2 (Pinned Host DRAM / Mooncake)：</text>
  <text x="788" y="335" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">  拉回 4.6GB MLA KV 仅需 100ms (快 142x!)</text>
  <text x="788" y="353" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• L3 (3FS/WEKA + GDS)：跨天持久化温缓存</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 128K–1M 超长上下文生产落地的黄金四件套（立省 75% GPU，恢复 TTFT 100ms）：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. 模型层：优先选 DeepSeek MLA (35.1 KB/词) 或 7:1 Hybrid Mamba/DeltaNet (20.5 KB/词)，配合 NSA/MoBA 硬件对齐块稀疏注意力。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">2. 并行层：Prefill 池开启 2D Hybrid USP (机内 NVLink Ulysses=4/8 × 跨机 RDMA Striped Ring=2/4)，将百万字首包压入秒级。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">3. 存储层：打通 LMCache / Mooncake / Dynamo NIXL 三级 KV 缓存池，多轮 Agent 工具等待期零 HBM 占用、恢复仅需 100ms！</text>
</svg>
