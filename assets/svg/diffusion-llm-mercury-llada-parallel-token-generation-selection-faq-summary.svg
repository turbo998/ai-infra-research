<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 67 · DISCRETE DIFFUSION LLMS (MERCURY / LLADA / BLOCK DIFFUSION BD3-LM) VS. AUTOREGRESSIVE DECODING</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">扩散大语言模型 (Diffusion LLM: Mercury / BD3-LM) 并行生成与自回归选型一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 1×H100 SXM5 (8B Model, 4,096-Token Repo Context → 512-Token Code Generation) · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="148" height="24" rx="6" fill="#7F1D1D"/>
  <text x="130" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 标准自回归 AR</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">逐词串行解码 (1词/步)</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">生成 512 词需从显存搬 512 遍权重</text>
  <text x="56" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单流生成吞吐: 112.0 tok/s ✕</text>
  <text x="56" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 512词权重读取: 512 次 ✕</text>
  <text x="56" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Tensor Core 利用率: 1.8% (空转 ✕)</text>
  <text x="56" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 代码生成与补全得分: 83.5%</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 百万词成本: $0.89 / 1M ✕</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⛔ 98.2% 算力空转等待 HBM 显存带宽</text>

  <!-- Tier 2 -->
  <rect x="346" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="362" y="164" width="156" height="24" rx="6" fill="#1E3A8A"/>
  <text x="440" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 2 · AR + EAGLE-3</text>
  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">自回归 + 投机树验证</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">单步接受 ~2.8 词，但仍受限于左到右</text>
  <text x="362" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单流生成吞吐: 285.0 tok/s (2.54x ✅)</text>
  <text x="362" y="298" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 512词权重读取: 180 次 ✅</text>
  <text x="362" y="324" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Tensor Core 利用率: 5.4%</text>
  <text x="362" y="350" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 代码生成与补全得分: 83.5% ✅</text>
  <text x="362" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 百万词成本: $0.35 / 1M ✅</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 现有自回归模型零重训加速标配</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#1F2437" stroke="#F97316" stroke-width="1.5"/>
  <rect x="668" y="164" width="168" height="24" rx="6" fill="#7C2D12"/>
  <text x="752" y="180" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · 全序列无缓存扩散</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">原版 LLaDA / MDLM</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">双向无掩码导致无法用 KV Cache</text>
  <text x="668" y="272" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单流生成吞吐: 195.0 tok/s (4K慢 ✕)</text>
  <text x="668" y="298" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 512词权重读取: 32 次 (重算全序列)</text>
  <text x="668" y="324" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Tensor Core 利用率: 68.0% (重算浪费)</text>
  <text x="668" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 代码生成与补全得分: 82.8%</text>
  <text x="668" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 百万词成本: $0.51 / 1M ✕</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 每步重算 4K Prompt，长上下文崩盘</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
  <text x="1066" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · 分块扩散 (推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Block Diffusion / Mercury</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">块间因果 KV Cache + 块内128词并行</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单流吞吐: 1,180.0 tok/s (快10.5x 🏆)</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 512词权重读取: 仅 28 次 (-18.3x 🏆)</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• Tensor Core 利用率: 42.5% 🏆</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 代码与补全准确率: 84.4% 🏆</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 百万词成本: $0.12 (-86.5% 🏆)</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 AI 编程助手与毫秒级 JSON 生成标杆</text>

  <!-- Bottom Pipeline: 3 Core Mechanisms of Block Diffusion -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">⚡ 分块半自回归扩散 (Block Diffusion / Mercury) 三大破壁机制：如何把 Decode 速度拉爆到 1,180 tok/s？</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="82" y="562" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 块间因果 KV Cache (解决 LLaDA 长上下文痛点)</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 4,096 词输入代码文件仅做 1 次 Prefill 锁入标准 KV Cache</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 后续每生成一个 128 词块，将其 K/V 直接追加固化进缓存，</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  彻底免去原版全序列扩散每步重算 4K Prompt 的算力灾难</text>
  <text x="82" y="668" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 100% 兼容 PagedAttention 与 Prefix Cache</text>

  <!-- Step 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="468" y="562" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 块内 128 词双向并行去噪 (冲破显存带宽墙)</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 每次从 HBM 搬运 1 遍权重，直接在 128×128 Tensor Core</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  矩阵乘单元上同时更新当前块全部 128 个 [MASK] 位置</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 先锁定高确定性语法骨架，再双向填补中间逻辑（每步~18词）</text>
  <text x="468" y="668" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 权重搬运次数从 512 次暴降至 28 次 (-18.3x)</text>

  <!-- Step 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="864" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 置信度动态早停 (p&gt;0.96) + 粗稿热启动改代码</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 代码缩进、括号与 JSON Schema 在第 5~7 步即达到 p&gt;0.96，</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  立即提前提交当前块（无需跑满固定 16 步）</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• IDE 修改已有代码时直接以原代码热启动，2~4 步毫秒级改完</text>
  <text x="864" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 0.43 秒吐完 512 词代码，成本直降 -86.5%</text>
</svg>
