<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#567 企业 AI 平台架构选型：PAYGO vs. PTU vs. 自建 K8s 成本拐点、五大 AI Gateway 与 2026 突破雷达</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">锁定 24% 与 56% 两大利用率拐点 · 双层网关 (APIM/Kong + Envoy K8s GIE KV 路由) 提升前缀命中至 91.8% · 综合成本降至 $0.058/1M (省 8.59x)</text>

  <!-- Box 1: PAYGO vs PTU vs Self-Hosted K8s Crossover -->
  <rect x="24" y="110" width="350" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 三大算力交付模式双成本拐点 (含人力)</text>
  <rect x="42" y="152" width="314" height="64" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="52" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">区间 1 (日均利用率 &lt; 24% · 探索/低频期)：</text>
  <text x="52" y="191" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 选 Serverless PAYGO + 50% 折扣 Batch API</text>
  <text x="52" y="208" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 零闲置固定成本，避免盲目买卡导致单价倒挂</text>

  <rect x="42" y="224" width="314" height="66" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="52" y="244" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">区间 2 (利用率 24%~56% · 稳态生产期)：</text>
  <text x="52" y="263" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 选 P80 预留 PTU (70%前缀抵扣) + P20 溢出 PAYGO</text>
  <text x="52" y="280" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 消灭 429 限流，综合成本 $0.265/1M (省 46.8%)</text>

  <rect x="42" y="298" width="314" height="70" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="318" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">区间 3 (利用率 &gt; 56% 且 &gt;=16卡 · 规模化期) 🏆</text>
  <text x="52" y="337" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 选自建 K8s/AKS + vLLM V1 / SGLang + 夜间潮汐混部</text>
  <text x="52" y="355" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 含 SRE 人力后仍压至 $0.058/1M (比 PAYGO 省 8.59x!)</text>

  <!-- Box 2: Five AI Gateways Comparison -->
  <rect x="392" y="110" width="348" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="410" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 五大 AI Gateway 双层协同架构选型</text>
  <rect x="410" y="152" width="312" height="96" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="422" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">南北向企业边界网关 (North-South Edge)：</text>
  <text x="422" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Azure APIM：Entra ID OBO + PTU/PAYGO 跨区自动溢出</text>
  <text x="422" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Kong AI Gateway：高性能多云企业级 WCU 配额计费</text>
  <text x="422" y="227" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• LiteLLM：研发敏捷接入 100+ 模型 API 统一适配层</text>

  <rect x="410" y="258" width="312" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="422" y="278" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">东西向集群内 KV 感知路由 (East-West Mesh) 🏆</text>
  <text x="422" y="297" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Envoy AI Gateway (K8s GIE EPP) / Higress：</text>
  <text x="422" y="315" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">实时读取 vLLM/SGLang 显存 KV 水位与前缀块哈希</text>
  <text x="422" y="333" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 前缀缓存命中率从轮询的 16.4% 跃升至 91.8%!</text>
  <text x="422" y="351" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 首字延迟 P95 TTFT 从 1,280ms 压降至 285ms (快 4.49x)</text>

  <!-- Box 3: 2026 Daily AI Infra Breakthrough Radar -->
  <rect x="758" y="110" width="298" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="776" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 2026 每日 AI Infra 能力突破雷达</text>
  <rect x="776" y="152" width="262" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="788" y="174" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">1. Dynamo NIXL + Mooncake 零拷贝池</text>
  <text x="788" y="191" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">跨 NVLink/RDMA/DRAM 暴露延迟压至 1.0ms</text>
  <text x="788" y="213" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">2. vLLM V1 零 CPU 气泡 + 分段图</text>
  <text x="788" y="230" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">ZMQ 多进程解耦调度，Decode 吞吐提升 +68%</text>
  <text x="788" y="252" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">3. DeepEP (IBGDA) + EPLB + 原生 MTP</text>
  <text x="788" y="269" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">0-SM 通信重叠，671B MoE 达 3,890 tok/s/卡</text>
  <text x="788" y="291" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">4. K8s GIE (Inference Extension)</text>
  <text x="788" y="308" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">云原生标准 KV 感知 + 队列水位感知智能路由</text>
  <text x="788" y="330" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">5. 7:1 Hybrid Mamba/DeltaNet + MLA</text>
  <text x="788" y="347" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">256K~1M 上下文 KV 显存占用直降 78%~87%</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 企业 AI 平台架构师黄金组合建议（混合云 + 双层网关 + 潮汐复用）：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 顶层用 Azure APIM / Kong 做统一鉴权、WCU 配额计费与跨区 PTU→PAYGO 溢出；底层 K8s 用 Envoy AI Gateway (GIE EPP) 做 KV 感知路由。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• 白天自建 AKS + vLLM V1 / SGLang 承接高频核心流量，夜间波谷自动回填 Ray Data 批处理与 2% 异步影子评测，全天利用率拉升至 86.5%！</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 实测收益：相比纯调公有云 API 或早买卡闲置，混合分层平台将有效 $/1M Tokens 从 $0.498 压至 $0.058 (省 8.59x)，SLA 可用性达 99.99%！</text>
</svg>
