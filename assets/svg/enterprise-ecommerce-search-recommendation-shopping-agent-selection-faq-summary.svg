<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad402" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad402" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad402)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级电商智能搜索、个性化推荐与导购 Agent（Shopping Assistant）架构选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">Round 402 · 500万SKU / 6000万次月搜索 · 传统BM25 vs. 同步70B阻塞 vs. 同步8B改写 vs. 离线LLM属性增广 + 62ms快慢双速检索 + Redis库存锚定</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">+117.7% CVR · 62ms P95</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 传统 BM25 字面关键词搜索</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">长尾场景意图完全搜不到</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 搜“苏格兰高地防暴雨能套抓绒衣的冲锋衣”</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 标题不含字面词即返回零结果或乱序</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">长尾搜索转化率(CVR): 2.15% ✕</text>
  <text x="54" y="334" fill="#6ee7b7" font-size="13" font-weight="700">价格/缺货幻觉率: 0.0% ✅</text>
  <text x="54" y="358" fill="#94a3b8" font-size="12.5">P95 商品列表延迟: 35.0 ms</text>
  <text x="54" y="382" fill="#cbd5e1" font-size="13" font-weight="700">月总成本 (6000万次): $8,400 / 月</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统货架搜索，痛失高客单长尾单</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 同步 70B LLM 阻塞主搜索</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">2.8秒白屏流失顾客，还瞎编价格</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 每次搜索先等 70B 思考生成再出商品</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 常推荐已断码/下架商品或捏造促销价</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">长尾搜索转化率(CVR): 2.60% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">价格/缺货幻觉率: 6.8% (重灾区 ✕)</text>
  <text x="346" y="358" fill="#fca5a5" font-size="12.5">P95 商品列表延迟: 2,850 ms (2.85s ✕)</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月总成本: $148,000 / 月 (烧卡 ✕)</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁把大模型同步串进电商搜索框</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 同步 8B 改写 + 混合检索</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">在线改写仍突破 100ms 黄金红线</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 8B 在线扩展同义词与属性过滤条件</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 380ms 延迟仍明显慢于原生搜索体验</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">长尾搜索转化率(CVR): 3.45%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">价格/缺货幻觉率: 0.8%</text>
  <text x="638" y="358" fill="#fde68a" font-size="12.5">P95 商品列表延迟: 380.0 ms (&gt;100ms)</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月总成本: $32,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：低并发垂直精品商城过渡方案</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad402)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 离线LLM增广+快慢双速检索 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">62ms 秒出商品 + 异步流式导购卡片</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 离线LLM提取商品场景标签 + 8ms意图解析</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 双塔个性化召回 + Redis实时库存价格绑定</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">长尾搜索转化率(CVR): 4.68% 🏆 (+117.7%)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">价格/缺货幻觉率: 0.0% 🏆 (Redis强绑)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">P95 商品列表延迟: 62.0 ms 🏆 (快46x)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月总成本: $12,600 / 月 (-91.5% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">★ 零售电商搜索与 AI 导购生产首选架构</text>

  <!-- Bottom Bar -->
  <rect x="24" y="556" width="1152" height="100" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="586" fill="#38bdf8" font-size="15" font-weight="700">💡 零售电商 AI 架构师黄金法则：把重型 LLM 移到“商品上架离线侧”与“列表渲染后异步流式侧”，严禁阻塞 62ms 搜索主链路！</text>
  <text x="46" y="612" fill="#cbd5e1" font-size="13">1. 离线供给侧增广（Offline SKU Enrichment）：商品上架时用批处理 LLM 提炼适用人群/穿搭场景写入索引，查询侧只需 8ms 蒸馏小模型解析过滤条件。</text>
  <text x="46" y="636" fill="#94a3b8" font-size="12.5">2. 零价格/库存幻觉铁律：大模型只负责生成选购对比理由，商品卡片上的价格、尺码库存、促销券必须 100% 由 Redis 实时状态服务按 SKU_ID 硬绑定渲染！</text>
</svg>
