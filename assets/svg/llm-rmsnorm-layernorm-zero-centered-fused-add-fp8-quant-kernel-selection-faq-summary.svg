<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 207 · LLM RMSNORM VS LAYERNORM, ZERO-CENTERED (1+W) &amp; FUSED ADD+RMSNORM+FP8 FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800">80-Layer Normalization: 245 µs Unfused Eager (8x HBM) vs 44 µs Single-Pass Add+RMSNorm+FP8 (5.57x)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Unfused Eager &amp; Welford LayerNorm</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• 80-Layer LLM runs 160 Normalization calls per step!</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (PyTorch Eager): 5-6 kernels, 8x HBM traffic (245 µs) ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Materializes 4.2 GB extra intermediate activations in training</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (LayerNorm): Dual mean+variance reduction (115 µs) ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">80-Layer Latency: 245 µs | Extra Activations: 4.2 GB</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Repeated HBM Round-Trips Turn Simple Math into a Memory Wall</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3 &amp; 4: Fused Add + (1+w) RMSNorm + FP8 Cast</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 3 (Fused Add+RMSNorm): In-place residual update (68 µs)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 4 (Single-Pass Add + (1+w) RMSNorm + Dynamic FP8 Quant):</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Computes residual, FP32 rsqrt, and FP8 amax in ONE SRAM pass!</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Zero-centered (1+w) parameterization prevents weight-decay drift</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">80-Layer Latency: 44 µs (5.57x Faster) | Extra HBM: 0.0 GB</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Outputs Quantized FP8 Tensor Directly to Next WGMMA Linear Layer</text>
</svg>
