<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#658 企业千万页多模态 PDF/财报解析入库：版面切块路由 (MinerU + Qwen2.5-VL 局部裁剪) vs. 整页 VLM 与云 API</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">10M-Page PDF Ingestion Sizer: Cloud OCR API ($10/1K pg) vs. Full-Page 72B VLM ($1.85/1K pg) vs. Layout-Cropped 7B VLM ($0.14/1K pg, 6.8x)</text>

  <!-- Left: Why Full-Page VLM & Naive OCR Both Fail at 10M Pages -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-size="15" font-weight="700">① 为什么“全页喂 72B VLM”与“纯传统 OCR”双双翻车？</text>

  <rect x="40" y="150" width="333" height="148" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 误区 A：把每页 PDF 渲染成 2048×2048 整图喂给 72B VLM</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">· 单页产生 `3,200 Visual Tokens` + 吐出 `1,200 Text Tokens`</text>
  <text x="52" y="214" fill="#CBD5E1" font-size="12">· 一页 PDF 中 **`78%` 的面积是普通段落文字和留白**，却全部用</text>
  <text x="52" y="234" fill="#CBD5E1" font-size="12">  昂贵的 72B 自回归 Decode 逐字“抄写”一遍！</text>
  <text x="52" y="254" fill="#FCA5A5" font-size="12" font-weight="700">· 结果：8×H200 每秒仅处理 `42 页/s` (1,000万页需跑 66 小时，</text>
  <text x="52" y="274" fill="#FCA5A5" font-size="11">  算力成本 `$1.85 / 千页`，且长段落容易触发 VLM 漏行幻觉！)</text>

  <rect x="40" y="310" width="333" height="168" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="52" y="332" fill="#FDE68A" font-size="13" font-weight="700">⚠️ 误区 B：纯传统规则 OCR (PyMuPDF / PaddleOCR)</text>
  <text x="52" y="354" fill="#F8FAFC" font-size="12">· 速度虽快 (`350 页/s`)，但遇到双栏跨页财报合并单元格、</text>
  <text x="52" y="374" fill="#CBD5E1" font-size="12">  带折线图的研报、复杂化学/数学公式时，表格结构还原率</text>
  <text x="52" y="394" fill="#FCA5A5" font-size="12" font-weight="700">  (`TEDS / F1`) 暴跌至 `68.4%`！下游 RAG 检索出的数字全错位！</text>
  <text x="52" y="418" fill="#6EE7B7" font-size="12" font-weight="700">✅ 黄金解：版面检测分流 (“78% 走极速文本提取 + 22% 局部</text>
  <text x="52" y="438" fill="#6EE7B7" font-size="12" font-weight="700">   裁剪复杂图表送 7B VLM”) → 速度与精度兼得！</text>

  <!-- Center: Layout-Aware Region Cropping Pipeline -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 两阶段版面切块路由流水线 (提速 6.8x · $0.14/千页)</text>

  <rect x="423" y="150" width="354" height="92" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="435" y="172" fill="#38BDF8" font-size="13" font-weight="700">Stage 1: 极速版面检测与阅读顺序重建 (2.2 ms / 页)</text>
  <text x="435" y="192" fill="#F1F5F9" font-size="12">· 模型：`DocLayout-YOLO / MinerU Layout (TensorRT FP16)`</text>
  <text x="435" y="212" fill="#CBD5E1" font-size="12">· 精准框出 4 类区域：`纯文本段落`、`无线表/跨页表`、`公式`、`统计图`</text>
  <text x="435" y="230" fill="#6EE7B7" font-size="11" font-weight="700">· LayoutReader 重排双栏/三栏正确阅读顺序，杜绝左右栏串行</text>

  <rect x="423" y="254" width="354" height="110" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="435" y="276" fill="#6EE7B7" font-size="13" font-weight="700">Stage 2: 按区域类型精准分流 (消灭 78% VLM 无效 Token)</text>
  <text x="435" y="298" fill="#F8FAFC" font-size="12">· **78% 纯文本区域**：优先直接抽取 PDF 原生字体层 (`0.1ms`) 或</text>
  <text x="435" y="316" fill="#D1FAE5" font-size="11">  跑轻量 `PP-OCRv4 TensorRT` (`3.5ms`)，零大模型 Token 消耗！</text>
  <text x="435" y="338" fill="#FDE68A" font-size="12" font-weight="700">· **22% 复杂表格/公式/架构图裁剪块 (Region Crop)**：</text>
  <text x="435" y="354" fill="#D1FAE5" font-size="11">  仅将裁剪后的局部图片 (`平均 420 Visual Tokens`) 送入 `Qwen2.5-VL-7B FP8`</text>

  <rect x="423" y="376" width="354" height="102" rx="8" fill="#0F172A" stroke="#A78BFA"/>
  <text x="435" y="398" fill="#C4B5FD" font-size="13" font-weight="700">Stage 3: 跨页表格自动缝合 + Markdown/HTML 双模态组装</text>
  <text x="435" y="418" fill="#E2E8F0" font-size="12">· 若第 N 页底部表格与第 N+1 页顶部表格列宽对齐且无表尾，</text>
  <text x="435" y="438" fill="#E2E8F0" font-size="12">  自动拼接为单张图片送入 7B VLM 输出完整 `HTML &lt;table&gt;`</text>
  <text x="435" y="458" fill="#6EE7B7" font-size="12" font-weight="700">· 复杂财报表格还原率 (`TEDS`) 达 `96.2%` (超越整页 72B 的 94.1%)！</text>

  <!-- Right: 10-Million Page TCO & Throughput Matrix -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="829" y="136" fill="#FDE68A" font-size="15" font-weight="700">③ 1,000 万页 PDF 解析四大方案成本与吞吐对决</text>

  <rect x="827" y="150" width="333" height="74" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="839" y="170" fill="#FCA5A5" font-size="13" font-weight="700">1. 公有云商业文档解析 API ($1.50 ~ $10.00 / 千页)</text>
  <text x="839" y="190" fill="#E2E8F0" font-size="12">· 1,000 万页总账单: **`$15,000 ~ $100,000`** | 表格 F1: `92.5%`</text>
  <text x="839" y="208" fill="#FCA5A5" font-size="11">· 评价：千万页级存量文档入库账单惊人，且涉密合同禁出网</text>

  <rect x="827" y="234" width="333" height="74" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="839" y="254" fill="#FDE68A" font-size="13" font-weight="700">2. 纯传统 OCR 流水线 (PaddleOCR · $0.05 / 千页)</text>
  <text x="839" y="274" fill="#E2E8F0" font-size="12">· 吞吐: `350 页/s` | 1,000 万页成本 `$500` | 表格 F1: **`68.4%`**</text>
  <text x="839" y="292" fill="#FDE68A" font-size="11">· 评价：跨页合并单元格与图表完全丢失，污染 RAG 知识库</text>

  <rect x="827" y="318" width="333" height="74" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="839" y="338" fill="#38BDF8" font-size="13" font-weight="700">3. 整页图像直喂 72B VLM (8× H200 · $1.85 / 千页)</text>
  <text x="839" y="358" fill="#E2E8F0" font-size="12">· 吞吐: `42 页/s` (需 66.1 小时) | 成本 `$18,500` | 表格 F1: `94.1%`</text>
  <text x="839" y="376" fill="#38BDF8" font-size="11">· 评价：78% 算力浪费在抄写普通段落文字上</text>

  <rect x="827" y="402" width="333" height="80" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="839" y="422" fill="#6EE7B7" font-size="13" font-weight="700">4. 版面切块分流 (MinerU + 22% 局部裁剪喂 7B VLM FP8)</text>
  <text x="839" y="442" fill="#F8FAFC" font-size="12">· 吞吐: **`285 页/s` (`6.8x` 提速 · 仅需 9.7 小时跑完 1,000 万页)**</text>
  <text x="839" y="460" fill="#6EE7B7" font-size="12" font-weight="700">· 表格 F1: **`96.2%`** | 成本仅 **`$0.14 / 千页` (10M 页仅 `$1,400`!)**</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 企业文档解析入库设计铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 严禁把整页 PDF 渲染成大图直接喂给 72B VLM：用 `DocLayout-YOLO (2.2ms)` 先切块，78% 纯文本走原生提取/轻量 OCR，仅 22% 图表走 VLM；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 局部裁剪 (Region Crop) 让 7B VLM 打赢整页 72B VLM：裁剪后单表分辨率更高且无周围正文干扰，TEDS 表格精度升至 96.2%，成本直降 92.4%。</text>
</svg>
