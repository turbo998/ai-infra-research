<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="28" y="24" width="1144" height="582" rx="16" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <text x="56" y="72" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">ENTERPRISE AI INFRASTRUCTURE · MEMORY-EFFICIENT &amp; ORTHOGONALIZED OPTIMIZERS (#383)</text>
  <text x="56" y="110" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800">FP32 AdamW (12Ψ) vs. 8-Bit AdamW vs. GaLore/APOLLO vs. Distributed Muon</text>
  <text x="56" y="142" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">GaLore/APOLLO Cuts Optimizer HBM by 80% (840GB -&gt; 168GB); Distributed Muon Reaches Target Loss in 1.42x Fewer Tokens</text>

  <rect x="56" y="172" width="530" height="190" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
  <text x="80" y="206" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Tier 1: The 840 GB FP32 AdamW Tax on 70B</text>
  <text x="80" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">• BF16 Weights = 140 GB, but FP32 AdamW = 840 GB (6x larger!)</text>
  <text x="80" y="266" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Stores 4B Master Weights + 4B Momentum m_t + 4B Variance v_t</text>
  <text x="80" y="294" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Coordinate-wise AdamW ignores 2D matrix spectral structure</text>
  <text x="80" y="326" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• High HBM Footprint &amp; Slower Per-Token Convergence Rate</text>

  <rect x="614" y="172" width="530" height="190" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="638" y="206" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Tier 3 (GaLore/APOLLO) &amp; Tier 4 (Distributed Muon)</text>
  <text x="638" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 3 (GaLore/APOLLO): Low-rank gradient projection cuts state to</text>
  <text x="638" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">  2.4 Bytes/param (168 GB for 70B — 80% HBM reduction!)</text>
  <text x="638" y="294" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 4 (Muon): 5-step BF16 Newton-Schulz orthogonalizes 2D momentum</text>
  <text x="638" y="324" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">  (no v_t needed: 8Ψ state) &amp; saves 29.5% total training GPU hours!</text>

  <rect x="56" y="386" width="1088" height="190" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="80" y="420" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">4-Tier Optimizer Architecture Matrix (70B Model Training · Target Loss = 1.85)</text>
  <text x="80" y="456" fill="#e2e8f0" font-family="Consolas, monospace" font-size="15">Tier 1 (Standard FP32 AdamW 12Ψ)   : State = 840.0 GB | Token Eff = 1.00x | GPU Hours Saved =  0.0%</text>
  <text x="80" y="486" fill="#e2e8f0" font-family="Consolas, monospace" font-size="15">Tier 2 (8-Bit Blockwise AdamW 6Ψ)  : State = 420.0 GB | Token Eff = 1.00x | GPU Hours Saved =  8.5%</text>
  <text x="80" y="516" fill="#93c5fd" font-family="Consolas, monospace" font-size="15">Tier 3 (GaLore / APOLLO Low-Rank)  : State = 168.0 GB | Token Eff = 0.98x | GPU Hours Saved = 18.0%</text>
  <text x="80" y="546" fill="#34d399" font-family="Consolas, monospace" font-size="15" font-weight="700">Tier 4 (Distributed Muon 8Ψ)       : State = 560.0 GB | Token Eff = 1.42x | GPU Hours Saved = 29.5%</text>
</svg>
