  <rect width="1200" height="680" fill="url(#bgGrad406)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级医疗诊室环境语音病历（Ambient AI Scribe）、FHIR 结构化与 ICD-10 医保编码架构选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">Round 406 · 50万次问诊/月 (750万分钟) · 通用ASR+自由SOAP vs. 原生音频LLM vs. 医疗ASR+裸70B vs. RxNorm剂量门禁 + FHIR R4 + ICD-10树检索 + 原声锚点</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">99.7% Safety · 97.8% ICD10</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
