  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">同音药名混淆，医保编码瞎编</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 易漏“否认胸痛”中的否定词或搞混药名</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 凭记忆默写7.2万个ICD-10代码错误百出</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">药品/剂量/否定词准确: 84.5% (危 ✕)</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">ICD-10/CPT 编码合格率: 61.2% ✕</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">医生审阅改病历耗时: 6.8 分钟/诊次 ✕</text>
  <text x="54" y="382" fill="#cbd5e1" font-size="13" font-weight="700">月总成本 (50万次): $62,000 / 月</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：严禁用于临床电子病历 (EMR/EHR)</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 端到端原生音频多模态大模型</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">750万分钟音频天价，仍无术语树校验</text>
