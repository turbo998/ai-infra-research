  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">药品/剂量/否定词准确: 91.0% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">ICD-10/CPT 编码合格率: 74.5% ✕</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">医生审阅改病历耗时: 4.5 分钟/诊次</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月总成本: $158,000 / 月 (天价 ✕)</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：概念验证演示，临床与医保拒付高</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 医疗专精 ASR + 裸 70B 生成</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">转写准但缺 RxNorm 极值与原声溯源</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 专科医学热词转写准确，但直接生成编码</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 医生无法悬停一键回放患者原话核实</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">药品/剂量/否定词准确: 96.2%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">ICD-10/CPT 编码合格率: 83.8%</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">医生审阅改病历耗时: 3.1 分钟/诊次</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月总成本: $44,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：非医保结算类普通门诊摘要</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad406)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: RxNorm+FHIR+ICD10树+溯源 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">药典安全门 + 编码树检索 + 54秒签字</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• RxNorm剂量范围校验 + 阴性症状显式锁定</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• HL7 FHIR R4强约束 + ICD-10树检索 + 原声锚点</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">药品/剂量/否定词准确: 99.7% 🏆</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">ICD-10/CPT 编码合格率: 97.8% 🏆</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">医生审阅耗时: 0.9 分钟 (54秒 🏆)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月总成本: $14,200 / 月 (-91.0% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">★ 智慧医院电子病历与DRG/DIP医保编码首选</text>

  <!-- Bottom Bar -->
  <rect x="24" y="556" width="1152" height="100" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="586" fill="#38bdf8" font-size="15" font-weight="700">💡 医疗临床 AI 架构师黄金法则：严禁大模型凭记忆背诵 ICD-10 编码或跳过 RxNorm 药典安全校验！</text>
  <text x="46" y="612" fill="#cbd5e1" font-size="13">1. 药品剂量与阴性症状双保险：所有识别出的药名+毫克数必须过 RxNorm/院内处方极值表校验（拦截 40mg 误听为 400mg），并对“患者否认发热/过敏”做否定词强锁定。</text>
  <text x="46" y="636" fill="#94a3b8" font-size="12.5">2. 先提取临床实体、再查 ICD-10/SNOMED 标准字典树：通过两阶段本体树检索 + HL7 FHIR R4 结构化输出，将医保编码合格率从 61.2% 提至 97.8%！</text>
</svg>
