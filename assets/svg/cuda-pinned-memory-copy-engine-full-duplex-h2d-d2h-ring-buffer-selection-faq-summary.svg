<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 220 · CUDA PINNED MEMORY, SILENT PAGEABLE SYNC FALLBACK &amp; DUAL COPY ENGINE (H2D+D2H) FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800">PCIe Gen5 x16 Transfer: 11.8 GB/s Pageable Sync Trap vs 108.4 GB/s Pinned Pool + Dual Copy Engines</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Pageable Sync Fallback &amp; Hot-Loop Pin</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• GPU DMA Copy Engines CANNOT read pageable OS memory directly!</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1: `non_blocking=True` on pageable CPU tensor SILENTLY blocks</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  the CPU thread &amp; double-copies via driver staging (11.8 GB/s) ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: Calling `.pin_memory()` per step stalls on `mmap_lock` ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Bandwidth: 11.8 GB/s | CPU Stall: 42.5 ms (Not Async!)</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">non_blocking=True Is Ignored Whenever Source/Dest CPU Memory Is Pageable</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3 &amp; 4: Pre-Pinned Pool + Dual Copy Engines</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 3: Pre-allocated Pinned Ring-Buffer Pool (54.2 GB/s unidir)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 4: Separate `stream_h2d` (CE0) + `stream_d2h` (CE1) streams!</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Drives both PCIe Gen5 x16 directions simultaneously (54.2 + 54.2 GB/s)</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Zero runtime `ioctl` page-locking; 0.02 ms true async CPU launch</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Full-Duplex Bandwidth: 108.4 GB/s (9.19x) | Stall: 0.02 ms 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Powers Simultaneous KV Prefetch (H2D) &amp; KV Eviction (D2H)</text>
</svg>
