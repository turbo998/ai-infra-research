  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3 &amp; 4: ar_ftree,ar_updn + RNIC OOO + FR</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 3 (`ftree,updn`): Up*/Down* rule guarantees zero credit loops</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 4 (`ar_ftree,ar_updn`): Switch ASIC picks least-loaded Spine port</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• ConnectX-7 Hardware Out-of-Order (OOO) places packets directly in HBM</text>
