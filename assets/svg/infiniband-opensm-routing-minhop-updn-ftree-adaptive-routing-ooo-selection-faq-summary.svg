  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800">NDR 400G InfiniBand: 24.8 GB/s minhop LFT Collisions vs 49.2 GB/s ar_ftree + RNIC OOO + Fast Recovery</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Default minhop &amp; Brittle Static ftree</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Traditional IB LFT maps 1 Destination LID -&gt; 1 fixed output port</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`minhop`): Unbalanced Spine uplinks + Credit-Loop Deadlocks ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (`ftree` alone): Silently drops back to `minhop` if 1 link fails!</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Central OpenSM sweep takes 1,800 – 2,500 ms on link failure ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">AlltoAll BusBW: 24.8 GB/s | Failover: 2,500 ms</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Static Destination-Based LFTs Collide Under Dynamic MoE AlltoAll</text>

