<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #399 · THREE-WATERMARK GPU SIZER, TPM/TPS/PTU MATH, LITTLE'S LAW &amp; SLA GOODPUT</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业大模型容量规划终极手算指南：三道水位线算卡、TPM/TPS 换算与五大场景 SLA</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">从业务 DAU/RPS 正推系统 TPS/TPM、Little's Law 并发槽位、三道水位线 (显存/带宽/算力) 与 PTU 成本拐点</text>

  <!-- Left Box: Three GPU Watermarks Formula -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. “模型需要多少张 GPU 放得下 &amp; 跑得动”三道水位线公式</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">① 显存水位 N_mem = ceil( (M_weights + M_KV(B,S) + M_act) / (0.85 * HBM) )</text>
  <text x="90" y="242" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">② 带宽水位 N_bw  = ceil( (M_active_w + M_KV) / (TPOT_SLA * BW_HBM * 0.72) )</text>
  <text x="90" y="262" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">③ 算力水位 N_cmp = ceil( RPS_peak * 2 * N_active * S_in / (FLOPS * MFU) )</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 最终拍板卡数: N_GPU = max(N_mem, N_bw, N_cmp) (向上取整至 1/2/4/8/16)</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• MoE 铁律：显存容量按【总参数 671B】算，带宽/算力按【激活参数 37B】算！</text>
  <text x="76" y="350" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实算：DeepSeek-671B FP8 在 H200 (141GB) 上仅需单机 8 卡即可支撑 192 并发！</text>

  <!-- Right Box: TPM / TPS / PTU & Little's Law -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. TPM / TPS / PTU 精确换算与 Little's Law 并发槽位公式</text>
  <rect x="634" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">E2EL = TTFT + (N_out - 1) * TPOT   |   Stream_TPS = 1 / TPOT</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">Little's Law 峰值活跃会话数: B_active = RPS_peak * E2EL</text>
  <text x="648" y="262" fill="#fde68a" font-family="Consolas, monospace" font-size="12" font-weight="700">云端 PTU 加权折算: TPM_weighted = TPM_in * (1 - 0.5*eta) + 4 * TPM_out</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 思维链放大器：N_out 从 400 涨至 3,200 (R1 思考) -&gt; E2EL 与 B_active 暴涨 7倍!</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 压测防坑：严禁只报无 SLA 约束的 Raw TPS，必须以双 SLA 达标 Goodput 定容</text>
  <text x="634" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 混合采买：P80 基线买 PTU/自建 + P20 尖峰溢出走 PAYGO，总 TCO 立省 64.5%！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四种企业大模型容量规划与算力采买方法论实效对比 (50 RPS 高峰 · 4K 输入 / 600 输出)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">容量规划方法论档位</text>
  <text x="430" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">采购/分配 GPU 卡数</text>
  <text x="605" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">高峰 P99 SLA 达标率</text>
  <text x="780" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">单卡达标 Goodput</text>
  <text x="945" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">月度总成本 (TCO)</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 仅按权重显存 (2*Psi) 拍脑袋买卡 (忽略 KV 并发与带宽墙)</text>
  <text x="430" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">8x H100 (严重不足)</text>
  <text x="605" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">31.5% ✕ (频繁 OOM)</text>
  <text x="780" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">420 tok/s/GPU ✕</text>
  <text x="945" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">业务事故 / $118K 补救</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 按峰值 RPS 静态硬买 100% 独立 PTU / BF16 专池 (无缓存折算)</text>
  <text x="430" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">48x H100 (过度冗余)</text>
  <text x="605" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">98.2%</text>
  <text x="780" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">680 tok/s/GPU</text>
  <text x="945" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$138,000 / 月 ✕</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: 三道水位线 (HBM×BW×FLOPS) + Little's Law + FP8 精准配平</text>
  <text x="430" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">24x H200 FP8</text>
  <text x="605" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">99.4% ✓</text>
  <text x="780" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">1,920 tok/s/GPU ✓</text>
  <text x="945" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$68,000 / 月</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): 三道水位线 + Prefix 缓存抵扣 + P80 基线池 + P20 PAYGO 溢出</text>
  <text x="430" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">16x H200 + 溢出路由 🏆</text>
  <text x="605" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">99.7% 🏆</text>
  <text x="780" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2,180 tok/s/GPU (5.19x) 🏆</text>
  <text x="945" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$49,000 / 月 (-64.5%) 🏆</text>
</svg>
