<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad418" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad418" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad418)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级财务应付账款（AP 三单匹配）、包装单位换算与防 BEC 银行账号篡改 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">月均 28万张供应商发票 / 85万条 PO/GR 行 · 传统OCR模板+人工对账 vs. 纯VLM看发票直过账 vs. VLM+向量匹配 vs. 单位换算+确定性三单匹配+主数据银行铁闸</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">89.4% STP · 0% BEC Fraud</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 传统 OCR 模板 + 人工 MIRO 对账</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">版式微调即失效，单张发票成本 $11.80</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 供应商发票写“箱”而 PO 写“个”即转人工</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 73.5% 发票需财务共享中心会计逐行手工核对</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">全自动三单匹配率(STP): 26.5% ✕</text>
  <text x="54" y="334" fill="#6ee7b7" font-size="13" font-weight="700">超额/重复付款与BEC诈骗率: 0.35%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">单张发票平均处理成本: $11.80 / 张 ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月AP人力与错付总成本: $330,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统财务共享中心，人工核对极其繁重</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 纯 VLM 看发票直调 SAP 过账</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">遭 BEC 邮件诈骗改收款账号，把钱打给黑客</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 轻信发票备注“我司已更换新IBAN账号”直接改付</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 包装单位换算错误与重复过账率高达 6.40%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">全自动三单匹配率(STP): 78.0%</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">超额/重复付款与BEC诈骗率: 6.40% (资损 ✕)</text>
  <text x="346" y="358" fill="#fca5a5" font-size="12.5">单张发票平均处理成本: $16.50 / 张 ✕</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月AP与诈骗资损总成本: $462,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让VLM采信发票上的银行账号或心算对账</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: VLM 发票提取 + 向量行项目匹配</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">能对齐物料名称，但缺单位换算与分批收货</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 搞不清“50箱×24件 = 1,200个”的包装折算</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 一张 PO 分 4 次收货 (GR) 开 3 张发票时容易错乱</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">全自动三单匹配率(STP): 61.0%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">超额/重复付款与BEC诈骗率: 1.85% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">单张发票平均处理成本: $4.90 / 张</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月AP人力与错付总成本: $137,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：简单单次收货发票，复杂制造业对账仍需人工</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad418)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 单位换算+确定性三单+银行铁闸 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">UoM 包装归一 + 公差引擎 + 银行主数据铁闸</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 自动折算箱/打/米与个，精确核销分批 MIGO 收货</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 强制只付 SAP LFBK 银行主数据，BEC 改号立即冻结</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">全自动三单匹配率(STP): 89.4% 🏆 (+62.9pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">超额/重复/BEC诈骗率: 0.0% 🏆 (主数据锁死)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">单张发票处理成本: $1.45 / 张 🏆 (-87.7%)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月AP运营总成本: $40,600 (-87.7% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：跨国集团财务共享中心(FSSC)、SAP/Oracle ERP</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业财务共享中心 (FSSC) 架构师铁律（UoM Normalization + Deterministic 3-Way Match + Anti-BEC Gate）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 多模态大模型只负责做“非结构化发票 → 标准物料编码与基础计量单位（Base UoM）折算”，PO==GR==Invoice 金额与数量公差必须由确定性代码核销。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 严禁采信发票票面印制的任何新银行账号：付款只准读取 ERP 供应商主数据（SAP LFBK），发现票面账号不一致立即触发 BEC 诈骗预警 · Provenance: synthetic + anonymized_reported</text>
</svg>
