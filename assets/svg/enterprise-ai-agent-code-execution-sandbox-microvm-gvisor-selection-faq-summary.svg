<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad395" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad395" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad395)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级智能体代码解释器 (Code Interpreter Sandbox) 选型指南：Docker vs. gVisor vs. Firecracker 微虚拟机</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：内存快照恢复微虚拟机 (Firecracker Snapshot / ACA Dynamic Sessions / E2B) 实现 115ms 极速唤醒与 100% 硬件 KVM 内核隔离</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 395 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 普通 Docker 共享内核</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• `runc` 与宿主机共享同一个 Linux 内核</text>
  <text x="40" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 暴露 350+ 系统调用，高危容器逃逸 ✕</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 硬件/内核隔离得分：0.0% ✕</text>
  <text x="40" y="232" fill="#fde68a" font-size="12" font-weight="700">• 启动+冷导 Pandas 耗时：450 ms</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 极易偷取 K8s Token 与云元数据 SSRF ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">300万次月成本：$1,800 (CISO一票否决)✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">红线：大模型写的代码本质是任意远程代码</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">执行 (RCE)，绝对禁止在普通 Docker 里裸跑！</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 按会话冷启动云虚拟机</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 每次会话新开一台 EC2 / Azure VM</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 从头引导 OS 内核 + 冷加载 Python</text>
  <text x="332" y="212" fill="#34d399" font-size="12" font-weight="700">• 硬件/内核隔离得分：100.0% ✅</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 启动+导包就绪耗时：18,500 ms (18.5s)✕</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• 系统调用 I/O 损耗：0.0%</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">300万次月成本：$34,000 (慢且贵)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">痛点：用户问一句“帮我画个销售趋势图”</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">光等虚拟机开机就要干等将近 20 秒！</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 用户态内核沙箱 (gVisor)</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• K8s `runtimeClassName: gvisor (runsc)`</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• Go 编写的 Sentry 用户态内核拦截系统调用</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 硬件/内核隔离得分：92.0% ✅</text>
  <text x="624" y="232" fill="#7dd3fc" font-size="12" font-weight="700">• 启动+导包就绪耗时：680 ms ✅</text>
  <text x="624" y="252" fill="#fde68a" font-size="12">• 文件 I/O 系统调用损耗：28.0%</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">300万次月成本：$4,600 (省 86.5%)✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：云上普通 K8s 节点（无 `/dev/kvm`</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">嵌套虚拟化权限）自建沙箱的最佳选择</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 快照微虚拟机 (MicroVM)🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• Firecracker / ACA Dynamic Sessions / E2B</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 预导好 Pandas 的内存快照 115ms 恢复！</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 硬件 KVM 隔离得分：100.0% 🏆</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 就绪耗时：仅 115 ms 🏆 (比冷Docker还快!)</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• 原生内核 I/O 损耗：仅 1.5% 🏆</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">300万次月成本：$5,400 (省 84.1%)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级 Code Interpreter 与 SWE-Agent 终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">独享 Guest 内核 + 115ms 唤醒 + 零公网出网</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么微虚拟机内存快照 (MicroVM Snapshot) 启动甚至比普通 Docker 还要快 4 倍？三大沙箱核心设计</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad395)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 内存快照跳过 `import pandas`（115ms vs 450ms）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 普通容器虽然启动只要 45ms，但容器内冷启动 Python 解释器并</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">  执行 `import pandas, numpy, matplotlib` 要读上千个 `.so` 文件 (`405ms`)！</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">• Firecracker 先把库全部 import 进内存后拍下 VM 内存快照 (Snapshot)，</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 新会话直接 `mmap` 写时复制恢复内存态，`115ms` 直接运行用户代码！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 彻底封死云元数据 SSRF 与内网横向移动</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 攻击者最爱让 Agent 执行 `curl http://169.254.169.254/latest/meta-data`</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  偷走宿主机 IAM Role 密钥或扫描企业内网 `10.0.0.0/8`！</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 沙箱微虚拟机网卡必须默认 `DROP` 一切出站流量（无公网、无内网），</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 仅通过宿主机 `vsock` 管道传入待分析的 CSV 文件并传回生成的图表！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 防 Fork 炸弹与磁盘撑爆（cgroups v2 硬配额）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 大模型写出的死循环代码（`while True: os.fork()` 或生成 100GB</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">  临时文件）会瞬间打挂未设防的节点。</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• 强制设定每个 MicroVM：`vCPU=1`, `RAM=2GB`, `pids.max=64`,</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  `tmpfs=512MB`, 单次执行硬超时 `timeout=30s`，超限立即秒级销毁！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 395 合成标定算例 (independently_reproduced=false)</text>
</svg>
