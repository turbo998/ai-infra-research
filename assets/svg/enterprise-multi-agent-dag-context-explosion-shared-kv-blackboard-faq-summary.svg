<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#652 企业多智能体工作流 (Multi-Agent DAG) 二次方上下文爆炸治理：全量广播 vs. 共享 KV 指针 vs. 结构化黑板</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">Multi-Agent DAG Sizing (6-Step Workflow): O(K^2) Full-History Broadcast (148K tok, 18.4s) vs. Shared Radix KV + Blackboard (34.8K tok, 4.6s)</text>

  <!-- Left: O(K^2) Context Explosion Math -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-size="15" font-weight="700">① 为什么 6 步串联 Agent 会烧掉单轮问答 24 倍算力？</text>

  <rect x="40" y="150" width="333" height="156" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 反模式：群聊式全量历史广播 (Group-Chat Broadcast)</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">· 流程：`Planner → RAG → SQL → Coder → Critic → Writer`</text>
  <text x="52" y="214" fill="#CBD5E1" font-size="12">· 每个子 Agent 把自己专属的 System Prompt 插在最前面，</text>
  <text x="52" y="234" fill="#CBD5E1" font-size="12">  再把前面所有 Agent 的原始日志、SQL 表、代码草稿全盘拼接</text>
  <text x="52" y="254" fill="#FCA5A5" font-size="12" font-weight="700">· 致命后果 1：System Prompt 不同 → 破坏 L3 前缀缓存 (`0%` 复用)！</text>
  <text x="52" y="274" fill="#FCA5A5" font-size="12" font-weight="700">· 致命后果 2：累积输入 Token 按 O(K²) 爆炸至 `148,000 Tokens`！</text>
  <text x="52" y="292" fill="#94A3B8" font-size="11">  (用户端到端等待 18.4 秒，单次任务烧掉 $0.082 算力)</text>

  <rect x="40" y="318" width="333" height="160" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="52" y="340" fill="#38BDF8" font-size="13" font-weight="700">📐 多智能体 K 步串联累积输入 Token 手算公式</text>
  <text x="52" y="362" fill="#F8FAFC" font-size="12" font-weight="700">T_total(K) = K·S_base + Σ_{i=1..K} (K - i + 1)·ΔC_i</text>
  <text x="52" y="384" fill="#CBD5E1" font-size="12">· 当每步新增原始工具返回 `ΔC = 6,000 tok`、K = 6 步时：</text>
  <text x="52" y="404" fill="#FCA5A5" font-size="12">  · 全量重算模式：`148,000` 未命中 Prefill Tokens</text>
  <text x="52" y="424" fill="#6EE7B7" font-size="12" font-weight="700">  · 结构化黑板 + 共享前缀指针：仅 `18,200` 未命中 Tokens</text>
  <text x="52" y="444" fill="#6EE7B7" font-size="12" font-weight="700">    (`-87.7%` Prefill 计算量，集群所需 H200 从 32 张降至 8 张！)</text>

  <!-- Center: Shared KV Prefix Tree + Structured Blackboard -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 破局两大架构武器：结构化黑板 + 共享 KV 树后缀追加</text>

  <rect x="423" y="150" width="354" height="156" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="435" y="172" fill="#6EE7B7" font-size="13" font-weight="700">武器 1：共享前缀底座 + 角色指令后置 (Role-at-Tail)</text>
  <text x="435" y="194" fill="#F8FAFC" font-size="12">· 严禁为 6 个子 Agent 替换头部 System Prompt！</text>
  <text x="435" y="214" fill="#D1FAE5" font-size="12">· 将 `[全局文档 + 共享工具库 + 历史状态]` 固定为不可变前缀，</text>
  <text x="435" y="234" fill="#D1FAE5" font-size="12">  而将当前子 Agent 的特定角色指令 (`Act as SQL Critic...`)</text>
  <text x="435" y="254" fill="#6EE7B7" font-size="12" font-weight="700">  作为最后一条 User 消息追加在末尾 (`Role-at-Tail`)！</text>
  <text x="435" y="274" fill="#A7F3D0" font-size="11">  → 配合网关 Session_ID 粘性路由，6 个子 Agent 在同一台引擎上</text>
  <text x="435" y="292" fill="#A7F3D0" font-size="11">  共享同一棵 Radix KV 树，跨步 KV 命中率从 `12%` 飙至 **`91.5%`**！</text>

  <rect x="423" y="318" width="354" height="160" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="435" y="340" fill="#38BDF8" font-size="13" font-weight="700">武器 2：结构化状态黑板 (Blackboard Artifact Store)</text>
  <text x="435" y="362" fill="#F1F5F9" font-size="12">· 子 Agent 执行 SQL 或搜出 20 页网页后，**严禁把 16K 原始表</text>
  <text x="435" y="382" fill="#F1F5F9" font-size="12">  直接塞进公共对话流**！</text>
  <text x="435" y="402" fill="#6EE7B7" font-size="12" font-weight="700">· 原始大载荷存入 Redis 黑板 (`artifact://sql_res_04`)，</text>
  <text x="435" y="422" fill="#D1FAE5" font-size="12">  仅向下一跳传递 `&lt;= 512 Tokens` 的 XGrammar 强类型摘要：</text>
  <text x="435" y="442" fill="#38BDF8" font-size="11" font-family="Consolas, monospace">  {"step":"sql", "ref":"art_04", "key_metrics":{...}}</text>
  <text x="435" y="462" fill="#6EE7B7" font-size="11" font-weight="700">· 彻底斩断 O(K²) 噪音传染，任务成功率反升 +14.2 pts (达 94.6%)！</text>

  <!-- Right: Parallel DAG Fan-Out & Sizer -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="829" y="136" fill="#FDE68A" font-size="15" font-weight="700">③ 串行链改 DAG 扇出 + 大小模型分级路由实测</text>

  <rect x="827" y="150" width="333" height="106" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="839" y="172" fill="#6EE7B7" font-size="13" font-weight="700">⚡ DAG 关键路径压缩 (6 步串行 → 3 层并行)</text>
  <text x="839" y="192" fill="#F8FAFC" font-size="12">· Layer 1: `Planner (70B)` 拆解子任务 (`0.9s`)</text>
  <text x="839" y="212" fill="#F8FAFC" font-size="12">· Layer 2: `RAG + SQL + Web` 3 个 `14B FP8` 并行扇出 (`1.8s`)</text>
  <text x="839" y="232" fill="#F8FAFC" font-size="12">· Layer 3: `Synthesizer + Critic (70B)` 汇总输出 (`1.9s`)</text>
  <text x="839" y="250" fill="#6EE7B7" font-size="11" font-weight="700">  → 端到端耗时 `E2EL = 0.9 + 1.8 + 1.9 = 4.6 秒` (对比串行 18.4 秒)！</text>

  <rect x="827" y="268" width="333" height="210" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="839" y="290" fill="#38BDF8" font-size="13" font-weight="700">📊 50 RPS 企业多智能体平台三方案对比</text>
  <text x="839" y="314" fill="#FCA5A5" font-size="12">1. 全量广播 + 全程 70B 串行 (LangGraph 默认拼法)：</text>
  <text x="839" y="332" fill="#CBD5E1" font-size="11">   · 148K tok/任务 | E2EL: `18.4s` | 需 **`32× H200`** ($0.082/任务)</text>
  <text x="839" y="356" fill="#FDE68A" font-size="12">2. 结构化黑板 + 轮询网关 (无前缀亲和)：</text>
  <text x="839" y="374" fill="#CBD5E1" font-size="11">   · 34.8K tok/任务 | E2EL: `8.2s` | 需 `16× H200` ($0.031/任务)</text>
  <text x="839" y="398" fill="#6EE7B7" font-size="12" font-weight="700">3. 黑板 + Role-at-Tail 共享 KV + DAG 大小模型混排：</text>
  <text x="839" y="418" fill="#F8FAFC" font-size="11">   · 有效未缓存仅 `18.2K tok` | E2EL: **`4.6s (-75.0%)`**</text>
  <text x="839" y="438" fill="#6EE7B7" font-size="11" font-weight="700">   · 仅需 **`8× H200 + 4× L40S`** ($0.014/任务 · 省成本 82.9%)！</text>
  <text x="839" y="458" fill="#94A3B8" font-size="11">   · 防死循环红线：强制设置 `max_agent_turns = 10` 与重复工具熔断</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 多智能体 (Multi-Agent) 架构设计铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 严禁修改头部 System Prompt 切换子 Agent 角色：采用 `Role-at-Tail (末尾追加角色指令)` + `Session_ID` 亲和路由，让全链路共享同一棵 Radix KV 树；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 原始工具返回进 Redis 黑板、Agent 间只传 &lt;=512 Token 结构化摘要：斩断 O(K²) 上下文爆炸，将 6 步工作流延迟从 18.4s 压至 4.6s (-75%)。</text>
</svg>
