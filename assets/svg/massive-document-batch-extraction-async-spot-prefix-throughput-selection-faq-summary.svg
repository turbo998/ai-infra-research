  <rect width="1280" height="760" fill="url(#bg369)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="450" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="277" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 369 · MASSIVE OFFLINE DOCUMENT BATCH EXTRACTION ARCHITECTURE</text>
  <text x="518" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="23.5" font-weight="800">海量离线文档批处理与知识抽取吞吐架构：同步轮询 vs. 托管 Batch API vs. Spot+Ray vs. 二维前缀分桶</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">100 万份合同/工单知识抽取 (6.6B Tokens)：为什么多线程调在线 API 耗时 38.5 小时 ($26.4K)，而“前缀长度二维排序 + 夜间填谷”1.6 小时跑完且省钱 94.4% ($1.48K)？</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc369)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="236" height="24" rx="6" fill="#7f1d1d"/>
  <text x="186" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 多线程同步狂刷在线 API</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">打爆实时配额 · 苦等 38.5 小时</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">100 线程直接调生产实时端点 + 随机乱序</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么离线跑批严禁刷在线接口？</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">瞬间挤爆全司 TPM 配额导致 34.5% 429</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">报错，把白天在线客服彻底卡瘫痪 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万文档总耗时: <tspan fill="#f87171" font-weight="700">38.5 小时 (退避重试慢 ✕)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 对在线生产冲击: <tspan fill="#f87171" font-weight="700">34.5% HTTP 429 风暴 ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 前缀缓存命中率: <tspan fill="#f87171" font-weight="700">仅 12.0% (乱序冲刷缓存)</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万文档总成本: <tspan fill="#f87171" font-weight="700">$26,400 / 1M 篇 (最贵 ✕)</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁跑批任务直接打向在线实时端点</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="236" height="24" rx="6" fill="#78350f"/>
  <text x="486" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 云托管异步 Batch API (5折)</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">官方 5 折 · 0% 冲击在线业务</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Azure Global Batch / Bedrock Batch (.jsonl)</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">免运维批处理首选：</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">上传 JSONL 文件至对象存储，走独立离线</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">配额池，天然享受 50% 官方半价折扣 ✅</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万文档总耗时: <tspan fill="#fbbf24" font-weight="700">6.5 小时 (24h SLA 窗口)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 对在线生产冲击: <tspan fill="#34d399" font-weight="700">0.0% (独立离线配额池 ✅)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 吞吐速率: <tspan fill="#fbbf24" font-weight="700">42.7 篇/秒</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万文档总成本: <tspan fill="#fbbf24" font-weight="700">$13,200 / 1M 篇 (-50.0% ✅)</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 闭源模型免运维离线跑批标准方案</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="236" height="24" rx="6" fill="#0c4a6e"/>
  <text x="786" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · Spot 抢占式 GPU + Ray Data</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">2.8 小时极速 · 成本省 83.9%</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">3折 Spot L40S/H100 + CPU/GPU 异构流水线</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (不怕 Spot 随时被回收)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Ray Data 拆解 CPU 版面解析与 GPU vLLM，</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">每分片落盘 Parquet Checkpoint 断点续传 ✅</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万文档总耗时: <tspan fill="#38bdf8" font-weight="800">2.8 小时 (提速 13.8x ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 对在线生产冲击: <tspan fill="#38bdf8" font-weight="800">0.0% (独立弹性 Spot 池 ✅)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 吞吐速率: <tspan fill="#38bdf8" font-weight="800">99.2 篇/秒 ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万文档总成本: <tspan fill="#38bdf8" font-weight="800">$4,250 / 1M 篇 (-83.9% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 大规模 PDF 解析 + 开源模型跑批主力</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 二维前缀分桶 + 夜间预留填谷</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">1.6 小时跑完 · 成本暴降 94.4%</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">按模板前缀+长度排序 (99.9%命中) + 闲时填谷</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">吞吐暴涨 24.1x 的两大秘籍：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">先按抽取规则前缀与文档长度排序再进队列，</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">免算 25 亿重复前缀 Token + 夜间白嫖基荷 🏆</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万文档总耗时: <tspan fill="#34d399" font-weight="800">1.6 小时 (快 24.06x 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 前缀缓存命中率: <tspan fill="#34d399" font-weight="800">99.9% (零重复预填充 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 吞吐速率: <tspan fill="#34d399" font-weight="800">173.6 篇/秒 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万文档总成本: <tspan fill="#34d399" font-weight="800">$1,480 / 1M 篇 (-94.4% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 企业海量文档 ETL 与知识建库终局</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：离线批处理跟在线实时服务有什么本质不同？（如何利用“可预知全集”多榨出 3 倍吞吐？）</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🗂️ 铁律 1：离线跑批拥有“上帝视角”，入队前必须做二维排序！</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 在线服务不知道下一个用户问什么；但离线跑批 100 万份文档全在盘里！</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 严禁乱序直接塞给 vLLM！先执行 `ORDER BY template_id, doc_length_bucket`：</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  第一维让相同抽取规则连续执行（Prefix Cache 99.9% 命中），第二维消除长短对齐空泡！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">💰 铁律 2：闲时填谷 + 抢占式 Spot 混合算力池（成本打到 0.5 折）</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 闭源大模型非紧急跑批：一律走 **Azure Global Batch / Bedrock Batch** 拿官方 5 折；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 开源大模型百万级跑批：夜间复用白天已付钱的预留 PTU/AKS 基荷（边际成本 $0）+ 超出</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  部分弹性拉起 3 折 Spot GPU（带分片 Parquet 断点续传），百万文档成本从 $2.6万 降至 $1,480 🏆！</text>
</svg>
