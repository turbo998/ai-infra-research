<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 69 · MULTIMODAL VLM HIGH-RES DYNAMIC ENCODING (NAVIT) &amp; VISUAL TOKEN COMPRESSION (PIXEL-SHUFFLE / FASTV)</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">多模态 VLM 高分辨率动态编码 (NaViT) 与视觉 Token 压缩剪枝选型一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 2560×1440 High-Res Document / UI Screenshot on 72B FP8 VLM (4×H100) · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="148" height="24" rx="6" fill="#7F1D1D"/>
  <text x="130" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 336px 缩略图</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">固定 336×336 挤压缩放</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">初代 LLaVA · 小字与图标糊成马赛克</text>
  <text x="56" y="272" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单图入模视觉词: 576 Tokens</text>
  <text x="56" y="298" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单图首字 TTFT: 95.0 ms (快但瞎)</text>
  <text x="56" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 细粒度 VQA 准确率: 44.5% ✕</text>
  <text x="56" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 4图会话 KV 显存: 1.15 GB</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 万次成本: $14.50 (精度不可用 ✕)</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⛔ 严禁用于文档 OCR、财报与 GUI</text>

  <!-- Tier 2 -->
  <rect x="346" y="148" width="288" height="310" rx="12" fill="#1F2437" stroke="#F97316" stroke-width="1.5"/>
  <rect x="362" y="164" width="156" height="24" rx="6" fill="#7C2D12"/>
  <text x="440" y="180" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 2 · 无压缩 AnyRes</text>
  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">4×4 网格切片硬塞 (16子图)</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">单图 9,216 词引爆 LLM O(N^2) 延迟</text>
  <text x="362" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单图入模视觉词: 9,216 Tokens ✕</text>
  <text x="362" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单图首字 TTFT: 1,680.0 ms ✕</text>
  <text x="362" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 细粒度 VQA 准确率: 89.2%</text>
  <text x="362" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 4图会话 KV 显存: 18.40 GB ✕</text>
  <text x="362" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 万次查询成本: $232.00 ✕</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 切图接缝割裂文字且显存/延迟爆炸</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="168" height="24" rx="6" fill="#1E3A8A"/>
  <text x="752" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · NaViT + 2×2 折叠</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">原生分辨率 + Pixel-Shuffle</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Qwen2.5-VL / InternVL-2.5 空间四合一</text>
  <text x="668" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单图入模视觉词: 2,304 Tok (-4x ✅)</text>
  <text x="668" y="298" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单图首字 TTFT: 430.0 ms ✅</text>
  <text x="668" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 细粒度 VQA 准确率: 90.4% (无接缝 🏆)</text>
  <text x="668" y="350" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 4图会话 KV 显存: 4.60 GB ✅</text>
  <text x="668" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 万次查询成本: $58.00 ✅</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 单图多轮任意角落追问标准基座</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
  <text x="1066" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · 两级压缩剪枝 (推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">NaViT 2×2 + 第2层注意力剪枝</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">FastV / VisionZip 剔除 70% 空白背景</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 有效视觉词: 720 Tok (压 12.8x 🏆)</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单图 TTFT: 195.0 ms (快 8.62x 🏆)</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 细粒度准确率: 90.1% (+45.6pt 🏆)</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 4图 KV 显存: 1.44 GB (省12.8x 🏆)</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 万次成本: $21.50 (省 -90.7% 🏆)</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 高并发文档/GUI/多帧视频唯一首选</text>

  <!-- Bottom Pipeline: 3 Core Mechanisms -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">👁️ Tier 4 黄金流水线拆解：如何把单张 2K 大图的 9,216 个视觉 Token 无损压到 720 个？</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="82" y="562" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 原生动态分辨率 (NaViT + 2D-RoPE)</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 废除 4×4 网格硬切图，保持 2560×1440 原图真实长宽比</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 为每个 14×14 Patch 注入二维旋转位置编码 (row, col)</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 彻底消除传统 AnyRes 切图接缝将跨块长数字一刀两断</text>
  <text x="82" y="668" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 细粒度图表/OCR 准确率从 44.5% 跃升至 90.4%</text>

  <!-- Step 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="468" y="562" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 第一级压缩：2×2 Pixel-Shuffle 空间四合一</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 利用通道容量守恒：将相邻 2×2 = 4 个 1280d 视觉块在通</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  道维度拼接为 5120d，再经 MLP 投影为 1 个 8192d LLM 词</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 在进入 72B 大模型前直接将序列长度砍掉 75% (9216-&gt;2304)</text>
  <text x="468" y="668" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 零信息丢失将 LLM Prefill 算力开销降低 4 倍</text>

  <!-- Step 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="864" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 第二级压缩：LLM 第 2 层跨模态注意力剪枝</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 前 2 层完成问题文本与 2,304 视觉词的跨模态探照灯对齐</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 在第 2 层出口直接剔除占 70% 的空白纸边与无关纯色背景</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 第 3~80 层 (占 97.5% 算力) 仅需计算与缓存 720 个精华词！</text>
  <text x="864" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 总压缩 12.8x，TTFT 压至 195ms，省 90.7% 成本</text>
</svg>
