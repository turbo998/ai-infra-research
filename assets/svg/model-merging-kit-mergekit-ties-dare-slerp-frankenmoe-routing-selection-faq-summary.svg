<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#C084FC" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级零训练算力模型融合 (Model Merging: MergeKit) 选型：SLERP vs. DARE-TIES vs. DELLA</text>
  <text x="52" y="94" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="15">花 $18 在 20 分钟内将 4 个部门全参微调 70B 模型合四为一：稀疏重缩放 (`DARE`) + 符号投票去冲突 (`TIES`)，省 75% 推理 GPU！</text>

  <!-- Left: Why Naive Averaging Fails & Why Multi-Pool Wastes GPUs -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么企业合并多个全参微调 Checkpoint 会遇到两难？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 困境 A：独立部署 4 套 70B 池 ($4.48万/月) vs. 重新混合数据训练 ($2.85万/次)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• SQL、法务、代码、推理 4 个团队各自全参微调了 1 个 70B Checkpoint（无法用 Multi-LoRA）</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 分别起 4 套高可用集群需 16 张 H200；而把四方私有数据混在一起重训既慢又涉数据合规！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 困境 B：简单线性平均 (`W = W_0 + 0.25·ΣΔW_i`, Tier 3) 精度暴跌 8.6 分</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• **幅值稀释 (Magnitude Dilution)**：A 模型学会的关键特征权重被其余 3 个模型的 0 增量除成了 1/4</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• **正负号抵消 (Sign Interference)**：模型 A 调大 `+0.04` 而模型 B 调小 `-0.03`，相加直接互相归零！</text>

  <!-- Right: DARE-TIES / DELLA / SLERP Mechanics -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. MergeKit 无冲突权重融合三板斧 (DARE + TIES + SLERP)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① `DARE / DELLA` 稀疏丢弃与无偏重缩放 (Drop 85% &amp; Rescale `1/(1-p)`)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">SFT 增量张量 $\Delta W = W_{ft} - W_{base}$ 中 85%+ 微小变化是冗余噪声！置零并除以 `(1-p)` 消除多模型碰撞</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② `TIES-Merging` 三步法：Trim (留 Top-k%) → Elect Sign (多数派符号) → Disjoint Merge</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">对每个权重位置投票选出主导正负号，仅对同号专家增量求均值，彻底根治正负相消与幅值稀释！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 双模型选球面插值 (`SLERP`) · 3~8 模型选 `DARE-TIES / DELLA`</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">无需训练数据与反向传播，单机 20 分钟 ($18) 合成全能模型，保留 99.4% 专精精度且省 75% 推理卡！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 4 个同源 70B 专精模型（SQL / 法务 / 代码 / 推理）合并方案精度与 TCO 对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">多模型整合架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">四领域综合得分</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单次合成算力费</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">在线服务 H200 卡数</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">是否需原始训练集</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度推理集群成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 4 套独立 70B 推理池并存 (不合并)</text>
  <text x="450" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">88.4% (上限基准)</text>
  <text x="620" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$0</text>
  <text x="790" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">16 GPUs ✕ (4倍冗余)</text>
  <text x="960" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">不需要</text>
  <text x="1120" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$44,800/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 汇总四方数据从头多任务重训练 (Joint Retraining)</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">86.5% (跷跷板效应)</text>
  <text x="620" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$28,500 / 次 ✕</text>
  <text x="790" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">4 GPUs</text>
  <text x="960" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">必须全量数据 ✕</text>
  <text x="1120" y="568" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$11,200/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 简单线性平均 (`Task Arithmetic`: `0.25·ΣΔW_i`)</text>
  <text x="450" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14"></text>
  <text x="450" y="612" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">79.8% ✕ (正负相消)</text>
  <text x="620" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">$12 / 次</text>
  <text x="790" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">4 GPUs</text>
  <text x="960" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">不需要</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$11,200/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): MergeKit `DARE-TIES / DELLA` 稀疏符号选举融合</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">87.9% (99.4%保留) ✓</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$18 (20分钟) ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">4 GPUs (-75%) ✓</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">零训练数据 ✓</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$11,200/mo (-75%)</text>
</svg>
