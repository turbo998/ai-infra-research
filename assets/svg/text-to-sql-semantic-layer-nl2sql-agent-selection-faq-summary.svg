<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 64 · ENTERPRISE DATA WAREHOUSE TEXT-TO-SQL (NL2SQL), LSH VALUE LINKING &amp; GOVERNED SEMANTIC LAYER</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">企业级数仓 Text-to-SQL、LSH 单元格值链接与受管语义层 (Cube/MetricFlow/Fabric IQ) 选型一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 800-Table Enterprise Warehouse (18,000 Columns, 95K Raw DDL Tokens) · 1,000 BI &amp; Ad-Hoc Queries · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="144" height="24" rx="6" fill="#7F1D1D"/>
  <text x="128" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 全量 800表硬塞</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">95K 词 DDL 硬塞直出 SQL</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">同名字段注意力迷失 + 乱连外键</text>
  <text x="56" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 执行准确率 (EX): 38.5% ✕</text>
  <text x="56" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 静默口径漂移率: 28.4% (假财报 ✕)</text>
  <text x="56" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单次消耗词数: 96,500 Tokens ✕</text>
  <text x="56" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 端到端响应延迟: 14.8 s ✕</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 千次问数成本: $289.50 ✕</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⛔ 严禁在百表数仓上直接硬塞全量 DDL</text>

  <!-- Tier 2 -->
  <rect x="346" y="148" width="288" height="310" rx="12" fill="#1F2437" stroke="#F97316" stroke-width="1.5"/>
  <rect x="362" y="164" width="156" height="24" rx="6" fill="#7C2D12"/>
  <text x="440" y="180" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 2 · 向量 Top-15 表</text>
  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">表级 DDL RAG + 少样本示例</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">看不见表内真实枚举码频繁查出 0 行</text>
  <text x="362" y="272" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 执行准确率 (EX): 58.2% ✕</text>
  <text x="362" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 静默口径漂移率: 16.5% ✕</text>
  <text x="362" y="324" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单次消耗词数: 12,400 Tokens</text>
  <text x="362" y="350" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 端到端响应延迟: 4.2 s</text>
  <text x="362" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 千次问数成本: $37.20</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 缺单元格值索引，WHERE 常返空集</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="168" height="24" rx="6" fill="#1E3A8A"/>
  <text x="752" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · LSH 值链接+自纠错</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">列裁剪 + LSH 值索引 + EXPLAIN</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">CHESS / DAIL 范式 · 解决枚举失配</text>
  <text x="668" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 执行准确率 (EX): 78.6% ✅</text>
  <text x="668" y="298" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 静默口径漂移率: 9.2% (裸表限制)</text>
  <text x="668" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单次消耗词数: 9,800 Tokens ✅</text>
  <text x="668" y="350" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 端到端响应延迟: 3.8 s ✅</text>
  <text x="668" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 千次问数成本: $29.40 ✅</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 无预设指标的数据科学自由探索首选</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
  <text x="1066" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · 受管语义层双轨 (推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">语义层 DSL + LSH 值链接路由</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Cube / MetricFlow / Fabric IQ 范式</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 执行准确率 (EX): 91.4% (+52.9pt 🏆)</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 静默口径漂移: 0.8% (降 35.5x 🏆)</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单次消耗词数: 5,400 Tok (省17.9x 🏆)</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 端到端响应延迟: 2.1 s (快 7.0x 🏆)</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 千次成本: $16.20 (省 -94.4% 🏆)</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 企业级生产 ChatBI 与高管报表黄金标准</text>

  <!-- Bottom Pipeline: 3 Core Pillars of Enterprise Text-to-SQL -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">📊 企业级智能问数 (ChatBI) 三大防翻车基石：为什么受管语义层 + LSH 值链接能将准确率从 38.5% 推至 91.4%？</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#0EA5E9" stroke-width="1.2"/>
  <text x="82" y="562" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① MinHash LSH 单元格值倒排链接 (防 0 行)</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 痛点：用户说“上海/已完成”，库里存 'SH_021' / '99'</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 机制：离线对枚举/实体列唯一值建 3-gram LSH + 向量索引，</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  生成 SQL 前先将真实枚举值锚点注入对应列注释</text>
  <text x="82" y="668" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 彻底消灭盲猜 WHERE 字符串导致的 0 行空结果</text>

  <!-- Step 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="468" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 声明式受管语义层 (Cube / MetricFlow / Fabric IQ)</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 痛点：让概率 LLM 现场手写财务公式会导致 28.4% 口径漂移</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 机制：将 NRR/毛利率公式与合法 JOIN 树固化在 YAML 契约，</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  LLM 仅输出极简指标名与维度 DSL，编译器确定性生成 SQL</text>
  <text x="468" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 财务口径漂移从 28.4% 压至 0.8%，自动继承 RLS</text>

  <!-- Step 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="864" y="562" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ SQLGlot AST 分区门禁 + EXPLAIN 自纠错</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 针对 35% 自由探索 SQL：先过 SQLGlot 语法树检查，强制要</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  求带分区键 (WHERE dt&gt;=...) 拦截万元级全表扫描炸弹</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 零成本 EXPLAIN 预检执行计划，自动修复列名与类型错误</text>
  <text x="864" y="668" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 执行准确率冲上 91.4%，单次成本直降 -94.4%</text>
</svg>
