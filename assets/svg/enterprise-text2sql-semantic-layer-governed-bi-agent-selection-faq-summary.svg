  <rect width="1200" height="630" fill="url(#bg482)"/>
  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ENTERPRISE TEXT-TO-SQL, SEMANTIC LAYER &amp; GOVERNED BI AGENT SELECTION (R482)</text>
  <text x="65" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Governed Semantic Layer (dbt / Cube / Fabric IQ) + Value Index + SQLGlot AST Gate: 97.4%</text>

  <rect x="40" y="138" width="545" height="445" rx="14" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="65" y="174" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ Why Raw Physical Text-to-SQL Fails in Prod (Tiers 1–3)</text>
  <text x="65" y="210" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 1 Dumping 650 Physical Table DDLs into Prompt:</text>
  <text x="80" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">44.5% KPI accuracy; invents conflicting `Net ARR` join formulas</text>
  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 2 Schema RAG + Few-Shot SQL on Physical Tables:</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Misses dirty string values (`'UK'` vs `'GBR'`) &amp; fiscal calendar rules</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Un-Gated Warehouse Execution (`50B-Row Full Scan`):</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">One missing partition filter burns $5,000 in Snowflake/BigQuery credits</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="430" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">650 Physical Tables · 50B Fact Rows · 1.8M Queries/Mo Pain:</text>
  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Raw Physical Text-to-SQL Accuracy: 44.5% – 81.8%</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Cross-Department KPI Definition Drift: 26% – 62%</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Monthly Warehouse Compute &amp; Rework TCO: $96K – $174K</text>

  <rect x="615" y="138" width="545" height="445" rx="14" fill="#0f292a" stroke="url(#accent482)" stroke-width="2"/>
  <text x="640" y="174" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">🏆 Tier 4: Semantic Layer + Value Index + SQLGlot Gate</text>
  <text x="640" y="210" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. Governed Semantic Metric Layer (`dbt / Cube / Fabric IQ`)</text>
  <text x="655" y="232" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">LLM queries certified metrics (`net_arr`), never raw 8-way SQL joins!</text>
  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. Categorical Cell-Value Entity Index (`LSH + Vector`)</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Maps user terms (`'UK'`, `'McDonalds'`) to exact DB literals (`'GBR'`)</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. `SQLGlot` AST Verifier + `EXPLAIN` Cost Gate + OBO RLS</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Enforces partition filters, blocks &gt;10GB scans &amp; runs under user OBO role</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (1.8M BI Queries / Month):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Business KPI Execution Accuracy: 97.4% (vs 44.5% raw DDL)</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Cross-Executive KPI Formula Consistency: 100.0%</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Runaway Full-Table Scan Risk: 0.0% | RLS Compliance: 100.0%</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly Warehouse &amp; BI Agent TCO: $33,000 / mo (-81.0%)</text>
