<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">第 470 篇里程碑：企业跨地域多活大模型灾备 (Multi-Region Active-Active DR) 与 99.995% 高可用蓝图 (#470)</text>
  <text x="28" y="58" class="sub">终结“灾备演练按传统微服务冷备扩容却遭遇 GPU 容量售罄 + 13 分钟拉镜像停摆”：60/60 双活底座 + PAYGO 溢出 + SSE 无感续传</text>

  <!-- Left Panel: Why Traditional Web DR Fails for GPU Clusters -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么传统 CPU 微服务的“主备冷拉起 (Cold Standby)”在 AI 时代彻底失灵？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 冷备灾备的两大致命死穴 (RTO = 780 秒 / 甚至因无卡直接失败 ✕)</text>
  <text x="56" y="164" class="mono">• 死穴 1 (容量饥荒): 主 Region 故障时，数百家企业同时涌向备 Region 抢</text>
  <text x="56" y="184" class="mono">  On-Demand H200/B200，立即触发 InsufficientInstanceCapacity 报错！</text>
  <text x="56" y="202" class="mono">• 死穴 2 (冷启巨慢): 685GB 权重拉取 + CUDA Graph 编译耗时长达 13 分钟！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师解法：双 Region 60/60 双活常驻 + 跨区 PAYGO 溢出 + SSE 续传 (🏆)</text>
  <text x="56" y="268" class="mono">• 普段两个 Region 各承载 50% 流量（各配 60% 峰值预留卡/PTU），零闲置浪费！</text>
  <text x="56" y="288" class="mono">• 任一 Region 宕机：幸存 Region 60% 底座承接核心 SLA 流量，超出部分自动</text>
  <text x="56" y="308" class="mono">  溢出至跨区 Serverless PAYGO，RTO 压至 1.6s，冗余溢价仅 +18.5%（非 100%）！</text>

  <!-- Right Panel: 4 DR Tiers Comparison -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种企业 AI 平台高可用与灾备架构定量对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 单 Region 裸奔部署 (无跨区容灾，年停机 52.5 小时)</text>
  <text x="638" y="158" class="mono">• 可用性: 99.40% ✕ | RTO: 3,600s | 流式中断率: 100% | 冗余溢价: +0%</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 主备冷拉起 (Active-Passive 故障时按需买卡 + 拉 685GB 权重)</text>
  <text x="638" y="214" class="mono">• 可用性: 99.82% ✕ | RTO: 780s ✕ | 流式中断率: 100% | 冗余溢价: +12%</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 传统 100%+100% 双倍闲置热备 (备区 GPU/PTU 全年空转待命)</text>
  <text x="638" y="270" class="mono">• 可用性: 99.98% ✓ | RTO: 8.5s | 流式中断率: 42% | 冗余溢价: +100% ✕</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 双区 60/60 双活 + 跨区 PAYGO 溢出 + SSE 断点续传 (推荐 🏆)</text>
  <text x="638" y="326" class="mono">• 可用性: 99.995% 🏆 | RTO: 1.6s 🏆 | 流式中断: 0% 🏆 | 溢价: 仅 +18.5%</text>

  <!-- Bottom Panel: Composite Availability Math & Token-Offset SSE Resume -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 跨区双活可用性手算公式与生成中途断流无感续传 (Token-Offset SSE Continuation)</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 跨区双活复合可用性手算公式</text>
  <text x="58" y="464" class="mono">• A_multi = 1 - (1 - A_reg1) * (1 - A_reg2)</text>
  <text x="58" y="484" class="mono">            - P_correlated_control_plane</text>
  <text x="58" y="506" class="txt">• 单区 AI 服务可用性 A_reg ≈ 99.4% (年停 52.5h)</text>
  <text x="58" y="526" class="txt">• 双区独立部署后理论故障率 (0.006)^2 = 0.0036%</text>
  <text x="58" y="546" class="txt">  计入网关探测切换后实测达 99.995% (年停仅 26m)！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: 为什么不能靠 TCP KeepAlive 切流？</text>
  <text x="436" y="464" class="mono">• 默认 HTTP 超时 (60s) 会让故障卡死整整 1 分钟！</text>
  <text x="436" y="484" class="mono">• AI Gateway 必须实施双阈值毫秒熔断：</text>
  <text x="436" y="504" class="mono">  1) 首包探测: TTFT &gt; 1,500ms 立即对备区发</text>
  <text x="436" y="524" class="mono">     对冲请求 (Hedged Request, P99 削峰 78%)</text>
  <text x="436" y="544" class="mono">  2) 连续 3 次 HTTP 429/503 立即摘除故障区 30s</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: 流式 SSE 吐到一半断连怎么无感续传？</text>
  <text x="814" y="464" class="mono">• 痛点: 已吐出 400 个 Token 时 Region A 突然断网</text>
  <text x="814" y="484" class="mono">• 网关状态化无感续传 (Stateless Prefix Replay):</text>
  <text x="814" y="504" class="mono">  网关缓存已下发的 partial_output (400 tokens)，</text>
  <text x="814" y="524" class="mono">  立即向 Region B 发送 [Original_Prompt +</text>
  <text x="814" y="544" class="mono">  Assistant_Prefix(400)] 并设 max_tokens=N-400，</text>
  <text x="814" y="564" class="mono">  从第 401 个 Token 无缝接续推流，前端零感知！</text>
</svg>
