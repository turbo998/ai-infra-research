<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 318 · VOICE AGENT STREAMING VAD, SEMANTIC EOU &amp; SPECULATIVE PREFILL</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">34.5% False Cut (300ms VAD) &amp; 1,380ms Lag (1.1s VAD) vs. Semantic EoU + Spec Prefill (235ms, 2.1%)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2: Fixed Acoustic VAD Dilemma</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (300 ms Fixed Acoustic VAD Silence Threshold):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Cuts off users mid-thought ("I want to book... um...")</text>
  <text x="85" y="298" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  -&gt; 34.5% mid-sentence false interruption rate!</text>
  <text x="85" y="335" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (1,100 ms Conservative Fixed Silence Threshold):</text>
  <text x="85" y="363" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Adds 1.1s of dead air before LLM starts -&gt; 1,380 ms lag!</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">300ms VAD False Interruption Rate: 34.5% ✕</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">1,100ms VAD Turn-Taking Latency: 1,380.0 ms (Unnatural Lag)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Semantic EoU + Speculative Pause Prefill</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• 135M Semantic End-of-Utterance (EoU) Classifier (8ms):</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Triggers at 150ms if syntactically complete; waits 1.2s if "um..."</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Speculative LLM Prefill on Pause (Prefix KV Commit):</text>
  <text x="640" y="333" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Runs LLM prefill during the 150ms silence window; if user</text>
  <text x="640" y="361" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  continues speaking, cached KV prefix is reused on next pause!</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Turn-Taking Latency: 235.0 ms (5.87x Faster vs 1.1s VAD)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">False Interruption Rate: 2.1% (16.4x Lower vs 300ms VAD)</text>
</svg>
