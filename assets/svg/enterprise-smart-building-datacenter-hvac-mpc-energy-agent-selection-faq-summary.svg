<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad425" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad425" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad425)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级智慧园区与数据中心暖通群控（BMS HVAC Copilot）、Brick 本体与 MPC 节能选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">45栋园区建筑/机房 · 35万个 BACnet 测点 · 传统固定时间表PID vs. 纯LLM直改冷机水温 vs. Brick只读故障诊断 vs. Brick自动对齐 + 热力学MPC寻优 + PLC硬件限幅</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">26.4% Save · 0% 喘振超温</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 传统 BMS 固定时间表 + 静态 PID</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">点位命名混乱人工对齐需4周，电费高昂</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 每栋楼 BACnet 缩写各异，单楼接入耗时 160h</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 不随湿球温度与峰谷电价动态寻优，空耗严重</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">HVAC 综合节电与削峰率: 4.5% ✕</text>
  <text x="54" y="334" fill="#fde68a" font-size="13" font-weight="700">ASHRAE 超温/冷机喘振率: 1.5%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">单楼 BACnet 点位梳理耗时: 160.0 小时 ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月超额电费与人工运维成本: $420,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统粗放物业管理，PUE 与电费居高不下</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 纯 Prompt 让 LLM 直写 BACnet</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">引发离心冷机剧烈喘振与机房红区超温</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 文本模型不懂冷机压头-流量喘振边界曲线</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 盲目调高出水温度导致 13.8% 超温/设备喘振事故</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">HVAC 综合节电与削峰率: 12.0%</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">ASHRAE 超温/冷机喘振率: 13.8% (危险 ✕)</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">单楼 BACnet 点位梳理耗时: 18.0 小时</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月电费与压缩机维修罚金: $510,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让自由对话LLM直接写PLC/BACnet设定值</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: Brick 本体对齐 + 只读故障诊断</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">加速了点位接入，但缺闭环群控寻优</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 能发现阀门内漏/传感器漂移并生成物业工单</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 未打通冷机-冷却塔-水泵全局 COP 联调与蓄冷</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">HVAC 综合节电与削峰率: 11.8%</text>
  <text x="638" y="334" fill="#6ee7b7" font-size="13" font-weight="700">ASHRAE 超温/冷机喘振率: 0.8%</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">单楼 BACnet 点位梳理耗时: 12.0 小时</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月超额电费与运维总成本: $215,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：物业设施故障报修(FDD)，节电潜力未充分释放</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad425)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: Brick自动映射+MPC+PLC限幅 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">4.5h 自动对齐点位 + 热力学MPC + 硬件保护</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• LLM 将杂乱 BACnet 点名自动映射至 Brick RDF 图谱</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 灰盒热力学 MPC 谷电预冷 + 本地 PLC 防喘振安全钳位</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">HVAC 综合节电与削峰率: 26.4% 🏆 (+21.9pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">ASHRAE 超温/冷机喘振率: 0.0% 🏆 (PLC限幅)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">单楼点位梳理耗时: 4.5 小时 🏆 (-97.2%)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月剩余损耗与运维总成本: $64,000 (-84.8% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：数据中心冷站(PUE优化)、洁净厂房、商业综合体</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 智慧园区与数据中心暖通群控架构师铁律（Brick Ontology Mapper + Physics MPC + PLC Safety Clamp）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 用大模型解决“跨品牌楼宇自控（BACnet/Modbus）点位名称向 Brick Schema / Project Haystack 标准本体的零样本映射”与 FDD 故障解释。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 冷机/冷却塔/水泵设定值寻优必须交由带防喘振曲线约束的热力学模型预测控制（MPC）求解，并在边缘 PLC 硬编码 ASHRAE 温度与最小流量钳位 · Provenance: synthetic + anonymized_reported</text>
</svg>
