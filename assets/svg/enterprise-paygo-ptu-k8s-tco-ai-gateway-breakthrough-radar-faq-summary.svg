  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#627 企业 AI 平台成本拐点 (PAYGO vs. PTU vs. 自建 K8s)、五大 AI Gateway 与最新突破雷达</text>
