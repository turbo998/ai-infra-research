<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad420" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad420" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad420)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级跨境贸易海关关务合规（10位 HS 编码归类）、原产地核算与出口管制 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">月均 9.5万票报关单 / 32万个SKU · 人工查税则书 vs. 纯LLM背诵10位HS码 vs. 扁平向量查税表 vs. WCO归类总规则(类注/章注树) + BOM原产地精算 + OFAC穿透图谱</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">96.6% HS · 0% 制裁漏检</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 人工报关员查税则 + Excel 算原产地</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">单票制单耗时65分钟，漏查50%穿透股权</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 40国海关 8-10位本国子目每年调整，人工难同步</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 难以穿透核查交易对手母公司 OFAC 50% 股权制裁</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fde68a" font-size="13" font-weight="700">10位 HS 编码归类准确率: 89.0%</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">出口管制/制裁名单漏检率: 1.6% ✕</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">单票通关制单准备耗时: 65.0 分钟 ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月报关服务与补税罚金: $275,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：低频单一品类进出口，海量SKU清关严重滞后</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 纯 Prompt 让 LLM 直接默写 HS 码</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">凭记忆瞎编后4位国家税号，无视章注排他</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 前6位WCO通用但后4位各国不同，LLM频繁捏造</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 漏掉第84/85章排他类注，制裁漏检高达 12.4%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">10位 HS 编码归类准确率: 62.5% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">出口管制/制裁名单漏检率: 12.4% (扣货 ✕)</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">单票通关制单准备耗时: 2.2 分钟</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月报关与海关稽查罚金: $410,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让LLM凭参数记忆自由生成10位海关编码</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 扁平向量查税表 + 关键词查黑名单</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">字面匹配叶子税号，漏看章首排他注释</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 扁平检索直接跳到子目，违背 WCO GRI 自顶向下</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 精确关键词漏掉阿语/俄语音译别名与控股子公司</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">10位 HS 编码归类准确率: 76.8%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">出口管制/制裁名单漏检率: 4.5% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">单票通关制单准备耗时: 14.0 分钟</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月报关与合规罚金成本: $132,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：普通日用品初筛，机电/化工复杂归类易出错</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad420)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: GRI章注树+BOM原产地+OFAC图谱 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">类注/章注分层裁剪 + RVC精算 + 股权穿透</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 严格按章->目->10位子目校验类注排他条款与裁定</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• BOM RVC 确定性核算 + OFAC 50% 股权图谱零漏检</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">10位 HS 编码归类准确率: 96.6% 🏆 (+34.1pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">出口管制/制裁漏检率: 0.0% 🏆 (股权图谱)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">单票通关制单准备耗时: 1.8 分钟 🏆 (-97.2%)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月关务运营总成本: $39,000 (-85.8% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：跨国制造进出口、跨境电商平台、国际货代</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 跨境关务与出口管制架构师铁律（WCO GRI Hierarchical Tree + BOM RVC Engine + OFAC 50% Graph）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 海关归类必须遵循 WCO《归类总规则》(GRI 1-6) 自顶向下遍历：先校验类注/章注排他条款，再锁定 4位品目 -> 6位国际子目 -> 10位目的国有效税号并绑定海关预裁定(CROSS)。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 自贸协定(RCEP/USMCA)区域价值含量(RVC)必须由 ERP BOM 代码精算；制裁筛查必须结合音译模糊匹配与 50% 受益所有人股权图谱 · Provenance: synthetic + anonymized_reported</text>
</svg>
