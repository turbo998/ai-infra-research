<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg364" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc364" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg364)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="445" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="274" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 364 · CLOUD GPU INSTANCE SIZER (A10G vs. L40S vs. A100 vs. H200)</text>
  <text x="512" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="23.5" font-weight="800">主流云端 GPU 推理机型选型与并发定容指南：A10G/L4 vs. L40S (Ada FP8) vs. A100 vs. H100/H200</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">8B / 32B / 70B 三档模型与 8K 上下文并发 SLA 算账：为什么双卡 A100 跑 70B 只剩 16GB KV 显存 ($2.45/1M)，而单卡 H200 撑起 84 并发且成本直降 76.3% ($0.58/1M)？</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc364)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="68" y="184" width="236" height="24" rx="6" fill="#78350f"/>
  <text x="186" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 入门级 A10G / L4 (24GB PCIe)</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">8B/Embedding 轻量底座</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">AWS g5 / g6 · 24GB GDDR6 (300~600 GB/s)</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="80" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">适用边界与硬伤：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">单卡仅 $1.05/h，适合跑 8B 或 Reranker；</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">但 24GB 装不下 32B/70B，跨 PCIe TP 极慢</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 显存容量 / 带宽: <tspan fill="#fbbf24" font-weight="700">24 GB / 600 GB/s</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 达标并发会话数: <tspan fill="#fbbf24" font-weight="700">12 并发 (8B/INT4 场景)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TTFT / TPOT: <tspan fill="#f87171" font-weight="700">920 ms / 34.5 ms ⚠️</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#fbbf24" font-weight="700">$1.68 / 1M tok</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="190" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 仅限 ≤8B 小模型与向量重排</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="368" y="184" width="236" height="24" rx="6" fill="#7f1d1d"/>
  <text x="486" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 双卡 2×A100 80GB (BF16 陷阱)</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">无原生 FP8 · 仅剩 16GB KV 池</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Azure NC_A100_v4 / AWS p4de · $6.40/h</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="380" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么 A100 跑 70B 最亏钱？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">不支持硬件 FP8，70B BF16 权重吃掉 140GB，</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">160GB 双卡只剩 16GB 给 KV Cache ✕</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 可用 KV 显存池: <tspan fill="#f87171" font-weight="700">仅剩 16.0 GB (87.5% 被权重占满 ✕)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 70B 8K 达标并发: <tspan fill="#f87171" font-weight="700">仅 18 并发会话 ✕</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TTFT / TPOT: <tspan fill="#f87171" font-weight="700">740 ms / 22.4 ms ✕</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#f87171" font-weight="700">$2.45 / 1M tok (最贵 ✕)</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="490" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁新租双卡 A100 跑 70B BF16</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="236" height="24" rx="6" fill="#0c4a6e"/>
  <text x="786" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · L40S 48GB PCIe (Ada 原生 FP8)</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">8B / 32B FP8 性价比之王</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">AWS g6e · 48GB GDDR6 (864 GB/s · $1.85/h)</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (单价降 69.8%)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">支持原生 Ada FP8！单卡装下 32B FP8，</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">双卡可跑 70B FP8/AWQ，租金仅 A100 一半</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 可用 KV 显存池: <tspan fill="#38bdf8" font-weight="800">22.0 GB (开启 FP8 权重+KV ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 8K 达标并发数: <tspan fill="#38bdf8" font-weight="800">42 并发会话 ✅</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TTFT / TPOT: <tspan fill="#38bdf8" font-weight="800">460 ms / 15.2 ms ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#38bdf8" font-weight="800">$0.74 / 1M (-69.8% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 8B / 32B 代码与 Agent 主力首选</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 单卡 H200 141GB (4.8 TB/s HBM3e)</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">1 张卡吃下 70B + 84 路并发</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">ND_H200_v5 / p5e · 零跨卡 AllReduce 损耗</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">70B 生产终局 (并发 4.67x · 省 76.3%)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">141GB 单卡装完 70GB FP8 权重还剩 66GB</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">存 KV，且 4.8TB/s 带宽让 TPOT 仅 12.8ms 🏆</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 可用 KV 显存池: <tspan fill="#34d399" font-weight="800">66.0 GB (是双卡 A100 的 4.1x 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 70B 8K 达标并发: <tspan fill="#34d399" font-weight="800">84 并发会话 (4.67x 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TTFT / TPOT: <tspan fill="#34d399" font-weight="800">340 ms / 12.8 ms 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#34d399" font-weight="800">$0.58 / 1M (-76.3% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 70B+ 与长上下文推理绝对霸主</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师定容铁律：如何用“显存容量定并发、显存带宽定延迟（TPOT）”两条公式算准买几张什么卡？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🧮 公式 1：KV Cache 剩余显存决定最大并发数 (为什么 A100 跑 70B 极蠢)</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• `Max_Concurrency = (Total_VRAM * 0.90 - Weight_GB) / (Context_Len * KV_per_Tok)`；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 2×A100 (160GB) 跑 70B BF16：权重占 140GB，只剩 16GB 给 KV，仅能塞下 18 个 8K 会话 ✕；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 1×H200 (141GB) 跑 70B FP8：权重仅 70GB，剩 66GB 给 FP8 KV，单卡塞下 84 个 8K 会话 🏆！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 公式 2：模型尺寸与云端 GPU 车型黄金匹配表（闭眼抄作业）</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• **7B / 8B 模型 &amp; Embedding/Reranker**：选 **1×L40S 48GB**（高并发）或 **1×L4/A10G 24GB**（低并发）；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• **32B 模型 (Qwen-2.5-32B / DeepSeek-Distill-32B)**：强烈首选 **1×L40S 48GB (原生 FP8)**；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• **70B / 72B 及长上下文 (32K~128K)**：首选 **1×H200 141GB (TP=1)** 或 **2×H100 80GB (NVLink TP=2)**！</text>
</svg>
