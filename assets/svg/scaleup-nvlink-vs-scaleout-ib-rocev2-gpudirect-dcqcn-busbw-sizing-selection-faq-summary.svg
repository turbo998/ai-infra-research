<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #398 · SCALE-UP (NVLINK) VS. SCALE-OUT (IB / ROCEV2), GPUDIRECT RDMA, DCQCN &amp; BUSBW MATH</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">智算网络全链路精解：NVLink vs. IB/RoCEv2、GPUDirect RDMA 与 DCQCN/busbw 手算指南</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">从 PCIe ACS 降速 70% 排雷、GPUDirect 零拷贝路径、PFC/ECN 水线手算到 NCCL algbw/busbw 转产门禁</text>

  <!-- Left Box: Scale-Up vs Scale-Out & GPUDirect RDMA Path -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. Scale-Up vs. Scale-Out 物理级差与 GPUDirect 零拷贝路径</text>
  <rect x="76" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12.5" font-weight="700">Scale-Up (NVLink 4/5): 900~1800 GB/s/GPU · 0.6us -&gt; 承载 TP=8</text>
  <text x="90" y="242" fill="#93c5fd" font-family="Consolas, monospace" font-size="12.5" font-weight="700">Scale-Out (400G/800G): 50~100 GB/s/NIC  · 2.0us -&gt; 承载 DP/PP/EP</text>
  <text x="90" y="260" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">头号地雷: BIOS 未关 PCIe ACS 导致同 Switch P2P 绕行 CPU (跌至 13.8GB/s!)</text>
  <text x="76" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 传统 TCP 主机内存弹跳：4 次拷贝，带宽仅 3.2 GB/s、延迟 85 us</text>
  <text x="76" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• GPUDirect RDMA (dmabuf/peermem)：网卡经 PCIe Switch 直写 HBM BAR1</text>
  <text x="76" y="346" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测 400G 单轨线速利用率达 95.2% (47.6 GB/s busbw, 1.8 us) 🏆</text>

  <!-- Right Box: ECN + PFC + DCQCN & algbw/busbw Math -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. RoCEv2 无损水线手算 (ECN &lt; PFC) 与 NCCL busbw 换算公式</text>
  <rect x="634" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#fbbf24" font-family="Consolas, monospace" font-size="12.5" font-weight="700">水线铁律: ECN K_min (150KB) &lt; K_max (1.2MB) &lt;&lt; PFC XOFF (2.8MB)</text>
  <text x="648" y="242" fill="#93c5fd" font-family="Consolas, monospace" font-size="12.5" font-weight="700">All-Reduce: busbw = algbw * 2*(N-1)/N  (N=512 时接近 2 * algbw)</text>
  <text x="648" y="260" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12.5" font-weight="700">All-to-All: busbw = algbw * (N-1)/N    (Day-0 门禁: &gt;= 45.0 GB/s)</text>
  <text x="634" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 为什么 ECN 必须早于 PFC？让发送端网卡提前平滑降速，99% 时间零 PFC 暂停</text>
  <text x="634" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• Rail-Optimized + PXN：85% 跨机流量在同号轨道 ToR 交换机一跳闭环</text>
  <text x="634" y="346" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• Spectrum-X / UEC：逐包喷洒 + 网卡乱序重排，将多租户 busbw 推至 96.4%！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档智算中心跨机网络路径与拥塞控制方案实测指标对比 (512-GPU 400G 集群)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">网络架构与数据路径档位</text>
  <text x="430" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">单轨有效 busbw</text>
  <text x="590" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">线速利用率</text>
  <text x="735" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">P99 All2All 尾延迟</text>
  <text x="920" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">集群有效训练/推理 Goodput</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 无 GPUDirect / 未关 PCIe ACS (绕行 CPU Root Complex)</text>
  <text x="430" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">13.8 GB/s ✕</text>
  <text x="590" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">27.6% ✕</text>
  <text x="735" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">42.5 ms ✕</text>
  <text x="920" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">41.2% ✕ (严重卡通信)</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: GPUDirect RDMA + 静态五元组 ECMP + 纯 PFC (易碰撞死锁)</text>
  <text x="430" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">31.5 GB/s</text>
  <text x="590" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">63.0%</text>
  <text x="735" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">18.4 ms</text>
  <text x="920" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">72.5%</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: Rail-Optimized RoCEv2 + GPUDirect + DCQCN + DLB + Watchdog</text>
  <text x="430" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">46.2 GB/s ✓</text>
  <text x="590" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">92.4% ✓</text>
  <text x="735" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">3.6 ms ✓</text>
  <text x="920" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">94.8% ✓ (高性价比主力)</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): 机内 NVLink + 跨机 IB NDR (AR/SHARP) 或 Spectrum-X/UEC 喷洒</text>
  <text x="430" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">48.2 GB/s 🏆</text>
  <text x="590" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">96.4% 🏆</text>
  <text x="735" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1.9 ms 🏆</text>
  <text x="920" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">97.6% 🏆 (零拥塞满速底座)</text>
</svg>
