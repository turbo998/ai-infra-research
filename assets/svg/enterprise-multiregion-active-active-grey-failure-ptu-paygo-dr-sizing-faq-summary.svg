<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#572 企业跨区域双活大模型容灾：灰故障 (HTTP 200 慢响应) 秒级熔断与 PTU+PAYGO 智能路由</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">破解主备 100/0 切换“冷缓存雪崩”与 100% 闲置税 · 55%+55% 粘性双活 + 800ms 首包熔断 + SSE 偏移续传 · RTO 0.82s · 省 44.2% TCO</text>

  <!-- Box 1: Why Active-Passive Fails for LLMs -->
  <rect x="24" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="42" y="138" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 为什么传统 100/0 主备容灾在大模型失效？</text>
  <rect x="42" y="152" width="310" height="100" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 痛点 1：切换瞬间的“冷 Prefix KV 雪崩”</text>
  <text x="52" y="191" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 备区平时无流量，HBM 内 Prefix KV 命中率 = 0%</text>
  <text x="52" y="209" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 主区故障切流瞬间，100% 流量触发全量 Prefill 重算</text>
  <text x="52" y="227" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">• 备区 TTFT 从 320ms 飙至 4,200ms 引发连环雪崩!</text>

  <rect x="42" y="260" width="310" height="108" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="52" y="280" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 痛点 2：HTTP 200 灰故障与 100% 闲置税</text>
  <text x="52" y="299" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 大模型拥塞常返回 HTTP 200 但首包卡死 8~15s</text>
  <text x="52" y="317" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 传统 L7 状态码探针完全失明 (RTO 高达 45s)</text>
  <text x="52" y="335" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 且备区 100% 对等预留 PTU/GPU 全年空转烧钱!</text>

  <!-- Box 2: 55/55 Active-Active + Grey-Failure Breaker -->
  <rect x="386" y="110" width="354" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="404" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 55%/55% 粘性双活 + 800ms 首包熔断 🏆</text>
  <rect x="404" y="152" width="318" height="100" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="416" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">1. 双区域各配 55% 基荷 (PTU/AKS) + 粘性分流</text>
  <text x="416" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 正常态两区各承接 50% 流量，双区 KV 缓存永远温热</text>
  <text x="416" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 容灾冗余溢价从 +100% 骤降至仅 +10%!</text>
  <text x="416" y="227" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 单区故障时：存量區承接 55% + 45% 溢出 PAYGO</text>

  <rect x="404" y="260" width="318" height="108" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="416" y="280" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">2. 800ms 首字 SLA 熔断 + SSE 偏移无感续传</text>
  <text x="416" y="299" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 网关实时监控滑动 10s 内 P95 TTFT &gt; 800ms 或</text>
  <text x="416" y="317" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">  TPOT &gt; 35ms 即刻判定灰故障，0.82s 投机双发切流</text>
  <text x="416" y="335" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 中途断流时携带已生成 Token 前缀向备区无感续写!</text>

  <!-- Box 3: Quantitative Comparison -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 三种容灾架构实测指标对标</text>
  <rect x="774" y="152" width="264" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="176" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 A (单区裸奔 / 被动 DNS 切流):</text>
  <text x="786" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 故障切换 RTO: 45.0 s · 可用性 99.5%</text>
  <text x="786" y="212" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 切流瞬间 TTFT 暴涨至 4,200 ms ✕</text>

  <text x="786" y="242" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 B (100%+100% 主备冷待机):</text>
  <text x="786" y="260" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 备区 100% 算力全年空转 ($2.40M/年)</text>
  <text x="786" y="278" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 无法识别 HTTP 200 慢响应灰故障 ✕</text>

  <text x="786" y="308" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 C (55/55 双活 + PAYGO 溢出) 🏆</text>
  <text x="786" y="326" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• RTO: 0.82 s (快 54.9x) · 99.995% HA</text>
  <text x="786" y="344" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 年总成本 $1.34M (比主备净省 44.2%!)</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 金融/核心生产级大模型跨区高可用（99.995% SLA）设计三原则：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. 容量原则：切忌买 100%+100% 双份 PTU；采用 East/West 各 55% PTU/AKS + DataZone/Global PAYGO 弹性溢出池。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">2. 探针原则：以首字延迟 (TTFT &gt; 800ms) 与吐字间隔 (ITL &gt; 35ms) 替代传统 HTTP 5xx 状态码作为熔断触发器。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">3. 续传原则：网关维护流式已发送 Token 缓冲，当主区 SSE 流中途异常断开时，自动将已生成文本拼入 Assistant Prefix 向备区无感续写！</text>
</svg>
