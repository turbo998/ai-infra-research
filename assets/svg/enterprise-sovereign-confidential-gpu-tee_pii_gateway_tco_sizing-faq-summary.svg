<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#578 企业主权 AI 与隐私推理架构：云端机密计算 GPU (H200 TEE) vs. 本地孤岛集群 vs. 可逆 PII 假名化网关</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">破解本地孤岛集群 28% 低利用率与 [REDACTED] 破坏逻辑推理难题 · H200 HCC 机密计算仅 5.8% 损耗 · 可逆令牌 [PER_01] 省 76.8% TCO</text>

  <!-- Box 1: Three Privacy Architectures -->
  <rect x="24" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="42" y="138" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 传统隐私合规方案的两大死胡同</text>
  <rect x="42" y="152" width="310" height="98" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 死胡同 1：一刀切自建断网小集群 (Air-Gapped)</text>
  <text x="52" y="191" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 分支机构各买 4~8 张 GPU，日均利用率仅 28.0%</text>
  <text x="52" y="209" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 缺乏驻场 SRE 与备件，3年 TCO 高达 $1.85M</text>
  <text x="52" y="227" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">• 单百万 Token 成本倒挂至 $0.380/1M!</text>

  <rect x="42" y="258" width="310" height="110" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="52" y="278" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 死胡同 2：粗暴替换 [REDACTED] 抹除实体</text>
  <text x="52" y="297" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 将合同中甲乙方姓名、账号全替换成同一个 [MASK]</text>
  <text x="52" y="315" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 大模型无法分辨谁向谁转账，逻辑准确率跌至 52.0%!</text>
  <text x="52" y="333" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 下游 Tool Call 拿不到真实参数无法执行!</text>

  <!-- Box 2: Two Winning Patterns -->
  <rect x="386" y="110" width="354" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="404" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 双轨隐私架构：可逆令牌网关 + 硬件 GPU TEE 🏆</text>
  <rect x="404" y="152" width="318" height="98" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="416" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">轨道 A (PII 脱敏上云)：GLiNER + 可逆假名化金库</text>
  <text x="416" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 边界网关 4.5ms ONNX 识别 PII → 映射为 [PER_01]</text>
  <text x="416" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 保留实体指代关系 (准确率 94.8%)，SSE 流式实时还原</text>
  <text x="416" y="227" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 零本地 GPU，复用云端 PTU/PAYGO 省 76.8% TCO!</text>

  <rect x="404" y="258" width="318" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="416" y="278" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">轨道 B (高密级原文/微调)：云端 H200 HCC 机密计算</text>
  <text x="416" y="297" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Intel TDX / AMD SEV-SNP + NVIDIA H200 硬件内存加密</text>
  <text x="416" y="315" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• NRAS 远程证明通过后，客户 HSM 才释放模型与数据密钥</text>
  <text x="416" y="333" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• Batch&gt;=16 时 PCIe Bounce 损耗仅 5.8% (Decode 3.2%)</text>
  <text x="416" y="351" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 云端弹性租用比自建断网孤岛省 64.2% 3年 TCO!</text>

  <!-- Box 3: Comparison -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 三种合规方案定量对标</text>
  <rect x="774" y="152" width="264" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="176" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 A (自建断网孤岛 · 利用率 28%):</text>
  <text x="786" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 3年 TCO: $1.85M · $0.380/1M</text>
  <text x="786" y="212" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 扩容周期: 4~8 周</text>

  <text x="786" y="242" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 B (不可逆 [REDACTED] 掩码):</text>
  <text x="786" y="260" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 多实体推理准确率: 52.0% (不可用 ✕)</text>
  <text x="786" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 破坏工具调用参数</text>

  <text x="786" y="308" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 C (可逆假名化 + H200 TEE) 🏆</text>
  <text x="786" y="326" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 逻辑准确率 96.4% · 吞吐损耗 &lt;5.8%</text>
  <text x="786" y="344" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 3年 TCO $0.58M (净省 68.6%!)</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 金融/医疗/跨国企隐私合规 AI 架构分级选型准则：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• L1 常规含 PII 客服/办公 (占 75% 流量)：走内网边界 [4.5ms GLiNER ONNX + Redis 可逆假名化金库] + 公有云 PTU。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• L2 高敏病历/财报全文分析 (占 25% 流量)：走公有云 [Intel TDX + NVIDIA H200 HCC 机密计算 VM + 客户自管 HSM SKR]。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• L3 涉密军工物理隔绝网：采用 Zarf 断网离线交付包 + 2x RTX PRO 6000 (96GB) / 4x H200 NVL 风冷一体机。</text>
</svg>
