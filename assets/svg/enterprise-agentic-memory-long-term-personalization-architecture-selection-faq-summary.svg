<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad394" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad394" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad394)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级智能体长效记忆 (Agentic Memory) 与跨会话个性化架构选型指南：滑动窗口 vs. 向量库 vs. 双时态图谱</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：三层认知记忆 (工作缓冲 + Mem0/Zep 双时态冲突消解事实图谱 + 情景经验)，将跨月事实准确率提至 96.8% 且冲突率压至 0.6%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 394 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 原始聊天滑动窗口硬塞</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 每次塞最近 50,000 Token 原始聊天记录</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 超过窗口直接失忆，且满屏闲聊废话</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 跨月时序事实准确率：54.0% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• P95 首字延迟：1,650 ms ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 过期事实矛盾率：18.2% ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">500万轮月成本：$42,000 / 月 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：客户第 1 周交代的忌口或架构红线，</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">到了第 3 周滑出窗口后 AI 忘得一干二净！</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 递归滚动全文摘要</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 每 10 轮把旧摘要+新对话压成 500 字</text>
  <text x="332" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 连续压缩 20 次后细节数字被磨平丢失 ✕</text>
  <text x="332" y="212" fill="#fde68a" font-size="12" font-weight="700">• 跨月时序事实准确率：61.5% ✕</text>
  <text x="332" y="232" fill="#34d399" font-size="12" font-weight="700">• P95 首字延迟：340 ms</text>
  <text x="332" y="252" fill="#fde68a" font-size="12">• 过期事实矛盾率：14.0%</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">500万轮月成本：$6,200 (有损退化)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">痛点：就像复印件再复印 20 次，精确的</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">服务器 IP、预算金额和项目代号全部模糊丢失</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 朴素只追加向量记忆库</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 把历史每句对话直接 Embed 存进向量库</text>
  <text x="624" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 1月说用MySQL、5月说换Snowflake同时召回</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 跨月时序事实准确率：74.5%</text>
  <text x="624" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 过期事实矛盾率：高达 26.5% ✕</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• P95 首字延迟：390 ms</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">500万轮月成本：$8,400 (精神分裂)✕</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">大坑：向量库只有“添加”没有“状态覆写”</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">客户改过三次需求后，AI 把旧需求和新需求混着答</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 三层认知+双时态图谱 🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• Mem0 / Zep / Graphiti 冲突消解状态机</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 跨月时序事实准确率：96.8% 🏆 (+22.3pts)</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 过期事实矛盾率：仅 0.6% 🏆 (降 44x)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• P95 首字延迟：310 ms 🏆 (后台异步提取)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 支持 GDPR 单条事实 ID 精确遗忘与审计</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">500万轮月成本：$7,400 (省 82.4%)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级长期专属 Copilot / 财富顾问终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">自动将过时旧事实标记 invalidated_at 归档</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么“Agent 记忆 != 知识库 RAG”？企业级三层认知记忆（Cognitive Memory）架构设计铁律</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad394)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 三层记忆正交分工（Working + Semantic + Episodic）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• **工作记忆 (Working)**：Redis 保存当前会话最近 6~8 轮完整原文；</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• **语义事实记忆 (Semantic)**：图谱/KV 存储用户当前画像与硬约束；</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">• **情景程序记忆 (Episodic)**：存储该用户历史点赞过的成功任务轨迹</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">  作为动态 Few-Shot 范例，让 Agent 记住“老板喜欢什么汇报格式”！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 双时态冲突消解（Bi-Temporal ADD/UPDATE/INVALIDATE）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 当用户说“我从上海搬到深圳了”：异步记忆提取器检索已有实体边，</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  触发状态机动作 `UPDATE/INVALIDATE`：</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  将 `(User, lives_in, 上海)` 的 `valid_to` 设为今天，并插入</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  `(User, lives_in, 深圳, valid_from=今天)`，矛盾率从 26.5% 降至 0.6%！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 读写分离：读取走热缓存(&lt;15ms)，写入走后台异步队列</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 严禁在用户等待回复的主线程同步调用 LLM 抽取记忆！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 主链路只用 `15ms` 读取已整理好的紧凑用户事实卡（`&lt;1,200 Tokens`）；</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• 本轮对话结束后，通过消息队列由后台轻量 8B 模型异步提取新事实</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  并执行冲突消解合并，对在线首字延迟 TTFT 实现 **0ms 零惩罚**！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 394 合成标定算例 (independently_reproduced=false)</text>
</svg>
