<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">#502 企业浏览器与 GUI Computer-Use 智能体架构：剪枝 AXTree + SoM 视觉回退算卡指南</text>
  <text x="30" y="60" class="sub">解决纯 1080p 全屏截图循环“48.5 秒龟速 + 坐标偏移点歪 (71.2% 成功率) + 需 64 张 H200”的三重瓶颈</text>

  <!-- Left: Hybrid AXTree + SoM Architecture -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. 为什么每步截全屏喂 72B VLM 既慢又容易点歪？双模态协同机制</text>
  <text x="48" y="134" class="txt">• 85% 标准网页步骤走“剪枝无障碍树 (Pruned Accessibility Tree / AXTree)”:</text>
  <text x="64" y="154" class="txt">只提取可交互控件 [id=14] &lt;button&gt; "提交审批" (仅 420 文本词/步，0 视觉词！)</text>
  <text x="64" y="174" class="txt">通过 CDP 确定性绑定 DOM 节点 ID 点击，100% 免疫弹窗位移与滚动条坐标漂移！</text>
  <text x="48" y="200" class="txt good">• 15% Canvas 报表/老旧控件自动回退“Set-of-Marks (SoM) 数字标框 + 7B UI-VLM”:</text>
  <text x="64" y="222" class="txt good">用 OmniParser 在截图上画好数字编号框，7B 模型只需输出框号 [23] 而非猜 (x,y) 像素！</text>
  <text x="64" y="246" class="txt good">• 浏览器资源池: 预热 CDP Context + 拦截广告/视频流，单实例内存从 1.8GB 压至 280MB 🏆</text>

  <!-- Right: 4-Tier Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 四种 Browser-Use 架构实测对比 (500 并发会话 · 15 步 ERP 流程)</text>
  <text x="578" y="134" class="txt bad">• Tier 1 每步 1080p 截图 + 72B VLM: 耗时 48.5s，成功率 71.2%，需 64 张 H200 ✕</text>
  <text x="578" y="158" class="txt warn">• Tier 2 每步直塞 32K 原始 HTML 源码: 耗时 34.0s，成功率仅 64.5%，需 48 张卡 ✕</text>
  <text x="578" y="182" class="txt">• Tier 3 全程 SoM 标框截图 + 7B UI-VLM: 耗时 14.2s，成功率 88.4%，需 16 张卡</text>
  <text x="578" y="208" class="txt good">• Tier 4 剪枝 AXTree (85%) + SoM 7B 回退 (15%) + CDP 热池 🏆:</text>
  <text x="594" y="232" class="txt good">- 15步流程一次完成率: 95.6% (+24.4 pts 🏆) | 端到端总耗时: 7.8s (提速 6.22x 🏆)</text>
  <text x="594" y="256" class="txt good">- 单流程仅 7,400 词 (-80.8%) | 仅需 6 张 H200 (-90.6%，千次成本 $8.20 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 支撑 500 并发浏览器智能体所需 H200 卡数与 15 步流程完成率对比</text>

  <text x="48" y="365" class="txt">Tier 1 纯 1080p 截图 + 72B VLM</text>
  <rect x="290" y="352" width="520" height="16" fill="#ef4444" rx="4"/>
  <text x="820" y="365" class="txt bad">64 张 H200 | 耗时 48.5s | 成功率 71.2% (像素点歪 ✕) | $145/千次</text>

  <text x="48" y="395" class="txt">Tier 2 直塞 32K 原始 HTML</text>
  <rect x="290" y="382" width="390" height="16" fill="#f59e0b" rx="4"/>
  <text x="690" y="395" class="txt warn">48 张 H200 | 耗时 34.0s | 成功率 64.5% (淹没在 div 标签海 ✕)</text>

  <text x="48" y="425" class="txt">Tier 3 全程 SoM 截图 + 7B VLM</text>
  <rect x="290" y="412" width="130" height="16" fill="#3b82f6" rx="4"/>
  <text x="430" y="425" class="txt">16 张 H200 | 耗时 14.2s | 成功率 88.4% | $28.00/千次</text>

  <text x="48" y="455" class="txt good">Tier 4 剪枝 AXTree + SoM 7B 🏆</text>
  <rect x="290" y="442" width="48" height="16" fill="#10b981" rx="4"/>
  <text x="350" y="455" class="txt good">6 张 H200 (-90.6% 🏆) | 耗时 7.8s (快 6.22x 🏆) | 成功率 95.6% 🏆</text>
</svg>
