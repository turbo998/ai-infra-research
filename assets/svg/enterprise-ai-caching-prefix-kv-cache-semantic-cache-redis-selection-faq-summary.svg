  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. L2 Static-First Canonical Prompt Ordering (`82%` KV Hit)</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">`[Static System -&gt; Static Tools -&gt; RAG Docs -&gt; Dynamic Time/Query]`</text>
