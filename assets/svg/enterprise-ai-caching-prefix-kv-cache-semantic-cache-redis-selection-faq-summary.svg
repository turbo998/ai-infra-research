  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Uncached 10.5K-Token Prefill P95 TTFT: 1,420 ms</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Naive Semantic Cache Wrong-Answer Rate: 14.8%</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Monthly Input Token &amp; Rework Cost: $145K – $182K / mo</text>

