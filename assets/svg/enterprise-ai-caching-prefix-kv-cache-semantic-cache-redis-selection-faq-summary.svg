  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 2 Naive Vector Semantic Cache (`Cosine &gt; 0.88`):</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Collides `2025 Q3` with `2026 Q3` (14.8% wrong answers!)</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Un-Partitioned Global Semantic Cache Across Roles:</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Leaks HR Director's cached response to junior contractor (9.4% leak)</text>
