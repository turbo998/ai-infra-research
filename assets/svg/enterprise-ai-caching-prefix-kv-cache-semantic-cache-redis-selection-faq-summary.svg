  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ENTERPRISE AI CACHING: SEMANTIC CACHE VS. PROMPT / PREFIX KV CACHE (R477)</text>
