  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Blended Input Token Cost Reduction: 78.4%</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Semantic Collision &amp; Cross-Role Leak Rate: 0.0% / 0.0%</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• End-to-End P95 TTFT Latency: 195.0ms (-86.3% vs uncached)</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly LLM Input &amp; Cache TCO: $41,000 / mo (-77.5%)</text>
