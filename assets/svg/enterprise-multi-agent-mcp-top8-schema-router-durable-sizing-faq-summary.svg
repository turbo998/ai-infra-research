<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#576 企业级多智能体 (Multi-Agent) 与 MCP 工具网关架构：Top-8 工具检索注入与持久化编排选型</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">破解 250 个 MCP 工具全量塞入引发的 45K Token 膨胀与群聊广播风暴 · Top-8 语义工具路由 + 结构化交接 · 提速 7.50x · 省 75% GPU</text>

  <!-- Box 1: Two Multi-Agent Anti-Patterns -->
  <rect x="24" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="42" y="138" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 企业多智能体落地的两大算力黑洞</text>
  <rect x="42" y="152" width="310" height="98" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 黑洞 1：250 个 MCP 工具 Schema 全量硬塞</text>
  <text x="52" y="191" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 每个工具 JSON Schema 约 180 Tokens</text>
  <text x="52" y="209" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 250 个工具 = 每轮白白消耗 45,000 Input Tokens!</text>
  <text x="52" y="227" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">• 注意力分散导致选错工具 (准确率跌至 61.4% ✕)</text>

  <rect x="42" y="258" width="310" height="110" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="52" y="278" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 黑洞 2：5-Agent 群聊全员广播与缓存失效</text>
  <text x="52" y="297" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 自由群聊每步把全部废话广播给所有 Agent (膨胀 11.4x)</text>
  <text x="52" y="315" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 同实例交替切换不同角色 System Prompt，导致</text>
  <text x="52" y="333" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">  底层 Prefix KV Cache 被反复覆写 (命中率仅 14.2%!)</text>

  <!-- Box 2: Top-8 MCP Router + Structured Handoff -->
  <rect x="386" y="110" width="354" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="404" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② Top-8 工具路由 + 结构化状态交接 🏆</text>
  <rect x="404" y="152" width="318" height="98" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="416" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">1. MCP 网关动态 Top-8 工具检索 + XGrammar</text>
  <text x="416" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 网关用 4ms 向量检索召回与当前子任务最相关的 Top-8 工具</text>
  <text x="416" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 工具上下文从 45,000 词骤降至 1,440 词 (-96.8%!)</text>
  <text x="416" y="227" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 配合 XGrammar 受控解码：工具调用准确率升至 97.8%</text>

  <rect x="404" y="258" width="318" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="416" y="278" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">2. 结构化 &lt;600 词状态交接 + 按角色粘性路由</text>
  <text x="416" y="297" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Agent 间严禁传全量聊天记录，仅传 &lt;600 Tok JSON 摘要</text>
  <text x="416" y="315" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Envoy GIE 按 Agent_Role_ID 粘性路由，保住 92.4% KV 命中</text>
  <text x="416" y="333" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• Temporal + LangGraph 步级 Checkpoint 断点续跑</text>
  <text x="416" y="351" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 10步工作流 P95 耗时从 28.5s 压至 3.8s (快 7.50 倍!)</text>

  <!-- Box 3: Stack Comparison & Numbers -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 三大智能体编排框架选型</text>
  <rect x="774" y="152" width="264" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="176" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">1. Microsoft Foundry Agent Service:</text>
  <text x="786" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 原生托管 Entra OBO 鉴权、线程状态与</text>
  <text x="786" y="212" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">  OpenAPI/MCP 工具，企业托管快速上线首选</text>

  <text x="786" y="242" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">2. LangGraph + Temporal (自建生产) 🏆</text>
  <text x="786" y="260" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 显式有向图状态机 + 持久化断点重放 +</text>
  <text x="786" y="278" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">  人工审批零显存挂起，长事务复杂流程首选</text>

  <text x="786" y="308" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">3. AutoGen / Semantic Kernel:</text>
  <text x="786" y="326" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• .NET/C# 企业微服务集成用 SK；开放式代码</text>
  <text x="786" y="344" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">  探索用 AutoGen (生产须加最大轮次硬门禁)</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 35 Peak QPS 企业多智能体平台实测定量收益（48 张 H200 → 12 张 H200，省 75% GPU）：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单轮输入 Token：从全量 250 工具 + 群聊历史的 48,200 Tokens 压缩至 5,200 Tokens (-89.2%)。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• 10步工作流端到端成功率：从 61.4% 跃升至 97.8% (+36.4 pts)；P95 完结耗时从 28.5s 压至 3.8s (快 7.50x)！</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 单次多智能体工作流全口径成本：从 $0.310/次 暴降至 $0.042/次 (成本降低 7.38 倍)！</text>
</svg>
