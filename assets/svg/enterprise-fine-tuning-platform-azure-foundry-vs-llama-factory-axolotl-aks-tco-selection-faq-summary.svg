<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #410 · ENTERPRISE FINE-TUNING PLATFORM: AZURE AI FOUNDRY VS. LLAMA-FACTORY / AXOLOTL ON AKS</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业大模型微调与垂域适配平台选型：Azure Foundry vs. LLaMA-Factory / Axolotl</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">算清微调训练成本 + 微调后托管推理的“隐性常驻小时税”，用 Multi-LoRA 共池消除 50 个部门微调模型的 GPU 爆炸</text>

  <!-- Left Box: The Hidden Hosting Tax & Multi-LoRA Consolidation -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 微调平台最大的坑：不是训练费，而是微调后的“独立部署税”！</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">传统独立合并部署: 50 个部门微调模型 = 50 套独立 GPU 实例 ($125K/月!)</text>
  <text x="90" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">Foundry Global FT: 免常驻起步费、按 Token 计费 (适合低频/闭源 GPT-4o 微调)</text>
  <text x="90" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">vLLM/SGLang Multi-LoRA: 1 套底座权重同时挂载 50 个 LoRA ($9.8K/月, 省92%!)</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 一次 70B LoRA 微调训练成本仅 ~$180，但若独占 4 张卡上线一年要花 $11.2 万！</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 严禁随意做 Full Fine-Tuning (全参微调)：全参微调破坏底座共享，无法用 Multi-LoRA</text>
  <text x="76" y="350" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 铁律：95% 垂域适配用 LoRA / DoRA (Rank=16~64) + S-LoRA/vLLM 动态热挂载！</text>

  <!-- Right Box: Training Memory Math & Framework Comparison -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 微调显存手算公式 (Full 16*Psi vs. LoRA vs. QLoRA) 与开源三强</text>
  <rect x="634" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">Full FT (FP32 AdamW): M_train ~= 16*Psi + M_act  (70B 需 1,120GB+ = 16xH100)</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">BF16 LoRA + Liger   : M_train ~= 2*Psi  + 8GB    (70B 仅需 160GB = 2xH200!)</text>
  <text x="648" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">NF4 QLoRA + Unsloth : M_train ~= 0.6*Psi + 6GB   (70B 单张 80G H100 即可训!)</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• LLaMA-Factory：WebUI 零代码 + 100+ 模型 + SFT/DPO/GRPO 一站式企业中台首选</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• Axolotl：YAML 声明式 GitOps 流水线 + Multipack 序列打包，适合 CI/CD 自动化</text>
  <text x="634" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 潮汐复利：利用夜间在线推理集群空闲的 60% GPU 跑微调作业，训练硬件成本 = $0！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档企业大模型微调与多租户部署架构实效对比 (支撑企业内部 40 个业务微调模型)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">微调与服务架构方案 (40 个垂域模型)</text>
  <text x="435" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">单次 70B 训练耗时</text>
  <text x="600" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-weight="700" font-size="13">常驻推理所需 GPU</text>
  <text x="770" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">垂域任务准确率</text>
  <text x="920" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">训+推月度总 TCO</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 全参微调 (Full FT) + 40 套独立合并权重 GPU 实例</text>
  <text x="435" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">18.5 小时 ✕</text>
  <text x="600" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">160 张卡 ✕ (烟囱爆炸)</text>
  <text x="770" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">93.2%</text>
  <text x="920" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$385,000 / 月 ✕</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 云端托管专池微调 (每个微调模型单独挂 1 个专属托管端点)</text>
  <text x="435" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">4.2 小时</text>
  <text x="600" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">40 个按小时计费端点 ✕</text>
  <text x="770" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">92.8%</text>
  <text x="920" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$148,000 / 月 ✕</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: Azure AI Foundry Serverless/Global Fine-Tuning (按 Token 计费无常驻费)</text>
  <text x="435" y="540" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">2.5 小时 ✓</text>
  <text x="600" y="540" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">0 常驻专池 (云端共池) ✓</text>
  <text x="770" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">93.5% ✓</text>
  <text x="920" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$34,000 / 月 (中小首选)</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): AKS 夜间潮汐跑 LLaMA-Factory/Axolotl + vLLM Multi-LoRA 共池</text>
  <text x="435" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1.8 小时 (Multipack) 🏆</text>
  <text x="600" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">仅 8~16 张卡装 40 个 LoRA 🏆</text>
  <text x="770" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">94.1% (DoRA+SimPO) 🏆</text>
  <text x="920" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$21,500 / 月 (-94.4%) 🏆</text>
</svg>
