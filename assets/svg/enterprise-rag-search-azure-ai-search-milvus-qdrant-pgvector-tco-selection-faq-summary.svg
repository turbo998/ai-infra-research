<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #407 · ENTERPRISE RAG SEARCH: AZURE AI SEARCH VS. MILVUS 2.5 VS. QDRANT VS. PGVECTORSCALE</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业级生产 RAG 检索引擎选型：Azure AI Search vs. Milvus vs. Qdrant vs. pgvector</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">一分钟手算亿级向量 HNSW vs. NVMe DiskANN 内存账本（从 784GB 压至 72GB），兼顾混合检索召回率与权限过滤</text>

  <!-- Left Box: HNSW RAM vs NVMe DiskANN Math -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 一亿条 1536 维向量内存手算公式：纯内存 HNSW vs. NVMe DiskANN</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">FP32 HNSW 内存 = N_vec * (4*d + 8*M) * 1.25  (1亿条 = 784 GB RAM!)</text>
  <text x="90" y="242" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">SQ8 标量量化   = N_vec * (1*d + 8*M) * 1.20  (1亿条 = 200 GB RAM)</text>
  <text x="90" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">NVMe DiskANN   = 仅 PQ 压缩码常驻内存 + NVMe 原向量重排 (仅 72 GB RAM!)</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 纯稠密向量检索盲区：专有名词、型号代码、法条编号召回率仅 68.5%</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 生产黄金流水线：BM25 稀疏 + 稠密向量 (RRF 融合 Top-50) + Cross-Encoder 重排</text>
  <text x="76" y="350" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 权限安全红线：必须在向量召回阶段做 Pre-Filtering ACL，严禁取 Top-K 后再过滤！</text>

  <!-- Right Box: 4 Engine Positioning -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 四大主流检索引擎适用规模与核心优势对标</text>
  <rect x="634" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">&lt;= 2000万向量 + 已有 PG 栈 : PostgreSQL + pgvectorscale (StreamingDiskANN)</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">企业 M365/Entra 权限开箱即用: Azure AI Search (内置语义重排 + 安全裁剪)</text>
  <text x="648" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">亿至百亿级云原生存算分离   : Milvus 2.5 (DiskANN/CAGRA) 或 Qdrant (Rust)</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 为什么 2000 万以下别急着引独立向量库？pgvectorscale 免除双库 CDC 同步延迟</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 为什么企业办公 RAG 首选 Azure AI Search？原生集成 SharePoint/Purview 权限标签</text>
  <text x="634" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：DiskANN + 混合检索 + 重排将 Recall@5 推至 94.8%，月度成本降 81.6%！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档亿级向量 (100M × 1536d) 生产 RAG 检索架构实效对比</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">RAG 检索与索引架构方案 (1 亿向量)</text>
  <text x="435" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">所需集群内存 (RAM)</text>
  <text x="605" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">P99 检索延迟</text>
  <text x="755" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">综合 Recall@5</text>
  <text x="920" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">月度基础设施 TCO</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 纯内存未压缩 FP32 HNSW + 单路纯向量检索 (无 BM25)</text>
  <text x="435" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">896 GB RAM ✕</text>
  <text x="605" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">14.2 ms</text>
  <text x="755" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">71.5% ✕ (漏专有名词)</text>
  <text x="920" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$9,800 / 月 ✕</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: HNSW SQ8 标量量化 + 后置 Post-Filter 权限过滤</text>
  <text x="435" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">240 GB RAM</text>
  <text x="605" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">16.8 ms</text>
  <text x="755" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">78.2% (小权限结果空)</text>
  <text x="920" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$3,600 / 月</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: Azure AI Search (向量压缩 + BM25 混合 + L2 语义重排 + ACL)</text>
  <text x="435" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">全托管免操心 ✓</text>
  <text x="605" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">28.5 ms ✓</text>
  <text x="755" y="540" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">94.2% ✓</text>
  <text x="920" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$2,850 / 月 (省运维)</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (大规模推荐): NVMe DiskANN / BQ + BM25 混合 + Pre-ACL + BGE 重排</text>
  <text x="435" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">72 GB RAM (-92%) 🏆</text>
  <text x="605" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">21.4 ms 🏆</text>
  <text x="755" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">94.8% 🏆</text>
  <text x="920" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$1,800 / 月 (-81.6%) 🏆</text>
</svg>
