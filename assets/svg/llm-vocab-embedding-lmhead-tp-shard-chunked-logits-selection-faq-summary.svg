<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 234 · LARGE-VOCABULARY (V=152,064) LM HEAD LOGITS OOM (37.1 GB) VS FUSED LINEAR CROSS-ENTROPY FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">32K-Token Output Layer: 37.1 GB Logits OOM Bomb vs 0.08 GB Fused Linear Cross-Entropy (464x Smaller)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1: The 37.1 GB Logits Materialization Bomb</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• At `N = 32,768` tokens and `V = 152,064` vocab (`Qwen2.5/3`):</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• `logits = lm_head(h).float()` + `F.cross_entropy(logits, y)`</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  materializes BF16 (`9.97 GB`) + FP32 (`19.93 GB`) + Grad (`7.2 GB`)</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  simultaneously — exploding HBM by +37.12 GB at the final line! ✕</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Peak Output HBM: 37.12 GB (Instant OOM!) | Time: 138.0 ms ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">In Inference Prefill, Also Slice `h[:, -1:, :]` BEFORE `lm_head`!</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Fused Linear Cross-Entropy (Liger / CCE)</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• NEVER materializes the `[32768, 152064]` Logits tensor in HBM!</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Streams `h @ W_vocab^T` tiles in on-chip SRAM &amp; computes online</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  `LogSumExp` + fused backward `d_h / d_W` inside 1 kernel pass</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Cuts output-layer HBM from 37.12 GB down to 0.08 GB (-37.04 GB!)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Peak Output HBM: 0.08 GB (464x Smaller) | Time: 40.3 ms (3.42x) 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Mandatory for Long-Context SFT / RL (GRPO Logprobs) on Large-Vocab LLMs</text>
</svg>
