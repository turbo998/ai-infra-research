  <rect width="1280" height="760" fill="url(#bg43)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="295" height="28" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
  <text x="199" y="63" fill="#bfdbfe" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 43 · AI CLUSTER ROCEV2 FABRIC</text>
  <text x="364" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="800">AI 集群 RoCEv2 无损以太网流控与防 PFC 拥塞死锁架构选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="14">ECN 先于 PFC 端到端降速 + 200ms PFC 看门狗消除级联死锁；逐包自适应喷洒 + 网卡硬件乱序重组将 MoE All-to-All 带宽利用率推至 95.2%</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc43)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="190" height="24" rx="6" fill="#7f1d1d"/>
  <text x="163" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 有损 RoCEv2 无流控</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">Go-Back-N 重传崩塌</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">无 PFC/ECN + 静态 5 元组哈希</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制缺陷：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">丢 1 个包触发网卡硬件 Go-Back-N</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">整窗回退重发 (重传率 3.85% ✕)</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• AllReduce 带宽: <tspan fill="#f87171" font-weight="700">11.4 GB/s (22.8%)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• MoE All-to-All: <tspan fill="#f87171" font-weight="700">6.8 GB/s ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32:1 Incast P99: <tspan fill="#f87171" font-weight="700">145.0 ms ✕</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 年度空转浪费: <tspan fill="#f87171" font-weight="700">$4.85M / 年 ✕</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁用于 RDMA 训练/推理</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="196" height="24" rx="6" fill="#78350f"/>
  <text x="466" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 纯 PFC 硬件暂停帧</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">PFC Storm 级联死锁</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">仅开 802.1Qbb PFC (无 ECN/无看门狗)</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么把全网憋死？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">下游队列满后逐跳向上游发 XOFF</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">暂停帧，引发环形死锁与全网停摆</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• AllReduce 带宽: <tspan fill="#fbbf24" font-weight="700">28.5 GB/s (57.0%)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• MoE All-to-All: <tspan fill="#fbbf24" font-weight="700">18.2 GB/s</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月均 PFC 死锁事故: <tspan fill="#f87171" font-weight="700">6.5 次 / 月 ✕</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 年度空转浪费: <tspan fill="#f87171" font-weight="700">$2.92M / 年 ✕</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 严禁在多层 Leaf-Spine 裸开 PFC</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="210" height="24" rx="6" fill="#0c4a6e"/>
  <text x="773" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · DCQCN + PFC 看门狗</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">ECN 先刹车 + PFC 兜底</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">WRED ECN 水位线 + 200ms Watchdog</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (99% 零 PFC 触发)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">队列 150KB 即打 ECN 标触发 CNP</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">源端降速；1.5MB 才触发 PFC 急刹</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• AllReduce 带宽: <tspan fill="#38bdf8" font-weight="800">41.8 GB/s (83.6%)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• MoE All-to-All: <tspan fill="#38bdf8" font-weight="700">34.5 GB/s</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32:1 Incast P99: <tspan fill="#38bdf8" font-weight="700">8.4 ms ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月均 PFC 死锁: <tspan fill="#38bdf8" font-weight="700">0.1 次 (看门狗自愈)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 白盒 SONiC 集群标准生产基线</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="224" height="24" rx="6" fill="#064e3b"/>
  <text x="1080" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · Spectrum-X / UET 喷洒路由</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">逐包自适应 + 乱序硬件重组</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Packet Spraying + ConnectX-7 OOO DDP</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (95.2% 媲美 IB 效率)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">交换机逐包喷洒至全部空闲 Spine；</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">接收网卡按 PSN 直接乱序写入显存</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• AllReduce 带宽: <tspan fill="#34d399" font-weight="800">47.6 GB/s (95.2% 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• MoE All-to-All: <tspan fill="#34d399" font-weight="800">45.2 GB/s (2.48x 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32:1 Incast P99: <tspan fill="#34d399" font-weight="700">2.1 ms 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月均 PFC 死锁: <tspan fill="#34d399" font-weight="700">0.0 次 (省 $2.78M/年)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 千卡/万卡 MoE 以太网终极答案</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师水位线调优与选型铁律：为什么 ECN 阈值必须远低于 PFC 阈值？为什么传统 ECMP 跑不动 MoE？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🛡️ 铁律 1：三级缓冲水位线法则 (`K_min &lt; K_max ≪ XOFF_PFC`)</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 必须让交换机在队列仅积压 150KB~800KB 时就给数据包打上 ECN 拥塞标记，由接收网卡发回</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  CNP 控制帧通知发送端网卡温和降速（99% 的拥塞在此化解，绝不波及邻居流）！</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• PFC XOFF 暂停帧只能作为 1.5MB 高水位的最后保命气囊，且必配 200ms SONiC PFC Watchdog！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🚀 铁律 2：破解大象流哈希碰撞 (`Packet Spraying + 网卡 OOO 重组`)</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 传统静态 ECMP 按五元组哈希选路，导致两条 400G RDMA 大象流以 42% 概率撞在同一条</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  Spine 上联口，而隔壁 Spine 空载！开启逐包自适应喷洒后，必须同步开启网卡硬件乱序直接</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  落盘 (`mlx5 Direct Data Placement OOO`)，将 MoE All-to-All 有效带宽推至 45.2 GB/s (95.2%)！</text>
</svg>
