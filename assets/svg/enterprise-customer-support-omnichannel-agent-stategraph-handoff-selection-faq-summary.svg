<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad411" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad411" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad411)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级全渠道在线客服 Agent、退改签确定性状态机（StateGraph）与人机热移交选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">月均 150万次会话 / 12万笔退换货 · 死板关键词Bot vs. 自由Prompt裸调退款API vs. 标准RAG+冷转人工 vs. 生效期知识RAG + StateGraph退款铁闸 + 人机热移交</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">84.6% FCR · 0% Refund Leak</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 传统死板关键词意图树 Bot</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">答非所问疯狂转人工，客户重头复述</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 66% 会话被迫转人工排队，体验极差</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 转接无上下文，客户需耗费 195秒 重讲订单号</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">首联解决率(FCR): 34.0% ✕</text>
  <text x="54" y="334" fill="#6ee7b7" font-size="13" font-weight="700">越权退款/过期规则违规率: 0.2%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">转人工客户重复解释耗时: 195.0 秒 ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月客服人力与资损总成本: $280,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：仅能处理静态菜单按键，人工坐席压力巨大</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 自由 Prompt 裸调订单退款 API</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">被话术诱导胡乱承诺，超期商品直接退钱</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 用户哭诉或话术注入即可绕过 Prompt 软提醒</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 11.8% 退单违规（超期/清仓不退品被全额退款）</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">首联解决率(FCR): 68.5%</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">越权退款/过期规则违规率: 11.8% (资损 ✕)</text>
  <text x="346" y="358" fill="#fde68a" font-size="12.5">转人工客户重复解释耗时: 140.0 秒</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月客服与违规退赔总成本: $345,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让自由对话LLM无状态机门禁直调退款接口</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 标准知识库 RAG + 只读查单</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">常召回过期大促规则，退换货仍需人工点</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 未按生效期过滤，4.5% 误引去年双十一旧规则</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 无写操作闭环，遇到退差价仍冷转接人工</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">首联解决率(FCR): 56.2%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">越权退款/过期规则违规率: 4.5% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">转人工客户重复解释耗时: 165.0 秒</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月客服人力与资损总成本: $142,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：纯信息咨询，缺乏订单写操作与热移交能力</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad411)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 生效期RAG+状态机+热移交 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">生效期过滤 + 代码级退款铁闸 + 热移交</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 强制校验 valid_from &lt;= now &lt;= valid_to 防旧规</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• StateGraph 校验退货窗/金额 + 18秒工单画像热移交</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">首联解决率(FCR): 84.6% 🏆 (+50.6pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">越权退款/过期规则率: 0.0% 🏆 (代码铁闸)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">转人工同步耗时: 18.0 秒 🏆 (零重复解释)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月客服与系统总成本: $54,000 (-80.7% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：零售电商、航司酒旅、银行消金全渠道客服</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业级全渠道客服 Agent 架构师铁律（Effective-Date RAG + Deterministic Refund StateGraph + Warm Handoff）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 彻底杜绝“加航聊天机器人式违规承诺”：历史促销与退改签规则必须强制带生效时间窗过滤；任何退款/赔付 API 必须由确定性状态机代码校验订单状态与金额上限。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 升级人工必须走结构化热移交（Warm Handoff）：将已核验订单号、争议焦点、情绪等级与一键审批草稿注入人工坐席桌面 · Provenance: synthetic + anonymized_reported</text>
</svg>
