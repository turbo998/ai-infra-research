  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">无视港口拥堵突发事件，调拨需3天</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 仅看历史销量均值，大促与断供期全崩</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 计划员靠发邮件与Excel手工重算补货点</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">预测准确率(1-WAPE): 68.5% ✕</text>
  <text x="54" y="334" fill="#fde68a" font-size="13" font-weight="700">违反起订量(MOQ)/容量率: 4.2%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">断供重调度耗时: 72.0 小时 (3天滞后 ✕)</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月缺货与加急总成本: $145,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统静态库存管理，抗风险极差</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
