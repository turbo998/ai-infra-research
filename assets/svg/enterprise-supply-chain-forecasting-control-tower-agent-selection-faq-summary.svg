  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">预测准确率(1-WAPE): 85.4% ✅</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">违反MOQ/容量约束率: 6.8%</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">断供重调度耗时: 2.0 小时</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月缺货与加急总成本: $64,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：单仓简单补货，多仓联调易违规</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad407)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: LLM特征+时序+MILP求解器 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">神经符号融合：LLM提特征 + MILP算最优解</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• LLM把港口停航/台风电报转为时序外生变量</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• OR-Tools MILP 求解器保证 0.0% 违反起订量</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">预测准确率(1-WAPE): 91.2% 🏆 (+22.7pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">违反MOQ/容量约束率: 0.0% 🏆 (MILP求解)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">断供重调度耗时: 0.25 小时 (15分钟 🏆)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月总成本: $22,000 / 月 (-84.8% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">★ 制造业/零售供应链控制塔生产首选架构</text>

  <!-- Bottom Bar -->
  <rect x="24" y="556" width="1152" height="100" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="586" fill="#38bdf8" font-size="15" font-weight="700">💡 供应链控制塔 AI 架构师黄金法则：凯撒的归凯撒（时序模型管预测、MILP 运筹学管约束求解、LLM 管非结构化情报与供应商沟通）！</text>
  <text x="46" y="612" fill="#cbd5e1" font-size="13">1. 严禁让文本 LLM 直接预测销量数字或心算补货单！LLM 负责把“苏伊士运河绕行邮件/罢工新闻”转化为结构化外生冲击变量 (lead_time_delta=+9天) 喂给时序模型。</text>
  <text x="46" y="636" fill="#94a3b8" font-size="12.5">2. 运筹学求解器兜底：将时序预测结果输入 OR-Tools / Gurobi 混合整数规划 (MILP)，100% 满足最小起订量 (MOQ)、整柜体积与安全库存约束，15分钟生成 SAP 采购草稿！</text>
