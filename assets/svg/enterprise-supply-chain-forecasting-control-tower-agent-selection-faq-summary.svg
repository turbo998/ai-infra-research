  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">预测准了，但缺运筹学 MILP 求解器</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 专业时序模型将预测准确度提至 85.4%</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 靠 LLM 凑多仓调拨数量仍违背集装箱容积</text>
