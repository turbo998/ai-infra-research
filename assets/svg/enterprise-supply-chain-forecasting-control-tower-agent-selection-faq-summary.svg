  <rect width="1200" height="680" fill="url(#bgGrad407)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级供应链控制塔（Control Tower）、需求预测与断供调度 Agent 架构选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">Round 407 · 25万SKU / 40个分仓 · 传统ERP移动平均 vs. 纯文本LLM猜数字 vs. 时序模型+裸LLM下单 vs. LLM外部扰动特征 + Chronos/LightGBM + OR-Tools MILP求解器</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">91.2% Acc · 0% MOQ Viol</text>

  <!-- Tier 1 -->
