  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">违反MOQ/容量约束率: 18.5% ✕</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">断供重调度耗时: 1.5 小时</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月缺货与加急总成本: $210,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让文本LLM直接充当时序预测器</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
