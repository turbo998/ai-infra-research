<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级智能运维 (AIOps) 与根因分析 (RCA) Agent 选型：Azure SRE Agent / Datadog Bits vs. 拓扑自愈架构 (#432)</text>
  <text x="28" y="58" class="sub">为什么底层数据库抖动会引发 1,800 条级联告警风暴把大模型直接喂懵？为什么绝对不能给 SRE Agent 开放无护栏 `kubectl delete / bash`？</text>

  <!-- Left Panel: Alert Storm & Unbounded Shell Agent Trap vs Topology Deduplication + Read-Only Prefetch -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 智能排障两大灾难：1,800 条级联告警淹没上下文 vs. 自治 Shell 误删生产库</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 灾难一 (未做拓扑降噪直接喂 LLM) &amp; 灾难二 (开放自由 `bash/kubectl` 写权限)</text>
  <text x="56" y="164" class="mono">• 级联风暴：1 个 Redis 节点 OOM 会导致上游 60 个微服务瞬间爆出 1,800 条 HTTP 500 告警</text>
  <text x="56" y="184" class="mono">• 直接喂 LLM：大模型在下游表象日志里盲目打转 35 分钟，根因定位准确率仅 54.0%！</text>
  <text x="56" y="202" class="txt">• 权限失控：让 Agent 自由拼凑 `kubectl / SQL` 修复命令，极易把局部抖动演变成全站雪崩！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：CMDB/OTel 拓扑图降噪 (1800-&gt;1) + 只读诊断全自动预取 + Runbook 审批</text>
  <text x="56" y="272" class="mono">• Step 1 拓扑收敛：沿调用图 (Service Graph) 顺藤摸瓜找到最底层叶子节点 + 最近 15m 变更记录</text>
  <text x="56" y="292" class="mono">• Step 2 只读全自动：告警触发 3 秒内自动并发跑完 12 项只读诊断 (`kubectl describe/logs/top`)</text>
  <text x="56" y="312" class="txt">• Step 3 写操作门禁：仅允许调用参数化标准 Runbook（回滚/扩容），一键推送到 Teams 由值班长点批！</text>

  <!-- Right Panel: 4 AIOps & SRE Agent Platforms Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业 AIOps 与 SRE 排障智能体横向对标 (500 微服务生产集群)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 原始告警流直喂大模型 + 被动等待工程师手工敲命令查日志</text>
  <text x="638" y="158" class="mono">• 告警风暴未收敛 | 根因准确率 54.0% ✕ | 平均恢复 MTTR 48.0 分钟 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 商业 APM 内生助手 (Datadog Bits AI / Dynatrace Davis AI)</text>
  <text x="638" y="214" class="mono">• 深度绑定各自商业 APM 探针 | 根因准确率 88.5% | MTTR 9.5m | 年费 $380,000/年</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 云原生托管运维智能体 (Azure SRE Agent + Azure Monitor / App Insights)</text>
  <text x="638" y="270" class="mono">• 原生读取 AKS/Azure 资源拓扑与 Activity Log 变更 | 根因准确率 91.2% ✓ | $115,000/年 ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: OTel 拓扑告警收敛 + 历史事故案例库 (CBR) + 只读预取 + Runbook 门禁 (🏆)</text>
  <text x="638" y="326" class="mono">• 告警压缩 99.4% 🏆 | 根因准确率 95.6% 🏆 | MTTR 压至 3.8 分钟 🏆 | 仅 $64,000/年!</text>

  <!-- Bottom Panel: End-to-End 4-Stage AIOps Incident Triage & Remediation -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端智能排障参考架构：如何把凌晨 3 点的 P1 故障恢复时间 (MTTR) 从 48 分钟压到 3.8 分钟？</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 拓扑图告警折叠 (1800 -&gt; 1)</text>
  <text x="56" y="464" class="mono">• 结合 OTel 调用链拓扑与 K8s</text>
  <text x="56" y="484" class="mono">  节点亲和关系，将 1,800 条衍生</text>
  <text x="56" y="504" class="mono">  告警折叠为 1 张根因事件单</text>
  <text x="56" y="524" class="mono">• 自动关联前 15 分钟 Git 发布记录</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">81% 的线上故障源于最近一次变更！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 100% 全自动只读诊断预取 (t=3s)</text>
  <text x="332" y="464" class="mono">• 无需人工授权！使用只读 RBAC</text>
  <text x="332" y="484" class="mono">  ServiceAccount 并发拉取：</text>
  <text x="332" y="504" class="mono">  Pod Events / OOMKilled 堆栈 /</text>
  <text x="332" y="524" class="mono">  慢 SQL 锁等待 / DCGM Xid 报错</text>
  <text x="332" y="550" class="txt" fill="#34d399">值班工程师睁眼时证据包已全部就绪！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 历史复盘案例推理 (Postmortem CBR)</text>
  <text x="620" y="464" class="mono">• 检索企业过往 500 份真实故障</text>
  <text x="620" y="484" class="mono">  Postmortem 复盘库（症状指纹</text>
  <text x="620" y="504" class="mono">  + 根因 + 当年验证有效的修复命令）</text>
  <text x="620" y="524" class="mono">• 生成 Top-2 根因假设与置信度</text>
  <text x="620" y="550" class="txt" fill="#fde68a">根因一次命中率达 95.6%</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 参数化 Runbook 一键审批执行</text>
  <text x="908" y="464" class="mono">• 严禁 LLM 自由写 bash 删库！</text>
  <text x="908" y="484" class="mono">• LLM 只能从白名单选 `rollback_helm`</text>
  <text x="908" y="504" class="mono">  或 `cordon_gpu_node` 并填入参数</text>
  <text x="908" y="524" class="mono">• 推 Teams 卡片，SRE 手机点「批准」即愈</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">零误操作事故，MTTR 压至 3.8 分钟！</text>
</svg>
