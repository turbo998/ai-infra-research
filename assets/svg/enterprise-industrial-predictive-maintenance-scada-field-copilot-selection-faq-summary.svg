<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad408" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad408" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad408)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级智能制造预测性维护、PLC/SCADA 时序告警与现场工程师排障 Copilot 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">12座工厂 / 8,000台关键设备 · 固定阈值SCADA报警 vs. 原始秒级CSV塞LLM vs. 边缘时序+纯文本手册RAG vs. 边缘FFT/TimesFM + 电气图纸多模态RAG + SAP PM工单Agent</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">94.6% Acc · 1.1h MTTR</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 固定阈值 SCADA + 翻纸质图纸</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">误报疲劳严重，排障查图耗费近7小时</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 静态温度/振动阈值导致 38.5% 误报狼来了</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 工程师现场翻几千页扫描版电气液压图纸</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">故障根因准确率: 61.0% ✕</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">告警误报率(Alarm Fatigue): 38.5% ✕</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">平均修复时间(MTTR): 6.8 小时 ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月非计划停机与运维成本: $185,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统车间事后抢修，非计划停机昂贵</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 传感器秒级 CSV 硬塞文本 LLM</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">文本LLM算不出频谱谐波，Token烧穿</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 文本模型无法对 1kHz 振动波做 FFT 包络分析</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 轴承外圈早期剥落漏报，误报高达 44.0%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">故障根因准确率: 54.5% (倒退 ✕)</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">告警误报率(Alarm Fatigue): 44.0% ✕</text>
  <text x="346" y="358" fill="#fde68a" font-size="12.5">平均修复时间(MTTR): 5.2 小时</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月非计划停机与运维成本: $240,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁把原始高频传感器流直接喂给LLM</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 边缘时序模型 + 纯文本手册 RAG</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">能抓异常，但纯文本OCR丢失电气端子图</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 边缘时序检测大幅压低误报率至 8.4%</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 纯文本切片看不懂继电器触点与液压回路图</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">故障根因准确率: 79.2% ✅</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">告警误报率(Alarm Fatigue): 8.4%</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">平均修复时间(MTTR): 2.6 小时</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月非计划停机与运维成本: $76,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：纯文字SOP问答，缺乏复杂原理图定位</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad408)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 边缘FFT+图纸VLM+CMMS Agent 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">边缘频谱诊断 + 图纸视觉检索 + 备件锁库</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 边缘算 FFT/TimesFM 转结构化故障码喂 LLM</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• ColPali 定位图纸端子 + SAP PM 锁备件 + LOTO门禁</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">故障根因准确率: 94.6% 🏆 (+33.6pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">告警误报率: 2.1% 🏆 · LOTO 安全核验 100%</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">平均修复时间(MTTR): 1.1 小时 🏆 (-83.8%)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月非计划停机与运维成本: $28,000 (-84.9% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：智能制造工厂、风电能源与高端装备运维</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 智能制造运维架构师铁律（Edge-Cloud Hybrid Industrial Copilot Pattern）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 边缘跑频谱与时序模型，云端跑认知排障：用边缘侧 FFT 包络解调 + IsolationForest/TimesFM 将高频波形转化为结构化特征事件，严禁将原始秒级 CSV 直塞 LLM。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 原理图必须走多模态视觉检索（ColPali/VLM）并绑定上锁挂牌（LOTO）门禁：精确定位 PLC 端子与扭矩表，自动锁库 SAP PM 备件并强制挂牌断电核验 · Provenance: synthetic + anonymized_reported</text>
</svg>
