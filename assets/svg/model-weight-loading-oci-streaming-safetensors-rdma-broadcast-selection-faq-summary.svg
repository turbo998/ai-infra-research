<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad72" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad72" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad72)" rx="16"/>
  <rect x="24" y="20" width="1232" height="86" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="54" fill="url(#accentGrad72)" font-size="22" font-weight="800">Round 72 · 百卡/千卡集群模型权重极速加载、Nydus 按需镜像与 RDMA P2P 广播选型一图流</text>
  <text x="44" y="84" fill="#94A3B8" font-size="14">64 节点 (512×H100) 同时拉起 DeepSeek-V3 671B FP8 (685GB 权重 + 22GB 镜像) · 单次读存储 + 400G RDMA 广播 (independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <g transform="translate(24, 124)">
    <!-- Tier 1 -->
    <rect x="0" y="0" width="296" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FCA5A5" font-size="15" font-weight="700">Tier 1 · 64节点并发拉 S3/NFS ✕</text>
    <text x="16" y="56" fill="#CBD5E1" font-size="12.5">22GB 整包镜像 + 未分片 mmap 缺页风暴</text>
    <line x1="16" y1="70" x2="280" y2="70" stroke="#334155"/>
    <text x="16" y="98" fill="#94A3B8" font-size="12">512卡全集群就绪：</text>
    <text x="165" y="98" fill="#EF4444" font-size="15" font-weight="800">410.0 s (6.8分钟 ✕)</text>
    <text x="16" y="128" fill="#94A3B8" font-size="12">存储网关总读取量：</text>
    <text x="165" y="128" fill="#FCA5A5" font-size="14" font-weight="700">43.84 TB (读风暴 ✕)</text>
    <text x="16" y="158" fill="#94A3B8" font-size="12">单机有效加载带宽：</text>
    <text x="165" y="158" fill="#FCA5A5" font-size="14" font-weight="700">1.67 GB/s (4KB缺页)</text>
    <text x="16" y="188" fill="#94A3B8" font-size="12">磁盘压力驱逐率：</text>
    <text x="165" y="188" fill="#FCA5A5" font-size="14" font-weight="700">14.5% (缓存冲刷)</text>
    <text x="16" y="218" fill="#94A3B8" font-size="12">年化空转算力浪费：</text>
    <text x="165" y="218" fill="#EF4444" font-size="14" font-weight="800">$318,000 / yr ✕</text>
    <rect x="16" y="244" width="264" height="48" rx="8" fill="#2D1622"/>
    <text x="26" y="264" fill="#FDA4AF" font-size="11.5" font-weight="600">痛点：64 节点同时拉 685GB 打爆 100G 存储，</text>
    <text x="26" y="282" fill="#FDA4AF" font-size="11.5">且 mmap 触发 1.79 亿次 4KB 缺页中断！</text>

    <!-- Tier 2 -->
    <rect x="312" y="0" width="296" height="310" rx="12" fill="#1E2230" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="328" y="32" fill="#FCD34D" font-size="15" font-weight="700">Tier 2 · 700GB 权重打入镜像 ✕</text>
    <text x="328" y="56" fill="#CBD5E1" font-size="12.5">巨型 Docker 层 + 本地 CPU 解压</text>
    <line x1="328" y1="70" x2="592" y2="70" stroke="#334155"/>
    <text x="328" y="98" fill="#94A3B8" font-size="12">512卡全集群就绪：</text>
    <text x="477" y="98" fill="#EF4444" font-size="15" font-weight="800">540.0 s (9.0分钟 ✕)</text>
    <text x="328" y="128" fill="#94A3B8" font-size="12">存储网关总读取量：</text>
    <text x="477" y="128" fill="#FBBF24" font-size="14" font-weight="700">45.25 TB ✕</text>
    <text x="328" y="158" fill="#94A3B8" font-size="12">单机有效加载带宽：</text>
    <text x="477" y="158" fill="#FCD34D" font-size="14" font-weight="700">1.31 GB/s (CPU解压)</text>
    <text x="328" y="188" fill="#94A3B8" font-size="12">磁盘压力驱逐率：</text>
    <text x="477" y="188" fill="#EF4444" font-size="15" font-weight="800">68.0% (DiskPressure ✕)</text>
    <text x="328" y="218" fill="#94A3B8" font-size="12">年化空转算力浪费：</text>
    <text x="477" y="218" fill="#EF4444" font-size="14" font-weight="800">$418,000 / yr ✕</text>
    <rect x="328" y="244" width="264" height="48" rx="8" fill="#2E2418"/>
    <text x="338" y="264" fill="#FDE68A" font-size="11.5" font-weight="600">痛点：解压占双倍本地盘 (1.4TB) 触发驱逐，</text>
    <text x="338" y="282" fill="#FDE68A" font-size="11.5">改 1 行代码需重推 700GB 镜像！</text>

    <!-- Tier 3 -->
    <rect x="624" y="0" width="296" height="310" rx="12" fill="#132A3E" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="640" y="32" fill="#7DD3FC" font-size="15" font-weight="700">Tier 3 · Nydus + O_DIRECT/GDS ✅</text>
    <text x="640" y="56" fill="#CBD5E1" font-size="12.5">3.2s 块流式镜像 + 预切分直读</text>
    <line x1="640" y1="70" x2="904" y2="70" stroke="#334155"/>
    <text x="640" y="98" fill="#94A3B8" font-size="12">512卡全集群就绪：</text>
    <text x="789" y="98" fill="#38BDF8" font-size="15" font-weight="800">38.5 s (快 10.6x ✅)</text>
    <text x="640" y="128" fill="#94A3B8" font-size="12">存储网关总读取量：</text>
    <text x="789" y="128" fill="#7DD3FC" font-size="14" font-weight="700">8.40 TB</text>
    <text x="640" y="158" fill="#94A3B8" font-size="12">单机有效加载带宽：</text>
    <text x="789" y="158" fill="#38BDF8" font-size="14" font-weight="700">17.8 GB/s (O_DIRECT)</text>
    <text x="640" y="188" fill="#94A3B8" font-size="12">磁盘压力驱逐率：</text>
    <text x="789" y="188" fill="#38BDF8" font-size="14" font-weight="700">0.0% ✅</text>
    <text x="640" y="218" fill="#94A3B8" font-size="12">年化空转算力浪费：</text>
    <text x="789" y="218" fill="#7DD3FC" font-size="14" font-weight="700">$29,800 / yr ✅</text>
    <rect x="640" y="244" width="264" height="48" rx="8" fill="#0C2238"/>
    <text x="650" y="264" fill="#BAE6FD" font-size="11.5" font-weight="600">优势：Nydus 仅读 6% 镜像块即刻启动，</text>
    <text x="650" y="282" fill="#BAE6FD" font-size="11.5">Run:ai Streamer O_DIRECT 绕过缺页中断。</text>

    <!-- Tier 4 -->
    <rect x="936" y="0" width="296" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.2"/>
    <text x="952" y="32" fill="#6EE7B7" font-size="15" font-weight="800">Tier 4 · 单次读 + RDMA 广播 🏆</text>
    <text x="952" y="56" fill="#D1FAE5" font-size="12.5">0.685TB 单次分条读 + 400G P2P 多播</text>
    <line x1="952" y1="70" x2="1216" y2="70" stroke="#334155"/>
    <text x="952" y="98" fill="#A7F3D0" font-size="12">512卡全集群就绪：</text>
    <text x="1101" y="98" fill="#34D399" font-size="15" font-weight="800">6.4 s (快 64.1x 🏆)</text>
    <text x="952" y="128" fill="#A7F3D0" font-size="12">存储网关总读取量：</text>
    <text x="1101" y="128" fill="#34D399" font-size="15" font-weight="800">0.685 TB (-64.0x 🏆)</text>
    <text x="952" y="158" fill="#A7F3D0" font-size="12">单机有效加载带宽：</text>
    <text x="1101" y="158" fill="#6EE7B7" font-size="14" font-weight="800">107.0 GB/s (RDMA 🏆)</text>
    <text x="952" y="188" fill="#A7F3D0" font-size="12">磁盘压力驱逐率：</text>
    <text x="1101" y="188" fill="#34D399" font-size="14" font-weight="800">0.0% 🏆</text>
    <text x="952" y="218" fill="#A7F3D0" font-size="12">年化空转算力浪费：</text>
    <text x="1101" y="218" fill="#6EE7B7" font-size="13.5" font-weight="800">$4,950 (省 $313k 🏆)</text>
    <rect x="952" y="244" width="264" height="48" rx="8" fill="#062019"/>
    <text x="962" y="264" fill="#A7F3D0" font-size="11.5" font-weight="700">终极形态：每台节点只读 1/64 权重，用内部</text>
    <text x="962" y="282" fill="#A7F3D0" font-size="11.5">204.8 Tbps RDMA 网广播至 Pinned 内存池</text>
  </g>

  <!-- Bottom Visual Comparison -->
  <rect x="24" y="454" width="1232" height="302" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="486" fill="#F8FAFC" font-size="16" font-weight="700">核心定量洞察：64 节点 (512×H100) 冷启动耗时对比 &amp; 分条单次读取 + 400G RDMA Ring 广播流水线</text>

  <!-- Left Bar Chart -->
  <g transform="translate(44, 508)">
    <text x="0" y="20" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 2 700GB 权重打入容器镜像 (540.0 秒 · CPU 单核解压 + 68% DiskPressure 驱逐 ✕)</text>
    <rect x="0" y="28" width="540" height="22" rx="4" fill="#F59E0B"/>

    <text x="0" y="76" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 1 64节点并发拉 S3/NFS + mmap (410.0 秒 · 43.84 TB 存储读风暴 + 1.79亿次缺页 ✕)</text>
    <rect x="0" y="84" width="410" height="22" rx="4" fill="#EF4444"/>

    <text x="0" y="132" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 3 Nydus 3.2s 按需镜像 + 预切分 O_DIRECT/GDS (38.5 秒 · 提速 10.6x ✅)</text>
    <rect x="0" y="140" width="42" height="22" rx="4" fill="#38BDF8"/>
    <text x="52" y="156" fill="#7DD3FC" font-size="11" font-weight="700">38.5 秒 ✅</text>

    <text x="0" y="188" fill="#6EE7B7" font-size="12.5" font-weight="700">Tier 4 Nydus + 单次分条读存储 (0.685TB) + 400G RDMA 广播 + Pinned 缓存 (6.4 秒 · 快 64.1x 🏆)</text>
    <rect x="0" y="196" width="12" height="22" rx="4" fill="#10B981"/>
    <text x="20" y="212" fill="#34D399" font-size="12" font-weight="800">仅 6.4 秒! (存储流量降 64.0x 🏆)</text>
  </g>

  <!-- Right Architecture Box -->
  <g transform="translate(650, 504)">
    <rect x="0" y="0" width="584" height="232" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="18" y="28" fill="#38BDF8" font-size="14" font-weight="700">第一性原理：三大技术协同将 512 卡启动从 410s 压至 6.4s</text>
    <text x="18" y="56" fill="#E2E8F0" font-size="12.5">① 容器镜像：CNCF Nydus (RAFS v6) 块级懒加载 (65s → 3.2s)：</text>
    <text x="32" y="76" fill="#94A3B8" font-size="12">不拉取整个 22GB 镜像，仅挂载 &lt;5MB 目录树并按需拉取启动真正用到的 6% 数据块。</text>
    <text x="18" y="106" fill="#6EE7B7" font-size="12.5">② 主机读取：Run:ai Streamer O_DIRECT / GDS 绕过 mmap 缺页风暴：</text>
    <text x="32" y="126" fill="#94A3B8" font-size="12">禁用 OS Page Cache 4KB 缺页中断，以 16MB 大块多线程异步流直灌锁页内存/显存。</text>
    <text x="18" y="156" fill="#FCD34D" font-size="12.5">③ 跨机分发：分条单次读存储 (0.685TB) + 400G RDMA Ring P2P 广播：</text>
    <text x="32" y="176" fill="#94A3B8" font-size="12">每台节点只从存储读 10.7GB (1/64)，用闲置的 204.8 Tbps 东西向 RDMA 网在 2.1s 内</text>
    <text x="32" y="196" fill="#94A3B8" font-size="12">完成全网拼图并常驻节点 /dev/shm Pinned 内存池，容器重启 &lt;1.5s 秒级恢复！</text>
  </g>
</svg>
