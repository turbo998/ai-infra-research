  <rect width="1200" height="680" fill="url(#bgGrad399)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级端云协同 (Edge-Cloud Hybrid AI) 与端侧 NPU 小模型混合推理架构选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：78% 端侧 NPU 3B 小模型本地闭环 + 22% 低置信度端侧脱敏上云 70B 级联，保持 95.2% 准确率、快 5.64x 且云账单省 78.2%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 399 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 100% 纯云端 WAN 推理</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 调个空调/设个闹钟也走 4G/5G 调云端 70B</text>
  <text x="40" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 隧道/车间弱网可用性：96.2% (断网即瞎)✕</text>
  <text x="40" y="212" fill="#34d399" font-size="12" font-weight="700">• 综合任务准确率：94.5%</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• P95 首字延迟：620.0 ms (含移动网RTT)✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 端侧原始屏幕/语音隐私直传云端 ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">5万终端月云账单：$68,000 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：白白浪费终端芯片自带的 45 TOPS</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">免费 NPU 算力，且地下车库/车间完全失灵</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 100% 纯端侧 3B 孤立运行</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 所有请求全塞给端侧 3B INT4 模型硬算</text>
  <text x="332" y="192" fill="#34d399" font-size="12" font-weight="700">• 隧道/车间弱网可用性：100.0%</text>
  <text x="332" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 综合任务准确率：暴跌至 72.0% ✕</text>
  <text x="332" y="232" fill="#34d399" font-size="12" font-weight="700">• P95 首字延迟：45.0 ms</text>
  <text x="332" y="252" fill="#fca5a5" font-size="12">• 无法回答复杂跨系统与最新实时知识 ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">5万终端月云账单：$0 (智商不足)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">痛点：3B 模型控设备、写短摘要很强，</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">但遇到复杂多跳规划与行业知识必出幻觉</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 静态关键词规则端云分流</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 写死正则：55% 走端侧 / 45% 走云端</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 模糊复合指令（边控车边查路线）易分错</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 综合任务准确率：86.4%</text>
  <text x="624" y="232" fill="#7dd3fc" font-size="12" font-weight="700">• 混合 P95 首字延迟：310.0 ms</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 弱网可用性：98.5%</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">5万终端月云账单：$31,500 (-53.7%)</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：第一代端云混合过渡方案</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：静态规则维护难且上云未做端侧脱敏</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 端侧NPU守门+熵级联+脱敏🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 78% 端侧 NPU 3B 极速闭环 ($0, 45ms)</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 22% 高熵难题经端侧脱敏后上云 70B</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 综合任务准确率：95.2% 🏆 (+23.2pts vs T2)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 混合 P95 首字延迟：110.0 ms 🏆 (快5.64x)</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• 断网自动回退本地保底：99.98% 可用 🏆</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">5万终端月云账单：$14,800 (省78.2%)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：AI PC / 智能座舱 / 门店工控终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">把 78% 算力免費卸载至客户自带的终端芯片！</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么端云协同 (Edge-Cloud Hybrid) 是智能硬件、AI PC 与连锁门店的终极省钱与隐私王牌？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad399)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 白嫖客户终端的免费 NPU 算力（78% 流量本地消化）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 现代 AI PC (Intel/AMD/Apple M系)、骁龙 8 Elite 与车载 Orin</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">  自带 `40~80 TOPS` NPU，跑 `Qwen2.5-3B / Llama-3.2-3B INT4`</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  首字仅 `45ms`，吐字高达 `60 tok/s`，且不花云端一分钱电费！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 设备控制、本地邮件摘要、固定表单提取 100% 在端侧 NPU 闭环！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 首词对数概率熵级联（Entropy-Gated Cloud Escalation）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 怎么在 `15ms` 内知道端侧 3B 模型答不答得上来？</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 端侧 3B 先做 Prefill 计算前 3 个 Token 的预测熵 $H(p)$：</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  若 $H(p) \le \tau$（胸有成竹，占 78%）直接本地流式吐字；</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 若 $H(p) &gt; \tau$（犹豫不决，占 22%）立即上送云端 70B 解答！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 端侧 NPU 隐私防火墙（Local-First Privacy Scrub）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 针对那 22% 必须上云的复杂请求，绝不直接上传原始屏幕截图或录音！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 直接利用端侧 3B 小模型在设备本地执行 **隐私预脱敏与上下文浓缩**</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  （把姓名/病历号/合同金额替换为 `&lt;PII_1&gt;`），</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  确保敏感原始数据永远不出终端物理边界，云端返回后再本地还原！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 399 合成标定算例 (independently_reproduced=false)</text>
</svg>
