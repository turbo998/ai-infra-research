<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🌍 跨地域/多云大模型高可用容灾 (Multi-Region DR) 与混合云溢出选型一图流总结</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">32K 多轮对话 Agent (8轮/会话) · 跨地域 WAN 延迟 65ms · 峰值 1,200 RPS · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Round 36 · Multi-Region DR &amp; Burst</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#334155"/>
    <text x="16" y="27" fill="#f8fafc" font-size="14" font-weight="800">⬜ Tier 1: 单地域主备冷灾备 (Cold DR)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">主地域 100% 承载 · 灾备地域故障时冷拉起</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 多轮 KV 缓存命中率: <tspan fill="#34d399" font-weight="700">88.5% (单地集中)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 稳态多轮 P95 TTFT: <tspan fill="#cbd5e1" font-weight="700">265.0 ms</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 地域故障恢复 RTO: <tspan fill="#f87171" font-weight="700">340.0 s (停机近 6 分钟 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 切换期在途请求丢包: <tspan fill="#f87171" font-weight="700">100.0% (全断连 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度算力总 TCO: <tspan fill="#cbd5e1" font-weight="700">$4,200,000 / 年</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么冷备满足不了金融 SLA？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">主地域光缆挖断或电力闪断时，灾备地域临</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">时申请雲 GPU 很容易遇到库存不足，且拉起</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">模型需 5 分钟以上，核心业务直接瘫痪！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 2: 跨地域无状态轮询双活</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">无会话粘性 Anycast · 两地各配 100% 峰值</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 多轮 KV 缓存命中率: <tspan fill="#f87171" font-weight="700">44.0% (暴跌 -47.2pt ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 稳态多轮 P95 TTFT: <tspan fill="#f87171" font-weight="700">1,590.0 ms (慢 6.62x ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 地域故障恢复 RTO: <tspan fill="#fbbf24" font-weight="700">8.5 s</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 跨地域 WAN 带宽消耗: <tspan fill="#f87171" font-weight="700">18.5 Gbps (尝试同步 KV)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度算力总 TCO: <tspan fill="#f87171" font-weight="700">$6,400,000 / 年 (最贵 ✕)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 传统微服务架构师最容易踩的坑：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">把大模型当无状态 Web 服务做轮询！第 1 轮</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">打到华东，第 2 轮打到华北，32K 历史 KV 全</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">部重算，首字延迟飙至 1.59 秒且算力翻倍！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 同城三可用区 Multi-AZ 双活</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">&lt;1.5ms 裸光纤 + 跨 AZ 分布式 L2 KV 池</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 多轮 KV 缓存命中率: <tspan fill="#34d399" font-weight="700">89.5% ✅</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 稳态多轮 P95 TTFT: <tspan fill="#34d399" font-weight="700">250.0 ms ✅</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 可用区故障恢复 RTO: <tspan fill="#34d399" font-weight="700">1.2 s (秒级无感切换 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 切换期请求丢包率: <tspan fill="#34d399" font-weight="700">0.2% ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度算力总 TCO: <tspan fill="#60a5fa" font-weight="700">$4,560,000 / 年</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 同城单机房掉电容灾首选：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">同城 3 个 AZ 间距 &lt;30km (RTT 1.2ms)，可直</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">接通过城域 RoCE 共享压缩后的 MLA/FP8 KV</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">二级缓存池，AZ-1 故障时 AZ-2 18ms 拉回 KV！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 粘性双活 + 文本重放 + 溢出 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">有界哈希粘性 + 64KB Token 异步流 + 混合云</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 多轮 KV 缓存命中率: <tspan fill="#34d399" font-weight="700">91.2% 🏆</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 稳态多轮 P95 TTFT: <tspan fill="#34d399" font-weight="700">240.0 ms (快 6.62x 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 地域级故障恢复 RTO: <tspan fill="#34d399" font-weight="700">1.8 s (0% 丢包 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 跨地域 WAN 带宽消耗: <tspan fill="#6ee7b7" font-weight="700">仅 0.12 Gbps (-99.4% 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度算力总 TCO: <tspan fill="#34d399" font-weight="700">$3,744,000 (省 $265.6万 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 异地两地三中心与混合云终极答案：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 一致性哈希把同会话钉死在同一地域；</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">② 跨广域网只传 64KB 文本 Token 流而非 8GB</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">KV；③ 自建 P60 底盘 + 公有云吸收峰值！</text>
  </g>

  <!-- Bottom Left: Why You Never Replicate Raw KV Across WAN -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📡 为什么严禁跨异地广域网 (WAN) 同步原始 KV Cache？（载荷缩小 128,000 倍）</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">单条 32K 上下文会话在三种跨地域状态同步模式下的载荷大小与 10Gbps 专线传输耗时</text>

    <!-- Mode 1 -->
    <rect x="20" y="68" width="560" height="72" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="34" y="90" fill="#fca5a5" font-size="13" font-weight="800">✕ 模式 A：跨地域同步原始 GQA-8 KV 张量 (8,192 MB / 会话)</text>
    <text x="34" y="110" fill="#cbd5e1" font-size="11.5">• 10Gbps 专线传输耗时：<tspan fill="#f87171" font-weight="700">6,553.6 ms (6.5 秒)</tspan> —— 比在对端机房从头重算 Prefill (450ms) 还慢 14 倍！</text>
    <text x="34" y="128" fill="#cbd5e1" font-size="11.5">• 只要每秒有 15 个会话同步，就能把昂贵的 100Gbps 跨省骨干专线彻底打爆！</text>

    <!-- Mode 2 -->
    <rect x="20" y="150" width="560" height="72" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="172" fill="#93c5fd" font-size="13" font-weight="800">⚠️ 模式 B：同步 DeepSeek MLA FP8 潜变量 KV (716.8 MB / 会话)</text>
    <text x="34" y="192" fill="#cbd5e1" font-size="11.5">• 非常适合 <strong>Tier 3 同城多可用区 (Multi-AZ 400G 裸光纤，耗时 ~18ms)</strong>；</text>
    <text x="34" y="210" fill="#cbd5e1" font-size="11.5">• 但在跨省/跨国 65ms 广域网专线上依然偏重（10Gbps 下需 573ms），不宜每轮全量跨城复制。</text>

    <!-- Mode 3 -->
    <rect x="20" y="232" width="560" height="78" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="34" y="254" fill="#6ee7b7" font-size="13" font-weight="800">🏆 模式 C：Tier 4 异步复制压缩 Token-ID 文本轨迹 (仅 0.064 MB = 64 KB / 会话)</text>
    <text x="34" y="274" fill="#cbd5e1" font-size="11.5">• 载荷体积比原始 KV <strong>缩小 128,000 倍</strong>！跨国专线传输仅需 <code>0.05 ms</code>，全集群带宽仅占 <code>0.12 Gbps</code>！</text>
    <text x="34" y="294" fill="#cbd5e1" font-size="11.5">• 平时对端只存 64KB 文本；仅当主地域真挂掉的那一刻，灾备地域才用 0.45 秒重算恢复 KV！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师两地三中心容灾与混合云弹性溢出三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：全球负载均衡器必须开启“有界负载一致性哈希 (Session Sticky)”</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 按 `hash(conversation_id)` 将同一多轮会话的 1~8 轮请求牢牢钉在同一个地域与实例上，</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  保住 `91.2%` 本地 KV 命中率；仅当该地域水位 &gt;90% 时才按一致性哈希环顺延溢出。</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：同城跨 AZ 传压缩 KV，异地跨 Region 传 64KB Token 轨迹</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 同城 Multi-AZ (&lt;1.5ms) 走 RDMA 共享二级 KV 池；跨省/跨国异地灾备采用 **“热会话文本</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  轨迹实时同步 + 故障触发时对端按需重算 Prefill (Lazy KV Reconstruction)”**！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 铁律三：用“P60 自建/包年底盘 + P95 公有云弹性溢出”省下 41.5% TCO</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 切勿在两个地域各买 100% 峰值 GPU（共 200% 算力长期闲置）！主备两地合计常驻 P60</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  基线容量，早晚高峰超出部分自动脱敏溢出至公有云 Serverless/Spot GPU 池，年省 $265.6万！</text>
  </g>
</svg>
