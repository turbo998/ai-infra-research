<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">第 440 篇里程碑：企业级 AI FinOps、K8s GPU 成本分摊与云算力组合选型 (RI / PTU / Spot) (#440)</text>
  <text x="28" y="58" class="sub">为什么用 K8s Pod CPU/内存公式给多租户 vLLM 分账会产生 42% 偏差？如何用“60% 预留 + 25% 按需 + 15% Spot”组合年省 $248 万？</text>

  <!-- Left Panel: K8s Pod Resource Request Misattribution vs Weighted Token + DCGM FinOps -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 多租户共享 GPU 池分账死穴：按 Pod 分摊 vs. 读写加权 Token + 闲置拆分</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 失败做法：传统 Kubecost 按 K8s Namespace 或均分 Token 数量分账</text>
  <text x="56" y="164" class="mono">• 痛点 1：10个事业部共用同一个 `vLLM 671B` 服务池，Pod 属于平台组，业务组账单为 0！</text>
  <text x="56" y="184" class="mono">• 痛点 2：若按总 Token 数平摊，1个 Output Token 消耗的显存带宽周期是 Cached Input 的 18倍</text>
  <text x="56" y="202" class="txt">• 结果：分账误差高达 42% ✕，且全买按需实例 (On-Demand) 闲置算力浪费高达 51%！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：OpenCost + 网关四档加权 Token 归因 + 60/25/15 三明治算力采购</text>
  <text x="56" y="272" class="mono">• 1. 网关采集 `(Cached=0.1, Uncached=1.0, Think=3.5, Output=4.0)` 加权成本单元</text>
  <text x="56" y="292" class="mono">• 2. 结合 DCGM 活跃 SM 周期剥离夜间未分配闲置费 (Unallocated Idle)，分账误差 &lt;1.2%！</text>
  <text x="56" y="312" class="txt">• 3. 采购组合：60% 1年预留/PTU 底座 + 25% 弹性按需 + 15% Spot 跑批，综合单价省 54.6%！</text>

  <!-- Right Panel: 4 Enterprise AI FinOps & GPU Capacity Procurement Architectures -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业 GPU 算力采购与 FinOps 分账方案对标 (128x H200 规模)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 100% 按需实例 (On-Demand) + 部门独占烟囱集群</text>
  <text x="638" y="158" class="mono">• 算力利用率仅 34% ✕ | 部门间无法削峰填谷 | 月度总账单 $378,000/月 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 100% 3年期全额预留 (All-In 3Y RI / PTU) + 简单按请求数平摊</text>
  <text x="638" y="214" class="mono">• 分账误差高达 42.0% ✕ | 峰值过载触发 429 或低谷期锁死闲置 | $264,000/月</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 商业云成本管理工具 (Kubecost Enterprise / CloudHealth / Vantage)</text>
  <text x="638" y="270" class="mono">• K8s 节点与 MIG 级核算 | 分账误差 8.5% | 月度总账单 $228,000/月 ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: OpenCost + 网关四档 Token 归因 + 60/25/15 (RI+PAYGO+Spot) 潮汐回填 (🏆)</text>
  <text x="638" y="326" class="mono">• 分账误差压至 1.1% 🏆 | 集群利用率 86.5% 🏆 | 月度总账单 $171,600/月 (年省 $248万)!</text>

  <!-- Bottom Panel: End-to-End 3-Layer Capacity Portfolio & FOCUS 1.1 FinOps Ledger -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端三明治算力组合 (60% RI + 25% Burst + 15% Spot) 与 FOCUS 1.1 精准分账流水线</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 60% 稳态基座 (1Y RI / PTU)</text>
  <text x="56" y="464" class="mono">• 按全天 P35 基线流量采购 1 年期</text>
  <text x="56" y="484" class="mono">  预留实例或 Azure PTU (享 42% 折扣)</text>
  <text x="56" y="504" class="mono">• 白天 100% 跑在线交互核心流量</text>
  <text x="56" y="524" class="mono">• 凌晨低谷自动切换跑离线微调/蒸馏</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">基座算力 24 小时满载，零空置浪费！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 25% 洪峰弹性层 (Serverless PAYGO)</text>
  <text x="332" y="464" class="mono">• 吸收早 10 点与下午 3 点业务波峰</text>
  <text x="332" y="484" class="mono">• 当基座 KV 水位 &gt;82% 时由网关</text>
  <text x="332" y="504" class="mono">  平滑溢出至云端 Serverless API</text>
  <text x="332" y="524" class="mono">• 按实际消耗 Token 秒级付费</text>
  <text x="332" y="550" class="txt" fill="#34d399">免除为峰值买单的 40% 闲置显卡税！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 15% 竞价实例层 (Spot + 断点续传)</text>
  <text x="620" y="464" class="mono">• 采购 3 折 Spot GPU 专门跑可中断</text>
  <text x="620" y="484" class="mono">  Embedding 构建、离线批处理与评测</text>
  <text x="620" y="504" class="mono">• 配合 Ray Data 每 2 分钟落盘分片</text>
  <text x="620" y="524" class="mono">  收到回收通知 30 秒内无损迁移</text>
  <text x="620" y="550" class="txt" fill="#fde68a">离线批处理单价直接打 2.8 折！</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ FOCUS 1.1 标准财务对账大盘</text>
  <text x="908" y="464" class="mono">• 统一对齐 FinOps 基金会 FOCUS 1.1</text>
  <text x="908" y="484" class="mono">  云账单与内部 GPU 折旧电费台账</text>
  <text x="908" y="504" class="mono">• 自动出具有机结合业务 KPI 的</text>
  <text x="908" y="524" class="mono">  《单笔成单 AI 边际成本报表》</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">CFO 财务审计对账误差压至 1.1%！</text>
</svg>
