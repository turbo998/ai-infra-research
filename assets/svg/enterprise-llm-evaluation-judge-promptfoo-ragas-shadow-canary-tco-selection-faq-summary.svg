<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级大模型评测体系 (LLM-as-a-Judge)、CI/CD 黄金门禁与影子灰度发布选型 (#437)</text>
  <text x="28" y="58" class="sub">为什么让大模型直接按“1~5分”给回答打分的人类一致性只有 0.54？为什么改一行 System Prompt 必须先跑 Promptfoo 二元门禁 + 影子回放？</text>

  <!-- Left Panel: Likert 1-5 Scale Trap vs Atomic Binary Rubric + Position Swap -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 大模型当裁判 (LLM-as-a-Judge) 三大偏见：打分虚高、位置偏见、啰嗦偏见</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 失败做法：让 GPT-4o 裁判按“1~5分”综合打分 (Uncalibrated Likert 1-5)</text>
  <text x="56" y="164" class="mono">• 打分坍缩：88% 的回答都被打成 4 分，根本无法区分版本好坏 (人类相关系数仅 0.54 ✕)</text>
  <text x="56" y="184" class="mono">• 啰嗦与位置偏见：把两篇回答 A/B 调换顺序，大模型有 31% 的概率改判长篇废话获胜！</text>
  <text x="56" y="202" class="txt">• 账单爆炸：每月跑 500 万条回归与线上评测，全调 GPT-4o 月烧 $95,000/月！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：确定性代码断言 + 原子二元量表 (Yes/No) + 14B 专用裁判 + 双投消偏</text>
  <text x="56" y="272" class="mono">• 1. 拆解为 4~6 个二元原子是非题 (如“是否包含退款链接？Yes/No”)，人类一致性飙至 0.896！</text>
  <text x="56" y="292" class="mono">• 2. 先跑 0 成本代码/正则/Schema 断言 + DeBERTa NLI 事实蕴含快筛 (滤除 75% 样本)</text>
  <text x="56" y="312" class="txt">• 3. 剩余 25% 交由自建 Prometheus-2 / JudgeLM-14B (vLLM) 正反双投消偏，月省 95.2%！</text>

  <!-- Right Panel: 4 LLM Evaluation & Release Gate Architectures Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业大模型评测与发布门禁方案对标 (500 万条评测/月)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fde68a">Tier 1: 人工 Excel 抽检 50 条“凭感觉 (Vibe Check)”直接上线</text>
  <text x="638" y="158" class="mono">• 覆盖率 &lt;0.1% | 线上坏例逃逸率高达 18.4% ✕ | 发版周期长达 5 天 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fca5a5">Tier 2: 100% 调商业顶配 API 跑 1~5 分制打分 (Uncalibrated Frontier Judge)</text>
  <text x="638" y="214" class="mono">• 人类一致性 Cohen's Kappa 仅 0.54 ✕ | 位置偏见 31% | 月烧 $95,000/月 ✕</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 开源评测框架 (Promptfoo / DeepEval / Ragas / Azure AI Eval SDK) 调云 API</text>
  <text x="638" y="270" class="mono">• 二元量表 + RAG 三元组指标 | 人类一致性 0.86 | 月度成本 $22,500/月 ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: CI/CD 代码断言 + NLI + 自建 14B 专用裁判双投 + 影子流量回放 (🏆旗舰)</text>
  <text x="638" y="326" class="mono">• 人类一致性达 0.896 🏆 | 坏例逃逸 &lt;0.4% 🏆 | 15分钟自动发版 | 仅 $4,560/月 (-95.2%)!</text>

  <!-- Bottom Panel: End-to-End CI/CD Release Gate & Shadow Replay Flywheel -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端 LLMOps 持续集成门禁与生产影子回放 (Shadow Replay) 架构</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① Git PR 触发黄金集门禁 (Promptfoo)</text>
  <text x="56" y="464" class="mono">• 每次修改 Prompt 或切换新底座模型</text>
  <text x="56" y="484" class="mono">• 自动跑 1,000 条历史黄金回归集</text>
  <text x="56" y="504" class="mono">  (含过往全部线上 P1 坏例)</text>
  <text x="56" y="524" class="mono">• 准确率退化 &gt;1% 自动红灯拦截合并</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">杜绝“改好一个 Bug、搞崩十个老场景”</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 级联评测漏斗 (省 95.2% 评测费)</text>
  <text x="332" y="464" class="mono">• L1 (0成本)：JSON Schema / 正则 /</text>
  <text x="332" y="484" class="mono">  SQL AST / 违禁词确定性代码断言</text>
  <text x="332" y="504" class="mono">• L2 (2ms)：DeBERTa NLI 原子事实蕴含</text>
  <text x="332" y="524" class="mono">• L3：14B 裁判跑 (A,B) 与 (B,A) 双投</text>
  <text x="332" y="550" class="txt" fill="#34d399">彻底消除位置偏见与长度偏见！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 生产影子流量镜像 (Shadow Replay)</text>
  <text x="620" y="464" class="mono">• 新模型 (如 Qwen3 / R1) 上线前：</text>
  <text x="620" y="484" class="mono">• AI 网关异步复制 5% 真实线上请求</text>
  <text x="620" y="504" class="mono">  发往影子池（结果不返回给用户！）</text>
  <text x="620" y="524" class="mono">• 自动对比线上主模型与影子模型得分</text>
  <text x="620" y="550" class="txt" fill="#fde68a">零用户风险完成新模型真实流量验收</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 金丝雀灰度与自动回滚 (Canary)</text>
  <text x="908" y="464" class="mono">• 影子验收通过后按 `1% -&gt; 10% -&gt;`</text>
  <text x="908" y="484" class="mono">  `50% -&gt; 100%` 渐进切流</text>
  <text x="908" y="504" class="mono">• 实时监控用户点踩率与 TTFT P99</text>
  <text x="908" y="524" class="mono">• 异常飙升 &gt;1.5% 在 5 秒内自动切回</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">线上严重坏例逃逸率压至 &lt;0.4%！</text>
</svg>
