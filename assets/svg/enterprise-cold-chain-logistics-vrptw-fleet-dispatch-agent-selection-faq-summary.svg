<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad426" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad426" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad426)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级医药与生鲜冷链物流配送（Cold-Chain VRPTW）、热惯性预测与断链动态救援 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">650辆多温区冷藏车 / 日均1.8万个医院商超点 · 人工划片+事后导USB温度计 vs. 纯LLM直接排500点路线 vs. 静态VRP+超温短信 vs. 动态VRPTW+热惯性预测救援</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">98.4% 准点 · 0% 断链货损</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 人工固定划片 + 事后导 USB</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">到店卸货才发现冷机坏了，整车疫苗报废</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 经验划片空驶率高达 29.0%，晚点率 21.5%</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 事后插 USB 导出温度才发现超温，货损 3.4%</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">收货时间窗准点率: 78.5% ✕</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">GSP/FDA 断链货损率: 3.4% ✕</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">车辆空驶里程占比: 29.0% ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月油费与断链货损成本: $360,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统冷链车队，医药拒收与赔偿风险极高</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 纯 Prompt 让 LLM 排 500 点路线</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">文本模型解不出 NP-Hard 路径，全城画蜘蛛网</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 自回归文本生成排出的路线来回折返绕路</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 44% 错过商超/医院预约月台时间窗，货损 4.8%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">收货时间窗准点率: 56.0% (倒退 ✕)</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">GSP/FDA 断链货损率: 4.8% ✕</text>
  <text x="346" y="358" fill="#fca5a5" font-size="12.5">车辆空驶里程占比: 38.5% ✕</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月油费与断链货损成本: $520,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让语言模型直接充当TSP/VRPTW路径求解器</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 静态早晨 VRP + 超 +8°C 报警</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">等厢温超 8°C 再发短信，堵在高架上已救不及</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 早晨静态路线遇突发冷机故障无法动态就近过驳</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 阈值报警滞后 40 分钟，仍有 1.6% 药品超温拒收</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">收货时间窗准点率: 88.2%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">GSP/FDA 断链货损率: 1.6% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">车辆空驶里程占比: 18.4%</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月油费与断链货损成本: $165,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：普通干货配送，难以保障高价值生物制剂零断链</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad426)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 动态VRPTW+热惯性救援 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">提前45分钟预测升温 + 动态最近冷车接驳</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• LLM 解析医院卸货特殊备注，OR-Tools 求多温区 VRPTW</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 监测压缩机排气压力提前45m预警，动态重算救援接驳点</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">收货时间窗准点率: 98.4% 🏆 (+19.9pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">GSP/FDA 断链货损率: 0.0% 🏆 (提前45m接驳)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">车辆空驶里程占比: 11.2% 🏆 (-17.8pts)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月油费与运营总成本: $52,000 (-85.6% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：医药GSP冷链、商超生鲜、餐饮中央厨房车队</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 医药与生鲜冷链架构师铁律（LLM Dock-Rule Compiler + Dynamic OR-Tools VRPTW + Thermal-Inertia Rescue）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 严禁让大模型直接排几百个配送点的行车顺序：LLM 只负责将客户非结构化收货要求（限高/液压尾板/禁行时段）编译为 OR-Tools VRPTW 约束。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 冷链告警绝不能等厢温突破 +8°C：必须基于制冷机压缩机遥测与车厢保温热惯性方程预测“剩余安全保温时间(TTF)”，自动触发途中冷车接驳 · Provenance: synthetic + anonymized_reported</text>
</svg>
