<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#662 企业多云与混合算力联邦调度 (Kueue MultiKueue)：65% 折扣 Spot 竞价卡套利与 15 秒优雅排空指南</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">Multi-Cloud GPU Federation &amp; Spot Arbitrage: On-Prem + Azure/AWS/GCP · Stateless Prefill &amp; Batch on Spot (-54.8% Cost, 99.92% SLA)</text>

  <!-- Left: Why Single-Cloud On-Demand Hits Quota Walls & High Bills -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FDE68A" font-size="15" font-weight="700">① 为什么企业不能只绑死单一可用区的按需 (On-Demand) 卡？</text>

  <rect x="40" y="150" width="333" height="142" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 单一云区 On-Demand 的两大痛点</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">1. 区域性算力售罄 (`Stockout`)：大促或新品发布需临时</text>
  <text x="52" y="214" fill="#CBD5E1" font-size="12">   扩容 `64× H200` 时，单一可用区经常报 `InsufficientCapacity`！</text>
  <text x="52" y="234" fill="#F1F5F9" font-size="12">2. 按需单价昂贵 (`$3.20~3.80 / GPU·h`)，而同区域空闲的</text>
  <text x="52" y="254" fill="#FCA5A5" font-size="12" font-weight="700">   Spot / 抢占式实例仅需 **`$1.12 / GPU·h (3.5 折 / 省 65%)`**！</text>
  <text x="52" y="274" fill="#94A3B8" font-size="11">   但传统架构不敢用 Spot，怕提前 30 秒回收通知直接打断在线生成！</text>

  <rect x="40" y="304" width="333" height="174" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="326" fill="#6EE7B7" font-size="13" font-weight="700">✅ 哪些负载天生适合跑在 3.5 折 Spot GPU 上？</text>
  <text x="52" y="348" fill="#F8FAFC" font-size="12">1. **无状态 Prefill 扩容池**：Prefill 单请求仅耗时 `180ms`；</text>
  <text x="52" y="366" fill="#D1FAE5" font-size="11">   收到云平台 `30s SIGTERM` 抢占预告后，网关立即摘流，</text>
  <text x="52" y="384" fill="#6EE7B7" font-size="11" font-weight="700">   在途 Prefill 在 `0.5s` 内 100% 算完交接给稳态 Decode 池，0 丢单！</text>
  <text x="52" y="406" fill="#F8FAFC" font-size="12">2. **夜间 T+1 批处理 (`#648`) 与 `veRL GRPO` Rollout (`#639`)**：</text>
  <text x="52" y="424" fill="#D1FAE5" font-size="11">   配合 `2.4s` 异步 Checkpoint / 1000 条微提交，抢占损失 `&lt;0.5%`！</text>
  <text x="52" y="446" fill="#FCA5A5" font-size="12" font-weight="700">⛔ 红线：有状态长连接 `Decode 池` 必须跑在自建或保底节点！</text>

  <!-- Center: Kueue MultiKueue + 15s Spot Preemption Hedging -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② Kueue MultiKueue 跨云联邦与 15 秒优雅排空机制</text>

  <rect x="423" y="150" width="354" height="152" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="435" y="172" fill="#38BDF8" font-size="13" font-weight="700">🌐 多云库存水位对冲公式 (Multi-AZ Diversification)</text>
  <text x="435" y="194" fill="#F8FAFC" font-size="12" font-weight="700">P(Simultaneous_Preempt) = p_az1 × p_az2 × p_az3</text>
  <text x="435" y="216" fill="#CBD5E1" font-size="12">· 单可用区 Spot 小时级回收概率 `p ≈ 4.5%`</text>
  <text x="435" y="236" fill="#D1FAE5" font-size="12">· 若将 64 张弹性 Spot 卡均匀打散在 **3 个不相关可用区/双云**</text>
  <text x="435" y="256" fill="#6EE7B7" font-size="12" font-weight="700">  (`Azure EastUS2 + CentralUS + AWS us-east-2`)：</text>
  <text x="435" y="276" fill="#6EE7B7" font-size="12" font-weight="700">  三区同时被回收的概率降至 `0.045^3 = 0.009%` (可用率 99.991%)！</text>

  <rect x="423" y="314" width="354" height="164" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="435" y="336" fill="#6EE7B7" font-size="13" font-weight="700">⚡ 收到 Spot 回收通知 (30s 倒计时) 的 15 秒标准动作</text>
  <text x="435" y="358" fill="#F8FAFC" font-size="12">· `t = 0.0s`: `aws-node-termination-handler` / Azure IMDS</text>
  <text x="435" y="376" fill="#CBD5E1" font-size="11">  捕获抢占事件，立即向网关发送 `DRAINING` 摘除新请求</text>
  <text x="435" y="396" fill="#F8FAFC" font-size="12">· `t = 0.1s`: `MultiKueue` 立即在备选可用区拉起新 Spot/按需 Pod</text>
  <text x="435" y="414" fill="#CBD5E1" font-size="11">  (`#634 Nydus P2P + GDS` 在 **`14.2 秒`** 内完成冷启动顶替上线！)</text>
  <text x="435" y="434" fill="#F8FAFC" font-size="12">· `t = 0.5s ~ 8.0s`: 本节点在途请求优雅跑完或刷入 3FS 快照</text>
  <text x="435" y="456" fill="#6EE7B7" font-size="12" font-weight="700">· 结果：新节点在第 14.2s 就绪，旧节点在第 30s 销毁，全程无缝交接！</text>

  <!-- Right: Cost & Availability Comparison -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="829" y="136" fill="#38BDF8" font-size="15" font-weight="700">③ 128-GPU 弹性算力池四种采购调度策略对比</text>

  <rect x="827" y="150" width="333" height="74" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="839" y="170" fill="#FCA5A5" font-size="13" font-weight="700">1. 单云单可用区 100% On-Demand ($3.20 / GPU·h)</text>
  <text x="839" y="190" fill="#E2E8F0" font-size="12">· 月成本: **`$294,912 / 月`** | 扩容成功率: `78.5%` (常遇售罄)</text>
  <text x="839" y="208" fill="#FCA5A5" font-size="11">· 评价：最贵，且受制于单区域库存瓶颈</text>

  <rect x="827" y="234" width="333" height="74" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="839" y="254" fill="#FDE68A" font-size="13" font-weight="700">2. 单可用区裸跑 Spot (无 14.2s 预热与角色隔离)</text>
  <text x="839" y="274" fill="#E2E8F0" font-size="12">· 月成本: `$103,219 / 月` | 在线报错率: **`4.2%`** (Decode 被杀)</text>
  <text x="839" y="292" fill="#FDE68A" font-size="11">· 评价：省了钱但砸了在线 SLA 招牌</text>

  <rect x="827" y="318" width="333" height="74" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="839" y="338" fill="#38BDF8" font-size="13" font-weight="700">3. 1 年期云厂商包年预留实例 (1-Yr Reserved · $2.15/h)</text>
  <text x="839" y="358" fill="#E2E8F0" font-size="12">· 月成本: `$198,144 / 月` | 局限：低谷期空转无法退订，锁死卡型</text>

  <rect x="827" y="402" width="333" height="80" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="839" y="422" fill="#6EE7B7" font-size="13" font-weight="700">4. MultiKueue 跨三区 Spot (Prefill/批处理) + 保底 Decode</text>
  <text x="839" y="442" fill="#F8FAFC" font-size="12">· 综合折算单价: **`$1.45 / GPU·h (-54.7%)`** | 月成本 **`$133,632`**</text>
  <text x="839" y="460" fill="#6EE7B7" font-size="12" font-weight="700">· 扩容成功率 `99.92%` · 每年净省 `$193.5万` 且零厂商锁死！</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 多云联邦与 Spot 竞价套利铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 物理隔离有状态与无状态：有状态长连接 `Decode 池` 锁在自建或按需保底节点；无状态 `Prefill 扩容池`、批处理与 RL 采样大胆跑在 3.5 折 Spot 上；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 14.2 秒冷启动是玩转 Spot 的入场券：因为云平台抢占通知只有 30 秒，必须用 Nydus P2P + GDS 确保新节点在 15 秒内顶替就位，实现零中断换卡。</text>
</svg>
