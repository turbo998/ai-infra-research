<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad76" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad76" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad76)" rx="16"/>
  <rect x="24" y="20" width="1232" height="86" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="54" fill="url(#accentGrad76)" font-size="22" font-weight="800">Round 76 · 大模型强化学习后训练 (GRPO / RLVR) 架构选型 (verl vs Slime/AReaL) 一图流</text>
  <text x="44" y="84" fill="#94A3B8" font-size="14">128×H100 80GB 训练 70B 推理模型 (G=16, 32K Long-CoT) · 3D-HybridEngine 2.1s 重分片 + Partial Rollout 截断续生 (independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <g transform="translate(24, 124)">
    <!-- Tier 1 -->
    <rect x="0" y="0" width="296" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FCA5A5" font-size="15" font-weight="700">Tier 1 · 静态切卡 Ping-Pong ✕</text>
    <text x="16" y="56" fill="#CBD5E1" font-size="12.5">64卡采样与 64卡训练交替干等</text>
    <line x1="16" y1="70" x2="280" y2="70" stroke="#334155"/>
    <text x="16" y="98" fill="#94A3B8" font-size="12">长尾与切换空泡：</text>
    <text x="165" y="98" fill="#EF4444" font-size="15" font-weight="800">54.0% (过半空转 ✕)</text>
    <text x="16" y="128" fill="#94A3B8" font-size="12">每步权重同步耗时：</text>
    <text x="165" y="128" fill="#FCA5A5" font-size="14" font-weight="700">42.0 s (TCP拷贝 ✕)</text>
    <text x="16" y="158" fill="#94A3B8" font-size="12">端到端有效 MFU：</text>
    <text x="165" y="158" fill="#EF4444" font-size="15" font-weight="800">19.5% ✕</text>
    <text x="16" y="188" fill="#94A3B8" font-size="12">每小时训练样本数：</text>
    <text x="165" y="188" fill="#FCA5A5" font-size="14" font-weight="700">1,420 / hr (1.00x)</text>
    <text x="16" y="218" fill="#94A3B8" font-size="12">128卡年化等效成本：</text>
    <text x="165" y="218" fill="#EF4444" font-size="14" font-weight="800">$3,120,000 / yr ✕</text>
    <rect x="16" y="244" width="264" height="48" rx="8" fill="#2D1622"/>
    <text x="26" y="264" fill="#FDA4AF" font-size="11.5" font-weight="600">痛点：采样时训练卡 100% 闲置，训练时</text>
    <text x="26" y="282" fill="#FDA4AF" font-size="11.5">采样卡 100% 闲置，算力浪费超过一半！</text>

    <!-- Tier 2 -->
    <rect x="312" y="0" width="296" height="310" rx="12" fill="#1E2230" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="328" y="32" fill="#FCD34D" font-size="15" font-weight="700">Tier 2 · 朴素混部 + 主机重载 ✕</text>
    <text x="328" y="56" fill="#CBD5E1" font-size="12.5">卸载至 CPU 内存 + 死等 32K 最慢长尾</text>
    <line x1="328" y1="70" x2="592" y2="70" stroke="#334155"/>
    <text x="328" y="98" fill="#94A3B8" font-size="12">长尾与切换空泡：</text>
    <text x="477" y="98" fill="#EF4444" font-size="15" font-weight="800">41.5% (长尾木桶 ✕)</text>
    <text x="328" y="128" fill="#94A3B8" font-size="12">每步权重同步耗时：</text>
    <text x="477" y="128" fill="#FBBF24" font-size="14" font-weight="700">34.0 s (破 Graph ✕)</text>
    <text x="328" y="158" fill="#94A3B8" font-size="12">端到端有效 MFU：</text>
    <text x="477" y="158" fill="#FCD34D" font-size="14" font-weight="700">27.2%</text>
    <text x="328" y="188" fill="#94A3B8" font-size="12">每小时训练样本数：</text>
    <text x="477" y="188" fill="#FCD34D" font-size="14" font-weight="700">1,980 / hr (1.39x)</text>
    <text x="328" y="218" fill="#94A3B8" font-size="12">128卡年化等效成本：</text>
    <text x="477" y="218" fill="#FCD34D" font-size="14" font-weight="700">$2,580,000 / yr</text>
    <rect x="328" y="244" width="264" height="48" rx="8" fill="#2E2418"/>
    <text x="338" y="264" fill="#FDE68A" font-size="11.5" font-weight="600">痛点：PCIe 倒腾权重慢且重录 CUDA Graph，</text>
    <text x="338" y="282" fill="#FDE68A" font-size="11.5">90% 机器陪等最后 5% 的 32K 难题 140秒！</text>

    <!-- Tier 3 -->
    <rect x="624" y="0" width="296" height="310" rx="12" fill="#132A3E" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="640" y="32" fill="#7DD3FC" font-size="15" font-weight="700">Tier 3 · verl 3D-HybridEngine ✅</text>
    <text x="640" y="56" fill="#CBD5E1" font-size="12.5">分桶原位重分片 (2.1s) + VMM 保图休眠</text>
    <line x1="640" y1="70" x2="904" y2="70" stroke="#334155"/>
    <text x="640" y="98" fill="#94A3B8" font-size="12">长尾与切换空泡：</text>
    <text x="789" y="98" fill="#38BDF8" font-size="14" font-weight="700">22.8% (仅剩长尾)</text>
    <text x="640" y="128" fill="#94A3B8" font-size="12">每步权重同步耗时：</text>
    <text x="789" y="128" fill="#38BDF8" font-size="15" font-weight="800">2.1 s (快 16.2x ✅)</text>
    <text x="640" y="158" fill="#94A3B8" font-size="12">端到端有效 MFU：</text>
    <text x="789" y="158" fill="#38BDF8" font-size="15" font-weight="800">41.8% ✅</text>
    <text x="640" y="188" fill="#94A3B8" font-size="12">每小时训练样本数：</text>
    <text x="789" y="188" fill="#7DD3FC" font-size="14" font-weight="700">3,040 / hr (2.14x ✅)</text>
    <text x="640" y="218" fill="#94A3B8" font-size="12">128卡年化等效成本：</text>
    <text x="789" y="218" fill="#7DD3FC" font-size="14" font-weight="700">$1,960,000 / yr</text>
    <rect x="640" y="244" width="264" height="48" rx="8" fill="#0C2238"/>
    <text x="650" y="264" fill="#BAE6FD" font-size="11.5" font-weight="600">优势：中短序列同步 GRPO 黄金标配，零冗余</text>
    <text x="650" y="282" fill="#BAE6FD" font-size="11.5">原位完成 FSDP↔TP 转换且不破 CUDA Graph。</text>

    <!-- Tier 4 -->
    <rect x="936" y="0" width="296" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.2"/>
    <text x="952" y="32" fill="#6EE7B7" font-size="15" font-weight="800">Tier 4 · Slime / AReaL 异步流 🏆</text>
    <text x="952" y="56" fill="#D1FAE5" font-size="12.5">Partial Rollout 截断续生 + TIS 逐词校正</text>
    <line x1="952" y1="70" x2="1216" y2="70" stroke="#334155"/>
    <text x="952" y="98" fill="#A7F3D0" font-size="12">长尾与切换空泡：</text>
    <text x="1101" y="98" fill="#34D399" font-size="15" font-weight="800">4.8% (降 11.2x 🏆)</text>
    <text x="952" y="128" fill="#A7F3D0" font-size="12">每步权重同步耗时：</text>
    <text x="1101" y="128" fill="#34D399" font-size="15" font-weight="800">1.1 s (FP8 RDMA 🏆)</text>
    <text x="952" y="158" fill="#A7F3D0" font-size="12">端到端有效 MFU：</text>
    <text x="1101" y="158" fill="#34D399" font-size="15" font-weight="800">55.6% (+36.1pt 🏆)</text>
    <text x="952" y="188" fill="#A7F3D0" font-size="12">每小时训练样本数：</text>
    <text x="1101" y="188" fill="#6EE7B7" font-size="14" font-weight="800">4,050 / hr (2.85x 🏆)</text>
    <text x="952" y="218" fill="#A7F3D0" font-size="12">128卡年化等效成本：</text>
    <text x="1101" y="218" fill="#6EE7B7" font-size="13.5" font-weight="800">$1,480,000 (省$1.64M)</text>
    <rect x="952" y="244" width="264" height="48" rx="8" fill="#062019"/>
    <text x="962" y="264" fill="#A7F3D0" font-size="11.5" font-weight="700">终极形态：85% 水位截断发车，未完 32K 序列</text>
    <text x="962" y="282" fill="#A7F3D0" font-size="11.5">下轮命中 Prefix Cache 续写 + TIS 无损收敛</text>
  </g>

  <!-- Bottom Visual Comparison -->
  <rect x="24" y="454" width="1232" height="302" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="486" fill="#F8FAFC" font-size="16" font-weight="700">核心定量洞察：128 卡集群每小时训练样本吞吐 &amp; Partial Rollout 截断续生 + TIS 机制</text>

  <!-- Left Bar Chart -->
  <g transform="translate(44, 508)">
    <text x="0" y="20" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 1 静态切卡 Ping-Pong (1,420 prompts/hr · 54.0% 空泡 · MFU 19.5% ✕)</text>
    <rect x="0" y="28" width="189" height="22" rx="4" fill="#EF4444"/>

    <text x="0" y="76" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 2 朴素混部 + 主机内存重载 (1,980 prompts/hr · 41.5% 空泡 · 34s 权重倒腾 ✕)</text>
    <rect x="0" y="84" width="264" height="22" rx="4" fill="#F59E0B"/>

    <text x="0" y="132" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 3 verl 3D-HybridEngine 同卡混部 (3,040 prompts/hr · 2.1s 重分片 · MFU 41.8% ✅)</text>
    <rect x="0" y="140" width="405" height="22" rx="4" fill="#38BDF8"/>

    <text x="0" y="188" fill="#6EE7B7" font-size="12.5" font-weight="700">Tier 4 Slime / AReaL 异步流 + Partial Rollout + TIS (4,050 prompts/hr · 4.8% 空泡 · MFU 55.6% 🏆)</text>
    <rect x="0" y="196" width="540" height="22" rx="4" fill="#10B981"/>
  </g>

  <!-- Right Architecture Box -->
  <g transform="translate(650, 504)">
    <rect x="0" y="0" width="584" height="232" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="18" y="28" fill="#38BDF8" font-size="14" font-weight="700">第一性原理：两大技术彻底消灭“权重切换税”与“32K 长尾木桶”</text>
    <text x="18" y="56" fill="#E2E8F0" font-size="12.5">① verl 3D-HybridEngine 分桶原位重分片 (34s → 2.1s)：</text>
    <text x="32" y="76" fill="#94A3B8" font-size="12">以 512MB 微桶流式完成 FSDP↔TP 原位拼装，配合 CuMemAllocator 卸载物理显存但保留</text>
    <text x="32" y="94" fill="#94A3B8" font-size="12">虚拟指针，0 秒直接复用 SGLang/vLLM 已录制的 CUDA Graph！</text>
    <text x="18" y="124" fill="#6EE7B7" font-size="12.5">② Slime / AReaL 85% 水位 Partial Rollout 截断续生 (空泡 22.8% → 4.8%)：</text>
    <text x="32" y="144" fill="#94A3B8" font-size="12">85% 序列完成后立即发车训练；未完成的 15% 长序列冻结前 10K 词，下一轮命中</text>
    <text x="32" y="162" fill="#94A3B8" font-size="12">Prefix Cache 接着第 10,001 词往后续写，既不浪费算力又杜绝短答案偏置！</text>
    <text x="18" y="192" fill="#FCD34D" font-size="12.5">③ TIS 逐词重要性采样校正 (Token-Level Importance Sampling)：</text>
    <text x="32" y="212" fill="#94A3B8" font-size="12">按每个词生成时的真实旧策略概率比加权截断，保证跨步续写 100% 无损收敛！</text>
  </g>
</svg>
