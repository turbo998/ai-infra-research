<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#C084FC" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">大模型测试时计算 (Test-Time Compute / Reasoning Scaling) 选型：长思维链 vs. Best-of-N vs. PRM 树搜索</text>
  <text x="52" y="94" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="15">难度感知 Thinking Budget 路由 + 写时复制 (Copy-on-Write) KV Block Forking + PRM 死枝早剪 + 共识早退 (Early-Exit)</text>

  <!-- Left: Sequential vs Parallel TTC Tradeoffs -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么无节制 Reasoning 会同时击穿延迟与 KV 显存？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 A：单链超长 CoT 过度思考 (Overthinking, Tier 1)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 简单题也动辄吐出 18,400 个 &lt;think&gt; Token，严格受限于单序列 Decode 带宽</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 用户端到端等待长达 92.0 秒，且一条死胡同走到底无法自我纠偏（准确率 84.5%）</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 B：暴力并发 Best-of-16 全程跑满 (Tier 2/3)</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 虽把延迟压到 26.5s~34s（16 条并发吃满 GPU 算力），但单题吞噬 54,000~68,000 Tokens</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单请求峰值 KV Cache 高达 22.8~38.4 GB，高并发下立刻引发全局 KV 换出雪崩！</text>

  <!-- Right: Adaptive PRM + CoW KV Forking -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 企业级 Test-Time Compute 三大降本提速引擎 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 难度感知 Thinking Budget 路由 (Difficulty Router)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">60% 常规任务限定 `thinking_budget=1024, N=1`；仅对 40% 高难推理开启多分支搜索</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 写时复制 KV Block Forking (SGLang RadixAttention / vLLM Page Sharing)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">树搜索分叉时仅复制物理块指针（零显存拷贝），共享全部祖先推理步骤 KV Cache！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ PRM 过程奖励死枝早剪 + Majority Consensus 早退</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">每步推理用 1.5B PRM 打分砍掉垫底 50% 分支；一旦前 5 条分支达成一致立即终止剩余生成！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 四档 Test-Time Compute 推理扩展架构效能对比（DeepSeek-R1-70B / QwQ-32B · 4K Prompt）</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">测试时计算 (TTC) 架构</text>
  <text x="440" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单题均耗 Token</text>
  <text x="610" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单题峰值 KV 显存</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">端到端 P95 延迟</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">复杂任务准确率</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">千题求解成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 单链无界长 CoT (最高 24K Thinking, 无早退)</text>
  <text x="440" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">18,400</text>
  <text x="610" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">7.2 GB</text>
  <text x="790" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">92.0 sec ✕</text>
  <text x="950" y="524" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">84.5%</text>
  <text x="1110" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$48.0 / 1K</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 独立并发 Best-of-16 (无前缀/KV 共享)</text>
  <text x="440" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">68,000 ✕</text>
  <text x="610" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">38.4 GB ✕</text>
  <text x="790" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">34.0 sec</text>
  <text x="950" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">90.2%</text>
  <text x="1110" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$142.0 / 1K ✕</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: Radix 共享前缀 Best-of-16 + ORM 结果投票</text>
  <text x="440" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">54,000</text>
  <text x="610" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">22.8 GB</text>
  <text x="790" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">26.5 sec</text>
  <text x="950" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">90.5%</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$86.0 / 1K</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): 难度路由 + CoW KV Forking + PRM 剪枝早退</text>
  <text x="440" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">22,400 (-58.5%)</text>
  <text x="610" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">9.4 GB ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">14.8 sec ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">91.4% ✓</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$31.5 / 1K (-63%)</text>
</svg>
