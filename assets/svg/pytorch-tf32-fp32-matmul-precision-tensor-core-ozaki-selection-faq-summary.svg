<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 219 · PYTORCH FLOAT32_MATMUL_PRECISION (IEEE FP32 VS TF32 TENSOR CORE VS OZAKI BF16x3) FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800">PyTorch 2.x Default FP32 Trap: 38.2 TFLOPS SIMT CUDA Cores vs 365 TFLOPS TF32 Tensor Cores (9.55x)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: PyTorch Default allow_tf32=False Trap</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• PyTorch 1.12+ / 2.x defaults to `allow_tf32 = False` ("highest")!</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Standard 23-bit IEEE FP32 CANNOT run on Tensor Cores!</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Falls back to slow SIMT CUDA Cores (38.2 TFLOPS vs 495 peak) ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: FP16 16-bit accumulator overflows at 65,504 (`NaN`) ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Default FP32 Matmul: 38.2 TFLOPS | 89% GPU Idle!</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Stalls FP32 MoE Router Gates, Reward Heads &amp; DiT Conditioning MLPs</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3 &amp; 4: TF32 ('high') &amp; Ozaki 3xBF16 Emulation</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 3 (`set_float32_matmul_precision('high')`): Enables TF32!</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• 1-sign + 8-exp + 10-mantissa input into full 32-bit FP32 accumulator</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Surges from 38.2 TFLOPS to 365.0 TFLOPS (9.55x faster) ✅</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 4: BF16/FP8 backbone + TF32 Gate + cuBLAS BF16x3 Ozaki 23-bit</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">TF32 Throughput: 365 TFLOPS (9.55x) | Hybrid: 780 TFLOPS 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">One-Line PyTorch Fix Unlocks Hopper/Blackwell Tensor Cores for FP32</text>
</svg>
