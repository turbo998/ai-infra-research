<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级法务合同智能审查 (Legal Tech)、条款底线表与 Word 修订 (Redlining) 选型 (#431)</text>
  <text x="28" y="58" class="sub">为什么把 80 页合同按 512-Token 切片做 RAG 会漏掉 31% 的连带赔偿陷阱？为什么整段重写会被对方律师直接拒收？</text>

  <!-- Left Panel: 512-Token Chunking Trap & Whole-Paragraph Rewrite vs Legal AST + Minimal OpenXML Redline -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 法务合同 AI 两大翻车现场：512 切片割裂定义 vs. 整段推翻重写</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 翻车一 (512-Token 盲目切片) &amp; 翻车二 (让 LLM 整段重写条款)</text>
  <text x="56" y="164" class="mono">• 跨章节陷阱：第 14.2 条写“赔偿上限见第 1.18 条定义”，第 9.4 条又写“第 14.2 条不适用于知识产权”</text>
  <text x="56" y="184" class="mono">• 512 切片把三处割裂，导致“无限连带赔偿”风险漏判率高达 31.4%！</text>
  <text x="56" y="202" class="txt">• 整段重写：LLM 把对方 200 字条款全部标红删掉重写，对方律师直接拒收（采纳率仅 22%）！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：层级法务 AST 交叉引用图 + 三级 Playbook + 词级 OpenXML 修订</text>
  <text x="56" y="272" class="mono">• 1. 法务 AST 树：自动将全文 `“大写定义词”` 与 `“参见第 X.Y 条”` 展开拼入当前审查条款</text>
  <text x="56" y="292" class="mono">• 2. 三级底线表 (Preferred / Fallback / Walk-Away)：按交易金额自动匹配可退让条件</text>
  <text x="56" y="312" class="txt">• 3. 最小跨度修订 (`dmp` 词级 Diff -&gt; `&lt;w:ins&gt;/&lt;w:del&gt;`)：200 字条款只改 4 个词，律师采纳率 94.6%！</text>

  <!-- Right Panel: 4 Legal Contract Review Architectures Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业法务合同审查与 CLM 架构横向对标 (50,000 份合同/年)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 朴素 512-Token 切片 RAG + 自由文本审查意见</text>
  <text x="638" y="158" class="mono">• 跨条款毒丸漏检率 31.4% ✕ | 需律师手工进 Word 改字 | 采纳率 28.0% ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 128K 全文硬塞大模型 + 整段替换重写</text>
  <text x="638" y="214" class="mono">• 破坏原文档编号样式与对方措辞 | 律师采纳率仅 34.5% ✕ | 年度成本 $420,000/年</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 商业垂直法务 SaaS 插件 (Harvey / Ironclad / Spellbook Word Add-in)</text>
  <text x="638" y="270" class="mono">• 开箱即用 Word 插件体验好 | 按法务席位高价订阅 ($1,200~$2,400/人/年) | $310,000/年</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 法务 AST 交叉引用锚定 + 三级 Playbook + OpenXML 词级修订 (`w:ins/w:del` 🏆)</text>
  <text x="638" y="326" class="mono">• 毒丸召回率 98.8% 🏆 | 律师一键采纳率 94.6% 🏆 | 单份审查 18s | 仅 $58,000/年 (-86%)!</text>

  <!-- Bottom Panel: End-to-End 4-Stage Legal Redlining Pipeline -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端法务合同智能审查与无损 OpenXML 修订参考架构</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 层级 AST 与补充协议覆盖图</text>
  <text x="56" y="464" class="mono">• 解析 `.docx` 标题树 (Article-&gt;</text>
  <text x="56" y="484" class="mono">  Section-&gt;Subclause)</text>
  <text x="56" y="504" class="mono">• 自动把关联的 `Definitions` 与</text>
  <text x="56" y="524" class="mono">  `Amendment No.2` 覆盖条款绑入同包</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">根除跨章节豁免陷阱漏判！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 红黄绿三级 Playbook 对标</text>
  <text x="332" y="464" class="mono">• 🟢 首选立场 (Preferred): 12个月上限</text>
  <text x="332" y="484" class="mono">• 🟡 可退让底线 (Fallback): 24个月上限</text>
  <text x="332" y="504" class="mono">• 🔴 绝对红线 (Walk-Away): 无限责任</text>
  <text x="332" y="524" class="mono">  (自动触发法务总监升级审批流)</text>
  <text x="332" y="550" class="txt" fill="#34d399">100% 遵循集团标准法务口径</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 词级最小跨度修订 (Surgical Diff)</text>
  <text x="620" y="464" class="mono">• 严禁重写整段！LLM 只输出目标句</text>
  <text x="620" y="484" class="mono">• 用 `diff-match-patch` 算出词级差异：</text>
  <text x="620" y="504" class="mono">  将 `&lt;w:del&gt;36个月&lt;/w:del&gt;` 替换为</text>
  <text x="620" y="524" class="mono">  `&lt;w:ins&gt;12个月&lt;/w:ins&gt;`</text>
  <text x="620" y="550" class="txt" fill="#fde68a">100% 保留原 Word 字体、编号与样式</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 双视角批注气泡 (`w:comment`)</text>
  <text x="908" y="464" class="mono">• 对外版 `.docx`：批注写明温和商业</text>
  <text x="908" y="484" class="mono">  谈判理由（可直接发给客户/供应商）</text>
  <text x="908" y="504" class="mono">• 对内版风险卡：标明触发哪条集团</text>
  <text x="908" y="524" class="mono">  底线及法务审批人</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">单份合同初审从 2.5 小时缩至 18 秒！</text>
</svg>
