<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg625" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr625" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg625)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr625)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">🏆 #625 里程碑：智算网络全栈圣经 — Scale-Up (NVLink) vs. Scale-Out (IB/RoCEv2)、GPUDirect RDMA 与 busbw 验收</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Milestone #625: NVLink 4/5 &amp; NVL72 vs. InfiniBand/RoCEv2, GPUDirect RDMA PIX Path, PFC+ECN+DCQCN Watermarks, Rail+PXN &amp; algbw/busbw Math</text>

  <!-- Left: Scale-Up vs Scale-Out Hierarchy -->
  <rect x="48" y="120" width="356" height="330" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="66" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">① Scale-Up vs. Scale-Out 物理带宽与延迟量级</text>
  <rect x="64" y="162" width="324" height="128" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="76" y="184" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Scale-Up 超低延迟域 (跑 TP / 高密 EP)</text>
  <text x="76" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• H100/H200 NVLink 4: 900 GB/s 双向 · ~0.6 μs</text>
  <text x="76" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• B200/GB200 NVLink 5: 1,800 GB/s 双向 · ~0.5 μs</text>
  <text x="76" y="246" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• NVL72 机柜铜背板: 72卡全互连 130 TB/s 总带宽</text>
  <text x="76" y="268" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 对比 PCIe Gen5 x16 (64 GB/s): 快 14x ~ 28x！</text>

  <rect x="64" y="302" width="324" height="132" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="76" y="324" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Scale-Out 跨机 RDMA 域 (跑 DP/PP/跨机EP/PD)</text>
  <text x="76" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 400G IB NDR / RoCEv2: 50 GB/s 单向 · 1.5~3.5 μs</text>
  <text x="76" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 800G IB XDR / Spectrum-X: 100 GB/s 单向</text>
  <text x="76" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 8轨聚合 (8×400G/节点): 400 GB/s 节点出口</text>
  <text x="76" y="408" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 比机内 NVLink 慢 18x~36x (严禁跨机跑大 TP!)</text>

  <!-- Center: GPUDirect RDMA Zero-Copy vs ACS Trap -->
  <rect x="420" y="120" width="360" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="438" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">② GPUDirect RDMA 零拷贝 vs. PCIe ACS 掉速</text>
  <rect x="436" y="162" width="328" height="128" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="448" y="184" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="700">❌ 未开 nvidia-peermem 或 PCIe ACS=On (SYS)</text>
  <text x="448" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 数据被迫绕行: GPU HBM ➔ CPU Root Complex</text>
  <text x="448" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 跨 UPI/QPI 总线 ➔ Host DRAM Bounce Buffer ➔ NIC</text>
  <text x="448" y="246" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 400G 网卡实测 busbw 暴跌至 14.2 GB/s (28.4%)</text>
  <text x="448" y="268" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 千卡训练/MoE 推理有效 MFU 直接腰斩 45%！</text>

  <rect x="436" y="302" width="328" height="132" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="448" y="324" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">✅ GPUDirect RDMA + PCIe Switch PIX 直通</text>
  <text x="448" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• GPU BAR1 显存地址直接暴露给同 PCIe 树网卡</text>
  <text x="448" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• GPU HBM ⟷ PCIe Gen5 Switch (PIX) ⟷ CX-7 NIC</text>
  <text x="448" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 0% CPU 介入 · 0 字节主机内存拷贝</text>
  <text x="448" y="408" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 实测 busbw 达 47.8 GB/s (95.6% 线速 · 提速 3.37x)</text>

  <!-- Right: Lossless PFC+ECN+DCQCN + Rail-Optimized + busbw -->
  <rect x="796" y="120" width="356" height="330" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="814" y="148" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">③ RoCEv2 无损水线 · Rail 拓扑与 busbw 公式</text>
  <rect x="812" y="162" width="324" height="128" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="824" y="184" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">PFC + ECN + DCQCN 三阶防风暴法则</text>
  <text x="824" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 先降速: ECN K_min=150KB, K_max=1.5MB 提前打标</text>
  <text x="824" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 后刹停: PFC XOFF Headroom ≥ 2·RTT·BW + 2·MTU</text>
  <text x="824" y="246" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 防死锁: 交换机硬件 PFC Watchdog (200ms 自动排空)</text>
  <text x="824" y="268" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 配合 DLB / Spectrum-X 喷洒消除 ECMP 碰撞</text>

  <rect x="812" y="302" width="324" height="132" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="824" y="324" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Rail-Optimized + PXN 与 busbw 黄金换算</text>
  <text x="824" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 同号卡直连同 Rail Leaf + PXN 机内 NVLink 借道</text>
  <text x="824" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 省去 56.2% 跨层长距光模块，92% 流量一跳直达</text>
  <text x="824" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• AllReduce: busbw = algbw × 2(N-1)/N</text>
  <text x="824" y="408" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• AllGather / ReduceScatter / A2A: algbw × (N-1)/N</text>

  <!-- Bottom Summary Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #625 智算网络里程碑核心指标 (512-GPU 集群 · 8×400G Multi-Rail)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• GPUDirect RDMA (PIX) + ECN/DCQCN + DLB/PXN: 跨机 AllReduce busbw 从 14.2 GB/s 跃升至 47.8 GB/s (95.6% 线速 · 提速 3.37x)</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• Rail-Optimized 拓扑较传统三层 Fat-Tree 节省 56.2% 光模块 CapEx ($142万) · PFC 死锁事故率从 12.5% 降至 0.0%</text>
</svg>
