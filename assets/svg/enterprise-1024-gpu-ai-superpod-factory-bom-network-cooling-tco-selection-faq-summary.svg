<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">第 475 篇里程碑：千卡级企业智算中心 (1,024-GPU AI SuperPod) BOM 清单与三年 TCO 总蓝图 (#475)</text>
  <text x="28" y="58" class="sub">一图算清 128 台 8 卡节点 + 48 台 64 口 400G 交换机 + 超融合 3FS 存储 + 1.81 MW 冷板液冷机房，三年立省 $2,800 万 ($0.095/1M)</text>

  <!-- Left Panel: Exact 1,024-GPU SuperPod Physical Architecture & BOM -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 千卡智算中心 (1,024 GPUs / 128 台节点) 硬件 BOM 精确手算清单</text>

  <rect x="42" y="120" width="524" height="212" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="144" class="mono">• 算力层 (73.5% TCO): 128 台 8x H200/B200 节点 (分为 4 个 32 机 SU 单元)</text>
  <text x="56" y="168" class="mono">• 网络层 (9.8% TCO): 2 层 1:1 无收敛 8-Rail Fat-Tree (64口 400G 交换机):</text>
  <text x="56" y="188" class="mono">  - Leaf 交换机: 1024 下行口 / 32 = 32 台 Leaf (每 Rail 4 台，直连 32 机)</text>
  <text x="56" y="208" class="mono">  - Spine 交换机: 1024 上行口 / 64 = 16 台 Spine -&gt; 合计 48 台交换机！</text>
  <text x="56" y="228" class="mono">  - 线缆: 1,024 根柜内 DAC/ACC 铜缆 + 2,048 个 LPO 线性直驱光模块</text>
  <text x="56" y="250" class="mono">• 存储层 (4.2% TCO): 复用每机 8 块本地 NVMe 构建 3FS 超融合池 (3.5 TB/s)</text>
  <text x="56" y="272" class="mono">• 液冷机房 (8.6% TCO): 32 个 50kW 冷板液冷柜 (每柜 4 台节点)，PUE=1.13，</text>
  <text x="56" y="292" class="mono">  总 IT 功率 1.60 MW，加上液冷后总市电负荷仅 1.81 MW (冷却水 1,835 LPM)！</text>
  <text x="56" y="316" class="txt" font-weight="700" fill="#34d399">🏆 训推潮汐共池将千卡集群全天有效利用率拉升至 94.2%，成本降至 $0.095/1M！</text>

  <!-- Right Panel: 4 SuperPod Design Tiers Comparison -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种千卡智算中心建设方案三年总拥有成本 (3-Year TCO) 对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 拼凑式建群 (2:1 收敛网 + 20kW 风冷柜 + 独立 NAS + 训推物理隔离)</text>
  <text x="638" y="158" class="mono">• 3年TCO: $74.8M ✕ | 有效利用率: 41.0% ✕ | 总功耗: 2.48 MW | $0.42/1M</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 传统厂商标准交钥匙方案 (IB NDR + 独立 Lustre 存储柜 + 背板风冷)</text>
  <text x="638" y="214" class="mono">• 3年TCO: $62.4M | 有效利用率: 72.5% | 总功耗: 2.12 MW | $0.21/1M</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 8-Rail RoCEv2 (DLB/PXN + DAC/LPO) + 冷板液冷 + 超融合 3FS</text>
  <text x="638" y="270" class="mono">• 3年TCO: $49.2M ✓ | 有效利用率: 89.4% ✓ | 总功耗: 1.84 MW | $0.12/1M</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 主权 AI 工厂全栈协同 (训推潮汐共池 + 8-Rail LPO + 3FS + 液冷) (🏆)</text>
  <text x="638" y="326" class="mono">• 3年TCO: $46.8M (-$28M 🏆) | 利用率: 94.2% 🏆 | 1.81 MW | $0.095/1M 🏆</text>

  <!-- Bottom Panel: 3-Pillar SuperPod Sizing Formulas -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 千卡集群三大核心基础设施手算公式 (交换机台数 × 机柜液冷电费 × 训推潮汐 ROI)</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 2层无收敛 Fat-Tree 交换机台数</text>
  <text x="58" y="464" class="mono">• 给定总网卡数 P_nic = 1,024，交换机端口 k=64：</text>
  <text x="58" y="484" class="mono">  N_leaf  = P_nic / (k / 2) = 1024 / 32 = 32 台</text>
  <text x="58" y="504" class="mono">  N_spine = P_nic / k       = 1024 / 64 = 16 台</text>
  <text x="58" y="524" class="mono">  N_total = 32 + 16 = 48 台 64口 400G 交换机！</text>
  <text x="58" y="548" class="txt" fill="#6ee7b7">单层 64口 2-Tier 架构最多支持 k^2/2 = 2,048 卡！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: 液冷机房功率与三年电费节省公式</text>
  <text x="436" y="464" class="mono">• 单机满载 11.5 kW * 128 台 + 网络 = 1.60 MW</text>
  <text x="436" y="484" class="mono">• 风冷 (PUE 1.55): 2.48 MW -&gt; 3年电费 $5.86M</text>
  <text x="436" y="504" class="mono">• 液冷 (PUE 1.13): 1.81 MW -&gt; 3年电费 $4.28M</text>
  <text x="436" y="524" class="mono">• 冷却水总流量 Q = (1600*0.80*14.33)/10</text>
  <text x="436" y="544" class="mono">                 = 1,835 LPM (配 3 台 800kW CDU)</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: 千卡集群日产 Token 与回本周期</text>
  <text x="814" y="464" class="mono">• 白天 768 卡跑 PD 分离在线推理 + 256 卡跑训练</text>
  <text x="814" y="484" class="mono">• 夜间 256 卡保底在线 + 768 卡跑 GRPO/SFT/Batch</text>
  <text x="814" y="504" class="mono">• 日均有效产出: 4,500 亿 (450B) 黄金 Tokens/天！</text>
  <text x="814" y="524" class="mono">• 对比公有云 API ($0.58/1M) 每天节省 $21.8万，</text>
  <text x="814" y="544" class="mono">  整座千卡智算中心硬件投资仅需 7.2 个月回本！</text>
</svg>
