<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 60 · LLM PIPELINE PARALLELISM: 1F1B VS. ZERO-BUBBLE (ZB-V / B+W SPLIT) VS. DEEPSEEK DUALPIPE</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">大模型流水线并行 (PP) 气泡消除与双向计算通信重叠 (ZB-V / DualPipe) 选型一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 2,048×H800/H100 (PP=16 Stages × EP=64, M=32 Microbatches, 671B MoE / Dense 10T Tokens) · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="132" height="24" rx="6" fill="#7F1D1D"/>
  <text x="122" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 朴素 GPipe</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">全微批同步 (攒齐 M=32 再反向)</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">激活显存随微批数 M 线性爆炸</text>
  <text x="56" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 流水线阶段气泡: 31.9% ✕</text>
  <text x="56" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 跨节点暴露通信: 18.5% ✕</text>
  <text x="56" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 峰值激活显存: 64.0 GB/卡 (OOM ✕)</text>
  <text x="56" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 集群有效 MFU: 34.2% ✕</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 10T 预训练成本: $5.84M ✕</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⛔ 50.4% 时间空转且显存必爆</text>

  <!-- Tier 2 -->
  <rect x="346" y="148" width="288" height="310" rx="12" fill="#1F2437" stroke="#F97316" stroke-width="1.5"/>
  <rect x="362" y="164" width="144" height="24" rx="6" fill="#7C2D12"/>
  <text x="434" y="180" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 2 · 标准 1F1B</text>
  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">单向交错流水线 (Megatron 基线)</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">救了显存，但气泡与 MoE 通信仍裸露</text>
  <text x="362" y="272" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 流水线阶段气泡: 21.5% ✕</text>
  <text x="362" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 跨节点暴露通信: 13.3% (MoE 阻塞 ✕)</text>
  <text x="362" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 峰值激活显存: 32.0 GB/卡 (封顶P份 ✅)</text>
  <text x="362" y="350" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 集群有效 MFU: 41.5% ✕</text>
  <text x="362" y="376" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 10T 预训练成本: $4.82M ✕</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 34.8% 总空转，不适合大规模 MoE</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="168" height="24" rx="6" fill="#1E3A8A"/>
  <text x="752" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · Zero-Bubble ZB-V</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">V 型折叠拓扑 + B/W 反向拆分</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">拆出权重梯度 W 填平首尾全部气泡</text>
  <text x="668" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 流水线阶段气泡: 1.8% (零气泡 🏆)</text>
  <text x="668" y="298" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 跨节点暴露通信: 8.4% (单流限制)</text>
  <text x="668" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 峰值激活显存: 32.0 GB/卡 (全卡均衡 ✅)</text>
  <text x="668" y="350" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 集群有效 MFU: 54.8% ✅</text>
  <text x="668" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 10T 预训练成本: $3.65M ✅</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 70B~405B 纯稠密 Dense 模型最佳</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
  <text x="1066" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · DualPipe (MoE 推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">DeepSeek-V3 双向对称流水线</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">双向微批对冲 + 100% 隐藏 All-to-All</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 流水线阶段气泡: 2.4% 🏆</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 跨节点暴露通信: 0.8% (隐藏&gt;95% 🏆)</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 峰值激活显存: 34.0 GB/卡 ✅</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 集群有效 MFU: 58.4% (提速 1.41x 🏆)</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 成本: $3.42M (净省 $1.40M 🏆)</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 跨节点超大 MoE 预训练唯一黄金标准</text>

  <!-- Bottom Pipeline: B/W Split + DualPipe Cross-Stream Overlap Mechanics -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">⚡ 底层原理解析：为什么把 Backward 拆成 (B + W) 并配双向流 DualPipe 能砍掉 10.9 倍空转阻塞？</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#EC4899" stroke-width="1.2"/>
  <text x="82" y="562" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 反向传播解耦：关键路径 B vs. 自由填充块 W</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 传统 1F1B 把反向当成黑盒，上游被迫干等本地权重梯度</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 解耦后：对激活求导 B (dX = dY*W^T) 立即计算回传上游；</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  对权重求导 W (dW = X^T*dY) 延迟到任意气泡空隙执行！</text>
  <text x="82" y="668" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 反向波传导提速 2x，气泡从 31.9% 压至 1.8%</text>

  <!-- Step 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="468" y="562" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② ZB-V 折叠拓扑 vs. DualPipe 首尾双向发车</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• ZB-V：Stage 0 持有第 1 层与最后 1 层，前向反向呈 V 字折</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  返，消除各 Stage 激活显存不均（全卡均衡封顶 32GB）</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• DualPipe：从 Stage 0 与 Stage 15 同时相向发射对称微批流</text>
  <text x="468" y="668" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 每张卡随时拥有一正一反两个独立微批可供交错</text>

  <!-- Step 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="864" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 跨流计算-通信互锁：100% 掩盖 MoE All-to-All</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 当正向微批 A 在 RDMA 网卡上跑跨节点 Dispatch/Combine</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  All-to-All 通信时，GPU Tensor Core 同一时刻满载计算反向</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  微批 B 的零通信 W 算子或 Attention/MLP！</text>
  <text x="864" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 暴露通信从 18.5% 砸至 0.8%，MFU 冲上 58.4%</text>
</svg>
