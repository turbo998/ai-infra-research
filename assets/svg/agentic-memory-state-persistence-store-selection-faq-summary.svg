<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🧠 长周期 AI Agent 记忆系统与状态持久化选型一图流总结（全量塞入 vs. 滚动摘要 vs. 扁平向量 vs. 核心块+双时态图谱）</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">跨 100 轮历史会话 (累计 200,000 Tokens) · 静态事实召回 + 动态状态覆盖更新 + 跨会话时序推理 · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">Round 40 · Agentic Memory &amp; Graph</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 全量 200K 历史暴力塞入窗口</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">每轮重发 21万 Tokens · 新旧事实互相打架</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 静态事实召回率: <tspan fill="#34d399" font-weight="700">88.5%</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 状态更新覆盖准确率: <tspan fill="#f87171" font-weight="700">64.5% (迷失中间 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• LongMemEval 综合得分: <tspan fill="#fbbf24" font-weight="700">71.3%</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单轮 P95 首字延迟: <tspan fill="#f87171" font-weight="700">2,850.0 ms (极慢 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 单次提问 Token 成本: <tspan fill="#f87171" font-weight="700">$0.420 / 轮 (贵 84 倍 ✕)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么“长窗口=无限记忆”是伪命题？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">当用户改过 5 次预算，200K 历史里同时躺着</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">5 个过期数字！注意力头被旧噪音严重干扰</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">(准确率跌至 51%)，且每说一句话烧掉 $0.42！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#334155"/>
    <text x="16" y="27" fill="#f8fafc" font-size="14" font-weight="800">⬜ Tier 2: 滚动递归摘要压缩 (Summary)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">每 10 轮重写 1,500 词摘要 · 细节全丢</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 静态事实召回率: <tspan fill="#f87171" font-weight="700">52.0% (严重遗忘 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 状态更新覆盖准确率: <tspan fill="#fbbf24" font-weight="700">68.0%</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• LongMemEval 综合得分: <tspan fill="#f87171" font-weight="700">51.3% (全场垫底 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单轮 P95 首字延迟: <tspan fill="#34d399" font-weight="700">190.0 ms</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 单次提问 Token 成本: <tspan fill="#34d399" font-weight="700">$0.004 / 轮</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么递归摘要是“有损复印机”？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">把第 1 轮提到的服务器 IP、数据库版本号或</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">过敏药物连续重写 10 次摘要后，精确细节被</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">彻底概括抹平，跨会话时序推理仅 34.0%！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 3: 扁平向量对话检索 (Vector)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">历史切片进向量库 · 无法区分过期旧状态</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 静态事实召回率: <tspan fill="#34d399" font-weight="700">89.0% ✅</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 状态更新覆盖准确率: <tspan fill="#f87171" font-weight="700">58.5% (新旧全捞出 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• LongMemEval 综合得分: <tspan fill="#fbbf24" font-weight="700">67.2%</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单轮 P95 首字延迟: <tspan fill="#34d399" font-weight="700">215.0 ms</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 单次提问 Token 成本: <tspan fill="#34d399" font-weight="700">$0.006 / 轮</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 为什么纯向量库管不好 Agent 记忆？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">向量相似度没有“新状态作废旧状态”的概念！</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">搜“用户当前收货地址”，2024 年旧地址与</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">2026 年新地址余弦相似度都是 0.89，大模型懵圈！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 核心记忆块 + 双时态图谱 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">Letta 原位编辑块 + Zep/Graphiti 时序失效边</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 静态事实召回率: <tspan fill="#34d399" font-weight="700">95.4% 🏆</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 状态更新覆盖准确率: <tspan fill="#34d399" font-weight="700">94.8% (+36.3pt 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• LongMemEval 综合得分: <tspan fill="#34d399" font-weight="700">93.2% (全场最高 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单轮 P95 首字延迟: <tspan fill="#6ee7b7" font-weight="700">225.0 ms (快 12.67x 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 单次提问 Token 成本: <tspan fill="#34d399" font-weight="700">$0.005 / 轮 (省 98.8% 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 操作系统级分层记忆双引擎：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① L1 驻留内存：2K Token 结构化核心状态块</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">原位改写；② L2 双时态图谱：每条关系边带</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">`valid_from / invalid_at` 时间戳，零新旧冲突！</text>
  </g>

  <!-- Bottom Left: State Mutation Perturbation -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📉 同一事实经历多次变更 (0次 → 10次改口) 时的最新状态召回准确率</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">当用户在 100 轮对话中 10 次修改项目预算/收货地址时，扁平向量库跌至 29.5%，双时态图谱稳守 93.6%</text>

    <!-- 0 Updates -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">0 次变更 (静态事实)</text>
    <rect x="205" y="74" width="305" height="14" rx="3" fill="#10b981"/>
    <text x="518" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">95.4% (Tier 4)</text>
    <rect x="205" y="92" width="285" height="14" rx="3" fill="#f59e0b"/>
    <text x="498" y="104" fill="#fde68a" font-size="11.5" font-weight="700">89.0% (Tier 3 向量)</text>

    <!-- 2 Updates -->
    <text x="24" y="144" fill="#cbd5e1" font-size="12" font-weight="700">2 次变更 (偶发改口)</text>
    <rect x="205" y="130" width="304" height="14" rx="3" fill="#10b981"/>
    <text x="516" y="142" fill="#6ee7b7" font-size="11.5" font-weight="700">95.0% (Tier 4 🏆)</text>
    <rect x="205" y="148" width="196" height="14" rx="3" fill="#f59e0b"/>
    <text x="408" y="160" fill="#fde68a" font-size="11.5" font-weight="700">61.5% (新旧混淆)</text>

    <!-- 5 Updates -->
    <text x="24" y="200" fill="#cbd5e1" font-size="12" font-weight="700">5 次变更 (高频迭代)</text>
    <rect x="205" y="186" width="301" height="14" rx="3" fill="#10b981"/>
    <text x="514" y="198" fill="#6ee7b7" font-size="11.5" font-weight="700">94.2% (Tier 4 🏆)</text>
    <rect x="205" y="204" width="134" height="14" rx="3" fill="#ef4444"/>
    <text x="346" y="216" fill="#f87171" font-size="11.5" font-weight="700">42.0% (向量崩溃 ✕)</text>

    <!-- 10 Updates -->
    <text x="24" y="256" fill="#cbd5e1" font-size="12" font-weight="700">10 次变更 (状态机流转)</text>
    <rect x="205" y="242" width="299" height="14" rx="3" fill="#10b981"/>
    <text x="512" y="254" fill="#6ee7b7" font-size="11.5" font-weight="700">93.6% (稳如泰山 🏆)</text>
    <rect x="205" y="260" width="94" height="14" rx="3" fill="#ef4444"/>
    <text x="306" y="272" fill="#f87171" font-size="11.5" font-weight="700">29.5% (Tier 1 也跌至 38.5% ✕)</text>

    <rect x="20" y="284" width="560" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="304" fill="#6ee7b7" font-size="11.5" font-weight="700">💡 结论：处理动态演化的用户状态，必须用带 `invalid_at` 时间戳的时序图谱边替代静态向量块！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师企业级 Agent 三层虚拟内存标准架构</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ L1 核心寄存器 (Pinned Core Memory Block: 2,000 Tokens)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 常驻 System Prompt 头部（100% 命中 KV Prefix Cache），存放 `user_persona`、</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  `current_goals` 与 `active_constraints`，由 Agent 调用 `memory_replace` 原位覆写！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ L2 双时态语义图谱 (Bi-Temporal Knowledge Graph: Zep / Graphiti)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 每条实体关系边包含 `(t_created, t_expired, t_valid_from, t_invalid_at)` 四个时间维：</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  既能 O(1) 查询 `invalid_at IS NULL` 的最新状态，又能回答“上个月预算曾是多少”！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ L3 原始对话归档库 (Archival Episodic Log)</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 双时态图谱中的每条事实边均保留指向原始对话 Turn-ID 的外键指针；当需要调取</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  某次历史会议的完整代码片段或原话时，顺着图谱边指针精准捞出对应单轮原文！</text>
  </g>
</svg>
