  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Reasoning RL rollouts vary wildly from 512 to 32,768 tokens!</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`micro_batch_size=2`): Two 32K samples in 1 batch trigger</text>
