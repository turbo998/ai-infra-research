  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (`rmpad` + fixed samples): 3.10x cross-DP straggler stall ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Actor/Ref Update: 68.4 s (Tier 1) / 38.2 s (Tier 2) | 74.2% Waste ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Never Batch Variable-Length RL Rollouts by Fixed Sequence Count!</text>

