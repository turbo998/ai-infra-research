<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="acc8" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 25px; font-weight: 800; fill: #F8FAFC; }
      .sub { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13.5px; font-weight: 500; fill: #94A3B8; }
      .badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #0F172A; }
      .sec { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 16px; font-weight: 700; fill: #FBBF24; }
      .ct { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14.5px; font-weight: 700; fill: #F1F5F9; }
      .cb { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12.5px; font-weight: 400; fill: #CBD5E1; }
      .cm { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #34D399; }
      .cw { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #FBBF24; }
      .cd { font-family: 'Consolas', monospace; font-size: 13px; font-weight: 700; fill: #F87171; }
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg8)"/>
  <rect x="30" y="24" width="1340" height="86" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="46" y="40" width="210" height="24" rx="12" fill="url(#acc8)"/>
  <text x="151" y="56" text-anchor="middle" class="badge">AI SOLUTION ARCHITECT · ROUND 8</text>
  <text x="272" y="59" class="title">大模型投机解码 (Speculative Decoding) 与多 Token 预测架构选型一图流总结</text>
  <text x="46" y="90" class="sub">Standard Autoregressive (gamma=0) vs. Prompt Lookup N-Gram vs. Standalone 7B Draft vs. EAGLE-3 / DeepSeek-MTP Feature Head</text>

  <!-- Left Column: 4-Tier Decision Tree -->
  <rect x="30" y="126" width="650" height="430" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="156" class="sec">1. 70B FP8 (8×H100/H200 TP=8) 四档投机解码架构选型边界</text>

  <rect x="50" y="172" width="610" height="82" rx="10" fill="#1E293B" stroke="#F87171" stroke-width="1.5"/>
  <text x="66" y="196" class="ct">Tier 1 · 标准自回归解码 (gamma=0) — BS &gt;= 48~64 高并发算力受限区必选</text>
  <text x="66" y="218" class="cb">低并发下每次搬运 70GB 权重仅产 1 Token；高并发下必须通过动态门限自动退回本档</text>
  <text x="66" y="239" class="cd">+0.0GB 显存 | BS=4 TPOT: 18.40ms (54.3 tok/s, 1.00x) | BS=64: 1.00x 稳态吞吐</text>

  <rect x="50" y="266" width="610" height="82" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="290" class="ct">Tier 2 · 零权重 N-Gram 后缀匹配 (Prompt Lookup) — 代码改写/RAG 引用首选</text>
  <text x="66" y="312" class="cb">CPU/SRAM 检索上下文重复片段，0.15ms 极速草稿，零额外显存，但数学推理接受率仅 1.15</text>
  <text x="66" y="333" class="cw">+0.0GB 显存 | 代码接受 τ=2.45 | BS=4 TPOT: 8.20ms (122.0 tok/s, 2.24x)</text>

  <rect x="50" y="360" width="610" height="82" rx="10" fill="#1E293B" stroke="#FBBF24" stroke-width="1.5"/>
  <text x="66" y="384" class="ct">Tier 3 · 独立小草稿模型 (Standalone 7B Draft -&gt; 70B Target) — 存量旧模型过渡</text>
  <text x="66" y="406" class="cb">需额外维护 14.0GB 权重与双份 KV Cache，受 TP 拓扑错配拖累草稿耗时达 5.50ms</text>
  <text x="66" y="427" class="cw">+14.0GB 显存 | 接受 τ=2.60/2.25 | BS=4 TPOT: 9.80ms (102.0 tok/s, 1.88x)</text>

  <rect x="50" y="454" width="610" height="86" rx="10" fill="#1E293B" stroke="#34D399" stroke-width="1.8"/>
  <text x="66" y="478" class="ct">Tier 4 · 原生特征层轻量草稿头 (EAGLE-3 / DeepSeek-MTP) + 动态 Batch 门限</text>
  <text x="66" y="500" class="cb">复用 70B 倒数第二层隐藏特征 f_t + 共享词表，单层 Head 仅 +1.2GB 显存、1.95ms 草稿</text>
  <text x="66" y="522" class="cm">+1.2GB 显存 | τ=3.42(代码)/2.95(推理) | BS=4: 6.10ms (163.9 tok/s, 3.02x!)</text>

  <!-- Right Column: Quantitative Bars & Batch Crossover Table -->
  <rect x="700" y="126" width="670" height="430" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="720" y="156" class="sec">2. BS=4 单流 TPOT 延迟对比 &amp; Batch 算力墙反转曲线 (Synthetic Roofline)</text>
  <text x="720" y="178" class="sub">Source: experiments/speculative_decoding_selection/results.json (independently_reproduced=false)</text>

  <!-- TPOT Bars -->
  <text x="720" y="208" class="ct">BS=4 单路有效 TPOT 延迟与流式生成速率 (100% 数学无损输出分布)</text>
  <text x="720" y="232" class="cb">Tier 1 Baseline</text>
  <rect x="875" y="218" width="331" height="18" rx="4" fill="#F87171"/>
  <text x="1214" y="232" class="cd">18.40 ms (54.3 tok/s · 1.00x)</text>

  <text x="720" y="258" class="cb">Tier 3 7B Draft</text>
  <rect x="875" y="244" width="176" height="18" rx="4" fill="#FBBF24"/>
  <text x="1060" y="258" class="cw">9.80 ms (102.0 tok/s · 1.88x)</text>

  <text x="720" y="284" class="cb">Tier 2 N-Gram</text>
  <rect x="875" y="270" width="148" height="18" rx="4" fill="#38BDF8"/>
  <text x="1032" y="284" class="cw">8.20 ms (122.0 tok/s · 2.24x Code/RAG)</text>

  <text x="720" y="310" class="cb">Tier 4 EAGLE3/MTP</text>
  <rect x="875" y="296" width="110" height="18" rx="4" fill="#34D399"/>
  <text x="995" y="310" class="cm">6.10 ms (163.9 tok/s · 3.02x Universal!)</text>

  <!-- Batch Scaling Table -->
  <text x="720" y="352" class="ct">不同并发 Batch Size 下的加速比与动态门限保护 (Speedup vs. Batch Size)</text>
  <rect x="720" y="366" width="630" height="174" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="736" y="392" class="cm">方案架构                      | +VRAM  | τ(Code/Math) | BS=4   | BS=32  | BS=64</text>
  <text x="736" y="420" class="cb">Tier 1 Autoregressive (γ=0)   | 0.0 GB | 1.00 / 1.00  | 1.00x  | 1.00x  | 1.00x</text>
  <text x="736" y="448" class="cb">Tier 2 Prompt Lookup N-Gram   | 0.0 GB | 2.45 / 1.15  | 2.24x  | 1.38x  | 0.92x (劣化)</text>
  <text x="736" y="476" class="cw">Tier 3 Standalone 7B Draft    | 14.0GB | 2.60 / 2.25  | 1.88x  | 1.12x  | 0.78x (劣化)</text>
  <text x="736" y="504" class="cm">Tier 4 EAGLE-3 / DeepSeek-MTP | 1.2 GB | 3.42 / 2.95  | 3.02x  | 1.58x  | 1.00x (Gated)</text>
  <text x="736" y="528" class="sub">* 当 BS &gt;= 48 时，B×(γ+1) 跨过 Roofline 算力拐点，必须开启 --speculative-disable-by-batch-size 48！</text>

  <!-- Bottom Row: First-Principles & Checklist -->
  <rect x="30" y="572" width="1340" height="260" rx="14" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="50" y="602" class="sec">3. 核心第一性原理解构 &amp; 架构师生产核验清单 (First-Principles &amp; Production Checklist)</text>

  <rect x="50" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="66" y="644" class="ct">为什么 70B 校验 5 个 Token 只慢 2.7%？</text>
  <text x="66" y="668" class="cb">• 低并发 Decode 是典型的 HBM 显存带宽受限：90% 以上</text>
  <text x="66" y="690" class="cb">  时间花在从 HBM 搬运 70GB 权重到片上 SRAM。</text>
  <text x="66" y="714" class="cb">• 搬一次权重顺带矩阵乘 5 个候选 Token，验证耗时仅从</text>
  <text x="66" y="736" class="cb">  18.40ms 微增至 18.90ms (+2.7%)，却一次性产出 3.42</text>
  <text x="66" y="758" class="cb">  个无损精确 Token，单 Token 均摊延迟骤降 3.02 倍！</text>

  <rect x="490" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="506" y="644" class="ct">为什么 EAGLE-3 / MTP 完胜独立 7B 草稿模型？</text>
  <text x="506" y="668" class="cb">• 独立 7B 模型必须从离散 Token ID 重跑 32 层，显存</text>
  <text x="506" y="690" class="cb">  开销 +14.0GB 且存在 TP=1 vs TP=8 拓扑错配 (5.50ms)。</text>
  <text x="506" y="714" class="cb">• EAGLE-3 / MTP 直接复用 70B 倒数第二层连续隐藏特征</text>
  <text x="506" y="736" class="cb">  f_t 与共享 Embedding，仅需 1 层 Transformer (+1.2GB)，</text>
  <text x="506" y="758" class="cb">  草稿耗时压至 1.95ms，单流生成速率提升 +60.7%。</text>

  <rect x="930" y="618" width="420" height="194" rx="10" fill="#1E293B" stroke="#475569"/>
  <text x="946" y="644" class="ct">生产环境快速核验 Checklist</text>
  <text x="946" y="668" class="cb">[✓] 配置 --speculative-disable-by-batch-size 48 动态门限</text>
  <text x="946" y="692" class="cb">[✓] DeepSeek-V3/R1 原生开启 MTP；Llama/Qwen 挂载 EAGLE-3</text>
  <text x="946" y="716" class="cb">[✓] 代码改写 / 强引用 RAG 零显存开启 Prompt Lookup</text>
  <text x="946" y="740" class="cb">[✓] 开启无损拒绝采样 min(1, p/q)，保障 100% 精度不变</text>
  <text x="946" y="764" class="cb">[✓] 校验 FlashInfer 树状 Attention 融合验证开销 &lt;5%</text>
  <text x="946" y="788" class="cm">Provenance: synthetic + anonymized_reported (non-GPU run)</text>
</svg>
