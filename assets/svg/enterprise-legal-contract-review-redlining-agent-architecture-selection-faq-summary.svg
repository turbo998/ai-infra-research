  <rect width="1200" height="680" fill="url(#bgGrad403)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级法务合同智能审查、条款底线表（Playbook）与 Word 修订（Redlining）架构选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">Round 403 · 2.5万份合同/月 (45页/份) · 512块切片RAG vs. 128K整篇重写 vs. 逐条扫描 vs. 法务AST交叉引用锚定 + 红黄绿Playbook + OpenXML最小粒度修订</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">98.6% Recall · 99.8% DOCX</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 512块切片 RAG + 纯文本聊天</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">切断交叉引用，Word 格式全毁</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 第12条赔偿上限引用第1条定义与附件B</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 切片切断上下文，漏检隐蔽无限责任陷阱</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">风险条款召回率: 58.4% (漏检严重 ✕)</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">过度改写/幻觉错误率: 14.5% ✕</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">Word 修订(Track Changes)保真: 0.0% ✕</text>
  <text x="54" y="382" fill="#cbd5e1" font-size="13" font-weight="700">月总成本 (2.5万份): $18,500 / 月</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：严禁用于正式商业合同法务审批</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 128K 整篇单提示词 + 整段重写</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">整段推翻重写遭对方律师秒拒</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 一次评估60条底线规则出现中部迷失</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 把对方400字条款整段删掉重写引发谈判僵局</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">风险条款召回率: 82.6%</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">过度改写/幻觉错误率: 8.2% ✕</text>
  <text x="346" y="358" fill="#fca5a5" font-size="12.5">Word 修订保真度: 35.0% ✕</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月总成本: $46,000 / 月 (高昂 ✕)</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：内部摘要浏览，不可直接对外发红线</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 条款切分 + 逐条 60 规则扫描</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">单条孤立审阅仍漏跨章节例外</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 按自然段切分，但未自动挂载全局定义表</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 78% DOCX 替换在复杂编号列表下偶发错乱</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">风险条款召回率: 91.2% ✅</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">过度改写/幻觉错误率: 3.4%</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">Word 修订保真度: 78.0%</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月总成本: $29,400 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：标准 NDA / 简单采购协议初审</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad403)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 法务AST+Playbook+最小Diff 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">交叉引用图锚定 + 手术刀级 w:ins/w:del</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 自动把首章定义与被引用条款拼入当前上下文</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• Myers最小词级Diff直接注入OpenXML修订与批注</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">风险条款召回率: 98.6% 🏆 (+40.2pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">过度改写/幻觉错误率: 0.3% 🏆</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">Word 修订保真度: 99.8% 🏆 (原生XML)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月总成本: $6,800 / 月 (-85.2% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">★ 企业法务/采购/并购合同智能审查首选架构</text>

  <!-- Bottom Bar -->
  <rect x="24" y="556" width="1152" height="100" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="586" fill="#38bdf8" font-size="15" font-weight="700">💡 企业法务合同 AI 架构师黄金法则：交叉引用图谱锚定（Cross-Ref Pinning）+ 三级退让底线表（Playbook）+ 最小粒度 OpenXML 修订</text>
  <text x="46" y="612" fill="#cbd5e1" font-size="13">1. 拒绝孤立审条款：审阅“第12条赔偿上限”时，必须由 AST 解析器自动把“第1条专有词定义”及“Notwithstanding 引用的第8.2(b)条”一并固定进上下文！</text>
  <text x="46" y="636" fill="#94a3b8" font-size="12.5">2. 手术刀级最小修订（Minimal-Span Redlining）：严禁整段推翻对方文本！只改关键风险词（如将 36个月 改为 12个月），用 Myers Diff 生成原生 Word &lt;w:del&gt;/&lt;w:ins&gt; 标签。</text>
</svg>
