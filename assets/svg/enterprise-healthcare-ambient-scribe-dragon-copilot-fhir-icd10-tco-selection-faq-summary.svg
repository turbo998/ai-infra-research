<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级医疗环境语音病历 (Ambient AI Scribe) 与 FHIR/ICD-10 选型：Dragon Copilot vs. HealthScribe vs. 私有化 (#433)</text>
  <text x="28" y="58" class="sub">为什么通用 ASR + 裸大模型写病历会出现 8.6% 药物剂量幻觉与 29% ICD-10 假代码？用 RxNorm 药典门禁 + 本体树检索实现 0 医疗事故！</text>

  <!-- Left Panel: Clinical Hallucination Traps vs Grounded Medical Scribe Pipeline -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 临床医疗 AI 三大生死红线：否定词反转、药名剂量幻觉、捏造 ICD-10 编码</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 高危翻车：通用语音转写 + 自由文本生成 SOAP 病历 + 裸模型背诵 ICD-10</text>
  <text x="56" y="164" class="mono">• 药名同音字错转：“他克莫司 0.5mg”被通用 ASR 误转或漏掉小数点成“5mg”（10倍致死量！）</text>
  <text x="56" y="184" class="mono">• 否定词丢失：患者说“无胸痛、无青霉素过敏”，摘要漏掉“无”字变成阳性诊断！</text>
  <text x="56" y="202" class="txt">• 编码幻觉：7 万个 ICD-10/CPT 代码靠 LLM 硬背，高达 29.4% 代码不存在或违反互斥规则！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：声学角色分离 + RxNorm 药典硬校验 + FHIR R4 + ICD-10 树检索 + 原声溯源</text>
  <text x="56" y="272" class="mono">• 1. 科室词典热词增强 ASR + 医患双轨分离 | 2. RxNorm 药典校验药品规格与极量区间</text>
  <text x="56" y="292" class="mono">• 3. XGrammar 强约束输出 HL7 FHIR R4 (Condition / MedicationRequest) + 否定断言标签</text>
  <text x="56" y="312" class="txt">• 4. 病历每句话强制绑定 `[audio_timestamp, transcript_span]`，医生点击1秒听原声核对！</text>

  <!-- Right Panel: 4 Clinical Ambient Scribe Platforms Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大医院环境语音病历 (Ambient Scribe) 平台横向对标 (2,000 名临床医生)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 通用云 ASR + 无约束 70B 自由文本 SOAP + 零样本猜 ICD-10</text>
  <text x="638" y="158" class="mono">• 药物/剂量错漏率 8.6% ✕ | ICD-10 合规率仅 70.6% ✕ | 无法通过医院医疗质控！</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#93c5fd">Tier 2: 商业临床全托管旗舰 (Microsoft Dragon Copilot [Nuance DAX] / Epic 深度集成)</text>
  <text x="638" y="214" class="mono">• 全球最成熟临床语音底座 + 原生写回 Epic EHR | 准确率 97.8% | $720万/年 ($300/医生/月)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#fde68a">Tier 3: 云原生医疗 API (AWS HealthScribe / Azure AI Health Insights API)</text>
  <text x="638" y="270" class="mono">• 按分钟计费 ($0.10/min) + 内置医患分离与原声溯源 | 准确率 96.4% | $288万/年</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 院内私有化医疗热词 ASR + RxNorm 剂量门禁 + FHIR R4 + ICD-10 本体树 (🏆三甲医院)</text>
  <text x="638" y="326" class="mono">• 患者录音 100% 不出医院内网 🏆 | 剂量幻觉 0.0% 🏆 | ICD-10 准确率 98.4% | 仅 $38万/年!</text>

  <!-- Bottom Panel: End-to-End 4-Stage Clinical Ambient Scribe Architecture -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端临床环境语音病历与 DRG/ICD-10 编码参考架构：每天为每位医生节省 90 分钟文书加班！</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 诊室阵列麦 + 科室热词 ASR</text>
  <text x="56" y="464" class="mono">• 声学角色分离 (Speaker Diarization)：</text>
  <text x="56" y="484" class="mono">  精确区分 `[医生]` 与 `[患者/家属]`</text>
  <text x="56" y="504" class="mono">• 注入本院处方集 5,000 种化学药名</text>
  <text x="56" y="524" class="mono">  与检验缩写热词偏置 (Hotword Boost)</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">生僻药名识别准确率从 82% 升至 99.1%</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 临床否定断言 + RxNorm 剂量门禁</text>
  <text x="332" y="464" class="mono">• 显式标注断言状态：`present` /</text>
  <text x="332" y="484" class="mono">  `absent (否认)` / `family_history`</text>
  <text x="332" y="504" class="mono">• 查院内药典库核验 `[药品+规格+频次]`：</text>
  <text x="332" y="524" class="mono">  若出现不存在的毫克规格立即标红拦截！</text>
  <text x="332" y="550" class="txt" fill="#34d399">100% 根除小数点错位导致的用药事故</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 两阶段 ICD-10 本体树 + DRG 校验</text>
  <text x="620" y="464" class="mono">• 严禁 LLM 自由编造 ICD-10 代码！</text>
  <text x="620" y="484" class="mono">• 先检索标准 ICD-10/SNOMED 树候选</text>
  <text x="620" y="504" class="mono">• 再跑确定性 `Excludes1 / NCCI`</text>
  <text x="620" y="524" class="mono">  互斥规则树与检验单 `CC/MCC` 关联</text>
  <text x="620" y="550" class="txt" fill="#fde68a">医保拒付率下降 76%，合规率 98.4%</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ HL7 FHIR R4 + 原声时间戳签字</text>
  <text x="908" y="464" class="mono">• 结构化生成 FHIR 资源写入 HIS/EHR</text>
  <text x="908" y="484" class="mono">• 每条现病史/医嘱绑定录音时间戳</text>
  <text x="908" y="504" class="mono">  `[03:14 - 03:22]`</text>
  <text x="908" y="524" class="mono">• 必须经主治医生确认签字才生效落库</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">诊后写病历耗时从 12 分钟缩至 45 秒！</text>
</svg>
