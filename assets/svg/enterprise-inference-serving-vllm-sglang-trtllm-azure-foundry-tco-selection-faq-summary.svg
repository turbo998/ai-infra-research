<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #404 · ENTERPRISE INFERENCE SERVING: VLLM V1 VS. SGLANG VS. TENSORRT-LLM VS. AZURE AI FOUNDRY</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业级多租户大模型推理服务底座选型：vLLM V1 vs. SGLang vs. TRT-LLM vs. Azure Foundry</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">不仅比单卡极限吞吐，更要算清 SRE 人力成本、多模型生态兼容、多轮 Agent 前缀复用与托管 MaaS 的 TCO 拐点</text>

  <!-- Left Box: Core Positioning of the 4 Serving Engines -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 四大主流推理底座的核心定位与适用场景分水岭</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">Azure Foundry Managed : 0 运维人力 · 开箱合规 SLA (适合 &lt;16 GPU 团队)</text>
  <text x="90" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">vLLM V1 (通用标准底座) : 100+ 模型 Day-0 兼容 + 多芯片 (NVIDIA/AMD/TPU)</text>
  <text x="90" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">SGLang (Agent/MoE 王者): RadixAttention 前缀树 + DeepSeek MLA/DeepEP 标杆</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• TensorRT-LLM：单卡极限压榨高 8%~12%，但需离线编译 Engine，升级成本高</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 隐性成本陷阱：2 名全职 AI Infra 工程师年薪 ($36万) 相当于 12 张 H200 年租金！</text>
  <text x="76" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 选型铁律：&lt;8 卡用 Foundry 托管；通用 MaaS 用 vLLM V1；重 Agent/MoE 用 SGLang！</text>

  <!-- Right Box: Full-Stack TCO Math (Hardware + SRE Ops) -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 含 SRE 运维人力的全口径 TCO 公式与双栈组合拳</text>
  <rect x="634" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">TCO_annual = N_GPU * Cost_GPU_yr + N_SRE_FTE * $180,000 + Spillover</text>
  <text x="648" y="242" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700">Effective_$/1M = TCO_annual / (Goodput_tok_s * 31.536M * Util_avg)</text>
  <text x="648" y="262" fill="#fde68a" font-family="Consolas, monospace" font-size="12" font-weight="700">多轮 Agent 增益: SGLang RadixTree + XGrammar 将有效吞吐推高 1.68x!</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 为什么不建议全公司死磕单一 TRT-LLM？每次开源新模型发布需数天适配重编译</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 生产黄金配搭：80% 流量由 SGLang/vLLM V1 承载 + 20% 托管 Foundry 保底容灾</text>
  <text x="634" y="350" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：32 卡规模下，vLLM V1 + SGLang 双擎比纯托管年省 $48.5 万 (-54.2%)！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四种企业推理服务底座在 32-GPU 多轮 Agent + RAG 混合负载下的全维度对比</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">推理服务引擎方案</text>
  <text x="410" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">新模型上线周期</text>
  <text x="565" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">单卡 Agent Goodput</text>
  <text x="740" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">所需专职运维 FTE</text>
  <text x="915" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">含人力全口径 $/1M</text>

  <text x="76" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">方案 1: 100% Azure AI Foundry Managed Endpoints (全托管专池)</text>
  <text x="410" y="484" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">15 分钟 ✓</text>
  <text x="565" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">1,450 tok/s/GPU</text>
  <text x="740" y="484" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">0.2 FTE ✓</text>
  <text x="915" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.62 / 1M (&lt;8卡最划算)</text>

  <text x="76" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">方案 2: 自建纯 TensorRT-LLM (静态编译 Engine + 高门槛 C++ 调优)</text>
  <text x="410" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">5 ~ 10 天 ✕</text>
  <text x="565" y="512" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">2,320 tok/s/GPU</text>
  <text x="740" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">2.5 FTE ($450K/yr) ✕</text>
  <text x="915" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.41 / 1M (人力摊薄高)</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">方案 3: 自建 vLLM V1 通用底座 (ZMQ 多进程 + Piecewise Graph)</text>
  <text x="410" y="540" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Day-0 (1小时) ✓</text>
  <text x="565" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">2,140 tok/s/GPU ✓</text>
  <text x="740" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">0.8 FTE ✓</text>
  <text x="915" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.29 / 1M ✓</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">方案 4 (推荐): SGLang (Agent/MoE 主力) + vLLM V1 (多模型) + Foundry 溢出</text>
  <text x="410" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Day-0 (1小时) 🏆</text>
  <text x="565" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2,480 tok/s/GPU 🏆</text>
  <text x="740" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1.0 FTE 🏆</text>
  <text x="915" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$0.23 / 1M (-62.9%) 🏆</text>
</svg>
