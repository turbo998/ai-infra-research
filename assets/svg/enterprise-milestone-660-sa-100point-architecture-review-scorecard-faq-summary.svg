<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="44" y="50" fill="#FDE68A" font-size="19" font-weight="700">🏆 #660 重大里程碑：Cloud &amp; AI SA 端到端架构评审 100 分制量表与 38 轮 (#623–#660) 生产就绪度总控台</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">Milestone #660 (662 Bilingual Playbooks · 273 H5 Labs · 668 Models): 4-Pillar 100-Point Architecture Review Scorecard &amp; Go-Live Gate</text>

  <!-- Pillar 1: 25 Points -->
  <rect x="24" y="106" width="276" height="388" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="38" y="132" fill="#38BDF8" font-size="14" font-weight="700">🚀 支柱一：推理性能与并行 (25分)</text>
  <rect x="36" y="146" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="46" y="166" fill="#F8FAFC" font-size="12" font-weight="700">1. 动态 PD 分离与 85% 反压 (5分)</text>
  <text x="46" y="186" fill="#94A3B8" font-size="11">T_in &gt;= 2K 必拆 PD，Decode KV 锁 85% (#623)</text>
  <rect x="36" y="216" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="46" y="236" fill="#F8FAFC" font-size="12" font-weight="700">2. TP/PP/DP/EP 物理边界 (5分)</text>
  <text x="46" y="256" fill="#94A3B8" font-size="11">TP 锁机内 NVLink，MoE 用 DeepEP+TBO (#624)</text>
  <rect x="36" y="286" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="46" y="306" fill="#F8FAFC" font-size="12" font-weight="700">3. 零开销引擎与投机熔断 (5分)</text>
  <text x="46" y="326" fill="#94A3B8" font-size="11">SGLang/vLLM V1 + B*=32 投机自动旁路 (#637/#656)</text>
  <rect x="36" y="356" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="46" y="376" fill="#F8FAFC" font-size="12" font-weight="700">4. W8A8KV8 / NVFP4 量化 (5分)</text>
  <text x="46" y="396" fill="#94A3B8" font-size="11">Hopper 必选 Block-FP8+KV8，B200 选 NVFP4 (#651)</text>
  <rect x="36" y="426" width="252" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="46" y="446" fill="#6EE7B7" font-size="12" font-weight="700">5. Jump-Forward 与 &lt;think&gt; 治理 (5分)</text>
  <text x="46" y="464" fill="#D1FAE5" font-size="11">XGrammar 1.85x JSON + 软闭合剥离 (#633/#642)</text>

  <!-- Pillar 2: 25 Points -->
  <rect x="316" y="106" width="276" height="388" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="330" y="132" fill="#6EE7B7" font-size="14" font-weight="700">🌐 支柱二：智算高速网络 (25分)</text>
  <rect x="328" y="146" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="338" y="166" fill="#F8FAFC" font-size="12" font-weight="700">6. 100% PIX 亲和与 4×Switch (5分)</text>
  <text x="338" y="186" fill="#94A3B8" font-size="11">BIOS 关 ACS + 4×PEX89144 杜绝 SYS (#625/#657)</text>
  <rect x="328" y="216" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="338" y="236" fill="#F8FAFC" font-size="12" font-weight="700">7. 8-Rail + PXN 零跨轨 (5分)</text>
  <text x="338" y="256" fill="#94A3B8" font-size="11">同号网卡汇入同台 Rail Leaf + NVLink 代转 (#625)</text>
  <rect x="328" y="286" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="338" y="306" fill="#F8FAFC" font-size="12" font-weight="700">8. AR+DDP / Multi-QP=4 (5分)</text>
  <text x="338" y="326" fill="#94A3B8" font-size="11">Spectrum-X/UEC 逐包喷洒或 QPS=4 拆象流 (#649)</text>
  <rect x="328" y="356" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="338" y="376" fill="#F8FAFC" font-size="12" font-weight="700">9. MoR 铜缆 (&lt;=7m) + LPO 光 (5分)</text>
  <text x="338" y="396" fill="#94A3B8" font-size="11">下行 100% DAC/AEC 铜缆，省 62.7% CapEx (#654)</text>
  <rect x="328" y="426" width="252" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="338" y="446" fill="#6EE7B7" font-size="12" font-weight="700">10. 跨楼 DCI 500KB/km 深缓存 (5分)</text>
  <text x="338" y="464" fill="#D1FAE5" font-size="11">Jericho3-AI 边界 + 跨楼只走 PP/PD (#659)</text>

  <!-- Pillar 3: 25 Points -->
  <rect x="608" y="106" width="276" height="388" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="622" y="132" fill="#FDE68A" font-size="14" font-weight="700">📐 支柱三：三水位线与 SLA (25分)</text>
  <rect x="620" y="146" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="630" y="166" fill="#F8FAFC" font-size="12" font-weight="700">11. 三道水位线包络取大 (5分)</text>
  <text x="630" y="186" fill="#94A3B8" font-size="11">max(N_mem/0.85, N_bw, N_compute) (#626)</text>
  <rect x="620" y="216" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="630" y="236" fill="#F8FAFC" font-size="12" font-weight="700">12. Little's Law 与 1:0.1:4 WCU (5分)</text>
  <text x="630" y="256" fill="#94A3B8" font-size="11">双阶段 Lua WCU 预扣 + 事后真实退补 (#626/#641)</text>
  <rect x="620" y="286" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="630" y="306" fill="#F8FAFC" font-size="12" font-weight="700">13. 多模态 E-P-D 与版面裁剪 (5分)</text>
  <text x="630" y="326" fill="#94A3B8" font-size="11">L40S ViT 剥离 + 22% 图表局部裁剪 (#631/#658)</text>
  <rect x="620" y="356" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="630" y="376" fill="#F8FAFC" font-size="12" font-weight="700">14. 265ms 语音与 68ms 代码双轨 (5分)</text>
  <text x="630" y="396" fill="#94A3B8" font-size="11">WebRTC 五段重叠 + 75ms 防抖 AST 缓存 (#643/#644)</text>
  <rect x="620" y="426" width="252" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="630" y="446" fill="#6EE7B7" font-size="12" font-weight="700">15. max_itl_ms 监控与尾部采样 (5分)</text>
  <text x="630" y="464" fill="#D1FAE5" font-size="11">严防平均 TPOT 假象，OTel 省 84.6% 存储 (#653)</text>

  <!-- Pillar 4: 25 Points -->
  <rect x="900" y="106" width="276" height="388" rx="12" fill="#1E293B" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="914" y="132" fill="#C4B5FD" font-size="14" font-weight="700">⚖️ 支柱四：平台、容灾与 FinOps (25分)</text>
  <rect x="912" y="146" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="922" y="166" fill="#F8FAFC" font-size="12" font-weight="700">16. 65/20/15 混合云 + 影子双跑 (5分)</text>
  <text x="922" y="186" fill="#94A3B8" font-size="11">4 阶段零停机切流，5.4 个月收回 CapEx (#627/#655)</text>
  <rect x="912" y="216" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="922" y="236" fill="#F8FAFC" font-size="12" font-weight="700">17. 三级缓存 + 投机伴飞护栏 (5分)</text>
  <text x="922" y="256" fill="#94A3B8" font-size="11">白名单 L2 + GIE L3 + +2.5ms 零感护栏 (#641/#647)</text>
  <rect x="912" y="286" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="922" y="306" fill="#F8FAFC" font-size="12" font-weight="700">18. 十亿 DiskANN + Role-at-Tail (5分)</text>
  <text x="922" y="326" fill="#94A3B8" font-size="11">192GB RAM 十亿向量 + 黑板防 O(K²) 爆炸 (#646/#652)</text>
  <rect x="912" y="356" width="252" height="62" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="922" y="376" fill="#F8FAFC" font-size="12" font-weight="700">19. 夜间前缀重排批处理 + veRL (5分)</text>
  <text x="922" y="396" fill="#94A3B8" font-size="11">00:00–07:00 跑 $0.024/1M 批处理与 GRPO (#639/#648)</text>
  <rect x="912" y="426" width="252" height="56" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="922" y="446" fill="#6EE7B7" font-size="12" font-weight="700">20. Day-0 五关烤机 + 3.2m 自愈 (5分)</text>
  <text x="922" y="464" fill="#D1FAE5" font-size="11">拦截 3.8% DOA + 55%+55% 双活 0.85s RTO (#638/#645)</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🎯 #660 重大里程碑签字红线：架构评审得分 &gt;= 90 分且零一票否决项方可批准采购与投产！</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">· &lt; 70 分 (不及格 · 严禁投产)：Goodput &lt;= 62%，单百万词成本 &gt;= $0.42 | · 70–89 分 (有条件通过)：需限期整改薄弱项；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">· &gt;= 90 分 (黄金生产基线 · #623–#660 满配)：容量测算准确度 99.4%，双 SLA 有效吞吐 Goodput 达 99.6%，单百万词综合成本低至 $0.045！</text>
</svg>
