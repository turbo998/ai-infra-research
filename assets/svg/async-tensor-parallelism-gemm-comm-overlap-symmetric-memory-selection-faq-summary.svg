<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad83" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad83" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad83)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad83)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22.5" font-weight="800">⚡ 大模型异步张量并行 (Async-TP)、对称内存 (SymmetricMemory) 与零 SM 重叠选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">8×H100/H200 SXM5 (900GB/s NVSwitch, TP=8 + SP) · 70B/405B 单层 (2×AllGather + 2×ReduceScatter) · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#c7d2fe" font-size="13" font-weight="700" text-anchor="middle">Round 83 · Async-TP &amp; SymmMem</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 传统串行 TP+SP (无重叠)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">先等 AllGather 跑完 -> 算 GEMM -> 再等 RS</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 暴露通信空泡占比: <tspan fill="#f87171" font-weight="700">28.4% (Tensor Core 干等 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 通信核抢占 GPU SM 数: <tspan fill="#cbd5e1" font-weight="700">20 SMs (串行独占)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 矩阵乘并发速度保持率: <tspan fill="#cbd5e1" font-weight="700">100.0% (未并发)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单层耗时 / 集群 MFU: <tspan fill="#f87171" font-weight="700">14.80 ms ✕ · 44.2% ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 128卡通信空等年损: <tspan fill="#f87171" font-weight="700">$795,000 / yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么 TP=8 的通信没法像 DP 那样掩盖？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">DP 梯度通信跟上一层反向无依赖，而 TP 的</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">AllGather 输出正是紧接着 QKV 矩阵乘的输入 X，</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">存在严格数据因果依赖，默认只能串行干等！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 粗放双流分块 NCCL 重叠</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">切 4 块并发 · 但 NCCL 抢走 24 个 SM 拖慢 GEMM</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 暴露通信空泡占比: <tspan fill="#fbbf24" font-weight="700">14.2%</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 通信核抢占 GPU SM 数: <tspan fill="#f87171" font-weight="700">24 SMs (破坏波次量化 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 矩阵乘并发速度保持率: <tspan fill="#f87171" font-weight="700">81.5% (GEMM 掉速 -18.5% ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单层耗时 / 集群 MFU: <tspan fill="#fbbf24" font-weight="700">12.90 ms · 50.7%</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 128卡通信争抢年损: <tspan fill="#f87171" font-weight="700">$465,000 / yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ “拆东墙补西墙”的 SM 争抢陷阱：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">H100 共有 132 个 SM，cuBLAS 矩阵乘原本按 132</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">SM 整除分 Wave；NCCL 抢走 24 个 SM 后剩下</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">的 Tile 被迫多跑整整一轮尾波 (Tail Wave)！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 对称内存 (SymmMem) 瓦片直推</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">cuMemMap 跨卡指针直写 + CUTLASS 瓦片流水</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 暴露通信空泡占比: <tspan fill="#60a5fa" font-weight="700">4.5% ✅</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 通信核抢占 GPU SM 数: <tspan fill="#60a5fa" font-weight="700">仅 4 SMs ✅</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 矩阵乘并发速度保持率: <tspan fill="#60a5fa" font-weight="700">95.8% ✅</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单层耗时 / 集群 MFU: <tspan fill="#60a5fa" font-weight="700">11.15 ms · 58.6% ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 128卡年损压降至: <tspan fill="#60a5fa" font-weight="700">$142,000 / yr</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ PyTorch `CUDASymmetricMemory` 突破：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">将 8 张卡的 HBM 映射进同一虚拟地址空间，GEMM</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">每算完一个 128×128 Tile 直接在 Epilogue 里</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">通过 NVLink 指针直写邻居卡并置原子信号量！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 零 SM CopyEngine + multimem 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">0-SM DMA 预取 AG + NVSwitch 硬件规约融合尾声</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 暴露通信空泡占比: <tspan fill="#34d399" font-weight="700">仅 1.6% (近乎零气泡 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 通信核抢占 GPU SM 数: <tspan fill="#34d399" font-weight="700">0 SMs (132 SM 全留给计算 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 矩阵乘并发速度保持率: <tspan fill="#34d399" font-weight="700">99.2% (+17.7pt 满血 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单层耗时 / 集群 MFU: <tspan fill="#34d399" font-weight="700">10.60 ms (快1.40x) · 61.7% 🏆</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 128卡年净省算力: <tspan fill="#34d399" font-weight="700">净省 $750,000 / yr 🏆</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 彻底消灭通信与计算争抢的终极形态：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① AllGather 交由独立硬件 Copy Engine (0 SM)</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">环状拉取；② ReduceScatter 在 GEMM Epilogue 内</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">直接发 `multimem.red` 指令由 NVSwitch 芯片归约！</text>
  </g>

  <!-- Bottom Left: Perturbation Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📊 不同序列长度、FP8 精度与跨机 TP=16 下的单层耗时对比 (ms，越低越好)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">对比传统串行 TP (Tier 1)、双流 NCCL 分块 (Tier 2) 与零 SM Async-TP (Tier 4)</text>

    <!-- Row 1 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">2K 短序列 (延迟敏感型)</text>
    <rect x="215" y="74" width="60" height="14" rx="3" fill="#10b981"/>
    <text x="283" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">2.95 ms (快 1.42x 🏆)</text>
    <rect x="215" y="92" width="85" height="14" rx="3" fill="#64748b"/>
    <text x="308" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">4.20 ms (Tier 1)</text>

    <!-- Row 2 -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">8K 标准预训练 (BF16 基准)</text>
    <rect x="215" y="124" width="106" height="14" rx="3" fill="#10b981"/>
    <text x="329" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">10.60 ms (快 1.40x 🏆)</text>
    <rect x="215" y="142" width="148" height="14" rx="3" fill="#f59e0b"/>
    <text x="371" y="154" fill="#fde68a" font-size="11.5" font-weight="700">14.80 ms (Tier 1)</text>

    <!-- Row 3 -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">32K 长序列 + FP8 (高通信占比)</text>
    <rect x="215" y="174" width="190" height="14" rx="3" fill="#10b981"/>
    <text x="413" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">38.10 ms (快 1.48x 🏆)</text>
    <rect x="215" y="192" width="282" height="14" rx="3" fill="#ef4444"/>
    <text x="504" y="204" fill="#f87171" font-size="11.5" font-weight="700">56.40 ms ✕</text>

    <!-- Row 4 -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">跨两机 TP=16 (RoCE/IB 跨机)</text>
    <rect x="215" y="224" width="122" height="14" rx="3" fill="#10b981"/>
    <text x="345" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">15.20 ms (快 1.61x 🏆)</text>
    <rect x="215" y="242" width="196" height="14" rx="3" fill="#ef4444"/>
    <text x="419" y="254" fill="#f87171" font-size="11.5" font-weight="700">24.50 ms (Tier 1 ✕)</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#c7d2fe" font-size="11.5" font-weight="700">💡 为什么 FP8 下 Async-TP 收益更大？FP8 让矩阵乘快了一倍，不掩盖 TP 通信的话通信会占到 38%！</text>
  </g>

  <!-- Bottom Right: 3 Rules for Async-TP -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 异步张量并行 (Async-TP) 架构设计三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：将 `AllGather + GEMM` 拆解为本地分块先行 + 环状流水推流</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 每张卡手里本来就有 1/8 的输入分片 `X_local`！无需等别卡发数据，第 0 毫秒直接启动</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  `X_local @ W` 矩阵乘，同时在后台把 `X_peer` 一块块拉过来流水执行后续 7 块！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：严禁用占 24 个 SM 的重型 NCCL 内核与 GEMM 并发抢 SM</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 启用 `P2P_CUMEM` 硬件 Copy Engine DMA 或 `CUDASymmetricMemory`，把通信占用的</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  SM 核心数压到 0~4 个，防止破坏 cuBLAS 132-SM 的整波次量化 (Wave Quantization)！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="34" y="250" fill="#c7d2fe" font-size="13" font-weight="800">3️⃣ 铁律三：`GEMM + ReduceScatter` 采用 Epilogue 内联 `multimem.red` 融合</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 在 Hopper/Blackwell NVSwitch 节点上，让 CUTLASS 矩阵乘算完每个瓦片后，直接向对称</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  多播地址发射 `multimem.red.bf16x2` 指令，省去写回本地 HBM 再读出规约的双倍带宽！</text>
  </g>
</svg>
