<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🧬 大模型注意力与状态空间架构演进选型一图流总结（GQA-8 vs. 纯 Mamba/SWA vs. DeepSeek MLA vs. 3:1 混合线性注意力）</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">70B/80B 级模型 (64层) · 128K~1M 超长上下文 · SGLang MambaRadixCache + FlashInfer KDA · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#ddd6fe" font-size="13" font-weight="700" text-anchor="middle">Round 35 · MLA vs Hybrid Mamba-2</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#334155"/>
    <text x="16" y="27" fill="#f8fafc" font-size="14" font-weight="800">⬜ Tier 1: 标准 GQA-8 全注意力</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">64 层全注意力 · O(N²) 预填充爆炸</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 128K 单请求 KV 显存: <tspan fill="#f87171" font-weight="700">32.0 GB (极重 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 128K Prefill TTFT: <tspan fill="#f87171" font-weight="700">6.80 s (1M 达 310s ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 128K Decode (BS=16): <tspan fill="#f87171" font-weight="700">260 tok/s (带宽受限)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 128K 大海捞针准确率: <tspan fill="#34d399" font-weight="700">97.2% ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• Prefix Cache 机制: <tspan fill="#cbd5e1" font-weight="700">标准分页 Paged KV</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ GQA 在超长上下文的两大死穴：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 16 并发 128K 请求仅 KV Cache 就要吃</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">掉 512GB 显存；② 512K~1M 上下文时 O(N²)</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">注意力计算让首字延迟飙升至数分钟！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 2: 纯 Mamba-2 / 4K 滑窗 SWA</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">64 层纯状态空间 · O(1) 状态但丢失精确拷贝</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 128K 单请求状态显存: <tspan fill="#34d399" font-weight="700">1.0 GB (固定大小)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 128K Prefill TTFT: <tspan fill="#34d399" font-weight="700">1.65 s (O(N) 极速)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 128K Decode (BS=16): <tspan fill="#34d399" font-weight="700">1,180 tok/s</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 128K 大海捞针准确率: <tspan fill="#f87171" font-weight="700">41.5% (严重遗忘 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 核心缺陷: <tspan fill="#f87171" font-weight="700">无法精确复述长文合同编号 ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么纯 Mamba 无法替代全注意力？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">信息论铁律：无法把 128K 个 Token 的精确</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">键值无损塞进固定大小的递归状态矩阵 h_t</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">里！做 RAG 原文精确摘录时准确率暴跌！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: DeepSeek MLA 低秩潜变量 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">576 维联合压缩 KV + W_UK/W_UV 矩阵吸收</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 128K 单请求 KV 显存: <tspan fill="#34d399" font-weight="700">5.62 GB (压缩 5.69x 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 128K Prefill TTFT: <tspan fill="#60a5fa" font-weight="700">5.10 s (仍为 O(N²))</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 128K Decode (BS=16): <tspan fill="#34d399" font-weight="700">785 tok/s (3.02x ✅)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 128K 大海捞针准确率: <tspan fill="#34d399" font-weight="700">97.8% (全场最高 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• Prefix Cache 机制: <tspan fill="#34d399" font-weight="700">原生兼容 Paged KV 🏆</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">🏆 精确长文推理与高并发 Decode 首选：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">将 K 和 V 联合压缩为 512 维潜向量 c_KV +</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">64 维解耦 RoPE，并通过矩阵吸收避免解压，</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">显存砍至 1/5.7 且长文推理精度反超 GQA！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 3:1 混合线性/Mamba-2 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">48层线性 O(N) + 16层全注意力 + MambaRadixCache</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 128K 单请求 KV+状态: <tspan fill="#34d399" font-weight="700">8.32 GB (压缩 3.85x ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 128K Prefill TTFT: <tspan fill="#34d399" font-weight="700">2.35 s (快 2.89x 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 128K Decode (BS=16): <tspan fill="#34d399" font-weight="700">950 tok/s (快 3.65x 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 128K 大海捞针准确率: <tspan fill="#34d399" font-weight="700">96.4% (无损召回 ✅)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• Prefix Cache 机制: <tspan fill="#6ee7b7" font-weight="700">MambaRadixCache 状态快照</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🚀 128K~1M 极速 Prefill 与 Agent 首选：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">每 3 层 O(N) 线性注意力/Mamba-2 夹 1 层全</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">注意力负责精确捞针；1M 上下文 Prefill 比</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">GQA 快 5.74 倍 (54s vs 310s)！</text>
  </g>

  <!-- Bottom Left: Context Scaling 32K -> 1M -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📈 上下文从 32K 扩至 1M 时 Prefill 首字延迟 (秒)：O(N²) vs. 3:1 混合 O(N)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">为什么超过 256K 上下文后，纯全注意力层的二次方计算墙会压垮首字响应？</text>

    <!-- 32K -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">32K Tokens</text>
    <rect x="165" y="74" width="38" height="14" rx="3" fill="#10b981"/>
    <text x="210" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">0.48 s (Tier 4 混合)</text>
    <rect x="165" y="92" width="68" height="14" rx="3" fill="#64748b"/>
    <text x="240" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">0.85 s (Tier 1 GQA)</text>

    <!-- 128K -->
    <text x="24" y="144" fill="#cbd5e1" font-size="12" font-weight="700">128K Tokens</text>
    <rect x="165" y="130" width="60" height="14" rx="3" fill="#10b981"/>
    <text x="232" y="142" fill="#6ee7b7" font-size="11.5" font-weight="700">2.35 s (快 2.89x 🏆)</text>
    <rect x="165" y="148" width="174" height="14" rx="3" fill="#f59e0b"/>
    <text x="346" y="160" fill="#fde68a" font-size="11.5" font-weight="700">6.80 s (Tier 1 GQA)</text>

    <!-- 512K -->
    <text x="24" y="200" fill="#cbd5e1" font-size="12" font-weight="700">512K Tokens</text>
    <rect x="165" y="186" width="75" height="14" rx="3" fill="#10b981"/>
    <text x="248" y="198" fill="#6ee7b7" font-size="11.5" font-weight="700">16.40 s (快 5.00x 🏆)</text>
    <rect x="165" y="204" width="290" height="14" rx="3" fill="#ef4444"/>
    <text x="462" y="216" fill="#f87171" font-size="11.5" font-weight="700">82.00 s (GQA ✕)</text>

    <!-- 1M -->
    <text x="24" y="256" fill="#cbd5e1" font-size="12" font-weight="700">1M Tokens (100万)</text>
    <rect x="165" y="242" width="95" height="14" rx="3" fill="#10b981"/>
    <text x="268" y="254" fill="#6ee7b7" font-size="11.5" font-weight="700">54.00 s (Tier 4 混合 🏆)</text>
    <rect x="165" y="260" width="320" height="14" rx="3" fill="#ef4444"/>
    <text x="492" y="272" fill="#f87171" font-size="11.5" font-weight="700">310.0 s (5.74x 慢 ✕)</text>

    <rect x="20" y="284" width="560" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="304" fill="#ddd6fe" font-size="11.5" font-weight="700">💡 结论：3:1 混合架构把 75% 的网络层换成了 O(N) 线性算子，彻底推倒百万 Token 预填充墙！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师模型家族选型与推理引擎适配三大法则</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 金融/法务高精度多跳推理 + 高并发长文生成 → 选 Tier 3 (DeepSeek MLA)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 64 层全为全视野注意力，大海捞针准确率高达 `97.8%`；同时矩阵吸收将每 Token KV</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  显存压至 576 元素（比 GQA-8 小 `5.69x`），完美适配 Mooncake / LMCache 分布式缓存！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 超长代码库扫描 / 128K~1M 多轮 Agent → 选 Tier 4 (3:1 混合线性/Mamba-2)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 如 `Qwen3-Next / Nemotron-H / Jamba`：75% 层为线性 O(N) 算子，25% 层为全注意力保住</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  `96.4%` 精确召回，128K Prefill 快 `2.89x`、Decode 快 `3.65x`！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="34" y="250" fill="#ddd6fe" font-size="13" font-weight="800">3️⃣ 部署 3:1 混合模型必开 `SGLang MambaRadixCache` + `FlashInfer KDA`</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• Mamba 状态不能像 KV Cache 一样按 Token 随意切片回退！必须在推理引擎中启用</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  `MambaRadixCache`（按块保存 SSM 递归状态快照）与 `Fused KDA Gate` 算子融合！</text>
  </g>
</svg>
