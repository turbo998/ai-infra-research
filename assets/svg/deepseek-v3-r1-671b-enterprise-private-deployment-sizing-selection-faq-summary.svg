  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：MLA 将 KV Cache 缩小 93.3% + 原生 MTP 白送 1.4x~1.6x 加速</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 传统 405B 模型每 Token KV 占 ~516KB；DeepSeek MLA 压至 576 维，FP8 下仅 35.2KB/tok！</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 单台 8×H200 (1,128GB) 扣除 671GB 权重后，剩余显存可轻松容纳近百路 32K 并发会话；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 务必在 SGLang/vLLM 开启 `--speculative-algorithm EAGLE/MTP`，命中率 ~85%，TPOT 直降 40%！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：超过 2 台机器严禁跑跨机 TP，必须切“2P+2D 分离 + Attention DP”</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 当规模扩至 4 台服务器 (32 卡) 时，千万别建 4 套独立单机孤岛，更别跑跨机 TP=32！</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 采用 2 台 Prefill + 2 台 Decode (Attention DP + DeepEP EP=16)，因 MLA KV 仅 35KB/tok，</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  16K Prompt 的 KV 跨 400G RDMA 传输仅需 11.5ms，吞吐暴涨至 21,120 tok/s 🏆！</text>
