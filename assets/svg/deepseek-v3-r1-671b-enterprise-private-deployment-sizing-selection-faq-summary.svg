  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么 DeepSeek-V3/R1 的 MLA 压缩 KV 与原生 MTP 投机头彻底改写了私有化定容公式？</text>

