<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 292 · NCCL ROCEV2 GID_INDEX, DSCP TRAFFIC CLASS (TC=106) &amp; SOCKET FALLBACK</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">GID=0 Socket Fallback (1.8 GB/s) &amp; Missing TC=106 Lossy Queue (24.5 GB/s) vs. Verified RoCEv2 (380 GB/s)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2: GID=0 L3 Drop or Missing NCCL_IB_TC</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (GID_INDEX=0 RoCEv1 or Unfiltered docker0):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  L2 RoCEv1 dropped at L3 Leaf switch -&gt; falls back to</text>
  <text x="85" y="298" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  TCP NET/Socket over 25G NIC (1.8 GB/s, 211x slower!)</text>
  <text x="85" y="335" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (GID_INDEX=3 RoCEv2 Without NCCL_IB_TC=106):</text>
  <text x="85" y="363" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Default TC=0 lands in LOSSY Queue 0 (No PFC/ECN!) -&gt; 24.5 GB/s</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Tier 1 Socket BW: 1.8 GB/s · Tier 2 Lossy: 24.5 GB/s</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Tier 2 Incast Packet Drop &amp; Go-Back-N Rate: 18.4%</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Auto RoCEv2 GID + TC=106 + IFNAME Guard</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Dynamic show_gids Verification (RoCE v2 + IPv4 Subnet)</text>
  <text x="640" y="275" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• End-to-End Lossless Queue 3 Binding:</text>
  <text x="640" y="303" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  NCCL_IB_TC=106 (DSCP 26) + cma_roce_tos -t 106</text>
  <text x="640" y="338" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• NCCL_SOCKET_IFNAME=^docker0,lo,veth,cali,flannel</text>
  <text x="640" y="370" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">• Fail-Fast Assert on &quot;NET/IB&quot; (Block silent TCP fallback)</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">All-Reduce BusBW: 380.0 GB/s (15.5x Over Tier 2!)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">Packet Drops: 0.0% · 100% Lossless Priority-3 Queue</text>
</svg>
