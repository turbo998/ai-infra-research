<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#568 企业多代异构 GPU 底座 (B200 / H200 / H100 / L40S / MI325X) 三道水位线对标与异构 PD 编排</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">按 Roofline 屋脊拐点与 HBM 带宽基因精准派工：算力型卡 (H100/L40S) 跑 Prefill/编码 · 带宽容量型卡 (H200/B200/MI325X) 跑 Decode · 省 38.6% TCO</text>

  <!-- Box 1: Hardware DNA Table -->
  <rect x="24" y="110" width="366" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 五大主流 GPU 硬件基因与三道水位线</text>
  <rect x="42" y="152" width="330" height="48" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="171" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">NVIDIA B200 (180/192GB HBM3e · 8.0 TB/s)</text>
  <text x="52" y="189" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11">FP8 4.5 PFLOPS / NVFP4 9.0 PFLOPS · 671B 旗舰王牌</text>

  <rect x="42" y="206" width="330" height="48" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="52" y="225" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">NVIDIA H200 (141GB HBM3e · 4.8 TB/s)</text>
  <text x="52" y="243" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">与 H100 同算力 (1979 TFLOPS)，显存+76% 带宽+43% → D池首选</text>

  <rect x="42" y="260" width="330" height="48" rx="6" fill="#0f172a" stroke="#fbbf24"/>
  <text x="52" y="279" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">AMD MI300X (192G) / MI325X (256G · 6.0 TB/s)</text>
  <text x="52" y="297" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">单机 8 卡高达 1.5~2.0 TB 显存 → 超大 KV 池 Decode 利器</text>

  <rect x="42" y="314" width="330" height="54" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="333" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">NVIDIA L40S (48GB GDDR6 · 864 GB/s · 无 NVLink)</text>
  <text x="52" y="352" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11">⛔ 严禁跑 70B Decode (TPOT 56ms)! 仅适合 7B/OCR/Embedding</text>

  <!-- Box 2: Heterogeneous PD Role Orchestration -->
  <rect x="406" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="424" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 异构 PD 角色编排 (好钢用在刀刃上)</text>
  <rect x="424" y="154" width="310" height="90" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="436" y="176" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Prefill 池 → 派给 H100 (80GB) 或 L40S</text>
  <text x="436" y="196" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 机理：Prefill 算完即释放 KV，无需超大显存驻留</text>
  <text x="436" y="214" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• H100 FP8 算力与 H200 完全一致 (1,979 TFLOPS)</text>
  <text x="436" y="232" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 租用单价却比 H200/B200 便宜 28%~42%!</text>

  <rect x="424" y="256" width="310" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="436" y="278" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Decode 池 → 派给 H200 / B200 / MI325X 🏆</text>
  <text x="436" y="298" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 机理：Decode 被 HBM 带宽 (水位线2) 与活跃 KV 容量锁死</text>
  <text x="436" y="316" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• H200 (4.8TB/s) / B200 (8.0TB/s) 将 TPOT 压至 7~12ms</text>
  <text x="436" y="334" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 141GB~256GB 大显存轻松承载数百路长上下文会话</text>
  <text x="436" y="352" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 综合每百万 Token 成本降至 $0.082/1M (省 38.6%)</text>

  <!-- Box 3: Roofline Ridge & Cost/1M -->
  <rect x="768" y="110" width="288" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="786" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 70B FP8 单卡 Decode 性能对标</text>
  <rect x="786" y="154" width="252" height="212" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="798" y="176" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="bold">1. NVIDIA B200 (TP=4):</text>
  <text x="798" y="194" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11.5">TPOT: 6.4 ms · 3,420 tok/s/卡</text>
  <text x="798" y="218" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="bold">2. AMD MI325X 256G (TP=4):</text>
  <text x="798" y="236" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11.5">TPOT: 10.8 ms · 1,980 tok/s/卡</text>
  <text x="798" y="260" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="bold">3. NVIDIA H200 141G (TP=4):</text>
  <text x="798" y="278" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11.5">TPOT: 11.8 ms · 1,820 tok/s/卡</text>
  <text x="798" y="302" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="bold">4. NVIDIA H100 80G (TP=4):</text>
  <text x="798" y="320" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11.5">TPOT: 16.5 ms · 1,150 tok/s/卡</text>
  <text x="798" y="344" fill="#f87171" font-family="Consolas, monospace" font-size="12" font-weight="bold">5. NVIDIA L40S 48G (TP=4):</text>
  <text x="798" y="359" fill="#fca5a5" font-family="Consolas, monospace" font-size="11">TPOT: 56.3 ms ✕ (PCIe+GDDR6)</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 存量多代 GPU 集群（L40S + H100 + H200/B200）零浪费角色分工铁律：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• L40S (48GB GDDR6)：100% 派给 Embedding/Reranker、MinerU/Docling 视觉版面解析、语音 ASR/TTS 与 7B/8B 轻量级联分流模型。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• H100 (80GB HBM3)：派给 70B/671B 的 Prefill 专属池（吃满 1,979 TFLOPS FP8 算力，算完立即经 400G RDMA 把 KV 传走，不占显存）。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• H200 (141GB) / MI325X (256GB) / B200 (180GB+)：100% 派给大模型 Decode 专属池与 671B MoE，吃满 4.8~8.0 TB/s 超高 HBM3e 带宽！</text>
</svg>
