  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级全域办公搜索与知识助手选型：Microsoft 365 Copilot vs. Glean vs. 自建 Early-Binding ACL 混合检索 (#441)</text>
  <text x="28" y="58" class="sub">为什么检索后再做权限过滤会导致“Top-20 全部被拦、返回空白答案”？为什么给全员 10,000 人买 $30/人/月 SaaS 不如“20% 席位 + 80% 自建”？</text>

  <!-- Left Panel: Late-Binding Post-Filter Zero-Hit Trap vs Early-Binding Bitset ACL + Stratified Licensing -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 企业搜索第一大坑：后置权限过滤 (Post-Filter) 空集灾难与过度授权暴露</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 失败做法：先向量召回 Top-20，再去调 SharePoint/Jira 实时校验权限</text>
  <text x="56" y="164" class="mono">• 后置过滤饥饿：高管机密文档占了 Top-20，普通员工查询时 20 条全被拦，直接返回 0 条！</text>
  <text x="56" y="184" class="mono">• 延迟爆炸：20 次实时跨系统权限 API 调用把检索延迟从 30ms 拖慢到 1,450ms ✕</text>
  <text x="56" y="202" class="txt">• 历史过度共享 (Oversharing)：全员可见的薪酬表被 AI 秒级搜出，引发严重合规事故！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：前置位图权限下推 (Early-Binding Roaring Bitmap) + 20/80 分层授权</text>
  <text x="56" y="272" class="mono">• 1. 将 AD/Entra ID 嵌套组展平为文档级 `acl_principals` 位图，随 HNSW 图遍历同步裁剪</text>
  <text x="56" y="292" class="mono">• 2. Webhook 增量同步权限变更 (&lt;5秒生效)，零越权泄漏，P99 检索稳定在 38ms！</text>
  <text x="56" y="312" class="txt">• 3. 20% 重度办公岗配 M365 Copilot + 80% 一线员工走自建多源企业搜索，年省 $242 万！</text>

  <!-- Right Panel: 4 Enterprise Workplace Search & Knowledge Assistant Architectures -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业全域知识搜索方案对标 (10,000 员工规模)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 朴素自建向量库 + 检索后实时调源系统做权限过滤 (Late-Binding)</text>
  <text x="638" y="158" class="mono">• 普通员工召回率仅 41.0% ✕ (被高管文档挤占) | P99 延迟 1,450ms | $18,000/月</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#93c5fd">Tier 2: 全员 100% 采购 Microsoft 365 Copilot ($30/人/月 × 10,000 人)</text>
  <text x="638" y="214" class="mono">• Office/Teams 原生体验极佳 ✓ | 跨异构研發系统权重较弱 | 月度账单 $300,000/月 ✕</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#fde68a">Tier 3: 全员 100% 采购商业跨源企业搜索 SaaS (Glean / गुरु 等 ~$25/人/月)</text>
  <text x="638" y="270" class="mono">• 100+ SaaS 连接器与人物关系图谱强 ✓ | 召回率 91.5% | 月度账单 $250,000/月</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 20% 核心岗 M365 Copilot + 80% 自建 Early-Binding ACL 混合检索 (🏆旗舰)</text>
  <text x="638" y="326" class="mono">• 召回率 93.2% 🏆 | ACL 越权率 0.0% 🏆 | P99 仅 38ms | 月度总成本 $98,400 (年省 $242万)!</text>

  <!-- Bottom Panel: End-to-End Early-Binding ACL Graph & Stratified Copilot Architecture -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端前置 ACL 权限图谱下推 (Early-Binding Security Trimming) 与分层授权架构</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 过度共享预扫与连接器 (Purview)</text>
  <text x="56" y="464" class="mono">• 上线前先扫描全员可见 (`Everyone`)</text>
  <text x="56" y="484" class="mono">  的敏感财务/人事文件夹并收紧</text>
  <text x="56" y="504" class="mono">• CDC 增量同步 SharePoint / Jira /</text>
  <text x="56" y="524" class="mono">  Confluence / GitHub / 飞书文档</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">从源头消灭“被 AI 搜出全公司工资表”！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 嵌套用户组展平与位图下推</text>
  <text x="332" y="464" class="mono">• 将 Entra ID / Okta 递归嵌套群组</text>
  <text x="332" y="484" class="mono">  预计算为高速 Redis 权限令牌</text>
  <text x="332" y="504" class="mono">• 检索时执行 `WHERE acl_groups &amp;&amp;`</text>
  <text x="332" y="524" class="mono">  `user_groups AND NOT deny_groups`</text>
  <text x="332" y="550" class="txt" fill="#34d399">保证返回的 Top-20 100% 是该员工有权看的</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 组织活动图谱个性化重排</text>
  <text x="620" y="464" class="mono">• 搜“Q4 架构规范”时，全公司有 80 篇</text>
  <text x="620" y="484" class="mono">  同名文档，纯语义相似度难分伯仲</text>
  <text x="620" y="504" class="mono">• 注入组织距离权重（同部门/近期协作</text>
  <text x="620" y="524" class="mono">  作者/文档更新时间衰减）二次加权</text>
  <text x="620" y="550" class="txt" fill="#fde68a">首条答案命中率 (MRR@1) 暴涨 +28%！</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 20% M365 + 80% 自建分层配席</text>
  <text x="908" y="464" class="mono">• 高频写 PPT/Word/纪要的 2,000 名</text>
  <text x="908" y="484" class="mono">  管理与商务岗配 M365 Copilot</text>
  <text x="908" y="504" class="mono">• 其余 8,000 名研发/一线员工使用</text>
  <text x="908" y="524" class="mono">  自建企业搜索门户 + MCP 接入</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">兼顾深度办公体验与每年节省 $242 万！</text>
</svg>
