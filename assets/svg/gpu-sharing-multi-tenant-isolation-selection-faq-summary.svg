  <rect width="1280" height="780" fill="url(#bg9)"/>
  <rect x="28" y="24" width="1224" height="732" rx="18" fill="#111827" stroke="#1e293b" stroke-width="2"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent9)"/>

  <!-- Header -->
  <text x="56" y="68" fill="#34d399" font-size="14" font-weight="700" letter-spacing="1.2">AI SOLUTION ARCHITECT · GPU SHARING &amp; MULTI-TENANT ISOLATION SELECTION (ROUND 9)</text>
  <text x="56" y="100" fill="#f8fafc" font-size="23" font-weight="800">多租户 GPU 切分共享与硬件隔离选型：Time-Slicing vs. CUDA MPS vs. 硬件 MIG vs. Green Contexts / Multi-LoRA</text>
  <text x="56" y="126" fill="#94a3b8" font-size="13">Provenance: synthetic queuing/partition model + anonymized_reported NVIDIA MIG/MPS/Green Contexts specs (independently_reproduced=false, live GPU fault injection=not_measured)</text>

  <!-- Left Panel: 4-Tier Architecture Comparison Cards -->
  <rect x="52" y="148" width="590" height="390" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="72" y="178" fill="#e2e8f0" font-size="16" font-weight="700">1. 四档 GPU 切分与隔离架构硬件边界对比 (H100 80GB · 132 SMs · 7 租户并置)</text>

  <!-- Tier 1 -->
  <rect x="70" y="194" width="554" height="72" rx="10" fill="#3b0764" fill-opacity="0.35" stroke="#f87171" stroke-width="1.2"/>
  <text x="86" y="216" fill="#fca5a5" font-size="14" font-weight="700">❌ Tier 1：OS / K8s Time-Slicing 时间片轮转（仅限非生产 Dev/Notebook）</text>
  <text x="86" y="236" fill="#cbd5e1" font-size="12.5">• 机制：整卡按时间片抢占切换（~220 us 损耗），无显存/带宽保护；吞吐 1,180 req/s (SM 52.0%)</text>
  <text x="86" y="254" fill="#fca5a5" font-size="12" font-weight="600">• 风险：并发 P99 暴涨至 82.0 ms (3.42x 恶化)；单 Pod OOM 全卡陪葬 (故障爆炸半径 = 100.0%)</text>

  <!-- Tier 2 -->
  <rect x="70" y="276" width="554" height="76" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="86" y="298" fill="#fde68a" font-size="14" font-weight="700">⚠️ Tier 2：CUDA MPS 多进程并发服务（同一可信团队内部压榨峰值吞吐）</text>
  <text x="86" y="318" fill="#cbd5e1" font-size="12.5">• 机制：单 CUDA 上下文多流并发填满空闲 SM；SM 利用率 78.0%，吞吐 1,840 req/s (1.56x vs T1)，P99 34.5 ms</text>
  <text x="86" y="338" fill="#fbbf24" font-size="12" font-weight="600">• 官方红线：共享虚拟地址空间与致命故障域！单客户端 Xid 31 越界导致全卡 100.0% 进程致命终止</text>

  <!-- Tier 3 -->
  <rect x="70" y="362" width="554" height="80" rx="10" fill="#064e3b" fill-opacity="0.55" stroke="#34d399" stroke-width="1.8"/>
  <text x="86" y="384" fill="#6ee7b7" font-size="14" font-weight="700">✅ Tier 3：NVIDIA 硬件级 MIG（7 × 1g.10gb / 混合切片 · 跨部门生产多租户首选）</text>
  <text x="86" y="404" fill="#ecfdf5" font-size="12.5">• 机制：硅片级物理隔离 SM、HBM3 控制器、L2 Crossbar 与独立页表；吞吐 1,620 req/s (SM 68.5%)</text>
  <text x="86" y="424" fill="#34d399" font-size="12" font-weight="700">• 收益：跨实例故障爆炸半径 = 0.0%！噪音邻居下 P99 稳锁 25.0 ms (+4.2%)，7 合 1 月省 $10,950 (-85.7%)</text>

  <!-- Tier 4 -->
  <rect x="70" y="452" width="554" height="74" rx="10" fill="#0c4a6e" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="86" y="474" fill="#7dd3fc" font-size="14" font-weight="700">🚀 Tier 4：CUDA 12.4+ Green Contexts (108+24 SMs) + SGLang/vLLM Multi-LoRA</text>
  <text x="86" y="494" fill="#e0f2fe" font-size="12.5">• Green Contexts：同进程零拷贝共享 HBM 下动态隔离 Prefill/Decode SM，Decode P99 68.4 -&gt; 24.8 ms (2.76x)</text>
  <text x="86" y="512" fill="#38bdf8" font-size="12" font-weight="700">• Multi-LoRA：28 个部门 70B LoRA 共享 2 张 H100 (70GB 基座 + 4.48GB 适配器池)，卡数降 14.0x，月省 $47,450</text>

  <!-- Right Panel: Quantitative Metrics & Blast Radius Chart -->
  <rect x="662" y="148" width="564" height="390" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="682" y="178" fill="#e2e8f0" font-size="16" font-weight="700">2. 噪音邻居下 P99 延迟、总吞吐与致命故障爆炸半径对比</text>

  <!-- Bar Group 1: P99 Latency -->
  <text x="682" y="206" fill="#94a3b8" font-size="12.5" font-weight="600">噪音邻居并发下 P99 尾延迟 (ms，越低越稳 · 独占基线 = 24.0 ms)</text>

  <text x="682" y="230" fill="#cbd5e1" font-size="12">Tier 1 Time-Slicing</text>
  <rect x="830" y="217" width="328" height="16" rx="4" fill="#ef4444"/>
  <text x="1166" y="230" fill="#fca5a5" font-size="12" font-weight="700">82.0 ms (+241.7%)</text>

  <text x="682" y="254" fill="#cbd5e1" font-size="12">Tier 2 CUDA MPS</text>
  <rect x="830" y="241" width="138" height="16" rx="4" fill="#f59e0b"/>
  <text x="976" y="254" fill="#fde68a" font-size="12" font-weight="700">34.5 ms (+43.8%)</text>

  <text x="682" y="278" fill="#cbd5e1" font-size="12">Tier 3 Hardware MIG</text>
  <rect x="830" y="265" width="100" height="16" rx="4" fill="#10b981"/>
  <text x="938" y="278" fill="#6ee7b7" font-size="12" font-weight="700">25.0 ms (+4.2% · 0% 故障传染)</text>

  <text x="682" y="302" fill="#cbd5e1" font-size="12">Tier 4 Green Contexts</text>
  <rect x="830" y="289" width="99" height="16" rx="4" fill="#38bdf8"/>
  <text x="937" y="302" fill="#7dd3fc" font-size="12" font-weight="700">24.8 ms (+3.3% · PD 降 2.76x)</text>

  <!-- Table of Key Metrics -->
  <rect x="682" y="324" width="524" height="196" rx="10" fill="#111827" stroke="#1e293b"/>
  <text x="698" y="348" fill="#38bdf8" font-size="12.5" font-weight="700">方案 (7 服务并置 / 28 LoRA)</text>
  <text x="892" y="348" fill="#38bdf8" font-size="12.5" font-weight="700">总吞吐 / SM 利用率</text>
  <text x="1032" y="348" fill="#38bdf8" font-size="12.5" font-weight="700">故障爆炸半径</text>
  <text x="1126" y="348" fill="#38bdf8" font-size="12.5" font-weight="700">月成本 / 净省</text>
  <line x1="682" y1="356" x2="1206" y2="356" stroke="#1e293b"/>

  <text x="698" y="378" fill="#94a3b8" font-size="12">Baseline: 7 卡物理独占</text>
  <text x="892" y="378" fill="#94a3b8" font-size="12">1,680 r/s (15.0%)</text>
  <text x="1032" y="378" fill="#6ee7b7" font-size="12">0.0% (物理隔离)</text>
  <text x="1126" y="378" fill="#94a3b8" font-size="12">$12,775 / $0</text>

  <text x="698" y="404" fill="#fca5a5" font-size="12">Tier 1: K8s Time-Slicing</text>
  <text x="892" y="404" fill="#fca5a5" font-size="12">1,180 r/s (52.0%)</text>
  <text x="1032" y="404" fill="#f87171" font-size="12" font-weight="700">100.0% (OOM)</text>
  <text x="1126" y="404" fill="#fca5a5" font-size="12">$1,825 (违约)</text>

  <text x="698" y="430" fill="#fde68a" font-size="12">Tier 2: CUDA MPS</text>
  <text x="892" y="430" fill="#fde68a" font-size="12" font-weight="700">1,840 r/s (78.0%)</text>
  <text x="1032" y="430" fill="#fbbf24" font-size="12" font-weight="700">100.0% (Xid 31)</text>
  <text x="1126" y="430" fill="#fde68a" font-size="12">省 $10,950</text>

  <text x="698" y="456" fill="#6ee7b7" font-size="12" font-weight="700">Tier 3: 硬件级 MIG (7×1g)</text>
  <text x="892" y="456" fill="#6ee7b7" font-size="12">1,620 r/s (68.5%)</text>
  <text x="1032" y="456" fill="#34d399" font-size="12" font-weight="700">0.0% (硅片隔离)</text>
  <text x="1126" y="456" fill="#34d399" font-size="12" font-weight="700">省 $10,950</text>

  <text x="698" y="482" fill="#7dd3fc" font-size="12" font-weight="700">Tier 4A: Green Contexts</text>
  <text x="892" y="482" fill="#7dd3fc" font-size="12" font-weight="700">2,010 r/s (86.5%)</text>
  <text x="1032" y="482" fill="#7dd3fc" font-size="12">单引擎托管</text>
  <text x="1126" y="482" fill="#7dd3fc" font-size="12" font-weight="700">省 $10,950</text>

  <text x="698" y="508" fill="#c084fc" font-size="12" font-weight="700">Tier 4B: 28×70B Multi-LoRA</text>
  <text x="892" y="508" fill="#c084fc" font-size="12">P99 26.8 ms</text>
  <text x="1032" y="508" fill="#c084fc" font-size="12">28 卡 -&gt; 2 卡 (14x)</text>
  <text x="1126" y="508" fill="#c084fc" font-size="12" font-weight="700">省 $47,450/月</text>

  <!-- Bottom Playbook Banner -->
  <rect x="52" y="556" width="1174" height="178" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="74" y="586" fill="#38bdf8" font-size="16" font-weight="700">3. 架构师白板选型口诀与生产核验铁律 (Architect Decision Playbook)</text>

  <text x="74" y="616" fill="#f8fafc" font-size="13.5">① <tspan fill="#34d399" font-weight="700">跨部门/多租户生产小模型与微服务并置</tspan>：必选 <tspan fill="#34d399" font-weight="700">Tier 3 硬件 MIG (7×1g.10gb 或 3g.40gb+2×2g.20gb)</tspan>，以 0.0% 故障传染和 25.0 ms 稳定 P99 净省 85.7% ($10,950/月/卡)。</text>
  <text x="74" y="644" fill="#f8fafc" font-size="13.5">② <tspan fill="#fbbf24" font-weight="700">同团队可信流水线压榨极限吞吐</tspan>：可选 <tspan fill="#fbbf24" font-weight="700">Tier 2 CUDA MPS</tspan>（吞吐 1,840 req/s 比 MIG 高 13.6%），但必须配置统一探针自动拉起以应对 Xid 31 全卡连坐崩溃。</text>
  <text x="74" y="672" fill="#f8fafc" font-size="13.5">③ <tspan fill="#7dd3fc" font-weight="700">单大模型同机 Prefill/Decode 防抢占</tspan>：MIG 无法零拷贝共享 HBM，改用 <tspan fill="#7dd3fc" font-weight="700">Tier 4A CUDA 12.4+ Green Contexts (108+24 SMs)</tspan> 将 Decode P99 从 68.4 ms 压至 24.8 ms (2.76x)。</text>
  <text x="74" y="700" fill="#f8fafc" font-size="13.5">④ <tspan fill="#c084fc" font-weight="700">多部门垂直微调大模型收敛</tspan>：用 <tspan fill="#c084fc" font-weight="700">Tier 4B SGLang/vLLM Multi-LoRA (Punica/S-LoRA)</tspan> 将 28 个 70B 部门模型收敛至 2 张 H100，立省 $47,450/月 (-92.9%)。</text>
  <text x="74" y="722" fill="#64748b" font-size="11.5">Repository: turbo998/ai-infra-research · Evaluator: experiments/gpu_sharing_isolation_selection/run.py --check · Standard: ib-vs-ethernet-roce-selection-faq.md</text>
