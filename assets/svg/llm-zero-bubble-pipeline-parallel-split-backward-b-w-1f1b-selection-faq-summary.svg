<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 257 · ZERO-BUBBLE PIPELINE PARALLELISM: SPLITTING BACKWARD INTO B (dX) &amp; W (dW) FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">Pipeline Parallelism: 1F1B 23.3% Bubble vs `Zero-Bubble B/W Split` (1.2% Bubble, +28.2% TFLOPS)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 2 &amp; 3: Monolithic 1F1B &amp; Interleaved 4x Comm</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (Standard `1F1B`): Treats Backward (`B + W`) as indivisible!</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  Upstream Stage `p-1` stalls waiting for Stage `p` to finish `dW`,</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  leaving `23.3%` idle pipeline bubble (`412.0 TFLOPS`)! ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 3 (`Interleaved 1F1B` V=4): Multiplies P2P traffic by `4.0x`! ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">1F1B Bubble: 23.3% (412 TFLOPS) | Interleaved Comm: 4.0x ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Why Block Upstream Stage p-1 While Computing Local Weight Grad dW?</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: `Zero-Bubble PP` (`B=dX` + Deferred `W=dW`)</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Splits `Backward` into `B` ($dX = dY \cdot W$) &amp; `W` ($dW = X^T dY$)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Immediately sends `B` ($dX$) upstream (`2x` faster critical path!)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Defers local `W` ($dW$) GEMMs to fill warmup/cooldown bubbles!</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• `1.0x` P2P comm volume + `28.0 GB` activation cap (`ZB-H1/H2`)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Bubble: 1.2% (-22.1 pt) | Comm: 1.0x | Speed: 528.0 TFLOPS (+28%) 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Mathematically Exact Gradients With Near-Zero Pipeline Idle Time</text>
</svg>
