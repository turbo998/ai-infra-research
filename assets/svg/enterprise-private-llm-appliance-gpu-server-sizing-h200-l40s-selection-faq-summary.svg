<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg496" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent496" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg496)"/>
  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ON-PREMISES PRIVATE LLM APPLIANCE &amp; GPU SERVER SIZING: L40S VS. H100 VS. H200 (R496)</text>
  <text x="65" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">4x L40S (&lt;6kW Rack) vs. 8x H200 (1,128GB HBM3e): 160 32K-Context Users, -79.4% User TCO</text>

  <rect x="40" y="138" width="545" height="445" rx="14" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="65" y="174" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ Private Appliance Sizing Traps (Tiers 1–3)</text>
  <text x="65" y="210" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 1 `TP=8` Over PCIe (`8x L40S` Without NVSwitch):</text>
  <text x="80" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Cross-socket PCIe AllReduce spikes decode TPOT to 84ms; OOMs at 14 users</text>
  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 2 `10.2 kW 8x H100` in Legacy `6 kW` Air-Cooled Room:</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Trips legacy PDU breakers &amp; forces a $140K facility cooling retrofit</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 3 Unisolated OCR/RAG + FP16 KV Cache on 4 GPUs:</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">10.2GB FP16 KV/user caps concurrency at 28; PDF uploads trigger OOM</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="430" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">72B Model @ 32K RAG Context On-Premises Pain:</text>
  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Tier 1 PCIe TP=8 Decode TPOT P95: 84.0 ms/token</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Tier 1 Max 32K Concurrent Users: 14 users ($11,400/user)</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Tier 2 Facility Power/Cooling Retrofit Penalty: $140,000</text>

  <rect x="615" y="138" width="545" height="445" rx="14" fill="#0f292a" stroke="url(#accent496)" stroke-width="2"/>
  <text x="640" y="174" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">🏆 Tier 4: Facility-Matched L40S / H200 Sizer</text>
  <text x="640" y="210" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. `&lt;=40 Users` (&lt;6kW Air Rack) -&gt; `4U 4x L40S (3.6kW)`</text>
  <text x="655" y="232" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Runs 72B AWQ/FP8 (TP=4 single root) + FP8 KV Cache (zero retrofit!)</text>
  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. `50–160 Users` (&gt;=10kW Rack) -&gt; `8x H200 (1,128GB HBM3e)`</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">+101.7% usable KV-Cache pool over 8x H100; 4.8 TB/s HBM3e decode</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. `TP=4` Dual Replica + GPU-7 `MIG` Isolation for RAG/OCR</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Isolates TEI Embedding/Rerank &amp; OCR on MIG slices; survives 1-GPU fault</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (8x H200 1,128GB Appliance):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Concurrent 32K-Context Users: 160 users (vs 95 on 8x H100)</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Decode Inter-Token Latency (TPOT P95): 14.2 ms/token</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Single-GPU Fault Tolerance: 50% capacity survives (TP=4)</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• 3-Year TCO per Concurrent User: $2,350 (-79.4% vs Tier 1)</text>
</svg>
