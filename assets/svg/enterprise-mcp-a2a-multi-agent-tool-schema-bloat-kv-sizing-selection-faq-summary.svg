<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">#498 企业多智能体协议 (MCP 工具 + A2A 协同) 上下文爆炸治理与 KV 算卡选型指南</text>
  <text x="30" y="60" class="sub">解决“挂载 200 个 MCP 工具塞入 28K 定义词”与“A2A 子智能体全量历史互相拷贝”导致的 24.5 万词/单任务算力灾难</text>

  <!-- Left: Dual Explosion & 2-Stage Governance -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. MCP 工具定义膨胀 + A2A 多轮传话的双重算力黑洞与破局</text>
  <text x="48" y="134" class="txt bad">• 痛点 A (MCP 200 工具膨胀): 200 个 JSON Schema 占 28,000 Token！</text>
  <text x="64" y="154" class="txt">不仅每轮白烧 28K 词，还让大模型选错工具（准确率从 94.6% 跌至 61.5% ✕）</text>
  <text x="48" y="178" class="txt bad">• 痛点 B (A2A 全量历史透传): 5 个子 Agent 互相拷贝 32K 历史，单任务耗 24.5 万词！</text>
  <text x="48" y="204" class="txt good">• 架构师双层治理 (Top-8 语义工具路由 + A2A 结构化契约交接 🏆):</text>
  <text x="64" y="226" class="txt good">1. 网关 0.8ms 向量召回 Top-8 MCP 工具 (28K -&gt; 1,120 词，工具准确率升至 94.6%)</text>
  <text x="64" y="248" class="txt good">2. A2A 严禁传全量聊天草稿，只传 1.8K 结构化 Artifact JSON 引用 (总词数 -89.2%)</text>
  <text x="64" y="270" class="txt good">3. 冻结静态基底 System Prompt 在最前，动态工具放末尾，缓存命中率 91.5% 🏆</text>

  <!-- Right: 4-Tier Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 四种 MCP + A2A 编排架构实测对比 (20 任务/秒并发 · 200 工具)</text>
  <text x="578" y="134" class="txt bad">• Tier 1 全量 200 工具 + 全历史拷贝: 24.5万词/单，选工具仅 61.5%，需 48 张 H200 ✕</text>
  <text x="578" y="158" class="txt warn">• Tier 2 静态固定 200 工具 + 全历史: 21.0万词/单，选工具 64.0%，需 28 张 H200 ✕</text>
  <text x="578" y="182" class="txt">• Tier 3 Top-8 语义工具过滤 + 全历史: 8.4万词/单，选工具 93.8% ✓，需 14 张 H200</text>
  <text x="578" y="208" class="txt good">• Tier 4 Top-8 语义工具 + A2A 契约交接 + 前缀锚定 (推荐 🏆):</text>
  <text x="594" y="232" class="txt good">- 单任务总消耗: 26,500 Token (-89.2% 🏆) | 工具选择准确率: 94.6% 🏆</text>
  <text x="594" y="256" class="txt good">- P95 任务耗时: 3.1s (快 6.26 倍) | 仅需 6 张 H200 (-87.5%，千次成本 $24.5 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 支撑 20 Tasks/s 所需 H200 GPU 卡数与单任务 Token 消耗对比 (越短越优)</text>

  <text x="48" y="365" class="txt">Tier 1 200工具直塞 + 全历史</text>
  <rect x="290" y="352" width="520" height="16" fill="#ef4444" rx="4"/>
  <text x="820" y="365" class="txt bad">48 张 H200 | 245,000 Tok/单 | 工具准确率 61.5% ✕ | 19.4s</text>

  <text x="48" y="395" class="txt">Tier 2 静态200工具 + 全历史</text>
  <rect x="290" y="382" width="305" height="16" fill="#f59e0b" rx="4"/>
  <text x="605" y="395" class="txt warn">28 张 H200 | 210,000 Tok/单 | 工具准确率 64.0% ✕ | 11.2s</text>

  <text x="48" y="425" class="txt">Tier 3 Top-8 工具 + 全历史</text>
  <rect x="290" y="412" width="152" height="16" fill="#3b82f6" rx="4"/>
  <text x="452" y="425" class="txt">14 张 H200 | 84,000 Tok/单 | 工具准确率 93.8% ✓ | 6.4s</text>

  <text x="48" y="455" class="txt good">Tier 4 Top-8 工具 + A2A 契约 🏆</text>
  <rect x="290" y="442" width="65" height="16" fill="#10b981" rx="4"/>
  <text x="365" y="455" class="txt good">6 张 H200 (-87.5% 🏆) | 26,500 Tok/单 (-89.2% 🏆) | 准确率 94.6% | 3.1s 🏆</text>
</svg>
