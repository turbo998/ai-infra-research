<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业大小模型级联路由与知识蒸馏 ROI (671B Teacher -&gt; 32B/8B Student 飞轮) 选型 (#488)</text>
  <text x="28" y="58" class="sub">为什么花 $1,850 蒸馏一颗垂直领域 32B/8B 学生模型，只要上线运行 15.4 小时 (0.64天) 就能全部回本，并永久削减 75% 推理卡数？</text>

  <!-- Left Panel: Why 100% 671B Serving Wastes 75% Budget & Why Sequential Cascade Hurts Latency -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么不能把所有流量全打给 671B？为什么“先试小模型失败再重跑大模型”会拖慢流式体验？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 两个常见误区：全量 671B 硬抗 ($11.5万/月) vs. 串行试错级联 (双倍延迟)</text>
  <text x="56" y="164" class="mono">• 误区 1: 用 671B 旗舰模型处理占 82% 的常规领域任务，50 RPS 需 64 张 H200！</text>
  <text x="56" y="184" class="mono">• 误区 2 (串行级联): 先让未微调 8B 生成完发现置信度低，再把原题重发给</text>
  <text x="56" y="202" class="mono">  671B 重算一遍 -&gt; 不仅没法做流式 SSE 首字直出，长尾延迟还恶化至 24.8ms！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师解法：前置语义路由 (Pre-Router) + 671B-&gt;32B/8B 在线蒸馏数据飞轮 (🏆)</text>
  <text x="56" y="268" class="mono">• 1) 前置 Embedding/DeBERTa 路由器 (2.5ms) 直接将 82% 领域请求分给已蒸馏</text>
  <text x="56" y="288" class="mono">     的 32B/8B 学生模型，18% 疑难长尾分给 671B 教师模型（100% 原生流式 SSE）；</text>
  <text x="56" y="308" class="mono">• 2) 671B 处理的 18% 困难样本每晚自动回流蒸馏学生模型，月省 $86,400！</text>

  <!-- Right Panel: 4 Model Serving & Cascade Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种大小模型架构定量对标 (50 RPS 企业生产负载)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 100% 流量全跑 671B 旗舰教师模型 (无分流、无蒸馏)</text>
  <text x="638" y="158" class="mono">• 业务准确率: 95.4% | P99 TPOT: 18.5ms | 需H200: 64卡 ✕ | 月费: $115,200</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 100% 裸跑开源未蒸馏 8B/14B 小模型 (直接替换导致业务崩盘)</text>
  <text x="638" y="214" class="mono">• 业务准确率: 74.2% ✕ | P99 TPOT: 5.2ms | 需H200: 8卡 | 月费: $14,400</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 串行置信度回退级联 (8B 生成完发现 LogProb 低再重调 671B)</text>
  <text x="638" y="270" class="mono">• 业务准确率: 94.6% ✓ | P99 TPOT: 24.8ms ✕ | 需H200: 28卡 | 月费: $50,400</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 领域蒸馏 32B/8B 学生 (82% 流量) + 671B 教师 (18% 流量) 飞轮 (🏆)</text>
  <text x="638" y="326" class="mono">• 业务准确率: 95.1% 🏆 | TPOT: 7.4ms 🏆 | 需H200: 16卡 (-75%) | $28,800/月</text>

  <!-- Bottom Panel: Distillation ROI Break-Even Formula & Continuous Data Flywheel -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 知识蒸馏回本天数 (Break-Even Days) 手算公式与“夜间潮汐自动蒸馏飞轮”</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 蒸馏一次性投入 vs. 每日节省账单</text>
  <text x="58" y="464" class="mono">• 一次性蒸馏成本 C_distill:</text>
  <text x="58" y="484" class="mono">  用夜间空闲卡生成 50万条 671B 黄金 CoT 数据</text>
  <text x="58" y="504" class="mono">  ($850) + SFT/GRPO 微调 32B/8B 学生 ($1,000)</text>
  <text x="58" y="524" class="mono">  = 合计仅 $1,850！</text>
  <text x="58" y="544" class="mono">• 每天节省推理账单 = ($115.2k - $28.8k) / 30</text>
  <text x="58" y="564" class="mono">  = $2,880/天 -&gt; 仅需 0.64 天 (15.4小时) 回本！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: RouteLLM 前置路由分流比与綜合成本</text>
  <text x="436" y="464" class="mono">• 设学生模型承接比例为 r_s (0.82)：</text>
  <text x="436" y="484" class="mono">  Cost_blend = r_s * Cost_student</text>
  <text x="436" y="504" class="mono">               + (1 - r_s) * Cost_teacher</text>
  <text x="436" y="524" class="txt">• 随着每周困难样本持续蒸馏进学生模型，r_s 从</text>
  <text x="58" y="544" class="txt"></text>
  <text x="436" y="544" class="txt">  第 1 周的 60% 爬升至第 4 周的 82%~90%，</text>
  <text x="436" y="564" class="txt" fill="#34d399">  推理集群成本随时间自动指数级下降！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: 闭环数据飞轮的四步自动化管线</text>
  <text x="814" y="464" class="mono">• 1) 白天: OTel 尾部采样收集被路由给 671B 的</text>
  <text x="814" y="484" class="mono">     18% 疑难真实请求 (脱敏后入 ClickHouse)</text>
  <text x="814" y="504" class="mono">• 2) 凌晨 01:00: 潮汐池跑 Best-of-8 + 沙箱验证</text>
  <text x="814" y="524" class="mono">     筛选高分黄金答案</text>
  <text x="814" y="544" class="mono">• 3) 凌晨 03:00: 自动 LoRA/全参更新 32B 学生</text>
  <text x="814" y="564" class="mono">• 4) 早 07:00: 通过评测门禁后热更新上线！</text>
</svg>
