<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg626" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr626" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg626)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr626)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#626 三道水位线 GPU 容量估算 (Sizer)、TPM/TPS/PTU 换算、Little's Law 与五大场景 SLA 指南</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Three-Watermark GPU Sizer (VRAM · HBM Bandwidth · Compute), QPS→TPS→TPM→PTU Little's Law &amp; 5-Scenario SLA/Goodput Matrix</text>

  <!-- Left: Three Watermarks Formula Box -->
  <rect x="48" y="120" width="368" height="330" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="66" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">① 三道水位线手算公式 (放得下 &amp; 跑得快)</text>
  <rect x="64" y="162" width="336" height="84" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="76" y="182" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">水位线 1：显存容量下界 (N_mem · 留 15% 余量)</text>
  <text x="76" y="204" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">M_tot = M_weights(总参数) + B_act·S·Bytes_KV + M_act</text>
  <text x="76" y="224" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">N_mem = ceil( M_tot / (0.85 × HBM_per_GPU) )</text>

  <rect x="64" y="256" width="336" height="84" rx="8" fill="#0f172a" stroke="#c084fc"/>
  <text x="76" y="276" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">水位线 2：HBM 带宽与最低 TPOT 下界 (N_bw)</text>
  <text x="76" y="298" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">单步必读字节 = M_active_weights + B_act·S·Bytes_KV</text>
  <text x="76" y="318" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">N_bw = ceil( 必读字节 / (0.72 × BW_HBM × TPOT_SLA) )</text>

  <rect x="64" y="350" width="336" height="86" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="76" y="370" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">水位线 3：Prefill 算力与吞吐下界 (N_compute)</text>
  <text x="76" y="392" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">N_comp = ceil( 2·P_act·QPS·S_in·(1-r_hit) / TFLOPS_eff )</text>
  <text x="76" y="414" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🏆 最终卡数 N_GPU = max(N_mem, N_bw, N_comp)</text>

  <!-- Center: Little's Law & TPM/TPS/PTU Conversion -->
  <rect x="432" y="120" width="356" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="450" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">② Little's Law 并发推导与 TPM/TPS/PTU</text>
  <rect x="448" y="162" width="324" height="128" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="460" y="184" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">1. 从业务 QPS 到在途并发会话数 (Little's Law)</text>
  <text x="460" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 端到端驻留: E2EL = TTFT + (S_out - 1) × TPOT</text>
  <text x="460" y="226" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 在途总并发: B_active = QPS × E2EL</text>
  <text x="460" y="246" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 算例 (25 QPS, 8K In/512 Out, TTFT=0.5s, TPOT=14ms):</text>
  <text x="460" y="268" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">  E2EL = 7.65s ➔ B_active = 25 × 7.65 = 192 并发！</text>

  <rect x="448" y="302" width="324" height="134" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="460" y="324" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2. 单流 TPS vs. 系统 TPS vs. 加权 TPM / PTU</text>
  <text x="460" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 单用户流速率 = 1 / TPOT (14ms ➔ 71.4 tok/s/user)</text>
  <text x="460" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 系统总 TPS = QPS × (S_in + S_out) = 212.8K tok/s</text>
  <text x="460" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 云端加权 TPM = 60·QPS·[S_in(1-0.8r_hit) + 4·S_out]</text>
  <text x="460" y="408" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• P80 PTU 底座 + P20 PAYGO 溢出立省 58.4% 云费！</text>

  <!-- Right: 5 Business Scenarios SLA & Goodput Matrix -->
  <rect x="804" y="120" width="348" height="330" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="822" y="148" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">③ 五大业务场景核心 SLA 基准红线</text>
  <rect x="820" y="162" width="316" height="274" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="832" y="186" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">1. 实时语音数字人 / 外呼 (Voice Agent)</text>
  <text x="832" y="204" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">   M2E ≤ 300ms | LLM TTFT ≤ 120ms | P99 ITL ≤ 12ms</text>
  <text x="832" y="230" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2. IDE 实时代码补全 (Coding FIM)</text>
  <text x="832" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">   E2EL ≤ 200ms | P95 TTFT ≤ 80ms | P99 TPOT ≤ 8ms</text>
  <text x="832" y="274" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">3. 企业对话与知识库 RAG (Chat / RAG)</text>
  <text x="832" y="292" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">   P95 TTFT ≤ 800ms | P99 TPOT/ITL ≤ 18ms (&gt;55 tok/s)</text>
  <text x="832" y="318" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="700">4. 深度推理模型 (&lt;think&gt; R1 / o3-mini)</text>
  <text x="832" y="336" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">   首包 ≤ 1.5s | TPOT ≤ 14ms (4K思维链控制在 55s内)</text>
  <text x="832" y="362" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">5. 离线大批量文档 ETL (Nightly Batch)</text>
  <text x="832" y="380" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">   不限 TTFT | 拉满 Batch 追求最高 tok/s/$ ($0.028/1M)</text>
  <text x="832" y="414" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">💡 以双 SLA Goodput 定卡，而非虚标 Raw TPS！</text>

  <!-- Bottom Summary Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #626 容量规划黄金收益 (25 QPS · 8K In / 512 Out · 70B FP8)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 仅按显存水位拍脑袋配 2 张 H200: 虽“放得下”，但 HBM 带宽被打爆导致 TPOT 恶化至 44.8ms (Goodput 跌至 31.5%)</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 三道水位线协同 + Prefix Cache 70% + P80 PTU: 精准定容 8 张 H200 (TPOT 13.6ms · Goodput 99.4%)，较盲目按峰值倍增省 42.9% TCO！</text>
</svg>
