  <text x="468" y="404" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• PD 分离严格锁死在同可用区 400G RDMA 内；跨云/跨区弹性溢出永远按“完整请求级 (Whole-Request JSON)”路由！</text>

