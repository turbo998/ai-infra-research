<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 215 · SHARED-PREFIX DECODE (PAGEDATTENTION VS HYDRAGEN &amp; FLASHINFER CASCADE ATTENTION) FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800">64-Request Shared 16K Prefix: 14.2ms PagedAttention (64x HBM Reads) vs 1.12ms Cascade GEMM (12.7x)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Standard PagedAttention Prefix Trap</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Even with `--enable-prefix-caching`, PagedAttention only deduplicates</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  HBM STORAGE—not HBM BANDWIDTH during Decode!</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Each of B=64 requests runs an independent GEMV (`1 FLOP/Byte`)</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• 8GB shared KV overflows 50MB L2 -&gt; Read 64 times per step (14.2 ms)! ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Decode Attention: 14.2 ms | Shared KV Reads: 64x per Step</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Page-Table Deduplication Does Not Batch Queries Across Requests</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3 &amp; 4: Hydragen &amp; FlashInfer Cascade LSE Merge</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Stacks all B=64 queries into 2D matrix `Q_batch [64, d]`!</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Stage 1: Loads `K_shared, V_shared` ONCE from HBM -&gt; Tensor Core GEMM!</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Stage 2: Runs PagedAttention ONLY on short 512-token unique suffixes</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Stage 3: Exact online Softmax `LogSumExp (LSE)` reduction in registers</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Decode Attention: 1.12 ms (12.7x Faster) | Shared KV Read: 1x 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">64x Higher Arithmetic Intensity for RL GRPO Rollouts &amp; System Prompts</text>
</svg>
