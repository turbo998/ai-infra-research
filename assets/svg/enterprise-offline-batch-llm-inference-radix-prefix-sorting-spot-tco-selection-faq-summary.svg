<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业百亿 Token 离线批处理推理 (Offline Batch LLM: 字典序前缀重排 + Spot 竞价池) 选型 (#474)</text>
  <text x="28" y="58" class="sub">为什么离线跑 1000 万条数据前只需加一行“按 Prompt 字典序重排 (Lexicographical Sort)”，就能让单卡吞吐暴涨 6.9 倍、成本压至 $0.028/1M？</text>

  <!-- Left Panel: Why Unsorted Offline Batch Wastes 76% of Prefix Cache -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么离线批处理拥有在线推理永远无法企及的“上帝视角”优化特权？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 随机顺序直接喂给 vLLM/SGLang (Cache 频繁颠簸淘汰 = 仅 24% 命中 ✕)</text>
  <text x="56" y="164" class="mono">• 1000万条任务含 5000 篇长文档，每篇文档对应 2000 个不同问题；</text>
  <text x="56" y="184" class="mono">• 若按数据库随机顺序送入 GPU，HBM 容不下 5000 篇文档的 KV Cache，</text>
  <text x="56" y="202" class="mono">  导致刚算完的文档 KV 被立刻驱逐，下一条同文档问题又要重算 Prefill！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师两大“零成本”神技：字典序前缀重排 + 长度分桶 + Spot 竞价卡 (🏆)</text>
  <text x="56" y="268" class="mono">• 1) 字典序重排 (Radix Sort): 发送前对全量 Prompt 按前缀排序，同一篇</text>
  <text x="56" y="288" class="mono">     长文档的 2000 个问题紧挨着连续进入同卡，Prefix 命中率飙至 94.2%！</text>
  <text x="56" y="308" class="mono">• 2) 解除 TPOT 紧箍咒: 离线无需保 25ms TPOT，Batch 拉满至 512，吞吐 6.9x！</text>

  <!-- Right Panel: 4 Offline Batch Tiers Comparison -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 百亿 Token (10B Tokens) 离线批处理四种架构定量对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 直接混入在线实时推理池 (受限于 TPOT&lt;=25ms 小 Batch)</text>
  <text x="638" y="158" class="mono">• 前缀命中: 18.5% | 单卡吞吐: 1,420 tok/s ✕ | 成本: $0.34/1M ($3,400)</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 公有云托管 50% 折扣 Batch API (24 小时异步返回 JSONL)</text>
  <text x="638" y="214" class="mono">• 前缀命中: 50.0% | 单卡吞吐: 2,800 tok/s | 成本: $0.17/1M ($1,700)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 独立按需 GPU 离线池 (放开 Batch=256，但未做输入前缀排序)</text>
  <text x="638" y="270" class="mono">• 前缀命中: 24.0% | 单卡吞吐: 3,650 tok/s ✓ | 成本: $0.11/1M ($1,100)</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: Ray Data + 字典序前缀重排 + 长度分桶 + Spot/潮汐卡 (推荐 🏆)</text>
  <text x="638" y="326" class="mono">• 前缀命中: 94.2% 🏆 | 单卡吞吐: 9,840 tok/s (6.9x 🏆) | 成本: $0.028/1M 🏆</text>

  <!-- Bottom Panel: Radix Sort Math, Length Bucketing & Spot Micro-Checkpointing -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 离线吞吐倍增三大手算公式 (字典序重排 × 长度分桶防尾拖 × Spot 1000行微快照)</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 字典序重排节省的 Prefill 算力</text>
  <text x="58" y="464" class="mono">• 设每篇长背景文档 S_doc 被提问 K 次：</text>
  <text x="58" y="484" class="mono">  无序随机: 命中率 18.5% -&gt; 算 0.815*K 次</text>
  <text x="58" y="504" class="mono">  字典序排列: 第 1 问算 1 次，后 K-1 问 100%</text>
  <text x="58" y="524" class="mono">  命中 L1 HBM 缓存 -&gt; Prefill 算力立省 94.2%！</text>
  <text x="58" y="548" class="txt" fill="#6ee7b7">一行 df.sort_values('prompt') 即可白捡 2.7x 提速！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: 解除 TPOT 约束把算力推上 Roofline</text>
  <text x="436" y="464" class="mono">• 在线推理为保 TPOT &lt;= 25ms，被迫限制</text>
  <text x="436" y="484" class="mono">  B_active &lt;= 48 (Tensor Core 利用率仅 18%)</text>
  <text x="436" y="504" class="mono">• 离线批处理允许单请求 TPOT = 120ms，但</text>
  <text x="436" y="524" class="mono">  把并发 Batch 拉满至 384~512，越过算术强度</text>
  <text x="436" y="544" class="mono">  拐点，单卡总输出 TPS 从 1.4k 飙升至 9.8k！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: Spot 竞价实例 1000 行微快照防丢</text>
  <text x="814" y="464" class="mono">• Spot H100/H200 价格仅为按需实例的 32%~40%，</text>
  <text x="814" y="484" class="mono">  但随时可能收到 30 秒抢占回收通知 (SIGTERM)</text>
  <text x="814" y="504" class="mono">• 采用 Ray Data 流式分片，每完成 1,000 条</text>
  <text x="814" y="524" class="mono">  (约 18 秒) 立即向对象存储刷写 1 个 Parquet</text>
  <text x="814" y="544" class="mono">  微分片，抢占重算损失严格封顶 &lt; 0.4%！</text>
</svg>
