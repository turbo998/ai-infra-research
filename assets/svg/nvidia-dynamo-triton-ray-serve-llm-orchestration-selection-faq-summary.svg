<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg181" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc181" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg181)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="410" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="257" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 181 · NVIDIA DYNAMO + NIXL vs. TRITON vs. RAY SERVE</text>
  <text x="478" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">企业级分布式推理编排框架（Triton vs. KServe vs. Ray Serve vs. NVIDIA Dynamo）选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">为什么 NVIDIA 推出 Dynamo 接棒传统 Triton？从单机无状态动态批处理，跨越到全局 KV 智能路由 + NIXL 零拷贝 PD 分离 (Goodput 提升 3.21x)</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc181)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="68" y="184" width="224" height="24" rx="6" fill="#78350f"/>
  <text x="180" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 传统 Triton 单机无状态服务</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">CV/BERT 王牌，缺跨机 KV 编排</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">C++ 单机动态批处理 + Ensemble</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="80" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心定位与代际局限：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">专为单节点无状态模型 (YOLO/BERT/ONNX)</text>
  <text x="80" y="327" fill="#e2e8f0" font-size="11.5" font-family="Segoe UI, Inter, sans-serif">设计；无全局 KV 树与跨机 PD 分离 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32K KV 跨机交接: <tspan fill="#fbbf24" font-weight="700">145.0 ms (gRPC)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 集群 KV 命中率: <tspan fill="#fbbf24" font-weight="700">16.0% (单机孤岛)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡 SLA Goodput: <tspan fill="#fbbf24" font-weight="700">215.0 tok/s/GPU</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万达标 Token 费: <tspan fill="#fbbf24" font-weight="700">$1.86 / 1M tok</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="190" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 传统 CV / 语音 / 搜推小模型首选</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <rect x="368" y="184" width="228" height="24" rx="6" fill="#0c4a6e"/>
  <text x="482" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 标准 KServe 声明式云平台</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">K8s 标准化治理与灰度发布</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">InferenceService CRD + Istio/Knative</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="380" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心优势与适用边界：</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">统一管控数百个异构模型生命周期与</text>
  <text x="380" y="327" fill="#e2e8f0" font-size="11.5" font-family="Segoe UI, Inter, sans-serif">Canary 切流；需外挂网关补齐 KV 路由</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32K KV 跨机交接: <tspan fill="#38bdf8" font-weight="700">92.0 ms</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 集群 KV 命中率: <tspan fill="#38bdf8" font-weight="700">24.5%</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡 SLA Goodput: <tspan fill="#38bdf8" font-weight="700">284.0 tok/s/GPU</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万达标 Token 费: <tspan fill="#38bdf8" font-weight="700">$1.41 / 1M tok</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="490" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 多团队标准 K8s MLOps 管控平台</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
  <rect x="668" y="184" width="232" height="24" rx="6" fill="#3b0764"/>
  <text x="784" y="200" fill="#e9d5ff" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · Ray Serve LLM 复合智能体</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">Python 多模型 DAG 灵活编排</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">OCR+Embedding+Rerank+LLM 细粒度扩缩</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#9333ea"/>
  <text x="680" y="293" fill="#d8b4fe" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (复合 AI 研发最爱)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">纯 Python 组合多阶段异构模型，每个环节</text>
  <text x="680" y="327" fill="#e2e8f0" font-size="11.5" font-family="Segoe UI, Inter, sans-serif">独立按 0.25 GPU 弹性扩缩容 + 前缀路由</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32K KV 跨机交接: <tspan fill="#c084fc" font-weight="800">48.0 ms ✅</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 集群 KV 命中率: <tspan fill="#c084fc" font-weight="800">76.0% ✅</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡 SLA Goodput: <tspan fill="#c084fc" font-weight="800">445.0 tok/s (2.07x ✅)</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万达标 Token 费: <tspan fill="#c084fc" font-weight="800">$0.90 / 1M (-51.6% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#3b0764"/>
  <text x="790" y="479" fill="#f3e8ff" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 复合 RAG / Agent 多模型流水线首选</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · NVIDIA Dynamo + NIXL</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">14.2ms 传 KV · Goodput 3.21x</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Rust 控制面 + NIXL 零拷贝 + 弹性 PD</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (降本 68.8%)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">统一封装 vLLM/SGLang/TRT-LLM，用 NIXL</text>
  <text x="980" y="327" fill="#e2e8f0" font-size="11.5" font-family="Segoe UI, Inter, sans-serif">直通 NVLink/RDMA/DRAM/SSD 传 KV！</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32K KV 跨机交接: <tspan fill="#34d399" font-weight="800">14.2 ms (快 10.2x 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 集群 KV 命中率: <tspan fill="#34d399" font-weight="800">92.5% 🏆</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡 SLA Goodput: <tspan fill="#34d399" font-weight="800">690.0 tok/s (3.21x 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万达标 Token 费: <tspan fill="#34d399" font-weight="800">$0.58 / 1M (-68.8% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 大规模 PD 分离与 AI 工厂终局</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么需要 `NVIDIA Dynamo` 接替 `Triton`？什么是 `NIXL` 统一显存传输层？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：从“单机无状态张量服务 (Triton)”到“跨机有状态 KV 编排 (Dynamo)”</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 传统 Triton 诞生于 2018 年，假设每次请求是无状态的（输入一张图，输出分类概率）；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 大模型推理是重度有状态的（数百 GB KV 缓存跨多轮驻留，Prefill 与 Decode 分在不同机器）；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Dynamo 不替代 vLLM/SGLang/TRT-LLM，而是作为它们的“上层分布式控制面与 KV 调度大脑”！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：NIXL (NVIDIA Inference Xfer Library) 抹平四级存储传输差异</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• NIXL 将机内 NVLink P2P、跨机 GPUDirect RDMA (UCX/IBGDA)、主机 DRAM 与</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  NVMe SSD (GDS) 统一抽象为一套非阻塞异步零拷贝 API；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 配合 Dynamo Planner 在 8.5s 内动态调整 P/D 节点配比，单卡有效 Goodput 暴涨 3.21x 🏆！</text>
</svg>
