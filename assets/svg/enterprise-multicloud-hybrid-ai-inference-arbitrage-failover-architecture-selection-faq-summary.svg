  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 跨云/混合云推理三大物理红线（严禁踩坑！）</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">红线 1: 严禁跨云做 TP / EP / PD 分离 (WAN 30ms RTT + $0.08/GB 出网费!)</text>
  <text x="90" y="242" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">红线 2: 严禁把同一多轮会话的 Turn 1..N 轮询打散到不同云 (0% KV 命中!)</text>
  <text x="90" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">铁律 3: 必须以【完整单会话】为最小粒度做云间粘性路由 (Cloud-Sticky)</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 跨云出网流量税：若跨云传 16K KV (2.68GB)，每千次请求光流量费就高达 $214！</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 正确粒度：每个云内部闭环跑完完整 Prefill+Decode，云间仅传轻量 JSON 文本</text>
  <text x="76" y="350" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 提示词漂移防护：商业闭源模型跨云切换 (GPT-4o &lt;-&gt; Claude) 必挂统一评测门禁！</text>

