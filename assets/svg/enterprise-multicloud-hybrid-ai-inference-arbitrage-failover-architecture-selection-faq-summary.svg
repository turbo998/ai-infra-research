  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #413 · MULTI-CLOUD &amp; HYBRID AI INFERENCE ARCHITECTURE (AZURE + AWS + GCP + ON-PREM K8S)</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业跨云与混合云 AI 推理参考架构：流量调度、异构算力套利与零锁定指南</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">为什么跨云严禁拆 PD 分离或逐轮轮询？如何用整会话粘性路由 + vLLM 多芯片底座 + Spot 套利省下 54.8% 成本？</text>

