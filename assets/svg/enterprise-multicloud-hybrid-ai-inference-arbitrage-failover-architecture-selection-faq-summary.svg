  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">25% 套利池 : GCP TPU v6e / AWS &amp; Azure Spot GPU (-65% 折扣 + 30s 优雅排空)</text>
  <text x="648" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">15% 逃生池 : Azure Foundry + AWS Bedrock + GCP Vertex 托管 API</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 统一运行时契约：vLLM V1 同一套镜像无缝跑在 NVIDIA H200、AMD MI325X 与 Cloud TPU</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• Spot 抢占无感撤离：收到云厂商 30 秒回收通知立即摘流，在途请求 100% 完结后下线</text>
  <text x="634" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：跨三云套利将百万 Token 综合成本压至 $0.21，可用性达 99.995%！</text>

