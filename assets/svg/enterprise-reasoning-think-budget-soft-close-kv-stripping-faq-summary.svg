  <rect width="1200" height="630" fill="url(#bg633)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr633)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#633 深度推理模型 (&lt;think&gt; R1/QwQ) 预算治理：三档思考路由、软闭合 &lt;/think&gt; 与历史 KV 剥离算卡</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Enterprise Reasoning Model (&lt;think&gt;) Governance: 55/30/15 Budget Router, Soft &lt;/think&gt; Logits Closure &amp; Multi-Turn KV Stripping Sizer</text>

  <!-- Left: Two Production Anti-Patterns -->
  <rect x="48" y="120" width="368" height="330" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <text x="66" y="148" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">❌ 推理模型两大生产反模式</text>
  <rect x="64" y="164" width="336" height="126" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="76" y="186" fill="#f87171" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">1. 无约束放任 &lt;think&gt; (过度思考 Overthinking)</text>
  <text x="76" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 简单问候/提取也递归反思 3,850 Tokens</text>
  <text x="76" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Little's Law 驻留 E2EL 高达 49.4 秒</text>
  <text x="76" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 多轮把历史 &lt;think&gt; 塞回上下文，KV 暴涨 4 倍</text>
  <text x="76" y="270" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 20 QPS 被迫堆叠 32 张 H200 ($102.4K/月)！</text>

  <rect x="64" y="302" width="336" height="134" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="76" y="324" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2. 粗暴硬设 API max_tokens = 1,024</text>
  <text x="76" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 模型还在 &lt;think&gt; 块内部推导就被一刀切断</text>
  <text x="76" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 根本未生成 &lt;/think&gt; 后的最终正文与 JSON</text>
  <text x="76" y="386" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 导致 38.5% 复杂请求返回“空答案”业务报错！</text>
  <text x="76" y="408" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 白白烧掉 1,024 词算力却产出 0% 有效业务价值</text>

  <!-- Center/Right: 3-Pillar Reasoning Governance -->
  <rect x="432" y="120" width="720" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="452" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">🏆 生产黄金方案：55/30/15 三档难度路由 + 软闭合 &lt;/think&gt; + 多轮 &lt;think&gt; KV 剥离</text>

  <rect x="452" y="164" width="218" height="156" rx="10" fill="#0f172a" stroke="#38bdf8"/>
  <text x="466" y="188" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">① 55/30/15 三档思考预算路由</text>
  <text x="466" y="210" fill="#cbd5e1" font-size="11.5">• 55% 简单检索/分类 (Fast):</text>
  <text x="466" y="228" fill="#6ee7b7" font-size="11.5" font-weight="700">  预填 &lt;think&gt;\n&lt;/think&gt; 0思考直出</text>
  <text x="466" y="248" fill="#cbd5e1" font-size="11.5">• 30% 标准业务分析 (Standard):</text>
  <text x="466" y="266" fill="#cbd5e1" font-size="11.5">  思考预算上限 B_think = 1,024 词</text>
  <text x="466" y="286" fill="#cbd5e1" font-size="11.5">• 15% 数学/代码/精算 (Deep):</text>
  <text x="466" y="304" fill="#cbd5e1" font-size="11.5">  放开思考上限 B_think = 4,096 词</text>

  <rect x="684" y="164" width="218" height="156" rx="10" fill="#0f172a" stroke="#10b981"/>
  <text x="698" y="188" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">② LogitsProcessor 软闭合门禁</text>
  <text x="698" y="210" fill="#cbd5e1" font-size="11.5">• 当思考词数达到 B_think - 64 时</text>
  <text x="698" y="230" fill="#cbd5e1" font-size="11.5">• 在句号处自动注入收敛提示：</text>
  <text x="698" y="250" fill="#6ee7b7" font-size="11.5" font-weight="700">  "\n思考结束 &lt;/think&gt;\n"</text>
  <text x="698" y="272" fill="#cbd5e1" font-size="11.5">• 强制预留 512 词完整输出最终</text>
  <text x="698" y="292" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">  正文/JSON ➔ 截断失败率 0.0%！</text>

  <rect x="916" y="164" width="218" height="156" rx="10" fill="#0f172a" stroke="#a855f7"/>
  <text x="930" y="188" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">③ 多轮历史 &lt;think&gt; KV 物理剥离</text>
  <text x="930" y="210" fill="#cbd5e1" font-size="11.5">• 当前轮生成完毕后，立即释放</text>
  <text x="930" y="230" fill="#cbd5e1" font-size="11.5">  &lt;think&gt;...&lt;/think&gt; 对应的 Paged KV</text>
  <text x="930" y="250" fill="#cbd5e1" font-size="11.5">• 后续轮次仅保留 User Prompt 与</text>
  <text x="930" y="270" fill="#cbd5e1" font-size="11.5">  最终 Assistant 结论的 KV 块</text>
  <text x="930" y="292" fill="#e9d5ff" font-size="11.5" font-weight="700">• 10轮会话 KV 显存立省 74.2%！</text>

  <rect x="452" y="334" width="682" height="102" rx="10" fill="#0f172a" stroke="#f59e0b"/>
  <text x="468" y="358" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">📐 Little's Law 算卡连锁效应 (为什么控制思考长度能省 75% GPU？)：</text>
  <text x="468" y="382" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 加权平均输出从 3,850 词压至 940 词 (-75.6%) ➔ 平均驻留 E2EL 从 49.4s 缩至 12.1s (-75.5%)</text>
  <text x="468" y="404" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• 20 QPS 下的实时在途并发 B_active 从 988 路骤降至 242 路 ➔ 所需 H200 从 32 张砍至 8 张 (-75.0%)！</text>

  <!-- Bottom Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #633 深度推理模型治理核心收益 (20 QPS · 10轮企业多步推理 Agent)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 平均输出词数: 3,850 ➔ 940 tok (-75.6%)   |   • 截断空答案率: 38.5% ➔ 0.0%   |   • 多轮 KV 显存: -74.2%</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 集群总卡数: 32× H200 ($102.4K/月) ➔ 8× H200 ($25.6K/月 · 立省 75.0% GPU · 每年净省 $921,600)！</text>
