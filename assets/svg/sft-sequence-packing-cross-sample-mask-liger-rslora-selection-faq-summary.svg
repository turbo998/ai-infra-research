<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad85" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad85" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad85)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad85)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22" font-weight="800">🧩 大模型微调 (SFT) 变长无填充打包 (cu_seqlens)、Liger 融合交叉熵与 rsLoRA/DoRA 选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">32×H100 80GB ($80/hr) · 70B LLM (词表 V=128,256, 最大 16K) · 50万条 SFT 样本 (均长 1,850 词) · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#431407" stroke="#f97316" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#fed7aa" font-size="13" font-weight="700" text-anchor="middle">Round 85 · Packing &amp; Liger-CE</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 传统 Pad-to-Max 硬填充</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">1,850 词样本补齐到 16K · 78.4% 算力算空气</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Padding 无效算力浪费: <tspan fill="#f87171" font-weight="700">78.4% (全在算 &lt;pad&gt; ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 跨样本注意力串味率: <tspan fill="#34d399" font-weight="700">0.0% (独立样本行)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• LM-Head 词表峰值显存: <tspan fill="#f87171" font-weight="700">16.80 GB / GPU ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 有效吞吐 / 下游准确率: <tspan fill="#f87171" font-weight="700">14,200 tok/s ✕ · 79.2%</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 耗时 / 年化集群成本: <tspan fill="#f87171" font-weight="700">18.1h ✕ · $640,000/yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ SFT 微调最常见的“算空气”巨坑：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">为了兼容偶发的 16K 长对话，把平均 1,850 词的</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">样本后面全塞满 14,500 个 `&lt;pad&gt;`，H100 有近</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">80% 的时间在给毫无意义的填充符做矩阵乘！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 粗放首尾拼接 (无掩码隔离)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">仅加 &lt;eos&gt; 拼成 16K · 样本 B 偷看样本 A 串味</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Padding 无效算力浪费: <tspan fill="#fbbf24" font-weight="700">1.8%</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 跨样本注意力串味率: <tspan fill="#f87171" font-weight="700">100.0% (严重串味幻觉 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• LM-Head 词表峰值显存: <tspan fill="#f87171" font-weight="700">16.80 GB / GPU ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 有效吞吐 / 下游准确率: <tspan fill="#f87171" font-weight="700">54.6k tok/s · 72.5% (-13.3pt ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 耗时 / 年化返工成本: <tspan fill="#f87171" font-weight="700">4.7h · $490,000/yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 为什么粗放 ConstantLengthDataset 会训废模型？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">8 条完全不相关的对话只用 `&lt;eos&gt;` 拼成一行且</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">共用同一个下三角掩码！第 8 条样本不仅偷看前</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">7 条内容，连 RoPE 位置编码也从 14000 开始算！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: cu_seqlens 变长块对角隔离</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">flash_attn_varlen_func + 逐样本 RoPE 位置归零</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Padding 无效算力浪费: <tspan fill="#34d399" font-weight="700">0.6% (FFD 装箱 ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 跨样本注意力串味率: <tspan fill="#34d399" font-weight="700">0.0% (严格块对角掩码 ✅)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• LM-Head 词表峰值显存: <tspan fill="#f87171" font-weight="700">仍高达 16.80 GB / GPU ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 有效吞吐 / 下游准确率: <tspan fill="#60a5fa" font-weight="700">61,200 tok/s ✅ · 83.4% ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 耗时 / 年化集群成本: <tspan fill="#60a5fa" font-weight="700">4.2h · $195,000/yr</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 真正无损的 1D 展平打包：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">传入 `cu_seqlens=[0, 1200, 3100, ...]`，FlashAttn</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">在每个子样本内部独立算因果注意力，且每条样本</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">开头 `position_ids` 归零，数学上与单条跑 100% 等价！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 变长打包 + Liger-CE + rsLoRA 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">融合线性交叉熵 (省 32x 词表显存) + 秩稳定 DoRA</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Padding 无效算力浪费: <tspan fill="#34d399" font-weight="700">仅 0.4% 🏆</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 跨样本注意力串味率: <tspan fill="#34d399" font-weight="700">0.0% (零串味 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• LM-Head 词表峰值显存: <tspan fill="#34d399" font-weight="700">0.52 GB (暴降 32.3x 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 有效吞吐 / 下游准确率: <tspan fill="#34d399" font-weight="700">78.5k tok/s (5.53x) · 85.8% 🏆</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 耗时 / 年化净省: <tspan fill="#34d399" font-weight="700">3.27h · 年省 $525,000 🏆</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 攻克 128K 大词表最后一公里瓶颈：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">Llama-3/Qwen 词表高达 128K~152K，全量实体化</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">FP32 Logits 狂吞 16.8GB！Liger 分块原位求导将</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">其压至 0.52GB，叠加 rsLoRA 精度冲上 85.8%！</text>
  </g>

  <!-- Bottom Left: LoRA Rank Scaling Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📈 LoRA 秩从 r=16 增至 r=256 时的微调基准准确率对比 (%)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">为什么传统 LoRA (α/r 缩放) 在高秩 r=256 时反而梯度坍塌，而 rsLoRA (α/√r) + DoRA 稳步攀升？</text>

    <!-- r=16 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">Rank r=16 (轻量风格对齐)</text>
    <rect x="225" y="74" width="248" height="14" rx="3" fill="#10b981"/>
    <text x="481" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">82.6% (rsLoRA+DoRA)</text>
    <rect x="225" y="92" width="243" height="14" rx="3" fill="#64748b"/>
    <text x="476" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">81.2% (标准 LoRA)</text>

    <!-- r=64 -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">Rank r=64 (企业多任务基线)</text>
    <rect x="225" y="124" width="258" height="14" rx="3" fill="#10b981"/>
    <text x="491" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">85.8% (+4.0pt 🏆)</text>
    <rect x="225" y="142" width="245" height="14" rx="3" fill="#f59e0b"/>
    <text x="478" y="154" fill="#fde68a" font-size="11.5" font-weight="700">81.8% (标准 LoRA 停滞)</text>

    <!-- r=256 -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">Rank r=256 (重度代码/数理注入)</text>
    <rect x="225" y="174" width="262" height="14" rx="3" fill="#10b981"/>
    <text x="495" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">86.4% (+11.9pt 🏆)</text>
    <rect x="225" y="192" width="223" height="14" rx="3" fill="#ef4444"/>
    <text x="456" y="204" fill="#f87171" font-size="11.5" font-weight="700">74.5% (α/r 梯度坍塌 ✕)</text>

    <!-- 32K + 128K Vocab -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">32K 打包序列 + 128K 大词表</text>
    <rect x="225" y="224" width="260" height="14" rx="3" fill="#10b981"/>
    <text x="493" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">0.52 GB Logits (Liger-CE 🏆)</text>
    <rect x="225" y="242" width="305" height="14" rx="3" fill="#ef4444"/>
    <text x="536" y="254" fill="#f87171" font-size="11.5" font-weight="700">33.6GB OOM ✕</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#fed7aa" font-size="11.5" font-weight="700">💡 数学定律：根据中心极限定理，r 个独立零均值特征之和方差随 √r 增长，必须除以 √r (rsLoRA) 而非 r！</text>
  </g>

  <!-- Bottom Right: 3 Rules for SFT Engineering -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 高效无损 SFT 微调工程三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：序列打包必须同时对齐 `cu_seqlens` 与 `position_ids` 归零</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 严禁只用 `&lt;eos&gt;` 把多条样本硬拼成一条！必须调用 `flash_attn_varlen_func` 传入</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  `cu_seqlens` 实施块对角掩码隔离，且每条子样本开头的 `position_ids` 必须从 0 重新计数！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：替换 LM-Head 为 `Liger FusedLinearCrossEntropy`</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 在 128K~152K 词表模型上，切勿生成完整的 `[B*S, V]` FP32 Logits 张量（16.8~33.6GB）；</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  按 1,024 Token 分块流式计算 `h_chunk @ W_vocab^T` 并当场算出梯度，省下 32 倍词表显存！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fed7aa" font-size="13" font-weight="800">3️⃣ 铁律三：Rank &gt;= 32 时强制开启 `use_rslora=True` + 全线性层挂载</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 将 LoRA 挂在全部 7 个线性层 (`q,k,v,o,gate,up,down`)，并启用 `rsLoRA (γ = α / √r)`</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  与 `DoRA` 幅度-方向解耦，避免高秩微调时前向激活缩小导致的梯度消失！</text>
  </g>
</svg>
