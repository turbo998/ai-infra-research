<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 66 · CLUSTER-WIDE PREFIX CACHE (RADIXATTENTION VS. APC), DYNAMO KV ROUTING &amp; SLRU EVICTION</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">推理集群全局 Prefix Cache 树、Dynamo 队列衰减路由与 SLRU 防污染淘汰一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 16× 8-GPU H100 Replicas (128 GPUs, Zipf s=1.05 Shared 24K Prefixes + 1,000-Doc Batch Scans) · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="148" height="24" rx="6" fill="#7F1D1D"/>
  <text x="130" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 无状态轮询网关</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Round-Robin + 单机独立 APC</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">同会话被拆散到 16 台机器重复计算</text>
  <text x="56" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 集群有效命中率: 18.4% (稀释 ✕)</text>
  <text x="56" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 突发首字 P99 TTFT: 1,420.0 ms ✕</text>
  <text x="56" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 批量扫描污染掉点: -42.0% ✕</text>
  <text x="56" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 集群达标 Goodput: 88.0 req/s ✕</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 年化 GPU 成本: $3.18M / yr ✕</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⛔ 严禁在多副本集群前用无状态轮询</text>

  <!-- Tier 2 -->
  <rect x="346" y="148" width="288" height="310" rx="12" fill="#1F2437" stroke="#F97316" stroke-width="1.5"/>
  <rect x="362" y="164" width="156" height="24" rx="6" fill="#7C2D12"/>
  <text x="440" y="180" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 2 · 朴素粘性哈希</text>
  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">死板绑定前缀节点 (无衰减)</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">热门前缀把 1 台机塞爆、15 台机闲死</text>
  <text x="362" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 集群有效命中率: 76.5%</text>
  <text x="362" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 突发首字 P99 TTFT: 2,760.0 ms ✕</text>
  <text x="362" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 批量扫描污染掉点: -35.0% ✕</text>
  <text x="362" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 集群达标 Goodput: 64.0 req/s ✕</text>
  <text x="362" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 年化 GPU 成本: $3.65M / yr ✕</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 爆款提示词引发单节点排队雪崩</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="168" height="24" rx="6" fill="#1E3A8A"/>
  <text x="752" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · Radix + 全局目录</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">RadixAttention + 纯 LRU</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">树状共享优良，但怕批处理冲刷缓存</text>
  <text x="668" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 集群有效命中率: 79.2% ✅</text>
  <text x="668" y="298" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 突发首字 P99 TTFT: 385.0 ms ✅</text>
  <text x="668" y="324" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 批量扫描污染掉点: -28.5% ⚠️</text>
  <text x="668" y="350" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 集群达标 Goodput: 215.0 req/s ✅</text>
  <text x="668" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 年化 GPU 成本: $2.12M / yr ✅</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 纯交互无批处理混跑集群标准</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
  <text x="1066" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · Dynamo+SLRU (推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">有理负载衰减 + Radix + SLRU</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">自适应热点溢出复制 + 20/80 防污染</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 集群有效命中率: 86.8% 🏆</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 突发 P99 TTFT: 163.0 ms (快16.9x 🏆)</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 批量扫描掉点: 仅 -1.8% (免疫 🏆)</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 达标 Goodput: 301.0 req/s (3.42x 🏆)</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 年成本: $1.70M (净省 $1.48M 🏆)</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 多副本多租户推理集群唯一黄金标准</text>

  <!-- Bottom Pipeline: 3 Core Mechanisms -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">🧭 Tier 4 黄金架构三层拆解：如何同时消灭“轮询稀释”、“粘性排队热点”与“批处理缓存污染”？</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2"/>
  <text x="82" y="562" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① Dynamo 有理队列衰减路由 (防单点塞爆)</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 公式：Score = Overlap / (1 + d * ExcessQueue / ReqBlocks)</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 机制：当命中节点排队耗时超过空闲节点重算 Prefill 耗时</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  (180ms) 时，自动溢出至空闲节点预热第 2 份热点副本！</text>
  <text x="82" y="668" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ P99 TTFT 从 2,760ms 砸至 163ms (快 16.93 倍)</text>

  <!-- Step 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="468" y="562" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② RadixAttention 边压缩基数前缀树</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 突破 16-Token 固定块边界，支持任意词粒度裂变分叉</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 完美适配 System Prompt -&gt; 多篇 RAG 文档 -&gt; 多轮对话分支</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 严格从 ref_count==0 的叶子节点自底向上回收显存</text>
  <text x="468" y="668" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 公共根前缀永久驻留，集群命中率冲上 86.8%</text>

  <!-- Step 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="864" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 双段式 SLRU 防扫描淘汰 (20%试用 / 80%保护)</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 痛点：1,000 条一次性批处理文档会把纯 LRU 洗劫一空</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 机制：首次出现的块 (hit=1) 只能进 20% 试用池自循环；</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  唯有二次命中 (hit&gt;=2) 的真实复用前缀才晋升 80% 保护池</text>
  <text x="864" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 批量扫描掉点从 42% 压至 1.8%，年省 $148 万</text>
</svg>
