<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 285 · SPECULATIVE DECODING (EAGLE-3 vs. STANDALONE 7B DRAFT) ON TP=8</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">TP=8 7B Draft (280 All-Reduces = 11.8ms) vs. EAGLE-3 1-Layer + 32K Vocab + CUDAGraph (1.15ms, 3.49x)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
