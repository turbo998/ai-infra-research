  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (Standalone 28-Layer 7B Draft Sharded TP=8):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  5 draft steps × 28 layers × 2 = 280 tiny All-Reduces!</text>
  <text x="85" y="298" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Drafting alone takes 11.8 ms (longer than 1 target step!)</text>
  <text x="85" y="335" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (Disaggregated Remote Draft Pool Over RPC):</text>
  <text x="85" y="363" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Every 20ms cycle pays +6.3 ms RPC &amp; KV sync penalty</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">5-Step Draft Latency: 11.8 ms (10.3x Slower!)</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Effective TPOT: 8.45 ms (Only 1.33x vs 11.2ms Vanilla)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: EAGLE-3 + 32K Vocab + Joint CUDAGraph</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• 1-Layer Multi-Feature Fusion (Low/Mid/High Trunk States):</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Cuts 280 All-Reduces down to 10 (or 0 with TP=1 replica!)</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Training-Time Test lifts accept length τ = 3.10 -&gt; 4.85</text>
  <text x="640" y="340" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Top-32K High-Frequency Pruned Draft LM Head (4x faster)</text>
  <text x="640" y="375" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">• Joint 5-Step Draft + Tree Verify CUDAGraph Capture</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
