<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad379" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad379" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad379)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级大模型缓存架构 (Prompt Cache vs. Semantic Cache) 与 KV 感知网关路由选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：静态前缀工程 + KV 感知网关路由 + 实体核验语义缓存，将 8 副本集群命中率从 18.5% 提至 89.4%，P95 首字延迟快 6.76x 且月省 72.9%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 379 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 动态置顶 + 轮询网关</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• System 开头塞时间戳/UUID 破坏前缀</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• K8s Round-Robin 随机打散至 8 副本</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 有效缓存命中率：仅 18.5% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 16K 上下文 P95 TTFT：1,420 ms ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 81.5% 算力浪费在重复 Prefill ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$68,000 / 1,500万次 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">反模式：明明开了 vLLM Prefix Cache</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">却被开头一行 current_time 彻底废掉</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 朴素纯向量语义缓存</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 网关按 Cosine &gt;= 0.90 直接返回旧答案</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 不校验年份/工号/金额/租户命名空间</text>
  <text x="332" y="212" fill="#fde68a" font-size="12" font-weight="700">• 表面命中率：42.0% (含模糊命中)</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 致命张冠李戴误命中率：4.8% ✕</text>
  <text x="332" y="252" fill="#fca5a5" font-size="12">• 问“2026年B级”却回“2025年A级” ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$41,500 (高业务事故) ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">大坑：向量模型对数字/年份极度迟钝</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">严禁对个性化/带参查询裸开语义缓存</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 静态前缀置顶 + Prefix Cache</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• Static-First 提示词工程 (动态变量放末尾)</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 开启云端/本地 Exact Prefix Caching</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 有效缓存命中率：58.0% ✅ (零误报)</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 16K 上下文 P95 TTFT：510 ms ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 100% 精确 Token 匹配，零张冠李戴</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$31,200 (省 54.1%) ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：调用云托管 API (OpenAI/Anthropic)</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">或单机推理实例的零成本必做基线</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: KV 感知路由+分级缓存 🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 网关维护全局 Radix/Hash 前缀树路由</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 有效缓存命中率：89.4% 🏆 (+70.9pts)</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• P95 TTFT：210 ms 🏆 (快 6.76x)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 实体核验语义缓存：0.0% 误命中 🏆</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• GPU HBM + Host DRAM 二级 KV 池</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$18,400 (省 72.9%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级多副本集群与 Agent 平台终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">跨轮次/同文档请求精准亲和至热 KV 节点</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 架构师必懂的“两大缓存层”本质区别：Prompt Prefix Cache (复用输入注意力) vs. Semantic Cache (复用最终回答)</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad379)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. Static-First 提示词排序黄金律（零成本省 50%+）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 前缀缓存要求“从第 1 个 Token 起完全一致”！</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 正确顺序：`[1. 静态 System 指令] -&gt; [2. 固定 Tool 定义]`</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  `-&gt; [3. 共享长文档/表结构] -&gt; [4. 历史对话] -&gt; [5. 当前时间/问题]`</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 严禁在 System Prompt 头部拼入 `timestamp` 或 `request_id`！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. KV 感知前缀路由（解决多副本集群打散问题）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 在 8 节点 K8s 集群中，普通轮询会让第 2 轮对话落到空节点（仅 12.5%）。</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 采用 `vLLM Production Stack / llm-d / SGLang Router`</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  按前 512 Token 块哈希 + 负载水位做带权一致性哈希路由，</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 配合 LMCache Host-DRAM 二级卸载，集群命中率直飙 89.4%！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 语义缓存防误报铁律（Entity-Verified Guard）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 语义缓存只适合“高频公共 FAQ”，绝不能裸用于带参查询！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 必须三重门控：① 缓存 Key 前缀强制绑定 `tenant_id + acl_hash`；</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  ② Cosine &gt;= 0.97；③ 正则提取所有年份/金额/SKU编号 100% 相等</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  才允许命中，将 4.8% 的张冠李戴误命中彻底清零！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 379 合成标定算例 (independently_reproduced=false)</text>
</svg>
