<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg14" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent14" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg14)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent14)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="22" font-weight="800">AI Agent 代码沙箱与 Serverless GPU 极速冷启动架构选型一图流 (Round 14 · 256×H100)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">K8s OCI 冷拉取 (25.5s) vs. Lazy OCI + mmap (5.2s) vs. Firecracker MicroVM 快照 (125ms, 204x) vs. CRIU + cuda-checkpoint + RDMA 流 (420ms, -77.3% TCO)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Cold-Start Stage Breakdown & Decision Path -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#6ee7b7" font-size="16" font-weight="800">① 为什么传统容器连 5 秒冷启动都做不到？(三段串联瓶颈)</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 标准 K8s 冷启动: 14,200ms 镜像 + 4,800ms Init + 6,500ms 权重 = 25,500 ms</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 单次 4.5s 任务被迫计费 30.0s；为掩盖 25.5s 延迟被迫保留 58% 常驻空闲热池</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 共享宿主机 Linux 内核 (runc)，执行大模型生成的不可信代码面临容器逃逸高危风险</text>

  <rect x="44" y="258" width="510" height="84" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="280" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 Coding Agent 黄金标准: Firecracker MicroVM 快照 + UFFD (125.0 ms)</text>
  <text x="58" y="302" fill="#d1fae5" font-size="12">• KVM 硬件虚拟化独立 Guest Kernel (42ms 挂接) + UFFD 恢复已初始化 Python 内存态 (83ms)</text>
  <text x="58" y="324" fill="#d1fae5" font-size="12">• P50 125.0 ms (提速 204.0x, P99 210ms 达标) · 单机 80 沙箱 · 千次成本降至 $16.30 (-73.8%)</text>

  <rect x="44" y="354" width="510" height="96" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="376" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 Serverless GPU 瞬间唤醒: CRIU + cuda-checkpoint + RDMA 流 (420.0 ms)</text>
  <text x="58" y="398" fill="#f3e8ff" font-size="12">• R550+ 驱动 cuda-checkpoint 在 75 ms 内原位恢复已初始化 CUDA Context 与算子图</text>
  <text x="58" y="418" fill="#f3e8ff" font-size="12">• 45.16 GB/s 锁页 Host DRAM / RDMA P2P 零拷贝注入 14 GB 权重 (310 ms) + 35 ms COW 挂载</text>
  <text x="58" y="438" fill="#f3e8ff" font-size="12">• P50 420.0 ms (提速 60.71x, P99 485ms) · 热池从 58% 压至 4% · GPU 利用率跃升至 86.5%!</text>

  <rect x="44" y="462" width="510" height="82" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="58" y="484" fill="#fcd34d" font-size="13" font-weight="700">🛡️ 生产快照克隆安全红线 (vmgenid 熵池重置 + 镜像/权重解耦)</text>
  <text x="58" y="506" fill="#cbd5e1" font-size="12">• 快照一对多克隆必须在唤醒 5ms 内通过 vmgenid 重置 /dev/urandom 与 TLS 随机数</text>
  <text x="58" y="526" fill="#cbd5e1" font-size="12">• 严禁将 14GB 权重打入 Docker 层；保持镜像 &lt;2GB，权重走 Safetensors mmap / RDMA</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档沙箱与 Serverless GPU 架构定量对比 (日均 100k 调用)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">架构档位 (16GB 镜像 + 14GB 权重)</text>
  <text x="835" y="190" fill="#cbd5e1" font-size="12" font-weight="700">P50 / P99 启动</text>
  <text x="955" y="190" fill="#cbd5e1" font-size="12" font-weight="700">热池 / 利用率</text>
  <text x="1062" y="190" fill="#cbd5e1" font-size="12" font-weight="700">月度 / 千次成本</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: K8s + OCI 冷拉取</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">共享内核 (8/host) · 计费 30.0s</text>
  <text x="835" y="236" fill="#f87171" font-size="12" font-weight="700">25,500 ms</text>
  <text x="835" y="256" fill="#fca5a5" font-size="11">P99: 34,800 ms ✕</text>
  <text x="955" y="236" fill="#f8fafc" font-size="12">58.0% 热池</text>
  <text x="955" y="256" fill="#fca5a5" font-size="11">31.0% 利用率</text>
  <text x="1062" y="236" fill="#fca5a5" font-size="12" font-weight="700">$186,880/mo</text>
  <text x="1062" y="256" fill="#cbd5e1" font-size="11">$62.29 / 1k</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: Lazy OCI + Safetensors</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">SOCI/eStargz + mmap (16/host)</text>
  <text x="835" y="312" fill="#fde047" font-size="12" font-weight="700">5,200 ms (4.9x)</text>
  <text x="835" y="332" fill="#cbd5e1" font-size="11">P99: 7,400 ms ✕</text>
  <text x="955" y="312" fill="#f8fafc" font-size="12">28.0% 热池</text>
  <text x="955" y="332" fill="#fde047" font-size="11">54.5% 利用率</text>
  <text x="1062" y="312" fill="#fde047" font-size="12" font-weight="700">$106,420/mo</text>
  <text x="1062" y="332" fill="#cbd5e1" font-size="11">$35.47 (-43.1%)</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: Firecracker + UFFD 快照</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">KVM 硬件隔离 (80/host) · 计费 4.63s</text>
  <text x="835" y="388" fill="#34d399" font-size="12" font-weight="700">125 ms (204x)</text>
  <text x="835" y="408" fill="#6ee7b7" font-size="11">P99: 210 ms ✅</text>
  <text x="955" y="388" fill="#f8fafc" font-size="12">6.0% 热池</text>
  <text x="955" y="408" fill="#6ee7b7" font-size="11">78.0% 利用率</text>
  <text x="1062" y="388" fill="#6ee7b7" font-size="12" font-weight="700">$48,900/mo</text>
  <text x="1062" y="408" fill="#6ee7b7" font-size="11">$16.30 (-73.8%)</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: CRIU + cuda-checkpoint</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">75ms CUDA 恢复 + 310ms RDMA 流</text>
  <text x="835" y="464" fill="#e9d5ff" font-size="12" font-weight="700">420 ms (60.7x)</text>
  <text x="835" y="484" fill="#d8b4fe" font-size="11">P99: 485 ms ✅</text>
  <text x="955" y="464" fill="#e9d5ff" font-size="12" font-weight="700">4.0% 热池</text>
  <text x="955" y="484" fill="#34d399" font-size="11" font-weight="700">86.5% 利用率</text>
  <text x="1062" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">$42,340/mo</text>
  <text x="1062" y="484" fill="#34d399" font-size="11" font-weight="700">$14.11 (-77.3%)</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 500 RPS 脉冲风暴下：Tier 3 P99 稳定在 210.0 ms，Tier 4 P99 稳定在 485.0 ms (&lt;=500ms SLA)</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#10b981"/>
  <text x="44" y="606" fill="#6ee7b7" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for Agentic Sandboxes &amp; Serverless GPU）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#6ee7b7">不可信 Agent 代码必上 MicroVM (Tier 3)</tspan>：Firecracker/Cloud-Hypervisor 独立内核隔离 + UFFD 内存快照，125.0 ms 唤醒 (快 204x)，彻底杜绝容器逃逸。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">突发 Serverless GPU 必上 CRIU + cuda-checkpoint (Tier 4)</tspan>：75ms 恢复 CUDA 上下文 + 310ms RDMA 注入权重，420ms 唤醒砍掉 58% 常驻热池，立省 77.3% 账单。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/agentic_sandbox_gpu_coldstart_selection/results.json · tests/test_agentic_sandbox_gpu_coldstart_selection.py · 7-Card &amp; H5 Sizer 1:1 绑定</text>
</svg>
