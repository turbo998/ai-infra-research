<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#564 大模型并行切分 (TP/PP/DP/EP) 与三大加速 (MTP/Prefix/FP8) 通信手算及 Dense vs. MoE 选型</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">TP 锁死机内 NVLink · 405B 跨机选 TP8×PP2 · 671B MoE 选 Attention DP×Expert EP (DeepEP) · 单卡吞吐暴涨 5.48x (3,890 tok/s) · TPOT 6.2ms</text>

  <!-- Box 1: TP vs PP vs DP vs EP -->
  <rect x="24" y="110" width="350" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 四大并行切分原语与通信代价</text>
  <rect x="42" y="152" width="314" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="171" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">TP (张量并行)：每层 2 次 AllReduce (2L/step)</text>
  <text x="52" y="190" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">降 TTFT+TPOT · ⛔ 严禁跨机! 锁死机内 NVLink (TP≤8)</text>

  <rect x="42" y="210" width="314" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="229" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">PP (流水线并行)：仅跨阶段边界发 P2P 激活</text>
  <text x="52" y="248" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">通信量仅为 TP 的 1/80 · Dense 405B 跨双机选 TP8×PP2</text>

  <rect x="42" y="268" width="314" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="52" y="287" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">Attention DP (数据并行)：零层间通信线性扩 QPS</text>
  <text x="52" y="306" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">彻底消除 MLA / GQA KV Cache 在多卡间的重复冗余!</text>

  <rect x="42" y="326" width="314" height="46" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="345" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">Expert EP (专家并行)：每层 2 次 DeepEP All-to-All</text>
  <text x="52" y="363" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">671B MoE 标配 DP16×EP16 + IBGDA 异步双微批重叠</text>

  <!-- Box 2: Dense vs MoE Golden Partitioning -->
  <rect x="392" y="110" width="348" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="410" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② Dense (70B/405B) vs. MoE (671B) 黄金组合</text>
  <rect x="410" y="152" width="312" height="66" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="422" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Dense 70B (Llama-3.3 / Qwen2.5-72B)</text>
  <text x="422" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 切分：单机 TP=4 (H200 FP8) × DP=2</text>
  <text x="422" y="208" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 加速：Block-FP8 + Radix Prefix + EAGLE-3 (TPOT 7.8ms)</text>

  <rect x="410" y="226" width="312" height="66" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="422" y="246" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Dense 405B (Llama-3.1-405B)</text>
  <text x="422" y="265" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 单台 8x H200 (1128GB)：锁死机内 TP=8 FP8</text>
  <text x="422" y="282" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 双台 8x H100 (80GB)：机内 TP=8 × 跨机 PP=2 (禁 TP16!)</text>

  <rect x="410" y="300" width="312" height="70" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="422" y="320" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">MoE 671B (DeepSeek-V3 / R1 满血版) 🏆</text>
  <text x="422" y="339" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 切分：Attention DP=16 × Expert EP=16 (DeepEP+EPLB)</text>
  <text x="422" y="356" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 吞吐 3,890 tok/s/GPU (较跨机 TP16 暴涨 5.48 倍!)</text>

  <!-- Box 3: 3 Acceleration Levers -->
  <rect x="758" y="110" width="298" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="776" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 三大推理加速技术收益账本</text>
  <rect x="776" y="152" width="262" height="66" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="788" y="172" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">1. 投机解码 (原生 MTP / EAGLE-3)</text>
  <text x="788" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 一次读权重验证 3~4 词 (接受 2.8 词)</text>
  <text x="788" y="207" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 改善 TPOT 2.29x (14.2ms → 6.2ms, B≤48)</text>

  <rect x="776" y="226" width="262" height="66" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="788" y="246" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">2. 前缀缓存 (Radix Prefix Cache)</text>
  <text x="788" y="264" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 复用共享 System Prompt 与多轮历史 KV</text>
  <text x="788" y="281" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 改善 TTFT 4.1x，削减 75% Prefill 算力</text>

  <rect x="776" y="300" width="262" height="70" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="788" y="320" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">3. 细粒度量化 (Block-FP8 / NVFP4)</text>
  <text x="788" y="338" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 权重/KV 显存减半，AllReduce/All-to-All 减半</text>
  <text x="788" y="355" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 同时改善 TTFT (1.85x) + TPOT (1.92x)</text>

  <!-- Bottom KPI Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 16x H200 部署 DeepSeek-V3/R1 671B 三种并行与加速方案实证对比：</text>
  <text x="44" y="452" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 误区方案 A (跨机纯 TP=16 BF16)：每 Token 122 次跨网 AllReduce 阻塞 24.1ms → 等效 TPOT 38.5ms，单卡吞吐仅 710 tok/s ($0.390/1M)。</text>
  <text x="44" y="476" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 过渡方案 B (机内 TP=8 × 跨机 PP=2 FP8)：消除跨网 AllReduce，但 MLA KV 在 8 个 TP ランク间重复复制 8 份 → 单卡吞吐 1,840 tok/s ($0.152/1M)。</text>
  <text x="44" y="500" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• 最佳实践 C (Attention DP=16 × Expert EP=16 + DeepEP + Block-FP8 + 原生 MTP)：单卡吞吐 3,890 tok/s (涨 5.48x)，等效 TPOT 6.2ms ($0.071/1M)!</text>
</svg>
