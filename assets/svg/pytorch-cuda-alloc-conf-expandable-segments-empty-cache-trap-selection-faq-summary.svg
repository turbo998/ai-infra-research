<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 241 · PYTORCH_CUDA_ALLOC_CONF: 14.2 GB FRAGMENTATION OOM &amp; EMPTY_CACHE() TRAP VS EXPANDABLE_SEGMENTS</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">CUDA Allocator: 14.2 GB Fragmented OOM &amp; 340ms empty_cache() Stall vs expandable_segments:True</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: 14.2 GB Swiss-Cheese &amp; `empty_cache()`</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1: `14.20 GB is reserved by PyTorch but unallocated` — yet a</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  `2.00 GB` allocation crashes with OOM because holes aren't adjacent! ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: Calling `torch.cuda.empty_cache()` per step synchronizes</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  all streams &amp; invokes slow driver `cudaFree/cudaMalloc` (+340 ms!) ✕</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Unusable Fragmented HBM: 14.20 GB | empty_cache Stall: 340 ms ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Never Call `torch.cuda.empty_cache()` Inside the Per-Step Training Loop!</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: `expandable_segments:True` (CUDA VMM)</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Decouples virtual address ranges (`cuMemAddressReserve`) from</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  physical HBM pages (`cuMemCreate` + `cuMemMap` 2MB/20MB slabs)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Stitches non-adjacent physical holes into a contiguous virtual tensor</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  in microseconds without calling `cudaFree` or stalling streams!</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Fragmented Waste: 0.35 GB (-13.85 GB Saved) | Stall: 0.2 ms 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Unlocks 40K Context vs 24K on the Exact Same 80GB H100 GPU</text>
</svg>
