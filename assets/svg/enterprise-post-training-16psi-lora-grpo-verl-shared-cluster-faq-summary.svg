  <rect width="1200" height="630" fill="url(#bg639)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr639)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#639 企业大模型后训练 (全参 SFT 16Ψ vs. LoRA vs. veRL GRPO) 显存手算与训推潮汐共池指南</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Enterprise Post-Training VRAM Math (16Ψ Full-SFT vs. LoRA vs. PPO 36Ψ vs. GRPO 18Ψ), 0.9s Resharding &amp; Nightly Shared Cluster</text>

  <!-- Left: 4 Post-Training VRAM Footprints -->
  <rect x="48" y="120" width="380" height="330" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="66" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">① 训练显存四件套手算 (以 70B 模型为例)</text>
  <rect x="64" y="164" width="348" height="82" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="76" y="184" fill="#f87171" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">1. 全参 SFT (16Ψ + 激活 ≈ 1,300 GB)</text>
  <text x="76" y="204" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• BF16权重(2Ψ)+梯度(2Ψ)+FP32主权/动量/方差(12Ψ)=16Ψ</text>
  <text x="76" y="224" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="700">• 70B × 16 = 1,120GB + 180GB激活 ➔ 需 16×H100 (跨机RDMA)</text>

  <rect x="64" y="254" width="348" height="82" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="76" y="274" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2. LoRA SFT (仅冻结权重 2Ψ + 3.7GB ≈ 156 GB) 🏆</text>
  <text x="76" y="294" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• 70B 底座冻结 (140GB) 0梯度0优化器！仅训 0.26B LoRA</text>
  <text x="76" y="314" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">• 总显存仅 156 GB (-88%) ➔ 单机 2×H200 免 RDMA 即可训！</text>

  <rect x="64" y="344" width="348" height="92" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="76" y="364" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">3. 强化学习: 传统 PPO (36Ψ) vs. GRPO (18Ψ) 🏆</text>
  <text x="76" y="384" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">• 传统 PPO 需同时驻留 Actor(16Ψ)+Critic(16Ψ)+Ref+RM=36Ψ</text>
  <text x="76" y="404" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11" font-weight="700">• GRPO 用组内相对奖励彻底砍掉 Critic 模型 (省 50% 显存!)</text>
  <text x="76" y="424" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">• 配合确定性代码/数学沙箱验算 (RLVR)，零 Reward 模型！</text>

  <!-- Right: veRL HybridEngine & Nightly Shared Cluster -->
  <rect x="444" y="120" width="708" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="464" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">② veRL HybridEngine 0.9s 原地重分片 + 夜间空闲推理卡 100% 潮汐复用</text>

  <rect x="464" y="164" width="324" height="148" rx="10" fill="#0f172a" stroke="#38bdf8"/>
  <text x="478" y="188" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">核心突破 1：0.9s 显存内 FSDP ⟷ TP 重分片</text>
  <text x="478" y="210" fill="#cbd5e1" font-size="11.5">• GRPO 单步 82% 时间花在 vLLM/SGLang 采样生成</text>
  <text x="478" y="230" fill="#cbd5e1" font-size="11.5">• 传统物理拆池 (Actor卡与Rollout卡分离) 造成 54% 空泡</text>
  <text x="478" y="250" fill="#6ee7b7" font-size="11.5" font-weight="700">• veRL HybridEngine 同卡共置：采样时切 TP=4 FP8</text>
  <text x="478" y="270" fill="#6ee7b7" font-size="11.5" font-weight="700">  反向更新时经 NVLink 0.9s 原地重分片为 FSDP2！</text>
  <text x="478" y="292" fill="#34d399" font-size="11.5" font-weight="700">• 叠加长尾样本截断续跑 (Partial Rollout) 提速 2.45x！</text>

  <rect x="804" y="164" width="328" height="148" rx="10" fill="#0f172a" stroke="#10b981"/>
  <text x="818" y="188" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">核心突破 2：免购独立训练集群 (年省 $44.1万)</text>
  <text x="818" y="210" fill="#cbd5e1" font-size="11.5">• 企业在线推理集群在 22:00–08:00 有 75% 卡闲置</text>
  <text x="818" y="230" fill="#cbd5e1" font-size="11.5">• 而 GRPO 后训练 82% 的负载恰恰就是跑 vLLM 采样！</text>
  <text x="818" y="250" fill="#6ee7b7" font-size="11.5" font-weight="700">• 夜间 22:00 自动借用 16 张空闲在线 H200 卡</text>
  <text x="818" y="270" fill="#6ee7b7" font-size="11.5" font-weight="700">  每晚 10 小时免费跑完 1 轮垂域 GRPO 强化迭代！</text>
  <text x="818" y="292" fill="#34d399" font-size="11.5" font-weight="700">• 独立训练集群采购预算直接降为 $0！</text>

  <rect x="464" y="326" width="668" height="110" rx="10" fill="#0f172a" stroke="#f59e0b"/>
  <text x="480" y="350" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800">📐 为什么全参训练是 16Ψ Bytes/Param？(白板一秒速推)：</text>
  <text x="480" y="374" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 模型参数 BF16 (2 Bytes) + 梯度 BF16 (2 Bytes) + AdamW FP32 主权重备份 (4 Bytes) + 一阶动量 m (4 Bytes) + 二阶方差 v (4 Bytes)</text>
  <text x="480" y="396" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• 合计: 2 + 2 + 4 + 4 + 4 = 16 Bytes/Param！对 70B 模型静态状态即 70×16 = 1,120 GB (加上激活值约 1,300 GB)。</text>

  <!-- Bottom Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #639 企业后训练架构核心收益对比 (70B 垂域微调与强化学习对齐)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• SFT 显存需求: 1,300 GB (全参 16×H100) ➔ 156 GB (LoRA SFT · 仅需单机 2×H200 · 显存立省 88.0%)</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• RL 后训练: 传统静态拆池 PPO (32×H100) ➔ veRL GRPO 复用夜间空闲推理卡 (迭代提速 2.45x · 专用训练卡采购费 $0 · 年省 $44.1万)！</text>
