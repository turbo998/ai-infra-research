  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">1.5s 归因 + 400G RDMA 热换机</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">0 丢步 0 回滚 · 内存直传秒级接管</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 揪出慢卡耗时: 1.5 s (秒锁真凶 🏆)</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单次切换停顿: 0.4 min (4.2s 🏆)</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 万卡有效 Goodput: 98.6% (+30.2pt 🏆)</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 每周损耗: $23,000 (降 23.6x 🏆)</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 年省: $26.99M / yr 🏆</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 千卡至十万卡智算中心唯一黄金标准</text>

  <!-- Bottom Pipeline: 3-Stage Grey Failure Self-Healing Pipeline -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">🩺 万卡集群亚健康灰故障三阶无损自愈流水线：为什么 argmin(T_wait) 能瞬间从 10,240 张卡里抓出真凶？</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#EF4444" stroke-width="1.2"/>
  <text x="82" y="562" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 1.5s 到达时间反转归因 (Arrival Inversion)</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 破除误区：10,239 张好卡的 AllReduce 耗时最长 (受害者)</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 真凶特征：最后一个踏入屏障大门、屏障内等待时间 T_wait</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  几乎为 0，且伴随 NVML 降频 / PCIe 掉速 / IB 重传计数器</text>
  <text x="82" y="668" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 1.5 秒内 100% 精准区分唯一慢卡与万张受害卡</text>

  <!-- Step 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="468" y="562" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 动态 DP 微批削减调平 (Microbatch Shedding)</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 在线调整：DataLoader 立即将慢卡所在 DP 支路的微批数</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  从 8 减至 5，将其余 3 个微批分摊给健康的 DP 同伴节点</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 梯度加权：按实际样本数加权规约，数学 100% 等价原梯度</text>
  <text x="468" y="668" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 不杀进程、不掉吞吐，瞬间消除全局屏障木桶拖累</text>

  <!-- Step 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="864" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 4.2s 热备节点 RDMA 状态克隆热替换</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 告别磁盘回滚：唤醒 1% 预热热备池中的健康节点，通过</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  400G RDMA 从伙伴内存 0.35s 克隆 14.2GB 最新权重分片</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 在 Step 边界动态重构通信域切入热备机并自动隔离慢卡</text>
  <text x="864" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 0 丢步 0 回滚，Goodput 飙至 98.6%，年省 $2,699万</text>
</svg>
