  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 62 · 10K-GPU CLUSTER "GREY FAILURE" (RUNTIME STRAGGLER) TELEMETRY, MICROBATCH SHEDDING &amp; LIVE SWAP</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">万卡训练集群“亚健康灰故障 (Grey Failure)”秒级归因、动态微批削减与 4.2s 热备热替换一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 10,240-GPU H100/B200 Cluster ($25,600/hr, 18 Grey Failures/Week @ +45% Single-Rank Slowdown) · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="144" height="24" rx="6" fill="#7F1D1D"/>
  <text x="128" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 被动死等最慢卡</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">仅靠 30分钟 NCCL 超时</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">1张降频慢卡绑架全场10,239张好卡</text>
  <text x="56" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 揪出慢卡耗时: 16,200 s (4.5h ✕)</text>
  <text x="56" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单次折合停机损失: 70.5 分钟 ✕</text>
  <text x="56" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 万卡有效 Goodput: 68.4% ✕</text>
  <text x="56" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 每周白烧算力: $542,000 / 周 ✕</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 全年白烧算力: $28.18M / yr ✕</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⛔ 亚健康慢卡永不超时，全场陪葬</text>

