  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">2.8s 到达归因 + 在线微批分摊</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">零重启将慢卡微批转交健康 DP 节点</text>
  <text x="668" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 揪出慢卡耗时: 2.8 s (3个Step ✅)</text>
  <text x="668" y="298" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单次折合停机损失: 4.2 分钟 ✅</text>
  <text x="668" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 万卡有效 Goodput: 92.6% ✅</text>
  <text x="668" y="350" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 每周白烧算力: $121,000 / 周 ✅</text>
  <text x="668" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 全年损耗: $6.29M (省 $21.9M ✅)</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 无热备机时的纯软件零重启首选</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
