  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">全局变慢即 Kill + 退回 Ckpt</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">每周 18 次全集群回滚重跑初始化</text>
  <text x="362" y="272" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 揪出慢卡耗时: 180.0 s (停机二分)</text>
  <text x="362" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单次重启回滚损失: 22.5 分钟 ✕</text>
  <text x="362" y="324" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 万卡有效 Goodput: 81.2% ✕</text>
  <text x="362" y="350" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 每周白烧算力: $308,000 / 周 ✕</text>
  <text x="362" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 全年白烧算力: $16.02M / yr ✕</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 杀敌一千自损八百，回滚代价高昂</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="168" height="24" rx="6" fill="#1E3A8A"/>
