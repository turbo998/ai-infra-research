  <text x="88" y="256" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#EF4444" font-weight="700">Takes 515 ms/token just waiting on PCIe DMA! GPU Tensor Cores sit 98% idle.</text>

