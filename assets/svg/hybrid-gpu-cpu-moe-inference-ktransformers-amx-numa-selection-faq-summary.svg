  <text x="684" y="368" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">• Replaces 1D AVX-512 vector instructions with 8×1KB 2D Tile Registers (TMM0..TMM7) &amp; TMUL.</text>
  <text x="684" y="388" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">• Pre-packs INT4/FP8 weights into AMX VNNI tile layout offline; dequantizes in L1 cache.</text>
