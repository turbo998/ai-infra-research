  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Isolated 70B SFT Fleet: 64x H100 GPUs ($245,000/mo)</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Few-Shot Prompt Bloat P99 Latency: 1,820 ms</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• SFT-Only Dynamic Fact Accuracy: 62.4%</text>

  <rect x="615" y="138" width="545" height="445" rx="14" fill="#0f292a" stroke="url(#accent473)" stroke-width="2"/>
  <text x="640" y="174" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">🏆 Tier 4: RAG + Distilled 8B (L40S) + 70B Multi-LoRA (H200)</text>
  <text x="640" y="210" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. Orthogonal Rule: RAG = Fresh Facts/ACLs | LoRA = Format/Style</text>
