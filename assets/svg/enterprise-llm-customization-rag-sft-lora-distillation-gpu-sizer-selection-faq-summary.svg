  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 2 6,000-Token Few-Shot Prompt + RAG on 70B Only:</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Massive prefill bloat causes 1,820ms P99 latency &amp; $142K/mo GPU bill</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• GPU SKU Mismatch (Running 8B on H100 or 70B on 4x L40S):</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Wastes HBM3e bandwidth or stalls on PCIe tensor-parallel AllReduce</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
