  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ENTERPRISE LLM CUSTOMIZATION PATH &amp; CLOUD GPU SKU SIZING GUIDE (R473)</text>
  <text x="65" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">RAG + Distilled 8B on L40S (80% Load) + 70B Multi-LoRA on H200: $28.5K/Mo (-88.4%)</text>

  <rect x="40" y="138" width="545" height="445" rx="14" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
