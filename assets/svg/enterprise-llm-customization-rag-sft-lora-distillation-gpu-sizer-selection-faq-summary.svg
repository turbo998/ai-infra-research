  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. 80% Routine Tasks -&gt; Distilled `8B FP8` on `8x L40S (48GB)`</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Teacher-distilled 8B student delivers 99.1% schema fidelity at 245ms</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. 20% Complex Tasks -&gt; Shared `70B Multi-LoRA` on `4x H200 (141GB)`</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Single-GPU TP=1 70B FP8 + 20 hot-swapped departmental LoRA adapters</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (20 BUs · 250 Aggregate QPS):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Domain Task &amp; Fresh-Fact Accuracy: 96.6% (99.1% Schema)</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• End-to-End P99 Latency: 245.0ms (-86.5% vs 1,820ms few-shot)</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Fleet Size: 8x L40S + 4x H200 (vs 64x H100 isolated SFT)</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly Training &amp; Serving TCO: $28,500 / mo (-88.4%)</text>
