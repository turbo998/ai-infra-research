  <rect width="1200" height="630" fill="url(#bg484)"/>
  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ENTERPRISE MODEL ASSET REGISTRY, SUPPLY-CHAIN &amp; P2P DISTRIBUTION (R484)</text>
  <text x="65" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">OCI Model Artifacts (ORAS) + Safetensors/Cosign Gate + Dragonfly P2P: 28s 32-Node Load</text>

  <rect x="40" y="138" width="545" height="445" rx="14" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="65" y="174" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ Legacy Weight Delivery &amp; Security Traps (Tiers 1–3)</text>
  <text x="65" y="210" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 1 Live `huggingface_hub` Pulls on Pod Boot:</text>
  <text x="80" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">1,420s (23.6m) 32-pod start, 28.4% rate-limit fails &amp; `pickle` RCE</text>
  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 2 Baking 140GB Weights Inside Docker Images:</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">155GB image rebuilds on 1-line code edits &amp; fills `/var/lib/containerd`</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 3 Un-Cached S3 `initContainer` Pulls Across 32 Nodes:</text>
  <text x="80" y="354" fill="#94a3b8" font-size="14">Pulls `32 x 140GB = 4.48 TB` across AZ boundary on every rollout</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="430" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">32 GPU Nodes · 140GB Model · 180 Rollouts/Mo Pain:</text>
  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 32-Pod Scale-Out Wait Time: 295s – 1,420s</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Cross-AZ / Registry Egress per Rollout: 4,480 – 4,960 GB</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Monthly Storage, Egress &amp; Idle GPU Wait TCO: $68K – $146K</text>

  <rect x="615" y="138" width="545" height="445" rx="14" fill="#0f292a" stroke="url(#accent484)" stroke-width="2"/>
  <text x="640" y="174" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">🏆 Tier 4: OCI Model Spec + Cosign + Dragonfly P2P</text>
  <text x="640" y="210" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. Decoupled `OCI Model Spec (ORAS)` in `Harbor / ACR`</text>
  <text x="655" y="232" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Separates 12GB engine image from 140GB content-addressable tensor blobs</text>
  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. Airlock Quarantine (`Safetensors + ModelScan + Cosign`)</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Blocks `pickle .bin` RCE &amp; enforces Kyverno signature check (`0.0%` risk)</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. `Dragonfly / Spegel` P2P Mesh + Shared NVMe CSI Volume</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Pulls 140GB once from registry; peers 16MB chunks across 32 nodes in 28s!</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (32-Node 140GB Rollout):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• 32-Pod Simultaneous Ready Time: 28.0s (-98.0% vs HF pull)</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Registry / Cross-AZ Egress per Rollout: 140 GB (-96.9%)</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Supply-Chain `Pickle` RCE &amp; Tamper Risk: 0.0%</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly Egress, Storage &amp; Idle GPU TCO: $21,000 / mo (-85.6%)</text>
</svg>
