  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">格丢失表头，趋势图表 100% 蒸发 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 表格结构 TEDS: <tspan fill="#f87171" font-weight="700">42.5% ✕</tspan></text>
