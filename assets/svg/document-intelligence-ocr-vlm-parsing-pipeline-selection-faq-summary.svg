  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">看像素在密集财报上发生 3.8% 串行 ✕</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 表格结构 TEDS: <tspan fill="#fbbf24" font-weight="700">91.2% (数字幻觉 3.8% ✕)</tspan></text>
