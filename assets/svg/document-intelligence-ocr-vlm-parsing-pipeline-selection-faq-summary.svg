  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 表格结构 TEDS: <tspan fill="#34d399" font-weight="800">94.6% (数字误差仅 0.3% 🏆)</tspan></text>
