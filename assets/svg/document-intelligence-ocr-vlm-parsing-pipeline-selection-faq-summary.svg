  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 下游 RAG 准确率: <tspan fill="#38bdf8" font-weight="700">83.5% ✅</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 解析吞吐/成本: <tspan fill="#38bdf8" font-weight="700">18.5 页/s · $125/百万页</tspan></text>
