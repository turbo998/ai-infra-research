  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 下游 RAG 准确率: <tspan fill="#fbbf24" font-weight="700">88.4%</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 解析吞吐/成本: <tspan fill="#f87171" font-weight="700">2.4 页/s · $960/百万页 ✕</tspan></text>
