  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么复杂表格必须输出 HTML 而非 Markdown？OlmOCR 锚点如何消灭 92% 的数字幻觉？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">📊 铁律 1：合并表格用 HTML `&lt;table&gt;` + OlmOCR 原生坐标锚点</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Markdown 语法不支持 rowspan/colspan 合并单元格，强转必丢多层表头层级；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 将 PDF 底层原生字符与 (x,y) 坐标作为 Anchor 塞入 VLM Prompt，让 VLM 用视觉</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  看排版、用底层字符锁死小数点，数字幻觉率从 3.8% 暴降至 0.3% (-12.7x)！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：1ms 页面复杂度分流 + ColQwen2 视觉网格向量双路检索</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 60% 纯文本页走 0.8ms 原生提取，25% 表格走 MinerU，仅 15% 图表/扫描页唤醒</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  7B VLM FP8，吞吐提速 10.3x (24.8 页/s)，百万页成本从 $960 压至 $92 (-90.4%)；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 对复杂架构图/PPT 同步提取 128×128d INT8 ColQwen2 视觉向量，实现图文零损召回！</text>
</svg>
