<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#519 企业金融支付实时反欺诈与风控 (`5,000 TPS · P99 ≤ 35ms`) 三级快慢协同 AI 选型指南</text>
  <text x="30" y="60" class="sub">终结“全量同步调 70B 超时 (680ms / 320卡)”与“纯树模型误杀好人 (6.8% 误报)” · 92% 3ms GBDT + 7.5% 8B 单步打分仅需 12 卡</text>

  <!-- Left Card -->
  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么支付风控不能直接调 70B 生成式大模型？如何压进 25ms？</text>
  <text x="48" y="132" class="txt bad">• 纯 70B 同步拦截灾难: 支付网关硬性要求 P99 ≤ 35ms，而 70B 生成理由</text>
  <text x="64" y="150" class="txt bad">耗时 680ms (超时 19 倍 ✕)，且 5,000 TPS 需 320 张 H200 ($857万/年 ✕)</text>
  <text x="48" y="174" class="txt warn">• 纯传统 XGBoost 盲区: 看不懂转账附言/电诈话术，漏网率 21.5%，误杀率 6.8% ✕</text>
  <text x="48" y="198" class="txt good">• 2026 三级快慢协同风控架构 (P99 = 24.8 ms · 欺诈召回 96.8% 🏆):</text>
  <text x="64" y="218" class="txt">① Tier 1 极速绿通 (92% 交易 · 3.2ms): Flink/Redis 实时特征 + ONNX GBDT 秒放行</text>
  <text x="64" y="238" class="txt">② Tier 2 灰区语义精判 (7.5% = 375 TPS · 21.5ms): 8B 模型只跑 1 步 Prefill</text>
  <text x="64" y="258" class="txt good">取首 Token Logprob 风险概率 (零 Decode 耗时！)，0.5% 高危异步交 70B/R1 查团伙 🏆</text>

  <!-- Right Card -->
  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 5,000 TPS 金融交易风控三套架构的性能、召回率与算卡对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (100% 同步 70B LLM 逐笔审查): P99 延迟 680.0 ms ✕</text>
  <text x="594" y="152" class="txt bad">严重违反 35ms 支付 SLA，需 320 张 H200 ($857.0 万/年 ✕)</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (纯传统 XGBoost/LightGBM + 静态规则): P99 仅 3.2 ms ✓，</text>
  <text x="594" y="198" class="txt warn">但新型电诈/伪装商户召回仅 78.5%，好人误杀率高达 6.8% (客诉爆炸 ✕)</text>
  <text x="578" y="224" class="txt good">• 方案 3 (三级快慢协同: 92% GBDT + 7.5% 8B Logprob + 0.5% 异步 70B 🏆):</text>
  <text x="594" y="246" class="txt good">- 在线 P99 延迟: 24.8 ms (稳守 ≤35ms 红线 ✓) · 欺诈召回升至 96.8% (+18.3 pts 🏆)</text>
  <text x="594" y="268" class="txt good">- 误报率压至 1.8% (-73.5% 🏆) · 仅需 12 张 H200 (8卡在线+4卡异步，省 96.2% 卡 🏆)</text>

  <!-- Bottom Card -->
  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 5,000 TPS 峰值下三种风控架构的欺诈召回率、误杀率与所需 H200 卡数对比</text>

  <text x="48" y="378" class="txt">方案 1: 100% 同步调 70B 大模型</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">320 张 H200 ($857万/年) | P99 = 680 ms (超时 19 倍不可用 ✕)</text>

  <text x="48" y="418" class="txt">方案 2: 纯传统 XGBoost 规则引擎</text>
  <rect x="305" y="404" width="12" height="16" fill="#f59e0b" rx="4"/>
  <text x="327" y="418" class="txt warn">0 张 GPU | P99 = 3.2 ms ✓ | 但新型欺诈召回仅 78.5% · 误杀率高达 6.8% ✕</text>

  <text x="48" y="458" class="txt good">方案 3: 三级快慢协同 (GBDT+8B+70B 🏆)</text>
  <rect x="305" y="444" width="24" height="16" fill="#10b981" rx="4"/>
  <text x="339" y="458" class="txt good">仅 12 张 H200 (省 96.2% 卡 🏆) | P99 = 24.8 ms ✓ | 召回 96.8% · 误杀压至 1.8% (-73.5% 🏆)</text>
</svg>
