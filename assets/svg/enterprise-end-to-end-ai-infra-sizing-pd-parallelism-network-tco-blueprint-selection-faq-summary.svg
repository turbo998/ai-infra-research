<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">第 450 篇里程碑：企业级 AI 基础设施架构设计、推理并行、智算网络与容量手算一站式通关总纲 (#450)</text>
  <text x="28" y="58" class="sub">从业务 DAU/QPS -&gt; Little's Law 并发 -&gt; 三道水位线算卡 -&gt; PD 分离与 TP/PP/DP/EP -&gt; NVLink/RDMA 网络 -&gt; 3年 TCO 完整闭环</text>

  <!-- Left Panel: The 6-Step Architect Master Formula Chain -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 云与 AI 解决方案架构师 (SA) 六步端到端容量手算闭环</text>

  <rect x="42" y="120" width="524" height="212" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="144" class="mono">• 第 1 步 (业务需求转吞吐): Peak_RPS = DAU * Turns * 4.8 / 86400 -&gt; 5x 加权 TPM</text>
  <text x="56" y="168" class="mono">• 第 2 步 (Little's Law 算并发): B_active = Peak_RPS * [TTFT + (N_out - 1) * TPOT]</text>
  <text x="56" y="192" class="mono">• 第 3 步 (三道水位线算卡数): N_GPU = max(N_mem / 0.85, N_bw, N_compute)</text>
  <text x="56" y="216" class="mono">• 第 4 步 (PD 分离与并行切分): 25% Flex 动态 PD + 机内 TP / MoE DP+DeepEP + MTP</text>
  <text x="56" y="240" class="mono">• 第 5 步 (智算高速网络配平): NVLink 域内 TP + Rail 400G GPUDirect RDMA (&gt;=90% busbw)</text>
  <text x="56" y="264" class="mono">• 第 6 步 (网关与采购组合): APIM + Envoy K8s GIE + 60% RI/PTU + 25% PAYGO + 15% Spot</text>
  <text x="56" y="294" class="txt" font-weight="700" fill="#34d399">🏆 全栈协同乘数效应：64卡集群 Goodput 暴涨 6.81 倍，3年净省 $466 万！</text>

  <!-- Right Panel: 4 End-to-End Cluster Architecture Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四代企业级 64 卡智算集群端到端实测对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 同构混部 + 跨机纯 TP + 普通 25G TCP + 100% 按需采购 (粗放基线)</text>
  <text x="638" y="158" class="mono">• P99 TPOT: 86.2ms ✕ | Goodput: 4,200 tok/s ✕ | 3年总 TCO: $648 万 ($1.38/1M)</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 混部 + Chunked Prefill + 机内 TP=8 + 静态 400G RoCEv2</text>
  <text x="638" y="214" class="mono">• P99 TPOT: 27.8ms | Goodput: 11,400 tok/s | 3年总 TCO: $389 万 ($0.56/1M)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 静态 1:1 PD 分离 + Attention DP/EP + 400G RoCEv2</text>
  <text x="638" y="270" class="mono">• P99 TPOT: 16.5ms | Goodput: 18,900 tok/s | 3年总 TCO: $274 万 ($0.31/1M) ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 六步全栈精算架构 (GIE + 弹性 PD + DP/DeepEP/MTP + Rail RDMA + 60/25/15) (🏆)</text>
  <text x="638" y="326" class="mono">• P99 TPOT: 11.2ms 🏆 | Goodput: 28,600 tok/s (6.81x) 🏆 | 3年 TCO: $182 万 ($0.16/1M)!</text>

  <!-- Bottom Panel: 4 Pillar Summary Cards -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 四大核心知识支柱速查口诀 (架构汇报前 3 分钟必背黄金法则)</text>

  <rect x="42" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">支柱一：PD 分离与并行切分</text>
  <text x="56" y="464" class="mono">• &lt;=8~16卡混部 Chunked Prefill；</text>
  <text x="56" y="484" class="mono">  &gt;=16卡+RDMA 上弹性 PD (25% Flex)</text>
  <text x="56" y="504" class="mono">• TP 锁死机内 NVLink；Dense 跨机用 PP</text>
  <text x="56" y="524" class="mono">• MoE 用 Attention DP + DeepEP</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">MTP 投机解码在 B&gt;=48 时自动关断！</text>

  <rect x="328" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="342" y="440" class="txt" font-weight="700" fill="#34d399">支柱二：智算高速互联网络</text>
  <text x="342" y="464" class="mono">• Scale-Up (NVLink 900~1800GB/s)</text>
  <text x="342" y="484" class="mono">  比 Scale-Out (RDMA 50GB/s) 快 18x</text>
  <text x="342" y="504" class="mono">• BIOS 必关 PCIe ACS 保 PIX 直通</text>
  <text x="342" y="524" class="mono">• ECN K_min &lt;&lt; PFC XOFF + DLB 喷洒</text>
  <text x="342" y="550" class="txt" fill="#34d399">Day-0 验收 busbw &gt;= 90% 物理线速！</text>

  <rect x="614" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="628" y="440" class="txt" font-weight="700" fill="#fde68a">支柱三：三道水位线与 TPM/TPS</text>
  <text x="628" y="464" class="mono">• N_GPU = max(N_mem/0.85, N_bw, N_cmp)</text>
  <text x="628" y="484" class="mono">• 671B+14B MTP 单机 8xH200 一步装下</text>
  <text x="628" y="504" class="mono">• B_active = Peak_RPS * E2EL</text>
  <text x="628" y="524" class="mono">• PTU 加权 TPM = In*(1-eta) + 5*Out</text>
  <text x="628" y="550" class="txt" fill="#fde68a">流式必盯 P99 ITL 与双 SLA Goodput！</text>

  <rect x="900" y="414" width="258" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="914" y="440" class="txt" font-weight="700" fill="#d8b4fe">支柱四：平台选型与 FinOps</text>
  <text x="914" y="464" class="mono">• &lt;28% 选 PAYGO；28~58% 选 PTU；</text>
  <text x="914" y="484" class="mono">  &gt;58% 且 &gt;=16卡自建 K8s (含 SRE)</text>
  <text x="914" y="504" class="mono">• APIM 南北向 + Envoy GIE 东西向</text>
  <text x="914" y="524" class="mono">• 60/25/15 (RI/PAYGO/Spot) 组合</text>
  <text x="914" y="550" class="txt" fill="#d8b4fe">网关四档 Token 归因误差压至 1.1%！</text>
</svg>
