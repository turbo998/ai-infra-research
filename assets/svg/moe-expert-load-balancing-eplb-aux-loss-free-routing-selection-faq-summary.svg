<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad80" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad80" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad80)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad80)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22.5" font-weight="800">⚖️ MoE 混合专家负载均衡、免辅助损失路由 (Aux-Loss-Free) 与动态专家复制 (EPLB) 选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">64×H100/H200 (EP=64, $160/hr) · 671B MoE (256 路由专家 + 1 共享专家, Top-8, 58 层) · 代码/数学偏斜流量 (4.2x 热点) · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Round 80 · MoE Aux-Free &amp; EPLB</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 传统 Aux-Loss + 丢词截断</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">梯度惩罚干扰专精度 + CF=1.25 溢出直接丢词</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 溢出被丢弃 Token 比例: <tspan fill="#f87171" font-weight="700">14.8% (直接走残差 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 代码/数学基准准确率: <tspan fill="#f87171" font-weight="700">74.2% (暴跌 -10.3pt ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 热门卡/平均卡负载偏斜比: <tspan fill="#cbd5e1" font-weight="700">1.25x (靠硬截断削平)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• P99 TPOT / 集群吞吐: <tspan fill="#cbd5e1" font-weight="700">18.5 ms · 42,800 tok/s</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 质量返工年损: <tspan fill="#f87171" font-weight="700">$1.04/1M · 年损 $690k ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么传统 Aux-Loss + 丢词伤智商？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 辅助损失产生反方向梯度，强逼代码专家去学</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">闲聊；② 超过 1.25 倍容量的关键代码词被直接</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">扔掉不算 FFN，导致长代码直接漏括号报错！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 无丢词 Dropless 静态单副本</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">0% 丢词保住精度 · 但 63 张卡死等 1 张热门卡</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 溢出被丢弃 Token 比例: <tspan fill="#34d399" font-weight="700">0.0% (MegaBlocks 变长)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 代码/数学基准准确率: <tspan fill="#fbbf24" font-weight="700">81.6%</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 热门卡/平均卡负载偏斜比: <tspan fill="#f87171" font-weight="700">4.20x (严重木桶短板 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• P99 TPOT / 集群吞吐: <tspan fill="#f87171" font-weight="700">42.8 ms ✕ · 24,500 tok/s ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 慢卡空转年损: <tspan fill="#f87171" font-weight="700">$1.81/1M · 年损 $840k ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ EP=64 大专家并行的“1 卡堵死 63 卡”：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">当白天湧入大批 Python 请求时，装有代码专家</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">的 GPU#12 收到 4.2 倍 Token，其余 63 张卡算完</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">在 All-to-All Combine 屏障前干等 31 毫秒！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 免辅助损失偏置 + 节点受限</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">动态偏置 b_i 符号更新 + M=4 节点上限 (训练标配)</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 溢出被丢弃 Token 比例: <tspan fill="#34d399" font-weight="700">0.0% ✅</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 代码/数学基准准确率: <tspan fill="#34d399" font-weight="700">84.5% (+10.3pt 满血智商 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 热门卡/平均卡负载偏斜比: <tspan fill="#60a5fa" font-weight="700">1.68x (专项突发仍有偏斜)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• P99 TPOT / 集群吞吐: <tspan fill="#60a5fa" font-weight="700">21.4 ms · 56,200 tok/s ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 百万词成本: <tspan fill="#60a5fa" font-weight="700">$0.79 / 1M ✅</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ DeepSeek-V3 训练核心突破：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">只在 Top-K 选路时加上无梯度偏置 b_i，而乘回</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">专家输出时仍用原始亲和度 s_i！既实现预训练</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">均衡，又 100% 释放专家领域专精度 (84.5%)！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 免损路由 + 动态 EPLB 288槽 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">+32 冗余物理槽位复制热门专家 + 零停机热迁移</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 溢出被丢弃 Token 比例: <tspan fill="#34d399" font-weight="700">0.0% 🏆</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 代码/数学基准准确率: <tspan fill="#34d399" font-weight="700">84.5% (100% 专精无损 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 热门卡/平均卡负载偏斜比: <tspan fill="#34d399" font-weight="700">1.08x (从 4.20x 削平 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• P99 TPOT / 集群吞吐: <tspan fill="#34d399" font-weight="700">11.2ms (快3.82x) · 88.4k tok/s 🏆</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 年净省算力: <tspan fill="#34d399" font-weight="700">$0.50/1M · 年省 $798,000 🏆</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 攻克在线偏斜洪峰的终极武器 (EPLB)：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">每张卡预留 4.5 个物理槽位 (64卡共 288 槽)，把</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">Top-32 热门专家动态复制 2~4 份并按节点分层</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">装箱，吞吐暴涨 3.61 倍、P99 压至 11.2ms！</text>
  </g>

  <!-- Bottom Left: Skew Perturbation Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📊 流量偏斜度从 1.4x 飙至 5.8x 时的 P99 TPOT 尾延迟对比 (ms，越低越好)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">对比静态单副本 Dropless MoE (Tier 2) 与动态冗余槽位复制 EPLB (Tier 4)</text>

    <!-- Row 1 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">均匀多语种混合 (1.4x 轻度偏斜)</text>
    <rect x="235" y="74" width="54" height="14" rx="3" fill="#10b981"/>
    <text x="297" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">10.6 ms (EPLB 🏆)</text>
    <rect x="235" y="92" width="85" height="14" rx="3" fill="#64748b"/>
    <text x="328" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">16.8 ms (Tier 2)</text>

    <!-- Row 2 -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">企业日常助手/RAG (2.4x 中度偏斜)</text>
    <rect x="235" y="124" width="56" height="14" rx="3" fill="#10b981"/>
    <text x="299" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">10.9 ms (快 2.42x ✅)</text>
    <rect x="235" y="142" width="134" height="14" rx="3" fill="#f59e0b"/>
    <text x="377" y="154" fill="#fde68a" font-size="11.5" font-weight="700">26.4 ms (Tier 2)</text>

    <!-- Row 3 -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">白天 Coding Agent 洪峰 (4.2x 高偏斜)</text>
    <rect x="235" y="174" width="58" height="14" rx="3" fill="#10b981"/>
    <text x="301" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">11.2 ms (快 3.82x 🏆)</text>
    <rect x="235" y="192" width="218" height="14" rx="3" fill="#ef4444"/>
    <text x="461" y="204" fill="#f87171" font-size="11.5" font-weight="700">42.8 ms (Tier 2 ✕)</text>

    <!-- Row 4 -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">数学奥赛 RL Rollout 风暴 (5.8x 极偏斜)</text>
    <rect x="235" y="224" width="62" height="14" rx="3" fill="#10b981"/>
    <text x="305" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">12.1 ms (快 4.84x 🏆)</text>
    <rect x="235" y="242" width="298" height="14" rx="3" fill="#ef4444"/>
    <text x="540" y="254" fill="#f87171" font-size="11.5" font-weight="700">58.6 ms (✕)</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#fde68a" font-size="11.5" font-weight="700">💡 为什么推理不能改路由偏置 b_i？改偏置等于换了别的专家回答！EPLB 靠复制真专家实现无损分流！</text>
  </g>

  <!-- Bottom Right: 3 Rules for MoE Routing & EPLB -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 超大 MoE 路由与 EPLB 负载均衡架构设计三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：预训练用 `Aux-Loss-Free 偏置路由` 取代传统辅助损失</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 选路用 `TopK(s_i + b_i)`，但加权输出用原始 `s_i`；仅靠符号步长 `b_i += γ·sign(mean - load)`</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  调节冷热，零虚假梯度污染，让代码/数学准确率直接高出 +10.3 个百分点！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：在线推理预留 `+12.5%` 冗余物理专家槽位 (`256 → 288 Slots`)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 推理时模型权重已冻结，不能把代码问题硬塞给诗歌专家！必须用冗余显存把 Top-32 热门</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  代码/数学专家复制到多张 GPU 上，让多张卡分担同一个热门逻辑专家的 Token！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fde68a" font-size="13" font-weight="800">3️⃣ 铁律三：后台 CUDA Stream 异步 P2P 拷贝权重 + 原子指针切换路由表</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 每 3~5 分钟根据滑动窗口热度重算一次分层装箱方案，通过低优 RDMA/NVLink 后台同步</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  专家权重并在 Step 边界原子切换 `logical_to_physical_map`，实现 0.0ms 零停机热重平衡！</text>
  </g>
</svg>
