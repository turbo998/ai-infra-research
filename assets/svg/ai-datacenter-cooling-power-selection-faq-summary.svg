<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bg10)" rx="16"/>
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent10)" rx="3"/>

  <!-- Header -->
  <text x="40" y="58" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">
    AI 智算中心高密机柜供电与液冷架构选型一图流 (Forced-Air vs. RDHx vs. 1-Phase DLC vs. Immersion)
  </text>
  <text x="40" y="84" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    基准：1,152 GPUs (16 × 72-GPU 超节点域 · 1,984 kW 硅片负荷 · 3 年 26,280h · $0.10/kWh) | Provenance: synthetic + anonymized_reported (independently_reproduced=false)
  </text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="104" width="268" height="270" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="56" y="132" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1 · 强制风冷 (冷热通道封闭)</text>
  <text x="56" y="154" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">适用：单柜 &le; 35–40 kW PCIe/小规模推理</text>
  <text x="56" y="182" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 机柜规模：64 柜 (18 GPUs/柜, 36.9 kW)</text>
  <text x="56" y="206" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 机房 PUE：1.48 (风扇耗电 +15.5%)</text>
  <text x="56" y="230" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 跨柜光模块：+$4,480,000 (拆4柜破铜缆极限)</text>
  <text x="56" y="254" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 满血频率保持率：92.0% (高温易降频)</text>
  <text x="56" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 3 年总电费：$9,192,770.28</text>
  <rect x="56" y="302" width="236" height="54" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="68" y="324" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">3 年综合基建 TCO：$14,312,770.28</text>
  <text x="68" y="344" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">无法承载单柜 NVL72 (132 kW) 铜背板</text>

  <!-- Tier 2 -->
  <rect x="324" y="104" width="268" height="270" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="340" y="132" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2 · 背门热交换器 (RDHx 利旧)</text>
  <text x="340" y="154" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">适用：40–65 kW/柜 存量风冷机房改造</text>
  <text x="340" y="182" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 机柜规模：32 柜 (36 GPUs/柜, 70.0 kW)</text>
  <text x="340" y="206" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 机房 PUE：1.28 (排风 100% 房间热中和)</text>
  <text x="340" y="230" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 跨柜光模块：+$2,240,000 (每域跨 2 柜)</text>
  <text x="340" y="254" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 满血频率保持率：96.5% (零主板水路改造)</text>
  <text x="340" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 3 年总电费：$7,529,088.60</text>
  <rect x="340" y="302" width="236" height="54" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="352" y="324" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">3 年综合基建 TCO：$10,889,088.60</text>
  <text x="352" y="344" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">HGX H100/H200 存量机房最快扩容桥梁</text>

  <!-- Tier 3 -->
  <rect x="608" y="104" width="276" height="270" rx="12" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="2.5"/>
  <text x="624" y="132" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">🏆 Tier 3 · 单相冷板液冷 (1-Phase DLC)</text>
  <text x="624" y="154" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12">主力首选：80–140 kW/柜 GB200/GB300 NVL72</text>
  <text x="624" y="182" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 机柜规模：16 柜 (72 GPUs/柜, 占地缩减 4.0x)</text>
  <text x="624" y="206" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 机房 PUE：1.12 (PG25 冷板捕热 82.0%)</text>
  <text x="624" y="230" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 跨柜光模块：$0.00 (100% 单柜无源铜背板)</text>
  <text x="624" y="254" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 满血频率：100.0% · 换件 MTTR 35.0 min</text>
  <text x="624" y="278" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 3 年电费：$6,044,005.80 (省 $3.15M 电费)</text>
  <rect x="624" y="302" width="244" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="636" y="324" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">3 年 TCO：$7,724,005.80 (净省 $6.59M / -46%)</text>
  <text x="636" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11">ASHRAE W4 温水全年 94% 免开冷水机组</text>

  <!-- Tier 4 -->
  <rect x="900" y="104" width="260" height="270" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="916" y="132" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 · 两相 / 全浸没式液冷</text>
  <text x="916" y="154" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="12">适用：&gt;150–240 kW/罐 极端超算密度</text>
  <text x="916" y="182" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 罐体规模：16 罐 (72 GPUs/罐, 125.0 kW)</text>
  <text x="916" y="206" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 机房 PUE：1.05 (液体捕热 99.0%, 零风扇)</text>
  <text x="916" y="230" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 罐体+绝缘液 CapEx：$3,100,000 (+84.5%)</text>
  <text x="916" y="254" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 换件 MTTR：88.0 min (吊装沥油慢 2.51x)</text>
  <text x="916" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 3 年总电费：$5,518,432.08</text>
  <rect x="916" y="302" width="228" height="54" rx="8" fill="#0f172a" stroke="#0369a1"/>
  <text x="928" y="324" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">3 年综合基建 TCO：$8,618,432.08</text>
  <text x="928" y="344" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">受 PFAS 环保法规与气密光模块约束</text>

  <!-- Middle Panel: First Principles Physics & Copper Backplane Economics -->
  <rect x="40" y="394" width="1120" height="176" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="424" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800">
    🔬 架构师第一性原理：为什么单相冷板液冷 (Tier 3) 的最大红利是“保住 1.5 米无源铜缆 NVLink 背板”？
  </text>
  <text x="60" y="454" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    1. 体积热容 3,450 倍物理鸿沟：PG25 水溶液热容 (~4,000 kJ/m³K) 是空气 (1.2 kJ/m³K) 的 3,450 倍；突破 700W–1,200W/GPU 时，风冷风扇自耗电飙至 15.5% (307.52 kW)。
  </text>
  <text x="60" y="482" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
    2. 铜退光进 vs. 液冷保铜：1.8 TB/s NVLink-5 无源铜缆物理极限仅 ~1.5 米！风冷被迫把 72 卡拆到 4 个机柜，每域多花 $280K 跨柜光模块 (16 域 = $4.48M) + 72 kW 光 DSP；
  </text>
  <text x="60" y="508" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">
       单相冷板将 72 卡浓缩进 1 台 128.34 kW ORv3 机柜，机柜内 100% 走无源铜缆背板 ($0 跨柜 Scale-Up 光模块)，光模块省下的钱 ($4.48M) 比三年省下的电费 ($3.15M) 还高！
  </text>
  <text x="60" y="538" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    3. 供电与防凝露双闭环：OCP ORv3 54V DC 铜母排将电流降至 1/4、热损降至 1/16 (转换效率 97.5%)；CDU 板换物理隔离一次侧/二次侧水路，锁定供水温度 &ge; 露点 + 3°C 彻底防凝露。
  </text>

  <!-- Bottom Panel: Production Checklist -->
  <rect x="40" y="588" width="1120" height="146" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="60" y="618" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="800">
    🛠️ 生产机房机电交底与验收六步核验清单 (Production MEP &amp; Facility Readiness Checklist)
  </text>
  <text x="60" y="646" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    ☑ [承重] 满配 NVL72 液冷柜重 ~1.5 吨，核验楼板活荷载 &ge; 12–15 kN/m² 或加装散力架     ☑ [防凝露] CDU 联锁机房露点传感器，强制二次侧供水 T_supply &ge; T_dew + 3.0°C (32–40°C)
  </text>
  <text x="60" y="674" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    ☑ [余热] 预留 18% 风冷余热回收 (~23 kW/柜 CRAH 或 RDHx 排走电源/内存/光模块热量)     ☑ [水质] 二次侧注入 PG25 丙二醇去离子水 + &le; 25μm 精密过滤，严防 0.1mm 微水道堵塞
  </text>
  <text x="60" y="702" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">
    ☑ [快接] 采用 OCP 盲插无滴漏快接头 (UQD &lt; 0.05 mL) + 漏液绳 &lt; 200ms 备用泵切换      ☑ [供电] 部署 ORv3 54V DC 盲插铜母排，断路器预留 1.15x–1.25x AllReduce 同步瞬态尖峰
  </text>
</svg>
