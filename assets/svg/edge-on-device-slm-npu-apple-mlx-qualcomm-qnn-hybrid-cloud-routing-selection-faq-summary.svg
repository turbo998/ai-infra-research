<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#10B981" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">端云协同 (Hybrid Edge-Cloud AI) 与端侧小模型选型：Apple MLX vs. NPU QNN/OpenVINO vs. llama.cpp</text>
  <text x="52" y="94" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15">唤醒企业 5 万台 AI PC / Mac 端侧免费算力：66% 高频任务端侧零成本 45ms 消化 + 本地 PII 脱敏后再上云</text>

  <!-- Left: Hardware Bandwidth & Edge Runtime Matrix -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="50" y="170" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 端侧硬件内存带宽第一性原理与三大主流运行时</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📐 端侧 Decode 吐字速率公式：TPS ≈ BW_LPDDR5X / M_Q4_weights</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Apple M4 Max (546 GB/s 统一内存)：跑 7B-Q4 (4GB) 可达 ~95 tok/s，甚至能装下 70B-Q4！</text>
  <text x="64" y="260" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• AI PC NPU (Snapdragon X / Lunar Lake, 135 GB/s, 45 TOPS)：跑 3B/7B-Q4 稳定 28~45 tok/s 且功耗仅 6W</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="64" y="314" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🛠️ 跨平台端侧引擎选型黄金搭档：</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• macOS/iOS 首选 `Apple MLX`；Windows Copilot+ NPU 选 `ONNX Runtime GenAI (QNN / OpenVINO)`</text>
  <text x="64" y="360" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 跨平台通用 CPU/GPU 兜底选 `llama.cpp (GGUF Q4_K_M)`，移动端选 `ExecuTorch`</text>

  <!-- Right: Hybrid Edge-Cloud Routing Architecture -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 端云协同三级分流与隐私零泄漏架构 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 66% 本地高频任务端侧闭环 (45ms TTFT, $0 云端账单)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">邮件摘要、会议纪要润色、IDE 单行补全、UI 意图分类 100% 在本地 NPU/MLX 完成</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 端侧 NPU 强制前置 PII 脱敏占位符替换 (Zero Raw PII Egress)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">需要上云的 34% 复杂查询，先由端侧 SLM 将客户姓名/账号替换为 `[ENTITY_1]`，回包再本地还原！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 首 Token 熵值置信度动态上云 (Logit-Entropy Cloud Escalation)</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">当端侧 7B 模型首字分布熵高于阈值（拿不准）时，无缝接力转发至云端 70B/671B 集群</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 5 万坐席企业办公助手（日均 225 万次调用）四档端云协同架构对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">端云部署架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">补全 P95 首字</text>
  <text x="610" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">云端 H200 需求</text>
  <text x="780" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">综合任务质量分</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">PII 零明文出境</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度云端推理成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 100% 纯云端大模型推理 (无端侧卸载)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">340.0 ms ✕</text>
  <text x="610" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">96 GPUs ✕</text>
  <text x="780" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">94.2%</text>
  <text x="950" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">FAIL (明文上云)</text>
  <text x="1110" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$268,800/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 100% 纯端侧 3B/7B-Q4 小模型 (无云端兜底)</text>
  <text x="450" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">48.0 ms</text>
  <text x="610" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">0 GPUs</text>
  <text x="780" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">76.5% ✕ (复杂失智)</text>
  <text x="950" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">PASS (全离线)</text>
  <text x="1110" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$12,000/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 静态功能切分 (42% 补全走端侧 / 58% 问答走云端)</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">52.0 ms</text>
  <text x="610" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">56 GPUs</text>
  <text x="780" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">91.8%</text>
  <text x="950" y="612" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">PARTIAL</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$156,800/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): 端云置信度路由 (66% 端侧 MLX/NPU + 端侧 PII 脱敏上云)</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">45.0 ms (-87%) ✓</text>
  <text x="610" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">32 GPUs (-66.7%)</text>
  <text x="780" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">93.9% ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">PASS (端侧脱敏)</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$89,600/mo (-67%)</text>
</svg>
