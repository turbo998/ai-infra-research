<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 269 · K8S MULTI-GPU &amp; MULTI-RNIC TOPOLOGY SCHEDULING: DEVICE PLUGIN VS TOPO MANAGER VS DRA FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">K8s GPU+NIC Pairing: Blind `SYS` Mismatch (11.2 GB/s) vs `DRA PIX Co-Allocation` (47.5 GB/s)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Blind Plugins &amp; `single-numa-node` Trap</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (Default Device Plugins): GPU plugin picks `gpu0 (NUMA 0)`</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  while RDMA plugin picks `mlx5_7 (NUMA 1)` (`SYS` `11.2 GB/s`)! ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (`single-numa-node`): Still mixes `PHB` across switches (`21.5 GB/s`)</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  AND rejects `100%` of 8-GPU Pods (`TopologyAffinityError`)! ✕</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Blind BW: 11.2 GB/s (-76%) | `single-numa` 8-GPU Admit: 0% ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Kubelet Topology Manager Only Sees NUMA Nodes, NOT PCIe Switches!</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: K8s `DRA` (`ResourceClaim` PIX Co-Allocation)</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Uses K8s `DRA (Dynamic Resource Allocation)` / NRI CDI hooks</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Enforces CEL constraint: `gpu.pcie_switch == nic.pcie_switch`</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Co-allocates exact `PIX` `(gpu_i, mlx5_i)` pairs + local NUMA CPUs</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Supports 1, 2, 4, and 8-GPU Pods seamlessly (`100%` admission!)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">GDR BusBW: 47.5 GB/s (4.24x) | PIX Match &amp; 8-GPU Admit: 100% 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">PCIe-Switch-Granular Co-Allocation Without Hardcoded Resource Names</text>
</svg>
