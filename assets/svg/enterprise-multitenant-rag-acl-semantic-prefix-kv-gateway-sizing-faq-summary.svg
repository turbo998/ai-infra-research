<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#571 企业多租户 RAG 与 Agent 平台：ACL 权限前置过滤、双层防串单缓存与 Envoy GIE KV 路由选型</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Roaring Bitmap ACL 前置过滤消灭零召回 · L1 租户隔离实体强校验语义缓存 (误命中 &lt;0.02%) + L2 K8s GIE 前缀路由 (命中 91.5%) · 省 62.5% GPU</text>

  <!-- Box 1: Vector RAG ACL Pre-Filter vs Post-Filter -->
  <rect x="24" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 多租户向量检索 ACL 权限过滤选型</text>
  <rect x="42" y="152" width="310" height="92" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 反模式：向量 Top-K 后置过滤 (Post-Filter)</text>
  <text x="52" y="191" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 先全库搜 Top-20，再剔除无权限文档</text>
  <text x="52" y="209" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 当租户权限占比 &lt;2% 时，召回结果经常为 0 条!</text>
  <text x="52" y="227" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 有效 Recall@10 暴跌至 41.2%</text>

  <rect x="42" y="254" width="310" height="114" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="274" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">🏆 生产标配：Roaring Bitmap 前置过滤 (Pre-Filter)</text>
  <text x="52" y="293" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Azure AI Search / Milvus PartitionKey / Qdrant</text>
  <text x="52" y="311" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 检索前先求 Entra ID 安全组位图交集，图内导航</text>
  <text x="52" y="329" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 结合 BM25+向量+Cross-Encoder 重排：Recall 96.4%</text>
  <text x="52" y="347" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 100% 物理阻断跨部门越权泄密 (0.0% Leakage)</text>

  <!-- Box 2: Two-Layer Caching Architecture -->
  <rect x="386" y="110" width="354" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="404" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 双层缓存协同：语义缓存 vs. Prefix KV</text>
  <rect x="404" y="152" width="318" height="98" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="416" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">L1 网关层：租户隔离 + 实体强校验语义缓存</text>
  <text x="416" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 裸开余弦相似度 &gt;0.90 会将“2025营收”与“2026营收”</text>
  <text x="416" y="209" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">  误判为同一问题 (张冠李戴率高达 11.8% ✕)</text>
  <text x="416" y="229" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 强制加上 [Tenant_ACL + 数字/日期槽位一致] 校验</text>

  <rect x="404" y="258" width="318" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="416" y="278" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">L2 引擎层：Envoy GIE + SGLang/vLLM Prefix KV 🏆</text>
  <text x="416" y="297" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 多轮 Agent 与长文档问答严禁进 L1 语义缓存!</text>
  <text x="416" y="315" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 交由 Envoy GIE EPP 按前缀哈希粘性路由至同 Pod</text>
  <text x="416" y="333" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 100% 精确复用历史 KV 块 (零幻觉 · 命中率 91.5%)</text>
  <text x="416" y="351" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• P95 TTFT 从 1,450ms 压至 210ms (快 6.90 倍!)</text>

  <!-- Box 3: Quantitative Impact -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 40 QPS 企业 RAG/Agent 平台账本</text>
  <rect x="774" y="152" width="264" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="176" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 A (无缓存 + 后置ACL + 轮询):</text>
  <text x="786" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• P95 TTFT: 1,450 ms · 需 32 张 H200</text>
  <text x="786" y="212" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Recall@10: 41.2% · $0.240/1M</text>

  <text x="786" y="242" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 B (裸开余弦语义缓存 cos&gt;0.90):</text>
  <text x="786" y="260" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 串单/误命中率: 11.8% (生产事故 ✕)</text>
  <text x="786" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 轮询打散导致底层 KV 命中仅 18%</text>

  <text x="786" y="308" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 C (前置ACL + 双层缓存 + GIE) 🏆</text>
  <text x="786" y="326" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 误命中率 &lt;0.02% · Recall 96.4%</text>
  <text x="786" y="344" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 仅需 12 张 H200 (-62.5%) · $0.068/1M</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 企业多租户 RAG 与 Agent 缓存架构三大黄金铁律：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. 权限铁律：向量库必须开启 Pre-Filter ACL 位图过滤，且缓存 Key 必须包含 hash(Tenant_ID + User_ACL_Groups) 防跨租户泄密。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">2. 分工铁律：L1 语义缓存仅拦截单轮高频 FAQ（且强制校验数字/日期/否定词完全一致）；多轮 Agent 100% 走 L2 Exact Prefix KV Cache。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">3. 排版铁律：Prompt 组装必须遵循 [静态 System Prompt → 静态 Tool Schema → 共享 RAG 文档块 → 动态多轮历史 → 最新问题] 顺序以锁死前缀哈希！</text>
</svg>
