  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业级多智能体平台选型：Azure AI Agent Service vs. LangGraph vs. SK/AutoGen</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">破解多智能体群聊 11.8 倍 Token 爆炸与多角色切换破坏 Prefix KV 缓存难题，将 20 步复杂任务完结率推至 99.4%</text>

  <!-- Left Box: Multi-Agent Token Explosion & Prefix KV Thrashing -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 为什么朴素多智能体“群聊广播”会让 Token 账单暴涨 11.8 倍？</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">群聊广播反模式: Tokens = Sum_{t=1..T} (N_agents * Full_Transcript_t)</text>
  <text x="90" y="242" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">缓存失灵根源  : Agent_A 与 Agent_B 轮流调同一实例 -&gt; System Prompt 交替覆盖!</text>
  <text x="90" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">结构化交接正道: 仅传递 &lt;800 Tok 结构化 Handoff JSON + 按 Agent_ID 粘性路由</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 群聊全量广播：5 个 Agent 聊 15 轮消耗 28.5 万 Tokens，且 Prefix 命中跌至 18%</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 结构化状态图交接：每步仅传精简 Artifact 摘要，总消耗压至 3.8 万 Tokens (-86%)</text>
  <text x="76" y="350" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 角色粘性路由：网关按 Agent_Role_ID 绑核路由，各角色 KV 命中率重回 92.4%！</text>

  <!-- Right Box: 3 Enterprise Multi-Agent Frameworks -->
