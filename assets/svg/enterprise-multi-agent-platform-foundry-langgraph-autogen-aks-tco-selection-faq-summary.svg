  <text x="648" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">SK + AutoGen (MS Agent): 企业 C#/Python 双栈 + Temporal/Dapr 持久化编排</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 人工审批休眠 (Human-in-the-Loop)：状态落盘至 Postgres/Cosmos，0 内存等待跨天审批</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 代码执行隔离：使用 ACA Dynamic Sessions (Hyper-V) 或 Firecracker 快照微虚拟机</text>
  <text x="634" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：20 步复杂长周期任务完结率从 71.5% 提升至 99.4%，成本降 79.6%！</text>

