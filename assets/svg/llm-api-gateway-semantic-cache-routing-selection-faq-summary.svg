<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg25" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent25" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg25)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent25)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">企业级大模型 API 网关、语义缓存与多模型级联路由选型一图流 (Round 25 · 1,000万请求/月)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">无状态轮询 (8.1% KV 命中, $142k/月) vs. TPM+精确缓存 ($129.9k) vs. KV 前缀亲和+语义缓存 ($78.4k) vs. 级联路由 (8B/70B/671B, $27.0k, -81%)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Gateway Physics & Cascade Architecture -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#93c5fd" font-size="16" font-weight="800">① 为什么直接用 Nginx 轮询会让 GPU 前缀缓存命中率暴跌 8 倍？如何砍掉 81% 成本？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 传统 Nginx/Envoy 轮询三大灾难: 击碎 KV 缓存 + 杀鸡用牛刀</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 将同一多轮会话随机打散到 8 个副本，GPU RadixCache 前缀命中率从 65.0% 暴跌至 8.1% (65%/8)</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 100% 流量（含简单意图分类）全送往昂贵 671B 旗舰模型，月烧 $142,000，P99 TTFT 1,420ms</text>

  <rect x="44" y="258" width="510" height="84" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="280" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 KV-Prefix 亲和路由 + 双层校验语义缓存: 成本立省 44.8%</text>
  <text x="58" y="302" fill="#d1fae5" font-size="12">• 网关实时感知各 Worker 显存 KV 树 (Dynamo kvcr)，多轮会话亲和路由使 KV 命中率恢复至 64.2%</text>
  <text x="58" y="324" fill="#d1fae5" font-size="12">• 向量余弦 (&gt;=0.94) + Cross-Encoder 精排防误杀语义缓存直接拦截 26.4% 重复提问 (12ms 极速返回)</text>

  <rect x="44" y="354" width="510" height="96" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="376" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 难度感知级联路由 (RouteLLM: 8B &rarr; 70B &rarr; 671B): 账单暴降 81.0%!</text>
  <text x="58" y="398" fill="#f3e8ff" font-size="12">• 1.8ms 轻量分类头按指令复杂度动态分流：52% 简单任务走 8B ($0.06/1M)，33% 中等走 70B ($0.35/1M)，</text>
  <text x="58" y="418" fill="#f3e8ff" font-size="12">  仅 15% 复杂数学/架构推理走 671B 旗舰 ($1.80/1M) + 低置信度自动向上升级 (Cascade Escalation)</text>
  <text x="58" y="438" fill="#6ee7b7" font-size="12" font-weight="700">• 保持 99.2% 任务质量，P99 TTFT 压至 185.0ms (快 7.68x)，月成本从 $142k 砍至 $26,980!</text>

  <rect x="44" y="462" width="510" height="82" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="58" y="484" fill="#93c5fd" font-size="13" font-weight="700">🛡️ 语义缓存防串货红线：参数抽取剥离 + 租户/时效 Namespace 强隔离</text>
  <text x="58" y="506" fill="#cbd5e1" font-size="12">• “查 2025 年财报”与“查 2026 年财报”向量余弦高达 0.97！严禁裸跑纯余弦阈值缓存</text>
  <text x="58" y="526" fill="#cbd5e1" font-size="12">• 必须先剥离数字/日期/实体槽位或过 Cross-Encoder 校验，并按 tenant_id 物理隔离缓存池</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档企业级 LLM API 网关架构定量对比 (1,000万请求/月 · 8 副本)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">API 网关与路由架构档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">KV 命中 / 缓存命中</text>
  <text x="952" y="190" fill="#cbd5e1" font-size="12" font-weight="700">P99 TTFT / 质量</text>
  <text x="1058" y="190" fill="#cbd5e1" font-size="12" font-weight="700">月度账单 (节省)</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: 无状态轮询代理 (Nginx)</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">按请求数限流 · 100% 走旗舰大模型</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">8.1% KV 命中 ✕</text>
  <text x="828" y="256" fill="#cbd5e1" font-size="11">0.0% 网关缓存</text>
  <text x="952" y="236" fill="#fca5a5" font-size="12" font-weight="700">1,420.0 ms ✕</text>
  <text x="952" y="256" fill="#cbd5e1" font-size="11">质量 100.0%</text>
  <text x="1058" y="236" fill="#fca5a5" font-size="12" font-weight="700">$142,000 / 月</text>
  <text x="1058" y="256" fill="#94a3b8" font-size="11">$14.20 / 1k req</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: TPM 限流 + 精确匹配缓存</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">Token 桶防突发 · 仅拦截一字不差提问</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">11.2% KV 命中</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">8.5% 精确缓存</text>
  <text x="952" y="312" fill="#fde047" font-size="12" font-weight="700">890.0 ms ✕</text>
  <text x="952" y="332" fill="#cbd5e1" font-size="11">质量 100.0%</text>
  <text x="1058" y="312" fill="#fde047" font-size="12" font-weight="700">$129,930 / 月</text>
  <text x="1058" y="332" fill="#cbd5e1" font-size="11">省 8.5%</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: KV 前缀亲和 + 语义缓存</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">Dynamo KV 树路由 + Cross-Encoder 语义缓存</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">64.2% KV 命中 ✅</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">26.4% 语义缓存 ✅</text>
  <text x="952" y="388" fill="#6ee7b7" font-size="12" font-weight="700">310.0 ms ✅</text>
  <text x="952" y="408" fill="#6ee7b7" font-size="11">质量 99.6%</text>
  <text x="1058" y="388" fill="#6ee7b7" font-size="12" font-weight="700">$78,400 / 月</text>
  <text x="1058" y="408" fill="#6ee7b7" font-size="11">省 44.8% ($63.6k)</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: Tier 3 + 级联路由 (8B/70B/671B)</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">复杂度分流 + 低置信度升级 + 实时 SLO 熔断</text>
  <text x="828" y="464" fill="#34d399" font-size="12" font-weight="700">64.2% KV 命中 🏆</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">26.4% 语义缓存 🏆</text>
  <text x="952" y="464" fill="#e9d5ff" font-size="12" font-weight="700">185.0 ms 🏆</text>
  <text x="952" y="484" fill="#34d399" font-size="11" font-weight="700">质量 99.2% 🏆</text>
  <text x="1058" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">$26,980 / 月</text>
  <text x="1058" y="484" fill="#34d399" font-size="11" font-weight="700">省 81.0% ($115.0k)!</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 32 副本扩展拐点：无状态轮询 KV 命中率跌至 2.0%，KV 亲和路由稳守 62.8% (高 31.4 倍)!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#3b82f6"/>
  <text x="44" y="606" fill="#93c5fd" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for Enterprise LLM API Gateways）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fca5a5">严禁用传统无状态轮询负载均衡直接挂多台 vLLM/SGLang</tspan>；<tspan font-weight="700" fill="#6ee7b7">必上 KV-Prefix 亲和路由 (Tier 3)</tspan> 挽回 8 倍前缀命中率。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">企业 AI 中台必配难度感知级联路由 (Tier 4: 8B &rarr; 70B &rarr; 671B)</tspan>：把 85% 中低难度请求卸给轻量模型，月账单砍 81%。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/llm_api_gateway_routing_selection/results.json · tests/test_llm_api_gateway_routing_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
