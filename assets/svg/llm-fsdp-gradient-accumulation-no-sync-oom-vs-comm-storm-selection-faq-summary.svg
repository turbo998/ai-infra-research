  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (Default FSDP `GAS=8`): Runs 24 cross-node collectives per</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  step (`8 × [Fwd AG + Bwd AG + RS]`), stalling on RoCE (14.80 s) ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (Calling `no_sync()` on FSDP!): Disabling `ReduceScatter`</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  forces every GPU to hold FULL unsharded 70B gradients (`140 GB` OOM)! ✕</text>
