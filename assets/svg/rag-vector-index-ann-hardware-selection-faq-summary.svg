<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg18" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent18" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg18)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent18)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">十亿级企业 RAG 向量检索与混合索引硬件架构选型一图流 (Round 18 · 100M–1B Vectors)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">全内存 FP32 HNSW (891GB) vs. SQ8/RaBitQ 量化 HNSW (-71.9% 成本) vs. NVMe DiskANN (-91.0% 成本) vs. GPU cuVS CAGRA (快 15.8x 建库 / 12.1x QPS)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Vector Index Physics & Memory Wall -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#6ee7b7" font-size="16" font-weight="800">① 为什么 1 亿条向量跑全内存 HNSW 要吃掉 891GB 内存？如何破局？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 全内存 FP32 HNSW 内存税: 1 亿向量 = 890.9 GB DRAM ($6,480/月)</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 100M × 1536 维 × 4B = 614.4 GB 原始向量 + HNSW 多层邻接表与内存碎片 (1.45x) = 890.9 GB</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 10 亿向量需 8.9 TB 纯内存，月租高达 $64,800/月，且 CPU 建索引耗时 14.5 小时！</text>

  <rect x="44" y="258" width="510" height="82" rx="8" fill="#422006" stroke="#eab308"/>
  <text x="58" y="280" fill="#fde047" font-size="13.5" font-weight="700">🟨 Tier 2 内存量化 HNSW (SQ8 / RaBitQ + 异步重排): 内存砍 3.78x 至 235.6 GB</text>
  <text x="58" y="302" fill="#fef08a" font-size="12">• 图遍历用 8-bit/2-bit 量化向量驻留 CPU L3/DRAM，仅对候选 Top-100 拉取 FP32 精排</text>
  <text x="58" y="322" fill="#fef08a" font-size="12">• P99 反而从 4.2ms 降至 3.1ms (缓存命中率更高)，Recall@10 达 97.4%，月租省 71.9%</text>

  <rect x="44" y="352" width="510" height="88" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="374" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 NVMe SSD DiskANN (Vamana 图): 内存暴降 18.56x 至 48 GB，省 91.0%!</text>
  <text x="58" y="396" fill="#d1fae5" font-size="12">• 内存仅留 64B/vec 的 PQ 压缩路由表 (48 GB)，把全精度向量与邻居表对齐打包进 SSD 4KB 扇区</text>
  <text x="58" y="418" fill="#d1fae5" font-size="12">• 单次 io_uring 并发读取同时拿回邻居 ID 与原始向量，P99 11.8ms 达标，月租仅 $580 (-91.0%)!</text>

  <rect x="44" y="452" width="510" height="92" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="474" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 GPU 加速 cuVS CAGRA: 建库快 15.8x (55 分钟)，吞吐高 12.1x (22,400 QPS)</text>
  <text x="58" y="496" fill="#f3e8ff" font-size="12">• 摒弃分支发散的 HNSW 树，改用固定出度扁平 CAGRA 图 + Warp 级协同并行 Beam Search</text>
  <text x="58" y="518" fill="#f3e8ff" font-size="12">• P99 压至 1.35 ms，单分片 QPS 飙升至 22,400 (12.11x)，每亿次查询成本仅 $0.04 (-97.0%)!</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档向量索引架构定量对比 (每分片 100M × 1536 维 · SLA &le;15ms)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">向量索引与硬件档位 (1 亿条/分片)</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">内存占用 / 建库</text>
  <text x="948" y="190" fill="#cbd5e1" font-size="12" font-weight="700">P99 / QPS</text>
  <text x="1055" y="190" fill="#cbd5e1" font-size="12" font-weight="700">Recall / 月度成本</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: 全内存 FP32 HNSW</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">纯 DRAM 暴力驻留 · 10 亿需 $64.8k/月</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">890.9 GB</text>
  <text x="828" y="256" fill="#fca5a5" font-size="11">建库 14.50 h ✕</text>
  <text x="948" y="236" fill="#f8fafc" font-size="12">4.20 ms</text>
  <text x="948" y="256" fill="#cbd5e1" font-size="11">1,850 QPS</text>
  <text x="1055" y="236" fill="#fca5a5" font-size="12" font-weight="700">$6,480 / 月</text>
  <text x="1055" y="256" fill="#cbd5e1" font-size="11">Recall 98.2%</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: SQ8 / RaBitQ 量化 HNSW</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">量化导航 + Top-100 原始向量重排</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">235.6 GB (3.8x)</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">建库 8.20 h</text>
  <text x="948" y="312" fill="#6ee7b7" font-size="12" font-weight="700">3.10 ms ✅</text>
  <text x="948" y="332" fill="#fde047" font-size="11">2,940 QPS (1.6x)</text>
  <text x="1055" y="312" fill="#fde047" font-size="12" font-weight="700">$1,820 (-71.9%)</text>
  <text x="1055" y="332" fill="#cbd5e1" font-size="11">Recall 97.4%</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: NVMe SSD DiskANN (Vamana)</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">48GB PQ 内存 + 4KB 扇区对齐 SSD 直读</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">48.0 GB (18.6x)</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">建库 6.80 h</text>
  <text x="948" y="388" fill="#f8fafc" font-size="12">11.80 ms ✅</text>
  <text x="948" y="408" fill="#cbd5e1" font-size="11">1,120 QPS</text>
  <text x="1055" y="388" fill="#6ee7b7" font-size="12.5" font-weight="800">$580/月 (-91.0%)</text>
  <text x="1055" y="408" fill="#6ee7b7" font-size="11">Recall 95.8%</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: GPU 加速 cuVS CAGRA</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">Warp 级并行图搜索 + Host DRAM 零拷贝</text>
  <text x="828" y="464" fill="#e9d5ff" font-size="12" font-weight="700">192.0 GB</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">建库 0.92h (15.8x)</text>
  <text x="948" y="464" fill="#34d399" font-size="12" font-weight="700">1.35 ms 🏆</text>
  <text x="948" y="484" fill="#e9d5ff" font-size="11" font-weight="700">22,400 QPS (12x)</text>
  <text x="1055" y="464" fill="#e9d5ff" font-size="12" font-weight="700">$2,160 (-66.7%)</text>
  <text x="1055" y="484" fill="#34d399" font-size="11" font-weight="700">$0.04/亿次查询</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 10 亿向量 (1B) 账单对比：全内存 HNSW 需 $64,800/月，NVMe DiskANN 仅需 $5,800/月 (年省 $70.8 万)!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#10b981"/>
  <text x="44" y="606" fill="#6ee7b7" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for Enterprise RAG Vector Indexing）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fde047">&lt;=5,000 万中等库选 Tier 2 (SQ8/RaBitQ 内存量化)</tspan>；<tspan font-weight="700" fill="#6ee7b7">亿级～十亿级企业知识库归档必选 Tier 3 (NVMe DiskANN)</tspan> 砍掉 91% 内存账单。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">高频日更重建索引或万级 QPS DeepResearch Agent 并发检索必选 Tier 4 (GPU cuVS CAGRA)</tspan>：建库快 15.8x，吞吐高 12.1x。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/rag_vector_index_selection/results.json · tests/test_rag_vector_index_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
