<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 59 · LLM PRETRAINING OPTIMIZER ARCHITECTURE &amp; MATRIX ORTHOGONALIZATION (MUON VS. ADAMW / SHAMPOO)</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">大模型预训练优化器与 2D 分布式 Muon (Newton-Schulz 矩阵正交化) 选型一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 72B LLM on 512×H100 (FSDP=64 × TP=8, Target Loss = 1.85 @ 10.0T AdamW Tokens) · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="136" height="24" rx="6" fill="#7F1D1D"/>
  <text x="124" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 标准 FP32 AdamW</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">坐标级独立更新 (12 Bytes/Param)</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">主奇异方向垄断，长尾特征更新极慢</text>
  <text x="56" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 优化器状态显存: 12.0 B/Param ✕</text>
  <text x="56" y="298" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单步更新耗时: 18.5 ms / step</text>
  <text x="56" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 样本收敛效率: 1.00x (基线)</text>
  <text x="56" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 达标所需词数: 10.00 万亿 Tokens ✕</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 预训练算力总账: $4.20M ✕</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚪ 仅适合 1D 向量与词表 Embedding</text>

  <!-- Tier 2 -->
  <rect x="346" y="148" width="288" height="310" rx="12" fill="#1F2437" stroke="#F97316" stroke-width="1.5"/>
  <rect x="362" y="164" width="148" height="24" rx="6" fill="#7C2D12"/>
  <text x="436" y="180" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 2 · 8-Bit 量化 AdamW</text>
  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">2048 分块动态量化 / Adafactor</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">仅省显存，完全不加速训练步数</text>
  <text x="362" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 优化器状态显存: 6.0 B/Param (-50% ✅)</text>
  <text x="362" y="298" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单步更新耗时: 24.0 ms / step</text>
  <text x="362" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 样本收敛效率: 0.99x (无加速 ✕)</text>
  <text x="362" y="350" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 达标所需词数: 10.10 万亿 Tokens ✕</text>
  <text x="362" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 预训练算力总账: $4.24M ✕</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 仅适合单机显存受限微调 (SFT)</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="164" height="24" rx="6" fill="#1E3A8A"/>
  <text x="750" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · 二阶 Shampoo / SOAP</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Kronecker 协方差 + FP32 SVD</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">二阶曲率收敛快，但特征分解开销重</text>
  <text x="668" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 优化器状态显存: 14.0 B/Param ✕</text>
  <text x="668" y="298" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单步更新耗时: 145.0 ms (FP32 SVD)</text>
  <text x="668" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 样本收敛效率: 1.28x ✅</text>
  <text x="668" y="350" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 达标所需词数: 7.81 万亿 Tokens ✅</text>
  <text x="668" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 预训练算力总账: $3.40M ✅</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 二阶曲率优良但受制于 FP32 求根</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
  <text x="1066" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · 2D 分布式 Muon (推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">5步 BF16 Newton-Schulz + AdamW</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">Kimi Moonlight 范式 · 100% Tensor Core</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 优化器状态显存: 6.0 B/Param (-50% 🏆)</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单步更新耗时: 42.5 ms (仅占1.1% 🏆)</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 样本收敛效率: 1.38x (谱白化 🏆)</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 达标所需词数: 7.25 万亿 (省 2.75T 🏆)</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 总账: $3.08M (净省 $1.12M 🏆)</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 Dense 与 MoE 基座预训练黄金标准</text>

  <!-- Bottom Pipeline: 3 Core Pillars of 2D Distributed Muon -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">⚡ Kimi Moonlight 级 2D 分布式 Muon 三大工程秘籍：为什么既省 50% 状态显存，又能少训 27.5% Token？</text>

  <!-- Pillar 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#6366F1" stroke-width="1.2"/>
  <text x="82" y="562" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 5 步五次 Newton-Schulz 纯 BF16 谱白化</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 砍掉二阶方差 v，仅存 1 份 BF16 动量 M (省 50% 显存)</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 迭代 X = 3.44X - 4.78(XX^T)X + 2.03(XX^T)^2X 五次，</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  将奇异值条件数从 250 压至 1.73，所有特征维度齐步快跑</text>
  <text x="82" y="668" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 100% 跑满 Tensor Core GEMM，收敛提速 1.38x</text>

  <!-- Pillar 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="468" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 分层混合路由 + RMS 步长对齐 (零重调参)</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 严格分流：内部 2D 矩阵 (Q/K/V/O, FFN) 用 Muon；词表</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  Embedding、LM Head 与 1D RMSNorm 继续用 AdamW</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 步长乘以 0.2 * sqrt(max(m,n)) 并配解耦 Weight Decay</text>
  <text x="468" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 直接无缝复用 AdamW 学习率与 Warmup 曲线</text>

  <!-- Pillar 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="864" y="562" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ min(m,n) 短边转置 + FSDP Owner 分布式归属</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 高瘦矩阵先转置，确保 Gram 矩阵永远为短边方阵，在</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  GQA K/V 与 FFN 上节省 2.25x ~ 64x 正交化算力</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• FSDP 按 owner_rank = idx % 64 分摊正交化，杜绝全员重算</text>
  <text x="864" y="668" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 512 卡步长开销从 22.4s 压至 42.5ms (快 529x)</text>
</svg>
