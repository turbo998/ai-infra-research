<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 320 · MIXED GREEDY (T=0.0) &amp; STOCHASTIC BATCH SAMPLING &amp; GUMBEL-MAX</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">T=1e-5 Multinomial NaN Crash &amp; 2.85ms Split Batch vs. Multiplicative Gumbel-Max (0.38ms, 7.5x Faster)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2: T=1e-5 NaN Crash or 2.85ms Split</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (Clamp T=0.0 -&gt; 1e-5 + logits /= T + Softmax):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Dividing by 1e-5 overflows FP16/BF16 -&gt; Softmax produces</text>
  <text x="85" y="298" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  NaN -&gt; torch.multinomial triggers fatal CUDA assert crash!</text>
  <text x="85" y="335" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (Dynamic Sub-Batch index_select + scatter):</text>
  <text x="85" y="363" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Breaks CUDAGraph &amp; burns 2.85 ms (195 MB HBM traffic)!</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">T=1e-5 Clamp Crash Rate: 18.5% CUDA Assert! ✕</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Split-Batch Latency: 2.85 ms / Step (195.0 MB HBM Traffic)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Multiplicative Gumbel-Max (logit + T*G)</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Multiply Noise by T_b Instead of Dividing Logits by T_b:</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  argmax_v(logit_v / T + G_v) == argmax_v(logit_v + T * G_v)!</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Seamless Exact Greedy at T_b = 0.0 (Zero Division!):</text>
  <text x="640" y="333" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  When T_b == 0.0, T_b * G_v == 0.0 -&gt; Exact deterministic ArgMax!</text>
  <text x="640" y="368" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Single-Pass Read-Once Triton Reduction (38.9 MB Traffic)</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Sampler Latency: 0.38 ms (7.50x Faster) · 0.0% NaN</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">HBM Traffic Cut 5.96x (232 -&gt; 38.9 MB) · 100% CUDAGraph-Safe</text>
</svg>
