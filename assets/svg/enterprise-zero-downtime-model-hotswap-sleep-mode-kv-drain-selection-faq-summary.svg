<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">#494 企业大模型零停机热更新：Host-DRAM 预热 + vLLM Sleep Mode (1.8s 唤醒) + KV 平滑排空</text>
  <text x="30" y="60" class="sub">消除 K8s RollingUpdate “杀断 12.4% 长流式请求 + 185s 慢重启”与双倍蓝绿集群“月烧 $9.2万 备卡”的两难</text>

  <!-- Left: 3-Step Zero-Downtime Hot-Swap Pipeline -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. 零备卡 1.8 秒热切换三步流水线 (Host-DRAM Staging + Sleep Mode)</text>
  <text x="48" y="134" class="txt">• Step 1 后台静默预热 (Background Host-DRAM Pinned Staging):</text>
  <text x="64" y="154" class="txt">GPU 正常服务旧模型 v1 时，利用服务器闲置 2TB DDR5 内存提前从对象存储拉取新权重 v2</text>
  <text x="48" y="178" class="txt">• Step 2 网关单副本平滑排空 (KV-Aware Graceful SSE Drain):</text>
  <text x="64" y="198" class="txt">Envoy 摘除 Pod #1 新 Prefill 流量，等在途 Decode 吐完 [DONE] (0.0% 断流！)</text>
  <text x="48" y="222" class="txt good">• Step 3 vLLM Sleep Mode / CUDA IPC 1.8 秒闪电换权 (免重编译 CUDA Graph):</text>
  <text x="64" y="244" class="txt good">直接通过 PCIe Gen5 x16 双通道 (80 GB/s) 将 140GB 新权重灌入 HBM，仅需 1.8s 🏆</text>
  <text x="64" y="266" class="txt good">同架构换权免除 42s CUDA Graph 重编译，逐副本滚动完成全群零停机升级！</text>

  <!-- Right: 4-Tier Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 四种模型发布与切流方案实测对比 (32x H200 生产集群 · 140GB 模型)</text>
  <text x="578" y="134" class="txt bad">• Tier 1 K8s 默认 RollingUpdate: 耗时 185.0s，强杀 12.4% 在途长请求 ✕</text>
  <text x="578" y="158" class="txt warn">• Tier 2 全量双倍蓝绿集群 (64卡): 0.5s 切流，但多买 100% 备卡 (月烧 $9.2万 ✕)</text>
  <text x="578" y="182" class="txt">• Tier 3 KV 排空 + GDS 磁盘快载: 耗时 28.5s，零断流，需 +12.5% (4张) 弹性卡</text>
  <text x="578" y="208" class="txt good">• Tier 4 Host-DRAM 预热 + Sleep Mode + KV 排空 (推荐 🏆):</text>
  <text x="594" y="232" class="txt good">- 单副本换权耗时: 1.8 秒 (比冷重启快 102.8 倍！免 CUDA Graph 重编译 🏆)</text>
  <text x="594" y="256" class="txt good">- 在途请求断流率: 0.0% | 额外备用 GPU 卡数: 0 张 (年省 $110.4 万 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 四种发布方案的单副本切换耗时 (秒) 与额外冗余 GPU 开销对比 (越短越优)</text>

  <text x="48" y="365" class="txt">Tier 1 K8s 默认 RollingUpdate</text>
  <rect x="290" y="352" width="520" height="16" fill="#ef4444" rx="4"/>
  <text x="820" y="365" class="txt bad">185.0 s (含 42s Graph 重编译) | 断流 12.4% ✕ | 需 +50% 备卡</text>

  <text x="48" y="395" class="txt">Tier 2 双倍蓝绿集群 (100% 备卡)</text>
  <rect x="290" y="382" width="16" height="16" fill="#f59e0b" rx="4"/>
  <text x="318" y="395" class="txt warn">0.5 s ✓ | 断流 0.0% | 但需 +100% 闲置备卡 (月浪费 $92,000 ✕)</text>

  <text x="48" y="425" class="txt">Tier 3 KV 排空 + GDS 磁盘直读</text>
  <rect x="290" y="412" width="130" height="16" fill="#3b82f6" rx="4"/>
  <text x="430" y="425" class="txt">28.5 s ✓ | 断流 0.0% ✓ | 需 +12.5% 弹性卡 ($11,500/月)</text>

  <text x="48" y="455" class="txt good">Tier 4 DRAM 预热 + Sleep Mode 🏆</text>
  <rect x="290" y="442" width="22" height="16" fill="#10b981" rx="4"/>
  <text x="325" y="455" class="txt good">1.8 s (提速 102.8x 🏆) | 断流 0.0% 🏆 | 0 张额外备卡 ($0 闲置浪费 🏆)</text>
</svg>
