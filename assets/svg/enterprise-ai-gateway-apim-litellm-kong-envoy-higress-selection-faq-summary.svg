  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">内置 llm-token-limit / 语义缓存 / Content</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Safety 护栏，彻底消灭明文 API Key 🏆</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 网关转发开销: <tspan fill="#34d399" font-weight="800">2.8 ms (原生策略引擎 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 故障切换耗时: <tspan fill="#34d399" font-weight="800">2.5 ms (PTU-&gt;PAYGO/跨区 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 可用性 / 分账: <tspan fill="#34d399" font-weight="800">99.99% SLA / 100% 精准分账 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (TCO): <tspan fill="#34d399" font-weight="800">$36,800 / 月 (立省 $27.2K 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 中大型企业云原生 AI 治理标准底座</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么企业 AI 网关绝不能只做“HTTP 反向代理”，必须具备三大 GenAI 原生能力？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 能力 1：流式 SSE 拆包计量与预估+事后双阶段 Token 限流 (TPM)</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 95% 的大模型调用开启了 `stream: true`，传统网关拿不到响应体里的 `usage` 字段；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 现代 AI 网关自动注入 `stream_options: {"include_usage": true}`，在流式尾包提取精确</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  Prompt/Completion Tokens 扣减 Redis 部门配额，彻底消灭 128K 大请求饿死全司配额！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 能力 2：“外层 Azure APIM + 内层 LiteLLM / Envoy”黄金组合模式</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 单一企业对外/跨部门治理选 **Azure APIM (Tier 4)**：搞定 Entra ID 免密、WAF 与 PTU 溢出；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• K8s 集群高并发多云 + 自建 vLLM 接入选 **Envoy AI Gateway / Higress / Kong (Tier 3)**；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• AI 研发团队快速实验 100+ 异构长尾模型选 **LiteLLM Proxy (Tier 2)** 作为内部适配层！</text>
</svg>
