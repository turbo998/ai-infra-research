  <rect width="1280" height="760" fill="url(#bg362)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="440" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="272" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 362 · ENTERPRISE AI GATEWAY SELECTION &amp; GOVERNANCE</text>
  <text x="508" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="23.5" font-weight="800">企业级 AI Gateway 统一接入层选型：Nginx 直连 vs. LiteLLM Proxy vs. Envoy/Higress/Kong vs. Azure APIM</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">20 个业务部门共享多模型中台 (峰值 300 RPS · 月耗 15B Tokens)：Token 感知限流、流式 SSE 拆包分账、免密 Entra ID 与 2.5ms 零等待防雪崩切换</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc362)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="232" height="24" rx="6" fill="#7f1d1d"/>
  <text x="184" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · SDK 直连 / 传统 Nginx 代理</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">无 Token 感知 · 密钥散落失控</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">仅按 HTTP 请求数 (RPS) 限流，不懂 Token</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么传统 API 网关管不了大模型？</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">1 个 128K 长文档请求顶 640 个普通聊天，</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">按 RPS 限流导致 18.5% 配额被邻居吃光 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 网关转发开销: <tspan fill="#94a3b8" font-weight="700">0.8 ms (无解析能力)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 故障切换耗时: <tspan fill="#f87171" font-weight="700">30,000 ms (TCP 超时 ✕)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 部门分账准确度: <tspan fill="#f87171" font-weight="700">0.0% (无法拆 SSE 流 ✕)</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (TCO): <tspan fill="#f87171" font-weight="700">$64,000 / 月 (零缓存/溢出 ✕)</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁在多团队生产环境裸奔直连</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="232" height="24" rx="6" fill="#78350f"/>
  <text x="484" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · LiteLLM Proxy (Python 代理)</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">100+ 模型秒级适配 · 敏捷首选</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Python FastAPI + PostgreSQL 账本 + Redis</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心优势与高并发瓶颈：</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">15 分钟统一 OpenAI 格式与 Virtual Key</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">预算；但 Python 高并发下开销 14.5ms ⚠️</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 网关转发开销: <tspan fill="#fbbf24" font-weight="700">14.5 ms (Python GIL 开销 ⚠️)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 故障切换耗时: <tspan fill="#fbbf24" font-weight="700">18.0 ms (Router 自动重试)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 部门分账准确度: <tspan fill="#34d399" font-weight="700">99.2% (内置 Spend Tracking)</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (TCO): <tspan fill="#fbbf24" font-weight="700">$48,200 / 月 (-24.7%)</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 适合 AI 研发团队快速接入与内部中台</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="236" height="24" rx="6" fill="#0c4a6e"/>
  <text x="786" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · Envoy AI Gateway / Higress / Kong</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">C++/Rust 数据面 · 2.1ms 极低延迟</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">K8s Gateway API + Wasm 流式 Token 计量</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (延迟开销降 6.90x)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">在 Envoy/Nginx 原生流中零拷贝提取 SSE</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Token 账单，单节点轻松扛 5,000+ RPS ✅</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 网关转发开销: <tspan fill="#38bdf8" font-weight="800">2.1 ms (比 Python 快 6.90x ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 故障切换耗时: <tspan fill="#38bdf8" font-weight="800">3.5 ms (跨云/自建秒级熔断 ✅)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 部门分账准确度: <tspan fill="#38bdf8" font-weight="800">99.9% (OTel GenAI 遥测 ✅)</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (TCO): <tspan fill="#38bdf8" font-weight="800">$38,900 / 月 (-39.2% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ K8s 云原生团队与自建 vLLM 接入首选</text>

