<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#570 里程碑：云与 AI 架构师 (Cloud &amp; AI SA) 四大核心支柱全景速查圣经与端到端容量沙盘</text>
  <text x="44" y="76" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13">支柱1: PD分离与TP/PP/DP/EP · 支柱2: NVLink/IB/RoCEv2 · 支柱3: 三道水位线与TPM/TPS/PTU · 支柱4: PAYGO/PTU/K8s与AI网关 · 成本降11.8x</text>

  <!-- Pillar 1 -->
  <rect x="24" y="108" width="246" height="274" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="38" y="134" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">🚀 支柱1：PD分离与并行切分</text>
  <rect x="38" y="148" width="218" height="218" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="48" y="170" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• PD 分离黄金边界 (#563)：</text>
  <text x="48" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">&gt;=16卡 + RDMA + ISL&gt;=4K 必拆 PD</text>
  <text x="48" y="205" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">NIXL/Mooncake 逐层重叠仅暴露 1.0ms</text>
  <text x="48" y="230" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 并行切分铁律 (#564)：</text>
  <text x="48" y="248" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">TP≤8 锁死机内 NVLink (严禁跨机!)</text>
  <text x="48" y="265" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">405B 选 TP8×PP2；671B 选 DP×EP</text>
  <text x="48" y="290" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 三大加速标配：</text>
  <text x="48" y="308" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Block-FP8 + Radix Prefix + 原生 MTP</text>
  <text x="48" y="326" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="11">单卡吞吐 3,890 tok/s (涨 5.48x)</text>

  <!-- Pillar 2 -->
  <rect x="284" y="108" width="246" height="274" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="298" y="134" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">🌐 支柱2：智算高速互联网络</text>
  <rect x="298" y="148" width="218" height="218" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="308" y="170" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• Scale-Up vs. Scale-Out (#565)：</text>
  <text x="308" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">NVLink 450~900GB/s (&lt;1μs) 跑 TP</text>
  <text x="308" y="205" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">IB/RoCE 50~100GB/s (2μs) 跑 EP/KV</text>
  <text x="308" y="230" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• GPUDirect RDMA 零拷贝：</text>
  <text x="308" y="248" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">nvidia-peermem + 关 ACS + PIX</text>
  <text x="308" y="265" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">400G busbw 达 47.6 GB/s (95.2%)</text>
  <text x="308" y="290" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 无损调优与验收公式：</text>
  <text x="308" y="308" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">ECN(150KB) &lt; PFC(1.2MB) + 200ms狗</text>
  <text x="308" y="326" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5">busbw = algbw × 2(N-1)/N &gt;=45G</text>

  <!-- Pillar 3 -->
  <rect x="544" y="108" width="248" height="274" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="558" y="134" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📐 支柱3：三道水位线与TPM/TPS</text>
  <rect x="558" y="148" width="220" height="218" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="568" y="170" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 三道水位线算卡 (#566, #568)：</text>
  <text x="568" y="188" fill="#cbd5e1" font-family="Consolas, monospace" font-size="10.5">N = max(N_mem, N_bw, N_comp)</text>
  <text x="568" y="205" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">H100 跑 P 池 + H200/MI325X 跑 D 池</text>
  <text x="568" y="230" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• Little's Law 在途并发：</text>
  <text x="568" y="248" fill="#38bdf8" font-family="Consolas, monospace" font-size="10.5">E2EL = TTFT+(S_out-1)×TPOT</text>
  <text x="568" y="265" fill="#6ee7b7" font-family="Consolas, monospace" font-size="10.5">B_active = QPS × E2EL</text>
  <text x="568" y="290" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 帕累托 Goodput 甜点：</text>
  <text x="568" y="308" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">卡死 TTFT + P99 ITL 双 SLA 红线</text>
  <text x="568" y="326" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="11">云端按 P80 买 PTU (1 Out=4.5 In)</text>

  <!-- Pillar 4 -->
  <rect x="806" y="108" width="250" height="274" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="820" y="134" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">⚖️ 支柱4：云/K8s拐点与AI网关</text>
  <rect x="820" y="148" width="222" height="218" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="830" y="170" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 双 TCO 利用率拐点 (#567)：</text>
  <text x="830" y="188" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">&lt;24% 选 PAYGO；24~56% 选 PTU</text>
  <text x="830" y="205" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">&gt;56% 且 &gt;=16卡 (含SRE) 转自建 K8s</text>
  <text x="830" y="230" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 双层 AI Gateway 标配：</text>
  <text x="830" y="248" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">南北向 APIM/Kong (OBO+WCU计费)</text>
  <text x="830" y="265" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">东西向 Envoy GIE (KV命中 91.8%)</text>
  <text x="830" y="290" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 三级 KV 与潮汐混部 (#569)：</text>
  <text x="830" y="308" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">Pinned DRAM 100ms 恢复 128K 会话</text>
  <text x="830" y="326" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="11">夜间回填 Ray Data 达 86.5% 利用率</text>

  <!-- Bottom KPI Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="44" y="426" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="bold">🏆 第 570 篇里程碑全栈实证总账（集团级 50 Peak QPS 混合负载：未优化烟囱式 vs. 四大支柱协同架构）：</text>
  <text x="44" y="452" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 传统粗放架构 (同卡混部 + 无 GPUDirect + 只按权重/峰值买卡 + 轮询网关)：需 64 张 GPU，Goodput 仅 64.5%，成本 $0.448/1M。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• 四大支柱协同架构 (#563–#570 闭环)：仅需 20 张 GPU (8x H100 P池 + 12x H200 D池，省 68.8% 卡)，Goodput 99.4%，P99 TPOT 11.8ms！</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 财务总收益：每百万达标 Token 综合成本从 $0.448 暴降至 $0.038 (降低 11.79 倍)，每年为企业净省 $384 万基础设施支出！</text>
</svg>
