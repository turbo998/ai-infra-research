<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad414" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad414" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad414)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级保险智能理赔定损（Claims Triage）、多模态反欺诈与精算核赔 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">月均 42万笔车险/健康险理赔 · 人工审单+死规则 vs. 纯VLM看票据直接算赔款 vs. VLM OCR+普通RAG vs. 图像篡改取证+GNN反欺诈+确定性免赔额精算引擎</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">96.4% Fraud · 99.6% Math</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 人工核赔员审单 + 静态规则</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">自动闪赔率仅22%，团伙骗保难发现</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 78% 案件需人工逐张核对医院发票与维修单</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 肉眼难辨 AIGC 修图伪造发票与跨单串通骗保</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">自动直通理赔率(STP): 22.0% ✕</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">欺诈/PS假发票召回率: 58.5% ✕</text>
  <text x="54" y="358" fill="#94a3b8" font-size="12.5">赔付金额与条款准确率: 93.5%</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月核赔人力与渗漏成本: $390,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统低效作业，理赔周期长且渗漏高</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 纯 VLM 看图直接拍板赔付金额</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">看不出 PS 像素篡改，免赔额阶梯算错</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 视觉大模型只认字，漏掉 54% PS/AIGC 假票据</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 搞混免赔额、自费药剔除与分项限额，错算 31.6%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">自动直通理赔率(STP): 74.0%</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">欺诈/PS假发票召回率: 46.0% (漏检 ✕)</text>
  <text x="346" y="358" fill="#fca5a5" font-size="12.5">赔付金额与条款准确率: 68.4% (超赔 ✕)</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月核赔与欺诈渗漏总成本: $480,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让VLM直接心算复杂保险精算赔付额</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: VLM 票据提取 + 普通保单 RAG</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">提取了明细，但缺团伙图谱与精算引擎</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 无法识破同一修理厂/第三方关联人串通骗保</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 主险+附加险(Rider)免责覆盖顺序仍有 16.4% 偏差</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">自动直通理赔率(STP): 58.5%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">欺诈/PS假发票召回率: 71.2%</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">赔付金额与条款准确率: 83.6%</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月核赔人力与渗漏成本: $175,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：单张简单门诊票据初审，不具备精算级确定性</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad414)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 篡改取证+GNN+精算引擎 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">ELA取证 + GNN团伙图谱 + 确定性精算</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• ELA 像素重压缩检测 + GNN 揪出串通修理厂</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 附加险覆盖树 + 代码级免赔额瀑布精算 + 拒赔人审</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">自动直通理赔率(STP): 82.5% 🏆 (+60.5pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">欺诈/PS假票召回率: 96.4% 🏆 (+37.9pts)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">赔付金额与条款准确率: 99.6% 🏆 (精算引擎)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月核赔与渗漏总成本: $62,000 (-84.1% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：财产险(车险/家财)、健康医疗险与寿险核赔中心</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 保险核赔与反欺诈架构师铁律（Pixel Forensics + GNN Fraud Graph + Deterministic Actuarial Waterfall）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 票据先做像素篡改取证（ELA / EXIF / 电子发票税控核验）与 GNN 关系图谱串通评分，再由多模态 VLM 抽取医疗/配件项目编码。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 赔付金额严禁由 LLM 心算：必须由确定性精算引擎依次执行“观察期→责任免除→自费剔除→免赔额→赔付比例→分项封顶”，且拒赔决定强制人工复核 · Provenance: synthetic + anonymized_reported</text>
</svg>
