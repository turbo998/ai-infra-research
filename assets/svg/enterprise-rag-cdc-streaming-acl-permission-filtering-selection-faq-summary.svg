<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad84" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad84" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad84)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad84)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22.5" font-weight="800">🔐 企业级实时 RAG 增量索引 (CDC)、谓词感知图检索 (ACORN) 与细粒度权限过滤 (ACL) 选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">5,000 万企业文档块 (SharePoint/Confluence/Jira, 日更 5% + 日均 8万次权限变更, 员工平均可见度 1.5%) · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 84 · RAG CDC &amp; ACORN ACL</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 每晚全量重建 + 粗拆库</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">24 小时权限撤销空窗泄露 + 95% 重复向量化</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 权限撤销生效延迟: <tspan fill="#f87171" font-weight="700">86,400 秒 (24h 越权风险 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 1.5% 权限下 Recall@10: <tspan fill="#fbbf24" font-weight="700">78.5% (跨部门孤岛漏召回)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• P95 检索延迟: <tspan fill="#cbd5e1" font-weight="700">28.0 ms</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 每日 Embedding 算力费: <tspan fill="#f87171" font-weight="700">$1,850 / 天 (全量重跑 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度总 TCO 账单: <tspan fill="#f87171" font-weight="700">$912,000 / yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 安全合规与算力双杀：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">员工上午被移出并购项目组，但要等半夜批量</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">任务跑完才更新向量库，全天仍能用 RAG 搜出</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">机密！且每天白白重算 95% 根本没改过的段落！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 全局检索 + 后置权限过滤</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">先取全局 Top-100 再剔除无权文档 (零结果饥饿)</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 权限撤销生效延迟: <tspan fill="#34d399" font-weight="700">5.0 秒</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 1.5% 权限下 Recall@10: <tspan fill="#f87171" font-weight="700">24.6% (零结果饥饿崩盘 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• P95 检索延迟: <tspan fill="#f87171" font-weight="700">42.5 ms</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 每日 Embedding 算力费: <tspan fill="#fbbf24" font-weight="700">$92.50 / 天 (按文件重算)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度总 TCO 账单: <tspan fill="#fbbf24" font-weight="700">$485,000 / yr</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 为什么 Post-Filtering 在企业必翻车？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">普通员工只能看全公司 1.5% 的文档；全局搜出</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">的 Top-100 里有 98.5 条属于别的部门，后置过</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">滤一删只剩 1 条甚至 0 条，RAG 直接变瞎子！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 传统 HNSW 遍历硬跳过无权点</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">单跳遍历直接屏蔽无权点 · 破坏小世界图连通性</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 权限撤销生效延迟: <tspan fill="#34d399" font-weight="700">5.0 秒</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 1.5% 权限下 Recall@10: <tspan fill="#f87171" font-weight="700">68.4% (图断连死胡同 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• P95 检索延迟: <tspan fill="#f87171" font-weight="700">64.0 ms (反复回溯超时 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 每日 Embedding 算力费: <tspan fill="#60a5fa" font-weight="700">$92.50 / 天</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度总 TCO 账单: <tspan fill="#60a5fa" font-weight="700">$410,000 / yr</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">⚠️ HNSW 前置过滤的“断桥死胡同”：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">HNSW 依赖枢纽节点 (Hubs) 架桥导航。当占 98.5%</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">的无权节点被硬屏蔽时，通往目标有权节点的</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">桥全断了，贪心搜索卡死在局部孤岛里！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: CDC Merkle + ACORN + 位图 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">块哈希差分 + 2跳谓词感知图 + Roaring 位图秒级吊销</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 权限撤销生效延迟: <tspan fill="#34d399" font-weight="700">0.5 秒 (亚秒级零越权 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 1.5% 权限下 Recall@10: <tspan fill="#34d399" font-weight="700">96.4% (+71.8pt 满血 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• P95 检索延迟: <tspan fill="#34d399" font-weight="700">6.8 ms (比 Tier 3 快 9.41x 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 每日 Embedding 算力费: <tspan fill="#34d399" font-weight="700">$22.20 / 天 (省 98.8% 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度总 TCO 账单: <tspan fill="#34d399" font-weight="700">$118k/yr (年省 $794,000 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 企业级实时安全 RAG 终极参考架构：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 改权限只翻转内存 Roaring Bitmap 比特位 (0</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">次重索引)；② ACORN 二跳邻居扩展借道无权桥</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">梁点；③ 极低可见度 (&lt;0.2%) 自动切 SIMD 精扫！</text>
  </g>

  <!-- Bottom Left: Selectivity Perturbation Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📊 员工权限可见度从 50% 收紧至 0.1% 时的 Recall@10 召回率对比 (%)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">对比后置过滤 (Tier 2)、传统 HNSW 前置过滤 (Tier 3) 与 ACORN + 自适应位图引擎 (Tier 4)</text>

    <!-- 50% -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">50.0% 可见度 (全员公开文档)</text>
    <rect x="225" y="74" width="285" height="14" rx="3" fill="#10b981"/>
    <text x="518" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">98.2% 🏆</text>
    <rect x="225" y="92" width="275" height="14" rx="3" fill="#64748b"/>
    <text x="508" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">94.8% (Tier 2)</text>

    <!-- 10% -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">10.0% 可见度 (部门级知识库)</text>
    <rect x="225" y="124" width="283" height="14" rx="3" fill="#10b981"/>
    <text x="516" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">97.5% 🏆</text>
    <rect x="225" y="142" width="197" height="14" rx="3" fill="#f59e0b"/>
    <text x="430" y="154" fill="#fde68a" font-size="11.5" font-weight="700">68.0% (Tier 2)</text>

    <!-- 1.5% -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">1.5% 可见度 (项目组 RBAC 基线)</text>
    <rect x="225" y="174" width="280" height="14" rx="3" fill="#10b981"/>
    <text x="513" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">96.4% 🏆</text>
    <rect x="225" y="192" width="71" height="14" rx="3" fill="#ef4444"/>
    <text x="304" y="204" fill="#f87171" font-size="11.5" font-weight="700">24.6% (Tier 2 ✕) / 68.4% (Tier 3)</text>

    <!-- 0.1% -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">0.1% 可见度 (高管并购绝密文档)</text>
    <rect x="225" y="224" width="275" height="14" rx="3" fill="#10b981"/>
    <text x="508" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">94.8% (SIMD 直扫 🏆)</text>
    <rect x="225" y="242" width="10" height="14" rx="3" fill="#ef4444"/>
    <text x="243" y="254" fill="#f87171" font-size="11.5" font-weight="700">3.2% (Tier 2 彻底失明 ✕)</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#a7f3d0" font-size="11.5" font-weight="700">💡 黄金分界线：可见度 &gt;=0.5% 走 ACORN 二跳谓词图导航；可见度 &lt;0.5% 直接对位图 ID 做 SIMD 距离精算！</text>
  </g>

  <!-- Bottom Right: 3 Rules for Enterprise RAG CDC & ACL -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 企业级实时 RAG 增量流与权限过滤架构设计三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="70" fill="#6ee7b7" font-size="13" font-weight="800">1️⃣ 铁律一：“向量内容”与“ACL 权限位图”物理彻底解耦</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 严禁把权限变化当成文档重建事件去重跑 Embedding！文档变更走块级 Merkle-Tree SHA256</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  差分（仅重算改动的 1.2% 段落），权限变更直接秒级原地翻转内存 Roaring Bitmap！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="160" fill="#93c5fd" font-size="13" font-weight="800">2️⃣ 铁律二：采用 `ACORN 二跳谓词扩展` + `选择度自适应路由`</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 在图索引中允许借道无权邻居的二跳边（2-Hop Expansion）防止小世界图断连；当用户权限</text>
    <text x="34" y="198" fill="#cbd5e1" font-weight="11.5" font-size="11.5">  命中位图基数 `&lt; 100,000` 条时，自动旁路图索引、直接按位图 ID 列表做 AVX-512/GPU 精扫！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="34" y="250" fill="#67e8f9" font-size="13" font-weight="800">3️⃣ 铁律三：软删除墓碑位图 (`Tombstone Bitmap`) + 语义缓存绑定版本与权限令牌</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 收到文档删除事件后 0.1 秒置位 `deleted_tombstone_bitmap` 立即对检索隐身，后台异步</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  合并修复 HNSW 边；且任何上层 Semantic Cache Key 必须拼接 `(user_acl_hash, doc_epoch)`！</text>
  </g>
</svg>
