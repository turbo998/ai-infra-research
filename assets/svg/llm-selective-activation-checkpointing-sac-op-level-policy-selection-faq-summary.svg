<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 298 · OP-LEVEL SELECTIVE ACTIVATION CHECKPOINTING (SAC) vs. FULL RECOMPUTE</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Full-Layer Checkpointing (+33.3% FLOPs Tax, 395 TF) vs. Op-Level SAC (18.7 GB, +2.4% FLOPs, 514 TF)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2/3: OOM, +33% FLOP Tax or SwiGLU Bloat</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (No Checkpointing): 68.0 GB Activations -&gt; OOM!</text>
  <text x="85" y="275" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (Full-Layer Activation Checkpointing):</text>
  <text x="85" y="303" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Re-executes ALL Linear GEMMs &amp; FlashAttn (+33.3% FLOPs!)</text>
  <text x="85" y="338" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 3 (Legacy Attention-Only Recompute):</text>
  <text x="85" y="366" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Still stores huge SwiGLU [B, S, 3.5d] tensors (44.5 GB!)</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Full Recompute Effective Speed: 395 TFLOPS (-23%)</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Legacy Attn-Only Memory: 44.5 GB (SwiGLU Eats 43% HBM)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: PyTorch Op-Level SAC (TorchTitan Style)</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• CheckpointPolicy.MUST_SAVE on compute-bound ops:</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Saves FlashAttention output &amp; expensive Linear GEMMs</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• CheckpointPolicy.PREFER_RECOMPUTE on memory hogs:</text>
  <text x="640" y="333" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Recomputes SwiGLU (silu*up), RMSNorm &amp; RoPE (&lt;2.4% FLOPs)</text>
  <text x="640" y="368" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Cuts activation HBM by 72.5% (68.0 -&gt; 18.7 GB)</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Effective Speed: 514.0 TFLOPS (1.30x Over Full Ckpt!)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">Activation Memory: 18.7 GB · Recompute Tax: Only +2.4%</text>
</svg>
