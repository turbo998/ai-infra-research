  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Trap 1: `static_x = new_x` rebinds Python name, NOT GPU pointer!</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  `replay()` keeps reading old hardcoded address `0x7f8a...`! ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Trap 2: Python `int/float` args (`seq_len`, `temp`) freeze forever!</text>
