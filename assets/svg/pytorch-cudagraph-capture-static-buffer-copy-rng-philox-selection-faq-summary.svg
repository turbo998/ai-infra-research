  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">PyTorch CUDAGraph: Pointer/Scalar Freeze Bugs vs `Static .copy_() + Device RNG` (+48.6% Speedup)</text>
