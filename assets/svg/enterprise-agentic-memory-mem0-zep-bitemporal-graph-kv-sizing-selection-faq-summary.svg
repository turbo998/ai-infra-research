<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">#501 企业长周期智能体记忆架构：Mem0/Zep 双时序知识图谱 vs. 纯向量历史 vs. 128K 重放</text>
  <text x="30" y="60" class="sub">解决纯向量聊天记录检索“新旧状态冲突 (54.5% 准确率)”与 128K 全历史重放“需 80 张 H200 ($23万/月)”的算力痛点</text>

  <!-- Left: Why Vector Chat History Fails & Bi-Temporal Graph Solution -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. 为什么用纯向量库搜聊天记录越用越蠢？三级双时序记忆架构</text>
  <text x="48" y="134" class="txt bad">• 纯向量搜历史记录的死穴 (Stale Fact Collision):</text>
  <text x="64" y="154" class="txt">5月说“预算 50万”，10月说“预算改 80万”——向量余弦相似度一模一样！</text>
  <text x="64" y="174" class="txt">两句同时被召回塞进 Prompt，大模型瞬间精神分裂（时序事实准确率仅 54.5% ✕）</text>
  <text x="48" y="200" class="txt good">• 三级双时序记忆 (6轮滑窗 + 异步 8B 事实蒸馏 + Zep/Mem0 时序边失效 🏆):</text>
  <text x="64" y="222" class="txt good">- 旁路异步写入: 会话返回后由后台 8B 模型提取状态变更，主链路 0ms 阻塞！</text>
  <text x="64" y="244" class="txt good">- 双时序边更新 (valid_at / invalid_at): 自动将“50万”标为过期，只注入当前有效事实</text>
  <text x="64" y="266" class="txt good">- 单轮仅注入 1,850 词 (-98.6%)，时序准确率跃升至 94.8%，仅需 4 张 H200 🏆</text>

  <!-- Right: 4-Tier Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 四种长周期智能体记忆架构实测对比 (10万活跃用户 · 50 RPS)</text>
  <text x="578" y="134" class="txt bad">• Tier 1 128K 全历史重放: 单轮 12.8万词，准确率 62.0%，需 80 张 H200 ✕</text>
  <text x="578" y="158" class="txt warn">• Tier 2 递归滚动摘要: 单轮 3,200 词，但多轮压缩丢失细节，准确率 68.5% ✕</text>
  <text x="578" y="182" class="txt">• Tier 3 纯向量 Top-10 聊天检索: 新旧事实冲突，时序准确率仅 54.5% ✕ (8张卡)</text>
  <text x="578" y="208" class="txt good">• Tier 4 三级双时序图记忆 (6轮滑窗 + Mem0/Zep 时序图 🏆):</text>
  <text x="594" y="232" class="txt good">- 跨月状态与偏好准确率: 94.8% (+40.3 pts 🏆) | 单轮词数: 1,850 Token (-98.6%)</text>
  <text x="594" y="256" class="txt good">- P95 TTFT: 195 ms (快 17.7x) | 仅需 4 张 H200 (-95.0%，月省 $21.85万 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 支撑 50 RPS 长周期智能体所需 H200 卡数与跨月时序状态准确率对比</text>

  <text x="48" y="365" class="txt">Tier 1 128K 全历史重放</text>
  <rect x="290" y="352" width="520" height="16" fill="#ef4444" rx="4"/>
  <text x="820" y="365" class="txt bad">80 张 H200 ($23.0万/月 ✕) | 准确率 62.0% | TTFT = 3,450 ms</text>

  <text x="48" y="395" class="txt">Tier 2 递归滚动摘要</text>
  <rect x="290" y="382" width="40" height="16" fill="#f59e0b" rx="4"/>
  <text x="340" y="395" class="txt warn">6 张 H200 ($1.72万/月) | 准确率 68.5% (20轮后数字细节全丢 ✕)</text>

  <text x="48" y="425" class="txt">Tier 3 纯向量 Top-10 聊天检索</text>
  <rect x="290" y="412" width="52" height="16" fill="#3b82f6" rx="4"/>
  <text x="352" y="425" class="txt">8 张 H200 ($2.30万/月) | 时序状态准确率仅 54.5% (新旧事实打架 ✕)</text>

  <text x="48" y="455" class="txt good">Tier 4 Mem0/Zep 双时序图 🏆</text>
  <rect x="290" y="442" width="26" height="16" fill="#10b981" rx="4"/>
  <text x="328" y="455" class="txt good">4 张 H200 (-95.0% 🏆) | 时序准确率 94.8% 🏆 | TTFT = 195 ms 🏆</text>
</svg>
