<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg22" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent22" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg22)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent22)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">企业级 Agent 结构化输出与语法约束解码选型一图流 (Round 22 · 70B · 128k 词表)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">Prompt 重试 (84.5% 合格) vs. 逐 Token 正则扫描 (+18.5ms) vs. Outlines FSM (0.45ms) vs. XGrammar + Jump-Forward (快 1.56x, 省 51.2%)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Constrained Decoding & Jump-Forward Physics -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#6ee7b7" font-size="16" font-weight="800">① 为什么结构化解码不仅能做到 100% 零语法错误，还能比自由生成快 1.56 倍？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 Prompt 软约束重试 &amp; Tier 2 朴素词表扫描的双重陷阱</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• Tier 1 复杂嵌套 JSON 首轮合格率仅 84.5%，失败重试多烧 38% Token (有效 TPOT 13.11ms)</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• Tier 2 每步在 CPU 上遍历 128,256 个 Token 跑正则匹配，每步阻塞 GPU 18.50ms (慢 2.95x!)</text>

  <rect x="44" y="258" width="510" height="84" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="280" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 Outlines 预编译有限状态机 (FSM): O(1) 查表将掩码开销压至 0.45ms</text>
  <text x="58" y="302" fill="#d1fae5" font-size="12">• 将 JSON Schema 预编译为状态转移表，每个状态直接映射到 16KB 合法 Token 位掩码 (Bitmask)</text>
  <text x="58" y="324" fill="#d1fae5" font-size="12">• 采样前将非法 Token Logits 置为 -inf，100.0% 语法合法，有效 TPOT 9.95ms (-24.2% 成本)</text>

  <rect x="44" y="354" width="510" height="96" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="376" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 XGrammar 异步掩码重叠 + Jump-Forward 跳词解码: 反超自由生成 1.56x!</text>
  <text x="58" y="398" fill="#f3e8ff" font-size="12">• 下推自动机 (PDA) 分离上下文无关 Token 缓存，CPU 异步线程 0.04ms 算掩码与 GPU 计算 100% 重叠</text>
  <text x="58" y="418" fill="#f3e8ff" font-size="12">• Jump-Forward 压缩状态机自动拼接唯一确定的 JSON 键名与括号 (跳过 35.8% 结构 Token 自回归!)</text>
  <text x="58" y="438" fill="#6ee7b7" font-size="12" font-weight="700">• 等效 TPOT 从 9.50ms 骤降至 6.10ms (320 Token 工具调用仅需 1.95s，成本砍半 -51.2%)!</text>

  <rect x="44" y="462" width="510" height="82" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="58" y="484" fill="#93c5fd" font-size="13" font-weight="700">🧠 架构师防掉智商红线：Schema 字段顺序 = 大模型思维链 (CoT) 顺序！</text>
  <text x="58" y="506" fill="#cbd5e1" font-size="12">• 严禁把 conclusion/action 放在 JSON 第 1 个字段 (强迫模型未思考先下结论，准确率暴跌 15%+)</text>
  <text x="58" y="526" fill="#cbd5e1" font-size="12">• 必须在 Schema 首字段定义 reasoning_steps，让模型先自由推理再输出枚举/工具参数</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档结构化输出架构定量对比 (70B FP8 · 320-Token JSON 工具调用)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">结构化输出与约束解码档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">首轮合格率 / 掩码</text>
  <text x="950" y="190" fill="#cbd5e1" font-size="12" font-weight="700">等效 TPOT</text>
  <text x="1055" y="190" fill="#cbd5e1" font-size="12" font-weight="700">单次耗时 / 万次成本</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: Prompt 软约束 + 失败重试</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">15.5% 格式报错 · 重试浪费 +38% Token</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">84.5% 合格 ✕</text>
  <text x="828" y="256" fill="#cbd5e1" font-size="11">掩码 0.00 ms</text>
  <text x="950" y="236" fill="#fca5a5" font-size="12" font-weight="700">13.11 ms ✕</text>
  <text x="950" y="256" fill="#cbd5e1" font-size="11">(0.72x 降速)</text>
  <text x="1055" y="236" fill="#fca5a5" font-size="12" font-weight="700">4,195.2 ms</text>
  <text x="1055" y="256" fill="#cbd5e1" font-size="11">$4.30 / 10k</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: 朴素逐 Token 词表正则扫描</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">每步 CPU 遍历 128,256 词 · BS=128 崩至 265ms</text>
  <text x="828" y="312" fill="#6ee7b7" font-size="12" font-weight="700">100.0% 合格</text>
  <text x="828" y="332" fill="#f87171" font-size="11">掩码 +18.50 ms ✕</text>
  <text x="950" y="312" fill="#f87171" font-size="12" font-weight="700">28.00 ms ✕</text>
  <text x="950" y="332" fill="#fca5a5" font-size="11">(0.34x 严重卡死)</text>
  <text x="1055" y="312" fill="#fde047" font-size="12" font-weight="700">8,960.0 ms</text>
  <text x="1055" y="332" fill="#fca5a5" font-size="11">$9.18 (+113.5%)</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: Outlines 预编译 FSM 位掩码</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">O(1) 状态查表 · 同步掩码拷贝</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">100.0% 合格 ✅</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">掩码 +0.45 ms ✅</text>
  <text x="950" y="388" fill="#6ee7b7" font-size="12" font-weight="700">9.95 ms ✅</text>
  <text x="950" y="408" fill="#cbd5e1" font-size="11">(0.95x 接近无损)</text>
  <text x="1055" y="388" fill="#6ee7b7" font-size="12" font-weight="700">3,184.0 ms</text>
  <text x="1055" y="408" fill="#6ee7b7" font-size="11">$3.26 (-24.2%)</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: XGrammar + Jump-Forward</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">异步 CPU/GPU 重叠 + 跳过 35.8% 固定键值 Token</text>
  <text x="828" y="464" fill="#34d399" font-size="12" font-weight="700">100.0% 合格 🏆</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">掩码 0.00 ms 🏆</text>
  <text x="950" y="464" fill="#e9d5ff" font-size="12" font-weight="700">6.10 ms 🏆</text>
  <text x="950" y="484" fill="#34d399" font-size="11" font-weight="700">(快 1.56x!)</text>
  <text x="1055" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">1,952.0 ms</text>
  <text x="1055" y="484" fill="#34d399" font-size="11" font-weight="700">$2.10 (-51.2%)</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 BS=128 高并发拐点：Outlines 同步掩码升至 19.60ms，XGrammar 异步重叠稳守 9.45ms (快 2.07x)!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#10b981"/>
  <text x="44" y="606" fill="#6ee7b7" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for Agent Structured Output &amp; Tool Calling）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fca5a5">严禁靠 Prompt 祈祷 + 报错重试做生产 Agent 工具调用 (Tier 1)</tspan>；<tspan font-weight="700" fill="#d8b4fe">推理引擎默认开启 XGrammar + Jump-Forward (Tier 4)</tspan>。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#93c5fd">JSON Schema 首字段永远放 thought_process / reasoning</tspan>，既享受 100% 语法合规与 1.56x 跳词加速，又保持 100% 推理智商。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/structured_output_constrained_decoding_selection/results.json · tests/test_structured_output_constrained_decoding_selection.py · 7-Card &amp; Sizer</text>
</svg>
