  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级财富管理投研分析（SEC 10-K / 财报电话会）、XBRL 勾稽核验与合规投顾 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">3,500只全球股票 / 2.8万份财报 · 人工Excel搬数 vs. 512切片RAG心算 vs. 128K全文硬塞 vs. XBRL确定性指标库 + 章节树RAG + Python沙箱 + SEC禁推门禁</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">99.4% Acc · 0% Math Err</text>

  <!-- Tier 1 -->
