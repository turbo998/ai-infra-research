  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：深度案头精算，财报季高并发严重滞后</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 512切片向量 RAG + LLM 心算</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">张冠李戴 Q3 与前9月，复合增长率算错</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 切片切丢表头（百万美元 vs 千美元口径混淆）</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 让文本模型心算 CAGR 与自由现金流错误率 31.4%</text>
