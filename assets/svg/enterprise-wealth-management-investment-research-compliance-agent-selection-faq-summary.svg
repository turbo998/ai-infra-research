  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 手工调整 GAAP/Non-GAAP 附注易漏单位换算</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fde68a" font-size="13" font-weight="700">财务指标与比率准确率: 94.2%</text>
  <text x="54" y="334" fill="#fde68a" font-size="13" font-weight="700">数值幻觉/口径错配率: 3.8%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">投研纪要生成耗时: 240.0 分钟 (4小时 ✕)</text>
