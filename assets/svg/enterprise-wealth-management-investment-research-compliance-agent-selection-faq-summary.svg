  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">财务指标与比率准确率: 63.5% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">数值幻觉/口径错配率: 31.4% (致命 ✕)</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">投研纪要生成耗时: 1.8 分钟</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月投研与违规整改成本: $195,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁把纯文本切片RAG直接用于金融投研</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
