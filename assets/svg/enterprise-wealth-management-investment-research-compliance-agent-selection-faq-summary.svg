  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 128K 长窗口硬塞 (无XBRL/沙箱)</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">保留了表头，但跨期附注与心算仍出错</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 整份 10-K 塞入上下文，Lost-in-the-Middle 漏附注</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 无 Python 沙箱验算，仍存在 11.2% 计算偏差</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">财务指标与比率准确率: 81.6%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">数值幻觉/口径错配率: 11.2% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">投研纪要生成耗时: 3.2 分钟</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月投研与Token总成本: $88,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：单篇定性阅读，不满足买方机构定量严苛标准</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad409)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: XBRL+章节树+沙箱+SEC门禁 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">数出XBRL、算归Python、合规守禁推清单</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 财务科目直查 XBRL/SQL，MD&amp;A 与电话会走章节树</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• Python 沙箱校验勾稽 + SEC 禁推名单(Restricted)拦截</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">财务指标与比率准确率: 99.4% 🏆 (+35.9pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">数值幻觉/口径错配率: 0.0% 🏆 (沙箱验算)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">投研纪要生成耗时: 1.4 分钟 🏆 (快171倍)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月投研与系统总成本: $24,000 (-85.5% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：公募/私募投研、券商研究所、私人银行财富投顾</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 金融投研与财富管理架构师铁律（Deterministic XBRL + Code Sandbox + Compliance Wall Pattern）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 严禁让大模型从切片文本里抠数字心算：标准化三表科目必须走 XBRL/SQL 确定性查询，所有同比/环比/ROIC/DCF 公式必须交由隔离 Python 沙箱计算并验证会计恒等式。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 强制前置合规隔离墙（Chinese Wall / Restricted List）与客户风险等级（KYC Suitability）门禁：严禁对投行静默期标的或风险不匹配客户输出买卖建议 · Provenance: synthetic + anonymized_reported</text>
</svg>
