  <text x="672" y="214" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• H200 TP=4 · Tensor Core 满载</text>
  <text x="672" y="234" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 70B GQA-8 FP8: 163.84 KB/tok</text>
