  <text x="916" y="192" fill="#c084fc" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">③ Decode 带宽池 (HBM Bound)</text>
  <text x="916" y="214" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 400G GPUDirect RDMA (47 GB/s)</text>
  <text x="916" y="234" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 逐层异步传输暴露仅 0.95 ms</text>
