  <text x="458" y="254" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Prefix 命中率 72% (-72% 传输)</text>
  <text x="458" y="276" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• Decode KV &gt;85% 立即反压准入</text>

