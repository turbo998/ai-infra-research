  <text x="916" y="276" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• P99 TPOT: 12.8 ms (快 5.34x)</text>

  <!-- Dynamic Rebalancer Strip -->
  <rect x="444" y="314" width="686" height="122" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="462" y="338" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="800">④ 潮汐流量动态 P:D 角色秒级漂移 (Dynamo / K8s Role Rebalancer · 权重驻留免重载 2.4s 切换)</text>
  <text x="462" y="364" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• 09:00–14:00 企业长文 RAG 高峰 (16K In / 512 Out) ➔ 自动切为 3P : 1D (12 Prefill + 4 Decode GPUs)</text>
  <text x="462" y="388" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• 14:00–19:00 多轮 Agent 均衡期 (8K In / 1K Out)  ➔ 自动切为 1P : 1D (8 Prefill + 8 Decode GPUs)</text>
  <text x="462" y="412" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5">• 19:00–02:00 深度推理/代码合成 (2K In / 4K Out)  ➔ 自动切为 1P : 3D (4 Prefill + 12 Decode GPUs)</text>

  <!-- Bottom KPI Bar -->
  <rect x="50" y="470" width="1100" height="114" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="74" y="502" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 核心架构收益对比 (30 QPS · 70B FP8 / 671B MLA · 全天候混合负载)：</text>
  <text x="74" y="532" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• P99 TPOT: 68.4 ms ➔ 12.8 ms (提速 5.34x)   |   • SLA Goodput: 58.2% ➔ 99.5% (+41.3 pts)   |   • KV 死锁丢包率: 8.4% ➔ 0.0%</text>
  <text x="74" y="562" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 总集群卡数: 32x H200 (同池) / 24x H200 (静态 PD) ➔ 16x H200 (动态 PD, 立省 50.0% GPU · 成本从 $0.380 降至 $0.105 / 1M Tokens)</text>
