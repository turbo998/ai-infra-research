  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr623)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">#623 企业级 PD 分离动态配比 (Dynamic P:D Rebalancing)、KV RDMA 反压门禁与四大推理栈选型</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Enterprise PD Disaggregation: Diurnal P:D Role Switching (3P:1D ↔ 1P:3D), 85% KV Backpressure &amp; Dynamo / Mooncake / SGLang / vLLM V1 Sizing</text>

  <!-- Left Column: Colocated vs Static PD Pitfalls -->
  <rect x="50" y="122" width="350" height="330" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <text x="68" y="150" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="16" font-weight="800">❌ 两大生产反模式 (Anti-Patterns)</text>
  <rect x="66" y="166" width="318" height="122" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="78" y="188" fill="#f87171" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">1. 同池混部 (Colocated / Chunked Prefill)</text>
  <text x="78" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 16K 长文 Prefill (AI=2800 FLOPs/B) 霸占算力</text>
  <text x="78" y="230" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 同卡 Decode (AI=32 FLOPs/B) 周期性被挂起</text>
  <text x="78" y="250" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• P99 ITL 恶化至 68.4ms (Chunked 仍 29.6ms)</text>
  <text x="78" y="272" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• 达标 Goodput 仅 58.2% · 被迫堆叠 32 张 H200</text>

  <rect x="66" y="302" width="318" height="134" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="78" y="324" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">2. 静态 1P:1D 配比 + 无反压 PD 分离</text>
  <text x="78" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 白天 RAG (16K:512) Prefill 排队、Decode 闲置 42%</text>
  <text x="78" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 夜间 R1 推理 (2K:4K) Decode 显存打满触发 OOM</text>
  <text x="78" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 缺 85% 反压门禁导致 Prefill 算完 KV 无处投递</text>
  <text x="78" y="408" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• 潮汐错配浪费 33.3% 算力 (需 24 张 H200)</text>

