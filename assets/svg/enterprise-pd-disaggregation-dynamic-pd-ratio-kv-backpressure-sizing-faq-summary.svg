  <text x="458" y="192" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">① KV 感知网关与反压门禁</text>
  <text x="458" y="214" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Block-Hash 前缀树亲和路由</text>
