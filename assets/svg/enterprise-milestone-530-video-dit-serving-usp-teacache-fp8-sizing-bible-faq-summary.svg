<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#530 里程碑：企业视频生成大模型 (`Video DiT · Wan2.1 / HunyuanVideo`) 并行推理与加速圣经</text>
  <text x="30" y="60" class="sub">为什么视频 DiT 跟 LLM 瓶颈完全相反 (95% 3D Attention 算力受限)？xDiT USP + TeaCache + FP8 将 340s 生成压至 11.2s (快 30.4x)</text>

  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 视频生成 DiT 与文本 LLM 的物理瓶颈有何本质区别？</text>
  <text x="48" y="132" class="txt">• 3D 时空 Token 爆炸: 一段 5 秒 720p 视频对应 ~75,000 个 3D Patch Tokens，</text>
  <text x="64" y="150" class="txt bad">50 步双向全注意力去噪 ($O(S^2)$) 100% 算力受限，单卡 BF16 耗时长达 340 秒 ✕</text>
  <text x="48" y="174" class="txt good">• 2026 视频 DiT 三大无损加速引擎 (340s → 11.2s · 快 30.36 倍 🏆):</text>
  <text x="64" y="194" class="txt">① xDiT 统一序列并行 (USP = DeepSpeed Ulysses All-to-All × Ring Attention):</text>
  <text x="76" y="212" class="txt">把 75K 序列切给机内 8 张 NVLink GPU 并行算，耗时从 340s 直降至 46.5s</text>
  <text x="64" y="234" class="txt">② TeaCache / PAB 时间步残差缓存: 相邻去噪步特征变化极小，免算跳过 56% 步数</text>
  <text x="64" y="254" class="txt good">③ SageAttention2 (INT8/FP8 量化注意力): 算力再翻 1.85x，单条成本降至 $0.077 🏆</text>

  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 单台 8×H200 节点运行 14B Video DiT 的三套架构对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (单卡 BF16 独立跑 50 步无缓存): 单条耗时 340.0 秒 (5.7分钟 ✕)</text>
  <text x="594" y="152" class="txt bad">交互式创作完全不可用，单条视频成本高达 $0.293 ✕</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (仅开启 8 卡 USP 序列并行 BF16): 单条压至 46.5 秒 ✓，</text>
  <text x="594" y="198" class="txt warn">但未省总算力 FLOPs，整机每小时仅产出 77.4 条 ($0.320/条)</text>
  <text x="578" y="224" class="txt good">• 方案 3 (8卡 USP + TeaCache 时间步复用 + SageAttention2 FP8 🏆):</text>
  <text x="594" y="246" class="txt good">- 单条生成延迟: 11.2 秒 (提速 30.36 倍！VBench 画质分保持 83.9 无损 🏆)</text>
  <text x="594" y="268" class="txt good">- 整机吞吐跃升至 321.4 条/小时 (3.79x)，单条成本压至 $0.077 (-73.7% 🏆)</text>

  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 生成一条 720p 5 秒商业视频的端到端耗时 (Seconds, 越短越快) 与单条成本对比</text>

  <text x="48" y="378" class="txt">方案 1: 单卡 BF16 50步串行去噪</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">340.0 秒/条 (等待近 6 分钟 ✕) | $0.293/条</text>

  <text x="48" y="418" class="txt">方案 2: 8卡 xDiT USP 序列并行</text>
  <rect x="305" y="404" width="66" height="16" fill="#f59e0b" rx="4"/>
  <text x="381" y="418" class="txt warn">46.5 秒/条 ✓ | 77.4 条/小时/机 | $0.320/条</text>

  <text x="48" y="458" class="txt good">方案 3: USP=8 + TeaCache + FP8 🏆</text>
  <rect x="305" y="444" width="16" height="16" fill="#10b981" rx="4"/>
  <text x="331" y="458" class="txt good">11.2 秒/条 (快 30.36x 🏆) | 321.4 条/小时/机 (3.79x) | 仅 $0.077/条 (-73.7% 🏆)</text>
</svg>
