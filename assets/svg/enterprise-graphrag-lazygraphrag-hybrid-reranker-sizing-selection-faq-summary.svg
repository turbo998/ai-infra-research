<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">#497 企业知识检索选型：GraphRAG / LazyGraphRAG vs. 混合向量+Reranker vs. 128K 全文硬塞</text>
  <text x="30" y="60" class="sub">消除原版全量 GraphRAG “5亿词建库烧 $4,500 + 单次 Map-Reduce 查询慢达 14.2 秒”的算力陷阱，意图分流立省 93.8% GPU</text>

  <!-- Left: Why Full GraphRAG Explodes & How LazyGraphRAG + Hybrid Solves It -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. 为什么原版全量 GraphRAG 建库与查询贵得惊人？如何破局？</text>
  <text x="48" y="134" class="txt bad">• 原版全量 GraphRAG 痛点 (5亿词知识库 = 100万切片):</text>
  <text x="64" y="154" class="txt">每个切片调大模型抽三元组 (~6K词/块) -&gt; 消耗 30 亿 Token，建库一次烧 $4,500 ✕</text>
  <text x="64" y="174" class="txt">Global Search 遍历数百个社区摘要做 Map-Reduce -&gt; 单次查询 14.2s ($0.42/次 ✕)</text>
  <text x="48" y="200" class="txt good">• 破局：意图分流 (85% 混合向量 Reranker + 15% LazyGraphRAG / LightRAG 🏆):</text>
  <text x="64" y="222" class="txt good">- 建库：用 NLP 名词短语共现 + 8B 轻量抽取建图，建库费从 $4,500 压至 $128 (-97.2%)</text>
  <text x="64" y="244" class="txt good">- 查询：85% 精确事实题走 Hybrid+Reranker (420ms)；仅 15% 全局归纳题走子图检索！</text>
  <text x="64" y="266" class="txt good">- 成果：兼顾事实精度 94.8% 与全局跨跳精度 93.2%，仅需 6 张 H200 支撑 50 QPS 🏆</text>

  <!-- Right: 4-Tier Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 四种企业知识检索架构定量横评 (5 亿词库 · 50 QPS 并发)</text>
  <text x="578" y="134" class="txt warn">• Tier 1 128K 全文硬塞 (无索引): 延迟 3,850 ms，千次查询 $185，需 64 张 H200 ✕</text>
  <text x="578" y="158" class="txt bad">• Tier 2 原版全量 GraphRAG: 建库 $4,500，延迟 14,200 ms，需 96 张 H200 ✕</text>
  <text x="578" y="182" class="txt">• Tier 3 纯混合向量 + Reranker: 事实 94.5% ✓，但全局跨跳题仅 58.0% ✕ (4张卡)</text>
  <text x="578" y="208" class="txt good">• Tier 4 意图分流 85% Hybrid + 15% LazyGraphRAG (推荐 🏆):</text>
  <text x="594" y="232" class="txt good">- 事实问答 94.8% + 全局多跳归纳 93.2% (双指标全优 🏆) | 建库仅 $128</text>
  <text x="594" y="256" class="txt good">- P95 延迟: 680 ms (提速 20.9x) | 千次查询 $8.50 | 仅需 6 张 H200 (-93.8% 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 支撑 50 QPS 所需 H200 GPU 卡数与每千次查询成本 ($/1k Queries) 对比</text>

  <text x="48" y="365" class="txt">Tier 1 128K 全文硬塞</text>
  <rect x="290" y="352" width="350" height="16" fill="#f59e0b" rx="4"/>
  <text x="650" y="365" class="txt warn">64 张 H200 | $185.00/千次 | P95 = 3,850 ms | 无法遍历全库 ✕</text>

  <text x="48" y="395" class="txt">Tier 2 原版全量 GraphRAG</text>
  <rect x="290" y="382" width="520" height="16" fill="#ef4444" rx="4"/>
  <text x="820" y="395" class="txt bad">96 张 H200 | $420.00/千次 | 建库 $4,500 | P95 = 14,200 ms ✕</text>

  <text x="48" y="425" class="txt">Tier 3 纯混合向量 + Reranker</text>
  <rect x="290" y="412" width="24" height="16" fill="#3b82f6" rx="4"/>
  <text x="325" y="425" class="txt">4 张 H200 | $4.20/千次 | 420 ms ✓ | 但全局跨跳总结仅 58.0% ✕</text>

  <text x="48" y="455" class="txt good">Tier 4 意图分流 LazyGraphRAG 🏆</text>
  <rect x="290" y="442" width="34" height="16" fill="#10b981" rx="4"/>
  <text x="335" y="455" class="txt good">6 张 H200 (-93.8% 🏆) | $8.50/千次 | 680 ms | 事实 94.8% &amp; 全局 93.2% 🏆</text>
</svg>
