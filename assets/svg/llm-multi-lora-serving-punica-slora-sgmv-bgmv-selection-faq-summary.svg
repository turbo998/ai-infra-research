  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">Multi-LoRA Serving (32 Adapters): Python Loop (42.0ms) vs `SGMV/BGMV + Unified Pool` (6.4ms)</text>
