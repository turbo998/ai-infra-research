  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Computes shared `70B` base $Y_0 = X W_0$ ONCE for all 64 reqs (`5.5 ms`)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Fuses all `32` heterogeneous-rank ($r=8..64$) adapters into a single</text>
