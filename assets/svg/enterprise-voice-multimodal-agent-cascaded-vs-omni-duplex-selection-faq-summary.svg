<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg376" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc376" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg376)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="445" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="274" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 376 · ENTERPRISE VOICE AI AGENT: CASCADED vs. OMNI vs. DUPLEX</text>
  <text x="512" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="23.5" font-weight="800">企业级智能语音客服（Voice AI）架构选型：整句串行 vs. 纯原生 Omni 语音 vs. 流式级联 vs. 混合双工</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">1,000 坐席呼叫中心 (月通话 250万分钟)：为什么纯端到端 Omni 语音模型月烧 $48万且难控合规话术，而“流式文本门控级联 + 情绪标签 + 语义打断”达 385ms 且省 $40.25万/月？</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc376)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="236" height="24" rx="6" fill="#7f1d1d"/>
  <text x="186" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 传统整句阻塞三段式级联</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">2.92 秒死寂 · 打断全失灵</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">800ms静音VAD-&gt;整句ASR-&gt;整段LLM-&gt;整段TTS</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么传统级联像对讲机？</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">傻等 800ms 静音 + 等大模型把整段话写完</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">才开始合成语音，客户以为掉线挂断 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首音延迟 P99 TTFA: <tspan fill="#f87171" font-weight="700">2,920.0 ms ✕</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 合规话术受控度: <tspan fill="#34d399" font-weight="700">100.0% (有文本层)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 自然打断准确率: <tspan fill="#f87171" font-weight="700">42.0% (噪声误触发 ✕)</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度成本 (250万分): <tspan fill="#f87171" font-weight="700">$120,000 ($0.048/分)</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁在电话客服中等整段话生成完再播音</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="236" height="24" rx="6" fill="#78350f"/>
  <text x="486" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 纯原生端到端 Omni 语音 API</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">月烧 $48万 · 无文本护栏门控</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">100% 走 Speech-to-Speech 音频 Token 流</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么金融/航空客服不敢全上纯 Omni？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">音频 Token 单价高达 $0.19/分 (贵 7.4倍)，</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">且跳过文本层导致无法在发音前拦截违规词 ✕</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首音延迟 P99 TTFA: <tspan fill="#34d399" font-weight="700">340.0 ms (反应极快)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 合规话术受控度: <tspan fill="#f87171" font-weight="700">88.5% (难强制一字不差 ✕)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 自然打断准确率: <tspan fill="#34d399" font-weight="700">94.0%</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度成本 (250万分): <tspan fill="#f87171" font-weight="700">$480,000 ($0.192/分 ✕)</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 仅适合消费级情感陪聊，大规模客服太贵</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="236" height="24" rx="6" fill="#0c4a6e"/>
  <text x="786" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · 流式分块级联 + 语义断句 EOU</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">520ms 发声 · 成本仅 $0.026/分</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">语义断句(150ms) + 首子句 6词即刻流式 TTS</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (比 Omni 省 86.5%)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">小模型判断话已说完 (150ms)，LLM 刚吐出</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">前 6 个字经文本护栏检验即送 WebSocket TTS ✅</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首音延迟 P99 TTFA: <tspan fill="#38bdf8" font-weight="800">520.0 ms (快 5.62x ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 合规话术受控度: <tspan fill="#38bdf8" font-weight="800">100.0% (发声前文本强审 ✅)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 自然打断准确率: <tspan fill="#38bdf8" font-weight="800">91.5% ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度成本 (250万分): <tspan fill="#38bdf8" font-weight="800">$65,000 ($0.026/分 ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 企业智能呼叫中心高性价比主力底座</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 混合双工 + 情绪标签 + 投机预取</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">385ms 拟人发声 · 月省 $40.25万</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">投机RAG + 文本门控 + 声学情绪标 + 语义打断</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">兼得 Omni 灵动与级联合规：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">ASR 附带 `[angry]` 情绪标喂给文本 LLM；</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">语义区分“嗯嗯(附和)”与真打断 (97.2%) 🏆</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首音延迟 P99 TTFA: <tspan fill="#34d399" font-weight="800">385.0 ms (快 7.58x 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 合规话术受控度: <tspan fill="#34d399" font-weight="800">100.0% (发声前 100% 过审 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 自然打断准确率: <tspan fill="#34d399" font-weight="800">97.2% (零附和误打断 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度成本 (250万分): <tspan fill="#34d399" font-weight="800">$77,500 ($0.031/分 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 银行/保险/航司万路智能外呼与客服终局</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么企业呼叫中心不能无脑全切“纯端到端语音大模型”，必须用“混合双工文本门控级联”？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🛡️ 铁律 1：“发声前文本门控 (Text-Before-Audio Gate)”是金融医疗红线</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 银行理财与保险理赔要求法定免责声明 **一字不差**，且绝对禁止读出未脱敏卡号；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 纯 Speech-to-Speech 直接吐音频帧，无法在声音进听筒前做精准正则/护栏替换；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 采用 **流式级联 + 声学情绪标**：既保留文本门控 100% 受控，又比纯 Omni 省钱 **83.9%**！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🎙️ 铁律 2：用“语义断句 (Semantic EOU) + 真假打断分类”消灭机器感</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 废除死板的 `800ms 静音计时器`！改用轻量语义断句模型：一旦检测到语法完整（如“请问</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  年费是多少？”）在 `150ms` 内立即触发生成；遇到“我的卡号是 6228...”停顿自动延长等待；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 区分客户随口附和（“嗯、好的”不打断）与真打断（“不对，我是说上个月”立即清空音频缓冲）🏆！</text>
</svg>
