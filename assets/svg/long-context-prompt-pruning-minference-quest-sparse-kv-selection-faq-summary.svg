<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad81" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad81" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad81)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad81)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22.5" font-weight="800">🔍 超长上下文词元剪枝 (LLMLingua-2)、预填充稀疏 (MInference) 与动态 KV 检索 (Quest) 选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">8×H100 SXM5 ($24/hr) · 70B TP=8 · 128K 上下文 × 5 轮跨章节连续追问 (Multi-Turn Needle Recall) · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#500724" stroke="#ec4899" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#fbcfe8" font-size="13" font-weight="700" text-anchor="middle">Round 81 · MInference &amp; Quest</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 全量 128K 稠密推理</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">128K×128K 全算 Prefill + 每词读 41.9GB KV</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 128K 首词延迟 TTFT: <tspan fill="#f87171" font-weight="700">14.80 秒 (O(N²) 算力墙 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 生成步延迟 TPOT: <tspan fill="#f87171" font-weight="700">46.5 ms (HBM 带宽墙 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 5 轮追问大海捞针召回: <tspan fill="#34d399" font-weight="700">99.2% (全量基准)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单节点每小时会话吞吐: <tspan fill="#f87171" font-weight="700">68.0 sessions/hr ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 千次会话成本 / 年账单: <tspan fill="#f87171" font-weight="700">$352.94 · $1.76M/yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 128K 稠密推理的两堵物理高墙：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① Prefill 要算 163 亿个注意力对，卡死 14.8 秒；</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">② Decode 每吐 1 个词都要把 41.9GB KV 从 HBM</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">全读一遍，实际上 96% 的 KV 权重几乎为 0！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 输入端硬删词 (LLMLingua-2)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">进模型前用小模型删掉 75% 词 (128K→32K)</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 128K 首词延迟 TTFT: <tspan fill="#fbbf24" font-weight="700">2.15 秒</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 生成步延迟 TPOT: <tspan fill="#fbbf24" font-weight="700">14.8 ms</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 5 轮追问大海捞针召回: <tspan fill="#f87171" font-weight="700">71.4% (暴跌 -27.8pt ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单节点每小时会话吞吐: <tspan fill="#fbbf24" font-weight="700">295.0 sessions/hr</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 千次会话成本: <tspan fill="#fbbf24" font-weight="700">$81.36 / 1k</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 为什么输入端删词不适合代码/财报？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 删掉变量名、括号或表格小数点直接破坏语法；</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">② 每次按问题改写原文还会彻底破坏 Prefix</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">Cache 哈希命中，导致多轮对话被迫反复重算！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#4c1d95"/>
    <text x="16" y="27" fill="#e9d5ff" font-size="14" font-weight="800">🟪 Tier 3: 永久性 KV 驱逐 (H2O/SnapKV)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">按第 1 问注意力永久删掉 85% KV 块</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 128K 首词延迟 TTFT: <tspan fill="#f87171" font-weight="700">14.80 秒 (未加速 Prefill ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 生成步延迟 TPOT: <tspan fill="#c084fc" font-weight="700">11.6 ms (Decode 变快)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 5 轮追问大海捞针召回: <tspan fill="#f87171" font-weight="700">64.8% (换话题即失忆 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单节点每小时会话吞吐: <tspan fill="#c084fc" font-weight="700">142.0 sessions/hr</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 千次会话成本: <tspan fill="#c084fc" font-weight="700">$169.01 / 1k</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#4c1d95"/>
    <text x="26" y="220" fill="#d8b4fe" font-size="11.5" font-weight="700">⛔ 永久性 KV 驱逐的“多轮追问失忆症”：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">第 1 轮用户问“第 3 章营收”，H2O 把第 8 章违约</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">金的 KV 当成低分垃圾永久释放了！结果第 2 轮</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">用户追问“第 8 章违约金是多少”时直接答不出！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: MInference + Quest 动态检索 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">垂直-斜线稀疏 Prefill + 页面包络非破坏选 Top-4K</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 128K 首词延迟 TTFT: <tspan fill="#34d399" font-weight="700">1.82 秒 (快 8.13x 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 生成步延迟 TPOT: <tspan fill="#34d399" font-weight="700">9.8 ms (快 4.74x 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 5 轮追问大海捞针召回: <tspan fill="#34d399" font-weight="700">98.9% (+34.1pt 无损 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单节点每小时会话吞吐: <tspan fill="#34d399" font-weight="700">485.0/hr (提升 7.13x 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 年净省算力: <tspan fill="#34d399" font-weight="700">$49.48/1k · 年省 $1.52M 🏆</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 “存算分离”非破坏性稀疏黄金组合：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① Prefill 用 MInference 跳过 88% 空块但生成</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">完整 128K KV；② Decode 用 Quest 查 [K_min,K_max]</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">包络框，每步按当前 Query 动态挑 4K 块精算！</text>
  </g>

  <!-- Bottom Left: Context Scaling Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📈 上下文从 32K 扩至 256K 时的 Prefill TTFT (秒) 与多轮召回率对比</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">对比全量稠密推理 (Tier 1)、永久驱逐 (Tier 3) 与 MInference + Quest (Tier 4)</text>

    <!-- 32K -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">32K 上下文 (代码库问答)</text>
    <rect x="210" y="74" width="25" height="14" rx="3" fill="#10b981"/>
    <text x="243" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">0.42s · 召回 99.4% 🏆</text>
    <rect x="210" y="92" width="75" height="14" rx="3" fill="#64748b"/>
    <text x="293" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">1.45s (Tier 1 稠密)</text>

    <!-- 64K -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">64K 上下文 (10-K 财报审计)</text>
    <rect x="210" y="124" width="38" height="14" rx="3" fill="#10b981"/>
    <text x="256" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">0.85s (快 5.18x · 召回 99.1% 🏆)</text>
    <rect x="210" y="142" width="135" height="14" rx="3" fill="#f59e0b"/>
    <text x="353" y="154" fill="#fde68a" font-size="11.5" font-weight="700">4.40s (Tier 1)</text>

    <!-- 128K -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">128K 上下文 (5 轮合同追问)</text>
    <rect x="210" y="174" width="55" height="14" rx="3" fill="#10b981"/>
    <text x="273" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">1.82s (快 8.13x · 召回 98.9% 🏆)</text>
    <rect x="210" y="192" width="220" height="14" rx="3" fill="#ef4444"/>
    <text x="438" y="204" fill="#f87171" font-size="11.5" font-weight="700">14.80s (Tier 3 仅 64.8% 召回 ✕)</text>

    <!-- 256K -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">256K 上下文 (整仓代码推理)</text>
    <rect x="210" y="224" width="82" height="14" rx="3" fill="#10b981"/>
    <text x="300" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">4.95s (快 10.95x · 召回 98.4% 🏆)</text>
    <rect x="210" y="242" width="305" height="14" rx="3" fill="#ef4444"/>
    <text x="522" y="254" fill="#f87171" font-size="11.5" font-weight="700">54.2s ✕</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#fbcfe8" font-size="11.5" font-weight="700">💡 核心区别：永久驱逐 (H2O) 是“真删掉 KV”，而动态选择 (Quest) 是“全存着但每步只挑 4K 来读”！</text>
  </g>

  <!-- Bottom Right: 3 Rules for Long Context -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 超长上下文稀疏加速 (MInference + Quest) 架构设计三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：Prefill 阶段采用 `MInference 垂直-斜线 (Vertical-Slash)` 稀疏核</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 注意力头在 128K 下天然分化为 A-Shape、Vertical-Slash（垂直锚点+斜线滑窗）与 Block-Sparse；</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">• 用最后 64 个 Query 快速探测出活跃垂直列与斜线索引，跳过 88% 零值块，TTFT 提速 8.13 倍！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：多轮会话严禁永久删除 KV，必须用 `Quest 页面包络框` 非破坏性检索</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 为每个 16-Token Paged KV 块维护 1 个极小包络向量 `[K_min, K_max]`（仅占 6% 显存开销）；</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">• 每个 Decode 步用当前 Query `q_t` 与包络框做上界打分，只把得分最高的 256 个页 (4K 词) 读入 SM！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fbcfe8" font-size="13" font-weight="800">3️⃣ 铁律三：冷门 KV 页卸载至 Host DRAM，包络元数据常驻 GPU HBM</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 当单机并发跑数十个 128K 会话时，只需将轻量级 `[K_min, K_max]` 包络索引与热点页留在 HBM，</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  其余完整 KV 页暂存 Host DRAM / CXL，新轮次换话题时按包络打分毫秒级按需换入！</text>
  </g>
</svg>
