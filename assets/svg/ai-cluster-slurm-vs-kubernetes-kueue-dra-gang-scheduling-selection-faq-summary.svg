<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad77" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad77" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad77)" rx="16"/>
  <rect x="24" y="20" width="1232" height="86" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="54" fill="url(#accentGrad77)" font-size="22" font-weight="800">Round 77 · AI 智算集群调度器与拓扑编排 (Slurm vs K8s Kueue TAS + DRA + Sunk) 选型一图流</text>
  <text x="44" y="84" fill="#94A3B8" font-size="14">1,024×H100/H200 训推混合集群 (128节点 × 8卡 + 8×400G 网卡) · Kueue TAS 拓扑装箱 + K8s DRA 原子绑定 + Sunk (independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <g transform="translate(24, 124)">
    <!-- Tier 1 -->
    <rect x="0" y="0" width="296" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FCA5A5" font-size="15" font-weight="700">Tier 1 · 原生 K8s 默认调度器 ✕</text>
    <text x="16" y="56" fill="#CBD5E1" font-size="12.5">逐 Pod 绑定无 Gang + 拓扑盲视乱洒</text>
    <line x1="16" y1="70" x2="280" y2="70" stroke="#334155"/>
    <text x="16" y="98" fill="#94A3B8" font-size="12">成组死锁浪费率：</text>
    <text x="165" y="98" fill="#EF4444" font-size="15" font-weight="800">18.5% (半截死等 ✕)</text>
    <text x="16" y="128" fill="#94A3B8" font-size="12">GPU-网卡对齐率：</text>
    <text x="165" y="128" fill="#FCA5A5" font-size="14" font-weight="700">32.0% (跨NUMA ✕)</text>
    <text x="16" y="158" fill="#94A3B8" font-size="12">分布式训练 MFU：</text>
    <text x="165" y="158" fill="#EF4444" font-size="15" font-weight="800">36.4% ✕</text>
    <text x="16" y="188" fill="#94A3B8" font-size="12">24×7 综合利用率：</text>
    <text x="165" y="188" fill="#FCA5A5" font-size="14" font-weight="700">68.2% ✕</text>
    <text x="16" y="218" fill="#94A3B8" font-size="12">年化搁浅算力损失：</text>
    <text x="165" y="218" fill="#EF4444" font-size="14" font-weight="800">$4,280,000 / yr ✕</text>
    <rect x="16" y="244" width="264" height="48" rx="8" fill="#2D1622"/>
    <text x="26" y="264" fill="#FDA4AF" font-size="11.5" font-weight="600">痛点：两个 512 卡任务各抢 256 卡永久死锁，</text>
    <text x="26" y="282" fill="#FDA4AF" font-size="11.5">且跨机柜打散导致通信与 MFU 双崩盘！</text>

    <!-- Tier 2 -->
    <rect x="312" y="0" width="296" height="310" rx="12" fill="#1E2230" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="328" y="32" fill="#FCD34D" font-size="15" font-weight="700">Tier 2 · Slurm + K8s 物理双孤岛 ✕</text>
    <text x="328" y="56" fill="#CBD5E1" font-size="12.5">512卡裸机 Slurm + 512卡独立 K8s</text>
    <line x1="328" y1="70" x2="592" y2="70" stroke="#334155"/>
    <text x="328" y="98" fill="#94A3B8" font-size="12">成组死锁浪费率：</text>
    <text x="477" y="98" fill="#FCD34D" font-size="14" font-weight="700">0.0%</text>
    <text x="328" y="128" fill="#94A3B8" font-size="12">GPU-网卡对齐率：</text>
    <text x="477" y="128" fill="#FCD34D" font-size="14" font-weight="700">96.0% (GRES)</text>
    <text x="328" y="158" fill="#94A3B8" font-size="12">分布式训练 MFU：</text>
    <text x="477" y="158" fill="#34D399" font-size="14" font-weight="700">57.5% ✅</text>
    <text x="328" y="188" fill="#94A3B8" font-size="12">24×7 综合利用率：</text>
    <text x="477" y="188" fill="#EF4444" font-size="15" font-weight="800">73.8% (孤岛搁浅 ✕)</text>
    <text x="328" y="218" fill="#94A3B8" font-size="12">年化搁浅算力损失：</text>
    <text x="477" y="218" fill="#EF4444" font-size="14" font-weight="800">$3,520,000 / yr ✕</text>
    <rect x="328" y="244" width="264" height="48" rx="8" fill="#2E2418"/>
    <text x="338" y="264" fill="#FDE68A" font-size="11.5" font-weight="600">痛点：半夜 K8s 推理闲置 300 张卡，隔壁</text>
    <text x="338" y="282" fill="#FDE68A" font-size="11.5">Slurm 排队满负荷却无法跨集群借用 1 张卡！</text>

    <!-- Tier 3 -->
    <rect x="624" y="0" width="296" height="310" rx="12" fill="#132A3E" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="640" y="32" fill="#7DD3FC" font-size="15" font-weight="700">Tier 3 · K8s + Kueue + 传统插件 ⚠️</text>
    <text x="640" y="56" fill="#CBD5E1" font-size="12.5">PodGroup 成组准入 + 整数 Device Plugin</text>
    <line x1="640" y1="70" x2="904" y2="70" stroke="#334155"/>
    <text x="640" y="98" fill="#94A3B8" font-size="12">成组死锁浪费率：</text>
    <text x="789" y="98" fill="#38BDF8" font-size="14" font-weight="700">0.0% ✅</text>
    <text x="640" y="128" fill="#94A3B8" font-size="12">GPU-网卡对齐率：</text>
    <text x="789" y="128" fill="#FBBF24" font-size="15" font-weight="800">58.0% (42%错配 ✕)</text>
    <text x="640" y="158" fill="#94A3B8" font-size="12">分布式训练 MFU：</text>
    <text x="789" y="158" fill="#7DD3FC" font-size="14" font-weight="700">51.2%</text>
    <text x="640" y="188" fill="#94A3B8" font-size="12">24×7 综合利用率：</text>
    <text x="789" y="188" fill="#38BDF8" font-size="15" font-weight="800">86.5% ✅</text>
    <text x="640" y="218" fill="#94A3B8" font-size="12">年化搁浅算力损失：</text>
    <text x="789" y="218" fill="#7DD3FC" font-size="14" font-weight="700">$1,810,000 / yr</text>
    <rect x="640" y="244" width="264" height="48" rx="8" fill="#0C2238"/>
    <text x="650" y="264" fill="#BAE6FD" font-size="11.5" font-weight="600">局限：GPU 插件与网卡插件各自盲盒抓阄，</text>
    <text x="650" y="282" fill="#BAE6FD" font-size="11.5">子卡任务跨 CPU UPI 总线绕行损失带宽。</text>

    <!-- Tier 4 -->
    <rect x="936" y="0" width="296" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.2"/>
    <text x="952" y="32" fill="#6EE7B7" font-size="15" font-weight="800">Tier 4 · Kueue TAS + DRA + Sunk 🏆</text>
    <text x="952" y="56" fill="#D1FAE5" font-size="12.5">拓扑装箱 + 同PCIe原子绑定 + 原生sbatch</text>
    <line x1="952" y1="70" x2="1216" y2="70" stroke="#334155"/>
    <text x="952" y="98" fill="#A7F3D0" font-size="12">成组死锁浪费率：</text>
    <text x="1101" y="98" fill="#34D399" font-size="15" font-weight="800">0.0% 🏆</text>
    <text x="952" y="128" fill="#A7F3D0" font-size="12">GPU-网卡对齐率：</text>
    <text x="1101" y="128" fill="#34D399" font-size="15" font-weight="800">100.0% (DRA绑定 🏆)</text>
    <text x="952" y="158" fill="#A7F3D0" font-size="12">分布式训练 MFU：</text>
    <text x="1101" y="158" fill="#34D399" font-size="15" font-weight="800">57.8% (媲美裸机 🏆)</text>
    <text x="952" y="188" fill="#A7F3D0" font-size="12">24×7 综合利用率：</text>
    <text x="1101" y="188" fill="#34D399" font-size="15" font-weight="800">94.6% (+20.8pt 🏆)</text>
    <text x="952" y="218" fill="#A7F3D0" font-size="12">年化搁浅算力损失：</text>
    <text x="1101" y="218" fill="#6EE7B7" font-size="13.5" font-weight="800">$725k (省 $2.795M 🏆)</text>
    <rect x="952" y="244" width="264" height="48" rx="8" fill="#062019"/>
    <text x="962" y="264" fill="#A7F3D0" font-size="11.5" font-weight="700">终极形态：1套底座兼容 sbatch 与 K8s HPA</text>
    <text x="962" y="282" fill="#A7F3D0" font-size="11.5">+ 夜间潮汐借卡 + DRA 100% 硬件拓扑对齐</text>
  </g>

  <!-- Bottom Visual Comparison -->
  <rect x="24" y="454" width="1232" height="302" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="486" fill="#F8FAFC" font-size="16" font-weight="700">核心定量洞察：1,024 卡集群 24×7 综合利用率与训练 MFU 对比 &amp; K8s DRA + Kueue TAS + Sunk 协同原理</text>

  <!-- Left Bar Chart -->
  <g transform="translate(44, 508)">
    <text x="0" y="20" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 1 原生 K8s 默认调度器 (68.2% 利用率 · 18.5% 死锁 · MFU 36.4% · 年损 $4.28M ✕)</text>
    <rect x="0" y="28" width="389" height="22" rx="4" fill="#EF4444"/>

    <text x="0" y="76" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 2 物理拆成 Slurm + K8s 双孤岛 (73.8% 利用率 · 夜间推理卡无法外借 · 年损 $3.52M ✕)</text>
    <rect x="0" y="84" width="421" height="22" rx="4" fill="#F59E0B"/>

    <text x="0" y="132" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 3 统一 K8s + Kueue + 传统插件 (86.5% 利用率 · 42% 子卡跨 PCIe 错配 · MFU 51.2% ⚠️)</text>
    <rect x="0" y="140" width="493" height="22" rx="4" fill="#38BDF8"/>

    <text x="0" y="188" fill="#6EE7B7" font-size="12.5" font-weight="700">Tier 4 统一 K8s + Kueue TAS + K8s DRA + Sunk (94.6% 利用率 · 57.8% MFU · 年省 $2.795M 🏆)</text>
    <rect x="0" y="196" width="540" height="22" rx="4" fill="#10B981"/>
  </g>

  <!-- Right Architecture Box -->
  <g transform="translate(650, 504)">
    <rect x="0" y="0" width="584" height="232" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="18" y="28" fill="#38BDF8" font-size="14" font-weight="700">第一性原理：三大组件终结“Slurm vs K8s”长达十年的路线之争</text>
    <text x="18" y="56" fill="#E2E8F0" font-size="12.5">① 机内原子绑定：Kubernetes DRA (Dynamic Resource Allocation)：</text>
    <text x="32" y="76" fill="#94A3B8" font-size="12">废弃盲盒整数计数，用结构化 ResourceClaim 原子级同时分配同一颗 PCIe Switch 下</text>
    <text x="32" y="94" fill="#94A3B8" font-size="12">的 GPU i + mlx5_i 网卡，GPUDirect RDMA 100% 满血直通！</text>
    <text x="18" y="124" fill="#6EE7B7" font-size="12.5">② 机间拓扑与潮汐：Kueue TAS + Cohort 空闲借用：</text>
    <text x="32" y="144" fill="#94A3B8" font-size="12">按 Block-&gt;Rack-&gt;Node 紧凑装箱多机训练作业，夜间自动借用 100% 闲置在线推理卡。</text>
    <text x="18" y="174" fill="#FCD34D" font-size="12.5">③ 双栖交互体验：Sunk (Slurm-on-Kubernetes 容器化桥接)：</text>
    <text x="32" y="194" fill="#94A3B8" font-size="12">研究员照常敲 sbatch/srun，底层自动转为 K8s Pod，一套物理集群通吃训推！</text>
  </g>
</svg>
