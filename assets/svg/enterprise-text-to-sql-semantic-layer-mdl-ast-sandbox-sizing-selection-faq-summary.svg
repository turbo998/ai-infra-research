<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">#499 企业对话式 BI 与 Text-to-SQL 架构：语义指标层 (MDL) + 外键子图召回 + AST 安全闸门</text>
  <text x="30" y="60" class="sub">解决“500 张裸表 DDL (9.5万词) 硬塞导致业务口径错乱 (38.5%) 与笛卡尔积打崩数仓 ($4.2万/月)”的痛点</text>

  <!-- Left: 3-Layer Conversational BI Architecture -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. 为什么直接让大模型写物理裸表 SQL 必败？三层破局架构</text>
  <text x="48" y="134" class="txt">• Layer 1 语义指标层 (Semantic Metric Layer / MDL - Fabric IQ / dbt / Cube):</text>
  <text x="64" y="154" class="txt">屏蔽底层 500 张脏物理表，统一暴露“净留存率 Net_ARR”等受控指标与预验证 Join</text>
  <text x="48" y="178" class="txt">• Layer 2 外键连通子图召回 (FK-Subgraph Schema Linking):</text>
  <text x="64" y="198" class="txt">从 500 张表精准切出连通的 Top-12 实体子图，Prompt 从 95,000 词压至 2,400 词！</text>
  <text x="48" y="222" class="txt good">• Layer 3 sqlglot AST 语法改写 + EXPLAIN 成本熔断器 (&lt; 5ms):</text>
  <text x="64" y="244" class="txt good">强制注入租户行级权限 (WHERE tenant_id=...) + 拦截全表扫描 (&gt;50GB 直接拒止)，</text>
  <text x="64" y="266" class="txt good">把数仓误扫账单从 $42,000/月清零为 $0，准确率跃升至 95.4% 🏆</text>

  <!-- Right: 4-Tier Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 四种企业 Text-to-SQL 架构实测对比 (500 张表数仓 · 30 QPS)</text>
  <text x="578" y="134" class="txt bad">• Tier 1 500张裸表 DDL 硬塞 (95K词): 准确率仅 38.5%，需 48 张 H200 ✕</text>
  <text x="578" y="158" class="txt warn">• Tier 2 纯向量召回 Top-15 裸表 (无MDL): 准确率 64.2% (Join 断裂 ✕)，12张卡</text>
  <text x="578" y="182" class="txt">• Tier 3 多轮数仓报错重试 Agent (5次重试): 准确率 86.5%，延迟 5,400ms ✕</text>
  <text x="578" y="208" class="txt good">• Tier 4 语义层 MDL + 外键子图 + AST/EXPLAIN 闸门 + 32B/14B 专模 🏆:</text>
  <text x="594" y="232" class="txt good">- 业务 SQL 口径准确率: 95.4% (+56.9 pts 🏆) | 单次提示词: 2,400 Token (-97.5%)</text>
  <text x="594" y="256" class="txt good">- P95 延迟: 620 ms (快 11.0x) | 数仓误扫费 $0 | 仅需 4 张 H200 (-91.7% 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 支撑 30 QPS 对话式 BI 所需 H200 GPU 卡数与业务 SQL 准确率对比</text>

  <text x="48" y="365" class="txt">Tier 1 500张裸表 DDL 硬塞</text>
  <rect x="290" y="352" width="520" height="16" fill="#ef4444" rx="4"/>
  <text x="820" y="365" class="txt bad">48 张 H200 | 准确率仅 38.5% ✕ | 6,800 ms | 误扫数仓 $42k/月</text>

  <text x="48" y="395" class="txt">Tier 2 向量 Top-15 裸表 (无MDL)</text>
  <rect x="290" y="382" width="130" height="16" fill="#f59e0b" rx="4"/>
  <text x="430" y="395" class="txt warn">12 张 H200 | 准确率 64.2% (口径漂移 ✕) | 1,850 ms</text>

  <text x="48" y="425" class="txt">Tier 3 多轮数仓报错重试 Agent</text>
  <rect x="290" y="412" width="216" height="16" fill="#3b82f6" rx="4"/>
  <text x="516" y="425" class="txt">20 张 H200 | 准确率 86.5% | 延迟高达 5,400 ms (压垮数仓并发 ✕)</text>

  <text x="48" y="455" class="txt good">Tier 4 MDL 语义层 + AST 闸门 🏆</text>
  <rect x="290" y="442" width="44" height="16" fill="#10b981" rx="4"/>
  <text x="345" y="455" class="txt good">4 张 H200 (-91.7% 🏆) | 准确率 95.4% 🏆 | 620 ms | 误扫费 $0 🏆</text>
</svg>
