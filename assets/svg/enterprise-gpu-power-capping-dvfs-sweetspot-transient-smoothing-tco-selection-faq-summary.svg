<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业智算中心功耗封顶 (Power Capping &amp; DVFS 甜点) 与电源瞬态尖峰消峰选型 (#492)</text>
  <text x="28" y="58" class="sub">为什么把 Decode 节点从 700W 锁频到 500W 省电 28.6%，吐字速度却只掉 1.2%？在同一 1.5MW 机房多塞进 25% 显卡 (1,280 vs 1,024)！</text>

  <!-- Left Panel: The Cubic V-f Law & HBM-Bound Decode Independence -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么芯片最后 7% 的极限加速频率，要烧掉额外 28% 的电费与散热配额？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ CMOS 三次方功耗定律 (P ~ C * V^2 * f ~ f^3) 的边际收益崩塌</text>
  <text x="56" y="164" class="mono">• 为把 SM 主频从 1,650 MHz 推高到 1,980 MHz (+20%)，必须同步拉高核心电压 V，</text>
  <text x="56" y="184" class="mono">  导致功耗从 500W 暴增至 700W (+40%)，结温升高 12°C、故障率翻倍！</text>
  <text x="56" y="202" class="mono">• 更关键的是：Decode 阶段瓶颈在 HBM 显存带宽 (固定频率)，SM 跑再快也在等显存！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师解法：PD 分角色差异化功耗封顶 (P池 650W + D池 500W 🏆)</text>
  <text x="56" y="268" class="mono">• 1) Decode 节点锁 `nvidia-smi -pl 500`：HBM3e 带宽 100% 满速，TPOT 仅差 1.2%！</text>
  <text x="56" y="288" class="mono">• 2) 在 1.5 MW 固定机房电表配额下，可上架 GPU 从 1,024 张增加至 1,280 张</text>
  <text x="56" y="308" class="mono">     (+25% 算力容量)，整座机房总 Token 产出净增 +23.5%！</text>

  <!-- Right Panel: 4 Power Capping Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种 GPU 功耗封顶策略定量对标 (1.5 MW 机房电力配额上限)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 全集群 700W 满血硬跑 (不设上限，高温高故障)</text>
  <text x="638" y="158" class="mono">• Prefill保留: 100% | Decode保留: 100% | 能效比: 1.00x | 可装卡: 1,024卡</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 一刀切激进限电 400W (严重拖慢 Prefill 首字计算)</text>
  <text x="638" y="214" class="mono">• Prefill保留: 74.5% ✕ | Decode保留: 92.0% | 能效比: 1.48x | 可装卡: 1,536卡</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 统一 550W 甜点封顶 (省电 21.4%，Decode 保留 97.2%)</text>
  <text x="638" y="270" class="mono">• Prefill保留: 92.8% ✓ | Decode保留: 97.2% ✓ | 能效比: 1.24x | 可装卡: 1,248卡</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: PD 角色感知封顶 (P池 650W / D池 500W) + 瞬态平滑 (推荐 🏆)</text>
  <text x="638" y="326" class="mono">• Prefill保留: 98.4% 🏆 | Decode保留: 98.8% 🏆 | 能效: 1.31x | 可装卡: 1,280卡 (+25%)</text>

  <!-- Bottom Panel: Power Whip (di/dt) & Grid Synchronization Defense -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 智算中心供电防跳闸核心：什么是“千卡同步功率鞭效应 (Power Whip / dP/dt)”？</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">痛点: 毫秒级 1.2 MW 功率断崖跳变</text>
  <text x="58" y="464" class="mono">• 千卡训练每步同步 Barrier 或 Checkpoint 停顿时：</text>
  <text x="58" y="484" class="mono">  1,024 张 GPU 在同一毫秒内从 700W 满载跌落至</text>
  <text x="58" y="504" class="mono">  120W 空闲，2 秒后又同时冲回 700W！</text>
  <text x="58" y="524" class="mono">• 产生高达 600 kW/ms 的剧烈功率震荡，直接</text>
  <text x="58" y="544" class="mono">  触发机房 UPS 逆变器过流保护与市电谐波跳闸！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">解法 1: 软件层 Dummy-GEMM 空转托底与斜坡</text>
  <text x="436" y="464" class="mono">• 在通信等待或 Checkpoint 间隙超过 50ms 时，</text>
  <text x="436" y="484" class="mono">  后台低优先级 Stream 自动注入轻量级</text>
  <text x="436" y="504" class="mono">  Burn-Floor Kernel 将谷底功率托住在 320W；</text>
  <text x="436" y="524" class="mono">• 启动与恢复时执行 500ms 阶梯爬坡 (Power</text>
  <text x="436" y="544" class="mono">  Ramp-Up)，将 dP/dt 冲击削减 78%！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">解法 2: 机柜级超级电容 (Supercapacitor BBU)</text>
  <text x="814" y="464" class="mono">• 在 50kW~132kW 液冷机柜的 48V 直流母排</text>
  <text x="814" y="484" class="mono">  (Busbar) 上标配机架级超级电容/锂电缓冲架</text>
  <text x="814" y="504" class="mono">  (C-rate 极高充放能力)</text>
  <text x="814" y="526" class="txt" fill="#fde68a">在 GPU 毫秒级尖峰时放电削峰、在通信谷底时</text>
  <text x="814" y="546" class="txt" fill="#fde68a">充电填谷，向前端电网呈现平滑直线负载！</text>
</svg>
