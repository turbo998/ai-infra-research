<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 271 · 4-BIT WEIGHT QUANTIZATION: BITSANDBYTES NF4 TRAP VS AWQ/GPTQ MARLIN &amp; MACHETE FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">4-Bit Inference: `bitsandbytes NF4` 0.56x Slowdown vs `Marlin / Machete` (3.17x Speedup)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: `bitsandbytes NF4` &amp; `desc_act=True`</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`bitsandbytes NF4`): Dequantizes `0.5B` NF4 to `2.0B` BF16</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  in HBM, then reads `2.0B` BF16 again for cuBLAS (`4.5 B/param`</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  HBM traffic — `1.8x` SLOWER than unquantized `BF16`!) ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (`GPTQ desc_act=True`): Random column gather (`14.8 ms`)! ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">NF4 HBM Traffic: 4.5 B/param | Decode ITL: 34.2 ms (0.56x) ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Materializing Dequantized Weights Back to HBM Destroys Bandwidth</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: `AWQ / GPTQ` + `Marlin / Machete` (`lop3`)</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Streams `0.52 B/param` once from HBM into Shared Memory (`cp.async`)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Unpacks 8x `INT4` from `uint32` in registers via 1-cycle `lop3.b32`</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  into IEEE-754 mantissa bits (`0x6400 | q_4bit`) without `int2float`!</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Pre-permutes weight layout offline to match Tensor Core MMA fragments</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">HBM Read: 0.52 B/param | ITL: 6.0 ms (3.17x vs BF16 · 5.7x vs NF4) 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Zero HBM Writeback + Bitwise Mantissa Injection + 4-Stage Pipeline</text>
</svg>
