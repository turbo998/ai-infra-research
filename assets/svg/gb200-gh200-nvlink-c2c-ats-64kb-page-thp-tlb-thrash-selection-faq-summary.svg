<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 277 · GB200 NVL72 / GH200 NVLINK-C2C (900 GB/S) &amp; ATS PAGE-SIZE TUNING (64KB + 512MB THP) FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">GB200 / GH200 `NVLink-C2C`: 4KB Page ATS Thrash (85 GB/s) vs `64KB + 512MB THP` (425 GB/s)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: ARM64 `4KB` Kernel `ATS` TLB Collapse</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Under `ATS`, GPU `GMMU` translates CPU pointers via Grace `SMMUv3`</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`4KB` Kernel): `128 GB` spans `33,554,432` page entries!</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  Random KV/Embedding reads miss `GMMU TLB` on every access,</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  collapsing `450 GB/s` `NVLink-C2C` down to `85.0 GB/s`! ✕</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">4KB C2C Bandwidth: 85.0 GB/s (-80%) | TLB Entries: 33.5M ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">68.5% of NVLink-C2C Time Spent Waiting on ATS 4-Level Page Walks!</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: `64KB` Kernel + `512MB THP` + Coherent Zero-Copy</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Boots Grace ARM64 with `CONFIG_ARM64_64K_PAGES=y` (`getconf PAGESIZE=65536`)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Under `64KB` pages, 1 Level-2 PMD `THP` is $8192 \times 64\text{KB} = 512\text{ MB}$!</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Covers `128 GB` LPDDR5X RAM in JUST `256` TLB entries (`0.4%` stall!)</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• GPU kernels read/write Grace `malloc` memory directly at `425 GB/s`!</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Unidir C2C BW: 425.0 GB/s (5.0x Faster) | TLB Entries: 256 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">131,072x Fewer Page Table Entries + 94.4% Physical NVLink-C2C Saturation</text>
</svg>
