<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 287 · DEEPSEEK-V3 MOE M=4 NODE-LIMITED ROUTING &amp; DEEPEP 2-STAGE DISPATCH</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Flat Top-8 AllToAllv (7.12 RDMA Copies, 6.85ms) vs. M=4 + 2-Stage RDMA-&gt;NVLink Dedup (1.42ms, 4.82x)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2: Flat AllToAllv Across EP=64</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (Unconstrained Top-8 across 8 Nodes):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Sends 7.12 copies/token over slow 50 GB/s inter-node RDMA</text>
  <text x="85" y="305" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (M=4 Node Cap + Naive Flat ncclAllToAllv):</text>
  <text x="85" y="333" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Even if 3 experts live on Node B (GPU 1, 3, 6), flat</text>
  <text x="85" y="361" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  AllToAllv still sends 3 duplicate packets over RDMA!</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">All-to-All Latency: 6.85 ms (4.82x Slower!)</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Compute Overlap Coverage: Only 34.0% (66% Exposed Stall)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: M=4 + DeepEP 2-Stage RDMA-&gt;NVLink</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Group-Limited Routing (topk_group = 4 of 8 Nodes):</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Each token selects 8 experts across at most 4 nodes</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Stage 1 (Inter-Node RDMA Deduplication):</text>
  <text x="640" y="333" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Sends ONLY 1 FP8 copy/node over RDMA (3.12 copies/tok!)</text>
  <text x="640" y="368" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Stage 2: Intra-Node NVLink (450 GB/s) multicast to GPUs</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">All-to-All Latency: 1.42 ms (4.82x Faster!)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">Compute Overlap Coverage: 100.0% (0ms Exposed Bubble!)</text>
</svg>
