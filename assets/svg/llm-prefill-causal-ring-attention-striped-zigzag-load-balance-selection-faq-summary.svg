  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (Contiguous `[0..P-1]`): Under a lower-triangular causal mask,</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  Rank 0 only computes 1 block &amp; idles for 7 steps while Rank 7 computes</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  all 8 blocks — wasting 43.8% of GPU FLOPs (`1.78x` imbalance)! ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (Striped `t % P`): Breaks contiguous tile locality ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
