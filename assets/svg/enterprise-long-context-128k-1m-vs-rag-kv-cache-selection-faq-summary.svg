<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad388" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad388" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad388)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级超长上下文 (128K–1M Long Context) vs. 分层章节树 RAG 与 KV 缓存选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：150K 整书无脑全塞引发“中间迷失 (准确率 74.2%)”与 11.4s 延迟；分层目录树 + 16K 完整章节召回 + 首尾重排达 96.2% 且省 91.7%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 388 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 150K 整书无脑全塞</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 300页合同 (150K Token) 每次全塞</text>
  <text x="40" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 严重“迷失在中间 (Lost in Middle)”✕</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 多跳条款准确率：仅 74.2% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• P95 首字延迟：11,400 ms (11.4s) ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 单张80G卡最大并发：仅 2 人 (24G KV/人)</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">百万次月成本：$94,000 / 月 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：“有1M窗口所以不需要RAG”是</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">企业落地最昂贵、最降智的头号幻觉！</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 传统 Top-5 碎片短切块</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 机械切成 512 Token 碎片召回 Top-5</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 仅注入 2.5K Token 上下文</text>
  <text x="332" y="212" fill="#fde68a" font-size="12" font-weight="700">• 多跳条款准确率：76.5% (漏附录豁免)</text>
  <text x="332" y="232" fill="#34d399" font-size="12" font-weight="700">• P95 首字延迟：680 ms ✅</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• 单张80G卡最大并发：64 人</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">百万次月成本：$4,200 (断章取义) ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">痛点：虽然便宜，但主条款在第 4 章、</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">免责例外在附录 C 时，短切块必漏判！</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 静态 150K 前缀缓存钉扎</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 将固定手册 KV 常驻显存/主机内存池</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 免除重复 Prefill，但解码仍读 150K KV</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 多跳条款准确率：86.0% ✅</text>
  <text x="624" y="232" fill="#7dd3fc" font-size="12" font-weight="700">• P95 首字延迟：1,850 ms</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 单张80G卡最大并发：12 人</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">百万次月成本：$19,500 ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：全员反复查同一本 &lt;=20 份固定规章</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：无法扩展到几万份不同客户合同</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 目录树+16K整章+首尾重排🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• PageIndex/ToC 树定位 2~4 个完整章节</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 组装 16K 黄金窗口 + 首尾高权重新排</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 多跳条款准确率：96.2% 🏆 (+22.0pts)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• P95 首字延迟：540 ms 🏆 (快 21.1x)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 单张80G卡最大并发：48 人 (高吞吐)</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">百万次月成本：$7,800 (省 91.7%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级长合同、标书与研报终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">把 128K 窗口留给“精选完整章节”，而非塞垃圾</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么“大模型声称支持 100万 Token != 有效推理深度达 100万 Token”？架构师三大长文铁律</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad388)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. RULER 有效上下文真相（16K~32K 黄金甜蜜区）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• “大海捞针 (NIAH)”满分只代表能找到字面匹配；</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 在 RULER 多跳追踪与聚合评测中，一旦无关噪声超过 `32K Tokens`，</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  所有主流模型的注意力熵都会显著发散（准确率掉 15~25%）！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 正确姿势：用长窗口承载 **3~4 个完整章节 (16K)**，绝不塞满 150K 噪音！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 分层章节树导航（PageIndex / RAPTOR 取代碎切块）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 既不塞整本书（太噪），也不切 500 字豆腐块（太碎）！</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 入库时保留文档天然的 `章 -&gt; 节 -&gt; 小节摘要树` 及交叉引用指针</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  （如检测到“除附录 C 另有规定外”，自动连带拉取附录 C 全文），</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 让大模型读到上下文完整的 `16,384 Tokens` 精选章节！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. U 型注意力首尾重排（Defeat Lost-in-the-Middle）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 大模型对 Prompt **最开头 (Top)** 和 **最末尾 (Bottom)** 的内容</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">  注意力权重最高，对正中间 (第 40%~70% 位置) 最迟钝！</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• 组装 Prompt 时执行两头重排：`[Rank1最高分, Rank3, ..., Rank4, Rank2次高分]`</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  将最核心的证据紧贴在用户问题正上方，准确率白捡 +6.5 pts！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 388 合成标定算例 (independently_reproduced=false)</text>
</svg>
