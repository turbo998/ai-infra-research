<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#528 企业跨境电商与全球化多语种本地化 (`日处理 5亿词 · 35语种`) 级联选型与算卡指南</text>
  <text x="30" y="60" class="sub">告别“传统机器翻译乱译品牌词 ($182.5万/年)”与“全量 70B 算力浪费 (48卡)” · 术语库 Trie 锚定 + 88/12 质量门禁仅需 8 卡</text>

  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么传统 MT 会翻译坏品牌名，而全用 70B 成本又太高？</text>
  <text x="48" y="132" class="txt bad">• 传统机器翻译 API 痛点: 不懂上下文语境，破坏 HTML/变量占位符 `{price}`，</text>
  <text x="64" y="150" class="txt bad">品牌术语合规率仅 72.4%，且日处理 5 亿词年费高达 $182.5 万 ✕</text>
  <text x="48" y="174" class="txt warn">• 全量 70B 直译浪费: 88% 规格参数/尺码说明完全不需要 70B，白耗 48 张 H200 ✕</text>
  <text x="48" y="198" class="txt good">• 2026 术语库 Trie + 88% 7B 专模 + 12% COMET-Kiwi 门禁级联 🏆:</text>
  <text x="64" y="218" class="txt">① Aho-Corasick 术语自动机 (0.3ms): 动态抽取出片内命中的 5–12 个专有名词注入</text>
  <text x="64" y="238" class="txt">② 88% 走 7B 多语种专模 (Tower/Qwen2.5-7B FP8) + XGrammar 占位符保护</text>
  <text x="64" y="258" class="txt good">③ 无参考质量评估模型 (COMET-Kiwi &lt; 0.82) 自动筛出 12% 营销标题交 70B 创译 🏆</text>

  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 日处理 5 亿词 (35 语种) 三套本地化架构对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (商业机器翻译 API): 品牌术语合规率 72.4% ✕</text>
  <text x="594" y="152" class="txt bad">本土营销地道度评分 68.5%，年费高达 $182.5 万/年 ✕</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (100% 全部调用 70B 大模型直译): 营销评分 95.8% ✓，</text>
  <text x="594" y="198" class="txt warn">但算力浪费严重，需常驻 48 张 H200 ($128.6 万/年 ✕)</text>
  <text x="578" y="224" class="txt good">• 方案 3 (术语 Trie + 88% 7B + COMET 门禁 → 12% 70B 创译 🏆):</text>
  <text x="594" y="246" class="txt good">- 品牌术语合规率: 99.8% (+27.4 pts 🏆) · 文化营销评分 96.4%</text>
  <text x="594" y="268" class="txt good">- 仅需 8 张 H200 ($21.4万/年，较全70B省 83.3% 卡、较MT API省 88.3% 🏆)</text>

  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 日处理 5 亿词规模下的年化总成本 (Annual TCO) 与品牌术语合规率对比</text>

  <text x="48" y="378" class="txt">方案 1: 商业机器翻译 API</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">$182.5万/年 | 术语合规率仅 72.4% · 易破坏 HTML 标签 ✕</text>

  <text x="48" y="418" class="txt">方案 2: 100% 全量 70B 大模型</text>
  <rect x="305" y="404" width="338" height="16" fill="#f59e0b" rx="4"/>
  <text x="653" y="418" class="txt warn">$128.6万/年 (48 张 H200) | 术语合规率 91.0%</text>

  <text x="48" y="458" class="txt good">方案 3: 术语Trie + 88/12 COMET级联 🏆</text>
  <rect x="305" y="444" width="56" height="16" fill="#10b981" rx="4"/>
  <text x="371" y="458" class="txt good">$21.4万/年 (仅 8 张 H200 · 立省 88.3% 🏆) | 术语合规率 99.8% · 营销分 96.4% 🏆</text>
</svg>
