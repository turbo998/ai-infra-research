<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#661 企业长视频理解与 500 路实时 RTSP 视频流 VLM：动态帧差门控 (-88% 帧) 与 3D 时空池化容量指南</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">Enterprise Video VLM Sizer: 1h 1080p Raw (9.68M Visual Tokens = OOM) vs. Keyframe + CLIP Gating + 3D Pooling (62.2K Tokens, -99.36%)</text>

  <!-- Left: Why 1-FPS Raw Video Destroys VLM Clusters -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-size="15" font-weight="700">① 为什么 1 小时 1080p 视频按 1 FPS 直喂会瞬间 OOM？</text>

  <rect x="40" y="150" width="333" height="148" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 视觉 Token 帧数乘法爆炸 (Frame-Token Explosion)</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">· 单帧 `1080p` 原生切片 = `2,691 Visual Tokens` (#631 公式)</text>
  <text x="52" y="214" fill="#F1F5F9" font-size="12">· 1 小时视频按 `1 FPS` 抽帧 = `3,600 帧`</text>
  <text x="52" y="234" fill="#FCA5A5" font-size="12" font-weight="700">· 总视觉词数 = `3,600 × 2,691 = 9,687,600 Tokens (968万词)`！</text>
  <text x="52" y="254" fill="#CBD5E1" font-size="12">· 后果：远超 128K 上下文极限！哪怕强制降采样到 480p，</text>
  <text x="52" y="274" fill="#FCA5A5" font-size="11">  监控摄像头 88% 时间画面静止，卻在重复消耗昂贵的 ViT + Prefill！</text>

  <rect x="40" y="310" width="333" height="168" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="332" fill="#6EE7B7" font-size="13" font-weight="700">✅ 三级时空漏斗压缩公式 (968万 → 6.22万 Tokens!)</text>
  <text x="52" y="354" fill="#F8FAFC" font-size="12" font-weight="700">T_vid = N_sec · f_fps · (1 - η_static) · (T_frame / C_3d)</text>
  <text x="52" y="376" fill="#D1FAE5" font-size="12">1. **边缘运动 + SigLIP 帧差门控 (`η_static = 88%`)**：</text>
  <text x="52" y="394" fill="#D1FAE5" font-size="11">   仅当相邻 I 帧余弦相似度 `cos &lt; 0.92` 才上送 (`3,600 → 432 帧`)</text>
  <text x="52" y="416" fill="#D1FAE5" font-size="12">2. **3D 时空卷积/双线性池化 (`C_3d = 18.7x`)**：</text>
  <text x="52" y="434" fill="#D1FAE5" font-size="11">   将连续 2 帧 + 空间 2×2 Patch 融合，单帧压至 **`144 Tokens/帧`**</text>
  <text x="52" y="456" fill="#6EE7B7" font-size="12" font-weight="700">🎯 1 小时视频总计仅 `432 × 144 = 62,208 Tokens (-99.36%)`！</text>

  <!-- Center: 500-Stream Real-Time RTSP Edge-to-Core Architecture -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 500 路实时 RTSP 视频流“边-云三级漏斗”架构</text>

  <rect x="423" y="150" width="354" height="96" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="435" y="172" fill="#38BDF8" font-size="13" font-weight="700">Tier 1 (边缘解码与像素运动门控 · NVDEC 硬件解码)</text>
  <text x="435" y="192" fill="#F1F5F9" font-size="12">· 利用 L40S 内置 **4 颗独立 NVDEC 硬件解码引擎** (不占 CUDA 核)</text>
  <text x="435" y="212" fill="#CBD5E1" font-size="12">· 只解 H.264/H.265 `I-Frame` + 光流宏块运动向量阈值过滤</text>
  <text x="435" y="232" fill="#6EE7B7" font-size="11" font-weight="700">· 瞬间滤除 70% 夜间/无人静止画面 (500 路 → 150 路有效帧/s)</text>

  <rect x="423" y="258" width="354" height="104" rx="8" fill="#0F172A" stroke="#A78BFA"/>
  <text x="435" y="280" fill="#C4B5FD" font-size="13" font-weight="700">Tier 2 (轻量视觉语义门控 · YOLOv10 + SigLIP 400M)</text>
  <text x="435" y="300" fill="#F1F5F9" font-size="12">· `2.5 ms` 检测是否出现目标实体 (人/车/烟火/产线瑕疵)</text>
  <text x="435" y="320" fill="#CBD5E1" font-size="12">· 计算与上一关键帧的特征相似度：凡 `cos &gt;= 0.92` 判定为画面未变</text>
  <text x="435" y="340" fill="#6EE7B7" font-size="11" font-weight="700">· 再滤除 60% 重复状态，仅剩 **12% 关键事件片段** 触发大模型！</text>

  <rect x="423" y="374" width="354" height="104" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="435" y="396" fill="#6EE7B7" font-size="13" font-weight="700">Tier 3 (中心 VLM 深度理解 · Qwen2.5-VL-72B + 3D Pool)</text>
  <text x="435" y="416" fill="#F8FAFC" font-size="12">· 每次事件组装 `8 帧 × 144 tok = 1,152 Visual Tokens` 短滑窗</text>
  <text x="435" y="436" fill="#D1FAE5" font-size="12">· 输出结构化告警 JSON + 存入 Milvus/DiskANN 时空向量库</text>
  <text x="435" y="456" fill="#6EE7B7" font-size="12" font-weight="700">· 端到端告警延迟：`P95 = 480 ms` (满足工业安全秒级响应 SLA)</text>

  <!-- Right: 500-Stream Sizing & Cost Comparison -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="829" y="136" fill="#38BDF8" font-size="15" font-weight="700">③ 500 路实时摄像头流 GPU 容量与成本对决</text>

  <rect x="827" y="150" width="333" height="102" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="839" y="172" fill="#FCA5A5" font-size="13" font-weight="700">方案 1：每秒 1 帧无差别全喂 72B VLM (反模式)</text>
  <text x="839" y="192" fill="#E2E8F0" font-size="12">· 负载：`500 帧/s × 2,691 tok = 1,345,500 Visual tok/s`！</text>
  <text x="839" y="212" fill="#E2E8F0" font-size="12">· 所需硬件：惊人的 **`192× H200`** (`$29.4万/月`)</text>
  <text x="839" y="232" fill="#FCA5A5" font-size="12" font-weight="700">· 单路摄像头每小时成本：`$0.220 / 路·小时` (彻底破产)</text>

  <rect x="827" y="264" width="333" height="114" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="839" y="286" fill="#6EE7B7" font-size="13" font-weight="700">方案 2：三级帧差门控 (-88%) + 3D 池化 (8×L40S + 8×H200)</text>
  <text x="839" y="308" fill="#F8FAFC" font-size="12">· `8× L40S` (32 颗 NVDEC)：扛下 500 路解码 + YOLO/SigLIP 门控</text>
  <text x="839" y="328" fill="#F8FAFC" font-size="12">· `8× H200`：仅处理 12% 有效事件帧 (`60 帧/s × 144 tok = 8.6K/s`)</text>
  <text x="839" y="348" fill="#6EE7B7" font-size="12" font-weight="700">· 单路每小时成本降至 **`$0.018 / 路·小时 (-91.8%)`**！</text>
  <text x="839" y="366" fill="#A7F3D0" font-size="12" font-weight="700">· 硬件从 192 张 H200 降至 `8 L40S + 8 H200` (年省 `$330.6万`)！</text>

  <rect x="827" y="390" width="333" height="88" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="839" y="412" fill="#FDE68A" font-size="13" font-weight="700">🎯 1 小时离线会议/培训录像检索最佳实践</text>
  <text x="839" y="432" fill="#E2E8F0" font-size="12">· 语音轨 (ASR 文字) 占 85% 信息量 → 先搜 ASR 时间戳定位到</text>
  <text x="839" y="450" fill="#E2E8F0" font-size="12">  前后 `30 秒` 区间，再对该 30 秒抽高清帧喂 VLM 看 PPT 细节</text>
  <text x="839" y="468" fill="#6EE7B7" font-size="11" font-weight="700">  (“ASR 粗定位 + 局部高清帧 VLM 精读”：再省 94% 视觉算力！)</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 视频大模型 (Video VLM) 容量设计铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 严禁把原始视频按固定帧率全量塞进大模型：必须前置 `NVDEC I-Frame + SigLIP 余弦帧差门控 (cos &lt; 0.92)` 砍掉 88% 静止冗余帧；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 启用 3D 时空池化将单帧压缩至 `144 Tokens/帧`，使 1 小时视频浓缩进 `62.2K` 上下文，500 路 RTSP 流仅需 `8×L40S + 8×H200`。</text>
</svg>
