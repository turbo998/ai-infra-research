<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#654 智算网络光模块与布线工程选型：DAC/AEC 铜缆 vs. LPO 线性直驱 vs. DSP 光模块与 MoR 机柜布局指南</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">AI Optics &amp; Cabling Sizer (1,024-GPU 400G/800G): Why All-DSP Optics Wastes $2.31M &amp; Causes 64% Link Flaps vs. MoR DAC/AEC + LPO</text>

  <!-- Left: Why All-Optical DSP Transceivers Are a Reliability & Cost Trap -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-size="15" font-weight="700">① 为什么智算集群 64% 的网络中断都出在 DSP 光模块？</text>

  <rect x="40" y="150" width="333" height="148" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 全光 DSP 方案的三大隐痛 (1,024 卡需 3,072 只光模块)</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">1. 高温闪断 (`Link Flap`)：400G/800G DSP 光模块单只功耗</text>
  <text x="52" y="214" fill="#CBD5E1" font-size="12">   高达 `12W~16W`，激光器壳温 `&gt;70°C` 时失效率呈指数飙升！</text>
  <text x="52" y="234" fill="#F1F5F9" font-size="12">2. 造价高昂：3,072 只 DSP 模块 + MPO 光纤高达 **`$3.38M`**</text>
  <text x="52" y="254" fill="#FCA5A5" font-size="12" font-weight="700">3. 额外延迟与功耗：每跳 DSP 芯片带来 `~100 ns` 调制解调</text>
  <text x="52" y="274" fill="#FCA5A5" font-size="11">   延迟，且全集群仅光模块就白白吃掉 `43.0 kW` 纯散热电力！</text>

  <rect x="40" y="310" width="333" height="168" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="332" fill="#6EE7B7" font-size="13" font-weight="700">✅ 黄金铁律：“能用铜绝不用光，能用 LPO 少用 DSP”</text>
  <text x="52" y="354" fill="#F8FAFC" font-size="12">· 距离 `&lt;= 3.0m` (同柜/邻柜)：用 **`DAC 无源铜缆`** (`0.1W`, `$95`)</text>
  <text x="52" y="374" fill="#F8FAFC" font-size="12">· 距离 `3.0m ~ 7.0m` (跨 2~3 柜)：用 **`AEC 有源铜缆`** (`4.5W`, `$290`)</text>
  <text x="52" y="394" fill="#F8FAFC" font-size="12">· 距离 `7.0m ~ 50m` (Leaf→Spine)：用 **`LPO 线性直驱光模块`**</text>
  <text x="52" y="414" fill="#D1FAE5" font-size="11">  (砍掉模块内高功耗 DSP 芯片，靠交换机/网卡 SerDes 直接驱动激光器，</text>
  <text x="52" y="432" fill="#6EE7B7" font-size="11" font-weight="700">  功耗直降 50% 至 `6.5W`、延迟降至 `5ns`、单价省 38%！)</text>
  <text x="52" y="454" fill="#A7F3D0" font-size="11">· 距离 `&gt; 50m` (跨机房/跨排远端 Spine)：才用标准 **`DSP 光模块`**</text>

  <!-- Center: Middle-of-Row (MoR) Layout Unlocking 67% Copper -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 机柜排布魔术：Middle-of-Row (MoR) 让 67% 链路变铜缆！</text>

  <rect x="423" y="150" width="354" height="114" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="435" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 错误摆法：End-of-Row (EoR · 网络柜全放一排最末端)</text>
  <text x="435" y="194" fill="#F1F5F9" font-size="12">· 8-Rail 架构下，所有服务器需连向整排共享的 8 台 Rail Leaf</text>
  <text x="435" y="214" fill="#CBD5E1" font-size="12">· 若把 Leaf 交换柜放在一排最左/最右端，最远机柜距离达 `14 米`！</text>
  <text x="435" y="234" fill="#FCA5A5" font-size="12" font-weight="700">· 结果：超过 7m 铜缆极限，被迫 100% 采购昂贵易坏的光模块！</text>

  <rect x="423" y="276" width="354" height="202" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="435" y="298" fill="#6EE7B7" font-size="13" font-weight="700">✅ 正解：Middle-of-Row (MoR · 交换机柜居中对称排布)</text>
  <text x="435" y="320" fill="#38BDF8" font-size="12" font-family="Consolas, monospace">[GPU柜1..4] ➔ [Rail Leaf 交换机中心柜] ⬅ [GPU柜5..8]</text>
  <text x="435" y="344" fill="#F8FAFC" font-size="12">· 将 8 台 Rail Leaf 交换机放在每组 `8` 台高密液冷 GPU 机柜正中央</text>
  <text x="435" y="364" fill="#D1FAE5" font-size="12">· 左右两侧所有 GPU 节点到 Leaf 交换机的物理走线距离</text>
  <text x="435" y="384" fill="#6EE7B7" font-size="12" font-weight="700">  100% 缩短至 `1.5m ~ 6.5m` 以内！</text>
  <text x="435" y="406" fill="#FDE68A" font-size="12" font-weight="700">🎯 物理层颠覆性收益 (1,024 卡集群 2,048 条端到端链路)：</text>
  <text x="435" y="426" fill="#D1FAE5" font-size="11">  · 下行 `1,024` 条服务器→Leaf 链路：**`100% 采用 DAC/AEC 铜缆`** (0 只光模块!)</text>
  <text x="435" y="446" fill="#D1FAE5" font-size="11">  · 上行 `1,024` 条 Leaf→Spine 链路 (`15m~35m`)：采用 **`LPO 光模块`**</text>
  <text x="435" y="464" fill="#6EE7B7" font-size="11" font-weight="700">  → 全集群年化光模块闪断故障从 `28.0 次/年` 骤降至 `6.0 次/年 (-78.6%)`！</text>

  <!-- Right: 4-Medium Quantitative Matrix -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="829" y="136" fill="#38BDF8" font-size="15" font-weight="700">③ 四大高速互联介质参数与千卡 TCO 对决</text>

  <rect x="827" y="150" width="333" height="148" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="839" y="172" fill="#38BDF8" font-size="13" font-weight="700">单条 400G 链路 (两端模块+线缆) 硬核参数表</text>
  <text x="839" y="194" fill="#E2E8F0" font-size="12">· `DAC 无源铜缆 (&lt;=3m)`: `0.1 W` | `0.1 ns` | `$95/条` | MTBF 5000万h</text>
  <text x="839" y="214" fill="#E2E8F0" font-size="12">· `AEC 有源铜缆 (&lt;=7m)`: `9.0 W` | `2.5 ns` | `$290/条` | MTBF 2000万h</text>
  <text x="839" y="234" fill="#6EE7B7" font-size="12" font-weight="700">· `LPO 线性光 (&lt;=50m)`: `13.0 W` | `5.0 ns` | `$1,020/条` | MTBF 500万h</text>
  <text x="839" y="254" fill="#FCA5A5" font-size="12">· `DSP 传统光 (&lt;=500m)`: `28.0 W` | `200 ns` | `$1,650/条` | MTBF 150万h</text>
  <text x="839" y="276" fill="#94A3B8" font-size="11">  (注：每条光纤链路需两端各插 1 只光模块 + 1 根 MPO-12 光纤跳线)</text>

  <rect x="827" y="310" width="333" height="168" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="839" y="332" fill="#6EE7B7" font-size="13" font-weight="700">1,024-GPU 集群布线总账本 (EoR 全 DSP vs. MoR 铜+LPO)</text>
  <text x="839" y="354" fill="#FCA5A5" font-size="12">⛔ 方案 A (EoR 全光 DSP · 4,096 只 DSP 模块)：</text>
  <text x="839" y="372" fill="#E2E8F0" font-size="11">   · 线缆采购 CapEx: **`$3.38M`** | 光模块总功耗: `57.3 kW`</text>
  <text x="839" y="394" fill="#6EE7B7" font-size="12" font-weight="700">✅ 方案 B (MoR 居中排布：下行 DAC/AEC + 上行 LPO)：</text>
  <text x="839" y="414" fill="#F8FAFC" font-size="11">   · 线缆采购 CapEx: **`$1.26M` (直接省下 `$2.12M / -62.7%`！)**</text>
  <text x="839" y="434" fill="#F8FAFC" font-size="11">   · 模块总功耗降至 `17.8 kW (-68.9%)`，3 年再省电费 `$19.0万`</text>
  <text x="839" y="454" fill="#6EE7B7" font-size="12" font-weight="700">   · 3 年总 TCO 净省 `$2.31M`，链路闪断故障减少 `78.6%`！</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 智算中心物理布线与光模块选型铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 机房平面布局决定线缆成本：强制将 Rail Leaf 交换机柜置于每排液冷 GPU 机柜正中央 (`MoR`)，让 100% 服务器下行链路缩短至 &lt;=7m 用 DAC/AEC 铜缆；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 光模块端面清洁度是第一杀手：所有 MPO 光纤插拔前必须 100% 经过光纤端面显微镜检测，并在监控中对 `Rx Power &lt; -8 dBm` 实施提前换件预警。</text>
</svg>
