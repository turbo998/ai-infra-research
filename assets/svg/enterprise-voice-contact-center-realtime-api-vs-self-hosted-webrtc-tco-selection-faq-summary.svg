<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #409 · AI VOICE CONTACT CENTER: REALTIME S2S API VS. CASCADED WEBRTC + SGLANG + STREAMING TTS</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业智能语音客服中心选型：Realtime S2S API vs. 级联流式 WebRTC 架构与分钟成本精算</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">将口腔到耳朵延迟 (Mouth-to-Ear) 从 2.85 秒压进 435 毫秒，兼顾播报前文本合规拦截并将每分钟通话成本砍掉 85%</text>

  <!-- Left Box: Mouth-to-Ear Latency Breakdown Equation -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 口腔到耳朵 (Mouth-to-Ear &lt;= 500ms) 六段式延迟手算账本</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">M2E = T_WebRTC(25ms) + T_VAD(110ms) + T_ASR(70ms) + TTFT_LLM(105ms)</text>
  <text x="90" y="242" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">    + 5_words * TPOT(50ms) + T_TTS_First_Chunk(75ms) = 435 ms 🏆</text>
  <text x="90" y="262" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">传统整句串行反模式: 等 LLM 生完 200 词再调 TTS -&gt; M2E 高达 2,850 ms!</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 6 词首句流式触发：LLM 只要吐出前 6 个词遇到逗号，立即送入流式 TTS 发声</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 语义 VAD + 随时打断 (Barge-In)：用户插话 `&lt;80ms` 清空 TTS 缓冲并 Abort LLM</text>
  <text x="76" y="350" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 并发硬件定容：单台 8x H200 可同时承载 450 路全双工实时语音通话！</text>

  <!-- Right Box: Native S2S vs Cascaded Streaming Tradeoffs -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 原生端到端语音 (Realtime S2S) vs. 级联流式 (ASR+LLM+TTS) 选型边界</text>
  <rect x="634" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">GPT-4o Realtime API / Omni : 延迟 320ms · 情感语调最佳 · 成本 $0.22/分钟</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">级联流式 (WebRTC+SGLang)   : 延迟 435ms · 播前 100% 文本合规审计 · $0.032/分</text>
  <text x="648" y="262" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">金融/医疗合规刚需           : 必须在 TTS 发声前对文本做数字/合规护栏强校验!</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 什么时候选 Realtime S2S？高端情感陪伴、外语口语陪练、小规模 VIP 礼宾热线</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 什么时候选级联流式？银行/保险/运营商千路并发客服、需精确调用 ERP 工具与审计</text>
  <text x="634" y="350" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 混合路由：90% 标准业务走级联流式 ($0.032/min) + 10% 情绪安抚转 Realtime S2S！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档企业智能语音客服架构实效对比 (月通话 1,000 万分钟 · 1,000 路高峰并发)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">语音交互架构方案</text>
  <text x="435" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">P95 M2E 延迟</text>
  <text x="590" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">播前文本合规拦截</text>
  <text x="760" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">每分钟通话成本</text>
  <text x="920" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">月度总成本 (10M 分钟)</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 传统 HTTP 整句串行 (ASR -&gt; 等全量 LLM -&gt; 整段 TTS)</text>
  <text x="435" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">2,850 ms ✕ (死寂)</text>
  <text x="590" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">支持 (100%)</text>
  <text x="760" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.085 / min</text>
  <text x="920" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$850,000 / 月 ✕</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 100% 商业全双工 Realtime S2S API (GPT-4o-Realtime)</text>
  <text x="435" y="512" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">320 ms 🏆</text>
  <text x="590" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">仅事后音频旁路审计</text>
  <text x="760" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.220 / min ✕</text>
  <text x="920" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$2,200,000 / 月 ✕</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: WebRTC + 流式 ASR + SGLang (6词首句切块) + 流式 TTS</text>
  <text x="435" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">435 ms ✓</text>
  <text x="590" y="540" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">100% 播前精确拦截 ✓</text>
  <text x="760" y="540" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.032 / min ✓</text>
  <text x="920" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$320,000 / 月 ✓</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): 90% 级联流式 WebRTC + 10% 原生 S2S (Thinker-Talker 双脑)</text>
  <text x="435" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">410 ms (-6.95x) 🏆</text>
  <text x="590" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">100% 受控合规 🏆</text>
  <text x="760" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$0.038 / min 🏆</text>
  <text x="920" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$380,000 / 月 (-82.7%) 🏆</text>
</svg>
