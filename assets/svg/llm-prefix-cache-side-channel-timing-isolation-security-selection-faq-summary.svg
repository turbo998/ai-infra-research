<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad86" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad86" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad86)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad86)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22.5" font-weight="800">🛡️ 大模型推理 Prefix Cache 跨租户侧信道防护、首字延迟计时攻击与双层 HMAC 隔离选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">32×H100 ($80/hr, 200 企业租户共享) · 2K 公共模板 + 4K 租户机密文档 + 512 提问 (命中 42ms vs 未命中 520ms) · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#4c0519" stroke="#e11d48" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#fecdd3" font-size="13" font-weight="700" text-anchor="middle">Round 86 · Prefix Cache Security</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 全局无隔离共享缓存</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">仅按 Token 内容算哈希 · 跨租户共享同一棵树</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 侧信道窃取攻击成功率: <tspan fill="#f87171" font-weight="700">98.4% (机密全裸奔 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Prefix Cache 命中率: <tspan fill="#cbd5e1" font-weight="700">84.5%</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 平均首字延迟 TTFT: <tspan fill="#cbd5e1" font-weight="700">115.0 ms</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 集群吞吐: <tspan fill="#cbd5e1" font-weight="700">148.0 req/s</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 合规风险: <tspan fill="#f87171" font-weight="700">严重跨租户数据泄露 ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 12 倍首字延迟差引发的计时窃密：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">命中缓存 TTFT 仅 42ms，未命中需 520ms！攻击</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">者发送候选合同/医疗记录，看一眼首字返回时间</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">就能 100% 探知竞争对手刚才喂给模型什么文档！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 彻底关闭 Prefix Cache</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">因噎废食禁用缓存 · 每笔请求重算 6.6K 前缀</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 侧信道窃取攻击成功率: <tspan fill="#34d399" font-weight="700">0.0% (无缓存可探)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Prefix Cache 命中率: <tspan fill="#f87171" font-weight="700">0.0% ✕</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 平均首字延迟 TTFT: <tspan fill="#f87171" font-weight="700">520.0 ms (慢 4.26x ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 集群吞吐: <tspan fill="#f87171" font-weight="700">46.5 req/s (暴跌 -68% ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度算力账单: <tspan fill="#f87171" font-weight="700">$2,230,000 / yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 为了防侧信道多烧 $151 万/年：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">许多金融/政务私有云因担心多部门共享缓存泄密</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">而直接加 `--no-enable-prefix-caching`，导致</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">连同一租户自己的多轮对话都无法复用 KV！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#4c1d95"/>
    <text x="16" y="27" fill="#e9d5ff" font-size="14" font-weight="800">🟪 Tier 3: 随机 TTFT 延迟噪声混淆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">命中时人为 sleep(50~300ms) · 连测 10 次即破防</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 侧信道窃取攻击成功率: <tspan fill="#f87171" font-weight="700">64.2% (均值滤波破防 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Prefix Cache 命中率: <tspan fill="#c084fc" font-weight="700">84.5%</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 平均首字延迟 TTFT: <tspan fill="#f87171" font-weight="700">290.0 ms (拖慢正常用户 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 集群吞吐: <tspan fill="#c084fc" font-weight="700">142.0 req/s</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度算力账单: <tspan fill="#c084fc" font-weight="700">$730,000 / yr</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#4c1d95"/>
    <text x="26" y="220" fill="#d8b4fe" font-size="11.5" font-weight="700">⛔ 为什么加随机延迟是典型的“伪安全”？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 哪怕只有第 1 次探测未命中，一旦探测本身把</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">块写进缓存，第 2 次就变命中了；② 攻击者并发</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">测 10 次求均值即可滤掉随机噪声，还害惨好用户！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 双层 HMAC 密码学前缀树 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">签名公共根共享 + 租户 HMAC 私有子树 + 卸载加密</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 侧信道窃取攻击成功率: <tspan fill="#34d399" font-weight="700">0.0% (密码学零碰撞 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Prefix Cache 命中率: <tspan fill="#34d399" font-weight="700">82.8% (保住 98% 收益 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 平均首字延迟 TTFT: <tspan fill="#34d399" font-weight="700">122.0 ms (比关缓存快 4.26x 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 集群吞吐: <tspan fill="#34d399" font-weight="700">144.5 req/s (提速 3.11x 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度算力账单: <tspan fill="#34d399" font-weight="700">$718k/yr (比关缓存省 $1.51M 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 兼得“跨租户共享公共模板”与“私有零泄露”：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 平台级 2K 公共 SDK 模板用 `PUBLIC_KEY` 全</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">局共享；② 进入租户上下文后立即切换 `HMAC(</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">tenant_secret, parent||tokens)`，物理杜绝跨租户命中！</text>
  </g>

  <!-- Bottom Left: Threat Vector Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📊 四类典型缓存侧信道与物理残留攻击下的泄露率对比 (% ，越低越安全)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">对比全局无隔离缓存 (Tier 1)、随机延迟混淆 (Tier 3) 与双层 HMAC + AES-GCM (Tier 4)</text>

    <!-- Row 1 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">B2B 机密合同存在性探测 (Membership)</text>
    <rect x="260" y="74" width="6" height="14" rx="3" fill="#10b981"/>
    <text x="274" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">0.0% 泄露 (Tier 4 HMAC 隔离 🏆)</text>
    <rect x="260" y="92" width="240" height="14" rx="3" fill="#ef4444"/>
    <text x="508" y="104" fill="#f87171" font-size="11.5" font-weight="700">100.0% ✕</text>

    <!-- Row 2 -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">逐块 16-Token 字典树暴力还原 (Prompt Steal)</text>
    <rect x="260" y="124" width="6" height="14" rx="3" fill="#10b981"/>
    <text x="274" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">0.0% 泄露 🏆</text>
    <rect x="260" y="142" width="232" height="14" rx="3" fill="#ef4444"/>
    <text x="500" y="154" fill="#f87171" font-size="11.5" font-weight="700">96.8% ✕</text>

    <!-- Row 3 -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">LRU 挤占驱逐探测 (Prime+Probe Eviction)</text>
    <rect x="260" y="174" width="6" height="14" rx="3" fill="#10b981"/>
    <text x="274" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">0.0% (租户最小配额水位线保护 🏆)</text>
    <rect x="260" y="192" width="212" height="14" rx="3" fill="#f59e0b"/>
    <text x="480" y="204" fill="#fde68a" font-size="11.5" font-weight="700">88.5% ✕</text>

    <!-- Row 4 -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">NVMe / SSD 二级卸载明文残留取证</text>
    <rect x="260" y="224" width="6" height="14" rx="3" fill="#10b981"/>
    <text x="274" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">0.0% (租户瞬态密钥 AES-GCM 加密 🏆)</text>
    <rect x="260" y="242" width="240" height="14" rx="3" fill="#ef4444"/>
    <text x="508" y="254" fill="#f87171" font-size="11.5" font-weight="700">100.0% ✕</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#fecdd3" font-size="11.5" font-weight="700">💡 安全公理：防御缓存计时攻击唯一正确的办法是“命名空间密码学隔离”，绝不是“加随机睡眠”！</text>
  </g>

  <!-- Bottom Right: 3 Rules for Prefix Cache Security -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 多租户大模型 Prefix Cache 安全隔离三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：采用“公共系统根 + 租户 HMAC 私有子树”双层哈希链</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 平台官方预置的公共 System Prompt / 工具库（由平台签名）允许跨全租户共享根节点；</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">• 一旦进入用户/租户输入块，立即混入 `cache_salt = HMAC(tenant_secret, block_tokens)`！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：为每个活跃租户设置 `SLRU 保底页配额` 防驱逐探测</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 防止恶意租户故意发送海量垃圾长文把全局 HBM 塞满、通过观察自身块是否被踢出来反推</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  邻居租户的活跃度（Prime+Probe 攻击）；实施租户级容量配额隔离！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#e11d48" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fecdd3" font-size="13" font-weight="800">3️⃣ 铁律三：卸载至本地 NVMe / 共享存储的 KV 块必须走 `AES-256-GCM`</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• KV Cache 向量可被轻易逆向还原出 95%+ 原始明文单词！当 LMCache/Mooncake 将 KV 块</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  换出至宿主机 NVMe 或 3FS 时，必须使用内存中瞬态租户密钥做流式加密，租户下线即销毁密钥！</text>
  </g>
</svg>
