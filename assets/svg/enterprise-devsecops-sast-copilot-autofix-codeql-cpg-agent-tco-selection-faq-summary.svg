<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级 DevSecOps 代码安全审计 (SAST)、漏洞可利用性分析与自动修复 Agent 选型 (#438)</text>
  <text x="28" y="58" class="sub">为什么传统静态扫描 78% 的告警都是误报？为什么直接把代码喂给大模型修漏洞会有 34% 的补丁编译失败？</text>

  <!-- Left Panel: Legacy SAST Alert Fatigue vs CPG + LLM Triage + Sandbox Compiler Gate -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 传统 SAST 误报地狱 vs. 代码属性图 (CPG) + 编译沙箱验证补丁</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 失败做法：传统规则 SAST 盲扫 / 纯大模型盲扫整个代码仓</text>
  <text x="56" y="164" class="mono">• 传统 SAST：只要看见 SQL 拼接就报警，不管上游有没有过滤，误报率高达 78% ✕</text>
  <text x="56" y="184" class="mono">• 纯 LLM 修补丁：看不到跨文件类型定义，生成的补丁 34% 编译不过或破坏单测 ✕</text>
  <text x="56" y="202" class="txt">• 结果：安全团队积压 25,000 个历史告警无人理睬，漏洞平均修复周期 (MTTR) 长达 42 天！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：CodeQL/Semgrep + CPG 污点切片 + LLM 可利用性研判 + 沙箱编译重扫</text>
  <text x="56" y="272" class="mono">• 1. 精准提取 `Source -> Sanitizer -> Sink` 跨文件调用链切片 (仅 1.8K Token)</text>
  <text x="56" y="292" class="mono">• 2. 大模型研判上游拦截器是否生效，自动过滤 86% 不可利用的假阳性误报！</text>
  <text x="56" y="312" class="txt">• 3. 自动生成补丁并在隔离容器跑 `Build + Unit Test + CodeQL 复扫` 全绿后才推 PR！</text>

  <!-- Right Panel: 4 Enterprise AppSec & Vulnerability Autofix Architectures -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业代码安全与自动修复方案对标 (2,000 研发规模)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 传统规则 SAST + 人工安全工程师逐条排障修复</text>
  <text x="638" y="158" class="mono">• 误报率 78.0% ✕ | 补丁合并率 14% | 漏洞修复周期 42 天 | 综合成本 $145,000/月</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 纯大模型直接扫描文件并生成未经编译验证的补丁</text>
  <text x="638" y="214" class="mono">• 误报率 45.0% | 补丁编译通过率仅 66% ✕ | 漏洞修复周期 14 天 | $68,000/月</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 商业托管安全助手 (GitHub Copilot Autofix + GHAS CodeQL / Snyk DeepCode)</text>
  <text x="638" y="270" class="mono">• 误报率 12.5% | 补丁一次合并率 76% | 修复周期缩至 3.5 小时 | $98,000/月 ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: CodeQL/Joern CPG 污点切片 + 私有 32B 研判 + 沙箱编译测试闭环 (🏆旗舰)</text>
  <text x="638" y="326" class="mono">• 误报率压至 4.2% 🏆 | 补丁合并率 91.8% 🏆 | 修复周期 18 分钟 | 仅 $14,800/月 (-84.9%)!</text>

  <!-- Bottom Panel: End-to-End CPG Taint Slice + Compiler Sandbox Autofix Pipeline -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端代码属性图 (CPG) 污点切片与沙箱自验证修复流水线</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 增量 PR 污点追踪 (CodeQL / Joern)</text>
  <text x="56" y="464" class="mono">• 构建 AST + CFG + PDG 合一的</text>
  <text x="56" y="484" class="mono">  代码属性图 (Code Property Graph)</text>
  <text x="56" y="504" class="mono">• 沿数据流提取从 HTTP 入参 (Source)</text>
  <text x="56" y="524" class="mono">  到数据库/Shell 执行点 (Sink) 切片</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">10万行代码精准浓缩为 1.8K Token！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 可达性与可利用性研判 (Triage)</text>
  <text x="332" y="464" class="mono">• 结合 SCA 依赖图检查漏洞函数</text>
  <text x="332" y="484" class="mono">  在生产代码中是否真实被调用</text>
  <text x="332" y="504" class="mono">• 识别自定义鉴权/正则净化器</text>
  <text x="332" y="524" class="mono">• 自动静默归档 86% 不可达假告警</text>
  <text x="332" y="550" class="txt" fill="#34d399">让研发只收到真正可利用的高危漏洞！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 隔离沙箱编译与单测闭环验证</text>
  <text x="620" y="464" class="mono">• Coding Agent 生成最小 Diff 补丁后</text>
  <text x="620" y="484" class="mono">• 先在容器沙箱内跑 `Compiler +</text>
  <text x="620" y="504" class="mono">  Unit Tests + CodeQL 二次复扫`</text>
  <text x="620" y="524" class="mono">• 若报错则读取编译器报错自愈重试</text>
  <text x="620" y="550" class="txt" fill="#fde68a">绝不向开发者推送一行编译不过的代码</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ PR 一键采纳 (91.8% 合并率)</text>
  <text x="908" y="464" class="mono">• 在 Git PR 评论区直接附上通过</text>
  <text x="908" y="484" class="mono">  全套单测与安全复扫的绿色补丁</text>
  <text x="908" y="504" class="mono">• 开发者点击 `Commit suggestion`</text>
  <text x="908" y="524" class="mono">  即可在 18 分钟内完成高危清零</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">历史漏洞积压池 30 天清零率达 94%！</text>
</svg>
