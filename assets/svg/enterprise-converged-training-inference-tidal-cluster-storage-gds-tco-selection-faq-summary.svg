<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">第 460 篇里程碑：企业级训推一体潮汐共池、两阶段异步 Checkpoint 与超融合存储 (3FS/Lustre/WEKA) 总指南 (#460)</text>
  <text x="28" y="58" class="sub">为什么把训练池与推理池物理拆开会浪费 61% 的夜间算力？如何用“白天弹性 PD + 夜间 2.8s 潮汐训练 + 2.1s 快照”年省 $288 万？</text>

  <!-- Left Panel: Siloed Waste vs Converged Tidal AI Factory -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 物理隔离烟囱集群的“夜间空转 + 同步写盘停顿”双重浪费</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 传统烟囱建法 (Tier 1): 64卡独占推理池 + 64卡独占训练池 + 独立存储</text>
  <text x="56" y="164" class="mono">• 浪费 1: 推理池在晚 22:00 至早 08:00 负载跌破 15%，50 张 H200 整夜白白空转！</text>
  <text x="56" y="184" class="mono">• 浪费 2: 训练池每小时同步写 9TB Checkpoint 阻塞 GPU 达 225 秒，存储专网造价高昂</text>
  <text x="56" y="202" class="txt">• 结果: 128 卡全天综合有效利用率仅 38.5% ✕，年度总 TCO 高达 $456 万/年！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 终局架构 (Tier 4): 训推一体潮汐共池 + 超融合 3FS GDS + 2.1s 异步快照</text>
  <text x="56" y="272" class="mono">• 1. 昼夜潮汐复用: 夜间将 65% 推理副本切入 Level-1 Sleep，让渡 HBM 跑 GRPO/SFT/蒸馏</text>
  <text x="56" y="292" class="mono">• 2. 超融合 3FS + GDS: 聚合计算节点自带本地 NVMe 跑出 2.34 TB/s，免购百万美元存储柜</text>
  <text x="56" y="312" class="txt">• 3. 两阶段异步快照: 9TB 状态 2.1s 拷入 Host Pinned DRAM，24h 利用率冲上 93.4% 🏆</text>

  <!-- Right Panel: 4 Cluster & Storage Architecture Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四档 128 卡企业训推与存储底座实测对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 训推物理隔离烟囱集群 + 同步写 NFS/Ceph Checkpoint</text>
  <text x="638" y="158" class="mono">• 24h 利用率: 38.5% ✕ | 9TB 快照停顿: 225.0s ✕ | 年度总 TCO: $456.0 万/年</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 共享 K8s 集群 (销毁/重建 Pod 切换训推) + 独立 Lustre 存储柜</text>
  <text x="638" y="214" class="mono">• 24h 利用率: 64.0% | 9TB 快照停顿: 42.0s | 潮汐切换耗时: 95s ($318.0 万/年)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: Kueue 抢占调度 + 两阶段异步 DRAM 快照 + WEKA/Lustre GDS</text>
  <text x="638" y="270" class="mono">• 24h 利用率: 82.5% ✓ | 9TB 快照停顿: 3.1s ✓ | 潮汐切换: 18.5s ($234.0 万/年)</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 训推潮汐共池 (2.8s Sleep 切换) + 超融合 3FS GDS + 2.1s 异步快照 (🏆)</text>
  <text x="638" y="326" class="mono">• 24h 利用率: 93.4% 🏆 | 快照停顿: 2.1s 🏆 | 年度 TCO: $168.0 万 (年省 $288 万)!</text>

  <!-- Bottom Panel: Daytime/Nighttime Tidal Cycle, 2-Stage Checkpoint, 3FS vs Lustre/WEKA -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 训推潮汐 24 小时闭环调度、两阶段异步 Checkpoint 与三大并行文件系统选型</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 24 小时训推潮汐无缝接力时钟</text>
  <text x="56" y="464" class="mono">• 08:30–21:30 (日间洪峰): 85% 算力跑弹性 PD</text>
  <text x="56" y="484" class="mono">  在线推理服务，保障 &lt;400ms TTFT &amp; &lt;14ms TPOT</text>
  <text x="56" y="504" class="mono">• 21:30–08:30 (夜间低谷): KEDA 自动将空闲推理</text>
  <text x="56" y="524" class="mono">  Pod 切入 Level-1 Sleep，Kueue 拉起 GRPO/SFT</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">早高峰突袭时 2.1s 保存训练快照 + 2.8s 唤醒推理！</text>

  <rect x="418" y="414" width="368" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="432" y="440" class="txt" font-weight="700" fill="#34d399">② 两阶段异步 Checkpoint (225s -&gt; 2.1s)</text>
  <text x="432" y="464" class="mono">• 阶段 1 (D2H 显存到本机锁页主存): 16 台节点</text>
  <text x="432" y="484" class="mono">  并行经 PCIe Gen5 (450GB/s/机) 将 9TB 训练状态</text>
  <text x="432" y="504" class="mono">  拷入 Host Pinned DRAM，GPU 仅停顿 2.1 秒即继续！</text>
  <text x="432" y="524" class="mono">• 阶段 2 (后台异步刷盘): 后台线程慢速写 3FS/Lustre</text>
  <text x="432" y="550" class="txt" fill="#34d399">彻底消除写盘对 GPU 训练 MFU 与潮汐让渡的阻塞 🏆</text>

  <rect x="806" y="414" width="350" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="820" y="440" class="txt" font-weight="700" fill="#fde68a">③ 3FS vs. Lustre vs. WEKA 存储选型</text>
  <text x="820" y="464" class="mono">• DeepSeek 3FS (超融合): 零专有存储硬件费，直接</text>
  <text x="820" y="484" class="mono">  用计算节点自带的 8 块 NVMe + RDMA 聚合成池</text>
  <text x="820" y="504" class="mono">• Lustre (DDN EXAScaler): 超算万卡独立存储标杆</text>
  <text x="820" y="524" class="mono">• WEKA / VAST: 云原生多协议 (POSIX+S3) 混合首选</text>
  <text x="820" y="550" class="txt" fill="#fde68a">16~256 节点优先开启超融合 3FS + GDS 立省 $80万！</text>
</svg>
