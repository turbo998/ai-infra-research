<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#663 企业知识图谱 RAG 选型 (GraphRAG vs. LazyGraphRAG vs. Hybrid Vector RAG)：建库成本削减 99% 与双轨路由</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">GraphRAG Sizing (10M Chunks): Full LLM GraphRAG ($18,000 Index, 4.2s Query) vs. LazyGraphRAG + 82/18 Router ($160 Index, 0.38s Avg, 92.8% Acc)</text>

  <!-- Left: Why Naive Full-LLM GraphRAG Indexing Bankrupts Projects -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-size="15" font-weight="700">① 为什么初代全量 GraphRAG 建库成本高出向量库 110 倍？</text>

  <rect x="40" y="150" width="333" height="150" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 全量 LLM 抽三元组 + 社区摘要的算力黑洞 (1,000万切片)</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">· 每个 `512-Token` 文本块需调 LLM 抽取实体/关系 + 补抽 Gleaning</text>
  <text x="52" y="214" fill="#CBD5E1" font-size="12">  + Leiden 社区层级摘要：单块消耗高达 **`4,500 LLM Tokens`**！</text>
  <text x="52" y="234" fill="#FCA5A5" font-size="12" font-weight="700">· 1,000 万块建库总 Token = `450 亿 Tokens (45B)` (`$18,000`！)</text>
  <text x="52" y="254" fill="#CBD5E1" font-size="12">· 查询更慢：Global Search 需并发 Map-Reduce 几百个社区摘要，</text>
  <text x="52" y="274" fill="#FCA5A5" font-size="11" font-weight="700">  单次查询烧掉 `68,000 Tokens`，延迟高达 `4.2 秒` ($0.032/次)！</text>

  <rect x="40" y="312" width="333" height="166" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="334" fill="#6EE7B7" font-size="13" font-weight="700">✅ 破局：LazyGraphRAG (零 LLM 建图 + 查询时按需迭代展开)</text>
  <text x="52" y="356" fill="#F8FAFC" font-size="12">1. **建库期 (0 LLM Token)**：利用极速 NLP 名词短语提取 +</text>
  <text x="52" y="374" fill="#D1FAE5" font-size="11">   共现关系构建概念图 + BGE-M3 向量编码，建库成本仅 **`$160 (-99.1%)`**！</text>
  <text x="52" y="396" fill="#F8FAFC" font-size="12">2. **查询期 (Iterative Best-First Subgraph)**：仅对真正需要</text>
  <text x="52" y="414" fill="#D1FAE5" font-size="11">   跨文档总结的查询，动态沿共现子图做局部社区展开 (`8,200 tok/次`)</text>
  <text x="52" y="436" fill="#6EE7B7" font-size="12" font-weight="700">🎯 收益：多跳推理准确率达 `92.8%` (追平全量 GraphRAG 的 93.1%)，</text>
  <text x="52" y="454" fill="#A7F3D0" font-size="11">   但建库便宜 112 倍、增量文档秒级实时入图无需重算全局社区！</text>

  <!-- Center: 82/18 Query Complexity Router -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 企业 RAG 双轨复杂度路由 (82% 向量 + 18% 图谱)</text>

  <rect x="423" y="150" width="354" height="148" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="435" y="172" fill="#38BDF8" font-size="13" font-weight="700">🔍 为什么 82% 的企业查询根本不需要走 GraphRAG？</text>
  <text x="435" y="194" fill="#F1F5F9" font-size="12">· **Track 1 (单跳事实/条款查询 · 占企业流量 82%)**：</text>
  <text x="435" y="214" fill="#CBD5E1" font-size="11">  例：“差旅报销五星级酒店单晚限额是多少？”、“错误码 XID-79 含义？”</text>
  <text x="435" y="234" fill="#6EE7B7" font-size="12" font-weight="700">  → 直接走 `#646 DiskANN + BM25 RRF + FP8 Reranker`：</text>
  <text x="435" y="254" fill="#D1FAE5" font-size="12">  检索耗时仅 **`18.4 ms`**，准确率 **`94.5%`**，单次仅 `2,560 Tokens`！</text>
  <text x="435" y="274" fill="#94A3B8" font-size="11">  (若蠢到拿 GraphRAG 跑单跳查询：不仅慢 20 倍，准确率还因摘要泛化降 4%)</text>

  <rect x="423" y="310" width="354" height="168" rx="8" fill="#0F172A" stroke="#A78BFA"/>
  <text x="435" y="332" fill="#C4B5FD" font-size="13" font-weight="700">🕸️ 哪 18% 的查询必须走 LazyGraphRAG / 子图多跳？</text>
  <text x="435" y="354" fill="#F1F5F9" font-size="12">· **Track 2A (多跳关联追踪 · 占 12%)**：</text>
  <text x="435" y="372" fill="#CBD5E1" font-size="11">  例：“供应商 A 停产的芯片会影响我们哪几款在研车型的交付里程碑？”</text>
  <text x="435" y="390" fill="#6EE7B7" font-size="11" font-weight="700">  → 走 2-Hop 实体关系图谱游走 (`PPR 个性化 PageRank`)，耗时 `42 ms`</text>
  <text x="435" y="412" fill="#F1F5F9" font-size="12">· **Track 2B (全局跨百篇文档归纳 · 占 6%)**：</text>
  <text x="435" y="430" fill="#CBD5E1" font-size="11">  例：“总结本季度全部 5,000 份客户投诉工单的三大共性根因变化趋势”</text>
  <text x="435" y="448" fill="#6EE7B7" font-size="11" font-weight="700">  → 走 `LazyGraphRAG` 概念社区迭代归约 (`1.45s`，准确率从 61.2% 跃升至 92.8%)</text>

  <!-- Right: 3-Architecture Comparison Matrix -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="829" y="136" fill="#FDE68A" font-size="15" font-weight="700">③ 三大知识检索架构全景实测 (1,000万块 · 100 QPS)</text>

  <rect x="827" y="150" width="333" height="98" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="839" y="172" fill="#38BDF8" font-size="13" font-weight="700">1. 纯混合向量 RAG (DiskANN + BM25 + Reranker)</text>
  <text x="839" y="192" fill="#E2E8F0" font-size="12">· 建库成本: `$140` | 单跳准确率: `94.5%` | **多跳/全局: `61.2%`**</text>
  <text x="839" y="212" fill="#E2E8F0" font-size="12">· 平均延迟: `210 ms` | 单查询成本: `$0.0014`</text>
  <text x="839" y="232" fill="#FDE68A" font-size="11">· 局限：Top-5 切片局部视角无法回答跨全库统计/多跳链路问题</text>

  <rect x="827" y="260" width="333" height="98" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="839" y="282" fill="#FCA5A5" font-size="13" font-weight="700">2. 初代全量 LLM GraphRAG (全量抽图 + Global MapReduce)</text>
  <text x="839" y="302" fill="#E2E8F0" font-size="12">· 建库成本: **`$18,000`** | 多跳准确率: `93.1%`</text>
  <text x="839" y="322" fill="#FCA5A5" font-size="12" font-weight="700">· 平均延迟: `4,200 ms` | 单查询成本: **`$0.0320` (贵 22.8 倍!)**</text>
  <text x="839" y="342" fill="#FCA5A5" font-size="11">· 局限：新文档入库需重跑社区聚类，无法用于高频实时更新知识库</text>

  <rect x="827" y="370" width="333" height="108" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="839" y="392" fill="#6EE7B7" font-size="13" font-weight="700">3. 82/18 智能路由 (Hybrid Vector + LazyGraphRAG)</text>
  <text x="839" y="412" fill="#F8FAFC" font-size="12">· 建库成本: **`$160 (-99.1%)`** | 增量文档秒级实时入库</text>
  <text x="839" y="432" fill="#D1FAE5" font-size="12">· 单跳准确率: **`94.5%`** | 多跳/全局准确率: **`92.8% (+31.6 pts)`**</text>
  <text x="839" y="452" fill="#6EE7B7" font-size="12" font-weight="700">· 加权平均延迟: `380 ms (-91.0%)` | 成本仅 **`$0.0024/次 (-92.5%)`**</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 知识图谱 RAG (GraphRAG) 选型铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 严禁对千万级动态文档库盲跑全量 LLM 三元组抽取：采用 `LazyGraphRAG (NLP 概念共现建图)` 将建库 Token 成本削减 99.1% ($18,000 → $160)；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 实施 82/18 双轨查询分流：82% 单跳事实查询走 18.4ms 混合向量检索，仅 18% 跨文档关系/全局归纳查询走图谱子图展开，兼得 94% 精度与百毫秒延迟。</text>
</svg>
