<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级智能制造、工业视觉质检 (AOI) 与预测性维护 (PHM) 平台选型：边缘 IGX/Jetson + 云端协同 (#429)</text>
  <text x="28" y="58" class="sub">为什么产线 15ms 硬实时吹气剔除绝对不能调云端 API？为什么新产线冷启动缺负样本时用 PatchCore 正样本记忆库 + VLM 复判最准？</text>

  <!-- Left Panel: Hard Real-Time 15ms PLC Deadline & Zero-Defect Cold-Start Problem -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 工业 AI 两大特殊边界：15ms 产线硬实时 PLC 剔除 &amp; 零缺陷样本冷启动</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 误区 A (产线直调云端 VLM) &amp; 误区 B (把 10kHz 原始振动波形文字喂给 LLM)</text>
  <text x="56" y="164" class="mono">• 产线传送带速度 2m/s：从工业相机拍照到气阀吹除缺陷件仅容许 &lt;= 15ms 硬实时抖动！</text>
  <text x="56" y="184" class="mono">• 云端 API 往返 450ms 时缺陷件早已流入下一道封装工序，且断网即停产！</text>
  <text x="56" y="202" class="txt">• 同样，把 PLC 传感器的数万个浮点数转成文本塞进 LLM 猜设备故障，准确率仅 52%！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：边缘 TensorRT (PatchCore+YOLO 6.8ms) + 复判机台 VLM + 时序模型 PHM</text>
  <text x="56" y="272" class="mono">• L1 产线硬实时 (6.8ms)：边缘工控机跑 PatchCore (仅需 50 张良品图即可上线!) + YOLOv11</text>
  <text x="56" y="292" class="mono">• L2 疑似件缓冲区复判 (5% 灰区)：气阀分流至复判台，由 Qwen2.5-VL 消灭 85% 过杀误报！</text>
  <text x="56" y="312" class="txt">• 设备 PHM：频域 FFT + 时序大模型 (Chronos/TimesFM) 预警，LLM 负责自动查手册派发 SAP PM 工单！</text>

  <!-- Right Panel: 4 Industrial AI Architectures Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大制造企业 AOI 质检与设备维护架构横向对标 (20 条高速产线)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fde68a">Tier 1: 传统规则算法 AOI (OpenCV 阈值) + 定期停机预防性保养</text>
  <text x="638" y="158" class="mono">• 延迟 4.2ms | 但反光/纹理变化导致过杀率高达 28.5% (需大量复检员) | 年综合损失 $185万 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fca5a5">Tier 2: 产线图片全量上送云端多模态大模型 API 同步判别</text>
  <text x="638" y="214" class="mono">• 延迟 520ms (错过 15ms 气阀窗口 ✕) | 网络抖动即停线 | 年 API 与停线损失 $240万 ✕</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 纯边缘有监督 CNN/YOLO (需攒齐 5,000 张缺陷样本才能上线)</text>
  <text x="638" y="270" class="mono">• 换产冷启动需 6 周攒样本 ✕ | 未知新缺陷漏检率 4.2% | 年综合成本 $68万</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 边缘 PatchCore+YOLO (6.8ms) + 5% 灰区 VLM 复判 + 时序 PHM + SAP 工单 Agent (🏆)</text>
  <text x="638" y="326" class="mono">• 50张良品图当天换产 🏆 | 漏检 &lt;0.05% | 过杀降至 1.2% 🏆 | 年综合成本仅 $24万 (-87%)!</text>

  <!-- Bottom Panel: End-to-End Smart Factory Dual-Loop Architecture -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端智慧工厂双闭环参考架构：微秒/毫秒级 OT 边缘控制环 + 秒级 IT 大模型复判与维修工单环</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">① 产线 OT 硬实时环 (&lt;=15ms · NVIDIA IGX/Orin)</text>
  <text x="58" y="464" class="mono">• 工业相机 CoaXPress/GigE 直通 GPU 显存</text>
  <text x="58" y="484" class="mono">• TensorRT INT8 跑 `PatchCore (良品特征库)` +</text>
  <text x="58" y="504" class="mono">  `YOLOv11`：耗时仅 6.8ms！</text>
  <text x="58" y="524" class="mono">• 95% 明确良品直接放行；5% 疑似件吹入复判滑道</text>
  <text x="58" y="550" class="txt" fill="#6ee7b7">50 张良品图 2 小时完成新产品换线冷启动！</text>

  <rect x="422" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="438" y="440" class="txt" font-weight="700" fill="#34d399">② 车间复判环 (&lt;=800ms · 中心 L40S 跑 Qwen2.5-VL)</text>
  <text x="438" y="464" class="mono">• 仅针对被吹入缓冲滑道的 5% 疑似缺陷件：</text>
  <text x="438" y="484" class="mono">• 7B/72B VLM 结合工艺图纸与历史黄金样本对比</text>
  <text x="438" y="504" class="mono">• 精准区分“无害水渍/反光”与“真实微裂纹”</text>
  <text x="438" y="524" class="mono">• 将传统 AOI 28.5% 的过杀率压降至 1.2%！</text>
  <text x="438" y="550" class="txt" fill="#34d399">每条产线裁撤 4 名人工目检复核员！</text>

  <rect x="802" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="818" y="440" class="txt" font-weight="700" fill="#d8b4fe">③ 设备预测性维护环 (时序模型 + SAP PM Agent)</text>
  <text x="818" y="464" class="mono">• 边缘采集振动/电流做 FFT 包络谱特征提取</text>
  <text x="818" y="484" class="mono">• 时序基础模型 (Chronos/TimesFM) 预测轴承剩余</text>
  <text x="818" y="504" class="mono">  寿命 RUL &lt; 72 小时触发预警</text>
  <text x="818" y="524" class="mono">• LLM Agent 自动查维修手册、锁备件并建 SAP 工单</text>
  <text x="818" y="550" class="txt" fill="#fde68a">非计划停机时间减少 78%，备件周转率提升 2.4x！</text>
</svg>
