  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">成功率 95.6% · 成本暴降 95.1%</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">大模型只做 DAG 规划，8B 蒸馏工兵调工具</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">大小模型协同终局 (4.2秒跑完 8 步)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">78% 的工具填参步驟交由 8B FP8 极速执行，</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">且严格追加式历史实现 94% KV 缓存复用 🏆</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单次消耗 Token: <tspan fill="#34d399" font-weight="800">24,000 Tokens (94% 命中缓存 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 任务完成成功率: <tspan fill="#34d399" font-weight="800">95.6% (+37.2 pts 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 端到端耗时: <tspan fill="#34d399" font-weight="800">4.2 秒 (提速 6.76x 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 20万次月度成本: <tspan fill="#34d399" font-weight="800">$11,600 / 月 (-95.1% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 企业高并发生产级 Agentic 平台终局</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：构建生产级企业 Agent 平台的三大工程基石（为什么 Demo 好写、上生产必重构？）</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🛠️ 基石 1：MCP 工具语义预检索（严禁单次塞入 &gt;15 个工具）</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 当企业接入上百个 MCP Server（ERP、CRM、GitHub、数据库）时，绝不能把全部</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  工具 JSON Schema 硬塞进 System Prompt（不仅每步白烧 3.6万 Token，还让准确率跌到 58%）；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 必须前置 **MCP 语义工具路由器**：按任务意图毫秒级检索 Top-8 工具动态挂载！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🧠 基石 2：“70B 总设计师 + 8B 执行工兵”与追加式 KV 缓存纪律</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 8 步工作流里，只有第 1 步拆解计划和异常恢复需要调昂贵的 `70B / DeepSeek-R1 / GPT-4o`；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 中间 6 步“按计划组装 JSON 参数调 API”全部交给微调 `8B SLM`（快 4 倍、便宜 10 倍）；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• **严禁每步修改历史消息**！保持消息列表严格追加（Append-Only），让 KV 缓存命中率达 94% 🏆！</text>
</svg>
