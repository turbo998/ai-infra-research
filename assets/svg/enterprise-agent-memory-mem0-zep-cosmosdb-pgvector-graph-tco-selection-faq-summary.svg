<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级智能体长效记忆 (Agentic Memory) 选型：Mem0/Zep vs. Letta vs. Cosmos DB vs. Postgres+AGE (#424)</text>
  <text x="28" y="58" class="sub">为什么把 50 次历史聊天全塞进 128K 窗口会又贵又蠢？为什么纯向量记忆库遇到“客户搬家/改偏好”会精神分裂？</text>

  <!-- Left Panel: Full-Context Stuffing & Append-Only Vector Trap vs Bi-Temporal Fact Graph -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 智能体记忆三大死穴：128K 硬塞破产 vs. 纯向量新旧冲突 vs. 双时态图谱</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 死穴一 (128K 全量硬塞) &amp; 死穴二 (只追加不更新的纯向量库 Append-Only Vector)</text>
  <text x="56" y="164" class="mono">• 128K 硬塞：每轮携带 80K 历史闲聊，单轮成本 $0.16，且触发 Lost-in-the-Middle 遗忘</text>
  <text x="56" y="184" class="mono">• 纯向量库：1月存入“客户住北京”，5月存入“客户搬去上海”-&gt; Top-K 把两条同时召回，</text>
  <text x="56" y="202" class="txt">  大模型当场精神分裂（时序冲突消解准确率跌至 58.4%）！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：三层认知记忆 (Core Block + Mem0/Zep 双时态事实图谱 + 情景归档)</text>
  <text x="56" y="272" class="mono">• L1 驻留核心块 (Core Memory 400 Tok)：常驻 System Prompt 尾部，记录当前画像快照</text>
  <text x="56" y="292" class="mono">• L2 双时态事实图谱 (Bi-Temporal Edge)：新事实写入时自动将旧边标记 `t_invalid = now()`</text>
  <text x="56" y="312" class="txt">• 结果：每轮仅注入 950 Tokens (-98.4%)，跨月状态更新准确率从 58.4% 跃升至 94.8%！</text>

  <!-- Right Panel: 4 Agentic Memory Platforms Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业智能体记忆存储与框架横向对标 (1,000 万活跃用户 · 5,000 万会话/月)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 64K~128K 历史聊天记录全量硬塞窗口 (Full-History Context Stuffing)</text>
  <text x="638" y="158" class="mono">• 单轮 64,000 Tok ✕ | 时序冲突准确率 66.2% ✕ | 月度成本 $192,000/月 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 朴素只追加向量库 (Naive Append-Only Vector Memory)</text>
  <text x="638" y="214" class="mono">• 单轮 2,400 Tok | 新旧事实同时召回打架 (准确率仅 58.4% ✕) | $18,500/月</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 云原生多模托管库 (Azure Cosmos DB DiskANN + Graph + Mem0 抽取层)</text>
  <text x="638" y="270" class="mono">• 全球多活 &lt;10ms 读写 + 租户分区隔离 | 准确率 93.2% ✓ | $14,800/月 ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 双时态图谱引擎 (Zep/Graphiti 或 Mem0) + Postgres (pgvector + Apache AGE) (🏆)</text>
  <text x="638" y="326" class="mono">• 单轮仅 950 Tok (-98.5%) 🏆 | 时序冲突准确率 94.8% 🏆 | 月度总成本仅 $7,600 (-96%)!</text>

  <!-- Bottom Panel: Bi-Temporal Edge Invalidation & Async Memory Consolidation -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端智能体三层认知记忆参考架构：同步 12ms 极速召回 + 后台异步 8B 小模型冲突合并</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">① 在线热路径：12ms 混合记忆召回 (0 阻塞)</text>
  <text x="58" y="464" class="mono">• 读取 Redis 核心画像块 (Core Block 400 Tok)</text>
  <text x="58" y="484" class="mono">• 查询双时态图谱活跃边：`WHERE t_invalid IS NULL`</text>
  <text x="58" y="504" class="mono">  自动过滤已过期的历史旧地址/旧手机号/旧预算</text>
  <text x="58" y="524" class="mono">• 总计仅拼入 950 Tokens，首字延迟降低 82%！</text>
  <text x="58" y="550" class="txt" fill="#6ee7b7">主对话链路绝不等待慢速的记忆抽取大模型！</text>

  <rect x="422" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="438" y="440" class="txt" font-weight="700" fill="#34d399">② 后台异步记忆提炼器 (Async 8B Consolidator)</text>
  <text x="438" y="464" class="mono">• 会话回复完成后，通过 Kafka 异步触发 8B 小模型</text>
  <text x="438" y="484" class="mono">• 抽取三元组 `(User_A, lives_in, Shanghai)`</text>
  <text x="438" y="504" class="mono">• 检测到与旧边 `(User_A, lives_in, Beijing)` 互斥：</text>
  <text x="438" y="524" class="mono">• 执行 `UPDATE edge SET t_invalid = NOW()` 并插入新边</text>
  <text x="438" y="550" class="txt" fill="#34d399">既保留“曾住北京”历史审计轨迹，又确保当前状态唯一！</text>

  <rect x="802" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="818" y="440" class="txt" font-weight="700" fill="#d8b4fe">③ GDPR 被遗忘权与多租户物理隔离</text>
  <text x="818" y="464" class="mono">• 所有记忆节点与向量必须强制绑定 `user_id` 分区键</text>
  <text x="818" y="484" class="mono">• 严禁将客户 A 的私密偏好混入全局共享少样本池</text>
  <text x="818" y="504" class="mono">• 用户发起注销时：按 `user_id` 一键硬删除全部</text>
  <text x="818" y="524" class="mono">  图节点、向量与 Redis 缓存 (&lt;50ms 物理擦除)</text>
  <text x="818" y="550" class="txt" fill="#fde68a">单库 PostgreSQL (pgvector+AGE) 搞定向量+图谱+ACID！</text>
</svg>
