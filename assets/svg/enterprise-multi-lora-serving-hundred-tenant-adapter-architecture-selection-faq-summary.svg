<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad393" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad393" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad393)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级多 LoRA 动态服务 (Multi-LoRA Serving) 与百租户微调模型共享底座选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：适配器亲和路由 + 锁页主机内存 (Pinned DRAM) 全量驻留 + 跨租户混合 Batch，将 120 个微调模型从 120 张卡压至 8 张卡 (省 93.3%)</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 393 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 每模型独立部署底座</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 把 LoRA merge 进底座变成 120 个大模型</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 每个模型独占 1 张 GPU (共 120 张卡!)</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 集群平均算力利用率：仅 8.5% ✕</text>
  <text x="40" y="232" fill="#34d399" font-size="12" font-weight="700">• P99 首字延迟：240 ms</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 90% 长尾租户半小时才调 1 次 ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">120模型月成本：$336,000 (120卡)✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">大坑：一旦执行 `merge_and_unload()`</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">160MB 的轻量适配器瞬间膨胀成 70GB 巨兽！</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 合并权重磁盘按需热切</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 8 张卡轮流从磁盘卸载/加载整套大模型</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 每次换租户都要搬运几十 GB 完整权重</text>
  <text x="332" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 切换停顿耗时：18,200 ms (18.2s) ✕</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• P99 首字延迟：18,500 ms ✕</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• 所需显卡：8 张 (利用率 32.0%)</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">120模型月成本：$22,400 (卡死不可用)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">痛点：PCIe 与磁盘被频繁切模型彻底打满</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">在线交互式业务完全无法接受 18 秒等待</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 基础 Multi-LoRA + 轮询</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• vLLM `--enable-lora` 共享冻结底座</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 网关按 Round-Robin 把 120 个适配器打散</text>
  <text x="624" y="212" fill="#fde68a" font-size="12" font-weight="700">• 适配器缺页加载耗时：420 ms</text>
  <text x="624" y="232" fill="#7dd3fc" font-size="12" font-weight="700">• P99 首字延迟：680 ms ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 所需显卡：12 张 (利用率 58.0%)</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">120模型月成本：$33,600 (省 90.0%)✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：&lt;= 20 个适配器的标准多 LoRA 基线</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：超百个适配器时随机轮询引发缓存抖动</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 亲和路由+锁页DRAM+S-LoRA🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 120个适配器 (19.2GB) 全驻留 Pinned DRAM</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 网关按 lora_id 一致性哈希亲和路由</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 适配器切换延迟：仅 1.8 ms 🏆 (零磁盘IO)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• P99 首字延迟：215 ms 🏆 (快 3.16x vs T3)</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• 所需显卡：仅 8 张 🏆 (利用率 82.0%)</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">120模型月成本：$22,400 (省 93.3%)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级百租户定制模型中台终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">16 个不同租户的微调请求合并进同一个 Batch！</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么“绝对禁止把 LoRA 权重 Merge 进底座模型”？架构师必懂的三大 Multi-LoRA 核心机制</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad393)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 跨租户混合批处理（Heterogeneous Mixed-LoRA Batching）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 只要不合并权重（保持 $Y = X W_{\text{base}} + X A_i B_i$ 分离）：</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 租户 1 的法律请求、租户 2 的医疗请求、租户 3 的金融请求</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  可以拼进同一个 Batch 共享 99% 的 $X W_{\text{base}}$ 底座矩阵乘！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 最后只花 1% 算力并行叠加各自 160MB 的 $A_i B_i$ 增量！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 锁页主机内存池（Pinned Host-DRAM 100% 装下百个适配器）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 1 个 `rank=16` 的 LoRA 仅 `160 MB`，`120 个`加起来才 **`19.2 GB`**！</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 服务器自带 `512 GB` DDR5 内存：调大 `--max-cpu-loras 120`</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  把全部 120 个适配器永远钉死在锁页内存 (Pinned RAM) 中，</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 换入显存走 PCIe Gen5 DMA 仅需 `1.8 ms`，彻底消灭磁盘 IO！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 网关 `lora_id` 亲和路由与统一微调规范</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 网关按请求中的 `model="finance-lora-v2"` 做带权一致性哈希，</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">  让每个 Pod 固定承接 15~20 个常驻 HBM 显存槽（`max_loras=16`）。</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• 强制全公司微调任务统一冻结同一版本底座、统一 `max_lora_rank &lt;= 32`，</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  即可在不增加 1 张显卡的前提下无限横向挂载新业务微调模型！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 393 合成标定算例 (independently_reproduced=false)</text>
</svg>
