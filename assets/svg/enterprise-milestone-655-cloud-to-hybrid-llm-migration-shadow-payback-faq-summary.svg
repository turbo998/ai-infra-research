<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="44" y="50" fill="#FDE68A" font-size="19" font-weight="700">🏆 #655 里程碑：企业从公有云 API ($18万/月) 平滑迁移至混合自建 K8s 四阶段双跑与 5.4 个月回本宝典</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">Milestone #655 Cloud-to-Hybrid LLM Migration: 4-Phase Shadow Canary · Prompt/Schema Parity (99.3%) · $180K/mo → $54.5K/mo (5.4-Mo Payback)</text>

  <!-- Left: Why "Big-Bang Cutover" Fails & The 4-Phase Migration Funnel -->
  <rect x="24" y="108" width="380" height="385" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="42" y="136" fill="#38BDF8" font-size="15" font-weight="700">① 为什么“一刀切替换”必出事故？四阶段零停机迁移法</text>

  <rect x="40" y="150" width="348" height="76" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="52" y="170" fill="#38BDF8" font-size="13" font-weight="700">Phase 1 (第 1–2 周)：网关统一收口 + 10% 异步影子双跑</text>
  <text x="52" y="190" fill="#E2E8F0" font-size="11">· 100% 生产流量仍由云端 API 响应，网关异步镜像 10% 真实流量</text>
  <text x="52" y="208" fill="#6EE7B7" font-size="11">· 自动采集 `Golden Dataset (10,000 条真实输入/输出)` 零业务风险</text>

  <rect x="40" y="236" width="348" height="82" rx="8" fill="#0F172A" stroke="#A78BFA"/>
  <text x="52" y="256" fill="#C4B5FD" font-size="13" font-weight="700">Phase 2 (第 3–4 周)：Prompt 语法对齐 + LoRA 蒸馏补齐</text>
  <text x="52" y="276" fill="#E2E8F0" font-size="11">· 消除模型习惯差异 (如 JSON 转义、Markdown 标签)：开 `XGrammar`</text>
  <text x="52" y="294" fill="#E2E8F0" font-size="11">· 用 Phase 1 黄金样本跑 `2×H200 LoRA SFT`，对齐率从 `88.4% → 99.3%`！</text>

  <rect x="40" y="328" width="348" height="72" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="52" y="348" fill="#FDE68A" font-size="13" font-weight="700">Phase 3 (第 5–6 周)：按任务复杂度分级灰度 (`5% → 35% → 65%`)</text>
  <text x="52" y="368" fill="#E2E8F0" font-size="11">· 先切离线批处理 (`P2`) 与内部 RAG (`P1`)，最后切外部核心客服 (`P0`)</text>
  <text x="52" y="386" fill="#6EE7B7" font-size="11">· 网关配置 `800ms TTFT` 自动回退云端 API 保险丝 (零用户感知)</text>

  <rect x="40" y="410" width="348" height="70" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="430" fill="#6EE7B7" font-size="13" font-weight="700">Phase 4 (第 7 周起)：65% 自建基座 + 20% PTU + 15% 云爆发稳态</text>
  <text x="52" y="450" fill="#F8FAFC" font-size="11">· 自建集群常年跑在 `88%` 满载甜点区，尖峰流量零 KV 出网溢流云端</text>
  <text x="52" y="468" fill="#6EE7B7" font-size="11" font-weight="700">· 月账单从 `$180,000` 骤降至 `$54,500 (-69.7%)`，年省 `$150.6万`！</text>

  <!-- Center: Prompt & Behavioral Parity Matrix -->
  <rect x="420" y="108" width="374" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="438" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 闭源云 API 迁开源权重 (DeepSeek/Qwen) 三大兼容坑</text>

  <rect x="436" y="150" width="342" height="104" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="448" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 坑 1：直接原封不动照搬为 GPT-4 调优的 Prompt</text>
  <text x="448" y="192" fill="#F1F5F9" font-size="12">· 不同模型家族对 System/User 角色权重、Tool Call 模板</text>
  <text x="448" y="212" fill="#CBD5E1" font-size="12">  及思维链触发词敏感度不同，裸迁直接导致业务评测掉点 `-11.2%`</text>
  <text x="448" y="232" fill="#6EE7B7" font-size="12" font-weight="700">· 处方：自动化 Prompt 编译对齐 (`DSPy/MIPRO`) + `XGrammar` 强约束</text>

  <rect x="436" y="266" width="342" height="104" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="448" y="288" fill="#38BDF8" font-size="13" font-weight="700">🔍 坑 2：Embedding 向量库空间不兼容 (切忌换主模型连带重刷库)</text>
  <text x="448" y="308" fill="#F1F5F9" font-size="12">· 生成模型 (`Chat LLM`) 与检索向量模型 (`Embedding`) 完全解耦！</text>
  <text x="448" y="328" fill="#CBD5E1" font-size="12">· 迁移第一阶段保持原有向量库不动，或用蓝绿双集合异步后台</text>
  <text x="448" y="348" fill="#6EE7B7" font-size="12" font-weight="700">  重刷 `BGE-M3` 索引，严禁停机重建十亿级向量索引！</text>

  <rect x="436" y="382" width="342" height="98" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="448" y="404" fill="#6EE7B7" font-size="13" font-weight="700">✅ 坑 3：准入护栏标准 (`LLM-as-a-Judge >= 99.0%` 等价率)</text>
  <text x="448" y="424" fill="#D1FAE5" font-size="12">· 影子双跑期间自动对比：1) JSON Schema 合规率 `100%`；</text>
  <text x="448" y="444" fill="#D1FAE5" font-size="12">  2) 事实一致性 `>= 99.3%`；3) `P95 TTFT` 比云 API 快 `1.8x`</text>
  <text x="448" y="464" fill="#6EE7B7" font-size="11" font-weight="700">  三项全绿后，网关自动按每 24 小时 +20% 步长切流上线！</text>

  <!-- Right: CapEx Payback Period Math (5.4 Months) -->
  <rect x="810" y="108" width="366" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="828" y="136" fill="#FDE68A" font-size="15" font-weight="700">③ 财务 CFO 最关心的投资回收期 (Payback) 手算</text>

  <rect x="826" y="150" width="334" height="152" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="838" y="172" fill="#FDE68A" font-size="13" font-weight="700">📐 案例：日均 150 亿 Tokens (450B/月) 中大型企业</text>
  <text x="838" y="194" fill="#F1F5F9" font-size="12">· 迁移前纯公有云账单：`450,000M × $0.40 =` **`$180,000 / 月`**</text>
  <text x="838" y="214" fill="#CBD5E1" font-size="12">· 混合架构改造 (`24× H200` 自建承接 65% 基座 + 夜间批处理)：</text>
  <text x="838" y="234" fill="#D1FAE5" font-size="12">  · 自建集群一次性硬件 CapEx (或 3 年融资租赁): `$678,000`</text>
  <text x="838" y="254" fill="#D1FAE5" font-size="12">  · 自建月度电费/机柜运维 (`$14.5K`) + 35% 云端弹性 (`$40.0K`)</text>
  <text x="838" y="274" fill="#6EE7B7" font-size="12" font-weight="700">    = 混合稳态月总支出仅 **`$54,500 / 月` (每月净省 `$125,500`！)**</text>

  <rect x="826" y="314" width="334" height="166" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="838" y="336" fill="#6EE7B7" font-size="13" font-weight="700">💰 硬件现金流回本周期公式 (CapEx Payback Period)</text>
  <text x="838" y="358" fill="#F8FAFC" font-size="13" font-weight="700">T_payback = CapEx / (C_cloud_mo - C_hybrid_opex_mo)</text>
  <text x="838" y="380" fill="#FDE68A" font-size="13" font-weight="700">          = $678,000 / $125,500 = 5.40 个月！</text>
  <text x="838" y="404" fill="#D1FAE5" font-size="12">· 不到半年即可 100% 收回全部 GPU 服务器与交换机硬件投资！</text>
  <text x="838" y="424" fill="#D1FAE5" font-size="12">· 3 年 (36 个月) 周期累计净赚现金流：**`$3.84M ($384万)`**！</text>
  <text x="838" y="446" fill="#6EE7B7" font-size="11" font-weight="700">· 若采用按年 GPU 裸金属长租：第 1 个月即实现正向现金流净省 69.7%！</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 云到混合云平滑迁移黄金铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 先立网关再动模型：第 1 天先上线支持 OpenAI 标准协议、异步影子复制 (Shadow Traffic) 与 800ms 灰故障自动回退云端的统一 AI Gateway；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 绝不追求 100% 下云：将前 65% 高频确定性基座与 T+1 批处理迁入自建 H200 (5.4 个月回本)，保留 35% 公有云 PTU/PAYGO 兜底洪峰与极低频长尾。</text>
</svg>
