<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#10B981" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级复杂文档解析 (Document AI / PDF OCR) 选型：MinerU / Docling vs. olmOCR / Qwen2.5-VL</text>
  <text x="52" y="94" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15">拯救 RAG 准确率最大黑洞（双栏错乱 + 跨页合并表格 + 图表失真）：版面检测按需裁剪 + 7B-VLM 局部精修</text>

  <!-- Left: Why PyMuPDF & Full-Page VLM Fail at Enterprise Scale -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么“规则解析”丢精度、“整页送大 VLM”烧穿预算？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 A (Tier 1)：纯字符流规则提取 (`PyMuPDF / pdfplumber`)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 遇到双栏论文/研报直接把左栏和右栏横向拼成乱码句子；无边框合并单元格表格完全错位</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 复杂文档表格 TEDS 仅 51.5%，导致下游财报/合同 RAG 问答准确率跌至 54.0%！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 B (Tier 2)：100% 渲染成大图送 72B VLM 端到端转 Markdown</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 连 82% 的纯文字页也渲染成 2,400 个视觉 Token 喂给 72B 大模型逐字重写</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 8 卡节点每秒仅能处理 4.2 页，解析 1,000 万页 PDF 账单高达 $185,000！</text>

  <!-- Right: Hybrid Layout + Cropped VLM Architecture -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 版面检测分流 + 局部裁剪 7B-VLM 混合架构 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 第一关 (`MinerU / Docling` 极速版面检测)：`DocLayout-YOLO` (3ms/页)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">精准框出正文段落、页眉页脚、双栏阅读顺序、表格框 (Table BBox)、统计图表 (Chart) 与公式</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 第二关 (82% 常规文本/标准表)：直接走原生 PDF 文本块 / RapidOCR</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">按 YOLO 阅读顺序重组纯净段落，零大模型 Token 消耗，吞吐高达 90+ 页/秒</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 第三关 (18% 复杂合并表/折线图/扫描件)：局部 BBox 裁剪送 `olmOCR / Qwen2.5-VL-7B`</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">仅把裁剪出的图表区域喂给 vLLM 7B-FP8 转成 `colspan/rowspan` HTML 表与数据摘要，省 96% 成本！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 1,000 万页复杂企业 PDF 入库（财报/标书/手册）四档解析架构对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">文档解析架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单节点吞吐</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">表格结构还原 (TEDS)</text>
  <text x="800" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">下游 RAG 准确率</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">千页解析成本</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">千万页总成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 传统规则字符流提取 (`PyMuPDF / pdfplumber`)</text>
  <text x="450" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">185.0 页/s</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">51.5% ✕ (错位)</text>
  <text x="800" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">54.0% ✕</text>
  <text x="960" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$0.08 / 千页</text>
  <text x="1120" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$800</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 100% 整页渲染送 72B VLM 转 Markdown</text>
  <text x="450" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">4.2 页/s ✕</text>
  <text x="620" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">93.8%</text>
  <text x="800" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">94.2%</text>
  <text x="960" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$18.50 / 千页 ✕</text>
  <text x="1120" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$185,000 ✕</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 纯模块化版面管线 (`MinerU / IBM Docling`)</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">92.0 页/s ✓</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">89.4% ✓</text>
  <text x="800" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">88.6% ✓</text>
  <text x="960" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$0.42 / 千页</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$4,200</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): MinerU/Docling 快筛 + 18% 复杂图表裁剪送 olmOCR/QwenVL-7B</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">74.0 页/s (17.6x)</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">95.2% ✓</text>
  <text x="800" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">94.8% ✓</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$0.68 / 千页 ✓</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$6,800 (-96.3%)</text>
</svg>
