<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg190" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc190" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg190)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="420" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="262" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 190 · CPU NUMA PINNING, OMP THREADS &amp; IRQ AFFINITY</text>
  <text x="488" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">AI 服务器 CPU NUMA 亲和性绑核、`OMP_NUM_THREADS` 线程风暴与网卡 IRQ 隔离选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">为什么 8 卡训练不设 OMP_NUM_THREADS 会炸出 2,048 个线程？从跨 Socket UPI 带宽腰斩（24.2 GB/s）到 54.5 GB/s 零抖动满速</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc190)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="224" height="24" rx="6" fill="#7f1d1d"/>
  <text x="180" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 未绑核 + 未限 OMP 线程</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">2,048 线程互抢 + 跨 UPI 腰斩</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">8 Ranks × 256 核 · Step 抖动 28.4%</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制灾难：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">每个进程按整机 256 核拉起 256 个 OMP 线程</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">且跨 NUMA 分配 Pinned 内存走慢速 UPI！</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 总 OpenMP 线程数: <tspan fill="#f87171" font-weight="700">2,048 线程 (爆炸 ✕)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• H2D DMA 带宽: <tspan fill="#f87171" font-weight="700">24.2 GB/s (腰斩 ✕)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• CUDA 下发 P99: <tspan fill="#f87171" font-weight="700">85.0 μs ✕</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 训练 Step 抖动: <tspan fill="#f87171" font-weight="700">28.4% ✕</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ Load Average 飙破 1000 的头号元凶</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="228" height="24" rx="6" fill="#78350f"/>
  <text x="482" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 仅设 OMP=8 (OS 自由漂移)</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">CFS 跨 Socket 漂移与缓存失效</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">64 线程 · 仍发生跨 NUMA 内存拷贝</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么只设 OMP=8 还不够？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Linux 调度器会把控制 GPU0 (NUMA0) 的</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">进程迁到 NUMA1 的 CPU 核上，触发跨片访问</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 总 OpenMP 线程数: <tspan fill="#fbbf24" font-weight="700">64 线程 ✅</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• H2D DMA 带宽: <tspan fill="#fbbf24" font-weight="700">31.5 GB/s ⚠️</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• CUDA 下发 P99: <tspan fill="#fbbf24" font-weight="700">24.0 μs</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 训练 Step 抖动: <tspan fill="#fbbf24" font-weight="700">14.2% ⚠️</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 消除了线程风暴，但未锁死本地 NUMA</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="232" height="24" rx="6" fill="#0c4a6e"/>
  <text x="784" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · numactl 按 Socket 严密绑核</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">H2D 跃升至 52.8 GB/s (快 2.2x)</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">--cpunodebind + --membind 锁死同片</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制突破：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Rank 0..3 严格绑定 NUMA 0，Rank 4..7</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">严格绑定 NUMA 1，消灭跨 Socket UPI 流量！</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 总 OpenMP 线程数: <tspan fill="#38bdf8" font-weight="800">64 线程 ✅</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• H2D DMA 带宽: <tspan fill="#38bdf8" font-weight="800">52.8 GB/s ✅</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• CUDA 下发 P99: <tspan fill="#38bdf8" font-weight="800">6.2 μs ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 训练 Step 抖动: <tspan fill="#38bdf8" font-weight="800">3.8% ✅</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 裸机脚本启动的必配标准动作</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · K8s 静态独占核 + IRQ 隔离</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">54.5 GB/s · 0.6% 极低 Step 抖动</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">single-numa-node + 网卡中断专核隔离</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (物理核独占 + 零中断抢占)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">停用 irqbalance，把 400G 网卡硬中断锁在</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">Housekeeping 核，CUDA 下发核 100% 免打扰！</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 总 OpenMP 线程数: <tspan fill="#34d399" font-weight="800">64 线程 🏆</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• H2D DMA 带宽: <tspan fill="#34d399" font-weight="800">54.5 GB/s (快 2.25x 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• CUDA 下发 P99: <tspan fill="#34d399" font-weight="800">3.5 μs (快 24x 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 训练 Step 抖动: <tspan fill="#34d399" font-weight="800">仅 0.6% 🏆</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 千卡同步训练与 KV 卸载黄金标准</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：8 卡双路服务器（Dual-Socket）CPU、内存与网卡中断绑定的黄金法则</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：严禁跨 CPU Socket 访问 GPU（消灭 UPI / Infinity Fabric 瓶颈）</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 在 8 卡 HGX 主板上，`GPU 0..3` 与 `NIC 0..3` 物理直连 `Socket 0 (NUMA 0)`；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  `GPU 4..7` 与 `NIC 4..7` 物理直连 `Socket 1 (NUMA 1)`；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 必须令 Rank $i$ 绑定对应 NUMA 节点的 CPU 核与内存页，否则 DMA 带宽立刻掉 `55.6%`！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：Kubelet 开启 `single-numa-node` 并隔离网卡 IRQ 中断核</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• K8s 默认会把 CPU 核与 GPU 设备随机混分（可能分到 NUMA0 的核 + NUMA1 的卡！）；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 必须开启 `cpuManagerPolicy: static` + `topologyManagerPolicy: single-numa-node`，</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  并用 `reservedSystemCPUs` 预留每 Socket 前 4 核专跑 400G 网卡软硬中断 🏆！</text>
</svg>
