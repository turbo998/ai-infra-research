  <text x="346" y="334" fill="#6ee7b7" font-size="13" font-weight="700">8h 窗口超时/429失败率: 0.0%</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">GPU 前缀缓存命中率: 35.0%</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月度批处理推理总成本: $108,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁为潮汐离线作业单独购买全天包月PTU</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 云厂商托管异步 Batch API (5折)</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">价格直接打五折，但 24h 队列偶发晚点</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 零运维上传 JSONL，成本立降 50% ($67.5K)</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 云端 24h 尽力而为队列在月底高峰 7.8% 晚于早8点</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">百万 Token 综合单价: $1.35 / 1M ✅</text>
