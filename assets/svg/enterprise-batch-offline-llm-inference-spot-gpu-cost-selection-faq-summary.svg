  <rect width="1200" height="680" fill="url(#bgGrad412)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级海量离线批处理大模型推理（50B Tokens/月）、PTU 潮汐复用与 Spot GPU 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">月均 500亿 Token / 夜间 8h 窗口 · 实时PAYGO并发硬打 vs. 专购批处理PTU vs. 云托管Batch API vs. 日间PTU夜间填谷 + K8s Spot (Ray+vLLM前缀排序)</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">$0.42/1M · 0% SLA Miss</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 实时在线 PAYGO 接口并发跑批</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">触发 429 限流风暴，零售原价账单爆炸</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 并发打在线端点挤爆区域 TPM 配额</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 随机乱序请求导致前缀缓存命中仅 18.0%</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">百万 Token 综合单价: $2.70 / 1M ✕</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">8h 窗口超时/429失败率: 26.5% ✕</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">GPU 前缀缓存命中率: 18.0%</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月度批处理推理总成本: $135,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：严禁拿大批量离线 ETL 任务硬砸实时 API</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 专门为夜间批处理独购 PTU</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">夜间8小时跑满，白天16小时空转烧钱</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 虽无 429 报错，但全天算力利用率仅 33%</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 折算单价仍高达 $2.16/1M，月耗 $108K</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
