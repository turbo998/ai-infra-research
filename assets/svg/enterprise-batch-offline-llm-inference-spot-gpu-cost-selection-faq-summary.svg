  <text x="638" y="358" fill="#94a3b8" font-size="12.5">GPU 前缀缓存命中率: 50.0%</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月度批处理推理总成本: $67,500 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：对完成时间不敏感(&lt;=24h)的轻量离线任务</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad412)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 夜间PTU填谷+Spot Ray+vLLM 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">白嫖夜间闲置PTU + Spot前缀排序批跑</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 45%流量复用白天已付费PTU夜间波谷($0边际成本)</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• Ray Data + vLLM Offline 字典序前缀排序(91.5%命中)</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">百万 Token 综合单价: $0.42 / 1M 🏆 (-84.4%)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">8h 窗口超时率: 0.0% 🏆 (微片断点续跑)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">GPU 前缀缓存命中率: 91.5% 🏆 (前缀聚类)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月度批处理推理总成本: $21,000 (-84.4% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：十亿/百亿 Token 级夜间通话质检、商品清洗</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 海量离线批处理推理架构师铁律（Off-Peak PTU Backfill + Prefix-Sorted Spot vLLM Pattern）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 先榨干白天在线业务已购买的 PTU 夜间波谷余量（22:00-06:00 边际成本为 $0），溢出部分交由 K8s Spot GPU 队列（Ray Data + vLLM Offline）消化。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 离线批数据入队前必须按共享 System Prompt 与长文档前缀做字典序聚类排序（PrefixHit 91.5%），并按 2,000 行 Parquet 微片做抢占断点续跑 · Provenance: synthetic + anonymized_reported</text>
</svg>
