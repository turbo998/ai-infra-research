<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg373" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc373" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg373)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="445" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="274" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 373 · K8S AKS/EKS LLM AUTOSCALING &amp; MODEL ASSET FAST LOAD</text>
  <text x="512" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="23.5" font-weight="800">K8s (AKS/EKS) 推理弹性伸缩与百 GB 模型秒级加载：158GB 胖镜像 vs. NFS vs. 本地 NVMe vs. RDMA 广播</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">70B 模型应对早高峰 4 倍突发流量：从“拉取解压 158GB 胖镜像耗时 18 分钟 ($68K/月)”到“KAITO + 本地 NVMe 流式加载 (38秒)”再到“RDMA 广播 (8.5秒)”</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc373)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="236" height="24" rx="6" fill="#7f1d1d"/>
  <text x="186" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · HPA (GPU%) + 158GB 胖镜像</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">扩容等 18 分钟 · 黄花菜全凉</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">把 140GB 权重打进 Docker Gzip 镜像</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么不能把大模型打进容器镜像？</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">containerd 单核解压 158GB Gzip 层耗时</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">18 分钟，早高峰 42.5% 请求已超时失败 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 扩容就绪耗时: <tspan fill="#f87171" font-weight="700">1,080.0 秒 (18.0 分钟 ✕)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 洪峰请求丢包率: <tspan fill="#f87171" font-weight="700">42.5% 超时报错 ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 被迫保留空闲卡: <tspan fill="#f87171" font-weight="700">55.0% 冗余热备 ✕</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度集群总成本: <tspan fill="#f87171" font-weight="700">$68,000 / 月 ✕</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁将百 GB 权重打包进容器镜像层</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="236" height="24" rx="6" fill="#78350f"/>
  <text x="486" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · KEDA + 共享 NFS / BlobFuse</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">多 Pod 并发抢带宽 · 仍需 4.2m</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">镜像与权重分离，但从网络存储拉权重</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">共享网络文件系统的并发瓶颈：</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">当 8 个 Pod 同时扩容读取 70GB 权重时，</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">打满共享 NFS 网卡带宽，耗时 252 秒 ⚠️</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 扩容就绪耗时: <tspan fill="#fbbf24" font-weight="700">252.0 秒 (4.2 分钟 ⚠️)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 洪峰请求丢包率: <tspan fill="#fbbf24" font-weight="700">11.8%</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 被迫保留空闲卡: <tspan fill="#fbbf24" font-weight="700">30.0% 冗余热备</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度集群总成本: <tspan fill="#fbbf24" font-weight="700">$44,500 / 月</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 仅适合 1~2 副本小集群，多副本并发堵死</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="236" height="24" rx="6" fill="#0c4a6e"/>
  <text x="786" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · KAITO/KEDA + 本地 NVMe 流式</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">38 秒极速就绪 · 快 28.4 倍</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">按需镜像流 + 本地 NVMe + Run:ai Streamer</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">云原生生产黄金标配：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">节点本地 NVMe RAID0 缓存权重，32 线程</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">O_DIRECT 绕过内核页缓存直灌 GPU 显存 ✅</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 扩容就绪耗时: <tspan fill="#38bdf8" font-weight="800">38.0 秒 (快 28.4x ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 洪峰请求丢包率: <tspan fill="#38bdf8" font-weight="800">0.4% ✅</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 被迫保留空闲卡: <tspan fill="#38bdf8" font-weight="800">仅需 12.0% 热备 ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度集群总成本: <tspan fill="#38bdf8" font-weight="800">$28,200 / 月 (-58.5% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 企业级 AKS / EKS 生产集群标准推荐</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · Host-DRAM 睡眠池 + RDMA 广播</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">8.5 秒闪电唤醒 · 成本省 65.6%</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">vLLM Sleep Mode (1.8s) + 邻居显存 P2P 广播</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">突破冷启动物理极限 (快 127.1x)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">新 Pod 不查慢存储，直接通过 RDMA 从邻</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">居运行态 Pod 显存对等拷贝 70GB 权重 🏆</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 扩容就绪耗时: <tspan fill="#34d399" font-weight="800">8.5 秒 (快 127.1x 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 洪峰请求丢包率: <tspan fill="#34d399" font-weight="800">0.0% 零超时 🏆</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 被迫保留空闲卡: <tspan fill="#34d399" font-weight="800">仅 5.0% 极小缓冲 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度集群总成本: <tspan fill="#34d399" font-weight="800">$23,400 / 月 (省 $44.6K 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 高弹性多模型 Serverless GPU 终局</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：如何拆解并消灭大模型 K8s 扩容中的“18 分钟死亡等待”（容器层 vs. 权重层双解耦）？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">📦 解耦 1：容器运行时镜像 (18GB) 与模型权重资产 (70~140GB) 彻底分离</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 严禁执行 `COPY ./llama-70b /models` 把权重塞进 Dockerfile（会导致单线程 Gzip 解压地狱）；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 容器镜像只留纯净的 `vLLM / SGLang` 运行时（开启 Azure Artifact Streaming / Dragonfly P2P</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  4 秒按需懒加载启动）；模型权重统一存为未压缩 `Safetensors` 走高速数据通道！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 解耦 2：Run:ai 多线程直传 (38s) 与邻居 Pod RDMA 显存广播 (8.5s)</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 单节点/常规网络：将权重缓存在 GPU 服务器自带的 `Local NVMe SSD RAID0` 盘上，开启</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  `--load-format runai_streamer` 32 线程并发直灌显存，38 秒即可接流量 ✅；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 高速 RDMA 集群：新扩容 Pod 直接从已运行的 `Replica #0` 显存通过 RDMA 广播复制权重，8.5秒就绪 🏆！</text>
</svg>
