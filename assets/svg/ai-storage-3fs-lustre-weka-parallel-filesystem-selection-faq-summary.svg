<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">💾 AI 智算集群分布式并行文件系统选型一图流总结（CephFS vs. Lustre vs. WEKA GDS vs. DeepSeek 3FS）</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">180 台全闪存储节点 (16×NVMe + 2×200G RDMA/台，理论线速 7.2 TB/s) 服务 1,024×H200 · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="970" y="42" width="278" height="38" rx="19" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="1109" y="66" fill="#67e8f9" font-size="13" font-weight="700" text-anchor="middle">Round 29 · Parallel Filesystems</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 通用 NAS / CephFS (TCP)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">内核 VFS + 主 OSD 串行读 + PG 锁</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 聚合随机读吞吐: <tspan fill="#f87171" font-weight="700">251.0 GB/s (仅跑满 3.5%)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 64KB 随机读 IOPS: <tspan fill="#f87171" font-weight="700">1.1 M IOPS ✕</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 10TB Checkpoint 加载: <tspan fill="#f87171" font-weight="700">44.5 s (写 82.0 s ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• KVCache 卸载 P99: <tspan fill="#f87171" font-weight="700">18.5 ms (拖慢推理 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 客户端 CPU 消耗: <tspan fill="#f87171" font-weight="700">28 核/节点 · 3年 $2.15M</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么 CephFS 喂不饱大模型？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">默认所有读请求强制打向 Primary OSD（闲</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">置另外 2 个副本 NVMe），且内核 TCP 拷</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">贝吃满 28 个 CPU 核，严禁做主力训练盘！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 传统超算 Lustre / BeeGFS</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">LNet RDMA + Linux 内核 Page Cache</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 聚合随机读吞吐: <tspan fill="#fbbf24" font-weight="700">2,450.0 GB/s (2.45 TB/s)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 64KB 随机读 IOPS: <tspan fill="#fbbf24" font-weight="700">4.5 M IOPS</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 10TB Checkpoint 加载: <tspan fill="#fbbf24" font-weight="700">4.8 s (写 7.6 s)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• KVCache 卸载 P99: <tspan fill="#fbbf24" font-weight="700">4.2 ms (LRU 锁抖动)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 客户端 CPU 消耗: <tspan fill="#fbbf24" font-weight="700">18 核/节点 · 3年 $2.48M</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 为什么 Page Cache 反而是负优化？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">500TB 全局 Shuffle 训练集与 KVCache 换</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">页几乎零局部性（命中率 &lt;2%）！Page Cache</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">疯狂换入换出触发内核 LRU 自旋锁雪崩！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 商用全闪 SDS (WEKA / VAST)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">用户态 DPDK + GPUDirect Storage (GDS)</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 聚合随机读吞吐: <tspan fill="#34d399" font-weight="700">5,850.0 GB/s (5.85 TB/s)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 64KB 随机读 IOPS: <tspan fill="#34d399" font-weight="700">26.5 M IOPS ✅</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 10TB Checkpoint 加载: <tspan fill="#34d399" font-weight="700">1.8 s (写 2.9 s ✅)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• KVCache 卸载 P99: <tspan fill="#34d399" font-weight="700">0.65 ms ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 3 年总 TCO (含商业授权): <tspan fill="#60a5fa" font-weight="700">$3,680,000 (仅占 4 核)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 金融/政企交钥匙工程首选：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">自带企业级快照、多租户 QoS、N+2 纠删码</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">与 7×24 原厂维保；但 3 年软件订阅授权费</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">比白盒开源方案贵出 $148 万美元。</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 开源 DeepSeek 3FS 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">CRAQ 均摊读 + USRBIO 零拷贝 + FDB</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 聚合随机读吞吐: <tspan fill="#34d399" font-weight="700">6,600.0 GB/s (6.6 TB/s 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 64KB 随机读 IOPS: <tspan fill="#34d399" font-weight="700">33.0 M IOPS (7.33x 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 10TB Checkpoint 加载: <tspan fill="#34d399" font-weight="700">1.5 s (写 2.4 s 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• KVCache 卸载 P99: <tspan fill="#6ee7b7" font-weight="700">0.42 ms (仅占 2 核 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 3 年总 TCO (零软件税): <tspan fill="#34d399" font-weight="700">$2,200,000 (省 $1.48M)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 AI 原生极限吞吐三剑客：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 彻底废除 Page Cache (全链路 O_DIRECT)；</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">② CRAQ 允许所有链副本并发提供强一致读；</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">③ USRBIO 共享内存信号量环压满 91.7% 线速！</text>
  </g>

  <!-- Bottom Left: Page Cache Thrashing vs 3FS Direct I/O -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📉 数据集规模膨胀时：内核 Page Cache 抖动退化 vs. 3FS 全直通稳定度</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">当全局随机 Shuffle 数据集远超客户端内存（500TB vs 2TB RAM）时，Lustre 因 LRU 锁退化 55.8%</text>

    <!-- Bar group 1: 0.5x -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">0.5× 内存 (全命中缓存)</text>
    <rect x="190" y="74" width="360" height="14" rx="4" fill="#10b981"/>
    <text x="556" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">6.60 TB/s (3FS)</text>
    <rect x="190" y="92" width="207" height="14" rx="4" fill="#f59e0b"/>
    <text x="405" y="104" fill="#fde68a" font-size="11.5" font-weight="700">3.80 TB/s (Lustre)</text>

    <!-- Bar group 2: 2.0x -->
    <text x="24" y="144" fill="#cbd5e1" font-size="12" font-weight="700">2.0× 内存 (轻度换页)</text>
    <rect x="190" y="130" width="360" height="14" rx="4" fill="#10b981"/>
    <text x="556" y="142" fill="#6ee7b7" font-size="11.5" font-weight="700">6.60 TB/s (3FS)</text>
    <rect x="190" y="148" width="161" height="14" rx="4" fill="#f59e0b"/>
    <text x="358" y="160" fill="#fde68a" font-size="11.5" font-weight="700">2.95 TB/s (Lustre)</text>

    <!-- Bar group 3: 10.0x -->
    <text x="24" y="200" fill="#cbd5e1" font-size="12" font-weight="700">10.0× 内存 (LRU 锁争用)</text>
    <rect x="190" y="186" width="359" height="14" rx="4" fill="#10b981"/>
    <text x="556" y="198" fill="#6ee7b7" font-size="11.5" font-weight="700">6.59 TB/s (3FS)</text>
    <rect x="190" y="204" width="134" height="14" rx="4" fill="#f59e0b"/>
    <text x="331" y="216" fill="#fde68a" font-size="11.5" font-weight="700">2.45 TB/s (Lustre)</text>

    <!-- Bar group 4: 250x -->
    <text x="24" y="256" fill="#cbd5e1" font-size="12" font-weight="700">250× 内存 (500TB 训练集)</text>
    <rect x="190" y="242" width="358" height="14" rx="4" fill="#10b981"/>
    <text x="556" y="254" fill="#6ee7b7" font-size="11.5" font-weight="700">6.58 TB/s (稳如泰山)</text>
    <rect x="190" y="260" width="91" height="14" rx="4" fill="#ef4444"/>
    <text x="288" y="272" fill="#f87171" font-size="11.5" font-weight="700">1.68 TB/s (暴跌 -55.8% ✕)</text>

    <rect x="20" y="284" width="560" height="30" rx="6" fill="#1e293b"/>
    <text x="32" y="304" fill="#67e8f9" font-size="11.5" font-weight="700">💡 结论：AI 随机读取与 KVCache 卸载必须绕过 OS Page Cache，直接走 RDMA + NVMe！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师并行文件系统三层分级存储黄金架构</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="70" fill="#6ee7b7" font-size="13" font-weight="800">1️⃣ 核心 AI 基础模型厂商 / 具备 RDMA 工程团队 → 选 Tier 4 (DeepSeek 3FS)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 用 `CRAQ` 链式复制让 3 个副本全部提供并发强一致读，叠加 `USRBIO` 零拷贝异步 I/O 环，</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  跑出 `6.6 TB/s` 聚合读吞吐（达物理网卡极限的 `91.7%`）与 `0.42ms` KVCache 换页延迟！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="160" fill="#93c5fd" font-size="13" font-weight="800">2️⃣ 金融机构 / 车企智驾 / 追求原厂 SLA 交钥匙 → 选 Tier 3 (WEKA / VAST GDS)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 提供开箱即用的 POSIX + GPUDirect Storage、N+2 纠删码（提升磁盘空间利用率至 85%+）、</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  多租户硬隔离与 7×24 原厂驻场支持，适合运维团队精简的企业生产集群。</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 生产存储分层铁律：热层 (3FS/WEKA) + 温冷层 (S3 对象存储)</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 严禁把 PB 级历史原始视频/归档 Checkpoint 长期堆在昂贵的全闪并行文件系统上！</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">• 热盘只放“当前训练 Epoch 样本 + 最近 3 个 Checkpoint + 推理 KVCache 二级池”，其余异步沉降 S3。</text>
  </g>
</svg>
