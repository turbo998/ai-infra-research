<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#38BDF8" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">大模型生产持续评估 (LLM-as-a-Judge) 选型：商业 API 裁判 vs. Prometheus-2 专用裁判 vs. NLI 级联</text>
  <text x="52" y="94" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="15">RAG Triad 三元组指标 + 双向位置交换消偏 (Position-Swap Debiasing) + 三级离线闲时算力评估流水线：省 95.3% 评估费！</text>

  <!-- Left: Why Naive LLM-as-a-Judge Fails & Bankrupts Budgets -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么直接调商业旗舰 API 当裁判会面临“成本与偏见”双杀？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 A：评估账单比线上推理还贵 (Tier 1: $145,000/月)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 抽样 500 万条线上 RAG/Agent 轨迹，每条校验三元组（上下文相关性、忠实度、回答相关性）</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 每次评估塞入 4.8K 上下文调 GPT-4o，千条评估高达 $29，月烧 $14.5 万！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 B：三大固有裁判偏见 (Position / Verbosity / Self-Enhancement)</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单次成对比较时，大模型对排在 Option A 或啰嗦长篇大论的回答存在 14.8% 误判偏袒！</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 传统 BLEU/ROUGE (Tier 2) 则完全无法识别“数值造假与逻辑反转”（人类一致性仅 0.412）</text>

  <!-- Right: 3-Tier Cascade Judge + Canary Gate -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 企业级三级评估级联与金丝雀自动门禁 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① L1 事实蕴含快筛 (`DeBERTa-v3-Large NLI` + 规则断言)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">将回答拆解为原子事实陈述句，用 400M NLI 模型极速校验是否被检索切片蕴含 (Faithfulness)</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② L2 专用开源量表裁判 (`Prometheus-2 / Qwen-14B-Judge` + 双向位置消偏)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">利用夜间潮汐闲置 GPU 跑 1~5 分制 Rubric 量表 + `(A,B)/(B,A)` 双投消偏，一致性达 0.894！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ L3 5% 疑难分歧升级 + 金丝雀自动回滚门禁 (Canary Rollout Gate)</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">仅对正反双投平局的 5% 样本调多旗舰模型投票；线上金丝雀忠实度跌 &gt;2% 自动触发回滚！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 月均 500 万条线上轨迹（RAG Triad + Agent 评估）四档架构准确性与成本对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">持续评估 (LLM-as-a-Judge) 方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">人类专家一致性 (κ)</text>
  <text x="630" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">位置/长度偏见率</text>
  <text x="800" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">万条回归耗时</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">千条评估单价</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度评估总成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 100% 商业旗舰 API 裁判 (单次未消偏)</text>
  <text x="450" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.865</text>
  <text x="630" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">14.8% ✕</text>
  <text x="800" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">68.0 min</text>
  <text x="960" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$29.00 / 1K ✕</text>
  <text x="1120" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$145,000/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 传统字面/向量相似度 (BLEU / ROUGE / Cosine)</text>
  <text x="450" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">0.412 ✕ (失真)</text>
  <text x="630" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">38.5% ✕</text>
  <text x="800" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">3.5 min</text>
  <text x="960" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$0.15 / 1K</text>
  <text x="1120" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$750/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 自建通用 `Llama-3.3-70B-FP8` 独占实例裁判</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.842</text>
  <text x="630" y="612" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">16.2%</text>
  <text x="800" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">24.0 min</text>
  <text x="960" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$5.60 / 1K</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$28,000/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): DeBERTa NLI + Prometheus-2/14B 闲时双投 + 5% 仲裁</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.894 ✓ (最高)</text>
  <text x="630" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3.4% ✓ (双投消偏)</text>
  <text x="800" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">6.8 min (10x)</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$1.36 / 1K ✓</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$6,800/mo (-95%)</text>
</svg>
