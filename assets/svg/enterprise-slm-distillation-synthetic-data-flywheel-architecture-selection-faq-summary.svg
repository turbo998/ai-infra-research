<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad392" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad392" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad392)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级小模型知识蒸馏 (SLM Distillation) 与合成数据飞轮 (Data Flywheel) 架构选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：网关日志采集 + Best-of-4 执行验证拒绝采样 + 废片 DPO 对齐 + 88/12 置信度级联，达成 99.4% 教师能力保持率且月省 81.6%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 392 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 纯人工专家手写标注</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 抽调业务专家手工写 5,000 条问答对</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 不同标注员尺度不一、长尾覆盖极窄</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 相对教师模型能力保持率：78.5% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 冷启动构建周期：84 天 (12周) ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 初始构建成本：$65,000 (人工工时) ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">综合得分：67.5 / 86.0 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：等人类专家写完 5,000 条样本，</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">三个月过去了，业务规则早就换了两轮！</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 无过滤教师裸生成 SFT</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 让 70B/R1 凭空造 5 万条数据直训 8B</text>
  <text x="332" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 12% 教师幻觉与错参被小模型原样学坏</text>
  <text x="332" y="212" fill="#fde68a" font-size="12" font-weight="700">• 相对教师模型能力保持率：83.8% ✕</text>
  <text x="332" y="232" fill="#34d399" font-size="12" font-weight="700">• 冷启动构建周期：4 天</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• 初始构建成本：$4,200</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">综合得分：72.1 / 86.0 (幻觉放大)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">反模式：未经校验的教师输出含有 12% 毒数据</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">且凭空编造的问题与真实线上分布严重脱节</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 执行验证拒绝采样 SFT</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 采集网关脱敏真实提问 + Best-of-4 采样</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 经 SQL解析器 / 编译器 / NLI 校验过滤</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 相对教师模型能力保持率：94.2% ✅</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 冷启动构建周期：3 天 ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 初始构建成本：$5,800 (省 91.1%)</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">综合得分：81.0 / 86.0 ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：单模型独立 8B 蒸馏标准基线</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">100% 保证喂给学生模型的每条数据都跑得通</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 拒绝采样+DPO+级联飞轮🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 通过项与淘汰项自动配对跑 DPO/GRPO</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 88% 走 8B 学生 + 12% 低置信度回退教师</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 相对教师模型能力保持率：99.4% 🏆</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 线上推理月成本：$9,200 (比纯教师省81.6%)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 初始构建成本：$6,400 (3天极速投产)</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">综合得分：85.5 / 86.0 (近乎无损)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级持续自进化数据飞轮终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">回退给教师的 12% 难例每周自动反哺学生！</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么“把淘汰掉的废片拿来做 DPO 负样本 + 线上 88/12 置信度回退”能用 1/5 成本逼平 671B 大模型？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad392)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 执行验证拒绝采样（Execution-Verified Filtering）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 绝不盲信教师模型单次输出！让教师生成 `N=4` 个候选解，</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 用 **确定性校验器（SQL EXPLAIN、JSON Schema、代码沙箱、NLI）**</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  自动淘汰通不过的脏样本，只保留 100% 验证通过的黄金正样本！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 顺带把教师模型的 `&lt;think&gt;` 推理步骤一并蒸馏给 8B 学生！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 变废为宝：天然 DPO 正负对比对（Zero-Cost DPO Pairs）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 在 `Best-of-4` 采样中，那个通过校验的样本就是 `y_chosen (正例)`，</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  而同一个问题下未能通过校验的样本天然就是极佳的 `y_rejected (难负例)`！</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 零额外成本直接构造 `(prompt, chosen, rejected)` 跑 DPO 对齐，</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 让 8B 模型深刻学会“边界情况绝不能犯哪类语法与幻觉错误”！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 88/12 置信度级联与自进化飞轮（Active Learning）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 8B 模型再强也总有 10%~12% 的跨领域极难长尾题算不准。</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 网关监测 8B 输出首词对数概率熵（Logprob Margin）：一旦低于阈值，</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  自动实时回退给 70B/671B 教师兜底（保证线上 99.4% 满血精度），</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">• 同时把这 12% 教师解答落库，下周自动微调进 8B，越用回退率越低！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 392 合成标定算例 (independently_reproduced=false)</text>
</svg>
