  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 查个 VPN 地址也吐 3,250 个思考 Token</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 严重“过度思考症 (Overthinking)”</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 平均端到端延迟：24.50 秒 ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 平均 &lt;think&gt; 消耗：3,250 tok/次 ✕</text>
  <text x="40" y="252" fill="#cbd5e1" font-size="12">• 综合任务准确率：93.5%</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">千万次月成本：$82,000 / 月 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：前端转圈等待 25 秒才开始出正文</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">80% 的算力烧在毫无必要的内部纠结上</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 粗暴硬截断 max_tokens</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 网关强设 max_tokens=1024 省钱</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 复杂题还没走出 &lt;think&gt; 就被强行掐断</text>
  <text x="332" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 思考半途腰斩无答案率：18.4% ✕</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 综合任务准确率：暴跌至 74.0% ✕</text>
  <text x="332" y="252" fill="#fde68a" font-size="12">• 平均端到端延迟：7.40 秒</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">千万次月成本：$24,800 (高频空回答)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">头号事故：用户只收到半截思考草稿，</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">正式 JSON 结果根本没生成出来就断了！</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 三档认知难度路由</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 70% 简单查询走免思考直答 (V3/no-think)</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 20% 走中档思考 · 10% 走深度 R1 推理</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 平均端到端延迟：4.20 秒 ✅</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 平均 &lt;think&gt; 消耗：降至 680 tok ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 综合任务准确率：93.2% ✅</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">千万次月成本：$21,500 (省 73.8%) ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：商用 API (reasoning_effort) 标准</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">消除了 70% 简单请求的无效思考等待</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 预算收尾+MTP投机解码 🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 三档路由 + 90%水位注入 &lt;/think&gt; 优雅收尾</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 原生 MTP / EAGLE-3 投机解码加速 2.4x</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 平均端到端延迟：1.85 秒 🏆 (快 13.24x)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 思考腰斩无答案率：0.0% 🏆</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• 综合任务准确率：94.6% 🏆</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">千万次月成本：$12,800 (省 84.4%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级 DeepSeek-R1/QwQ 生产终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">兼顾深度推理智商、秒级响应与零截断事故</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 架构师驾驭推理模型 (Reasoning Models) 的三大核心利器：认知路由、优雅收尾注入与 MTP 投机解码</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad385)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 70/20/10 三档认知难度路由（治好过度思考症）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 严禁把摘要、翻译、简单查表发给全功率思考模式！</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 70% 简单任务强制注入空思考前缀 `&lt;think&gt;\n&lt;/think&gt;`</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  （或路由至 DeepSeek-V3 / Non-Thinking 档位，0 思考 Token）；</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 仅 10% 数学证明、架构规划与复杂 Debug 开启 8K 深度思考！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 优雅预算收尾注入（Budget-Forcing，根治半途腰斩）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 绝对不能靠简单设小 `max_tokens` 来控费（会卡死在 &lt;think&gt; 里）！</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 网关实时统计已生成的 `&lt;think&gt;` Token 数：一旦达到思考预算</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  （如 1,024 Tokens），立即闭合注入 `\n思考时间到，立即总结答案。&lt;/think&gt;\n`</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  并预留独立的 512 Tokens 专门给正式回答，实现 0.0% 截断率！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 为什么推理模型必须开 MTP / EAGLE-3 投机解码？</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 传统模型输出仅 200 字，而 R1 动辄连续吐 3,000 字 `&lt;think&gt;`！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 推理模型 95% 的耗时都在 **自回归 Decode 阶段**！</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• 开启 DeepSeek 原生 MTP 头或 EAGLE-3 投机解码（每步猜 3~4 词），</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  思考草稿生成速度直接飙升 2.2x~2.6x，且数学上 100% 零损！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 385 合成标定算例 (independently_reproduced=false)</text>
