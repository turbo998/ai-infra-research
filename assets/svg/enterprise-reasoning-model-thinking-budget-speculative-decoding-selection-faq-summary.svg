  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级推理模型 (DeepSeek-R1 / o3-mini / QwQ) 思维链预算治理与投机解码加速选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：三档认知难度路由 + 优雅 &lt;/think&gt; 预算收尾注入 + 原生 MTP/EAGLE-3 投机解码，将端到端延迟加速 13.24x 且月省 84.4%</text>
