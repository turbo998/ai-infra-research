<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg628" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr628" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg628)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr628)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#628 超长上下文 (128K–1M) 推理架构：2D Hybrid USP (Ulysses×Ring)、三级 KV 缓存池与 MLA 算卡</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Enterprise 128K–1M Long-Context Inference: 2D Hybrid USP (Ulysses=8 × Ring=2), 3-Tier KV Offload (HBM/DDR5/3FS) &amp; MLA/Hybrid Sizer</text>

  <!-- Left: 256K KV Footprint Across 4 Attention Architectures -->
  <rect x="48" y="120" width="368" height="330" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="66" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">① 256K 单会话 KV 显存四代演进对比</text>
  <rect x="64" y="164" width="336" height="62" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="76" y="186" fill="#f87171" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">1. 传统 MHA-64 (BF16 · 2.62 MB/tok)</text>
  <text x="76" y="208" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5">• 256K 单请求占 671.1 GB ➔ 单机 8卡直接 OOM！</text>

  <rect x="64" y="236" width="336" height="62" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="76" y="258" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2. 标准 70B GQA-8 (FP8 KV · 163.84 KB/tok)</text>
  <text x="76" y="280" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 256K 单请求占 41.94 GB (比 MHA 缩小 16 倍)</text>

  <rect x="64" y="308" width="336" height="62" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="76" y="330" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">3. DeepSeek 671B MLA (FP8 · 35.14 KB/tok)</text>
  <text x="76" y="352" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 256K 仅占 9.00 GB (比 70B GQA 再省 4.66 倍!)</text>

  <rect x="64" y="380" width="336" height="58" rx="8" fill="#0f172a" stroke="#a855f7"/>
  <text x="76" y="400" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">4. 7:1 混合线性注意力 (Mamba/DeltaNet + GQA)</text>
  <text x="76" y="422" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 70层固定状态 + 10层全注意力 ➔ 仅 5.38 GB (-87.2%)</text>

  <!-- Center: 2D Hybrid USP (Ulysses x Ring) -->
  <rect x="432" y="120" width="356" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="450" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">② 2D Hybrid USP 序列并行 (TTFT 快 10.7x)</text>
  <rect x="448" y="164" width="324" height="126" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="460" y="186" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">机内维：DeepSpeed Ulysses = 8 (对齐 GQA-8 头数)</text>
  <text x="460" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 将 256K 序列切为 8 段，经机内 900 GB/s NVLink</text>
  <text x="460" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">  执行 QKV All-to-All 转置为按 Attention Head 并行</text>
  <text x="460" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 硬约束：Ulysses 度数 U 绝不能超过 KV 头数 H_kv=8</text>
  <text x="460" y="270" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 机内通信耗时仅 ~18 ms (NVLink 线速吞吐)</text>

  <rect x="448" y="302" width="324" height="134" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="460" y="324" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">跨机维：Ring Attention = 2 (突破 H_kv=8 头数上限)</text>
  <text x="460" y="346" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 2 台节点间通过 400G RDMA P2P 环状流转 KV 分块</text>
  <text x="460" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• FlashAttention-3 在线 Softmax 与 P2P 传输 96% 重叠</text>
  <text x="460" y="386" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 256K 首字延迟从 19.4s 压至 1.82s (提速 10.66 倍)</text>
  <text x="460" y="408" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 暴露通信占比仅 3.4% (彻底解锁 128K~1M 实时交互)</text>

  <!-- Right: 3-Tier KV Cache Pool -->
  <rect x="804" y="120" width="348" height="330" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="822" y="148" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">③ 三级分层 KV 缓存池 (恢复快 99x)</text>
  <rect x="820" y="164" width="316" height="272" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="832" y="188" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">L1 热层：GPU HBM3e (毫秒级活跃生成)</text>
  <text x="832" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 4.8 TB/s · 仅保留当前正在 Decode 的会话</text>
  <text x="832" y="232" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">L2 温层：Host Pinned DDR5 (Mooncake/HiCache)</text>
  <text x="832" y="252" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 每机 2TB DDR5 池化 · TP=4 PCIe5 聚合 216 GB/s</text>
  <text x="832" y="272" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 恢复 128K KV (21GB) 仅需 97 ms (重算需 9.6s!)</text>
  <text x="832" y="298" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">L3 冷层：3FS / Lustre NVMe + GDS 零拷贝</text>
  <text x="832" y="318" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 持久化跨天代码库/标书/法务卷宗百万词前缀</text>
  <text x="832" y="338" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• GDS 直读 45 GB/s (466ms 恢复 vs 9.6s 重算)</text>
  <text x="832" y="372" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12" font-weight="800">🏆 用户思考/阅读间隙自动换出 HBM：</text>
  <text x="832" y="394" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5">将多轮 128K Agent 所需 H200 从 32张压至 12张 (-62.5%)</text>

  <!-- Bottom Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #628 超长上下文全栈协同收益 (128K–256K 多轮代码库/法务 Agent · 16 并发团队)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 256K 首字延迟 (TTFT): 19.40 s ➔ 1.82 s (2D USP 提速 10.66x)   |   • 多轮 128K 恢复耗时: 9,600 ms (重算) ➔ 97 ms (L2 Pinned DDR5 快 99.0x)</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 集群总卡数: 32x H200 (仅靠 HBM 硬扛 + 驱逐重算) ➔ 12x H200 (三级 KV 池化 + MLA/FP8, 立省 62.5% GPU · 月省 $64,000)</text>
</svg>
