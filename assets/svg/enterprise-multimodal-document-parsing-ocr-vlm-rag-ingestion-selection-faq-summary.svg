  <rect width="1200" height="630" fill="url(#bg471)"/>
  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ENTERPRISE MULTIMODAL DOCUMENT PARSING, OCR &amp; RAG INGESTION SELECTION (R471)</text>
  <text x="65" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">Complexity-Routed Hybrid (`PyMuPDF` + GPU `Docling/MinerU` + Cropped VLM): $2.40/1K Pages</text>

  <rect x="40" y="138" width="545" height="445" rx="14" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="65" y="174" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ Single-Engine Ingestion Pitfalls (Tiers 1–3)</text>
  <text x="65" y="210" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 1 Naive CPU PDF Text (`PyMuPDF / pypdf`):</text>
  <text x="80" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Scrambles 2-column layouts &amp; merged tables (48.5% RAG accuracy)</text>
  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 2 100% Cloud Document AI API (`$10 / 1,000 pages`):</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Pays $150K/mo on 15M pages &amp; misses 46% of visual chart trends</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 3 100% Frontier VLM Page-by-Page (`$18.50 / 1,000 pages`):</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Burns $278K/mo rasterizing plain-text pages &amp; loses cell bboxes</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="430" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">15M Pages/Mo · 55% Text · 35% Tables · 10% Charts Pain:</text>
  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Naive CPU Table/Chart Accuracy: 48.5% / 12.0%</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Unrouted Cloud/VLM Cost: $10.00 – $18.50 per 1,000 pages</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Monthly Ingestion + Rework Cost: $148K – $278K / month</text>

  <rect x="615" y="138" width="545" height="445" rx="14" fill="#0f292a" stroke="url(#accent471)" stroke-width="2"/>
  <text x="640" y="174" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">🏆 Tier 4: Complexity-Routed Hybrid Ingestion Pipeline</text>
  <text x="640" y="210" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. 55% Simple Born-Digital Pages -&gt; CPU Fast-Path (`$0.15/1K`)</text>
  <text x="655" y="232" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">2ms PDF object-stream check routes single-column text to CPU</text>
  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. 35% Tables/Scans -&gt; GPU `Docling / MinerU` (`$1.80/1K`)</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Recovers multi-page HTML/Markdown tables + `[page, bbox]` coords</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. 10% Cropped Figures/Charts -&gt; VLM (`Qwen2.5-VL / GPT-4o`)</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Converts cropped charts &amp; architecture diagrams to JSON + captions</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (15 Million Pages / Month):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Complex Table &amp; Multi-Column RAG Accuracy: 96.4%</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Visual Chart &amp; Diagram QA Recall: 95.2% (vs 12%–54% OCR)</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Blended Cost per 1,000 Pages: $2.40 (vs $10.00–$18.50)</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly 15M-Page Ingestion TCO: $36,000 / mo (-76.9%)</text>
