  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Missed Inpatient CC/MCC Undercoding: 0.4% (down from 14.2%)</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• DNFB Coding Turnaround: 0.15 Days (3.6 hrs vs. 11.5 days)</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly Denial Write-Off &amp; Coding TCO: $78,000 / mo (-90.1%)</text>
