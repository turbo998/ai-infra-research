  <rect width="1200" height="680" fill="url(#bgGrad398)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级大模型成本治理 (AI FinOps)、Token 配额分账与智能级联降级路由选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：70/20/10 三级复杂度级联 + 80% 预算水位优雅软降级 + 单链路 $0.50 熔断，保持 98.8% 业务质量、99.99% 可用性且年省 $108万</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 398 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 全员共用顶配模型裸奔</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 15个部门共用 1 个主 API Key</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 简单分类/摘要也调最贵顶配大模型</text>
  <text x="40" y="212" fill="#34d399" font-size="12" font-weight="700">• 业务质量保持率：100.0%</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• Agent 死循环浪费占比：14.5% ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 财务无法分清哪个部门烧了多少钱 ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">4,000万次月账单：$112,000 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：“公地悲剧”——没人关心提示词长度</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">一个死循环测试脚本一晚上烧掉 8,000 美金</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 部门月度预算硬熔断</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 给每个部门设死每月 $4,000 硬上限</text>
  <text x="332" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 每月22号额度用光后直接报 HTTP 429 ✕</text>
  <text x="332" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 月度服务可用性：暴跌至 89.0% ✕</text>
  <text x="332" y="232" fill="#fde68a" font-size="12" font-weight="700">• Agent 死循环浪费占比：11.0%</text>
  <text x="332" y="252" fill="#fca5a5" font-size="12">• 月底最后 8 天业务系统全面瘫痪 ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">4,000万次月账单：$58,000 (停服)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">反模式：把成本控制做成“断电拉闸”</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">业务部门怨声载道，纷纷偷偷私买影子API</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 静态双级复杂度路由</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• RouteLLM 按问题难度分流 (65% 走 8B)</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 35% 复杂请求走 70B / 商用顶配</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 业务质量保持率：96.2% ✅</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 月度服务可用性：99.8% ✅</text>
  <text x="624" y="252" fill="#fde68a" font-size="12">• Agent 死循环浪费占比：6.5%</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">4,000万次月账单：$36,500 (-67.4%)✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：通用多模型路由降本基线</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：缺乏预算水位联动与单链路熔断保护</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 三级级联+软降级+熔断🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 70% 8B / 20% 70B / 10% 顶配三级级联</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 预算达 80% 水位自动软降级 (永不停服!)</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 业务质量保持率：98.8% 🏆</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 月度服务可用性：99.99% 🏆 (+10.99pts)</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• 单 Trace $0.50 死循环熔断：0% 浪费 🏆</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">4,000万次月账单：$21,800 (省80.5%)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级 AI 网关 FinOps 治理终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">每年为企业净省 $1,082,400 且业务零断流！</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么“预算快超支时自动软降级模型（Soft Downgrade）”比“硬报 429 停服”高明十倍？三大 FinOps 铁律</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad398)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 80% 预算水位优雅软降级（Graceful Model Shaping）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 当某部门月度 Token 预算消耗达到 `80%` 水位时：</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 网关绝不粗暴返回 HTTP 429 中断业务，而是自动将该部门</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  非核心流量 (P1/P2) 的默认模型从 70B 透明降级至自建 8B SLM！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 既 100% 守住月度财务总盘子，又实现 99.99% 全月连续可用！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 单次请求链路（Trace-ID）成本上限熔断器</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 企业大模型账单中 14.5% 是被陷入死循环的 Agent 烧掉的！</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 网关在 Redis 中按 `x-trace-id` 实时累加单次会话的子调用成本：</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  一旦单条 Trace 累计消耗超过 `$0.50` 或循环步数 &gt; 12 步，</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  网关立即熔断拦截并告警，彻底根除“一觉睡醒烧掉八千刀”事故！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 输入/输出不对称计价治理（Output Length Control）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 商用大模型 API 的 **输出 Token 单价是输入 Token 的 3~5 倍**！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 在网关层针对分类/路由/判断接口强制注入精简输出约束与</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  场景化 `max_completion_tokens` 上限，消灭礼貌性废话寒暄，</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  仅缩短 40% 输出废话长度就能直接砍掉全公司 25% 的总账单！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 398 合成标定算例 (independently_reproduced=false)</text>
</svg>
