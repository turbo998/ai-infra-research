<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad421" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad421" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad421)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级智能营销内容生成供应链（GenAI Marketing）、商品像素锁死与广告法合规 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">月均 18万张多国广告素材 / 2.5万个SKU · 传统外包修图+法务人工审稿 vs. 纯文生图/文案直发 vs. 品牌LoRA+敏感词表 vs. 前景像素锁死+IC-Light光影+功效证据矩阵</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">99.2% Pass · 0% 违规</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 外包摄影修图 + 法务人工审稿</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">一套活动图上新耗5天，外包费用高昂</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 2.5万SKU 无法针对15国做千人千面场景图</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 从创意到法务签字上线平均需 120.0 小时</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fde68a" font-size="13" font-weight="700">品牌视觉与文案合规率: 94.0%</text>
  <text x="54" y="334" fill="#6ee7b7" font-size="13" font-weight="700">广告法违规/Logo变形率: 0.8%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">活动物料上线周期: 120.0 小时 (5天 ✕)</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月设计外包与合规成本: $310,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：年度TVC主视觉，无法支撑全渠道实时营销</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 通用文生图 + 自由文案直发</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">瓶身Logo文字扭曲乱码，狂踩广告法罚单</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• Diffusion 重绘导致商品包装 Logo 与小字畸变</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 捏造“24小时根治皱纹/国家级第一”，违规率 15.4%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">品牌视觉与文案合规率: 58.5% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">广告法违规/Logo变形率: 15.4% (封号 ✕)</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">活动物料上线周期: 0.8 小时</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月外包与监管罚单成本: $395,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让通用文生图重绘真实在售商品主体像素</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 品牌 LoRA 微调 + 敏感词过滤</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">画风像了，但成分表微距字与隐性夸大仍错</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 每个新品都要重新训 LoRA，且细小商标仍会糊</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 静态词表拦不住“媲美医美手术”等隐性违规</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">品牌视觉与文案合规率: 79.2%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">广告法违规/Logo变形率: 4.6% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">活动物料上线周期: 6.5 小时</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月设计制作与合规成本: $135,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：氛围概念图生成，不满足严苛商品主图规范</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad421)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 前景像素锁死+功效库+Bandit 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">100%商品像素保真 + 功效证据链 + C2PA</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 锁定 3D/透明底实拍商品像素，仅用 IC-Light 重打光背景</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 功效宣称强制绑定实验室报告ID + C2PA水印 + 频控Bandit</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">品牌视觉与文案合规率: 99.2% 🏆 (+40.7pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">广告法违规/Logo变形率: 0.0% 🏆 (前景锁死)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">活动物料上线周期: 0.6 小时 (36分钟 🏆)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月内容供应链总成本: $42,000 (-86.5% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：快消美妆、消费电子、汽车与跨境电商千人千面</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业级 GenAI 营销供应链架构师铁律（Pixel-Locked Foreground + Claim Matrix + C2PA Pattern）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 商品主体像素绝对不可经扩散模型重绘：必须使用 Alpha 蒙版锁死实拍/3D 渲染商品前景（Logo 零变形），仅生成环境背景并由 IC-Light 对齐边缘环境反射光。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 广告文案功效宣称必须受限于法务预审通过的《功效宣称-检测报告对位库》(Claim Matrix) 并写入 C2PA 数字水印 · Provenance: synthetic + anonymized_reported</text>
</svg>
