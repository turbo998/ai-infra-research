<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#516 企业跨区域双活大模型容灾 (`Multi-Region Active-Active DR`) 与 850ms 秒级切换指南</text>
  <text x="30" y="60" class="sub">告别“单区重试雪崩 (45s)”与“主备双倍闲置税 (+100% 成本)” · 55%+55% 双活 + 800ms 首包熔断 + PAYGO 溢出立省 42.5%</text>

  <!-- Left Card -->
  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么传统 HTTP 健康检查救不了大模型“灰故障 (Grey Failure)”？</text>
  <text x="48" y="132" class="txt bad">• 痛点 1 (TCP/HTTP 200 假活): 节点仍在返回 200 OK，但首字延迟 TTFT 从 0.4s</text>
  <text x="64" y="150" class="txt bad">恶化至 18s，传统负载均衡器完全不切换，客户端盲目重试引发 45s 雪崩 ✕</text>
  <text x="48" y="174" class="txt warn">• 痛点 2 (传统 100%+100% 主备冷备): 备区常年闲置，白交 $24万/年 空转税 ✕</text>
  <text x="48" y="198" class="txt good">• 2026 双活容灾正解 (55% + 55% 双区 PTU/GPU + 800ms 首包超时熔断 🏆):</text>
  <text x="64" y="218" class="txt">① 平时两区各跑 50% 生产流量 (各配 55% 容量，容灾冗余税仅 +10%！)</text>
  <text x="64" y="238" class="txt">② AI 网关按 `SSE 首 Token 到达时间 (TTFT > 800ms)` 触发投机对冲/瞬时熔断</text>
  <text x="64" y="258" class="txt good">③ 主区故障时 0.85s 切至备区 (55% PTU) + 45% 自动溢出跨区/跨云 PAYGO 🏆</text>

  <!-- Right Card -->
  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 三种跨区高可用容灾架构的 SLA、切换 RTO 与年化 TCO 对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (单区部署 + 客户端指数退避重试): RTO = 45.0 s ✕</text>
  <text x="594" y="152" class="txt bad">年化有效可用性仅 99.45% (全年累计中断/卡死 48 小时！)</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (传统主备 100% 主区 + 100% 闲置备区): RTO = 1.8 s ✓</text>
  <text x="594" y="198" class="txt warn">可用性 99.98%，但容灾闲置税高达 +100% ($48.0 万/年 ✕)</text>
  <text x="578" y="224" class="txt good">• 方案 3 (双活 55%+55% + APIM/Envoy 800ms TTFT 熔断 + PAYGO 溢出 🏆):</text>
  <text x="594" y="246" class="txt good">- 故障切换 RTO: 0.85 s (比单区重试快 52.9 倍！实现用户零感知切换 🏆)</text>
  <text x="594" y="268" class="txt good">- 年化可用性 99.995% · 年化 TCO 仅 $27.6 万 (较传统主备立省 42.5% 🏆)</text>

  <!-- Bottom Card -->
  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 三种容灾架构的年化总成本 (Annual TCO) 与故障切换耗时 (RTO) 对比</text>

  <text x="48" y="378" class="txt">方案 1: 单区部署 + 客户端重试</text>
  <rect x="305" y="364" width="250" height="16" fill="#ef4444" rx="4"/>
  <text x="565" y="378" class="txt bad">$24.0万/年 | 但 RTO 高达 45.0s · 全年中断 48 小时 (99.45% SLA ✕)</text>

  <text x="48" y="418" class="txt">方案 2: 传统 100%+100% 主备闲置</text>
  <rect x="305" y="404" width="500" height="16" fill="#f59e0b" rx="4"/>
  <text x="815" y="418" class="txt warn">$48.0万/年 (+100% 备区空转税 ✕) | RTO = 1.8s (99.98% SLA)</text>

  <text x="48" y="458" class="txt good">方案 3: 55%+55% 双活 + PAYGO 溢出 🏆</text>
  <rect x="305" y="444" width="287" height="16" fill="#10b981" rx="4"/>
  <text x="602" y="458" class="txt good">$27.6万/年 (立省 42.5% 🏆) | RTO = 0.85s (快 52.9x) · 99.995% SLA 🏆</text>
</svg>
