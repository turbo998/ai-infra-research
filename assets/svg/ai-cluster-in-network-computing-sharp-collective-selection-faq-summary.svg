<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🖧 AI 集群网内计算 (NVLS + IB SHARP) 与集合通信拓扑卸载选型一图流总结</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">2,048×H200 SXM (256节点 × 8×400G NDR, 节点单向线速 400 GB/s) · 256MB AllReduce · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#67e8f9" font-size="13" font-weight="700" text-anchor="middle">Round 38 · NVLS &amp; IB SHARPv3</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 传统 NCCL Ring 环状规约</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">2(N-1) 跳线性延迟 + 2.0× 网络流量放大</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 2048卡算法带宽 algbw: <tspan fill="#f87171" font-weight="700">200.0 GB/s (仅半速 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 256MB AllReduce 延迟: <tspan fill="#f87171" font-weight="700">14.8 ms (4096卡 28.5ms ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 网卡发送字节放大比: <tspan fill="#f87171" font-weight="700">2.0× 载荷体积 ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 抢占 GPU 计算核心数: <tspan fill="#f87171" font-weight="700">20 个 SM / GPU ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 2048卡训练 MFU: <tspan fill="#f87171" font-weight="700">43.5% (跨园区 11.2%)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么 Ring 在两千卡以上必崩？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 同步 256MB 梯度必须在网口发 512MB 数据</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">(ReduceScatter+AllGather)；② 绕环 4,094 跳，</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">且白白吃掉每张 GPU 20 个 SM 算加法！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: NCCL Double Binary Tree</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">O(log N) 对数跳数 · 仍占 20 个 SM 与 2× 流量</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 2048卡算法带宽 algbw: <tspan fill="#fbbf24" font-weight="700">258.0 GB/s</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 256MB AllReduce 延迟: <tspan fill="#fbbf24" font-weight="700">6.4 ms (比 Ring 快 2.3x)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 网卡发送字节放大比: <tspan fill="#f87171" font-weight="700">仍为 2.0× 载荷体积</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 抢占 GPU 计算核心数: <tspan fill="#f87171" font-weight="700">20 个 SM / GPU (抢 GEMM)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 2048卡训练 MFU: <tspan fill="#fbbf24" font-weight="700">49.2% (跨园区 16.5%)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ RoCEv2 以太网集群的默认主力：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">互补双二叉树把跳数从 4094 压到了 22 跳，</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">但因为交换机不会算加法，数据仍要在服务器</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">网卡一进一出传 2 遍，且占用 15% GPU 算力！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: NVLS + IB SHARPv3 网内规约 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">NVSwitch 与 IB 交换机芯片硬件内做浮点加法</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 2048卡算法带宽 algbw: <tspan fill="#34d399" font-weight="700">368.0 GB/s (提升 1.84x 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 256MB AllReduce 延迟: <tspan fill="#34d399" font-weight="700">3.2 ms (快 4.62x 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 网卡发送字节放大比: <tspan fill="#34d399" font-weight="700">1.0× (网络流量立减 50% 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 抢占 GPU 计算核心数: <tspan fill="#34d399" font-weight="700">仅 4 个 SM (释放 16 个 SM 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 2048卡训练 MFU: <tspan fill="#60a5fa" font-weight="700">56.8% (+13.3pt 🏆)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">🏆 单数据中心万卡 IB 集群终极杀器：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">每个节点只往上发 1 次梯度 (1.0× 流量)，</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">Quantum-2/3 交换机 ASIC 边转发边累加并组</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">播发回！但切记防范“SHARP 树资源耗尽”！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 分层 SHARP + 跨机房 DiLoCo 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">通信域硬隔离防耗尽 + H=50 跨园区低频同步</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 2048卡算法带宽 algbw: <tspan fill="#34d399" font-weight="700">375.0 GB/s (达线速 93.8% 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 256MB AllReduce 延迟: <tspan fill="#34d399" font-weight="700">3.1 ms 🏆</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 交换机 SHARP 树耗尽报错: <tspan fill="#34d399" font-weight="700">0 次 (仅分配给 DP 域 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 单中心 2048卡 MFU: <tspan fill="#6ee7b7" font-weight="700">57.6% 🏆</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 跨园区 (10ms) 联合训练 MFU: <tspan fill="#34d399" font-weight="700">53.8% (+42.6pt 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🚀 跨楼宇/跨园区多机房拼集群唯一解：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 机房内用 Tier 3 NVLS+SHARP 高速同步；</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">② 机房之间每 H=50 步做一次 FP8 压缩外动</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">量同步 (DiLoCo)，跨 10ms 光纤仍保 53.8% MFU！</text>
  </g>

  <!-- Bottom Left: Cluster Scale Latency Curve -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📈 集群从 64 卡扩至 4,096 卡时 256MB AllReduce 耗时 (ms)：Ring vs. Tree vs. SHARP</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">为什么超过 512 张卡后，Ring 的延迟呈线性爆炸，而 NVLS + IB SHARP 几乎是一条平线？</text>

    <!-- 64 GPUs -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">64 GPUs (8 节点)</text>
    <rect x="175" y="74" width="35" height="14" rx="3" fill="#10b981"/>
    <text x="218" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">1.1 ms (NVLS+SHARP)</text>
    <rect x="175" y="92" width="58" height="14" rx="3" fill="#64748b"/>
    <text x="240" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">1.9 ms (Ring)</text>

    <!-- 256 GPUs -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">256 GPUs (32 节点)</text>
    <rect x="175" y="124" width="48" height="14" rx="3" fill="#10b981"/>
    <text x="230" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">1.7 ms (NVLS+SHARP)</text>
    <rect x="175" y="142" width="102" height="14" rx="3" fill="#f59e0b"/>
    <text x="284" y="154" fill="#fde68a" font-size="11.5" font-weight="700">3.8 ms (Ring)</text>

    <!-- 1024 GPUs -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">1,024 GPUs (128 节点)</text>
    <rect x="175" y="174" width="64" height="14" rx="3" fill="#10b981"/>
    <text x="246" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">2.4 ms (快 3.42x 🏆)</text>
    <rect x="175" y="192" width="195" height="14" rx="3" fill="#ef4444"/>
    <text x="378" y="204" fill="#f87171" font-size="11.5" font-weight="700">8.2 ms (Ring ✕)</text>

    <!-- 4096 GPUs -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">4,096 GPUs (512 节点)</text>
    <rect x="175" y="224" width="88" height="14" rx="3" fill="#10b981"/>
    <text x="270" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">3.9 ms (快 7.31x 🏆)</text>
    <rect x="175" y="242" width="310" height="14" rx="3" fill="#ef4444"/>
    <text x="492" y="254" fill="#f87171" font-size="11.5" font-weight="700">28.5 ms (Ring ✕)</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#67e8f9" font-size="11.5" font-weight="700">💡 为什么 SHARP 快？数据只上行 1 次到交换机 ASIC 算完直接组播下行，彻底消灭绕环等待！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师网内计算 (NVLS + SHARP) 生产避坑三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：防范“交换机 SHARP 树配额耗尽”崩溃</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• Quantum-2/3 交换机硬件同时支持的 SHARP Tree 数量有限（约 64~128 棵）！</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">• 严禁对所有通信组无脑全局开启 `IB_SHARP`；必须将 `IB_SHARP` **仅分配给跨机架 DP/FSDP 组**！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：机内 TP8 推理与训练必开 `NVLS (NVLink SHARP)`</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 机内 8 卡 NVSwitch 芯片自带硬件浮点加法器（NVLS），不仅让 TP AllReduce 降延迟，</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  还能把 NCCL 占用的 GPU SM 核心从 **20 个降到 4 个**，留出算力给 GEMM 矩阵乘重叠！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 铁律三：确定性可复现实验 (Bitwise Determinism) 时的取舍</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 浮点加法不满足结合律 $(a+b)+c \neq a+(b+c)$；若正在排查数值 Bug 需 0-ULP 逐比特对齐，</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  可临时设 `NCCL_ALGO=Ring`；正式大规模训练则开启 `NVLS + SHARP` 榨取 1.84x 带宽！</text>
  </g>
</svg>
