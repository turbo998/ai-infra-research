<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg468" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent468" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg468)"/>
  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ENTERPRISE RAG VECTOR DATABASE &amp; HYBRID SEARCH PLATFORM SELECTION (R468)</text>
  <text x="65" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">pgvectorscale vs. Azure AI Search / OpenSearch vs. Milvus / Qdrant: Scale &amp; TCO Matrix</text>

  <rect x="40" y="138" width="545" height="445" rx="14" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="65" y="174" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ Common Enterprise Vector DB Traps (Tier 1)</text>
  <text x="65" y="210" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Naive Post-Filtering After HNSW Top-K: collapses to</text>
  <text x="80" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">38.5% recall (or 0 results!) when user ACL permits &lt;1% of corpus</text>
  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Dense-Only Vector Search (No BM25/SPLADE RRF): misses</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">56.0% of exact SKU IDs, error codes (`ERR-4092`) &amp; legal clauses</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Uncompressed FP32 Full-RAM HNSW on 100M+ Vectors:</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">wastes $68K/mo on oversized DRAM instances without SQ8/DiskANN</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="430" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">80M Chunks (1536-d) · 1,200 QPS · 4,500 RBAC Groups Pain:</text>
  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Naive Post-Filtered RBAC Recall@10: 38.5%</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Dense-Only Exact SKU/Acronym Hit Rate: 44.0%</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Unquantized FP32 Full-RAM Cluster TCO: $68,000 / mo</text>

  <rect x="615" y="138" width="545" height="445" rx="14" fill="#0f292a" stroke="url(#accent468)" stroke-width="2"/>
  <text x="640" y="174" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">🏆 Right-Sized Platform Selection by Scale Tier</text>
  <text x="640" y="210" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. &lt;10M–20M Chunks: PostgreSQL + pgvectorscale DiskANN</text>
  <text x="655" y="232" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Zero new DB silo, ACID joins with business tables ($14K/mo, 91.5% rec)</text>
  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. 10M–100M Turnkey PaaS: Azure AI Search / OpenSearch</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Native Entra ID ACL trimming + BM25+Vector RRF + L2 Semantic Ranker</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. 100M–1B+ Multi-Tenant: Milvus / Zilliz or Qdrant</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Bitmap pre-filtered HNSW + Partition Keys + SQ8/NVMe ($22K/mo)</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (80M Chunks · 1,200 QPS):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Filtered RBAC Recall@10: 96.8% (Azure) – 98.4% (Milvus/Qdrant)</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Exact SKU / Error-Code Hit Rate (Hybrid RRF): 97.4% – 97.8%</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Hybrid Search P99 Latency: 16.5 – 28.0 ms</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly Cluster TCO: $14K (PG) / $22K (Milvus) / $31K (PaaS)</text>
</svg>
