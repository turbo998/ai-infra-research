<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 253 · FP8 SCALING PARADIGMS: DELAYED SCALING VS JIT VS 1X128 / 128X128 BLOCKWISE FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">FP8 Training: Delayed Scaling Outlier Trap (14.2 dB) vs `1x128` Online Blockwise (31.4 dB, 1.48x)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Per-Tensor Delayed vs JIT Scaling</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`Delayed Scaling` `amax_history=1024`): Uses step `t-1` scale;</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  sudden `SwiGLU` spike overflows `E4M3` (`&gt;448 -&gt; NaN`)! ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• 1 outlier channel (`5000`) crushes 99.9% of tensor into subnormal 0!</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (Per-Tensor `JIT`): Reads whole tensor 2x from HBM (`1.18x`)! ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Delayed SNR: 14.2 dB (+0.14 Loss Gap) | JIT Speedup: 1.18x ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Single Outlier Channel Destroys Dynamic Range Across 134M Elements</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Online `1x128` Tile + `128x128` Block / MXFP8</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Quantizes every `1x128` activation tile (`256B`) in Warp registers!</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Single-pass SRAM fused `warp_reduce_max` (`0` extra HBM reads!)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Quarantines activation outliers to 128 elements (+17.2 dB SNR!)</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Hopper `WGMMA` / Blackwell `MXFP8` (`1x32` `UE8M0`) hardware scaling</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">SNR: 31.4 dB (+17.2 dB) | Loss Gap: 0.001 | Speedup: 1.48x 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Zero `amax_history` State + Zero Stale-Scale Overflow + BF16 Parity</text>
</svg>
