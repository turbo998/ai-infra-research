<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg361" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc361" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg361)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="420" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="262" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 361 · CLOUD PAYGO vs. PTU vs. SELF-HOSTED AKS+KAITO</text>
  <text x="488" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="23.5" font-weight="800">企业大模型部署模式与 TCO 拐点选型：Serverless PAYGO vs. 预留 PTU vs. AKS+KAITO 自建 vs. 混合溢出</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">5,000 人企业 Copilot (月吞吐 12B Tokens，早晚峰谷比 3.5x)：为什么按峰值买 PTU 闲置 68% ($62.4K/月)，而“基荷预留 + PAYGO 溢出”立省 73.7% ($16.4K/月)？</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc361)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="68" y="184" width="228" height="24" rx="6" fill="#78350f"/>
  <text x="182" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 纯 Serverless API (PAYGO)</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">零预留起步 · 高峰 429 限流</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">公有云多租户共享池 · 按实际 Token 付费</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="80" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">生产上量痛点 (12B tok/月)：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">受共享 TPM/RPM 配额与邻居抢占限制，</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">早高峰触发 14.2% HTTP 429 报错 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (TCO): <tspan fill="#fbbf24" font-weight="700">$54,000 / 月 ($4.50/1M)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 高峰 429 限流率: <tspan fill="#f87171" font-weight="700">14.2% 请求被拒 ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TTFT / TPOT: <tspan fill="#f87171" font-weight="700">1,950 ms ✕ / 28.5 ms</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 运维负担 (SRE): <tspan fill="#34d399" font-weight="700">0 FTE (全托管免运维)</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="190" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 仅适合 PoC 或 &lt;1.5B tok/月低频应用</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="368" y="184" width="232" height="24" rx="6" fill="#7f1d1d"/>
  <text x="484" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 按峰值 100% 静态买 PTU</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">夜间闲置 68% · 账单最贵陷阱</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">按 420 RPM 最高峰包月采购独占 PTU</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="380" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么按峰值买 PTU 是财务灾难？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">企业流量峰谷比达 3.5x，夜间与周末</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">68% 预留算力空转，却要按 24h 全额付钱 ✕</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (TCO): <tspan fill="#f87171" font-weight="700">$62,400 / 月 ($5.20/1M ✕)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 预留算力利用率: <tspan fill="#f87171" font-weight="700">仅 32.0% (68% 闲置浪费 ✕)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TTFT / TPOT: <tspan fill="#34d399" font-weight="700">410 ms / 14.5 ms (0% 429)</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 运维负担 (SRE): <tspan fill="#34d399" font-weight="700">0 FTE (云端 SLA 兜底)</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="490" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁按最高并发水位 100% 静态买 PTU</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="236" height="24" rx="6" fill="#0c4a6e"/>
  <text x="786" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · 容器自建 AKS + KAITO / vLLM</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">开源权重自主 + 成本省 59.6%</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">AKS + KAITO/KEDA + vLLM FP8 + Multi-LoRA</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心优势与适用边界：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">数据 100% 不出 VPC，支持 Qwen/Llama</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">微调 LoRA 热挂载与 APC 前缀缓存复用</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (含SRE): <tspan fill="#38bdf8" font-weight="800">$21,800 / 月 ($1.82/1M ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 集群算力利用率: <tspan fill="#38bdf8" font-weight="800">68.5% (KEDA 弹性伸缩)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TTFT / TPOT: <tspan fill="#38bdf8" font-weight="800">480 ms / 13.8 ms ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 运维负担 (SRE): <tspan fill="#fbbf24" font-weight="700">~0.5 FTE K8s 平台工程师</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 开源微调模型 &amp; 强隐私合规首选</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 基荷预留 + PAYGO 溢出网关</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">利用率 86.5% · 成本暴降 73.7%</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">稳态 PTU/AKS (78%流量) + PAYGO 削峰 (22%)</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">架构师黄金法则 (Base + Burst)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">按均值 1.25x (150 RPM) 买预留底座，</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">早高峰超出部分由 AI 网关秒级溢出 PAYGO</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (TCO): <tspan fill="#34d399" font-weight="800">$16,400 / 月 ($1.37/1M 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 基荷利用率 / 429: <tspan fill="#34d399" font-weight="800">86.5% 利用率 / 0.0% 报错 🏆</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 TTFT / TPOT: <tspan fill="#34d399" font-weight="800">445 ms 🏆 / 14.2 ms 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月省预算 (vs T2): <tspan fill="#34d399" font-weight="800">每月净省 $46,000 (-73.7% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 企业生产级 AI 平台标准推荐架构</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心决策公式：如何用 2 个数字（全天平均利用率 U &amp; 月度 Token 总量 V）拍板部署模式？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">📐 拐点公式 1：预留吞吐 (PTU) vs. 按量付费 (PAYGO) 盈亏平衡线</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 当某流量水位线的全天 24 小时平均利用率 U &gt;= 34% 时，包月预留 PTU 比 PAYGO 更便宜；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 因此严禁按 420 RPM 最高峰买 PTU（峰顶水位每天只出现 1~2 小时，U &lt; 10%）；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 正确做法：按日均稳态的 1.25x (150 RPM) 采购基荷 PTU（U=86.5%），波峰自动溢出至 PAYGO！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 拐点公式 2：云托管 API vs. 容器化自建 (AKS + KAITO / vLLM) 选型边界</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 选云托管 (PTU+PAYGO)：需调用闭源旗舰模型 (GPT-4o/o3/Claude)、无专职 K8s GPU 运维团队；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 选 AKS+KAITO+vLLM 自建：月调用量 &gt;= 2.4B Tokens（跨过 1 台 8 卡服务器 + 0.5 SRE 成本线）、</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  使用开源权重 (Qwen-2.5/Llama-3.3/DeepSeek)、需挂载数十个业务 LoRA 或数据严禁出 VPC！</text>
</svg>
