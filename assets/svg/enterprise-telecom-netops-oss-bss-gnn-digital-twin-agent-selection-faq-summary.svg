<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级通信与云网自智运维 (Autonomous NetOps / OSS-BSS)：拓扑 GNN + Batfish 形式化仿真 + Agent 选型 (#442)</text>
  <text x="28" y="58" class="sub">为什么直接让大模型下发 BGP / 防火墙 CLI 变更会导致 22% 的全网断网事故？如何用“拓扑压缩 + Batfish 数字孪生预检”实现零断网？</text>

  <!-- Left Panel: Raw LLM CLI Execution Disaster vs Topology GNN + Batfish Formal Verification -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 云网运维红线：大模型直接刷 CLI 灾难 vs. 形式化数字孪生预检 (Batfish)</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 失败做法：让大模型读取告警后直接通过 SSH 下发 Cisco/SONiC 路由命令</text>
  <text x="56" y="164" class="mono">• 告警风暴淹没：一根主干光纤被挖断瞬间触发 12,000 条次生告警，塞爆上下文 ✕</text>
  <text x="56" y="184" class="mono">• 路由黑洞事故：大模型漏看一条上游 BGP Community 策略，下发后 22% 引发环路/断网 ✕</text>
  <text x="56" y="202" class="txt">• 结果：NOC 工程师不敢开启自动化，单次跨域故障排障耗时 (MTTR) 长达 95 分钟！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：时空图拓扑降噪 (99.4%压缩) + YANG/Netconf + Batfish 仿真门禁</text>
  <text x="56" y="272" class="mono">• 1. 光层/IP层/云网三层拓扑图将 12,000 条衍生告警在 2秒内聚合为 1 个根因节点</text>
  <text x="56" y="292" class="mono">• 2. Agent 生成标准 OpenConfig YANG 变更，先送入 Batfish 数学验证零路由黑洞/零环路</text>
  <text x="56" y="312" class="txt">• 3. 配套 `commit confirmed 5` 自动定时回滚保险，配置引发断网事故率压至 0.00%！</text>

  <!-- Right Panel: 4 Enterprise & Telecom NetOps Architectures -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大云网与通信自智运维 (L4 Autonomous NetOps) 方案对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fde68a">Tier 1: 传统 SNMP/Syslog 静态规则网管 + NOC 人工逐台登录排查</text>
  <text x="638" y="158" class="mono">• 告警压缩率仅 35% | 跨域故障 MTTR 95 分钟 ✕ | 人工值班成本 $185,000/月</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fca5a5">Tier 2: 纯大模型直接读原始 Syslog 并生成 SSH CLI 脚本 (无仿真预检)</text>
  <text x="638" y="214" class="mono">• 变更引发路由黑洞/断网率 22.0% ✕ (生产绝对禁用!) | MTTR 38 分钟</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 商业设备商封闭自动驾驶网络套件 (单厂商 SDN Copilot)</text>
  <text x="638" y="270" class="mono">• 根因准确率 86% | 跨多厂商 (Cisco+Arista+SONiC+云VPC) 协同难 | $140,000/月</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 跨层拓扑图降噪 + 3GPP/YANG Agent + Batfish 形式化仿真门禁 (🏆旗舰)</text>
  <text x="638" y="326" class="mono">• 根因准确率 96.4% 🏆 | 变更断网事故 0.00% 🏆 | MTTR 压至 4.2 分钟 | $28,500/月!</text>

  <!-- Bottom Panel: End-to-End L4 Autonomous NetOps Pipeline -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端 L4 自智网络“跨层拓扑归因 -> 数字孪生仿真 -> 事务级安全下发”架构</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 跨层拓扑因果折叠 (99.4% 降噪)</text>
  <text x="56" y="464" class="mono">• 融合底层光传输 (DWDM)、中间</text>
  <text x="56" y="484" class="mono">  RoCEv2/IB 交换机与上层 K8s Pod</text>
  <text x="56" y="504" class="mono">• 自动识别：`叶交换机 L3 端口闪断`</text>
  <text x="56" y="524" class="mono">  是上游根因，折叠 1.2万条次生告警</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">只把 1 个根因拓扑子图喂给大模型！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 只读诊断遥测自动采集 (gNMI)</text>
  <text x="332" y="464" class="mono">• 触发告警后 2 秒内自动拉取：</text>
  <text x="332" y="484" class="mono">  光模块收发光功率 (`dBm`)、</text>
  <text x="332" y="504" class="mono">  PFC 死锁计数器与 BGP 邻居状态</text>
  <text x="332" y="524" class="mono">• 32B 运维大模型生成绕行隔离方案</text>
  <text x="332" y="550" class="txt" fill="#34d399">免除人工逐台敲 show 命令的 45 分钟！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ Batfish 形式化控制面仿真预检</text>
  <text x="620" y="464" class="mono">• 严禁直接写生产路由器！</text>
  <text x="620" y="484" class="mono">• 先在 Batfish / Containerlab 孪生</text>
  <text x="620" y="504" class="mono">  沙箱内重算全网 RIB/FIB 转发表</text>
  <text x="620" y="524" class="mono">• 数学证明：无黑洞、无环路、ACL合规</text>
  <text x="620" y="550" class="txt" fill="#fde68a">100% 拦截会破坏连通性的错误配置！</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ NETCONF 事务下发与自动回滚</text>
  <text x="908" y="464" class="mono">• 通过 OpenConfig YANG 原子事务</text>
  <text x="908" y="484" class="mono">  执行 BGP Drain 优雅摘流</text>
  <text x="908" y="504" class="mono">• 强制开启 `commit confirmed`：</text>
  <text x="908" y="524" class="mono">  若失联或丢包飙升则设备自动回滚</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">跨域故障 MTTR 从 95 分钟压至 4.2 分钟</text>
</svg>
