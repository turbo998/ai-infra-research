<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#642 企业 Agent 结构化输出 (JSON Schema) 约束解码引擎选型、前跳解码 (Jump-Forward) 与 CPU 配比</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">Structured Output Sizer: Prompt Retry vs. Outlines FSM vs. XGrammar / llguidance (0.04ms Mask + 2.18 tok/step Jump-Forward = 1.85x TPS)</text>

  <!-- Left: Why JSON Schema Breaks Naive LLM Serving -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FDE68A" font-size="15" font-weight="700">① 为什么企业 Agent 结构化输出会成为吞吐瓶颈？</text>
  <rect x="40" y="150" width="333" height="104" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 痛点 A：纯 Prompt 约束 (91.4% 合格率 → 重试风暴)</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">· 5 步串联 Tool Call 成功率仅 `0.914^5 = 63.8%`</text>
  <text x="52" y="214" fill="#CBD5E1" font-size="12">· 括号未闭合 / 枚举越界触发整轮重新生成 (`+28%` 废算力)</text>
  <text x="52" y="234" fill="#FCA5A5" font-size="12" font-weight="700">· 痛点 B：初代动态正则掩码在 B=128 时卡死 CPU！</text>

  <rect x="40" y="266" width="333" height="110" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="52" y="288" fill="#38BDF8" font-size="13" font-weight="700">🔍 CPU 词表掩码阻塞 GPU 的数学机理 (V = 152,064)</text>
  <text x="52" y="310" fill="#F8FAFC" font-size="12">· 每步 Decode 需为 Batch 内 `B` 个请求生成合法 Token 位图</text>
  <text x="52" y="330" fill="#CBD5E1" font-size="12">· 初代未优化引擎单步 CPU 掩码耗时 `12.5 ms` (@B=128)</text>
  <text x="52" y="350" fill="#FCA5A5" font-size="12" font-weight="700">· 结果：GPU 本只需 11ms，却等 CPU 12.5ms，吞吐腰斩 53%！</text>

  <rect x="40" y="388" width="333" height="90" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="410" fill="#6EE7B7" font-size="13" font-weight="700">✅ 破局：XGrammar / llguidance 字节级下推自动机</text>
  <text x="52" y="430" fill="#D1FAE5" font-size="12">· 将词表拆为上下文无关预编译缓存 (`99%` Tokens 免动态匹配)</text>
  <text x="52" y="448" fill="#D1FAE5" font-size="12">· 单步掩码耗时从 `12.5 ms` 压至 **`0.04 ms` (-99.7%)**</text>
  <text x="52" y="466" fill="#6EE7B7" font-size="12" font-weight="700">· 动态 Schema 首请求编译从 `3.8s` 降至 **`1.2 ms`**！</text>

  <!-- Center: Jump-Forward Decoding -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 前跳解码 (Jump-Forward)：结构化输出反而比自由文本快 1.85x！</text>

  <rect x="423" y="150" width="354" height="148" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="435" y="172" fill="#6EE7B7" font-size="13" font-weight="700">⚡ 什么是确定性语法分支前跳 (Deterministic Jump-Forward)？</text>
  <text x="435" y="194" fill="#F8FAFC" font-size="12">当 JSON Schema 规定下一个字段名固定为：</text>
  <text x="435" y="216" fill="#38BDF8" font-size="12" font-family="Consolas, monospace">  {"action": "query_crm", "parameters": {"account_id":</text>
  <text x="435" y="238" fill="#CBD5E1" font-size="12">· 传统解码：老老实实跑 `14` 次自回归 Decode HBM 搬运</text>
  <text x="435" y="258" fill="#6EE7B7" font-size="12" font-weight="700">· Jump-Forward (SGLang + XGrammar/llguidance)：</text>
  <text x="435" y="278" fill="#D1FAE5" font-size="12">  自动机检测到唯一合法路径，零 GPU 采样直接拼接 `14` 个 Token，</text>
  <text x="435" y="292" fill="#6EE7B7" font-size="11">  作为单次 Chunked Prefill 一次性刷入 KV Cache！</text>

  <rect x="423" y="310" width="354" height="168" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="435" y="332" fill="#FDE68A" font-size="13" font-weight="700">📐 JSON 样板冗余度 (β) 与等效生成加速比手算公式</text>
  <text x="435" y="354" fill="#F8FAFC" font-size="12" font-weight="700">  Speedup = 1 / [ (1 - β) + β / L_jump ] ≈ 1.85× (@ β = 0.54)</text>
  <text x="435" y="376" fill="#D1FAE5" font-size="12">· 企业 CRM/ERP Tool Call 平均 `54%` Token 为键名/括号/引号</text>
  <text x="435" y="396" fill="#D1FAE5" font-size="12">· 每步 GPU 前向平均产出 **`2.18` 个有效 JSON Token**</text>
  <text x="435" y="416" fill="#6EE7B7" font-size="12" font-weight="700">· 等效端到端 JSON 生成耗时从 `4.20s` 降至 `2.27s` (-46.0%)</text>
  <text x="435" y="436" fill="#A7F3D0" font-size="12">· Schema 语法合格率：**`100.00%`** (0 重试浪费)</text>
  <text x="435" y="458" fill="#CBD5E1" font-size="11">· 配套 CPU 配比：每张 GPU 仅需配 `4 vCPU` 异步掩码线程即可跑满</text>

  <!-- Right: 4-Stack Comparison -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="829" y="136" fill="#38BDF8" font-size="15" font-weight="700">③ 四大结构化输出引擎横向实测 (B=128 · 70B FP8)</text>

  <rect x="827" y="150" width="333" height="76" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="839" y="170" fill="#FCA5A5" font-size="13" font-weight="700">1. 纯 Prompt + 失败重试 (Unconstrained)</text>
  <text x="839" y="190" fill="#E2E8F0" font-size="12">· 5步 Agent 成功率: `63.8%` | 有效吞吐: `2,680 tok/s`</text>
  <text x="839" y="208" fill="#FCA5A5" font-size="12">· 评价：生产环境不可接受，重算浪费 28% GPU 卡时</text>

  <rect x="827" y="236" width="333" height="76" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="839" y="256" fill="#FDE68A" font-size="13" font-weight="700">2. 初代 Outlines 正则 FSM (无预编译分拆)</text>
  <text x="839" y="276" fill="#E2E8F0" font-size="12">· 动态 Schema 首编译: `3,800 ms` | 掩码耗时: `12.5 ms/step`</text>
  <text x="839" y="294" fill="#FDE68A" font-size="12">· 评价：100% 合格，但高并发下 CPU 掩码把吞吐拖降至 `1,920 tok/s`</text>

  <rect x="827" y="322" width="333" height="76" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="839" y="342" fill="#38BDF8" font-size="13" font-weight="700">3. vLLM V1 + XGrammar (异步位图掩码)</text>
  <text x="839" y="362" fill="#E2E8F0" font-size="12">· 动态编译: `4.5 ms` | 掩码耗时: `0.06 ms/step` (GPU 零等待)</text>
  <text x="839" y="380" fill="#38BDF8" font-size="12">· 评价：100% 合格，恢复满血吞吐 `4,150 tok/s`</text>

  <rect x="827" y="408" width="333" height="74" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="839" y="428" fill="#6EE7B7" font-size="13" font-weight="700">4. SGLang + XGrammar/llguidance + Jump-Forward</text>
  <text x="839" y="448" fill="#F8FAFC" font-size="12">· 动态编译: `1.2 ms` | 掩码: `0.04 ms` | 前跳: **`2.18 tok/step`**</text>
  <text x="839" y="466" fill="#6EE7B7" font-size="12" font-weight="700">· 评价：等效 JSON 吞吐飙至 **`7,680 tok/s` (提速 1.85x，省 46% 卡)**</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 结构化输出与 Tool Call 架构设计铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 100% 开启 `XGrammar` 或 `llguidance` 约束解码：彻底消灭 JSON 解析失败重试，将 5 步串联 Agent 端到端格式可靠率从 63.8% 锁定至 100.0%；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 启用 Jump-Forward + Schema 键序紧凑化：把必填枚举与短键名排在前面、思维链字段 (`reasoning`) 显式前置，使有效 JSON 吞吐反超自由文本 1.85 倍。</text>
</svg>
