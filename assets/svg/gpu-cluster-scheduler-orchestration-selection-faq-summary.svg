<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg17" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent17" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg17)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent17)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">企业级 AI 智算集群调度器与拓扑编排架构选型一图流 (Round 17 · 512×H100)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">原生 K8s (48.2% Goodput) vs. 独立 Slurm (74.0%) vs. Volcano/Kueue Gang (71.5%) vs. Kueue TAS + K8s DRA (88.6%, 月省 $377.5k)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Scheduling Deadlocks & Topology Physics -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#fcd34d" font-size="16" font-weight="800">① 为什么原生 K8s 跑大模型训练会死锁且掉速 38%？Slurm 与 K8s 如何抉择？</text>

  <rect x="44" y="168" width="510" height="80" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 原生 K8s Default Scheduler 双重灾难: 18.5% 死锁 + 38.0% 跨脊降速</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 逐 Pod 调度导致两个 64 卡任务互抢资源卡死；跨 8 个机柜随机打散 + 忽略 GPU/NIC NUMA 亲和</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 512 卡集群真实有效算力产出 (Goodput) 跌至 48.2%，每月白白蒸发 $484,019.20 算力租金！</text>

  <rect x="44" y="260" width="510" height="82" rx="8" fill="#422006" stroke="#eab308"/>
  <text x="58" y="282" fill="#fde047" font-size="13.5" font-weight="700">🟨 Tier 2 独立 Slurm HPC 调度: 纯训练极强，但面临 14.0% 训推静态孤岛损耗</text>
  <text x="58" y="304" fill="#fef08a" font-size="12">• 原生 topology/tree 交换机紧致分配使通信损耗仅 4.5%，但缺乏云原生在线推理微服务网关能力</text>
  <text x="58" y="324" fill="#fef08a" font-size="12">• 夜间空闲的 K8s 推理卡池无法自动借给 Slurm 训练队列，综合 Goodput 停留在 74.0%</text>

  <rect x="44" y="354" width="510" height="84" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="376" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 K8s + Volcano / Kueue Gang: 消灭死锁，但仍缺交换机与 PCIe 拓扑感知</text>
  <text x="58" y="398" fill="#d1fae5" font-size="12">• All-or-Nothing 整组调度将死锁碎片率从 18.5% 压至 1.5%，打通训推统一资源池</text>
  <text x="58" y="420" fill="#d1fae5" font-size="12">• ⚠️ 未启用拓扑域约束时跨 Leaf 交换机散落仍带来 +24.0% 通信惩罚 (Goodput 71.5%)</text>

  <rect x="44" y="450" width="510" height="94" rx="8" fill="#1e1b4b" stroke="#3b82f6"/>
  <text x="58" y="472" fill="#93c5fd" font-size="13.5" font-weight="700">🟦 Tier 4 Kueue TAS (宏观机柜紧致) + K8s DRA (微观 GPU+NIC 同 Root): 88.6% Goodput!</text>
  <text x="58" y="494" fill="#dbeafe" font-size="12">• Kueue TAS 将 64 卡作业严格打包进单一 Leaf 交换机机柜；K8s DRA + TopologyManager</text>
  <text x="58" y="514" fill="#dbeafe" font-size="12">  确保 GPU 与对应 RoCE 网卡严格绑定同一 PCIe Root Complex，通信开销骤降至 3.2%</text>
  <text x="58" y="534" fill="#6ee7b7" font-size="12" font-weight="700">• 叠加训推潮汐借用，每月从 512 卡集群挽回 $377,497.60 算力损失 (-45.6% 单位成本)!</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#93c5fd" font-size="16" font-weight="800">② 四档集群调度与拓扑编排架构定量对比 (512×H100 · 月租 $934.4k)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">集群调度器与拓扑架构档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">死锁碎片 / 通信惩罚</text>
  <text x="955" y="190" fill="#cbd5e1" font-size="12" font-weight="700">有效 Goodput</text>
  <text x="1055" y="190" fill="#cbd5e1" font-size="12" font-weight="700">月度浪费 / 挽回</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: 原生 K8s Default Scheduler</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">逐 Pod 抢占死锁 + 跨机柜随机散落</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">18.5% 死锁</text>
  <text x="828" y="256" fill="#fca5a5" font-size="11">+38.0% 通信 ✕</text>
  <text x="955" y="236" fill="#fca5a5" font-size="12" font-weight="700">48.2% (1.00x)</text>
  <text x="955" y="256" fill="#cbd5e1" font-size="11">$518.67/100h</text>
  <text x="1055" y="236" fill="#fca5a5" font-size="12" font-weight="700">浪费 $484.0k/月</text>
  <text x="1055" y="256" fill="#94a3b8" font-size="11">基准线 (0.0%)</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: 独立 Slurm HPC + topology/tree</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">纯训练极佳 · 训推静态分池孤岛浪费 14%</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">14.0% 孤岛</text>
  <text x="828" y="332" fill="#6ee7b7" font-size="11">+4.5% 通信 ✅</text>
  <text x="955" y="312" fill="#fde047" font-size="12" font-weight="700">74.0% (1.54x)</text>
  <text x="955" y="332" fill="#cbd5e1" font-size="11">$337.84 (-34.9%)</text>
  <text x="1055" y="312" fill="#fde047" font-size="12" font-weight="700">浪费 $242.9k/月</text>
  <text x="1055" y="332" fill="#6ee7b7" font-size="11">挽回 $241.1k/月</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: K8s + Volcano / Kueue Gang</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">整组调度防死锁 · 无交换机/DRA 拓扑感知</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">1.5% 死锁 ✅</text>
  <text x="828" y="408" fill="#fde047" font-size="11">+24.0% 通信 ⚠️</text>
  <text x="955" y="388" fill="#6ee7b7" font-size="12" font-weight="700">71.5% (1.48x)</text>
  <text x="955" y="408" fill="#cbd5e1" font-size="11">$349.65 (-32.6%)</text>
  <text x="1055" y="388" fill="#6ee7b7" font-size="12" font-weight="700">浪费 $266.3k/月</text>
  <text x="1055" y="408" fill="#6ee7b7" font-size="11">挽回 $217.7k/月</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#1e1b4b" stroke="#3b82f6" stroke-width="2"/>
  <text x="622" y="462" fill="#93c5fd" font-size="12.5" font-weight="700">Tier 4: Kueue TAS + K8s DRA + NUMA</text>
  <text x="622" y="484" fill="#dbeafe" font-size="11">机柜级紧致装箱 + GPU/NIC 同 Root + 潮汐借用</text>
  <text x="828" y="464" fill="#34d399" font-size="12" font-weight="700">0.8% 碎片 ✅</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">+3.2% 通信 🏆</text>
  <text x="955" y="464" fill="#93c5fd" font-size="12.5" font-weight="800">88.6% (1.84x)</text>
  <text x="955" y="484" fill="#34d399" font-size="11" font-weight="700">$282.17 (-45.6%)</text>
  <text x="1055" y="464" fill="#93c5fd" font-size="12.5" font-weight="800">仅耗 $106.5k/月</text>
  <text x="1055" y="484" fill="#34d399" font-size="11" font-weight="700">挽回 $377.5k/月!</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 256 卡大任务拐点：无拓扑感知 Gang (Tier 3) Goodput 跌至 56.5%，Kueue TAS+DRA (Tier 4) 稳守 84.8%!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#3b82f6"/>
  <text x="44" y="606" fill="#93c5fd" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for AI GPU Cluster Scheduling）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fde047">纯科研封闭预训练大集群选 Tier 2 (Slurm + Pyxis)</tspan>；<tspan font-weight="700" fill="#93c5fd">企业训推一体云平台必选 Tier 4 (K8s + Kueue TAS + DRA)</tspan>。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#6ee7b7">Gang 解决“拿不全卡死锁”，Kueue TAS 解决“跨 Leaf/Spine 散落”，K8s DRA 解决“GPU 与 RDMA 网卡跨 NUMA 错配”</tspan>。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/gpu_cluster_scheduler_selection/results.json · tests/test_gpu_cluster_scheduler_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
