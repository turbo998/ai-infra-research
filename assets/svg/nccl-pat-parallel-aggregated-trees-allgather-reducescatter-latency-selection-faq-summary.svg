<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 222 · NCCL 2.23+ PAT (PARALLEL AGGREGATED TREES) VS. RING FOR 1,024-GPU FSDP ALLGATHER/REDUCESCATTER</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">1,024-GPU FSDP Collectives: 1,023-Hop Ring (7.65 ms) vs 7-Hop NCCL PAT Binomial Trees (1.12 ms, 6.83x)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Legacy Ring AllGather / ReduceScatter</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Classic NCCL `Tree` ONLY supported `AllReduce` (NOT AllGather!)</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• FSDP / ZeRO-3 `AllGather` &amp; `ReduceScatter` were forced onto `Ring`</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• At 1,024 GPUs (128 nodes), a 64 MB layer weight slice is split into</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  tiny 64 KB chunks traversing 1,023 (or 127 inter-node) serial hops ✕</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Latency: 7,650 µs (Flat Ring) / 3,420 µs (127-Node Ring)</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">AlgBW Drops to 8.37 GB/s — Dominated by Per-Hop Per-Packet Latency</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: NCCL 2.23+ PAT (Parallel Aggregated Trees)</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Schedules N overlapping binomial trees across all 128 nodes</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Aggregates messages at each tree level (payload doubles each hop)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Collapses inter-node hops from O(N)=127 down to log2(128) = 7 hops!</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Achieves 1x optimal traffic volume with O(log N) latency scaling</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Latency: 1,120 µs (6.83x Faster) | AlgBW: 57.14 GB/s 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Unlocks Scalable FSDP2 / ZeRO-3 Training at 1,024 to 16,384 GPUs</text>
</svg>
