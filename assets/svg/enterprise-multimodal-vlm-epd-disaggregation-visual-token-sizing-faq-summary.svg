<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#573 企业多模态大模型 (VLM) 推理架构：EPD 三池分离 (Encode-Prefill-Decode) 与视觉 Token 手算</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">破解 600M ViT 视觉编码阻塞 8x H200 TP=8 大模型陷阱 · L40S 跑 Encode + H100 跑 Prefill + H200 跑 Decode · 吞吐涨 3.42x · 省 58.4% 成本</text>

  <!-- Box 1: Visual Token Math -->
  <rect x="24" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 动态高分辨率视觉 Token 手算公式</text>
  <rect x="42" y="152" width="310" height="100" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="52" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">AnyRes 动态切片 + 2×2 Pixel Shuffle 合并：</text>
  <text x="52" y="191" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">N_vis = (N_tiles + 1) × (H_tile/14)² / 4</text>
  <text x="52" y="211" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 单块 448×448 Patch14 = 1024 → 2×2 合并后 256 词</text>
  <text x="52" y="229" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 1 张 4K 财报/图纸 (12切片+缩略图) = 3,328 视觉词!</text>

  <rect x="42" y="260" width="310" height="108" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="280" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 同卡混跑 ViT + LLM 的三大算力灾难：</text>
  <text x="52" y="299" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. ViT 仅 600M 参数，强行开 TP=8 通信占比 &gt;65%</text>
  <text x="52" y="317" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. 跑 ViT 期间 72B LLM 的 140GB 显存 100% 闲置</text>
  <text x="52" y="335" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">3. 阻塞同卡在途 Decode，P99 TPOT 飙至 52.0ms!</text>

  <!-- Box 2: EPD Three-Pool Disaggregation -->
  <rect x="386" y="110" width="354" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="404" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② EPD 三池分离 + 异构 GPU 编排 🏆</text>
  <rect x="404" y="152" width="318" height="66" rx="8" fill="#0f172a" stroke="#fbbf24"/>
  <text x="416" y="172" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">1. E 池 (Vision Encode)：4x L40S (TP=1 数据并行)</text>
  <text x="416" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 独立并发解码 JPEG/视频帧 + 跑 600M ViT + 哈希缓存</text>
  <text x="416" y="208" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 输出紧凑 FP8 视觉特征 (3,328×3584B ≈ 11.9MB/图)</text>

  <rect x="404" y="226" width="318" height="66" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="416" y="246" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">2. P 池 (LLM Prefill)：4x H100 80GB (TP=4 FP8)</text>
  <text x="416" y="265" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• RDMA 接收视觉特征 + 文本 Token 做混合注意力 Prefill</text>
  <text x="416" y="282" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 开启 PyramidDrop / FastV 剪除 50% 冗余背景块</text>

  <rect x="404" y="300" width="318" height="68" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="416" y="320" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">3. D 池 (LLM Decode)：8x H200 141GB (TP=4×DP=2)</text>
  <text x="416" y="339" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 零 ViT 干扰、零 Prefill 干扰，专职流式吐字</text>
  <text x="416" y="356" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• P99 TPOT 稳在 12.4 ms (提速 4.19 倍!)</text>

  <!-- Box 3: Quantitative Comparison -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 72B VLM 25 QPS 实测账本</text>
  <rect x="774" y="152" width="264" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="176" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 A (Monolithic 混部 · 24x H200):</text>
  <text x="786" y="194" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• P99 TPOT: 52.0 ms · Goodput 61.5%</text>
  <text x="786" y="212" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 单图平均成本: $1.95 / 1K 图像请求</text>

  <text x="786" y="242" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 B (标准两池 PD 分离 · 20x H200):</text>
  <text x="786" y="260" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• P99 TPOT: 14.5 ms · Goodput 94.0%</text>
  <text x="786" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• ViT 仍占用昂贵 H200 Prefill 卡 ($1.38/1K)</text>

  <text x="786" y="308" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">方案 C (异构 EPD 三池分离) 🏆</text>
  <text x="786" y="326" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 4x L40S(E) + 4x H100(P) + 8x H200(D)</text>
  <text x="786" y="344" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• TPOT 12.4ms · $0.81 / 1K (省 58.4%!)</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 多模态大模型 (Qwen2.5-VL / InternVL / Llama-Vision) 容量设计三铁律：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. 视觉词折算铁律：算卡前必须先将分辨率折算为 Visual Tokens（1张高清多切片图 = 2,500~6,400 Tokens，远大于纯文本提示词！）。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">2. EPD 解耦铁律：将轻量 ViT 编码器剥离到廉价 L40S 单卡池 (TP=1)，并对图片 SHA-256 缓存视觉 Embedding，免除多轮对话重复编图。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">3. 异步解码铁律：使用 nvJPEG 硬件解码在独立 CUDA Stream 上预处理图像，绝不允许 Python PIL/OpenCV 阻塞主推理线程！</text>
</svg>
