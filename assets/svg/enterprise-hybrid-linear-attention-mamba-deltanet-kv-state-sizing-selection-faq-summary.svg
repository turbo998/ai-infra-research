<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业超长上下文混合线性注意力模型 (7:1 Hybrid Mamba / Gated DeltaNet + Full Attention) 算卡选型 (#478)</text>
  <text x="28" y="58" class="sub">为什么新一代模型 (Qwen3-Next / MiniMax-01 / Nemotron-H) 把 87.5% 的层换成 O(1) 线性状态？256K 显存直降 87.2%、并发暴涨 7.75x！</text>

  <!-- Left Panel: Full Softmax vs Pure Linear vs 7:1 Hybrid -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么纯 Transformer 跑百万上下文会爆显存，而纯 Mamba 却会丢掉大海捞针？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 纯全量注意力 vs. 纯线性注意力的两难死结</text>
  <text x="56" y="164" class="mono">• 纯 GQA-8 (80层全注意): 单条 256K 请求需 40.96 GB KV，8卡仅能跑 16 并发！</text>
  <text x="56" y="184" class="mono">• 纯线性注意力 / 纯 Mamba-2: 虽把状态压到固定 0.16 GB (与长度无关 O(1))，</text>
  <text x="56" y="202" class="mono">  但因无法精确回溯任意历史 Token，大海捞针精确拷贝召回率暴跌至 64.0%！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 7:1 黄金混合架构 (7层 Gated DeltaNet/Mamba-2 + 1层 Full Attention 🏆)</text>
  <text x="56" y="268" class="mono">• 80 层中仅保留 10 层 (12.5%) 全量 Softmax 注意力负责精准大海捞针 (99.1%)；</text>
  <text x="56" y="288" class="mono">• 其余 70 层 (87.5%) 采用 O(1) 恒定大小的循环状态矩阵 S_t (总计仅 140 MB)！</text>
  <text x="56" y="308" class="mono">• 单条 256K 显存从 40.96 GB 骤降至 5.26 GB (-87.2%)，并发从 16 飙至 124 路！</text>

  <!-- Right Panel: 4 Attention Architectures at 256K Context -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 256K 超长上下文四种注意力架构定量对标 (8x H200 节点)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 纯全量 GQA-8 Transformer (80 层全量 KV Cache)</text>
  <text x="638" y="158" class="mono">• 256K显存: 40.96 GB ✕ | TTFT: 8.40s | 大海捞针: 99.2% | 8卡并发: 16路</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 纯线性注意力 / 纯 Mamba-2 SSM (80 层恒定循环状态)</text>
  <text x="638" y="214" class="mono">• 256K显存: 0.16 GB | TTFT: 1.15s | 大海捞针: 64.0% ✕ | 8卡并发: 512路</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 纯滑动窗口注意力 (Sliding-Window 4K，窗口外直接丢弃)</text>
  <text x="638" y="270" class="mono">• 256K显存: 0.64 GB | TTFT: 1.45s | 大海捞针: 38.5% ✕ | 8卡并发: 320路</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 7:1 混合线性架构 (70层 DeltaNet/Mamba + 10层 Full GQA) (推荐 🏆)</text>
  <text x="638" y="326" class="mono">• 256K显存: 5.26 GB 🏆 | TTFT: 1.62s 🏆 | 大海捞针: 99.1% 🏆 | 并发: 124路 (7.8x)</text>

  <!-- Bottom Panel: Hybrid Memory Formula & Prefix Cache Checkpoint Trap -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 混合架构显存手算公式与“为什么 Mamba 状态不能像 PagedAttention 一样随便回退 3 个词”？</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 混合线性模型单请求显存手算公式</text>
  <text x="58" y="464" class="mono">• M_req(S) = L_full * (2 * n_kv * d_h * b) * S</text>
  <text x="58" y="484" class="mono">             + L_lin * (n_v * d_k * d_v * b_state)</text>
  <text x="58" y="506" class="txt">• 第一项 (10层 Full Attention) 随长度 S 线性增长</text>
  <text x="58" y="526" class="txt">  但斜率缩小为原来的 1/8 (20.48 KB/tok)！</text>
  <text x="58" y="546" class="txt">• 第二项 (70层 Linear State) 恒定为 ~140 MB，</text>
  <text x="58" y="566" class="txt">  哪怕序列拉长到 100 万 Token 也不再涨 1 字节！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: 线性复杂度消除长上下文 Prefill 墙</text>
  <text x="436" y="464" class="mono">• 传统注意力 Prefill 算力 O(L * S^2)：</text>
  <text x="436" y="484" class="mono">  在 S = 256K 时 85% 算力耗在 Q*K^T 矩阵上</text>
  <text x="436" y="504" class="mono">• 7:1 混合架构将 87.5% 的层变为分块并行</text>
  <text x="436" y="524" class="mono">  Chunkwise Linear Attention O(S)，256K 首字</text>
  <text x="436" y="544" class="mono">  TTFT 直接从 8.40s 暴降至 1.62s (提速 5.2x)！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: 循环状态 Prefix Cache 边界快照铁律</text>
  <text x="814" y="464" class="mono">• 踩坑: RNN/Mamba 状态 S_t 是原位覆盖累加的，</text>
  <text x="814" y="484" class="mono">  无法像 KV Cache 那样直接切掉末尾 50 个词回滚！</text>
  <text x="814" y="504" class="mono">• 解法 (Interval State Snapshotting):</text>
  <text x="814" y="524" class="mono">  在 System Prompt 结尾、每轮对话边界或每</text>
  <text x="814" y="544" class="mono">  512/1024 Token 处保存一份 140MB 状态快照，</text>
  <text x="814" y="564" class="mono">  回退到最近快照仅需重算 &lt;512 个词 (耗时 4ms)！</text>
</svg>
