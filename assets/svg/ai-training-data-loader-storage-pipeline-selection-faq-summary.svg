<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg24" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent24" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg24)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent24)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">PB 级多模态预训练数据加载与流式预处理选型一图流 (Round 24 · 256×H100 · 1.2PB)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">POSIX 小文件 (64.5% 饥饿) vs. WebDataset Tar (CPU 解码满载) vs. MosaicML MDS/LitData (0.4s 断点恢复) vs. DALI + GDS (68.2% MFU)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Small-File IOPS & CPU Decode Bottleneck -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#67e8f9" font-size="16" font-weight="800">① 为什么 256 张 H100 训练多模态时会有 64.5% 的时间在饿肚子等数据？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 零散小文件直读灾难: 每秒 37 万次 open/stat 打崩元数据服务器 (MDS)</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 5 亿张独立 .jpg/.json 随机读取使共享存储吞吐跌至 11.2 GB/s，GPU 64.5% 时间空转 (MFU 22.0%)</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 断点重启需空跑迭代器跳过已训样本，单次恢复耗时 68.0 分钟，月烧 $301,344 饥饿算力费！</text>

  <rect x="44" y="258" width="510" height="82" rx="8" fill="#422006" stroke="#eab308"/>
  <text x="58" y="280" fill="#fde047" font-size="13.5" font-weight="700">🟨 Tier 2 WebDataset 1GB .tar 顺序分片: 救了存储 IOPS，但撞上 CPU 解码墙</text>
  <text x="58" y="302" fill="#fef08a" font-size="12">• 将数千样本打包进 1GB .tar 使顺序读带宽跃升 6.4x 至 72.0 GB/s (吞吐提至 980 samples/s/GPU)</text>
  <text x="58" y="322" fill="#fef08a" font-size="12">• ⚠️ 但宿主机 128 核 CPU 被软解码 JPEG/H.264 100% 打满，GPU 仍有 26.8% 时间饥饿等待</text>

  <rect x="44" y="352" width="510" height="88" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="374" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 MosaicML Streaming (MDS) / LitData: 0.4 秒 O(1) 样本级精准断点恢复</text>
  <text x="58" y="396" fill="#d1fae5" font-size="12">• 64MB 索引块 + 本地 NVMe 环形缓存实现对象存储直传，弹性改卡数 (world_size) 无需重分片</text>
  <text x="58" y="418" fill="#d1fae5" font-size="12">• 维护确定性全局样本偏移量，故障重启在 0.40 秒内精准定位到崩溃瞬间样本 (零重复/零漏训!)</text>

  <rect x="44" y="452" width="510" height="92" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="474" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 Tier 3 + NVIDIA DALI 硬件 nvJPEG/NVDEC + GDS: 饥饿率压至 1.8%!</text>
  <text x="58" y="496" fill="#f3e8ff" font-size="12">• 将图像/视频解压与 Crop/Normalize 卸载至 H100 片上专用硬件解码引擎 (不占 Tensor Core)</text>
  <text x="58" y="518" fill="#6ee7b7" font-size="12" font-weight="700">• 单卡吞吐达 1,435 samples/s (快 4.22x)，MFU 飙至 68.2%，每月净省 $215,846!</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档预训练数据流水线定量对比 (256×H100 · 月租 $467.2k)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">数据加载与预处理档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">GPU 饥饿 / 断点恢复</text>
  <text x="952" y="190" fill="#cbd5e1" font-size="12" font-weight="700">单卡吞吐 / MFU</text>
  <text x="1058" y="190" fill="#cbd5e1" font-size="12" font-weight="700">月度饥饿浪费</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: POSIX 零散小文件直读</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">聚合带宽仅 11.2 GB/s · MDS 锁死</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">64.5% 饥饿 ✕</text>
  <text x="828" y="256" fill="#fca5a5" font-size="11">恢复 4,080s (68m)</text>
  <text x="952" y="236" fill="#fca5a5" font-size="12" font-weight="700">340 samples/s</text>
  <text x="952" y="256" fill="#cbd5e1" font-size="11">MFU 22.0%</text>
  <text x="1058" y="236" fill="#fca5a5" font-size="12" font-weight="700">浪费 $301.3k/月</text>
  <text x="1058" y="256" fill="#94a3b8" font-size="11">基准线 (1.0x)</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: WebDataset Tar + CPU 解码</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">72.0 GB/s 顺序读 · CPU 软解码 100% 满载</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">26.8% 饥饿 ⚠️</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">恢复 870s (14.5m)</text>
  <text x="952" y="312" fill="#fde047" font-size="12" font-weight="700">980 samples/s</text>
  <text x="952" y="332" fill="#cbd5e1" font-size="11">MFU 48.5% (2.88x)</text>
  <text x="1058" y="312" fill="#fde047" font-size="12" font-weight="700">浪费 $125.2k/月</text>
  <text x="1058" y="332" fill="#6ee7b7" font-size="11">省 $176.1k/月</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: MosaicML MDS / LitData 流</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">84.5 GB/s + 本地 NVMe 环存 + 确定性洗牌</text>
  <text x="828" y="388" fill="#6ee7b7" font-size="12" font-weight="700">18.2% 饥饿 ✅</text>
  <text x="828" y="408" fill="#34d399" font-size="11">恢复 0.40s (O(1)) ✅</text>
  <text x="952" y="388" fill="#6ee7b7" font-size="12" font-weight="700">1,140 samples/s</text>
  <text x="952" y="408" fill="#6ee7b7" font-size="11">MFU 56.4% (3.35x)</text>
  <text x="1058" y="388" fill="#6ee7b7" font-size="12" font-weight="700">浪费 $85.0k/月</text>
  <text x="1058" y="408" fill="#6ee7b7" font-size="11">省 $216.3k/月</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: Tier 3 + DALI GPU 解码 + GDS</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">92.0 GB/s + 硬件 nvJPEG/NVDEC 零拷贝</text>
  <text x="828" y="464" fill="#34d399" font-size="12" font-weight="700">仅 1.8% 饥饿 🏆</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">恢复 0.40s 🏆</text>
  <text x="952" y="464" fill="#e9d5ff" font-size="12" font-weight="700">1,435 samples/s</text>
  <text x="952" y="484" fill="#34d399" font-size="11" font-weight="700">MFU 68.2% (4.22x)</text>
  <text x="1058" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">仅耗 $8.4k/月</text>
  <text x="1058" y="484" fill="#34d399" font-size="11" font-weight="700">净省 $215.8k/月!</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 1080p 视频预训练拐点：CPU 解码 (Tier 3) 跌至 210 samples/s，DALI NVDEC (Tier 4) 高达 1,290 (快 6.14x)!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#06b6d4"/>
  <text x="44" y="606" fill="#67e8f9" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for PB-Scale Training Data Pipelines）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fca5a5">严禁直接遍历零散小文件跑预训练 (Tier 1)</tspan>；<tspan font-weight="700" fill="#6ee7b7">纯文本预训练直接上 Tier 3 (MosaicML MDS / LitData 索引分片)</tspan>，0.4s 秒级恢复。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">VLM 多模态与 DiT 视频生成预训练必上 Tier 4 (MDS/LitData + NVIDIA DALI nvJPEG/NVDEC + GDS)</tspan>：解放 CPU，吞吐翻 4~6 倍。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/ai_training_dataloader_selection/results.json · tests/test_ai_training_dataloader_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
