<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#38BDF8" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">千卡 K8s 智算集群容器镜像与百 GB 模型权重极速分发选型：Dragonfly P2P + GDS + RDMA 广播</text>
  <text x="52" y="94" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="15">告别 158GB 巨型镜像拉取 22.5 分钟噩梦：Nydus 按需懒加载 (`4.2s`) + `.safetensors` 零拷贝流式加载 + 400G RDMA 树形广播 (`6.8s`)</text>

  <!-- Left: Why Baked OCI Images & Pickle Load Stall 64-Node Scale-Out -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么 64 台节点同时拉起 70B Pod 会卡死 22.5 分钟？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 灾难 A：把 140GB 权重打进 Docker 镜像 (Tier 1: 1,350 秒!)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 64 台节点同时向中心镜像仓 (Harbor/ACR) 拉取 `64 × 158GB = 10.1 TB`，瞬间打爆网关带宽</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• containerd 单核串行解压百 GB `tar.gz` 耗时长达 15 分钟，且翻倍吃满节点临时系统盘！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 灾难 B：旧式 `pytorch_model.bin` (`torch.load` Pickle 双重拷贝, Tier 2)</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 先在 CPU 内存完整反序列化 Pickle 对象 (140GB)，再逐层拷贝进 GPU HBM (`to('cuda')`)</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 不仅速度慢 (185 秒)，而且多进程并发加载时瞬间撑爆宿主机内存触发 OOM Killer！</text>

  <!-- Right: Nydus/Dragonfly P2P + Run:ai Streamer / GDS + RDMA Broadcast -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 64 节点 11 秒极速就绪三板斧 (Tier 4: 提速 122.7 倍!)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 镜像与权重彻底解耦 + `Nydus / eStargz + Dragonfly P2P` (`4.2s` 启动)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">18GB 运行时镜像不存权重；按需懒加载 Python 启动所需的 ~400MB 文件块，4.2 秒直接跑起进程！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② `.safetensors` 零拷贝流式直读 (`Run:ai Model Streamer / NVIDIA GDS`)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">利用 `.safetensors` 头部偏移表，16 线程并发 `O_DIRECT / cuFile` 从对象存储/NVMe 直接灌入显存！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 跨节点 RDMA P2P 权重树形广播 (Leader Read Once -> Broadcast to 64 Nodes)</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">仅由首节点或分片读取存储，其余 63 个副本通过 400GbE RoCEv2/IB 从已就绪 Pod 显存 3.2s 秒拉！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 64 节点并发扩容（18GB 镜像 + 140GB 模型权重）四档分发与加载架构对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">镜像与权重分发架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">容器启动耗时</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">权重入显存耗时</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">端到端就绪总耗时</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">中心仓出口流量</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度空转等待浪费</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 权重打入 158GB 巨型镜像 + 中心仓直拉解压</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">920.0 sec ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">430.0 sec ✕</text>
  <text x="790" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1,350.0 s (22.5m) ✕</text>
  <text x="960" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">10.11 TB ✕</text>
  <text x="1120" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$84,000/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 18GB 镜像分离 + 共享 NFS `torch.load(.bin)`</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">110.0 sec</text>
  <text x="620" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">185.0 sec</text>
  <text x="790" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">295.0 s (4.9m)</text>
  <text x="960" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">1.15 TB</text>
  <text x="1120" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$26,500/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: Dragonfly P2P 镜像 + 本地 NVMe `.safetensors` Mmap</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">12.5 sec ✓</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">18.5 sec ✓</text>
  <text x="790" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">31.0 s ✓</text>
  <text x="960" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.04 TB</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$4,800/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): Nydus 懒加载 P2P + Run:ai/GDS + RDMA 显存广播</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">4.2 sec ✓</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">6.8 sec ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">11.0 s (122.7x) ✓</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.018 TB (-99.8%)</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$1,650/mo (-98%)</text>
</svg>
