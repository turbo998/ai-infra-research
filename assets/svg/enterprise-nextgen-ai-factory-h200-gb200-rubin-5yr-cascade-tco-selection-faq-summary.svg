<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">第 495 篇里程碑：2026–2027 智算中心跨代演进总蓝图 (H200 -&gt; GB200 NVL72 -&gt; Rubin NVL144)</text>
  <text x="30" y="60" class="sub">“机电液冷十年一次到位 + 算力五级阶梯退役 (5-Yr Role Cascade)”，将 GPU 经济寿命延至 5 年、立省 $3,160 万 (-46.2%)</text>

  <!-- Left: 3-Gen Silicon Roadmap & 5-Year Role Cascade -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. 三代智算底座硬件跃迁与五年三阶算力降维复用 (5-Yr Role Cascade)</text>
  <text x="48" y="134" class="txt">• Hopper H200 (NVL8): 4.8 TB/s HBM3e, 400G RDMA, 10.2kW 风冷 ($0.24/1M)</text>
  <text x="48" y="156" class="txt">• Blackwell GB200 NVL72: 8.0 TB/s HBM3e, 72卡全互联 130TB/s, 132kW 液冷 ($0.038/1M)</text>
  <text x="48" y="178" class="txt">• Vera Rubin NVL144 (2026-27): 16 TB/s HBM4, 144卡 3.6TB/s NVLink6, 1.6T CPO ($0.018/1M)</text>
  <text x="48" y="204" class="txt good">★ 为什么老一代 H200 在第 3-5 年绝不报废？(异构跨代 PD + 蒸馏阶梯复用):</text>
  <text x="64" y="226" class="txt good">- Year 1-2: 跑主力大模型 Prefill + Decode 全栈；</text>
  <text x="64" y="246" class="txt good">- Year 3-4: 退居算力密集型 Prefill 池 + 32B/8B 蒸馏学生池 (把 GB200 省给 671B Decode!)；</text>
  <text x="64" y="266" class="txt good">- Year 5: 切分 MIG 跑 IDE 实时代码补全 (FIM)、Embedding 向量化与安全护栏！</text>

  <!-- Right: 4-Strategy 5-Year TCO Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 四种五年期智算中心投资与代际演进策略 TCO 对比</text>
  <text x="578" y="134" class="txt bad">• 策略 1 三年一砸重建风冷机房: 5年总 TCO $6,840 万，42% 机电改造沉没报废 ✕</text>
  <text x="578" y="158" class="txt warn">• 策略 2 死守 Hopper 拒绝液冷演进: 5年总 TCO $5,400 万，单价停滞在 $0.240/1M ✕</text>
  <text x="578" y="182" class="txt">• 策略 3 烟囱式代际混建 (各自跑全栈): 5年总 TCO $4,920 万，综合单价 $0.072/1M</text>
  <text x="578" y="208" class="txt good">• 策略 4 150kW+ 液冷预留 + 五年三阶角色级联复用 (推荐 🏆):</text>
  <text x="594" y="232" class="txt good">- 5年总拥有成本 (5-Yr TCO): $3,680 万 (立省 $3,160 万，直降 46.2% 🏆)</text>
  <text x="594" y="256" class="txt good">- 全群综合 Token 成本: $0.035 / 1M (降低 6.86 倍！GPU 满负荷服役足 5 年 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 四种五年期演进策略的 5-Year TCO ($M) 与综合百万 Token 成本对比 (越短越省钱)</text>

  <text x="48" y="365" class="txt">策略 1 三年拆机房重修 (3-Yr Rip)</text>
  <rect x="290" y="352" width="520" height="16" fill="#ef4444" rx="4"/>
  <text x="820" y="365" class="txt bad">$68.4M 5年总成本 | $0.145/1M | 42% 机房基建沉没浪费 ✕</text>

  <text x="48" y="395" class="txt">策略 2 死守风冷 Hopper 不升级</text>
  <rect x="290" y="382" width="410" height="16" fill="#f59e0b" rx="4"/>
  <text x="710" y="395" class="txt warn">$54.0M 5年总成本 | $0.240/1M (671B Decode 毫无竞争力 ✕)</text>

  <text x="48" y="425" class="txt">策略 3 烟囱式代际孤岛运行</text>
  <rect x="290" y="412" width="374" height="16" fill="#3b82f6" rx="4"/>
  <text x="674" y="425" class="txt">$49.2M 5年总成本 | $0.072/1M | 寿命 3.8 年</text>

  <text x="48" y="455" class="txt good">策略 4 液冷预留 + 五年级联复用 🏆</text>
  <rect x="290" y="442" width="280" height="16" fill="#10b981" rx="4"/>
  <text x="580" y="455" class="txt good">$36.8M (-46.2% 🏆) | $0.035/1M (降本 6.86x 🏆) | 5.0 年完整折旧周期 🏆</text>
</svg>
