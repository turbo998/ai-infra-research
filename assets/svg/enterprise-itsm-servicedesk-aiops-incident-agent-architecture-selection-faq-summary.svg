  <rect width="1200" height="680" fill="url(#bgGrad397)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级智能工单 (ITSM ServiceNow/Jira) 与 AIOps 自动排障 Agent 架构选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：拓扑告警降噪 + 历史已结工单案例推理 + 只读诊断全自动预取 + 参数化 Runbook 审批执行，将 MTTR 从 240 分钟缩至 14.5 分钟</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 397 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 传统关键词规则树客服</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 死板菜单点选，84% 转人工排队</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 告警风暴来袭时一晚上发 1,000 张单</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 工单自动化解决率：仅 16.0% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 平均故障恢复 (MTTR)：240.0 分钟 ✕</text>
  <text x="40" y="252" fill="#cbd5e1" font-size="12">• 生产误操作事故率：0.0%</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">5万工单月成本：$88,000 (人工) ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：二线工程师 80% 的时间花在</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">来回切 6 个监控系统查日志和问基本信息</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="332" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 2: 被动文档问答助手 (RAG)</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 检索 IT Wiki 回答“怎么重置密码”</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 只动嘴不动手，无法调接口查实时状态</text>
  <text x="332" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 工单自动化解决率：42.0% ✅</text>
  <text x="332" y="232" fill="#fde68a" font-size="12" font-weight="700">• 平均故障恢复 (MTTR)：135.0 分钟</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• 生产误操作事故率：0.0%</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="454" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">5万工单月成本：$54,000 (-38.6%)</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">定位：早期 IT Helpdesk 文档自助基线</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">局限：遇到系统报错或权限开通仍需全人工</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="624" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 3: 无护栏全自动 Shell Agent</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 直接给大模型开放生产 SSH / kubectl 写权限</text>
  <text x="624" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 幻觉生成危险命令误删/误重启生产服务✕</text>
  <text x="624" y="212" fill="#fde68a" font-size="12" font-weight="700">• 工单自动化解决率：68.0%</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 平均故障恢复 (MTTR)：28.0 分钟</text>
  <text x="624" y="252" fill="#fca5a5" font-size="12" font-weight="700">• 生产误变更 P0 事故率：3.8% ✕ (致命)</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="746" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">5万工单月成本：$39,000 (SRE禁上)✕</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">血泪红线：绝对禁止让大模型在生产环境</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">自由拼接任意 Bash / kubectl 写命令！</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 只读全自动+Runbook审批🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 1000条级联告警按拓扑聚合成 1 张根因单</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 100% 自动跑只读诊断 + 关联最近发版PR</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 工单自动化解决率：76.5% 🏆 (+60.5pts)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 平均故障恢复 (MTTR)：14.5 分钟 🏆 (快16.6x)</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• 生产误变更事故率：0.0% 🏆</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">5万工单月成本：$24,500 (省 72.2%)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级 ServiceNow/Jira &amp; AIOps 终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">值班SRE打开工单时，根因与一键回滚按钮已备好</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么 SRE 团队讨厌“乱改生产的野生 Agent”，却爱死“自动预取证据 + 参数化 Runbook 卡片”？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad397)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 只读诊断 100% 自动化（Zero-Wait Pre-Triage）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 告警触发第 0 秒，Agent 自动并发拉取：`Pod 错误日志` +</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">  `Prometheus 指标突变点` + `最近 30 分钟刚合并上线的 Git PR`！</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">• 因为全是 `GET/Read-Only` 只读操作，100% 零安全风险！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 直接省掉工程师起床登录 5 个系统翻日志的前 45 分钟！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 历史已解决工单案例推理（Case-Based Reasoning）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 官方静态文档往往不写线上奇葩故障，真正的宝藏在历史工单库！</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 将历史已闭环工单按 `[故障现象摘要 + 报错栈 -> 最终根因 + 修复脚本]`</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">  结构化提炼入库，新故障发生时秒级匹配曾出现过的同类历史排障方案！</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 让新入职的一线工程师立刻拥有十年老专家的排障经验库。</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 写操作铁律：只调预审 Runbook，绝不裸跑自由 Shell</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• **L1 员工自助（解锁账号/开通普通软件权限）**：匹配策略后自动代办；</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• **L2/L3 生产排障（回滚版本/扩容节点/限流降级）**：</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  大模型只允许选择经 SRE 签字预审的 Ansible/Argo 标准 Runbook 模板</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  并填好参数，在 Teams/Slack 弹出 `[一键批准回滚 v2.1.4]` 卡片！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 397 合成标定算例 (independently_reproduced=false)</text>
</svg>
