<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg27" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent27" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg27)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent27)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">超低延迟实时语音大模型 (Voice Agent) 端到端推理选型一图流 (Round 27 · SLA &le;350ms)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">HTTP 串行级联 (2,480ms) vs. WebRTC 流式级联 (540ms, 100% 智商) vs. 纯音频 S2S (掉智商 18.5%) vs. 双轨内心独白 S2S (220ms, 98.4% 智商)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Voice Latency & Intelligence Tradeoff -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#f472b6" font-size="16" font-weight="800">① 为什么纯端到端语音模型会“变笨”？如何兼得 220ms 极速与 98.4% 智商？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 传统 HTTP 串行级联 (2,480 ms): 700ms 静音等待 + 整段生成阻塞</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 必须等用户说完沉默 700ms 才上传音频，等 LLM 写完整段话 (920ms) 才开始合成语音</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 3% 弱网丢包下 TCP WebSocket 队头阻塞更使 P99 飙至 1,820ms，对话充满机械尴尬冷场</text>

  <rect x="44" y="258" width="510" height="84" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="280" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 2 WebRTC 流式分块级联 + 首句投机合成: 复杂业务工具调用性价比冠军</text>
  <text x="58" y="302" fill="#d1fae5" font-size="12">• UDP WebRTC + 语义 VAD (140ms) + 边说边转写 + LLM 吐出前 5 个词即流式触发 TTS</text>
  <text x="58" y="324" fill="#d1fae5" font-size="12">• 延迟压至 540ms，100.0% 继承 70B/671B 文本底座满血智商与合规审计文本 ($0.028/分钟)</text>

  <rect x="44" y="354" width="510" height="86" rx="8" fill="#422006" stroke="#eab308"/>
  <text x="58" y="376" fill="#fde047" font-size="13.5" font-weight="700">🟨 Tier 3 纯音频 Token 端到端模型 (Pure Audio S2S): 速度快但“智商掉线 -18.5%”</text>
  <text x="58" y="398" fill="#fef08a" font-size="12">• 1 秒语音编码为 100~400 个 RVQ 声学 Token (比文本长 50 倍)，注意力被发音细节稀释</text>
  <text x="58" y="418" fill="#fef08a" font-size="12">• 虽然响应仅 195ms 且情感丰富，但复杂逻辑与 JSON 工具调用准确率暴跌至 81.5% ✕</text>

  <rect x="44" y="452" width="510" height="92" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="474" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 4 双轨内心独白架构 (Moshi / GLM-4-Voice / GPT-4o 范式): 220ms + 98.4% 智商!</text>
  <text x="58" y="496" fill="#f3e8ff" font-size="12">• 主干 Temporal Transformer 每 80ms (12.5Hz) 先预测 1 个时间对齐的“内心独白文本 Token”</text>
  <text x="58" y="518" fill="#6ee7b7" font-size="12" font-weight="700">• 随后由轻量 Depth Transformer 条件生成 8 个声学 RVQ 码本：兼得 220ms 极速、满血工具调用与情感！</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档实时语音大模型架构定量对比 (目标 P99 &le; 350ms)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">实时语音 Agent 架构档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">P50 / P99 延迟</text>
  <text x="952" y="190" fill="#cbd5e1" font-size="12" font-weight="700">工具智商 / 打断</text>
  <text x="1058" y="190" fill="#cbd5e1" font-size="12" font-weight="700">情感 / 每分钟成本</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: HTTP 串行级联 (ASR+LLM+TTS)</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">700ms VAD + 480ms ASR + 920ms LLM + 380ms TTS</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">2,480.0 ms</text>
  <text x="828" y="256" fill="#fca5a5" font-size="11">P99: 3,150 ms ✕</text>
  <text x="952" y="236" fill="#f8fafc" font-size="12">100.0% 智商</text>
  <text x="952" y="256" fill="#fca5a5" font-size="11">打断 850 ms ✕</text>
  <text x="1058" y="236" fill="#fca5a5" font-size="12" font-weight="700">无情感 ✕</text>
  <text x="1058" y="256" fill="#cbd5e1" font-size="11">$0.042 / min</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="310" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 2: WebRTC 流式分块级联</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">140ms 语义VAD + 95ms 流ASR + 185ms 首句</text>
  <text x="828" y="312" fill="#6ee7b7" font-size="12" font-weight="700">540.0 ms (4.6x)</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">P99: 680.0 ms</text>
  <text x="952" y="312" fill="#34d399" font-size="12" font-weight="700">100.0% 智商 ✅</text>
  <text x="952" y="332" fill="#6ee7b7" font-size="11">打断 65 ms ✅</text>
  <text x="1058" y="312" fill="#6ee7b7" font-size="12" font-weight="700">$0.028 / min 🏆</text>
  <text x="1058" y="332" fill="#6ee7b7" font-size="11">企业客服主力</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="386" fill="#fde047" font-size="12.5" font-weight="700">Tier 3: 纯音频 Token S2S (无文本)</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">直接声学码本自回归 · 序列膨胀 50 倍</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">195.0 ms ✅</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">P99: 245.0 ms ✅</text>
  <text x="952" y="388" fill="#f87171" font-size="12" font-weight="700">81.5% (-18.5% ✕)</text>
  <text x="952" y="408" fill="#6ee7b7" font-size="11">打断 40 ms</text>
  <text x="1058" y="388" fill="#fde047" font-size="12" font-weight="700">原生情感 ✅</text>
  <text x="1058" y="408" fill="#fca5a5" font-size="11">$0.095 / min</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="462" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 4: 双轨 Text+Acoustic S2S</text>
  <text x="622" y="484" fill="#d8b4fe" font-size="11">12.5Hz 内心独白文本流 + Depth RVQ 声学流</text>
  <text x="828" y="464" fill="#e9d5ff" font-size="12" font-weight="700">220.0 ms 🏆</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">P99: 285.0 ms 🏆</text>
  <text x="952" y="464" fill="#34d399" font-size="12" font-weight="700">98.4% 智商 🏆</text>
  <text x="952" y="484" fill="#34d399" font-size="11" font-weight="700">打断 45 ms 🏆</text>
  <text x="1058" y="464" fill="#e9d5ff" font-size="12.5" font-weight="800">原生情感+可审计</text>
  <text x="1058" y="484" fill="#34d399" font-size="11" font-weight="700">$0.052 / min</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 5% 移动弱网丢包测试：TCP WebSocket 因重传阻塞飙至 3,100ms，UDP WebRTC 双轨架构稳守 285ms!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#ec4899"/>
  <text x="44" y="606" fill="#f472b6" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for Real-Time Voice Agent Architecture）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fca5a5">严禁用 TCP WebSocket 传实时语音媒体流</tspan>，强制走 <tspan font-weight="700" fill="#6ee7b7">UDP WebRTC + Opus FEC</tspan>；重度工具调用客服首选 <tspan font-weight="700" fill="#6ee7b7">Tier 2 (流式级联, $0.028/m)</tspan>。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">追求亚 300ms 拟人抢话与情感交互必选 Tier 4 (双轨 Text+Acoustic 内心独白架构)</tspan>，避开纯音频 S2S (Tier 3) 的智商暴跌陷阱。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/realtime_voice_llm_pipeline_selection/results.json · tests/test_realtime_voice_llm_pipeline_selection.py · 7-Card &amp; Sizer</text>
</svg>
