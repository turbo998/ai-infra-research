<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg53" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc53" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg53)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="355" height="28" rx="14" fill="#083344" stroke="#22d3ee" stroke-width="1"/>
  <text x="229" y="63" fill="#a5f3fc" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 53 · 128K–1M KV QUANTIZATION &amp; SPARSITY</text>
  <text x="422" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="800">超长上下文 (128K~1M) KV Cache 量化与动态稀疏检索架构选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="14">杜绝 H2O 永久删除引发的多轮失忆 (-37.8pt)！校准 FP8 + Quest 页面边界框动态稀疏将每步显存读取暴砍 16x，吐字飙至 108 tok/s</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc53)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="208" height="24" rx="6" fill="#7f1d1d"/>
  <text x="172" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 原生 BF16 全量 KV</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">40 GB/请求带宽黑洞</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">每吐 1 词全量重读 40 GB HBM 显存</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制缺陷：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">128K 单请求占 40GB；8×H100 仅装得</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">下 14 个会话，吐字卡死在 18.5 tok/s ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 每步读 HBM: <tspan fill="#f87171" font-weight="700">40.0 GB / step ✕</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 吐字速度: <tspan fill="#f87171" font-weight="700">18.5 tok/s ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 多轮大海捞针: <tspan fill="#cbd5e1" font-weight="700">96.2% (仅 14 并发)</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万词成本: <tspan fill="#f87171" font-weight="700">$30.80 / 1M ✕</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁在 &gt;=64K 生产环境裸跑 BF16</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="212" height="24" rx="6" fill="#78350f"/>
  <text x="474" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · H2O / SnapKV 永久删除</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">多轮追问永久失忆 (-37.8pt)</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Prefill 后物理销毁 75% 低注意力词</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么多轮对话彻底翻车？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">第 1 轮看似无关的 96K 词被永久删掉</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">第 2 轮换问题追问时记忆早已丢失 ✕</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 每步读 HBM: <tspan fill="#fbbf24" font-weight="700">10.0 GB / step</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 吐字速度: <tspan fill="#fbbf24" font-weight="700">68.0 tok/s</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 多轮大海捞针: <tspan fill="#f87171" font-weight="700">58.4% (暴跌 -37.8pt ✕)</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万词成本: <tspan fill="#fbbf24" font-weight="700">$8.40 (质量不可用 ✕)</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁用于多轮对话与共享缓存池</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="224" height="24" rx="6" fill="#0c4a6e"/>
  <text x="780" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · 校准 FP8 / 非对称 KIVI</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">100% 保留 + 显存带宽砍半</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">按通道量化 K + 按词量化 V (零删除)</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (消除 K 通道离群值)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">逐头预校准 k_scale/v_scale，不删 1</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">个词直接将 128K 显存压至 20.0 GB</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 每步读 HBM: <tspan fill="#38bdf8" font-weight="800">20.0 GB / step (-50% ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 吐字速度: <tspan fill="#38bdf8" font-weight="700">36.4 tok/s (28 并发 ✅)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 多轮大海捞针: <tspan fill="#38bdf8" font-weight="800">95.8% (无损级 ✅)</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万词成本: <tspan fill="#38bdf8" font-weight="700">$15.60 / 1M (-49.4% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 32K~64K 通用长文本服务默认标配</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · FP8 + Quest 动态边界框稀疏</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">存储全留 + 每步仅读 2.5GB</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">[K_min, K_max] 边界框动态读 Top-12.5%</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (少读 16x 显存 / 零失忆)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">1 个词都不删！每步用 q_t 扫描边界框</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">仅加载最相关的 16K 页进 FlashInfer</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 每步读 HBM: <tspan fill="#34d399" font-weight="800">仅 2.5 GB / step (-16x 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 128K 吐字速度: <tspan fill="#34d399" font-weight="800">108.0 tok/s (快 5.84x 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 多轮大海捞针: <tspan fill="#34d399" font-weight="800">95.6% (+37.2pt vs T2 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万词成本: <tspan fill="#34d399" font-weight="800">$5.04 / 1M (省 -83.6% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 128K~1M 多轮长文本推理终极答案</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心原理：为什么 Key 必须按通道量化、Value 按词量化？Quest 如何做到“一字不删却快 5.84 倍”？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">📐 法则 1：非对称量化 (Per-Channel K + Per-Token V)</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Key 张量受 RoPE 影响，在固定几个通道上存在 ±50.0 的超大离群值（普通通道</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  仅 ±0.5），必须按通道/逐头缩放平滑；而 Value 离群值分散在词间，按词动态</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  量化即可实现 95.8% 无损召回并将显存与带宽直接砍半！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 法则 2：用“查询感知动态选页 (Quest)”替代“永久物理删除 (H2O)”</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 永久删掉第 1 轮不关注的词会导致第 2 轮换问题追问时彻底失忆 (58.4%)；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Quest 为每页 (16词) 记录 [K_min, K_max] 边界框，每步用 q_t 在 0.2ms 内算出</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  上界分并只读 Top-12.5% 页面 (2.5 GB)，下一轮新问题随时唤醒其他页面！</text>
</svg>
