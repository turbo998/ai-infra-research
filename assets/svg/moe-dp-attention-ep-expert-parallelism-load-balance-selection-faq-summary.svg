<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 217 · MOE SERVING DP-ATTENTION + EP-MOE HYBRID PARALLELISM &amp; LOAD BALANCE FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800">DeepSeek-V3 64-GPU Serving: 1,820 tok/s TP-Attention vs 5,640 tok/s Balanced DP-Attention + EP=64</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: TP-Attention KV &amp; AllReduce Bottleneck</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (Pure TP): Shards 256 experts into tiny skinny matrices ✕</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (TP=8 Attention + EP=64 MoE):</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  1. Duplicates MLA KV Cache 8x across all 8 GPUs in a node!</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  2. Forces an extra TP AllReduce before every MoE AlltoAll ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Throughput: 1,820 – 3,150 tok/s/GPU | 8x KV Duplication</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">TP-Attention Wastes 87.5% of Node HBM Capacity on Duplicated MLA KV</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3 &amp; 4: Balanced DP-Attention + EP=64 + TBO</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Each of 64 GPUs runs independent `DP=64` Attention (`TP=1` per GPU)!</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Zero KV duplication (8x more batch capacity) &amp; Zero Attention AllReduce!</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 4 balances token counts across all 64 DP ranks (&lt;5% skew)</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Pads DP ranks to uniform CUDA Graph bucket + Two-Batch Overlap (TBO)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Throughput: 5,640 tok/s/GPU (3.10x) | P99 TBT: 11.4 ms 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Gold Standard for SGLang &amp; vLLM DeepSeek-V3 / R1 Production Serving</text>
</svg>
