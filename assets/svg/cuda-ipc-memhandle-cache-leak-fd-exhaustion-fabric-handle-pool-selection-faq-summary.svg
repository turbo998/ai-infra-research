  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (Per-Tensor cudaIpcOpen/Close Every Step):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  512 GPU MMU page-table mappings/unmappings per step</text>
  <text x="85" y="298" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  force device syncs -&gt; 18.40 ms/step stall!</text>
  <text x="85" y="335" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (Uncapped Per-Tensor SCM_RIGHTS POSIX FDs):</text>
