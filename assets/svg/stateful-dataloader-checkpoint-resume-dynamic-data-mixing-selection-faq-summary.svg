  <!-- Header -->
  <rect x="52" y="44" width="310" height="28" rx="14" fill="#1E3A8A" stroke="#38BDF8" stroke-width="1"/>
  <text x="207" y="63" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#BAE6FD" text-anchor="middle">ROUND 91 · STATEFUL DATALOADER &amp; DYNAMIC MIXING</text>
  <text x="378" y="63" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">15T Tokens (80 TB Shards) on 4,096×H100 ($10,240/hr) · Synthetic + Anonymized Reported</text>

  <text x="52" y="104" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">
    Stateful DataLoader O(1) Byte-Offset Resume &amp; Online DoReMi Mixing: 34.5 Min → 0.4s Resume (5,175x Faster)
  </text>
  <text x="52" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#CBD5E1">
    Eliminating 18.4% Duplicate Token Spikes, 30-Min NCCL Timeout Stalls &amp; 80 TB Disk Rewrites via Per-Domain Cursors + Feistel Ciphers
  </text>

  <!-- Left Panel: Why Stateless & Loop-Skip Fail -->
  <rect x="52" y="152" width="576" height="286" rx="14" fill="url(#card91)" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="182" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">1. Three Silent Pretraining Data Pipeline Disasters</text>

  <rect x="72" y="198" width="536" height="66" rx="8" fill="#0B1120" stroke="#EF4444" stroke-width="1"/>
  <text x="88" y="218" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#FCA5A5">✕ Disaster 1: Stateless Reset (S1: 18.4% Duplicate Tokens &amp; +0.085 Loss Spike)</text>
  <text x="88" y="238" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#94A3B8">Restarting DataLoader from step 0 re-trains on early epoch shards while skipping tail data,</text>
  <text x="88" y="254" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#EF4444" font-weight="700">causing severe memorization spikes and wasting $495,000 in contaminated GPU compute.</text>

  <rect x="72" y="274" width="536" height="66" rx="8" fill="#0B1120" stroke="#F59E0B" stroke-width="1"/>
  <text x="88" y="294" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#FBBF24">✕ Disaster 2: Naive Loop-Skip at Step 150,000 (S2: 2,070s = 34.5 Min Stall)</text>
  <text x="88" y="314" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#94A3B8">Iterating through 150,000 batches on CPU to reach the resume offset stalls 4,096 GPUs for</text>
  <text x="88" y="330" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#FBBF24" font-weight="700">34.5 minutes—tripping the 30-min NCCL_TIMEOUT watchdog and burning $235,520 across 40 restarts!</text>

  <rect x="72" y="350" width="536" height="74" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1.2"/>
  <text x="88" y="370" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#6EE7B7">🏆 Solution (S5): O(1) mmap/Range Byte-Offset Seek + Feistel Bijective Shuffle</text>
  <text x="88" y="390" font-family="Consolas, monospace" font-size="11.5" fill="#A7F3D0">state_dict = {domain_cursors: c_k(t), worker_ring_idx, rng_philox_offset}</text>
  <text x="88" y="408" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34D399" font-weight="700">✓ Jumps to exact byte offset in 0.4s (5,175x faster) with &lt;1 MB RAM via 4-round Feistel cipher!</text>

  <!-- Right Panel: Online Dynamic Domain Mixing (DoReMi / Curriculum Annealing) -->
  <rect x="648" y="152" width="580" height="286" rx="14" fill="url(#card91)" stroke="#334155" stroke-width="1.2"/>
  <text x="668" y="182" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">2. Zero-Rewrite Online Domain Multiplexing (DoReMi / Annealing)</text>

  <rect x="668" y="198" width="540" width-rx="10" height="112" rx="10" fill="#0B1120" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="684" y="220" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">Independent Per-Domain Monotonic Cursors: c_web(t), c_code(t), c_math(t)</text>
  <text x="684" y="242" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">• Never bake domain ratios into static disk shards (avoids 80 TB storage rewrites).</text>
  <text x="684" y="262" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">• Maintain separate monotonic cursors per domain: changing weights w_k(t) at step 120,000</text>
  <text x="684" y="282" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">  simply changes the advancement rate Δc_k without repeating a single seen sample!</text>
  <text x="684" y="300" font-family="Consolas, monospace" font-size="11.5" fill="#34D399">Stage 1 (0–12T): 55% Web, 25% Code, 10% Math  →  Stage 2 Annealing: 20% Web, 45% Code, 25% Math</text>

  <rect x="668" y="322" width="540" height="102" rx="10" fill="#0B1120" stroke="#A855F7" stroke-width="1.2"/>
  <text x="684" y="344" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#D8B4FE">Rank-Agnostic Elastic Rescaling (512 DP Ranks → 384 DP Ranks)</text>
  <text x="684" y="366" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">• Store a single global logical sample cursor C_global = step × global_batch_size.</text>
  <text x="684" y="386" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">• When surviving DP ranks change from 512 to 384 after a node drain, each rank computes</text>
  <text x="684" y="406" font-family="Consolas, monospace" font-size="11.5" fill="#34D399">sample_id = FeistelPermute(C_global + micro_step * DP_new + dp_rank)  →  0.0% Overlap!</text>

  <!-- Bottom Panel: 5-Scenario Matrix -->
  <rect x="52" y="456" width="1176" height="258" rx="14" fill="url(#card91)" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="486" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
