<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#580 里程碑：云与 AI 架构师 (Cloud &amp; AI SA) 十大企业级参考架构与全栈算卡圣经 (#563–#580 总成)</text>
  <text x="44" y="76" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13">贯通底层算力/网络/PD/并行 (#563–#570) 与上层 RAG/双活/多模态/FinOps/MCP/BI/机密/蒸馏 (#571–#580) · 省 78.1% GPU · 年净省 $842万</text>

  <!-- Left: Foundation Architecture (#563-#570) -->
  <rect x="24" y="108" width="504" height="274" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="136" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">🏛️ 下半场底座：五大智算与推理基础设施参考架构 (#563–#570)</text>
  <rect x="42" y="150" width="468" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="56" y="174" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">1. #563 PD 分离与跨网 KV 传输：Dynamo/Mooncake 逐层异步 RDMA (暴露 1.0ms, 省 50% 卡)</text>
  <text x="56" y="200" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">2. #564 并行与三大加速：机内 TP≤8 · 405B TP8×PP2 · 671B DP×EP+FP8+MTP (3,890 tok/s)</text>
  <text x="56" y="226" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">3. #565 智算高速互联网络：GPUDirect BAR1 + 关 ACS + Rail PXN (47.6 GB/s busbw, 省 34.5%)</text>
  <text x="56" y="252" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">4. #566/#568 三道水位线与异构 PD：max(N_mem,N_bw,N_comp) · H100 P池 + H200/MI325X D池</text>
  <text x="56" y="278" fill="#c4b5fd" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">5. #567/#569 双拐点、Envoy GIE 与 1M 三级 KV：24%/56% 拐点 · 91.8% KV 命中 · 100ms 拉回</text>
  <text x="56" y="314" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">💡 底座定律：把单卡有效 Goodput 推至物理极限，将裸算力单价从 $0.448 压至 $0.058/1M！</text>

  <!-- Right: Application & Platform Patterns (#571-#580) -->
  <rect x="552" y="108" width="504" height="274" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="570" y="136" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">🚀 上半场平台：五大企业业务应用与治理参考架构 (#571–#580)</text>
  <rect x="570" y="150" width="468" height="216" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="584" y="174" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">6. #571/#572 多租户 RAG 双层缓存 &amp; 55/55 跨区双活：Pre-Filter ACL + 0.82s 灰故障熔断</text>
  <text x="584" y="200" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">7. #573/#574 多模态 EPD 三池分离 &amp; FinOps WCU：L40S 剥离 ViT + 80%/95% 零 429 降级</text>
  <text x="584" y="226" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">8. #576 多智能体编排与 MCP Top-8 路由：45K→1.44K 工具压缩 + Temporal (完结率 97.8%)</text>
  <text x="584" y="252" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">9. #577/#578 湖仓对话式 BI (MDL+AST) &amp; 主权机密 AI：96.8% SQL 准确率 + H200 TEE</text>
  <text x="584" y="278" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">10. #579 大小模型蒸馏飞轮与 82/18 级联：$180 蒸馏 8B (4.2h 回本) 拦截 82% 常规流量!</text>
  <text x="584" y="314" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">💡 平台定律：在底座之上再消减 80% 无效 Token 与大模型滥用，实现全栈 15.8 倍降本！</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
  <text x="44" y="426" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" font-weight="bold">🏆 第 580 篇里程碑：万人级集团企业全栈 AI 平台（100 Peak QPS 全业务流）终极验证总账：</text>
  <text x="44" y="452" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 未治理传统烟囱式建设：需 128 张 GPU，任务综合准确率 68.5%，可用性 99.2%，年度总支出 $10.40M/年 ($0.442/1M)。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• #580 十大参考架构全栈协同：仅需 28 张异构 GPU (省 78.1% 卡)，综合准确率 97.6%，可用性 99.995%，SLA Goodput 99.4%！</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 终极财务产出：单百万有效 Token 综合成本降至 $0.028/1M (降低 15.79 倍)，年度总支出降至 $1.98M/年 (每年净省 $842 万)！</text>
</svg>
