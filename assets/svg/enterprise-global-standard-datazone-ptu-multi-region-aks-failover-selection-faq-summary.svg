<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #405 · CLOUD DEPLOYMENT TIERS: GLOBAL STANDARD VS. DATAZONE VS. PTU VS. MULTI-REGION AKS</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业跨区域容灾与云部署选型：Global Standard vs. DataZone vs. PTU vs. 多活 AKS</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">理清数据驻留合规边界 (单区 / EU&amp;US DataZone / 全球)，构建 120ms 零 429 溢出与跨区多活 AKS+PTU 混合底座</text>

  <!-- Left Box: 4 Cloud SKU Compliance & Quota Comparison -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 四大云端推理部署 SKU 合规边界与限流特征对比</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">Regional Standard (PAYGO): 单区严苛合规，但 TPM 配额低、高峰易 429</text>
  <text x="90" y="242" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">DataZone Standard (EU/US): 锁在欧盟/美国境内多区动态调度，配额翻 4x</text>
  <text x="90" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">Global Standard   (PAYGO): 全球算力池弹性最大 (千万级 TPM)，适合尖峰溢出</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• Provisioned (PTU)：独占算力槽位，100% 水位内 0 限流 + 确定性 P99 TTFT</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 金融/政企主权红线：严禁将含境内监管 PII 的流量溢出至 Global Standard！</text>
  <text x="76" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 黄金溢出链：主区 PTU / 自建 AKS (P80) -&gt; 同辖区 DataZone PAYGO (P20)！</text>

  <!-- Right Box: Multi-Region Active-Active Failover & Prefix Warmup -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 跨区域双活容灾 (120ms 切换) 与防“冷缓存雪崩”设计</text>
  <rect x="634" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">故障切换痛点: 主区挂掉瞬间全量切备区 -&gt; 备区 0% Prefix Cache 命中!</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">解决方案 1  : 双区 50/50 会话亲和常驻双活 (Geo-Sticky Prefix Affinity)</text>
  <text x="648" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">解决方案 2  : 备区 30% 容量平时跑可抢占离线批处理，故障 1.2s 秒级让路</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 摈弃默认 60 秒 SDK 超时重试：网关设 TTFT &gt; 2.5s 或 HTTP 429/503 立即切换</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 异步镜像预热：高频 System Prompt 与公共知识库块异步同步至备区 KV 池</text>
  <text x="634" y="350" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：全区域断网演练下可用性达 99.995%，RTO 仅 1.2 秒，成本省 58.6%！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四档跨区域高可用与云端/自建混合弹性架构实效对比 (3x 早高峰突发流量冲击)</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">跨区容灾与容量架构方案</text>
  <text x="430" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">3x 洪峰请求成功率</text>
  <text x="595" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">跨区故障切换 RTO</text>
  <text x="755" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">合规数据驻留</text>
  <text x="920" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">月度综合成本 (TCO)</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 单区域 Regional Standard PAYGO (无备区，默认 60s 重试)</text>
  <text x="430" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">71.4% ✕ (大量 429)</text>
  <text x="595" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">&gt; 65.0 s ✕</text>
  <text x="755" y="484" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">单区域严格驻留</text>
  <text x="920" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$94,000 / 月</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 双区域 100% 峰值对等买满 Regional PTU (1:1 闲置冷备)</text>
  <text x="430" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">99.6%</text>
  <text x="595" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">8.5 s (冷缓存抖动)</text>
  <text x="755" y="512" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">双区境内存放 ✓</text>
  <text x="920" y="512" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$142,000 / 月 ✕ (翻倍贵)</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: 双区 Regional PTU (P80) + DataZone / Global Standard 溢出</text>
  <text x="430" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">99.92% ✓</text>
  <text x="595" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">1.4 s ✓</text>
  <text x="755" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">辖区内 DataZone ✓</text>
  <text x="920" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$72,000 / 月 ✓</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (推荐): 双区多活 AKS (KAITO/vLLM P65) + PTU (P20) + DataZone 溢出</text>
  <text x="430" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">99.995% 🏆</text>
  <text x="595" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1.2 s (热前缀亲和) 🏆</text>
  <text x="755" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">100% 合规可控 🏆</text>
  <text x="920" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$58,800 / 月 (-58.6%) 🏆</text>
</svg>
