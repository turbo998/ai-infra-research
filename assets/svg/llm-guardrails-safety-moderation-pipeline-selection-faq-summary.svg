<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🛡️ 企业级大模型安全护栏 (Guardrails)、越狱防御与流式合规拦截选型一图流总结</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">70B FP8 主模型 (裸跑 TTFT 240ms) · 10,000 条红队越狱/RAG 间接注入/误杀压测 · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#6ee7b7" font-size="13" font-weight="700" text-anchor="middle">Round 37 · Guardrails &amp; RepE Probe</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#334155"/>
    <text x="16" y="27" fill="#f8fafc" font-size="14" font-weight="800">⬜ Tier 1: CPU 正则 + 敏感词 + 小 BERT</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">死板字面匹配 · 一遇编码变形即穿透</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 护栏净延迟损耗: <tspan fill="#34d399" font-weight="700">+12.0 ms (总 252ms)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 变形越狱拦截率: <tspan fill="#f87171" font-weight="700">46.0% (Base64 仅 12.5% ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• RAG 间接注入拦截: <tspan fill="#f87171" font-weight="700">31.5% (大面积漏放 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 正常业务误杀率: <tspan fill="#f87171" font-weight="700">18.5% (误拦医疗/安全 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 额外 GPU 算力开销: <tspan fill="#cbd5e1" font-weight="700">0.0% (纯 CPU)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么敏感词黑名单又蠢又烦？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">黑客用 Base64/谐音/多语种角色扮演可 87%</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">绕过；而正常医生问“如何处理农药中毒”却</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">因命中敏感词被无脑封杀（误杀率 18.5%）！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 2: 同步串行 8B 护栏 (双审阻塞)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">输入串行审 145ms + 输出攒全文审 435ms</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 护栏净延迟损耗: <tspan fill="#f87171" font-weight="700">+580.0 ms (总 820ms ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 变形越狱拦截率: <tspan fill="#34d399" font-weight="700">96.2% ✅</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• RAG 间接注入拦截: <tspan fill="#34d399" font-weight="700">91.0% ✅</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 正常业务误杀率: <tspan fill="#34d399" font-weight="700">3.4%</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 额外 GPU 算力开销: <tspan fill="#f87171" font-weight="700">+25.0% 算力税 ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么串行护栏会毁掉用户体验？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">为了防输出违规，把主模型流式吐出的回答</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">全部扣在缓冲区等生成完再调 8B 审查，首</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">字感知延迟从 240ms 暴涨 3.4 倍至 820ms！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 异步双流并行 + 滑窗门控</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">输入护栏与主模型并发 Prefill + 32词流式滑窗</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 护栏净延迟损耗: <tspan fill="#34d399" font-weight="700">仅 +8.0 ms (隐藏 98.6% ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 变形越狱拦截率: <tspan fill="#34d399" font-weight="700">96.5% ✅</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• RAG 间接注入拦截: <tspan fill="#34d399" font-weight="700">92.4% ✅</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 正常业务误杀率: <tspan fill="#34d399" font-weight="700">2.8% ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 额外 GPU 算力开销: <tspan fill="#60a5fa" font-weight="700">+14.0%</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 通用 API 网关零侵入最佳实践：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">8B 输入护栏 (110ms) 与 70B 主模型 Prefill</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">(240ms) 同时起跑！主模型算完首字时护栏</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">早已出结果，延迟几乎 100% 完美重叠隐藏！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 隐藏层激活探针 + Cedar 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">主模型第20层线性探针 (RepE) + 工具策略沙箱</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 护栏净延迟损耗: <tspan fill="#34d399" font-weight="700">仅 +1.5 ms (零感护栏 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 变形越狱拦截率: <tspan fill="#34d399" font-weight="700">98.4% (看穿伪装意图 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• RAG 间接注入拦截: <tspan fill="#34d399" font-weight="700">97.6% 🏆</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 正常业务误杀率: <tspan fill="#6ee7b7" font-weight="700">仅 1.1% (全场最低 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 额外 GPU 算力开销: <tspan fill="#34d399" font-weight="700">仅 +2.0% (免独立 8B 卡 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 表征工程 (RepE) 降维打击：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">不管黑客用 Base64 还是古汉语伪装，70B 主</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">模型第 20 层隐藏状态都会激活“危害概念向</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">量”！直接挂 1 个 8192×8 线性头 0.8ms 秒抓！</text>
  </g>

  <!-- Bottom Left: 4 Attack Vectors Recall -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🎯 四类高危红队攻击拦截率对比：传统正则 (Tier 1) vs. 激活探针+沙箱 (Tier 4)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">为什么外部小分类器看不懂 Base64 暗语，而 70B 主模型自身的第 20 层隐藏状态一眼看穿？</text>

    <!-- Vec 1 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">1. 已知模板直接越狱 (DAN)</text>
    <rect x="245" y="74" width="278" height="14" rx="3" fill="#10b981"/>
    <text x="530" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">99.6% (Tier 4)</text>
    <rect x="245" y="92" width="246" height="14" rx="3" fill="#64748b"/>
    <text x="498" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">88.0% (Tier 1)</text>

    <!-- Vec 2 -->
    <text x="24" y="144" fill="#cbd5e1" font-size="12" font-weight="700">2. Base64 / 多语种加密伪装</text>
    <rect x="245" y="130" width="275" height="14" rx="3" fill="#10b981"/>
    <text x="527" y="142" fill="#6ee7b7" font-size="11.5" font-weight="700">98.2% (Tier 4 🏆)</text>
    <rect x="245" y="148" width="35" height="14" rx="3" fill="#ef4444"/>
    <text x="288" y="160" fill="#f87171" font-size="11.5" font-weight="700">12.5% (正则全漏 ✕)</text>

    <!-- Vec 3 -->
    <text x="24" y="200" fill="#cbd5e1" font-size="12" font-weight="700">3. RAG 文档间接提示词注入</text>
    <rect x="245" y="186" width="273" height="14" rx="3" fill="#10b981"/>
    <text x="525" y="198" fill="#6ee7b7" font-size="11.5" font-weight="700">97.6% (Tier 4 🏆)</text>
    <rect x="245" y="204" width="88" height="14" rx="3" fill="#ef4444"/>
    <text x="340" y="216" fill="#f87171" font-size="11.5" font-weight="700">31.5% (Tier 1 ✕)</text>

    <!-- Vec 4 -->
    <text x="24" y="256" fill="#cbd5e1" font-size="12" font-weight="700">4. 工具调用参数越权篡改</text>
    <rect x="245" y="242" width="280" height="14" rx="3" fill="#10b981"/>
    <text x="532" y="254" fill="#6ee7b7" font-size="11.5" font-weight="700">100.0% (Cedar 拦截 🏆)</text>
    <rect x="245" y="260" width="117" height="14" rx="3" fill="#ef4444"/>
    <text x="370" y="272" fill="#f87171" font-size="11.5" font-weight="700">42.0% (Tier 1 ✕)</text>

    <rect x="20" y="284" width="560" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="304" fill="#6ee7b7" font-size="11.5" font-weight="700">💡 结论：模型能听懂暗语，说明其中间层已经解码了恶意意图！直接读第 20 层激活向量最准！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师纵深防御安全护栏 (Defense-in-Depth) 三道防线</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 第一道防线（输入端）：异步双流并行 + 首字释放门控 (First-Token Gate)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 绝不串行等待！请求到达网关同时发给护栏与主模型；主模型算出第 1 个 Token 准备发往</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  客户端前检查护栏布尔锁（此时护栏早已跑完），实现 `+1.5~8ms` 零感延迟！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 第二道防线（模型内）：隐藏层线性探针 (Activation Probe) + 滑动窗口输出审查</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 自建 vLLM/SGLang 在第 20 层挂载轻量线性探针（拦截 98.4% 加密越狱与 RAG 注入）；</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  输出端边流式吐字边按 32-Token 滑窗异步扫描，发现违规毫秒级熔断 SSE 流！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 第三道防线（动作端）：Agent 工具调用必过 Cedar / OPA 确定性策略引擎</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 永远假设大模型可能被 RAG 文档里的隐藏指令劫持！在执行转账、删库、发邮件等</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  Tool Call 前，必须用确定性策略代码校验 `caller_jwt.scope` 与金额阈值（100% 拦截）！</text>
  </g>
</svg>
