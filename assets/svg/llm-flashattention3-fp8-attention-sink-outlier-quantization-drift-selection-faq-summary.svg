<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 295 · FLASHATTENTION-3 FP8 (E4M3) OUTLIER DRIFT &amp; INCOHERENT HADAMARD ROTATION</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">Per-Tensor FP8 Sink Crush (-11.2 pt, 0.048 RMSE) vs. Per-Block + Hadamard (0.003 RMSE, 1,180 TFLOPS)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2: Per-Tensor / Per-Head FP8 Outlier Crush</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Attention Sink (Token 0) &amp; RoPE channels have 30x</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  higher magnitude than normal tokens in Q and K!</text>
  <text x="85" y="305" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Per-tensor FP8 scale s = max(|K|)/448 is stretched</text>
  <text x="85" y="333" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  by Token 0, crushing 99.9% of tokens into 0 in E4M3!</text>
  <text x="85" y="368" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Attention RMSE explodes 16x (0.0480 vs 0.0030)</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Long-Context Accuracy: 73.0% (-11.2 pt Crash!)</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Attention Output RMSE vs FP32: 0.0480 (16x Worse)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Per-Block FP8 + Incoherent Hadamard</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Per-Block (64x128 Tile) Scaling:</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Isolates Block 0 (Attention Sink) from Blocks 1..N!</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Orthogonal Hadamard Rotation (QH)(KH)^T = Q(HH^T)K^T:</text>
  <text x="640" y="333" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Smears channel outliers evenly across all 128 dims!</text>
  <text x="640" y="368" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Ping-Pong Warp-Specialized WGMMA + MUFU Overlap</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Accuracy: 84.1% (+11.1 pt) · RMSE: 0.0030 (16x Lower)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">Throughput: 1,180 TFLOPS (1.79x Faster Than BF16 FA3!)</text>
</svg>
