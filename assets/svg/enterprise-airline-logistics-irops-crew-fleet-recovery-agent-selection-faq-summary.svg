<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad423" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad423" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad423)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级航空与干线物流不正常航班动态恢复（IROPS）、机组排班法规与列生成 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">420架飞机 / 日均1,800班 / 1.4万名机组 · 传统签派手工调机 vs. 纯LLM直接排飞机与机组 vs. 单纯换飞机MIP vs. NOTAM解析 + 飞机机组一体化列生成 + FAR 117铁闸</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">93.8% Rec · 0% 超时违法</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 签派员手工甘特图串行恢复</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">算完一轮要2小时，只能大面积取消航班</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 先调飞机尾号、再调飞行员、最后改签旅客</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 雷雨面积延误下人工耗时 135分钟，恢复率 62%</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">受影响旅客/货量恢复率: 62.0% ✕</text>
  <text x="54" y="334" fill="#6ee7b7" font-size="13" font-weight="700">违反FAR 117/CCAR-121执勤期率: 0.6%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">全局重调度计算耗时: 135.0 分钟 ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月度航班取消与延误赔付: $680,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：零星单机故障，大面积雷雨延误彻底瘫痪</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 纯 Prompt 让 LLM 直接重排机组</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">机组在跑道上执勤超时违法，当场停飞</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• LLM 算不清飞行员过去28天累计飞行与10h休息期</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 21.5% 排班违反民航局执勤上限，引发连环停飞</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">受影响旅客/货量恢复率: 54.0% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">违反FAR 117/CCAR-121率: 21.5% (违法 ✕)</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">全局重调度计算耗时: 3.5 分钟</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月度停飞与民航罚单成本: $920,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让自由文本LLM直接生成飞机与机组排班表</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 独立飞机 MIP + 文本规章 RAG</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">换了飞机却把机组甩在异地，仍断裂5.8%</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 仅优化飞机尾号流转，未与机组资格/执勤期联立</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 换大机型后原机组无宽体机资质，被迫二次重算</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">受影响旅客/货量恢复率: 76.5%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">违反FAR 117/机组衔接断裂率: 5.8% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">全局重调度计算耗时: 28.0 分钟</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月度航班取消与赔付成本: $310,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：小型单一机型车队/机队，跨机型联调易断链</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad423)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: NOTAM解析+列生成+FAR117铁闸 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">LLM转NOTAM约束 + 一体化列生成求解</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• LLM 将非结构化航行通告(NOTAM)/宵禁转为数学约束</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• Branch-and-Price 列生成联立求解 + FAR 117 零违规</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">受影响旅客/货量恢复率: 93.8% 🏆 (+31.8pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">违反FAR 117/CCAR-121率: 0.0% 🏆 (合法子问题)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">全局重调度计算耗时: 4.2 分钟 🏆 (-96.9%)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月度不正常航班损失: $115,000 (-83.1% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：客运航司AOC/OCC、航空货运与干线甩挂物流</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 航空运行控制 (AOC/OCC) 架构师铁律（LLM NOTAM Compiler + Integrated Column Generation + FAR 117 Gate）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 大模型只负责将非结构化航行通告（NOTAM）、雷雨流控（GDP）与维修电报编译为时间窗约束，绝不直接手写飞机与机组排班表。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 飞机尾号、机组资格与执勤期（FAR Part 117 / CCAR-121）必须通过分支定价（Column Generation）与资源受限最短路（RCSPP）联立求解 · Provenance: synthetic + anonymized_reported</text>
</svg>
