<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#664 企业分支网点/工厂边缘 AI 算力盒选型：Blackwell 96GB GDDR7 vs. 512GB 统一内存主机 vs. DGX Spark / Thor</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">Edge AI Appliance Sizer: Why 512GB Unified Memory Fits 671B at B=1 (21 tok/s) but Collapses at B=8 (TTFT 4.8s) vs. Blackwell 96GB GDDR7</text>

  <!-- Left: Three-Watermark Math on Edge Hardware -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FDE68A" font-size="15" font-weight="700">① 用三水位线解剖网红“512GB 统一内存跑满血 671B”</text>

  <rect x="40" y="150" width="333" height="156" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">🔍 为什么 512GB 统一内存主机只能做“单人玩具 (B=1)”？</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">· 显存水位 (`819 GB/s LPDDR5X`)：确实能装下 `380 GB` 的</text>
  <text x="52" y="214" fill="#CBD5E1" font-size="12">  `DeepSeek-671B INT4`，且因为 MoE 每步只激活 `37B` 参数 (`18.5GB`)，</text>
  <text x="52" y="234" fill="#6EE7B7" font-size="12">  单人 `B=1` Decode 速度可达 `18.5 GB / 700 GB/s → 37 tok/s (约 21 tok/s)`</text>
  <text x="52" y="256" fill="#FCA5A5" font-size="12" font-weight="700">· ⛔ 致命软肋：算力水位 (`仅 ~65 TFLOPS FP16` 峰值)！</text>
  <text x="52" y="276" fill="#FCA5A5" font-size="11">  一旦门店有 `8` 个店员并发提问 (`8 × 4K Input`)，Prefill 算力</text>
  <text x="52" y="294" fill="#FCA5A5" font-size="11" font-weight="700">  瞬间被打爆，首字延迟 `TTFT` 飙升至 `4,850 ms`，并发彻底崩溃！</text>

  <rect x="40" y="318" width="333" height="160" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="340" fill="#6EE7B7" font-size="13" font-weight="700">✅ 真正的企业分支网点神卡：RTX PRO 6000 Blackwell (96GB)</text>
  <text x="52" y="362" fill="#F8FAFC" font-size="12">· 显存与带宽：**`96 GB GDDR7` · `1,792 GB/s`** (统一内存的 2.2x!)</text>
  <text x="52" y="382" fill="#F8FAFC" font-size="12">· 算力：**`~1,000 TFLOPS FP8 / 2,000 TOPS NVFP4`** (快 15 倍!)</text>
  <text x="52" y="402" fill="#D1FAE5" font-size="12">· 单卡即可装下 `70B NVFP4 (38GB)` 或 `32B FP8 (32GB)`，留出</text>
  <text x="52" y="422" fill="#D1FAE5" font-size="12">  `50 GB` 显存支撑网点 `16` 人高并发 (`TTFT = 240ms`, `TPOT = 14ms`)</text>
  <text x="52" y="444" fill="#6EE7B7" font-size="12" font-weight="700">· 插在标准 2U/塔式工控机内 (300W~600W)，无需机房改造！</text>

  <!-- Center: 3 Edge Appliance Tiers Comparison -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 三大边缘 AI 算力形态硬核参数与适用边界</text>

  <rect x="423" y="150" width="354" height="98" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="435" y="172" fill="#38BDF8" font-size="13" font-weight="700">形态 A：车载/AGV/机械臂嵌入式盒 (Jetson Thor / DGX Spark)</text>
  <text x="435" y="192" fill="#F1F5F9" font-size="12">· 规格：`128 GB LPDDR5X` · `273 GB/s` · `100W~240W` · `$3,999`</text>
  <text x="435" y="212" fill="#CBD5E1" font-size="12">· 能力：跑 `7B/14B FP8/NVFP4` + 多路摄像头 VLA 具身控制</text>
  <text x="435" y="232" fill="#38BDF8" font-size="11" font-weight="700">· 边界：受限于 273 GB/s 带宽，70B FP8 单人仅 3.8 tok/s，只适合 &lt;=14B</text>

  <rect x="423" y="260" width="354" height="98" rx="8" fill="#0F172A" stroke="#A78BFA"/>
  <text x="435" y="282" fill="#C4B5FD" font-size="13" font-weight="700">形态 B：超大统一内存静音桌面盒 (M3 Ultra 512GB LPDDR5X)</text>
  <text x="435" y="302" fill="#F1F5F9" font-size="12">· 规格：`512 GB 统一内存` · `819 GB/s` · `140W` · `$9,499`</text>
  <text x="435" y="322" fill="#CBD5E1" font-size="12">· 能力：唯一能单机免风扇装下 `671B MoE INT4` 的个人研发盒</text>
  <text x="435" y="342" fill="#FCA5A5" font-size="11" font-weight="700">· 边界：仅限 `B=1~2` 个人高管/研究员本地离线使用，严禁做多人服务器！</text>

  <rect x="423" y="370" width="354" height="108" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="435" y="392" fill="#6EE7B7" font-size="13" font-weight="700">形态 C：企业门店/网点/院区边缘工作站 (1~2× Blackwell 96GB)</text>
  <text x="435" y="412" fill="#F8FAFC" font-size="12">· 规格：`96GB / 192GB GDDR7` · `1,792 GB/s` · `$8,500~$16,500`</text>
  <text x="435" y="432" fill="#D1FAE5" font-size="12">· 能力：满血 Tensor Core + 4×NVDEC，同时跑 `32B/70B LLM`</text>
  <text x="435" y="452" fill="#6EE7B7" font-size="12" font-weight="700">  + 本地语音 ASR/TTS + 门店 RTSP 视觉，轻松支撑 16~32 人并发！</text>

  <!-- Right: Cloud-Edge Split & Offline Autonomy -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="829" y="136" fill="#38BDF8" font-size="15" font-weight="700">③ 500 家门店/网点“云边协同 + 断网自治”蓝图</text>

  <rect x="827" y="150" width="333" height="152" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="839" y="172" fill="#6EE7B7" font-size="13" font-weight="700">🔄 85% 本地闭环 + 15% 上云协同路由法则</text>
  <text x="839" y="194" fill="#F8FAFC" font-size="12">· **85% 流量留边缘盒 (`0` 专线带宽 · `&lt;15ms` 极速响应)**：</text>
  <text x="839" y="214" fill="#CBD5E1" font-size="11">  · 门店摄像头 RTSP 实时防损/安全检测 (视频流绝不上云!)</text>
  <text x="839" y="232" fill="#CBD5E1" font-size="11">  · 柜面语音实时转写、含客户隐私 PII 的本地初步脱敏与 FAQ</text>
  <text x="839" y="254" fill="#38BDF8" font-size="12">· **15% 复杂跨网点长尾推理上送中心云 (`#630 H200` 集群)**：</text>
  <text x="839" y="274" fill="#CBD5E1" font-size="11">  · 仅上传脱敏后的 `2KB` 结构化文本摘要调用中心 `671B R1`</text>
  <text x="839" y="290" fill="#6EE7B7" font-size="11" font-weight="700">  · 外网光纤被挖断时：本地 `32B/70B` 100% 降级接管，业务零停摆！</text>

  <rect x="827" y="314" width="333" height="164" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="839" y="336" fill="#FDE68A" font-size="13" font-weight="700">📊 500 家分支机构 3 年总 TCO 对比</text>
  <text x="839" y="360" fill="#FCA5A5" font-size="12">1. 500 家门店全量视频+语音回传中心云 (需升级专线)：</text>
  <text x="839" y="378" fill="#CBD5E1" font-size="11">   · 专线网络费 (`$45万/月`) + 中心算力 = 3 年 **`$19.80M`**</text>
  <text x="839" y="402" fill="#6EE7B7" font-size="12" font-weight="700">2. 每店 1 台 Blackwell 96GB 边缘盒 (`$8.5K/店`) + 15% 云协同：</text>
  <text x="839" y="422" fill="#F8FAFC" font-size="11">   · 边缘硬件一次性 CapEx (`$4.25M`) + 中心轻量池 (`$1.45M`)</text>
  <text x="839" y="442" fill="#6EE7B7" font-size="12" font-weight="700">   = 3 年总 TCO 仅 **`$5.70M` (净省 `$14.10M / -71.2%` SD-WAN 专线费！)**</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 边缘算力一体机选型金律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 分清“个人 B=1 玩具”与“网点 B=16 生产机”：512GB 统一内存主机因算力弱仅适合 B=1 个人跑 MoE；网点多人并发必选 `96GB GDDR7 Blackwell`；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 视频与原始音频永不出门店：在边缘盒就地消化 85% 高带宽多模态流与常规问答，仅将 15% 脱敏文本上云，立省 71.2% 广域网专线与中心算力成本。</text>
</svg>
