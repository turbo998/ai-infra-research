<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🧩 多租户 GPU 算力切分与故障隔离选型一图流总结（Time-Slicing vs. MPS vs. 硬件 MIG vs. DRA+HAMi）</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">56 个政企小模型/Embedding/Notebook 微服务混部于 H200 (141GB) · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#e0e7ff" font-size="13" font-weight="700" text-anchor="middle">Round 34 · Multi-Tenant GPU Sharing</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: K8s 时间片轮转 (Time-Slicing)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">毫秒级整卡上下文切换 · 零显存隔离</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡聚合吞吐: <tspan fill="#f87171" font-weight="700">142.0 QPS (1.00x ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 吵闹邻居 P99 抖动: <tspan fill="#f87171" font-weight="700">+215.0% (严重卡顿 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 邻居 OOM 爆炸波及: <tspan fill="#f87171" font-weight="700">100% 全卡陪葬 ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 非法内存访问波及: <tspan fill="#34d399" font-weight="700">0% (独立上下文)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 承载 56 服务需卡数: <tspan fill="#f87171" font-weight="700">16 张 H200 ($38.4万/年)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么 Time-Slicing 严禁上生产？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">没有显存配额限制！只要租户 A 的 Notebook</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">写死循环吃光 141GB 显存，同卡的 B/C/D</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">线上推理服务当场全部报 OOM 崩溃退出！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: NVIDIA CUDA MPS 空间并发</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">SM 空间并发执行 · 共享单一 GPU 页表</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡聚合吞吐: <tspan fill="#34d399" font-weight="700">333.7 QPS (2.35x ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 吵闹邻居 P99 抖动: <tspan fill="#fbbf24" font-weight="700">+28.5% (共享 L2/HBM)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 邻居 OOM 爆炸波及: <tspan fill="#34d399" font-weight="700">0% (MEM_LIMIT 拦截)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 非法内存访问波及: <tspan fill="#f87171" font-weight="700">100% 致命连坐崩溃 ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 承载 56 服务需卡数: <tspan fill="#fbbf24" font-weight="700">10 张 H200 ($24.0万/年)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ MPS 最隐蔽的“致命连坐陷阱”：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">所有客户端合并进同一个 GPU 虚拟地址空间！</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">一旦任意 1 个进程触发数组越界 (XID 31)，</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">CUDA 驱动会直接杀死整张卡上所有租户！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 硬件级 MIG (7×1g.20gb)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">硅片级独立 SM + 独立显存通道 + 独立 L2</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡聚合吞吐: <tspan fill="#60a5fa" font-weight="700">298.0 QPS (2.10x ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 吵闹邻居 P99 抖动: <tspan fill="#34d399" font-weight="700">+1.8% (物理级稳态 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 邻居 OOM 爆炸波及: <tspan fill="#34d399" font-weight="700">0% (物理硬边界 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 非法内存访问波及: <tspan fill="#34d399" font-weight="700">0% (独立硬件引擎 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 承载 56 服务需卡数: <tspan fill="#60a5fa" font-weight="700">10 张 H200 ($24.0万/年)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 跨部门/不可信多租户唯一铁闸：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">从 Crossbar 总线到 HBM 控制器全链路物理切</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">开，彻底杜绝邻居抖动与故障传染；唯一局限</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">是粒度固定（最多 7 份），空闲算力不可借用。</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: K8s DRA + MIG + HAMi 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">跨租户硬件 MIG 硬隔离 + 租户内软切分复用</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡聚合吞吐: <tspan fill="#34d399" font-weight="700">352.0 QPS (2.48x 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 吵闹邻居 P99 抖动: <tspan fill="#34d399" font-weight="700">+3.2% (硬边界护航 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 跨租户故障/OOM波及: <tspan fill="#34d399" font-weight="700">0% (零跨界传染 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 整卡有效装箱率: <tspan fill="#6ee7b7" font-weight="700">88.5% (比独占高 4.8x 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 承载 56 服务需卡数: <tspan fill="#34d399" font-weight="700">8 张 H200 ($19.2万/年 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 软硬协同两级切分黄金架构：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 外层用 K8s DRA 动态切出硬件 MIG 隔离不</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">同业务线；② 内层在同一业务线内部用 HAMi</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">或 MPS 细粒度共享 Embedding 与 Reranker！</text>
  </g>

  <!-- Bottom Left: Fault & Noisy Neighbor Matrix -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">💥 三大生产灾难场景实测：Time-Slicing vs. CUDA MPS vs. 硬件 MIG</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">为什么不能把不同部门或含自定义 CUDA 算子的任务塞进同一个 CUDA MPS 进程树？</text>

    <!-- Header -->
    <rect x="20" y="68" width="560" height="28" rx="4" fill="#1e293b"/>
    <text x="30" y="86" fill="#cbd5e1" font-size="11.5" font-weight="700">生产故障 / 干扰注入场景</text>
    <text x="245" y="86" fill="#f87171" font-size="11.5" font-weight="700">Time-Slicing</text>
    <text x="365" y="86" fill="#fbbf24" font-size="11.5" font-weight="700">CUDA MPS</text>
    <text x="475" y="86" fill="#34d399" font-size="11.5" font-weight="700">硬件 MIG / Tier 4</text>

    <!-- Row 1 -->
    <text x="30" y="124" fill="#f8fafc" font-size="12" font-weight="700">1. 邻居跑满死循环大矩阵乘</text>
    <text x="30" y="142" fill="#94a3b8" font-size="11">(争抢 SM 与 HBM 显存带宽)</text>
    <text x="245" y="132" fill="#f87171" font-size="12" font-weight="700">P99 +215% ✕</text>
    <text x="365" y="132" fill="#fbbf24" font-size="12" font-weight="700">P99 +28.5%</text>
    <text x="475" y="132" fill="#34d399" font-size="12" font-weight="700">P99 +1.8% 🏆</text>

    <!-- Row 2 -->
    <text x="30" y="184" fill="#f8fafc" font-size="12" font-weight="700">2. 邻居内存泄漏申请 130GB</text>
    <text x="30" y="202" fill="#94a3b8" font-size="11">(显存 OOM 炸弹测试)</text>
    <text x="245" y="192" fill="#f87171" font-size="12" font-weight="700">100% 陪葬 ✕</text>
    <text x="365" y="192" fill="#34d399" font-size="12" font-weight="700">0% 波及 ✅</text>
    <text x="475" y="192" fill="#34d399" font-size="12" font-weight="700">0% 波及 🏆</text>

    <!-- Row 3 -->
    <text x="30" y="244" fill="#f8fafc" font-size="12" font-weight="700">3. 邻居算子指针越界 (XID 31)</text>
    <text x="30" y="262" fill="#94a3b8" font-size="11">(CUDA_ERROR_ILLEGAL_ADDRESS)</text>
    <text x="245" y="252" fill="#34d399" font-size="12" font-weight="700">0% 波及 ✅</text>
    <text x="365" y="252" fill="#f87171" font-size="12" font-weight="800">100% 团灭 ✕</text>
    <text x="475" y="252" fill="#34d399" font-size="12" font-weight="700">0% 波及 🏆</text>

    <rect x="20" y="280" width="560" height="32" rx="6" fill="#1e293b"/>
    <text x="30" y="301" fill="#e0e7ff" font-size="11.5" font-weight="700">💡 核心洞察：CUDA MPS 只能在“同一应用内部的受信微服务组（如 RAG 的 Emb+Rerank）”内开启！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师多租户 GPU 切分与共享黄金选型法则</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 跨部门租户 / 在线推理与开发 Notebook 混部 → 必选硬件 MIG (Tier 3/4)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 利用 H100/H200/B200 的硬件 MIG 切出 `1g.20gb` 或 `2g.40gb` 实例：每个租户拥有物理</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  独立的显存通道与 L2 缓存，就算隔壁 Notebook 写崩内核指针，线上服务抖动也 &lt;1.8%！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="160" fill="#fcd34d" font-size="13" font-weight="800">2️⃣ 同一业务流水线内部多模型并发 (如 Embedding + Reranker + 8B) → 选 MPS</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 在单个硬件 MIG 分区内部开启 `CUDA MPS`（或 CNCF `HAMi` 用户态拦截），让同一个</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  RAG 流水线里的多个小算子空间并发复用 SM，吞吐比 Time-Slicing 暴涨 `2.35x~2.48x`！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="250" fill="#6ee7b7" font-size="13" font-weight="800">3️⃣ 全面拥抱 Kubernetes 1.32+ DRA (Dynamic Resource Allocation)</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 传统 `device-plugin` 只能按整数张卡申请 (`nvidia.com/gpu: 1`)；升级至 K8s `DRA`</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  `ResourceClaim` 后，Pod 可直接声明精确显存 (`16Gi`) 与算力配额并自动触发动态 MIG 重切！</text>
  </g>
</svg>
