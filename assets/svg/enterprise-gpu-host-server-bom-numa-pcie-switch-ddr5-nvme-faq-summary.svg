<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#657 智算 GPU 服务器宿主硬件配比 (Host BoM)：PCIe Gen5 Switch、DDR5 &gt;= 2x HBM、CPU NUMA 与本地 NVMe</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">GPU Server Host BoM (8x H200 / B200): Why 512GB RAM &amp; Switchless PCIe Strangle a $300K GPU Node · 2,048GB 24-Ch DDR5 · PEX89144 PIX</text>

  <!-- Left: Why Skimping on Host BoM Cripples $300K GPUs -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#EF4444" stroke-width="1.5"/>
  <text x="42" y="136" fill="#FCA5A5" font-size="15" font-weight="700">① 为什么省 $8,000 宿主机配置会废掉 $30万的 GPU？</text>

  <rect x="40" y="150" width="333" height="156" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 三大常见“缩水宿主机”采购翻车事故</text>
  <text x="52" y="194" fill="#F1F5F9" font-size="12">1. 内存配太小 (`仅配 512 GB DDR5` vs `1,128 GB HBM`)：</text>
  <text x="52" y="212" fill="#CBD5E1" font-size="11">   加载 671B 权重或做异步 Checkpoint 时直接触发 Linux OOM Killer！</text>
  <text x="52" y="232" fill="#F1F5F9" font-size="12">2. 内存通道未插满 (`仅插 8 根 64GB` 而非 `24 根 96GB`)：</text>
  <text x="52" y="250" fill="#CBD5E1" font-size="11">   DDR5 带宽从 `910 GB/s` 跌至 `300 GB/s`，L2 KV 卸载慢 3 倍！</text>
  <text x="52" y="270" fill="#F1F5F9" font-size="12">3. 省掉 PCIe Gen5 Switch 芯片 (`GPU 与网卡直连 CPU`)：</text>
  <text x="52" y="288" fill="#FCA5A5" font-size="11" font-weight="700">   GPUDirect RDMA 退化为 `NODE/SYS`，跨机 RDMA 带宽暴跌 64%！</text>

  <rect x="40" y="318" width="333" height="160" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="340" fill="#6EE7B7" font-size="13" font-weight="700">✅ 宿主机黄金配比四定律 (8× H200 / B200 整机)</text>
  <text x="52" y="362" fill="#F8FAFC" font-size="12">1. **内存容量**：`M_DDR5 &gt;= 2.0 × M_HBM = 2,048 GB ~ 2,304 GB`</text>
  <text x="52" y="382" fill="#F8FAFC" font-size="12">2. **内存通道**：`100% 满通道插满` (2×12 通道 = 24 根 DDR5-5600)</text>
  <text x="52" y="402" fill="#F8FAFC" font-size="12">3. **PCIe 拓扑**：`4 颗 PCIe Gen5 Switch (PEX89144)` 实现</text>
  <text x="52" y="420" fill="#6EE7B7" font-size="11" font-weight="700">   每颗 Switch 下挂 `2×GPU + 2×400G NIC + 2×Gen5 NVMe` (`100% PIX`)</text>
  <text x="52" y="440" fill="#F8FAFC" font-size="12">4. **CPU 核数**：双路 `2 × 48~64 核` (`&gt;=12 vCPU / GPU`)</text>
  <text x="52" y="460" fill="#A7F3D0" font-size="11">   严禁选高核数低主频 CPU：单核睿频需 `&gt;= 3.5 GHz` 保调度延迟！</text>

  <!-- Center: PCIe Gen5 Switch PIX Topology Diagram -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="425" y="136" fill="#6EE7B7" font-size="15" font-weight="700">② 为什么 4 颗 PCIe Gen5 Switch 是智算服务器灵魂？</text>

  <rect x="423" y="150" width="354" height="162" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="435" y="172" fill="#38BDF8" font-size="13" font-weight="700">🔍 单颗 PCIe Gen5 Switch (如 Broadcom PEX89144) 扇出结构</text>
  <text x="435" y="196" fill="#F8FAFC" font-size="11" font-family="Consolas, monospace">        [ CPU Socket 0 (PCIe Gen5 x16 Uplink) ]</text>
  <text x="435" y="214" fill="#38BDF8" font-size="11" font-family="Consolas, monospace">                        │</text>
  <text x="435" y="232" fill="#6EE7B7" font-size="11" font-weight="700" font-family="Consolas, monospace">        ┌─── [ PCIe Gen5 Switch #0 ] ───┐</text>
  <text x="435" y="252" fill="#F8FAFC" font-size="11" font-family="Consolas, monospace">   ┌────┴────┐      ┌────┴────┐    ┌────┴────┐</text>
  <text x="435" y="270" fill="#FDE68A" font-size="11" font-family="Consolas, monospace"> GPU0/1    NIC0/1  NVMe0/1  (全部同属 1 颗 Switch = PIX!)</text>
  <text x="435" y="294" fill="#D1FAE5" font-size="11">· 网卡收到的 RDMA 包 &amp; NVMe 读出的 GDS 权重，在 Switch 内部</text>
  <text x="435" y="308" fill="#6EE7B7" font-size="11" font-weight="700">  直接 P2P 转发进 GPU (`64 GB/s` 满速)，0 字节经过 CPU Root Complex！</text>

  <rect x="423" y="324" width="354" height="154" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="435" y="346" fill="#6EE7B7" font-size="13" font-weight="700">📐 24 通道满插 DDR5 与 NUMA 亲和绑核手算</text>
  <text x="435" y="368" fill="#F8FAFC" font-size="12">· 双路 Xeon Emerald Rapids / Granite Rapids 或 EPYC Turin：</text>
  <text x="435" y="388" fill="#CBD5E1" font-size="12">  · `24 Ch × 8 Bytes × 5.6 GT/s × 0.85 效率 =` **`914 GB/s` 主存带宽**</text>
  <text x="435" y="408" fill="#6EE7B7" font-size="12" font-weight="700">· NUMA 铁律：GPU 0..3 进程必须 `numactl --cpunodebind=0</text>
  <text x="435" y="426" fill="#6EE7B7" font-size="12" font-weight="700">  --membind=0` 绑定在 Socket 0；GPU 4..7 绑定在 Socket 1！</text>
  <text x="435" y="448" fill="#FCA5A5" font-size="11">  (若跨 Socket 访问远端 NUMA 内存，经过 UPI/XGMI 带宽腰斩至 140 GB/s)</text>

  <!-- Right: Standard 8-GPU Server Host BoM Checklist -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="829" y="136" fill="#FDE68A" font-size="15" font-weight="700">③ 旗舰 8×H200/B200 服务器标准招标 BoM 表</text>

  <rect x="827" y="150" width="333" height="218" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="839" y="174" fill="#38BDF8" font-size="12" font-weight="700">1. GPU 模组：`8× H200 SXM (1,128GB)` 或 `8× B200 (1,440GB)`</text>
  <text x="839" y="198" fill="#6EE7B7" font-size="12" font-weight="700">2. 宿主 CPU：`2× 48~64 核 高主频处理器` (基频 &gt;=2.6GHz)</text>
  <text x="839" y="216" fill="#CBD5E1" font-size="11">   · 分配：每卡 4 核跑 vLLM/SGLang Worker + 4 核跑 XGrammar + 4 核系统</text>
  <text x="839" y="240" fill="#FDE68A" font-size="12" font-weight="700">3. 系统内存：`2,048 GB ~ 2,304 GB DDR5-5600/6400`</text>
  <text x="839" y="258" fill="#CBD5E1" font-size="11">   · 强制要求：`16 或 24 通道 100% 满插 (1DPC)`，预留 512GB Pinned 内存池</text>
  <text x="839" y="282" fill="#C4B5FD" font-size="12" font-weight="700">4. PCIe 交换架构：`4× Broadcom PEX89144 Gen5 Switch`</text>
  <text x="839" y="300" fill="#CBD5E1" font-size="11">   · 拒绝无 Switch 的廉价准系统，确保 GPU-NIC-NVMe 100% PIX</text>
  <text x="839" y="324" fill="#38BDF8" font-size="12" font-weight="700">5. 本地 NVMe 存储：`8× 3.84TB PCIe Gen5 U.2/E3.S NVMe`</text>
  <text x="839" y="342" fill="#CBD5E1" font-size="11">   · 聚合读取：`8 × 7.0 GB/s = 56 GB/s` (支持 GDS 14s 加载 + 3FS)</text>

  <rect x="827" y="380" width="333" height="98" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="839" y="402" fill="#6EE7B7" font-size="13" font-weight="700">💰 宿主机配齐 ROI：多花 2.6% 预算，挽回 42% 整机性能</text>
  <text x="839" y="424" fill="#F8FAFC" font-size="12">· 缩水宿主机 (`512G RAM + 无 Switch`) 仅省 `$8,200` (`2.6%`)</text>
  <text x="839" y="444" fill="#6EE7B7" font-size="12" font-weight="700">· 标准满配宿主机让 GPUDirect RDMA 提速 `2.8x`、L2 KV 恢复</text>
  <text x="839" y="462" fill="#6EE7B7" font-size="11" font-weight="700">  从 `310ms` 压至 `97ms`、彻底杜绝 OOM 宕机！</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 智算服务器招标技术规范书铁律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 内存容量必寫 `DDR5 &gt;= 2.0 × HBM 总量` 且 `100% 满内存通道 (1DPC)`：为 Pinned Host KV 卸载池、异步 Checkpoint 与模型热切换留足空间；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 架构图必审 `4× PCIe Gen5 Switch`：确保每张 GPU 与对应 400G 网卡、本地 NVMe 同属一颗 Switch (`PIX`)，严禁跨 CPU Root Complex 绕行。</text>
</svg>
