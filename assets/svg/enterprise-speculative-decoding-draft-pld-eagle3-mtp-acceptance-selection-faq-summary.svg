<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业大模型投机解码四大流派 (Standalone Draft vs. PLD vs. Medusa vs. EAGLE-3/MTP) 选型 (#486)</text>
  <text x="28" y="58" class="sub">为什么独立 7B 小模型做 Draft 既吃 16.5GB 显存又因为 28 层串行延迟抵消收益？EAGLE-3 / 原生 MTP 实现 2.42x 无损加速</text>

  <!-- Left Panel: Why Standalone Draft Models Lose to EAGLE-3 / Native MTP -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么“70B 配一个独立 7B 小模型做投机解码”在生产中几乎全军覆没？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 独立小模型草案 (Standalone 7B Draft) 的三大工程痛点</text>
  <text x="56" y="164" class="mono">• 痛点 1 (28层串行耗时): 7B 模型虽然参数小，但有整整 28~32 层！串行猜</text>
  <text x="56" y="184" class="mono">  4 个词就要跑 112 层 Kernel，Draft 自身耗时把主模型省下的时间吃掉一半！</text>
  <text x="56" y="202" class="mono">• 痛点 2 (双份 KV 与 TP 错配): 额外吃 16.5GB 显存，且在 TP=8 下小模型极慢！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师双王牌：EAGLE-3 / 原生 MTP (通用主力) + Prompt Lookup (代码重构 🏆)</text>
  <text x="56" y="268" class="mono">• 1) EAGLE-3 / 原生 MTP: 仅 1 层轻量 Transformer 拼接主模型倒数第1层特征，</text>
  <text x="56" y="288" class="mono">     猜 1 步仅耗时 0.4ms，单步平均接收 tau = 3.45 个词，加速高达 2.42x！</text>
  <text x="56" y="308" class="mono">• 2) Prompt Lookup (PLD): 零额外显存，从输入原文直接匹配 N-gram，改代码快 2.15x！</text>

  <!-- Right Panel: 4 Speculative Decoding Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大投机解码流派定量对标 (Llama-70B / DeepSeek-671B)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 独立 7B 草案模型 (Standalone 7B Draft + 独立 KV Cache)</text>
  <text x="638" y="158" class="mono">• 额外显存: +16.5 GB ✕ | 接收长 tau: 2.35 | B=8 加速: 1.32x | B=48: 0.72x ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#93c5fd">Tier 2: Prompt Lookup / N-gram 检索匹配 (零权重，专攻代码修改/文档摘录)</text>
  <text x="638" y="214" class="mono">• 额外显存: +0.05 GB 🏆 | 接收长 tau: 2.60 | B=8 加速: 2.15x ✓ | B=48: 1.18x</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#fde68a">Tier 3: Medusa 并行独立预测头 (非自回归头之间无依赖，接收率偏低)</text>
  <text x="638" y="270" class="mono">• 额外显存: +2.80 GB | 接收长 tau: 2.10 | B=8 加速: 1.58x | B=48: 0.84x ✕</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: EAGLE-3 / 原生 MTP 单层特征头 + 动态 Batch&lt;=24 门控 (推荐 🏆)</text>
  <text x="638" y="326" class="mono">• 额外显存: +2.20 GB | 接收长 tau: 3.45 🏆 | B=8 加速: 2.42x 🏆 | B=48: 1.00x</text>

  <!-- Bottom Panel: Speculative Speedup Formula & Dynamic Batch Cutoff -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 投机解码加速比手算公式、单步期望接收长度 tau 与动态并发旁路阈值</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 单步期望接收 Token 数 tau 公式</text>
  <text x="58" y="464" class="mono">• 设单词接受率为 alpha，草案步数为 gamma：</text>
  <text x="58" y="484" class="mono">  tau = (1 - alpha^(gamma + 1)) / (1 - alpha)</text>
  <text x="58" y="504" class="txt">• 当 EAGLE-3 链式树状草稿 alpha = 0.82, gamma = 4：</text>
  <text x="58" y="524" class="mono">  tau = (1 - 0.82^5) / 0.18 = 3.45 个 Token/步！</text>
  <text x="58" y="548" class="txt" fill="#6ee7b7">即主模型每读 1 次权重，平均往前推进 3.45 个词！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: 真实端到端加速比 Speedup 公式</text>
  <text x="436" y="464" class="mono">• Speedup = tau / (1 + gamma * c_draft + c_verify)</text>
  <text x="436" y="484" class="mono">• 其中 c_draft = T_draft / T_target：</text>
  <text x="436" y="504" class="mono">  - 独立 7B 模型: c_draft ≈ 0.16 -&gt; 4步耗 0.64</text>
  <text x="436" y="524" class="mono">  - EAGLE-3 单层头: c_draft ≈ 0.03 -&gt; 4步仅 0.12！</text>
  <text x="436" y="548" class="txt" fill="#34d399">c_draft 越小，投机解码真实净收益越高！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: 算术强度翻转与动态关停水位</text>
  <text x="814" y="464" class="mono">• 当活跃 Batch B * (gamma + 1) &gt; Ridge_Point</text>
  <text x="814" y="484" class="mono">  (约 140~160 Tokens) 时，主模型验证阶段从</text>
  <text x="814" y="504" class="mono">  访存受限变成算力受限 ($c_{\text{verify}}$ 暴涨)！</text>
  <text x="814" y="526" class="txt" fill="#fde68a">• 强制配置 `speculative_disable_by_batch_size=32`</text>
  <text x="814" y="546" class="txt" fill="#fde68a">  当 B &gt;= 32 时自动回退常规解码，防止反向减速！</text>
</svg>
