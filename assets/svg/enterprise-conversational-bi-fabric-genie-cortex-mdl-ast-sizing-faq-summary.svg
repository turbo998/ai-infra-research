<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#577 企业湖仓对话式 BI 与 Text-to-SQL 架构：Fabric IQ vs. Databricks Genie vs. Cortex Analyst 与 MDL/AST 门禁</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">破解裸塞 200 张物理表 DDL 引发的 45.8% 口径幻觉与笛卡尔积爆仓 · YAML 语义层 (MDL) + SQLGlot AST 安全门禁 · 准确率 96.8% · 省 75% GPU</text>

  <!-- Box 1: Why Raw DDL Text-to-SQL Fails -->
  <rect x="24" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="42" y="138" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 为什么裸喂物理表 DDL 准确率仅 54.2%？</text>
  <rect x="42" y="152" width="310" height="98" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="52" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 痛点 1：物理列名缺失财务/业务口径定义</text>
  <text x="52" y="191" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 湖仓有 5,000 张表，列名如 amt_v2_adj, status=3</text>
  <text x="52" y="209" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 模型靠猜拼接 JOIN，把含税退货算进净营收 (ARR)</text>
  <text x="52" y="227" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold">• 业务口径准确率仅 54.2%，高管根本不敢用!</text>

  <rect x="42" y="258" width="310" height="110" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="52" y="278" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 痛点 2：无约束 SQL 引发数仓笛卡尔积爆仓</text>
  <text x="52" y="297" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 漏写分区键 (dt) 或错误多对多 JOIN 扫描百 TB 表</text>
  <text x="52" y="315" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 塞入 200 张表 DDL 导致每次请求 32,000 Tokens</text>
  <text x="52" y="333" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• P95 耗时 11.4s，且存在越权查薪资表风险!</text>

  <!-- Box 2: MDL Semantic Layer + SQLGlot AST Gate -->
  <rect x="386" y="110" width="354" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="404" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② 语义层 (MDL) + AST 静态门禁架构 🏆</text>
  <rect x="404" y="152" width="318" height="98" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="416" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">1. 声明式语义层 (YAML MDL / Metric Views)</text>
  <text x="416" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 固化标准指标公式、主外键 JOIN 图谱与枚举同义词</text>
  <text x="416" y="209" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Top-10 语义视图检索将上下文从 32K 压至 2.4K 词</text>
  <text x="416" y="227" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 业务 KPI 口径一致率从 54.2% 跃升至 96.8%!</text>

  <rect x="404" y="258" width="318" height="110" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="416" y="278" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">2. 0.8ms SQLGlot AST 语法树校验 + RLS 注入</text>
  <text x="416" y="297" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 强制只读 SELECT、强制校验分区键 dt 与 JOIN 白名单</text>
  <text x="416" y="315" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• AST 自动改写注入 WHERE tenant_id = JWT.dept</text>
  <text x="416" y="333" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• EXPLAIN 预估扫描 &gt;50GB 自动拦截，爆仓率 0.0%!</text>
  <text x="416" y="351" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">• P95 端到端仅 1.45s，仅需 8 张 H200 (-75%)</text>

  <!-- Box 3: 4 Platform Selection Matrix -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 四大湖仓对话式 BI 平台选型</text>
  <rect x="774" y="152" width="264" height="216" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="174" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">1. Microsoft Fabric IQ / Data Agent:</text>
  <text x="786" y="191" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">复用 Power BI Semantic Model (DAX/RLS)</text>
  <text x="786" y="207" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11">与 OneLake 零拷贝，M365 企业首选</text>

  <text x="786" y="232" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">2. Databricks AI/BI Genie:</text>
  <text x="786" y="249" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">深度绑定 Unity Catalog Metric Views</text>
  <text x="786" y="265" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">与行列级 ACL，Spark/Delta 湖仓首选</text>

  <text x="786" y="290" fill="#a78bfa" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">3. Snowflake Cortex Analyst:</text>
  <text x="786" y="307" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">基于 Semantic Model YAML，高准确率托管</text>

  <text x="786" y="332" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">4. 自建 WrenAI (MDL) + vLLM + SQLGlot:</text>
  <text x="786" y="349" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11">跨异构库 (ClickHouse/PG/StarRocks) 私有首选</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 企业对话式 BI 落地三铁律（绝对禁止让 LLM 直接面对原始底层宽表！）：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">1. 语义层铁律：先建 Semantic Layer (Power BI 模型 / Unity Catalog Metric Views / WrenAI MDL)，让 LLM 只生成针对语义视图的查询。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">2. AST 门禁铁律：执行前必须经 SQLGlot AST 解析器验证只读、注入行级安全条件 (RLS) 并检查分区过滤条件。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">3. 算术卸载铁律：严禁让 LLM 对查询结果做加减乘除或环比心算，所有聚合与同比计算 100% 由数仓引擎或确定性 Python 完成！</text>
</svg>
