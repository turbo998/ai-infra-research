<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#F59E0B" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级 AI 网关语义缓存 (Semantic Cache) vs. 推理层精确前缀缓存 (Prefix KV Cache) 选型指南</text>
  <text x="52" y="94" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15">揭秘单纯余弦相似度 (`Cosine ≥ 0.90`) 8.4% 误命中张冠李戴事故：实体/数值强校验语义缓存 + 底层 Radix KV 缓存协同</text>

  <!-- Left: Why Naive Gateway Semantic Cache Causes Production Disasters -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么在网关无脑开启“余弦相似度 0.90 语义缓存”会酿成大祸？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 致命误命中 A：年份/型号/否定词一字之差，余弦相似度高达 `0.972`！</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 问句 1：“2025 年 VIP 客户退保手续费率是多少？” vs 问句 2：“2026 年 VIP 客户退保手续费率是多少？”</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Embedding 向量余弦相似度达 0.972，网关直接把 2025 年的旧答案秒回给 2026 年查询 (8.4% 错答率)！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 致命误命中 B：多轮对话与带个人上下文的 Agent 绝对不能缓存整段回复！</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 用户 A 问“帮我总结这封邮件”与用户 B 问“帮我总结这封邮件”提问句完全一样</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 若未隔离 `tenant_id + context_hash`，直接引发跨租户隐私数据串号泄漏！</text>

  <!-- Right: 3-Layer Hybrid Caching Architecture -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 企业级零张冠李戴三级缓存协同架构 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① L1 精确哈希缓存 (`SHA-256(tenant_id + model + full_messages)`)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">1ms 极速拦截完全相同的重复刷新请求与自动化脚本重试，0.0% 误判风险</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② L2 网关受控语义缓存（仅限 40% 无状态公共 FAQ + 实体/数字强校验）</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">强制提取数字/年份/SKU/否定词做精确键值匹配 + Cross-Encoder &gt; 0.96 复核，误判压至 0.02%！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ L3 推理引擎精确前缀 KV 缓存 (`vLLM APC / SGLang RadixAttention`)</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">对 60% 多轮 Agent / 个性化 RAG 缓存前序 KV 状态而非死答案，100% 数学精确且省 58.5% 算力！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 企业混合负载（40% 公共 FAQ + 60% 个性化多轮 RAG/Agent · 300 RPS）四档缓存对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">大模型缓存架构方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">张冠李戴误命中率</text>
  <text x="630" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">总算力节省比例</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">平均响应延迟</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">跨租户串号风险</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度集群总成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 全局无差别网关语义缓存 (`Cosine ≥ 0.90` 无实体校验)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">8.40% ✕ (严重错答)</text>
  <text x="630" y="524" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">36.0%</text>
  <text x="790" y="524" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">620.0 ms</text>
