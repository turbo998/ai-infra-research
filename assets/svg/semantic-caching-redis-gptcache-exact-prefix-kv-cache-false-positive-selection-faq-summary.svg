  <text x="1120" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14">$89,600/mo</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 仅开启网关 SHA-256 字符串精确匹配缓存</text>
  <text x="450" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.00% ✓</text>
  <text x="630" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">6.5% ✕ (命中极低)</text>
  <text x="790" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">1,180.0 ms</text>
  <text x="950" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">ZERO</text>
  <text x="1120" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">$134,400/mo ✕</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 仅开启推理引擎精确前缀 KV 缓存 (`vLLM / SGLang`)</text>
  <text x="450" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.00% ✓ (数学精确)</text>
  <text x="630" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">41.0% ✓</text>
  <text x="790" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">540.0 ms ✓</text>
  <text x="950" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">ZERO ✓</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$84,000/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): L1 精确哈希 + L2 实体校验 FAQ 语义缓存 + L3 引擎 Prefix KV</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.02% ✓ (实体强锁)</text>
