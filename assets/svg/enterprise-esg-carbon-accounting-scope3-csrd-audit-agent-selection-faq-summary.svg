  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 用“每花1美元排多少碳”掩盖再生铝/绿电减排</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 缺乏原始电表/提单证据链，鉴证完整度仅 64%</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">GHG/CSRD 鉴证准确率: 78.0% ✕</text>
  <text x="54" y="334" fill="#fde68a" font-size="13" font-weight="700">排放因子/单位换算错误率: 4.2%</text>
