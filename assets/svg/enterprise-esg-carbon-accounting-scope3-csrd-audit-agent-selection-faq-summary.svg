  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月报告与合规成本: $115,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：内部碳盘查初稿，不满足欧盟 CSRD 法定披露</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad429)" stroke-width="2.5"/>
