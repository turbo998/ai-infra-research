  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 多模态抽取电费单/提单/BOM，确定性换算 SI 国际单位</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 强绑 Ecoinvent v3.10 因子ID + Python精算 + ISAE3000血缘</text>
