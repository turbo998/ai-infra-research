  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级 ESG 碳核算（Scope 1-2-3）、欧盟 CSRD/CBAM 披露与 ISAE 3000 鉴证 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">85座全球工厂 / 4,200家供应商 / 38万张能耗货运单据 · 传统Excel支出法估算 vs. 纯LLM背诵排放因子心算 vs. 普通文档RAG vs. 量纲归一+Ecoinvent受限库+ISAE3000血缘</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">99.3% Acc · 0% 因子幻觉</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
