  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">GHG/CSRD 鉴证准确率: 99.3% 🏆 (+40.8pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">因子/单位换算错误率: 0.0% 🏆 (代码精算)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">ISAE 3000 证据溯源完整度: 100.0% 🏆</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月碳管理与CBAM总成本: $32,000 (-86.4% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：出海制造(欧盟CBAM/电池护照)、上市公司CSRD</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业 ESG 碳核算与 CSRD 合规架构师铁律（Physical Activity Normalization + Ecoinvent URI + ISAE 3000 Lineage）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 严禁大模型自由生成排放因子或心算碳排：多模态大模型只负责从电表账单/海运提单/供应商PCF中抽取物理活动量，交由代码归一量纲后乘以 Ecoinvent/DEFRA 官方受限因子。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 范围二必须同时输出基于位置（Location-Based）与基于市场（Market-Based I-REC/PPA）双结果，且每笔 tCO2e 绑定原始单据 SHA-256 血缘 · Provenance: synthetic + anonymized_reported</text>
