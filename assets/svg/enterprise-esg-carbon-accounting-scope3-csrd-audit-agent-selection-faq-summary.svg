  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">瞎编排放因子、搞混千瓦时与吉焦被判漂绿</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 凭记忆捏造 Ecoinvent 因子，搞混原生铝与再生铝</text>
