  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 未把绿证(I-REC)抵扣后的市场法与区域电网法双轨分开</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 仍有 8.6% 吨公里/热值换算误差，难过合理保证审计</text>
