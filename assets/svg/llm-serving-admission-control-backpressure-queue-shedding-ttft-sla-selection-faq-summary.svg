<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#EF4444" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">大模型高并发过载保护、自适应准入控制 (Admission Control) 与优雅降级选型指南</text>
  <text x="52" y="94" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15">根治早高峰 2.2x 洪峰下“无界排队 + 客户端超时重试风暴”导致的 Goodput 归零：预测 TTFT 门控 + 小模型无缝接管</text>

  <!-- Left: Anatomy of an LLM Overload Collapse -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么周一早高峰 2 倍流量能把 160 RPS 集群压到只剩 14 RPS？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 死锁链条 A：无界 FIFO 等待队列 + 僵尸请求计算 (Zombie Prefills)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 请求在队列里干等 12 秒，客户端在 8 秒时早已超时断开并自动发起第 2、第 3 次重试</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 后端 GPU 不知请求已过期，仍在全力算那批作废请求的 Prefill（白白吞噬 68.5% 算力！）</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 死锁链条 B：按固定请求数限流 (Tier 2) 挡不住长上下文雪崩</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 传统网关只认 `RPS <= 160`，但 1 条 32K RAG 请求消耗的 Prefill 算力顶 40 条短请求！</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 一旦 KV Cache 超过 92% 触发 Swap 换出，连已在跑的请求 TPOT 也会全员超时违约！</text>

  <!-- Right: Predictive TTFT Admission + Graceful Degradation -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 预测性 TTFT 准入门控与三级优雅降级体系 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 队列首字耗时预测公式：`T_est = (Σ Tokens_queued + L_in) / TPS_prefill`</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">请求进队前先算预估排队 TTFT 与当前 KV 水位 (&lt;85%)；若必超 SLA 绝不盲目塞进 70B 队列！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 全链路 `X-Request-Deadline` 透传：出队瞬间秒删已超时僵尸请求</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">若 `now() + T_prefill_est &gt; Request_Deadline`，调度器在分配 GPU 前直接丢弃，僵尸浪费归零！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 柔性优雅降级 (Graceful Downgrade)：溢出流量自动切 `8B/32B-FP8` 备池</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">主池满载 155 RPS 时，将其余 158 RPS 自动降级至高吞吐小模型 + 裁剪 Top-K RAG，成功率 96.3%！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 2.2 倍突发洪峰（320 RPS 冲击 160 RPS 70B 主集群 · TTFT SLA ≤ 800ms）四档对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">过载保护与准入控制方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">达标有效吞吐</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">主池容量保活率</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">准入请求 P99 TTFT</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">僵尸请求算力浪费</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">洪峰用户成功率</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 无界 FIFO 队列 + 客户端超时盲目重试风暴</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">14.0 RPS ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">8.8% (雪崩!) ✕</text>
  <text x="790" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">18,400 ms ✕</text>
  <text x="960" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">68.5% ✕</text>
  <text x="1120" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">4.4% ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 静态固定 RPS 令牌桶限流 (不感知 Token 长度与 KV)</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">98.0 RPS</text>
  <text x="620" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">61.3%</text>
  <text x="790" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">2,450 ms ✕</text>
  <text x="960" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">18.0%</text>
  <text x="1120" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">30.6%</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 预测 TTFT + KV 85% 水位硬拒 (`HTTP 429` 早拒保主池)</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">152.0 RPS ✓</text>
  <text x="620" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">95.0% ✓</text>
  <text x="790" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">680 ms ✓</text>
  <text x="960" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.5% ✓</text>
  <text x="1120" y="612" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">47.5% (半数429)</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): 预测 TTFT 门控 + Deadline 清理 + 溢出自动降级 8B/32B 备池</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">308.0 RPS (22x)</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">96.3% ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">590 ms ✓</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.0% ✓</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">96.3% (零报错) ✓</text>
</svg>
