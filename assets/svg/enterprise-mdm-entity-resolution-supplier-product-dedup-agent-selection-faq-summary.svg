<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad428" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad428" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad428)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级主数据治理与实体消歧（MDM Entity Resolution）、混合分块与规格否决门禁 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">240万条跨14套ERP供应商/物料主数据 · 传统编辑距离+人工核对 vs. 纯向量余弦阈值自动合并 vs. 向量Top-10+单Prompt vs. 混合分块+规格属性剥离+税号/规格硬否决门禁</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">97.4% F1 · 0% 误合并</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 编辑距离规则 + 数据专员人工</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">漏掉跨语种缩写与同义词，一物多码泛滥</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 字面编辑距离认不出 IBM 与 Intl Bus Mach</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 240万条主数据清洗靠人工肉眼比对，月耗 $245K</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">实体消歧准确率(F1): 68.5% ✕</text>
  <text x="54" y="334" fill="#fde68a" font-size="13" font-weight="700">致命误合并率(False Merge): 1.4%</text>
  <text x="54" y="358" fill="#94a3b8" font-size="12.5">候选对剪枝率(Blocking): 95.0%</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月数据专员与算力总成本: $245,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：单一语言简单通讯录，无法治理集团多ERP</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 纯向量相似度 (&gt;=0.92) 自动合并</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">把 304 与 316L 螺栓合并成一物，污染库存</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• “M8x30 304螺栓”与“M8x30 316L螺栓”余弦达0.978</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 把母公司与海外独立法人合并，误合并率 13.6%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">实体消歧准确率(F1): 73.0% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">致命误合并率(False Merge): 13.6% (污染 ✕)</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">候选对剪枝率(Blocking): 98.0%</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月算力与主数据拆分返工费: $390,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁仅凭Embedding余弦相似度自动合并ERP主数据</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 向量 Top-10 召回 + 笼统 LLM 判别</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">能分清大部分同义词，但仍漏看细微牌号</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 未把材质牌号/公差/税号抽成强类型字段对比</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 仍有 4.2% 误合并（ERP 一旦合并极难回退）</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">实体消歧准确率(F1): 84.8%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">致命误合并率(False Merge): 4.2% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">候选对剪枝率(Blocking): 99.5%</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月数据专员与算力总成本: $128,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：推荐相似商品，不可直接触发ERP主数据合并</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad428)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 混合分块+规格剥离+否决铁闸 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">99.94% 剪枝 + 关键规格/税号一票否决</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• LLM 剥离 [材质牌号/螺纹/电压]，只要1项不等即否决</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 校验统一社会信用代码/DUNS/VAT + 字段级黄金存活</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">实体消歧准确率(F1): 97.4% 🏆 (+28.9pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">致命误合并率: 0.0% 🏆 (规格/税号硬否决)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">候选对剪枝率: 99.94% 🏆 (零O(N²)爆炸)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月MDM治理总成本: $34,000 (-86.1% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：SAP S/4HANA迁移、并购主数据整合、MRO物料清洗</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业主数据治理 (MDM) 架构师铁律（Hybrid Blocking + Spec-Inequality Veto Gate + Golden Survivorship）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 稠密向量余弦相似度高 != 物理上是同一个物料：必须先由 LLM 抽取出区分性工程规格（材质牌号 304 vs 316L、公差、电压），执行确定性“不等即一票否决”。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 法人供应商/客户合并必须校验税号（USCC/VAT/EIN）或邓白氏编码（DUNS/LEI），区分“母子公司层级关联”与“同一法人重复建档” · Provenance: synthetic + anonymized_reported</text>
</svg>
