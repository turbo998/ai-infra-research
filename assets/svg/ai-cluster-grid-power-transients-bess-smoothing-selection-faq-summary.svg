<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="6" rx="3" fill="url(#accent)"/>

  <!-- Header -->
  <text x="40" y="64" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 57 · AI CLUSTER SYNCHRONOUS POWER TRANSIENTS (dP/dt = 1,600 MW/s), SUPERCAP CBU &amp; BESS SMOOTHING</text>
  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">万卡集群同步功率阶跃 (dP/dt)、机柜超级电容 CBU 与园区 BESS 三级协同削峰选型一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 16,384-GPU H100/B200 Cluster (20.0 MW GEMM Peak ↔ 4.0 MW Barrier Trough in &lt;10 ms) · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <rect x="56" y="164" width="132" height="24" rx="6" fill="#7F1D1D"/>
  <text x="122" y="180" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 1 · 传统 UPS 裸跑</text>
  <text x="56" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">无缓冲直击变电站 (16MW/10ms)</text>
  <text x="56" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">同步训练锯齿波直穿交流 UPS</text>
  <text x="56" y="272" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 电网侧功率阶跃幅度: 80.0% ✕</text>
  <text x="56" y="298" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• UPS/断路器跳闸: 4.8 次/年 ✕</text>
  <text x="56" y="324" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 训练 MFU 算力损失: 0.0%</text>
  <text x="56" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 被迫搁浅配电容量: 35.0% ✕</text>
  <text x="56" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 年综合经济损失: $6.85M / yr ✕</text>
  <rect x="56" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="184" y="426" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⛔ 严禁用于 &gt;=1,024 卡同步训练</text>

  <!-- Tier 2 -->
  <rect x="346" y="148" width="288" height="310" rx="12" fill="#1F2437" stroke="#F97316" stroke-width="1.5"/>
  <rect x="362" y="164" width="144" height="24" rx="6" fill="#7C2D12"/>
  <text x="434" y="180" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 2 · 静态 500W 限频</text>
  <text x="362" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">一刀切 nvidia-smi -pl 500W</text>
  <text x="362" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">常驻降频削峰 + 崩溃依然掉底</text>
  <text x="362" y="272" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 电网侧功率阶跃幅度: 48.0% ✕</text>
  <text x="362" y="298" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• UPS/断路器跳闸: 1.5 次/年 ✕</text>
  <text x="362" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 训练 MFU 算力损失: -16.5% ✕</text>
  <text x="362" y="350" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 被迫搁浅配电容量: 20.0% ✕</text>
  <text x="362" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 年综合算力浪费: $8.40M / yr ✕</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 算力贬值比电费贵10倍，严禁常驻</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="152" height="24" rx="6" fill="#1E3A8A"/>
  <text x="744" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · 软件空转填谷</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Dummy GEMM 填谷 + 5s 慢爬坡</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">通信等待期启动假负载维持底噪</text>
  <text x="668" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 电网侧功率阶跃幅度: 12.5% ✅</text>
  <text x="668" y="298" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• UPS/断路器跳闸: 0.2 次/年 ✅</text>
  <text x="668" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 训练 MFU 算力损失: 0.0% ✅</text>
  <text x="668" y="350" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 被迫搁浅配电容量: 10.0%</text>
  <text x="668" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 年空转电费代价: $1.85M / yr ✅</text>
  <rect x="668" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 存量租赁机房零硬件改造应急首选</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="176" height="24" rx="6" fill="#065F46"/>
  <text x="1062" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · 三级软硬协同 (推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">固件斜率 + 超级电容 CBU + BESS</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">机柜母排就地充放循环 + 构网储能</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 电网侧功率阶跃幅度: 3.2% 🏆</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• UPS/断路器跳闸: 0.0 次/年 🏆</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 训练 MFU 算力损失: 0.0% 🏆</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 搁浅电力降至 2.0% (+33% 扩容) 🏆</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 折旧成本: $0.65M/yr (省 $6.20M) 🏆</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 10MW~500MW 现代智算中心黄金标准</text>

  <!-- Bottom Visual Pipeline: 3-Time-Scale Energy Buffering -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">⚡ 三级时间尺度解耦能量缓冲原理（Time-Scale Decoupled Energy Buffering）与量化收益</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="356" height="164" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="82" y="562" fill="#FCD34D" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 微秒至毫秒层 (0 ~ 10 ms)：GPU 固件 Power Brake</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 拦截对象：Tensor Core 启动/停止瞬间的极端 di/dt 尖峰</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 核心机制：VBIOS/NVML 斜率限制器在 5~15ms 内平滑拉升</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  频率与电压，配合板载高分子电容吸收微秒级毛刺</text>
  <text x="82" y="668" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 消除 PSU 电源模块微秒级过流保护误触发</text>

  <!-- Step 2 -->
  <rect x="442" y="534" width="386" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="460" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 毫秒至秒层 (10 ms ~ 5 s)：机柜 ORv3 超级电容 CBU</text>
  <text x="460" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 拦截对象：350ms GEMM 波峰 ↔ 100ms AllReduce 通信波谷</text>
  <text x="460" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 核心机制：54V/400V 直流母排超级电容 (&gt;100万次寿命) 波峰</text>
  <text x="460" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  就地放电补足 +3.2MW，波谷就地回充，零废热空转电费！</text>
  <text x="460" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 步级锯齿波机柜内闭环抵消 (电网波动压至 3.2%)</text>

  <!-- Step 3 -->
  <rect x="850" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="868" y="562" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 秒至分钟层 (5 s ~ 15 min)：园区构网型 BESS 储能</text>
  <text x="868" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 拦截对象：整群万卡作业启停、长 Checkpoint 与市电切换</text>
  <text x="868" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 核心机制：MWh 级磷酸铁锂阵列按 &lt;2% MW/min 电网合规</text>
  <text x="868" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  斜率平滑移交负荷，将搁浅电力缓冲从 35% 压缩至 2%</text>
  <text x="868" y="668" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 同一变电站多装 +33% GPU 算力，年省 $6.20M</text>
</svg>
