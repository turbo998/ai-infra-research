  <text x="418" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="800">AI 智算集群交付验收 (Day-0 Burn-In) 与慢节点二分定位选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="14">杜绝“单机绿灯、合体崩盘”！48h 700W 方波热冲击烤机清零 99.2% 早夭隐患；滑窗二分 + 90s 作业前门禁将排障从 18.5h 压至 1.2 分钟</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc51)"/>

  <!-- Tier 1 -->
