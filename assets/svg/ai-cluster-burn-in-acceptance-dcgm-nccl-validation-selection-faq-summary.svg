  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">漏检 78% 早夭隐性炸弹</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">查卡数 + 5 分钟单卡短测 + 人工查日志</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制缺陷：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">水温未升、光模块未压测；50 个隐患</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">流入生产，1 张慢卡拖慢全集群 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 隐患检出率: <tspan fill="#f87171" font-weight="700">仅 22.0% ✕</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 慢节点定位: <tspan fill="#f87171" font-weight="700">1,110 分钟 (18.5h) ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首月崩溃/MFU: <tspan fill="#f87171" font-weight="700">14.2 次 / 34.8% ✕</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首月空转浪费: <tspan fill="#f87171" font-weight="700">$412,000 / 月 ✕</tspan></text>
