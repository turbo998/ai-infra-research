  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">99.2% 检出 + 1.2m 自愈</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">SuperBench 热冲击 + Pre-Flight 自动换机</text>

