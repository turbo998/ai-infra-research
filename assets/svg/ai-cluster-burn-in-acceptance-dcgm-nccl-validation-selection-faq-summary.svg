  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">20 分钟未达液冷二次侧热平衡！</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 隐患检出率: <tspan fill="#fbbf24" font-weight="700">58.5%</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 慢节点定位: <tspan fill="#fbbf24" font-weight="700">252.0 分钟 (4.2h)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首月崩溃/MFU: <tspan fill="#fbbf24" font-weight="700">6.4 次 / 44.5%</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首月空转浪费: <tspan fill="#fbbf24" font-weight="700">$185,000 / 月</tspan></text>
