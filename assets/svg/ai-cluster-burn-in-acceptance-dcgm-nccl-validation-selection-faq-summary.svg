  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (排障提速 246x)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">(2i,2i+1) 与 (2i+1,2i+2) 双轮交集</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">90s 抓单机；log2(128)=7 步抓交换机</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 隐患检出率: <tspan fill="#38bdf8" font-weight="800">86.0% ✅</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 慢节点定位: <tspan fill="#38bdf8" font-weight="800">4.5 分钟 (快 246x ✅)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首月崩溃/MFU: <tspan fill="#38bdf8" font-weight="700">1.8 次 / 52.4% ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首月空转浪费: <tspan fill="#38bdf8" font-weight="700">$54,000 / 月 ✅</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 线上慢节点排障与网络验收标配</text>

