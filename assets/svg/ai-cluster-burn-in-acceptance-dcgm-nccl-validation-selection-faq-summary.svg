  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">48h 700W 方波脉冲逼出冷板气泡与</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">SDC；每次作业前 90s 门禁自动换热备</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 隐患检出率: <tspan fill="#34d399" font-weight="800">99.2% (交付前清零 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 慢节点自愈: <tspan fill="#34d399" font-weight="800">1.2 分钟自动换机 🏆</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首月崩溃/MFU: <tspan fill="#34d399" font-weight="800">0.2 次 / 58.6% 🏆</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 首月净省费用: <tspan fill="#34d399" font-weight="800">省 $388,000 / 月 🏆</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 千卡/万卡智算中心验收终极标准</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么烤机必须用“700W 方波脉冲”？错位滑窗法如何用 90 秒抓出 1,024 卡里的唯一慢节点？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：48h 700W 方波热冲击 + 光模块 Pre-FEC BER &lt; 1e-7 门禁</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 液冷回路达热平衡需 1~2 小时，短测根本测不出冷板硅脂气泡导致的热降频；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 30s 700W 满载 ↔ 5s 100W 空载的方波脉冲制造剧烈 dI/dt 电压下陷，配合确定性</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  Checksum 比对，在签付尾款前将静默算错 (SDC) 与脏光模块 99.2% 揪出！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：错位滑窗交集定理 (90s) + Slurm/K8s 作业前自动换机</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 第一轮并发测 (N0,N1), (N2,N3)... 第二轮错开 1 位并发测 (N1,N2), (N3,N4)...；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 若两轮中含 N73 的配对均变慢，交集直接锁定 N73 为真凶（仅需 2 轮 = 90 秒）！</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 将该微体检嵌入每次训练启动前 Prolog，1.2 分钟自动隔离坏机并切入热备节点！</text>
</svg>
