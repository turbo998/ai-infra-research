  <rect x="52" y="44" width="450" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="277" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 366 · HYBRID CLOUD &amp; REGULATED ENTERPRISE AI LANDING ZONE</text>
  <text x="518" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="23.5" font-weight="800">金融政企私有化与混合云大模型落地架构：100% 本地孤岛 vs. 云专线 ZDR vs. 混合脱敏分级路由</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">强监管企业 (月耗 15B Tokens，28% 含 L3/L4 敏感 PII/机密)：为什么 100% 本地自建耗时 20 周且月烧 $58.5K，而“本地小集群 + 可逆脱敏 + 云端 ZDR”省钱 66.2% ($19.8K/月)？</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc366)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="236" height="24" rx="6" fill="#7f1d1d"/>
  <text x="186" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 公网裸调标准 SaaS API</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">28% 敏感外泄 · 审计一票否决</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">公网出境 + 默认保留 30 天滥用监控日志</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么不能直接调默认公网 API？</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">未申请 ZDR 豁免时，厂商默认缓存 Prompt</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">30 天且走公网传输，违反金融/医疗红线 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 敏感数据违例率: <tspan fill="#f87171" font-weight="700">28.0% 触发合规红线 ✕</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 复杂推理质量分: <tspan fill="#34d399" font-weight="700">94.5% (旗舰模型)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 投产交付周期: <tspan fill="#94a3b8" font-weight="700">1 周 (但无法过安审 ✕)</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度综合总成本: <tspan fill="#f87171" font-weight="700">$42,000 / 月</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁将企业明文 PII 发往默认公网 API</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="236" height="24" rx="6" fill="#78350f"/>
  <text x="486" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 100% 本地机房全自建孤岛</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">20 周交付滞后 · 杀鸡全用牛刀</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">连 72% 普通写代码/公开翻译也买本地卡跑</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">“一刀切全本地化”的三大内伤：</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">机房改造+买 4 台 8 卡服务器耗资 $1.4M，</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">且与云端前沿推理模型脱节 (质量 81.2%)</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 敏感数据违例率: <tspan fill="#34d399" font-weight="700">0.0% (物理不出机房)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 复杂推理质量分: <tspan fill="#f87171" font-weight="700">81.2% (受限于本地规模 ✕)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 投产交付周期: <tspan fill="#f87171" font-weight="700">20 周 (硬件采购与机房供电 ✕)</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度综合总成本: <tspan fill="#f87171" font-weight="700">$58,500 / 月 (摊销最贵 ✕)</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 仅限完全断网涉密内网，商业企业勿照搬</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="236" height="24" rx="6" fill="#0c4a6e"/>
  <text x="786" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · 云专线 Private Link + ZDR + CMK</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">2 周合规投产 · 零日志留存</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">ExpressRoute + 私有端点 + 豁免滥用落盘</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">云安全着陆区三大合规支柱：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">流量 100% 走内网专线、签署 ZDR (零落盘</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">零人工审查) + HSM 客户自管密钥 CMK ✅</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 敏感数据违例率: <tspan fill="#38bdf8" font-weight="800">0.2% (仅极少数 L4 禁上云 ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 复杂推理质量分: <tspan fill="#38bdf8" font-weight="800">94.8% (满血云端旗舰 ✅)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 投产交付周期: <tspan fill="#38bdf8" font-weight="800">2.0 周 (极速合规上线 ✅)</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度综合总成本: <tspan fill="#38bdf8" font-weight="800">$24,200 / 月 (-58.6% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 90% 跨国企业与现代金融机构首选</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 混合云数据分级 + 可逆脱敏路由</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">0% 外泄 · 质量 96.2% · 省 66.2%</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">本地精简集群(L4) + 可逆脱敏(L3) + 云ZDR(L1/2)</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">混合云终局架构 (立省 $38.7K/月)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">本地只买 1 台机器处理 28% 核心机密；</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">其余经 Presidio 假名化脱敏后调云端旗舰 🏆</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 敏感数据违例率: <tspan fill="#34d399" font-weight="800">0.0% (明文 PII 100% 留本地 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 复杂推理质量分: <tspan fill="#34d399" font-weight="800">96.2% (+15.0 pts 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 投产交付周期: <tspan fill="#34d399" font-weight="800">3.0 周 (快 6.67 倍 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度综合总成本: <tspan fill="#34d399" font-weight="800">$19,800 / 月 (-66.2% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 银行/医疗/央国企混合云黄金架构</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：强监管企业如何通过“L1–L4 数据分级路由 + 可逆假名化脱敏金库”同时拿下合规与性价比？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔐 机制 1：可逆假名化脱敏金库 (Reversible PII Pseudonymization Vault)</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 本地网关用 `Presidio / 小模型 NER` 在 6ms 内将“客户张三、卡号 6222...”替换为</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  占位符 `&lt;PER_01&gt;`、`&lt;CARD_01&gt;`，映射表 100% 锁在企业内网 Redis 金库中；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 云端大模型对脱敏文本完成高质量逻辑推理后，本地网关在返回前端前自动还原真实姓名！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🏛️ 机制 2：企业数据四级分类路由法则（只为 28% 敏感流量买本地卡）</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• **L1/L2 (公开/内部通用，占 72%：写代码、翻译、公开研报)** $\rightarrow$ 直走云专线 Private Link + ZDR；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• **L3 (含客户 PII 的复杂合同/工单，占 18%)** $\rightarrow$ 本地可逆脱敏去除 PII 后走云专线 ZDR 旗舰模型；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• **L4 (核心机密账本/未公开财报，占 10%)** $\rightarrow$ 100% 路由至本地机房 `Qwen-72B / DeepSeek` 集群 🏆！</text>
</svg>
