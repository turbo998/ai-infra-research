  <title id="title">AI Infra Research Phase 183 (2026-11-05) — Executive Visual Summary Card</title>
  <desc id="desc">One-page blueprint visual summary of Phase 183 (Priority 192): 32 primary upstream commits across 16 repositories, covering FlashInfer CuTe KDA 2-Slot Double-Buffered update_ready (309/309 GB300), Cake SM120 Block-64 VSA Sparse Attention (1.084x geomean, up to 1.263x / 1.229x), SM107a Grouped FP8 BLOCK_N=256 (1.114x), 216-SM K1 Wgrad (2.23x), Plain FP32 SIMT Router Backward (3.05x vs comp / 5.37x vs det), SM103a H2048 Det-Pair Cap (0.9454x budget), FlashAttention-4 Dense 2CTA In-Kernel MQA Head Padding (2.047x prefill / 1.539x decode), Triton Gluon FP6 Shared Tiles (-25.0% BW vs FP8), ROCm AITER FlyDSL DeepSeek-V4.1 Route -1 Pad Drop (420.0 tok/s/GPU, 0 faults) &amp; 3D Split-KV Padding Stat Mask (0.0 drift), TensorRT-LLM CP Single-Rank Bypass &amp; 64-Bit Causal Conv1d Offsets, vLLM EPLB-Aware EP Weight Filter (-72.67% load, 384.9 -&gt; 105.2 GiB/rank) &amp; Zero-Reparse run-batch JSON (6.398x event loop, -18.0% H100 wall time), SGLang Qwen3 Contiguous QK-Norm+RoPE &amp; Bulk DFlash Prep (-0.4 ms/step), NVIDIA Dynamo 2,048-Worker Retained Router Rows (+39.6% rps, 1,316.2x faster p99 admission), Megatron-LM Batch-Invariant Triton Sigmoid Router (0 ULP, -0.62 ms/step) &amp; DCP V2 Hybrid Propagation, TransformerEngine NVFP4 4-over-6 Factorized-Reciprocal Kernel (2.50x B200), PyTorch Raw-Philox Exponential Tails (0.99x at p=1e-8) &amp; Deterministic Bilinear2d Gather Backward (85.44x vs det / 14.19x vs atomic), RCCL gfx1250 TDM/LL128 AllGather, Mooncake Shared io_uring Cloned Fixed Buffers (4.773x cold SSD read, 21 GB/s), LMCache Single-Copy TP8 KV Dedup (8.0x), and NIXL Vectorized Descriptor Merge (2.512x x86, -36.30% DSv4 ISL=100k).</desc>
