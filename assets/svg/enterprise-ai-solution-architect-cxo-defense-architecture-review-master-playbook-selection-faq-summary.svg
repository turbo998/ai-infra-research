<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">第 490 篇里程碑：云与 AI 解决方案架构师 (SA) 高管答辩与架构评审通关宝典 (#490)</text>
  <text x="28" y="58" class="sub">面对客户 CTO/CFO 灵魂发难的“30秒定量应答模板”：涵盖推理并行 · 智算网络 · 三道水位线算卡 · 平台 TCO 四大支柱</text>

  <!-- Top Left: Pillar 1 & Pillar 2 Executive Defense -->
  <rect x="24" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">支柱一 &amp; 二：推理性能、并行切分与智算网络高管答辩速查</text>

  <rect x="42" y="118" width="532" height="104" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="54" y="140" class="txt" font-weight="700" fill="#38bdf8">Q: 为什么要搞复杂的 PD 分离？单机混部 Chunked Prefill 不够吗？</text>
  <text x="54" y="162" class="mono">• 30秒应答: 短文本 (&lt;=2K) 混部足够；但长文本 (&gt;=4K) Prefill 算力密集</text>
  <text x="54" y="182" class="mono">  会周期性打断 Decode，使 P99 TPOT 劣化 3x+。在 &gt;=100G RDMA 上做</text>
  <text x="54" y="202" class="mono">  PD 分离可让 P/D 各自采用最优切分 (如 P用TP8、D用DP+EP)，Goodput 翻 3.1x！</text>

  <rect x="42" y="232" width="532" height="100" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="54" y="254" class="txt" font-weight="700" fill="#34d399">Q: 为什么不能省钱买 25G 普通以太网，或者无脑全买最贵的 InfiniBand？</text>
  <text x="54" y="276" class="mono">• 30秒应答: 25G TCP 传 32K KV 耗 1.2s 直接废掉跨机扩展；但百卡至千卡推理</text>
  <text x="54" y="296" class="mono">  用调优后的 8-Rail 400G RoCEv2 (PFC+ECN+DLB+PXN+铜缆/LPO) 即可跑出</text>
  <text x="54" y="316" class="mono">  95.2% 线速 (47.6 GB/s)，网络 CapEx 比专有 IB 省 38%！</text>

  <!-- Top Right: Pillar 3 & Pillar 4 Executive Defense -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">支柱三 &amp; 四：容量算卡、TPM/PTU 换算与平台 TCO 高管答辩速查</text>

  <rect x="626" y="118" width="532" height="104" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fde68a">Q: DeepSeek 671B FP8 才 671GB，为什么 5 张 141GB H200 (705GB) 跑不起来？</text>
  <text x="638" y="162" class="mono">• 30秒应答: 算卡必须过三道水位线！① 显存要扣 15% 安全水位 (剩 599GB)</text>
  <text x="638" y="182" class="mono">  且需加 14B MTP 头 (685GB) + KV 池；② TP 必须对齐 2 的幂次与 8 卡</text>
  <text x="638" y="202" class="mono">  NVLink 域。故最低基线是 1 台 8x H200 (1,128GB) 或 4x MI325X (1,024GB)！</text>

  <rect x="626" y="232" width="532" height="100" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="638" y="254" class="txt" font-weight="700" fill="#d8b4fe">Q: CFO 问到底该用公有云 PAYGO、买预留 PTU，还是自己建 K8s GPU 集群？</text>
  <text x="638" y="276" class="mono">• 30秒应答: 取决于全天平均利用率与 2.5 FTE SRE 人力成本 ($52.5万/年)：</text>
  <text x="638" y="296" class="mono">  &lt;28% 用 PAYGO；28%~58% 用 PTU 保底 + PAYGO 溢出；只有 &gt;=16 张卡</text>
  <text x="638" y="316" class="mono">  且综合利用率 &gt;=58% (配合夜间潮汐跑批/蒸馏) 自建 K8s 才真正省 45%+！</text>

  <!-- Bottom Panel: The 4-Step SA Sizing & Defense Workflow -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">白板立项终极四步推演法：10 分钟在客户白板上从业务 QPS 推导出完整硬件 BOM 与三年 TCO</text>

  <rect x="42" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">第 1 步：定场景 SLA 与峰值并发</text>
  <text x="56" y="464" class="mono">• 明确场景 (语音&lt;250ms / 对话</text>
  <text x="56" y="484" class="mono">  TTFT&lt;800ms, TPOT&lt;20ms)</text>
  <text x="56" y="504" class="mono">• E2EL = TTFT + (S_out-1)*TPOT</text>
  <text x="56" y="524" class="mono">• B_active = RPS_peak * E2EL</text>
  <text x="56" y="548" class="txt" fill="#6ee7b7">三档思考路由砍掉 81% 过度思考！</text>

  <rect x="328" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="342" y="440" class="txt" font-weight="700" fill="#34d399">第 2 步：过三道水位线算 GPU</text>
  <text x="342" y="464" class="mono">• N_mem: 权重+MTP+KV &lt;= 85% HBM</text>
  <text x="342" y="484" class="mono">• N_bw:  (W_act+KV)/TPOT &lt;= BW</text>
  <text x="342" y="504" class="mono">• N_cmp: Prefill FLOPs &lt;= TFLOPS</text>
  <text x="342" y="524" class="mono">• 卫星小模型切 1g.18gb MIG</text>
  <text x="342" y="548" class="txt" fill="#34d399">N_GPU = max(N_mem, N_bw, N_cmp)</text>

  <rect x="614" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="628" y="440" class="txt" font-weight="700" fill="#fde68a">第 3 步：配并行、网络与存储</text>
  <text x="628" y="464" class="mono">• 机内 NVLink 跑 TP / Ulysses</text>
  <text x="628" y="484" class="mono">• 跨机 400G RDMA 跑 DP+EP / PD</text>
  <text x="628" y="504" class="mono">• 交换机: Leaf=P/32, Spine=P/64</text>
  <text x="628" y="524" class="mono">• 存储: 超融合 3FS + L2 DRAM KV</text>
  <text x="628" y="548" class="txt" fill="#fde68a">&gt;45kW/柜强制配冷板液冷 (PUE 1.13)</text>

  <rect x="900" y="414" width="258" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="914" y="440" class="txt" font-weight="700" fill="#d8b4fe">第 4 步：算高可用、安全与 TCO</text>
  <text x="914" y="464" class="mono">• 60/60 跨区双活 + PAYGO 溢出</text>
  <text x="914" y="484" class="mono">• 投机双流护栏 (+0.8ms TTFT)</text>
  <text x="914" y="504" class="mono">• 夜间训推潮汐 + 671B-&gt;32B 蒸馏</text>
  <text x="914" y="524" class="mono">• 72h 五道验收门禁签字上线</text>
  <text x="914" y="548" class="txt" fill="#d8b4fe">综合 Goodput 99.6% | 省 65%+ TCO 🏆</text>
</svg>
