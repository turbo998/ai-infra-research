  <rect width="1200" height="680" fill="url(#bgGrad390)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级知识库实时同步 (Real-Time RAG) 与 CDC 增量向量入库架构选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：流式 CDC + 段落 SHA-256 哈希去重 + 权限零重算原地更新 + 原子版本号墓碑，将新鲜度从 14 小时压至 0.8s 且月省 93.7%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 390 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 每晚定时全量重建索引</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 每天凌晨全量重算 500 万条切片向量</text>
  <text x="40" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 数据与权限延迟：50,400s (14小时) ✕</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 重复 Embedding 算力浪费：98.5% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 幽灵旧切片残留率：8.4% ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 上午撤回权限，员工晚上还能搜出来！</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">月入库成本：$29,500 / 月 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：价格/库存/政策改了半天 AI 不知道</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">且 98.5% 没改过的段落每天重复烧钱算向量</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 业务代码同步双写</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 保存文档时同步调 Embedding + 写向量库</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 改 1 个错别字也重算整篇 150 个切片</text>
  <text x="332" y="212" fill="#34d399" font-size="12" font-weight="700">• 数据新鲜度延迟：3.5 秒</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 幽灵脏切片残留率：6.2% ✕ (双写不一致)</text>
  <text x="332" y="252" fill="#fde68a" font-size="12">• 重复 Embedding 浪费：84.0% ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">月入库成本：$11,800 (脏数据幻觉)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">大坑：网络抖动或乱序重试导致旧版本切片</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">残留在向量库，新旧两版价格同时被召回！</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: CDC + 段落 SHA-256 去重</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• Debezium / Webhook -&gt; Kafka 异步流</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 比对段落 SHA-256，只重算改动的 1 段</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 数据新鲜度延迟：12.0 秒 ✅</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 重复 Embedding 浪费：仅 3.2% ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 幽灵脏切片残留率：0.4%</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">月入库成本：$2,400 (省 91.9%) ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：通用企业知识库增量同步主力</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">通过解耦业务写库与向量计算保证高可用</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: CDC+哈希+原子墓碑+热池🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 段落哈希 Diff + 权限原地 Patch (零重算)</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 原子 doc_version 切换 + 墓碑过滤</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 数据与权限新鲜度：0.8 秒 🏆 (快63,000x)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 幽灵脏切片残留率：0.0% 🏆</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• 重复 Embedding 浪费：0.0% 🏆</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">月入库成本：$1,850 (省 93.7%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：金融风控、实时电商与敏态协作终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">文档改完 0.8s 全网生效，撤权限 150ms 熔断</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么企业 RAG 用了三个月就会变成“新旧矛盾的垃圾场”？架构师必懂的三大增量治理机制</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad390)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 段落级 SHA-256 哈希去重（省掉 96.8% 重算）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 一份 100 页产品手册改了第 32 页的 1 个价格数字：</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 切块后计算每块 `SHA-256(normalized_text)` 与状态库比对，</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  299 个未变块直接复用旧向量，仅对改动的 1 块调 Embedding！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 既省下 96.8% 算力，又消除了向量库大规模重写 Compaction 风暴。</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 消灭“幽灵脏切片”：原子版本号与墓碑过滤</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 如果文档从 20 个切片删减成 15 个切片，仅按 `chunk_idx` 覆盖</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  会导致第 16~20 号旧切片永远残留在库里（幽灵切片）！</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 正确做法：写入新版本 `doc_ver=102` 全部切片后，原子更新</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  指针表并将 `doc_ver &lt; 102` 标记墓碑位图，旧切片 0.0% 残留！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 权限变更与内容变更物理分离（150ms 撤权）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 管理员在 SharePoint 修改文件夹访问权限时，文档正文根本没变！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 严禁因为改了权限就重跑文档解析与 Embedding；</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  直接走 Metadata-Only 快速通道，原地更新向量库的 `acl_bitmap`，</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  实现 150ms 权限实时吊销且消耗 0 个 Embedding Token！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 390 合成标定算例 (independently_reproduced=false)</text>
</svg>
