<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#566 大模型“三道水位线”GPU 容量手算、TPM/TPS/PTU &amp; Little's Law 换算与五大场景 SLA 评估体系</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">N_GPU = max(①显存容量, ②HBM带宽最低TPOT, ③Little's Law并发算力) · 区分单流 1/TPOT 与系统总 TPS · 帕累托 Goodput 拐点省 40% GPU</text>

  <!-- Box 1: Three Watermarks Formula -->
  <rect x="24" y="110" width="352" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① 三道水位线手算公式 (取三者 max)</text>
  <rect x="42" y="152" width="316" height="66" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="52" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">水位线 1 (显存容量 N_mem · 装得下)：</text>
  <text x="52" y="191" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">M_tot = M_wt + B_act×(S_in+S_out)×KV + 15%</text>
  <text x="52" y="209" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="11">GQA-8 FP8=163.8KB/词 · MLA FP8=35.1KB/词</text>

  <rect x="42" y="226" width="316" height="66" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="52" y="246" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">水位线 2 (HBM 带宽 N_bw · 吐字快)：</text>
  <text x="52" y="265" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">TPOT_min ≈ (M_wt_act + M_kv) / (N × BW_eff)</text>
  <text x="52" y="283" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">H200 (4.8TB/s)=11.8ms ✓ vs L40S GDDR6=34ms ✕</text>

  <rect x="42" y="300" width="316" height="68" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="320" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">水位线 3 (Little's Law 并发与算力 N_comp)：</text>
  <text x="52" y="339" fill="#ecfdf5" font-family="Consolas, monospace" font-size="11.5">E2EL = TTFT + (S_out-1)×TPOT | B_act = QPS×E2EL</text>
  <text x="52" y="357" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11">长思维链 S_out 翻 8 倍 → 在途并发 B_act 暴涨 8 倍!</text>

  <!-- Box 2: QPS -> TPS -> TPM -> PTU -->
  <rect x="392" y="110" width="346" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="410" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② QPS → TPS → TPM → 云端 PTU 精确换算</text>
  <rect x="410" y="152" width="310" height="66" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="422" y="172" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">严禁混淆两种 TPS 口径：</text>
  <text x="422" y="191" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">• 单用户流式 TPS = 1000 / TPOT_ms (如 62.5 词/s)</text>
  <text x="422" y="208" fill="#34d399" font-family="Consolas, monospace" font-size="11.5">• 集群系统总 TPS = QPS × (S_in + S_out)</text>

  <rect x="410" y="226" width="310" height="66" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="422" y="246" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">Input TPM vs. Output TPM 加权折算：</text>
  <text x="422" y="265" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">TPM_in = 60×QPS×S_in | TPM_out = 60×QPS×S_out</text>
  <text x="422" y="282" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="11">云端 PTU 折算：1 Output Token ≈ 4~5 Input Tokens</text>

  <rect x="410" y="300" width="310" height="68" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="422" y="320" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">30 QPS (8K In / 512 Out) 算卡实例：</text>
  <text x="422" y="339" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 只看权重显存误配 2 卡 → 队列雪崩 Goodput 18.5% ✕</text>
  <text x="422" y="357" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 三道水位线 + PD/MTP 精准配 12 张 H200 (99.2% ✓)</text>

  <!-- Box 3: Core Evaluation Metrics & 5 Scenarios -->
  <rect x="754" y="110" width="302" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="772" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ 核心评估指标与五大场景 SLA</text>
  <rect x="772" y="152" width="266" height="92" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="784" y="172" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">五大核心指标关系：</text>
  <text x="784" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• TTFT：首字延迟 (Prefill 算力+排队)</text>
  <text x="784" y="207" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• TPOT vs P99 ITL：均值 vs 单步卡顿毛刺</text>
  <text x="784" y="224" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• Goodput：同时满足 TTFT+ITL 的有效吞吐</text>

  <rect x="772" y="252" width="266" height="116" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="784" y="272" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">五大业务场景黄金 SLA 基准：</text>
  <text x="784" y="290" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11">1. 实时语音：TTFT≤250ms, P99 ITL≤18ms</text>
  <text x="784" y="307" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11">2. 代码补全 FIM：TTFT≤150ms, E2EL≤350ms</text>
  <text x="784" y="324" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11">3. 企业对话 RAG：TTFT≤800ms, TPOT≤25ms</text>
  <text x="784" y="341" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11">4. 深度推理 CoT：TTFT≤1.5s, TPOT≤15ms</text>
  <text x="784" y="358" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="11">5. 离线批处理：拉满 Batch 追求 $/1M 最低</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 为什么严禁用“无约束峰值 Raw TPS”做容量规划？（帕累托 Goodput 铁律）：</text>
  <text x="44" y="452" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 当单卡并发强行拉到 B=256 时，虽然表面 Raw TPS 涨了 18%，但 P99 ITL 恶化至 86ms，符合 SLA 的有效 Goodput 暴跌至 24.5%！</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• 必须锁定帕累托甜点拐点 (B=32~48)：单卡达标 Goodput 高达 1,850 tok/s (99.2% 达标率)，有效百万词成本从 $0.410 降至 $0.098 (省 4.18x)！</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 云端 PTU 混合定容铁律：按 P75~P80 稳态水位购买预留 PTU（吃满 70% 前缀缓存抵扣），剩余 P20 尖峰自动溢出至 Serverless PAYGO。</text>
</svg>
