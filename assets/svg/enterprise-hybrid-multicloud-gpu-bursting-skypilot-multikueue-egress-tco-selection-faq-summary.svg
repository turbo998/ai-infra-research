<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业混合云与多云算力弹性溢出 (SkyPilot / Kueue MultiKueue &amp; Egress 防坑) 选型 (#487)</text>
  <text x="28" y="58" class="sub">终结“自建机房按大促峰值买 128 卡闲置 78% 时间”与“跨公网传 KV/拉模型月烧 $4.85万 出口流量费”：P80 基荷 + 整包跨云溢出省 57.1%</text>

  <!-- Left Panel: Why Cross-WAN PD & Remote Storage Pull Fail -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么跨云弹性绝不能拆跨网 PD 分离，也不能每次扩容从本地机房拉 685GB 权重？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 混合云两大天价踩坑：跨广域网 (WAN) 传 KV 张量 &amp; 云出口流量税 (Egress Tax)</text>
  <text x="56" y="164" class="mono">• 踩坑 1: 本地机房做 Prefill、公有云做 Decode -&gt; 每请求传 1.2GB KV 走专线，</text>
  <text x="56" y="184" class="mono">  不仅延迟暴涨 +940ms，每月数百 TB 跨云流量产生 $48,500 出口流量账单！</text>
  <text x="56" y="202" class="mono">• 踩坑 2: 每次云端扩容从主云 S3 跨云拉取 685GB 权重 ($0.09/GB = $61/次)！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 架构师解法：本地 P80 基荷 (48卡) + 整包请求跨云溢出 + 零出口费预置镜像 (🏆)</text>
  <text x="56" y="268" class="mono">• 1) 只传 KB 级纯文本 JSON：每个完整请求 (Prefill+Decode) 整包路由至同一云</text>
  <text x="56" y="288" class="mono">     端副本内闭环完成，跨云网络仅传 15KB 文本 (出口流量费从 $4.85万 降至 $420)！</text>
  <text x="56" y="308" class="mono">• 2) 采用 Cloudflare R2 (零出口费) 或各云同区 VPC 对象存储预置加密模型权重！</text>

  <!-- Right Panel: 4 Hybrid / Multi-Cloud Bursting Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种混合云/多云算力弹性架构定量对标 (峰值 128 卡需求)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 100% 本地自建按峰值买卡 (常驻 128 卡，全年 78% 时间闲置)</text>
  <text x="638" y="158" class="mono">• 本地常驻: 128卡 ✕ | 月流量费: $0 | 跨网延迟: 0ms | 年总TCO: $2.765M ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 跨广域网硬拆 PD 分离 / 远端拉取存储 (WAN 传 KV 张量)</text>
  <text x="638" y="214" class="mono">• 本地常驻: 64卡 | 月流量费: $48,500 ✕ | 跨网延迟: +940ms ✕ | 年TCO: $2.180M</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 单云弹性扩容 + 每次冷启动跨云拉取 685GB 权重</text>
  <text x="638" y="270" class="mono">• 本地常驻: 48卡 ✓ | 月流量费: $14,200 | 跨网延迟: +38ms | 年TCO: $1.490M</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 本地 P80 (48卡) + SkyPilot/MultiKueue 整包跨云溢出 (推荐 🏆)</text>
  <text x="638" y="326" class="mono">• 本地常驻: 48卡 🏆 | 月流量费: $420 🏆 | 延迟: +14ms 🏆 | 年TCO: $1.185M (-57%)</text>

  <!-- Bottom Panel: MultiKueue / SkyPilot Architecture & Egress Math -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 混合云黄金边界公式：什么流量能跨云？什么张量绝不能出机房？</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: 文本 JSON vs. 激活/KV 张量体积比</text>
  <text x="58" y="464" class="mono">• 4,096 Token 纯文本请求 = 仅 16 KB (UTF-8)！</text>
  <text x="58" y="484" class="mono">• 4,096 Token 的 70B KV Cache = 671,088 KB</text>
  <text x="58" y="504" class="mono">  (671 MB，是纯文本体积的 41,943 倍！)</text>
  <text x="58" y="526" class="txt" fill="#6ee7b7">铁律：跨机房/跨云边界永远只传纯文本 JSON 或</text>
  <text x="58" y="546" class="txt" fill="#6ee7b7">Token ID，严禁跨广域网传输 KV Cache 或 TP/PP！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: SkyPilot / MultiKueue 跨云寻卡防售罄</text>
  <text x="436" y="464" class="mono">• 单一云 Region 突发求购 80 张 H200 满足率</text>
  <text x="436" y="484" class="mono">  仅 ~55%；但通过 SkyPilot / MultiKueue 同时</text>
  <text x="436" y="504" class="mono">  跨 3 家云 / 6 个可用区自动比价寻卡：</text>
  <text x="436" y="524" class="mono">  P_fulfilled = 1 - (1 - 0.55)^6 = 99.17%！</text>
  <text x="436" y="548" class="txt" fill="#34d399">自动挑最便宜的 Spot/按需池拉起无状态推理副本！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: RAG 跨云溢出的“本地检索 + 云端生成”</text>
  <text x="814" y="464" class="mono">• 企业 10TB 向量知识库驻留在本地内网不搬迁；</text>
  <text x="814" y="484" class="mono">• 当触发跨云推理溢出时：本地先在 15ms 内完成</text>
  <text x="814" y="504" class="mono">  向量召回 + L40S Reranker 浓缩为 Top-5 (仅 10KB</text>
  <text x="814" y="524" class="mono">  文本)，再经 WireGuard/IPsec 专线发往云端</text>
  <text x="814" y="544" class="mono">  GPU 生成回答，兼顾零数据外迁与零流量税！</text>
</svg>
