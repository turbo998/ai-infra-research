<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#527 企业长事务多智能体持久化编排 (`Temporal + LangGraph Checkpoint + HITL`) 选型指南</text>
  <text x="30" y="60" class="sub">终结“第 18 步断连从第 1 步重算 (44% 算力浪费 + 8.4% 重复扣款)” · 步级持久化断点续跑 + 零成本审批休眠省 50% GPU</text>

  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么内存态 `while` 循环跑不稳 20 步企业级 Agent 工作流？</text>
  <text x="48" y="132" class="txt bad">• 痛点 1 (崩溃全丢与重复副作用): 内存态 Agent 在第 18 步遇到 API 超时或</text>
  <text x="64" y="150" class="txt bad">Pod 重启时，前 17 步全丢被迫从头重跑 (浪费 44% Token)，且导致 8.4% 重复下单/发信 ✕</text>
  <text x="48" y="174" class="txt bad">• 痛点 2 (人工审批 HITL 霸占线程与显存): 等主管点击同意 (耗时数小时) 期间挂着连接</text>
  <text x="48" y="198" class="txt good">• 持久化状态机架构 (Temporal + LangGraph Postgres + 幂等键 🏆):</text>
  <text x="64" y="218" class="txt">① 每步 State 原子落盘: 第 18 步失败直接从第 17 步快照秒级恢复 (零前序重算！)</text>
  <text x="64" y="238" class="txt">② 确定性幂等键 (`hash(workflow_id, step_id)`) + Saga 逆向补偿: 0.0% 重复副作用</text>
  <text x="64" y="258" class="txt good">③ 人工审批零资源休眠: 将 KV 卸载至 3FS/DRAM 池并释放 Worker，省 50% GPU 🏆</text>

  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 1,000 任务/小时 (20步长链路 Agent) 三套编排底座对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (内存态无状态循环: 纯 FastAPI + 内存 LangChain): 完结率仅 71.2% ✕</text>
  <text x="594" y="152" class="txt bad">重复工具写操作事故率 8.4%，重算浪费需配 24 张 H200 ($64.3万/年 ✕)</text>
  <text x="578" y="178" class="txt">• 方案 2 (云原生托管: Azure AI Foundry Agent Service + Durable Functions): ✓</text>
  <text x="594" y="198" class="txt">完结率 99.2%，零运维开箱即用，年化成本 $31.0 万/年</text>
  <text x="578" y="224" class="txt good">• 方案 3 (自建旗舰: Temporal + LangGraph Postgres + 分层 KV 休眠 🏆):</text>
  <text x="594" y="246" class="txt good">- 20 步完结率高达 99.7% (+28.5 pts 🏆) · 重复写操作副作用 0.0%</text>
  <text x="594" y="268" class="txt good">- 仅需 12 张 H200 ($21.8万/年，立省 50.0% GPU 与 $42.5万/年 🏆)</text>

  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 三种 Agent 编排架构的 20 步完结率 (%) 与所需 H200 卡数对比</text>

  <text x="48" y="378" class="txt">方案 1: 内存态无状态循环</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">需 24 张 H200 ($64.3万/年) | 完结率仅 71.2% · 8.4% 重复副作用 ✕</text>

  <text x="48" y="418" class="txt">方案 2: Azure Foundry + Durable</text>
  <rect x="305" y="404" width="290" height="16" fill="#3b82f6" rx="4"/>
  <text x="605" y="418" class="txt">云托管 $31.0万/年 ✓ | 完结率 99.2% · 适合快速交付</text>

  <text x="48" y="458" class="txt good">方案 3: Temporal + LangGraph 🏆</text>
  <rect x="305" y="444" width="240" height="16" fill="#10b981" rx="4"/>
  <text x="555" y="458" class="txt good">仅需 12 张 H200 (-50.0% / $21.8万/年 🏆) | 完结率 99.7% · 0.0% 重复副作用 🏆</text>
</svg>
