    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 把 429 消灭在发出 HTTP 请求之前：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">网关实时同步 `x-ratelimit-remaining-tokens`</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">响应头并在本地预扣 Token，发现主区水位 &gt;95%</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">时 0.2ms 直接路由至备区，彻底告别 429 往返！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
