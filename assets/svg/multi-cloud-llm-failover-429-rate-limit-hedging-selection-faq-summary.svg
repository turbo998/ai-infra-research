    <text x="16" y="92" fill="#94a3b8" font-size="12">• 有效 SLA 可用率: <tspan fill="#f87171" font-weight="700">94.20% (5.8% 请求超时失败 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 高峰 P99 首字延迟 TTFT: <tspan fill="#f87171" font-weight="700">24,800 ms (24.8秒 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 流式断流作废 Token 率: <tspan fill="#f87171" font-weight="700">18.5% (半截重跑 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 月度算力总账单: <tspan fill="#f87171" font-weight="700">$468,000 / 月 ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年化超支与故障代价: <tspan fill="#f87171" font-weight="700">$5,616,000 / yr ✕</tspan></text>
