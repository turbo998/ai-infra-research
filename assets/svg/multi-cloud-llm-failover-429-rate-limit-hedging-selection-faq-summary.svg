    <text x="271" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">720 ms (前缀断点续写 🏆)</text>
    <rect x="235" y="192" width="210" height="14" rx="3" fill="#ef4444"/>
    <text x="453" y="204" fill="#f87171" font-size="11.5" font-weight="700">8,400 ms (Tier 2 重头算 ✕)</text>

    <!-- Row 4 -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">主云厂商整区宕机 (跨云异构切换)</text>
    <rect x="235" y="224" width="27" height="14" rx="3" fill="#10b981"/>
    <text x="270" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">690 ms (AST Schema 转换 🏆)</text>
    <rect x="235" y="242" width="245" height="14" rx="3" fill="#ef4444"/>
    <text x="488" y="254" fill="#f87171" font-size="11.5" font-weight="700">12,400 ms ✕</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#bae6fd" font-size="11.5" font-weight="700">💡 核心洞察：流式 SSE 断流时，前端用户已经看到了前 450 个字，网关续写第 451 字用户完全无感知！</text>
