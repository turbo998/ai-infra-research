    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ OpenAI SDK 默认重试为何在线上必崩？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">当主区域 1 分钟 TPM 配额耗尽时，同一分钟内的</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">重试 100% 还会撞上 429，反而引发重试风暴把</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">下一分钟的配额也瞬间冲爆，用户干等 25 秒！</text>
  </g>

