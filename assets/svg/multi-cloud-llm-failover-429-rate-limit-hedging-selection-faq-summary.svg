    <text x="16" y="92" fill="#94a3b8" font-size="12">• 有效 SLA 可用率: <tspan fill="#60a5fa" font-weight="700">99.92% (三九高可用 ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 高峰 P99 首字延迟 TTFT: <tspan fill="#60a5fa" font-weight="700">920.0 ms (压入亚秒级 ✅)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 流式断流作废 Token 率: <tspan fill="#60a5fa" font-weight="700">9.8%</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 月度算力总账单: <tspan fill="#60a5fa" font-weight="700">$395,000 / 月 ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度总账单: <tspan fill="#60a5fa" font-weight="700">$4,740,000 / yr</tspan></text>
