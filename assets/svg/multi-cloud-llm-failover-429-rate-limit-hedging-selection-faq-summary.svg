  <!-- Bottom Right: 3 Rules for Multi-Cloud AI Gateway -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 企业级多云大模型高可用网关设计三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="34" y="70" fill="#7dd3fc" font-size="13" font-weight="800">1️⃣ 铁律一：用“网关本地双令牌桶 (TPM+RPM)”取代被动撞 429</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 每次响应从 `x-ratelimit-remaining-tokens` 校准本地水位；新请求入站时先快速估算输入</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  Token 数并预扣，一旦主端点水位 `&gt; 95%`，0.2ms 内直接溢出路由至备用区域/云厂商！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：流式断流采用 `Assistant Prefix Continuation` 无感续写</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 网关缓存已向客户端推送的 SSE 文本块 `partial_text`；若上游连接中断，向备用节点发</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  送 `messages + [{"role": "assistant", "content": partial_text}]` 接着生成剩余部分！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="250" fill="#93c5fd" font-size="13" font-weight="800">3️⃣ 铁律三：“保底包月 PTU / 自建池 + 按需 PayGo 弹性溢出”黄金配比</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 按全天 P65 基荷水位采购包月 PTU（或自建 vLLM 池，使利用率保持 92%+ 享受半价成本），</text>
    <text x="34" y="288" fill="#cbd5e1" font-weight="11.5" font-size="11.5">  仅将白天 3.5x 尖峰脉冲溢出到按 Token 计费的多云 Pay-As-You-Go 池，立省 47% 总账单！</text>
