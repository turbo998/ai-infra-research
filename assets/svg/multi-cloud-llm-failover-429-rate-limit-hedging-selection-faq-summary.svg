  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22.5" font-weight="800">🌐 企业级多云大模型故障转移 (Failover)、429 配额预判、流式续写与 PTU 溢出选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">月均 3,000 万次请求 (3.2K 输入 + 600 输出, 3.5x 高峰突发) · 跨 Azure OpenAI / AWS Bedrock / Vertex / 自建 vLLM · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Round 87 · Multi-Cloud Failover</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
