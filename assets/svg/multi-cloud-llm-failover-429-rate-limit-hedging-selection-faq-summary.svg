    <text x="16" y="92" fill="#94a3b8" font-size="12">• 有效 SLA 可用率: <tspan fill="#34d399" font-weight="700">99.995% (四九半电信级 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 高峰 P99 首字延迟 TTFT: <tspan fill="#34d399" font-weight="700">640.0 ms (快 38.8x 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 流式断流作废 Token 率: <tspan fill="#34d399" font-weight="700">仅 0.6% (前缀续写 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 月度算力总账单: <tspan fill="#34d399" font-weight="700">$248,000 / 月 (-47.0% 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年化净省算力: <tspan fill="#34d399" font-weight="700">净省 $2,640,000 / yr 🏆</tspan></text>
