    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">等 5s 超时或收到 429 才切备区 + 断流重头算</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 有效 SLA 可用率: <tspan fill="#fbbf24" font-weight="700">98.85%</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 高峰 P99 首字延迟 TTFT: <tspan fill="#f87171" font-weight="700">5,850 ms (先白等 5s ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 流式断流作废 Token 率: <tspan fill="#f87171" font-weight="700">14.2% (已吐 450 字全丢 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 月度算力总账单: <tspan fill="#fbbf24" font-weight="700">$442,000 / 月</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 年度总账单: <tspan fill="#fbbf24" font-weight="700">$5,304,000 / yr</tspan></text>
