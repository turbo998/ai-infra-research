    <text x="20" y="52" fill="#94a3b8" font-size="12">对比单区退避重试 (Tier 1)、被动报错切换 (Tier 2) 与主动溢出 + 流式续写 (Tier 4)</text>

    <!-- Row 1 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">白天 3.5x 洪峰 (主区 TPM 100% 满)</text>
    <rect x="235" y="74" width="22" height="14" rx="3" fill="#10b981"/>
    <text x="265" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">580 ms (0.2ms 预判绕行 🏆)</text>
    <rect x="235" y="92" width="260" height="14" rx="3" fill="#ef4444"/>
    <text x="502" y="104" fill="#f87171" font-size="11.5" font-weight="700">24,800 ms ✕</text>

    <!-- Row 2 -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">上游静默拥塞挂起 (不报错只卡死)</text>
    <rect x="235" y="124" width="25" height="14" rx="3" fill="#10b981"/>
    <text x="268" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">640 ms (600ms 投机对冲 🏆)</text>
    <rect x="235" y="142" width="180" height="14" rx="3" fill="#f59e0b"/>
    <text x="423" y="154" fill="#fde68a" font-size="11.5" font-weight="700">5,850 ms (Tier 2 等超时)</text>

    <!-- Row 3 -->
