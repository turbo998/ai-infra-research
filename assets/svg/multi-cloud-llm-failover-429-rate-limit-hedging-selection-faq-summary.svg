    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 被动 Failover 的两大硬伤：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 遇到云厂商静默拥塞（不报错只挂起）必须先</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">傻等 5 秒 Timeout 才切备区；② SSE 流生成到</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">第 450 个字断网时，只能把已吐出的字全扔掉重来！</text>
  </g>

