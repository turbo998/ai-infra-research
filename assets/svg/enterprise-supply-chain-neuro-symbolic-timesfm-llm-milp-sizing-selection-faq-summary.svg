<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#522 企业全球供应链控制塔 (`500万 SKU`)：神经符号三擎协同 (`TimesFM + LLM + MILP`) 选型指南</text>
  <text x="30" y="60" class="sub">终结“让大模型直接心算调拨表 (38.5% 违反仓容约束)” · 时序基础模型 + LLM 约束编译器 + 运筹学求解器将缺货率压降 70.3%</text>

  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么严禁让大模型直接输出补货数量与多仓调拨方案？</text>
  <text x="48" y="132" class="txt bad">• 纯 LLM 直猜库存灾难: 自回归语言模型不具备万人级线性规划求极值能力，</text>
  <text x="64" y="150" class="txt bad">面对起订量 (MOQ)、港口运力与保质期约束时 38.5% 方案违规不可执行，且耗 64 卡 ✕</text>
  <text x="48" y="174" class="txt warn">• 传统静态 ERP 规则盲区: 看不懂港口罢工/供应商停产邮件，缺货率高达 6.4% ✕</text>
  <text x="48" y="198" class="txt good">• 神经符号三擎协同架构 (100% 物理约束达标 · 缺货率压至 1.9% 🏆):</text>
  <text x="64" y="218" class="txt">① 时序基础模型 (Chronos-Bolt / TimesFM): 2 张卡批处理 500万 SKU 概率预测</text>
  <text x="64" y="238" class="txt">② 70B LLM 语义编译器: 将采购邮件/突发台风通知编译成数学约束 JSON ($\Delta C_j$)</text>
  <text x="64" y="258" class="txt good">③ HiGHS / Gurobi / cuOpt MILP 求解器: 100% 满足硬约束并求全局成本最小解 🏆</text>

  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 500 万 SKU 供应链控制塔三套架构的准确率、缺货率与算卡对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (纯大模型 Prompting 直出补货单): 约束满足率仅 61.5% ✕</text>
  <text x="594" y="152" class="txt bad">预测误差 WAPE = 28.4%，缺货率 9.6%，需 64 张 H200 ($171.5 万/年 ✕)</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (传统静态安全库存 + ARIMA): 约束满足率 100.0% ✓，</text>
  <text x="594" y="198" class="txt warn">但无法响应突发断链事件，WAPE = 21.2%，缺货率高达 6.4% ✕</text>
  <text x="578" y="224" class="txt good">• 方案 3 (神经符号三擎: TimesFM + 70B 约束提取 + MILP 求解器 🏆):</text>
  <text x="594" y="246" class="txt good">- 约束满足率: 100.0% (零爆仓/零违约) · 预测误差 WAPE 降至 11.8% 🏆</text>
  <text x="594" y="268" class="txt good">- 缺货率从 6.4% 压至 1.9% (-70.3% 🏆) · 仅需 8 张 H200 (省 87.5% GPU 🏆)</text>

  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 三种供应链架构下的门店缺货率 (Stockout Rate %, 越短越优) 与所需 GPU 卡数对比</text>

  <text x="48" y="378" class="txt">方案 1: 纯大模型直猜补货单</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">缺货率 9.6% | 38.5% 方案违反仓容/MOQ 约束 | 需 64 张 H200 ✕</text>

  <text x="48" y="418" class="txt">方案 2: 传统静态 ERP 安全库存</text>
  <rect x="305" y="404" width="320" height="16" fill="#f59e0b" rx="4"/>
  <text x="635" y="418" class="txt warn">缺货率 6.4% | 无法感知非结构化港口/供应商风险邮件 ✕</text>

  <text x="48" y="458" class="txt good">方案 3: TimesFM + LLM + MILP 🏆</text>
  <rect x="305" y="444" width="95" height="16" fill="#10b981" rx="4"/>
  <text x="410" y="458" class="txt good">缺货率仅 1.9% (-70.3% 🏆) | 100% 满足物理约束 | 仅需 8 张 H200 (-87.5% 🏆)</text>
</svg>
