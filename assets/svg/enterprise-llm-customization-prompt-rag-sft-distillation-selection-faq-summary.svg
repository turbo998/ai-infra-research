<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg363" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc363" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg363)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="445" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="274" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 363 · PROMPT+CACHE vs. RAG vs. LORA SFT vs. DISTILLATION</text>
  <text x="512" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="23.5" font-weight="800">企业大模型定制路径与 ROI 选型：Prompt 缓存 vs. 混合 RAG vs. LoRA SFT 微调 vs. 8B 小模型蒸馏路由</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">日均 10万次企业专业问答 (50万篇动态文档 + 严格 JSON 工具格式)：为什么拿 PDF 做 SFT 微调幻觉率高达 19.6%，而“RAG + 8B 蒸馏级联”准确率达 95.4% 且省钱 72.4%？</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc363)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="68" y="184" width="236" height="24" rx="6" fill="#78350f"/>
  <text x="186" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 长 Prompt + Context Cache</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">1 天极速上线 · 装不下海量文档</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">32K 静态手册 + Few-Shot 塞入系统提示词</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="80" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心优势与天花板：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">零训练与建库成本；但无法容纳 50万篇</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">企业制度，且每轮挂 32K 前缀延迟高 ⚠️</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 领域任务准确率: <tspan fill="#fbbf24" font-weight="700">78.5% (超长上下文注意力稀释)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 事实幻觉率: <tspan fill="#fbbf24" font-weight="700">8.4% (无动态检索溯源)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 端到端延迟: <tspan fill="#f87171" font-weight="700">1,680.0 ms ✕</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (3M次): <tspan fill="#fbbf24" font-weight="700">$28,500 / 月</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="190" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 适合首周 PoC (&le;50 页静态规则)</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="368" y="184" width="236" height="24" rx="6" fill="#7f1d1d"/>
  <text x="486" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 裸 LoRA SFT 背诵企业文档</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">幻觉率 19.6% · 企业头号深坑</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">企图用微调让 70B 模型记住动态企业事实</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="380" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么不能用 SFT 学动态知识？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">微调只能改变语气与格式，不能精确记忆</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">数字与条款！一本正经胡编乱造旧数据 ✕</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 领域任务准确率: <tspan fill="#f87171" font-weight="700">仅 64.2% (最差 ✕)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 事实幻觉率: <tspan fill="#f87171" font-weight="700">高达 19.6% (零引用来源 ✕)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 知识更新延迟: <tspan fill="#f87171" font-weight="700">14 天重训周期 ✕</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (3M次): <tspan fill="#f87171" font-weight="700">$34,200 / 月 (最贵 ✕)</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="490" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁拿 SFT 微调替代 RAG 灌输知识</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="236" height="24" rx="6" fill="#0c4a6e"/>
  <text x="786" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · 混合检索 RAG + 70B 旗舰模型</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">准确率 91.8% · 100% 引用溯源</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">BM25 + 向量 + Reranker + 100% 走大模型</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心优势与高并发成本：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">文档修改后 5 秒生效，彻底压住幻觉；但</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">简单查询也调 70B/GPT-4o，算力略贵</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 领域任务准确率: <tspan fill="#38bdf8" font-weight="800">91.8% (100% 原文溯源 ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 事实幻觉率: <tspan fill="#38bdf8" font-weight="800">1.8% (压降 10.9 倍 ✅)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 端到端延迟: <tspan fill="#38bdf8" font-weight="800">1,320.0 ms</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (3M次): <tspan fill="#38bdf8" font-weight="800">$24,600 / 月 ✅</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 企业知识库问答与合规审计主力方案</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 混合 RAG + 8B 蒸馏级联路由</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">准确率 95.4% · 成本暴降 72.4%</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">RAG 管事实 + 82% 流量走蒸馏 8B LoRA 小模型</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">终极组合拳 (RAG + Distillation)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">用 671B/GPT-4o 蒸馏 8B 学生模型掌握</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">JSON/SQL 格式，配合 RAG 既准又快 🏆</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 领域任务准确率: <tspan fill="#34d399" font-weight="800">95.4% (+31.2 pts 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 事实幻觉率: <tspan fill="#34d399" font-weight="800">1.1% (100% 引用溯源 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• P99 端到端延迟: <tspan fill="#34d399" font-weight="800">490.0 ms (提速 2.69x 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 月度总成本 (3M次): <tspan fill="#34d399" font-weight="800">$6,800 / 月 (省 72.4% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 高并发生产级企业定制终局架构</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：一张正交矩阵分清“什么时候用 RAG，什么时候用 SFT 微调，什么时候用模型蒸馏”</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">📖 铁律 1：RAG 是“开卷考试查字典”，SFT 是“训练答题格式与文风”</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 凡是需要注入 **企业私域事实、每日变动价格/库存、权限隔离文档、原文引用溯源**，</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  100% 必须用 **Hybrid RAG**！拿文档做 SFT 只会让模型学会“模仿公文腔调胡编数字”；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 凡是需要定制 **私有 JSON/DSL 工具调用格式、行业审查话术、剔除废话**，才用 **LoRA SFT**！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🚀 铁律 2：用 671B/GPT-4o 当老师，蒸馏 7B/8B 垂直小模型砍掉 72% 成本</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 先用 `Tier 3 (RAG + 旗舰大模型)` 跑通业务并收集 20,000~50,000 条高质量真实线上轨迹；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 用这批带干扰项的检索问答轨迹做 **RAFT / 蒸馏微调 `Qwen-2.5-7B / Llama-3.1-8B`**；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 上线 **级联路由器 (Cascade Router)**：82% 常规单跳请求走 8B (490ms)，18% 疑难走 70B 🏆！</text>
</svg>
