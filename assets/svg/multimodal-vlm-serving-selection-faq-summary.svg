<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <style>
      .title { font-size: 23px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-size: 13px; font-weight: 500; fill: #94a3b8; }
      .badge { font-size: 11px; font-weight: 700; fill: #3b0764; }
      .sec-title { font-size: 14.5px; font-weight: 700; fill: #e2e8f0; }
      .card-title { font-size: 13px; font-weight: 700; fill: #f8fafc; }
      .body-sm { font-size: 11.5px; fill: #cbd5e1; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-size: 11.5px; fill: #38bdf8; font-weight: 700; }
      .tbl-hd { font-size: 11px; font-weight: 700; fill: #94a3b8; }
      .tbl-cell { font-size: 11.5px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1280" height="760" fill="url(#bgGrad)"/>
  <rect x="24" y="18" width="1232" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Header -->
  <rect x="24" y="32" width="188" height="24" rx="12" fill="#c084fc"/>
  <text x="118" y="48" text-anchor="middle" class="badge">AI INFRA ROUND 13 · VLM</text>
  <text x="224" y="50" class="title">多模态大模型与长视频推理架构选型一图流（单体混部 vs. EPD 三阶段分离 vs. 视觉缓存 vs. 4x 时空压缩）</text>
  <text x="24" y="74" class="subtitle">Multimodal VLM &amp; Video Serving: Monolithic TP8 vs. EPD Disaggregation vs. SHA-256 Vision Cache vs. ToMe/FastV 4x Compression · 16×H100 ($40/hr) 72B VLM · synthetic + anonymized_reported</text>

  <!-- Left Panel: First-Principles 3-Stage Mismatch & Compression -->
  <rect x="24" y="90" width="600" height="295" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="116" class="sec-title">🔍 第一性原理：为什么 64 帧视频 (16,384 视觉 Tokens) 会卡死单体 VLM？</text>

  <!-- Box 1: Monolithic Trap -->
  <rect x="42" y="128" width="564" height="74" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="56" y="147" class="card-title" fill="#fca5a5">⛔ 痛点 1：CPU FFmpeg 软解 + ViT-4B 强绑在 LLM TP=8 组内（Tier 1 单体混部）</text>
  <text x="56" y="166" class="body-sm">• CPU 软解 64 帧耗时 <tspan class="mono" fill="#f87171">380.0 ms</tspan> + 8 张 H100 串行跑 4B ViT (<tspan class="mono" fill="#f87171">640.0 ms</tspan>) + 16K Prefill (<tspan class="mono" fill="#f87171">1,180.0 ms</tspan>)</text>
  <text x="56" y="185" class="body-sm">• 同节点正在流式吐字的 Decode 请求被硬阻塞 &gt;1.8 秒，P99 TPOT 飙至 <tspan class="mono" fill="#f87171">385.0 ms (违反 50ms SLA)</tspan>！</text>

  <!-- Box 2: EPD + SHA256 Vision Cache -->
  <rect x="42" y="210" width="564" height="76" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <text x="56" y="229" class="card-title" fill="#6ee7b7">🟩 突破 2：GPU NVDEC 硬解 + EPD 三阶段分离 + SHA-256 视觉 Embedding 缓存（Tier 2 &amp; Tier 3）</text>
  <text x="56" y="248" class="body-sm">• 独立 <tspan class="mono" fill="#34d399">2E (DP=1 ViT) + 8P + 6D</tspan> 三池解耦：NVDEC 硬解 <tspan class="mono">45.0 ms</tspan>，P99 TPOT 骤降至 <tspan class="mono" fill="#34d399">34.0 ms (降 11.3x)</tspan></text>
  <text x="56" y="267" class="body-sm">• 缓存 Projector 后特征 (<tspan class="mono">SHA-256</tspan>)：多轮会话 <tspan class="mono" fill="#34d399">75% 命中</tspan> 免重跑 ViT，TTFT 降至 <tspan class="mono" fill="#34d399">680.0 ms</tspan> · 100% 无损</text>

  <!-- Box 3: 4x Spatio-Temporal Token Compression -->
  <rect x="42" y="294" width="564" height="78" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
  <text x="56" y="313" class="card-title" fill="#d8b4fe">🟪 突破 3：ToMe 帧间合并 + FastV 浅层注意力剪枝 4.0x 压缩（Tier 4：16,384 → 4,096 Tokens）</text>
  <text x="56" y="332" class="body-sm">• 削减 75% 静止背景块（密集 OCR 自动回退 1.5x 保真）：单请求 KV 显存从 <tspan class="mono" fill="#f87171">5.41 GB</tspan> 压至 <tspan class="mono" fill="#c084fc">1.47 GB (省 3.68x)</tspan></text>
  <text x="56" y="351" class="body-sm">• 平均 TTFT 压至 <tspan class="mono" fill="#c084fc">245.0 ms (快 8.98x)</tspan> · P99 TPOT <tspan class="mono" fill="#c084fc">22.8 ms</tspan> · 吞吐 <tspan class="mono" fill="#c084fc">24.6 req/s (7.69x)</tspan> · 精度 <tspan class="mono">99.1%</tspan></text>

  <!-- Right Panel: Decision Tree -->
  <rect x="644" y="90" width="612" height="295" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="662" y="116" class="sec-title">🧭 架构师选型决策树（When to Choose Tier 1 / 2 / 3 / 4）</text>

  <rect x="662" y="130" width="576" height="52" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.2"/>
  <text x="676" y="149" class="card-title" fill="#fca5a5">⛔ 严禁在高并发视频 / 4K 多图在线服务中使用 → Tier 1（单体 CPU 解码 + TP8 混部）</text>
  <text x="676" y="168" class="body-sm">• 仅限低并发离线批处理；在线服务会导致 P99 TPOT 385.0ms 严重卡顿，单千次成本高达 $3.47</text>

  <rect x="662" y="190" width="576" height="56" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="676" y="209" class="card-title" fill="#7dd3fc">🟦 单轮全新视频流 / 直播实时巡检（无历史图片复用）→ 选 Tier 2（GPU NVDEC + EPD 三阶段分离）</text>
  <text x="676" y="229" class="body-sm">• 2 卡独立 DP ViT 池 + 8P + 6D 解耦，彻底消除 Decode 抖动（P99 TPOT 34.0ms，吞吐 6.8 req/s，$1.63/1k req）</text>

  <rect x="662" y="254" width="576" height="56" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="676" y="273" class="card-title" fill="#6ee7b7">🟩 医疗影像 / 财报票据密集 OCR / 多轮图文问答（要求 100% 无损）→ 选 Tier 3（EPD + SHA-256 视觉缓存）</text>
  <text x="676" y="293" class="body-sm">• 75% 多轮命中跳过 NVDEC+ViT：TTFT 降至 680.0ms (快 3.24x)，吞吐 11.4 req/s (3.56x)，成本 $0.97/1k req，100% 无损</text>

  <rect x="662" y="318" width="576" height="56" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
  <text x="676" y="337" class="card-title" fill="#d8b4fe">🟪 长视频理解 (32~128帧) / 具身智能 / 实时 GUI Agent → 选 Tier 4（EPD + 视觉缓存 + 4x 时空压缩）</text>
  <text x="676" y="357" class="body-sm">• 视觉 Token 16K→4K，KV 显存降 3.68x (1.47 GB)：TTFT 245.0ms (快 8.98x)，吞吐 24.6 req/s (7.69x)，$0.45/1k req (-87%)</text>

  <!-- Bottom Table: Quantitative Matrix -->
  <rect x="24" y="400" width="1232" height="270" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="42" y="426" class="sec-title">📊 16 × H100 ($40.00/hr) · 72B VLM · 64 帧视频 (16,384 视觉 Tokens) 四档架构定量对比矩阵（绑定 results.json）</text>

  <rect x="42" y="438" width="1196" height="28" rx="6" fill="#0f172a"/>
  <text x="54" y="456" class="tbl-hd">架构档位 (Tier)</text>
  <text x="330" y="456" class="tbl-hd">解码与视觉编码路径</text>
  <text x="560" y="456" class="tbl-hd">保留视觉 Token / KV</text>
  <text x="720" y="456" class="tbl-hd">平均首字 TTFT</text>
  <text x="860" y="456" class="tbl-hd">P99 TPOT 尾延迟</text>
  <text x="1015" y="456" class="tbl-hd">集群稳态吞吐</text>
  <text x="1140" y="456" class="tbl-hd">千次成本 / 精度</text>

  <!-- Row 1 -->
  <line x1="42" y1="504" x2="1238" y2="504" stroke="#334155" stroke-width="1"/>
  <text x="54" y="490" class="tbl-cell" fill="#fca5a5" font-weight="700">⛔ Tier 1: 单体同进程混部 VLM</text>
  <text x="330" y="490" class="tbl-cell">CPU FFmpeg (380ms) + TP8 ViT (640ms)</text>
  <text x="560" y="490" class="mono" fill="#f87171">16,384 · 5.41 GB</text>
  <text x="720" y="490" class="mono" fill="#f87171">2,200.0 ms (1.0x)</text>
  <text x="860" y="490" class="mono" fill="#f87171">385.0 ms (✕ 超标)</text>
  <text x="1015" y="490" class="mono" fill="#f87171">3.2 req/s (1.00x)</text>
  <text x="1140" y="490" class="mono" fill="#f87171">$3.47 · 100.0%</text>

  <!-- Row 2 -->
  <line x1="42" y1="546" x2="1238" y2="546" stroke="#334155" stroke-width="1"/>
  <text x="54" y="530" class="tbl-cell" fill="#7dd3fc" font-weight="700">🟦 Tier 2: GPU NVDEC + EPD 三阶段分离</text>
  <text x="330" y="530" class="tbl-cell">NVDEC (45ms) + 2E DP1 ViT (265ms)</text>
  <text x="560" y="530" class="mono">16,384 · 5.41 GB</text>
  <text x="720" y="530" class="mono">1,490.0 ms (1.48x)</text>
  <text x="860" y="530" class="mono" fill="#34d399">34.0 ms (降 11.3x)</text>
  <text x="1015" y="530" class="mono">6.8 req/s (2.13x)</text>
  <text x="1140" y="530" class="mono">$1.63 · 100.0%</text>

  <!-- Row 3 -->
  <rect x="42" y="550" width="1196" height="42" rx="4" fill="#064e3b" fill-opacity="0.35"/>
  <text x="54" y="576" class="tbl-cell" fill="#6ee7b7" font-weight="700">🟩 Tier 3: EPD + SHA-256 视觉特征缓存</text>
  <text x="330" y="576" class="tbl-cell">75% 命中免 ViT (11.3ms + 66.3ms 均值)</text>
  <text x="560" y="576" class="mono" fill="#34d399">16,384 · 5.41 GB</text>
  <text x="720" y="576" class="mono" fill="#34d399">680.0 ms (3.24x)</text>
  <text x="860" y="576" class="mono" fill="#34d399">31.5 ms (✅ 达标)</text>
  <text x="1015" y="576" class="mono" fill="#34d399">11.4 req/s (3.56x)</text>
  <text x="1140" y="576" class="mono" fill="#34d399">$0.97 · 100.0%</text>

  <!-- Row 4 -->
  <rect x="42" y="598" width="1196" height="46" rx="4" fill="#3b0764" fill-opacity="0.35"/>
  <text x="54" y="626" class="tbl-cell" fill="#d8b4fe" font-weight="700">🟪 Tier 4: EPD + 缓存 + 4x 时空压缩</text>
  <text x="330" y="626" class="tbl-cell">NVDEC + 缓存 + ToMe/FastV 4x 剪枝</text>
  <text x="560" y="626" class="mono" fill="#c084fc">4,096 · 1.47 GB</text>
  <text x="720" y="626" class="mono" fill="#c084fc">245.0 ms (8.98x)</text>
  <text x="860" y="626" class="mono" fill="#c084fc">22.8 ms (降 16.9x)</text>
  <text x="1015" y="626" class="mono" fill="#c084fc">24.6 req/s (7.69x)</text>
  <text x="1140" y="626" class="mono" fill="#c084fc">$0.45 · 99.1%</text>

  <!-- Footer -->
  <rect x="24" y="684" width="1232" height="56" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="42" y="707" class="body-sm" fill="#94a3b8">🛠️ <tspan font-weight="700" fill="#f8fafc">生产黄金法则</tspan>：① 启用 GPU NVDEC/DALI 硬解并将 ViT 拆入独立 DP=1 池（Stage E）；② 开启 SHA-256 Projector 后视觉 Embedding 缓存；③ 长视频开启 4x ToMe+FastV 压缩（密集 OCR 自动回退 1.5x）。</text>
  <text x="42" y="727" class="body-sm" fill="#64748b">Provenance: synthetic analytical model (experiments/multimodal_vlm_serving_selection/run.py) + anonymized_reported specs · independently_reproduced=false · physical_gpu_cluster_measurement=not_measured</text>
</svg>
