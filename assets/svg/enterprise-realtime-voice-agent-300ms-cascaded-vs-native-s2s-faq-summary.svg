<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Segoe UI, Inter, system-ui, sans-serif">
  <rect width="1200" height="630" fill="#0F172A" rx="16"/>
  <rect x="24" y="20" width="1152" height="72" rx="12" fill="#1E293B" stroke="#334155"/>
  <text x="44" y="50" fill="#38BDF8" font-size="19" font-weight="700">#643 企业实时语音 Agent (&lt;300ms E2E) 流式级联 (ASR+LLM+TTS) vs. 原生端到端语音 (Native S2S) 架构选型图</text>
  <text x="44" y="74" fill="#94A3B8" font-size="13">Real-Time Voice SLA: 265ms WebRTC Streaming Cascaded Pipeline ($0.014/min, 14x H200) vs. 185ms Native S2S ($0.058/min, 32x H200)</text>

  <!-- Left: Latency Budget Breakdown (<300ms Human Turn-Taking) -->
  <rect x="24" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="42" y="136" fill="#6EE7B7" font-size="15" font-weight="700">① 人类自然对话阈值 (&lt;300ms) 五段延迟预算拆解</text>

  <rect x="40" y="150" width="333" height="96" rx="8" fill="#450A0A" stroke="#EF4444"/>
  <text x="52" y="172" fill="#FCA5A5" font-size="13" font-weight="700">⛔ 反模式：HTTP REST 整句串行 (E2E = 1,420 ms)</text>
  <text x="52" y="192" fill="#F1F5F9" font-size="12">· 静音判停 600ms + 整段 Whisper 240ms + LLM 整句 380ms</text>
  <text x="52" y="212" fill="#CBD5E1" font-size="12">· + 整段 TTS 合成 160ms + TCP/TLS 重传抖动 40ms</text>
  <text x="52" y="232" fill="#FCA5A5" font-size="12" font-weight="700">· 结果：电话那头死寂 1.4 秒，38% 客户误以为掉线直接挂断！</text>

  <rect x="40" y="258" width="333" height="220" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="52" y="280" fill="#6EE7B7" font-size="13" font-weight="700">✅ 流式级联全链路重叠预算 (P95 E2E = 265 ms)</text>
  <text x="52" y="302" fill="#F8FAFC" font-size="12">1. 语义端点检测 (Semantic VAD + 声学特征): **`35 ms`**</text>
  <text x="52" y="322" fill="#D1FAE5" font-size="12">2. 流式 ASR 增量尾帧确认 (边说边转写，仅算尾帧): **`45 ms`**</text>
  <text x="52" y="342" fill="#D1FAE5" font-size="12">3. LLM Prefix-Cached TTFT + 首标点/首词组 (4 tok): **`95 ms`**</text>
  <text x="52" y="362" fill="#D1FAE5" font-size="12">4. 流式 TTS 首包声码器帧 (20ms PCM chunk): **`65 ms`**</text>
  <text x="52" y="382" fill="#D1FAE5" font-size="12">5. WebRTC UDP Opus (24kHz) 边缘传输: **`25 ms`**</text>
  <text x="52" y="406" fill="#6EE7B7" font-size="13" font-weight="700">Σ 端到端首音延迟 (Voice-to-Voice TTFA) = `265 ms`！</text>
  <text x="52" y="428" fill="#A7F3D0" font-size="11">· 全双工打断 (Barge-In): 客户端 WebRTC 检测到人声 40ms 内</text>
  <text x="52" y="446" fill="#A7F3D0" font-size="11">  立即清空本地播放缓冲并向服务端发送 `abort_generation`</text>
  <text x="52" y="464" fill="#6EE7B7" font-size="11" font-weight="700">  同时截断 LLM KV Cache 至用户实际听到的最后一个词！</text>

  <!-- Center: Cascaded vs Native S2S Architecture -->
  <rect x="407" y="108" width="386" height="385" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="425" y="136" fill="#38BDF8" font-size="15" font-weight="700">② 流式级联 (Cascaded) vs. 原生语音大模型 (Native S2S)</text>

  <rect x="423" y="150" width="354" height="155" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="435" y="172" fill="#38BDF8" font-size="13" font-weight="700">架构 A：流式级联 (Streaming ASR → Text LLM → Streaming TTS)</text>
  <text x="435" y="192" fill="#F1F5F9" font-size="12">· 延迟与成本：`265 ms` E2E | **`$0.014 / 分钟`** (便宜 75.9%)</text>
  <text x="435" y="212" fill="#CBD5E1" font-size="12">· 文本合规护栏：LLM 输出文本流先经正则/PII 脱敏再喂给 TTS</text>
  <text x="435" y="232" fill="#CBD5E1" font-size="12">· 工具调用与 RAG：直接复用成熟 70B 文本模型 + XGrammar</text>
  <text x="435" y="252" fill="#6EE7B7" font-size="12" font-weight="700">· 1,000 路并发容量：仅需 `14× H200` (2×ASR + 8×LLM + 4×TTS)</text>
  <text x="435" y="272" fill="#94A3B8" font-size="11">· 局限：ASR 转成纯文字丢失了用户叹气、哭泣、讽刺等副语言情绪</text>
  <text x="435" y="290" fill="#38BDF8" font-size="11" font-weight="700">· 适用：90% 企业银行客服、政务热线、订单查询、医疗随访</text>

  <rect x="423" y="317" width="354" height="161" rx="8" fill="#0F172A" stroke="#A78BFA"/>
  <text x="435" y="339" fill="#C4B5FD" font-size="13" font-weight="700">架构 B：原生语音到语音 (Native S2S · GPT-4o-Audio / Omni)</text>
  <text x="435" y="359" fill="#F1F5F9" font-size="12">· 延迟与成本：**`185 ms`** E2E | **`$0.058 / 分钟`** (`4.1x` 成本)</text>
  <text x="435" y="379" fill="#CBD5E1" font-size="12">· Audio Token 膨胀：每秒输入输出高达 `25~50 Audio Tokens/s`</text>
  <text x="435" y="399" fill="#CBD5E1" font-size="12">  (3 分钟通话累积 `9,000 Audio Tokens`，KV Cache 极速膨胀)</text>
  <text x="435" y="419" fill="#FCA5A5" font-size="12" font-weight="700">· 1,000 路并发容量：需 **`32× H200`** (且无法在合成前拦截敏感词)</text>
  <text x="435" y="439" fill="#C4B5FD" font-size="11" font-weight="700">· 破局双轨制 (“Dual-Brain” 架构)：</text>
  <text x="435" y="457" fill="#E2E8F0" font-size="11">  90% 交易/客服走流式级联 (`$0.014/min`)，仅 VIP 情感陪练/口语</text>
  <text x="435" y="472" fill="#E2E8F0" font-size="11">  纠音走 Native S2S (综合节省 `56.2%` 集群 GPU 卡数)！</text>

  <!-- Right: 1,000 Concurrent Calls Sizing -->
  <rect x="811" y="108" width="365" height="385" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="829" y="136" fill="#FDE68A" font-size="15" font-weight="700">③ 1,000 路并发实时语音坐席 GPU 容量手算</text>

  <rect x="827" y="150" width="333" height="104" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="839" y="172" fill="#38BDF8" font-size="13" font-weight="700">电话双工占空比定律 (Duty Cycle Math)</text>
  <text x="839" y="192" fill="#E2E8F0" font-size="12">· 1,000 路并发通话中，任一时刻：</text>
  <text x="839" y="212" fill="#CBD5E1" font-size="12">  · `42%` (420 路) 用户正在说话 → 占流式 ASR</text>
  <text x="839" y="230" fill="#CBD5E1" font-size="12">  · `13%` (130 路) 处于轮次转换/思考 → 占 LLM Prefill/Decode</text>
  <text x="839" y="246" fill="#6EE7B7" font-size="12" font-weight="700">  · `45%` (450 路) AI 正在播报 → 占流式 TTS + LLM 续写</text>

  <rect x="827" y="264" width="333" height="114" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="839" y="286" fill="#6EE7B7" font-size="13" font-weight="700">流式级联三池拆解 (总计 14× H200 · $0.014/min)</text>
  <text x="839" y="308" fill="#F8FAFC" font-size="12">· Pool 1 (ASR + Semantic VAD): **`2× H200`** (承载 450 路音频流)</text>
  <text x="839" y="328" fill="#F8FAFC" font-size="12">· Pool 2 (70B FP8 LLM + Prefix Cache): **`8× H200`** (TP=4×2)</text>
  <text x="839" y="348" fill="#F8FAFC" font-size="12">· Pool 3 (Streaming TTS 24kHz): **`4× H200`** (RTF=0.035, 130路/卡)</text>
  <text x="839" y="368" fill="#6EE7B7" font-size="12" font-weight="700">· 对比 Native S2S (`32× H200`): 立省 `18 张 H200 (-56.3%)`！</text>

  <rect x="827" y="390" width="333" height="88" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="839" y="412" fill="#FDE68A" font-size="13" font-weight="700">🛡️ 语音 Agent 生产三大必检项</text>
  <text x="839" y="432" fill="#E2E8F0" font-size="12">1. 严禁用 WebSocket/TCP 传裸 PCM：必上 WebRTC Opus + FEC</text>
  <text x="839" y="450" fill="#E2E8F0" font-size="12">2. TTS 首句触发器：按逗号/分号 (`4~6` 词) 切片，勿等句号</text>
  <text x="839" y="468" fill="#6EE7B7" font-size="12" font-weight="700">3. 打断状态对齐：客户端上报已播放毫秒数精确回滚 KV Cache</text>

  <!-- Bottom Banner -->
  <rect x="24" y="508" width="1152" height="100" rx="12" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="44" y="536" fill="#6EE7B7" font-size="16" font-weight="700">🔑 AI Solution Architect 实时语音 Agent 架构选型金律</text>
  <text x="44" y="562" fill="#F8FAFC" font-size="13">1. 265ms 级联黄金公式：Semantic VAD (35ms) + 流式 ASR 尾帧 (45ms) + LLM 首词组 (95ms) + 流式 TTS 首帧 (65ms) + WebRTC (25ms) = 265ms；</text>
  <text x="44" y="586" fill="#CBD5E1" font-size="13">2. 严守合规与成本边界：金融/政务/电商客服首选流式级联 ($0.014/min + 100% 文本护栏可审计)；仅口语教学与情感陪聊选用 Native S2S。</text>
</svg>
