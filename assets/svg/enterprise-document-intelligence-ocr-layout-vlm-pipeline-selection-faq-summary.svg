<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad381" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad381" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad381)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级多模态文档智能 (IDP) 与复杂财报表格解析架构选型指南：PyPDF vs. 全量 VLM vs. 版面路由</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：82% 版面引擎 (Docling/MinerU) + 18% 7B VLM + 跨页表缝合 + 会计恒等式校验，表格准确率达 96.8% 且比全量顶配 VLM 省 90.3%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 381 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 纯文本提取 (PyPDF/OCR)</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 双栏排版左右串行、合并单元格丢失</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 跨页表格第 2 页彻底丢失表头</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 复杂表格 TEDS 准确率：48.5% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 财务科目合计不平率：24.0% ✕</text>
  <text x="40" y="252" fill="#cbd5e1" font-size="12">• 单页耗时：0.15 s/页</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">千万页月成本：$1,200 (垃圾进垃圾出)✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：80% 的企业 RAG 回答不准，</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">根因根本不在向量库，而是 PDF 解析烂了</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 100% 全量调顶配 VLM</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 每页 PDF 渲染高清图直塞 GPT-4o/72B</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 单页单图孤立识别，无跨页表头记忆</text>
  <text x="332" y="212" fill="#fde68a" font-size="12" font-weight="700">• 复杂表格 TEDS 准确率：92.0%</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 财务合计不平率：4.2% (密集数字看串行)</text>
  <text x="332" y="252" fill="#fca5a5" font-size="12">• 单页耗时：3.80 s/页 (慢 6.9x) ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">千万页月成本：$64,000 (天价账单) ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">反模式：82% 的纯文字页也烧视觉 Token</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">且 12 列宽表大模型容易产生小数点幻觉</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 专用版面解析引擎</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• Docling / MinerU / Azure Doc Intel</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 版面检测 (YOLO) + TableTransformer</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 复杂表格 TEDS 准确率：88.4% ✅</text>
  <text x="624" y="232" fill="#fde68a" font-size="12" font-weight="700">• 财务合计不平率：5.8% (印章/手写弱)</text>
  <text x="624" y="252" fill="#34d399" font-size="12">• 单页耗时：0.42 s/页 ✅</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">千万页月成本：$4,800 (省 92.5%) ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：大批量常规研报/规章制度入库主力</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：遇到红章遮挡、折线图与歪斜发票易错</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 版面路由+7B VLM+验算 🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 82% 走版面引擎 + 18% 难页路由 7B VLM</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 复杂表格 TEDS 准确率：96.8% 🏆 (+4.8pts)</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 财务合计不平率：0.1% 🏆 (行列自动验算)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 单页耗时：0.55 s/页 🏆 (快 6.9x)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 跨页无无线框表格自动携带上页表头缝合</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">千万页月成本：$6,200 (省 90.3%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：金融财报、海关单据与合同审核黄金标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">兼具版面引擎的低成本与 VLM 的极限抗噪力</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么金融财报与企业合同解析必须采用“82/18 复杂度路由 + 跨页表缝合 + 会计恒等式验算”？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad381)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 页面级复杂度路由（省掉 82% 视觉 Token）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 一份 200 页招股书里，82% 是干净正文与规整表格，</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">  直接由 `Docling / MinerU` 在 `0.3s` 内极速转 Markdown。</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">• 仅当检测到“无线框嵌套表/印章遮挡/柱状图/置信度&lt;0.88”</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">  才局部裁剪 bbox 送入 `Qwen2.5-VL-7B / olmOCR` 精读！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 跨页断裂表格状态机缝合（Cross-Page Stitch）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 招投标清单与资产负债表常跨 3~5 页，第 2 页起无表头！</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 单页孤立解析会让第 2 页沦为“无列名孤儿数字”。</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 状态机检测 `Page N 底部表格未闭合 + Page N+1 顶部列数相同`，</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  自动继承第 N 页 `<thead>` 多级表头并合并为单一完整 HTML 表！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 确定性会计恒等式验算（Accounting Sum Check）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 任何 OCR/VLM 在密集财务表上都有 1%~4% 概率把 `8` 看成 `3`。</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 解析出 HTML/JSON 表格后，Python 自动对所有“小计/合计/总计”行</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  执行横向与纵向加总校验 (`sum(items) == total_row`)；</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">• 若发现差额立即对不平单元格 4K 超分重读，不平率压至 0.1%！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 381 合成标定算例 (independently_reproduced=false)</text>
</svg>
