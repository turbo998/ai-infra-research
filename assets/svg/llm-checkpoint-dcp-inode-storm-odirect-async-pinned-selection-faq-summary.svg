<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 230 · 10,000-GPU CHECKPOINT MDS INODE STORM, PAGE-CACHE OOM &amp; PYTORCH DCP ASYNCSTAGER FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">10TB Checkpoint Save: 485s MDS Inode Storm &amp; OOM vs 0.048s Pinned AsyncStager + O_DIRECT</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: MDS Inode Storm &amp; Page-Cache OOM</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1: Writing per-tensor files (`327,680` files) into 1 directory</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  locks up the parallel filesystem Metadata Server (MDS) for 485 s! ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: Standard buffered `write()` floods 640 GB/node into Linux</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  OS Page Cache (`Cached`), waking `kswapd` &amp; triggering OOM Killer ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">GPU Stall: 485.0 s (Tier 1) / 68.5 s + Host OOM (Tier 2) ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Dynamic cudaHostRegister in Default async_save Still Stalls 3.74 s</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Persistent Pinned AsyncStager + O_DIRECT</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Consolidates all shards per unique DP rank into 1 `.distcp` file</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Caches persistent Pinned Staging Buffers (`WeakIdKeyDictionary`),</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  slashing GPU-blocking D2H copy from 3.74 s down to 0.048 s (48 ms)!</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Uses `O_DIRECT` / `POSIX_FADV_DONTNEED` (0 GB Page Cache bloat)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">GPU Stall: 0.048 s (48 ms, 10,104x Faster) | 0 GB Cache Bloat 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Two-Phase Atomic Directory Rename Eliminates Half-Written Checkpoints</text>
</svg>
