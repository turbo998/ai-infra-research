<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad410" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad410" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad410)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级人力资源智能招聘（Talent Acquisition）、防算法歧视审计与员工政策 Copilot 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">4.5万名员工 / 月均18万份简历 · 传统ATS关键词硬筛 vs. 未脱敏简历直喂LLM vs. PII盲化单Prompt vs. ESCO技能图谱 + 二元胜任力量表 + EEOC公平性门禁 + RBAC政策库</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">93.6% NDCG · 0% Bias</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 传统 ATS 布尔关键词硬匹配</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">漏掉同义高潜人才，HR 人工海选极慢</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 写 K8s 却没写 Kubernetes 字面词即被误杀</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 招聘专员手工翻阅海量简历，月成本 $152K</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">推荐人选匹配质量(NDCG@10): 58.0% ✕</text>
  <text x="54" y="334" fill="#fde68a" font-size="13" font-weight="700">EEOC 四分之五歧视违规率: 6.5%</text>
  <text x="54" y="358" fill="#fde68a" font-size="12.5">跨国/跨职级薪酬政策越权泄露: 4.2%</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月招聘筛选与HR服务成本: $152,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统字面匹配，高潜人才误杀率高</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 未脱敏原始简历直喂 LLM 打总分</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">姓名/性别/年龄隐性偏见，触犯 EU AI Act</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 相同履历仅换姓名/毕业年份打分漂移达 24.8%</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 无法解释拒绝理由，违反欧盟高风险 AI 法案</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">推荐人选匹配质量(NDCG@10): 74.5%</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">EEOC 四分之五歧视违规率: 24.8% (违法 ✕)</text>
  <text x="346" y="358" fill="#fca5a5" font-size="12.5">跨国/跨职级薪酬政策越权泄露: 12.6% ✕</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月招聘与合规罚单风险成本: $215,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁将未脱敏简历直喂大模型黑盒打分</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: PII 盲化简历 + 笼统单 Prompt</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">隐去了姓名，但社团/空窗期代理偏见仍在</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 女子大学/社团等代理特征仍触发 7.4% 偏差</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 1~100 主观总分缺少逐项技能证据锚点</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">推荐人选匹配质量(NDCG@10): 81.2%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">EEOC 四分之五歧视违规率: 7.4% ✕</text>
  <text x="638" y="358" fill="#fde68a" font-size="12.5">跨国/跨职级薪酬政策越权泄露: 3.1%</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月招聘筛选与HR服务成本: $68,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：内部初筛参考，难以通过外部独立合规审计</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad410)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 技能图谱+二元量表+EEOC门禁 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">代理特征全盲 + ESCO本体 + 二元证据量表</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 剥离姓名/学校/毕业年，归一至 ESCO 技能图谱</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 二元胜任力量表 + EEOC 4/5门禁 + Workday RBAC</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">推荐人选匹配质量(NDCG@10): 93.6% 🏆</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">EEOC 歧视违规率: 0.0% 🏆 (通过LL144审计)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">跨职级政策越权泄露: 0.0% 🏆 (Workday RBAC)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月招聘与HR服务总成本: $23,000 (-84.9% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：跨国企业全球招聘、HR共享中心(HRSSC)</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业级 HR 智能体架构师铁律（Proxy-Blind Skill Graph + Binary Rubric + EEOC Audit Pattern）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 招聘属于欧盟 AI 法案（EU AI Act Annex III）高风险领域：必须彻底剥离姓名、性别、年龄、毕业年份与学校光环等代理特征，禁止 1~100 黑盒总分，改用带项目证据引用的二元胜任力量表。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 员工政策 Copilot 必须前置绑定 Workday/SuccessFactors 属性级权限（法域/法人实体/职级 Band/工时制）过滤 · Provenance: synthetic + anonymized_reported</text>
</svg>
