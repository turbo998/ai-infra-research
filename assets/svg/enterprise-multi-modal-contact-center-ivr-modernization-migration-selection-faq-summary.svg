  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">LEGACY CONTACT CENTER DTMF IVR TO AI VOICE AGENT MIGRATION ARCHITECTURE (R500)</text>
