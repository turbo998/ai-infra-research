  <rect x="40" y="138" width="545" height="445" rx="14" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="65" y="174" fill="#f87171" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">⛔ Legacy IVR &amp; Naive Migration Traps (Tiers 1–3)</text>
  <text x="65" y="210" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 1 Legacy 5-Level `DTMF` Menu ('Press 1, Press 2'):</text>
  <text x="80" y="234" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Only 28% containment; 24.5% of callers mash '0' or hang up ($1.42M/mo)</text>
  <text x="65" y="270" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 2 'Big-Bang' 100% Pure Voice LLM (No DTMF Keypad):</text>
  <text x="80" y="294" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Spoken card numbers violate PCI-DSS (0%) &amp; fail 18% in noisy streets</text>
  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 3 Half-Duplex `VXML &lt;record&gt;` HTTP Webhook Bridge:</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">WAV upload/download adds 2,880ms awkward silence after every turn</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="85" y="430" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">5,000,000 Inbound Calls/Mo Contact Center Pain:</text>
  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Tier 1 Legacy DTMF Self-Service Containment: 28.0%</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Tier 2 Pure Voice PCI-DSS Card Compliance: 0.0%</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Tier 3 VXML Webhook Turnaround P95: 2,880 ms</text>

  <rect x="615" y="138" width="545" height="445" rx="14" fill="#0f292a" stroke="url(#accent500)" stroke-width="2"/>
  <text x="640" y="174" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">🏆 Tier 4: Strangler-Fig SBC + Hybrid DTMF + Streaming</text>
  <text x="640" y="210" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">1. `SIP REC` Shadow Forking -&gt; Per-Intent Canary (`10%-&gt;85%`)</text>
  <text x="655" y="232" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Validates AI on forked RTP audio before live cutover; &lt;50ms SIP fallback</text>
  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. Hybrid `Voice + RFC 4733 Out-of-Band DTMF` PCI Vault</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Masks keypad tones at SBC edge so zero card/PIN digits enter LLM logs</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. Full-Duplex `SIP-to-WebRTC` (`580ms`) + `SIP UUI` Screen-Pop</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Streams 20ms RTP frames &amp; passes `session_guid` to human CTI desktop</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (5,000,000 Calls / Month):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Self-Service Containment Rate: 84.5% (up from 28.0% Tier 1)</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Caller Hangup Abandonment Rate: 4.2% (down from 24.5%)</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• PCI-DSS Compliance: 100.0% | Turnaround P95: 580 ms</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly 5M-Call Contact Center TCO: $410,000 / mo (-71.1%)</text>
