<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad380" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad380" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad380)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级大模型评测 (LLM-as-a-Judge)、LLMOps 门禁与影子回放灰度发布架构选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：二值化原子量表裁判 + CI/CD 黄金门禁 + 生产影子回放，将发版回归拦截率从 38.0% 提至 98.6%，专家Kappa一致性达 0.91</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 380 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 人工 Excel 盲测抽检</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 改完 Prompt 人工肉眼看 20 条样例</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 典型“提示词打地鼠”（修A坏B）</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 回归缺陷捕获率：仅 38.0% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 单次发版验证周期：120 小时(5天) ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 62% 隐性退化直接漏到生产环境 ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$22,000 (纯人工QA工时) ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：不敢升级底座模型、不敢动提示词</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">每次发布都靠产品经理熬夜肉眼看表格</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 无校准 1~5 分制大模型裁判</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 直接让大模型给回答打 1~5 分</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 严重啰嗦偏好 (越长分越高) + 打4分扎堆</text>
  <text x="332" y="212" fill="#fde68a" font-size="12" font-weight="700">• 回归缺陷捕获率：68.5%</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 专家一致性 Kappa：仅 0.56 ✕</text>
  <text x="332" y="252" fill="#fde68a" font-size="12">• 每次全跑顶配裁判模型 Token 极贵</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$14,800 (高裁判API账单) ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">反模式：大模型根本分不清 3 分和 4 分</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">同一个回答跑三次打出 3、4、5 三个分</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 代码断言+二值原子量表</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• Promptfoo / DeepEval / Ragas 框架</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 70%确定性断言 + 30%二值 Yes/No 清单</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 回归缺陷捕获率：91.2% ✅</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 专家一致性 Kappa：0.86 ✅ (+0.30)</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 单次发版周期：22 分钟 (0.37h) ✅</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$2,900 (省 80.4%) ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：标准 Git PR 离线回归测试基线</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：离线黄金集无法覆盖生产新长尾</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: CI门禁+影子回放+飞轮 🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• PR 500条黄金集门禁 + 5%生产影子回放</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 回归缺陷捕获率：98.6% 🏆 (+60.6pts)</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 专家一致性 Kappa：0.91 🏆 (正反消偏)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 发版周期：18 分钟 🏆 (快 400x)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 生产点踩坏例脱敏自动回流黄金集</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$3,400 (省 77.0%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级多应用 LLMOps 持续交付终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">换模型/改Prompt 18分钟全自动定生死</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么“让大模型打 1~5 分”是伪科学？企业级 LLM-as-a-Judge 必须遵循的三大工程铁律</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad380)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 废除 1~5 分制，改用“二值化原子检查表 (Binary Rubric)”</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 严禁问裁判模型“请给这段回答打 1 到 5 分”（全打 4 分）！</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 拆解为 4~5 个正交的 `Yes/No (0或1)` 原子问题：</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  ①是否引用了检索原文？②是否提及违禁竞品？③数字是否一致？</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 人类专家与裁判模型的一致性 Kappa 直接从 0.56 飙升至 0.91！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 能用确定性代码断言的（70%），绝不调大模型裁判</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• JSON Schema 合法性、工具名与参数类型、必含关键词、</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  正则禁词、响应字数与延迟上限，100% 用 Python 断言 (`0ms/$0`)。</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 仅对忠实度 (Faithfulness) 与语气得体度调用微调 8B/14B 裁判，</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 并开启双盲位置交换 (Position Swap) 消除先后顺序偏见！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 生产影子流量回放 (Shadow Replay) 与坏例飞轮</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 当升级底座模型（如切到 DeepSeek-V3 或新微调版本）时，</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 网关异步镜像 5% 真实线上请求至候选模型（对用户不可见），</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  对比新旧模型在真实业务分布上的忠实度、延迟与工具准确率，</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">• 达标后才切金丝雀流量，实现 98.6% 线上零事故平滑升级！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 380 合成标定算例 (independently_reproduced=false)</text>
</svg>
