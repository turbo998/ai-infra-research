<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad71" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad71" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad71)" rx="16"/>
  <rect x="24" y="20" width="1232" height="86" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="54" fill="url(#accentGrad71)" font-size="22" font-weight="800">Round 71 · 企业级大模型可观测性、OpenTelemetry GenAI 与尾部自适应异常抽样选型一图流</text>
  <text x="44" y="84" fill="#94A3B8" font-size="14">月均 5,000 万次 RAG/Agent 请求 (12K Prompt) · OTel GenAI + ClickHouse ZSTD + 尾部异常必采 (Synthetic Calibrated · independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <g transform="translate(24, 124)">
    <!-- Tier 1 -->
    <rect x="0" y="0" width="296" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FCA5A5" font-size="15" font-weight="700">Tier 1 · 原始 JSON 写 ES ✕</text>
    <text x="16" y="56" fill="#CBD5E1" font-size="12.5">12K 全文倒排索引 + 无自动质检</text>
    <line x1="16" y1="70" x2="280" y2="70" stroke="#334155"/>
    <text x="16" y="98" fill="#94A3B8" font-size="12">静默故障检出率：</text>
    <text x="165" y="98" fill="#EF4444" font-size="15" font-weight="800">4.2% (仅靠投诉 ✕)</text>
    <text x="16" y="128" fill="#94A3B8" font-size="12">主链路延迟开销：</text>
    <text x="165" y="128" fill="#FCA5A5" font-size="14" font-weight="700">+8.5 ms</text>
    <text x="16" y="158" fill="#94A3B8" font-size="12">送审裁判流量占比：</text>
    <text x="165" y="158" fill="#FCA5A5" font-size="14" font-weight="700">0.0% (盲人摸象)</text>
    <text x="16" y="188" fill="#94A3B8" font-size="12">PII 隐私泄露暴露率：</text>
    <text x="165" y="188" fill="#EF4444" font-size="14" font-weight="800">100.0% (明文裸奔 ✕)</text>
    <text x="16" y="218" fill="#94A3B8" font-size="12">5000万次月总成本：</text>
    <text x="165" y="218" fill="#EF4444" font-size="14" font-weight="800">$48,000 / mo ✕</text>
    <rect x="16" y="244" width="264" height="48" rx="8" fill="#2D1622"/>
    <text x="26" y="264" fill="#FDA4AF" font-size="11.5" font-weight="600">痛点：ES 倒排索引将 12K Prompt 存储放大</text>
    <text x="26" y="282" fill="#FDA4AF" font-size="11.5">3~4 倍，且对 HTTP 200 的幻觉完全失明！</text>

    <!-- Tier 2 -->
    <rect x="312" y="0" width="296" height="310" rx="12" fill="#1E2230" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="328" y="32" fill="#FCD34D" font-size="15" font-weight="700">Tier 2 · 100% 同步阻塞裁判 ✕</text>
    <text x="328" y="56" fill="#CBD5E1" font-size="12.5">每笔响应前同步跑 8B/70B Judge</text>
    <line x1="328" y1="70" x2="592" y2="70" stroke="#334155"/>
    <text x="328" y="98" fill="#94A3B8" font-size="12">静默故障检出率：</text>
    <text x="477" y="98" fill="#FCD34D" font-size="14" font-weight="700">97.2%</text>
    <text x="328" y="128" fill="#94A3B8" font-size="12">主链路延迟开销：</text>
    <text x="477" y="128" fill="#EF4444" font-size="15" font-weight="800">+640.0 ms (卡死 ✕)</text>
    <text x="328" y="158" fill="#94A3B8" font-size="12">送审裁判流量占比：</text>
    <text x="477" y="158" fill="#F59E0B" font-size="14" font-weight="700">100.0% (96.5%白烧)</text>
    <text x="328" y="188" fill="#94A3B8" font-size="12">PII 隐私泄露暴露率：</text>
    <text x="477" y="188" fill="#FBBF24" font-size="14" font-weight="700">18.5%</text>
    <text x="328" y="218" fill="#94A3B8" font-size="12">5000万次月总成本：</text>
    <text x="477" y="218" fill="#EF4444" font-size="14" font-weight="800">$82,000 / mo ✕</text>
    <rect x="328" y="244" width="264" height="48" rx="8" fill="#2E2418"/>
    <text x="338" y="264" fill="#FDE68A" font-size="11.5" font-weight="600">痛点：主链路多等 640ms，且在 96.5% 正常</text>
    <text x="338" y="282" fill="#FDE68A" font-size="11.5">流量上白烧一套裁判 GPU 集群！</text>

    <!-- Tier 3 -->
    <rect x="624" y="0" width="296" height="310" rx="12" fill="#132A3E" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="640" y="32" fill="#7DD3FC" font-size="15" font-weight="700">Tier 3 · OTel + 5% 随机抽样 ⚠️</text>
    <text x="640" y="56" fill="#CBD5E1" font-size="12.5">ClickHouse ZSTD + 头部 5% 抛硬币</text>
    <line x1="640" y1="70" x2="904" y2="70" stroke="#334155"/>
    <text x="640" y="98" fill="#94A3B8" font-size="12">静默故障检出率：</text>
    <text x="789" y="98" fill="#FBBF24" font-size="15" font-weight="800">18.5% (漏81.5% ✕)</text>
    <text x="640" y="128" fill="#94A3B8" font-size="12">主链路延迟开销：</text>
    <text x="789" y="128" fill="#38BDF8" font-size="14" font-weight="700">+0.3 ms (异步 ✅)</text>
    <text x="640" y="158" fill="#94A3B8" font-size="12">送审裁判流量占比：</text>
    <text x="789" y="158" fill="#7DD3FC" font-size="14" font-weight="700">5.0% (均匀盲抽)</text>
    <text x="640" y="188" fill="#94A3B8" font-size="12">PII 隐私泄露暴露率：</text>
    <text x="789" y="188" fill="#7DD3FC" font-size="14" font-weight="700">1.2% (纯正则)</text>
    <text x="640" y="218" fill="#94A3B8" font-size="12">5000万次月总成本：</text>
    <text x="789" y="218" fill="#38BDF8" font-size="14" font-weight="700">$4,900 / mo ✅</text>
    <rect x="640" y="244" width="264" height="48" rx="8" fill="#0C2238"/>
    <text x="650" y="264" fill="#BAE6FD" font-size="11.5" font-weight="600">局限：ClickHouse ZSTD 省了 12 倍存储，但</text>
    <text x="650" y="282" fill="#BAE6FD" font-size="11.5">5% 随机抛硬币把绝大多数罕见故障漏掉了。</text>

    <!-- Tier 4 -->
    <rect x="936" y="0" width="296" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.2"/>
    <text x="952" y="32" fill="#6EE7B7" font-size="15" font-weight="800">Tier 4 · OTel + 尾部异常采样 🏆</text>
    <text x="952" y="56" fill="#D1FAE5" font-size="12.5">高熵/低Rerank/重试 100%必采 + PII脱敏</text>
    <line x1="952" y1="70" x2="1216" y2="70" stroke="#334155"/>
    <text x="952" y="98" fill="#A7F3D0" font-size="12">静默故障检出率：</text>
    <text x="1101" y="98" fill="#34D399" font-size="15" font-weight="800">94.6% (+76.1pt 🏆)</text>
    <text x="952" y="128" fill="#A7F3D0" font-size="12">主链路延迟开销：</text>
    <text x="1101" y="128" fill="#34D399" font-size="15" font-weight="800">+0.2 ms (零阻塞 🏆)</text>
    <text x="952" y="158" fill="#A7F3D0" font-size="12">送审裁判流量占比：</text>
    <text x="1101" y="158" fill="#6EE7B7" font-size="14" font-weight="800">6.8% (精准靶向 🏆)</text>
    <text x="952" y="188" fill="#A7F3D0" font-size="12">PII 隐私泄露暴露率：</text>
    <text x="1101" y="188" fill="#34D399" font-size="14" font-weight="800">0.0% (零信任脱敏 🏆)</text>
    <text x="952" y="218" fill="#A7F3D0" font-size="12">5000万次月总成本：</text>
    <text x="1101" y="218" fill="#6EE7B7" font-size="13.5" font-weight="800">$5,800 / mo (-92.9%)</text>
    <rect x="952" y="244" width="264" height="48" rx="8" fill="#062019"/>
    <text x="962" y="264" fill="#A7F3D0" font-size="11.5" font-weight="700">终极形态：仅评 6.8% 流量抓出 94.6% 幻觉</text>
    <text x="962" y="282" fill="#A7F3D0" font-size="11.5">+ ClickHouse ZSTD 12x 压缩 + GLiNER 脱敏</text>
  </g>

  <!-- Bottom Visual Comparison -->
  <rect x="24" y="454" width="1232" height="302" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="486" fill="#F8FAFC" font-size="16" font-weight="700">核心定量洞察：静默故障捕获率 vs. 月度监控与质检成本 &amp; 尾部自适应抽样 (Tail-Based Sampling) 原理</text>

  <!-- Left Bar Chart -->
  <g transform="translate(44, 508)">
    <text x="0" y="20" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 1 原始 JSON 写 ES (4.2% 故障召回 · 月耗 $48,000 存储爆炸 ✕)</text>
    <rect x="0" y="28" width="24" height="22" rx="4" fill="#EF4444"/>
    <text x="34" y="44" fill="#FCA5A5" font-size="11" font-weight="700">仅 4.2% 检出 · $48k/月</text>

    <text x="0" y="76" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 3 OTel + 5% 均匀随机抽样 (18.5% 故障召回 · 漏掉 81.5% 罕见故障 ✕)</text>
    <rect x="0" y="84" width="104" height="22" rx="4" fill="#38BDF8"/>
    <text x="114" y="100" fill="#7DD3FC" font-size="11" font-weight="700">18.5% 检出 · $4.9k/月</text>

    <text x="0" y="132" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 2 100% 同步阻塞 LLM 裁判 (97.2% 故障召回 · 延迟 +640ms · 月烧 $82,000 ✕)</text>
    <rect x="0" y="140" width="544" height="22" rx="4" fill="#F59E0B"/>

    <text x="0" y="188" fill="#6EE7B7" font-size="12.5" font-weight="700">Tier 4 OTel + 尾部异常必采 (94.6% 故障召回 · 仅评 6.8% 流量 · +0.2ms · $5,800/月 🏆)</text>
    <rect x="0" y="196" width="530" height="22" rx="4" fill="#10B981"/>
  </g>

  <!-- Right Architecture Box -->
  <g transform="translate(650, 504)">
    <rect x="0" y="0" width="584" height="232" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="18" y="28" fill="#38BDF8" font-size="14" font-weight="700">第一性原理：为什么尾部自适应抽样能用 6.8% 算力抓出 94.6% 幻觉？</text>
    <text x="18" y="56" fill="#E2E8F0" font-size="12.5">① 四大零成本内生置信度触发器 (4.8% 异常流量 100% 必送异步裁判)：</text>
    <text x="32" y="76" fill="#94A3B8" font-size="12">• avg_logprob_entropy &gt; 1.4 (模型生成词概率平坦，正在心虚瞎猜)</text>
    <text x="32" y="94" fill="#94A3B8" font-size="12">• top1_rerank_score &lt; 0.45 (RAG 检索无强相关依据，极易无中生有)</text>
    <text x="32" y="112" fill="#94A3B8" font-size="12">• tool_retry_count &gt;= 1 或 TTFT 超标 或 用户点击“点踩 (Thumbs Down)”</text>
    <text x="18" y="142" fill="#6EE7B7" font-size="12.5">② ClickHouse ZSTD(3) 列存消除 12K Prompt 存储税 (压缩 12x~18x)：</text>
    <text x="32" y="162" fill="#94A3B8" font-size="12">利用共享 System Prompt 与工具 Schema 的跨行重复性，月存储费从 $48k 压至 $1.8k。</text>
    <text x="18" y="192" fill="#FCD34D" font-size="12.5">③ Collector 流式 PII 伪名化脱敏 (Presidio + GLiNER ONNX &lt;3ms)：</text>
    <text x="32" y="212" fill="#94A3B8" font-size="12">落盘与送审前将姓名/卡号替换为 &lt;PERSON_1&gt;，兼顾 0.0% 泄露与指代排障！</text>
  </g>
</svg>
