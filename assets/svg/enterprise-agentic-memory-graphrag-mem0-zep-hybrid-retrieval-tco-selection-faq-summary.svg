<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#C084FC" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级 Agent 长期记忆与知识图谱 (GraphRAG / Agentic Memory) 选型：GraphRAG vs. LightRAG vs. Mem0/Zep</text>
  <text x="52" y="94" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="15">告别 64K 全量历史硬塞与纯向量断裂：Mem0/Zep 双时态记忆图谱 + LightRAG 增量双层图 + 智能查询路由</text>

  <!-- Left: Three Memory & Graph Pitfalls -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么“全塞长上下文”、“纯向量 RAG”和“重型 GraphRAG”都踩坑？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 A (Tier 1)：每轮对话硬塞 64K 原始历史 vs. 纯切片向量 (Tier 2)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 硬塞 64K 历史：月烧 $19.2 万且新旧事实冲突导致模型“中间迷失”准确率仅 74.2%</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 纯向量切片：无法回答跨文档多跳关联与全局归纳问题（准确率暴跌至 52.4%）！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 陷阱 B (Tier 3)：无差别对所有请求跑重型 Community Map-Reduce</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 原版 GraphRAG 建索引 Token 成本是向量库的 55 倍，且每次新增文档需重跑 Leiden 聚类</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Global Map-Reduce 单次查询扫遍社区摘要耗达 28.5K Tokens，延迟高达 3,450 ms！</text>

  <!-- Right: Hybrid Mem0/Zep + LightRAG + Vector Router -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 企业级分层记忆与知识图谱三引擎协同架构 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 用户跨会话长期记忆：`Mem0 / Zep (Graphiti)` 双时态实体记忆图</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">后台异步提取用户偏好与状态演进（标记 `t_valid / t_invalid` 自动淘汰过期事实），省 92.8% Token！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 企业知识库双层图索引：`LightRAG` (实体节点 + 关系边向量化)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">用 1 跳子图扩展替代昂贵的社区 Map-Reduce，支持文档秒级增量追加，建库成本降 85%！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 意图自适应查询路由：75% 局部事实走 Vector+BM25 / 25% 多跳走图谱</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">兼顾 265ms 丝滑响应、91.5% 多跳/时序准确率与 $34,500/月 极致性价比！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 四档 Agent 记忆与知识检索架构对比（月均 120 万次对话 · 1 万份合同知识库）</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">记忆与知识图谱方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单轮消耗 Prompt</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">检索+首字 P95</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">多跳/时序准确率</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">离线建图成本</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度总成本 (TCO)</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 全量 64K 历史上下文每轮硬塞 (Full-History Stuffing)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">64,000 tok ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">2,480 ms ✕</text>
  <text x="790" y="524" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">74.2% (时序混乱)</text>
  <text x="950" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$0</text>
  <text x="1110" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$192,000/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 纯切片向量检索 (Standard Chunk Vector RAG)</text>
  <text x="450" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">3,200 tok</text>
  <text x="620" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">185 ms</text>
  <text x="790" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">52.4% ✕ (多跳断裂)</text>
  <text x="950" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$450</text>
  <text x="1110" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$24,000/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 重型全社区 Map-Reduce GraphRAG (全量请求)</text>
  <text x="450" y="612" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">28,500 tok ✕</text>
  <text x="620" y="612" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">3,450 ms ✕</text>
  <text x="790" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">90.8%</text>
  <text x="950" y="612" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">$24,800 ✕</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$118,000/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): Mem0/Zep 时序记忆 + LightRAG 双层图 + 混合路由</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">4,600 tok (-92.8%)</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">265 ms (-89%) ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">91.5% ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$3,800 ✓</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$34,500/mo (-82%)</text>
</svg>
