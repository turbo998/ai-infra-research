<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad401" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad401" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad401)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级联络中心 100% 全量语音质检（Contact Center QA）与合规审计架构选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">Round 401 · 100万通通话/月 (500万分钟) · 2%人工抽检 vs. 原生音频大模型 vs. 100% 70B全评 vs. 双声道 Whisper-Turbo + 声学韵律 + 8B/70B (85/15) 级联</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">96.4% Recall · -95.2% Cost</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 2% 人工抽检 + 关键词正则</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">98% 录音成为盲区，角色常搞混</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 仅抽检 2% 通话，变体违规话术全漏</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 单声道混音无法区分客服与客户发言</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">违规召回率: 14.2% (漏掉85%+ ✕)</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">说话人归属准确率: 72.0% ✕</text>
  <text x="54" y="358" fill="#94a3b8" font-size="12.5">质检报警延迟: 72.0 小时 (3天滞后)</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月总成本 (人工): $42,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统小微客服，严禁金融合规审计</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 100% 原生音频多模态 LLM</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">音频 Token 极贵，抢话易串音</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 500万分钟音频直传旗舰多模态模型</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 双方同时抢话时难以精准分离角色</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">违规召回率: 86.5%</text>
  <text x="346" y="334" fill="#fde68a" font-size="13" font-weight="700">说话人归属准确率: 88.4% ✕</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">质检报警延迟: 0.25 小时 (15分钟)</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月总成本: $112,000 / 月 (天价 ✕)</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：极小规模声纹情绪验证 PoC</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 双声道 Whisper + 100% 70B</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">物理声道分轨，但纯文本漏静音</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 左声道坐席/右声道客户，归属达99.2%</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 100% 通话全跑 70B，且丢失冷场静音</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">违规召回率: 93.8% ✅</text>
  <text x="638" y="334" fill="#7dd3fc" font-size="13" font-weight="700">说话人归属准确率: 99.2% ✅</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">质检报警延迟: 0.50 小时 (30分钟)</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月总成本: $28,500 / 月 (-74.6%)</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：中型呼叫中心批处理质检</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad401)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 双声道+韵律+8B/70B级联 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">声学标签注入 + 85/15 二元路由</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 双声道物理分轨 + [冷场/抢话/咆哮]标签</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• 8B 初筛全量通话，仅 15% 异常升 70B</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">违规召回率: 96.4% 🏆 (+82.2pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">说话人归属准确率: 99.6% 🏆</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">质检报警延迟: 0.08 小时 (5分钟 🏆)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月总成本: $5,400 / 月 (-95.2% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">★ 金融催收/电销/客服 100% 合规质检首选</text>

  <!-- Bottom Bar -->
  <rect x="24" y="556" width="1152" height="100" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="586" fill="#38bdf8" font-size="15" font-weight="700">💡 联络中心 AI 架构师黄金法则：物理双声道（Stereo SIP）消除角色串音 + 声学非语言事件标签 + 8B/70B 级联</text>
  <text x="46" y="612" fill="#cbd5e1" font-size="13">1. 拒绝单声道算法分离（Diarization）：从 SIP 话机录音源头启用双声道（Ch0=坐席，Ch1=客户），说话人归属准确率从 88.4% 跃升至 99.6%！</text>
  <text x="46" y="636" fill="#94a3b8" font-size="12.5">2. 补齐纯文本丢失的声学信号：将 [&gt;8s冷场静音]、[抢话打断]、[分贝骤升] 注入转写流，8B 模型过滤 85% 正常通话，月成本从 $11.2万 降至 $5,400！</text>
</svg>
