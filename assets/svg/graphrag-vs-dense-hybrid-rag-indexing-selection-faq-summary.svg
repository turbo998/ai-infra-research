<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🕸️ 企业级大模型知识检索与多跳推理 RAG 选型一图流总结（Naive vs. Hybrid vs. Contextual vs. LazyGraphRAG）</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">50,000 篇政企文档 (1,000 万 Tokens) · 单跳精确检索 + 跨段指代消解 + 全局多跳归纳 · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="970" y="42" width="278" height="38" rx="19" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1109" y="66" fill="#ddd6fe" font-size="13" font-weight="700" text-anchor="middle">Round 30 · RAG &amp; LazyGraphRAG</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 传统 512-Token 硬切片</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">固定窗口暴力截断 + 纯稠密向量 Top-K</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单跳事实准确率: <tspan fill="#f87171" font-weight="700">71.5% (漏专有名词)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 跨段代词指代准确率: <tspan fill="#f87171" font-weight="700">54.0% (丢失主语 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 全局/多跳推理准确率: <tspan fill="#f87171" font-weight="700">24.5% (彻底盲人摸象 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 查询 P95 延迟: <tspan fill="#cbd5e1" font-weight="700">145.0 ms</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10M 建库成本: <tspan fill="#cbd5e1" font-weight="700">$14.0 (综合得分 50.0%)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么硬切片在企业文档必翻车？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">切出来的碎片写着“该公司三季度利润下跌</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">14%”，但公司名字在 3 页前的标题里！向</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">量根本召回不到，综合准确率仅 50.0%！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 混合检索 BM25+Dense+精排</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">双路 RRF 召回 + Cross-Encoder Rerank</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单跳事实准确率: <tspan fill="#34d399" font-weight="700">91.2% ✅</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 跨段代词指代准确率: <tspan fill="#fbbf24" font-weight="700">68.5% (仍缺篇章背景)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 全局/多跳推理准确率: <tspan fill="#f87171" font-weight="700">38.5% (无法跨文档归纳 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 查询 P95 延迟: <tspan fill="#cbd5e1" font-weight="700">235.0 ms</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10M 建库成本: <tspan fill="#34d399" font-weight="700">$18.0 (综合得分 66.1%)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 常规 FAQ 够用，但过不了两关：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">BM25 救回了合同编号精确匹配，但依然解</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">决不了“跨页表格主语丢失”和“总结全库</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">5 万份报告的共性合规风险”两大难题。</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: Contextual / Late-Chunking</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">前缀缓存背景题头 / 先长文编码后池化</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单跳事实准确率: <tspan fill="#34d399" font-weight="700">94.6% 🏆</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 跨段代词指代准确率: <tspan fill="#34d399" font-weight="700">91.8% (+37.8pt 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 全局/多跳推理准确率: <tspan fill="#fbbf24" font-weight="700">52.0%</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 查询 P95 延迟: <tspan fill="#34d399" font-weight="700">245.0 ms ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10M 建库成本: <tspan fill="#60a5fa" font-weight="700">$42.0 (综合得分 79.5%)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 单文档/跨段问答的黄金底座：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">在每个切片头部注入 50 词全篇背景摘要</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">(利用 KV Prefix Cache 降本 90%)，彻底治</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">愈“代词指代不明”，跨段准确率飙至 91.8%！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: LazyGraphRAG + 混合路由 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">名词概念共现图 + 查询期按需子图归纳</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单跳事实准确率: <tspan fill="#34d399" font-weight="700">94.8% 🏆</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 跨段代词指代准确率: <tspan fill="#34d399" font-weight="700">92.4% 🏆</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 全局/多跳推理准确率: <tspan fill="#34d399" font-weight="700">88.5% (+50.0pt 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 查询 P95 延迟: <tspan fill="#6ee7b7" font-weight="700">680.0 ms (比老版快 6.2x)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10M 建库成本: <tspan fill="#34d399" font-weight="700">$38.0 (比老版省 99.2% 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 破解初代 GraphRAG 破产账单：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">建库期零大模型调用（靠 NLP 抽概念共现</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">图 + Leiden 聚类），仅在用户真问全局问</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">题时按需归纳命中子图，建库费直降 99.2%！</text>
  </g>

  <!-- Bottom Left: Eager Full GraphRAG vs LazyGraphRAG -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">💰 初代 Eager GraphRAG vs. 新一代 LazyGraphRAG / LightRAG 账单对比</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">为什么企业落地的第一代 GraphRAG 都死在了“离线建库 Token 账单”和“日更重算”上？</text>

    <rect x="20" y="70" width="560" height="105" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="34" y="94" fill="#fca5a5" font-size="13.5" font-weight="800">✕ 初代 Eager Full GraphRAG (离线全量调用 LLM 抽三元组 + 预写所有社区报告)</text>
    <text x="34" y="118" fill="#cbd5e1" font-size="12">• 1,000 万 Token 建库成本：<tspan fill="#f87171" font-weight="800">$4,850.00</tspan>（是普通向量建库 $14 的 <tspan fill="#f87171" font-weight="800">346 倍</tspan>！）</text>
    <text x="34" y="140" fill="#cbd5e1" font-size="12">• 查询 P95 延迟：<tspan fill="#f87171" font-weight="700">4,200 ms</tspan>（遍历上百个社区摘要做 Map-Reduce）</text>
    <text x="34" y="160" fill="#cbd5e1" font-size="12">• 增量更新灾难：每天新增 1,500 篇文档会改变 Leiden 社区边界，被迫高频全量重算！</text>

    <rect x="20" y="190" width="560" height="115" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="34" y="214" fill="#6ee7b7" font-size="13.5" font-weight="800">🏆 新一代 LazyGraphRAG / LightRAG (离线轻量化概念图 + 查询期按需子图合成)</text>
    <text x="34" y="238" fill="#cbd5e1" font-size="12">• 1,000 万 Token 建库成本：仅 <tspan fill="#34d399" font-weight="800">$38.00</tspan>（立省 <tspan fill="#34d399" font-weight="800">-99.2%</tspan>，与普通混合检索同量级！）</text>
    <text x="34" y="260" fill="#cbd5e1" font-size="12">• 全局多跳推理准确率：<tspan fill="#34d399" font-weight="800">88.5%</tspan>（媲美老版 89.4%，比 Hybrid RAG 38.5% 暴涨 <tspan fill="#34d399" font-weight="800">+50.0pt</tspan>）</text>
    <text x="34" y="282" fill="#cbd5e1" font-size="12">• 查询 P95 延迟：<tspan fill="#34d399" font-weight="800">680.0 ms</tspan>（快 <tspan fill="#34d399" font-weight="800">6.18x</tspan>），增量文档 <tspan fill="#34d399" font-weight="800">3.2 秒</tspan> 动态追加节点与边！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师企业级 RAG 分级路由与避坑黄金法则</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 80% 单跳精确查条款 / 查参数 → 路由至 Tier 3 (Contextual Hybrid RAG)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 用 `Contextual Retrieval`（Prefix Cache 注入 50 词文档背景头）或 `Late-Chunking`（先跑</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  8K 长文 Embedding 再按句池化）配合 `BM25 + Reranker`，245ms 拿到 94.6% 精确率！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 20% 跨文档全局归纳 / 多跳关系链 → 路由至 Tier 4 (LazyGraphRAG)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 前置轻量意图分类器识别“宏观总结 / 关联追查”请求，触发 LazyGraphRAG 优先搜索</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  （Best-First Search）沿概念共现子图扩展并动态提炼社区结论，准确率从 38.5% 跃升至 88.5%！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 生产防踩坑铁律：严禁对所有简单查询无脑跑全量 GraphRAG</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 查“某合同违约金比例是多少”属于单点事实（Local Query），跑图遍历纯属浪费延迟；</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">• 必须坚持 **“意图路由分流：80% Local 走 Tier 3 (245ms) + 20% Global 走 Tier 4 (680ms)”**！</text>
  </g>
</svg>
