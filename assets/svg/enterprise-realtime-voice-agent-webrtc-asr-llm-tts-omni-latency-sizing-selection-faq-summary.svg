<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业实时全双工语音对话 Agent (WebRTC ASR+LLM+TTS vs. Omni 端到端语音) 延迟与算力选型 (#466)</text>
  <text x="28" y="58" class="sub">攻克 &lt;250ms 人类自然会话首包音频延迟 (TTFA) 红线：WebRTC 边缘 SFU + 语义 VAD + 4-Token 微块流式 TTS + L40S/H200 异构配比</text>

  <!-- Left Panel: TTFA Latency Waterfall Breakdown -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么传统 REST/WS 级联语音助手总有“2 秒尴尬沉默”？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 传统回合制级联 (Batch VAD + ASR + 整句 LLM + 整段 TTS = 2,035ms ✕)</text>
  <text x="56" y="164" class="mono">• 静音阈值 VAD: 650ms + Batch ASR: 420ms + LLM TTFT: 380ms</text>
  <text x="56" y="184" class="mono">• 攒齐整句再调 TTS: 490ms + TCP/WS 抖动重传: 95ms -&gt; 总计 2.04 秒！</text>
  <text x="56" y="202" class="txt" fill="#cbd5e1">用户插话打断 (Barge-in) 延迟高达 680ms，机器继续自顾自播报引爆投诉。</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ WebRTC 全双工异构流水线 vs. 原生 Omni 语音大模型 (&lt; 250ms TTFA 🏆)</text>
  <text x="56" y="268" class="mono">• WebRTC 异构级联 (Tier 3): 语义 VAD(85) + 流式ASR(38) + LLM(54)</text>
  <text x="56" y="288" class="mono">  + 4-Token微块TTS(36) + WebRTC UDP(22) = 235ms TTFA ($0.068/通话小时)</text>
  <text x="56" y="308" class="mono">• 原生 Omni 12.5Hz 音频 Token (Tier 4): 端到端 178ms TTFA (情绪/副语言直出)</text>

  <!-- Right Panel: 4 Voice Agent Architecture Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种企业语音 Agent 架构定量对标 (P99 TTFA vs. 单机并发 vs. 通话成本)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 传统 REST/WS 回合制级联 (静音 VAD + 整句 TTS)</text>
  <text x="638" y="158" class="mono">• P99 TTFA: 2,035ms ✕ | 打断延迟: 680ms | 8卡并发: 96路 ($0.42/hr)</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: WebSocket 标点分句流式级联 (按逗号/句号切分送 TTS)</text>
  <text x="638" y="214" class="mono">• P99 TTFA: 840ms ✕ | 打断延迟: 210ms | 8卡并发: 240路 ($0.18/hr)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#34d399">Tier 3: WebRTC 全双工异构池 (2x L40S ASR/TTS + 6x H200 LLM) (企业客服主力 🏆)</text>
  <text x="638" y="270" class="mono">• P99 TTFA: 235ms 🏆 | 打断: 28ms | 8卡并发: 640路 ($0.068/hr, 省 83.8%)</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#38bdf8"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#93c5fd">Tier 4: 原生端到端 Speech-to-Speech Omni (12.5Hz 音频 Token)</text>
  <text x="638" y="326" class="mono">• P99 TTFA: 178ms 🏆 | 打断: 18ms | 8卡并发: 480路 ($0.092/hr, 高情商陪练)</text>

  <!-- Bottom Panel: End-to-End Voice Pipeline & Sizing Formulas -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 实时语音 Agent 端到端流水线与异构 GPU 容量手算公式 (TTFA &amp; Duplex Sizer)</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">Step 1: 首包音频延迟 (TTFA) 分解公式</text>
  <text x="58" y="464" class="mono">• TTFA = T_VAD + T_ASR_final + T_LLM_TTFT</text>
  <text x="58" y="484" class="mono">         + k_chunk * TPOT + T_TTS_1st + T_RTP</text>
  <text x="58" y="506" class="txt">• 关键突破 1: 投机式预热 Prefill (Speculative</text>
  <text x="58" y="526" class="txt">  Turn-Taking)，在用户尾音前提前编码前缀 KV！</text>
  <text x="58" y="548" class="txt">• 关键突破 2: Dual-Stream 4-Token 微块 TTS，</text>
  <text x="58" y="568" class="txt">  无需等逗号，LLM 吐出第 4 个词即刻合成首包音频！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">Step 2: 异构算力解耦配比 (L40S vs. H200)</text>
  <text x="436" y="464" class="mono">• ASR (Conformer) + TTS (Flow-Matching):</text>
  <text x="436" y="484" class="mono">  小参数高算密 -&gt; 跑在低成本 L40S/L4 卡上</text>
  <text x="436" y="506" class="mono">• LLM (70B FP8): 访存密集 -&gt; 跑在 H200 上</text>
  <text x="436" y="528" class="mono">• 黄金配比: 1 张 L40S (ASR) : 1 张 L40S (TTS)</text>
  <text x="436" y="548" class="mono">            : 6 张 H200 (LLM, 支撑 640 并发通话)</text>
  <text x="436" y="572" class="txt" fill="#34d399">避免把小模型塞进昂贵 H200 浪费 4.8 TB/s HBM！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">Step 3: 28ms 极速打断 (Barge-in) 控制面</text>
  <text x="814" y="464" class="mono">• 边缘 WebRTC SFU 检测到人声 (&gt;15ms):</text>
  <text x="814" y="484" class="mono">  1) 立即清空下行 RTP 音频发送缓冲区 (0ms)</text>
  <text x="814" y="504" class="mono">  2) 向 TTS 与 LLM 发送 gRPC Cancel 信号</text>
  <text x="814" y="524" class="mono">  3) 根据已播放音频时间戳截断 LLM KV Cache</text>
  <text x="814" y="546" class="txt" fill="#fde68a">解决“屏幕上显示已生成完，但用户只听到前半句”</text>
  <text x="814" y="566" class="txt" fill="#fde68a">导致的上下文记忆错乱（Context Desync）！</text>
</svg>
