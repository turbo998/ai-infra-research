<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 212 · GPU REGISTER SPILLING (STL/LDL), OCCUPANCY &amp; HOPPER SETMAXNREG REALLOCATION FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="800">65,536 Regs/SM Budget: 265 TFLOPS Local-Memory Spill vs 785 TFLOPS setmaxnreg (40 Producer / 232 Consumer)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Register Spilling &amp; maxrregcount Trap</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Each SM has 65,536 registers (max 255 regs/thread hard ceiling)</text>
  <text x="70" y="252" fill="#E2E8F0" font-size="15" fill="#E2E8F0">• For a 384-thread CTA, uniform cap is 65,536 / 384 = 168 regs/thread!</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1: Needing 232 regs spills 64 regs to HBM "Local Memory" ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: Forcing --maxrregcount=128 spills 368 B/thread (310 TFLOPS) ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Sustained Throughput: 265 – 310 TFLOPS | Spill: 256–368 B</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">"Local Memory" (STL/LDL) Is Actually Off-Chip HBM + L1/L2 Cache!</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: Hopper/Blackwell PTX setmaxnreg Donation</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• 128 Producer TMA threads only need 40 regs/thread!</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Producer calls `setmaxnreg.dec.sync.aligned.u32 40` (-16,384 regs)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• 256 Consumer WGMMA threads call `setmaxnreg.inc.sync.aligned.u32 232`</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Total: 128*40 + 256*232 = 64,512 &lt;= 65,536 Regs/SM (0 B Spill!)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Sustained Throughput: 785 TFLOPS (2.96x) | Spill: 0 Bytes 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Powers FA3 &amp; CUTLASS 3.x Ping-Pong / Cooperative Warp-Group Kernels</text>
</svg>
