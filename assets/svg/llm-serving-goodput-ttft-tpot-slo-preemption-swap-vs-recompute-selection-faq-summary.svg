  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• `TPOT` inflates to `68 ms` (`&gt; 50 ms` SLA), failing `86%` of requests!</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
