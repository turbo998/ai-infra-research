  <text x="65" y="330" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Tier 3 Single-Frame `CLIP` Embedding Only (No OCR/VLM):</text>
  <text x="80" y="354" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Cannot read dense slide text or distinguish temporal action order</text>
  <rect x="65" y="395" width="495" height="160" rx="10" fill="#0f172a" stroke="#334155"/>
