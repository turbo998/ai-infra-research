  <text x="640" y="266" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">2. Time-Aligned Tri-Modal Index (`Whisper + OCR + SigLIP`)</text>
  <text x="655" y="288" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Fuses spoken ASR, screen-share slide OCR &amp; visual vectors</text>
  <text x="640" y="322" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">3. Selective 8-Frame Temporal VLM (`Qwen2.5-VL / Video AI`)</text>
  <text x="655" y="344" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="14">Captures temporal action sequence on motion windows (`94.5%` IoU)</text>

  <rect x="640" y="382" width="495" height="175" rx="10" fill="#09191f" stroke="#10b981"/>
  <text x="660" y="414" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">Verified Production Metrics (50,000 Video Hours / Month):</text>
  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Visual &amp; Screen-Share Event Recall: 96.8% (vs 18% ASR-only)</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Temporal Timestamp Localization IoU: 94.5%</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Cost per 1,000 Hours Indexed: $920 (vs $14,400 1-FPS VLM)</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly 50K-Hour Video RAG TCO: $46,000 / mo (-93.6%)</text>
