  <rect width="1200" height="630" fill="url(#bg491)"/>
  <rect x="40" y="32" width="1120" height="86" rx="14" fill="#1e293b" stroke="#334155"/>
  <text x="65" y="68" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ENTERPRISE MULTIMODAL VIDEO UNDERSTANDING, KEYFRAME INDEXING &amp; RAG (R491)</text>
  <text x="65" y="98" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800">pHash Scene Deduplication (-95% Frames) + Whisper/OCR/SigLIP + 8-Frame VLM: -93.6% Cost</text>

