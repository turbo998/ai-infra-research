  <text x="85" y="460" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Audio-Only Visual Event Recall: 18.0%</text>
  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• 1-FPS Frontier VLM Cost / 1,000 Hours: $14,400</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Monthly 50K-Hour Video Indexing Bill: $720,000 / mo</text>

