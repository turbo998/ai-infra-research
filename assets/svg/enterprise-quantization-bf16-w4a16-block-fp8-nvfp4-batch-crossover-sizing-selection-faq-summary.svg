<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">大模型生产量化选型：BF16 vs. W4A16 (AWQ/Marlin) vs. 细粒度 Block-FP8 vs. Blackwell NVFP4 指南 (#457)</text>
  <text x="28" y="58" class="sub">为什么低并发 (B&lt;=16) 下 W4A16 比 FP8 快，而高并发 (B&gt;=32) 下 W8A8 FP8 却反超 W4A16 达 1.6 倍？</text>

  <!-- Left Panel: W4A16 vs W8A8 FP8 Batch=32 Crossover Mechanics -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 架构师必懂的“Batch=32 反转定律”：W4A16 (仅权重量化) vs. W8A8 (FP8)</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fde68a">💡 为什么不能一刀切认为“4-bit 一定比 8-bit 快”？</text>
  <text x="56" y="164" class="mono">• W4A16 (AWQ/GPTQ): 权重存成 4-bit (省一半 HBM 带宽)，但激活仍是 16-bit！</text>
  <text x="56" y="184" class="mono">  计算前必须在寄存器里做 INT4-&gt;FP16 反量化，调用的依然是慢一倍的 FP16 TensorCore</text>
  <text x="56" y="202" class="txt">• 当并发 B&gt;=32 迈入算力受限区时，反量化开销+FP16 算力上限导致 W4A16 吞吐封顶！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" fill="#34d399" class="txt" font-weight="700">🏆 四大量化精度黄金选型边界 (按硬件代际与并发水位拍板)</text>
  <text x="56" y="272" class="mono">• 1. 单卡显存受限且低并发 (B&lt;=16, 或无 FP8 的 A100): 选 W4A16 AWQ + Marlin 内核</text>
  <text x="56" y="292" class="mono">• 2. Hopper/Ada (H100/H200/L40S) 高并发主力 (B&gt;=32): 首选细粒度 Block-FP8 (W8A8)</text>
  <text x="56" y="312" class="txt">• 3. Blackwell (B200/GB200): 硬件原生 W4A4 NVFP4 兼具 4-bit 带宽与 2x FP8 算力 🏆</text>

  <!-- Right Panel: 4 Quantization Formats Comparison -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四档量化精度实测对标 (70B 模型 · 低并发 B=8 vs. 高并发 B=64)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 未量化 BF16 (W16A16 · 70B 权重占 140GB · 算力与带宽双重减半)</text>
  <text x="638" y="158" class="mono">• 精度保持: 100.0% | B=8 TPOT: 26.4ms ✕ | B=64 吞吐: 1,120 tok/s ($0.44/1M)</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: W4A16 AWQ/Marlin (权重 38.5GB · 低并发极快，高并发受限于 FP16 算力)</text>
  <text x="638" y="214" class="mono">• 精度保持: 98.2% | B=8 TPOT: 9.8ms (低并发冠军) | B=64 吞吐: 1,540 tok/s ($0.31/1M)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#34d399">Tier 3: 细粒度 Block-FP8 (W8A8 · 权重 70GB · Hopper H100/H200 高并发王牌 🏆)</text>
  <text x="638" y="270" class="mono">• 精度保持: 99.8% (无损) 🏆 | B=8 TPOT: 13.6ms | B=64 吞吐: 2,480 tok/s ($0.19/1M) 🏆</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 硬件原生 NVFP4 (W4A4 · 权重 36.8GB · Blackwell B200/GB200 终局 🏆)</text>
  <text x="638" y="326" class="mono">• 精度保持: 99.3% 🏆 | B=8 TPOT: 6.4ms 🏆 | B=64 吞吐: 4,820 tok/s ($0.11/1M)!</text>

  <!-- Bottom Panel: Per-Tensor FP8 vs Block-FP8 & NVFP4 Microscaling -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 为什么粗粒度 Per-Tensor FP8 会在推理模型上掉点？细粒度 Block-FP8 与 NVFP4 原理</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 粗粒度 Per-Tensor FP8 的离群值崩塌</text>
  <text x="56" y="464" class="mono">• 大模型激活特征存在少数幅度达 100x 的离群通道</text>
  <text x="56" y="484" class="mono">  (Outlier Channels)</text>
  <text x="56" y="504" class="mono">• 若整张矩阵共用 1 个缩放因子 (Per-Tensor)，正常</text>
  <text x="56" y="524" class="mono">  小数值会被全部挤压下溢归零，数学/代码掉点 4.5%！</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">生产严禁使用未分块的粗粒度 Per-Tensor 动态量化！</text>

  <rect x="418" y="414" width="368" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="432" y="440" class="txt" font-weight="700" fill="#34d399">② DeepSeek 细粒度 Block-FP8 (1x128 &amp; 128x128)</text>
  <text x="432" y="464" class="mono">• 激活按 1x128 连续 Token 组独立计算缩放因子；</text>
  <text x="432" y="484" class="mono">  权重按 128x128 子块独立缩放</text>
  <text x="432" y="504" class="mono">• 将离群值严格隔离在单个 128 元素小微块内</text>
  <text x="432" y="524" class="mono">• 数学 AIME 与代码 LiveCodeBench 保持 99.8% 无损</text>
  <text x="432" y="550" class="txt" fill="#34d399">Hopper (H100/H200) 生产部署的唯一黄金标准 🏆</text>

  <rect x="806" y="414" width="350" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="820" y="440" class="txt" font-weight="700" fill="#d8b4fe">③ Blackwell 硬件原生 NVFP4 (两级微缩放)</text>
  <text x="820" y="464" class="mono">• 每 16 个 E2M1 (4-bit) 元素共享 1 个 FP8 (E4M3)</text>
  <text x="820" y="484" class="mono">  微块缩放因子 + 全局 FP32 二级缩放</text>
  <text x="820" y="504" class="mono">• 第五代 Tensor Core 硬件原生执行 W4A4 乘累加</text>
  <text x="820" y="524" class="mono">  无需像 W4A16 那样软件反量化回 FP16！</text>
  <text x="820" y="550" class="txt" fill="#d8b4fe">单张 B200 即可装下 350B 模型并跑出 2x FP8 吞吐！</text>
</svg>
