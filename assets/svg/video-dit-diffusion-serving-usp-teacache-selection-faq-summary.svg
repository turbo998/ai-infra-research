  <rect width="1280" height="760" fill="url(#bg44)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="310" height="28" rx="14" fill="#311042" stroke="#f472b6" stroke-width="1"/>
  <text x="207" y="63" fill="#fbcfe8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 44 · VIDEO DIT &amp; WORLD MODEL SERVING</text>
  <text x="380" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="800">DiT 视频生成与世界模型多卡并行推理与加速架构选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="14">xDiT USP (CFG×Ulysses) 消除 8,000 次全序列 AllReduce；TeaCache 跳步缓存 + SageAttention-2 将 720p 5s 延迟从 58.4s 压至 6.8s (快 8.59x)</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc44)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="198" height="24" rx="6" fill="#7f1d1d"/>
  <text x="167" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 朴素张量并行 TP=8</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">8,000 次 AllReduce 风暴</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">照搬 LLM TP=8 + 50 步 BF16 全算</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制缺陷：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">每层同步全量 75,600 个时空 Token</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">单视频跨卡传输 3.02 TB 数据 ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 720p 5s 延迟: <tspan fill="#f87171" font-weight="700">58.4 s (单卡 420s) ✕</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 通信耗时占比: <tspan fill="#f87171" font-weight="700">38.5% 阻塞 ✕</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡峰值显存: <tspan fill="#f87171" font-weight="700">64.8 GB / 80 GB ✕</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千条视频成本: <tspan fill="#f87171" font-weight="700">$467.50 / 千条 ✕</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 严禁在长序列 DiT 上用纯 TP=8</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="206" height="24" rx="6" fill="#78350f"/>
  <text x="471" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · CFG=2 + 纯 Ring=4</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">P2P 环状接力注意力</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">正负流切分 + 4 步环状传递 KV 块</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么机内仍非最优？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">P2P 环状分块引入多跳调度气泡，</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">未吃满 NVSwitch 全交叉并发带宽</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 720p 5s 延迟: <tspan fill="#fbbf24" font-weight="700">34.2 s (105.3 条/h)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 通信耗时占比: <tspan fill="#fbbf24" font-weight="700">19.2%</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡峰值显存: <tspan fill="#fbbf24" font-weight="700">38.4 GB / 80 GB</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千条视频成本: <tspan fill="#fbbf24" font-weight="700">$273.50 / 千条</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 仅用于跨机维或头数不足场景</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="214" height="24" rx="6" fill="#0c4a6e"/>
  <text x="775" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · xDiT USP (CFG×Ulysses)</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">All-to-All 注意力头转置</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">CFG=2 × NVLink Ulysses=4 (无损 BF16)</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (通信量立省 4.0x)：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">QKV 按序列切分零通信；Attention</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">前 All-to-All 转置为每卡 10 个独立头</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 720p 5s 延迟: <tspan fill="#38bdf8" font-weight="800">22.6 s (快 2.58x ✅)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 通信耗时占比: <tspan fill="#38bdf8" font-weight="700">7.8% (31.2 GB 显存)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• VBench 画质分: <tspan fill="#38bdf8" font-weight="700">84.3% (100% 无损 ✅)</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千条视频成本: <tspan fill="#38bdf8" font-weight="700">$180.80 (-61.3% ✅)</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 影视级 100% 逐比特无损母带首选</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="234" height="24" rx="6" fill="#064e3b"/>
  <text x="1085" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · USP + TeaCache + SageAttn</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">残差跳步 + INT8/FP8 注意力</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">50步→22步 (56% Skip) + 平滑 INT8/FP8</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (提速 8.59x / 省钱 88.4%)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">TeaCache 跳过中段 28 个相似去噪步；</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">SageAttention-2 均值平滑 INT8/FP8</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 720p 5s 延迟: <tspan fill="#34d399" font-weight="800">6.8 s (快 8.59x 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 节点产能吞吐: <tspan fill="#34d399" font-weight="800">529.4 条/h (24.5GB 显存)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• VBench 画质分: <tspan fill="#34d399" font-weight="700">84.1% (仅 -0.2 pts 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千条视频成本: <tspan fill="#34d399" font-weight="800">$54.40 (省 -88.4% 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 生产级视频生成与世界模型终极答案</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师三大黄金法则：为什么 DiT 必须切序列而非切权重？为什么 TeaCache 与 SageAttention-2 几乎不损画质？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔄 法则 1：当序列 S=75,600 ≫ D=5,120 时，用 Ulysses All-to-All 替代 TP</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• TP=8 在每层做 2 次全序列 AllReduce（单视频 8,000 次 = 3.02 TB 流量）；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• xDiT USP 先用 CFG=2 把正负流分到两组 4 卡，组内用 NVLink All-to-All 将 [S/4, H]</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  转置为 [S, H/4]，通信量锐减 4 倍（7.8%），无损耗时从 58.4s 压至 22.6s！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 法则 2：守护首尾 10% 步数 + Key 均值平滑 (`TeaCache + SageAttention-2`)</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 强制实算前 5 步（构图）与后 5 步（纹理），仅在中段 (Step 6~44) 当时间步嵌入漂移</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  rel_l1 &lt; 0.15 时直接复用上一步 DiT 残差（50步→22步，省 56% 计算）；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 量化前减去每个块内 Key 的通道均值消除离群偏置，INT8 QK^T + FP8 PV 达 6.8s 出片！</text>
</svg>
