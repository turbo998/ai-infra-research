<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad78" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad78" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad78)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad78)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23" font-weight="800">🎯 大模型确定性推理与跨批大小逐比特可复现 (Batch-Invariant 0-ULP Inference) 选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">8×H100 SXM5 ($24/hr) · 70B FP8/BF16 (TP=8) · 4K in / 512 out (temp=0 / seed=42) · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#67e8f9" font-size="13" font-weight="700" text-anchor="middle">Round 78 · Batch-Invariant 0-ULP</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 默认动态连续批处理</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">动态 Split-K GEMM + 动态分块数 FlashDecode</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 跨并发批大小完全一致率: <tspan fill="#f87171" font-weight="700">61.5% (38.5% 漂移 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 最大 Logit 浮点漂移: <tspan fill="#f87171" font-weight="700">14.0 ULP ✕</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• RL 采样-训练策略 KL 偏移: <tspan fill="#f87171" font-weight="700">0.0185 (引发训崩 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 稳态吞吐 / P99 TPOT: <tspan fill="#cbd5e1" font-weight="700">3,420 tok/s · 14.2 ms</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 审计复现失败重跑年损: <tspan fill="#f87171" font-weight="700">$420,000 / yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么 temp=0 还会每次回答不一样？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">当并发从 BS=1 变到 BS=32 时，cuBLAS 自动换</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">Tile、FlashDecode 改变切分块数，浮点加法结合</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">顺序改变导致第 40 个词分叉生成完全不同答案！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 粗暴强锁 BS=1 串行确定性</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">禁用连续批处理 + PyTorch 确定性算法标志</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 跨并发批大小完全一致率: <tspan fill="#fbbf24" font-weight="700">100.0% (0.0 ULP)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 稳态推理吞吐: <tspan fill="#f87171" font-weight="700">285.0 tok/s (暴跌 -91.7% ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• P99 TPOT 排队尾延迟: <tspan fill="#f87171" font-weight="700">96.5 ms (排队崩盘 ✕)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 百万 Token 推理成本: <tspan fill="#f87171" font-weight="700">$23.39 / 1M (贵 12 倍 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 算力闲置浪费折合年损: <tspan fill="#f87171" font-weight="700">$1,480,000 / yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 伪解法：把 8 张 H100 当单线程算盘使！</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">靠设置 max_num_seqs=1 强行让所有请求排队单跑</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">虽然不漂移了，但 GPU Tensor Core 利用率跌破</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">2%，吞吐狂掉 12 倍，完全无法承载生产业务！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: 批大小不变算子库 (单机优选)</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">固定 Split-Size=256 注意力 + 固定 K 维归约树</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 跨并发批大小完全一致率: <tspan fill="#60a5fa" font-weight="700">99.4% (单卡 100% ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 最大 Logit 浮点漂移: <tspan fill="#60a5fa" font-weight="700">0.5 ULP (仅剩多卡 NVLS)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• RL 采样-训练策略 KL 偏移: <tspan fill="#34d399" font-weight="700">0.0004 (降 46 倍 ✅)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 稳态吞吐 / P99 TPOT: <tspan fill="#60a5fa" font-weight="700">3,110 tok/s (90.9% 满血 ✅)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 百万 Token 推理成本: <tspan fill="#60a5fa" font-weight="700">$2.14 / 1M</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 攻克三大算子非确定性根源：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① RMSNorm 每行独立归约；② GEMM 禁用动态</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">Split-K 原子加；③ FlashDecode 改按固定 256</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">词切分 KV，彻底与当前 Batch 内其他请求解耦！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: 全栈 0-ULP 确定性引擎 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">批不变算子 + 固定树 TP 规约 + 请求级 Philox</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 跨并发批大小完全一致率: <tspan fill="#34d399" font-weight="700">100.0% (绝对逐比特一致 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 最大 Logit 浮点漂移: <tspan fill="#34d399" font-weight="700">0.0 ULP (零漂移 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• RL 采样-训练策略 KL 偏移: <tspan fill="#34d399" font-weight="700">0.0000 (True On-Policy 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 稳态吞吐 / P99 TPOT: <tspan fill="#34d399" font-weight="700">3,180 tok/s (93% 满血 · 快 11.2x 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 审计重跑年损: <tspan fill="#34d399" font-weight="700">$2.10/1M · $0 年损 (省 $1.48M 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 金融合规审计 / 单元测试 / RL 采样终极解：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">补齐最后两块拼图：固定顺序 TP=8 Ring/Tree</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">AllReduce（规避 NVSwitch 异步到达抖动）+ 绑定</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">请求槽位的独立 Philox RNG，保住 93% 满血吞吐！</text>
  </g>

  <!-- Bottom Left: Batch Size Perturbation Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📊 并发批大小扰动测试：同一 Prompt 在不同负载下的完全一致率 (%)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">对比默认引擎 (Tier 1) 与全栈批不变引擎 (Tier 4) 在 BS=1→64 及 Prefix Cache 命中切换下的一致率</text>

    <!-- Row 1 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">BS=1 vs. BS=4 (触发 GEMV→MMA)</text>
    <rect x="240" y="74" width="290" height="14" rx="3" fill="#10b981"/>
    <text x="538" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">100.0% 🏆</text>
    <rect x="240" y="92" width="226" height="14" rx="3" fill="#f59e0b"/>
    <text x="474" y="104" fill="#fde68a" font-size="11.5" font-weight="700">78.2% (Tier 1)</text>

    <!-- Row 2 -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">BS=1 vs. BS=32 (Split-KV 分块变化)</text>
    <rect x="240" y="124" width="290" height="14" rx="3" fill="#10b981"/>
    <text x="538" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">100.0% 🏆</text>
    <rect x="240" y="142" width="185" height="14" rx="3" fill="#ef4444"/>
    <text x="433" y="154" fill="#f87171" font-size="11.5" font-weight="700">64.0% (Tier 1 ✕)</text>

    <!-- Row 3 -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">BS=1 vs. BS=64 + Chunked Prefill</text>
    <rect x="240" y="174" width="290" height="14" rx="3" fill="#10b981"/>
    <text x="538" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">100.0% 🏆</text>
    <rect x="240" y="192" width="153" height="14" rx="3" fill="#ef4444"/>
    <text x="401" y="204" fill="#f87171" font-size="11.5" font-weight="700">52.8% (Tier 1 ✕)</text>

    <!-- Row 4 -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">Prefix Cache 0% vs. 80% 命中</text>
    <rect x="240" y="224" width="290" height="14" rx="3" fill="#10b981"/>
    <text x="538" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">100.0% 🏆</text>
    <rect x="240" y="242" width="178" height="14" rx="3" fill="#ef4444"/>
    <text x="426" y="254" fill="#f87171" font-size="11.5" font-weight="700">61.5% (Tier 1 ✕)</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#67e8f9" font-size="11.5" font-weight="700">💡 第一性原理：GPU 单个算子本来是确定性的；所谓“随机漂移”全是动态 Batch 改变了规约树形状！</text>
  </g>

  <!-- Bottom Right: 3 Rules for Batch-Invariant Engineering -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 消灭 LLM 推理非确定性的三大底层重构铁律 (Thinking Machines 法则)</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：FlashAttention / PagedAttention 必须锁死 `Split-Size` 而非 `Split-Count`</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 默认引擎根据当前空闲 SM 数量动态决定把一条序列切成几份（BS=1 切 8 份，BS=32 切 2 份）！</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">• 改为**固定每 256 个 KV Token 切 1 块**并按固定二叉树合并 log-sum-exp，彻底与并发请求数解耦！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：矩阵乘 (GEMM) 禁用动态 Split-K 并固定 M-Tile 累加树</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 禁止 cuBLAS 在小 Batch (M&lt;8) 自动切 GEMV/Split-K 而在大 Batch 切 128×128 Tensor Core Tile；</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">• 统一采用固定 K 维切块顺序的批不变 Triton/CUTLASS GEMM，仅牺牲 ~7% 吞吐换取 0-ULP 稳定！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fde68a" font-size="13" font-weight="800">3️⃣ 铁律三：多卡 TP 固定规约顺序 + 采样器绑定 Per-Request Philox 随机数流</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 关闭全局共享 RNG（否则隔壁请求多采样 1 个词就会冲乱你的随机数偏移），为每个 request_id</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  分配独立 `(seed, token_pos)` Philox 计数器，并锁定 TP AllReduce 树累加次序！</text>
  </g>
</svg>
