  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：如何设计 Rail-Optimized 轨道 ASN 编号与 WCMP 非对称自愈？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：RFC 5549 无编号 BGP + RFC 7938 轨道防环 ASN 规划</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 所有 Leaf-Spine 物理口不配 IPv4，直接用 `neighbor ethX interface remote-as external`；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 同一平面 Spine 共享相同 ASN (如 65200)，每台 Leaf 分配独立 ASN (65001..65064)，</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  利用 BGP AS_PATH 防环机制天然杜绝 Spine→Leaf→Spine 绕行与路径狩猎 (Path Hunting)！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：BGP Link-Bandwidth 扩展团体字 (WCMP) + 15ms 硬件 BFD</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 当某台 Spine 往目标 Leaf 断掉 1 根链路（剩 3 根，其余 Spine 有 4 根）时，开启</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  `bgp additional-paths` 与 `link-bandwidth` 后，上游自动按 3:4:4:4 权重分流 (WCMP)；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 配合交换机 ASIC 硬件 `3×5ms BFD`，18.5ms 切走坏链路，AllReduce 带宽保持 96.4% 🏆！</text>
</svg>
