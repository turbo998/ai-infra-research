<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#563 企业级大模型 PD 分离架构、跨节点 KV Cache RDMA 带宽手算与 Dynamo / Mooncake / vLLM / SGLang 选型</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Prefill 计算受限 vs. Decode 显存带宽受限解耦 · 逐层异步 GPUDirect RDMA 掩盖 94.2% KV 传输 · P99 TPOT 压至 13.4ms (快 5.10x) · 立省 50% GPU</text>

  <!-- Left: Colocated Interference -->
  <rect x="24" y="110" width="330" height="270" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="42" y="138" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">❌ 方案 A/B：同卡混部 (Continuous / Chunked)</text>
  <rect x="42" y="154" width="294" height="56" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="54" y="176" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Prefill 大块插入 (ISL=16K, AI ≈ 4096)</text>
  <text x="54" y="196" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">霸占 100% Tensor Core 达 180ms~850ms</text>
  <rect x="42" y="222" width="294" height="56" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="54" y="244" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">同卡在途 Decode 批次 (B=64, AI ≈ 64)</text>
  <text x="54" y="264" fill="#fde68a" font-family="Segoe UI, Arial, sans-serif" font-size="12">被阻塞卡顿! P99 ITL 飙升至 29.6ms~68.4ms</text>
  <rect x="42" y="292" width="294" height="72" rx="8" fill="#450a0a"/>
  <text x="54" y="316" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">混部代价：为保 P99 TPOT &lt;= 18ms</text>
  <text x="54" y="336" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">单卡并发被迫压低至 B&lt;=16，需 24~32 张 H200</text>
  <text x="54" y="354" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12">SLA 达标 Goodput 仅 58.2% ~ 81.5%</text>

  <!-- Center: PD Disaggregation + Layer-wise RDMA -->
  <rect x="372" y="110" width="366" height="270" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="390" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">🏆 方案 C：PD 分离 + 逐层异步 RDMA KV 传输</text>
  <rect x="390" y="154" width="152" height="90" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="402" y="176" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Prefill 池 (8x H200)</text>
  <text x="402" y="196" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• TP=4 满载压榨算力</text>
  <text x="402" y="214" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Radix 前缀命中 70%</text>
  <text x="402" y="232" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 算完第 L 层即刻发 KV</text>

  <rect x="568" y="154" width="152" height="90" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="580" y="176" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">Decode 池 (8x H200)</text>
  <text x="580" y="196" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 零 Prefill 抖动干扰</text>
  <text x="580" y="214" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 拉满大 Batch + CUDA 图</text>
  <text x="580" y="232" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• P99 TPOT 稳在 13.4ms</text>

  <rect x="390" y="256" width="330" height="48" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="404" y="276" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">400G GPUDirect RDMA (NIXL / Mooncake 零拷贝)</text>
  <text x="404" y="295" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">16K FP8 KV (0.79GB 增量) 暴露耗时从 17.1ms 压至 1.0ms</text>

  <rect x="390" y="314" width="330" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="404" y="335" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">SLA Goodput: 99.3% (+41.1 pts) · 仅需 16 张 H200</text>
  <text x="404" y="353" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">有效成本 $0.112 / 1M Tokens (较混部降低 3.39x)</text>

  <!-- Right: KV Cache & Engine Selection -->
  <rect x="756" y="110" width="300" height="270" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="774" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">📐 KV 跨网传输手算 &amp; 四栈对比</text>
  <rect x="774" y="152" width="264" height="96" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="172" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="bold">每 Token KV 字节数对比：</text>
  <text x="786" y="192" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">• 70B GQA-8 BF16: 327.7 KB/Tok</text>
  <text x="786" y="210" fill="#38bdf8" font-family="Consolas, monospace" font-size="11.5">• 70B GQA-8 FP8 : 163.8 KB/Tok</text>
  <text x="786" y="228" fill="#34d399" font-family="Consolas, monospace" font-size="11.5">• 671B MLA FP8  :  35.1 KB/Tok</text>
  <text x="786" y="242" fill="#94a3b8" font-family="Consolas, monospace" font-size="10.5">(MLA 跨网带宽需求直降 4.66 倍!)</text>

  <rect x="774" y="258" width="264" height="106" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="278" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">四大开源 PD 架构底座分工：</text>
  <text x="786" y="297" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. NVIDIA Dynamo + NIXL：异构零拷贝</text>
  <text x="786" y="315" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. Mooncake：全局 DRAM/RDMA KV 池</text>
  <text x="786" y="333" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. SGLang PD：RadixCache + DeepEP</text>
  <text x="786" y="351" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">4. vLLM V1 Disagg：LMCache 多模生态</text>

  <!-- Bottom KPI Bar -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 架构师黄金决策边界（何时上 PD 分离 vs. 何时保持 Chunked Prefill 混部）：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 保持同池混部 (Chunked Prefill)：集群 &lt; 16 张 GPU，或无 RDMA 网络（仅 25G/100G TCP），或短输入交互 (ISL &lt; 2,048 Tokens)。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• 强制启用 PD 分离：集群 &gt;= 16 张 GPU + 具备 100G~400G RoCEv2/IB RDMA + 平均输入 ISL &gt;= 4,096 + 严苛 P99 TPOT (&lt;= 20ms) SLA。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 黄金 P:D 配比公式：P:D ≈ T_prefill_work / T_decode_work —— 长文 RAG (16K:512) 选 2P:1D ~ 3P:1D；深度推理 R1 (2K:4K) 选 1P:3D ~ 1P:4D。</text>
</svg>
