  <text x="46" y="586" fill="#38bdf8" font-size="15" font-weight="700">💡 金融支付风控 AI 架构师黄金法则：冷温热三层物理隔离（Hot 14ms GNN / Warm 0.4% 8B Step-Up / Cold 70B Graph-SAR）</text>
