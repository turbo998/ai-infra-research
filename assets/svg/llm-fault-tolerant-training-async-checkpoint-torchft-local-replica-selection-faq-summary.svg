<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#EF4444" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">万卡大模型训练容错与秒级自愈选型：Async Checkpoint vs. 内存邻接备份 vs. TorchFT 弹性隔离</text>
  <text x="52" y="94" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="15">攻克 8,192 卡集群每 3.2 小时一次故障魔咒：0.4s 内存双缓冲 + 邻接节点 P2P 状态副本 + TorchFT 6.5秒无停机踢除坏组</text>

  <!-- Left: Young-Daly Checkpoint Math & Stop-The-World Trap -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么 8,192 卡集群用传统停机重拉会白烧一半预算？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 灾难算例 (Tier 1)：MTBF = 3.2 小时 + 全员连坐停机重启</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 1 张卡掉线导致 8,192 张卡全部销毁重拉：回滚 30m + 重建 NCCL/读盘 28m + 同步写盘 14m</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 有效训练时间比 (ETTR) 跌至 48.5%！30 天训练白白烧掉 $850 万无效 GPU 账单！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📐 最优 Checkpoint 周期公式 (Young-Daly 定律)：</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• τ_opt = sqrt(2 × δ_stall × MTBF) —— 只有把 GPU 写盘阻塞 δ_stall 从 840s 压到 0.8s，</text>
  <text x="64" y="360" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 才能把快照间隔从 60 分钟缩短到 5~10 分钟，将故障回滚损失压到极致！</text>

  <!-- Right: 3-Layer Sub-10s Self-Healing Architecture -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 万卡集群 6.5 秒自愈三板斧 (Async DCP + P2P Ring + TorchFT)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 两阶段异步内存快照 (PyTorch Async DCP / Orbax, 阻塞 0.4~0.8s)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">GPU 仅停顿 0.6s 将分片状态 D2H 拷入本地锁页内存，随即继续训练；后台线程异步刷盘</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 邻接节点内存环冗余 (In-Memory P2P Ring Checkpoint)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">通过 RDMA 将优化器分片备份一份到相邻节点内存；热备节点顶上时 10 秒从邻居内存恢复，免读磁盘！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ TorchFT / ReCycle 局部故障组隔离：坏 1 台机绝不连坐全集群！</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Lighthouse 协调器 6.5s 剔除故障 DP/FSDP 副本组，存活 98% 节点零中断继续跑，新节点热追赶加入！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 8,192 卡 H200 预训练（MTBF = 3.2 小时 · 30 天周期）四档容错架构对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">训练容错与自愈方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单次快照停顿</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">故障恢复中断</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">有效时间比 (ETTR)</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">30天浪费卡时</text>
  <text x="1110" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">30天浪费算力费</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 同步写共享存储 + 全集群销毁冷重启</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">840.0 s (14m) ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">1,680.0 s (28m) ✕</text>
  <text x="790" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">48.5% ✕</text>
  <text x="960" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14">303.8 万卡时</text>
  <text x="1110" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$8,505,000 ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 异步锁页内存快照 (Async DCP/Orbax) + 热备换机</text>
  <text x="450" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.8 s ✓</text>
  <text x="620" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">180.0 s (3m)</text>
  <text x="790" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">86.2%</text>
  <text x="960" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">81.4 万卡时</text>
  <text x="1110" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$2,279,000</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 邻接节点 P2P 内存环冗余 + 热备秒级拉起</text>
  <text x="450" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.6 s ✓</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">42.0 s ✓</text>
  <text x="790" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">93.8% ✓</text>
  <text x="960" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">36.6 万卡时</text>
  <text x="1110" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$1,024,000</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): TorchFT 局部副本组无停机剔除 + P2P 内存追赶</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.4 s ✓</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">6.5 s (-99.6%) ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">96.8% ✓</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">18.9 万卡时</text>
  <text x="1110" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$528,000 (省 $798万)</text>
