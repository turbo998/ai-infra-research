<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #402 · SINGLE-NODE HGX (H200/B200) VS. MULTI-NODE RDMA VS. RACK SUPERNODE (GB200/GB300 NVL72)</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">单机 8 卡 HGX vs. 多机 RDMA vs. 机柜级超节点（NVL72）选型、液冷边界与 TCO 精算</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">什么时候用 1 台 8xH200 风冷/冷板机足够，什么时候上多机 400G RoCEv2，什么时候必须上 120kW 铜背板 GB200 NVL72？</text>

  <!-- Left Box: Scale-Up Domain Size & MoE EP=72 Advantage -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 为什么 Scale-Up 超节点半径 (8 卡 vs. 72 卡) 决定了 MoE 极限性能？</text>
  <rect x="76" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">HGX H200 (8卡 NVLink4) : Scale-Up 域 = 1.1TB HBM · 900 GB/s/卡 (跨机跌 9x)</text>
  <text x="90" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">HGX B200 (8卡 NVLink5) : Scale-Up 域 = 1.5TB HBM · 1,800 GB/s/卡</text>
  <text x="90" y="260" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">GB200 NVL72 (72卡铜背板): Scale-Up 域 = 13.8TB HBM · 130 TB/s 全互联!</text>
  <text x="76" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 在 8 卡 HGX 上跑 EP=64：必须跨 8 台机器走 400G 光模块 RDMA (50 GB/s/NIC)</text>
  <text x="76" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 在 NVL72 上跑 EP=72：100% 走机柜无源铜缆背板 (1,800 GB/s/卡, 0 光模块!)</text>
  <text x="76" y="346" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 结果：671B/1T+ 深度推理模型单卡达标吞吐暴涨 3.4 倍，TPOT 压至 4.8 ms！</text>

  <!-- Right Box: Datacenter Power, Cooling & Blast Radius -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 机房供电液冷红线 (&gt;45kW 必上 DLC) 与超节点故障爆炸半径治理</text>
  <rect x="634" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">&lt;= 20 kW/柜 (传统机房): 仅能装 1~2 台 8卡 HGX 风冷服务器</text>
  <text x="648" y="242" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">40 ~ 60 kW/柜 (准液冷) : 可装 4 台 8卡 H200/B200 + 400G/800G RoCEv2</text>
  <text x="648" y="260" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">120 ~ 140 kW/柜 (NVL72): 强制要求 CDU 冷板液冷 + 盲插水路 + 整柜成组调度</text>
  <text x="634" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 存量风冷机房红线：切勿强上 NVL72！单台 `8x H200` 或多机 `HGX B200` 最快交付</text>
  <text x="634" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 爆炸半径防控：NVL72 整柜是一个 NVLink 故障域，必须配 N+1 热备机柜与 IMEX 隔离</text>
  <text x="634" y="346" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• Grace CPU NVLink-C2C (900 GB/s)：每柜自带 17TB 极速 LPDDR5X 二级 KV 缓存池！</text>

  <!-- Bottom Scorecard Table -->
  <rect x="56" y="388" width="1088" height="192" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="76" y="418" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">3. 四种智算硬件底座在满血 DeepSeek-671B / 1T MoE 推理上的性能与成本对决</text>
  <line x1="76" y1="430" x2="1124" y2="430" stroke="#334155"/>
  <text x="76" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">硬件底座方案</text>
  <text x="415" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">机柜功耗/散热</text>
  <text x="565" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">P99 TPOT</text>
  <text x="710" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">单卡达标 Goodput</text>
  <text x="905" y="454" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">百万 Token 成本 ($/1M)</text>

  <text x="76" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 1: 双机 16x H100 (80GB) + 普通无调优网络</text>
  <text x="415" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">22 kW 风冷</text>
  <text x="565" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">24.5 ms</text>
  <text x="710" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">920 tok/s/GPU</text>
  <text x="905" y="484" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.58 / 1M</text>

  <text x="76" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 2: 单机 8x H200 (141GB) 紧凑一体机 (零跨机通信)</text>
  <text x="415" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">10.5 kW 风冷 ✓</text>
  <text x="565" y="512" fill="#cbd5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">14.6 ms ✓</text>
  <text x="710" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">1,850 tok/s/GPU ✓</text>
  <text x="905" y="512" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.29 / 1M (存量机房首选)</text>

  <text x="76" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">Tier 3: 多机 32x HGX B200 + 400G/800G RDMA (PD分离 + DeepEP)</text>
  <text x="415" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">48 kW 风液混合</text>
  <text x="565" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">8.4 ms ✓</text>
  <text x="710" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">4,120 tok/s/GPU ✓</text>
  <text x="905" y="540" fill="#93c5fd" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13">$0.19 / 1M</text>

  <text x="76" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Tier 4 (旗舰): GB200 / GB300 NVL72 机柜超节点 (72卡铜背板 EP=72 + NVFP4)</text>
  <text x="415" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">132 kW 冷板液冷</text>
  <text x="565" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">4.8 ms 🏆</text>
  <text x="710" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">7,420 tok/s/GPU (8.1x) 🏆</text>
  <text x="905" y="566" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">$0.12 / 1M (-79.3%) 🏆</text>
</svg>
