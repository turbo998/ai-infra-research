<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg581" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent581" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg581)"/>
  <rect x="30" y="25" width="1140" height="85" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="55" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#f8fafc">#581 Enterprise Real-Time Voice Agent: 290ms Turn-Taking Budget &amp; WebRTC Cascaded vs. Realtime API Sizing</text>
  <text x="55" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#94a3b8">Cloud &amp; AI Solution Architect Guide · Silero VAD (80ms) + Streaming STT (55ms) + LLM TTFT (65ms) + Chunked TTS (65ms) + WebRTC (25ms) · 78% TCO Cut</text>

  <!-- Left Panel: 290ms 5-Stage Waterfall -->
  <rect x="30" y="130" width="555" height="340" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="50" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#38bdf8">1. 290ms P95 Voice-to-Voice Turn-Taking Waterfall</text>

  <rect x="50" y="180" width="140" height="42" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="62" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">1. VAD + Semantic EOU: 80ms</text>

  <rect x="195" y="232" width="95" height="42" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="205" y="257" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7">2. Stream STT: 55ms</text>

  <rect x="295" y="284" width="110" height="42" rx="6" fill="#1e3a8a" stroke="#3b82f6"/>
  <text x="305" y="309" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#93c5fd">3. LLM TTFT: 65ms</text>

  <rect x="410" y="336" width="105" height="42" rx="6" fill="#3b0764" stroke="#a855f7"/>
  <text x="418" y="361" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#d8b4fe">4. 1st-Chunk TTS: 65ms</text>

  <rect x="520" y="388" width="50" height="42" rx="6" fill="#7c2d12" stroke="#f59e0b"/>
  <text x="525" y="413" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#fcd34d">RTP 25ms</text>

  <text x="50" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">Total P95 Voice Turn-Taking = 290ms (vs. 1,450ms HTTP REST Cascade) · Barge-In Stop &lt; 60ms</text>

  <!-- Right Panel: 3-Architecture TCO & Capability Matrix -->
  <rect x="605" y="130" width="565" height="340" rx="12" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <text x="625" y="162" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#10b981">2. Three Voice Agent Architectures (500 Concurrent Calls)</text>

  <rect x="625" y="182" width="525" height="82" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="640" y="205" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#93c5fd">A. Managed Native Realtime API (Azure OpenAI GPT-4o Realtime / Voice Live)</text>
  <text x="640" y="227" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0">• Latency: 240ms P95 · Native Prosody/Emotion · Zero GPU Ops</text>
  <text x="640" y="248" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#fcd34d">• Cost: ~$0.18/min (VAD-trimmed) → $270,000/mo @ 1.5M min (Best &lt; 180K min/mo)</text>

  <rect x="625" y="276" width="525" height="90" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
  <text x="640" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">B. Self-Hosted WebRTC Cascaded (LiveKit + Nova-3/Whisper + vLLM Qwen-32B + CosyVoice2)</text>
  <text x="640" y="322" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0">• Latency: 290ms P95 · 96.8% Tool-Call Accuracy · 100% Pre-TTS Text Compliance Guardrail</text>
  <text x="640" y="343" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#6ee7b7">• Fleet for 500 Calls: 11× L40S (STT/TTS) + 8× H100 (LLM) = $33,400/mo ($0.022/min, -87.8%)</text>

  <rect x="625" y="378" width="525" height="75" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="640" y="401" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#d8b4fe">C. Self-Hosted End-to-End Speech LLM (Qwen2.5-Omni-7B / GLM-4-Voice)</text>
  <text x="640" y="422" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0">• Latency: 230ms P95 · Cost: $0.019/min · Lower Complex ERP Tool-Call Accuracy (84.2%)</text>
  <text x="640" y="441" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#cbd5e1">• Best for emotional companion or low-schema voice triage without strict text redaction</text>

  <!-- Bottom Bar -->
  <rect x="30" y="490" width="1140" height="110" rx="12" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="55" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fcd34d">3. Production Contact Center Sizing Formula (500 Concurrent Calls · 1.5M Minutes/Month)</text>
  <text x="55" y="550" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#e2e8f0">• Active Duty Cycle per Call: 38% User Speaking (STT) + 42% Agent Speaking (TTS) + 1 turn/12s LLM Reasoning (41.7 QPS across 500 calls)</text>
  <text x="55" y="576" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#6ee7b7">• TCO Crossover: Managed Realtime API wins below 180,000 min/month ($32.4k/mo); Self-Hosted LiveKit + L40S/H100 Cascade saves $2.84M/year at 1.5M min/mo.</text>
</svg>
