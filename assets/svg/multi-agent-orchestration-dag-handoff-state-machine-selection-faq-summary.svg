  <text x="40" y="98" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="800">企业级多智能体编排 (Multi-Agent)、并行 StateGraph 与强类型黑板交接选型一图流</text>
  <text x="40" y="124" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Workload: 6-Agent Enterprise Incident Triage &amp; Resolution Workflow (1,000 Runs) · Synthetic Calibrated Model (independently_reproduced=false)</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <rect x="40" y="148" width="288" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
