  <text x="796" y="426" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">✅ 线性合规审批流与断点续跑标准</text>

  <!-- Tier 4 -->
  <rect x="958" y="148" width="282" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.5"/>
  <rect x="974" y="164" width="184" height="24" rx="6" fill="#065F46"/>
  <text x="1066" y="180" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 4 · 并行黑板 DAG (推荐)</text>
  <text x="974" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">并行扇出 + 强类型黑板 + 零跳</text>
  <text x="974" y="236" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="13">销毁私有草稿 + Command 直接交接</text>
  <text x="974" y="272" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 工作流完成率: 93.6% (+35.2pt 🏆)</text>
  <text x="974" y="298" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 死循环卡死率: 0.0% (零死锁 🏆)</text>
  <text x="974" y="324" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 单次消耗词数: 18,500 Tok (省10x 🏆)</text>
  <text x="974" y="350" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 端到端耗时: 5.8 s (快 8.28x 🏆)</text>
  <text x="974" y="376" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800">• 千次成本: $42.00 (省 -92.4% 🏆)</text>
  <rect x="974" y="402" width="250" height="38" rx="8" fill="#064E3B"/>
  <text x="1099" y="426" fill="#ECFDF5" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 企业级生产多智能体唯一黄金标准</text>

  <!-- Bottom Pipeline: 3 Core Mechanisms of Tier 4 -->
  <rect x="40" y="480" width="1200" height="244" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="514" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">🕸️ Tier 4 生产级多智能体三大黄金法则：如何把 48 秒 / 18.5 万词的群聊压缩到 5.8 秒 / 1.85 万词？</text>

  <!-- Step 1 -->
  <rect x="64" y="534" width="366" height="164" rx="10" fill="#1E293B" stroke="#8B5CF6" stroke-width="1.2"/>
  <text x="82" y="562" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 强类型作用域黑板 (Scoped Typed Blackboard)</text>
  <text x="82" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 销毁草稿纸：子 Agent 内部 15K 词排查日志在退出节点时</text>
  <text x="82" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  当场销毁，仅向全局黑板提交 200 词 Pydantic 结构化结论</text>
  <text x="82" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 按需投影：下游节点仅挂载其声明所需的 2.4K 词切片视图</text>
  <text x="82" y="668" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 砍掉 90% 跨角色噪音，单工作流耗词直降 10.0 倍</text>

  <!-- Step 2 -->
  <rect x="450" y="534" width="376" height="164" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="468" y="562" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 并发扇出归约 (Parallel Fan-Out Send API)</text>
  <text x="468" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 告别串行排队：将无相互依赖的 LogAnalyzer、MetricFetcher</text>
  <text x="468" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  与 PolicyChecker 拆分为 3 条并发分支同时执行</text>
  <text x="468" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 通过无锁 Reducer 算子将三路结构化结果原子归并入黑板</text>
  <text x="468" y="668" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">✅ 信息搜集阶段墙钟延迟缩短 3.0 倍</text>

  <!-- Step 3 -->
  <rect x="846" y="534" width="370" height="164" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="864" y="562" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 零跳直接交接 (0-Hop Handoff) + 硬断路器</text>
  <text x="864" y="588" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 砍掉中间商：子 Agent 通过 Command(goto=...) 在 0.1ms 内</text>
  <text x="864" y="612" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  直接唤醒下一跳节点，免去 70B Supervisor 复述传话延迟</text>
  <text x="864" y="636" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 代码条件边强制约束 retry_count &lt; 3，超时自动转人工</text>
  <text x="864" y="668" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">🏆 0.0% 死循环，端到端 5.8s 完成，准确率达 93.6%</text>
</svg>
