  <text x="362" y="272" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 工作流完成准确率: 74.2% (丢14%细节)</text>
  <text x="362" y="298" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 死循环卡死率: 4.2%</text>
  <text x="362" y="324" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单次消耗词数: 112,000 Tokens ✕</text>
  <text x="362" y="350" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 端到端耗时: 31.5 s (串行阻塞 ✕)</text>
  <text x="362" y="376" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 千次运行成本: $336.00 ✕</text>
  <rect x="362" y="402" width="256" height="38" rx="8" fill="#0F172A"/>
  <text x="490" y="426" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">⚠️ 传话筒每跳多费1轮LLM且易失真</text>

  <!-- Tier 3 -->
  <rect x="652" y="148" width="288" height="310" rx="12" fill="#17253B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="668" y="164" width="168" height="24" rx="6" fill="#1E3A8A"/>
  <text x="752" y="180" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">TIER 3 · 串行 StateGraph</text>
  <text x="668" y="212" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">显式有向图状态机 (代码边)</text>
  <text x="668" y="236" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">LangGraph / Temporal 确定性流转</text>
  <text x="668" y="272" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 工作流完成准确率: 86.5% ✅</text>
  <text x="668" y="298" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">• 死循环卡死率: 0.2% ✅</text>
  <text x="668" y="324" fill="#86EFAC" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 单次消耗词数: 38,000 Tokens ✅</text>
  <text x="668" y="350" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 端到端耗时: 14.2 s (纯串行)</text>
  <text x="668" y="376" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• 千次运行成本: $114.00 ✅</text>
