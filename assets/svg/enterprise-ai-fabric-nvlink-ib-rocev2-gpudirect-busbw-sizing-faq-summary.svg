<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 540" width="1080" height="540">
  <rect width="1080" height="540" fill="#0f172a"/>
  <rect x="24" y="20" width="1032" height="72" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="50" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="bold">#565 智算高速互联网络：Scale-Up (NVLink/NVSwitch) vs. Scale-Out (IB/RoCEv2)、GPUDirect 与 busbw 手算</text>
  <text x="44" y="76" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="13">GPUDirect RDMA BAR1 零拷贝提速 4.25x (47.6 vs 11.2 GB/s) · ECN 早于 PFC 水位防死锁 · Rail-Optimized + PXN 省 34.5% 网络 CapEx</text>

  <!-- Left: Scale-Up vs Scale-Out Hierarchy -->
  <rect x="24" y="110" width="340" height="272" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="138" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">① Scale-Up vs. Scale-Out 带宽与延迟量级</text>
  <rect x="42" y="152" width="304" height="52" rx="6" fill="#0f172a" stroke="#10b981"/>
  <text x="52" y="171" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">NVLink 4.0 / 5.0 (机内/NVL72 Scale-Up)</text>
  <text x="52" y="190" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 单向 450~900 GB/s · 延迟 ~0.8 μs · 承载 TP</text>

  <rect x="42" y="212" width="304" height="50" rx="6" fill="#0f172a" stroke="#f59e0b"/>
  <text x="52" y="231" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">PCIe Gen5 x16 (主机通道瓶颈)</text>
  <text x="52" y="250" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 单向仅 64 GB/s (比 NVLink 慢 7~14 倍!)</text>

  <rect x="42" y="270" width="304" height="50" rx="6" fill="#0f172a" stroke="#38bdf8"/>
  <text x="52" y="289" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">InfiniBand NDR/XDR (Scale-Out 极致训练)</text>
  <text x="52" y="308" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 单卡 50/100 GB/s · ~1.5 μs · 原生 Credit + SHARP</text>

  <rect x="42" y="328" width="304" height="44" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="52" y="346" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">AI Ethernet RoCEv2 (Scale-Out 高性价比)</text>
  <text x="52" y="363" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 单卡 50/100 GB/s · ~2.5 μs · PFC+ECN+DCQCN+DLB</text>

  <!-- Center: GPUDirect RDMA Zero-Copy & Lossless Tuning -->
  <rect x="380" y="110" width="360" height="272" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="398" y="138" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">② GPUDirect RDMA 零拷贝 &amp; 无损流控水线</text>
  <rect x="398" y="152" width="324" height="62" rx="8" fill="#450a0a" stroke="#ef4444"/>
  <text x="410" y="172" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">❌ 未开 GPUDirect / 未关 ACS (走 CPU Bounce)</text>
  <text x="410" y="191" fill="#fecaca" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">GPU HBM → Root Complex → Host DRAM → NIC</text>
  <text x="410" y="207" fill="#fca5a5" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">400G 网卡实测跌至 11.2 GB/s (仅 22.4% 线速!)</text>

  <rect x="398" y="222" width="324" height="66" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="410" y="242" fill="#ecfdf5" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">🏆 开启 GPUDirect RDMA (nvidia-peermem + PIX)</text>
  <text x="410" y="261" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">GPU HBM BAR1 ↔ PCIe Switch ↔ ConnectX-7 NIC</text>
  <text x="410" y="278" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">实测 busbw 达 47.6 GB/s (95.2% 线速 · 提速 4.25x!)</text>

  <rect x="398" y="296" width="324" height="74" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="410" y="316" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold">RoCEv2 三道流控防线 (消灭 PFC 暂停风暴)：</text>
  <text x="410" y="335" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. ECN 早标记 (K_min=150KB) 触发 CNP 平滑降速</text>
  <text x="410" y="352" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. PFC 紧急刹车 (XOFF=1.2MB) + 200ms Watchdog</text>
  <text x="410" y="367" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. 动态流片 DLB / 逐包喷洒消除 ECMP 哈希极化</text>

  <!-- Right: Rail-Optimized & algbw/busbw -->
  <rect x="756" y="110" width="300" height="272" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="774" y="138" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="bold">③ Rail 拓扑与 algbw/busbw 公式</text>
  <rect x="774" y="152" width="264" height="104" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="172" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="bold">NCCL 验收必背换算公式：</text>
  <text x="786" y="192" fill="#f8fafc" font-family="Consolas, monospace" font-size="11.5">algbw = S_bytes / time_sec</text>
  <text x="786" y="212" fill="#34d399" font-family="Consolas, monospace" font-size="11.5">AllReduce:</text>
  <text x="786" y="228" fill="#6ee7b7" font-family="Consolas, monospace" font-size="11.5">busbw = algbw × 2(N-1)/N</text>
  <text x="786" y="246" fill="#fbbf24" font-family="Consolas, monospace" font-size="11">AllGather/All2All: × (N-1)/N</text>

  <rect x="774" y="264" width="264" height="106" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="786" y="284" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="bold">Rail-Optimized + NCCL PXN：</text>
  <text x="786" y="303" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 所有节点 GPU i 直连 Rail Leaf i</text>
  <text x="786" y="321" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 跨轨通信先走机内 NVLink 换轨</text>
  <text x="786" y="339" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 90%+ 流量一跳直达，不绕 Spine</text>
  <text x="786" y="357" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="bold">• 节省 34.5% 交换机与光模块 CapEx</text>

  <!-- Bottom Summary -->
  <rect x="24" y="398" width="1032" height="118" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="426" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="bold">📊 架构师网络选型黄金分水岭（InfiniBand NDR/XDR vs. AI 以太网 RoCEv2）：</text>
  <text x="44" y="452" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 选 InfiniBand NDR/XDR：&gt;= 1,024 卡大规模同步预训练、极致跨机 MoE All-to-All，需 SHARPv3 网内归约与微秒级原生 Credit 无损。</text>
  <text x="44" y="476" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="bold">• 选 AI 以太网 RoCEv2 (Rail + ECN/DCQCN + DLB/Spectrum-X)：&lt;= 512~1024 卡后训练、PD 分离推理集群与云原生共池，达 IB 96.3% 性能且省 34.5% TCO。</text>
  <text x="44" y="500" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• 交付验收铁律：400G 网卡 nccl-tests 实测 busbw 必须 &gt;= 45.0 GB/s (&gt;=90% 线速)；若仅 ~11 GB/s 立即排查 nvidia-peermem 与 PCIe ACS！</text>
</svg>
