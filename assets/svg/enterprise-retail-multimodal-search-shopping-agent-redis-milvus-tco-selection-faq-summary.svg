  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级电商多模态搜索、以图搜图与导购 Agent 选型：Azure AI Search vs. Vertex Retail vs. Milvus+Redis (#427)</text>
  <text x="28" y="58" class="sub">为什么在主搜索框同步阻塞调 70B 大模型会让商品瀑布流卡顿 1.8 秒、下单转化率暴跌 24%？用离线 VLM 增广 + 62ms 快慢双轨破局！</text>

  <!-- Left Panel: Synchronous LLM Search Trap vs Offline VLM Enrichment + 62ms Fast/Slow Dual-Track -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 电商搜索生死红线 (P99 &lt;= 100ms)：同步阻塞调 LLM vs. 离线增广 + 快慢双轨</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 致命事故：用户每次搜词都先同步调大模型改写 Query + 读向量库里的静态价格</text>
  <text x="56" y="164" class="mono">• 延迟崩盘：同步调 LLM 改写耗时 850~1,800ms，页面白屏转圈，跳失率飙升 +24%！</text>
  <text x="56" y="184" class="mono">• 价格/库存幻觉：向量索引每晚才更新 1 次，导购 Agent 推荐“已售罄尺码”或“过期大促价”，</text>
  <text x="56" y="202" class="txt">  导致用户点进结算页发现涨价/无货，引发大规模客诉与监管处罚！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：离线 VLM 商品图打标 + 62ms 快轨混合检索 + Redis 毫秒级价格库存锚定</text>
  <text x="56" y="272" class="mono">• 离线把重活干完：入库时用 Qwen2.5-VL 提取商品图的“领型/材质/穿搭场景/人群”写入索引</text>
  <text x="56" y="292" class="mono">• 在线快轨 (62ms)：SigLIP 图文向量 + BM25 + 销量 CTR 精排直接秒出首屏商品瀑布流</text>
  <text x="56" y="312" class="txt">• 在线慢轨 (SSE 异步卡片)：顶部导购穿搭建议流式渐进渲染 + Redis 实时覆盖秒杀价与库存！</text>

  <!-- Right Panel: 4 Retail Search & Shopping Agent Platforms Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业零售多模态搜索与导购平台横向对标 (5,000 万 SKU · 5,000 QPS)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 同步阻塞调 70B LLM 改写主搜索 + 向量库静态库存价格</text>
  <text x="638" y="158" class="mono">• 首屏延迟 1,680ms ✕ | 过期价格/缺货误推率 14.8% ✕ | 月成本 $164,000/月 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 商业垂直零售搜索 SaaS (Google Vertex AI Search for Retail / Algolia)</text>
  <text x="638" y="214" class="mono">• 内置电商点击转化率归因模型 | 按千次搜索请求计费 | 首屏 85ms | $58,000/月</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 云原生托管混合检索 (Azure AI Search + Florence-2/SigLIP + Semantic Ranker)</text>
  <text x="638" y="270" class="mono">• 多模态图文混合检索 + 语义重排 | 首屏 74ms ✓ | 转化率 +16.5% | $29,500/月 ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 离线 VLM 商品增广 + Milvus/Qdrant (62ms 快慢双轨) + Redis 实时库存锚定 (🏆)</text>
  <text x="638" y="326" class="mono">• 首屏 62ms 🏆 | 缺货/错价率 0.0% 🏆 | 转化率提升 +21.8% 🏆 | 月成本仅 $16,200 (-90%)!</text>

  <!-- Bottom Panel: End-to-End Fast/Slow Dual-Speed Retail Search Pipeline -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端零售多模态搜索与导购 Agent 参考架构：离线 VLM 增广 + 62ms 快慢双轨 + Redis 真值覆盖</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 离线 VLM 商品图深度打标</text>
  <text x="56" y="464" class="mono">• 商家上传商品图只填“连衣裙”</text>
  <text x="56" y="484" class="mono">• 夜间批处理跑 Qwen2.5-VL-7B</text>
  <text x="56" y="504" class="mono">  自动补全：法式方领/碎花/海边</text>
  <text x="56" y="524" class="mono">  度假/梨形身材友好 + SigLIP 向量</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">把大模型的重推理留在离线入库期！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 快轨 (Fast Track · 62ms 首屏)</text>
  <text x="332" y="464" class="mono">• 用户拍穿搭照片或搜“海边显瘦裙”</text>
  <text x="332" y="484" class="mono">• Milvus / Azure AI Search 执行</text>
  <text x="332" y="504" class="mono">  `BM25 + SigLIP 图像向量` 召回</text>
  <text x="332" y="524" class="mono">• GBDT 融合实时转化率 (CVR) 精排</text>
  <text x="332" y="550" class="txt" fill="#34d399">62ms 极速渲染商品列表，零白屏等待</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ Redis 毫秒级库存与价格锚定</text>
  <text x="620" y="464" class="mono">• 严禁在向量库里存可变价格与库存！</text>
  <text x="620" y="484" class="mono">• 召回 Top-50 SKU_ID 后，花 1.5ms</text>
  <text x="620" y="504" class="mono">  从 Redis 批量 `MGET` 实时库存与</text>
  <text x="620" y="524" class="mono">  千人千面优惠券到手价，剔除断码品</text>
  <text x="620" y="550" class="txt" fill="#fde68a">缺货与错价事故率从 14.8% 归零！</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 慢轨 (Slow Track · 异步导购卡)</text>
  <text x="908" y="464" class="mono">• 仅当查询含复杂对比/搭配意图时</text>
  <text x="908" y="484" class="mono">• 顶部 AI 导购卡片以 SSE 流式</text>
  <text x="908" y="504" class="mono">  异步输出（绝不阻塞下方商品流！）</text>
  <text x="908" y="524" class="mono">• 导购话术引用 Redis 注入的真实价格</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">下单转化率 (GMV Conversion) +21.8%</text>
</svg>
