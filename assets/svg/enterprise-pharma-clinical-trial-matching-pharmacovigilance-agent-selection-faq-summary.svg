<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad413" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad413" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad413)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级生物医药临床试验入排匹配（Eligibility）与药物警戒（PV ICSR / MedDRA）Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">85项II/III期临床 / 月筛12万病历 · 人工CRA翻病历 vs. 单Prompt一把抓40条入排 vs. 标准医学RAG vs. 原子逻辑编译器(FHIR SQL) + MedDRA层级对齐 + 21 CFR Part 11</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">96.8% F1 · 0% Safety Miss</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 人工 CRA 翻病历 + 手工 MedDRA</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">患者入组极其缓慢，疲劳漏看洗脱期</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 人工核对 40 条入排条件耗时 45 分钟/人</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 疲劳导致 3.2% 排除标准（禁忌用药）漏检</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fde68a" font-size="13" font-weight="700">入排匹配准确率(F1): 88.5%</text>
  <text x="54" y="334" fill="#fca5a5" font-size="13" font-weight="700">排除标准安全漏检率: 3.2% ✕</text>
  <text x="54" y="358" fill="#94a3b8" font-size="12.5">MedDRA PT 编码准确率: 91.0%</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月临床筛选与PV人力成本: $260,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：小样本探索期，大规模III期入组严重滞后</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 单 Prompt 一把抓 40 条入排条件</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">双重否定与洗脱期算错，捏造 MedDRA 词条</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 搞混“无>=2级神经病变(除非已恢复28天)”逻辑</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 肌酐 µmol/L 换算 eGFR 算错，安全漏检 16.8%</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">入排匹配准确率(F1): 64.2% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">排除标准安全漏检率: 16.8% (医疗事故 ✕)</text>
  <text x="346" y="358" fill="#fca5a5" font-size="12.5">MedDRA PT 编码准确率: 71.5% ✕</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月临床筛选与偏差整改成本: $310,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁把整份病历+40条入排塞进单Prompt硬判</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 标准医学病历 RAG + 自由判别</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">能检索出院小结，但缺化验 SQL 与字典约束</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 连续检验指标时间窗与 eGFR 公式仍靠 LLM 心算</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 仍有 6.4% 排除标准漏检，不满足 GCP 零容忍</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">入排匹配准确率(F1): 78.4%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">排除标准安全漏检率: 6.4% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">MedDRA PT 编码准确率: 84.8%</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月临床筛选与PV总成本: $115,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：病历初筛探索，不可直接输出合规入组表单</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad413)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 原子逻辑编译+MedDRA+Part11 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">化验走FHIR SQL、文本抽事实、字典强约束</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 40条入排拆为原子布尔树：化验/洗脱期由SQL精算</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• MedDRA v27 层级受限解码 + 21 CFR Part 11签名</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">入排匹配准确率(F1): 96.8% 🏆 (+32.6pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">排除标准安全漏检率: 0.0% 🏆 (SQL硬拦截)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">MedDRA PT 编码准确率: 98.4% 🏆 (受限字典)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月临床与PV总成本: $38,000 (-85.4% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：跨国药企临床运营、CRO与药物警戒(PV)中心</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 生物医药临床与药物警戒架构师铁律（Atomic Eligibility Compiler + MedDRA Tree + 21 CFR Part 11）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 严禁让大模型心算化验指标与洗脱期天数：将方案入排标准编译为“FHIR 结构化检验 SQL 谓词 + 病程文本单条事实提取”的确定性布尔语法树。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 药物警戒 ICSR 报告必须绑定官方 MedDRA v27.0 字典树（LLT→PT→SOC）与 ICH E2B(R3) Schema，并强制记录 FDA 21 CFR Part 11 电子签名审计链 · Provenance: synthetic + anonymized_reported</text>
</svg>
