<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级大模型可观测性 (LLMOps) 平台选型：Azure Foundry Tracing vs. LangSmith vs. Arize vs. Langfuse (#417)</text>
  <text x="28" y="58" class="sub">为什么把 100% 原始 Prompt/RAG 全文写进传统 APM (按 GB 计费) 会产生 $6.4万/月天价账单？用 OTel 尾部采样 + ClickHouse/Blob 分离省 91.8%！</text>

  <!-- Left Panel: The 64KB Trace Payload Explosion & APM Trap -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 大模型 Trace 与传统微服务 APM 的本质冲突：单 Span 膨胀 640 倍！</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 致命成本陷阱：把 16K Prompt + RAG 文档原文全量塞入传统 APM 日志</text>
  <text x="56" y="164" class="mono">• 传统微服务 Span 仅 ~100 Bytes；而单次 Agent 含 8 步调用 + RAG 原文高达 64 KB！</text>
  <text x="56" y="184" class="mono">• 5,000 万次/月 Trace * 64 KB = 3.2 TB/天 = 96 TB/月原始文本写入</text>
  <text x="56" y="202" class="txt">• 按传统商业 APM/Log Analytics ($2.30~$3.50/GB) 计费，仅日志费就高达 $6.4万~$22万/月！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 破局架构：OTel gen_ai.* 元数据全量入 ClickHouse + 正文 Blob 解耦 + 智能尾部采样</text>
  <text x="56" y="272" class="mono">• 100% 全量保留轻量指标 (Token数/TTFT/TPOT/成本/状态码，单条仅 420B) 入 ClickHouse</text>
  <text x="56" y="292" class="mono">• 完整 Prompt/RAG 大文本：100% 保留异常/点踩/长尾慢请求 + 5% 正常请求抽样存廉价对象存储</text>
  <text x="56" y="312" class="txt">• 结果：坏例排障覆盖率 100%，存储与在线评测账单暴降 91.8%！</text>

  <!-- Right Panel: 4 LLMOps Platform Selection Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大主流 LLMOps 可观测性与线上评测平台横向选型 (5,000 万 Traces/月)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 全量原文直写传统 APM + 100% 线上实时大模型裁判 (Naive Full Ingestion)</text>
  <text x="638" y="158" class="mono">• 96 TB/月日志硬塞 + 全量 Judge 评测 | 附加延迟 +35ms | 月度 TCO $68,400/月 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 商业托管 SaaS (LangSmith Enterprise / Arize Cloud)</text>
  <text x="638" y="214" class="mono">• 最佳 Prompt Playground 与 Agent 步级回放体验 | 按 Span/GB 阶梯计费 | $24,500/月</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 云原生生态内生追踪 (Azure AI Foundry Tracing + App Insights Basic Logs)</text>
  <text x="638" y="270" class="mono">• 原生集成OpenTelemetry gen_ai.* 与 Azure RBAC | 正文存 Blob/Basic 表 | $11,200/月 ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 自建开源 Langfuse v3 (ClickHouse + S3/Blob) + OTel 尾部采样 + 5% 异步评测 (🏆)</text>
  <text x="638" y="326" class="mono">• 敏感 Prompt 100% 不出内网 | 异步队列 +0.4ms 零阻塞 | 坏例 100% 捕获 | 仅 $5,600/月!</text>

  <!-- Bottom Panel: End-to-End OTel gen_ai Pipeline & Tail Sampling -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端 LLMOps 可观测性参考架构：OpenTelemetry gen_ai.* 规范 + 智能尾部采样 + 坏例回归飞轮</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① OTel 统一插桩 (0.4ms 异步)</text>
  <text x="56" y="464" class="mono">• 遵循 OpenTelemetry</text>
  <text x="56" y="484" class="mono">  gen_ai.* 标准语义约定</text>
  <text x="56" y="504" class="mono">• 本地 RingBuffer 异步批推</text>
  <text x="56" y="524" class="mono">• 杜绝同步写日志拖慢推理</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">一行代码兼容任意引擎与框架</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② OTel Collector 尾部采样</text>
  <text x="332" y="464" class="mono">• 指标 Span (420B)：100% 保留</text>
  <text x="332" y="484" class="mono">• 完整大文本 Payload (64KB)：</text>
  <text x="332" y="504" class="mono">  - 报错/超时/点踩/护栏：100%</text>
  <text x="332" y="524" class="mono">  - 正常顺畅请求：5% 随机抽样</text>
  <text x="332" y="550" class="txt" fill="#34d399">存储体积锐减 89% 且不漏坏例</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ Langfuse v3 冷热分层存储</text>
  <text x="620" y="464" class="mono">• 热层 ClickHouse：亚秒级聚合</text>
  <text x="620" y="484" class="mono">  亿级 Token 成本与 P99 看板</text>
  <text x="620" y="504" class="mono">• 温冷层 S3 / Azure Blob：</text>
  <text x="620" y="524" class="mono">  Zstd 压缩存储多轮大 Prompt</text>
  <text x="620" y="550" class="txt" fill="#fde68a">$0.02/GB 对象存储替代 $2.5/GB APM</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 异步评测与黄金集飞轮</text>
  <text x="908" y="464" class="mono">• Kafka 异步消费 5% 抽样 +</text>
  <text x="908" y="484" class="mono">  100% 用户点踩 (Thumbs-down)</text>
  <text x="908" y="504" class="mono">• 跑 Ragas / Prometheus 评分</text>
  <text x="908" y="524" class="mono">• 低分样本一键转入 CI 黄金回归集</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">形成线上监控-&gt;回归评测闭环</text>
</svg>
