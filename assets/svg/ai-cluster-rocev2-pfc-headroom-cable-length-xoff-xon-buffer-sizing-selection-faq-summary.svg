  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">PFC Headroom: 48KB Overflow Drops (88 GB/s) vs 192KB Shared Pool + Dynamic Alpha (374 GB/s)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: 48KB Overflow vs 512KB Starvation</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• At `400G` (`50 B/ns`) over `150m` fiber (`1,500 ns` RTT) + `RS-FEC`</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  + DSP + MTU serialization (`~1,620 ns`), `156 KB` arrives AFTER `XOFF`!</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (`48 KB` headroom): Overflows `108 KB` -> `1.85%` loss! ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2 (`512 KB` static/port): Eats `48.5%` of switch MMU SRAM! ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">48KB BusBW: 88.0 GB/s (Drop!) | 512KB Static: 265.0 GB/s ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">"PFC Is Incrementing, So Why Are Packets Still Dropping in MMU?!"</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: 192KB Shared Headroom + Dynamic Alpha</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Exact Braking Formula: $B_{\text{hdrm}} = R \cdot (2 L / v + T_{\text{FEC+MAC}}) + 2\text{MTU}$</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Uses Shared Headroom Pool (`192 KB` per-port cap, `82%` MMU free)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Sets `XON` $\ge B_{\text{RTT}} + 2\text{MTU}$ to prevent link drain bubbles</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Pairs `Dynamic Alpha = 1/2` with fast `DCQCN` early marking</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Headroom Drop: 0.00% | Shared Pool: 82% | BusBW: 374.0 GB/s 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">4.25x Higher Collective Throughput Across 150m Inter-Hall Links</text>
