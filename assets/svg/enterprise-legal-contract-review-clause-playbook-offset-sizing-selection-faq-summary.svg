<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#531 企业法务合同审查与招投标红线批注 (`LegalTech · 100页长合同`) 选型与算卡指南</text>
  <text x="30" y="60" class="sub">终结“100页全文硬塞 128K 导致中部霸王条款漏审 19.4%” · 并行条款 DAG + 审单手册前缀缓存 + 偏移锚定将召回提至 98.4%</text>

  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么 100 页合同直接塞进 128K 窗口会漏掉 19.4% 的赔偿陷阱？</text>
  <text x="48" y="132" class="txt bad">• Lost-in-the-Middle 盲区: 75,000 词长合同中隐藏在第 45 页的“无限连带赔偿”</text>
  <text x="64" y="150" class="txt bad">或“管辖法院变更”极易被长窗口注意力稀释漏审 (召回率仅 80.6%，耗时 68s ✕)</text>
  <text x="48" y="174" class="txt warn">• 串行逐条审阅痛点: 80 个条款逐一串行调 70B 耗时长达 95 秒 ✕</text>
  <text x="48" y="198" class="txt good">• 2026 并行条款 DAG + 审单手册 Radix 缓存 + 字符偏移锚定 🏆:</text>
  <text x="64" y="218" class="txt">① 结构化拆解 + 全局定义表置顶: 将法务审单标准库 (Playbook) 固定为共享前缀</text>
  <text x="64" y="238" class="txt">② 70% 标准无风险条款由 8B 秒筛，30% 核心责任/知识产权条款并发交 70B 红线修订</text>
  <text x="64" y="258" class="txt good">③ 强制输出原文 `(start_char, end_char)` 精确写回 Word OOXML 修订批注 (零虚构引文 🏆)</text>

  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 日审 5,000 份长合同三套法务 AI 架构对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (128K 全文硬塞单次 Prompt): 风险条款召回率 80.6% ✕</text>
  <text x="594" y="152" class="txt bad">虚构条款引用率 11.4%，耗时 68.0s，需 32 张 H200 ($85.7万/年 ✕)</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (串行逐条调用 70B 无前缀共享): 召回率 94.8% ✓，</text>
  <text x="594" y="198" class="txt warn">但单份合同耗时 95.0s，需 24 张 H200 ($64.3万/年)</text>
  <text x="578" y="224" class="txt good">• 方案 3 (并行条款 DAG + Playbook Radix 缓存 + 偏移锚定 🏆):</text>
  <text x="594" y="246" class="txt good">- 风险条款召回率: 98.4% (+17.8 pts 🏆) · 虚构原文引用率 0.0%</text>
  <text x="594" y="268" class="txt good">- 整份 100 页合同仅需 8.2s (快 8.29x 🏆) · 仅需 8 张 H200 (省 75.0% 卡 🏆)</text>

  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 审查一份 100 页合同的 P95 耗时 (Seconds) 与风险条款召回率对比</text>

  <text x="48" y="378" class="txt">方案 1: 128K 全文硬塞</text>
  <rect x="305" y="364" width="340" height="16" fill="#ef4444" rx="4"/>
  <text x="655" y="378" class="txt bad">68.0 秒 | 漏审 19.4% 风险条款 | 需 32 张 H200 ✕</text>

  <text x="48" y="418" class="txt">方案 2: 串行逐条调 70B</text>
  <rect x="305" y="404" width="475" height="16" fill="#f59e0b" rx="4"/>
  <text x="790" y="418" class="txt warn">95.0 秒 | 召回率 94.8% | 需 24 张 H200</text>

  <text x="48" y="458" class="txt good">方案 3: 并行条款DAG + Radix缓存 🏆</text>
  <rect x="305" y="444" width="41" height="16" fill="#10b981" rx="4"/>
  <text x="356" y="458" class="txt good">8.2 秒/份 (快 8.29x 🏆) | 召回率 98.4% · 0% 虚构引用 | 仅需 8 张 H200 (-75% 🏆)</text>
</svg>
