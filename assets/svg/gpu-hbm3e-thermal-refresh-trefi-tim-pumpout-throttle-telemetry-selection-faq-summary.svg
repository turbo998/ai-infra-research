<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760">
  <defs>
    <linearGradient id="bg195" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="acc195" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="760" fill="url(#bg195)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>

  <rect x="52" y="44" width="420" height="28" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="1"/>
  <text x="262" y="63" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROUND 195 · GPU HBM3E THERMAL REFRESH (tREFI) &amp; TIM PUMPOUT</text>
  <text x="488" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">GPU HBM3e 显存高温倍频刷新（tREFI 2x/4x）、导热垫泵出与热降频遥测选型一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">为什么 GPU 核心才 64°C 却让千卡集群掉速 31.5%？揭秘 HBM >75°C 静默 2x/4x 电容刷新与 T_mem - T_gpu 温差巡检</text>
  <rect x="52" y="146" width="1176" height="3" fill="url(#acc195)"/>

  <!-- Tier 1 -->
  <rect x="52" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <rect x="68" y="184" width="224" height="24" rx="6" fill="#7f1d1d"/>
  <text x="180" y="200" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 1 · 导热垫老化泵出 (T_mem=90°C)</text>
  <text x="68" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">4x 刷新 + 降频拖垮全集群</text>
  <text x="68" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">T_gpu=64°C 假象 · 温差高达 26°C</text>

  <rect x="68" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制盲区：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">只看 GPU 核心 64°C 以为正常，实则 HBM</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">导热膏空洞致 90°C 触发 4x 刷新与软降频！</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 温度与温差: <tspan fill="#f87171" font-weight="700">T_mem 90°C (ΔT=26°C ✕)</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• HBM 刷新倍率: <tspan fill="#f87171" font-weight="700">4x 倍频刷新 (0.25x tREFI)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 实测 HBM3e 带宽: <tspan fill="#f87171" font-weight="700">3.12 TB/s (-35% ✕)</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千卡 MFU 掉点: <tspan fill="#f87171" font-weight="700">-31.5% ✕</tspan></text>
  <rect x="68" y="456" width="244" height="36" rx="8" fill="#450a0a"/>
  <text x="190" y="479" fill="#fecaca" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⛔ 只监控 GPU_TEMP 会漏掉 100% 显存过热</text>

  <!-- Tier 2 -->
  <rect x="352" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="368" y="184" width="228" height="24" rx="6" fill="#78350f"/>
  <text x="482" y="200" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 2 · 风冷潜伏区 (T_mem=81°C)</text>
  <text x="368" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">零降频告警但静默丢 10.8% 带宽</text>
  <text x="368" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">&gt;75°C 触发 2x tREFI 倍频刷新</text>

  <rect x="368" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#78350f"/>
  <text x="380" y="293" fill="#fcd34d" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">为什么没触发降频标志也变慢了？</text>
  <text x="380" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">HBM 超过 75°C 尚未到 85°C 降频线，但电容</text>
  <text x="380" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">漏电翻倍迫使控制器每 1.95μs 停下读写刷新！</text>

  <text x="368" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 温度与温差: <tspan fill="#fbbf24" font-weight="700">T_mem 81°C (ΔT=10°C)</tspan></text>
  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• HBM 刷新倍率: <tspan fill="#fbbf24" font-weight="700">2x 倍频刷新 (0.5x tREFI ⚠️)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 实测 HBM3e 带宽: <tspan fill="#fbbf24" font-weight="700">4.28 TB/s (-10.8%)</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千卡 MFU 掉点: <tspan fill="#fbbf24" font-weight="700">-9.8% ⚠️</tspan></text>
  <rect x="368" y="456" width="244" height="36" rx="8" fill="#451a03"/>
  <text x="490" y="479" fill="#fde68a" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚠️ 75°C~84°C 是最隐蔽的静默掉速区间</text>

  <!-- Tier 3 -->
  <rect x="652" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <rect x="668" y="184" width="232" height="24" rx="6" fill="#0c4a6e"/>
  <text x="784" y="200" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 3 · DCGM 降频位掩码被动告警</text>
  <text x="668" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">捕获 &gt;85°C 降频，难防 2x 刷新</text>
  <text x="668" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">CLOCK_THROTTLE_REASONS 监控</text>

  <rect x="668" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#0284c7"/>
  <text x="680" y="293" fill="#38bdf8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心机制突破：</text>
  <text x="680" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">实时监控 0x20 (SW_THERMAL) 与 0x40</text>
  <text x="680" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">(HW_THERMAL)，但未设 75°C 与温差预警线</text>

  <text x="668" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 温度与温差: <tspan fill="#38bdf8" font-weight="800">T_mem 78°C (ΔT=10°C)</tspan></text>
  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• HBM 刷新倍率: <tspan fill="#38bdf8" font-weight="800">2x 刷新</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 实测 HBM3e 带宽: <tspan fill="#38bdf8" font-weight="800">4.35 TB/s ✅</tspan></text>
  <text x="668" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千卡 MFU 掉点: <tspan fill="#38bdf8" font-weight="800">-7.5%</tspan></text>
  <rect x="668" y="456" width="244" height="36" rx="8" fill="#082f49"/>
  <text x="790" y="479" fill="#bae6fd" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">✅ 防止严重死机，但仍损失约 8% 带宽</text>

  <!-- Tier 4 -->
  <rect x="952" y="168" width="276" height="340" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2.2"/>
  <rect x="968" y="184" width="236" height="24" rx="6" fill="#064e3b"/>
  <text x="1086" y="200" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">TIER 4 · 液冷锁温 (&lt;72°C) + ΔT 巡检</text>
  <text x="968" y="232" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="17" font-weight="800">1x 标准刷新 · 满血 4.68 TB/s</text>
  <text x="968" y="254" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">T_mem=66°C + ΔT&gt;18°C 自动 Cordon</text>

  <rect x="968" y="272" width="244" height="62" rx="8" fill="#0f172a" stroke="#059669"/>
  <text x="980" y="293" fill="#34d399" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心突破 (低温稳态 + 导热垫老化预判)：</text>
  <text x="980" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">将 HBM 稳锁在 72°C 以下永不触发倍频刷新，</text>
  <text x="980" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">并用 T_mem-T_gpu&gt;18°C 提前捕获导热垫空洞</text>

  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 温度与温差: <tspan fill="#34d399" font-weight="800">T_mem 66°C (ΔT=12°C 🏆)</tspan></text>
  <text x="968" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• HBM 刷新倍率: <tspan fill="#34d399" font-weight="800">1x 标准刷新 (3.9μs tREFI 🏆)</tspan></text>
  <text x="968" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 实测 HBM3e 带宽: <tspan fill="#34d399" font-weight="800">4.68 TB/s (满血 🏆)</tspan></text>
  <text x="968" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 千卡 MFU 掉点: <tspan fill="#34d399" font-weight="800">0.0% (零木桶拖累 🏆)</tspan></text>
  <rect x="968" y="456" width="244" height="36" rx="8" fill="#064e3b"/>
  <text x="1090" y="479" fill="#a7f3d0" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" text-anchor="middle">🏆 H100/H200/B200 温控与巡检标杆</text>

  <!-- Bottom Architecture Comparison -->
  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么 HBM 显存温度是比 GPU 核心温度更敏感的“隐形性能开关”？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：JEDEC HBM3e 温度受控自刷新 (`TEMP_CTRL_REF`) 物理机制</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• DRAM 电容漏电速度每升温 `10°C` 翻一倍；每次刷新 (`tRFC`) 期间整个 Bank 禁止读写；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 当 `DCGM_FI_DEV_MEM_TEMP &gt; 75°C` 时，刷新频率翻 2 倍；`&gt; 85°C` 时翻 4 倍并降频；</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 生产集群必须把 **`MEM_TEMP &lt; 72°C`** 作为风扇转速曲线与液冷 CDU 供水温度的控制目标！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：用 `ΔT = T_mem - T_gpu &gt; 18°C` 精准诊断导热界面材料 (TIM) 失效</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 正常散热器下，HBM 显存温度最多比 GPU 逻辑核心高 `8°C ~ 14°C`；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 如果某张卡出现 `T_gpu = 64°C` 但 `T_mem = 88°C` (`ΔT = 24°C`)，100% 是该卡某颗</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">  HBM 堆叠芯片上方的导热垫（Thermal Pad）发生泵出脱落或冷板微水道局部堵塞 🏆！</text>
</svg>
