<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级智能供应链控制塔 (Supply Chain Control Tower)：时序基础模型 vs. 运筹求解器 (MILP) 协同选型 (#439)</text>
  <text x="28" y="58" class="sub">为什么直接让大模型做销量预测和库存排产会违反 38% 的产能与起订量硬约束？如何让“LLM + Chronos/LightGBM + OR-Tools”黄金分工？</text>

  <!-- Left Panel: Pure LLM Optimization Failure vs Neuro-Symbolic LLM + Time-Series + MILP Solver -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 纯大模型“拍脑袋排产”灾难 vs. 神经符号混合架构 (LLM + TSFM + MILP)</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 失败做法：把历史销量 CSV 塞给大模型直接预测并生成采购单</text>
  <text x="56" y="164" class="mono">• 预测失准：文本大模型对季节性与促销弹性极不敏感，WMAPE 误差高达 31.5% ✕</text>
  <text x="56" y="184" class="mono">• 违反硬约束：大模型生成的调拨单 38% 违反最小起订量 (MOQ)、库容上限或船期约束 ✕</text>
  <text x="56" y="202" class="txt">• 结果：畅销品缺货率高达 8.8%，滞销品压库呆滞资金多占 $1,850 万！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产黄金架构：LLM 外部冲击提取 + Chronos/LightGBM 概率预测 + OR-Tools MILP 求解</text>
  <text x="56" y="272" class="mono">• 1. LLM 干它最擅长的事：读港口罢工/台风/关税邮件，转化为结构化延迟与交期膨胀系数</text>
  <text x="56" y="292" class="mono">• 2. Chronos-Bolt (零样本冷启动新品) + LightGBM (成熟品) 输出 P50/P90 分位数预测</text>
  <text x="56" y="312" class="txt">• 3. LLM 将业务临时指令编译为线性约束，交由 OR-Tools/Gurobi 100% 满足硬约束求全局最优！</text>

  <!-- Right Panel: 4 Supply Chain Planning & Inventory Optimization Architectures -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业供应链预测与排产方案对标 (50,000 SKU × 20 仓库)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fde68a">Tier 1: 传统 ERP 移动平均 / ARIMA + 计划员手工 Excel 补货</text>
  <text x="638" y="158" class="mono">• 预测误差 WMAPE 26.4% | 缺货率 7.4% | 突发断供重排耗时 72 小时 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fca5a5">Tier 2: 纯文本大模型直接读历史表格生成预测与调拨单 (Pure LLM)</text>
  <text x="638" y="214" class="mono">• WMAPE 31.5% ✕ | 38% 违反产能/MOQ 硬约束 ✕ | 缺货率 8.8%</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 传统商业 APS 套件 (Blue Yonder / Kinaxis / SAP IBP 纯数理统计)</text>
  <text x="638" y="270" class="mono">• WMAPE 14.8% | 硬约束 100% 满足 | 看不懂突发港口罢工新闻 | 年费 $1.2M+</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: LLM 非结构化事件感知 + Chronos/LightGBM + OR-Tools MILP 协同 (🏆旗舰)</text>
  <text x="638" y="326" class="mono">• WMAPE 压至 10.6% 🏆 | 100% 满足硬约束 🏆 | 缺货率降至 1.8% | 12 分钟重排全局!</text>

  <!-- Bottom Panel: End-to-End Neuro-Symbolic Supply Chain Control Tower -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端“感知-预测-运筹求解-ERP 执行”四阶智能控制塔架构</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 非结构化风险感知 (LLM Sensor)</text>
  <text x="56" y="464" class="mono">• 7×24 监控供应商延期邮件、</text>
  <text x="56" y="484" class="mono">  海运航道拥堵、极端天气与竞品促销</text>
  <text x="56" y="504" class="mono">• 自动抽取：`Lead_Time_Delta = +9d`</text>
  <text x="56" y="524" class="mono">  或 `Promo_Demand_Multiplier = 1.4x`</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">把非结构化情报转化为数学协变量！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 分位数概率预测 (Chronos + GBDT)</text>
  <text x="332" y="464" class="mono">• 成熟 SKU (80%)：跑 LightGBM 融合</text>
  <text x="332" y="484" class="mono">  价格、节假日与库存特征</text>
  <text x="332" y="504" class="mono">• 冷启动新品 (20%)：跑 Chronos-Bolt</text>
  <text x="332" y="524" class="mono">  零样本时序基础模型输出 P50/P95</text>
  <text x="332" y="550" class="txt" fill="#34d399">用 P95 不确定性直接驱动安全库存！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ 自然语言转 MILP 运筹求解</text>
  <text x="620" y="464" class="mono">• 计划员说：“华南仓下周爆仓，优先</text>
  <text x="620" y="484" class="mono">  保 A 类客户，允许 15% 空运加急”</text>
  <text x="620" y="504" class="mono">• LLM 生成 OR-Tools / Pyomo 约束式</text>
  <text x="620" y="524" class="mono">• 数学求解器保证 100% 满足 MOQ/产能</text>
  <text x="620" y="550" class="txt" fill="#fde68a">大模型写方程，运筹求解器算最优解！</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ What-If 沙盘推演与 SAP BAPI</text>
  <text x="908" y="464" class="mono">• 并行对比 3 套调拨方案（海运改签 vs</text>
  <text x="908" y="484" class="mono">  跨仓调拨 vs 紧急空运）的毛利损失</text>
  <text x="908" y="504" class="mono">• 计划员一键审批后自动调用 SAP</text>
  <text x="908" y="524" class="mono">  BAPI 下发采购单 (PO) 与调拨单 (STO)</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">库存呆滞资金释放 24.5%，缺货率 1.8%！</text>
</svg>
