<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad73" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad73" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad73)" rx="16"/>
  <rect x="24" y="20" width="1232" height="86" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="54" fill="url(#accentGrad73)" font-size="22" font-weight="800">Round 73 · 十亿级 (1B) 向量检索、DiskANN (Vamana) 与 GPU cuVS CAGRA / RaBitQ 选型一图流</text>
  <text x="44" y="84" fill="#94A3B8" font-size="14">10 亿条 1024 维向量 (2.0 TB FP16) · 4KB NVMe 同块扇区打包 + 免训练 RaBitQ + GPU CAGRA (independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <g transform="translate(24, 124)">
    <!-- Tier 1 -->
    <rect x="0" y="0" width="296" height="310" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
    <text x="16" y="32" fill="#FCA5A5" font-size="15" font-weight="700">Tier 1 · 全内存未压缩 HNSW ✕</text>
    <text x="16" y="56" fill="#CBD5E1" font-size="12.5">2,048GB 向量 + 602GB 图指针全驻内存</text>
    <line x1="16" y1="70" x2="280" y2="70" stroke="#334155"/>
    <text x="16" y="98" fill="#94A3B8" font-size="12">集群 DRAM 内存：</text>
    <text x="165" y="98" fill="#EF4444" font-size="15" font-weight="800">2,650 GB (内存怪兽 ✕)</text>
    <text x="16" y="128" fill="#94A3B8" font-size="12">Recall@10 召回率：</text>
    <text x="165" y="128" fill="#FCA5A5" font-size="14" font-weight="700">96.5%</text>
    <text x="16" y="158" fill="#94A3B8" font-size="12">P95 延迟 / 峰值 QPS：</text>
    <text x="165" y="158" fill="#FCA5A5" font-size="13.5" font-weight="700">2.4 ms · 4,200 QPS</text>
    <text x="16" y="188" fill="#94A3B8" font-size="12">10亿全量建库耗时：</text>
    <text x="165" y="188" fill="#EF4444" font-size="14" font-weight="800">18.5 Hours (极慢 ✕)</text>
    <text x="16" y="218" fill="#94A3B8" font-size="12">月度云集群账单：</text>
    <text x="165" y="218" fill="#EF4444" font-size="14" font-weight="800">$38,400 / mo ✕</text>
    <rect x="16" y="244" width="264" height="48" rx="8" fill="#2D1622"/>
    <text x="26" y="264" fill="#FDA4AF" font-size="11.5" font-weight="600">痛点：11 台 256GB 大内存节点年烧 $46万，</text>
    <text x="26" y="282" fill="#FDA4AF" font-size="11.5">且 CPU 串行建图锁争用长达 18.5 小时！</text>

    <!-- Tier 2 -->
    <rect x="312" y="0" width="296" height="310" rx="12" fill="#1E2230" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="328" y="32" fill="#FCD34D" font-size="15" font-weight="700">Tier 2 · 纯内存 IVF-PQ 无重排 ✕</text>
    <text x="328" y="56" fill="#CBD5E1" font-size="12.5">64B K-Means 码本强压 (丢弃原始向量)</text>
    <line x1="328" y1="70" x2="592" y2="70" stroke="#334155"/>
    <text x="328" y="98" fill="#94A3B8" font-size="12">集群 DRAM 内存：</text>
    <text x="477" y="98" fill="#FCD34D" font-size="14" font-weight="700">88 GB</text>
    <text x="328" y="128" fill="#94A3B8" font-size="12">Recall@10 召回率：</text>
    <text x="477" y="128" fill="#EF4444" font-size="15" font-weight="800">68.4% (-28.1pt ✕)</text>
    <text x="328" y="158" fill="#94A3B8" font-size="12">P95 延迟 / 峰值 QPS：</text>
    <text x="477" y="158" fill="#FCD34D" font-size="13.5" font-weight="700">3.1 ms · 6,800 QPS</text>
    <text x="328" y="188" fill="#94A3B8" font-size="12">10亿全量建库耗时：</text>
    <text x="477" y="188" fill="#FBBF24" font-size="14" font-weight="700">6.4 Hours</text>
    <text x="328" y="218" fill="#94A3B8" font-size="12">月度云集群账单：</text>
    <text x="477" y="218" fill="#FCD34D" font-size="14" font-weight="700">$2,400 / mo (精度废)</text>
    <rect x="328" y="244" width="264" height="48" rx="8" fill="#2E2418"/>
    <text x="338" y="264" fill="#FDE68A" font-size="11.5" font-weight="600">痛点：K-Means 码本遇新词/编号严重失真，</text>
    <text x="338" y="282" fill="#FDE68A" font-size="11.5">漏掉 31.6% 关键证据导致下游 RAG 幻觉！</text>

    <!-- Tier 3 -->
    <rect x="624" y="0" width="296" height="310" rx="12" fill="#132A3E" stroke="#38BDF8" stroke-width="1.8"/>
    <text x="640" y="32" fill="#7DD3FC" font-size="15" font-weight="700">Tier 3 · NVMe 原生 DiskANN ✅</text>
    <text x="640" y="56" fill="#CBD5E1" font-size="12.5">96GB 导航码 + 4KB 扇区向量/邻居同块</text>
    <line x1="640" y1="70" x2="904" y2="70" stroke="#334155"/>
    <text x="640" y="98" fill="#94A3B8" font-size="12">集群 DRAM 内存：</text>
    <text x="789" y="98" fill="#38BDF8" font-size="15" font-weight="800">96 GB (省 27.6x ✅)</text>
    <text x="640" y="128" fill="#94A3B8" font-size="12">Recall@10 召回率：</text>
    <text x="789" y="128" fill="#38BDF8" font-size="15" font-weight="800">95.2% ✅</text>
    <text x="640" y="158" fill="#94A3B8" font-size="12">P95 延迟 / 峰值 QPS：</text>
    <text x="789" y="158" fill="#7DD3FC" font-size="13.5" font-weight="700">4.2 ms · 5,400 QPS</text>
    <text x="640" y="188" fill="#94A3B8" font-size="12">10亿全量建库耗时：</text>
    <text x="789" y="188" fill="#7DD3FC" font-size="14" font-weight="700">5.2 Hours</text>
    <text x="640" y="218" fill="#94A3B8" font-size="12">月度云集群账单：</text>
    <text x="789" y="218" fill="#38BDF8" font-size="14" font-weight="800">$5,200 / mo (-86.5%)</text>
    <rect x="640" y="244" width="264" height="48" rx="8" fill="#0C2238"/>
    <text x="650" y="264" fill="#BAE6FD" font-size="11.5" font-weight="600">优势：1 次 4KB SSD 读取同时拿回全精度</text>
    <text x="650" y="282" fill="#BAE6FD" font-size="11.5">向量与 64 个邻居 ID，io_uring 6 跳直达！</text>

    <!-- Tier 4 -->
    <rect x="936" y="0" width="296" height="310" rx="12" fill="#0F292A" stroke="#10B981" stroke-width="2.2"/>
    <text x="952" y="32" fill="#6EE7B7" font-size="15" font-weight="800">Tier 4 · GPU CAGRA + RaBitQ 🏆</text>
    <text x="952" y="56" fill="#D1FAE5" font-size="12.5">免训练 1-Bit 边界 + GPU 定长图 + NVMe</text>
    <line x1="952" y1="70" x2="1216" y2="70" stroke="#334155"/>
    <text x="952" y="98" fill="#A7F3D0" font-size="12">集群 DRAM 内存：</text>
    <text x="1101" y="98" fill="#34D399" font-size="15" font-weight="800">112 GB (省 23.7x 🏆)</text>
    <text x="952" y="128" fill="#A7F3D0" font-size="12">Recall@10 召回率：</text>
    <text x="1101" y="128" fill="#34D399" font-size="15" font-weight="800">96.8% (+28.4pt 🏆)</text>
    <text x="952" y="158" fill="#A7F3D0" font-size="12">P95 延迟 / 峰值 QPS：</text>
    <text x="1101" y="158" fill="#6EE7B7" font-size="13.5" font-weight="800">1.4 ms · 18.5k QPS 🏆</text>
    <text x="952" y="188" fill="#A7F3D0" font-size="12">10亿全量建库耗时：</text>
    <text x="1101" y="188" fill="#34D399" font-size="15" font-weight="800">1.2 Hours (快 15.4x 🏆)</text>
    <text x="952" y="218" fill="#A7F3D0" font-size="12">月度云集群账单：</text>
    <text x="1101" y="218" fill="#6EE7B7" font-size="13.5" font-weight="800">$4,600 (年省 $405k 🏆)</text>
    <rect x="952" y="244" width="264" height="48" rx="8" fill="#062019"/>
    <text x="962" y="264" fill="#A7F3D0" font-size="11.5" font-weight="700">终极形态：RaBitQ 免训练零漂移 + GPU</text>
    <text x="962" y="282" fill="#A7F3D0" font-size="11.5">CAGRA 1.2h 极速建图 + NVMe 全精度精排</text>
  </g>

  <!-- Bottom Visual Comparison -->
  <rect x="24" y="454" width="1232" height="302" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="486" fill="#F8FAFC" font-size="16" font-weight="700">核心定量洞察：10 亿向量集群 DRAM 内存占用与召回率对比 &amp; DiskANN 4KB 扇区 + RaBitQ 原理</text>

  <!-- Left Bar Chart -->
  <g transform="translate(44, 508)">
    <text x="0" y="20" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 1 全内存 HNSW (2,650 GB DRAM · Recall 96.5% · 建库 18.5h · 月烧 $38,400 ✕)</text>
    <rect x="0" y="28" width="540" height="22" rx="4" fill="#EF4444"/>

    <text x="0" y="76" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 2 纯内存 IVF-PQ 64B (88 GB DRAM · Recall 暴跌至 68.4% 不可用 ✕)</text>
    <rect x="0" y="84" width="20" height="22" rx="4" fill="#F59E0B"/>
    <text x="30" y="100" fill="#FCD34D" font-size="11" font-weight="700">88 GB (但 Recall 仅 68.4% ✕)</text>

    <text x="0" y="132" fill="#CBD5E1" font-size="12.5" font-weight="600">Tier 3 NVMe 原生 DiskANN (96 GB DRAM · Recall 95.2% · P95 4.2ms · $5,200/月 ✅)</text>
    <rect x="0" y="140" width="22" height="22" rx="4" fill="#38BDF8"/>
    <text x="32" y="156" fill="#7DD3FC" font-size="11" font-weight="700">96 GB DRAM (省 27.6x · Recall 95.2% ✅)</text>

    <text x="0" y="188" fill="#6EE7B7" font-size="12.5" font-weight="700">Tier 4 GPU cuVS CAGRA + RaBitQ + NVMe (112 GB DRAM · Recall 96.8% · 1.4ms · 18.5k QPS 🏆)</text>
    <rect x="0" y="196" width="25" height="22" rx="4" fill="#10B981"/>
    <text x="35" y="212" fill="#34D399" font-size="12" font-weight="800">112 GB DRAM (建库快 15.4x · 年省 $405,600 🏆)</text>
  </g>

  <!-- Right Architecture Box -->
  <g transform="translate(650, 504)">
    <rect x="0" y="0" width="584" height="232" rx="10" fill="#1E293B" stroke="#475569"/>
    <text x="18" y="28" fill="#38BDF8" font-size="14" font-weight="700">第一性原理：三大物理机制打破“内存容量 vs 召回精度”死结</text>
    <text x="18" y="56" fill="#E2E8F0" font-size="12.5">① DiskANN 4KB 物理扇区同块打包 (Sector Co-Location)：</text>
    <text x="32" y="76" fill="#94A3B8" font-size="12">把每个节点的 [2048B 全精度向量 + 256B 邻居 ID] 严格对齐打包进同一个 4KB NVMe 扇区，</text>
    <text x="32" y="94" fill="#94A3B8" font-size="12">1 次 io_uring 读取同时完成“图扩展 + 全精度重排”，6 跳 (4.2ms) 查完 10 亿向量！</text>
    <text x="18" y="124" fill="#6EE7B7" font-size="12.5">② RaBitQ 免训练 1-Bit 随机正交旋转量化 (零码本漂移)：</text>
    <text x="32" y="144" fill="#94A3B8" font-size="12">无需 K-Means 码本训练，流式新数据零失真，以理论距离下界剪枝 95% 无关候选点。</text>
    <text x="18" y="174" fill="#FCD34D" font-size="12.5">③ NVIDIA cuVS CAGRA GPU 原生定长图 (建库 18.5h → 1.2h)：</text>
    <text x="32" y="194" fill="#94A3B8" font-size="12">两跳绕行全并行无锁剪枝 + Warp-Splitting 协同算距离，QPS 飙升至 18,500！</text>
  </g>
</svg>
