<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#520 里程碑：云与 AI 解决方案架构师 (`Cloud &amp; AI SA`) 全生命周期五步交付圣经 (#001–#520 总纲)</text>
  <text x="30" y="60" class="sub">贯通 Sizing 三道水位线 → 400G 无损网络 → PD 分离与 DP/EP → 三级 KV 池与 S-LoRA → 双活网关与 FinOps (省 87.5% GPU · 降本 17.8x)</text>

  <!-- Left Card -->
  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. Cloud &amp; AI Solution Architect 客户交付“五步通关法”</text>
  <text x="48" y="132" class="txt">• Step 1 (容量定界 #511): QPS → Little's Law 在途并发 → 三道水位线取 max</text>
  <text x="48" y="154" class="txt">• Step 2 (并行与 PD #508/#509): 机内 NVLink TP≤8，MoE 用 DP×EP + DeepEP，</text>
  <text x="64" y="172" class="txt">按 ISL:OSL 定 P:D 配比，开启 Dynamo NIXL 94.5% 异步重叠 + 原生 MTP</text>
  <text x="48" y="196" class="txt">• Step 3 (智算网络 #506/#510): GPUDirect RDMA + 关 PCIe ACS + Rail 400G (46.4 GB/s)</text>
  <text x="48" y="218" class="txt">• Step 4 (应用架构 #513–#519): 三级 KV 缓存池 (Mooncake) + Multi-LoRA + XGrammar</text>
  <text x="48" y="240" class="txt good">• Step 5 (平台治理与 FinOps #512/#516): 22%/55% 利用率拐点 + 55%+55% 双活容灾</text>
  <text x="64" y="262" class="txt good">→ 100 RPS 平台从 192 张 H200 缩至 24 张 (-87.5%)，百万词成本降 17.78 倍 🏆</text>

  <!-- Right Card -->
  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 100 RPS 企业级 AI 平台在五步架构演进前后的指标跃迁</text>
  <text x="578" y="134" class="txt bad">• Stage 0 (传统粗放基线: 混部 BF16 + 静态 ECMP + 独立合并实例): ✕</text>
  <text x="594" y="152" class="txt bad">需 192 张 H200 ($514万/年)，P99 TPOT = 64.0ms，Goodput 仅 51.0% ($0.640/1M)</text>
  <text x="578" y="178" class="txt warn">• Stage 1–2 (引入三道水位线 + PD 分离 + DP/EP + 原生 MTP): ✓</text>
  <text x="594" y="198" class="txt">缩减至 64 张 H200 ($171万/年)，P99 TPOT = 15.2ms，Goodput 升至 96.5%</text>
  <text x="578" y="224" class="txt good">• Stage 3–5 (#520 五步全栈总蓝图: +400G 调优+三级 KV 池+S-LoRA+潮汐 🏆):</text>
  <text x="594" y="246" class="txt good">- 仅需 24 张 H200 (较粗放基线立省 168 张卡 / -87.5% 🏆) · Goodput 达 99.4% 🏆</text>
  <text x="594" y="268" class="txt good">- P99 TPOT = 11.8 ms (快 5.42x) · 单价压至 $0.036/1M (便宜 17.78 倍 🏆)</text>

  <!-- Bottom Card -->
  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 100 RPS 企业级大模型平台在三代架构演进下的所需 H200 卡数与年化 TCO 对比</text>

  <text x="48" y="378" class="txt">Stage 0: 传统粗放架构基线</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">192 张 H200 ($514.0万/年) | P99 TPOT 64.0ms · Goodput 51.0% ✕</text>

  <text x="48" y="418" class="txt">Stage 1–2: PD分离 + DP/EP + MTP</text>
  <rect x="305" y="404" width="160" height="16" fill="#3b82f6" rx="4"/>
  <text x="475" y="418" class="txt">64 张 H200 ($171.0万/年) ✓ | P99 TPOT 15.2ms · Goodput 96.5% ✓</text>

  <text x="48" y="458" class="txt good">Stage 3–5: #520 五步全栈总蓝图 🏆</text>
  <rect x="305" y="444" width="60" height="16" fill="#10b981" rx="4"/>
  <text x="375" y="458" class="txt good">仅需 24 张 H200 (立省 87.5% 卡 / 年省 $449.8万 🏆) | 11.8ms · Goodput 99.4% · $0.036/1M 🏆</text>
</svg>
