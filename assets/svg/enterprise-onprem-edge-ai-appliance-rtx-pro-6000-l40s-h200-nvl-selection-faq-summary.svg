<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业私有化分支机构大模型一体机 (4x L40S vs. 2x RTX PRO 6000 96GB vs. H200 NVL) 选型 (#476)</text>
  <text x="28" y="58" class="sub">在无液冷、单柜 &lt;3.2kW 市电的医院/工厂/分行弱电机房，为什么 2 张 96GB RTX PRO 6000 Blackwell 秒杀 4 张 48GB L40S？</text>

  <!-- Left Panel: Why 4x L40S Suffers PCIe P2P Bottleneck vs 2x 96GB / H200 NVL -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么跑 70B 模型时，“4张 48GB L40S”既比“2张 96GB Blackwell”贵、还更慢？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 4x L40S (4x 48GB GDDR6) 的两大先天短板 ($42,000 / TPOT 28.4ms ✕)</text>
  <text x="56" y="164" class="mono">• L40S 单卡仅 48GB 且无 NVLink 桥接器！跑 70B FP8 必须切 TP=4；</text>
  <text x="56" y="184" class="mono">• 4 卡每层 2 次 AllReduce 全走 PCIe Gen4 (仅 24 GB/s)，且单卡显存带宽</text>
  <text x="56" y="202" class="mono">  仅 864 GB/s，若主板跨双路 CPU NUMA (SYS) 延迟更是恶化至 45ms+！</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ 两大新一代一体机王牌：2x RTX PRO 6000 (96GB) 与 2x/4x H200 NVL (🏆)</text>
  <text x="56" y="268" class="mono">• 性价比王牌: 2x RTX PRO 6000 Blackwell (单卡 96GB GDDR7, 1.8 TB/s)，</text>
  <text x="56" y="288" class="mono">  仅需 2 卡即可装下 70B FP8 (甚至 1 卡装下 70B NVFP4!)，整机仅 $2.65万！</text>
  <text x="56" y="308" class="mono">• 高并发王牌: 2x/4x H200 NVL (141GB HBM3e + 900 GB/s NVLink 桥接器)！</text>

  <!-- Right Panel: 4 On-Prem Appliance Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四种企业分支机构风冷一体机定量对标 (&lt;3.2kW 普通机房插头可用)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 4x NVIDIA L40S (192GB GDDR6, 无 NVLink, PCIe Gen4 TP=4)</text>
  <text x="638" y="158" class="mono">• 70B TPOT: 28.4ms | 32K并发: 28人 | 功耗: 1,950W | 整机: $42,000</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#34d399">Tier 2: 2x RTX PRO 6000 Blackwell (192GB GDDR7, 1.8TB/s/卡) (部门级首选 🏆)</text>
  <text x="638" y="214" class="mono">• 70B TPOT: 17.2ms ✓ | 32K并发: 42人 | 功耗: 1,650W | 整机: $26,500 (-37%)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 2x NVIDIA H200 NVL (282GB HBM3e + 900 GB/s 双卡 NVLink 桥接)</text>
  <text x="638" y="270" class="mono">• 70B TPOT: 8.4ms 🏆 | 32K并发: 96人 ✓ | 功耗: 1,700W | 整机: $68,000</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 4x NVIDIA H200 NVL (564GB HBM3e + 四卡 NVLink 桥接, 可跑 671B 🏆)</text>
  <text x="638" y="326" class="mono">• 70B TPOT: 4.9ms 🏆 | 32K并发: 220人 🏆 | 功耗: 3,100W | 整机: $132,000</text>

  <!-- Bottom Panel: PCIe Topology & NVFP4 Single-Card Math -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 边缘风冷一体机三大架构准则 (NVFP4 单卡免通信 × H200 NVL 桥接器 × 单路 CPU 防跨 NUMA)</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">准则 1: 96GB GDDR7 + NVFP4 消灭跨卡 TP</text>
  <text x="58" y="464" class="mono">• Llama-3.3-70B 转为 Blackwell 原生 NVFP4</text>
  <text x="58" y="484" class="mono">  后权重仅 36.5 GB！</text>
  <text x="58" y="504" class="mono">• 单张 96GB RTX PRO 6000 装完权重还剩</text>
  <text x="58" y="524" class="mono">  45 GB 放 KV Cache (TP=1 零 PCIe 通信)！</text>
  <text x="58" y="548" class="txt" fill="#6ee7b7">2 张卡跑 DP=2 独立双副本，吞吐直接翻倍！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">准则 2: 认准 H200 NVL 的 4-Way NVLink 桥接</text>
  <text x="436" y="464" class="mono">• 普通 PCIe GPU 没有 NVLink，但 H200 NVL</text>
  <text x="436" y="484" class="mono">  支持顶部插接 2-Way / 4-Way NVLink 桥接器</text>
  <text x="436" y="504" class="mono">  (提供 900 GB/s 互联，是 PCIe 的 14 倍)！</text>
  <text x="436" y="524" class="mono">• 4 张 H200 NVL 合计 564 GB HBM3e，可在</text>
  <text x="436" y="544" class="mono">  单台 4U 风冷机箱内直接跑满血 DeepSeek-671B</text>
  <text x="436" y="564" class="mono">  (W4A16/NVFP4 350GB 权重 + 130GB KV 池)！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">准则 3: PCIe 一体机严禁跨 CPU Socket 插卡</text>
  <text x="814" y="464" class="mono">• 踩坑: 4 张 L40S 分别插在 CPU0 和 CPU1 的</text>
  <text x="814" y="484" class="mono">  PCIe 槽位，P2P 跨 UPI/xGMI 总线掉速 60%！</text>
  <text x="814" y="504" class="mono">• 铁律: 选购单路 128 通道 AMD EPYC 主板</text>
  <text x="814" y="524" class="mono">  或带 Broadcom PEX89104 PCIe Gen5 Switch</text>
  <text x="814" y="544" class="mono">  的准系统，确保 4 卡处于同一 PCIe Root 域！</text>
</svg>
