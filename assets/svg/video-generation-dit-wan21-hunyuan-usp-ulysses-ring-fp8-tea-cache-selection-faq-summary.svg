<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#EC4899" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">视频生成扩散 Transformer (DiT: Wan2.1 / HunyuanVideo) 选型：xDiT USP vs. TP vs. TeaCache</text>
  <text x="52" y="94" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="15">攻克 72,000 时空 Token × 50 步 3D 全注意力算力墙：CFG=2 × Ulysses=4 序列并行 + FP8 SageAttention + TeaCache 跳步</text>

  <!-- Left: Why Video DiT Is Completely Compute-Bound -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么视频生成 DiT 的物理瓶颈与 LLM Decode 完全相反？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">🔥 极致算力受限 (Extreme Compute-Bound)：50 次 72K 全序列 Prefill！</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 5秒 720p 视频 = 72,000 个 3D Latent Tokens；每步去噪都要算 72K×72K 双向全注意力</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 叠加 Classifier-Free Guidance (Cond+Uncond) 需跑 100 轮前向传播，单卡耗时 342 秒！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 为什么照搬 LLM 的纯张量并行 `TP=8` 效率低下 (Tier 2)？</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• `TP=8` 不切分序列维度 S，且每步 40 层触发 80 次大张量 AllReduce（50 步共 4,000 次！）</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 通信占比飙升至 42%，单条视频成本反而比单卡还贵 ($0.43 vs $0.27)！</text>

  <!-- Right: xDiT USP + FP8 SageAttention + TeaCache -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 视频 DiT 实时交互级加速三板斧 (xDiT USP + FP8 + TeaCache)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 混合并行黄金组合：`CFG Parallel (2) × DeepSpeed-Ulysses (4)`</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">前 4 卡算 Cond、后 4 卡算 Uncond（每步仅末尾通信 1 次），组内 4 卡用 NVLink All-to-All 切分序列！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② `FP8 Linear + SageAttention2 (INT8/FP8 QK^T)`：算力直接翻倍</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">将占总耗时 65% 的 72K×72K 3D Attention 卸载到 Hopper/Blackwell FP8/INT8 Tensor Core</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ `TeaCache / PAB` 时间步残差特征复用：无损跳过 52% 中间去噪步</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">动态监测相邻去噪步特征变化率，平稳段直接复用上一步 DiT 残差，生成耗时压至 14.2 秒！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 720p 5 秒视频生成（Wan2.1-14B / HunyuanVideo-13B · 72K Tokens · 50 Steps）四档对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">视频 DiT 推理架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单条生成耗时</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单卡峰值显存</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">VBench 画质分</text>
  <text x="950" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">8卡整机时产视频</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单条视频成本</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 单卡 BF16 串行 CFG (100 次完整前向)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">342.0 sec (5.7m) ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">76.5 GB</text>
  <text x="790" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">84.8</text>
  <text x="950" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">84 条 / 小时</text>
  <text x="1120" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">$0.270 / 条</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 8 卡纯张量并行 (`TP=8` BF16, 4000 次 AllReduce)</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">68.5 sec</text>
  <text x="620" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">54.0 GB</text>
  <text x="790" y="568" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">84.8</text>
  <text x="950" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">52 条 / 小时 ✕</text>
  <text x="1120" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$0.430 / 条 ✕</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: xDiT 统一序列并行 (`CFG=2 × Ulysses=4` + FA3 BF16)</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">38.0 sec ✓</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">24.5 GB ✓</text>
  <text x="790" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">84.8 ✓</text>
  <text x="950" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">94 条 / 小时</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$0.240 / 条</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): xDiT USP + FP8 SageAttention2 + TeaCache 跳步</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">14.2 sec (-79%) ✓</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">15.8 GB ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">84.5 (无感) ✓</text>
  <text x="950" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">253 条/h (4.9x)</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$0.089 / 条 (-79%)</text>
</svg>
