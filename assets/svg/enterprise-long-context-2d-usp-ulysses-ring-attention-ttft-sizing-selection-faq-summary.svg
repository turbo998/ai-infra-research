<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">超长上下文 (128K–1M) 序列并行选型：纯 TP vs. Ring Attention vs. DeepSpeed Ulysses vs. 2D USP (#461)</text>
  <text x="28" y="58" class="sub">为什么 GQA-8 模型无法直接开 16 卡 Ulysses？如何用“机内 NVLink Ulysses=8 × 跨机 RDMA Ring=2”把 256K 首字压至 1.85 秒？</text>

  <!-- Left Panel: Ring vs Ulysses Limitations & 2D Hybrid USP -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么单一的 Ring Attention 或 Ulysses 都撑不起跨机 256K–1M？</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 单一序列并行的两大物理死胡同</text>
  <text x="56" y="164" class="mono">• 纯 Ulysses 死穴: 按注意力头 (Heads) 切分做 All-to-All，但 Llama-70B 只有 8 个 KV 头</text>
  <text x="56" y="184" class="mono">  (n_kv=8)，一旦超过 8 卡就无头可切！且跨机高频 All-to-All 极易打爆 RoCE 网络</text>
  <text x="56" y="202" class="txt">• 纯 Ring 死穴: 16 卡 P2P 环传 15 步，单块序列切得太碎导致计算压不住跨网通信 (6.4s ✕)！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 黄金解法：二维统一序列并行 (2D Hybrid USP = 机内 Ulysses × 跨机 Ring)</text>
  <text x="56" y="272" class="mono">• 维度 1 (机内 NVLink 900GB/s): 开 Ulysses=8 (刚好对齐 GQA-8 的 8 个 KV 头，零复制!)</text>
  <text x="56" y="292" class="mono">• 维度 2 (跨机 400G RDMA): 开 Ring=2/4 (跨机仅做大块 P2P 环传，计算/通信 96.6% 重叠!)</text>
  <text x="56" y="312" class="txt">• 效果: 256K 首字 TTFT 从 19.8s 压至 1.85s (快 10.7 倍)，轻松扩展至 1M 上下文 🏆</text>

  <!-- Right Panel: 4 Sequence Parallelism Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四档超长上下文 (256K Prompt) 并行架构实测对标 (16x H200)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 仅用单机 TP=8 (序列维度未切分 · 256K 激活爆显存或排队 19.8s)</text>
  <text x="638" y="158" class="mono">• 256K TTFT: 19.80s ✕ | 极限长度: 128K | 暴露通信占比: 42.0% ($38.40/千次)</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 纯 Ring Attention CP=16 (16步 P2P 环传 · 切块过碎难以掩盖延迟)</text>
  <text x="638" y="214" class="mono">• 256K TTFT: 6.40s | 极限长度: 512K | 暴露通信占比: 24.5% ($14.20/千次)</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 纯 DeepSpeed Ulysses SP=16 (需复制 GQA KV 头 + 跨机 All-to-All)</text>
  <text x="638" y="270" class="mono">• 256K TTFT: 5.10s | 极限长度: 512K | 暴露通信占比: 19.8% ($11.60/千次) ✓</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 2D Hybrid USP (机内 NVLink Ulysses=8 × 跨机 RDMA Ring=2) + FA3 FP8 (🏆)</text>
  <text x="638" y="326" class="mono">• 256K TTFT: 1.85s (-10.7x) 🏆 | 极限长度: 1M+ 🏆 | 暴露通信: 3.4% ($4.20/千次)!</text>

  <!-- Bottom Panel: 2D Device Mesh & Communication Volume Math -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 架构师手算：Ulysses vs. Ring 通信体积公式与硬件拓扑完美映射法则</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① DeepSpeed Ulysses (切序列转切注意力头)</text>
  <text x="56" y="464" class="mono">• Attention 前后各做 1 次 All-to-All (共 4 次/层)</text>
  <text x="56" y="484" class="mono">• 每卡单层通信体积 = 4 * S * H / N_ulysses</text>
  <text x="56" y="504" class="mono">• 优势: 通信量随卡数增加反而线性减小！</text>
  <text x="56" y="524" class="mono">• 硬约束: N_ulysses &lt;= n_kv_heads (GQA-8 最多切 8)</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">天生适合锁死在单机 8 卡 900GB/s NVLink 域内！</text>

  <rect x="418" y="414" width="368" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="432" y="440" class="txt" font-weight="700" fill="#34d399">② Striped Ring Attention (跨机 P2P 环传 KV)</text>
  <text x="432" y="464" class="mono">• 不受注意力头数量限制 (任意扩展至 2/4/8 台机器)</text>
  <text x="432" y="484" class="mono">• 采用 Striped (交错条带) 切分消除因果掩码</text>
  <text x="432" y="504" class="mono">  (Causal Mask) 下三角造成的 50% 空算负载不均！</text>
  <text x="432" y="524" class="mono">• 边算本块 Q*K^T 边用 RDMA 异步预取下一台机器的 KV</text>
  <text x="432" y="550" class="txt" fill="#34d399">天生适合跨节点 400G RDMA 大块流水线掩盖 🏆</text>

  <rect x="806" y="414" width="350" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="820" y="440" class="txt" font-weight="700" fill="#d8b4fe">③ 2D USP 算力与网络配平手算</text>
  <text x="820" y="464" class="mono">• 设总卡数 N = N_ulysses(8) * N_ring(2) = 16 卡</text>
  <text x="820" y="484" class="mono">• 256K 序列先被 Ring=2 切成两段 128K，再在机内</text>
  <text x="820" y="504" class="mono">  被 Ulysses=8 切成每卡仅 16K Token！</text>
  <text x="820" y="524" class="mono">• 单块 128K 算力充沛 (90ms/层) 完全盖住 3ms RDMA</text>
  <text x="820" y="550" class="txt" fill="#d8b4fe">256K 首字仅 1.85 秒，1M 上下文首字仅 11.4 秒！</text>
</svg>
