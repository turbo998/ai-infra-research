<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad415" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad415" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad415)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级网络安全运营中心（SOC 威胁狩猎）、MITRE 攻击链降噪与 SOAR 响应 Copilot 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">日均 15万条 SIEM/EDR 告警 · 传统静态Sigma规则 vs. 原始日志塞LLM全自动封禁 vs. 普通情报RAG vs. OCSF实体攻击图谱 + KQL沙箱 + 核心资产SOAR爆炸半径门禁</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">96.2% Acc · 6.5m MTTC</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 静态 Sigma 规则 + L1 人工研判</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">15万条告警淹没值班员，处置需3小时</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 92% 误报海啸，L1 分析师疲于复制粘贴查 IP</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 跨主机横向移动链条被割裂为孤立单点告警</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">攻击链归因准确率: 68.0% ✕</text>
  <text x="54" y="334" fill="#6ee7b7" font-size="13" font-weight="700">误隔离核心资产/日志注入率: 0.5%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">平均研判与遏制耗时(MTTC): 180.0 分钟 ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月SOC人力与驻留暴露成本: $320,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统安全值守，漏报APT横向移动风险高</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 原始日志塞 LLM + 全自动封禁隔离</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">遭 HTTP 日志提示词注入，把域控直接断网</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 黑客在 User-Agent 塞入恶意指令反控 SOAR</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 14.2% 概率误将生产域控/核心数据库隔离断网</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">攻击链归因准确率: 61.5% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">误隔离核心资产/日志注入率: 14.2% (灾难 ✕)</text>
  <text x="346" y="358" fill="#fde68a" font-size="12.5">平均研判与遏制耗时(MTTC): 12.0 分钟</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月SOC与自残断网停机成本: $450,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁把未转义外部日志直塞LLM并放权封网</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 威胁情报 RAG + 裸写 KQL/SPL</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">KQL 语法常报错或全表扫崩冷存储</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 未限制时间窗的 KQL 扫描 PB 级历史日志拖慢SIEM</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 缺乏实体图谱聚合，仍需人工串联多源线索</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">攻击链归因准确率: 82.4%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">误隔离/恶意日志扰动率: 2.8% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">平均研判与遏制耗时(MTTC): 42.0 分钟</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月SOC人力与SIEM查询成本: $135,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：辅助分析师写查询，缺乏攻击图谱与安全门禁</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad415)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: OCSF攻击图+KQL沙箱+SOAR铁闸 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">图谱降噪 98.5% + KQL 沙箱 + 皇冠资产保护</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• OCSF 实体图谱将 15万条告警聚合成完整攻击链</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• KQL 时间窗 AST 校验 + 核心资产白名单防自残</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">攻击链归因准确率: 96.2% 🏆 (+34.7pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">误隔离核心资产/注入率: 0.0% 🏆 (铁闸保护)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">平均研判与遏制耗时(MTTC): 6.5 分钟 🏆 (-96.4%)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月SOC运营总成本: $46,000 (-85.6% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：金融、云原生企业、关键基础设施 SOC/MDR</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业安全运营中心 (SOC) 架构师铁律（OCSF Entity Graph + KQL AST Sandbox + Crown-Jewel SOAR Gate）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 外部日志内容一律视为不可信攻击载荷（Untrusted Payload）：先经 OCSF 实体图谱聚合降噪 98.5%，并将原始字符串隔离在数据槽，严禁拼接到指令区。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. SOAR 响应必须绑定“皇冠资产白名单（Domain Controller / 核心库禁止自动断网）”与爆炸半径分级审批 · Provenance: synthetic + anonymized_reported</text>
</svg>
