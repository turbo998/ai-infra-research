<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#F59E0B" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">GPU 智算中心功耗封顶 (Power Capping / DVFS)、瞬态电流尖峰抑制与机柜配电超卖指南</text>
  <text x="52" y="94" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15">利用 P ∝ V²·f 立方非线性能效甜点：Decode 池锁 500W / 训练池锁 580W，在固定 10MW 机房多装 2,458 张 H200 (+24%)！</text>

  <!-- Left: Cubic Power Law & Synchronous Power Spikes -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么按铭牌 700W 满载配电会搁浅 24% 机房电力容量？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📐 半导体电压-频率三次方定律 (P_dynamic = C · V² · f ≈ k · f³)</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 从 550W 冲向 700W 的最后 150W (+27% 功耗)，仅能换来 +3%~4% 的 Tensor Core 频率提升！</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 在显存带宽受限的 Decode 阶段，HBM 频率恒定，限功至 500W 对 TPOT 影响甚至 &lt; 1.8%！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">⚡ 致命机房事故：万卡同步 AllReduce → GEMM 瞬态功率谐振跳闸</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 全柜 64 张卡在同一毫秒结束通信 (250W) 齐步进入矩阵乘 (780W 瞬态尖峰 di/dt)</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 若无硬件功率钳制直接盲目超卖配电 (Tier 2)，极易触发机柜 PDU 空开跳闸与电网冲击！</text>

  <!-- Right: Workload-Aware DVFS + Closed-Loop Rack PDU Governance -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 分池精准功耗封顶与机柜级闭环配电超卖三板斧 (Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 按工作负载瓶颈差异化设定 `nvidia-smi -pl` 功率墙</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Decode 节点池锁 `500W` (-28.5% 功耗, TPOT 仅慢 1.8%)；Prefill / 训练池锁 `580W` (MFU 保持 96.5%)</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 两级闭环机柜功率守护 (NVML Fast-Cap + BMC Redfish Rack Capper)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">固件毫秒级钳制单卡峰值 + 智能 PDU 达 92% 水位时联动下调低优批处理节点功耗上限</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 消除同步谐振：跨作业微秒级相位错峰 + 电源架超级电容平抑</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">在固定 10MW 机房内安全多装 2,458 张 H200，整馆总有效算力净增 +23.5%！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 固定 10 MW 电力配额机房四档 GPU 功耗治理与装机容量对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">机房功耗封顶与超卖方案</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">10MW 可装 H200</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单卡相对性能</text>
  <text x="790" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">10MW 总产出指数</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">每焦耳 Token 能效</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">机柜跳闸风险</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 700W 满功耗无封顶 + 按铭牌静态 1:1 配电</text>
  <text x="450" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">10,200 GPUs</text>
  <text x="620" y="524" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">100.0%</text>
  <text x="790" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">100.0 (基准)</text>
  <text x="960" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">基准 (+0.0%)</text>
  <text x="1120" y="524" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">HIGH (瞬态尖峰)</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: 无硬件限功直接盲目超卖 1.25x 机柜配电</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">12,750 GPUs</text>
  <text x="620" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">98.5%</text>
  <text x="790" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">108.0 (频繁掉线)</text>
  <text x="960" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">+0.0%</text>
  <text x="1120" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">CRITICAL (跳闸!) ✕</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: 全场一刀切静态 `550W` 功耗封顶 (`nvidia-smi -pl 550`)</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">12,048 GPUs (+18%)</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">95.8% ✓</text>
  <text x="790" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">115.4 (+15.4%) ✓</text>
  <text x="960" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">+21.8% ✓</text>
  <text x="1120" y="612" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="14">LOW ✓</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): 负载感知动态限功 (500W Decode / 580W Train) + 机柜闭环</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">12,658 GPUs (+24%)</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">97.6% ✓</text>
  <text x="790" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">123.5 (+23.5%) ✓</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">+26.4% ✓</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">ZERO (零跳闸) ✓</text>
</svg>
