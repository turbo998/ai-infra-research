  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么 GPU 机密计算 (Confidential AI) 能终结“云上不安全、自建买不起”的死局？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad386)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 补齐最后一块拼图：运行态内存加密 (Data-in-Use)</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 传统安全只管静态磁盘 (At-Rest) 与网络传输 (In-Transit)；</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• `AMD SEV-SNP / Intel TDX` 配合 `NVIDIA H100/H200 CC`</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  把 CPU 内存、GPU 显存与 PCIe 传输用硬件 AES-GCM-256 锁死，</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 宿主机 Hypervisor 若强行 Dump 内存，拿到的 100% 是乱码密文！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 为什么 70B 大模型开 GPU 机密计算只慢 5.8%？</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• GPU 机密计算的加密损耗只发生在 **CPU 与 GPU 跨越 PCIe</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  总线拷贝输入/输出 Token ID** 的瞬间（Bounce Buffer 加解密）！</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 一旦进入 H100/H200 显存内部，80层矩阵乘法以 100% 原生满血</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  速度运行！模型越大（70B vs 7B），PCIe 加密占比越小（仅 5.8%）！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 商业私有模型防盗利器：远程证明 + HSM 密钥释放</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 当软件商把核心行业大模型部署到客户环境或云端时，</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 磁盘上的模型权重全程加密存放；启动时由硬件芯片生成签名证据</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  向 HSM 发起远程证明 (Attestation)，验证容器哈希未被篡改后</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  才把解密密钥直发飞地内存，连客户方 Root 管理员也拷不走模型！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 386 合成标定算例 (independently_reproduced=false)</text>
