  <rect width="1200" height="680" fill="url(#bgGrad396)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级千亿 MoE 大模型 (DeepSeek-671B / Qwen3-235B) 并行架构选型指南：TP vs. EP 与热点专家均衡</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：中小规模首选单机 8xH200 (1,128GB) 机内 NVLink；大规模集群采用宽专家并行 (EP) + DeepEP 双微批重叠 + EPLB 冗余专家提速 4.99x</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 396 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 双机跨网纯张量并行 TP=16</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 2台 8xH100 (80GB) 跨机硬拉 TP=16</text>
  <text x="40" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 每个 Token 触发 122 次跨机同步屏障 ✕</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 单卡有效吞吐：仅 148 tok/s/GPU ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• P99 吐字间隔 (TPOT)：82.0 ms ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 256 个专家被切碎成极小矩阵，算力空转</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">15K吞吐月成本：$96,000 / 月 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">反模式：照搬稠密模型 70B 的 TP 思路去</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">跨机切分稀疏 MoE 专家，被通信延迟拖死</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="332" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 2: 单机 8xH200 机内 NVLink</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 1台 8xH200 (1,128GB) 完整装下 671B</text>
  <text x="332" y="192" fill="#34d399" font-size="12" font-weight="700">• 100% 通信走机内 900 GB/s NVLink ✅</text>
  <text x="332" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 单卡有效吞吐：606 tok/s/GPU ✅ (4.1x)</text>
  <text x="332" y="232" fill="#34d399" font-size="12" font-weight="700">• P99 吐字间隔 (TPOT)：23.5 ms ✅</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• 零跨机 RDMA 网络调优负担，开箱即稳</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="454" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">15K吞吐月成本：$54,000 (省 43.8%)✅</text>
  <text x="332" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：&lt;= 24 张卡企业私有化部署头号首选</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">用单机超大显存彻底消灭跨机通信难题！</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="624" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 3: 跨机静态 EP=16 (无EPLB)</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 每张卡放 16 个完整专家，走 All-to-All</text>
  <text x="624" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 热门专家(写代码/算账)所在卡负载高 3.4x✕</text>
  <text x="624" y="212" fill="#fde68a" font-size="12" font-weight="700">• 单卡有效吞吐：465 tok/s/GPU</text>
  <text x="624" y="232" fill="#fde68a" font-size="12" font-weight="700">• P99 吐字间隔 (TPOT)：36.0 ms</text>
  <text x="624" y="252" fill="#fca5a5" font-size="12">• 15 张空闲卡干等 1 张“热点慢卡 (Straggler)”</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="746" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">15K吞吐月成本：$64,000 / 月</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">痛点：企业垂直流量集中触发特定领域专家</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">导致木桶效应（最忙的 1 张卡决定全群速度）</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 宽 EP+双微批+热点复制🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• EP=16/32 + DeepEP 双微批通信计算重叠</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• EPLB 动态复制热点专家 (负载比 1.08x) 🏆</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 单卡有效吞吐：738 tok/s/GPU 🏆 (4.99x)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• P99 吐字间隔 (TPOT)：19.5 ms 🏆</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• Attention 用 DP 省 KV + FFN 用 EP 提算力</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">15K吞吐月成本：$38,000 (省 60.4%)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：大规模高并发 671B 算力中心终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">把 80GB H100/H800 多机集群压榨出极限吞吐</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 站在架构师选型视角看懂稀疏 MoE 三大黄金法则：为什么 MoE 绝不能照搬稠密 70B 模型的 TP 策略？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad396)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 为什么切专家 (EP) 比切矩阵 (TP) 快得多？</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• DeepSeek-671B 每层有 **256 个路由专家**，每个专家本身很小；</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 如果做 `TP=16`（把每个小专家再横切 16 刀），矩阵太碎跑不满 GPU！</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">• 做 `EP=16`（每张卡完整放 16 个专家，不切碎专家），</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">  配合 `DP Attention`（注意力层不跨卡复制 KV），显存与吞吐双赢！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 消除“木桶慢卡”：热点专家动态冗余复制 (EPLB)</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 企业真实流量不是均匀随机数！写代码高峰期，“Python 专家 #42”</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  被调用的次数是冷门专家的 `3.4 倍`，导致 15 张卡等 1 张卡！</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 启用 EPLB (Expert Parallelism Load Balancer)：每张卡多预留 1~2 个</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  冗余专家槽，自动把最热的 Top-8 专家复制到多张卡上分流请求！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 架构师买卡决策：单机 H200 还是多机 H100 EP？</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• **总卡数 &lt;= 24 张、缺 RDMA 网络专家**：无脑买 **单机 8xH200 (141GB)**！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">  1 台机器装下整套 671B-FP8，免去一切跨机 RoCE/IB 排障痛苦；</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• **已有多台 80GB H100/H800 或 &gt;=32 卡超高吞吐中心**：</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  必开 `vLLM / SGLang DP-Attention + DeepEP + EPLB`（单卡达 738 tok/s）！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 396 合成标定算例 (independently_reproduced=false)</text>
</svg>
