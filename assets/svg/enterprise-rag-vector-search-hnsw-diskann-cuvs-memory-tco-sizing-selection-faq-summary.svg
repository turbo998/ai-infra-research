<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业十亿级向量检索与混合 RAG 基础设施选型：纯内存 HNSW vs. DiskANN NVMe vs. GPU cuVS (#467)</text>
  <text x="28" y="58" class="sub">打破 10 亿条 1536 维向量高达 8.42 TB 的天价内存账单：DiskANN 压降 DRAM 98.3% ($2.95万/年)，cuVS CAGRA 提速建索引 13.6x</text>

  <!-- Left Panel: The 8.42 TB DRAM Trap of Naive HNSW -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么 10 亿条向量上纯内存 HNSW 会买空云厂商的高内存机型？</text>

  <rect x="42" y="120" width="524" height="92" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">⛔ 裸 FP32 HNSW 内存膨胀公式 (10亿 × 1536维 = 8.42 TB DRAM ✕)</text>
  <text x="56" y="164" class="mono">• 原始向量: 10^9 * 1536 * 4B = 6.14 TB</text>
  <text x="56" y="184" class="mono">• HNSW 邻接图边 (M=32): 10^9 * 2 * 32 * 4B * 1.15 = 0.29 TB</text>
  <text x="56" y="202" class="mono">• 引擎/分片水线与 OS Buffer 预留 (1.3x): 合计需 8.42 TB 纯内存 ($41.2万/年)!</text>

  <rect x="42" y="224" width="524" height="106" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="246" class="txt" font-weight="700" fill="#34d399">✅ DiskANN (DRAM PQ + NVMe) + GPU cuVS 加速建索引 (省 90.7% 成本 🏆)</text>
  <text x="56" y="268" class="mono">• DiskANN: 内存仅放 64B PQ 压缩码 (0.14 TB DRAM)，把全量向量与邻接边</text>
  <text x="56" y="288" class="mono">  对齐封装进本地 NVMe SSD 的 4KB 扇区，1 次随机 I/O 同时取边+重排！</text>
  <text x="56" y="308" class="mono">• NVIDIA cuVS CAGRA: 将 10 亿向量建图耗时从 38 小时压至 2.8 小时 (13.6x)！</text>

  <!-- Right Panel: 4 Vector Search Tiers Comparison -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 十亿级向量 (1B × 1536d) 四种索引架构定量对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 纯内存裸 FP32 HNSW (M=32, 全量常驻主机 DRAM)</text>
  <text x="638" y="158" class="mono">• DRAM: 8.42 TB ✕ | P99: 4.2ms | 建索引: 38h | 年TCO: $412,000</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 内存量化 HNSW (SQ8 / Binary Quantization + 3x 精排)</text>
  <text x="638" y="214" class="mono">• DRAM: 2.15 TB | P99: 5.8ms | 建索引: 29h | 年TCO: $118,000</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: DiskANN / Vamana 磁盘图索引 (64B PQ DRAM + NVMe SSD)</text>
  <text x="638" y="270" class="mono">• DRAM: 0.14 TB (-98.3%) ✓ | P99: 11.4ms | 建索引: 22h | 年TCO: $29,500</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: GPU cuVS CAGRA 极速建图 + 冷热分层 (Hot-SQ8 + Warm-DiskANN) (🏆)</text>
  <text x="638" y="326" class="mono">• DRAM: 0.38 TB 🏆 | P99: 3.6ms 🏆 | 建索引: 2.8h (13.6x) | 年TCO: $38,400</text>

  <!-- Bottom Panel: End-to-End Hybrid RAG Latency & Sizing Formulas -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 混合 RAG (BM25 + Dense + Cross-Encoder Reranker) 容量手算与架构准则</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="58" y="440" class="txt" font-weight="700" fill="#38bdf8">公式 1: HNSW vs. DiskANN 内存手算公式</text>
  <text x="58" y="464" class="mono">• M_HNSW = N * (4*d + 8*M) * 1.30</text>
  <text x="58" y="484" class="mono">  (1536维 M=32 -&gt; 每百万条需 8.42 GB DRAM)</text>
  <text x="58" y="506" class="mono">• M_DiskANN = N * (B_PQ + 64B_meta) * 1.25</text>
  <text x="58" y="526" class="mono">  (64B PQ -&gt; 每百万条仅需 0.14 GB DRAM!)</text>
  <text x="58" y="550" class="txt" fill="#6ee7b7">超过 5,000 万条向量即刻切换 DiskANN / 分层架构！</text>

  <rect x="420" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="436" y="440" class="txt" font-weight="700" fill="#34d399">公式 2: Cross-Encoder 精排算力防雪崩</text>
  <text x="436" y="464" class="mono">• 粗排召回 Top-K = 100 (BM25 50 + 向量 50)</text>
  <text x="436" y="484" class="mono">• 严禁把 100 篇文档直接塞进 70B LLM Prefill!</text>
  <text x="436" y="506" class="mono">• 用 L40S 跑 BGE-Reranker-v2 (FP8, 14ms)</text>
  <text x="436" y="526" class="mono">  将 Top-100 浓缩为 Top-5 送入 LLM，</text>
  <text x="436" y="546" class="mono">  直接削减 95% 的 RAG Prefill Token 账单！</text>

  <rect x="798" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="814" y="440" class="txt" font-weight="700" fill="#d8b4fe">公式 3: Matryoshka (MRL) 俄罗斯套娃降维</text>
  <text x="814" y="464" class="mono">• 采用支持 MRL 的 Embedding 模型 (如</text>
  <text x="814" y="484" class="mono">  text-embedding-3-large / BGE-M3):</text>
  <text x="814" y="504" class="mono">  - 第一阶段: 截取前 256 维 + Binary 1-bit</text>
  <text x="814" y="524" class="mono">    在内存极速粗筛 Top-200 (内存省 96x)</text>
  <text x="814" y="544" class="mono">  - 第二阶段: 异步从 NVMe 读 1536 维 FP16</text>
  <text x="814" y="564" class="mono">    重打分，Recall@10 保住 97.6%！</text>
</svg>
