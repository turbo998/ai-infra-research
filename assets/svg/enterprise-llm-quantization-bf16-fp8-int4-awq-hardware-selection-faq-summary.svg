<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad384" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad384" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad384)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级大模型量化与硬件代际匹配选型指南：BF16 vs. FP8 (W8A8KV8) vs. INT4 (AWQ/GPTQ)</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：Hopper (H100/H200) 与 Ada (L40S) 必选原生 FP8 (W8A8KV8)，精度保持 99.7% 且单卡吞吐提 2.24x；A100 首选 AWQ W4A16</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 384 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#64748b" stroke-width="1.5"/>
  <text x="40" y="150" fill="#cbd5e1" font-size="14.5" font-weight="800">⬜ Tier 1: 原生无损 BF16 (W16A16)</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 70B 仅权重就占 140 GB 显存</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 强制跨 2~4 张 80GB 显卡做 TP 切分</text>
  <text x="40" y="212" fill="#34d399" font-size="12" font-weight="700">• 精度保持率：100.0% (86.0分基准)</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 单卡有效吞吐：仅 340 tok/s ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 显存带宽与 KV 容量浪费一半 ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#1e293b"/>
  <text x="162" y="296" fill="#cbd5e1" font-size="12.5" font-weight="700" text-anchor="middle">200 RPS 集群月成本：$48,000 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">定位：仅做离线评测黃金基准参考</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">大规模在线推理直接跑 BF16 极不划算</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 2: 无校准朴素 INT4 (RTN)</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 直接四舍五入截断至 4-bit (无激活校准)</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 70B 权重缩至 38 GB，单卡可塞下</text>
  <text x="332" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 精度保持率：暴跌至 93.3% (-5.8分) ✕</text>
  <text x="332" y="232" fill="#fde68a" font-size="12" font-weight="700">• 单卡有效吞吐：590 tok/s</text>
  <text x="332" y="252" fill="#fca5a5" font-size="12">• 财务算术、复杂 SQL 与长文严重降智 ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="454" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$16,500 (业务不可用) ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">大坑：造成“一旦量化模型就会变傻”</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">刻板印象的罪魁祸首，严禁上企业生产</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 校准 INT4 (AWQ/Marlin)</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 保护 1% 显著权重通道 (W4A16)</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 38.5 GB 权重轻松塞进单张 80GB A100</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 精度保持率：97.9% ✅ (84.2分)</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 单卡有效吞吐：610 tok/s ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 完美适配无 FP8 硬件的老款 A100/A10G</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$18,000 (A100首选) ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：Ampere 架构 (A100/A10G) 或低并发</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：Batch&gt;64 时实时反量化转 FP16 拖慢算力</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 原生 FP8 全量化 (W8A8KV8)🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 权重+激活+KV 缓存全走硬件 FP8</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 精度保持率：99.7% 🏆 (85.7分 无损级)</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 单卡有效吞吐：762 tok/s 🏆 (提 2.24x)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 70B 权重 70GB，单张 H200 (141G) 通吃</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 算力 FLOPS 与显存带宽双重翻倍！</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$21,400 (省 55.4%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：H100 / H200 / L40S 企业生产绝对主力</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">兼顾“媲美 BF16 的零损精度”与“2.24x 高吞吐”</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 架构师必记的“看卡下菜碟”黄金匹配铁律：为什么严禁在 A100 上跑 FP8 W8A8？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad384)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. GPU 代际与量化格式铁律（Hardware Match）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• **Hopper (H100/H200) &amp; Ada (L40S)**：拥有原生 **FP8 Tensor Core**，</text>
  <text x="44" y="568" fill="#34d399" font-size="12.5" font-weight="700">  跑 `FP8 W8A8` 算力直接比 BF16 翻 2 倍！</text>
  <text x="44" y="590" fill="#cbd5e1" font-size="12.5">• **Ampere (A100 / A10G)**：**根本没有硬件 FP8 Tensor Core**！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">  A100 必须选 **`INT4 AWQ/GPTQ (Marlin W4A16)`** 才最快！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 为什么大并发下 W8A8 比 W4A16 反而更快？</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• `W4A16` 是“仅权重量化”：计算前必须先把 4-bit 权重实时解压</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  回 16-bit，再用 **FP16 Tensor Core** 做矩阵乘。</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 当并发 Batch &gt; 32 进入算力瓶颈时，W4A16 仍受限于 FP16 算力；</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  而 `FP8 W8A8` 权重和激活全是 8-bit，直接跑 2 倍速的 FP8 算子！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 千万别漏掉 `FP8 KV Cache`（白捡 2 倍并发）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 很多团队只量化了模型权重，却把 KV Cache 留在 BF16 (16-bit)！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 开启 `--kv-cache-dtype fp8`（配合校准缩放因子），</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  单卡可承载的最大并发上下文 Token 数直接翻倍（2.0x），</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  且 Decode 阶段读取 KV 的显存带宽压力立刻减半！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 384 合成标定算例 (independently_reproduced=false)</text>
</svg>
