<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad378" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad378" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad378)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级智能问数 (Text-to-SQL)、语义层 (Semantic Layer) 与数仓 BI Agent 选型指南</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：语义层指标 API + SQLGlot AST 沙箱 + EXPLAIN 扫描熔断 + OBO 原生 RLS，将业务准确率从 52.0% 提至 96.4% 且零天价扫表事故</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 378 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 全库 DDL 裸塞 Prompt</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 300张表 CREATE TABLE 全塞</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 字段缩写歧义 (amt_v2_adj)</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 业务口径准确率：仅 52.0% ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 全表 CROSS JOIN 事故率：4.6% ✕</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 共享高权限账号（越权查薪资）✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$38,500 (含数仓扫表) ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">定位：仅限 ≤10 张表的玩具 Demo</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">生产数仓直接裸连必出财务与安全事故</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 动态 Schema-RAG + SQL</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• Top-15表检索 + Golden SQL 范例</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 解决 Prompt 长度，但仍现场造公式</text>
  <text x="332" y="212" fill="#fde68a" font-size="12" font-weight="700">• 业务口径准确率：73.5% (公式漂移)</text>
  <text x="332" y="232" fill="#fde68a" font-size="12" font-weight="700">• 失控全表扫描率：1.4% ✕</text>
  <text x="332" y="252" fill="#fde68a" font-size="12">• Prompt 拼接 WHERE 权限易被绕过</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$14,200 (同问不同数) ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">痛点：财务部和销售部问“Q3毛利率”</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">LLM 写出两套不同减法公式，高管不敢信</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 统一语义层指标 API 优先</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• Cube / dbt MetricFlow / Fabric IQ</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• LLM 只选指标与维度，不手写 JOIN</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 业务口径准确率：92.8% ✅ (+19.3pts)</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• 失控扫描率：0.1% ✅ (P95 2.1s)</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 100% 保证全公司高管指标口径唯一</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$7,600 (省 80.3%) ✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：高管驾驶舱、财务经营周报</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：未沉淀的 15% 长尾探索查询需补齐</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: 语义层+AST沙箱+RLS 🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 85% 走语义层 + 15% 受控 Text-to-SQL</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• SQLGlot AST 只读校验 + EXPLAIN 熔断</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 业务口径准确率：96.4% 🏆 (含2步自愈)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 失控全表扫描率：0.0% 🏆 (&gt;10GB拦截)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• OAuth OBO 下推数仓原生 RLS/CLS</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">月成本：$8,200 (省 78.7%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级全员智能问数 (ChatBI) 终局</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">兼顾“核心指标绝对零算错”与“长尾灵活分析”</text>

  <!-- Bottom Pipeline & Governance Panel -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么企业级智能问数必须“语义层优先（Semantic-First）”且绝不能共用数据库账号？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad378)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 消灭“同名不同义”口径灾难（85% 走语义层 API）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 严禁让大模型每次现场猜“净营收”怎么扣退货和税！</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 大模型仅输出 JSON：`{measure: "net_revenue", dim: "region"}`，</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  由 Cube / MetricFlow / Fabric IQ 确定性编译标准 SQL！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 高管看板与 AI 助手共享唯一套 YAML 指标字典</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. SQLGlot AST + EXPLAIN 预检熔断（防数仓天价账单）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 针对 15% 长尾自由生成 SQL：先经 SQLGlot AST 解析语法树，</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  硬性拦截 `DROP/UPDATE/GRANT` 及未带时间分区的笛卡尔积。</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 强制先跑 `EXPLAIN / Dry-Run`：若预估扫描字节 &gt; 10 GB</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  立即熔断退回重写，彻底杜绝一条烂 SQL 烧掉上万美元！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. OAuth OBO 身份透传与数仓原生 RLS/CLS</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 严禁所有用户共用一个 `bi_agent_admin` 超级连接池！</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 通过 OAuth 2.0 On-Behalf-Of (OBO) 或 `SET ROLE / SESSION`</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  将提问者身份下推至 Snowflake/Databricks/Fabric 原生行级策略，</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">• 华东区经理即使篡改 Prompt 也永远查不出华南区底薪明细！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 378 合成标定算例 (independently_reproduced=false)</text>
</svg>
