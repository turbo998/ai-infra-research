<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad383" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad383" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad383)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级大模型推理架构选型指南：混部连续批处理 (Colocated) vs. 预填充-解码分离 (PD Disaggregation)</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：8卡以下首选混部分块预填充 (Chunked Prefill)；16卡+长上下文且具备 RDMA 时，异构 PD 分离将达标有效吞吐 (Goodput) 提升 2.19x</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 383 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 朴素混部 (无分块 Prefill)</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 8K 长 Prompt 到达时独占 GPU 算力</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 正在流式吐字的其他用户被强行卡顿</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• P99 吐字间隔 (TPOT)：148.0 ms ✕</text>
  <text x="40" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 达标有效吞吐：仅 1,150 tok/s ✕</text>
  <text x="40" y="252" fill="#cbd5e1" font-size="12">• P95 首字延迟 (TTFT)：620 ms</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">5K吞吐达标月成本：$92,000 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：前端打字机效果一卡一顿</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">为了不超 TPOT 只能让显卡半空转运行</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="332" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 2: 混部 + 动态分块 Prefill</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 将 8K 输入切成 2048 块穿插 Decode</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 无需 RDMA 网卡，单机即可零成本开启</text>
  <text x="332" y="212" fill="#fde68a" font-size="12" font-weight="700">• P99 吐字间隔 (TPOT)：46.0 ms</text>
  <text x="332" y="232" fill="#7dd3fc" font-size="12" font-weight="700">• 达标有效吞吐：2,480 tok/s ✅</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• P95 首字延迟 (TTFT)：740 ms ✅</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="454" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">5K吞吐达标月成本：$46,000 ✅</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">定位：&lt;= 8 张 GPU 或无 RDMA 环境首选</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">简单稳健，覆盖 80% 中小规模企业场景</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="624" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 3: 普通 TCP 网络强上 PD 分离</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 在 25GbE 普通以太网上搬运 1.2GB KV</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 网卡与 CPU 拷贝瞬间成为最大瓶颈</text>
  <text x="624" y="212" fill="#34d399" font-size="12" font-weight="700">• P99 吐字间隔 (TPOT)：24.0 ms</text>
  <text x="624" y="232" fill="#fca5a5" font-size="12" font-weight="700">• 达标有效吞吐：1,820 tok/s (反降!) ✕</text>
  <text x="624" y="252" fill="#fca5a5" font-size="12" font-weight="700">• P95 TTFT：暴涨至 1,050 ms ✕</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="746" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">5K吞吐达标月成本：$58,000 ✕</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">血泪铁律：没有 100G+ RDMA 或机内 NVLink，</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">绝对不要跟风拆跨机 PD 分离（比混部更慢）！</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: RDMA 异构 PD 分离 🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 10P (算力池) : 6D (高显存带宽池) 解耦</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 200G/400G RoCEv2/IB 零拷贝传 FP8 KV</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• P99 吐字间隔 (TPOT)：21.5 ms 🏆</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• 达标有效吞吐：5,420 tok/s 🏆 (2.19x)</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• P95 TTFT：490 ms 🏆</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">5K吞吐达标月成本：$25,000 (省45.7%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：16卡+长上下文 RAG/Agent 生产集群</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">彻底消除 Prefill 与 Decode 的物理打架</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 架构师拍板指南：什么时候老老实实用“混部 (Colocated)”，什么时候才该上“PD 分离 (Disaggregated)”？</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad383)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 为什么混部时 Prefill 和 Decode 会打架？</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• **Prefill（读题）是算力密集型 (Compute-Bound)**：1条 8K 请求打满 Tensor Core；</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• **Decode（吐字）是显存带宽密集型 (Bandwidth-Bound)**：需大 Batch 拼单才划算。</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">• 混在同一张卡上时，长 Prefill 强行插队会导致 Decode 卡顿 150ms+！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 解耦后：P 池专注小 Batch 极速读题，D 池专注超大 Batch 丝滑吐字！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. KV 缓存网络带宽硬门槛（为什么禁跑普通 TCP）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 70B 模型 (GQA) 在 FP8 精度下，每 1,000 Token 的 KV 缓存约 `80 MB`；</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">• 一条 8K 请求需从 P 节点向 D 节点传输 **`~640 MB` (BF16 达 `1.28 GB`)**！</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 25GbE TCP 传 1.28GB 要 400ms+；而 200G/400G GPUDirect RDMA</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">  配合“边算边传 (Layer-by-Layer Pipelined Transfer)”仅增 &lt;15ms！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 架构师黄金准入红线（不满足 3 条严禁上 PD 分离）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• ① 集群规模 **&gt;= 16 张 GPU**（或单机 8 卡 NVLink 内部 5P:3D 切分）；</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• ② 平均输入长度 **&gt;= 4,096 Tokens**（长 RAG / Agent 场景）；</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• ③ 具备 **100G~400G RoCEv2 / InfiniBand RDMA** 或机内 NVLink。</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">• 若不满足以上任一条，直接用 **Tier 2 (混部 + Chunked Prefill)**！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 383 合成标定算例 (independently_reproduced=false)</text>
</svg>
