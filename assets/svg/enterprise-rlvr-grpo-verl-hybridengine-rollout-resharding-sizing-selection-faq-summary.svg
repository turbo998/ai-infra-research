<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#523 企业大模型强化学习后训练 (`RLVR / GRPO`)：`veRL HybridEngine / slime` 训推共池选型指南</text>
  <text x="30" y="60" class="sub">解决 GRPO 中“训练等推理、推理等训练 (54% 空转)”与“长思维链慢样本拖慢全集群” · 0.9s 原地重分片提速 2.45x、省 62.5% GPU</text>

  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么 GRPO 强化学习中 Actor Rollout 占了 75% 时间却有一半卡在空转？</text>
  <text x="48" y="132" class="txt bad">• 痛点 1 (静态物理拆池空泡 54%): 若 32 卡跑 vLLM Rollout、32 卡跑 FSDP 训练，</text>
  <text x="64" y="150" class="txt bad">生成样本时训练池 100% 闲置，反向传播时推理池闲置，且跨池传权重耗时 18.5s ✕</text>
  <text x="48" y="174" class="txt warn">• 痛点 2 (长尾 16K CoT 样本木桶效应): 95% 样本 2K 词已算完，全集群却在等</text>
  <text x="64" y="192" class="txt warn">最后 5% 走入死胡同的 16K 超长样本 (空泡仍达 31.5% ✕)</text>
  <text x="48" y="216" class="txt good">• 2026 veRL HybridEngine / slime 三大破局 (空泡压至 8.4% 🏆):</text>
  <text x="64" y="236" class="txt">① 同一批 GPU 训推分时复用: FSDP 切分 → vLLM TP 推理权重 0.9s 显存内重分片</text>
  <text x="64" y="256" class="txt good">② 异步 Partial Rollout (截断跨步续跑长尾样本) + vLLM Sleep Mode 秒级释放显存 🏆</text>

  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 7 天完成 70B GRPO 强化学习后训练的三套架构选型对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (静态物理拆池 Actor + Learner + 网络同步权重): 空泡 54.0% ✕</text>
  <text x="594" y="152" class="txt bad">每小时仅跑 14.2 步 GRPO，7 天完训需 64 张 H200 ($31.2 万 ✕)</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (基础共池但同步死等长尾 16K 样本): 空泡 31.5%，</text>
  <text x="594" y="198" class="txt warn">每小时 22.8 步，7 天完训需 40 张 H200 ($19.5 万)</text>
  <text x="578" y="224" class="txt good">• 方案 3 (veRL HybridEngine / slime 0.9s 重分片 + Partial Rollout 🏆):</text>
  <text x="594" y="246" class="txt good">- GPU 空泡压至 8.4% · 每小时完成 34.8 步 (吞吐暴涨 2.45 倍！🏆)</text>
  <text x="594" y="268" class="txt good">- 7 天完训仅需 24 张 H200 ($11.7 万，立省 62.5% GPU 与 $19.5 万预算 🏆)</text>

  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 三种 RLVR/GRPO 架构的每小时迭代步数 (Steps/hr) 与 7 天完训所需 H200 卡数对比</text>

  <text x="48" y="378" class="txt">方案 1: 静态拆池 (54.0% 空泡)</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">64 张 H200 ($31.2万) | 仅 14.2 步/小时 · 权重同步 18.5s ✕</text>

  <text x="48" y="418" class="txt">方案 2: 同步共池 (等 16K 长尾样本)</text>
  <rect x="305" y="404" width="300" height="16" fill="#f59e0b" rx="4"/>
  <text x="615" y="418" class="txt warn">40 张 H200 ($19.5万) | 22.8 步/小时 · 长尾等待空泡 31.5%</text>

  <text x="48" y="458" class="txt good">方案 3: veRL HybridEngine + 异步续跑 🏆</text>
  <rect x="305" y="444" width="180" height="16" fill="#10b981" rx="4"/>
  <text x="495" y="458" class="txt good">仅 24 张 H200 (省 62.5% 卡 🏆) | 34.8 步/小时 (快 2.45x) · 空泡仅 8.4% 🏆</text>
</svg>
