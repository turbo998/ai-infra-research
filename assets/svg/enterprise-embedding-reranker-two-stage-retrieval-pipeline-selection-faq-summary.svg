<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad400" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad400" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad400)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级 Embedding 嵌入与 Reranker 重排双阶段检索管线选型指南 (Round 400)</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：俄罗斯套娃 (MRL) 1024维粗排 + 分数裕度早停 (40%免重排) + TensorRT FP8 Top-30 重排，NDCG@10 达 92.4%、延迟仅 24ms 且省 91.6%</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 400 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 单阶段 3072维向量裸跑</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 仅用 Bi-Encoder 余弦相似度取 Top-10</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 无重排器交叉注意力核对，3072维极占内存</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 排序精度 NDCG@10：仅 76.8% ✕</text>
  <text x="40" y="232" fill="#34d399" font-size="12" font-weight="700">• P95 检索延迟：62.0 ms</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 向量库内存开销比 1024 维高 3 倍 ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">3,000万次月成本：$19,800 ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">痛点：双塔向量把整段话压成 1 个向量</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">遇到细粒度数字与否定词极易把错块排第1</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: 重型 7B 嵌入 + 9B 重排</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 盲目照搬 MTEB 榜首 7B/9B 巨型模型</text>
  <text x="332" y="192" fill="#cbd5e1" font-size="12">• 每次对 100 个候选块跑 9B Cross-Encoder</text>
  <text x="332" y="212" fill="#34d399" font-size="12" font-weight="700">• 排序精度 NDCG@10：91.5%</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• P95 检索延迟：高达 480.0 ms ✕</text>
  <text x="332" y="252" fill="#fca5a5" font-size="12">• 仅检索环节就要吃掉 12 张 GPU ✕</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">3,000万次月成本：$34,500 ✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">反模式：“学术刷榜综合征”——还没进主 LLM</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">光查个参考资料就先花掉半秒钟和 12 张卡！</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 标准轻量双阶段 (Top-100)</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 0.6B Embedding + 568M Reranker (BGE-M3)</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 每次机械重排全部 Top-100 候选块</text>
  <text x="624" y="212" fill="#7dd3fc" font-size="12" font-weight="700">• 排序精度 NDCG@10：90.8% ✅</text>
  <text x="624" y="232" fill="#7dd3fc" font-size="12" font-weight="700">• P95 检索延迟：95.0 ms ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 向量维度：1,024 维</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">3,000万次月成本：$7,200 (-79.1%)✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：通用生产 RAG 双阶段检索基线</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：40% 极高确信命中仍白跑 100 次重排</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: MRL+裕度早停+FP8重排🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• MRL 1024维 + RRF 分差 &gt;=0.18 免重排(40%)</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• TensorRT FP8 精排 Top-30 + 0.35 噪音截断</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 排序精度 NDCG@10：92.4% 🏆 (+15.6pts)</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• P95 检索延迟：仅 24.0 ms 🏆 (快 20.0x)</text>
  <text x="916" y="252" fill="#cbd5e1" font-size="12">• 剔除低分噪音块，下游 LLM 首字再快 35%</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">3,000万次月成本：$2,900 (省91.6%)🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级高并发低延迟检索管线终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">24ms 极速交付高纯度 Top-5 证据</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 为什么“千万别盲目追 MTEB 榜首的 7B Embedding/Reranker”？企业级检索管线三大架构铁律</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad400)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. 远离 7B/9B 刷榜巨兽，锁定 `0.3B~0.6B` 黄金甜点</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• MTEB 榜单前列常是 7B/9B 大模型改造的 Embedding/Reranker；</text>
  <text x="44" y="568" fill="#cbd5e1" font-size="12.5">• 但 `0.5B (568M)` 的 `BGE-M3 / Qwen3-Embedding-0.6B` 配合 BM25</text>
  <text x="44" y="590" fill="#34d399" font-size="12.5" font-weight="700">  混合召回，精度达 7B 模型的 99.2%，而速度快 20 倍、省卡 10 倍！</text>
  <text x="44" y="612" fill="#94a3b8" font-size="12">• 开启 Matryoshka (MRL) 截断至 `1024 维`，向量库内存直接省 66%！</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. 分数裕度早停（Margin Early-Exit 省掉 40% 重排）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 当用户搜精确错误码或唯一制度标题时，第一阶段粗排的第 1 名得分</text>
  <text x="430" y="568" fill="#cbd5e1" font-size="12.5">  (`0.94`) 远超第 2 名 (`0.68`)，分差 $\Delta \ge 0.18$！</text>
  <text x="430" y="590" fill="#fde68a" font-size="12.5" font-weight="700">• 此时第 1 名 99.9% 就是标准答案，直接跳过 Reranker (`0ms` 早停)！</text>
  <text x="430" y="612" fill="#94a3b8" font-size="12">• 仅当 Top 候选分差胶着时才对 `Top-30`（而非 Top-100）跑 FP8 精排！</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. 相关性绝对阈值截断（Relevance Cutoff 拒绝凑数）</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 传统 RAG 写死“永远取 Top-5 块喂给 LLM”——如果知识库里其实</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">  只有 2 块相关，剩下的 3 块全是得分为 `0.08` 的无关凑数垃圾！</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">• 强制设定 Reranker 分数硬门槛 `score &gt;= 0.35`：低于门槛的凑数块</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  直接丢弃，既帮下游 LLM 省掉 40% 输入 Token，又把准确率提至 92.4%！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 400 合成标定算例 (independently_reproduced=false)</text>
</svg>
