<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级小模型蒸馏与合成数据工厂选型：Azure Foundry Distillation vs. Bedrock vs. 自建 R1 蒸馏工厂 (#420)</text>
  <text x="28" y="58" class="sub">为什么垂域任务没必要一直调 $5/1M 的 671B/GPT-4o？用 $480 蒸馏出一个 8B 专精小模型，保留 97.6% 精度且年省 $112 万推理费！</text>

  <!-- Left Panel: Why Distill? 671B Teacher vs 8B Distilled Student -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 为什么“大带小知识蒸馏 (Teacher-Student Distillation)”是最高 ROI 的降本杠杆？</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 现状：拿千亿参数全科状元 (671B/GPT-4o) 天天跑固定套路的垂域工单/抽取</text>
  <text x="56" y="164" class="mono">• 杀鸡用牛刀：90% 的垂域任务（合同抽取/客服分类/SQL生成）只需用到大模型 2% 的知识面</text>
  <text x="56" y="184" class="mono">• 算力昂贵：671B 模型单次推理需跨 8~16 张卡，首字 650ms，单价高达 $2.50~$5.00 / 1M</text>
  <text x="56" y="202" class="txt">• 而未经蒸馏的裸 8B 小模型直接上岗，垂域准确率仅 71.2%（无法满足生产上线要求）！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 蒸馏魔法：用 25,000 条教师黄金轨迹把 8B 学生喂到 671B 教师 97.6% 的水平！</text>
  <text x="56" y="272" class="mono">• 拒绝盲目全盘拷贝教师答案：通过确定性验证器 (Verifier/沙箱/正则) 剔除教师自身的 11% 幻觉</text>
  <text x="56" y="292" class="mono">• 注入精简推理链 (Short-CoT) + Top-64 离线 Logit 暗知识 (Dark Knowledge)</text>
  <text x="56" y="312" class="txt">• 结果：8B 学生单张 H200 跑出 3,800 tok/s，单价压至 $0.08/1M，仅需 4.2 天即可收回蒸馏成本！</text>

  <!-- Right Panel: 4 Distillation Platform Selection Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业模型蒸馏与合成数据方案横向选型 (100 亿 Tokens/月垂域流量)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 不做蒸馏，100% 流量长期硬调 671B / GPT-4o 顶配教师模型</text>
  <text x="638" y="158" class="mono">• 垂域准确率 94.8% | P95 延迟 1,420ms ✕ | 年度推理总账单 $1,320,000/年 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#93c5fd">Tier 2: 云原生一键托管蒸馏 (Azure AI Foundry Stored Completions / Bedrock Distillation)</text>
  <text x="638" y="214" class="mono">• 自动捕获生产 GPT-4o 日志一键微调 4o-mini/Phi-4 | 准确率 91.5% | $288,000/年 ✓</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#fde68a">Tier 3: 朴素黑盒文本蒸馏 (直接拿未过滤的 671B 输出喂 8B SFT)</text>
  <text x="638" y="270" class="mono">• 连同教师的 11% 幻觉一起学坏 | 准确率卡在 86.4% | 年度成本 $192,000/年</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 拒绝采样蒸馏 (R1 教师 + 确定性验证器 + Top-64 Logit KD + 90/10 级联路由 🏆)</text>
  <text x="638" y="326" class="mono">• 90% 流量走 8B 学生 + 10% 疑难回退教师 | 准确率反超达 95.4% 🏆 | 仅 $198,000/年 (-85%)!</text>

  <!-- Bottom Panel: 4-Stage Synthetic Data & Distillation Factory -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端企业知识蒸馏流水线：从生产日志采样 -&gt; 教师生成与验证器过滤 -&gt; Top-64 Logit 蒸馏 -&gt; 90/10 线上回流</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 生产日志聚类与指令扩增</text>
  <text x="56" y="464" class="mono">• 从 AI 网关/Langfuse 抽取</text>
  <text x="56" y="484" class="mono">  5,000 条真实生产脱敏请求</text>
  <text x="56" y="504" class="mono">• 用 Evol-Instruct 沿难度与</text>
  <text x="56" y="524" class="mono">  边界条件扩增至 30,000 条</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">覆盖长尾罕见异常Case</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">② 拒绝采样过滤 (Rejection Sampling)</text>
  <text x="332" y="464" class="mono">• 671B/GPT-4o 教师每题生成 N=4</text>
  <text x="332" y="484" class="mono">  条候选路径 (走 50% 折扣 Batch)</text>
  <text x="332" y="504" class="mono">• 用 SQL 执行器/JSON Schema/规则</text>
  <text x="332" y="524" class="mono">  剔除错误轨迹，精选 25,000 条</text>
  <text x="332" y="550" class="txt" fill="#34d399">100% 滤除教师模型自身幻觉！</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">③ Top-64 Logit 离线蒸馏 + DPO</text>
  <text x="620" y="464" class="mono">• 无需保存 152K 全词表 (45TB)！</text>
  <text x="620" y="484" class="mono">• 仅存 Top-64 Token 概率 (99.98%</text>
  <text x="620" y="504" class="mono">  概率质量，体积仅 38GB)</text>
  <text x="620" y="524" class="mono">• 拿被拒错误轨迹做 DPO 负样本</text>
  <text x="620" y="550" class="txt" fill="#fde68a">一次蒸馏训练仅耗 $480 GPU 费</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ 线上 90/10 级联与持续飞轮</text>
  <text x="908" y="464" class="mono">• 90% 常规请求由 8B 学生秒回</text>
  <text x="908" y="484" class="mono">  (P95 185ms, $0.08/1M)</text>
  <text x="908" y="504" class="mono">• 10% 低置信度疑难请求自动</text>
  <text x="908" y="524" class="mono">  升级给 671B 教师并落盘新样本</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">越用越准，年省 $112.2 万！</text>
</svg>
