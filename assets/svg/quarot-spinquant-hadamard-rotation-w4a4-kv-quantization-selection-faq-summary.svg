  <text x="962" y="340" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#34D399">R4: Online Post-RoPE Q/K Hadamard</text>
  <text x="962" y="360" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">Q_rot = Q_rope · H_128, K_rot = K_rope · H_128</text>
  <text x="962" y="378" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">Q_rot · K_rot^T = Q_rope · K_rope^T</text>
  <text x="962" y="398" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#6EE7B7" font-weight="700">⚡ Online Head-128 FWHT: ~0.5% latency</text>
  <text x="962" y="414" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#94A3B8">Unlocks 4-bit Key-Cache (99.1% 128K NIAH)</text>

