  <text x="684" y="222" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">R1: Global Residual Stream Rotation</text>
  <text x="684" y="242" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">W_qkv, W_up,gate ← R1^T · W</text>
  <text x="684" y="260" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">W_o, W_down ← W · R1</text>
  <text x="684" y="280" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#34D399" font-weight="700">✓ 100% Absorbed Offline (0.0 ms runtime)</text>
  <text x="684" y="296" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#94A3B8">SpinQuant learns R1 on Stiefel manifold</text>

  <!-- R2 Box -->
  <rect x="946" y="200" width="262" height="104" rx="10" fill="#0B1120" stroke="#818CF8" stroke-width="1.2"/>
  <text x="962" y="222" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#818CF8">R2: Per-Head Value-to-Out Rotation</text>
  <text x="962" y="242" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">W_v^(h) ← W_v^(h) · R2  (128×128)</text>
  <text x="962" y="260" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">W_o^(h) ← R2^T · W_o^(h)</text>
  <text x="962" y="280" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#34D399" font-weight="700">✓ 100% Absorbed Offline (0.0 ms runtime)</text>
