  <text x="170" y="63" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#93C5FD" text-anchor="middle">ROUND 88 · W4A4 &amp; KV4 ROTATION</text>
  <text x="306" y="63" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">Llama-3.1-70B (d=8192, 32K Context, B=32) · Synthetic + Anonymized Reported</text>

  <text x="52" y="104" font-family="Segoe UI, Inter, sans-serif" font-size="25" font-weight="800" fill="#F8FAFC">
    QuaRot &amp; SpinQuant Orthogonal Hadamard Rotation: Crushing Activation Kurtosis 482.4 → 2.92 for Lossless W4A4 + KV4
  </text>
  <text x="52" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#CBD5E1">
    Computational Invariance X' = X·Q &amp; W' = Q^T·W Eliminates 78.5x Channel Outliers, Cutting 70B VRAM 274.2 GB → 68.6 GB (-75%) with 2.60x Prefill Speedup
  </text>

  <!-- Left Panel: Why Naive W4A4 Collapses vs Orthogonal Rotation -->
  <rect x="52" y="152" width="576" height="286" rx="14" fill="url(#cardDark)" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="182" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">1. First-Principles Mechanism: Why Diagonal Scaling Fails at 4-Bit</text>

