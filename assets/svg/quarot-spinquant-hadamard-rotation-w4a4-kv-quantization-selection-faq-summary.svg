  <text x="86" y="238" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#94A3B8">Kurtosis κ = 482.4 | Max/Med = 78.5x</text>
  <!-- Spike bars -->
  <rect x="94" y="310" width="16" height="16" fill="#475569"/>
  <rect x="118" y="250" width="18" height="76" fill="#EF4444"/>
  <text x="127" y="246" font-family="Consolas, monospace" font-size="10" font-weight="700" fill="#FCA5A5" text-anchor="middle">+64.0</text>
  <rect x="144" y="312" width="16" height="14" fill="#475569"/>
  <rect x="168" y="308" width="16" height="18" fill="#475569"/>
  <rect x="192" y="314" width="16" height="12" fill="#475569"/>
