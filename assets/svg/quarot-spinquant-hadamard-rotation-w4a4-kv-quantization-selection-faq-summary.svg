  <text x="684" y="360" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">Z' = FWHT(SiLU(X·W_g) ⊙ (X·W_u))</text>
  <text x="684" y="378" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">W_down ← H_dff^T · W_down</text>
