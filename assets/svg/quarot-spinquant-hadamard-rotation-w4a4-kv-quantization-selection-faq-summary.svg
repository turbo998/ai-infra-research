  <text x="220" y="300" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#94A3B8">99% normal channels</text>
  <text x="220" y="316" font-family="Segoe UI, Inter, sans-serif" font-size="11" fill="#EF4444" font-weight="700">underflow to ZERO!</text>
  <text x="86" y="338" font-family="Consolas, monospace" font-size="11" fill="#F87171">WikiText-2 PPL: 29.85 (+24.73 Collapse)</text>

