<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg635" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr635" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg635)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr635)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">🏆 #635 里程碑：千卡企业智算中心 (1,024-GPU AI Factory) BOM、8轨网络、3FS存储与液冷三年决算</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Milestone #635: 1,024-GPU AI Factory End-to-End BoM, 8-Rail Lossless Fabric, 2.4s Async Ckpt + 3FS NVMe, DLC PUE 1.11 &amp; 3-Year TCO</text>

  <!-- 4 Core Subsystems of the 1,024-GPU AI Factory -->
  <rect x="48" y="118" width="540" height="162" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="66" y="144" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">① 计算与网络 BOM：128台节点 × 48台 64口交换机</text>
  <text x="66" y="168" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 128 台 8×H200/B200 节点 (1,024 GPUs · 每机 2TB DDR5 + 8×3.84TB Gen5 NVMe)</text>
  <text x="66" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 8 轨 Rail-Optimized 拓扑: 32 台 Rail Leaf + 16 台 Spine (64口 400G 交换机)</text>
  <text x="66" y="212" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 机柜内 &lt;7m 采用 DAC/ACC 铜缆 + 机柜间 LPO 线性直驱光模块 (-56.2% 光模块费)</text>
  <text x="66" y="236" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• GPUDirect RDMA (PIX) + ECN/DCQCN + PXN 实测 busbw 47.8 GB/s (95.6% 线速)</text>

  <rect x="612" y="118" width="540" height="162" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="630" y="144" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">② 超融合 3FS 存储与 2.4s 两阶段异步 Checkpoint</text>
  <text x="630" y="168" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 零外部全闪阵列采购费 ($0): 聚合 128 台节点内置 1,024 块 PCIe Gen5 NVMe</text>
  <text x="630" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• DeepSeek 3FS + GPUDirect Storage (GDS) 跑出 3.58 TB/s 聚合并发读写带宽</text>
  <text x="630" y="212" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• PyTorch DCP 两阶段异步保存: GPU HBM ➔ Host Pinned DDR5 仅冻结 2.4 秒</text>
  <text x="630" y="236" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• 对比传统 10 GB/s 共享盘冻结 240s (快 100x · 找回 13.3% 训练有效算力)！</text>

  <rect x="48" y="294" width="540" height="162" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.8"/>
  <text x="66" y="320" fill="#c084fc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">③ 120kW 冷板液冷 (DLC · PUE 1.11) 与 520W 限电</text>
  <text x="66" y="344" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 16 台 80kW–120kW 高密冷板直液冷计算柜 (对比 15kW 风冷需 96 个机柜, 缩减 83%)</text>
  <text x="66" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• PUE 从风冷 1.45 压至 1.11，消除 GPU 高温热降频 (找回 18.5% 峰值算力)</text>
  <text x="66" y="388" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Decode 节点施加 520W 硬件功耗封顶 (-25.7% 功耗，TPOT 仅慢 3.1%)</text>
  <text x="66" y="412" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• 整集群总 IT+散热功耗从 1.92 MW 压至 1.38 MW (3年省电费 $142万)！</text>

  <rect x="612" y="294" width="540" height="162" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="630" y="320" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="800">④ Kueue 训推共池潮汐调度与三年 TCO 决算</text>
  <text x="630" y="344" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 白天 (08:00–22:00): 640 卡跑动态 PD 在线推理 + 384 卡跑预训练/微调</text>
  <text x="630" y="366" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 夜间 (22:00–08:00): 在线池缩至 192 卡，释放 448 卡经 vLLM Sleep Mode (0.8s)</text>
  <text x="630" y="388" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">  原地切换跑 veRL GRPO 强化学习 Rollout 与百亿词离线 Batch ETL</text>
  <text x="630" y="412" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">• 集群 24h 有效利用率从 46.5% 跃升至 94.2% · 3年净省 $2,840万！</text>

  <!-- Bottom Banner -->
  <rect x="48" y="470" width="1104" height="116" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="68" y="500" fill="#34d399" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">📊 #635 千卡智算中心三年总拥有成本 (3-Year TCO) 终极对比：</text>
  <text x="68" y="530" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 传统烟囱双建 (独立训练集群 + 独立推理集群 + 外置全闪存储 + 风冷 PUE 1.45): 3年 TCO = $7,420万 ($0.245/1M)</text>
  <text x="68" y="560" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• #635 超融合液冷训推一体工厂 (Rail+LPO + 超融合 3FS + 2.4s Ckpt + DLC 1.11 + 潮汐共池): 3年 TCO = $4,580万 (净省 $2,840万 / -38.3% · $0.048/1M)！</text>
</svg>
