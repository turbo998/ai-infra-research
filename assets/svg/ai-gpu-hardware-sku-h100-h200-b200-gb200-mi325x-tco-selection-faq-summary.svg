  <text x="968" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 整柜显存/互连: <tspan fill="#34d399" font-weight="800">13.8 TB / 130 TB/s 🏆</tspan></text>
