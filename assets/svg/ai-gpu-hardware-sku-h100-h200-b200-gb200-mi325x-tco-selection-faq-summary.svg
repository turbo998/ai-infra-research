  <text x="80" y="293" fill="#fca5a5" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">核心物理瓶颈：</text>
  <text x="80" y="311" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">671B FP8 权重+KV 需 ~851GB，单机</text>
  <text x="80" y="327" fill="#e2e8f0" font-family="Segoe UI, Inter, sans-serif" font-size="11.5">640GB 装不下，跨机 RoCE 拖慢 2x ✕</text>

  <text x="68" y="362" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 整机显存/带宽: <tspan fill="#f87171" font-weight="700">640 GB / 3.35 TB/s</tspan></text>
  <text x="68" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32K Decode TPOT: <tspan fill="#f87171" font-weight="700">28.4 ms (超 SLA ✕)</tspan></text>
  <text x="68" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡有效吞吐: <tspan fill="#f87171" font-weight="700">142.0 tok/s/GPU ✕</tspan></text>
  <text x="68" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#f87171" font-weight="700">$3.85 / 1M tok ✕</tspan></text>
