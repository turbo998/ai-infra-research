  <rect x="52" y="528" width="1176" height="186" rx="14" fill="#111827" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="556" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="800">架构师核心铁律：为什么买贵 25% 的 H200/B200 反而比买便宜的 H100 省下 56%~87% 的 Token 成本？</text>

  <rect x="72" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
  <text x="90" y="596" fill="#7dd3fc" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">🔥 铁律 1：851GB 单机显存悬崖（Single-Node Memory Cliff）</text>
  <text x="90" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 满血 DeepSeek-V3/R1 (671B FP8) 权重 671GB + 32K KV 缓存 180GB = 851GB；</text>
  <text x="90" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 8×H100 仅 640GB，被迫切到 2 台机器跑跨机 RoCE TP=16，每次通信跌落 18 倍带宽！</text>
  <text x="90" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 8×H200 (1,128GB) 或 8×MI325X (2,048GB) 1 台机器全装下，单卡吞吐立涨 2.24x！</text>

  <rect x="653" y="572" width="555" height="124" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
  <text x="671" y="596" fill="#6ee7b7" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="700">⚡ 铁律 2：Decode 是显存带宽游戏（8 TB/s × NVFP4 × 72 卡铜背板）</text>
  <text x="671" y="618" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• B200 将 HBM3e 带宽推至 8.0 TB/s 并支持原生硬件 NVFP4（权重大幅减半至 ~336GB）；</text>
  <text x="671" y="638" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• GB200 NVL72 用 130 TB/s 铜背板让 72 张卡每卡只放 4~5 个专家，Batch 聚合放大 9 倍；</text>
  <text x="671" y="658" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• 尽管整柜 3 年 TCO 略高 38%，但单卡吞吐暴涨 8.87x，每百万 Token 成本直降 87.5%！</text>
