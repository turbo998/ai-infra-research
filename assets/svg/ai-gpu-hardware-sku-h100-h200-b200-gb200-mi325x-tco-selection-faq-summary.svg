  <text x="668" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32K Decode TPOT: <tspan fill="#38bdf8" font-weight="800">8.6 ms (快 3.30x ✅)</tspan></text>
  <text x="668" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡有效吞吐: <tspan fill="#38bdf8" font-weight="800">685.0 tok/s (4.82x ✅)</tspan></text>
