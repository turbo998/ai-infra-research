  <text x="428" y="63" fill="#94a3b8" font-family="Segoe UI, Inter, sans-serif" font-size="12">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <text x="52" y="106" fill="#f8fafc" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800">AI 智算中心 GPU 硬件代际选型、HBM 显存墙与 3 年 TCO 投资回报一图流</text>
  <text x="52" y="132" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="13.5">为什么 8×H100 (640GB) 跑 671B FP8 必掉进跨机通信深坑？H200/MI325X 单机闭环 vs. B200 NVFP4 vs. GB200 NVL72 降本 87.5%</text>
