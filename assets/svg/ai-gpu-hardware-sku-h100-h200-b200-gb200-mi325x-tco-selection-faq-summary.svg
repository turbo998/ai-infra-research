  <text x="368" y="386" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 32K Decode TPOT: <tspan fill="#fbbf24" font-weight="700">14.8 ms (达标 ✅)</tspan></text>
  <text x="368" y="410" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 单卡有效吞吐: <tspan fill="#fbbf24" font-weight="700">318.0 tok/s (2.24x ✅)</tspan></text>
  <text x="368" y="434" fill="#cbd5e1" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• 百万 Token 成本: <tspan fill="#fbbf24" font-weight="700">$1.68 / 1M (-56.4% ✅)</tspan></text>
