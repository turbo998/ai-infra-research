  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #406 · MULTI-MODEL CASCADE ROUTER &amp; 3-TIER CACHING GATEWAY (APIM / ENVOY GIE / LITELLM / HIGRESS)</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业级多模型级联路由与三级缓存网关选型：Prompt Cache vs. 语义缓存防误命中</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">用 78/22 大小模型级联路由 + 实体强校验语义缓存 + K8s GIE 前缀 KV 亲和路由，将网关账单砍掉 82.4% 且零张冠李戴</text>

  <!-- Left Box: Multi-Model Cascade Router Math -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 多模型智能级联路由 (Cascade Router) 成本方程</text>
  <rect x="76" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">Blended_Cost = p_fast * C_SLM + (1 - p_fast) * C_Frontier + C_Router</text>
  <text x="90" y="242" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">典型企业分布: 78% 简单/中度任务 (8B~32B) + 22% 复杂推理 (671B/GPT-4o)</text>
  <text x="90" y="260" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">置信度回退  : 若小模型首词对数概率熵过低 -&gt; 15ms 自动升级至旗舰模型</text>
  <text x="76" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 全用旗舰模型：100% 流量走 `$2.50/1M`，简单提取任务纯属“大炮打蚊子”</text>
  <text x="76" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 级联路由后：78% 流量走 `$0.12/1M` 快池 + 22% 走旗舰，单价立降 74%！</text>
  <text x="76" y="346" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 路由分类器开销：基于 ModernBERT / vLLM Semantic Router 耗时仅 2.8 ms！</text>

  <!-- Right Box: Semantic Cache vs Prefix KV Cache Boundary -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 语义缓存 (Semantic) vs. 前缀缓存 (Prefix KV) 防张冠李戴红线</text>
  <rect x="634" y="200" width="490" height="68" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">裸向量语义缓存陷阱: "2025年Q3财报" 与 "2024年Q3财报" 余弦相似度 = 0.96!</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">L2 强校验语义缓存 : 向量 &gt;=0.96 AND (年份/数字/实体/否定词 100% 精确相等)</text>
  <text x="648" y="260" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">L3 精确前缀 KV 缓存: 多轮 Agent/代码 100% 走底层 Prefix KV (0% 误命中!)</text>
  <text x="634" y="294" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 什么时候开 L2 语义缓存？仅限无状态高频公共 FAQ / 客服标准问答（响应 8ms）</text>
  <text x="634" y="320" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 什么时候禁开语义缓存？多轮对话、带账号/金额查询、代码生成（必用 L3 Prefix KV）</text>
  <text x="634" y="346" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：误命中率从 8.2% 压至 0.01%，总 Token 账单叠加再省 52%！</text>

