<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">百卡至万卡智算集群高速光互联选型：DAC/ACC 铜缆 vs. DSP 光模块 vs. LPO 线性直驱 vs. CPO (#462)</text>
  <text x="28" y="58" class="sub">为什么千卡集群 65% 的训练中断源于 70°C 光模块热闪断？如何按距离分级 (铜缆+LPO+DSP) 省下 $235 万并实现零闪断？</text>

  <!-- Left Panel: Optical Transceiver Link Flap & Power Tax -->
  <rect x="24" y="76" width="560" height="270" rx="12" class="panel"/>
  <text x="42" y="104" class="h2">1. 千卡集群头号物理故障源：800G DSP 光模块高温闪断 (Link Flap)</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 全网无脑全用可插拔 DSP 光模块的三大昂贵代价 (Tier 1)</text>
  <text x="56" y="164" class="mono">• 代价 1 (高温闪断): 800G DSP 光模块内置 7nm DSP 芯片，单支功耗高达 16.5W！</text>
  <text x="56" y="184" class="mono">  激光器结温超 70°C 后失效率指数级飙升，千卡集群每年发生 48 次光模块闪断中断训练</text>
  <text x="56" y="202" class="txt">• 代价 2 (成本与延迟): 每次光电 DSP 重定时增加 120ns 延迟，3年光模块采购+电费高达 $384万！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 黄金法则：“能用铜绝不用光” + 5~50m 优选 LPO + Pre-FEC 提前摘流</text>
  <text x="56" y="272" class="mono">• 0~5m (柜内/相邻机柜): 强制用 DAC 无源铜缆 / ACC 有源铜缆 (0.1~1.8W, 零激光器零闪断!)</text>
  <text x="56" y="292" class="mono">• 5~50m (同机房 Pod 内): 选用 LPO (线性直驱光模块，砍掉 DSP 芯片，功耗降 50% 至 7W，延迟 5ns)</text>
  <text x="56" y="312" class="txt">• 提前防闪断: 监控 Pre-FEC BER 斜率，在 Post-FEC 丢包前提前切换轨道，千卡零中断 🏆</text>

  <!-- Right Panel: 4 Interconnect Media Tiers -->
  <rect x="608" y="76" width="568" height="270" rx="12" class="panel"/>
  <text x="626" y="104" class="h2">2. 四档千卡 (1,024 GPU · 2,560 支模块) 光铜互联方案对标</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 全网 100% 采购 800G DSP 可插拔光模块 (含机柜内短距)</text>
  <text x="638" y="158" class="mono">• 单口功耗: 16.5W ✕ | PHY 延迟: 120ns | 年闪断事故: 48 次/年 ✕ | 3年 TCO: $384万</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 柜内 DAC 铜缆 + 跨柜标准 DSP 光模块 (无 Pre-FEC 预测隔离)</text>
  <text x="638" y="214" class="mono">• 平均单口功耗: 11.2W | PHY 延迟: 85ns | 年闪断事故: 29 次/年 | 3年 TCO: $268万</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 柜内/邻柜 DAC/ACC (&lt;5m) + 同厅 LPO 线性直驱光模块 (5~50m)</text>
  <text x="638" y="270" class="mono">• 平均单口功耗: 6.2W ✓ | PHY 延迟: 5ns (快 24x) ✓ | 年闪断: 6 次 | 3年 TCO: $176万</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 距离四级混搭 (DAC/ACC+LPO+DSP) + Pre-FEC 误码率预测性隔离 (🏆)</text>
  <text x="638" y="326" class="mono">• 平均功耗: 5.8W (-65%) 🏆 | 延迟: 4.8ns 🏆 | 线上突断: 0 次 🏆 | 3年 TCO: $149万!</text>

  <!-- Bottom Panel: Distance Selection Matrix & Pre-FEC Predictive Gate -->
  <rect x="24" y="366" width="1152" height="270" rx="12" class="panel"/>
  <text x="42" y="394" class="h2">3. 架构师按布线距离四阶选型法 (0~3m / 3~7m / 7~50m / &gt;50m) 与 Pre-FEC 预警机制</text>

  <rect x="42" y="414" width="356" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">① 0 ~ 7 米：无源 DAC 与有源 ACC/AEC 铜缆</text>
  <text x="56" y="464" class="mono">• 0~3m (同机柜 ToR): 无源铜缆 DAC (0.1W, $80)</text>
  <text x="56" y="484" class="mono">• 3~7m (相邻两排机柜): 有源铜缆 ACC/AEC (1.8W, $220)</text>
  <text x="56" y="504" class="mono">• 核心优势: 没有光电转换激光器，MTBF 高出光模块</text>
  <text x="56" y="524" class="mono">  100 倍以上，成本仅为 800G 光模块的 1/10！</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">高密液冷紧凑排布机柜让 60% 链路落在 &lt;7m 铜缆区！</text>

  <rect x="418" y="414" width="368" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="432" y="440" class="txt" font-weight="700" fill="#34d399">② 7 ~ 50 米：LPO (线性直驱可插拔光模块)</text>
  <text x="432" y="464" class="mono">• 原理: 移除模块内部高功耗高发热的 DSP 芯片，</text>
  <text x="432" y="484" class="mono">  改用高线性度 TIA + Driver 直连交换机 SerDes</text>
  <text x="432" y="504" class="mono">• 收益 1: 单支 800G 模块功耗从 16W 骤降至 7W (-56%)</text>
  <text x="432" y="524" class="mono">• 收益 2: 模块温度降 18°C，PHY 延迟从 120ns 降至 5ns</text>
  <text x="432" y="550" class="txt" fill="#34d399">同一大厅 Leaf-to-Spine 互联的降本增稳利器 🏆</text>

  <rect x="806" y="414" width="350" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="820" y="440" class="txt" font-weight="700" fill="#fde68a">③ 光模块亚健康 Pre-FEC BER 预测性摘流</text>
  <text x="820" y="464" class="mono">• 光模块彻底断连前 6~24 小时，一定先出现纠错前</text>
  <text x="820" y="484" class="mono">  误码率 (`Pre-FEC BER`) 从 1e-8 爬升至 1e-5，以及</text>
  <text x="820" y="504" class="mono">  DOM 接收光功率 (`Rx_Power`) 跌破 -8 dBm！</text>
  <text x="820" y="524" class="mono">• 自动在训练 Checkpoint 间隙优雅屏蔽该端口</text>
  <text x="820" y="550" class="txt" fill="#fde68a">将运行期突发断链导致的作业崩溃彻底清零 (0 次)！</text>
</svg>
