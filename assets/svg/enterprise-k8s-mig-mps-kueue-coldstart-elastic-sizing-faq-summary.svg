<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg634" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr634" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg634)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr634)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21.5" font-weight="800">#634 企业 K8s GPU 切分 (硬件 MIG vs. MPS vs. 时间片)、Kueue 拓扑调度与 14.2s 秒级冷启动算卡</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="600">Enterprise K8s GPU Sharing (Hardware MIG vs. MPS vs. Time-Slicing), Kueue TAS &amp; 14.2s Fast Cold-Start (Nydus P2P + Streamer/GDS)</text>

  <!-- Left: MIG vs MPS vs Time-Slicing -->
  <rect x="48" y="120" width="540" height="330" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="66" y="148" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">① K8s 三大 GPU 切分技术边界 (告别 28个小模型占 28张整卡!)</text>

  <rect x="64" y="164" width="508" height="82" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="78" y="186" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">1. 硬件级 MIG (Multi-Instance GPU · H100 1g.10gb / H200 1g.18gb) 🏆</text>
  <text x="78" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 物理切分 SM、HBM 显存控制器、L2 Cache 与 Crossbar 通道 (最多 7 个硬件实例/卡)</text>
  <text x="78" y="226" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• P99 跨租户抖动 &lt;1.5% · 0% 邻卡 OOM 连坐 · 4张 H200 即可零干扰托管 28 个小模型！</text>

  <rect x="64" y="256" width="508" height="82" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="78" y="278" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2. CUDA MPS (Multi-Process Service · 空分共享页表)</text>
  <text x="78" y="298" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 多进程并发提交 Kernel 共享 SM，无上下文切换税，但共用同一地址空间与错误域</text>
  <text x="78" y="318" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 适用：同一受信任业务内部 (如 RLHF Actor + Reward 同卡共置)；禁用于多租户隔离！</text>

  <rect x="64" y="348" width="508" height="88" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="78" y="370" fill="#f87171" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">3. 时间片轮转 (Time-Slicing · 默认粗暴复用)</text>
  <text x="78" y="390" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• 无显存上限保护 (1个容器 OOM 炸毁整卡所有容器)，毫秒级时间片切换导致 P99 抖动 +310%</text>
  <text x="78" y="412" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 仅限研发 Notebook 闲时评测，严禁用于生产在线 SLA 服务！</text>

  <!-- Right: 510s -> 14.2s Cold-Start & Elastic Buffer Reduction -->
  <rect x="608" y="120" width="544" height="330" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="626" y="148" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">② 510s ➔ 14.2s 极速冷启动：砍掉 16 张常备冗余缓冲卡</text>

  <rect x="624" y="164" width="512" height="114" rx="8" fill="#0f172a" stroke="#ef4444"/>
  <text x="638" y="186" fill="#f87171" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">❌ 传统 K8s 扩容链路 (耗时 510 秒 = 8.5 分钟！)</text>
  <text x="638" y="208" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">1. 串行拉取 25GB 容器镜像 (110s) ➔ 2. HTTP 下载 140GB Safetensors 落盘 (260s)</text>
  <text x="638" y="228" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">3. 单线程反序列化进 CPU 内存再拷入 HBM (95s) ➔ 4. TorchCompile/CUDA Graph (45s)</text>
  <text x="638" y="252" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 后果：为防早高峰流量突增，被迫全天多开 +20 张 H200 空转待命 ($64,000/月浪费)！</text>

  <rect x="624" y="290" width="512" height="146" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="638" y="312" fill="#34d399" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">🏆 #634 极速弹性栈 (耗时 14.2 秒 · 提速 35.9 倍 · Sleep 唤醒仅 0.8s！)</text>
  <text x="638" y="334" fill="#cbd5e1" font-size="11.5">• 镜像层: Nydus / Dragonfly P2P 按需块级懒加载 ➔ 2.4 秒拉起容器</text>
  <text x="638" y="354" fill="#cbd5e1" font-size="11.5">• 权重层: Run:ai Model Streamer / GDS + RDMA 环状多播 (15 GB/s) ➔ 9.4 秒直灌 HBM</text>
  <text x="638" y="374" fill="#cbd5e1" font-size="11.5">• 编译层: 挂载共享只读 Compilation Cache ➔ 2.4 秒绑定 CUDA Graph</text>
  <text x="638" y="396" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 叠加 KEDA 队列深度/KV水位指标 + vLLM Sleep Mode (0.8s 原地唤醒)</text>
  <text x="638" y="418" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">• 冗余缓冲卡从 +20 张骤降至 +4 张 (净省 16 张 H200 = $51,200/月)！</text>

  <!-- Bottom Banner -->
  <rect x="48" y="468" width="1104" height="118" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="498" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 #634 K8s GPU 切分与秒级冷启动联合收益 (28 个卫星小模型 + 70B 在线弹性池)：</text>
  <text x="68" y="528" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 小模型整合: 28 张整卡独占 ➔ 4 张 H200 开启 28 个 1g.18gb 硬件 MIG 切片 (立省 24 张卡 · 抖动 &lt;1.5%)</text>
  <text x="68" y="558" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 大模型弹性: 510s ➔ 14.2s 冷启动淘汰 16 张冗余缓冲卡 · 全集群从 64 张压至 24 张 H200 (净省 62.5% / 年省 $153.6万)！</text>
