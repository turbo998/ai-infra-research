<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad416" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad416" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgGrad416)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级电信运营商 5G 核心网/无线网（NOC）、告警风暴根因定位（RCA）与数字孪生 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">4.5万座 5G 基站 / 日均 120万条告警 · 静态告警规则 vs. 原始告警塞LLM直推CLI vs. 标准3GPP手册RAG vs. 跨层拓扑因果图 + YANG编译器 + 数字孪生仿真回滚</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">95.8% RCA · 8.2m MTTR</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 静态 NOC 规则 + 人工敲 CLI</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">光纤断纤引发4万条衍生告警淹没大屏</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• 传输网、IP承载网与5G无线专业墙各自为政</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 人工跨网管排查恢复耗时长达 95.0 分钟</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">跨层根因定位准确率: 64.5% ✕</text>
  <text x="54" y="334" fill="#fde68a" font-size="13" font-weight="700">配置变更断网/语法错误率: 1.8%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">平均业务恢复耗时(MTTR): 95.0 分钟 ✕</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月NOC运维与SLA罚金: $340,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统烟囱式网管，告警风暴下排障极慢</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 原始告警塞 LLM + 直推 CLI 变更</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">把衍生告警当根因，混用厂家命令瘫痪全网</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 无物理拓扑图，把底层光缆中断当成800基站故障</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 混淆华为VRP/思科IOS-XR命令导致 13.6% 路由黑洞</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fca5a5" font-size="13" font-weight="700">跨层根因定位准确率: 56.0% ✕</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">配置变更断网/语法错误率: 13.6% (断网 ✕)</text>
  <text x="346" y="358" fill="#fde68a" font-size="12.5">平均业务恢复耗时(MTTR): 38.0 分钟</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月NOC与断网事故总成本: $510,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁让LLM不经数字孪生直接敲现网路由器CLI</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 3GPP/厂家手册 RAG + 工单助手</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">能查 3GPP 信令码，但缺跨层拓扑与仿真</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 解答错误码快，但仍需人工下发倒换脚本</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 多厂商 CLI 方言仍有 4.2% 参数偏差</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">跨层根因定位准确率: 78.5%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">配置变更断网/语法错误率: 4.2% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">平均业务恢复耗时(MTTR): 45.0 分钟</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月NOC运维与罚金成本: $155,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：L2 工程师知识检索助手，未达 L4 自智闭环</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad416)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: 跨层拓扑图+YANG+数字孪生 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">光/IP/5G 跨层溯源 + 数字孪生预演倒换</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• L1光传输->L3承载网->5G基站因果图秒级锁定断纤</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• Netconf/YANG 编译 + 数字孪生仿真 + 60s自动回滚</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">跨层根因定位准确率: 95.8% 🏆 (+39.8pts)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">配置变更断网率: 0.0% 🏆 (孪生预演+回滚)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">平均业务恢复耗时(MTTR): 8.2 分钟 🏆 (-91.4%)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月NOC运维总成本: $49,000 (-85.6% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：电信运营商 L4 自智网络、云骨干网 NOC</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 电信自智网络 (TM Forum L4) 架构师铁律（Cross-Layer Topology Graph + YANG + Digital Twin Pattern）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. 告警风暴必须先经跨层物理拓扑图（DWDM光路 → IP承载网 → 5G UPF/gNodeB）向上归并压制衍生告警，再交由大模型结合 3GPP 信令做根因解释。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 严禁大模型向现网直推裸 CLI：必须生成厂商中立的 Netconf/YANG 配置，经网络数字孪生（Batfish/Twin）仿真零黑洞并绑定 60 秒 KPI 劣化自动回滚 · Provenance: synthetic + anonymized_reported</text>
</svg>
