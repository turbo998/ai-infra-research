<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#131C31"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="tier3Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tier4Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="860" fill="url(#bgGrad)" rx="16"/>
  <rect x="16" y="16" width="1368" height="828" fill="none" stroke="#1E293B" stroke-width="2" rx="12"/>

  <!-- Header Banner -->
  <rect x="36" y="30" width="1328" height="90" fill="#1E293B" fill-opacity="0.65" stroke="#334155" rx="10"/>
  <text x="56" y="64" fill="#38BDF8" font-size="15" font-weight="700" letter-spacing="1">ROUND 12 ARCHITECT SELECTION FAQ · AI CLUSTER OPTICAL &amp; COPPER INTERCONNECT (2,048 GPUs / 8,192 × 800G ENDPOINTS)</text>
  <text x="56" y="96" fill="#F8FAFC" font-size="23" font-weight="800">AI 智算集群光互连与铜缆架构选型：柜内 DAC/AEC 铜缆 vs. DSP 可插拔 vs. LPO 线性直驱 vs. 冷板 CPO + 3D MEMS OCS</text>
  <rect x="1085" y="46" width="260" height="56" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" rx="8"/>
  <text x="1215" y="69" fill="#93C5FD" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC + REPORTED</text>
  <text x="1215" y="89" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle">independently_reproduced = false</text>

  <!-- Section 1: 4 Architecture Tier Cards -->
  <text x="40" y="148" fill="#94A3B8" font-size="14" font-weight="700" letter-spacing="0.8">① 2,048-GPU (8,192 × 800G ENDPOINTS, 3-YR = 26,280 HRS) FOUR-TIER ARCHITECTURE COMPARISON</text>

  <!-- Tier 1 Card -->
  <rect x="36" y="162" width="318" height="270" fill="#1E293B" fill-opacity="0.7" stroke="#EF4444" stroke-width="1.5" rx="10"/>
  <rect x="52" y="176" width="110" height="24" fill="#7F1D1D" rx="5"/>
  <text x="107" y="192" fill="#FCA5A5" font-size="11" font-weight="700" text-anchor="middle">TIER 1 · AVOID</text>
  <text x="52" y="220" fill="#F8FAFC" font-size="16" font-weight="800">全光 DSP 可插拔模块</text>
  <text x="52" y="240" fill="#94A3B8" font-size="12">8,192 × 800G OSFP DSP (16.0W, $1,050)</text>
  <line x1="52" y1="252" x2="338" y2="252" stroke="#334155"/>
  <text x="52" y="276" fill="#CBD5E1" font-size="13">• 互连总功耗: <tspan fill="#F87171" font-weight="700">131.07 kW</tspan> (16.0 W/端)</text>
  <text x="52" y="300" fill="#CBD5E1" font-size="13">• 脊层模块 PHY 延迟: <tspan fill="#F87171" font-weight="700">115.0 ns</tspan></text>
  <text x="52" y="324" fill="#CBD5E1" font-size="13">• 硬件 CapEx: <tspan fill="#F8FAFC" font-weight="700">$8,601,600.00</tspan></text>
  <text x="52" y="348" fill="#CBD5E1" font-size="13">• 3 年链路闪断: <tspan fill="#F87171" font-weight="700">442.4 次</tspan> ($453,018 损失)</text>
  <text x="52" y="372" fill="#CBD5E1" font-size="13">• 3 年含 PUE 电费: <tspan fill="#F8FAFC" font-weight="700">$396,119.75</tspan></text>
  <rect x="52" y="388" width="286" height="32" fill="#0F172A" rx="6"/>
  <text x="195" y="409" fill="#FCA5A5" font-size="13" font-weight="700" text-anchor="middle">3-Yr TCO: $9,450,737.35 (Baseline)</text>

  <!-- Tier 2 Card -->
  <rect x="372" y="162" width="318" height="270" fill="#1E293B" fill-opacity="0.7" stroke="#38BDF8" stroke-width="1.5" rx="10"/>
  <rect x="388" y="176" width="150" height="24" fill="#0C4A6E" rx="5"/>
  <text x="463" y="192" fill="#7DD3FC" font-size="11" font-weight="700" text-anchor="middle">TIER 2 · 50m–500m SPAN</text>
  <text x="388" y="220" fill="#F8FAFC" font-size="16" font-weight="800">柜内 DAC/AEC 铜缆 + 脊叶 DSP</text>
  <text x="388" y="240" fill="#94A3B8" font-size="12">4,096 铜缆 (2.5W) + 4,096 DSP 光 (16.0W)</text>
  <line x1="388" y1="252" x2="674" y2="252" stroke="#334155"/>
  <text x="388" y="276" fill="#CBD5E1" font-size="13">• 互连总功耗: <tspan fill="#38BDF8" font-weight="700">75.78 kW</tspan> (-42.2%)</text>
  <text x="388" y="300" fill="#CBD5E1" font-size="13">• 端点平均 PHY 延迟: <tspan fill="#38BDF8" font-weight="700">60.0 ns</tspan> (脊 115ns)</text>
  <text x="388" y="324" fill="#CBD5E1" font-size="13">• 硬件 CapEx: <tspan fill="#F8FAFC" font-weight="700">$5,038,080.00</tspan> (-41.4%)</text>
  <text x="388" y="348" fill="#CBD5E1" font-size="13">• 3 年链路闪断: <tspan fill="#38BDF8" font-weight="700">239.6 次</tspan> (降 1.85x)</text>
  <text x="388" y="372" fill="#CBD5E1" font-size="13">• 3 年含 PUE 电费: <tspan fill="#F8FAFC" font-weight="700">$229,022.32</tspan></text>
  <rect x="388" y="388" width="286" height="32" fill="#0F172A" rx="6"/>
  <text x="531" y="409" fill="#7DD3FC" font-size="13" font-weight="700" text-anchor="middle">3-Yr TCO: $5,512,452.72 (-41.7%)</text>

  <!-- Tier 3 Card -->
  <rect x="708" y="162" width="318" height="270" fill="url(#tier3Grad)" stroke="#10B981" stroke-width="2" rx="10"/>
  <rect x="724" y="176" width="175" height="24" fill="#065F46" rx="5"/>
  <text x="811" y="192" fill="#6EE7B7" font-size="11" font-weight="700" text-anchor="middle">TIER 3 · &lt;=50m POD SWEET SPOT</text>
  <text x="724" y="220" fill="#F8FAFC" font-size="16" font-weight="800">柜内铜缆 + 800G LPO 线性光</text>
  <text x="724" y="240" fill="#A7F3D0" font-size="12">拔除模块 DSP! 4,096 铜 + 4,096 LPO (7.5W)</text>
  <line x1="724" y1="252" x2="1010" y2="252" stroke="#047857"/>
  <text x="724" y="276" fill="#CBD5E1" font-size="13">• 互连总功耗: <tspan fill="#34D399" font-weight="700">40.96 kW</tspan> (-68.8%)</text>
  <text x="724" y="300" fill="#CBD5E1" font-size="13">• 脊层模块 PHY 延迟: <tspan fill="#34D399" font-weight="700">8.0 ns</tspan> (降 14.4x!)</text>
  <text x="724" y="324" fill="#CBD5E1" font-size="13">• 硬件 CapEx: <tspan fill="#34D399" font-weight="700">$3,686,400.00</tspan> (-57.1%)</text>
  <text x="724" y="348" fill="#CBD5E1" font-size="13">• 3 年链路闪断: <tspan fill="#34D399" font-weight="700">110.6 次</tspan> (降 4.00x)</text>
  <text x="724" y="372" fill="#CBD5E1" font-size="13">• 3 年含 PUE 电费: <tspan fill="#F8FAFC" font-weight="700">$123,789.31</tspan></text>
  <rect x="724" y="388" width="286" height="32" fill="#064E3B" rx="6"/>
  <text x="867" y="409" fill="#6EE7B7" font-size="13" font-weight="800" text-anchor="middle">3-Yr TCO: $3,923,443.71 (-58.5%)</text>

  <!-- Tier 4 Card -->
  <rect x="1044" y="162" width="320" height="270" fill="url(#tier4Grad)" stroke="#C084FC" stroke-width="2" rx="10"/>
  <rect x="1060" y="176" width="195" height="24" fill="#581C87" rx="5"/>
  <text x="1157" y="192" fill="#E9D5FF" font-size="11" font-weight="700" text-anchor="middle">TIER 4 · 1.6T+ ZERO-FLAP FLAGSHIP</text>
  <text x="1060" y="220" fill="#F8FAFC" font-size="16" font-weight="800">冷板 CPO + 3D MEMS OCS 全光</text>
  <text x="1060" y="240" fill="#DDD6FE" font-size="12">硅光微环 + 外置 ELS + MEMS 镜面全光直通</text>
  <line x1="1060" y1="252" x2="1348" y2="252" stroke="#6B21A8"/>
  <text x="1060" y="276" fill="#CBD5E1" font-size="13">• 互连总功耗: <tspan fill="#C084FC" font-weight="700">20.89 kW</tspan> (-84.1%!)</text>
  <text x="1060" y="300" fill="#CBD5E1" font-size="13">• 脊层 PHY 延迟: <tspan fill="#C084FC" font-weight="700">4.5 ns CPO + 0ns OCS</tspan></text>
  <text x="1060" y="324" fill="#CBD5E1" font-size="13">• 硬件 CapEx: <tspan fill="#F8FAFC" font-weight="700">$4,218,880.00</tspan></text>
  <text x="1060" y="348" fill="#CBD5E1" font-size="13">• 3 年链路闪断: <tspan fill="#C084FC" font-weight="700">仅 36.9 次</tspan> (降 11.99x!)</text>
  <text x="1060" y="372" fill="#CBD5E1" font-size="13">• 3 年闪断停机损失: <tspan fill="#C084FC" font-weight="700">仅 $37,785.60</tspan></text>
  <rect x="1060" y="388" width="288" height="32" fill="#3B0764" rx="6"/>
  <text x="1204" y="409" fill="#E9D5FF" font-size="13" font-weight="800" text-anchor="middle">3-Yr TCO: $4,319,799.36 (-54.3%)</text>

  <!-- Section 2: Left Panel - Physical Signal Path & Power/Flap Visual Bars -->
  <rect x="36" y="452" width="660" height="368" fill="#1E293B" fill-opacity="0.55" stroke="#334155" rx="10"/>
  <text x="56" y="482" fill="#38BDF8" font-size="15" font-weight="700">② FIRST-PRINCIPLES POWER, LATENCY &amp; 3-YEAR LINK-FLAP REDUCTION</text>

  <!-- Bar group 1: Power -->
  <text x="56" y="514" fill="#E2E8F0" font-size="13" font-weight="700">2,048-GPU Interconnect IT Power (kW) — Lower is Better</text>
  <text x="56" y="538" fill="#94A3B8" font-size="12">Tier 1 All-DSP</text>
  <rect x="180" y="525" width="420" height="16" fill="#EF4444" rx="4"/>
  <text x="610" y="538" fill="#FCA5A5" font-size="12" font-weight="700">131.07 kW</text>

  <text x="56" y="562" fill="#94A3B8" font-size="12">Tier 2 Copper+DSP</text>
  <rect x="180" y="549" width="243" height="16" fill="#38BDF8" rx="4"/>
  <text x="433" y="562" fill="#7DD3FC" font-size="12" font-weight="700">75.78 kW (-42.2%)</text>

  <text x="56" y="586" fill="#94A3B8" font-size="12">Tier 3 Copper+LPO</text>
  <rect x="180" y="573" width="131" height="16" fill="#10B981" rx="4"/>
  <text x="321" y="586" fill="#6EE7B7" font-size="12" font-weight="700">40.96 kW (-68.8%)</text>

  <text x="56" y="610" fill="#94A3B8" font-size="12">Tier 4 CPO+OCS</text>
  <rect x="180" y="597" width="67" height="16" fill="#C084FC" rx="4"/>
  <text x="257" y="610" fill="#E9D5FF" font-size="12" font-weight="700">20.89 kW (-84.1%)</text>

  <!-- Bar group 2: 3-Year Link Flaps -->
  <text x="56" y="648" fill="#E2E8F0" font-size="13" font-weight="700">3-Year Cumulative Link Flaps (Uncorrected Job Rollbacks) — Lower is Better</text>
  <text x="56" y="672" fill="#94A3B8" font-size="12">Tier 1 All-DSP</text>
  <rect x="180" y="659" width="400" height="16" fill="#EF4444" rx="4"/>
  <text x="590" y="672" fill="#FCA5A5" font-size="12" font-weight="700">442.4 flaps ($453k)</text>

  <text x="56" y="696" fill="#94A3B8" font-size="12">Tier 2 Copper+DSP</text>
  <rect x="180" y="683" width="217" height="16" fill="#38BDF8" rx="4"/>
  <text x="407" y="696" fill="#7DD3FC" font-size="12" font-weight="700">239.6 flaps (1.85x fewer)</text>

  <text x="56" y="720" fill="#94A3B8" font-size="12">Tier 3 Copper+LPO</text>
  <rect x="180" y="707" width="100" height="16" fill="#10B981" rx="4"/>
  <text x="290" y="720" fill="#6EE7B7" font-size="12" font-weight="700">110.6 flaps (4.00x fewer)</text>

  <text x="56" y="744" fill="#94A3B8" font-size="12">Tier 4 CPO+OCS</text>
  <rect x="180" y="731" width="34" height="16" fill="#C084FC" rx="4"/>
  <text x="224" y="744" fill="#E9D5FF" font-size="12" font-weight="700">36.9 flaps (11.99x fewer!)</text>

  <rect x="56" y="764" width="620" height="42" fill="#0F172A" stroke="#334155" rx="6"/>
  <text x="70" y="789" fill="#CBD5E1" font-size="12">💡 <tspan fill="#38BDF8" font-weight="700">核心物理机制</tspan>：LPO 拔掉 8.5W PAM4 DSP 芯片使壳温降 15°C；CPO+OCS 消灭全部 Spine 光模块与 O-E-O 转换。</text>

  <!-- Section 3: Right Panel - Architect Decision Tree & Scale Playbook -->
  <rect x="716" y="452" width="648" height="368" fill="#1E293B" fill-opacity="0.55" stroke="#334155" rx="10"/>
  <text x="736" y="482" fill="#34D399" font-size="15" font-weight="700">③ ARCHITECT DECISION PLAYBOOK &amp; PRODUCTION CHECKLIST</text>

  <rect x="736" y="500" width="608" height="72" fill="#0F172A" stroke="#10B981" stroke-width="1.5" rx="8"/>
  <text x="752" y="524" fill="#6EE7B7" font-size="14" font-weight="700">Rule 1: 柜内/相邻柜 (&lt;= 3m DAC / &lt;= 7m AEC) 100% 强制使用铜缆</text>
  <text x="752" y="546" fill="#CBD5E1" font-size="12">液冷高密单柜将 4,096 个接入层端口全部转为铜缆 ($180 vs $1,050, 2.5W vs 16.0W)，</text>
  <text x="752" y="563" fill="#CBD5E1" font-size="12">仅此一步立省 $3,563,520 CapEx 并砍掉 50% 光模块热闪断故障源。</text>

  <rect x="736" y="584" width="608" height="72" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" rx="8"/>
  <text x="752" y="608" fill="#7DD3FC" font-size="14" font-weight="700">Rule 2: 同机房紧凑 Pod (&lt;= 30m–50m) 选 Tier 3 LPO；跨机房 (&gt; 50m) 选 Tier 2 DSP</text>
  <text x="752" y="630" fill="#CBD5E1" font-size="12">800G LPO 借交换机长距 SerDes CTLE/DFE 直驱激光器，单端省电 53.1%、延迟从 115ns 降至 8.0ns，</text>
  <text x="752" y="647" fill="#CBD5E1" font-size="12">2,048 卡 3 年综合 TCO 最低 ($3,923,443.71，净省 $5.53M / -58.5%)。</text>

  <rect x="736" y="668" width="608" height="72" fill="#0F172A" stroke="#C084FC" stroke-width="1.5" rx="8"/>
  <text x="752" y="692" fill="#E9D5FF" font-size="14" font-weight="700">Rule 3: 8,192+ 卡万卡集群 &amp; 1.6T/3.2T 演进选 Tier 4 (冷板 CPO + 3D MEMS OCS)</text>
  <text x="752" y="714" fill="#CBD5E1" font-size="12">在 8,192 卡 (32,768 端点) 规模下，CPO+OCS 将 3 年链路闪断从 1,769.6 次压至 147.6 次 (降 12x)，</text>
  <text x="752" y="731" fill="#CBD5E1" font-size="12">支持前面板 ELS 冷激光源在线热插拔 (&lt; 5 min) 与 OCS 毫秒级全光拓扑重构。</text>

  <rect x="736" y="752" width="608" height="54" fill="#0F172A" stroke="#475569" rx="8"/>
  <text x="752" y="774" fill="#F8FAFC" font-size="12" font-weight="700">🛠️ 生产验收红线：100% MPO 端面显微镜检测 (IEC 61300-3-35, IL &lt; 0.35 dB) + DOM 壳温 &gt; 62°C 预防性摘除</text>
  <text x="752" y="794" fill="#94A3B8" font-size="11">Sealed Data: experiments/ai_cluster_optical_interconnect_selection/results.json · Tests: tests/test_ai_cluster_optical_interconnect_selection.py</text>
</svg>
