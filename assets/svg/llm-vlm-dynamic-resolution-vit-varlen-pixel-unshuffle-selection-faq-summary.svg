  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• High-res OCR PDF (`1960x1400`) produces `14,000` `14x14` patches!</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1 (Padded 3D Batch + 1:1 Projection): Wastes `68%` compute</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  on padding and feeds `14,000` visual tokens into the 72B LLM! ✕</text>
