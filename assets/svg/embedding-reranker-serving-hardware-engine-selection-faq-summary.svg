<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">⚡ 企业级高吞吐 Embedding 与 Reranker 精排推理架构选型一图流总结</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">BGE-M3 / Qwen3-Embedding + bge-reranker-v2 (Top-50 精排) · 1亿向量库 · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#dbeafe" font-size="13" font-weight="700" text-anchor="middle">Round 41 · TEI &amp; TRT-FP8 Rerank</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 原生 PyTorch 补零批处理</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">FastAPI + pad_sequence 按最长序列补 0</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡编码吞吐: <tspan fill="#f87171" font-weight="700">1,250 docs/s (1.0x ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Top-50 精排 P99: <tspan fill="#f87171" font-weight="700">380.0 ms (严重拖慢 RAG ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• [PAD] 零填充算力浪费: <tspan fill="#f87171" font-weight="700">82.4% 空算 0 元素 ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 1 亿向量内存占用: <tspan fill="#f87171" font-weight="700">409.6 GB (1024d FP32)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 1000万文档编码成本: <tspan fill="#f87171" font-weight="700">$4.80</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 揭秘“GPU 100% 满载却极慢”元凶：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">Batch 里 63 条是 80 词短句，只要混进 1 条</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">1024 词长文，全批 64 条都被补零到 1024！</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">GPU 82.4% 的时间在给 0 做二次方注意力！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#334155"/>
    <text x="16" y="27" fill="#f8fafc" font-size="14" font-weight="800">⬜ Tier 2: CPU ONNX Runtime INT8</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">64核 Xeon AVX-512/AMX · 免 GPU 部署</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单机编码吞吐: <tspan fill="#cbd5e1" font-weight="700">420 docs/s</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Top-50 精排 P99: <tspan fill="#fbbf24" font-weight="700">195.0 ms</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• [PAD] 零填充算力浪费: <tspan fill="#fbbf24" font-weight="700">45.0% (分桶缓解)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• NDCG@10 检索精度: <tspan fill="#cbd5e1" font-weight="700">99.1%</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 1000万文档编码成本: <tspan fill="#cbd5e1" font-weight="700">$3.10</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="220" fill="#cbd5e1" font-size="11.5" font-weight="700">📌 适用边界：低频边缘/纯 CPU 环境</text>
    <text x="26" y="238" fill="#94a3b8" font-size="11">适合 QPS &lt;5 的小型内部知识库单条查询编码；</text>
    <text x="26" y="254" fill="#94a3b8" font-size="11">但一旦面对每次查询需精排 50 个候选段落的</text>
    <text x="26" y="270" fill="#94a3b8" font-size="11">Cross-Encoder，CPU 延迟仍高达 195ms！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: HuggingFace TEI / Infinity</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">Rust 网关 + cu_seqlens 零填充 FlashAttention</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡编码吞吐: <tspan fill="#34d399" font-weight="700">10,500 docs/s (8.4x ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Top-50 精排 P99: <tspan fill="#34d399" font-weight="700">28.5 ms (快 13.3x ✅)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• [PAD] 零填充算力浪费: <tspan fill="#34d399" font-weight="700">0.0% (彻底消灭补零 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• NDCG@10 检索精度: <tspan fill="#34d399" font-weight="700">100.0% (BF16 无损)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 1000万文档编码成本: <tspan fill="#60a5fa" font-weight="700">$0.58 (省 87.9% ✅)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 开箱即用 Docker 一键替换首选：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">将 64 条长短不一的句子首尾相连拼成 1D 紧凑</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">数组并传入 `cu_seqlens` 边界指针，连 1 个</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">0 都不算！吞吐立涨 8.4 倍！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: TRT-FP8 + 套娃 MRL 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">零填充 FP8 计算图 + Matryoshka 256d 降维</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡编码吞吐: <tspan fill="#34d399" font-weight="700">18,500 docs/s (14.8x 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Top-50 精排 P99: <tspan fill="#34d399" font-weight="700">14.2 ms (快 26.8x 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• [PAD] 零填充算力浪费: <tspan fill="#34d399" font-weight="700">0.0% 🏆</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 1 亿向量内存占用: <tspan fill="#6ee7b7" font-weight="700">25.6 GB (省 16.0x 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 1000万文档编码成本: <tspan fill="#34d399" font-weight="700">$0.32 (省 93.3% 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 亿级检索 + 亚 15ms 精排终极答案：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① TensorRT-FP8 零填充图把 50 篇精排压至</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">14.2ms；② 俄罗斯套娃 MRL 截取前 256 维</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">INT8 向量，向量库内存从 410GB 砍到 25.6GB！</text>
  </g>

  <!-- Bottom Left: Length Skew Perturbation -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📉 批次内混入长句子时：补零批处理 (Tier 1) 吞吐雪崩 vs. 零填充 (Tier 4)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">在 64 条短句 Batch 中只要混入 1 条 1024~4096 词长文，传统 pad_sequence 吞吐暴跌 96.5%！</text>

    <!-- Uniform -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">1. 长度均匀 (全为 180 词)</text>
    <rect x="220" y="74" width="290" height="14" rx="3" fill="#10b981"/>
    <text x="518" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">18,500/s (Tier 4)</text>
    <rect x="220" y="92" width="85" height="14" rx="3" fill="#64748b"/>
    <text x="312" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">5,400/s (Tier 1)</text>

    <!-- Moderate Skew -->
    <text x="24" y="144" fill="#cbd5e1" font-size="12" font-weight="700">2. 轻度偏斜 (最大 512 词)</text>
    <rect x="220" y="130" width="290" height="14" rx="3" fill="#10b981"/>
    <text x="518" y="142" fill="#6ee7b7" font-size="11.5" font-weight="700">18,480/s (零抖动)</text>
    <rect x="220" y="148" width="38" height="14" rx="3" fill="#f59e0b"/>
    <text x="265" y="160" fill="#fde68a" font-size="11.5" font-weight="700">2,450/s (跌 -54.6%)</text>

    <!-- Extreme Skew -->
    <text x="24" y="200" fill="#cbd5e1" font-size="12" font-weight="700">3. 混入 1 条 1024 词长文</text>
    <rect x="220" y="186" width="289" height="14" rx="3" fill="#10b981"/>
    <text x="518" y="198" fill="#6ee7b7" font-size="11.5" font-weight="700">18,450/s (快 14.8x 🏆)</text>
    <rect x="220" y="204" width="20" height="14" rx="3" fill="#ef4444"/>
    <text x="248" y="216" fill="#f87171" font-size="11.5" font-weight="700">1,250/s (浪费 82.4% ✕)</text>

    <!-- 4K Outlier -->
    <text x="24" y="256" fill="#cbd5e1" font-size="12" font-weight="700">4. 混入 1 条 4096 词长文</text>
    <rect x="220" y="242" width="286" height="14" rx="3" fill="#10b981"/>
    <text x="514" y="254" fill="#6ee7b7" font-size="11.5" font-weight="700">18,200/s (快 95.8x 🏆)</text>
    <rect x="220" y="260" width="5" height="14" rx="2" fill="#ef4444"/>
    <text x="232" y="272" fill="#f87171" font-size="11.5" font-weight="700">190/s (彻底卡死 ✕)</text>

    <rect x="20" y="284" width="560" height="30" rx="6" fill="#1e293b"/>
    <text x="30" y="304" fill="#dbeafe" font-size="11.5" font-weight="700">💡 铁律：永远不要用矩形张量 [B, L_max] 跑变长 Embedding/Reranker，必用 cu_seqlens 1D 扁平化！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师 Embedding 与 Reranker 高性能部署三大黄金法则</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 法则一：立即用 `HuggingFace TEI` 或 `Infinity` 替换手写 FastAPI+PyTorch</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 无需改任何模型权重，直接拉起官方 Rust `text-embeddings-inference` 容器：按总有效</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  Token 预算 (`max_batch_tokens=16384`) 动态攒批 + `flash_attn_varlen`，吞吐立涨 8.4x！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 法则二：用“俄罗斯套娃表征 (Matryoshka MRL)”将向量库内存砍掉 16 倍</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 新一代 Embedding (`Qwen3-Embedding / text-embedding-3 / BGE`) 将最重要信息浓缩在前</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  256 维！直接截取前 256 维 + INT8 量化做粗召回，再接 14.2ms 的 Top-50 FP8 Reranker 精排！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 法则三：在硬件 MIG 切片内用 `CUDA MPS` 共置 Embedding + Reranker</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• Embedding 与 Reranker 模型权重仅 1~2 GB：结合 Round 34 方案，在一个 `1g.20gb` MIG</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  分区内用 MPS 同时托管两者，单查询检索+重排端到端总耗时压进 `&lt;25 ms`！</text>
  </g>
</svg>
