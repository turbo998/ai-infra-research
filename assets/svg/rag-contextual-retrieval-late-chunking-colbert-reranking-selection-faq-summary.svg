  <text x="675" y="578" font-family="Consolas, monospace" font-size="12" fill="#93C5FD">83.5%</text>
  <text x="780" y="578" font-family="Consolas, monospace" font-size="12" fill="#34D399">$165 ($0 LLM)</text>
  <text x="905" y="578" font-family="Consolas, monospace" font-size="12" fill="#34D399">30.5 GB / 14.8ms</text>
  <text x="1075" y="578" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#38BDF8" font-weight="700">✅ Fast Ingest</text>

  <text x="86" y="606" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">S3: Full-Corpus ColBERTv2 PLAID (2-Bit)</text>
