  <text x="1075" y="606" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#FBBF24">⚠️ RAM Bloat</text>

  <text x="86" y="634" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#FCA5A5">S4: Contextual Hybrid (WITHOUT Prefix Cache)</text>
  <text x="430" y="634" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">92.8%</text>
