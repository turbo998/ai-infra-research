  <text x="72" y="700" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#94A3B8">
    Architect Takeaway: Use Late Chunking (S2) for $0-LLM real-time ingestion; use Prefix-Cached Contextual Retrieval + BGE-M3 Rerank (S5) for high-stakes enterprise knowledge bases.
