  <rect width="1280" height="760" fill="url(#bg89)"/>
  <rect x="28" y="24" width="1224" height="712" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="52" y="44" width="268" height="28" rx="14" fill="#065F46" stroke="#10B981" stroke-width="1"/>
  <text x="186" y="63" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700" fill="#A7F3D0" text-anchor="middle">ROUND 89 · CONTEXTUAL RAG &amp; LATE CHUNKING</text>
  <text x="336" y="63" font-family="Segoe UI, Inter, sans-serif" font-size="13" fill="#94A3B8">10M Enterprise Chunks (312.5k 16K-Tok Docs) · Synthetic + Anonymized Reported</text>

  <text x="52" y="104" font-family="Segoe UI, Inter, sans-serif" font-size="24" font-weight="800" fill="#F8FAFC">
    Contextual Retrieval vs. Late Chunking vs. ColBERT Reranking: Cutting RAG Failure Rate 22.4% → 3.6% (-83.9%)
  </text>
  <text x="52" y="130" font-family="Segoe UI, Inter, sans-serif" font-size="14" fill="#CBD5E1">
    Resolving Coreference Amputation via 94% Prefix-Cached Context Headers + Late-Chunking Dense + BGE-M3/ColBERT MaxSim Top-100 Rerank
  </text>

  <!-- Left Panel: Coreference Amputation vs Late Chunking vs Contextual Prepending -->
  <rect x="52" y="152" width="576" height="286" rx="14" fill="url(#card89)" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="182" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">1. Why Naive Chunk-First Loses 22.4% of Enterprise Answers</text>

  <!-- Naive Box -->
  <rect x="72" y="198" width="536" height="68" rx="8" fill="#0B1120" stroke="#EF4444" stroke-width="1"/>
  <text x="88" y="218" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#FCA5A5">✕ Naive Chunk-First (Slice 512-tok first → Embed independently)</text>
  <text x="88" y="238" font-family="Consolas, monospace" font-size="11.5" fill="#94A3B8">Chunk #18: "Its operating margin fell 340 bps in Q3 due to bottlenecks in this region."</text>
  <text x="88" y="256" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#EF4444" font-weight="700">Missing: Which company (ACME)? Which year (FY2026)? Which region (APAC Chips)? → 22.4% Miss Rate!</text>

  <!-- Late Chunking Box -->
  <rect x="72" y="276" width="536" height="68" rx="8" fill="#0B1120" stroke="#38BDF8" stroke-width="1"/>
  <text x="88" y="296" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#7DD3FC">⚡ Late Chunking (Embed Full 16K Doc First → Pool 512-tok Token Spans)</text>
  <text x="88" y="316" font-family="Consolas, monospace" font-size="11.5" fill="#E2E8F0">H_1..16384 = BiEncoder_16K(Full_Doc)  →  v_chunk18 = MeanPool(H[8704 : 9216])</text>
  <text x="88" y="334" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#38BDF8">✓ $0 LLM Token Cost! Self-attention propagates "ACME FY26" into dense vector (Recall: 89.4%)</text>

  <!-- Contextual Retrieval Box -->
  <rect x="72" y="354" width="536" height="70" rx="8" fill="#0B1120" stroke="#10B981" stroke-width="1.2"/>
  <text x="88" y="374" font-family="Segoe UI, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#6EE7B7">🏆 Prefix-Cached Contextual Prepending + Hybrid BM25/Dense + MaxSim Rerank</text>
  <text x="88" y="394" font-family="Consolas, monospace" font-size="11.5" fill="#A7F3D0">"[Doc: ACME FY2026 10-K | Sec 4: APAC Semiconductor] Its operating margin fell 340 bps..."</text>
  <text x="88" y="412" font-family="Segoe UI, Inter, sans-serif" font-size="11.5" fill="#34D399" font-weight="700">✓ Fixes BOTH Lexical BM25 &amp; Dense Vectors! 94.1% KV Cache Hit Cuts Indexing $148k → $9.8k!</text>

  <!-- Right Panel: Prefix-Cache Economics & Two-Stage Multi-Vector Architecture -->
  <rect x="648" y="152" width="580" height="286" rx="14" fill="url(#card89)" stroke="#334155" stroke-width="1.2"/>
  <text x="668" y="182" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">2. Ingestion Prefix-Cache Math &amp; Two-Stage MaxSim Pipeline</text>

  <rect x="668" y="198" width="540" height="108" rx="10" fill="#0B1120" stroke="#F59E0B" stroke-width="1"/>
  <text x="684" y="220" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#FBBF24">Why Uncached Contextual Retrieval Costs $148,000 vs. $9,800 with Prefix Cache</text>
  <text x="684" y="242" font-family="Consolas, monospace" font-size="11.5" fill="#E2E8F0">• 312,500 Docs × 32 Chunks/Doc = 10,000,000 Chunks (Each Doc = 16,384 tokens)</text>
  <text x="684" y="262" font-family="Consolas, monospace" font-size="11.5" fill="#FCA5A5">• Uncached O(N²): 10M × 16,896 tok = 168.96 Billion input tokens → $148,000 ✕</text>
  <text x="684" y="282" font-family="Consolas, monospace" font-size="11.5" fill="#34D399">• Sequential Doc Grouping: Chunk 1 caches 16K doc; Chunks 2..32 hit 94.1% KV Cache → $9,800 (-93.4%)!</text>

  <rect x="668" y="318" width="540" height="106" rx="10" fill="#0B1120" stroke="#818CF8" stroke-width="1"/>
  <text x="684" y="340" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">Why Full-Corpus ColBERT PLAID Explodes RAM (564 GB) vs. Stage-2 MaxSim (34.2 GB)</text>
  <text x="684" y="362" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">• Storing 512 token vectors × 10M chunks = 5.12 Billion vectors (564 GB RAM even w/ 2-bit PLAID).</text>
  <text x="684" y="382" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#E2E8F0">• Instead: Stage-1 Contextual BM25 + Late-Chunk Dense retrieves Top-100 in 18 ms (34.2 GB RAM).</text>
  <text x="684" y="402" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#34D399" font-weight="700">• Stage-2 BGE-M3 / ColBERT MaxSim reranks Top-100 on GPU in 20 ms → 96.4% Recall &amp; 93.8% NDCG@10!</text>

  <!-- Bottom Panel: 5-Scenario Matrix -->
  <rect x="52" y="456" width="1176" height="258" rx="14" fill="url(#card89)" stroke="#334155" stroke-width="1.2"/>
  <text x="72" y="486" font-family="Segoe UI, Inter, sans-serif" font-size="16" font-weight="700" fill="#F8FAFC">
    3. Quantitative Evaluation Matrix (10M Enterprise Chunks, 312.5k 16K-Token Docs, 150 QPS)
  </text>

