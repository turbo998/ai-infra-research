  <text x="780" y="634" font-family="Consolas, monospace" font-size="12" fill="#EF4444" font-weight="700">$148,000 ✕</text>
  <text x="905" y="634" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">34.2 GB / 21.0ms</text>
  <text x="1075" y="634" font-family="Segoe UI, Inter, sans-serif" font-size="12" fill="#EF4444" font-weight="700">⛔ Cost Trap</text>

  <rect x="72" y="646" width="1136" height="32" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
