<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" fill="url(#bgGrad)" rx="16"/>

  <!-- Header -->
  <rect x="28" y="22" width="1144" height="86" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="44" y="38" width="176" height="24" rx="6" fill="url(#accentPurple)"/>
  <text x="132" y="54" fill="#ffffff" font-size="11.5" font-weight="800" text-anchor="middle">ROUND 11 · RLHF / GRPO INFRA</text>
  <text x="234" y="55" fill="#f8fafc" font-size="19" font-weight="800">大模型 RLHF / GRPO 后训练架构选型：HybridEngine 3D 重分片 vs. 异步 Partial Rollout</text>
  <text x="44" y="88" fill="#94a3b8" font-size="12.5">70B Policy (G=8, 4,096 Trajectories/Step, 16.78M Tokens/Step, 24K Long-CoT Tail) · 64×H100 80GB ($160/hr) · Provenance: synthetic (independently_reproduced=false)</text>

  <!-- 4 Tier Cards -->
  <!-- Tier 1 -->
  <rect x="28" y="124" width="274" height="236" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.8"/>
  <text x="44" y="150" fill="#fca5a5" font-size="12" font-weight="800">⛔ TIER 1 · 原生 FSDP 直接采样</text>
  <text x="44" y="172" fill="#f8fafc" font-size="14.5" font-weight="700">Naive ZeRO-3 .generate()</text>
  <text x="44" y="206" fill="#ef4444" font-size="27" font-weight="800">612.0 s / 步</text>
  <text x="44" y="228" fill="#cbd5e1" font-size="12">吞吐：27,413.8 tok/s (1.00x 基线)</text>
  <text x="44" y="248" fill="#cbd5e1" font-size="12">Rollout 耗时：548.0s + 训练 64.0s</text>
  <text x="44" y="268" fill="#cbd5e1" font-size="12">长尾气泡：62.0% · 有效 MFU：11.5%</text>
  <text x="44" y="288" fill="#fca5a5" font-size="12" font-weight="700">千步成本：$27,200.00 (170.00 hrs)</text>
  <rect x="44" y="304" width="242" height="40" rx="6" fill="#450a0a"/>
  <text x="54" y="321" fill="#fecaca" font-size="11">痛点：每个 Token 跨卡 All-Gather 70B</text>
  <text x="54" y="337" fill="#fecaca" font-size="11">权重，无 PagedAttention，严禁生产使用</text>

  <!-- Tier 2 -->
  <rect x="318" y="124" width="274" height="236" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="334" y="150" fill="#93c5fd" font-size="12" font-weight="800">🔹 TIER 2 · Ray 静态双池分离</text>
  <text x="334" y="172" fill="#f8fafc" font-size="14.5" font-weight="700">OpenRLHF Split (32+32 GPUs)</text>
  <text x="334" y="206" fill="#60a5fa" font-size="27" font-weight="800">286.5 s / 步</text>
  <text x="334" y="228" fill="#cbd5e1" font-size="12">吞吐：58,559.2 tok/s (2.14x 加速)</text>
  <text x="334" y="248" fill="#cbd5e1" font-size="12">Rollout 196.0s + 广播 18.5s + 训练 72.0s</text>
  <text x="334" y="268" fill="#cbd5e1" font-size="12">长尾气泡：48.0% · 有效 MFU：24.6%</text>
  <text x="334" y="288" fill="#93c5fd" font-size="12" font-weight="700">千步成本：$12,732.80 (79.58 hrs)</text>
  <rect x="334" y="304" width="242" height="40" rx="6" fill="#172554"/>
  <text x="344" y="321" fill="#bfdbfe" font-size="11">适用：16~64 卡快速工程解耦与重型沙箱；</text>
  <text x="344" y="337" fill="#bfdbfe" font-size="11">存在 50% 双池互等与 18.5s RDMA 广播</text>

  <!-- Tier 3 -->
  <rect x="608" y="124" width="274" height="236" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
  <text x="624" y="150" fill="#6ee7b7" font-size="12" font-weight="800">✅ TIER 3 · 同池零拷贝 3D 重分片</text>
  <text x="624" y="172" fill="#f8fafc" font-size="14.5" font-weight="700">HybridEngine (verl 同步模式)</text>
  <text x="624" y="206" fill="#34d399" font-size="27" font-weight="800">158.2 s / 步</text>
  <text x="624" y="228" fill="#cbd5e1" font-size="12">吞吐：106,050.7 tok/s (3.87x 加速)</text>
  <text x="624" y="248" fill="#cbd5e1" font-size="12">Rollout 92.0s + 重分片 3.2s + 训练 63.0s</text>
  <text x="624" y="268" fill="#cbd5e1" font-size="12">24K 长尾气泡：52.0% · 有效 MFU：44.5%</text>
  <text x="624" y="288" fill="#6ee7b7" font-size="12" font-weight="700">千步成本：$7,030.40 (省 74.2%)</text>
  <rect x="624" y="304" width="242" height="40" rx="6" fill="#064e3b"/>
  <text x="634" y="321" fill="#a7f3d0" font-size="11">主力推荐 (CoT &lt;= 8K)：64卡全量复用 +</text>
  <text x="634" y="337" fill="#a7f3d0" font-size="11">3.2s CUDA IPC 重分片 + cuMemUnmap Sleep</text>

  <!-- Tier 4 -->
  <rect x="898" y="124" width="274" height="236" rx="12" fill="#1e293b" stroke="#a855f7" stroke-width="2.2"/>
  <text x="914" y="150" fill="#d8b4fe" font-size="12" font-weight="800">🚀 TIER 4 · 异步流式 + 分段续写</text>
  <text x="914" y="172" fill="#f8fafc" font-size="14.5" font-weight="700">Partial Rollout (AReaL / k1.5)</text>
  <text x="914" y="206" fill="#c084fc" font-size="27" font-weight="800">96.4 s / 步</text>
  <text x="914" y="228" fill="#cbd5e1" font-size="12">吞吐：174,037.5 tok/s (6.35x 加速)</text>
  <text x="914" y="248" fill="#cbd5e1" font-size="12">窗口 31.0s + 同步 2.4s + 训练 63.0s</text>
  <text x="914" y="268" fill="#cbd5e1" font-size="12">长尾气泡：8.5% · 有效 MFU：73.0%</text>
  <text x="914" y="288" fill="#d8b4fe" font-size="12" font-weight="700">千步成本：$4,284.80 (立省 $22,915.20)</text>
  <rect x="914" y="304" width="242" height="40" rx="6" fill="#3b0764"/>
  <text x="924" y="321" fill="#e9d5ff" font-size="11">长思维链首选 (16K~64K CoT)：KV 前缀</text>
  <text x="924" y="337" fill="#e9d5ff" font-size="11">跨步续写 + 有界陈旧度 (τ&lt;=2) Dual-Clip IS</text>

  <!-- Middle Visual Comparison: Step Time Breakdown & Straggler Bubble -->
  <rect x="28" y="378" width="690" height="226" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="48" y="406" fill="#f8fafc" font-size="15.5" font-weight="800">📊 单步耗时拆解 (Rollout 采样 + 权重同步/重分片 + Actor 训练) 与 24K CoT 长尾气泡消减</text>

  <!-- Bar 1 -->
  <text x="48" y="442" fill="#cbd5e1" font-size="12" font-weight="700">Tier 1 (FSDP 直接采样)</text>
  <rect x="220" y="427" width="380" height="22" rx="4" fill="#ef4444"/>
  <rect x="600" y="427" width="45" height="22" rx="4" fill="#3b82f6"/>
  <text x="652" y="443" fill="#fca5a5" font-size="12" font-weight="700">612.0s</text>

  <!-- Bar 2 -->
  <text x="48" y="482" fill="#cbd5e1" font-size="12" font-weight="700">Tier 2 (Ray 静态双池)</text>
  <rect x="220" y="467" width="136" height="22" rx="4" fill="#f59e0b"/>
  <rect x="356" y="467" width="13" height="22" rx="2" fill="#eab308"/>
  <rect x="369" y="467" width="50" height="22" rx="4" fill="#3b82f6"/>
  <text x="427" y="483" fill="#93c5fd" font-size="12" font-weight="700">286.5s (2.14x)</text>

  <!-- Bar 3 -->
  <text x="48" y="522" fill="#cbd5e1" font-size="12" font-weight="700">Tier 3 (HybridEngine 同步)</text>
  <rect x="220" y="507" width="64" height="22" rx="4" fill="#10b981"/>
  <rect x="284" y="507" width="4" height="22" rx="1" fill="#eab308"/>
  <rect x="288" y="507" width="44" height="22" rx="4" fill="#3b82f6"/>
  <text x="340" y="523" fill="#6ee7b7" font-size="12" font-weight="700">158.2s (3.87x · 仍含 52.0% 24K 尾长等待)</text>

  <!-- Bar 4 -->
  <text x="48" y="562" fill="#cbd5e1" font-size="12" font-weight="700">Tier 4 (Async Partial Rollout)</text>
  <rect x="220" y="547" width="22" height="22" rx="4" fill="#8b5cf6"/>
  <rect x="242" y="547" width="3" height="22" rx="1" fill="#eab308"/>
  <rect x="245" y="547" width="44" height="22" rx="4" fill="#3b82f6"/>
  <text x="297" y="563" fill="#d8b4fe" font-size="12" font-weight="800">96.4s (6.35x · 气泡降至 8.5%，MFU 达 73.0%)</text>

  <text x="48" y="592" fill="#94a3b8" font-size="11.5">图例：■ Rollout 自回归采样阶段  ■ 权重重分片/广播 (Tier 3: 3.2s, Tier 4: 2.4s)  ■ Actor/Ref 前反向训练阶段 (~63-72s)</text>

  <!-- Right Panel: Decision Tree & Inflection Points -->
  <rect x="734" y="378" width="438" height="226" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="754" y="406" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 架构师黄金选型法则与安全边界</text>
  <text x="754" y="434" fill="#6ee7b7" font-size="12.5" font-weight="700">1. 短/中思维链 (P99 &lt;= 4K~8K tokens) → 选 Tier 3 (verl)</text>
  <text x="754" y="454" fill="#cbd5e1" font-size="11.5">• 64卡全量复用 + 3.2s 显存内零拷贝 3D 重分片，100% 严格 On-Policy</text>
  <text x="754" y="472" fill="#cbd5e1" font-size="11.5">• 必须开启 vLLM cuMemUnmap Sleep Mode 释放物理页防 OOM</text>

  <text x="754" y="502" fill="#d8b4fe" font-size="12.5" font-weight="700">2. 长思维链 / Agentic RL (P99 16K~64K) → 选 Tier 4</text>
  <text x="754" y="522" fill="#cbd5e1" font-size="11.5">• Partial Rollout 暂停未完成长链，跨步复用 KV Cache 前缀无缝续写</text>
  <text x="754" y="540" fill="#cbd5e1" font-size="11.5">• 尾长 2K→24K→64K 时，相对同步模式加速比：1.12x → 1.64x → 2.38x</text>

  <text x="754" y="570" fill="#fcd34d" font-size="12.5" font-weight="700">3. 异步陈旧度红线：max_staleness_steps &lt;= 2</text>
  <text x="754" y="589" fill="#cbd5e1" font-size="11.5">• 配合 Dual-Clip 截断重要性采样；陈旧度 &gt;=5 步无修剪将导致 KL 崩溃</text>

  <!-- Bottom Production Checklist Banner -->
  <rect x="28" y="620" width="1144" height="116" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="646" fill="#38bdf8" font-size="14" font-weight="800">🛠️ 生产环境核验清单 (Production Verification Checklist) · 封存算例：experiments/rlhf_post_training_infra_selection/results.json</text>
  <text x="48" y="672" fill="#e2e8f0" font-size="12">☑ [1] 严禁直接调用 ZeRO-3/FSDP .generate()，采样必须重分片至 vLLM/SGLang (TP=4 + PagedAttention)</text>
  <text x="48" y="694" fill="#e2e8f0" font-size="12">☑ [2] 同池部署启用 vLLM Sleep/Wake (cuMemUnmap) 毫秒级释放 KV 物理显存并保留 CUDA Graph</text>
  <text x="48" y="716" fill="#e2e8f0" font-size="12">☑ [3] 重分片融合 BF16 → FP8 (E4M3) 权重量化，并将外部代码/数学判题沙箱解耦至独立异步 CPU 池</text>
  <text x="640" y="672" fill="#e2e8f0" font-size="12">☑ [4] 当 P99/P50 轨迹长度比 &gt; 3.0x 时启用 Partial Rollout 跨步 KV 前缀续写</text>
  <text x="640" y="694" fill="#e2e8f0" font-size="12">☑ [5] 异步流式训练强制限制策略陈旧度 τ &lt;= 2 步，开启 Dual-Clip 截断重要性采样</text>
  <text x="640" y="716" fill="#94a3b8" font-size="11.5">Provenance: synthetic model calibrated on verl/OpenRLHF/AReaL/Kimi-k1.5 · GPU cluster: not_measured</text>
</svg>
