<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#0B1220"/>
  <rect x="28" y="24" width="1224" height="92" rx="14" fill="#111C33" stroke="#F59E0B" stroke-width="2"/>
  <text x="52" y="62" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">企业级长周期持久化智能体工作流 (Durable Agentic Workflows) 选型：Temporal/Restate vs. LangGraph</text>
  <text x="52" y="94" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="15">攻克 25 步复合 Agent 26% 中途崩盘魔咒：每步 LLM/MCP 结果事件溯源持久化 + 跨天人工审批零内存休眠 + 幂等防重放</text>

  <!-- Left: Compounding Failure Math of Multi-Step Agents -->
  <rect x="28" y="136" width="590" height="260" rx="14" fill="#1E1320" stroke="#EF4444" stroke-width="1.5"/>
  <text x="50" y="170" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. 为什么 25 步 Agent 用普通内存循环会有 26% 概率半途崩盘？</text>
  <rect x="48" y="188" width="550" height="86" rx="8" fill="#0F172A" stroke="#EF4444"/>
  <text x="64" y="214" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📐 指数级级联失败率公式：`P_success = (1 - p_fail)^25`</text>
  <text x="64" y="238" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 即使单步调用（LLM 429/503、外部 API 抖动、K8s 发版滚动重启）失败率仅 `1.2%`，</text>
  <text x="64" y="260" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 连续跑完 25 步不崩的概率仅 `(0.988)^25 = 74.0%`！第 22 步崩盘导致前 21 步 Token 全白烧！</text>
  <rect x="48" y="288" width="550" height="88" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="64" y="314" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">❌ 致命事故：整任务从头重试导致外部 API 重复扣款 / 重复建单</text>
  <text x="64" y="338" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Step 15 已经成功创建了 Jira 工单并发送了邮件，Step 19 报错触发 Celery 从 Step 1 重跑，</text>
  <text x="64" y="360" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 直接造成 `8.2% ~ 11.4%` 的外部写操作被重复执行！且人工审批挂起 4 小时占死 Worker 进程！</text>

  <!-- Right: Temporal/Restate + LangGraph Checkpointer Architecture -->
  <rect x="642" y="136" width="610" height="260" rx="14" fill="#0F241D" stroke="#10B981" stroke-width="1.5"/>
  <text x="664" y="170" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. 持久化执行引擎三板斧 (Temporal / Restate + LangGraph, Tier 4)</text>
  <rect x="664" y="188" width="566" height="56" rx="8" fill="#0F172A" stroke="#10B981"/>
  <text x="680" y="212" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">① 步级事件日志记忆化 (`Activity Event Journal Memoization`)</text>
  <text x="680" y="232" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">每次 LLM 输出与 MCP 工具返回值立即落盘；Step 22 崩溃重拉时瞬间回放前 21 步缓存结果，0 Token 重算！</text>
  <rect x="664" y="254" width="566" height="56" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="680" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">② 人工审批零算力休眠 (`workflow.wait_condition` / `LangGraph interrupt`)</text>
  <text x="680" y="298" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">等待高管点击邮件审批的 4~72 小时内，工作流状态冻结在数据库中，占用 0 CPU / 0 内存！</text>
  <rect x="664" y="320" width="566" height="58" rx="8" fill="#0F172A" stroke="#C084FC"/>
  <text x="680" y="344" fill="#E9D5FF" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">③ 确定性幂等键 (`workflow_id + step_seq`) + Saga 逆向补偿</text>
  <text x="680" y="364" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="13">自动为每一次外部 MCP 写调用注入唯一幂等键，将重复外部副作用死死锁在 0.0%！</text>

  <!-- Bottom: 4-Tier Matrix -->
  <rect x="28" y="416" width="1224" height="276" rx="14" fill="#111C33" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="450" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">3. 月均 50 万次 25 步企业 Agent 任务（含 30% 跨小时人工审批）四档编排架构对比</text>

  <text x="52" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Agent 工作流持久化架构</text>
  <text x="450" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">25步完结成功率</text>
  <text x="620" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">失败重算 Token 浪费</text>
  <text x="800" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">外部重复写事故率</text>
  <text x="960" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">单步持久化开销</text>
  <text x="1120" y="486" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">月度总成本 (TCO)</text>

  <rect x="44" y="500" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="524" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 1: 无状态 Pod 内存 `while` 循环 (崩溃/发版即全丢)</text>
  <text x="450" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">74.0% ✕</text>
  <text x="620" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">38.5% ✕</text>
  <text x="800" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">11.4% ✕</text>
  <text x="960" y="524" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">0.0 ms</text>
  <text x="1120" y="524" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">$148,000/mo ✕</text>

  <rect x="44" y="544" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 2: Celery / Redis 队列整任务从 Step 1 粗粒度重试</text>
  <text x="450" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">91.5%</text>
  <text x="620" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14">29.0% ✕</text>
  <text x="800" y="568" fill="#EF4444" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">8.2% (重复调工具)</text>
  <text x="960" y="568" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="14">4.5 ms</text>
  <text x="1120" y="568" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="14">$124,000/mo</text>

  <rect x="44" y="588" width="1192" height="38" rx="6" fill="#1E293B"/>
  <text x="56" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 3: `LangGraph` 状态图 + `AsyncPostgresSaver` 节点快照</text>
  <text x="450" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">98.8% ✓</text>
  <text x="620" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">2.4% ✓</text>
  <text x="800" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">1.2%</text>
  <text x="960" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">11.5 ms</text>
  <text x="1120" y="612" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14">$82,000/mo</text>

  <rect x="44" y="632" width="1192" height="44" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="56" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Tier 4 (推荐): Temporal / Restate / DBOS 事件溯源重放 + 幂等门控</text>
  <text x="450" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">99.98% ✓</text>
  <text x="620" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.1% ✓</text>
  <text x="800" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">0.0% (零重放事故)</text>
  <text x="960" y="660" fill="#10B981" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">6.2 ms ✓</text>
  <text x="1120" y="660" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">$68,500/mo (-54%)</text>
</svg>
