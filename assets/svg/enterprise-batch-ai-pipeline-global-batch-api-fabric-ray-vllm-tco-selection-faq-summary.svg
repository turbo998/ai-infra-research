<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级海量离线批处理 AI 流水线选型：50% 折扣 Global Batch API vs. Fabric AI vs. Ray Data + vLLM (#415)</text>
  <text x="28" y="58" class="sub">为什么不要用实时在线 API 跑夜间千万条工单/评论清洗？利用前缀+长度双重预排序、B=384 屋脊线满载与闲时 PTU/Spot 收割省 84.6%！</text>

  <!-- Left Panel: 4 Batch AI Architectures -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 四大海量离线批处理 AI 架构选型对比 (每晚 1,000 万条记录 · 120 亿 Tokens)</text>

  <rect x="42" y="120" width="524" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="54" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 循环并发调在线同步 API (Synchronous Standard PAYGO)</text>
  <text x="54" y="158" class="mono">• 触发 429 限流风暴 (失败重跑 22%) | 无批处理折扣 | 单晚成本 $9,600 ($28.8万/月) ✕</text>

  <rect x="42" y="176" width="524" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="54" y="196" class="txt" font-weight="700" fill="#fde68a">Tier 2: 云原生异步 Batch API (Azure OpenAI Global Batch / Bedrock 50% Off)</text>
  <text x="54" y="214" class="mono">• 上传 .jsonl 异步队列 (24h SLA) | 享官方 50% 半价 + 独立配额池 | 单晚 $4,200 ($12.6万/月)</text>

  <rect x="42" y="232" width="524" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="54" y="252" class="txt" font-weight="700" fill="#93c5fd">Tier 3: 湖仓一体内生批处理 (Microsoft Fabric AI Functions / Databricks ai_query)</text>
  <text x="54" y="270" class="mono">• OneLake/Delta 零数据搬迁 | SQL/Spark 直接调用 | 自动微批重试 | 单晚 $2,850 ($8.55万/月)</text>

  <rect x="42" y="288" width="524" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="54" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: Ray Data 流式双排序 + vLLM 离线大 Batch (B=384) + 白天闲时 GPU 收割 (🏆)</text>
  <text x="54" y="326" class="mono">• Prefix+Length 双重分桶 + 复用白天在线 PTU/GPU 夜间空闲算力 | 单晚仅 $680 ($2.04万/月)!</text>

  <!-- Right Panel: Prefix + Length Pre-Sorting & Roofline Math -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 为什么离线批处理必须做“前缀 + 长度”双重预排序 (2D Pre-Sorting)？</text>

  <rect x="626" y="120" width="532" height="100" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="640" y="142" class="txt" font-weight="700" fill="#38bdf8">🔑 第一维：按共享模板/分类体系排序 (Prefix Lexicographical Sort)</text>
  <text x="640" y="164" class="mono">• 随机乱序输入：100 种分类 Prompt 交替刷入，vLLM 显存无法装下全部前缀，命中率仅 31%</text>
  <text x="640" y="184" class="mono">• 预排序后：相同 System Prompt 与 Few-Shot 样本连续进入同一 Worker，</text>
  <text x="640" y="204" class="txt" fill="#6ee7b7">  Prefix KV 缓存命中率从 31.0% 飙升至 96.4%，Prefill 算力直接省去 88%！</text>

  <rect x="626" y="232" width="532" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="640" y="254" class="txt" font-weight="700" fill="#34d399">📏 第二维：按输入/预期输出长度分桶 (Length Bucketing + B=384 满载)</text>
  <text x="640" y="276" class="mono">• 离线无 TTFT/TPOT 实时交互包袱！可将并发 Batch Size 从在线的 B=32 拉满至 B=384</text>
  <text x="640" y="296" class="mono">• 跨越 H200 屋脊线拐点 (Arithmetic Intensity = 295 FLOPs/Byte)，实现计算单元满载</text>
  <text x="640" y="316" class="txt" fill="#fde68a">  单张 H200 有效吞吐从在线的 1,850 tok/s 暴涨 4.2x 至 7,840 tok/s！</text>

  <!-- Bottom Panel: Ray Data Streaming Pipeline & Nightly Harvesting -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端离线批处理参考架构：Ray Data 异构流式流水线 + 夜间零成本收割白天在线 GPU</text>

  <rect x="42" y="414" width="250" height="196" rx="8" fill="#1e293b" stroke="#64748b"/>
  <text x="56" y="440" class="txt" font-weight="700">① OneLake / Parquet 源表</text>
  <text x="56" y="464" class="mono">• 1,000 万条客服工单/商品</text>
  <text x="56" y="484" class="mono">• CPU 节点执行 SQL 字典</text>
  <text x="56" y="504" class="mono">  排序: ORDER BY</text>
  <text x="56" y="524" class="mono">  template_id, char_len</text>
  <text x="56" y="550" class="txt" fill="#93c5fd">零 GPU 消耗完成预分桶</text>

  <rect x="316" y="414" width="270" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="330" y="440" class="txt" font-weight="700" fill="#38bdf8">② Ray Data 异构流式背压</text>
  <text x="330" y="464" class="mono">• CPU Worker 流式读取</text>
  <text x="330" y="484" class="mono">  Parquet 并分词打包</text>
  <text x="330" y="504" class="mono">• 每 10,000 条写一次</text>
  <text x="330" y="524" class="mono">  Delta Checkpoint</text>
  <text x="330" y="550" class="txt" fill="#6ee7b7">Spot 抢占仅丢 &lt;15 秒进度</text>

  <rect x="610" y="414" width="270" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="624" y="440" class="txt" font-weight="700" fill="#34d399">③ 夜间潮汐收割 + Spot 池</text>
  <text x="624" y="464" class="mono">• 00:00-06:00 借用白天</text>
  <text x="624" y="484" class="mono">  在线业务的 32 张闲置</text>
  <text x="624" y="504" class="mono">  H200 ($0 边际硬件费!)</text>
  <text x="624" y="524" class="mono">• 溢出部分弹性拉起 Spot</text>
  <text x="624" y="550" class="txt" fill="#34d399">单卡满载 7,840 tok/s</text>

  <rect x="904" y="414" width="252" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="918" y="440" class="txt" font-weight="700" fill="#d8b4fe">④ XGrammar 强约束写回</text>
  <text x="918" y="464" class="mono">• 100% 合法 JSON Schema</text>
  <text x="918" y="484" class="mono">• 零格式解析报错重跑</text>
  <text x="918" y="504" class="mono">• 4.2 小时跑完 1,000 万条</text>
  <text x="918" y="524" class="mono">• 直写 Fabric OneLake</text>
  <text x="918" y="550" class="txt" fill="#fde68a">月成本从 $28.8万降至 $2.04万</text>
</svg>
