<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">🧮 大模型低精度预训练 (FP8 / NVFP4 vs. BF16) 数值稳定性与吞吐选型一图流总结</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">671B MoE (37B 激活) · 10 万亿 (10T) Tokens 预训练 · 2,048 卡集群 · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="965" y="42" width="283" height="38" rx="19" fill="#451a03" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="1106" y="66" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Round 31 · FP8 / NVFP4 Training</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#334155"/>
    <text x="16" y="27" fill="#f8fafc" font-size="14" font-weight="800">⬜ Tier 1: 标准 BF16 混合精度基线</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">BF16 矩阵乘 + FP32 主权重与累加</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡训练吞吐: <tspan fill="#cbd5e1" font-weight="700">2,950 tok/s (1.00x)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 验证集 Loss 偏差: <tspan fill="#34d399" font-weight="700">0.00% (黄金基准)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• Loss 爆炸回滚次数: <tspan fill="#34d399" font-weight="700">0 次 / 1T Tokens</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 激活与通信显存占用: <tspan fill="#f87171" font-weight="700">54.0 GB / GPU (偏高)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10T 预训练算力账单: <tspan fill="#f87171" font-weight="700">$4,590,000</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="220" fill="#cbd5e1" font-size="11.5" font-weight="700">📌 为什么 BF16 稳但太贵？</text>
    <text x="26" y="238" fill="#94a3b8" font-size="11">8 位指数 (E8M7) 天生不怕激活离群值，但只</text>
    <text x="26" y="254" fill="#94a3b8" font-size="11">能用到 Hopper 一半的 Tensor Core 峰值算</text>
    <text x="26" y="270" fill="#94a3b8" font-size="11">力，且 MoE All-to-All 通信量翻倍！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 2: 粗粒度 Per-Tensor FP8</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">整张矩阵共用 1 个延迟缩放系数 amax</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡训练吞吐: <tspan fill="#fbbf24" font-weight="700">3,980 tok/s (1.35x)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 验证集 Loss 偏差: <tspan fill="#f87171" font-weight="700">+1.85% (严重掉点 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• Loss 爆炸回滚次数: <tspan fill="#f87171" font-weight="700">11 次 / 1T Tokens ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 激活与通信显存占用: <tspan fill="#cbd5e1" font-weight="700">34.5 GB / GPU</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10T 预训练算力账单: <tspan fill="#fbbf24" font-weight="700">$3,820,000 (含重训浪费)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么初代 Per-Tensor FP8 会崩？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① SwiGLU 单个 1000x 离群通道拉爆全局</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">amax，把 99% 正常值压成 0；② Hopper</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">WGMMA 仅 13 位尾数累加导致长内积漂移！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: DeepSeek-V3 分块 FP8 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">1×128 Tile + 128×128 Block + FP32 提升</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡训练吞吐: <tspan fill="#34d399" font-weight="700">4,366 tok/s (1.48x 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 验证集 Loss 偏差: <tspan fill="#34d399" font-weight="700">0.07% (无损收敛 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• Loss 爆炸回滚次数: <tspan fill="#34d399" font-weight="700">0 次 / 1T Tokens 🏆</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 激活与通信显存占用: <tspan fill="#34d399" font-weight="700">28.2 GB (-47.8% 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10T 预训练算力账单: <tspan fill="#60a5fa" font-weight="700">$3,100,000 (立省 $1.49M)</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">🏆 Hopper H100/H200/H800 唯一正解：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 1×128 细粒度切片把离群值关在笼子里；</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">② 每 128 步将 Tensor Core 部分和提升至</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">CUDA Core 23 位 FP32 寄存器累加！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: Blackwell MXFP8 / NVFP4 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">硬件 1×32/1×16 微缩放 + 哈达玛 + 随机舍入</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 单卡训练吞吐: <tspan fill="#34d399" font-weight="700">6,342 tok/s (2.15x 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 验证集 Loss 偏差: <tspan fill="#34d399" font-weight="700">0.14% (无损收敛 ✅)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• Loss 爆炸回滚次数: <tspan fill="#34d399" font-weight="700">0 次 / 1T Tokens 🏆</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 激活与通信显存占用: <tspan fill="#6ee7b7" font-weight="700">19.5 GB (-63.9% 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 10T 预训练算力账单: <tspan fill="#34d399" font-weight="700">$2,135,000 (省 $2.455M)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🚀 Blackwell 第五代 Tensor Core 跃迁：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">硬件原生支持 32 元素 E8M0 微缩放 (MXFP8)</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">与 16 元素 E4M3 微缩放 (NVFP4)，叠加随机</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">舍入消除梯度量化偏差，成本砍半！</text>
  </g>

  <!-- Bottom Left: Mechanism Deep Dive -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🔬 离群值 (Outlier) 冲击下信噪比 (SQNR dB)：Per-Tensor vs. 1×128 分块缩放</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">当 SwiGLU 与 MoE 路由层出现 250×~1000× 尖峰时，Per-Tensor 信噪比跌至负值引发 Loss 爆炸</text>

    <!-- Group 1 -->
    <text x="24" y="92" fill="#cbd5e1" font-size="12" font-weight="700">常规层 (10× 离群值, K=4096)</text>
    <rect x="235" y="78" width="305" height="14" rx="4" fill="#3b82f6"/>
    <text x="546" y="90" fill="#93c5fd" font-size="11.5" font-weight="700">38.2 dB (Tier 3)</text>
    <rect x="235" y="96" width="196" height="14" rx="4" fill="#f59e0b"/>
    <text x="438" y="108" fill="#fde68a" font-size="11.5" font-weight="700">24.5 dB (Tier 2)</text>

    <!-- Group 2 -->
    <text x="24" y="158" fill="#cbd5e1" font-size="12" font-weight="700">SwiGLU 投影 (250× 离群值)</text>
    <rect x="235" y="144" width="294" height="14" rx="4" fill="#3b82f6"/>
    <text x="536" y="156" fill="#93c5fd" font-size="11.5" font-weight="700">36.8 dB (稳如泰山)</text>
    <rect x="235" y="162" width="78" height="14" rx="4" fill="#ef4444"/>
    <text x="320" y="174" fill="#f87171" font-size="11.5" font-weight="700">9.8 dB (严重失真 ✕)</text>

    <!-- Group 3 -->
    <text x="24" y="224" fill="#cbd5e1" font-size="12" font-weight="700">MoE 后期尖峰 (1,000× 离群值)</text>
    <rect x="235" y="210" width="287" height="14" rx="4" fill="#10b981"/>
    <text x="528" y="222" fill="#6ee7b7" font-size="11.5" font-weight="700">35.9 dB (零回滚 🏆)</text>
    <rect x="235" y="228" width="16" height="14" rx="4" fill="#ef4444"/>
    <text x="258" y="240" fill="#f87171" font-size="11.5" font-weight="700">-1.4 dB (梯度归零/NaN 爆炸 ✕)</text>

    <rect x="20" y="266" width="560" height="44" rx="6" fill="#1e293b"/>
    <text x="32" y="285" fill="#fde68a" font-size="11.5" font-weight="700">💡 为什么全用 E4M3 而不用 E5M2？</text>
    <text x="32" y="302" fill="#cbd5e1" font-size="11">一旦用 1×128 细粒度缩放解决了动态范围问题，前向与反向全部采用 3 位尾数的 E4M3 精度更高！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师低精度预训练与持续微调 (CPT) 黄金选型法则</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ Hopper (H100 / H200 / H800) 集群 → 必选 Tier 3 (DeepSeek-V3 分块 FP8)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 启用 DeepGEMM / TransformerEngine 细粒度模式：`1×128` 激活切片 + `128×128` 权重块 +</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  每 `Nc=128` 步 CUDA 核 FP32 累加提升，兼得 `1.48x` 加速、`0.07%` 无损精度与 `-48%` 激活显存！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ Blackwell (B200 / GB200) 集群 → 选 Tier 4 (原生 MXFP8 / 混合 NVFP4)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 第五代 Tensor Core 在硬件内完成 `1×32` (MXFP8) 与 `1×16` (NVFP4) 微缩放，无需软件</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  搬运累加器；配合随机哈达玛变换 (RHT) 与随机舍入，吞吐提升 `2.15x`，省算力费 `$245.5万`！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 绝对禁止用低精度量化的“四大敏感模块（必须保留 BF16/FP32）”</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• ① Embedding 词表层与 Output Head；② MoE 门控路由器 (Gating Router Logits)；</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">• ③ RMSNorm / LayerNorm 与 Attention Softmax；④ AdamW 主权重与一阶/二阶动量状态！</text>
  </g>
</svg>
