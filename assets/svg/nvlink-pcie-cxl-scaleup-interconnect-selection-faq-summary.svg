<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg15" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent15" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg15)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent15)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">AI 服务器机内与超节点 Scale-Up 互连架构选型一图流 (Round 15 · 72-GPU Pod)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">PCIe Gen5 交换树 (128GB/s) vs. 8 卡 NVSwitch HGX (900GB/s) vs. 机柜铜背板 NVL72 MNNVL (1,800GB/s) vs. CXL 3.0 内存池 (2TB DAX)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#3b82f6"/>
  <text x="1044" y="56" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: Scale-Up Physics & Architecture Insights -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#93c5fd" font-size="16" font-weight="800">① 为什么 TP&gt;=4 严禁裸跑 PCIe？为什么 8 卡之外会有“带宽悬崖”？</text>

  <rect x="44" y="168" width="510" height="78" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 PCIe Gen5 交换树: 每 Token 160 次同步吃掉 61.4% 时间 (TPOT 20.20 ms)</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 80 层 Transformer 每生成一个 Token 需执行 160 次 All-Reduce；PCIe 有效带宽仅 48 GB/s</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 若未配专用 PCIe Switch 跨双路 CPU UPI 总线绕行，带宽暴跌至 22 GB/s (仅适合 TP=1/2)</text>

  <rect x="44" y="258" width="510" height="84" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="280" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 2 8 卡 NVSwitch HGX: 单节点 TP=4/8 黄金标准 (900 GB/s · TPOT 9.35 ms)</text>
  <text x="58" y="302" fill="#d1fae5" font-size="12">• 全互连 NVSwitch + NVLS 硬件多播归约 (有效 385 GB/s，快 8.02x)，通信缩至 1.55 ms</text>
  <text x="58" y="324" fill="#d1fae5" font-size="12">• ⚠️ 8 卡边界悬崖：一旦跨出单机 8 卡走 400G RoCEv2 (50 GB/s)，带宽骤降 18.0 倍！</text>

  <rect x="44" y="354" width="510" height="96" rx="8" fill="#3b0764" stroke="#a855f7"/>
  <text x="58" y="376" fill="#e9d5ff" font-size="13.5" font-weight="700">🟪 Tier 3 机柜级铜背板 NVL72 (MNNVL): 打破 8 卡墙 (1,800 GB/s · TPOT 5.40 ms)</text>
  <text x="58" y="398" fill="#f3e8ff" font-size="12">• 5,000+ 根无源铜缆将 72 张 GPU 连成单一 130 TB/s 无阻塞 NVSwitch 巨型超节点</text>
  <text x="58" y="418" fill="#f3e8ff" font-size="12">• 支撑 671B/1T+ MoE EP=72 全机柜微秒级 (0.42 us) Dispatch/Combine，通信仅 0.78 ms</text>
  <text x="58" y="438" fill="#f3e8ff" font-size="12">• 单卡吞吐跃升至 890.0 tok/s (4.49x)，百万 Token 成本降至 $0.98 (-62.3% vs PCIe)!</text>

  <rect x="44" y="462" width="510" height="82" rx="8" fill="#1e293b" stroke="#3b82f6"/>
  <text x="58" y="484" fill="#93c5fd" font-size="13" font-weight="700">🟦 Tier 4 CXL 3.0 内存池化定位辟谣：做 KV/DLRM 扩容，绝不替代 NVLink 跑 TP！</text>
  <text x="58" y="506" fill="#cbd5e1" font-size="12">• CXL 3.0 (128 GB/s, 210 ns) 跑 TP=8 仍需 13.80 ms；但挂载 2TB Device-DAX 内存池</text>
  <text x="58" y="526" fill="#cbd5e1" font-size="12">• 可将 128K KV Cache 恢复压至 18.5 ms (比显存重算快 42.2x)，显存扩容单价省 87%！</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#d8b4fe" font-size="16" font-weight="800">② 四档 Scale-Up 互连架构定量对比 (80 层 × 2 = 160 次同步/Token)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">Scale-Up 互连架构档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">双向 / 有效带宽</text>
  <text x="948" y="190" fill="#cbd5e1" font-size="12" font-weight="700">通信 / TPOT</text>
  <text x="1058" y="190" fill="#cbd5e1" font-size="12" font-weight="700">吞吐 / 百万Token</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: PCIe Gen5 x16 交换树</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">4 卡域 · 跨 UPI 跌至 22 GB/s ($1.85/h)</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">128 GB/s</text>
  <text x="828" y="256" fill="#fca5a5" font-size="11">有效 48 GB/s</text>
  <text x="948" y="236" fill="#f8fafc" font-size="12">通信 12.40 ms</text>
  <text x="948" y="256" fill="#fca5a5" font-size="11">TPOT 20.20 ms ✕</text>
  <text x="1058" y="236" fill="#fca5a5" font-size="12" font-weight="700">198 tok/s/GPU</text>
  <text x="1058" y="256" fill="#cbd5e1" font-size="11">$2.60 / 1M</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="310" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 2: 8 卡 NVSwitch HGX</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">8 卡域 · 0.35us 延迟 ($2.65/h)</text>
  <text x="828" y="312" fill="#34d399" font-size="12" font-weight="700">900 GB/s</text>
  <text x="828" y="332" fill="#6ee7b7" font-size="11">有效 385 GB/s</text>
  <text x="948" y="312" fill="#f8fafc" font-size="12">通信 1.55 ms</text>
  <text x="948" y="332" fill="#6ee7b7" font-size="11">TPOT 9.35 ms ✅</text>
  <text x="1058" y="312" fill="#6ee7b7" font-size="12" font-weight="700">428 tok/s (2.16x)</text>
  <text x="1058" y="332" fill="#6ee7b7" font-size="11">$1.72 (-33.8%)</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
  <text x="622" y="386" fill="#e9d5ff" font-size="12.5" font-weight="700">Tier 3: 72 卡 NVL72 铜背板</text>
  <text x="622" y="408" fill="#d8b4fe" font-size="11">72 卡 MNNVL 域 · 130 TB/s ($3.15/h)</text>
  <text x="828" y="388" fill="#e9d5ff" font-size="12" font-weight="700">1,800 GB/s</text>
  <text x="828" y="408" fill="#d8b4fe" font-size="11">有效 780 GB/s</text>
  <text x="948" y="388" fill="#e9d5ff" font-size="12" font-weight="700">通信 0.78 ms</text>
  <text x="948" y="408" fill="#34d399" font-size="11" font-weight="700">TPOT 5.40 ms ✅</text>
  <text x="1058" y="388" fill="#e9d5ff" font-size="12.5" font-weight="800">890 tok/s (4.49x)</text>
  <text x="1058" y="408" fill="#34d399" font-size="11" font-weight="700">$0.98 (-62.3%)</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="622" y="462" fill="#93c5fd" font-size="12.5" font-weight="700">Tier 4: CXL 3.0 共享内存池</text>
  <text x="622" y="484" fill="#94a3b8" font-size="11">+2,048 GB/节点 DAX 池 ($2.20/h)</text>
  <text x="828" y="464" fill="#93c5fd" font-size="12" font-weight="700">128 GB/s</text>
  <text x="828" y="484" fill="#cbd5e1" font-size="11">128K 恢复 18.5ms</text>
  <text x="948" y="464" fill="#f8fafc" font-size="12">通信 6.00 ms</text>
  <text x="948" y="484" fill="#fde047" font-size="11">TPOT 13.80 ms ⚠️</text>
  <text x="1058" y="464" fill="#93c5fd" font-size="12" font-weight="700">540 tok/s (KV池)</text>
  <text x="1058" y="484" fill="#93c5fd" font-size="11">$1.13 (-56.5%)</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 跨节点 EP=72 拐点：Tier 2 跌入 400G RoCE 悬崖 (31.4ms)，Tier 3 NVL72 稳守 6.20ms (快 5.06x)!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#3b82f6"/>
  <text x="44" y="606" fill="#93c5fd" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for Scale-Up Interconnect Selection）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fca5a5">TP=1/2 选 PCIe Gen5 省 30% CapEx</tspan>；<tspan font-weight="700" fill="#6ee7b7">70B~405B 实时推理 (TP=4/8) 必选 8 卡 NVSwitch HGX (Tier 2)</tspan>，消灭 61.4% PCIe 通信阻塞。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#d8b4fe">万亿 MoE (EP=16~72) 必选机柜铜背板 NVL72 (Tier 3)</tspan> 跨越 8 卡墙；<tspan font-weight="700" fill="#93c5fd">CXL 3.0 (Tier 4)</tspan> 专职做 TB 级 KV/Embedding 容量池化。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/nvlink_pcie_cxl_scaleup_selection/results.json · tests/test_nvlink_pcie_cxl_scaleup_selection.py · 7-Card &amp; Sizer 1:1 绑定</text>
</svg>
