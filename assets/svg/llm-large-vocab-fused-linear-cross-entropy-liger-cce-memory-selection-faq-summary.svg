<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0B1120"/>
  <rect x="30" y="25" width="1140" height="580" rx="16" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="60" y="72" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">ROUND 301 · LARGE-VOCAB (152K–256K) FUSED LINEAR CROSS-ENTROPY (LIGER / CUT-CE)</text>
  <text x="60" y="108" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="25" font-weight="700">39.1 GB Logits OOM Spike at 32K Context vs. Fused Linear CE (0.16–0.48 GB, 244x Smaller, 1.46x Faster)</text>
  <text x="60" y="138" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="15">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="60" y="168" width="525" height="385" rx="12" fill="#1F1218" stroke="#EF4444" stroke-width="2"/>
  <text x="85" y="205" fill="#F87171" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1/2: Materializing [32K, 152K] Logits in HBM</text>
  <text x="85" y="242" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 1 (Standard PyTorch Eager lm_head + FP32 CE):</text>
  <text x="85" y="270" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  [32768, 152064] BF16 logits (10 GB) + FP32 upcast (20 GB)</text>
  <text x="85" y="298" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  + backward grad buffer = 39.1 GB on a single layer -&gt; OOM!</text>
  <text x="85" y="335" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">• Tier 2 (Fused Softmax-CE Only, Separate lm_head):</text>
  <text x="85" y="363" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="15">  Still writes &amp; reads 19.8 GB of full [N, V] logits to HBM!</text>
  <rect x="85" y="425" width="475" height="90" rx="8" fill="#450A0A"/>
  <text x="105" y="460" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Peak Logits + CE Memory: 39.1 GB (68% of Total HBM!)</text>
  <text x="105" y="492" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="16">Step Latency: 1,480.0 ms (40+ GB HBM Bandwidth Bottleneck)</text>

  <rect x="615" y="168" width="525" height="385" rx="12" fill="#0F291E" stroke="#10B981" stroke-width="2"/>
  <text x="640" y="205" fill="#34D399" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3/4: Fused Linear Cross-Entropy (Liger / CCE)</text>
  <text x="640" y="242" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Token-Chunked In-Place Grad (Liger-Kernel, Tier 3):</text>
  <text x="640" y="270" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Slices N=32K into 1,024-token chunks; computes dH/dW on-the-fly</text>
  <text x="640" y="305" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• SRAM-Tiled Online LSE + Indexed Target Dot (CCE, Tier 4):</text>
  <text x="640" y="333" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="15">  Never writes full [N, V] logits to HBM! Only saves 1D LSE [N]</text>
  <text x="640" y="368" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">• Mathematical Bitwise-Exact Gradient Equivalence to FP32 CE</text>
  <rect x="640" y="425" width="475" height="90" rx="8" fill="#064E3B"/>
  <text x="660" y="460" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="18" font-weight="700">Peak CE Memory: 0.16–0.48 GB (Up to 244.4x Reduction!)</text>
  <text x="660" y="492" fill="#D1FAE5" font-family="Segoe UI, sans-serif" font-size="16">Step Latency: 1,012.0 ms (1.46x Higher Training Throughput)</text>
</svg>
