<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h2 { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .mono { font-family: Consolas, monospace; font-size: 11.5px; fill: #6ee7b7; }
    </style>
  </defs>
  <rect width="1200" height="660" class="bg"/>
  <text x="28" y="36" class="title">企业级 AI 安全护栏与敏感数据脱敏选型：Azure Content Safety vs. Bedrock Guardrails vs. 自建 Llama-Guard+Presidio (#416)</text>
  <text x="28" y="58" class="sub">为什么同步串行安全审核会让 TTFT 翻倍 (+420ms)？如何用异步投机并行 + 可逆占位符脱敏实现 +12ms 零感知护栏且成本降 88.2%？</text>

  <!-- Left Panel: Serial Blocking vs Async Speculative Streaming Guardrails -->
  <rect x="24" y="76" width="560" height="270" class="panel"/>
  <text x="42" y="104" class="h2">1. 致命延迟根源：串行阻塞审核 (+420ms) vs. 异步投机并行流式护栏 (+12ms)</text>

  <rect x="42" y="120" width="524" height="96" rx="8" fill="#1e293b" stroke="#ef4444"/>
  <text x="56" y="142" class="txt" font-weight="700" fill="#fca5a5">❌ 反模式：同步串行输入审核 + 等全文生成完再审核输出 (Serial Blocking)</text>
  <text x="56" y="164" class="mono">• 请求先等云端安全 API (180ms) -&gt; 主模型生成全文 (3,200ms) -&gt; 输出再审 (240ms)</text>
  <text x="56" y="184" class="txt">• 结果：用户首字等待 TTFT 从 380ms 恶化至 3,800ms，流式打字体验彻底丧失！</text>
  <text x="56" y="202" class="mono">• 若用 70B 大模型自己审自己 (Self-Critique)，Token 账单直接翻 2.1 倍！</text>

  <rect x="42" y="228" width="524" height="104" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="56" y="250" class="txt" font-weight="700" fill="#34d399">🏆 生产最优解：网关内联可逆 PII 脱敏 + 异步投机并行 + 64-Token 滑窗流式校验</text>
  <text x="56" y="272" class="mono">• Step 1 (12ms)：网关 CPU 跑 Presidio 正则/NER，把身份证/卡号替换为 [PERSON_1]/[CARD_1]</text>
  <text x="56" y="292" class="mono">• Step 2 (0ms 阻塞)：同时并发启动“主模型 Prefill”与“护栏模型 (Prompt Shield / Llama-Guard)”</text>
  <text x="56" y="312" class="txt">• 护栏仅需 38ms 完成判决（远早于主模型 350ms 首字吐出），违规即刻熔断，合规零延迟！</text>

  <!-- Right Panel: 4 Guardrail Platform Matrix -->
  <rect x="608" y="76" width="568" height="270" class="panel"/>
  <text x="626" y="104" class="h2">2. 四大企业 AI 安全护栏与防注入方案横向对比 (5,000 万次调用/月)</text>

  <rect x="626" y="120" width="532" height="48" rx="6" fill="#1e293b" stroke="#ef4444"/>
  <text x="638" y="140" class="txt" font-weight="700" fill="#fca5a5">Tier 1: 同步串行 70B 大模型自审 (Serial LLM-as-Guardrail)</text>
  <text x="638" y="158" class="mono">• 附加 TTFT +460ms ✕ | 间接注入拦截率 84.0% | 月度护栏成本 $82,000/月 ✕</text>

  <rect x="626" y="176" width="532" height="48" rx="6" fill="#1e293b" stroke="#3b82f6"/>
  <text x="638" y="196" class="txt" font-weight="700" fill="#93c5fd">Tier 2: 云原生托管护栏 (Azure AI Content Safety Prompt Shields / Bedrock Guardrails)</text>
  <text x="638" y="214" class="mono">• 内置 Spotlighting 防间接注入 + Groundedness 幻觉核验 | 拦截 97.8% | $38,500/月</text>

  <rect x="626" y="232" width="532" height="48" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="638" y="252" class="txt" font-weight="700" fill="#fde68a">Tier 3: 纯自建开源护栏 (AKS 跑 Llama-Guard-3-8B + DeBERTa Prompt-Guard)</text>
  <text x="638" y="270" class="mono">• 敏感数据 100% 不出内网 | 串行调用附加 +48ms | 拦截 95.4% | $9,800/月 (4x L40S/H200)</text>

  <rect x="626" y="288" width="532" height="48" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="638" y="308" class="txt" font-weight="700" fill="#34d399">Tier 4: 混合纵深防御 (网关 Presidio 可逆脱敏 + 异步并行 Llama-Guard + 高危调 Azure Shield)</text>
  <text x="638" y="326" class="mono">• 附加首字延迟仅 +12ms 🏆 | 拦截率 99.4% 🏆 | 零明文 PII 出网 | 月成本仅 $9,650 (-88.2%)!</text>

  <!-- Bottom Panel: End-to-End 4-Layer Guardrail Pipeline -->
  <rect x="24" y="366" width="1152" height="270" class="panel"/>
  <text x="42" y="394" class="h2">3. 端到端四道防线参考架构：可逆 PII 令牌化 -&gt; 异步投机防注入 -&gt; 流式滑窗审核 -&gt; 工具 OPA 门禁</text>

  <rect x="42" y="414" width="256" height="196" rx="8" fill="#1e293b" stroke="#38bdf8"/>
  <text x="56" y="440" class="txt" font-weight="700" fill="#38bdf8">防线一：Presidio 可逆脱敏 (12ms)</text>
  <text x="56" y="464" class="mono">• 识别姓名/身份证/手机/银行卡</text>
  <text x="56" y="484" class="mono">• 替换为语义占位符 [CUST_01]</text>
  <text x="56" y="504" class="mono">• 映射关系存入本地 Redis (TTL=5m)</text>
  <text x="56" y="524" class="mono">• 响应流返回客户端时实时还原</text>
  <text x="56" y="550" class="txt" fill="#6ee7b7">公有云大模型永远看不到真实 PII！</text>

  <rect x="318" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#10b981"/>
  <text x="332" y="440" class="txt" font-weight="700" fill="#34d399">防线二：异步投机输入护栏 (0ms阻塞)</text>
  <text x="332" y="464" class="mono">• 用户 Prompt 与 RAG 外部文档用</text>
  <text x="332" y="484" class="mono">  Spotlighting 分隔符打标隔离</text>
  <text x="332" y="504" class="mono">• 主模型 Prefill 与 Prompt-Guard</text>
  <text x="332" y="524" class="mono">  并行启动；38ms 内完成注入判定</text>
  <text x="332" y="550" class="txt" fill="#34d399">在首字吐出前无感拦截越狱攻击</text>

  <rect x="606" y="414" width="268" height="196" rx="8" fill="#1e293b" stroke="#f59e0b"/>
  <text x="620" y="440" class="txt" font-weight="700" fill="#fde68a">防线三：64-Tok 滑窗流式输出核验</text>
  <text x="620" y="464" class="mono">• 无需等全文生成完！边向用户</text>
  <text x="620" y="484" class="mono">  推 SSE 流，边每 64 Tokens 异步</text>
  <text x="620" y="504" class="mono">  跑一次 Groundedness / 合规检测</text>
  <text x="620" y="524" class="mono">• 发现幻觉或违规词立即发撤回帧</text>
  <text x="620" y="550" class="txt" fill="#fde68a">保留 100% 丝滑打字机流式体验</text>

  <rect x="894" y="414" width="264" height="196" rx="8" fill="#1e293b" stroke="#a855f7"/>
  <text x="908" y="440" class="txt" font-weight="700" fill="#d8b4fe">防线四：Agent 工具调用 OPA 门禁</text>
  <text x="908" y="464" class="mono">• 永不盲信 LLM 生成的 Tool 参数</text>
  <text x="908" y="484" class="mono">• Open Policy Agent (OPA) 校验</text>
  <text x="908" y="504" class="mono">  JWT 用户角色与转账/删库阈值</text>
  <text x="908" y="524" class="mono">• 超权操作强制触发人类审批卡片</text>
  <text x="908" y="550" class="txt" fill="#d8b4fe">根除间接注入 (XPIA) 工具劫持</text>
</svg>
