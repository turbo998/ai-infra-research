<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg624" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="hdr624" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg624)"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="24" width="1144" height="78" rx="18" fill="url(#hdr624)"/>
  <text x="54" y="58" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800">#624 企业大模型推理并行切分 (TP / PP / Attention DP / Expert EP) 与四大加速方案选型</text>
  <text x="54" y="84" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Parallelism Communication Math, MTP/EAGLE-3, Prefix Cache, Block FP8/NVFP4 &amp; Dense (70B/405B) vs. MoE (671B/235B) Blueprint</text>

  <!-- 4 Parallelism Cards -->
  <rect x="48" y="120" width="268" height="190" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8"/>
  <text x="64" y="146" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">① TP (张量并行 · 降 TPOT)</text>
  <text x="64" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 权重与 KV 按列/行均分 1/TP</text>
  <text x="64" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 聚合多卡 HBM 带宽直接压低 TPOT</text>
  <text x="64" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 通信代价：每层 2 次同步 AllReduce</text>
  <text x="64" y="232" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">⛔ 红线：严禁跨机跑 TP&gt;8 (NVLink内)!</text>
  <text x="64" y="254" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">✅ 70B FP8 黄金值: TP=4 (H200)</text>

  <rect x="332" y="120" width="268" height="190" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.8"/>
  <text x="348" y="146" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="800">② PP (流水线并行 · 装巨模)</text>
  <text x="348" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 按层切分，仅跨机传极小隐藏态 P2P</text>
  <text x="348" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 跨节点仅 PP-1 次微秒级 Send/Recv</text>
  <text x="348" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 缺点：不缩短单请求 TPOT，需微批填泡</text>
  <text x="348" y="232" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">⚖️ 适用：单机装不下的 405B 稠密模型</text>
  <text x="348" y="254" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">✅ 405B 跨两机: TP=8 (机内) × PP=2</text>

  <rect x="616" y="120" width="268" height="190" rx="12" fill="#1e293b" stroke="#34d399" stroke-width="1.8"/>
  <text x="632" y="146" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">③ Attention DP (数据并行)</text>
  <text x="632" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 不同请求独立计算 MLA/GQA 注意力</text>
  <text x="632" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 消除跨卡 KV Cache 重复复制 (省 8x)</text>
  <text x="632" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 注意力层 0 跨卡通信，线性放大 QPS</text>
  <text x="632" y="232" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">🏆 671B MLA 标配：Attention DP=16</text>
  <text x="632" y="254" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">✅ KV 可用容量暴增 7.2 倍！</text>

  <rect x="900" y="120" width="252" height="190" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="1.8"/>
  <text x="916" y="146" fill="#c084fc" font-family="system-ui, sans-serif" font-size="15" font-weight="800">④ EP (专家并行 · MoE核心)</text>
  <text x="916" y="170" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 256 个路由专家分散在 EP 张 GPU 上</text>
  <text x="916" y="190" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 增大单专家承接 Token 数提算术强度</text>
  <text x="916" y="210" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• 通信：每层 2 次 All-to-All (Dispatch)</text>
  <text x="916" y="232" fill="#e9d5ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">🚀 DeepEP IBGDA + 双微批乒乓重叠</text>
  <text x="916" y="254" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">✅ 暴露通信压至 &lt;2.1% · EPLB 均衡</text>

  <!-- Middle: 4 Acceleration Pillars + Dense vs MoE Golden Recipes -->
  <rect x="48" y="326" width="1104" height="136" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.8"/>
  <text x="68" y="352" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="800">⚡ 四大无损/近似推理加速方案正交叠加效应 (Orthogonal Acceleration Stack)：</text>
  <text x="68" y="378" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">1. 投机解码 (MTP / EAGLE-3)：利用 Decode 空闲算力一次验 3~4 词 (接受率 α=0.82 ➔ 2.85 tok/step)，在 Batch ≤ 32 时无损降低 TPOT 2.38x (B&gt;32 自动旁路)</text>
  <text x="68" y="402" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">2. 前缀缓存 (Radix Prefix Caching)：复用多轮 Agent/RAG 共享前缀 KV，砍掉 72% 重复 Prefill FLOPs，首字 TTFT 从 1,180ms 压至 290ms (快 4.07x)</text>
  <text x="68" y="426" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13">3. 细粒度量化 (Block-Scaled FP8 1x128 / Blackwell NVFP4)：权重与 KV 体积双双减半，Tensor Core 吞吐翻倍，精度无损保持 99.8%+</text>
  <text x="68" y="448" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">4. 黄金切分公式：70B Dense 选 [TP=4 + FP8 + EAGLE-3] | 405B Dense 选 [TP=8×PP=2] | 671B MoE 选 [Attn DP=16 × EP=16 + DeepEP + MTP]</text>

  <!-- Bottom KPI Summary -->
  <rect x="48" y="476" width="1104" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="68" y="506" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">📊 实测架构收益对比 (DeepSeek-V3/R1 671B 双机 16x H200 · 400G RoCEv2)：</text>
  <text x="68" y="534" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="700">• 错误跨机纯 TP=16: 每词 122 次跨网 AllReduce 耗 18.3ms ➔ TPOT 34.6ms (仅 520 tok/s/GPU)</text>
  <text x="68" y="562" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">• 黄金架构 [Attn DP=16 × EP=16 + DeepEP IBGDA + MTP + FP8]: TPOT 11.4ms (快 3.04x) · 单卡有效吞吐 2,480 tok/s (提升 4.77x · $0.088/1M)</text>
</svg>
