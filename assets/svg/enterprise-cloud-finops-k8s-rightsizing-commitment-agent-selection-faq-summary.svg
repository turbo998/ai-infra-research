  <rect width="1200" height="680" fill="url(#bgGrad422)" rx="16"/>
  <rect x="24" y="22" width="1152" height="86" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="46" y="56" fill="#f8fafc" font-size="22" font-weight="800">企业级多云成本治理（Cloud FinOps FOCUS 1.0）、K8s 安全缩容与 RI/SP 承诺规划 Agent 选型指南</text>
  <text x="46" y="86" fill="#94a3b8" font-size="14">月均 $250万多云账单 / 120套K8s集群 / 6.5万Pod · 传统Excel月度复盘 vs. 按均值缩容+买死3年RI vs. 账单RAG+原生VPA vs. FOCUS语义层+JVM感知P99.9缩容+LP承诺阶梯</text>
  <rect x="975" y="40" width="175" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1062" y="63" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">38.6% Save · 0% OOM</text>

  <!-- Tier 1 -->
  <rect x="24" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="146" width="244" height="32" rx="6" fill="#7f1d1d"/>
  <text x="162" y="167" fill="#fecaca" font-size="13" font-weight="700" text-anchor="middle">Tier 1: 月度 Excel 对账 + 手工买 RI</text>
  <text x="40" y="206" fill="#f8fafc" font-size="14" font-weight="700">账单暴涨7天后才发现，K8s虚占不敢动</text>
  <text x="40" y="232" fill="#cbd5e1" font-size="12.5">• AWS/Azure/GCP 三套账单口径不一，对账极慢</text>
  <text x="40" y="254" fill="#cbd5e1" font-size="12.5">• 研发按峰值3倍填 Pod Limits，40% 算力空转</text>
  <rect x="40" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="54" y="310" fill="#fca5a5" font-size="13" font-weight="700">云账单净节省率: 11.5% ✕</text>
  <text x="54" y="334" fill="#6ee7b7" font-size="13" font-weight="700">缩容OOMKilled/RI搁浅率: 1.2%</text>
  <text x="54" y="358" fill="#fca5a5" font-size="12.5">成本异常发现到止血耗时: 168.0 小时 (7天 ✕)</text>
  <text x="54" y="382" fill="#fca5a5" font-size="13" font-weight="700">月剩余算力浪费与运营成本: $640,000 / 月 ✕</text>
  <text x="40" y="435" fill="#94a3b8" font-size="12">适用：传统财务事后分摊，无法治理云原生浪费</text>

  <!-- Tier 2 -->
  <rect x="316" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="332" y="146" width="244" height="32" rx="6" fill="#78350f"/>
  <text x="454" y="167" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Tier 2: 按均值 LLM 直接缩容 + 买 3年 RI</text>
  <text x="332" y="206" fill="#f8fafc" font-size="14" font-weight="700">引发 JVM 容器 OOMKilled 雪崩，RI 搁浅</text>
  <text x="332" y="232" fill="#cbd5e1" font-size="12.5">• 看平均内存 2.1GB 就把 -Xmx6G 的 Java 容器砍到3G</text>
  <text x="332" y="254" fill="#cbd5e1" font-size="12.5">• 买死旧机型3年RI后架构迁 Graviton 导致 14.8% 事故/搁浅</text>
  <rect x="332" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="346" y="310" fill="#fde68a" font-size="13" font-weight="700">云账单净节省率: 19.0%</text>
  <text x="346" y="334" fill="#fca5a5" font-size="13" font-weight="700">缩容OOMKilled/RI搁浅率: 14.8% (停服 ✕)</text>
  <text x="346" y="358" fill="#94a3b8" font-size="12.5">成本异常发现到止血耗时: 2.5 小时</text>
  <text x="346" y="382" fill="#fca5a5" font-size="13" font-weight="700">月剩余浪费与停机事故成本: $580,000 / 月 ✕</text>
  <text x="332" y="435" fill="#94a3b8" font-size="12">适用：严禁按平均利用率直接砍生产容器内存上限</text>

  <!-- Tier 3 -->
  <rect x="608" y="128" width="276" height="410" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="624" y="146" width="244" height="32" rx="6" fill="#0c4a6e"/>
  <text x="746" y="167" fill="#bae6fd" font-size="13" font-weight="700" text-anchor="middle">Tier 3: 账单问答 RAG + 原生 K8s VPA</text>
  <text x="624" y="206" fill="#f8fafc" font-size="14" font-weight="700">VPA 重启驱逐影响在线服务，缺跨云规划</text>
  <text x="624" y="232" fill="#cbd5e1" font-size="12.5">• 原生 VPA 不懂 JVM 堆内空闲内存，仍有 4.2% 误伤</text>
  <text x="624" y="254" fill="#cbd5e1" font-size="12.5">• 缺乏线性规划求解器统筹跨区域 Savings Plans</text>
  <rect x="624" y="284" width="244" height="118" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="638" y="310" fill="#7dd3fc" font-size="13" font-weight="700">云账单净节省率: 23.4%</text>
  <text x="638" y="334" fill="#fde68a" font-size="13" font-weight="700">缩容OOMKilled/RI搁浅率: 4.2% ✕</text>
  <text x="638" y="358" fill="#94a3b8" font-size="12.5">成本异常发现到止血耗时: 24.0 小时</text>
  <text x="638" y="382" fill="#38bdf8" font-size="13" font-weight="700">月剩余浪费与运营总成本: $310,000 / 月</text>
  <text x="624" y="435" fill="#94a3b8" font-size="12">适用：单云非关键集群参考，缺乏生产级安全兜底</text>

  <!-- Tier 4 -->
  <rect x="900" y="128" width="276" height="410" rx="12" fill="#0f172a" stroke="url(#accentGrad422)" stroke-width="2.5"/>
  <rect x="916" y="146" width="244" height="32" rx="6" fill="#065f46"/>
  <text x="1038" y="167" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Tier 4: FOCUS+JVM感知缩容+LP阶梯 🏆</text>
  <text x="916" y="206" fill="#34d399" font-size="14" font-weight="700">JVM堆感知P99.9缩容 + LP承诺组合对冲</text>
  <text x="916" y="232" fill="#e2e8f0" font-size="12.5">• 采集 JMX/Go 堆内活跃水位，K8s 1.32 原地无重启缩容</text>
  <text x="916" y="254" fill="#e2e8f0" font-size="12.5">• LP 线性规划滚动购买 Compute SP，净省 38.6% ($96.5万/月)</text>
  <rect x="916" y="284" width="244" height="118" rx="8" fill="#090d16" stroke="#10b981"/>
  <text x="930" y="310" fill="#6ee7b7" font-size="13" font-weight="700">云账单净节省率: 38.6% 🏆 (月省$96.5万)</text>
  <text x="930" y="334" fill="#6ee7b7" font-size="13" font-weight="700">缩容OOMKilled/搁浅率: 0.0% 🏆 (JVM安全水位)</text>
  <text x="930" y="358" fill="#a7f3d0" font-size="12.5">异常账单止血耗时: 0.5 小时 (30分钟 🏆)</text>
  <text x="930" y="382" fill="#34d399" font-size="13" font-weight="700">月剩余浪费与运营总成本: $95,000 (-85.2% 🏆)</text>
  <text x="916" y="435" fill="#a7f3d0" font-size="12" font-weight="600">适用：跨云规模化企业 FinOps 委员会、云平台团队</text>

  <!-- Bottom Golden Rule -->
  <rect x="24" y="556" width="1152" height="98" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="588" fill="#38bdf8" font-size="15" font-weight="800">💡 企业级多云 FinOps 架构师铁律（FOCUS 1.0 + Runtime-Aware P99.9 Rightsizing + LP Commitment Ladder）：</text>
  <text x="46" y="614" fill="#e2e8f0" font-size="13.5">1. K8s 容器内存缩容严禁只看 OS `container_memory_working_set_bytes` 均值：必须关联 JVM `-Xmx` / Go GC 堆指标，按 30天 P99.9 × 1.25 安全水位调整。</text>
  <text x="46" y="638" fill="#94a3b8" font-size="13">2. 预留实例与 Savings Plans 组合必须由线性规划（LP）求解器按滚动阶梯（Ladder）配置跨机型 Compute SP，并通过 Terraform PR 落盘 · Provenance: synthetic + anonymized_reported</text>
</svg>
