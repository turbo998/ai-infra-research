<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="520" rx="14"/>
  <text x="30" y="38" class="title">第 505 篇里程碑：企业大模型评测体系、LLM-as-a-Judge 偏置校准与 2.8m CI/CD 门禁</text>
  <text x="30" y="60" class="sub">解决原始裁判模型“偏爱长废话 (+22%) 与位置 A (+18.5%)”及 5万条全量跑批“卡死发版 6.5 小时 ($1,250/次)”的痛点</text>

  <!-- Left: Judge Bias Calibration & 3-Stage Funnel -->
  <rect x="30" y="80" width="510" height="205" class="card"/>
  <text x="48" y="108" class="h">1. 为什么直接让大模型打 1–10 分不靠谱？三项偏置校准与漏斗门禁</text>
  <text x="48" y="134" class="txt">• 废除模糊 1–10 打分，改用“5项原子级二元布尔量表 (Binary Boolean Rubrics)”:</text>
  <text x="64" y="154" class="txt">[事实无幻觉: 0/1] + [Schema合法: 0/1] + [无越权: 0/1] + [长度合规: 0/1]</text>
  <text x="48" y="178" class="txt">• 消除位置与废话偏置: 正反序 (A vs B / B vs A) 双次 Logprob 均值 + 长度惩罚系数，</text>
  <text x="64" y="198" class="txt">将裁判与人类专家一致性 (Cohen's Kappa) 从 0.51 推高至 0.89 🏆</text>
  <text x="48" y="222" class="txt good">• 三级发布门禁: PR 跑 200 条分层硬骨头集 (2.8分钟, $3.40) -&gt; 夜间 5,000 条全集</text>
  <text x="64" y="244" class="txt good">-&gt; 生产网关异步镜像 1% 真实流量做影子回放 (Shadow Canary)，拦截 98.4% 退化 🏆</text>

  <!-- Right: 4-Tier Comparison -->
  <rect x="560" y="80" width="510" height="205" class="card"/>
  <text x="578" y="108" class="h">2. 四种企业大模型发布评测门禁实测对比</text>
  <text x="578" y="134" class="txt bad">• Tier 1 人工手测 20 条 (“凭感觉 Vibe Check”): 漏放 72% 线上故障 ✕</text>
  <text x="578" y="158" class="txt warn">• Tier 2 每次发版跑 5万条未校准云裁判: 耗时 390分钟，单次烧 $1,250 ✕</text>
  <text x="578" y="182" class="txt">• Tier 3 只跑开源榜单 (MMLU/GSM8K): 对企业私有业务退化检出率仅 35.0% ✕</text>
  <text x="578" y="208" class="txt good">• Tier 4 200条分层门禁 + 二元校准 14B 裁判 + 1% 影子灰度 🏆:</text>
  <text x="594" y="232" class="txt good">- 业务退化拦截率: 98.4% 🏆 | 专家打分一致性: Kappa = 0.89 (+0.38 🏆)</text>
  <text x="594" y="256" class="txt good">- PR 门禁耗时: 2.8 分钟 (快 139.3x) | 单次发版成本: $3.40 (-99.7% 🏆)</text>

  <!-- Bottom: Bar Chart -->
  <rect x="30" y="305" width="1040" height="190" class="card"/>
  <text x="48" y="333" class="h">3. 四种评测门禁的业务退化拦截率 (%) 与专家一致性 (Cohen's Kappa) 对比</text>

  <text x="48" y="365" class="txt">Tier 1 人工抽测 20 条 (Vibe Check)</text>
  <rect x="290" y="352" width="145" height="16" fill="#ef4444" rx="4"/>
  <text x="445" y="365" class="txt bad">退化拦截率仅 28.0% ✕ | Kappa = 0.45 | 耗时 240 分钟 ($800/次)</text>

  <text x="48" y="395" class="txt">Tier 2 5万条全量未校准云裁判</text>
  <rect x="290" y="382" width="435" height="16" fill="#f59e0b" rx="4"/>
  <text x="735" y="395" class="txt warn">拦截率 84.0% | Kappa 仅 0.51 (长废话偏置 ✕) | 390分钟 ($1,250/次 ✕)</text>

  <text x="48" y="425" class="txt">Tier 3 只跑开源 MMLU/GSM8K</text>
  <rect x="290" y="412" width="182" height="16" fill="#3b82f6" rx="4"/>
  <text x="482" y="425" class="txt">企业业务退化拦截率仅 35.0% (与私有 Prompt 脱节 ✕) | 45 分钟</text>

  <text x="48" y="455" class="txt good">Tier 4 分层门禁+二元校准+影子 🏆</text>
  <rect x="290" y="442" width="510" height="16" fill="#10b981" rx="4"/>
  <text x="810" y="455" class="txt good">拦截率 98.4% 🏆 | Kappa = 0.89 🏆 | 2.8 分钟 | $3.40/次 🏆</text>
</svg>
