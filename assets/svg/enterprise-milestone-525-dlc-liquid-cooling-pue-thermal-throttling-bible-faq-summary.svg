<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 19.5px; font-weight: 700; fill: #f8fafc; }
      .sub { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #94a3b8; }
      .h { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .txt { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #e2e8f0; }
      .good { fill: #10b981; font-weight: 700; }
      .bad { fill: #ef4444; font-weight: 700; }
      .warn { fill: #f59e0b; font-weight: 700; }
    </style>
  </defs>
  <rect class="bg" width="1100" height="540" rx="14"/>
  <text x="30" y="38" class="title">#525 里程碑：企业高密智算中心冷板液冷 (`DLC &gt;45kW–130kW`)、PUE 电费与热降频治理圣经</text>
  <text x="30" y="60" class="sub">为什么风冷不仅多花 45.4% 电费，还会触发 GPU 83°C 热降频损失 18.5% 算力并拉长光模块距离？一图手算液冷 ROI</text>

  <rect x="30" y="80" width="510" height="215" class="card"/>
  <text x="48" y="108" class="h">1. 为什么风冷强装 H200 / Blackwell 是“三重亏损”？</text>
  <text x="48" y="132" class="txt bad">• 亏损 ① (83°C 热降频木桶效应): 单台 8×H200 满载功耗 10.2kW，风冷局部</text>
  <text x="64" y="150" class="txt bad">热点触发单卡热降频 (SW Thermal Slowdown)，拖累全集群同步训练掉速 18.5% ✕</text>
  <text x="48" y="174" class="txt bad">• 亏损 ② (机柜被迫稀疏摆开 → 光缆暴涨): 风冷单柜限 20–35kW (仅放 1–2 台)，</text>
  <text x="64" y="192" class="txt bad">256 卡被迫拆成 32 个机柜，无法用低成本铜缆 DAC，昂贵长距光模块贵 +42% ✕</text>
  <text x="48" y="216" class="txt good">• 冷板式直接液冷 (DLC Cold Plate · 单柜 120kW · PUE = 1.12 🏆):</text>
  <text x="64" y="236" class="txt">① 带走 80%–85% 芯片显热，GPU 结温常年锁在 ≤58°C (0.0% 热降频！)</text>
  <text x="64" y="256" class="txt good">② 256 卡浓缩进 8 个高密机柜 (省 75% 机房面积)，3 年电费+制冷省 45.4% 🏆</text>

  <rect x="560" y="80" width="510" height="215" class="card"/>
  <text x="578" y="108" class="h">2. 256 卡 H200/B200 智算中心三套制冷与机柜架构对比</text>
  <text x="578" y="134" class="txt bad">• 方案 1 (传统精密空调风冷 · 单柜 ≤42kW): PUE = 1.54 ✕</text>
  <text x="594" y="152" class="txt bad">热降频损失 18.5% 算力，需 32 个机柜，3 年电费+制冷高达 $218.0 万 ✕</text>
  <text x="578" y="178" class="txt warn">• 方案 2 (背门热交换器过渡改造 RDHx · 52kW/柜): PUE = 1.32 ✓，</text>
  <text x="594" y="198" class="txt warn">热降频 4.2%，需 16 个机柜，3 年电费+制冷 $154.0 万</text>
  <text x="578" y="224" class="txt good">• 方案 3 (冷板直接液冷 DLC + N+1 冗余 CDU · 120kW/柜 🏆):</text>
  <text x="594" y="246" class="txt good">- PUE 降至 1.12 · 热降频 0.0% (白捡回 18.5% 被风冷吞噬的 GPU 算力！🏆)</text>
  <text x="594" y="268" class="txt good">- 仅需 8 个机柜 (-75% 空间) · 3 年电费+制冷降至 $119.0 万 (-45.4% 🏆)</text>

  <rect x="30" y="312" width="1040" height="205" class="card"/>
  <text x="48" y="340" class="h">3. 256 卡智算集群在三种制冷方案下的 3 年电费+制冷 TCO 与热降频算力损失对比</text>

  <text x="48" y="378" class="txt">方案 1: 传统风冷 (PUE 1.54 · 32柜)</text>
  <rect x="305" y="364" width="480" height="16" fill="#ef4444" rx="4"/>
  <text x="795" y="378" class="txt bad">$218.0万 (3年电费+制冷) | 热降频丢 18.5% 算力 · 光模块贵 42% ✕</text>

  <text x="48" y="418" class="txt">方案 2: 背门液冷 RDHx (PUE 1.32)</text>
  <rect x="305" y="404" width="339" height="16" fill="#f59e0b" rx="4"/>
  <text x="654" y="418" class="txt warn">$154.0万 | 热降频 4.2% · 需 16 个机柜 (过渡方案)</text>

  <text x="48" y="458" class="txt good">方案 3: 冷板液冷 DLC 120kW (PUE 1.12 🏆)</text>
  <rect x="305" y="444" width="262" height="16" fill="#10b981" rx="4"/>
  <text x="577" y="458" class="txt good">$119.0万 (立省 45.4% / $99万 🏆) | 0.0% 热降频 · 仅 8 个机柜 (-75% 空间 🏆)</text>
</svg>
