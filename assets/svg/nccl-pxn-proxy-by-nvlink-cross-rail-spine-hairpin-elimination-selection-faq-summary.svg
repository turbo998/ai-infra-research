  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Must climb Leaf S0 -&gt; Spine -&gt; Leaf S3 (87.5% Spine Traffic!)</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Spine ECMP hash collisions drop busbw to 19.4 GB/s/GPU ✕</text>
