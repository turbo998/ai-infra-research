  <text x="660" y="444" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Single-Hop / Multi-Hop QA Accuracy: 96.8% / 96.2%</text>
  <text x="660" y="472" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• 1M-Doc Upfront Index Build Cost: $3,800 (vs $148,000, -97.4%)</text>
  <text x="660" y="500" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="15">• Blended P95 Query Latency: 820.0ms (vs 4,850ms full GraphRAG)</text>
  <text x="660" y="528" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">• Monthly Indexing &amp; Serving TCO: $29,500 / mo (-86.3%)</text>
