  <text x="85" y="488" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Vector-Only Multi-Hop Accuracy: 34.0% – 58.5%</text>
  <text x="85" y="516" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Full GraphRAG Monthly Rebuild + Serve TCO: $215,000</text>

