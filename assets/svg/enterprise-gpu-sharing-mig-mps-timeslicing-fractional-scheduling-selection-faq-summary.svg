<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad389" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad389" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad389)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <text x="44" y="54" fill="#f8fafc" font-size="21" font-weight="800">企业级 K8s GPU 切分与小模型混部选型指南：整卡独占 vs. 时间片轮转 (Time-Slicing) vs. MIG vs. MIG+MPS</text>
  <text x="44" y="84" fill="#94a3b8" font-size="13.5">架构发现：28 个小模型微服务采用“MIG 硬件故障域隔离 + 域内 CUDA MPS 并行”，将所需 80G 显卡从 28 张压至 3 张 (省 89.3%) 且零邻居连坐</text>
  <rect x="975" y="34" width="180" height="36" rx="18" fill="#064e3b" stroke="#10b981"/>
  <text x="1065" y="57" fill="#a7f3d0" font-size="13" font-weight="700" text-anchor="middle">Round 389 · 架构师 FAQ</text>

  <!-- 4 Architecture Cards -->
  <rect x="24" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#ef4444" stroke-width="1.5"/>
  <text x="40" y="150" fill="#fca5a5" font-size="14.5" font-weight="800">🟥 Tier 1: 整卡独占 (1 Pod=1 GPU)</text>
  <text x="40" y="172" fill="#cbd5e1" font-size="12">• 2GB 的向量/重排模型独占 80GB 整卡</text>
  <text x="40" y="192" fill="#cbd5e1" font-size="12">• 28 个微服务需采购 28 张 H100/A100</text>
  <text x="40" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 集群平均算力利用率：仅 11.0% ✕</text>
  <text x="40" y="232" fill="#34d399" font-size="12" font-weight="700">• 邻居 OOM 连坐率：0.0% (P99 25ms)</text>
  <text x="40" y="252" fill="#fca5a5" font-size="12">• 89% 的显存与算力长期空转吃灰 ✕</text>
  <rect x="40" y="274" width="244" height="34" rx="8" fill="#450a0a"/>
  <text x="162" y="296" fill="#fecaca" font-size="12.5" font-weight="700" text-anchor="middle">28服务月成本：$78,400 (28张卡) ✕</text>
  <text x="40" y="334" fill="#94a3b8" font-size="11.5">反模式：K8s 默认只支持整数 `gpu: 1`</text>
  <text x="40" y="354" fill="#94a3b8" font-size="11.5">导致 Embedding/Reranker 把预算吃光</text>

  <rect x="316" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="332" y="150" fill="#fde68a" font-size="14.5" font-weight="800">🟨 Tier 2: K8s 软件时间片轮转</text>
  <text x="332" y="172" fill="#cbd5e1" font-size="12">• 7 个容器轮流抢占同一块 GPU 上下文</text>
  <text x="332" y="192" fill="#fca5a5" font-size="12" font-weight="700">• 零显存隔离！1个容器OOM全卡7个陪葬</text>
  <text x="332" y="212" fill="#fca5a5" font-size="12" font-weight="700">• 邻居 OOM 连坐事故率：14.5% ✕</text>
  <text x="332" y="232" fill="#fca5a5" font-size="12" font-weight="700">• P99 延迟：暴涨至 98.0 ms (上下文切换)</text>
  <text x="332" y="252" fill="#cbd5e1" font-size="12">• 所需显卡：4 张 (利用率 54.0%)</text>
  <rect x="332" y="274" width="244" height="34" rx="8" fill="#451a03"/>
  <text x="454" y="296" fill="#fde68a" font-size="12.5" font-weight="700" text-anchor="middle">28服务月成本：$11,200 (仅限测试)✕</text>
  <text x="332" y="334" fill="#94a3b8" font-size="11.5">大坑：Time-Slicing 只是分时复用开关</text>
  <text x="332" y="354" fill="#94a3b8" font-size="11.5">严禁用于生产多租户或高 SLA 在线链路</text>

  <rect x="608" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="624" y="150" fill="#7dd3fc" font-size="14.5" font-weight="800">🟦 Tier 3: 硬件物理切分 (NVIDIA MIG)</text>
  <text x="624" y="172" fill="#cbd5e1" font-size="12">• 硅片级切分为 7 个 `1g.10gb` 独立实例</text>
  <text x="624" y="192" fill="#cbd5e1" font-size="12">• 独立显存控制器、独立 SM、独立 L2 缓存</text>
  <text x="624" y="212" fill="#34d399" font-size="12" font-weight="700">• 邻居 OOM 连坐事故率：0.0% ✅</text>
  <text x="624" y="232" fill="#34d399" font-size="12" font-weight="700">• P99 延迟：稳定 26.5 ms ✅</text>
  <text x="624" y="252" fill="#cbd5e1" font-size="12">• 所需显卡：4 张 (利用率 62.0%)</text>
  <rect x="624" y="274" width="244" height="34" rx="8" fill="#0c4a6e"/>
  <text x="746" y="296" fill="#bae6fd" font-size="12.5" font-weight="700" text-anchor="middle">28服务月成本：$11,200 (省 85.7%)✅</text>
  <text x="624" y="334" fill="#94a3b8" font-size="11.5">定位：跨部门多租户硬隔离标准基线</text>
  <text x="624" y="354" fill="#94a3b8" font-size="11.5">局限：最小粒度 10GB，对 1GB 模型仍偏大</text>

  <rect x="900" y="122" width="276" height="310" rx="12" fill="#172033" stroke="#10b981" stroke-width="2.5"/>
  <text x="916" y="150" fill="#6ee7b7" font-size="14.5" font-weight="800">🟩 Tier 4: MIG故障域+域内MPS混部🏆</text>
  <text x="916" y="172" fill="#cbd5e1" font-size="12">• 跨团队用 MIG (2g.20gb) 物理硬隔离</text>
  <text x="916" y="192" fill="#6ee7b7" font-size="12" font-weight="700">• 同链路内开 CUDA MPS 空间并行共享 SM</text>
  <text x="916" y="212" fill="#6ee7b7" font-size="12" font-weight="700">• 邻居 OOM 连坐事故率：0.0% 🏆</text>
  <text x="916" y="232" fill="#6ee7b7" font-size="12" font-weight="700">• P99 延迟：21.0 ms 🏆 (比轮转快 4.67x)</text>
  <text x="916" y="252" fill="#6ee7b7" font-size="12" font-weight="700">• 所需显卡：仅 3 张 🏆 (利用率 78.5%)</text>
  <rect x="916" y="274" width="244" height="34" rx="8" fill="#064e3b"/>
  <text x="1038" y="296" fill="#a7f3d0" font-size="12.5" font-weight="700" text-anchor="middle">28服务月成本：$8,400 (省 89.3%) 🏆</text>
  <text x="916" y="334" fill="#a7f3d0" font-size="11.5" font-weight="700">定位：企业级 AI 辅助模型池装箱终局标准</text>
  <text x="916" y="354" fill="#94a3b8" font-size="11.5">兼顾硬件级故障隔离与极致算力超分复用</text>

  <!-- Bottom Architecture Rules -->
  <rect x="24" y="450" width="1152" height="206" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="482" fill="#f8fafc" font-size="16" font-weight="800">🧭 一张表分清三大 GPU 切分技术本质：Time-Slicing (软件分时) vs. MPS (空间共享) vs. MIG (物理硬切)</text>
  <line x1="44" y1="496" x2="1150" y2="496" stroke="url(#accentGrad389)" stroke-width="2"/>

  <text x="44" y="524" fill="#38bdf8" font-size="13.5" font-weight="700">1. Time-Slicing（时间片轮转 = 轮流独占整卡）</text>
  <text x="44" y="546" fill="#cbd5e1" font-size="12.5">• 同一时刻只有 1 个进程能用 GPU，频繁切换上下文耗时严重；</text>
  <text x="44" y="568" fill="#fca5a5" font-size="12.5">• **无显存上限隔离、无故障隔离**（一损俱损）；</text>
  <text x="44" y="590" fill="#94a3b8" font-size="12">• 仅适用于：研发 Notebook 闲时共享、低优先级离线测试。</text>

  <text x="430" y="524" fill="#818cf8" font-size="13.5" font-weight="700">2. NVIDIA MIG（硬件多实例 = 1张大卡变7张独立小卡）</text>
  <text x="430" y="546" fill="#cbd5e1" font-size="12.5">• 支持卡型：`A100 / H100 / H200 / B200`（注：L40S/A10G 不支持 MIG）；</text>
  <text x="430" y="568" fill="#34d399" font-size="12.5" font-weight="700">• 物理隔离显存带宽、L2 Cache 与计算单元，邻居 OOM 零影响！</text>
  <text x="430" y="590" fill="#94a3b8" font-size="12">• 适用于：跨团队/跨租户生产环境、严苛 P99 延迟保障。</text>

  <text x="815" y="524" fill="#34d399" font-size="13.5" font-weight="700">3. Tier 4 黄金组合：外层 MIG 硬隔离 + 内层 MPS 并发</text>
  <text x="815" y="546" fill="#cbd5e1" font-size="12.5">• 将一张 80GB H100 切为 `3 个 2g.20gb + 1 个 1g.10gb` MIG 实例；</text>
  <text x="815" y="568" fill="#cbd5e1" font-size="12.5">• 在同一个 `2g.20gb` 内部开启 **CUDA MPS**，将同一条 RAG 链路的</text>
  <text x="815" y="590" fill="#6ee7b7" font-size="12.5" font-weight="700">  `Embedding(2G) + Reranker(3G) + Guardrail(1G)` 紧凑装箱，</text>
  <text x="815" y="612" fill="#94a3b8" font-size="12">  零切换开销同时跑满 SM，且故障半径被严格锁死在该 MIG 块内！</text>

  <text x="1156" y="642" fill="#64748b" font-size="11" text-anchor="end">来源：turbo998/ai-infra-research · Round 389 合成标定算例 (independently_reproduced=false)</text>
</svg>
