<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 238 · FLASHATTENTION-2/3/4 BACKWARD NON-DETERMINISM (DQ ATOMICADD) &amp; BITWISE REPRODUCIBILITY FAQ</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">FlashAttention Backward: 6-ULP atomicAdd Drift vs Ordered Deterministic dQ (0 ULP, 785 TFLOPS)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: `dQ_accum` `atomicAdd` Drift vs Slow Serial</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Why is FA2/FA3 Forward 100% deterministic, but Backward is NOT?</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Backward parallelizes CTAs across `K/V` blocks; multiple CTAs execute</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  concurrent `atomicAdd()` into global FP32 `dQ_accum` in random order ✕</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: Disabling KV parallelism drops Bwd TFLOPS by 62% (310 TF) ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Default Bwd Drift: 6 ULPs/Step (Diverges!) | Serial: 310 TFLOPS ✕</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Non-Associative FP32 `atomicAdd` Breaks Loss-Spike &amp; SDC Debugging</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 4: FA2.6+/FA3 Ordered `deterministic=True`</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Keeps full CTA parallelism across `K/V` blocks (`785 TFLOPS`)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Enforces strict KV-block index accumulation order (`j = 0, 1, 2...`)</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  via SM-bounded split workspaces or hardware ordered semaphores</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Uses only `0.50 GB` workspace (vs `16.0 GB` naive split buffer)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">0 ULP Bitwise Exact | 785 TFLOPS (Only 4.2% Overhead!) 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">Enables Bit-Exact Golden-Step SDC Verification &amp; Loss Spike Replay</text>
</svg>
