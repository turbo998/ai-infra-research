<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="23.5" font-weight="800">⚗️ 企业大模型知识蒸馏、合成数据清洗与结构化剪枝 (671B → 8B) 选型一图流总结</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">671B 教师基线准确率 89.5% ($1.80/1M Tok) → 蒸馏至 8B 生产学生模型 ($0.10/1M Tok, 省 94.4%) · Provenance: synthetic + anonymized_reported (independently_reproduced=false)</text>

  <rect x="960" y="42" width="288" height="38" rx="19" fill="#3b0764" stroke="#a855f7" stroke-width="1.5"/>
  <text x="1104" y="66" fill="#f3e8ff" font-size="13" font-weight="700" text-anchor="middle">Round 39 · Distillation &amp; Pruning</text>

  <!-- 4 Tier Comparison Cards -->
  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#334155"/>
    <text x="16" y="27" fill="#f8fafc" font-size="14" font-weight="800">⬜ Tier 1: 原始业务日志直训 SFT</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">未清洗人工工单直接微调 · 缺推理过程</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 8B 学生业务准确率: <tspan fill="#f87171" font-weight="700">61.2% (仅继承 68.4% ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 事实幻觉错误率: <tspan fill="#f87171" font-weight="700">16.8% (学入人工错误 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 3代递归合成退化: <tspan fill="#cbd5e1" font-weight="700">N/A (人工日志)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 推理成本降幅: <tspan fill="#34d399" font-weight="700">-94.4% ($0.10/1M)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 离线蒸馏算力成本: <tspan fill="#cbd5e1" font-weight="700">$1,200</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#475569"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么直接训历史客服日志没用？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">历史人工日志只有简短结论而没有中间推理</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">链 (CoT)，且夹杂大量口语错误与过期政策，</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">8B 模型死记硬背导致泛化能力极差！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 2: 教师未过滤盲目合成 SFT</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">671B 单次生成全盘照收 · 触发模型坍塌</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 8B 学生业务准确率: <tspan fill="#fbbf24" font-weight="700">74.8% (继承 83.6%)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 事实幻觉错误率: <tspan fill="#f87171" font-weight="700">11.4% (幻觉固化放大 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 3代递归合成退化: <tspan fill="#f87171" font-weight="700">-48.5% 多样性坍塌 ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 3代递归后准确率: <tspan fill="#f87171" font-weight="700">暴跌至 54.0% ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 离线蒸馏算力成本: <tspan fill="#cbd5e1" font-weight="700">$6,800</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 警惕 Nature 论文揭示的“模型坍塌”：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">即使 671B 教师也有 10% 概率算错；不加验</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">证器全盘照收会把教师幻觉当真理训进学生，</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">且长尾罕见知识在 3 轮迭代后彻底消失！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: RLVR 拒绝采样思维链蒸馏</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">Best-of-8 沙箱/SymPy 验证过滤 + MinHash 去重</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 8B 学生业务准确率: <tspan fill="#34d399" font-weight="700">86.2% (继承 96.3% 智商 ✅)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 事实幻觉错误率: <tspan fill="#34d399" font-weight="700">2.9% ✅</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 3代递归合成退化: <tspan fill="#34d399" font-weight="700">零坍塌 (反升至 87.1% 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 推理成本降幅: <tspan fill="#34d399" font-weight="700">-94.4% ($1.80 → $0.10)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 离线蒸馏算力成本: <tspan fill="#60a5fa" font-weight="700">$14,500</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ DeepSeek-R1-Distill 同款黄金配方：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">每题让 671B 采样 8 条 `&lt;think&gt;` 轨迹，</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">仅保留通过 RLVR 沙箱单测/SymPy 校验的正</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">确轨迹并经 MinHash 去重，零门槛跨族蒸馏！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: Minitron 剪枝 + Logits KD 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">14B/32B 结构化剪枝为 8B + Top-128 概率蒸馏</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• 8B 学生业务准确率: <tspan fill="#34d399" font-weight="700">88.4% (继承 98.8% 智商 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 事实幻觉错误率: <tspan fill="#34d399" font-weight="700">1.8% (全场最低 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 3代递归合成表现: <tspan fill="#6ee7b7" font-weight="700">稳步提升至 89.0% 🏆</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 每 Token 传递信息量: <tspan fill="#6ee7b7" font-weight="700">1,200+ bits 暗知识 🏆</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 离线蒸馏算力成本: <tspan fill="#34d399" font-weight="700">$19,200 (追平 671B 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 为什么剪枝 + Logits 蒸馏能逼近 99%？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 剪枝直接继承大模型已学好的注意力头与</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">神经元骨架；② Top-128 Logits 传递完整的</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">近似词概率分布而非单调的 One-Hot 文本！</text>
  </g>

  <!-- Bottom Left: Recursive Model Collapse Perturbation -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📉 三代递归合成数据迭代测试：盲目合成坍塌 (Tier 2) vs. RLVR 验证进化 (Tier 3/4)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">当用第 N 代合成数据训练第 N+1 代模型时，有无确定性验证器 (Verifier) 决定了是坍塌还是飞轮进化</text>

    <!-- Gen 1 -->
    <text x="24" y="96" fill="#cbd5e1" font-size="12" font-weight="700">第 1 代合成训练 (Gen 1)</text>
    <rect x="205" y="82" width="300" height="14" rx="3" fill="#10b981"/>
    <text x="512" y="94" fill="#6ee7b7" font-size="11.5" font-weight="700">88.4% (Tier 4)</text>
    <rect x="205" y="100" width="254" height="14" rx="3" fill="#f59e0b"/>
    <text x="466" y="112" fill="#fde68a" font-size="11.5" font-weight="700">74.8% (Tier 2 未过滤)</text>

    <!-- Gen 2 -->
    <text x="24" y="164" fill="#cbd5e1" font-size="12" font-weight="700">第 2 代自循环合成 (Gen 2)</text>
    <rect x="205" y="150" width="302" height="14" rx="3" fill="#10b981"/>
    <text x="514" y="162" fill="#6ee7b7" font-size="11.5" font-weight="700">88.8% (持续进化 🏆)</text>
    <rect x="205" y="168" width="226" height="14" rx="3" fill="#ef4444"/>
    <text x="438" y="180" fill="#f87171" font-size="11.5" font-weight="700">66.5% (开始坍塌 ✕)</text>

    <!-- Gen 3 -->
    <text x="24" y="232" fill="#cbd5e1" font-size="12" font-weight="700">第 3 代自循环合成 (Gen 3)</text>
    <rect x="205" y="218" width="304" height="14" rx="3" fill="#10b981"/>
    <text x="516" y="230" fill="#6ee7b7" font-size="11.5" font-weight="700">89.0% (逼近 671B 教师 🏆)</text>
    <rect x="205" y="236" width="183" height="14" rx="3" fill="#ef4444"/>
    <text x="396" y="248" fill="#f87171" font-size="11.5" font-weight="700">54.0% (彻底退化报废 ✕)</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#f3e8ff" font-size="11.5" font-weight="700">💡 铁律：没有外部真实世界校验器 (RLVR Verifier) 注入负熵，任何自合成循环必然走向模型坍塌！</text>
  </g>

  <!-- Bottom Right: Architecture Decision Guide -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 AI 架构师企业模型瘦身 (671B → 8B) 三大黄金法则</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 跨模型家族快速蒸馏 (如 DeepSeek-671B → Qwen-7B) → 选 Tier 3</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 当教师与学生词表 (Tokenizer) 不同时，采用 `Best-of-8 拒绝采样 + RLVR 沙箱验证过滤`</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  + `MinHash 去重`，直接用验证通过的 `&lt;think&gt;` 黄金思维链做 SFT，继承 `96.3%` 教师能力！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 同家族极致瘦身 (如 Qwen-32B/14B → 8B) → 选 Tier 4 (Minitron + Logits KD)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 用 10M 业务语料统计神经元激活重要性，直接剪掉冗余层与通道（保留 90% 骨架权重），</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  再跑 `Top-128 Logits Reverse-KL` 蒸馏，以 `1/18` 的在线推理成本拿到 `98.8%` 的旗舰精度！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fcd34d" font-size="13" font-weight="800">3️⃣ 为什么必须蒸馏 `Top-128 Logits` 而不是保存整个 15 万词表？</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 完整保存 152,064 维 FP16 Logits 每 10B Token 需要 **3,000 TB 硬盘**！</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">• 而前 128 个最大 Logits 已包含 **99.99% 的概率质量**，存储体积暴降 **1,188 倍**且精度无损！</text>
  </g>
</svg>
