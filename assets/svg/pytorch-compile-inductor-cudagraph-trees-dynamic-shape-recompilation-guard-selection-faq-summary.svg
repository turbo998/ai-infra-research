<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0F172A" />
  <text x="45" y="52" fill="#38BDF8" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" letter-spacing="1">ROUND 224 · PYTORCH TORCH.COMPILE, DYNAMIC SHAPE GUARD STORMS, CUDAGRAPH TREES &amp; PIECEWISE COMPILATION</text>
  <text x="45" y="88" fill="#F8FAFC" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">torch.compile: 8x Recompile &amp; +18.4 GB CUDAGraph Tree Bloat vs Piecewise Compile (6.8 ms, 1.62x)</text>
  <text x="45" y="114" fill="#94A3B8" font-family="Segoe UI, sans-serif" font-size="14">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured)</text>

  <rect x="45" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#EF4444" stroke-width="2" />
  <text x="70" y="180" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">⛔ Tier 1 &amp; 2: Guard Storms &amp; CUDAGraph Tree Bloat</text>
  <text x="70" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 1: Variable token counts trigger repeated Dynamo Shape Guard</text>
  <text x="70" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  failures (35-60s jitter per recompile), hitting `cache_size_limit=8` ✕</text>
  <text x="70" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 2: `mode="reduce-overhead"` (`CUDAGraph Trees`) allocates</text>
  <text x="70" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  disjoint private pools across buckets (+18.4 GB HBM wasted!) ⚠️</text>
  <rect x="70" y="365" width="490" height="82" rx="10" fill="#450A0A" />
  <text x="90" y="400" fill="#FCA5A5" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">Tier 1 TPOT: 11.0 ms (Eager Fallback) | Tier 2 Pool: +18.4 GB</text>
  <text x="90" y="428" fill="#FECACA" font-family="Segoe UI, sans-serif" font-size="14">Never Wrap Dynamic PagedAttention Metadata Inside Monolithic CUDAGraphs</text>

  <rect x="615" y="140" width="540" height="440" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2" />
  <text x="640" y="180" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700">🏆 Tier 3 &amp; 4: mark_dynamic + Piecewise CUDAGraph</text>
  <text x="640" y="218" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 3: Regional layer compilation + `mark_dynamic(x, 0)` (0 recompiles)</text>
  <text x="640" y="252" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Tier 4: Piecewise Compilation splits FX graph at Attention ops</text>
  <text x="640" y="286" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">• Fuses RMSNorm/SiLU/RoPE into Triton kernels &amp; shares 1 `graph_pool`</text>
  <text x="640" y="320" fill="#E2E8F0" font-family="Segoe UI, sans-serif" font-size="15">  across all padded batch buckets (saving 16.2 GB HBM vs CUDAGraph Trees)</text>
  <rect x="640" y="365" width="490" height="82" rx="10" fill="#064E3B" />
  <text x="660" y="400" fill="#6EE7B7" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">TPOT: 6.8 ms (1.62x Speedup) | Graph Pool: Only 2.2 GB 🏆</text>
  <text x="660" y="428" fill="#A7F3D0" font-family="Segoe UI, sans-serif" font-size="14">0 Runtime Recompilations + Maximum HBM Headroom for KV Cache</text>
</svg>
