<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" width="1280" height="780" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad79" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accentGrad79" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="780" fill="url(#bgGrad79)" rx="16"/>
  <rect x="24" y="20" width="1232" height="6" fill="url(#accentGrad79)" rx="3"/>

  <!-- Header -->
  <text x="40" y="62" fill="#f8fafc" font-size="22.5" font-weight="800">📦 大规模离线批量推理 (Offline Batch API)、Radix 前缀/长度分桶与 Spot 弹性架构选型一图流</text>
  <text x="40" y="88" fill="#94a3b8" font-size="13.5">日处理 1,000 万条请求 (120 模板 × 3.5K 共享前缀 + 500 输入 + 400 输出) · 32×H100 (按需 $2.50/hr vs Spot $0.85/hr) · Provenance: synthetic + anonymized_reported</text>

  <rect x="945" y="42" width="303" height="38" rx="19" fill="#2e1065" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="1096" y="66" fill="#ddd6fe" font-size="13" font-weight="700" text-anchor="middle">Round 79 · Offline Batch &amp; Spot</text>

  <!-- Tier 1 -->
  <g transform="translate(40, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#7f1d1d"/>
    <text x="16" y="27" fill="#fecaca" font-size="14" font-weight="800">🟥 Tier 1: 原始 FIFO 乱序塞在线队列</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">随机模板顺序冲垮缓存 + 长短句混批空洞</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Prefix Cache 命中率: <tspan fill="#f87171" font-weight="700">11.5% (120 模板互踢 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 显存微批紧致打包率: <tspan fill="#f87171" font-weight="700">48.0% (长尾拖累短句 ✕)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 单台 8×H100 有效吞吐: <tspan fill="#f87171" font-weight="700">8,400 tok/s ✕</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 1000 万条完成耗时: <tspan fill="#f87171" font-weight="700">14.6 小时 ✕</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 年总 TCO: <tspan fill="#f87171" font-weight="700">$0.53/1M · $8.52M/yr ✕</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#7f1d1d"/>
    <text x="26" y="220" fill="#fca5a5" font-size="11.5" font-weight="700">⛔ 为什么直接调在线 API 跑批极度烧钱？</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">120 个业务模板随机交错到达，显存根本装不下</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">全部前缀，88.5% 的 3.5K 系统提示词被迫每条</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">重算一遍 Prefill，白白烧掉 $852 万/年！</text>
  </g>

  <!-- Tier 2 -->
  <g transform="translate(342, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#78350f"/>
    <text x="16" y="27" fill="#fde68a" font-size="14" font-weight="800">🟨 Tier 2: 粗放 Spot 实例乱序跑批</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">虽享 3.4 折单价 · 但无微片检查点丢失 28.5%</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Prefix Cache 命中率: <tspan fill="#fbbf24" font-weight="700">14.2% (仍未分桶 ✕)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Spot 抢占重跑算力损失: <tspan fill="#f87171" font-weight="700">28.5% 进度作废 ✕</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 单台 8×H100 有效吞吐: <tspan fill="#fbbf24" font-weight="700">9,200 tok/s</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 1000 万条完成耗时: <tspan fill="#f87171" font-weight="700">18.8 小时 (重跑拖慢 ✕)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 年总 TCO: <tspan fill="#fbbf24" font-weight="700">$0.23/1M · $3.74M/yr</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#78350f"/>
    <text x="26" y="220" fill="#fcd34d" font-size="11.5" font-weight="700">⚠️ 裸跑 Spot 竞价实例的痛点：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">云厂商每小时 18% 概率发 SIGTERM 回收机器；</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">若按 5 万条一个大文件跑完才落盘，一旦中断</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">整个半小时的生成结果全部作废重跑！</text>
  </g>

  <!-- Tier 3 -->
  <g transform="translate(644, 110)">
    <rect width="286" height="295" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2.5"/>
    <rect x="0" y="0" width="286" height="44" rx="12" fill="#1e3a8a"/>
    <text x="16" y="27" fill="#bfdbfe" font-size="14" font-weight="800">🟦 Tier 3: Radix 前缀分桶 + 长度打包</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">入队前全局字典序排序 + 同质长度微批 (按需池)</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Prefix Cache 命中率: <tspan fill="#34d399" font-weight="700">94.2% (+82.7pt 暴涨 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• 显存微批紧致打包率: <tspan fill="#60a5fa" font-weight="700">91.5% (+43.5pt ✅)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 单台 8×H100 有效吞吐: <tspan fill="#60a5fa" font-weight="700">31,600 tok/s (快 3.76x ✅)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 1000 万条完成耗时: <tspan fill="#60a5fa" font-weight="700">3.88 小时 ✅</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 年总 TCO: <tspan fill="#60a5fa" font-weight="700">$0.14/1M · $2.265M/yr</tspan></text>
    <rect x="16" y="200" width="254" height="78" rx="8" fill="#0f172a" stroke="#1e3a8a"/>
    <text x="26" y="220" fill="#93c5fd" font-size="11.5" font-weight="700">✅ 离线任务独享的“上帝视角”红利：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">离线队列已知全部 1000 万条输入！先按前缀树</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">字典序把同一个模板的 8 万条请求排在一起连</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">续喂给 GPU，3.5K 前缀整场只算 1 次 Prefill！</text>
  </g>

  <!-- Tier 4 -->
  <g transform="translate(946, 110)">
    <rect width="294" height="295" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <rect x="0" y="0" width="294" height="44" rx="12" fill="#064e3b"/>
    <text x="16" y="27" fill="#a7f3d0" font-size="14" font-weight="800">🟩 Tier 4: Spot + 前缀分桶 + 微片续跑 🏆</text>
    <text x="16" y="68" fill="#cbd5e1" font-size="12.5" font-weight="700">双维分桶 + 512条原子写盘 + SIGTERM 30s 排空</text>
    <text x="16" y="92" fill="#94a3b8" font-size="12">• Prefix Cache 命中率: <tspan fill="#34d399" font-weight="700">95.8% (+DRAM 预取 🏆)</tspan></text>
    <text x="16" y="114" fill="#94a3b8" font-size="12">• Spot 抢占重跑算力损失: <tspan fill="#34d399" font-weight="700">仅 0.8% (降 35.6x 🏆)</tspan></text>
    <text x="16" y="136" fill="#94a3b8" font-size="12">• 单台 8×H100 有效吞吐: <tspan fill="#34d399" font-weight="700">33,400 tok/s (快 3.98x 🏆)</tspan></text>
    <text x="16" y="158" fill="#94a3b8" font-size="12">• 1000 万条完成耗时: <tspan fill="#34d399" font-weight="700">3.68 小时 (快 3.97x 🏆)</tspan></text>
    <text x="16" y="180" fill="#94a3b8" font-size="12">• 成本 / 年总 TCO: <tspan fill="#34d399" font-weight="700">$0.048/1M · $772k/yr (省 $7.75M 🏆)</tspan></text>
    <rect x="16" y="200" width="262" height="78" rx="8" fill="#0f172a" stroke="#10b981"/>
    <text x="26" y="220" fill="#6ee7b7" font-size="11.5" font-weight="700">🏆 揭秘大厂 Batch API 打 5 折还能赚翻的底牌：</text>
    <text x="26" y="238" fill="#cbd5e1" font-size="11">① 3.98x 算子吞吐提升 × ② 3.4 折 Spot 算力</text>
    <text x="26" y="254" fill="#cbd5e1" font-size="11">+ 512 条 Parquet 微片原子提交，把百万词真实</text>
    <text x="26" y="270" fill="#cbd5e1" font-size="11">硬件成本从 $0.53 砸穿 90.9% 至 $0.048/1M！</text>
  </g>

  <!-- Bottom Left: Prefix Ratio Scaling Chart -->
  <g transform="translate(40, 425)">
    <rect width="600" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">📈 不同共享前缀占比下的单节点 (8×H100) 跑批吞吐对比 (tokens/s)</text>
    <text x="20" y="52" fill="#94a3b8" font-size="12">对比原始 FIFO 乱序队列 (Tier 1) 与 Radix 前缀/长度双维分桶 (Tier 4)</text>

    <!-- Row 1 -->
    <text x="24" y="88" fill="#cbd5e1" font-size="12" font-weight="700">25% 共享前缀 (1K/4K 短模板)</text>
    <rect x="225" y="74" width="110" height="14" rx="3" fill="#10b981"/>
    <text x="342" y="86" fill="#6ee7b7" font-size="11.5" font-weight="700">16,200 tok/s (2.08x ✅)</text>
    <rect x="225" y="92" width="53" height="14" rx="3" fill="#64748b"/>
    <text x="285" y="104" fill="#cbd5e1" font-size="11.5" font-weight="700">7,800 tok/s (Tier 1)</text>

    <!-- Row 2 -->
    <text x="24" y="138" fill="#cbd5e1" font-size="12" font-weight="700">50% 共享前缀 (2K/4K Few-Shot)</text>
    <rect x="225" y="124" width="154" height="14" rx="3" fill="#10b981"/>
    <text x="386" y="136" fill="#6ee7b7" font-size="11.5" font-weight="700">22,800 tok/s (2.81x ✅)</text>
    <rect x="225" y="142" width="55" height="14" rx="3" fill="#f59e0b"/>
    <text x="287" y="154" fill="#fde68a" font-size="11.5" font-weight="700">8,100 tok/s (Tier 1)</text>

    <!-- Row 3 -->
    <text x="24" y="188" fill="#cbd5e1" font-size="12" font-weight="700">80% 共享前缀 (3.5K/4.4K 打标)</text>
    <rect x="225" y="174" width="225" height="14" rx="3" fill="#10b981"/>
    <text x="458" y="186" fill="#6ee7b7" font-size="11.5" font-weight="700">33,400 tok/s (3.98x 🏆)</text>
    <rect x="225" y="192" width="57" height="14" rx="3" fill="#ef4444"/>
    <text x="289" y="204" fill="#f87171" font-size="11.5" font-weight="700">8,400 tok/s (Tier 1 ✕)</text>

    <!-- Row 4 -->
    <text x="24" y="238" fill="#cbd5e1" font-size="12" font-weight="700">90% 共享长文档 (16K × 20 问)</text>
    <rect x="225" y="224" width="302" height="14" rx="3" fill="#10b981"/>
    <text x="534" y="236" fill="#6ee7b7" font-size="11.5" font-weight="700">44,800 tok/s (6.49x 🏆)</text>
    <rect x="225" y="242" width="47" height="14" rx="3" fill="#ef4444"/>
    <text x="279" y="254" fill="#f87171" font-size="11.5" font-weight="700">6,900 tok/s (Tier 1 ✕)</text>

    <rect x="20" y="274" width="560" height="38" rx="6" fill="#1e293b"/>
    <text x="30" y="298" fill="#c4b5fd" font-size="11.5" font-weight="700">💡 黄金法则：在离线批处理中，先把全部请求按“前缀树字典序 + 长度”排好序再上卡，白捡 4~6 倍吞吐！</text>
  </g>

  <!-- Bottom Right: 3 Rules for Offline Batch Architecture -->
  <g transform="translate(660, 425)">
    <rect width="580" height="325" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f8fafc" font-size="15.5" font-weight="800">🧭 离线批量推理 (Offline Batch Engine) 架构设计三大铁律</text>

    <rect x="20" y="48" width="540" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="34" y="70" fill="#93c5fd" font-size="13" font-weight="800">1️⃣ 铁律一：入队层必做全局 Radix 字典序排序 (Lexicographical Prefix Sort)</text>
    <text x="34" y="90" fill="#cbd5e1" font-size="11.5">• 将千万条 JSONL 请求按 Token ID 序列做字典序排序，确保共享相同 System Prompt /</text>
    <text x="34" y="108" fill="#cbd5e1" font-size="11.5">  Few-Shot / 文档背景的请求 100% 紧挨着送入同一个 Worker，把缓存命中率锁死在 95%+！</text>

    <rect x="20" y="138" width="540" height="80" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="34" y="160" fill="#6ee7b7" font-size="13" font-weight="800">2️⃣ 铁律二：桶内做长度同质打包 (Length-Homogeneous Binning)</text>
    <text x="34" y="180" fill="#cbd5e1" font-size="11.5">• 在同一个前缀桶内部，再按输入长度与预估输出长度排序分批，让同一个 Batch 里的请求</text>
    <text x="34" y="198" fill="#cbd5e1" font-size="11.5">  几乎在同一秒完成生成并整齐释放 KV 显存，将微批紧致度从 48% 推升至 93.4%！</text>

    <rect x="20" y="228" width="540" height="80" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="34" y="250" fill="#fde68a" font-size="13" font-weight="800">3️⃣ 铁律三：Spot 实例必须配 `512-Prompt 微片落盘` + `30s SIGTERM 优雅排空`</text>
    <text x="34" y="270" fill="#cbd5e1" font-size="11.5">• 每算完 512 条请求（约 12 秒）原子追加写入一个 Parquet/JSONL 微片；收到云平台</text>
    <text x="34" y="288" fill="#cbd5e1" font-size="11.5">  Spot 回收信号时停止拉新片、用 15 秒跑完在途 Batch，将抢占损失压至 0.8% 以内！</text>
  </g>
</svg>
