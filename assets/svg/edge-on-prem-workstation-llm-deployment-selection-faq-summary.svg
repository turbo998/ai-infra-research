<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg26" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent26" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="720" fill="url(#bg26)" rx="16"/>
  <rect x="24" y="20" width="1152" height="84" rx="12" fill="#1e293b" stroke="#334155"/>
  <rect x="24" y="20" width="8" height="84" rx="4" fill="url(#accent26)"/>
  <text x="48" y="54" fill="#f8fafc" font-size="21.5" font-weight="800">政企私有化单机/工作站与边缘大模型硬件选型一图流 (Round 26 · 70B–671B Local)</text>
  <text x="48" y="82" fill="#94a3b8" font-size="13.5">4×RTX 4090 拼装 (无 P2P/14.5% 故障率) vs. 统一内存 Mac/Spark (16K TTFT 4.85s) vs. 双卡 RTX PRO 6000 (192GB ECC) vs. 2×H200 NVL (282GB)</text>
  <rect x="930" y="34" width="228" height="54" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="1044" y="56" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">PROVENANCE: SYNTHETIC</text>
  <text x="1044" y="75" fill="#94a3b8" font-size="11" text-anchor="middle">independently_reproduced = false</text>

  <!-- Left Panel: On-Prem Hardware Physics & Tradeoffs -->
  <rect x="24" y="120" width="550" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="44" y="150" fill="#fcd34d" font-size="16" font-weight="800">① 为什么企业机房严禁上 4×4090 攒机？为什么 Mac Studio 只适合 1~2 人用？</text>

  <rect x="44" y="168" width="510" height="80" rx="8" fill="#450a0a" stroke="#dc2626"/>
  <text x="58" y="190" fill="#fca5a5" font-size="13.5" font-weight="700">⛔ Tier 1 消费级 4×RTX 4090 拼装机: 驱动锁死 P2P + 14.5% 散热/供电故障率</text>
  <text x="58" y="212" fill="#fecaca" font-size="12">• 消费级驱动屏蔽 PCIe BAR1 P2P 直通，TP=4 归约被迫绕道主存 (有效带宽仅 16.5 GB/s)</text>
  <text x="58" y="232" fill="#fecaca" font-size="12">• 无显存硬件 ECC、轴流风扇机柜热回流、12VHPWR 熔毁风险与数据中心 EULA 合规红线</text>

  <rect x="44" y="260" width="510" height="82" rx="8" fill="#422006" stroke="#eab308"/>
  <text x="58" y="282" fill="#fde047" font-size="13.5" font-weight="700">🟨 Tier 2 统一内存工作站 (Mac Studio M4 Ultra 192GB / DGX Spark): 个人神器，多人崩溃</text>
  <text x="58" y="304" fill="#fef08a" font-size="12">• 240W 静音桌面即可装下 192GB~512GB 超大 MoE 模型，3 年总成本仅 $11,200 (适合 1~2 人研发)</text>
  <text x="58" y="324" fill="#fef08a" font-size="12">• ⚠️ 算力受限：16K 长文档 RAG Prefill 首字延迟高达 4,850.0 ms (4.85s)，16 人并发仅 68 tok/s</text>

  <rect x="44" y="354" width="510" height="88" rx="8" fill="#064e3b" stroke="#10b981"/>
  <text x="58" y="376" fill="#6ee7b7" font-size="13.5" font-weight="700">🟩 Tier 3 双卡 RTX PRO 6000 Blackwell (96GB GDDR7 ECC × 2 = 192GB): 部门级黄金解</text>
  <text x="58" y="398" fill="#d1fae5" font-size="12">• 单卡 96GB ECC 显存 (1,792 GB/s)，仅需 2 张卡 (TP=2) 即可装下 70B FP8 + 110GB KV Cache！</text>
  <text x="58" y="420" fill="#d1fae5" font-size="12">• 开放完整 PCIe Gen5 P2P + 4 路硬件 MIG，16K TTFT 285ms，BS=16 吞吐达 740 tok/s ($0.34/1M)</text>

  <rect x="44" y="454" width="510" height="90" rx="8" fill="#1e1b4b" stroke="#3b82f6"/>
  <text x="58" y="476" fill="#93c5fd" font-size="13.5" font-weight="700">🟦 Tier 4 企业 2U 双卡 H200 NVL (141GB HBM3e × 2 = 282GB + 900GB/s NVLink)</text>
  <text x="58" y="498" fill="#dbeafe" font-size="12">• 聚合 9,600 GB/s HBM3e 带宽 (比统一内存高 12x) + 900 GB/s NVLink 桥接器 + 硬件机密计算 TEE</text>
  <text x="58" y="520" fill="#6ee7b7" font-size="12" font-weight="700">• 16K TTFT 压至 115.0 ms (比统一内存快 42.2x)，BS=16 吞吐 1,680 tok/s，单 Token 成本最低 ($0.25/1M)!</text>

  <!-- Right Panel: Quantitative Benchmark Matrix -->
  <rect x="590" y="120" width="586" height="440" rx="12" fill="#0f172a" stroke="#334155"/>
  <text x="610" y="150" fill="#93c5fd" font-size="16" font-weight="800">② 四档私有化单机硬件架构定量对比 (70B FP8 · 16K RAG 上下文)</text>

  <!-- Table Header -->
  <rect x="610" y="168" width="546" height="34" rx="6" fill="#1e293b"/>
  <text x="622" y="190" fill="#cbd5e1" font-size="12" font-weight="700">私有化单机硬件档位</text>
  <text x="828" y="190" fill="#cbd5e1" font-size="12" font-weight="700">显存 / 聚合带宽</text>
  <text x="948" y="190" fill="#cbd5e1" font-size="12" font-weight="700">16K TTFT / BS16</text>
  <text x="1058" y="190" fill="#cbd5e1" font-size="12" font-weight="700">3年TCO / 百万Token</text>

  <!-- Row 1 -->
  <rect x="610" y="210" width="546" height="68" rx="6" fill="#1e293b" stroke="#dc2626"/>
  <text x="622" y="234" fill="#fca5a5" font-size="12.5" font-weight="700">Tier 1: 4×RTX 4090 攒机 (96GB)</text>
  <text x="622" y="256" fill="#94a3b8" font-size="11">无 P2P (16.5GB/s) · 年故障率 14.5% ✕</text>
  <text x="828" y="236" fill="#f87171" font-size="12" font-weight="700">96 GB (无ECC)</text>
  <text x="828" y="256" fill="#cbd5e1" font-size="11">4,032 GB/s</text>
  <text x="948" y="236" fill="#fca5a5" font-size="12" font-weight="700">980.0 ms</text>
  <text x="948" y="256" fill="#cbd5e1" font-size="11">245.0 tok/s</text>
  <text x="1058" y="236" fill="#fca5a5" font-size="12" font-weight="700">$24,800 (3yr)</text>
  <text x="1058" y="256" fill="#cbd5e1" font-size="11">$1.07 / 1M</text>

  <!-- Row 2 -->
  <rect x="610" y="286" width="546" height="68" rx="6" fill="#1e293b" stroke="#eab308"/>
  <text x="622" y="310" fill="#fde047" font-size="12.5" font-weight="700">Tier 2: 统一内存工作站 (192GB)</text>
  <text x="622" y="332" fill="#94a3b8" font-size="11">Mac Studio Ultra / DGX Spark · 240W 静音</text>
  <text x="828" y="312" fill="#fde047" font-size="12" font-weight="700">192 GB (TP=1)</text>
  <text x="828" y="332" fill="#cbd5e1" font-size="11">800 GB/s LPDDR5X</text>
  <text x="948" y="312" fill="#f87171" font-size="12" font-weight="700">4,850.0 ms ✕</text>
  <text x="948" y="332" fill="#fca5a5" font-size="11">仅 68.0 tok/s</text>
  <text x="1058" y="312" fill="#6ee7b7" font-size="12" font-weight="700">$11,200 (最低)</text>
  <text x="1058" y="332" fill="#cbd5e1" font-size="11">$1.74 / 1M</text>

  <!-- Row 3 -->
  <rect x="610" y="362" width="546" height="68" rx="6" fill="#1e293b" stroke="#10b981"/>
  <text x="622" y="386" fill="#6ee7b7" font-size="12.5" font-weight="700">Tier 3: 2×RTX PRO 6000 Blackwell</text>
  <text x="622" y="408" fill="#94a3b8" font-size="11">96GB GDDR7 ECC × 2 · 开放 P2P &amp; MIG</text>
  <text x="828" y="388" fill="#34d399" font-size="12" font-weight="700">192 GB (ECC ✅)</text>
  <text x="828" y="408" fill="#6ee7b7" font-size="11">3,584 GB/s</text>
  <text x="948" y="388" fill="#6ee7b7" font-size="12" font-weight="700">285.0 ms ✅</text>
  <text x="948" y="408" fill="#6ee7b7" font-size="11">740.0 tok/s (3.0x)</text>
  <text x="1058" y="388" fill="#6ee7b7" font-size="12" font-weight="700">$26,400 (3yr)</text>
  <text x="1058" y="408" fill="#6ee7b7" font-size="11">$0.34 / 1M (-68%)</text>

  <!-- Row 4 -->
  <rect x="610" y="438" width="546" height="68" rx="6" fill="#1e1b4b" stroke="#3b82f6" stroke-width="2"/>
  <text x="622" y="462" fill="#93c5fd" font-size="12.5" font-weight="700">Tier 4: 2×NVIDIA H200 NVL (2U)</text>
  <text x="622" y="484" fill="#dbeafe" font-size="11">141GB HBM3e × 2 + 900 GB/s NVLink Bridge</text>
  <text x="828" y="464" fill="#34d399" font-size="12" font-weight="700">282 GB (HBM3e)</text>
  <text x="828" y="484" fill="#34d399" font-size="11" font-weight="700">9,600 GB/s 🏆</text>
  <text x="948" y="464" fill="#93c5fd" font-size="12" font-weight="700">115.0 ms 🏆</text>
  <text x="948" y="484" fill="#34d399" font-size="11" font-weight="700">1,680.0 tok/s 🏆</text>
  <text x="1058" y="464" fill="#93c5fd" font-size="12.5" font-weight="800">$68,500 (3yr)</text>
  <text x="1058" y="484" fill="#34d399" font-size="11" font-weight="700">$0.25 / 1M (-77%)</text>

  <text x="610" y="534" fill="#94a3b8" font-size="12">💡 32 人并发拐点：4×4090 因 96GB 显存满载发生 KV 换出退化至 210 tok/s，2×RTX PRO 6000 达 1,020 tok/s!</text>

  <!-- Bottom Banner -->
  <rect x="24" y="576" width="1152" height="122" rx="12" fill="#0f172a" stroke="#10b981"/>
  <text x="44" y="606" fill="#6ee7b7" font-size="15" font-weight="800">③ 架构师一句话选型口诀（Golden Rules for On-Premises &amp; Edge LLM Hardware）</text>
  <text x="44" y="632" fill="#e2e8f0" font-size="13">1. <tspan font-weight="700" fill="#fde047">1~3 人桌面跑百B级 MoE 原型选 Tier 2 (Mac Studio Ultra / DGX Spark)</tspan>；<tspan font-weight="700" fill="#fca5a5">严禁买 4×4090 攒机进企业生产机房 (Tier 1)</tspan>。</text>
  <text x="44" y="656" fill="#e2e8f0" font-size="13">2. <tspan font-weight="700" fill="#6ee7b7">10~30 人部门级私有化首选 Tier 3 (双卡 RTX PRO 6000 Blackwell 192GB)</tspan>；<tspan font-weight="700" fill="#93c5fd">50+ 人核心机房选 Tier 4 (2×H200 NVL)</tspan>。</text>
  <text x="44" y="680" fill="#94a3b8" font-size="12">封存证据：experiments/onprem_edge_workstation_llm_selection/results.json · tests/test_onprem_edge_workstation_llm_selection.py · 7-Card &amp; Sizer</text>
</svg>
