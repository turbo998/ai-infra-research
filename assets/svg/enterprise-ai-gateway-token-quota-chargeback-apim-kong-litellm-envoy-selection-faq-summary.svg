<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0b1120"/>
  <rect x="28" y="24" width="1144" height="582" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="56" y="68" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="700">PLAYBOOK #412 · AI GATEWAY TOKEN QUOTA GOVERNANCE &amp; FINOPS CHARGEBACK (APIM / KONG / LITELLM / ENVOY)</text>
  <text x="56" y="104" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="25" font-weight="800">企业级 AI 网关 Token 配额治理与部门分账选型：APIM vs. Kong vs. LiteLLM vs. Envoy</text>
  <text x="56" y="132" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14">告别失效的传统 RPM 限流：落地两阶段流式加权 Token 桶、四元组精准分账与闲时弹性配额借用，将集群利用率推至 89.4%</text>

  <!-- Left Box: Two-Phase Weighted Token Bucket Math -->
  <rect x="56" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
  <text x="76" y="186" fill="#38bdf8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">1. 为什么传统 RPM 限流彻底失效？两阶段流式加权 Token 桶公式</text>
  <rect x="76" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="90" y="222" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">Phase 1 (请求入站预扣): Reserve = N_in + 4 * E[N_out_p80_by_route]</text>
  <text x="90" y="242" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">Phase 2 (SSE 结束实结): Actual  = N_uncached + 0.5*N_cached + 4*(N_think+N_out)</text>
  <text x="90" y="262" fill="#fbbf24" font-family="Consolas, monospace" font-size="12" font-weight="700">Refund  (差额秒级退回): Bucket += (Reserve - Actual)  [精确到 0.01%!]</text>
  <text x="76" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 传统 RPM 漏洞：1 次 64K 长文 + 4K 思考消耗的算力等于 420 次短文本请求！</text>
  <text x="76" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 按 max_tokens 死扣漏洞：用户传 max=16384 实吐 200 词，78% 配额被幽灵冻结</text>
  <text x="76" y="350" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：两阶段预扣+实结退差额将部门分账误差从 34.5% 压至 0.02%！</text>

  <!-- Right Box: Elastic Quota Borrowing & 4 Gateways -->
  <rect x="614" y="156" width="530" height="210" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="634" y="186" fill="#34d399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">2. 闲时弹性配额借用 (Elastic Borrowing) 与四大网关能力对标</text>
  <rect x="634" y="200" width="490" height="72" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="648" y="222" fill="#f8fafc" font-family="Consolas, monospace" font-size="12" font-weight="700">Azure APIM : 原生 llm-token-limit 策略 + Entra 鉴权 + PTU 溢出</text>
  <text x="648" y="242" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">Kong AI GW : 高性能多云插件 (AI Rate Limiting Advanced + Cost Guard)</text>
  <text x="648" y="262" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="700">LiteLLM Ent: 开箱即用 Virtual Keys + 团队月度美元预算 ($ Budget) 面板</text>
  <text x="634" y="298" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 死板静态切分痛点：把 100 PTU 硬分给 5 个部门各 20 PTU，忙的被限流、闲的空转</text>
  <text x="634" y="324" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5">• 弹性借用 + 保底：总池水位 &lt;80% 时允许免费借用空闲配额；&gt;=85% 瞬时收回保底</text>
  <text x="634" y="350" fill="#fbbf24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13.5" font-weight="700">• 实测：共享 PTU/GPU 池有效利用率从 51.2% 跃升至 89.4%，0 跨部门饥饿！</text>

