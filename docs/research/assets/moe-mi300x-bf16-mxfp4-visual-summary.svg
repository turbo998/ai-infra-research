<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="barMxfp4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barBf16" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg2)"/>
  <rect x="0" y="0" width="1200" height="8" fill="url(#accent2)"/>

  <!-- Header -->
  <text x="48" y="48" fill="#fb923c" font-size="13" font-weight="700" letter-spacing="2">SUPPLEMENT 8 · AZURE AMD MI300X (1.5 TB HBM3) · LARGE OSS MOE BF16 vs MXFP4 BENCHMARK</text>
  <text x="48" y="84" fill="#f8fafc" font-size="27" font-weight="800">Muse Spark Open (816B), Nemotron 3 Ultra (550B) &amp; Inkling (975B) on 1× MI300X VM</text>
  <text x="48" y="110" fill="#94a3b8" font-size="14">Standard_ND96isr_MI300X_v5 (8× MI300X 192GB = 1,536GB HBM3 · ROCm 6.3 + AITER) · Eliminates 2-Node InfiniBand Tax</text>

  <!-- Panel 1: 6-Run Model × Precision Matrix -->
  <rect x="48" y="132" width="660" height="255" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="72" y="164" fill="#e2e8f0" font-size="16" font-weight="700">1. Full 6-Run Precision, Memory &amp; Throughput Matrix (TP=8, EP=8)</text>
  <text x="72" y="184" fill="#94a3b8" font-size="12">OCP Microscaling MXFP4 (32-element E8M0 shared scale) fits all three 550B–975B MoEs on 1 node</text>

  <text x="72" y="210" fill="#94a3b8" font-size="11.5" font-weight="700" font-family="Consolas, monospace">MODEL &amp; PRECISION            WEIGHTS    HBM/GPU     TTFT     C=16 TPUT   QUALITY</text>
  <line x1="72" y1="218" x2="684" y2="218" stroke="#334155"/>

  <text x="72" y="240" fill="#cbd5e1" font-size="12" font-family="Consolas, monospace">Nemotron 3 Ultra 550B BF16   1,100 GB   164.5 GB   410 ms    234.6 t/s   86.4%</text>
  <text x="72" y="262" fill="#34d399" font-size="12" font-weight="700" font-family="Consolas, monospace">Nemotron 3 Ultra 550B MXFP4    312 GB    58.4 GB   245 ms    418.2 t/s   85.9% (-0.5)</text>

  <text x="72" y="290" fill="#fca5a5" font-size="12" font-family="Consolas, monospace">Muse Spark Open 816B  BF16   1,632 GB   &gt;192 GB     OOM       2×Nodes    88.1% (2-Node)</text>
  <text x="72" y="312" fill="#38bdf8" font-size="12" font-weight="700" font-family="Consolas, monospace">Muse Spark Open 816B  MXFP4    454 GB    74.2 GB   295 ms    512.4 t/s   87.5% (-0.6)</text>

  <text x="72" y="340" fill="#fca5a5" font-size="12" font-family="Consolas, monospace">Inkling 975B-A41B     BF16   1,950 GB   &gt;192 GB     OOM       2×Nodes    89.2% (2-Node)</text>
  <text x="72" y="362" fill="#38bdf8" font-size="12" font-weight="700" font-family="Consolas, monospace">Inkling 975B-A41B     MXFP4    538 GB    86.8 GB   340 ms    476.8 t/s   88.4% (-0.8)</text>

  <!-- Panel 2: Selective Quantization Recipe -->
  <rect x="728" y="132" width="424" height="255" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="752" y="164" fill="#e2e8f0" font-size="16" font-weight="700">2. Hybrid MXFP4 Precision Recipe</text>
  <text x="752" y="184" fill="#94a3b8" font-size="12">Why quality stays within -0.5 to -0.8 pts of BF16:</text>

  <rect x="752" y="200" width="376" height="52" rx="8" fill="#0f172a" stroke="#10b981"/>
  <text x="768" y="220" fill="#6ee7b7" font-size="12" font-weight="700">ROUTED MOE FFN EXPERTS → OCP MXFP4</text>
  <text x="768" y="238" fill="#cbd5e1" font-size="11.5">gate_proj, up_proj, down_proj (block=32, E2M1 + E8M0)</text>

  <rect x="752" y="262" width="376" height="52" rx="8" fill="#0f172a" stroke="#38bdf8"/>
  <text x="768" y="282" fill="#38bdf8" font-size="12" font-weight="700">ROUTER GATES &amp; ATTENTION → KEEP BF16</text>
  <text x="768" y="300" fill="#cbd5e1" font-size="11.5">Quantizing router gates to 4-bit causes -4.9 pt collapse!</text>

  <rect x="752" y="324" width="376" height="48" rx="8" fill="#0f172a" stroke="#f59e0b"/>
  <text x="768" y="344" fill="#fbbf24" font-size="12" font-weight="700">KV CACHE → FP8 E4M3 (AITER Paged MLA/GQA)</text>
  <text x="768" y="362" fill="#cbd5e1" font-size="11.5">Unlocks 64K–128K context with 105–133 GB free HBM3/GPU</text>

  <!-- Panel 3: Concurrency Scaling & Deployment Architecture -->
  <rect x="48" y="405" width="1104" height="222" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="72" y="437" fill="#e2e8f0" font-size="16" font-weight="700">3. Concurrency Scaling (C=1 → C=64) &amp; Azure Single-Node vs Dual-Node Deployment Architecture</text>

  <!-- Bars -->
  <text x="72" y="468" fill="#cbd5e1" font-size="12.5" font-weight="600">Muse Spark 816B (C=32): 1×Node MXFP4 vs 2×Node BF16</text>
  <rect x="72" y="476" width="380" height="14" rx="4" fill="url(#barMxfp4)"/>
  <text x="460" y="488" fill="#38bdf8" font-size="12" font-weight="700">812.5 tok/s (1×ND96isr MXFP4) vs 342.0 tok/s (2×Node BF16) → 4.75× tok/s per VM!</text>

  <text x="72" y="514" fill="#cbd5e1" font-size="12.5" font-weight="600">Nemotron 3 Ultra 550B (C=32): 1×Node MXFP4 vs 1×Node BF16</text>
  <rect x="72" y="522" width="318" height="14" rx="4" fill="url(#barMxfp4)"/>
  <text x="398" y="534" fill="#34d399" font-size="12" font-weight="700">684.0 tok/s (MXFP4) vs 318.4 tok/s (BF16, OOM at C=64) → 2.15× throughput</text>

  <text x="72" y="560" fill="#cbd5e1" font-size="12.5" font-weight="600">Inkling 975B-A41B (C=32): 1×Node MXFP4 vs 2×Node BF16</text>
  <rect x="72" y="568" width="346" height="14" rx="4" fill="url(#barMxfp4)"/>
  <text x="426" y="580" fill="#38bdf8" font-size="12" font-weight="700">742.0 tok/s (1×ND96isr MXFP4) vs 296.5 tok/s (2×Node BF16) → 5.01× tok/s per VM!</text>

  <text x="72" y="610" fill="#94a3b8" font-size="12">Architecture Stack: Azure AKS / CycleCloud → Standard_ND96isr_MI300X_v5 → ROCm 6.3 + AITER Fused MoE + RCCL xGMI (896 GB/s) → vLLM / SGLang TP=8 EP=8</text>

  <!-- Footer -->
  <text x="48" y="654" fill="#64748b" font-size="12">Provenance: anonymized_reported (independently_reproduced=false) · Sealed Schema v1.0 · turbo998/benchmark-harness-engineering &amp; turbo998/ai-infra-research</text>
</svg>