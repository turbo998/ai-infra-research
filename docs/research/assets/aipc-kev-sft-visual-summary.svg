  <text x="909" y="266" fill="#94a3b8" font-size="11.5">Auto-act precision ≥ 98.4% (&lt;1.5% silent error)</text>

  <rect x="636" y="292" width="492" height="74" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="652" y="314" fill="#38bdf8" font-size="12" font-weight="700">THREE-TIER AUTONOMOUS ACTION GATING</text>
  <text x="652" y="335" fill="#e2e8f0" font-size="12">• <tspan fill="#34d399" font-weight="700">p ≥ 0.80 (Act automatically)</tspan>: 71.2% coverage at 98.4% precision</text>
  <text x="652" y="354" fill="#e2e8f0" font-size="12">• <tspan fill="#fbbf24" font-weight="700">0.55 ≤ p &lt; 0.80 (Confirm)</tspan>: 19.5% one-click UI · <tspan fill="#f87171" font-weight="700">p &lt; 0.55 (Human)</tspan>: 9.3% fallback</text>

