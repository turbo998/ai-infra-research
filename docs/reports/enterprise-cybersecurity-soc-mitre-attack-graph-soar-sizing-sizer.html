<title>#557 企业网络安全运营中心 (SOC) 容量计算器 (Sizer)</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#f8fafc;padding:24px}
.box{max-width:920px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px}
h1{font-size:22px;margin-top:0;color:#38bdf8}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.stat{background:#0f172a;padding:14px;border-radius:8px;border:1px solid #334155}
.stat b{display:block;font-size:22px;color:#10b981}
</style>
</head>
<body>
<div class="box">
  <h1>#557 企业网络安全运营中心 (MITRE 攻击链图谱 + 70B SOAR) 容量计算器</h1>
  <p>基线（500 亿条日志/天）：Sigma/UEBA 过滤 99.8% + MITRE 攻击链图谱 + 70B SOAR 实现 97.2% 无文件攻击检出率、1.8% 误报率，遏制耗时 MTTC 从 185 分钟压至 4.2 分钟（8 张 H200）。</p>
  <div class="row">
    <div class="stat">无文件检出率 / 误报率<b>97.2% · 1.8%</b></div>
    <div class="stat">平均遏制 MTTC / 提速<b>4.2 min · 44.1x</b></div>
    <div class="stat">所需 H200 / 省卡比例<b>8 GPUs · -93.8%</b></div>
  </div>
</div>
