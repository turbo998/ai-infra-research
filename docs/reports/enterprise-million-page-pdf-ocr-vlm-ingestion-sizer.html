<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#658 千万页多模态 PDF 解析入库容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #658 企业千万页多模态 PDF 入库耗时与成本计算器</h1>
    <label><span>PDF 文档总页数 (万页)</span><span id="l-p">1,000 万页</span></label>
    <input type="range" id="r-p" min="100" max="5000" step="100" value="1000" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-hrs">9.7 小时</div><div>单台 8卡节点耗时 (285页/s)</div></div>
      <div class="box"><div class="val" id="o-cost">$1,400</div><div>版面切块路由总成本</div></div>
      <div class="box"><div class="val" id="o-save">-92.4%</div><div>相比整页 72B VLM 节省</div></div>
    </div>
  </div>
<script>
function run() {
  const p = +document.getElementById('r-p').value;
  document.getElementById('l-p').textContent = p.toLocaleString() + ' 万页';
  document.getElementById('o-hrs').textContent = ((p * 10000) / 285 / 3600).toFixed(1) + ' 小时';
  document.getElementById('o-cost').textContent = '$' + Math.round(p * 1.4).toLocaleString();
}
run();
</script>
</body>
</html>
