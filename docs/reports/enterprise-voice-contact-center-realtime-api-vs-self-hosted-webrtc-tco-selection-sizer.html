<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能语音客服中心延迟与分钟成本计算器 (#409)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"], select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 语音客服 M2E 延迟、14% 占空比算卡与分钟成本计算器 (#409)</h1>
    <label>并发通话路数: <strong id="cTxt">1000</strong></label>
    <input type="range" id="c" min="100" max="5000" step="100" value="1000" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="m2e">410 ms</div><div class="l">P95 M2E 口腔到耳朵延迟</div></div>
      <div class="kpi"><div class="v" id="act">140 活跃流</div><div class="l">14% 占空比活跃 LLM 流</div></div>
      <div class="kpi"><div class="v" id="gpu">16x H200</div><div class="l">所需总 GPU 卡数</div></div>
      <div class="kpi"><div class="v" id="min">$0.038 / min</div><div class="l">Tier 4 每分钟成本 (-82.7%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const c = parseInt(document.getElementById('c').value, 10);
      document.getElementById('cTxt').textContent = c;
      document.getElementById('act').textContent = Math.ceil(c * 0.14) + ' 活跃流';
      document.getElementById('gpu').textContent = Math.max(8, Math.ceil(c / 500) * 8) + 'x H200';
    }
    calc();
  </script>
</body>
</html>
