<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 AI 智能编程平台容量与 ROI 计算器 (#414)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级 AI 智能编程平台 GPU 容量与 ROI 计算器 (#414)</h1>
    <label>研发工程师席位数: <strong id="dTxt">2,000 人</strong></label>
    <input type="range" id="d" min="200" max="5000" step="200" value="2000" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="qps">71.5 req/s</div><div class="l">早高峰活跃 FIM QPS</div></div>
      <div class="kpi"><div class="v" id="gpus">12 张 H200</div><div class="l">双轨池所需总卡数</div></div>
      <div class="kpi"><div class="v" id="tco">$498,000 / 年</div><div class="l">双轨池年度总 TCO</div></div>
      <div class="kpi"><div class="v" id="roi">48.2x</div><div class="l">研发工时净 ROI 倍数</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const devs = parseInt(document.getElementById('d').value, 10);
      document.getElementById('dTxt').textContent = devs.toLocaleString() + ' 人';
      const qps = (devs * 0.65 * 0.22) / 4.0;
      const gFim = Math.max(2, Math.ceil(qps / 22));
      const gAgent = Math.max(4, Math.ceil((devs * 0.65 / 720) / 0.25));
      const gTot = gFim + gAgent;
      document.getElementById('qps').textContent = qps.toFixed(1) + ' req/s';
      document.getElementById('gpus').textContent = gTot + ' 张 H200';
      document.getElementById('tco').textContent = '$' + (gTot * 25000 + 198000).toLocaleString() + ' / 年';
    }
    calc();
  </script>
</body>
</html>
