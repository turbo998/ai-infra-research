<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业强化学习后训练 (GRPO vs PPO) 显存计算器 (#425)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 强化学习后训练 (36Ψ PPO vs. 18Ψ GRPO) 显存与成本计算器 (#425)</h1>
    <label>模型参数量 (十亿 B): <strong id="pTxt">70B</strong></label>
    <input type="range" id="p" min="8" max="72" step="8" value="70" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="ppo">2,520 GB (36Ψ)</div><div class="l">传统 PPO 显存需求</div></div>
      <div class="kpi"><div class="v" id="grpo">1,260 GB (18Ψ)</div><div class="l">GRPO + RLVR 显存 (-50%)</div></div>
      <div class="kpi"><div class="v" id="gpus">16 张 H200</div><div class="l">全参 GRPO 所需卡数</div></div>
      <div class="kpi"><div class="v" id="cost">$1,120 / 次</div><div class="l">veRL 单次训练成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const p = parseInt(document.getElementById('p').value, 10);
      document.getElementById('pTxt').textContent = p + 'B';
      document.getElementById('ppo').textContent = (p * 36).toLocaleString() + ' GB (36Ψ)';
      document.getElementById('grpo').textContent = (p * 18).toLocaleString() + ' GB (18Ψ)';
      document.getElementById('gpus').textContent = Math.max(2, Math.ceil((p * 18) / 95)) + ' 张 H200';
      document.getElementById('cost').textContent = '$' + Math.round(p * 16).toLocaleString() + ' / 次';
    }
    calc();
  </script>
</body>
</html>
