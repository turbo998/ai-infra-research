<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#664 企业边缘 AI 算力一体机选型与容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #664 企业网点/门店边缘 AI 一体机选型计算器</h1>
    <label><span>网点并发员工数 (Batch B)</span><span id="l-b">16 人</span></label>
    <input type="range" id="r-b" min="1" max="32" step="1" value="16" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-blk">240 ms</div><div>Blackwell 96GB P95 TTFT</div></div>
      <div class="box"><div class="val" id="o-uni">4,850 ms</div><div>512GB 统一内存 P95 TTFT</div></div>
      <div class="box"><div class="val" id="o-rec">Blackwell 96GB</div><div>当前并发最佳推荐硬件</div></div>
    </div>
  </div>
<script>
function run() {
  const b = +document.getElementById('r-b').value;
  document.getElementById('l-b').textContent = b + ' 人';
  document.getElementById('o-blk').textContent = Math.round(35 + 12.8 * b) + ' ms';
  document.getElementById('o-uni').textContent = Math.round(303 * b).toLocaleString() + ' ms';
  document.getElementById('o-rec').textContent = b === 1 ? '512G 统一内存 / 96G' : 'Blackwell 96GB';
}
run();
</script>
</body>
</html>
