<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#616 EdTech Socratic Tutor &amp; Exam Burst Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#616 EdTech Socratic Tutor, SymPy STEM Verifier &amp; Evening Burst Sizer</h1>
    <p>Interactive capacity calculator for K-12/University AI tutoring platforms with 19:00–22:00 homework spikes.</p>
    <label>Evening Peak Homework QPS: <span id="qVal">800</span> QPS</label>
    <input type="range" id="q" min="100" max="3000" step="50" value="800" />
    <label>Curriculum Prefix Cache Hit Rate: <span id="cVal">84</span>%</label>
    <input type="range" id="c" min="20" max="95" step="2" value="84" />
    <p>Hybrid Base + 3h Spot Burst Monthly TCO: <span class="val" id="outCost">$30,300 / mo</span> (vs. <span id="outPeak">$147,200 / mo</span> 24×7 peak H100s)</p>
  </div>
  <script>
    function calc(){
      const q = +document.getElementById('q').value;
      const c = +document.getElementById('c').value / 100;
      document.getElementById('qVal').textContent = q;
      document.getElementById('cVal').textContent = Math.round(c*100);
      const eff = 3500*(1-c) + 240;
      const peakCost = Math.max(8, Math.ceil((q/12.5)*Math.sqrt(eff/800))) * 2300;
      const optCost = Math.round((Math.max(2, Math.ceil(q/100))*850 + Math.max(2, Math.ceil(q/200))*3200) + (q/800)*10700*(eff/800));
      document.getElementById('outCost').textContent = '$' + optCost.toLocaleString() + ' / mo';
      document.getElementById('outPeak').textContent = '$' + peakCost.toLocaleString() + ' / mo';
    }
    document.getElementById('q').addEventListener('input', calc);
    document.getElementById('c').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
