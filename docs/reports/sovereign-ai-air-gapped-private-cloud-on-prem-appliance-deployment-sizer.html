<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>主权 AI 与物理隔离内网 (Air-Gapped Sovereign AI) 交付工期与运维成本计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #6EE7B7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #38BDF8; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #6EE7B7; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>主权 AI 与物理隔离内网（Air-Gapped Sovereign Cloud）多网点交付工期与 TCO 计算器</h1>
  <div class="grid">
    <div class="control">
      <label>物理隔离交付网点数 <span id="v_sites" class="val">10</span></label>
      <input type="range" id="sites" min="1" max="50" step="1" value="10" oninput="calc()">
    </div>
    <div class="control">
      <label>单网点 GPU 节点数 <span id="v_nodes" class="val">8</span></label>
      <input type="range" id="nodes" min="2" max="32" step="2" value="8" oninput="calc()">
    </div>
    <div class="control">
      <label>每年模型与引擎升级次数 <span id="v_up" class="val">6 次/年</span></label>
      <input type="range" id="up" min="1" max="24" step="1" value="6" oninput="calc()">
    </div>
    <div class="control">
      <label>物理隔离交付架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 直接搬运公有云 Manifest 进内网排障</option>
        <option value="2">Tier 2: 裸金属手工脚本 + U盘拷包雪花集群</option>
        <option value="3">Tier 3: 封闭绑定黑盒硬件一体机 (高溢价)</option>
        <option value="4" selected>Tier 4: Zarf/Hauler 声明式离线包 + 内网 Harbor/HF (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>单网点首次交付耗时</div><div id="k_hrs" class="num">4.5 hrs</div></div>
    <div class="kpi"><div>首次启动缺包报错率</div><div id="k_err" class="num">0.0%</div></div>
    <div class="kpi"><div>全网点累计驻场人天</div><div id="k_days" class="num">18 人天/年</div></div>
    <div class="kpi"><div>年化交付与运维总成本</div><div id="k_cost" class="num">$95,000</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const sites = parseFloat(document.getElementById('sites').value);
  const nodes = parseFloat(document.getElementById('nodes').value);
  const up = parseFloat(document.getElementById('up').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_sites').textContent = sites;
  document.getElementById('v_nodes').textContent = nodes;
  document.getElementById('v_up').textContent = up + ' 次/年';

  const scale = (sites / 10.0) * (0.7 + (nodes / 8.0) * 0.3) * (0.6 + (up / 6.0) * 0.4);
  let hrs = 4.5, err = 0.0, days = 18, baseCost = 95000;
  if (mode === '1') {
    hrs = 504.0;
    err = 92.0;
    days = Math.round(420 * scale);
    baseCost = 680000;
  } else if (mode === '2') {
    hrs = 120.0;
    err = 38.0;
    days = Math.round(240 * scale);
    baseCost = 420000;
  } else if (mode === '3') {
    hrs = 16.0;
    err = 4.0;
    days = Math.round(35 * scale);
    baseCost = 890000;
  } else {
    hrs = 4.5;
    err = 0.0;
    days = Math.round(18 * scale);
    baseCost = 95000;
  }
  const cost = Math.round(baseCost * scale);
  document.getElementById('k_hrs').textContent = hrs + ' hrs';
  document.getElementById('k_err').textContent = err + '%';
  document.getElementById('k_days').textContent = days + ' 人天/年';
  document.getElementById('k_cost').textContent = '$' + cost.toLocaleString();
}
calc();
</script>
</body>
</html>
