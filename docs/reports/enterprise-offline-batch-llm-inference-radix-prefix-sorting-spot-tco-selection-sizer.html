<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Offline Batch LLM Radix Sorting & Spot TCO Sizer (#474)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Offline Batch LLM Radix Sorting &amp; Spot Sizer (#474)</h1>
    <label>Offline Dataset Volume (Billion Tokens): <span id="tLbl">10</span>B</label>
    <input type="range" id="toks" min="1" max="100" step="1" value="10" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const toksEl = document.getElementById('toks');
    function calc() {
      const b = parseFloat(toksEl.value);
      document.getElementById('tLbl').textContent = b;
      document.getElementById('res').textContent = `Online Pool Cost: $${(b*340).toLocaleString()} | Cloud 50%-Off Batch API: $${(b*170).toLocaleString()} | Radix-Sorted Spot GPUs: $${(b*28).toLocaleString()} (-91.8%)`;
    }
    toksEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
