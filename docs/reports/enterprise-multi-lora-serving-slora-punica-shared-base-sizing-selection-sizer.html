<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Multi-LoRA Serving (S-LoRA / Punica) Sizer (#517)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Multi-LoRA Shared-Base Sizer (#517)</h1>
    <label>Number of Fine-Tuned 70B LoRA Adapters: <span id="nLbl">64</span> Adapters</label>
    <input type="range" id="loras" min="8" max="128" step="8" value="64" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const lorasEl = document.getElementById('loras');
    function calc() {
      const n = parseInt(lorasEl.value, 10);
      document.getElementById('nLbl').textContent = n;
      const mergedGpus = n * 2;
      const savePct = ((1 - 8 / mergedGpus) * 100).toFixed(1);
      document.getElementById('res').textContent =
        `Dedicated Merged Pods: ${mergedGpus}x H200 GPUs (${n * 70} GB weight HBM) | vLLM / SGLang S-LoRA Shared Base Pool: 8x H200 GPUs (-${savePct}% GPUs, 140 GB Base + ${(n * 0.42).toFixed(1)} GB LoRAs, 2.8ms Pinned-DRAM Swap, 14.9ms P99 TPOT 🏆)`;
    }
    lorasEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
