<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#635 Milestone: 1,024-GPU Enterprise AI Factory BoM &amp; 3-Year TCO Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#635 Milestone: `1,024-GPU` AI Factory BoM &amp; 3-Year TCO Sizer</h1>
    <label>Cluster Scale: <span id="gVal">1,024</span> GPUs</label>
    <input type="range" id="g" min="256" max="2048" step="256" value="1024" />
    <p>3-Year Optimized TCO: <span class="val" id="outOpt">$45,800,000 (-38.3% vs $74,200,000 Legacy)</span> · Net Saved: <span class="val" id="outSave">$28,400,000</span></p>
  </div>
  <script>
    function calc(){
      const g = +document.getElementById('g').value;
      document.getElementById('gVal').textContent = g.toLocaleString();
      const s = g / 1024;
      const opt = Math.round(45800000 * s);
      const leg = Math.round(74200000 * s);
      const sav = leg - opt;
      document.getElementById('outOpt').textContent = '$' + opt.toLocaleString() + ' (-38.3% vs $' + leg.toLocaleString() + ' Legacy)';
      document.getElementById('outSave').textContent = '$' + sav.toLocaleString();
    }
    document.getElementById('g').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
