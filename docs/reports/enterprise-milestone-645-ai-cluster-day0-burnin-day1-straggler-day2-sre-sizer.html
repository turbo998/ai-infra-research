<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>🏆 #645 智算集群 Day-0 验收与 Day-2 自愈可用性计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#FDE68A; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #645 智算集群 Day-0 验收与 Day-2 自动自愈收益计算器</h1>
    <label><span>集群总卡数 (GPUs)</span><span id="l-g">1,024 GPUs</span></label>
    <input type="range" id="r-g" min="128" max="4096" step="128" value="1024" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-doa">39 张</div><div>Day-0 拦截出厂隐患卡 (3.8%)</div></div>
      <div class="box"><div class="val" id="o-saved">133× H200</div><div>全年挽回等效算力卡数</div></div>
      <div class="box"><div class="val" id="o-usd">$391.0万/年</div><div>全年挽回算力折旧价值</div></div>
    </div>
  </div>
<script>
function run() {
  const g = +document.getElementById('r-g').value;
  document.getElementById('l-g').textContent = g.toLocaleString() + ' GPUs';
  const doa = Math.round(g * 0.038);
  const saved = Math.round(g * 0.13);
  const usd = (saved * 2.94).toFixed(1);
  document.getElementById('o-doa').textContent = doa + ' 张';
  document.getElementById('o-saved').textContent = saved + '× H200';
  document.getElementById('o-usd').textContent = '$' + usd + '万/年';
}
run();
</script>
</body>
</html>
