<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #500: AI Infra Solution Architect Master Encyclopedia Sizer (#500)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #500: AI Infra Solution Architect Master TCO Sizer (#500)</h1>
    <label>Enterprise Total Traffic (`RPS`): <span id="rLbl">100</span> RPS</label>
    <input type="range" id="rps" min="25" max="500" step="25" value="100" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const rpsEl = document.getElementById('rps');
    function calc() {
      const r = parseInt(rpsEl.value, 10);
      document.getElementById('rLbl').textContent = r;
      const t1 = (28.5 * r / 100).toFixed(1);
      const t4 = (5.8 * r / 100).toFixed(1);
      const sav = (22.7 * r / 100).toFixed(1);
      document.getElementById('res').textContent = `Level 1 Ad-Hoc Silos: $${t1}M ($0.680/1M) | Level 4 Milestone #500 Full-Stack AI Factory: $${t4}M (-79.6%, Saves $${sav}M over 3 Years, $0.028/1M Tokens, 91.2% Goodput)`;
    }
    rpsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
