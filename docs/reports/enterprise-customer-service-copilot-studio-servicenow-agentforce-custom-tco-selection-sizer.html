<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业客服与 ITSM 智能体 TCO 计算器 (#421)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级客服与 ITSM 82/18 混合架构 TCO 计算器 (#421)</h1>
    <label>月度客服会话数 (万次): <strong id="cTxt">300 万次/月</strong></label>
    <input type="range" id="c" min="10" max="600" step="10" value="300" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="def">86.4%</div><div class="l">端到端自助解决率</div></div>
      <div class="kpi"><div class="v" id="aht">2.8 分钟</div><div class="l">转人工平均处理时长</div></div>
      <div class="kpi"><div class="v" id="unit">$0.018 / 次</div><div class="l">82/18 混合会话单价</div></div>
      <div class="kpi"><div class="v" id="tco">$54,000 / 月</div><div class="l">月度平台总 TCO (-96%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const c = parseInt(document.getElementById('c').value, 10);
      document.getElementById('cTxt').textContent = c + ' 万次/月';
      document.getElementById('tco').textContent = '$' + Math.round(c * 180).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
