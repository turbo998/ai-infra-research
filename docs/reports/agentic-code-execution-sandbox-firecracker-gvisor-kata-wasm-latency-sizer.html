<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Agent 安全代码沙箱 (Firecracker vs. gVisor vs. Kata) 容量与延迟计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #6EE7B7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #38BDF8; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #6EE7B7; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>大模型 Agent 代码执行沙箱（Firecracker / gVisor / Kata）容量与 TCO 计算器</h1>
  <div class="grid">
    <div class="control">
      <label>每秒代码沙箱调用率 (Exec/s) <span id="v_eps" class="val">500</span></label>
      <input type="range" id="eps" min="50" max="3000" step="50" value="500" oninput="calc()">
    </div>
    <div class="control">
      <label>单次沙箱平均驻留时长 (秒) <span id="v_dur" class="val">3.2s</span></label>
      <input type="range" id="dur" min="0.5" max="15.0" step="0.5" value="3.2" oninput="calc()">
    </div>
    <div class="control">
      <label>预加载基础镜像体积 (MB) <span id="v_img" class="val">512</span></label>
      <input type="range" id="img" min="128" max="2048" step="128" value="512" oninput="calc()">
    </div>
    <div class="control">
      <label>沙箱隔离与启动架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 普通 Docker 容器 (runc 共享内核 - 不合规)</option>
        <option value="2">Tier 2: 每次冷启动独立 VM / 无快照 Kata</option>
        <option value="3">Tier 3: K8s gVisor (runsc 用户态内核) 预热池</option>
        <option value="4" selected>Tier 4: Firecracker MicroVM + 快照热恢复 + CoW (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>沙箱启动/恢复延迟</div><div id="k_lat" class="num">28.0 ms</div></div>
    <div class="kpi"><div>单沙箱独占内存 (RSS)</div><div id="k_rss" class="num">68 MB</div></div>
    <div class="kpi"><div>所需 64vCPU 物理母机数</div><div id="k_hosts" class="num">7 台</div></div>
    <div class="kpi"><div>月度沙箱集群成本</div><div id="k_tco" class="num">$16,800</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const eps = parseFloat(document.getElementById('eps').value);
  const dur = parseFloat(document.getElementById('dur').value);
  const img = parseFloat(document.getElementById('img').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_eps').textContent = eps;
  document.getElementById('v_dur').textContent = dur + 's';
  document.getElementById('v_img').textContent = img;

  const activeBoxes = eps * dur;
  let lat = 28.0, rss = 68, perHost = 260;
  if (mode === '1') {
    lat = 180.0;
    rss = Math.round(img * 0.47);
    perHost = Math.max(20, Math.floor(220000 / rss));
  } else if (mode === '2') {
    lat = +(1600 + img * 1.66).toFixed(1);
    rss = Math.round(img * 1.25);
    perHost = Math.max(10, Math.floor(245000 / rss));
  } else if (mode === '3') {
    lat = 45.0;
    rss = Math.round(img * 0.32);
    perHost = Math.max(20, Math.floor(190000 / rss));
  } else {
    lat = 28.0;
    rss = Math.round(img * 0.133);
    perHost = Math.max(30, Math.floor(180000 / rss));
  }
  const hosts = Math.max(2, Math.ceil(activeBoxes / perHost));
  const tco = hosts * 2400;
  document.getElementById('k_lat').textContent = lat + ' ms';
  document.getElementById('k_rss').textContent = rss + ' MB';
  document.getElementById('k_hosts').textContent = hosts + ' 台';
  document.getElementById('k_tco').textContent = '$' + tco.toLocaleString();
}
calc();
</script>
</body>
</html>
