<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #480: Vertical Industry AI Infra Master Sizer (#480)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #480: Vertical Industry AI Infrastructure Sizer (#480)</h1>
    <label>Select Target Vertical Industry:</label>
    <select id="ind">
      <option value="64x H200 (Dual-Region 60/60 Active + PPCIE TEE) | $0.16/1M (-68.4% TCO)">1. Banking &amp; Quant Finance</option>
      <option value="2x RTX PRO 6000 96GB or 4x H200 NVL (&lt;3.2kW Air + E-P-D VLM) | $0.14/1M (-64.0% TCO)">2. Healthcare &amp; Clinical Imaging</option>
      <option value="32x L40S (ASR/TTS) + 96x H200 (LLM) for 10,240 Calls | $0.068/hr (-83.8% TCO)">3. Telecom &amp; 10k-Seat Contact Center</option>
      <option value="1,024x H200/B200 + 48x 400G Switches + 3FS + xDiT | $0.095/1M (-58.2% TCO)">4. Automotive ADAS &amp; World Models</option>
      <option value="16x H200 (S-LoRA) + DiskANN 1B RAG + 16x Spot (Radix Batch) | $0.082/1M (-88.5% TCO)">5. Retail, E-Commerce &amp; SaaS</option>
      <option value="64x H200/MI325X (7:1 Hybrid 256K) + 3,072 Firecracker vCPUs | $0.13/1M (-74.0% TCO)">6. Government &amp; Sovereign Cloud</option>
    </select>
    <div class="out" id="res"></div>
  </div>
  <script>
    const indEl = document.getElementById('ind');
    function calc() {
      document.getElementById('res').textContent = `Reference Blueprint: ${indEl.value}`;
    }
    indEl.addEventListener('change', calc);
    calc();
  </script>
</body>
</html>
