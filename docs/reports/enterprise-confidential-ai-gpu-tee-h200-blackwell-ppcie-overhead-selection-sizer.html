<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Confidential AI (GPU TEE & PPCIE) Overhead Sizer (#469)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Confidential AI GPU TEE Overhead Sizer (#469)</h1>
    <label>Encrypted Model Weights (GB): <span id="wLbl">70</span> GB</label>
    <input type="range" id="w" min="16" max="685" step="16" value="70" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const wEl = document.getElementById('w');
    function calc() {
      const w = parseFloat(wEl.value);
      document.getElementById('wLbl').textContent = w;
      const mode = w <= 95 ? 'Single H200 (141GB) TP=1 TEE (-4.2% overhead)' : '8x H200/B200 PPCIE / TEE-I/O (-3.8% overhead)';
      document.getElementById('res').textContent = `Recommended TEE Mode: ${mode} | Cryptographic Attestation: SPDM + NRAS Enabled`;
    }
    wEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
