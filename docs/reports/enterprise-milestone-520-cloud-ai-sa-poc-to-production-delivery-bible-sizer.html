<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #520: Cloud &amp; AI SA 5-Stage Delivery Sizer</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #520: Cloud &amp; AI SA 5-Stage Master Delivery Sizer</h1>
    <label>Enterprise Platform Traffic (`RPS`): <span id="rLbl">100</span> RPS</label>
    <input type="range" id="rps" min="25" max="400" step="25" value="100" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const rpsEl = document.getElementById('rps');
    function calc() {
      const r = parseInt(rpsEl.value, 10);
      document.getElementById('rLbl').textContent = r;
      const g0 = Math.ceil(192 * r / 100);
      const g2 = Math.max(4, Math.ceil(24 * r / 100));
      document.getElementById('res').textContent =
        `Stage 0 Unoptimized Legacy Stack: ${g0}x H200 ($0.640/1M, 64.0ms P99 TPOT, 51.0% Goodput) | Milestone #520 Full 5-Stage SA Blueprint: ${g2}x H200 GPUs (-87.5% GPUs, $0.036/1M [17.78x cheaper], 11.8ms P99 TPOT, 99.4% Goodput 🏆)`;
    }
    rpsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
