<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单机 HGX vs. 多机 RDMA vs. NVL72 超节点计算器 (#402)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 单机 8xH200 vs. 多机 B200 RDMA vs. GB200 NVL72 超节点计算器 (#402)</h1>
    <label>选择硬件平台：</label>
    <select id="t" onchange="calc()">
      <option value="4" selected>Tier 4: GB200 NVL72 机柜超节点 (72卡铜背板 · 132kW DLC)</option>
      <option value="3">Tier 3: 多机 32x HGX B200 + 400G/800G RDMA (48kW)</option>
      <option value="2">Tier 2: 单机 8x H200 141GB 紧凑一体机 (10.5kW 风冷)</option>
      <option value="1">Tier 1: 双机 16x H100 80GB (22kW 风冷)</option>
    </select>
    <div class="kpis">
      <div class="kpi"><div class="v" id="kw">132 kW (DLC)</div><div class="l">机柜功耗与冷却</div></div>
      <div class="kpi"><div class="v" id="tpot">4.8 ms</div><div class="l">P99 TPOT</div></div>
      <div class="kpi"><div class="v" id="gp">7,420 tok/s</div><div class="l">单卡达标 Goodput</div></div>
      <div class="kpi"><div class="v" id="cost">$0.12 / 1M</div><div class="l">百万 Token 成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const m = {
        '1': ['22 kW (风冷)', '24.5 ms', '920 tok/s', '$0.58 / 1M'],
        '2': ['10.5 kW (风冷)', '14.6 ms', '1,850 tok/s', '$0.29 / 1M'],
        '3': ['48 kW (风液)', '8.4 ms', '4,120 tok/s', '$0.19 / 1M'],
        '4': ['132 kW (DLC)', '4.8 ms', '7,420 tok/s', '$0.12 / 1M']
      }[document.getElementById('t').value];
      document.getElementById('kw').textContent = m[0];
      document.getElementById('tpot').textContent = m[1];
      document.getElementById('gp').textContent = m[2];
      document.getElementById('cost').textContent = m[3];
    }
    calc();
  </script>
</body>
</html>
