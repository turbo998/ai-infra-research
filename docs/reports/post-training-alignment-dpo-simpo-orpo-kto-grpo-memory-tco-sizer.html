<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post-Training Alignment (DPO / SimPO / KTO / GRPO) Sizer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; }
  h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 18px 0; }
  .ctrl { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  select, input { width: 100%; padding: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: #94a3b8; }
  .card .val { font-size: 24px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive Post-Training Alignment (`DPO / SimPO / KTO / GRPO`) Sizer (#376)</h1>
  <p style="color:#94a3b8;font-size:14px;">Provenance: synthetic + anonymized_reported (independently_reproduced=false)</p>
  <div class="grid">
    <div class="ctrl">
      <label>Alignment Algorithm &amp; Kernel Tier</label>
      <select id="tier" onchange="calc()">
        <option value="1">Tier 1: Naive Online-Reference DPO</option>
        <option value="2">Tier 2: Precomputed-Ref DPO</option>
        <option value="3">Tier 3: SimPO / KTO + Liger Fused Loss</option>
        <option value="4" selected>Tier 4: Two-Stage SimPO (Liger) -&gt; Online GRPO</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Model Size (Billion Params)</label>
      <select id="params" onchange="calc()">
        <option value="8">8B Dense</option>
        <option value="32">32B Dense</option>
        <option value="70" selected>70B Dense</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Preference Dataset Size (Pairs)</label>
      <input type="number" id="pairs" value="50000" min="5000" max="500000" step="5000" oninput="calc()">
    </div>
  </div>
  <div class="cards">
    <div class="card"><h3>Peak HBM / GPU (16x H100)</h3><div class="val" id="hbm">56.8 GB</div></div>
    <div class="card"><h3>Training Throughput Speedup</h3><div class="val" id="speed">1.72x</div></div>
    <div class="card"><h3>Alignment &amp; Reasoning Score</h3><div class="val" id="score">92.8%</div></div>
    <div class="card"><h3>Estimated Run Compute Cost</h3><div class="val" id="cost">$3,450</div></div>
  </div>
</div>
<script>
function calc() {
  const tier = parseInt(document.getElementById('tier').value, 10);
  const params = parseFloat(document.getElementById('params').value) || 70;
  const pairs = parseFloat(document.getElementById('pairs').value) || 50000;
  const pScale = params / 70.0;
  const dScale = pairs / 50000.0;
  const hbm = ({1: 102.5, 2: 72.0, 3: 54.2, 4: 56.8}[tier]) * pScale;
  const speed = {1: 1.00, 2: 1.48, 3: 1.89, 4: 1.72}[tier];
  const score = {1: 81.2, 2: 81.5, 3: 84.6, 4: 92.8}[tier];
  const cost = Math.round(({1: 4600, 2: 3100, 3: 1850, 4: 3450}[tier]) * pScale * dScale);
  document.getElementById('hbm').textContent = hbm.toFixed(1) + ' GB' + (hbm > 78 ? ' (OOM!)' : '');
  document.getElementById('speed').textContent = speed.toFixed(2) + 'x';
  document.getElementById('score').textContent = score.toFixed(1) + '%';
  document.getElementById('cost').textContent = '$' + cost.toLocaleString();
}
calc();
</script>
</body>
</html>
