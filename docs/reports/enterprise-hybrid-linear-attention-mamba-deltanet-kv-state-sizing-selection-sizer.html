<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Hybrid Linear-Attention / Mamba KV & State Sizer (#478)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise 7:1 Hybrid Linear-Full Attention Memory Sizer (#478)</h1>
    <label>Context Sequence Length (`K` Tokens): <span id="sLbl">256</span>K</label>
    <input type="range" id="seq" min="64" max="1024" step="64" value="256" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const seqEl = document.getElementById('seq');
    function calc() {
      const k = parseInt(seqEl.value, 10);
      document.getElementById('sLbl').textContent = k;
      const fullGb = (40.96 * k / 256).toFixed(2);
      const hybGb = (5.12 * k / 256 + 0.14).toFixed(2);
      document.getElementById('res').textContent = `Pure GQA-8 Memory: ${fullGb} GB/req | 7:1 Hybrid Linear-Full Memory: ${hybGb} GB/req (-87.2%) | Needle Recall = 99.1%`;
    }
    seqEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
