<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Three-Watermark GPU Capacity &amp; TPM/TPS/PTU Sizer (#511)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Three-Watermark GPU &amp; TPM/TPS/PTU Sizer (#511)</h1>
    <label>Peak Request Rate (`QPS`): <span id="qLbl">30</span> QPS</label>
    <input type="range" id="qps" min="10" max="100" step="10" value="30" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const qpsEl = document.getElementById('qps');
    function calc() {
      const q = parseInt(qpsEl.value, 10);
      document.getElementById('qLbl').textContent = q;
      const inTpm = ((q * 8192 * 60) / 1e6).toFixed(2);
      const outTpm = ((q * 512 * 60) / 1e6).toFixed(2);
      const conc = Math.round(q * 7.5);
      const colGpus = Math.max(4, Math.ceil((20 * q / 30) / 4) * 4);
      const optGpus = Math.max(4, Math.ceil((12 * q / 30) / 4) * 4);
      document.getElementById('res').textContent =
        `Input TPM: ${inTpm}M | Output TPM: ${outTpm}M | Little's Law Concurrency: ${conc} active reqs | Colocated 3-Watermark: ${colGpus}x H200 | PD + 70% Radix + MTP 3-Watermark: ${optGpus}x H200 (-40.0% GPUs, 99.2% Goodput 🏆)`;
    }
    qpsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
