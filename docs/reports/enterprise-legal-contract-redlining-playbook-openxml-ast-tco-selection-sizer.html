<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业法务合同智能审查与修订 TCO 计算器 (#431)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级法务合同 AST 审查与 OpenXML 修订计算器 (#431)</h1>
    <label>年度审查合同总数: <strong id="cTxt">50,000 份/年</strong></label>
    <input type="range" id="c" min="5000" max="150000" step="5000" value="50000" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="rec">98.8%</div><div class="l">跨章毒丸条款召回率</div></div>
      <div class="kpi"><div class="v" id="acc">94.6%</div><div class="l">词级修订一键采纳率</div></div>
      <div class="kpi"><div class="v" id="hrs">105,000 小时</div><div class="l">年省法务律师工时</div></div>
      <div class="kpi"><div class="v" id="tco">$58,000 / 年</div><div class="l">年度平台总 TCO (-86.2%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const c = parseInt(document.getElementById('c').value, 10);
      document.getElementById('cTxt').textContent = c.toLocaleString() + ' 份/年';
      document.getElementById('hrs').textContent = Math.round(c * 2.1).toLocaleString() + ' 小时';
      document.getElementById('tco').textContent = '$' + Math.round(58000 * (c / 50000)).toLocaleString() + ' / 年';
    }
    calc();
  </script>
</body>
</html>
