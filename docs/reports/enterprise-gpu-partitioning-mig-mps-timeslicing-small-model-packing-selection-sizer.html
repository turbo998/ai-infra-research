<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Fractional GPU Partitioning (MIG vs. MPS) Sizer (#481)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Fractional GPU MIG Packing Sizer (#481)</h1>
    <label>Number of Small Satellite AI Microservices (0.5B–4B): <span id="sLbl">14</span></label>
    <input type="range" id="svcs" min="7" max="56" step="7" value="14" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const svcsEl = document.getElementById('svcs');
    function calc() {
      const s = parseInt(svcsEl.value, 10);
      document.getElementById('sLbl').textContent = s;
      const gpus = Math.ceil(s / 7);
      document.getElementById('res').textContent = `Whole-GPU Allocation: ${s}x H200 ($${(s*1800).toLocaleString()}/mo) | Hardware MIG (1g.18gb): ${gpus}x H200 ($${(gpus*1800).toLocaleString()}/mo, -85.7% cost)`;
    }
    svcsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
