<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Inference Determinism &amp; Batch-Invariance Sizer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; }
  h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 18px 0; }
  .ctrl { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  select, input { width: 100%; padding: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: #94a3b8; }
  .card .val { font-size: 24px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive LLM Inference Determinism &amp; Batch-Invariance Sizer (#375)</h1>
  <p style="color:#94a3b8;font-size:14px;">Provenance: synthetic + anonymized_reported (independently_reproduced=false)</p>
  <div class="grid">
    <div class="ctrl">
      <label>Determinism Architecture Tier</label>
      <select id="tier" onchange="calc()">
        <option value="1">Tier 1: Standard Dynamic Continuous Batching</option>
        <option value="2">Tier 2: PyTorch Deterministic (Batch-Variant)</option>
        <option value="3">Tier 3: Dummy-Padded Fixed Bucket Batching</option>
        <option value="4" selected>Tier 4: Batch-Invariant Deterministic Mode</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Generated Output Sequence Length (Tokens)</label>
      <input type="number" id="len" value="1000" min="50" max="8192" step="50" oninput="calc()">
    </div>
    <div class="ctrl">
      <label>Tensor Parallelism Degree (TP)</label>
      <select id="tp" onchange="calc()">
        <option value="1">TP=1 (Single GPU)</option>
        <option value="4">TP=4 (Intra-Node NVLink)</option>
        <option value="8" selected>TP=8 (Full Node AllReduce)</option>
      </select>
    </div>
  </div>
  <div class="cards">
    <div class="card"><h3>Bitwise Exact Match Rate</h3><div class="val" id="repro">100.0%</div></div>
    <div class="card"><h3>Output Divergence Rate</h3><div class="val" id="div">0.0%</div></div>
    <div class="card"><h3>Throughput Overhead</h3><div class="val" id="ovh">6.5%</div></div>
    <div class="card"><h3>Regulatory Audit Compliance</h3><div class="val" id="audit">PASS (Bitwise)</div></div>
  </div>
</div>
<script>
function calc() {
  const tier = parseInt(document.getElementById('tier').value, 10);
  const len = parseFloat(document.getElementById('len').value) || 1000;
  const tp = parseInt(document.getElementById('tp').value, 10) || 8;
  const scale = Math.min(3.0, len / 1000.0) * (tp > 1 ? 1.0 : 0.75);
  const div = tier === 4 ? 0.0 : Math.min(95.0, ({1: 18.5, 2: 11.2, 3: 1.8}[tier]) * scale);
  const repro = 100.0 - div;
  const ovh = {1: 0.0, 2: 4.2, 3: 34.0, 4: 6.5}[tier];
  document.getElementById('repro').textContent = repro.toFixed(1) + '%';
  document.getElementById('div').textContent = div.toFixed(1) + '%';
  document.getElementById('ovh').textContent = '+' + ovh.toFixed(1) + '%';
  document.getElementById('audit').textContent = tier === 4 ? 'PASS (Bitwise)' : 'FAIL (Drift)';
}
calc();
</script>
</body>
</html>
