<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#663 GraphRAG vs LazyGraphRAG 建库与查询成本计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #663 企业知识图谱 RAG (LazyGraphRAG) 容量计算器</h1>
    <label><span>知识库切片规模 (百万 Chunks)</span><span id="l-c">10M 块</span></label>
    <input type="range" id="r-c" min="1" max="50" step="1" value="10" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-full">$18,000</div><div>全量 LLM GraphRAG 建库费</div></div>
      <div class="box"><div class="val" id="o-lazy">$160</div><div>LazyGraphRAG 建库费 (-99.1%)</div></div>
      <div class="box"><div class="val" id="o-q">$0.0024/次</div><div>82/18 路由单次查询成本</div></div>
    </div>
  </div>
<script>
function run() {
  const c = +document.getElementById('r-c').value;
  document.getElementById('l-c').textContent = c + 'M 块';
  document.getElementById('o-full').textContent = '$' + (c * 1800).toLocaleString();
  document.getElementById('o-lazy').textContent = '$' + (c * 16).toLocaleString();
}
run();
</script>
</body>
</html>
