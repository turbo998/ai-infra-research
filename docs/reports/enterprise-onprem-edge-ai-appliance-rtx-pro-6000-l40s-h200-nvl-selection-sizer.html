<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise On-Premises Edge AI Appliance Sizer (#476)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise On-Premises Edge AI Appliance Sizer (#476)</h1>
    <label>Target Concurrent Branch Users (32K Context): <span id="uLbl">40</span></label>
    <input type="range" id="users" min="10" max="220" step="10" value="40" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const usersEl = document.getElementById('users');
    function calc() {
      const u = parseInt(usersEl.value, 10);
      document.getElementById('uLbl').textContent = u;
      let pick = '2x RTX PRO 6000 Blackwell 96GB ($26,500, 1,650W)';
      if (u > 96) pick = '4x NVIDIA H200 NVL 141GB ($132,000, 3,100W)';
      else if (u > 42) pick = '2x NVIDIA H200 NVL 141GB ($68,000, 1,700W)';
      document.getElementById('res').textContent = `Recommended Air-Cooled Appliance: ${pick}`;
    }
    usersEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
