<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #505: Enterprise LLM Evaluation & CI/CD Gate Sizer (#505)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #505: Enterprise LLM Evaluation &amp; CI/CD Gate Sizer (#505)</h1>
    <label>Monthly Model / Prompt Releases: <span id="rLbl">30</span> Releases/Mo</label>
    <input type="range" id="rels" min="5" max="100" step="5" value="30" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const relsEl = document.getElementById('rels');
    function calc() {
      const r = parseInt(relsEl.value, 10);
      document.getElementById('rLbl').textContent = r;
      document.getElementById('res').textContent = `50k Brute-Force Cloud Judge: $${(1250*r).toLocaleString()}/mo (390m/PR, Kappa=0.51) | 3-Stage Stratified Gate + Binary 14B Judge + 1% Shadow: $${Math.round(3.4*r).toLocaleString()}/mo (-99.7%, 2.8m/PR, Kappa=0.89, 98.4% Catch Rate)`;
    }
    relsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
