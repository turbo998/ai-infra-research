<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>企业级 MCP 与 A2A 多智能体网关 (Tool RAG / Code Mode) 容量与延迟计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #38BDF8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>企业级 MCP 与 A2A 协议网关（语义工具检索 Top-12 + Code-Mode 批量编排）TCO 计算器</h1>
  <div class="grid">
    <div class="control">
      <label>企业注册 MCP 工具总数 <span id="v_tools" class="val">400</span></label>
      <input type="range" id="tools" min="40" max="1000" step="20" value="400" oninput="calc()">
    </div>
    <div class="control">
      <label>单任务平均工具调用次数 <span id="v_steps" class="val">8</span></label>
      <input type="range" id="steps" min="2" max="20" step="1" value="8" oninput="calc()">
    </div>
    <div class="control">
      <label>月度 Agent 任务量 (万次) <span id="v_tasks" class="val">80万</span></label>
      <input type="range" id="tasks" min="10" max="300" step="10" value="80" oninput="calc()">
    </div>
    <div class="control">
      <label>MCP / A2A 编排架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 全量工具每轮硬塞 + 串行 LLM 往返</option>
        <option value="2">Tier 2: 纯 A2A 多子 Agent 层级委派</option>
        <option value="3">Tier 3: MCP Gateway + Top-12 工具检索 (串行)</option>
        <option value="4" selected>Tier 4: MCP/A2A 网关 + Top-12 检索 + Code-Mode 批量 (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>单任务消耗 Prompt Tokens</div><div id="k_tok" class="num">8,400</div></div>
    <div class="kpi"><div>端到端任务 P95 延迟</div><div id="k_lat" class="num">4.2 sec</div></div>
    <div class="kpi"><div>工具与参数准确率</div><div id="k_acc" class="num">96.6%</div></div>
    <div class="kpi"><div>月度平台总成本 (TCO)</div><div id="k_tco" class="num">$16,500</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const tools = parseFloat(document.getElementById('tools').value);
  const steps = parseFloat(document.getElementById('steps').value);
  const tasks = parseFloat(document.getElementById('tasks').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_tools').textContent = tools;
  document.getElementById('v_steps').textContent = steps;
  document.getElementById('v_tasks').textContent = tasks + '万';

  let tok = 8400, lat = 4.2, acc = 96.6;
  if (mode === '1') {
    tok = steps * (tools * 120 + 1000);
    lat = +(steps * (1.8 + tools * 0.0032)).toFixed(1);
    acc = Math.max(35.0, +(88.0 - tools * 0.074).toFixed(1));
  } else if (mode === '2') {
    tok = Math.round(steps * 10750);
    lat = +(steps * 2.31).toFixed(1);
    acc = 82.5;
  } else if (mode === '3') {
    tok = Math.round(steps * 3060);
    lat = +(steps * 1.4).toFixed(1);
    acc = 94.2;
  } else {
    tok = Math.round(4400 + steps * 500);
    lat = +(2.6 + steps * 0.2).toFixed(1);
    acc = 96.6;
  }
  const tco = Math.round((tasks / 80.0) * (tok / 8400) * 16500);
  document.getElementById('k_tok').textContent = tok.toLocaleString();
  document.getElementById('k_lat').textContent = lat + ' sec';
  document.getElementById('k_acc').textContent = acc + '%';
  document.getElementById('k_tco').textContent = '$' + tco.toLocaleString();
}
calc();
</script>
</body>
</html>
