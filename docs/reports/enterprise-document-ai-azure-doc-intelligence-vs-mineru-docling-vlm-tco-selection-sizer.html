<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业文档解析吞吐与百万页 TCO 计算器 (#411)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业多模态文档解析百万页 TCO 计算器 (#411)</h1>
    <label>月度解析页数 (万页): <strong id="pTxt">500 万页</strong></label>
    <input type="range" id="p" min="10" max="2000" step="10" value="500" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="acc">95.4%</div><div class="l">复杂表格 RAG 准确率</div></div>
      <div class="kpi"><div class="v" id="spd">19.5 页/秒</div><div class="l">单卡 GPU 解析吞吐</div></div>
      <div class="kpi"><div class="v" id="unit">$0.42 / 千页</div><div class="l">Tier 4 每千页成本</div></div>
      <div class="kpi"><div class="v" id="mo">$2,100 / 月</div><div class="l">Tier 4 月度总成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const p = parseInt(document.getElementById('p').value, 10);
      document.getElementById('pTxt').textContent = p + ' 万页';
      document.getElementById('mo').textContent = '$' + Math.round(p * 10 * 0.42).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
