<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能运维 AIOps 与 SRE Agent 计算器 (#432)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级 AIOps 拓扑降噪与 MTTR 成本计算器 (#432)</h1>
    <label>生产微服务数量: <strong id="sTxt">500 个</strong></label>
    <input type="range" id="s" min="50" max="2000" step="50" value="500" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="noise">99.4%</div><div class="l">级联告警风暴降噪率</div></div>
      <div class="kpi"><div class="v" id="rca">95.6%</div><div class="l">首发根因定位准确率</div></div>
      <div class="kpi"><div class="v" id="mttr">3.8 分钟</div><div class="l">平均故障恢复 MTTR</div></div>
      <div class="kpi"><div class="v" id="tco">$64,000 / 年</div><div class="l">年度总成本 (-90.0%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const s = parseInt(document.getElementById('s').value, 10);
      document.getElementById('sTxt').textContent = s + ' 个';
      document.getElementById('tco').textContent = '$' + Math.round(64000 * (s / 500)).toLocaleString() + ' / 年';
    }
    calc();
  </script>
</body>
</html>
