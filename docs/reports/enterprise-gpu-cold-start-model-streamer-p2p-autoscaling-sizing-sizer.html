<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#594 GPU Cold-Start &amp; Buffer Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#594 GPU Cold-Start &amp; Autoscaling Buffer Sizer</h2>
  <label>Base Fleet H100 GPUs: <span id="bLbl">32</span></label>
  <input type="range" id="b" min="8" max="128" step="8" value="32">
  <p id="out"></p>
</div>
<script>
const b = document.getElementById('b');
function calc() {
  const n = parseInt(b.value, 10);
  document.getElementById('bLbl').textContent = n;
  const fast = n + Math.ceil(n * 0.125);
  const slow = n + Math.ceil(n * 0.60);
  document.getElementById('out').textContent = `17.5s Fast-Boot Fleet: ${fast}× H100 vs. 510s Slow-Boot Fleet: ${slow}× H100 (Saves $${((slow - fast) * 2300).toLocaleString()}/mo)`;
}
b.addEventListener('input', calc);
calc();
</script>
</body>
</html>
