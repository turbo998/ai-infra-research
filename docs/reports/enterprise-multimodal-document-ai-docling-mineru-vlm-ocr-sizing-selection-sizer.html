<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Multimodal Document AI 3-Tier Hybrid GPU Sizer (#496)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Multimodal Document AI 3-Tier Hybrid GPU Sizer (#496)</h1>
    <label>Daily PDF Ingestion Volume (`Million Pages / Day`): <span id="mLbl">10</span>M</label>
    <input type="range" id="mp" min="1" max="50" step="1" value="10" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const mpEl = document.getElementById('mp');
    function calc() {
      const m = parseInt(mpEl.value, 10);
      document.getElementById('mLbl').textContent = m;
      const g72 = Math.max(1, Math.ceil(64 * m / 10));
      const gHyb = Math.max(1, Math.ceil(2 * m / 10));
      document.getElementById('res').textContent = `Full-Page 72B VLM: ${g72}x H200 ($8.50/1k pages) | Complexity-Gated 3-Tier Hybrid (MinerU/Docling + Cropped 7B VLM): ${gHyb}x H200 ($0.18/1k pages, 96.1% Table TEDS, -96.9% GPUs)`;
    }
    mpEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
