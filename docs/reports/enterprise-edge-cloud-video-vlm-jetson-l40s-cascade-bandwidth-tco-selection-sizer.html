<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业边云协同视频 VLM 带宽与 TCO 计算器 (#419)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级边云协同视频 VLM 带宽与 TCO 计算器 (#419)</h1>
    <label>1080p 摄像头总路数: <strong id="cTxt">500 路</strong></label>
    <input type="range" id="c" min="50" max="2000" step="50" value="500" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="bw">48 Mbps</div><div class="l">级联后广域网上行带宽</div></div>
      <div class="kpi"><div class="v" id="f1">95.8%</div><div class="l">复杂违章识别 F1</div></div>
      <div class="kpi"><div class="v" id="fa">1.8%</div><div class="l">VLM 复核后误报率</div></div>
      <div class="kpi"><div class="v" id="tco">$18,400 / 月</div><div class="l">边云协同月度总 TCO</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const c = parseInt(document.getElementById('c').value, 10);
      document.getElementById('cTxt').textContent = c + ' 路';
      document.getElementById('bw').textContent = Math.ceil(c * 0.096) + ' Mbps';
      document.getElementById('tco').textContent = '$' + Math.round(c * 36.8).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
