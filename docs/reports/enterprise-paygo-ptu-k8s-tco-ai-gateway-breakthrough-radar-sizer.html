<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#627 Enterprise PAYGO vs. PTU vs. Self-Hosted K8s TCO Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#627 Enterprise PAYGO vs. PTU vs. Self-Hosted K8s TCO Sizer</h1>
    <label>Monthly Token Volume: <span id="vVal">4,500</span>M tokens/mo</label>
    <input type="range" id="v" min="100" max="10000" step="100" value="4500" />
    <label>Average Daily Utilization: <span id="uVal">72</span>%</label>
    <input type="range" id="u" min="10" max="90" step="2" value="72" />
    <p>Recommended Tier: <span class="val" id="outTier">Self-Hosted K8s + Envoy GIE ($23,400/mo · $0.052/1M)</span></p>
  </div>
  <script>
    function calc(){
      const v = +document.getElementById('v').value;
      const u = +document.getElementById('u').value;
      document.getElementById('vVal').textContent = v.toLocaleString();
      document.getElementById('uVal').textContent = u;
      const k8sCost = Math.max(9600, Math.round((v / 4500) * 23400));
      const unit = (k8sCost / v).toFixed(3);
      const tier = (u < 28 || v < 300) ? 'Stage 1: Serverless PAYGO' : ((u < 65 || v < 2500) ? 'Stage 2: P80 PTU + P20 PAYGO' : 'Stage 3: Self-Hosted K8s + Envoy GIE ($' + k8sCost.toLocaleString() + '/mo · $' + unit + '/1M)');
      document.getElementById('outTier').textContent = tier;
    }
    document.getElementById('v').addEventListener('input', calc);
    document.getElementById('u').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
