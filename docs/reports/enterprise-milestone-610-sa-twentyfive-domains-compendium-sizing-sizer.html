<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#610 Milestone 25-Domain Master Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#610 Milestone 25-Domain &amp; 10-Industry Master Sizer</h2>
  <label>Industry Portfolio Scale (%): <span id="sLbl">100</span>%</label>
  <input type="range" id="s" min="50" max="300" step="25" value="100">
  <p id="out"></p>
</div>
<script>
const s = document.getElementById('s');
function calc() {
  const m = parseInt(s.value, 10) / 100.0;
  document.getElementById('sLbl').textContent = Math.round(m * 100);
  document.getElementById('out').textContent = `48-Deliverable Portfolio Avg TCO Reduction: 88.2% · Annual Enterprise Savings: $${(18.6 * m).toFixed(2)}M/yr`;
}
s.addEventListener('input', calc);
calc();
</script>
</body>
</html>
