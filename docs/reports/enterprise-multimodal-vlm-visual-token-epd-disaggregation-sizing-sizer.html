<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#631 Multimodal VLM Visual Token &amp; E-P-D Disaggregation Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#631 Multimodal VLM Visual Token &amp; `E-P-D` 3-Pool Sizer</h1>
    <label>Images per Request (1080p): <span id="iVal">3</span> images</label>
    <input type="range" id="i" min="1" max="10" step="1" value="3" />
    <p>Visual Tokens / Request: <span class="val" id="outTok">8,073 tokens</span> · E-P-D Fleet Cost: <span class="val" id="outCost">$25,400/mo (-60.3% vs $64,000 Colocated)</span></p>
  </div>
  <script>
    function calc(){
      const i = +document.getElementById('i').value;
      document.getElementById('iVal').textContent = i;
      const tok = i * 2691;
      const cost = Math.round(25400 * Math.max(0.6, i / 3));
      const col = Math.round(64000 * Math.max(0.6, i / 3));
      document.getElementById('outTok').textContent = tok.toLocaleString() + ' tokens';
      document.getElementById('outCost').textContent = '$' + cost.toLocaleString() + '/mo (-60.3% vs $' + col.toLocaleString() + ' Colocated)';
    }
    document.getElementById('i').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
