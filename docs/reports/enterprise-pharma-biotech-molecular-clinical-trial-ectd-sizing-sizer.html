<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#608 Pharma Clinical Trial Matcher Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#608 Clinical Trial Patient Matcher Sizer</h2>
  <label>Total EHR Charts: <span id="eLbl">250000</span></label>
  <input type="range" id="e" min="50000" max="1000000" step="50000" value="250000">
  <p id="out"></p>
</div>
<script>
const e = document.getElementById('e');
function calc() {
  const n = parseInt(e.value, 10);
  document.getElementById('eLbl').textContent = n.toLocaleString();
  const rem = Math.round(n * 0.088);
  document.getElementById('out').textContent = `Post-SQL Candidates: ${rem.toLocaleString()} · 2-Stage Cost: $${Math.round(rem * 0.0186)} vs. All-LLM: $${Math.round(n * 0.075).toLocaleString()}`;
}
e.addEventListener('input', calc);
calc();
</script>
</body>
</html>
