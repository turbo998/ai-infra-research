<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Heterogeneous GPU Fleet Role Assignment Sizer (#514)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Heterogeneous GPU Role Assignment Sizer (#514)</h1>
    <label>Select Fleet Orchestration Strategy:</label>
    <select id="strat">
      <option value="bad">Anti-Pattern: 32x L40S PCIe on 70B Decode (62.0ms TPOT · 34% Goodput ✕)</option>
      <option value="homo">Baseline: 32x Homogeneous H200 ($2.57M 3-Yr TCO · $0.088/1M)</option>
      <option value="hetero" selected>Optimal: Role-Aware 12x L40S + 8x MI300X + 8x H200 ($1.42M 3-Yr TCO · $0.048/1M 🏆)</option>
    </select>
    <div class="out" id="res"></div>
  </div>
  <script>
    const stratEl = document.getElementById('strat');
    function calc() {
      const map = {
        bad: '32x L40S GDDR6 on 70B Decode | P99 TPOT: 62.0 ms | Goodput: 34.0% | Cost: $0.142/1M (Reject ✕)',
        homo: '32x Homogeneous H200 | P99 TPOT: 13.8 ms | Goodput: 98.4% | 3-Yr TCO: $2,570,000 ($0.088/1M)',
        hetero: 'Role-Aware Heterogeneous (12x L40S Embed/OCR/Prefill + 8x MI300X 192G 70B Decode + 8x H200 MoE 🏆) | P99 TPOT: 14.2 ms | Goodput: 98.8% | 3-Yr TCO: $1,418,000 (-44.8% saved, $0.048/1M 🏆)'
      };
      document.getElementById('res').textContent = map[stratEl.value];
    }
    stratEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
