<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#621 Aviation Airline IROPS &amp; Smart Airport Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#621 Aviation Airline 4.2s IROPS Solver &amp; Gate Turnaround Sizer</h1>
    <label>Active Airline Fleet Size: <span id="fVal">500</span> aircraft</label>
    <input type="range" id="f" min="50" max="1500" step="50" value="500" />
    <label>Gate Turnaround Delay Reduction: <span id="mVal">18</span> min</label>
    <input type="range" id="m" min="5" max="30" step="1" value="18" />
    <p>Annual Delay &amp; AOG Savings: <span class="val" id="outSave">$19,400,000 / yr</span> · Monthly GPU Cost: <span class="val" id="outCost">$32,400 / mo</span></p>
  </div>
  <script>
    function calc(){
      const f = +document.getElementById('f').value;
      const m = +document.getElementById('m').value;
      document.getElementById('fVal').textContent = f;
      document.getElementById('mVal').textContent = m;
      const saved = Math.round((f/500)*(12000000*(m/18) + 7400000));
      const cost = Math.round(32400 * Math.max(0.5, f/500));
      document.getElementById('outSave').textContent = '$' + saved.toLocaleString() + ' / yr';
      document.getElementById('outCost').textContent = '$' + cost.toLocaleString() + ' / mo';
    }
    document.getElementById('f').addEventListener('input', calc);
    document.getElementById('m').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
