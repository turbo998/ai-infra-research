<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online-Offline GPU Co-Location &amp; Opportunistic Backfill Sizer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; }
  h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 18px 0; }
  .ctrl { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  select, input { width: 100%; padding: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: #94a3b8; }
  .card .val { font-size: 24px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive Online-Offline GPU Co-Location &amp; Backfill Sizer (#384)</h1>
  <p style="color:#94a3b8;font-size:14px;">Provenance: synthetic + anonymized_reported (independently_reproduced=false)</p>
  <div class="grid">
    <div class="ctrl">
      <label>Co-Location &amp; Backfill Tier</label>
      <select id="tier" onchange="calc()">
        <option value="1">Tier 1: Siloed Online + Offline Clusters</option>
        <option value="2">Tier 2: Shared Un-Isolated FIFO Queue</option>
        <option value="3">Tier 3: CronHPA Day/Night Pod Reallocation</option>
        <option value="4" selected>Tier 4: KV-Watermark Backfill + Priority Preemption</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Peak Online Interactive GPUs</label>
      <input type="number" id="onlineGpus" value="48" min="8" max="1024" step="8" oninput="calc()">
    </div>
    <div class="ctrl">
      <label>KV Cache Backfill Watermark (%)</label>
      <input type="number" id="wm" value="65" min="30" max="95" step="5" oninput="calc()">
    </div>
  </div>
  <div class="cards">
    <div class="card"><h3>Total Cluster GPUs Needed</h3><div class="val" id="gpus">48 GPUs</div></div>
    <div class="card"><h3>24-Hour Avg GPU Utilization</h3><div class="val" id="util">91.5%</div></div>
    <div class="card"><h3>Online P99 TTFT Latency</h3><div class="val" id="ttft">395 ms</div></div>
    <div class="card"><h3>Monthly Savings vs. Silos</h3><div class="val" id="save">$50,800 / mo</div></div>
  </div>
</div>
<script>
function calc() {
  const tier = parseInt(document.getElementById('tier').value, 10);
  const online = parseInt(document.getElementById('onlineGpus').value, 10) || 48;
  const wm = parseFloat(document.getElementById('wm').value) || 65;
  const scale = online / 48.0;
  const gpus = Math.round(({1: 64, 2: 48, 3: 52, 4: 48}[tier]) * scale);
  const util = {1: 42.5, 2: 86.0, 3: 72.0, 4: 91.5}[tier];
  const wmPenalty = tier === 4 && wm > 75 ? (wm - 75) * 8 : 0;
  const ttft = Math.round({1: 380, 2: 4850, 3: 410, 4: 395}[tier] + wmPenalty);
  const siloCost = Math.round(64 * scale) * 3175;
  const curCost = gpus * 3175;
  const saved = Math.max(0, siloCost - curCost);
  document.getElementById('gpus').textContent = gpus + ' GPUs';
  document.getElementById('util').textContent = util.toFixed(1) + '%';
  document.getElementById('ttft').textContent = ttft + ' ms';
  document.getElementById('save').textContent = '$' + saved.toLocaleString() + ' / mo';
}
calc();
</script>
</body>
</html>
