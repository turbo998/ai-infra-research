<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#614 HR &amp; Talent AI Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#614 HR Blind Matcher &amp; Voice Roleplay Sizer</h2>
  <label>Active Roleplay Learners: <span id="eLbl">20000</span></label>
  <input type="range" id="e" min="2000" max="100000" step="2000" value="20000">
  <p id="out"></p>
</div>
<script>
const e = document.getElementById('e');
function calc() {
  const n = parseInt(e.value, 10);
  document.getElementById('eLbl').textContent = n.toLocaleString();
  const l40s = 2 + Math.max(2, Math.ceil(n / 5000));
  const h100 = Math.max(2, Math.ceil(n / 5000));
  const cost = l40s * 950 + h100 * 2300;
  document.getElementById('out').textContent = `Fleet: ${l40s}× L40S + ${h100}× H100 ($${cost.toLocaleString()}/mo = $${(cost/n).toFixed(2)}/employee/mo)`;
}
e.addEventListener('input', calc);
calc();
</script>
</body>
</html>
