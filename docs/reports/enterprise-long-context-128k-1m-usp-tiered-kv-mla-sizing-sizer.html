<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#628 Ultra-Long Context (128K–1M) &amp; 3-Tier KV Offload Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#628 Ultra-Long Context (`128K–1M`) &amp; L2 Pinned DDR5 KV Sizer</h1>
    <label>Context Length: <span id="cVal">128</span>K tokens</label>
    <input type="range" id="c" min="32" max="1024" step="32" value="128" />
    <p>GQA-8 FP8 KV / Session: <span class="val" id="outGqa">20.97 GiB</span> · 671B MLA FP8 KV: <span class="val" id="outMla">4.50 GiB (-78.5%)</span> · L2 DDR5 Restore: <span class="val" id="outRest">97 ms</span></p>
  </div>
  <script>
    function calc(){
      const k = +document.getElementById('c').value;
      document.getElementById('cVal').textContent = k;
      const gqa = (k * 1024 * 163.84) / (1024 * 1024);
      const mla = (k * 1024 * 35.14) / (1024 * 1024);
      const rest = Math.round((k / 128) * 97);
      document.getElementById('outGqa').textContent = gqa.toFixed(2) + ' GiB';
      document.getElementById('outMla').textContent = mla.toFixed(2) + ' GiB (-78.5%)';
      document.getElementById('outRest').textContent = rest + ' ms';
    }
    document.getElementById('c').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
