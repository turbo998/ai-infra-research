<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#590 Milestone 15-Scenario Master Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#590 Milestone 15-Scenario Master Sizer</h2>
  <label>Enterprise Scale Multiplier (%): <span id="sLbl">100</span>%</label>
  <input type="range" id="s" min="50" max="300" step="25" value="100">
  <p id="out"></p>
</div>
<script>
const s = document.getElementById('s');
function calc() {
  const m = parseInt(s.value, 10) / 100.0;
  document.getElementById('sLbl').textContent = Math.round(m * 100);
  document.getElementById('out').textContent = `Unified Fleet: ${Math.round(18*m)}× L40S + ${Math.round(12*m)}× H100 + ${Math.round(16*m)}× H200 = ${Math.round(46*m)} GPUs ($${(2.64*m).toFixed(2)}M/yr vs. $${(14.20*m).toFixed(2)}M/yr Siloed)`;
}
s.addEventListener('input', calc);
calc();
</script>
</body>
</html>
