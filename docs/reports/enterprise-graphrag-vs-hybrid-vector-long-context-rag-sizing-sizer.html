<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#587 GraphRAG vs. Vector RAG Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#587 LazyGraphRAG Indexing &amp; Query Cost Sizer</h2>
  <label>Corpus Million Tokens: <span id="cLbl">50</span></label>
  <input type="range" id="c" min="10" max="200" step="10" value="50">
  <p id="out"></p>
</div>
<script>
const c = document.getElementById('c');
function calc() {
  const m = parseInt(c.value, 10);
  document.getElementById('cLbl').textContent = m;
  document.getElementById('out').textContent = `LazyGraphRAG Index Cost: $${(m * 54).toLocaleString()} vs. Naive Full-LLM GraphRAG: $${(m * 900).toLocaleString()} (-94.0%)`;
}
c.addEventListener('input', calc);
calc();
</script>
</body>
</html>
