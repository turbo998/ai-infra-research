<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医院环境语音病历与 ICD-10 编码计算器 (#433)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 医院环境语音病历 (Ambient Scribe) 容量与 TCO 计算器 (#433)</h1>
    <label>执业临床医生人数: <strong id="dTxt">2,000 人</strong></label>
    <input type="range" id="d" min="100" max="5000" step="100" value="2000" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="err">0.00%</div><div class="l">药典门禁后剂量错漏率</div></div>
      <div class="kpi"><div class="v" id="icd">98.4%</div><div class="l">ICD-10 编码合规率</div></div>
      <div class="kpi"><div class="v" id="gpus">8 张 H200</div><div class="l">院内所需 GPU 卡数</div></div>
      <div class="kpi"><div class="v" id="tco">$380,000 / 年</div><div class="l">院内私有化年度 TCO</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const d = parseInt(document.getElementById('d').value, 10);
      document.getElementById('dTxt').textContent = d.toLocaleString() + ' 人';
      const g = Math.max(2, Math.ceil(d / 250));
      document.getElementById('gpus').textContent = g + ' 张 H200';
      document.getElementById('tco').textContent = '$' + (g * 30000 + 140000).toLocaleString() + ' / 年';
    }
    calc();
  </script>
</body>
</html>
