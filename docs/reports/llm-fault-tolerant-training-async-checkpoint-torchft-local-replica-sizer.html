<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>万卡大模型训练容错 (Young-Daly ETTR / Async Checkpoint / TorchFT) 计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #FCA5A5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>万卡大模型训练容错（Async Checkpoint / P2P 内存环 / TorchFT）Goodput 与浪费成本计算器</h1>
  <div class="grid">
    <div class="control">
      <label>训练集群 GPU 总卡数 <span id="v_gpus" class="val">8192</span></label>
      <input type="range" id="gpus" min="512" max="32768" step="512" value="8192" oninput="calc()">
    </div>
    <div class="control">
      <label>单卡日均故障率 (驱动集群 MTBF) <span id="v_mtbf" class="val">3.2 hrs</span></label>
      <input type="range" id="mtbf" min="1.0" max="12.0" step="0.2" value="3.2" oninput="calc()">
    </div>
    <div class="control">
      <label>计划持续训练天数 <span id="v_days" class="val">30 天</span></label>
      <input type="range" id="days" min="7" max="90" step="1" value="30" oninput="calc()">
    </div>
    <div class="control">
      <label>训练容错与自愈架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 同步写盘 (14m) + 全集群销毁冷重启 (28m)</option>
        <option value="2">Tier 2: 异步锁页内存快照 (0.8s) + 热备换机 (3m)</option>
        <option value="3">Tier 3: 邻接节点 P2P 内存环冗余 + 42s 恢复</option>
        <option value="4" selected>Tier 4: TorchFT 局部副本组 6.5s 隔离 + P2P 内存同步 (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>最优 Checkpoint 间隔</div><div id="k_int" class="num">4.5 min</div></div>
    <div class="kpi"><div>单次故障恢复耗时</div><div id="k_rec" class="num">6.5 sec</div></div>
    <div class="kpi"><div>有效训练时间比 (ETTR)</div><div id="k_ettr" class="num">96.8%</div></div>
    <div class="kpi"><div>周期内浪费算力账单</div><div id="k_waste" class="num">$528,000</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const gpus = parseFloat(document.getElementById('gpus').value);
  const mtbf = parseFloat(document.getElementById('mtbf').value);
  const days = parseFloat(document.getElementById('days').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_gpus').textContent = gpus;
  document.getElementById('v_mtbf').textContent = mtbf + ' hrs';
  document.getElementById('v_days').textContent = days + ' 天';

  let stallSec = 0.4, recSec = 6.5, optMin = 4.5, ettr = 96.8;
  if (mode === '1') {
    stallSec = 840.0;
    recSec = 1680.0;
    optMin = Math.round(Math.sqrt(2 * (stallSec / 60) * (mtbf * 60)));
    ettr = Math.max(25.0, +(100 - (14 + 28 + optMin * 0.5) / (mtbf * 60) * 100).toFixed(1));
  } else if (mode === '2') {
    stallSec = 0.8;
    recSec = 180.0;
    optMin = 15.0;
    ettr = Math.max(65.0, +(100 - (10.5 / (mtbf * 60)) * 250).toFixed(1));
  } else if (mode === '3') {
    stallSec = 0.6;
    recSec = 42.0;
    optMin = 8.0;
    ettr = Math.max(80.0, +(100 - (4.7 / (mtbf * 60)) * 250).toFixed(1));
  } else {
    stallSec = 0.4;
    recSec = 6.5;
    optMin = 4.5;
    ettr = Math.max(90.0, +(100 - (2.4 / (mtbf * 60)) * 250).toFixed(1));
  }
  const totalGPUHours = gpus * days * 24;
  const wastedHours = totalGPUHours * (1 - ettr / 100.0);
  const wastedUSD = Math.round(wastedHours * 2.8);
  document.getElementById('k_int').textContent = optMin + ' min';
  document.getElementById('k_rec').textContent = recSec + ' sec';
  document.getElementById('k_ettr').textContent = ettr + '%';
  document.getElementById('k_waste').textContent = '$' + wastedUSD.toLocaleString();
}
calc();
</script>
</body>
</html>
