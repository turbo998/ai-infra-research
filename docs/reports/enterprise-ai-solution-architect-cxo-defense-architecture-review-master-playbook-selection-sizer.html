<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #490: SA Whiteboard Sizing & CxO Defense Sizer (#490)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #490: SA 10-Minute Whiteboard Sizer (#490)</h1>
    <label>Daily Total Requests: <span id="dLbl">1,000,000</span></label>
    <input type="range" id="daily" min="100000" max="10000000" step="100000" value="1000000" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const dailyEl = document.getElementById('daily');
    function calc() {
      const d = parseInt(dailyEl.value, 10);
      document.getElementById('dLbl').textContent = d.toLocaleString();
      const rps = ((d / 86400) * 4).toFixed(1);
      const b = Math.ceil(rps * 8.8);
      const gpus = Math.max(4, Math.ceil((b / 24) / 2) * 2);
      document.getElementById('res').textContent = `Peak RPS (4x): ${rps} | Little's Law Active Batch: ${b} | 3-Watermark H200 GPUs: ${gpus} | Platform: ${gpus >= 16 ? 'Self-Hosted K8s + Tidal Pool' : 'PTU Base + PAYGO Spillover'}`;
    }
    dailyEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
