<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>分布式 KV Cache 共享池 (LMCache / Mooncake / Dynamo) 命中率与 TTFT 计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #38BDF8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>分布式 KV Cache 共享池（LMCache / Mooncake / Dynamo KV Router）容量与延迟计算器</h1>
  <div class="grid">
    <div class="control">
      <label>集群推理副本数 (Replicas) <span id="v_rep" class="val">32</span></label>
      <input type="range" id="rep" min="4" max="64" step="4" value="32" oninput="calc()">
    </div>
    <div class="control">
      <label>平均历史上下文长度 (K) <span id="v_ctx" class="val">32K</span></label>
      <input type="range" id="ctx" min="8" max="128" step="8" value="32" oninput="calc()">
    </div>
    <div class="control">
      <label>集群总请求并发 (RPS) <span id="v_rps" class="val">160</span></label>
      <input type="range" id="rps" min="20" max="600" step="20" value="160" oninput="calc()">
    </div>
    <div class="control">
      <label>KV Cache 共享与路由架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 单 Pod 孤立 HBM 缓存 + 轮询负载均衡</option>
        <option value="2">Tier 2: Session 粘性路由 + 单机本地 DRAM 卸载</option>
        <option value="3">Tier 3: LMCache + vLLM Stack (TCP 池 + CacheGen)</option>
        <option value="4" selected>Tier 4: Dynamo KV 路由 + Mooncake/LMCache RDMA 池 (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>全集群 KV 命中率</div><div id="k_hit" class="num">95.8%</div></div>
    <div class="kpi"><div>多轮 P95 TTFT 延迟</div><div id="k_ttft" class="num">98 ms</div></div>
    <div class="kpi"><div>所需 H200 GPU 卡数</div><div id="k_gpus" class="num">24 GPUs</div></div>
    <div class="kpi"><div>月度集群总成本 (TCO)</div><div id="k_tco" class="num">$69,600</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const rep = parseFloat(document.getElementById('rep').value);
  const ctx = parseFloat(document.getElementById('ctx').value);
  const rps = parseFloat(document.getElementById('rps').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_rep').textContent = rep;
  document.getElementById('v_ctx').textContent = ctx + 'K';
  document.getElementById('v_rps').textContent = rps;

  const baseRecomputeMs = ctx * 36.875;
  let hit = 95.8, ttft = 98, gpus = 24;
  if (mode === '1') {
    hit = Math.max(4.0, +(46.4 / Math.sqrt(rep / 4)).toFixed(1));
    ttft = Math.round(baseRecomputeMs * 1.05);
    gpus = Math.ceil(rps / 5) * 2;
  } else if (mode === '2') {
    hit = 58.0;
    ttft = Math.round(baseRecomputeMs * 0.5);
    gpus = Math.ceil(rps / 6.7) * 2;
  } else if (mode === '3') {
    hit = 86.5;
    ttft = Math.round(baseRecomputeMs * 0.182);
    gpus = Math.ceil(rps / 10) * 2;
  } else {
    hit = 95.8;
    ttft = Math.round(baseRecomputeMs * 0.083);
    gpus = Math.ceil(rps / 13.4) * 2;
  }
  const tco = gpus * 2800 + (mode >= '3' ? 2400 : 0);
  document.getElementById('k_hit').textContent = hit + '%';
  document.getElementById('k_ttft').textContent = ttft.toLocaleString() + ' ms';
  document.getElementById('k_gpus').textContent = gpus + ' GPUs';
  document.getElementById('k_tco').textContent = '$' + tco.toLocaleString();
}
calc();
</script>
</body>
</html>
