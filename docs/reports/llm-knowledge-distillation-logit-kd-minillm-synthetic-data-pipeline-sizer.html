<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>大模型知识蒸馏 (Top-K Logit KD / GKD / MiniLLM) 容量与 ROI 计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #F472B6; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>企业级大模型知识蒸馏（Top-64 Logit KD + GKD 反向 KL）存储与年化 ROI 计算器</h1>
  <div class="grid">
    <div class="control">
      <label>蒸馏语料总规模 (百万 Tokens) <span id="v_tok" class="val">150M</span></label>
      <input type="range" id="tok" min="20" max="500" step="10" value="150" oninput="calc()">
    </div>
    <div class="control">
      <label>离线缓存 Top-K Logprobs 数 <span id="v_topk" class="val">64</span></label>
      <select id="topk" onchange="calc()">
        <option value="32">Top-32 (192 Bytes/Token)</option>
        <option value="64" selected>Top-64 (256 Bytes/Token 推荐)</option>
        <option value="128">Top-128 (512 Bytes/Token)</option>
      </select>
    </div>
    <div class="control">
      <label>线上生产并发流量 (RPS) <span id="v_rps" class="val">250</span></label>
      <input type="range" id="rps" min="30" max="1000" step="10" value="250" oninput="calc()">
    </div>
    <div class="control">
      <label>知识蒸馏技术栈</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 未过滤纯黑盒文本蒸馏 (SeqKD)</option>
        <option value="2">Tier 2: 师生同驻在线全词表 152K 正向 KL</option>
        <option value="3">Tier 3: 离线缓存 Top-K 稀疏 Logprobs 蒸馏</option>
        <option value="4" selected>Tier 4: 拒绝采样 + Top-K Logit KD + GKD 反向 KL (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>8B 学生模型准确率</div><div id="k_acc" class="num">89.6%</div></div>
    <div class="kpi"><div>Logprobs 磁盘体积</div><div id="k_disk" class="num">38.4 GB</div></div>
    <div class="kpi"><div>一次性蒸馏训练成本</div><div id="k_cost" class="num">$2,850</div></div>
    <div class="kpi"><div>相比跑教师年省推理费</div><div id="k_save" class="num">$1,142,400</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const tok = parseFloat(document.getElementById('tok').value);
  const topk = parseFloat(document.getElementById('topk').value);
  const rps = parseFloat(document.getElementById('rps').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_tok').textContent = tok + 'M';
  document.getElementById('v_topk').textContent = topk;
  document.getElementById('v_rps').textContent = rps;

  const scale = tok / 150.0;
  const diskGB = +((tok * 1e6 * topk * 4) / 1e9).toFixed(1);
  let acc = 89.6, cost = 2850, disk = diskGB;
  if (mode === '1') {
    acc = 79.5;
    cost = Math.round(480 * scale);
    disk = +(1.2 * scale).toFixed(1);
  } else if (mode === '2') {
    acc = 85.4;
    cost = Math.round(14800 * scale);
    disk = 720.0;
  } else if (mode === '3') {
    acc = 87.2;
    cost = Math.round(1650 * scale);
    disk = diskGB;
  } else {
    acc = 89.6;
    cost = Math.round(2850 * scale);
    disk = diskGB;
  }
  const annualSave = Math.round((rps / 250.0) * 1142400);
  document.getElementById('k_acc').textContent = acc + '%';
  document.getElementById('k_disk').textContent = disk + ' GB';
  document.getElementById('k_cost').textContent = '$' + cost.toLocaleString();
  document.getElementById('k_save').textContent = '$' + annualSave.toLocaleString();
}
calc();
</script>
</body>
</html>
