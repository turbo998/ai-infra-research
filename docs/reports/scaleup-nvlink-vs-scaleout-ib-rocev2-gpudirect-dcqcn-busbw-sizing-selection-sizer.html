<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智算网络 GPUDirect RDMA、DCQCN 水线与 busbw 计算器 (#398)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"], select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 智算网络 GPUDirect RDMA、ECN/PFC 水线与 NCCL busbw 换算器 (#398)</h1>
    <label>集合通信原语：</label>
    <select id="op" onchange="calc()">
      <option value="ar">All-Reduce (busbw = algbw * 2(N-1)/N)</option>
      <option value="a2a">All-to-All / All-Gather / Reduce-Scatter (busbw = algbw * (N-1)/N)</option>
    </select>
    <label>参与 GPU 数量 N: <strong id="nTxt">512</strong></label>
    <input type="range" id="n" min="8" max="2048" step="8" value="512" oninput="calc()">
    <label>实测 algbw (GB/s): <strong id="algTxt">24.1</strong></label>
    <input type="range" id="alg" min="5" max="49" step="0.5" value="24.1" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="bus">48.1 GB/s</div><div class="l">物理总线带宽 busbw</div></div>
      <div class="kpi"><div class="v" id="eff">96.2%</div><div class="l">400G (50GB/s) 线速比</div></div>
      <div class="kpi"><div class="v" id="wmark">150KB &lt;&lt; 2.8MB</div><div class="l">ECN K_min &lt;&lt; PFC XOFF</div></div>
      <div class="kpi"><div class="v" id="gate">✅ 验收通过</div><div class="l">Day-0 门禁 (&gt;=45 GB/s)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const op = document.getElementById('op').value;
      const n = parseInt(document.getElementById('n').value, 10);
      const alg = parseFloat(document.getElementById('alg').value);
      document.getElementById('nTxt').textContent = n;
      document.getElementById('algTxt').textContent = alg.toFixed(1);
      const f = op === 'ar' ? (2 * (n - 1)) / n : (n - 1) / n;
      const bus = alg * f;
      document.getElementById('bus').textContent = bus.toFixed(1) + ' GB/s';
      document.getElementById('eff').textContent = ((bus / 50.0) * 100).toFixed(1) + '%';
      document.getElementById('gate').textContent = bus >= 45.0 ? '✅ 验收通过' : '⛔ 低于 45GB/s 需排障';
    }
    calc();
  </script>
</body>
</html>
