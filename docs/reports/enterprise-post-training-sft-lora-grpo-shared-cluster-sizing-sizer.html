<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#595 Post-Training SFT/LoRA/GRPO Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#595 Post-Training VRAM &amp; GPU Sizer</h2>
  <label>Model Params (B): <span id="pLbl">70</span>B</label>
  <input type="range" id="p" min="8" max="72" step="2" value="70">
  <p id="out"></p>
</div>
<script>
const p = document.getElementById('p');
function calc() {
  const b = parseInt(p.value, 10);
  document.getElementById('pLbl').textContent = b;
  document.getElementById('out').textContent = `LoRA SFT VRAM: ${Math.round(b*2.23)} GB (${Math.ceil(b*2.23/115)}× H200) vs. Full-Param SFT: ${Math.round(b*18.57)} GB (${Math.ceil(b*18.57/68)}× H100)`;
}
p.addEventListener('input', calc);
calc();
</script>
</body>
</html>
