<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业浏览器操控 Agent 与自愈 RPA 计算器 (#428)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 浏览器操控 Agent (Playwright 缓存 + AXTree 自愈) 计算器 (#428)</h1>
    <label>月度 15 步流程执行次数 (万次): <strong id="rTxt">300 万次/月</strong></label>
    <input type="range" id="r" min="10" max="600" step="10" value="300" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="sec">3.2 秒</div><div class="l">缓存回放端到端耗时</div></div>
      <div class="kpi"><div class="v" id="succ">99.3%</div><div class="l">自愈后任务完结率</div></div>
      <div class="kpi"><div class="v" id="unit">$0.0062 / 次</div><div class="l">98/2 混合单次成本</div></div>
      <div class="kpi"><div class="v" id="tco">$18,600 / 月</div><div class="l">月度总成本 (-98.5%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const r = parseInt(document.getElementById('r').value, 10);
      document.getElementById('rTxt').textContent = r + ' 万次/月';
      document.getElementById('tco').textContent = '$' + Math.round(r * 62).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
