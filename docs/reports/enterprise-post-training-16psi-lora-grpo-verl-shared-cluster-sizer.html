<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#639 Enterprise Post-Training (`16Ψ` vs. `LoRA` vs. `veRL GRPO`) Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#639 Enterprise Post-Training (`16Ψ` vs. `LoRA` vs. `veRL GRPO`) Sizer</h1>
    <label>Model Parameter Size (Ψ): <span id="pVal">70</span>B</label>
    <input type="range" id="p" min="8" max="140" step="2" value="70" />
    <p>Full-SFT VRAM (`16Ψ+Act`): <span class="val" id="outFull">1,300 GB</span> · LoRA SFT VRAM: <span class="val" id="outLora">156 GB (-88.0% · 2× H200)</span></p>
  </div>
  <script>
    function calc(){
      const p = +document.getElementById('p').value;
      document.getElementById('pVal').textContent = p;
      const full = Math.round((p / 70) * 1300);
      const lora = Math.round((p / 70) * 156);
      const gpus = Math.max(1, Math.ceil(lora / 118));
      document.getElementById('outFull').textContent = full.toLocaleString() + ' GB';
      document.getElementById('outLora').textContent = lora + ' GB (-88.0% · ' + gpus + '× H200)';
    }
    document.getElementById('p').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
