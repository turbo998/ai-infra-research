<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #475: 1,024-GPU SuperPod BOM & 3-Year TCO Sizer (#475)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #475: 1,024-GPU SuperPod BOM &amp; 3-Year TCO Sizer (#475)</h1>
    <label>Total Cluster GPUs: <span id="gLbl">1024</span></label>
    <input type="range" id="gpus" min="256" max="2048" step="256" value="1024" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const gpusEl = document.getElementById('gpus');
    function calc() {
      const g = parseInt(gpusEl.value, 10);
      document.getElementById('gLbl').textContent = g;
      const s = g / 1024;
      document.getElementById('res').textContent = `Nodes: ${g/8} | 64p 400G Switches: ${48*s} (${32*s}L+${16*s}S) | 50kW DLC Racks: ${32*s} (${(1.81*s).toFixed(2)} MW) | 3-Yr TCO: $${(46.8*s).toFixed(1)}M ($0.095/1M)`;
    }
    gpusEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
