<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能体长效记忆 TCO 计算器 (#424)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级智能体双时态记忆图谱 TCO 计算器 (#424)</h1>
    <label>月度活跃会话数 (百万次): <strong id="sTxt">50M 次/月</strong></label>
    <input type="range" id="s" min="5" max="150" step="5" value="50" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="tok">950 Tok</div><div class="l">每轮注入记忆 Token</div></div>
      <div class="kpi"><div class="v" id="acc">94.8%</div><div class="l">状态变更消解准确率</div></div>
      <div class="kpi"><div class="v" id="lat">+12.0 ms</div><div class="l">在线检索附加延迟</div></div>
      <div class="kpi"><div class="v" id="tco">$7,600 / 月</div><div class="l">月度总成本 (-96.0%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const s = parseInt(document.getElementById('s').value, 10);
      document.getElementById('sTxt').textContent = s + 'M 次/月';
      document.getElementById('tco').textContent = '$' + Math.round(s * 152).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
