<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#640 Milestone: Cloud &amp; AI SA 25 Golden Formulas &amp; 12 Veto Redlines Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#640 Milestone: 25 Golden Formulas &amp; 12 Veto Redlines Master Sizer</h1>
    <label>Monthly Compliant Token Volume: <span id="vVal">5,000</span>M tokens/mo</label>
    <input type="range" id="v" min="500" max="20000" step="500" value="5000" />
    <p>Optimized Unit Cost: <span class="val">$0.048 / 1M (10.0× cheaper vs $0.480)</span> · Annual Savings: <span class="val" id="outS">$2,592,000/yr</span></p>
  </div>
  <script>
    function calc(){
      const v = +document.getElementById('v').value;
      document.getElementById('vVal').textContent = v.toLocaleString();
      const savedYr = Math.round(v * (0.480 - 0.048) * 12);
      document.getElementById('outS').textContent = '$' + (savedYr * 100).toLocaleString() + '/yr';
    }
    document.getElementById('v').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
