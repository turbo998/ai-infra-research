<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>#547 企业医药临床试验患者招募匹配 容量计算器 (Sizer)</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#f8fafc;padding:24px}
.box{max-width:920px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px}
h1{font-size:22px;margin-top:0;color:#38bdf8}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.stat{background:#0f172a;padding:14px;border-radius:8px;border:1px solid #334155}
.stat b{display:block;font-size:22px;color:#10b981}
</style>
</head>
<body>
<div class="box">
  <h1>#547 企业医药临床试验受试者匹配 (OMOP SQL + 8B 特征库 + 70B 核验) 容量计算器</h1>
  <p>基线（1,000 万电子病历）：OMOP SQL 剪枝 94% + 8B 否定感知患者特征库 + 70B 逐条核验实现 96.8% 召回率、98.2% 精确率，仅需 12 张 H200（省 97.5% GPU）。</p>
  <div class="row">
    <div class="stat">合格召回率 / 入排精确率<b>96.8% · 98.2%</b></div>
    <div class="stat">结构化剪枝率 / 省卡比例<b>94.0% · -97.5%</b></div>
    <div class="stat">所需 H200 / 月成本<b>12 GPUs · $36K/m</b></div>
  </div>
</div>
</body>
</html>
