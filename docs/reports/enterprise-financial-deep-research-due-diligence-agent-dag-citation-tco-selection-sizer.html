<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业深度研究与投研尽调 Agent TCO 计算器 (#426)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 深度研究 (Deep Research) Map-Reduce DAG 计算器 (#426)</h1>
    <label>单篇报告查阅文献数: <strong id="kTxt">40 份</strong></label>
    <input type="range" id="k" min="10" max="80" step="10" value="40" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="tok">230,000 Tok</div><div class="l">并行隔离后单篇 Token</div></div>
      <div class="kpi"><div class="v" id="sec">110 秒</div><div class="l">8 路并发生成耗时</div></div>
      <div class="kpi"><div class="v" id="acc">99.4%</div><div class="l">Python 财务验算准确率</div></div>
      <div class="kpi"><div class="v" id="unit">$0.38 / 篇</div><div class="l">单份深度报告成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const k = parseInt(document.getElementById('k').value, 10);
      const s = k / 40.0;
      document.getElementById('kTxt').textContent = k + ' 份';
      document.getElementById('tok').textContent = Math.round(230000 * s).toLocaleString() + ' Tok';
      document.getElementById('sec').textContent = Math.round(110 * s) + ' 秒';
      document.getElementById('unit').textContent = '$' + (0.38 * s).toFixed(2) + ' / 篇';
    }
    calc();
  </script>
</body>
</html>
