<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#607 Energy &amp; Power Grid AI Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#607 Energy &amp; Power Grid AI Fleet Sizer</h2>
  <label>Wind/Solar/Substation Sites: <span id="sLbl">5000</span></label>
  <input type="range" id="s" min="500" max="15000" step="500" value="5000">
  <p id="out"></p>
</div>
<script>
const s = document.getElementById('s');
function calc() {
  const n = parseInt(s.value, 10);
  document.getElementById('sLbl').textContent = n;
  const h100 = Math.max(2, Math.ceil(n / 3000));
  document.getElementById('out').textContent = `Recommended Fleet: 2× L40S + ${h100}× H100 + 2× H200 · Imbalance Penalty Savings: $${((n*1880)/1e6).toFixed(2)}M/yr`;
}
s.addEventListener('input', calc);
calc();
</script>
</body>
</html>
