<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 Embedding 与 Reranker 底座计算器 (#436)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 Embedding 与 Reranker (TEI / Infinity 1D 零填充) 计算器 (#436)</h1>
    <label>月度 RAG 查询次数 (百万次): <strong id="qTxt">50M 次/月</strong></label>
    <input type="range" id="q" min="5" max="150" step="5" value="50" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="lat">14.2 ms</div><div class="l">Top-50 重排 P99 延迟</div></div>
      <div class="kpi"><div class="v" id="pad">0.0%</div><div class="l">1D 零填充算力浪费</div></div>
      <div class="kpi"><div class="v" id="gpus">2 张 L40S</div><div class="l">所需自建 GPU 卡数</div></div>
      <div class="kpi"><div class="v" id="tco">$4,200 / 月</div><div class="l">月度总成本 (-94.4%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const q = parseInt(document.getElementById('q').value, 10);
      document.getElementById('qTxt').textContent = q + 'M 次/月';
      const g = Math.max(1, Math.ceil(2 * (q / 50)));
      document.getElementById('gpus').textContent = g + ' 张 L40S';
      document.getElementById('tco').textContent = '$' + (g * 2100).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
