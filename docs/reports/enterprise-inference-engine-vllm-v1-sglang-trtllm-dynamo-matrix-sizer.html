<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#656 四大推理引擎选型与容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  select { width:100%; padding:10px; background:#0F172A; color:#F8FAFC; border:1px solid #334155; border-radius:8px; margin-bottom:14px; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #656 企业大模型推理引擎选型与吞吐计算器</h1>
    <select id="s" onchange="run()">
      <option value="0">多步 Agent + JSON 结构化输出 (推荐 SGLang)</option>
      <option value="1">DeepSeek-671B MoE EP=16 (推荐 SGLang + Dynamo)</option>
      <option value="2">多模态 VLM / 128-LoRA / MI325X (推荐 vLLM V1)</option>
      <option value="3">B=8 实时语音 / B200 NVFP4 (推荐 TensorRT-LLM)</option>
    </select>
    <div class="res">
      <div class="box"><div class="val" id="o-eng">SGLang</div><div>首选推理引擎</div></div>
      <div class="box"><div class="val" id="o-tps">15,800 tok/s</div><div>单机有效吞吐</div></div>
      <div class="box"><div class="val" id="o-cpu">0.08 ms</div><div>暴露 CPU 调度开销</div></div>
    </div>
  </div>
<script>
const R = [
  ["SGLang", "15,800 tok/s", "0.08 ms"],
  ["SGLang + Dynamo", "28,400 tok/s", "0.08 ms"],
  ["vLLM V1", "10,950 tok/s", "0.10 ms"],
  ["TensorRT-LLM", "4.9 ms TPOT", "0.05 ms"]
];
function run() {
  const row = R[+document.getElementById('s').value];
  document.getElementById('o-eng').textContent = row[0];
  document.getElementById('o-tps').textContent = row[1];
  document.getElementById('o-cpu').textContent = row[2];
}
run();
</script>
</body>
</html>
