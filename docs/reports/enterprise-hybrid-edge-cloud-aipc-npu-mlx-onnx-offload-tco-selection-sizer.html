<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业端云协同 AI PC / NPU 卸载计算器 (#430)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级 AI PC / Mac 端云 66/34 卸载 TCO 计算器 (#430)</h1>
    <label>员工终端总席位数: <strong id="sTxt">20,000 人</strong></label>
    <input type="range" id="s" min="1000" max="50000" step="1000" value="20000" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="off">66.8%</div><div class="l">端侧 NPU 消化占比</div></div>
      <div class="kpi"><div class="v" id="ttft">42 ms</div><div class="l">本地首字延迟 (TTFT)</div></div>
      <div class="kpi"><div class="v" id="yr">$796,000 / 年</div><div class="l">混合后年度云账单</div></div>
      <div class="kpi"><div class="v" id="save">$1,604,000 / 年</div><div class="l">对比全上云年净省</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const s = parseInt(document.getElementById('s').value, 10);
      document.getElementById('sTxt').textContent = s.toLocaleString() + ' 人';
      const base = s * 120;
      const yr = Math.round(base * 0.3317);
      document.getElementById('yr').textContent = '$' + yr.toLocaleString() + ' / 年';
      document.getElementById('save').textContent = '$' + (base - yr).toLocaleString() + ' / 年';
    }
    calc();
  </script>
</body>
</html>
