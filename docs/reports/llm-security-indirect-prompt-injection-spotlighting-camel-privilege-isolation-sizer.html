<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>企业 Agent 间接提示词注入防御 (Spotlighting / CaMeL / 污点隔离) 评估器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #6EE7B7; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #38BDF8; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #6EE7B7; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>企业 Agent 间接提示词注入（XPIA）与权限隔离（Spotlighting / CaMeL）风险评估器</h1>
  <div class="grid">
    <div class="control">
      <label>单任务读取外部不可信文档数 <span id="v_docs" class="val">5</span></label>
      <input type="range" id="docs" min="1" max="20" step="1" value="5" oninput="calc()">
    </div>
    <div class="control">
      <label>挂载写/外发权限 MCP 工具数 <span id="v_tools" class="val">12</span></label>
      <input type="range" id="tools" min="1" max="40" step="1" value="12" oninput="calc()">
    </div>
    <div class="control">
      <label>月度高敏工具调用量 (万次) <span id="v_calls" class="val">50万</span></label>
      <input type="range" id="calls" min="5" max="200" step="5" value="50" oninput="calc()">
    </div>
    <div class="control">
      <label>Agent 安全隔离架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 扁平 Prompt 拼接 + 无限制工具调用</option>
        <option value="2">Tier 2: Prompt Shield 分类器 + Spotlighting 打标</option>
        <option value="3">Tier 3: 指令层级模型 + 每次写操作弹窗确认</option>
        <option value="4" selected>Tier 4: CaMeL 双轨分离 + 污点追踪策略门 (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>间接注入工具劫持率 (ASR)</div><div id="k_asr" class="num">0.0%</div></div>
    <div class="kpi"><div>机密数据外泄率</div><div id="k_exf" class="num">0.0%</div></div>
    <div class="kpi"><div>正常业务可用率</div><div id="k_util" class="num">96.2%</div></div>
    <div class="kpi"><div>安全门控附加延迟</div><div id="k_lat" class="num">+28 ms</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const docs = parseFloat(document.getElementById('docs').value);
  const tools = parseFloat(document.getElementById('tools').value);
  const calls = parseFloat(document.getElementById('calls').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_docs').textContent = docs;
  document.getElementById('v_tools').textContent = tools;
  document.getElementById('v_calls').textContent = calls + '万';

  const riskScale = Math.min(1.6, 0.7 + docs * 0.04 + tools * 0.01);
  let asr = 0.0, exf = 0.0, util = 96.2, lat = 28;
  if (mode === '1') {
    asr = Math.min(85.0, +(48.5 * riskScale).toFixed(1));
    exf = Math.min(75.0, +(41.2 * riskScale).toFixed(1));
    util = 100.0;
    lat = 0;
  } else if (mode === '2') {
    asr = +(6.8 * riskScale).toFixed(1);
    exf = +(4.2 * riskScale).toFixed(1);
    util = 98.5;
    lat = 12;
  } else if (mode === '3') {
    asr = +(2.4 * riskScale).toFixed(1);
    exf = +(0.8 * riskScale).toFixed(1);
    util = 78.0;
    lat = 45;
  } else {
    asr = 0.0;
    exf = 0.0;
    util = 96.2;
    lat = 28;
  }
  document.getElementById('k_asr').textContent = asr + '%';
  document.getElementById('k_exf').textContent = exf + '%';
  document.getElementById('k_util').textContent = util + '%';
  document.getElementById('k_lat').textContent = '+' + lat + ' ms';
}
calc();
</script>
</body>
</html>
