<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agentic Context Compaction &amp; Prefix KV Cache Sizer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; }
  h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 18px 0; }
  .ctrl { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  select, input { width: 100%; padding: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: #94a3b8; }
  .card .val { font-size: 24px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive Agentic Context Compaction &amp; Prefix KV Cache Sizer (#387)</h1>
  <p style="color:#94a3b8;font-size:14px;">Provenance: synthetic + anonymized_reported (independently_reproduced=false)</p>
  <div class="grid">
    <div class="ctrl">
      <label>Context Compaction Strategy Tier</label>
      <select id="tier" onchange="calc()">
        <option value="1">Tier 1: Rolling FIFO Sliding-Window Drop</option>
        <option value="2">Tier 2: Frequent 5-Turn LLM Summarization</option>
        <option value="3">Tier 3: Stale Tool Observation Masking (&gt;8T)</option>
        <option value="4" selected>Tier 4: 85%-Watermark Sawtooth Checkpoint</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Autonomous Agent Turns per Task</label>
      <input type="number" id="turns" value="50" min="10" max="300" step="10" oninput="calc()">
    </div>
    <div class="ctrl">
      <label>Daily Agent Tasks Executed</label>
      <input type="number" id="daily" value="5000" min="100" max="500000" step="500" oninput="calc()">
    </div>
  </div>
  <div class="cards">
    <div class="card"><h3>Prefix KV Cache Hit Rate</h3><div class="val" id="kv">91.5%</div></div>
    <div class="card"><h3>Avg Per-Turn TTFT Latency</h3><div class="val" id="ttft">380 ms</div></div>
    <div class="card"><h3>Long-Horizon Task Success</h3><div class="val" id="succ">93.4%</div></div>
    <div class="card"><h3>Monthly Token Spend</h3><div class="val" id="mcost">$247,500 / mo</div></div>
  </div>
</div>
<script>
function calc() {
  const tier = parseInt(document.getElementById('tier').value, 10);
  const turns = parseFloat(document.getElementById('turns').value) || 50;
  const daily = parseFloat(document.getElementById('daily').value) || 5000;
  const scale = turns / 50.0;
  const kv = {1: 0.0, 2: 72.0, 3: 64.0, 4: 91.5}[tier];
  const ttft = {1: 4200, 2: 840, 3: 960, 4: 380}[tier];
  const succ = {1: 46.0, 2: 68.5, 3: 82.4, 4: 93.4}[tier];
  const taskCost = ({1: 14.80, 2: 3.40, 3: 2.95, 4: 1.65}[tier]) * scale;
  const mcost = Math.round(taskCost * daily * 30);
  document.getElementById('kv').textContent = kv.toFixed(1) + '%';
  document.getElementById('ttft').textContent = ttft + ' ms';
  document.getElementById('succ').textContent = succ.toFixed(1) + '%';
  document.getElementById('mcost').textContent = '$' + mcost.toLocaleString() + ' / mo';
}
calc();
</script>
</body>
</html>
