<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#626 Three-Watermark GPU Capacity &amp; Little's Law Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#626 Three-Watermark GPU Capacity &amp; Little's Law Sizer</h1>
    <label>Peak Arrival Rate (QPS): <span id="qVal">25</span> req/s</label>
    <input type="range" id="q" min="5" max="80" step="5" value="25" />
    <label>Average Output Length (OSL): <span id="oVal">512</span> tokens</label>
    <input type="range" id="o" min="128" max="4096" step="128" value="512" />
    <p>Active Batch (`B_active`): <span class="val" id="outB">192 sessions</span> · Sized H200 GPUs: <span class="val" id="outG">8× H200 (13.6ms TPOT)</span></p>
  </div>
  <script>
    function calc(){
      const q = +document.getElementById('q').value;
      const o = +document.getElementById('o').value;
      document.getElementById('qVal').textContent = q;
      document.getElementById('oVal').textContent = o;
      const e2el = 0.5 + (o - 1) * 0.014;
      const b = Math.ceil(q * e2el);
      const gpus = Math.max(4, Math.ceil((b / 24) / 2) * 2);
      document.getElementById('outB').textContent = b + ' sessions (' + e2el.toFixed(2) + 's E2EL)';
      document.getElementById('outG').textContent = gpus + '× H200 (13.6ms TPOT)';
    }
    document.getElementById('q').addEventListener('input', calc);
    document.getElementById('o').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
