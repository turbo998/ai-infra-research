<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 AI 平台 PAYGO vs. PTU vs. 自建 K8s 拐点与 AI Gateway 计算器 (#400)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"], select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业 AI 平台 PAYGO / PTU / 自建 K8s 拐点与双层 AI Gateway 计算器 (#400)</h1>
    <label>月度总 Token 量 (十亿 Tokens/月): <strong id="vTxt">6.0B</strong></label>
    <input type="range" id="v" min="0.5" max="20.0" step="0.5" value="6.0" oninput="calc()">
    <label>24h 平均槽位利用率 (%): <strong id="uTxt">62%</strong></label>
    <input type="range" id="u" min="10" max="90" step="2" value="62" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="hit">91.8%</div><div class="l">Envoy GIE EPP KV 命中率</div></div>
      <div class="kpi"><div class="v" id="unit">$0.25 / 1M</div><div class="l">Tier 4 综合百万词单价</div></div>
      <div class="kpi"><div class="v" id="yr">$180,000 / 年</div><div class="l">Tier 4 年度总 TCO (-88.1%)</div></div>
      <div class="kpi"><div class="v" id="rec">K8s + PTU + 溢出</div><div class="l">推荐采买模式</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const v = parseFloat(document.getElementById('v').value);
      const u = parseInt(document.getElementById('u').value, 10);
      document.getElementById('vTxt').textContent = v.toFixed(1) + 'B';
      document.getElementById('uTxt').textContent = u + '%';
      const unit = Math.max(0.21, 0.25 * (62.0 / Math.max(25, u)));
      const yr = Math.round(v * 1000 * unit * 12);
      document.getElementById('unit').textContent = '$' + unit.toFixed(2) + ' / 1M';
      document.getElementById('yr').textContent = '$' + yr.toLocaleString() + ' / 年';
      document.getElementById('rec').textContent = u < 28 ? '纯 PAYGO' : (v < 2.5 ? 'PTU + 溢出' : 'K8s + PTU + 溢出');
    }
    calc();
  </script>
</body>
</html>
