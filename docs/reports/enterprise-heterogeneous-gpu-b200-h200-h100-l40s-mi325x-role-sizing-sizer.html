<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#629 Heterogeneous GPU Fleet (`B200 / H200 / H100 / L40S / MI325X`) Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#629 Heterogeneous GPU Fleet (`L40S + H100 Prefill + H200 Decode`) Sizer</h1>
    <label>LLM Arrival QPS: <span id="qVal">30</span> req/s</label>
    <input type="range" id="q" min="10" max="90" step="5" value="30" />
    <p>Heterogeneous Monthly Cost: <span class="val" id="outHet">$50,800/mo (-55.9% vs All-H200)</span> · 3-Year Saved: <span class="val" id="outSave">$2,318,400</span></p>
  </div>
  <script>
    function calc(){
      const q = +document.getElementById('q').value;
      document.getElementById('qVal').textContent = q;
      const scale = q / 30.0;
      const het = Math.round(50800 * scale);
      const homo = Math.round(115200 * scale);
      const saved3y = (homo - het) * 36;
      document.getElementById('outHet').textContent = '$' + het.toLocaleString() + '/mo (-55.9% vs $' + homo.toLocaleString() + ')';
      document.getElementById('outSave').textContent = '$' + saved3y.toLocaleString();
    }
    document.getElementById('q').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
