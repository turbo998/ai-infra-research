<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#585 AI Observability &amp; Judge Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#585 AI Observability Storage &amp; Judge Sizer</h2>
  <label>Million Traces/Month: <span id="tLbl">100</span></label>
  <input type="range" id="t" min="10" max="500" step="10" value="100">
  <p id="out"></p>
</div>
<script>
const t = document.getElementById('t');
function calc() {
  const m = parseInt(t.value, 10);
  document.getElementById('tLbl').textContent = m;
  const gb = Math.round(m * 5.6);
  document.getElementById('out').textContent = `ClickHouse ZSTD Storage: ${gb} GB/mo · Self-Hosted Cost: ~$${Math.round(1400 + gb * 0.714)}/mo vs. SaaS $${(m * 500).toLocaleString()}/mo`;
}
t.addEventListener('input', calc);
calc();
</script>
</body>
</html>
