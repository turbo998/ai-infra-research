<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业私有云与主权 AI 3 年 TCO 计算器 (#422)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 私有云与主权 AI 智算集群 3 年 TCO 计算器 (#422)</h1>
    <label>H200 GPU 总卡数: <strong id="gTxt">32 张</strong></label>
    <input type="range" id="g" min="8" max="128" step="8" value="32" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="hrs">4.5 小时</div><div class="l">Zarf 断网开通耗时</div></div>
      <div class="kpi"><div class="v" id="tax">-4.8%</div><div class="l">H200 PPCIE 机密损耗</div></div>
      <div class="kpi"><div class="v" id="swSaved">$432,000</div><div class="l">省下 3 年商业软件税</div></div>
      <div class="kpi"><div class="v" id="tco">$1,920,000</div><div class="l">开源栈 3 年总 TCO</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const g = parseInt(document.getElementById('g').value, 10);
      document.getElementById('gTxt').textContent = g + ' 张';
      document.getElementById('swSaved').textContent = '$' + (g * 4500 * 3).toLocaleString();
      document.getElementById('tco').textContent = '$' + (g * 45000 + 480000).toLocaleString();
    }
    calc();
  </script>
</body>
</html>
