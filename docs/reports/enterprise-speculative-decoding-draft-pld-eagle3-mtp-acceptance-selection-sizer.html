<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Speculative Decoding Speedup & Batch Cutoff Sizer (#486)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Speculative Decoding Speedup Sizer (#486)</h1>
    <label>Per-Token Acceptance Probability (`alpha`): <span id="aLbl">0.82</span></label>
    <input type="range" id="alpha" min="0.50" max="0.92" step="0.02" value="0.82" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const alphaEl = document.getElementById('alpha');
    function calc() {
      const a = parseFloat(alphaEl.value);
      document.getElementById('aLbl').textContent = a.toFixed(2);
      const tau = ((1 - Math.pow(a, 5)) / (1 - a)).toFixed(2);
      const spd = (tau / 1.42).toFixed(2);
      document.getElementById('res').textContent = `Expected Accepted Tokens per Step (tau, gamma=4) = ${tau} | EAGLE-3 / Native MTP Speedup (Batch=8) = ${spd}x | Auto-Bypass Gate: Batch >= 32`;
    }
    alphaEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
