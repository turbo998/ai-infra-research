<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#596 AI Storage &amp; Async Checkpoint Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#596 AI Storage 3FS Bandwidth &amp; Checkpoint Sizer</h2>
  <label>8-GPU Nodes: <span id="nLbl">32</span></label>
  <input type="range" id="n" min="4" max="128" step="4" value="32">
  <p id="out"></p>
</div>
<script>
const n = document.getElementById('n');
function calc() {
  const v = parseInt(n.value, 10);
  document.getElementById('nLbl').textContent = v;
  document.getElementById('out').textContent = `3FS Pooled Local NVMe Bandwidth: ${(v * 55).toLocaleString()} GB/s · Two-Phase Async Checkpoint Stall: 2.8s`;
}
n.addEventListener('input', calc);
calc();
</script>
</body>
</html>
