<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise GPU Power Capping & Datacenter Density Sizer (#492)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise GPU Power Capping &amp; Facility Density Sizer (#492)</h1>
    <label>Facility IT Power Cap (`kW`): <span id="kLbl">1500</span> kW</label>
    <input type="range" id="kw" min="500" max="5000" step="250" value="1500" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const kwEl = document.getElementById('kw');
    function calc() {
      const k = parseInt(kwEl.value, 10);
      document.getElementById('kLbl').textContent = k;
      const g700 = Math.floor((1024 * k / 1500) / 8) * 8;
      const gPd = Math.floor((1280 * k / 1500) / 8) * 8;
      document.getElementById('res').textContent = `Uncapped 700W: ${g700} GPUs | Role-Aware PD (650W P / 500W D): ${gPd} GPUs (+25.0% GPUs, 98.8% Decode Speed, +23.5% Net Cluster Output)`;
    }
    kwEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
