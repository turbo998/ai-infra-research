<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#657 智算 GPU 服务器宿主硬件配比 (Host BoM) 计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #657 智算服务器宿主机 (Host BoM) 标准配比计算器</h1>
    <label><span>整机 GPU 总显存 (HBM GB)</span><span id="l-h">1,128 GB (8×H200)</span></label>
    <input type="range" id="r-h" min="640" max="2048" step="16" value="1128" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-ram">2,256 GB</div><div>最低推荐 DDR5 内存 (2.0x)</div></div>
      <div class="box"><div class="val" id="o-sw">4× PEX89144</div><div>必配 PCIe Gen5 Switch</div></div>
      <div class="box"><div class="val" id="o-nv">8× 3.84TB</div><div>本地 Gen5 NVMe (56 GB/s)</div></div>
    </div>
  </div>
<script>
function run() {
  const h = +document.getElementById('r-h').value;
  document.getElementById('l-h').textContent = h.toLocaleString() + ' GB';
  document.getElementById('o-ram').textContent = (h * 2).toLocaleString() + ' GB';
}
run();
</script>
</body>
</html>
