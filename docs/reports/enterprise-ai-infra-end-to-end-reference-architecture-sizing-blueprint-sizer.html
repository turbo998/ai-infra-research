<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise AI Infra End-to-End Master Capacity Sizer (#395)</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; }
  h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 18px 0; }
  .ctrl { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  select, input { width: 100%; padding: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: #94a3b8; }
  .card .val { font-size: 24px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive Enterprise AI Infra Master Reference Blueprint Sizer (#395)</h1>
  <p style="color:#94a3b8;font-size:14px;">Provenance: synthetic + anonymized_reported (independently_reproduced=false)</p>
  <div class="grid">
    <div class="ctrl">
      <label>Enterprise AI Platform Maturity Tier</label>
      <select id="tier" onchange="calc()">
        <option value="1">Tier 1: Siloed Ad-Hoc BF16 Deployments</option>
        <option value="2">Tier 2: Basic K8s + vLLM V0 Continuous Batching</option>
        <option value="3">Tier 3: KV-Aware Gateway + vLLM V1 FP8 + KV Pool</option>
        <option value="4" selected>Tier 4: 2026 Full-Stack Blueprint (PD + Backfill + FinOps)</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Daily Enterprise LLM Calls (Millions)</label>
      <input type="number" id="qpd" value="10" min="0.5" max="100" step="0.5" oninput="calc()">
    </div>
    <div class="ctrl">
      <label>Avg Input + Output Tokens / Call</label>
      <input type="number" id="tok" value="4096" min="512" max="65536" step="512" oninput="calc()">
    </div>
  </div>
  <div class="cards">
    <div class="card"><h3>24h Effective Cluster Goodput</h3><div class="val" id="goodput">92.4%</div></div>
    <div class="card"><h3>Blended Cost / 1M Tokens</h3><div class="val" id="cpm">$0.24</div></div>
    <div class="card"><h3>P99 SLA Attainment Rate</h3><div class="val" id="sla">99.6%</div></div>
    <div class="card"><h3>Annual Platform TCO</h3><div class="val" id="tco">$1.72M / yr</div></div>
  </div>
</div>
<script>
function calc() {
  const tier = parseInt(document.getElementById('tier').value, 10);
  const qpd = parseFloat(document.getElementById('qpd').value) || 10.0;
  const tok = parseFloat(document.getElementById('tok').value) || 4096;
  const scale = (qpd / 10.0) * (tok / 4096.0);
  const goodput = {1: 28.5, 2: 54.0, 3: 79.5, 4: 92.4}[tier];
  const cpm = {1: 2.40, 2: 1.15, 3: 0.48, 4: 0.24}[tier];
  const sla = {1: 74.0, 2: 91.5, 3: 98.6, 4: 99.6}[tier];
  const tco = ({1: 8.60, 2: 4.80, 3: 2.65, 4: 1.72}[tier]) * scale;
  document.getElementById('goodput').textContent = goodput.toFixed(1) + '%';
  document.getElementById('cpm').textContent = '$' + cpm.toFixed(2);
  document.getElementById('sla').textContent = sla.toFixed(1) + '%';
  document.getElementById('tco').textContent = '$' + tco.toFixed(2) + 'M / yr';
}
calc();
</script>
</body>
</html>
