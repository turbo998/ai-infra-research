<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Real-Time Voice Agent TTFA & Heterogeneous GPU Sizer (#466)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Real-Time Voice Agent TTFA &amp; GPU Sizer (#466)</h1>
    <label>Concurrent Active Voice Calls: <span id="cLbl">2560</span></label>
    <input type="range" id="calls" min="64" max="10240" step="64" value="2560" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const callsEl = document.getElementById('calls');
    function calc() {
      const c = parseInt(callsEl.value, 10);
      document.getElementById('cLbl').textContent = c;
      const units = Math.ceil(c / 640);
      document.getElementById('res').textContent = `Tier 3 WebRTC Pool: ${units * 2}x L40S (ASR/TTS) + ${units * 6}x H200 (LLM) | P99 TTFA = 235ms | Cost = $0.068/call-hr`;
    }
    callsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
