<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业金融反欺诈与 AML 热温冷三层计算器 (#434)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 金融反欺诈与 AML 热温冷三层架构计算器 (#434)</h1>
    <label>支付清算峰值并发 TPS: <strong id="tTxt">10,000 TPS</strong></label>
    <input type="range" id="t" min="1000" max="30000" step="1000" value="10000" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="lat">14.0 ms</div><div class="l">热路径主链路延迟</div></div>
      <div class="kpi"><div class="v" id="fp">0.6%</div><div class="l">温路径复核后误冻率</div></div>
      <div class="kpi"><div class="v" id="gpus">4 张 H200</div><div class="l">0.4% 灰区所需卡数</div></div>
      <div class="kpi"><div class="v" id="tco">$42,000 / 月</div><div class="l">月度总成本 (-91.3%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const t = parseInt(document.getElementById('t').value, 10);
      document.getElementById('tTxt').textContent = t.toLocaleString() + ' TPS';
      document.getElementById('gpus').textContent = Math.max(2, Math.ceil((t * 0.004) / 10)) + ' 张 H200';
      document.getElementById('tco').textContent = '$' + Math.round(42000 * (t / 10000)).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
