<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#649 智算以太网 RoCEv2 vs Spectrum-X vs UEC 带宽计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #649 智算以太网三代架构多租户有效 busbw 计算器</h1>
    <label><span>单卡网卡速率 (Gbps)</span><span id="l-s">400 Gbps</span></label>
    <input type="range" id="r-s" min="200" max="800" step="200" value="400" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-ecmp">215 GB/s</div><div>默认 ECMP 混跑 busbw (53.8%)</div></div>
      <div class="box"><div class="val" id="o-qps">318 GB/s</div><div>调优 QPS=4 混跑 busbw (79.5%)</div></div>
      <div class="box"><div class="val" id="o-spx">382 GB/s</div><div>Spectrum-X / UEC busbw (95.5%)</div></div>
    </div>
  </div>
<script>
function run() {
  const s = +document.getElementById('r-s').value;
  document.getElementById('l-s').textContent = s + ' Gbps';
  document.getElementById('o-ecmp').textContent = Math.round(s * 0.538) + ' GB/s';
  document.getElementById('o-qps').textContent = Math.round(s * 0.795) + ' GB/s';
  document.getElementById('o-spx').textContent = Math.round(s * 0.955) + ' GB/s';
}
run();
</script>
</body>
</html>
