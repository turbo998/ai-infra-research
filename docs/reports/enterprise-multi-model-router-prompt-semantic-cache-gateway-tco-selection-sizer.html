<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多模型级联路由与三级缓存网关计算器 (#406)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 多模型级联路由与三级缓存网关 TCO 计算器 (#406)</h1>
    <label>选择网关策略：</label>
    <select id="t" onchange="calc()">
      <option value="4" selected>Tier 4: 78/22 级联路由 + 实体强校验语义缓存 + GIE Prefix KV</option>
      <option value="3">Tier 3: 78/22 级联路由 + 精确 Prefix KV 缓存</option>
      <option value="2">Tier 2: 朴素纯向量语义缓存 (8.2% 误命中事故)</option>
      <option value="1">Tier 1: 100% 旗舰大模型无缓存</option>
    </select>
    <div class="kpis">
      <div class="kpi"><div class="v" id="fp">0.01%</div><div class="l">缓存张冠李戴率</div></div>
      <div class="kpi"><div class="v" id="ttft">195 ms</div><div class="l">P95 首字延迟</div></div>
      <div class="kpi"><div class="v" id="acc">95.5%</div><div class="l">任务综合准确率</div></div>
      <div class="kpi"><div class="v" id="cost">$850 / 1M Req</div><div class="l">每百万请求总成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const m = {
        '1': ['0.0%', '1,120 ms', '95.4%', '$4,850 / 1M Req'],
        '2': ['8.2% ✕', '640 ms', '86.1% ✕', '$2,920 / 1M Req'],
        '3': ['0.0% ✓', '310 ms ✓', '95.1% ✓', '$1,180 / 1M Req'],
        '4': ['0.01% 🏆', '195 ms 🏆', '95.5% 🏆', '$850 / 1M Req']
      }[document.getElementById('t').value];
      document.getElementById('fp').textContent = m[0];
      document.getElementById('ttft').textContent = m[1];
      document.getElementById('acc').textContent = m[2];
      document.getElementById('cost').textContent = m[3];
    }
    calc();
  </script>
</body>
</html>
