<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#661 企业长视频与 RTSP 实时流 VLM 容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #661 企业实时 RTSP 视频流与长视频 VLM 容量计算器</h1>
    <label><span>并发 RTSP 摄像头路数 (Streams)</span><span id="l-s">500 路</span></label>
    <input type="range" id="r-s" min="100" max="2000" step="100" value="500" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-tok">62.2K tok</div><div>1h 视频压缩后词数 (-99.36%)</div></div>
      <div class="box"><div class="val" id="o-gpu">8 L40S + 8 H200</div><div>推荐边云异构配置</div></div>
      <div class="box"><div class="val" id="o-cost">$0.018/路·h</div><div>单路每小时成本 (-91.8%)</div></div>
    </div>
  </div>
<script>
function run() {
  const s = +document.getElementById('r-s').value;
  document.getElementById('l-s').textContent = s + ' 路';
  const l = Math.max(2, Math.ceil(s / 62.5 / 2) * 2);
  const h = Math.max(4, Math.ceil((s / 500) * 8 / 4) * 4);
  document.getElementById('o-gpu').textContent = l + ' L40S + ' + h + ' H200';
}
run();
</script>
</body>
</html>
