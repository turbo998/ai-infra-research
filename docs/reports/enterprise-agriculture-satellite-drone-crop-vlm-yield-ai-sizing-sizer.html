<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#618 Precision Agriculture Satellite-Drone VLM Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#618 Precision Agriculture Satellite NDVI Funnel &amp; Edge VLM Sizer</h1>
    <label>Monitored Farmland Area: <span id="hVal">50</span>M Hectares</label>
    <input type="range" id="h" min="5" max="150" step="5" value="50" />
    <label>Sentinel-2 NDVI Anomaly Ratio: <span id="nVal">8</span>%</label>
    <input type="range" id="n" min="2" max="30" step="1" value="8" />
    <p>Monthly Cloud VLM Cost: <span class="val" id="outCost">$24,800 / mo</span> (vs. <span id="outBase">$310,000 / mo</span> raw tile upload)</p>
  </div>
  <script>
    function calc(){
      const h = +document.getElementById('h').value;
      const n = +document.getElementById('n').value / 100;
      document.getElementById('hVal').textContent = h;
      document.getElementById('nVal').textContent = Math.round(n*100);
      const base = Math.round((h/50)*310000);
      const opt = Math.round(base * n);
      document.getElementById('outCost').textContent = '$' + opt.toLocaleString() + ' / mo';
      document.getElementById('outBase').textContent = '$' + base.toLocaleString() + ' / mo';
    }
    document.getElementById('h').addEventListener('input', calc);
    document.getElementById('n').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
