<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#588 Nightly Tidal Batch LLM Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#588 Nightly Tidal Batch LLM Sizer</h2>
  <label>Nightly Million Tokens: <span id="tLbl">500</span></label>
  <input type="range" id="t" min="100" max="1500" step="50" value="500">
  <p id="out"></p>
</div>
<script>
const t = document.getElementById('t');
function calc() {
  const m = parseInt(t.value, 10);
  document.getElementById('tLbl').textContent = m;
  const hrs = ((m * 1e6) / (6 * 4850 * 3600)).toFixed(2);
  document.getElementById('out').textContent = `6× Idle H200 Completion Time: ${hrs} hours · Monthly Tidal Cost: $${Math.round(m * 30 * 0.019)} vs. Cloud Batch API: $${Math.round(m * 30 * 0.75).toLocaleString()}`;
}
t.addEventListener('input', calc);
calc();
</script>
</body>
</html>
