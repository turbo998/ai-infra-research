<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#602 Healthcare Clinical AI Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#602 Clinical Ambient Scribe &amp; FHIR GPU Sizer</h2>
  <label>Physicians: <span id="dLbl">2000</span></label>
  <input type="range" id="d" min="200" max="5000" step="200" value="2000">
  <p id="out"></p>
</div>
<script>
const d = document.getElementById('d');
function calc() {
  const n = parseInt(d.value, 10);
  document.getElementById('dLbl').textContent = n;
  const rooms = Math.round(n * 0.325);
  const l40s = Math.max(2, Math.ceil(rooms / 110));
  const h200 = Math.max(2, Math.ceil(((rooms / 720) * 2.4) / 0.6) * 2);
  const cost = l40s * 950 + h200 * 3400;
  document.getElementById('out').textContent = `Fleet: ${l40s}× L40S + ${h200}× H200 ($${cost.toLocaleString()}/mo = $${(cost/n).toFixed(2)}/physician/mo)`;
}
d.addEventListener('input', calc);
calc();
</script>
</body>
</html>
