<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#653 大模型全栈可观测性存储与尾部采样计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #653 企业大模型 OTel 尾部采样存储成本计算器</h1>
    <label><span>峰值请求速率 (RPS)</span><span id="l-r">100 RPS</span></label>
    <input type="range" id="r-r" min="20" max="500" step="20" value="100" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-full">4.80 TB/天</div><div>全量逐词 Span 日写入量</div></div>
      <div class="box"><div class="val" id="o-tail">0.74 TB/天</div><div>紧凑数组+尾部采样 (-84.5%)</div></div>
      <div class="box"><div class="val" id="o-save">省 $18.8万/年</div><div>可观测性存储年节省</div></div>
    </div>
  </div>
<script>
function run() {
  const r = +document.getElementById('r-r').value;
  document.getElementById('l-r').textContent = r + ' RPS';
  document.getElementById('o-full').textContent = ((r/100)*4.8).toFixed(2) + ' TB/天';
  document.getElementById('o-tail').textContent = ((r/100)*0.74).toFixed(2) + ' TB/天';
  document.getElementById('o-save').textContent = '省 $' + ((r/100)*18.77).toFixed(1) + '万/年';
}
run();
</script>
</body>
</html>
