<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业推理引擎选型与含人力 TCO 计算器 (#404)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"], select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 vLLM V1 vs. SGLang vs. TRT-LLM vs. Azure Foundry 全口径 TCO 计算器 (#404)</h1>
    <label>GPU 总卡数: <strong id="gTxt">32</strong></label>
    <input type="range" id="g" min="4" max="128" step="4" value="32" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="gp">2,480 tok/s</div><div class="l">SGLang+vLLM 单卡 Goodput</div></div>
      <div class="kpi"><div class="v" id="fte">1.0 FTE</div><div class="l">所需专职 SRE 人力</div></div>
      <div class="kpi"><div class="v" id="unit">$0.23 / 1M</div><div class="l">含人力全口径单价</div></div>
      <div class="kpi"><div class="v" id="rec">SGLang + vLLM V1</div><div class="l">架构师推荐方案</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const g = parseInt(document.getElementById('g').value, 10);
      document.getElementById('gTxt').textContent = g;
      const tot = g * 28000 + 180000;
      const unit = tot / (g * 2480 * 31.536 * 0.58);
      document.getElementById('unit').textContent = '$' + unit.toFixed(2) + ' / 1M';
      document.getElementById('rec').textContent = g <= 12 ? 'Azure Foundry 托管' : 'SGLang + vLLM V1';
    }
    calc();
  </script>
</body>
</html>
