<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#597 Structured Output XGrammar Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#597 XGrammar + Jump-Forward Fleet Sizer</h2>
  <label>Peak QPS: <span id="qLbl">100</span></label>
  <input type="range" id="q" min="20" max="500" step="20" value="100">
  <p id="out"></p>
</div>
<script>
const q = document.getElementById('q');
function calc() {
  const v = parseInt(q.value, 10);
  document.getElementById('qLbl').textContent = v;
  const g3 = Math.max(2, Math.ceil((v * 235) / 3000));
  const g1 = Math.max(4, Math.ceil((v * 320 * 1.28) / 3500));
  document.getElementById('out').textContent = `XGrammar + Jump-Forward Fleet: ${g3}× H200 vs. Prompt-Retry Fleet: ${g1}× H200`;
}
q.addEventListener('input', calc);
calc();
</script>
</body>
</html>
