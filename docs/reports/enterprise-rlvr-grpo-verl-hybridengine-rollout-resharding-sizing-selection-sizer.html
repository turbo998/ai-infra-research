<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise RLVR / GRPO veRL HybridEngine Sizer (#523)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise `RLVR / GRPO` Post-Training (`veRL HybridEngine`) Sizer (#523)</h1>
    <label>Target GRPO Training Steps: <span id="sLbl">5800</span> Steps</label>
    <input type="range" id="steps" min="2000" max="12000" step="200" value="5800" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const stepsEl = document.getElementById('steps');
    function calc() {
      const s = parseInt(stepsEl.value, 10);
      document.getElementById('sLbl').textContent = s;
      const gSplit = Math.ceil(64 * s / 5800);
      const gVerl = Math.max(8, Math.ceil(24 * s / 5800));
      document.getElementById('res').textContent =
        `Static Disaggregated Pools: ${gSplit}x H200 (54.0% GPU bubble, 14.2 steps/hr) | veRL HybridEngine / slime (0.9s NVLink Weight Resharding + Partial Rollout): ${gVerl}x H200 GPUs (-62.5% GPUs, 8.4% bubble, 34.8 steps/hr [2.45x faster] 🏆)`;
    }
    stepsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
