<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#654 智算网络光模块与铜缆 BoM 计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #654 智算中心 MoR 铜缆 + LPO 光模块预算计算器</h1>
    <label><span>集群总规模 (GPUs)</span><span id="l-g">1,024 GPUs</span></label>
    <input type="range" id="r-g" min="256" max="4096" step="256" value="1024" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-dsp">$3.38M</div><div>全 DSP 光方案 CapEx</div></div>
      <div class="box"><div class="val" id="o-opt">$1.26M</div><div>MoR 铜+LPO CapEx (-62.7%)</div></div>
      <div class="box"><div class="val" id="o-save">省 $2.31M</div><div>3 年含电费净省</div></div>
    </div>
  </div>
<script>
function run() {
  const g = +document.getElementById('r-g').value;
  document.getElementById('l-g').textContent = g.toLocaleString() + ' GPUs';
  const s = g / 1024;
  document.getElementById('o-dsp').textContent = '$' + (3.38 * s).toFixed(2) + 'M';
  document.getElementById('o-opt').textContent = '$' + (1.26 * s).toFixed(2) + 'M';
  document.getElementById('o-save').textContent = '省 $' + (2.31 * s).toFixed(2) + 'M';
}
run();
</script>
</body>
</html>
