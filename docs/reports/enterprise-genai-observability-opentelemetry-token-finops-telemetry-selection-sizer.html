<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise GenAI Observability & Token FinOps Sizer (#483)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise GenAI Observability &amp; WCU FinOps Sizer (#483)</h1>
    <label>Monthly LLM Requests (Millions): <span id="rLbl">100</span>M</label>
    <input type="range" id="reqs" min="10" max="500" step="10" value="100" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const reqsEl = document.getElementById('reqs');
    function calc() {
      const r = parseInt(reqsEl.value, 10);
      document.getElementById('rLbl').textContent = r;
      const saas = (685 * r).toLocaleString();
      const otel = (38 * r).toLocaleString();
      document.getElementById('res').textContent = `Full SaaS Prompt Logging: $${saas}/mo | OTel GenAI 100% Metadata + 5% Tail + ClickHouse: $${otel}/mo (-94.5%) | MTTR = 3.4 min`;
    }
    reqsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
