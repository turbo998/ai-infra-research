<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Codebase Indexing &amp; SWE-Agent Sizer (#529)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Codebase Indexing &amp; SWE-Agent Sizer (#529)</h1>
    <label>Active Enterprise Developers: <span id="dLbl">2000</span> Developers</label>
    <input type="range" id="devs" min="200" max="10000" step="200" value="2000" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const devsEl = document.getElementById('devs');
    function calc() {
      const d = parseInt(devsEl.value, 10);
      document.getElementById('dLbl').textContent = d;
      const gStuff = Math.ceil(48 * d / 2000);
      const gAst = Math.max(4, Math.ceil(8 * d / 2000));
      document.getElementById('res').textContent =
        `128K Repo Stuffing: ${gStuff}x H200 (115K tokens/query, 71.0% recall) | Tree-Sitter AST + SCIP 2-Hop Call Graph + Merkle Sync: ${gAst}x H200 GPUs (-83.3% GPUs, 6.4K tokens/query [-94.4%], 94.6% bug localization recall, 89.4% PR test pass rate 🏆)`;
    }
    devsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
