<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise FinServ Real-Time Fraud &amp; Risk 3-Tier AI Cascade Sizer (#519)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise FinServ Real-Time Fraud &amp; Risk Cascade Sizer (#519)</h1>
    <label>Peak Payment Transactions Per Second (`TPS`): <span id="tLbl">5000</span> TPS</label>
    <input type="range" id="tps" min="1000" max="20000" step="1000" value="5000" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const tpsEl = document.getElementById('tps');
    function calc() {
      const t = parseInt(tpsEl.value, 10);
      document.getElementById('tLbl').textContent = t;
      const naiveGpus = Math.ceil(320 * t / 5000);
      const casGpus = Math.max(4, Math.ceil(12 * t / 5000));
      document.getElementById('res').textContent =
        `Naive Inline 70B: ${naiveGpus}x H200 (680ms P99 Timeout ✕) | 3-Tier Fast/Slow AI Cascade (92% 3.2ms GBDT + 7.5% [${Math.round(t*0.075)} TPS] 21.5ms 8B Logprob + 0.5% [${Math.round(t*0.005)} TPS] Async 70B): ${casGpus}x H200 GPUs (-96.2% GPUs, 24.8ms P99 Latency, 96.8% Fraud Recall, 1.8% FPR 🏆)`;
    }
    tpsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
