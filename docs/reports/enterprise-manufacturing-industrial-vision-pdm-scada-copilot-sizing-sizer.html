<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#605 Smart Manufacturing AI Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#605 Smart Manufacturing L1–L3 Fleet Sizer</h2>
  <label>Smart Factories: <span id="pLbl">20</span></label>
  <input type="range" id="p" min="2" max="60" step="2" value="20">
  <p id="out"></p>
</div>
<script>
const p = document.getElementById('p');
function calc() {
  const n = parseInt(p.value, 10);
  document.getElementById('pLbl').textContent = n;
  const l40s = n * 2;
  document.getElementById('out').textContent = `L2 On-Site Fleet: ${l40s}× L40S (2/plant) + L3 Central: 4× H200 ($${(l40s * 950 + 13600).toLocaleString()}/mo)`;
}
p.addEventListener('input', calc);
calc();
</script>
</body>
</html>
