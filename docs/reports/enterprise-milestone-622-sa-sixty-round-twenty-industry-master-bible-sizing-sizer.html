<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>🏆 #622 Milestone: 60-Round &amp; 20-Industry Master Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#34d399; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏆 #622 Milestone: 60-Round AI Infra &amp; 20-Industry Master Sizer</h1>
    <label>Active Enterprise Verticals Deployed: <span id="vVal">20</span> industries</label>
    <input type="range" id="v" min="1" max="20" step="1" value="20" />
    <p>Portfolio Monthly Compute TCO: <span class="val" id="outCost">$876,900 / mo</span> (vs. <span id="outBase">$10,080,000 / mo</span> naive baseline · Savings: <span class="val">91.3%</span>)</p>
  </div>
  <script>
    function calc(){
      const v = +document.getElementById('v').value;
      document.getElementById('vVal').textContent = v;
      document.getElementById('outCost').textContent = '$' + Math.round((v/20)*876900).toLocaleString() + ' / mo';
      document.getElementById('outBase').textContent = '$' + Math.round((v/20)*10080000).toLocaleString() + ' / mo';
    }
    document.getElementById('v').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
