<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业大模型容量规划与三道水位线计算器 (#399)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"], select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 三道水位线 GPU 容量估算、TPM/TPS/PTU 换算与 Little's Law 计算器 (#399)</h1>
    <label>高峰请求率 RPS: <strong id="rpsTxt">50</strong></label>
    <input type="range" id="rps" min="5" max="200" step="5" value="50" oninput="calc()">
    <label>输入长度 S_in: <strong id="sinTxt">4096</strong></label>
    <input type="range" id="sin" min="512" max="32768" step="512" value="4096" oninput="calc()">
    <label>输出长度 S_out: <strong id="soutTxt">600</strong></label>
    <input type="range" id="sout" min="100" max="4096" step="100" value="600" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="tpm">14.1M TPM</div><div class="l">原始总 TPM (In+Out)</div></div>
      <div class="kpi"><div class="v" id="bact">509 会话</div><div class="l">Little's Law 峰值活跃会话</div></div>
      <div class="kpi"><div class="v" id="gpus">16x H200</div><div class="l">三道水位线 P80 基线卡数</div></div>
      <div class="kpi"><div class="v" id="tco">$49,000 / 月</div><div class="l">Tier 4 混合溢出月成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const rps = parseInt(document.getElementById('rps').value, 10);
      const sin = parseInt(document.getElementById('sin').value, 10);
      const sout = parseInt(document.getElementById('sout').value, 10);
      document.getElementById('rpsTxt').textContent = rps;
      document.getElementById('sinTxt').textContent = sin;
      document.getElementById('soutTxt').textContent = sout;
      const tpm = ((rps * (sin + sout) * 60) / 1e6).toFixed(1);
      const e2el = 0.6 + (sout - 1) * 0.016;
      const bact = Math.ceil(rps * e2el);
      const gpus = Math.max(8, Math.ceil(bact / 32) * 8);
      document.getElementById('tpm').textContent = tpm + 'M TPM';
      document.getElementById('bact').textContent = bact + ' 会话';
      document.getElementById('gpus').textContent = gpus + 'x H200';
      document.getElementById('tco').textContent = '$' + (gpus * 3062).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
