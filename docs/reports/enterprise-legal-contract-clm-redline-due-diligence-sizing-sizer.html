<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#606 LegalTech Contract CLM Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#606 LegalTech Contract CLM &amp; VDR Sizer</h2>
  <label>Contracts/Month: <span id="cLbl">25000</span></label>
  <input type="range" id="c" min="5000" max="100000" step="5000" value="25000">
  <p id="out"></p>
</div>
<script>
const c = document.getElementById('c');
function calc() {
  const n = parseInt(c.value, 10);
  document.getElementById('cLbl').textContent = n;
  const s = n / 25000;
  const cost = Math.max(2, Math.ceil(2*s)) * 950 + Math.max(2, Math.ceil(4*s)) * 3400;
  document.getElementById('out').textContent = `Self-Hosted Enclave Cost: $${cost.toLocaleString()}/mo ($${(cost/n).toFixed(2)}/contract) vs. SaaS $${(n*18).toLocaleString()}/mo`;
}
c.addEventListener('input', calc);
calc();
</script>
</body>
</html>
