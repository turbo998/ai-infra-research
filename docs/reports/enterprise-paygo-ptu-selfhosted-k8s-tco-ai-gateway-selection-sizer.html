<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise PAYGO vs. PTU vs. Self-Hosted K8s TCO &amp; AI Gateway Sizer (#512)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise `PAYGO` vs. `PTU` vs. `Self-Hosted K8s` TCO Sizer (#512)</h1>
    <label>Average Daily Capacity Utilization (`%`): <span id="uLbl">65</span>%</label>
    <input type="range" id="util" min="10" max="90" step="5" value="65" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const utilEl = document.getElementById('util');
    function calc() {
      const u = parseInt(utilEl.value, 10);
      document.getElementById('uLbl').textContent = u;
      const tier = u < 22 ? 'Stage 1 (<22% Util): Use Serverless PAYGO + 50%-Off Batch API ($0.48/1M)' :
                   (u < 55 ? 'Stage 2 (22%–55% Util): Use P65 Base PTU (75% Prefix Discount) + PAYGO Spillover ($0.29/1M, 0% 429s ✓)' :
                             'Stage 3 (>=55% Util): Deploy Self-Hosted AKS/K8s + vLLM V1/SGLang + Tidal Batch ($0.052/1M, 9.23x cheaper 🏆)');
      document.getElementById('res').textContent = `${tier} | Recommended Gateway: Azure APIM / Kong (North-South Governance) + Envoy AI Gateway / Higress (1.2ms East-West KV-Aware Routing)`;
    }
    utilEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
