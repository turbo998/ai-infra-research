<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业海量离线批处理 AI 成本计算器 (#415)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 海量离线批处理 AI 流水线吞吐与 TCO 计算器 (#415)</h1>
    <label>每晚待处理记录数 (百万条): <strong id="rTxt">10.0M 条/晚</strong></label>
    <input type="range" id="r" min="1" max="30" step="1" value="10" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="hit">96.4%</div><div class="l">2D 预排序 Prefix 命中率</div></div>
      <div class="kpi"><div class="v" id="tps">7,840 tok/s</div><div class="l">单卡 B=384 满载吞吐</div></div>
      <div class="kpi"><div class="v" id="night">$680 / 晚</div><div class="l">Tier 4 单晚运行成本</div></div>
      <div class="kpi"><div class="v" id="mo">$20,400 / 月</div><div class="l">月度总 TCO (-92.9%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const r = parseInt(document.getElementById('r').value, 10);
      document.getElementById('rTxt').textContent = r.toFixed(1) + 'M 条/晚';
      document.getElementById('night').textContent = '$' + (r * 68).toLocaleString() + ' / 晚';
      document.getElementById('mo').textContent = '$' + (r * 68 * 30).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
