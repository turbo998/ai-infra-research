  <h1>#579 企业大小模型蒸馏飞轮与级联路由：5ms 预路由 + 82/18 蒸馏级联计算器</h1>
  <p>基线（80 Peak QPS）：花 $180 (12 H200 卡时) 蒸馏专属 8B FP8 模型承接 82% 流量 + 18% 走 70B，上线 4.2 小时回本，准确率达 98.9%，P95 TTFT 压至 145ms，卡数从 48 降至 12 张 H200（年省 $129.6万）。完整交互滑块见 <a href="../h5/enterprise-model-cascade-distillation-flywheel-router-roi-lab.html">H5 精读页</a>。</p>
