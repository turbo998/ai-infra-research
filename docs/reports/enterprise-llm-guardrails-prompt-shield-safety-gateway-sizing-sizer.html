<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#584 Parallel LLM Guardrail Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#584 Parallel LLM Guardrail GPU Sizer</h2>
  <label>Gateway QPS: <span id="qLbl">100</span></label>
  <input type="range" id="q" min="10" max="500" step="10" value="100">
  <p id="out"></p>
</div>
<script>
const q = document.getElementById('q');
function calc() {
  const v = parseInt(q.value, 10);
  document.getElementById('qLbl').textContent = v;
  const gpus = Math.max(1, Math.ceil(v / 65));
  document.getElementById('out').textContent = `Guardrail Fleet: ${gpus}× L40S ($${gpus * 950}/mo) · Net TTFT Penalty: +6ms`;
}
q.addEventListener('input', calc);
calc();
</script>
</body>
</html>
