<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Native Speech-to-Speech vs. Cascaded ASR+LLM+TTS Sizer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; }
  h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 18px 0; }
  .ctrl { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  select, input { width: 100%; padding: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: #94a3b8; }
  .card .val { font-size: 24px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive Native Speech-to-Speech vs. Cascaded `ASR + LLM + TTS` Sizer (#368)</h1>
  <p style="color:#94a3b8;font-size:14px;">Provenance: synthetic + anonymized_reported (independently_reproduced=false)</p>
  <div class="grid">
    <div class="ctrl">
      <label>Voice AI Model Paradigm Tier</label>
      <select id="tier" onchange="calc()">
        <option value="1">Tier 1: Batch Turn-Based Cascade</option>
        <option value="2">Tier 2: Streaming Clause ASR+vLLM+TTS</option>
        <option value="3">Tier 3: Pure Native S2S (Moshi 12.5Hz RVQ)</option>
        <option value="4" selected>Tier 4: Hybrid Thinker-Talker (Qwen2.5-Omni)</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Peak Concurrent Voice Sessions</label>
      <input type="number" id="sessions" value="200" min="10" max="10000" step="10" oninput="calc()">
    </div>
    <div class="ctrl">
      <label>Audio Codec Frame Rate (Hz)</label>
      <select id="hz" onchange="calc()">
        <option value="12.5" selected>12.5 Hz (Mimi / Dual-Track Low-Frame Codec)</option>
        <option value="25">25 Hz (CosyVoice2 / GLM-4-Voice Tokenizer)</option>
        <option value="50">50 Hz (Legacy EnCodec / High-Frame Rate)</option>
      </select>
    </div>
  </div>
  <div class="cards">
    <div class="card"><h3>E2E Voice Response Latency</h3><div class="val" id="lat">235 ms</div></div>
    <div class="card"><h3>Enterprise Tool/RAG Accuracy</h3><div class="val" id="acc">96.4%</div></div>
    <div class="card"><h3>Emotion &amp; Prosody Retention</h3><div class="val" id="emo">92.0%</div></div>
    <div class="card"><h3>Required H100 GPUs</h3><div class="val" id="gpus">5 GPUs</div></div>
  </div>
</div>
<script>
function calc() {
  const tier = parseInt(document.getElementById('tier').value, 10);
  const sessions = parseInt(document.getElementById('sessions').value, 10) || 200;
  const hz = parseFloat(document.getElementById('hz').value) || 12.5;
  const latScale = tier >= 3 ? (hz / 12.5) * 0.2 + 0.8 : 1.0;
  const lat = Math.round(({1: 2150, 2: 480, 3: 195, 4: 235}[tier]) * latScale);
  const acc = {1: 96.5, 2: 96.8, 3: 78.5, 4: 96.4}[tier];
  const emo = {1: 5.0, 2: 18.0, 3: 95.0, 4: 92.0}[tier];
  const capPerGpu = Math.max(8, Math.round(({1: 18, 2: 42, 3: 36, 4: 48}[tier]) / (tier >= 3 ? (hz / 12.5) : 1)));
  const gpus = Math.ceil(sessions / capPerGpu);
  document.getElementById('lat').textContent = lat + ' ms';
  document.getElementById('acc').textContent = acc.toFixed(1) + '%';
  document.getElementById('emo').textContent = emo.toFixed(1) + '%';
  document.getElementById('gpus').textContent = gpus + ' GPUs';
}
calc();
</script>
</body>
</html>
