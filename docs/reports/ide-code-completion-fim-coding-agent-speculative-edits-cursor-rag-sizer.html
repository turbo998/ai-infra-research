<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>企业级 IDE 代码补全 (FIM) 与投机改写 (Fast-Apply) 容量与延迟计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #A5B4FC; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>企业级 AI 研发助手（Tab FIM 补全 + 投机 Fast-Apply 改写）容量与延迟计算器</h1>
  <div class="grid">
    <div class="control">
      <label>在线活跃研发人数 <span id="v_devs" class="val">10,000</span></label>
      <input type="range" id="devs" min="1000" max="50000" step="1000" value="10000" oninput="calc()">
    </div>
    <div class="control">
      <label>待改写源码文件长度 (Tokens) <span id="v_tok" class="val">4,800</span></label>
      <input type="range" id="tok" min="1000" max="12000" step="200" value="4800" oninput="calc()">
    </div>
    <div class="control">
      <label>文件未改动代码行占比 <span id="v_ov" class="val">92%</span></label>
      <input type="range" id="ov" min="50" max="98" step="2" value="92" oninput="calc()">
    </div>
    <div class="control">
      <label>AI 编程底座架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 70B 统一混部池 + 整文件逐 Token 重写</option>
        <option value="2">Tier 2: 独立 7B FIM + 行号 Unified Diff 补丁</option>
        <option value="3">Tier 3: 7B FIM 前缀缓存 + SEARCH/REPLACE 块</option>
        <option value="4" selected>Tier 4: 7B Next-Edit 秒级中断 + 投机 Fast-Apply (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>Tab 补全 P95 延迟</div><div id="k_tab" class="num">92 ms</div></div>
    <div class="kpi"><div>整文件 Fast-Apply 耗时</div><div id="k_app" class="num">1.35 sec</div></div>
    <div class="kpi"><div>补全代码采纳率</div><div id="k_acc" class="num">38.4%</div></div>
    <div class="kpi"><div>月度集群总成本 (TCO)</div><div id="k_tco" class="num">$44,800</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const devs = parseFloat(document.getElementById('devs').value);
  const tok = parseFloat(document.getElementById('tok').value);
  const ov = parseFloat(document.getElementById('ov').value) / 100.0;
  const mode = document.getElementById('mode').value;
  document.getElementById('v_devs').textContent = devs.toLocaleString();
  document.getElementById('v_tok').textContent = tok.toLocaleString();
  document.getElementById('v_ov').textContent = Math.round(ov * 100) + '%';

  let tab = 92, app = 1.35, acc = 38.4, baseTco = 44800;
  if (mode === '1') {
    tab = 580;
    app = +(tok * 0.00308).toFixed(2);
    acc = 14.2;
    baseTco = 168000;
  } else if (mode === '2') {
    tab = 210;
    app = +((tok * (1 - ov) * 2.5) * 0.0038).toFixed(2);
    acc = 26.5;
    baseTco = 78400;
  } else if (mode === '3') {
    tab = 145;
    app = +((tok * (1 - ov) * 2.2) * 0.0035).toFixed(2);
    acc = 31.8;
    baseTco = 61600;
  } else {
    tab = 92;
    const specSteps = (tok * ov) / 48 + tok * (1 - ov);
    app = +(specSteps * 0.0028).toFixed(2);
    acc = 38.4;
    baseTco = 44800;
  }
  const tco = Math.round(baseTco * (devs / 10000));
  document.getElementById('k_tab').textContent = tab + ' ms';
  document.getElementById('k_app').textContent = app + ' sec';
  document.getElementById('k_acc').textContent = acc + '%';
  document.getElementById('k_tco').textContent = '$' + tco.toLocaleString();
}
calc();
</script>
</body>
</html>
