<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#604 Telecom &amp; NOC AIOps Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#604 Telecom &amp; NOC AIOps 3-Stage Funnel Sizer</h2>
  <label>Daily Billion Logs: <span id="lLbl">50</span>B</label>
  <input type="range" id="l" min="10" max="200" step="10" value="50">
  <p id="out"></p>
</div>
<script>
const l = document.getElementById('l');
function calc() {
  const b = parseInt(l.value, 10);
  document.getElementById('lLbl').textContent = b;
  const inc = ((b * 1e9 / 86400) / 1378 / 494).toFixed(2);
  document.getElementById('out').textContent = `Root Incident QPS: ${inc}/s · Required RCA Fleet: ${Math.max(2, Math.ceil(inc / 0.25))}× H200`;
}
l.addEventListener('input', calc);
calc();
</script>
</body>
</html>
