<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>推理大模型思维链预算与 KV 风暴计算器 (#403)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 推理大模型 (&lt;think&gt;) 三级难度路由与 KV 风暴计算器 (#403)</h1>
    <label>选择治理档位：</label>
    <select id="t" onchange="calc()">
      <option value="4" selected>Tier 4: 65/25/10 难度路由 + 动态 &lt;/think&gt; 门控 + MTP</option>
      <option value="3">Tier 3: 65/25/10 难度路由 + 剥离历史 &lt;think&gt;</option>
      <option value="2">Tier 2: 一刀切硬截断 max_tokens=1024</option>
      <option value="1">Tier 1: 全量无约束长思考 + 保留历史 &lt;think&gt;</option>
    </select>
    <div class="kpis">
      <div class="kpi"><div class="v" id="thk">780 Tok</div><div class="l">平均思考词数</div></div>
      <div class="kpi"><div class="v" id="b">460 槽位</div><div class="l">峰值活跃 KV 会话</div></div>
      <div class="kpi"><div class="v" id="acc">94.6%</div><div class="l">综合任务准确率</div></div>
      <div class="kpi"><div class="v" id="c">$0.0038 / 次</div><div class="l">单次任务成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const m = {
        '1': ['3,450 Tok', '2,450 槽位', '94.2%', '$0.0180 / 次'],
        '2': ['820 Tok', '740 槽位', '76.5% ✕', '$0.0065 / 次'],
        '3': ['960 Tok', '820 槽位', '94.0% ✓', '$0.0052 / 次'],
        '4': ['780 Tok', '460 槽位', '94.6% 🏆', '$0.0038 / 次']
      }[document.getElementById('t').value];
      document.getElementById('thk').textContent = m[0];
      document.getElementById('b').textContent = m[1];
      document.getElementById('acc').textContent = m[2];
      document.getElementById('c').textContent = m[3];
    }
    calc();
  </script>
</body>
</html>
