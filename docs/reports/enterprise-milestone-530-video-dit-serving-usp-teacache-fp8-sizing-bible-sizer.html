<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #530: Enterprise Video DiT Serving Sizer</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #530: Enterprise Video DiT Serving Sizer</h1>
    <label>Daily 720p Video Clips Required: <span id="cLbl">10000</span> Clips/Day</label>
    <input type="range" id="clips" min="2000" max="50000" step="2000" value="10000" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const clipsEl = document.getElementById('clips');
    function calc() {
      const c = parseInt(clipsEl.value, 10);
      document.getElementById('cLbl').textContent = c;
      const gBase = Math.ceil(40 * c / 10000);
      const gOpt = Math.max(8, Math.ceil(12 * c / 10000));
      document.getElementById('res').textContent =
        `Single-GPU BF16 50-Step: 340.0s/clip, $0.293/clip, ${gBase}x H200 GPUs | xDiT USP=8 + TeaCache + SageAttention2 FP8: 11.2s/clip (30.36x faster), $0.077/clip (-73.7% cost), ${gOpt}x H200 GPUs, VBench 83.9 🏆`;
    }
    clipsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
