<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Billion-Scale Vector Search & Hybrid RAG Sizer (#467)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Billion-Scale Vector Search DRAM &amp; TCO Sizer (#467)</h1>
    <label>Vector Count (Millions): <span id="vLbl">1000</span>M</label>
    <input type="range" id="vec" min="100" max="5000" step="100" value="1000" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const vecEl = document.getElementById('vec');
    function calc() {
      const v = parseFloat(vecEl.value);
      document.getElementById('vLbl').textContent = v;
      const hnsw = (8.42 * v / 1000).toFixed(2);
      const diskann = (0.14 * v / 1000).toFixed(2);
      const tier4 = (0.38 * v / 1000).toFixed(2);
      document.getElementById('res').textContent = `FP32 HNSW DRAM: ${hnsw} TB | DiskANN DRAM: ${diskann} TB | cuVS+Tiered DRAM: ${tier4} TB (-95.5% DRAM, -90.7% TCO)`;
    }
    vecEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
