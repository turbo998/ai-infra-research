<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业微调平台与 Multi-LoRA 共池 TCO 计算器 (#410)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业微调平台与 Multi-LoRA 共池计算器 (#410)</h1>
    <label>部门微调模型数量: <strong id="nTxt">40</strong></label>
    <input type="range" id="n" min="2" max="100" step="2" value="40" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="silo">160 张卡</div><div class="l">独立合并部署所需 GPU</div></div>
      <div class="kpi"><div class="v" id="mlora">8 张 H200</div><div class="l">vLLM Multi-LoRA 共池 GPU</div></div>
      <div class="kpi"><div class="v" id="tco">$21,500 / 月</div><div class="l">Tier 4 训推月度总成本</div></div>
      <div class="kpi"><div class="v" id="save">-94.4%</div><div class="l">相比独立部署节省比例</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const n = parseInt(document.getElementById('n').value, 10);
      document.getElementById('nTxt').textContent = n;
      document.getElementById('silo').textContent = (n * 4) + ' 张卡';
      const tco = Math.round(12900 + n * 215);
      document.getElementById('tco').textContent = '$' + tco.toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
