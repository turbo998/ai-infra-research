<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#662 多云 GPU 联邦与 Spot 竞价套利计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #662 企业多云 Spot 竞价套利与节省计算器</h1>
    <label><span>弹性云 GPU 数量</span><span id="l-g">128× H200</span></label>
    <input type="range" id="r-g" min="32" max="512" step="32" value="128" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-rate">$1.45/GPU·h</div><div>混合 Spot 综合单价 (-54.7%)</div></div>
      <div class="box"><div class="val" id="o-mo">$133,632/月</div><div>月度云算力支出</div></div>
      <div class="box"><div class="val" id="o-save">省 $193.5万/年</div><div>相比按需实例年节省</div></div>
    </div>
  </div>
<script>
function run() {
  const g = +document.getElementById('r-g').value;
  document.getElementById('l-g').textContent = g + '× H200';
  const mo = g * 720 * 1.45;
  const od = g * 720 * 3.20;
  document.getElementById('o-mo').textContent = '$' + Math.round(mo).toLocaleString() + '/月';
  document.getElementById('o-save').textContent = '省 $' + (((od - mo)*12)/10000).toFixed(1) + '万/年';
}
run();
</script>
</body>
</html>
