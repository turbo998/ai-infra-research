<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>大模型持续评估 (LLM-as-a-Judge / RAGAS / Prometheus-2) 成本与准确性计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #38BDF8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>大模型生产持续评估（LLM-as-a-Judge / Prometheus-2 / RAGAS Triad）容量与成本计算器</h1>
  <div class="grid">
    <div class="control">
      <label>月度抽样评估轨迹数 (万条) <span id="v_tr" class="val">500万</span></label>
      <input type="range" id="tr" min="50" max="2000" step="50" value="500" oninput="calc()">
    </div>
    <div class="control">
      <label>单条轨迹上下文长度 <span id="v_tok" class="val">4800</span></label>
      <input type="range" id="tok" min="1200" max="16000" step="400" value="4800" oninput="calc()">
    </div>
    <div class="control">
      <label>旗舰仲裁升级比例 (%) <span id="v_esc" class="val">5%</span></label>
      <input type="range" id="esc" min="1" max="25" step="1" value="5" oninput="calc()">
    </div>
    <div class="control">
      <label>评估裁判架构档位</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 100% 商业旗舰 API 裁判 (GPT-4o/Claude)</option>
        <option value="2">Tier 2: 传统字面/向量相似度 (BLEU/ROUGE)</option>
        <option value="3">Tier 3: 自建通用 70B-FP8 独占实例裁判</option>
        <option value="4" selected>Tier 4: DeBERTa NLI + Prometheus-2 14B 双投 + 5% 仲裁 (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>人类专家一致性 (κ)</div><div id="k_kap" class="num">0.894</div></div>
    <div class="kpi"><div>位置与长度偏见误判率</div><div id="k_bias" class="num">3.4%</div></div>
    <div class="kpi"><div>千条轨迹评估单价</div><div id="k_unit" class="num">$1.36</div></div>
    <div class="kpi"><div>月度评估总成本 (TCO)</div><div id="k_tco" class="num">$6,800</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const tr = parseFloat(document.getElementById('tr').value);
  const tok = parseFloat(document.getElementById('tok').value);
  const esc = parseFloat(document.getElementById('esc').value) / 100.0;
  const mode = document.getElementById('mode').value;
  document.getElementById('v_tr').textContent = tr + '万';
  document.getElementById('v_tok').textContent = tok;
  document.getElementById('v_esc').textContent = Math.round(esc * 100) + '%';

  const tokScale = tok / 4800.0;
  let kap = 0.894, bias = 3.4, unit = 1.36;
  if (mode === '1') {
    kap = 0.865;
    bias = 14.8;
    unit = +(29.0 * tokScale).toFixed(2);
  } else if (mode === '2') {
    kap = 0.412;
    bias = 38.5;
    unit = 0.15;
  } else if (mode === '3') {
    kap = 0.842;
    bias = 16.2;
    unit = +(5.60 * tokScale).toFixed(2);
  } else {
    kap = +(0.885 + esc * 0.18).toFixed(3);
    bias = 3.4;
    unit = +((0.45 + 29.0 * esc * 0.62) * tokScale).toFixed(2);
  }
  const tco = Math.round(tr * 10 * unit);
  document.getElementById('k_kap').textContent = kap;
  document.getElementById('k_bias').textContent = bias + '%';
  document.getElementById('k_unit').textContent = '$' + unit;
  document.getElementById('k_tco').textContent = '$' + tco.toLocaleString();
}
calc();
</script>
</body>
</html>
