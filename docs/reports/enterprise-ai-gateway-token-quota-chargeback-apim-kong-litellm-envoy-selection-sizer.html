<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 AI 网关 Token 配额与部门分账计算器 (#412)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业 AI 网关两阶段加权 Token 桶与分账计算器 (#412)</h1>
    <label>选择网关治理档位：</label>
    <select id="t" onchange="calc()">
      <option value="4" selected>Tier 4: 四元组加权两阶段实结 + 闲时互借 + 定向溢出</option>
      <option value="3">Tier 3: 两阶段流式 Token 桶 + 美元硬顶</option>
      <option value="2">Tier 2: 静态硬切分 + max_tokens 死扣</option>
      <option value="1">Tier 1: 传统 RPM 限流 + 按次平摊</option>
    </select>
    <div class="kpis">
      <div class="kpi"><div class="v" id="err">0.02%</div><div class="l">财务分账误差率</div></div>
      <div class="kpi"><div class="v" id="util">89.4%</div><div class="l">共池有效利用率</div></div>
      <div class="kpi"><div class="v" id="drop">0.0%</div><div class="l">吵闹邻居误伤率</div></div>
      <div class="kpi"><div class="v" id="spend">$56,500 / 月</div><div class="l">月度算力净支出 (-61%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const m = {
        '1': ['38.5% ✕', '48.0% ✕', '29.4% ✕', '$145,000 / 月'],
        '2': ['16.2%', '52.5%', '1.2%', '$118,000 / 月'],
        '3': ['0.8% ✓', '76.0% ✓', '0.3% ✓', '$78,000 / 月'],
        '4': ['0.02% 🏆', '89.4% 🏆', '0.0% 🏆', '$56,500 / 月']
      }[document.getElementById('t').value];
      document.getElementById('err').textContent = m[0];
      document.getElementById('util').textContent = m[1];
      document.getElementById('drop').textContent = m[2];
      document.getElementById('spend').textContent = m[3];
    }
    calc();
  </script>
</body>
</html>
