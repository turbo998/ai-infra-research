<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Semantic Cache &amp; Prefix KV Dual-Layer Sizer (#524)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Semantic Cache &amp; Prefix KV Dual-Layer Sizer (#524)</h1>
    <label>Platform Traffic (`RPS`): <span id="rLbl">60</span> RPS</label>
    <input type="range" id="rps" min="15" max="240" step="15" value="60" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const rpsEl = document.getElementById('rps');
    function calc() {
      const r = parseInt(rpsEl.value, 10);
      document.getElementById('rLbl').textContent = r;
      const gNone = Math.ceil(32 * r / 60);
      const gDual = Math.max(4, Math.ceil(10 * r / 60));
      document.getElementById('res').textContent =
        `Naive Cosine 0.85 Cache: 14.20% False-Positive Collisions (Reject ✕) | Zero Cache: ${gNone}x H200 (920ms P95 TTFT) | Dual-Layer (Entity Slot Guard + Cross-Encoder >= 0.96 + SGLang Radix Prefix KV): ${gDual}x H200 GPUs (-68.8% GPUs, 0.08% error [177.5x lower], 145ms P95 TTFT 🏆)`;
    }
    rpsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
