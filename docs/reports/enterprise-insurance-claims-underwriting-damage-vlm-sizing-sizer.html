<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#612 Insurance Claims STP Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#612 Insurance Claims STP &amp; Fraud Sizer</h2>
  <label>Monthly Million Claims: <span id="cLbl">1.2</span>M</label>
  <input type="range" id="c" min="0.2" max="5.0" step="0.2" value="1.2">
  <p id="out"></p>
</div>
<script>
const c = document.getElementById('c');
function calc() {
  const m = parseFloat(c.value);
  document.getElementById('cLbl').textContent = m.toFixed(1);
  const s = m / 1.2;
  const cost = Math.max(2, Math.ceil(4*s))*950 + Math.max(2, Math.ceil(6*s))*3400;
  document.getElementById('out').textContent = `3-Tier Fleet Cost: $${cost.toLocaleString()}/mo ($0.020/claim) vs. Cloud API: $${Math.round(m*1.8e6).toLocaleString()}/mo`;
}
c.addEventListener('input', calc);
calc();
</script>
</body>
</html>
