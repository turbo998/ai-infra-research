<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 MCP 工具网关与 Token 节省计算器 (#423)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级 MCP 网关与尾部延迟发现 Token 计算器 (#423)</h1>
    <label>企业注册 MCP 工具总数: <strong id="tTxt">250 个工具</strong></label>
    <input type="range" id="t" min="20" max="500" step="10" value="250" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="raw">285,000 Tok</div><div class="l">全量硬塞 5 步任务 Token</div></div>
      <div class="kpi"><div class="v" id="opt">16,400 Tok</div><div class="l">尾部延迟发现 5 步 Token</div></div>
      <div class="kpi"><div class="v" id="kv">91.5%</div><div class="l">Prefix KV 缓存命中率</div></div>
      <div class="kpi"><div class="v" id="tco">$8,200 / 月</div><div class="l">月度 Token 总成本 (-94.2%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const t = parseInt(document.getElementById('t').value, 10);
      document.getElementById('tTxt').textContent = t + ' 个工具';
      document.getElementById('raw').textContent = (t * 220 * 5 + 10000).toLocaleString() + ' Tok';
    }
    calc();
  </script>
</body>
</html>
