<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#586 Multi-LoRA Serving Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#586 Multi-LoRA vs. Dedicated GPU Sizer</h2>
  <label>Tenants: <span id="tLbl">100</span></label>
  <input type="range" id="t" min="10" max="500" step="10" value="100">
  <p id="out"></p>
</div>
<script>
const t = document.getElementById('t');
function calc() {
  const n = parseInt(t.value, 10);
  document.getElementById('tLbl').textContent = n;
  document.getElementById('out').textContent = `Multi-LoRA Pool: 4× H200 ($13,600/mo) vs. Dedicated Pods: ${n * 2}× H100 ($${(n * 4600).toLocaleString()}/mo)`;
}
t.addEventListener('input', calc);
calc();
</script>
</body>
</html>
