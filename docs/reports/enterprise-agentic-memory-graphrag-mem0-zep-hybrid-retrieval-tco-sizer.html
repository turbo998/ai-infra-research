<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Agent 长期记忆与 GraphRAG (Mem0 / Zep / LightRAG / GraphRAG) 成本与延迟计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #C084FC; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>企业级 Agent 长期记忆与知识图谱（Mem0 / Zep / LightRAG / GraphRAG）TCO 计算器</h1>
  <div class="grid">
    <div class="control">
      <label>月度 Agent 查询总量 (万次) <span id="v_q" class="val">120万</span></label>
      <input type="range" id="q" min="20" max="500" step="20" value="120" oninput="calc()">
    </div>
    <div class="control">
      <label>全量会话历史平均长度 (K) <span id="v_hist" class="val">64K</span></label>
      <input type="range" id="hist" min="16" max="128" step="8" value="64" oninput="calc()">
    </div>
    <div class="control">
      <label>全局多跳/跨文档问题占比 <span id="v_hop" class="val">25%</span></label>
      <input type="range" id="hop" min="5" max="80" step="5" value="25" oninput="calc()">
    </div>
    <div class="control">
      <label>记忆与知识图谱架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 全量长上下文历史每轮硬塞 (Full Stuffing)</option>
        <option value="2">Tier 2: 纯切片向量检索 (Naive Vector RAG)</option>
        <option value="3">Tier 3: 重型全社区 Map-Reduce GraphRAG</option>
        <option value="4" selected>Tier 4: Mem0/Zep 时序记忆 + LightRAG 双层图路由 (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>单轮平均 Prompt Tokens</div><div id="k_tok" class="num">4,600</div></div>
    <div class="kpi"><div>检索+首字 P95 延迟</div><div id="k_lat" class="num">265 ms</div></div>
    <div class="kpi"><div>多跳与时序记忆准确率</div><div id="k_acc" class="num">91.5%</div></div>
    <div class="kpi"><div>月度平台总成本 (TCO)</div><div id="k_tco" class="num">$34,500</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const q = parseFloat(document.getElementById('q').value);
  const hist = parseFloat(document.getElementById('hist').value);
  const hop = parseFloat(document.getElementById('hop').value) / 100.0;
  const mode = document.getElementById('mode').value;
  document.getElementById('v_q').textContent = q + '万';
  document.getElementById('v_hist').textContent = hist + 'K';
  document.getElementById('v_hop').textContent = Math.round(hop * 100) + '%';

  let tok = 4600, lat = 265, acc = 91.5;
  if (mode === '1') {
    tok = hist * 1000;
    lat = Math.round(hist * 38.75);
    acc = 74.2;
  } else if (mode === '2') {
    tok = 3200;
    lat = 185;
    acc = +(82.0 - hop * 118.4).toFixed(1);
  } else if (mode === '3') {
    tok = 28500;
    lat = 3450;
    acc = 90.8;
  } else {
    tok = Math.round(3200 * (1 - hop) + 8800 * hop);
    lat = Math.round(185 * (1 - hop) + 505 * hop);
    acc = 91.5;
  }
  const tco = Math.round((q / 120) * (tok / 4600) * 34500);
  document.getElementById('k_tok').textContent = tok.toLocaleString();
  document.getElementById('k_lat').textContent = lat.toLocaleString() + ' ms';
  document.getElementById('k_acc').textContent = acc + '%';
  document.getElementById('k_tco').textContent = '$' + tco.toLocaleString();
}
calc();
</script>
</body>
</html>
