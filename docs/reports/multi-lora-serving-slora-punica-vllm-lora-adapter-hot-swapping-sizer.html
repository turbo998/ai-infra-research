<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>多租户动态 LoRA 服务 (Multi-LoRA Serving) 显存槽位与 TCO 计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #FDE68A; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>多租户动态 LoRA 服务（Punica / S-LoRA / vLLM）GPU 卡数与显存槽位计算器</h1>
  <div class="grid">
    <div class="control">
      <label>微调租户 LoRA 总数 <span id="v_cnt" class="val">500</span></label>
      <input type="range" id="cnt" min="20" max="2000" step="20" value="500" oninput="calc()">
    </div>
    <div class="control">
      <label>LoRA Rank 阶数 (r) <span id="v_rank" class="val">32</span></label>
      <select id="rank" onchange="calc()">
        <option value="16">r = 16 (~160 MB / Adapter)</option>
        <option value="32" selected>r = 32 (~320 MB / Adapter)</option>
        <option value="64">r = 64 (~640 MB / Adapter)</option>
      </select>
    </div>
    <div class="control">
      <label>平台聚合总请求率 (RPS) <span id="v_rps" class="val">240</span></label>
      <input type="range" id="rps" min="40" max="1000" step="20" value="240" oninput="calc()">
    </div>
    <div class="control">
      <label>多 LoRA 部署架构档位</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 离线合并权重独立 Pod 部署</option>
        <option value="2">Tier 2: 按需从网络盘同步下载替换</option>
        <option value="3">Tier 3: vLLM Multi-LoRA + 随机轮询路由</option>
        <option value="4" selected>Tier 4: S-LoRA 统一分页 + 一致性哈希网关 (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>所需 H200 GPU 总数</div><div id="k_gpus" class="num">16 GPUs</div></div>
    <div class="kpi"><div>主机锁页内存池需求</div><div id="k_ram" class="num">160 GB</div></div>
    <div class="kpi"><div>冷换入 TTFT 损耗</div><div id="k_swap" class="num">+6.5 ms</div></div>
    <div class="kpi"><div>月度集群总成本 (TCO)</div><div id="k_tco" class="num">$44,800</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const cnt = parseFloat(document.getElementById('cnt').value);
  const rank = parseFloat(document.getElementById('rank').value);
  const rps = parseFloat(document.getElementById('rps').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_cnt').textContent = cnt;
  document.getElementById('v_rank').textContent = rank;
  document.getElementById('v_rps').textContent = rps;

  const adapterMB = rank * 10;
  const hostRamGB = Math.round((cnt * adapterMB) / 1024);
  let gpus = 16, swap = 6.5;
  if (mode === '1') {
    gpus = Math.max(Math.ceil(cnt * 0.25) * 2, Math.ceil(rps / 16) * 2);
    swap = 0.0;
  } else if (mode === '2') {
    gpus = Math.ceil(rps / 15) * 2;
    swap = +(adapterMB * 5.78).toFixed(1);
  } else if (mode === '3') {
    gpus = Math.ceil(rps / 20) * 2;
    swap = +(adapterMB * 0.0875).toFixed(1);
  } else {
    gpus = Math.ceil(rps / 30) * 2;
    swap = +(adapterMB * 0.0203).toFixed(1);
  }
  const tco = gpus * 2800;
  document.getElementById('k_gpus').textContent = gpus + ' GPUs';
  document.getElementById('k_ram').textContent = hostRamGB.toLocaleString() + ' GB';
  document.getElementById('k_swap').textContent = '+' + swap + ' ms';
  document.getElementById('k_tco').textContent = '$' + tco.toLocaleString();
}
calc();
</script>
</body>
</html>
