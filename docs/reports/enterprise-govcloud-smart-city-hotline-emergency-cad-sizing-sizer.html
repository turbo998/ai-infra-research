<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#615 Smart City &amp; GovCloud Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#615 Smart City &amp; Sovereign GovCloud Sizer</h2>
  <label>Municipal Cameras: <span id="cLbl">10000</span></label>
  <input type="range" id="c" min="2000" max="50000" step="2000" value="10000">
  <p id="out"></p>
</div>
<script>
const c = document.getElementById('c');
function calc() {
  const n = parseInt(c.value, 10);
  document.getElementById('cLbl').textContent = n.toLocaleString();
  const l40s = Math.max(2, Math.ceil(n / 1250));
  document.getElementById('out').textContent = `GovCloud Video Verification Pool (0.3% Edge Funnel): ${l40s}× L40S vs. Unfiltered Cloud VLM: ${Math.ceil(n / 71.4)}× H100`;
}
c.addEventListener('input', calc);
calc();
</script>
</body>
</html>
