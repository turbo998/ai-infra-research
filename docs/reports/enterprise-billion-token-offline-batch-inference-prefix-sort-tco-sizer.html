<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#648 十亿词元离线批处理前缀重排与容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #648 企业每晚十亿词元 (T+1) 离线批处理容量与 TCO 计算器</h1>
    <label><span>每晚总词元量 (亿 Tokens)</span><span id="l-t">10 亿</span></label>
    <input type="range" id="r-t" min="2" max="50" step="2" value="10" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-hrs">6.57 小时</div><div>16×H200 前缀重排耗时</div></div>
      <div class="box"><div class="val" id="o-spd">3.02×</div><div>相比乱序在线模式提速</div></div>
      <div class="box"><div class="val" id="o-cost">$0.024/1M</div><div>夜间回填单百万词成本</div></div>
    </div>
  </div>
<script>
function run() {
  const t = +document.getElementById('r-t').value;
  document.getElementById('l-t').textContent = t + ' 亿';
  const hrs = (t * 1e8) / (16900 * 2) / 3600;
  document.getElementById('o-hrs').textContent = hrs.toFixed(2) + ' 小时';
}
run();
</script>
</body>
</html>
