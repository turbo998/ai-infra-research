<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #510: Enterprise AI Fabric (NVLink / IB / RoCEv2 &amp; busbw) Sizer</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    select, input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #510: Enterprise AI Fabric &amp; `algbw/busbw` Sizer</h1>
    <label>Fabric Configuration:</label>
    <select id="fab">
      <option value="bounce">400G RoCEv2 without GPUDirect (CPU Bounce · 11.4 GB/s busbw ✕)</option>
      <option value="ecmp">400G RoCEv2 Static 5-Tuple ECMP (21.4 GB/s busbw ✕)</option>
      <option value="roce" selected>400G AI Ethernet RoCEv2 (Rail + ECN/DCQCN + DLB · 46.4 GB/s busbw 🏆)</option>
      <option value="ib">400G InfiniBand NDR + SHARP (48.2 GB/s busbw · 34.8 GB/s algbw 🏆)</option>
      <option value="nvlink">Intra-Node H200 NVLink 4.0 + NVSwitch (371.0 GB/s busbw)</option>
    </select>
    <div class="out" id="res"></div>
  </div>
  <script>
    const fabEl = document.getElementById('fab');
    function calc() {
      const map = {
        bounce: '400G RoCEv2 CPU Bounce | AllReduce algbw: 5.8 GB/s | busbw: 11.4 GB/s (22.8% wire eff.) | Latency: 18.5 us (Reject ✕)',
        ecmp: '400G RoCEv2 Static ECMP | AllReduce algbw: 10.9 GB/s | busbw: 21.4 GB/s (42.8% wire eff.) | Latency: 6.8 us (Reject ✕)',
        roce: '400G AI Ethernet RoCEv2 (Rail + ECN/DCQCN + DLB 🏆) | AllReduce algbw: 23.6 GB/s | busbw: 46.4 GB/s (96.3% of IB!) | Latency: 2.6 us | CapEx: -32.5% 🏆',
        ib: '400G InfiniBand NDR + SHARP 🏆 | AllReduce algbw: 34.8 GB/s (with SHARP) | busbw: 48.2 GB/s (96.4% wire eff.) | Latency: 1.5 us 🏆',
        nvlink: 'Intra-Node H200 NVLink 4.0 + NVSwitch | AllReduce algbw: 212.0 GB/s | busbw: 371.0 GB/s | Latency: 0.8 us (Scale-Up Reference)'
      };
      document.getElementById('res').textContent = map[fabEl.value];
    }
    fabEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
