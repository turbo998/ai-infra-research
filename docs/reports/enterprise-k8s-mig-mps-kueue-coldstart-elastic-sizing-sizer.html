<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#634 Enterprise K8s Hardware MIG &amp; 14.2s Cold-Start Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#634 Enterprise K8s `Hardware MIG` &amp; `14.2s` Cold-Start Sizer</h1>
    <label>Small Auxiliary Microservices: <span id="sVal">28</span> services</label>
    <input type="range" id="s" min="7" max="56" step="7" value="28" />
    <p>MIG Consolidated GPUs: <span class="val" id="outMig">4× H200 (vs 28 Whole-GPU)</span> · Total Fleet: <span class="val" id="outTot">24× H200 (-62.5% vs 64 Legacy)</span></p>
  </div>
  <script>
    function calc(){
      const s = +document.getElementById('s').value;
      document.getElementById('sVal').textContent = s;
      const mig = Math.ceil(s / 7);
      const tot = 16 + mig + 4;
      const leg = 16 + s + 20;
      document.getElementById('outMig').textContent = mig + '× H200 (vs ' + s + ' Whole-GPU)';
      document.getElementById('outTot').textContent = tot + '× H200 (-' + ((1 - tot/leg)*100).toFixed(1) + '% vs ' + leg + ' Legacy)';
    }
    document.getElementById('s').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
