<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piecewise CUDA Graph &amp; torch.compile Sizer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; }
  h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 18px 0; }
  .ctrl { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  select, input { width: 100%; padding: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: #94a3b8; }
  .card .val { font-size: 24px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive Piecewise CUDA Graph (`vLLM V1 + torch.compile`) Sizer (#389)</h1>
  <p style="color:#94a3b8;font-size:14px;">Provenance: synthetic + anonymized_reported (independently_reproduced=false)</p>
  <div class="grid">
    <div class="ctrl">
      <label>CUDA Graph &amp; Compilation Tier</label>
      <select id="tier" onchange="calc()">
        <option value="1">Tier 1: Eager Mode (--enforce-eager)</option>
        <option value="2">Tier 2: Legacy V0 Decode-Only Full Graphs</option>
        <option value="3">Tier 3: Uncached torch.compile + Full Graphs</option>
        <option value="4" selected>Tier 4: V1 Piecewise CUDA Graphs + Cached Compile</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Captured Token/Batch Shape Buckets</label>
      <input type="number" id="buckets" value="32" min="8" max="64" step="4" oninput="calc()">
    </div>
    <div class="ctrl">
      <label>Fraction of Steps With Chunked Prefill (%)</label>
      <input type="number" id="mix" value="40" min="0" max="100" step="10" oninput="calc()">
    </div>
  </div>
  <div class="cards">
    <div class="card"><h3>Pure Decode TPOT</h3><div class="val" id="tpot">8.9 ms</div></div>
    <div class="card"><h3>Blended Mixed-Step Latency</h3><div class="val" id="blended">11.0 ms</div></div>
    <div class="card"><h3>Graph Pool HBM / GPU</h3><div class="val" id="hbm">1.50 GB</div></div>
    <div class="card"><h3>Startup Compilation Time</h3><div class="val" id="boot">3.8 sec</div></div>
  </div>
</div>
<script>
function calc() {
  const tier = parseInt(document.getElementById('tier').value, 10);
  const buckets = parseInt(document.getElementById('buckets').value, 10) || 32;
  const mix = (parseFloat(document.getElementById('mix').value) || 40) / 100.0;
  const bScale = buckets / 32.0;
  const tpot = {1: 14.8, 2: 10.6, 3: 9.4, 4: 8.9}[tier];
  const mixedStep = {1: 22.5, 2: 21.8, 3: 20.5, 4: 14.2}[tier];
  const blended = (1.0 - mix) * tpot + mix * mixedStep;
  const hbm = ({1: 0.0, 2: 4.8, 3: 4.2, 4: 1.5}[tier]) * bScale;
  const boot = ({1: 0.0, 2: 24.0, 3: 145.0, 4: 3.8}[tier]) * bScale;
  document.getElementById('tpot').textContent = tpot.toFixed(1) + ' ms';
  document.getElementById('blended').textContent = blended.toFixed(1) + ' ms';
  document.getElementById('hbm').textContent = hbm.toFixed(2) + ' GB';
  document.getElementById('boot').textContent = boot.toFixed(1) + ' sec';
}
calc();
</script>
</body>
</html>
