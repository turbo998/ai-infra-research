<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#554 企业半导体芯片设计 EDA 智能助手 容量计算器 (Sizer)</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#f8fafc;padding:24px}
.box{max-width:920px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px}
h1{font-size:22px;margin-top:0;color:#38bdf8}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
.stat{background:#0f172a;padding:14px;border-radius:8px;border:1px solid #334155}
.stat b{display:block;font-size:22px;color:#10b981}
</style>
</head>
<body>
<div class="box">
  <h1>#554 企业半导体芯片设计 EDA (FSM + 双盲 RTL/SVA + 形式化闭环) 容量计算器</h1>
  <p>基线：FSM 状态机拆解 + 双盲 RTL/SVA 生成 + 形式化反例闭环实现 96.8% 可综合率、91.4% 形式化功能通过率，单 IP 验证收敛周期从 21 天缩至 5.8 天（降 72.4%，16 张 H200）。</p>
  <div class="row">
    <div class="stat">可综合率 / 形式化通过率<b>96.8% · 91.4%</b></div>
    <div class="stat">验证收敛周期 / 降幅<b>5.8 天 · -72.4%</b></div>
    <div class="stat">所需 H200 / 省卡比例<b>16 GPUs · -50.0%</b></div>
  </div>
</div>
</body>
</html>
