<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#646 十亿级混合 RAG (HNSW vs DiskANN vs cuVS) 容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #646 企业十亿级向量索引内存与 Reranker 省卡计算器</h1>
    <label><span>向量规模 (亿条 · 1024维)</span><span id="l-v">10 亿条</span></label>
    <input type="range" id="r-v" min="1" max="20" step="1" value="10" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-fp32">4,920 GB</div><div>FP32 HNSW 内存需求</div></div>
      <div class="box"><div class="val" id="o-disk">192 GB</div><div>DiskANN 内存需求 (-96.1%)</div></div>
      <div class="box"><div class="val" id="o-llm">省 12× H200</div><div>2×L40S Reranker 节省 LLM 卡</div></div>
    </div>
  </div>
<script>
function run() {
  const v = +document.getElementById('r-v').value;
  document.getElementById('l-v').textContent = v + ' 亿条';
  document.getElementById('o-fp32').textContent = Math.round(v * 492).toLocaleString() + ' GB';
  document.getElementById('o-disk').textContent = Math.round(v * 19.2) + ' GB';
}
run();
</script>
</body>
</html>
