<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>🏛️ #620 Milestone: 58-Round &amp; 19-Industry Portfolio Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#fbbf24; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🏛️ #620 Milestone: 58-Round Enterprise AI &amp; 19-Industry Portfolio Sizer</h1>
    <label>Active Enterprise Verticals Deployed: <span id="vVal">19</span> industries</label>
    <input type="range" id="v" min="1" max="19" step="1" value="19" />
    <label>Nightly Tidal Batch Reuse Credit: <span id="tVal">35</span>%</label>
    <input type="range" id="t" min="0" max="50" step="5" value="35" />
    <p>Portfolio Monthly TCO: <span class="val" id="outCost">$844,500 / mo</span> (vs. <span id="outBase">$9,820,000 / mo</span> naive baseline · Savings: <span class="val" id="outPct">91.4%</span>)</p>
  </div>
  <script>
    function calc(){
      const v = +document.getElementById('v').value;
      const t = +document.getElementById('t').value / 100;
      document.getElementById('vVal').textContent = v;
      document.getElementById('tVal').textContent = Math.round(t*100);
      const base = Math.round((v/19)*9820000);
      const opt = Math.round((v/19)*844500 * ((1 - t) / 0.65));
      const pct = ((1 - opt/base)*100).toFixed(1);
      document.getElementById('outCost').textContent = '$' + opt.toLocaleString() + ' / mo';
      document.getElementById('outBase').textContent = '$' + base.toLocaleString() + ' / mo';
      document.getElementById('outPct').textContent = pct + '%';
    }
    document.getElementById('v').addEventListener('input', calc);
    document.getElementById('t').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
