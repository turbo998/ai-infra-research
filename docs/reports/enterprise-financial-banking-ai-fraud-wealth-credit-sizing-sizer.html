<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#601 Financial &amp; Banking AI Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#601 Banking AI Two-Speed Fraud &amp; Wealth Sizer</h2>
  <label>Payment TPS: <span id="tLbl">2500</span></label>
  <input type="range" id="t" min="500" max="10000" step="500" value="2500">
  <p id="out"></p>
</div>
<script>
const t = document.getElementById('t');
function calc() {
  const v = parseInt(t.value, 10);
  document.getElementById('tLbl').textContent = v;
  const s2 = Math.round(v * 0.06);
  const l40s = Math.max(2, Math.ceil(s2 / 80)) + 2;
  document.getElementById('out').textContent = `Grey-Zone SLM QPS: ${s2} · Inline P99: 29ms · L40S Pool: ${l40s} GPUs`;
}
t.addEventListener('input', calc);
calc();
</script>
</body>
</html>
