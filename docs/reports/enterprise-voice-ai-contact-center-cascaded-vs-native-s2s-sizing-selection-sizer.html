<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Voice AI Contact Center (&lt;=300ms M2E) Sizer (#513)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Real-Time Voice AI Contact Center Sizer (#513)</h1>
    <label>Concurrent Active Voice Lines: <span id="lLbl">1000</span> Lines</label>
    <input type="range" id="lines" min="100" max="5000" step="100" value="1000" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const linesEl = document.getElementById('lines');
    function calc() {
      const l = parseInt(linesEl.value, 10);
      document.getElementById('lLbl').textContent = l;
      const gpus = Math.max(4, Math.ceil(16 * l / 1000));
      const apiCost = Math.round(1512000 * l / 1000).toLocaleString();
      const streamCost = Math.round(118800 * l / 1000).toLocaleString();
      document.getElementById('res').textContent =
        `Native Realtime API: $${apiCost}/yr (260ms P95 M2E) | Streaming Speculative Cascade (LiveKit + SGLang + Streaming TTS): ${gpus}x H200 GPUs, $${streamCost}/yr (-92.1% TCO, 275ms P95 M2E, 99.6% Compliance Audit 🏆)`;
    }
    linesEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
