<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能制造 AOI 质检与 PHM 计算器 (#429)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 智能制造 AOI (PatchCore + VLM 复判) 与 PHM 计算器 (#429)</h1>
    <label>高速自动化产线条数: <strong id="lTxt">20 条</strong></label>
    <input type="range" id="l" min="2" max="60" step="2" value="20" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="lat">6.8 ms</div><div class="l">边缘在线剔除延迟</div></div>
      <div class="kpi"><div class="v" id="ovk">1.2%</div><div class="l">VLM 复判后过杀率</div></div>
      <div class="kpi"><div class="v" id="esc">0.04%</div><div class="l">未知缺陷漏检率</div></div>
      <div class="kpi"><div class="v" id="yr">$240,000 / 年</div><div class="l">年度总成本 (-87.0%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const l = parseInt(document.getElementById('l').value, 10);
      document.getElementById('lTxt').textContent = l + ' 条';
      document.getElementById('yr').textContent = '$' + Math.round(l * 12000).toLocaleString() + ' / 年';
    }
    calc();
  </script>
</body>
</html>
