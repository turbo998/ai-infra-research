<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#659 跨园区/跨数据中心 DCI 缓冲与效率计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #659 跨楼宇智算互联 (Scale-Across DCI) PFC 缓冲计算器</h1>
    <label><span>跨楼光纤距离 (km)</span><span id="l-d">5.0 km</span></label>
    <input type="range" id="r-d" min="0.5" max="40" step="0.5" value="5.0" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-rtt">50.0 µs</div><div>光纤往返延迟 (RTT)</div></div>
      <div class="box"><div class="val" id="o-buf">2,500 KB</div><div>400G 单口所需 Headroom</div></div>
      <div class="box"><div class="val" id="o-eff">94.2%</div><div>跨楼 PP/PD 算力保持率</div></div>
    </div>
  </div>
<script>
function run() {
  const d = +document.getElementById('r-d').value;
  document.getElementById('l-d').textContent = d.toFixed(1) + ' km';
  document.getElementById('o-rtt').textContent = (d * 10).toFixed(1) + ' µs';
  document.getElementById('o-buf').textContent = Math.round(d * 500).toLocaleString() + ' KB';
  document.getElementById('o-eff').textContent = Math.max(85, 95.5 - d * 0.26).toFixed(1) + '%';
}
run();
</script>
</body>
</html>
