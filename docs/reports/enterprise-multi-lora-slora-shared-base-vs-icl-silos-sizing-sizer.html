<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#636 Enterprise Multi-LoRA (`S-LoRA / Punica`) Shared-Base Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#636 Enterprise Multi-LoRA (`S-LoRA / vLLM`) Shared-Base Sizer</h1>
    <label>Departmental Fine-Tuned Adapters: <span id="nVal">128</span> adapters</label>
    <input type="range" id="n" min="8" max="256" step="8" value="128" />
    <p>Shared-Base H200 GPUs: <span class="val" id="outG">8× H200 (-96.9% vs 256 Merged Silos)</span> · Annual Saved: <span class="val" id="outS">$9,523,200/yr</span></p>
  </div>
  <script>
    function calc(){
      const n = +document.getElementById('n').value;
      document.getElementById('nVal').textContent = n;
      const silos = n * 2;
      const pct = ((1 - 8 / silos) * 100).toFixed(1);
      const saved = (silos - 8) * 3200 * 12;
      document.getElementById('outG').textContent = '8× H200 (-' + pct + '% vs ' + silos + ' Merged Silos)';
      document.getElementById('outS').textContent = '$' + saved.toLocaleString() + '/yr';
    }
    document.getElementById('n').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
