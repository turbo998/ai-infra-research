<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#652 多智能体工作流 (Multi-Agent DAG) 上下文与容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #652 企业多智能体工作流 (Multi-Agent DAG) 容量计算器</h1>
    <label><span>子 Agent 协作步数 (K)</span><span id="l-k">6 步</span></label>
    <input type="range" id="r-k" min="3" max="12" step="1" value="6" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-bad">148.0K tok</div><div>全量广播累积 Token</div></div>
      <div class="box"><div class="val" id="o-opt">18.2K tok</div><div>黑板+共享 KV 未缓存 Token</div></div>
      <div class="box"><div class="val" id="o-lat">4.6 s</div><div>并行 DAG 端到端耗时 (-75%)</div></div>
    </div>
  </div>
<script>
function run() {
  const k = +document.getElementById('r-k').value;
  document.getElementById('l-k').textContent = k + ' 步';
  const bad = Math.round(k * 3666 + (k*(k+1)/2) * 6000);
  const opt = Math.round(11000 + k * 1200);
  document.getElementById('o-bad').textContent = (bad/1000).toFixed(1) + 'K tok';
  document.getElementById('o-opt').textContent = (opt/1000).toFixed(1) + 'K tok';
  document.getElementById('o-lat').textContent = (2.2 + k * 0.4).toFixed(1) + ' s';
}
run();
</script>
</body>
</html>
