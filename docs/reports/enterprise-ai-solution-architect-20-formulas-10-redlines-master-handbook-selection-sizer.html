<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #465: AI Solution Architect 20 Formulas & 10 Redlines Master Sizer (#465)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #465: AI Solution Architect 20-Formula &amp; 10-Redline Sizer (#465)</h1>
    <label>Peak RPS: <span id="rLbl">12</span></label>
    <input type="range" id="rps" min="1" max="60" step="1" value="12" />
    <label>Average Input Tokens (`S_in`): <span id="sLbl">8192</span></label>
    <input type="range" id="sin" min="1024" max="32768" step="1024" value="8192" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const rpsEl = document.getElementById('rps');
    const sinEl = document.getElementById('sin');
    function calc() {
      const rps = parseFloat(rpsEl.value);
      const sin = parseFloat(sinEl.value);
      document.getElementById('rLbl').textContent = rps;
      document.getElementById('sLbl').textContent = sin;
      const bActive = Math.ceil(rps * 23.3);
      const eqTpm = ((rps * 60 * sin * 0.5 + 5 * rps * 60 * 1024) * 1.3 / 1e6).toFixed(2);
      document.getElementById('res').textContent = `Little's Law Active Batch = ${bActive} | Cloud PTU Eq-TPM = ${eqTpm}M | Tier 4 Effective Cost = $0.14/1M`;
    }
    [rpsEl, sinEl].forEach(e => e.addEventListener('input', calc));
    calc();
  </script>
</body>
</html>
