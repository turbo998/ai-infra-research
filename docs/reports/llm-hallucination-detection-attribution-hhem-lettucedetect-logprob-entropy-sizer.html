<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM Hallucination Detection &amp; Citation Grounding Sizer</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
  .wrap { max-width: 980px; margin: 0 auto; background: #1e293b; border-radius: 14px; padding: 24px; border: 1px solid #334155; }
  h1 { margin-top: 0; font-size: 22px; color: #38bdf8; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 18px 0; }
  .ctrl { background: #0f172a; padding: 14px; border-radius: 10px; border: 1px solid #334155; }
  label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
  select, input { width: 100%; padding: 8px; background: #1e293b; color: #f8fafc; border: 1px solid #475569; border-radius: 6px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 18px; }
  .card { background: #0f172a; padding: 16px; border-radius: 10px; border-left: 4px solid #3b82f6; }
  .card h3 { margin: 0 0 6px; font-size: 13px; color: #94a3b8; }
  .card .val { font-size: 24px; font-weight: 800; color: #34d399; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Interactive LLM Hallucination Detection (`LettuceDetect / HHEM` vs. `Judge`) Sizer (#372)</h1>
  <p style="color:#94a3b8;font-size:14px;">Provenance: synthetic + anonymized_reported (independently_reproduced=false)</p>
  <div class="grid">
    <div class="ctrl">
      <label>Hallucination Grounding Tier</label>
      <select id="tier" onchange="calc()">
        <option value="1">Tier 1: Sync 70B LLM-as-a-Judge (100%)</option>
        <option value="2">Tier 2: Raw Token Logprob Heuristic</option>
        <option value="3">Tier 3: LettuceDetect / HHEM Span NLI</option>
        <option value="4" selected>Tier 4: Streaming NLI + Number Guard + 6% Judge</option>
      </select>
    </div>
    <div class="ctrl">
      <label>Daily Enterprise RAG Queries</label>
      <input type="number" id="qpd" value="1000000" min="10000" max="50000000" step="50000" oninput="calc()">
    </div>
    <div class="ctrl">
      <label>Gray-Zone Judge Escalation Rate (%)</label>
      <input type="number" id="esc" value="6" min="0" max="50" step="1" oninput="calc()">
    </div>
  </div>
  <div class="cards">
    <div class="card"><h3>Hallucination Recall</h3><div class="val" id="rec">96.8%</div></div>
    <div class="card"><h3>False-Positive Rate</h3><div class="val" id="fp">1.1%</div></div>
    <div class="card"><h3>Added P99 Tail Latency</h3><div class="val" id="lat">+16.0 ms</div></div>
    <div class="card"><h3>Monthly Verification Cost</h3><div class="val" id="cost">$19,500 / mo</div></div>
  </div>
</div>
<script>
function calc() {
  const tier = parseInt(document.getElementById('tier').value, 10);
  const qpd = parseFloat(document.getElementById('qpd').value) || 1000000;
  const esc = parseFloat(document.getElementById('esc').value) || 6;
  const scale = qpd / 1000000.0;
  const rec = {1: 91.5, 2: 52.0, 3: 88.5, 4: 96.8}[tier];
  const fp = {1: 3.5, 2: 28.0, 3: 4.2, 4: 1.1}[tier];
  const lat = {1: 1850.0, 2: 0.5, 3: 18.0, 4: 16.0}[tier];
  const baseCost = tier === 4 ? (4200 + 255000 * (esc / 100.0)) : {1: 255000, 2: 0, 3: 4200}[tier];
  const cost = Math.round(baseCost * scale);
  document.getElementById('rec').textContent = rec.toFixed(1) + '%';
  document.getElementById('fp').textContent = fp.toFixed(1) + '%';
  document.getElementById('lat').textContent = '+' + lat.toFixed(1) + ' ms';
  document.getElementById('cost').textContent = '$' + cost.toLocaleString() + ' / mo';
}
calc();
</script>
</body>
</html>
