<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#581 Real-Time Voice Agent Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
label { display: block; margin: 10px 0 4px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#581 Real-Time Voice Agent GPU &amp; TCO Sizer</h2>
  <label>Concurrent Calls: <span id="cLbl">500</span></label>
  <input type="range" id="c" min="50" max="2000" step="50" value="500">
  <p id="out"></p>
</div>
<script>
const c = document.getElementById('c');
function calc() {
  const n = parseInt(c.value, 10);
  document.getElementById('cLbl').textContent = n;
  const l40s = Math.ceil(n * 0.38 / 45) + Math.ceil(n * 0.42 / 38);
  const h100 = Math.ceil((n / 12) / 11.5) * 2;
  document.getElementById('out').textContent = `Recommended Fleet: ${l40s}× L40S (STT+TTS) + ${h100}× H100 (LLM)`;
}
c.addEventListener('input', calc);
calc();
</script>
</body>
</html>
