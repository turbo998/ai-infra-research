<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#593 K8s GPU MIG &amp; Kueue Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#593 K8s MIG + Time-Slicing Packing Sizer</h2>
  <label>Small Microservices (&lt;10GB): <span id="sLbl">28</span></label>
  <input type="range" id="s" min="7" max="70" step="7" value="28">
  <p id="out"></p>
</div>
<script>
const s = document.getElementById('s');
function calc() {
  const n = parseInt(s.value, 10);
  document.getElementById('sLbl').textContent = n;
  const mig = Math.ceil(n / 7);
  document.getElementById('out').textContent = `Hardware MIG (1g.10gb) Fleet: ${mig}× H100 vs. Whole-GPU Allocation: ${n}× H100`;
}
s.addEventListener('input', calc);
calc();
</script>
</body>
</html>
