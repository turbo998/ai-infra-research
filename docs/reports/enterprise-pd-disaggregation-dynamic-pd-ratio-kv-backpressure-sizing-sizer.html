<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#623 Dynamic PD Disaggregation &amp; KV RDMA Backpressure Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#623 Dynamic PD Disaggregation (`3P:1D ↔ 1P:3D`) &amp; KV RDMA Sizer</h1>
    <label>Peak Arrival Rate (QPS): <span id="qVal">30</span> req/s</label>
    <input type="range" id="q" min="10" max="90" step="5" value="30" />
    <label>Prefix Cache Hit Rate: <span id="cVal">72</span>%</label>
    <input type="range" id="c" min="0" max="90" step="2" value="72" />
    <p>Dynamic PD H200 GPUs: <span class="val" id="outGpu">16 GPUs (-50% vs 32 Colocated)</span> · Exposed RDMA KV Latency: <span class="val" id="outLat">0.95 ms</span></p>
  </div>
  <script>
    function calc(){
      const q = +document.getElementById('q').value;
      const c = +document.getElementById('c').value;
      document.getElementById('qVal').textContent = q;
      document.getElementById('cVal').textContent = c;
      const dynGpus = Math.max(8, Math.ceil((q / 30) * 16 / 4) * 4);
      const colGpus = dynGpus * 2;
      const exposedMs = (2.684 * (1 - c/100) / 47.0) * 1000 * 0.059;
      document.getElementById('outGpu').textContent = dynGpus + ' GPUs (-50% vs ' + colGpus + ' Colocated)';
      document.getElementById('outLat').textContent = exposedMs.toFixed(2) + ' ms';
    }
    document.getElementById('q').addEventListener('input', calc);
    document.getElementById('c').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
