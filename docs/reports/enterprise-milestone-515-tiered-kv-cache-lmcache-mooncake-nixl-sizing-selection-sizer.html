<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #515: Enterprise 3-Tier KV Cache Pool Sizer</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #515: Enterprise 3-Tier KV Cache Pool Sizer</h1>
    <label>Concurrent 64K Multi-Turn Agent Sessions: <span id="aLbl">500</span> Agents</label>
    <input type="range" id="ag" min="100" max="2000" step="100" value="500" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const agEl = document.getElementById('ag');
    function calc() {
      const a = parseInt(agEl.value, 10);
      document.getElementById('aLbl').textContent = a;
      const kvTB = ((a * 10.24) / 1000).toFixed(2);
      const hbmGpus = Math.ceil(36 * a / 500);
      const poolGpus = Math.max(4, Math.ceil(12 * a / 500));
      document.getElementById('res').textContent =
        `Active KV State: ${kvTB} TB | HBM-Only Recompute: ${hbmGpus}x H200 (1,840ms P95 TTFT, 8% Hit) | 3-Tier Global KV Pool (Mooncake / Dynamo NIXL): ${poolGpus}x H200 (-66.7% GPUs, 118ms P95 TTFT [15.59x faster], 96.5% Hit 🏆)`;
    }
    agEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
