<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>🏆 #655 企业公有云迁混合云硬件回本周期 (Payback) 计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#FDE68A; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #655 企业公有云 API 迁混合自建 K8s 回本周期计算器</h1>
    <label><span>当前纯公有云月账单 (USD/月)</span><span id="l-c">$180,000 / 月</span></label>
    <input type="range" id="r-c" min="40000" max="500000" step="10000" value="180000" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-hyb">$54,500/月</div><div>65/35 混合稳态月支出</div></div>
      <div class="box"><div class="val" id="o-pay">5.40 个月</div><div>硬件 CapEx 回本周期</div></div>
      <div class="box"><div class="val" id="o-save">$384.0万</div><div>3 年周期累计净省</div></div>
    </div>
  </div>
<script>
function run() {
  const c = +document.getElementById('r-c').value;
  document.getElementById('l-c').textContent = '$' + c.toLocaleString() + ' / 月';
  const s = c / 180000;
  const hyb = Math.round(54500 * s);
  const save3YrWan = ((c * 36 - (678000 * s + hyb * 36)) / 10000).toFixed(1);
  document.getElementById('o-hyb').textContent = '$' + hyb.toLocaleString() + '/月';
  document.getElementById('o-save').textContent = '$' + save3YrWan + '万';
}
run();
</script>
</body>
</html>
