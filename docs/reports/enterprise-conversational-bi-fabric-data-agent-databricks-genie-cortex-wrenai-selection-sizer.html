<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业智能问数与对话式 BI 选型计算器 (#418)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级对话式 BI 与语义层 TCO 计算器 (#418)</h1>
    <label>月度问数查询量 (万次): <strong id="qTxt">30 万次/月</strong></label>
    <input type="range" id="q" min="5" max="100" step="5" value="30" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="acc">94.6%</div><div class="l">认证语义层口径准确率</div></div>
      <div class="kpi"><div class="v" id="rls">0.0%</div><div class="l">OBO RLS 越权泄露率</div></div>
      <div class="kpi"><div class="v" id="scan">0 次</div><div class="l">&gt;50GB 全表扫描事故</div></div>
      <div class="kpi"><div class="v" id="tco">$7,400 / 月</div><div class="l">月度平台+数仓总成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const q = parseInt(document.getElementById('q').value, 10);
      document.getElementById('qTxt').textContent = q + ' 万次/月';
      document.getElementById('tco').textContent = '$' + Math.round(q * 247).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
