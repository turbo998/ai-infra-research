<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业级多智能体平台与角色粘性 KV 路由计算器 (#408)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 多智能体平台选型与角色粘性 KV 路由计算器 (#408)</h1>
    <label>选择架构档位：</label>
    <select id="t" onchange="calc()">
      <option value="4" selected>Tier 4: 结构化交接 + 按角色 GIE 粘性 KV 路由</option>
      <option value="3">Tier 3: Azure AI Agent Service + ACA Dynamic Sessions</option>
      <option value="2">Tier 2: LangGraph 状态图 + 轮询网关</option>
      <option value="1">Tier 1: 全员群聊广播 GroupChat</option>
    </select>
    <div class="kpis">
      <div class="kpi"><div class="v" id="tok">38,000 Tok</div><div class="l">单次 15 步工作流 Token</div></div>
      <div class="kpi"><div class="v" id="hit">92.4%</div><div class="l">Prefix KV 命中率</div></div>
      <div class="kpi"><div class="v" id="succ">99.4%</div><div class="l">20 步任务完结率</div></div>
      <div class="kpi"><div class="v" id="cost">$85 / 1K Runs</div><div class="l">每千次工作流成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const m = {
        '1': ['285,000 Tok ✕', '18.4% ✕', '71.5% ✕', '$420 / 1K Runs'],
        '2': ['64,000 Tok', '42.0%', '96.2% ✓', '$165 / 1K Runs'],
        '3': ['48,000 Tok ✓', '84.5% ✓', '98.8% ✓', '$118 / 1K Runs'],
        '4': ['38,000 Tok 🏆', '92.4% 🏆', '99.4% 🏆', '$85 / 1K Runs']
      }[document.getElementById('t').value];
      document.getElementById('tok').textContent = m[0];
      document.getElementById('hit').textContent = m[1];
      document.getElementById('succ').textContent = m[2];
      document.getElementById('cost').textContent = m[3];
    }
    calc();
  </script>
</body>
</html>
