<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Sovereign & Air-Gapped AI Cluster Delivery Sizer (#503)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Sovereign &amp; Air-Gapped AI Cluster Delivery Sizer (#503)</h1>
    <label>Air-Gapped GPU Nodes (`8-GPU Servers`): <span id="nLbl">64</span> Nodes</label>
    <input type="range" id="nodes" min="8" max="128" step="8" value="64" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const nodesEl = document.getElementById('nodes');
    function calc() {
      const n = parseInt(nodesEl.value, 10);
      document.getElementById('nLbl').textContent = n;
      const r1 = (870 * n / 64).toFixed(1);
      const r4 = (3.2 * Math.max(0.6, Math.log2(n) / 6)).toFixed(1);
      document.getElementById('res').textContent = `Ad-Hoc USB Copy: ${r1} min rollout (21.5d lead time, 18.0% 1st-try success) | Zarf/Hauler + Dragonfly P2P + Cosign Safetensors: ${r4} min rollout (0.4d lead time, 99.8% 1st-try success, 0 Pickle RCE)`;
    }
    nodesEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
