<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#609 Video DiT &amp; Creative Factory Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#609 Video DiT (28s/Clip) Fleet Sizer</h2>
  <label>Daily Video Clips: <span id="vLbl">10000</span></label>
  <input type="range" id="v" min="1000" max="50000" step="1000" value="10000">
  <p id="out"></p>
</div>
<script>
const v = document.getElementById('v');
function calc() {
  const n = parseInt(v.value, 10);
  document.getElementById('vLbl').textContent = n.toLocaleString();
  const h100 = Math.max(4, Math.ceil((n * 28) / 86400) - 1);
  document.getElementById('out').textContent = `Accelerated Video Fleet: ${h100}× H100 vs. Unoptimized BF16: ${Math.ceil((n * 420) / 86400)}× H100`;
}
v.addEventListener('input', calc);
calc();
</script>
</body>
</html>
