<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#638 Multi-Region Active-Active DR &amp; Zero-KV-Egress Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#638 Multi-Region `55%+55%` Active-Active DR &amp; Egress Sizer</h1>
    <label>Single-Region 100% Peak Spend: $<span id="bVal">50,000</span>/mo</label>
    <input type="range" id="b" min="20000" max="200000" step="10000" value="50000" />
    <p>Active-Active Spend (`115%`): <span class="val" id="outAa">$57,500/mo (-42.5% vs $100,000 Active-Passive)</span> · RTO: <span class="val">0.85 s</span></p>
  </div>
  <script>
    function calc(){
      const b = +document.getElementById('b').value;
      document.getElementById('bVal').textContent = b.toLocaleString();
      const aa = Math.round(b * 1.15);
      const ap = b * 2;
      document.getElementById('outAa').textContent = '$' + aa.toLocaleString() + '/mo (-42.5% vs $' + ap.toLocaleString() + ' Active-Passive)';
    }
    document.getElementById('b').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
