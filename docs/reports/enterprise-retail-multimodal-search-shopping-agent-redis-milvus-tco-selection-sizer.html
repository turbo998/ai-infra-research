<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业电商多模态搜索与导购 Agent 计算器 (#427)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 电商多模态搜索 62ms 快慢双轨与 TCO 计算器 (#427)</h1>
    <label>搜索峰值并发 QPS: <strong id="qTxt">5,000 QPS</strong></label>
    <input type="range" id="q" min="500" max="15000" step="500" value="5000" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="lat">62 ms</div><div class="l">快轨首屏 P99 延迟</div></div>
      <div class="kpi"><div class="v" id="oos">0.0%</div><div class="l">Redis 锚定断码/错价率</div></div>
      <div class="kpi"><div class="v" id="cvr">+21.8%</div><div class="l">GMV 下单转化率提升</div></div>
      <div class="kpi"><div class="v" id="tco">$16,200 / 月</div><div class="l">月度总成本 (-90.1%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const q = parseInt(document.getElementById('q').value, 10);
      document.getElementById('qTxt').textContent = q.toLocaleString() + ' QPS';
      document.getElementById('tco').textContent = '$' + Math.round(16200 * (q / 5000)).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
