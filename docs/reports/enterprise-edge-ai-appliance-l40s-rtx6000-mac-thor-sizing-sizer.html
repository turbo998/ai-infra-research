<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#598 Edge AI Appliance Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#598 Edge AI Appliance Concurrency Sizer</h2>
  <label>Concurrent Branch Users: <span id="uLbl">10</span></label>
  <input type="range" id="u" min="1" max="30" step="1" value="10">
  <p id="out"></p>
</div>
<script>
const u = document.getElementById('u');
function calc() {
  const n = parseInt(u.value, 10);
  document.getElementById('uLbl').textContent = n;
  const l40sMs = Math.round(180 * (1 + (n - 1) * 0.45));
  const macSec = (4.2 * n).toFixed(1);
  document.getElementById('out').textContent = `2U Dual-L40S P95 TTFT: ${l40sMs}ms vs. Mac Studio 512GB: ${macSec}s`;
}
u.addEventListener('input', calc);
calc();
</script>
</body>
</html>
