<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#611 Supply Chain &amp; Logistics cuOpt Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#611 Supply Chain &amp; Logistics cuOpt Sizer</h2>
  <label>Delivery Trucks: <span id="tLbl">5000</span></label>
  <input type="range" id="t" min="500" max="20000" step="500" value="5000">
  <p id="out"></p>
</div>
<script>
const t = document.getElementById('t');
function calc() {
  const n = parseInt(t.value, 10);
  document.getElementById('tLbl').textContent = n.toLocaleString();
  document.getElementById('out').textContent = `Annual Fuel & Empty-Mile Savings: $${((n * 2240) / 1e6).toFixed(2)}M/yr · Re-Solve Time: 2.2s`;
}
t.addEventListener('input', calc);
calc();
</script>
</body>
</html>
