<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Browser-Use & GUI Agent (AXTree + SoM 7B VLM) Sizer (#502)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Browser-Use &amp; GUI Agent (AXTree + SoM 7B) Sizer (#502)</h1>
    <label>Concurrent Browser Sessions: <span id="sLbl">500</span> Sessions</label>
    <input type="range" id="sess" min="100" max="2000" step="100" value="500" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const sessEl = document.getElementById('sess');
    function calc() {
      const s = parseInt(sessEl.value, 10);
      document.getElementById('sLbl').textContent = s;
      const gVlm = Math.max(2, Math.ceil(64 * s / 500));
      const gHyb = Math.max(1, Math.ceil(6 * s / 500));
      document.getElementById('res').textContent = `1080p 72B VLM Loop: ${gVlm}x H200 (71.2% Success, 48.5s) | Hybrid Pruned AXTree (85%) + SoM 7B UI-VLM (15%): ${gHyb}x H200 (-90.6% GPUs, 95.6% Success, 7.8s E2EL, $8.20/1k runs)`;
    }
    sessEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
