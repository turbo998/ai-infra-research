<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#643 实时语音 Agent (&lt;300ms) 三池 GPU 容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #643 企业实时语音 Agent (&lt;300ms) 三池 GPU 容量计算器</h1>
    <label><span>并发通话坐席数 (Calls)</span><span id="l-c">1,000 路</span></label>
    <input type="range" id="r-c" min="200" max="5000" step="200" value="1000" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-cas">14× H200</div><div>流式级联总卡数 (2+8+4)</div></div>
      <div class="box"><div class="val" id="o-s2s">32× H200</div><div>纯 Native S2S 卡数</div></div>
      <div class="box"><div class="val" id="o-ttfa">265 ms</div><div>流式级联 P95 TTFA</div></div>
    </div>
  </div>
<script>
function run() {
  const c = +document.getElementById('r-c').value;
  document.getElementById('l-c').textContent = c.toLocaleString() + ' 路';
  const asr = Math.ceil((c * 0.42) / 240);
  const llm = Math.max(4, Math.ceil((c / 10) / 13 / 2) * 2);
  const tts = Math.ceil((c * 0.45) / 130);
  const cas = asr + llm + tts;
  const s2s = Math.ceil(c / 31.25);
  document.getElementById('o-cas').textContent = cas + '× H200 (' + asr + '+' + llm + '+' + tts + ')';
  document.getElementById('o-s2s').textContent = s2s + '× H200';
}
run();
</script>
</body>
</html>
