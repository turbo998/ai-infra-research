<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#647 零 TTFT 损耗投机伴飞安全护栏容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #647 企业大模型投机伴飞安全护栏 (Llama-Guard-8B) 容量计算器</h1>
    <label><span>主集群并发请求率 (RPS)</span><span id="l-r">100 RPS</span></label>
    <input type="range" id="r-r" min="20" max="400" step="20" value="100" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-dt">+2.5 ms</div><div>投机伴飞净 ΔTTFT (-98.3%)</div></div>
      <div class="box"><div class="val" id="o-gpu">2× L40S</div><div>推荐伴飞 L40S 卡数</div></div>
      <div class="box"><div class="val" id="o-cost">$1,440/月</div><div>伴飞池月成本 (比云 API 省 90.4%)</div></div>
    </div>
  </div>
<script>
function run() {
  const r = +document.getElementById('r-r').value;
  document.getElementById('l-r').textContent = r + ' RPS';
  const g = Math.max(2, Math.ceil(r / 50));
  document.getElementById('o-gpu').textContent = g + '× L40S';
  document.getElementById('o-cost').textContent = '$' + (g * 720).toLocaleString() + '/月';
}
run();
</script>
</body>
</html>
