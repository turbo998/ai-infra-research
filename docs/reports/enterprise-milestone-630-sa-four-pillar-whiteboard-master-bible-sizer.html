<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#630 Milestone: Cloud &amp; AI SA Four-Pillar Executive Whiteboard Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#630 Milestone: Four-Pillar Executive Whiteboard Sizer (`#623–#630`)</h1>
    <label>Enterprise Main LLM Peak QPS: <span id="qVal">30</span> req/s</label>
    <input type="range" id="q" min="10" max="90" step="5" value="30" />
    <p>Four-Pillar Fleet Cost: <span class="val" id="outCost">$50,800/mo (-75.2% vs $204,800 Legacy)</span> · Annual Savings: <span class="val" id="outSave">$1,848,000/yr</span></p>
  </div>
  <script>
    function calc(){
      const q = +document.getElementById('q').value;
      document.getElementById('qVal').textContent = q;
      const s = q / 30.0;
      const opt = Math.round(50800 * s);
      const leg = Math.round(204800 * s);
      const saveYr = (leg - opt) * 12;
      document.getElementById('outCost').textContent = '$' + opt.toLocaleString() + '/mo (-75.2% vs $' + leg.toLocaleString() + ' Legacy)';
      document.getElementById('outSave').textContent = '$' + saveYr.toLocaleString() + '/yr';
    }
    document.getElementById('q').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
