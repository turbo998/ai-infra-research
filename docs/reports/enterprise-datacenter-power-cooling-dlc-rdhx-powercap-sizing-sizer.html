<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#599 Data Center Cooling &amp; Power-Cap Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#599 Data Center Power &amp; DLC GPU Sizer</h2>
  <label>Facility Power (MW): <span id="mLbl">2.0</span> MW</label>
  <input type="range" id="m" min="0.5" max="10" step="0.5" value="2.0">
  <p id="out"></p>
</div>
<script>
const m = document.getElementById('m');
function calc() {
  const v = parseFloat(m.value);
  document.getElementById('mLbl').textContent = v.toFixed(1);
  const air = Math.floor(((v * 1000) / 1.42) / 10.2) * 8;
  const dlc = Math.floor(((v * 1000) / 1.11) / 8.58) * 8;
  document.getElementById('out').textContent = `DLC + 520W Cap: ${dlc} GPUs vs. Air + 700W: ${air} GPUs (+${dlc - air} GPUs)`;
}
m.addEventListener('input', calc);
calc();
</script>
</body>
</html>
