<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 RAG 向量内存手算与引擎选型计算器 (#407)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"], select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 亿级向量 HNSW vs. NVMe DiskANN 内存手算器 (#407)</h1>
    <label>向量条数 (百万条): <strong id="vTxt">100M</strong></label>
    <input type="range" id="v" min="10" max="500" step="10" value="100" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="fp32">896 GB</div><div class="l">未压缩 FP32 HNSW 内存</div></div>
      <div class="kpi"><div class="v" id="disk">72 GB</div><div class="l">NVMe DiskANN 常驻内存</div></div>
      <div class="kpi"><div class="v" id="rec">94.8%</div><div class="l">BM25+向量+重排 Recall@5</div></div>
      <div class="kpi"><div class="v" id="tco">$1,800 / 月</div><div class="l">Tier 4 月度 TCO (-81.6%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const v = parseInt(document.getElementById('v').value, 10);
      document.getElementById('vTxt').textContent = v + 'M';
      document.getElementById('fp32').textContent = Math.round(v * 8.96) + ' GB';
      document.getElementById('disk').textContent = Math.round(v * 0.72) + ' GB';
      document.getElementById('tco').textContent = '$' + Math.round(v * 18).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
