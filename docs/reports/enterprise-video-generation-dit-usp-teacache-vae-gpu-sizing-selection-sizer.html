<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Video Generation DiT Token & GPU Sizer (#472)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Video Generation DiT Spatiotemporal Token Sizer (#472)</h1>
    <label>Video Frames (`F` at 16 fps): <span id="fLbl">81</span></label>
    <input type="range" id="f" min="49" max="129" step="16" value="81" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const fEl = document.getElementById('f');
    function calc() {
      const f = parseInt(fEl.value, 10);
      document.getElementById('fLbl').textContent = f;
      const tok = Math.round(((f - 1) / 4 + 1) * 1542.85);
      const lat = (14.8 * Math.pow(tok / 32400, 1.45)).toFixed(1);
      document.getElementById('res').textContent = `3D Video Tokens = ${tok.toLocaleString()} | Tier 4 xDiT+FP8+TeaCache Latency = ${lat}s | Peak VRAM = 19.2 GB/GPU`;
    }
    fEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
