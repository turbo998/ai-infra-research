<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #525: Enterprise AI Datacenter DLC Liquid Cooling Sizer</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #525: Enterprise DLC Liquid Cooling &amp; PUE Sizer</h1>
    <label>Cluster GPU Count: <span id="gLbl">256</span> GPUs</label>
    <input type="range" id="gpus" min="64" max="1024" step="64" value="256" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const gpusEl = document.getElementById('gpus');
    function calc() {
      const g = parseInt(gpusEl.value, 10);
      document.getElementById('gLbl').textContent = g;
      const scale = g / 256;
      const airRacks = Math.ceil(32 * scale);
      const dlcRacks = Math.ceil(8 * scale);
      const airCost = Math.round(2180000 * scale).toLocaleString();
      const dlcCost = Math.round(1190000 * scale).toLocaleString();
      document.getElementById('res').textContent =
        `Legacy Air Cooling: ${airRacks} racks, PUE 1.54, 18.5% thermal throttle loss, $${airCost} 3-Yr Power TCO | Direct-to-Chip Cold-Plate DLC (120 kW/rack): ${dlcRacks} racks (-75% footprint), PUE 1.12, 0.0% thermal throttle, $${dlcCost} 3-Yr Power TCO (-45.4% saved 🏆)`;
    }
    gpusEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
