<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Milestone #495: Next-Gen AI Factory 5-Year Role-Cascade TCO Sizer (#495)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Milestone #495: Next-Gen AI Factory 5-Year Role-Cascade TCO Sizer (#495)</h1>
    <label>Cluster Scale Factor (`x 512 Equivalent GPUs`): <span id="sLbl">1</span>x</label>
    <input type="range" id="sc" min="1" max="5" step="1" value="1" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const scEl = document.getElementById('sc');
    function calc() {
      const k = parseInt(scEl.value, 10);
      document.getElementById('sLbl').textContent = k;
      document.getElementById('res').textContent = `3-Yr Rip & Replace: $${(68.4*k).toFixed(1)}M | 150kW+ DLC + 5-Yr Role Cascade (H200 Prefill/FIM + GB200/Rubin Decode): $${(36.8*k).toFixed(1)}M (-46.2%, Saves $${(31.6*k).toFixed(1)}M, Blended $0.035/1M Tokens)`;
    }
    scEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
