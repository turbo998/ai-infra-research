<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跨区域容灾与 Global/DataZone/PTU/AKS 选型计算器 (#405)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 Global Standard vs. DataZone vs. PTU vs. 多活 AKS 容灾计算器 (#405)</h1>
    <label>选择容灾与容量方案：</label>
    <select id="t" onchange="calc()">
      <option value="4" selected>Tier 4: 双活 AKS (P65) + PTU (P20) + DataZone 120ms 溢出</option>
      <option value="3">Tier 3: 双区 PTU (P80) + DataZone / Global 溢出</option>
      <option value="2">Tier 2: 双区 1:1 峰值对等买满 PTU 冷备</option>
      <option value="1">Tier 1: 单区域 Regional Standard PAYGO</option>
    </select>
    <div class="kpis">
      <div class="kpi"><div class="v" id="succ">99.995%</div><div class="l">3x 洪峰请求成功率</div></div>
      <div class="kpi"><div class="v" id="rto">1.2 秒</div><div class="l">跨区域故障切换 RTO</div></div>
      <div class="kpi"><div class="v" id="tco">$58,800 / 月</div><div class="l">月度总成本 (TCO)</div></div>
      <div class="kpi"><div class="v" id="save">-58.6%</div><div class="l">相比 1:1 冷备节省</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const m = {
        '1': ['71.4% ✕', '65.0 秒 ✕', '$94,000 / 月', '频繁 429 违约'],
        '2': ['99.6%', '8.5 秒', '$142,000 / 月', '0% (基准最贵)'],
        '3': ['99.92% ✓', '1.4 秒 ✓', '$72,000 / 月', '-49.3%'],
        '4': ['99.995% 🏆', '1.2 秒 🏆', '$58,800 / 月', '-58.6% 🏆']
      }[document.getElementById('t').value];
      document.getElementById('succ').textContent = m[0];
      document.getElementById('rto').textContent = m[1];
      document.getElementById('tco').textContent = m[2];
      document.getElementById('save').textContent = m[3];
    }
    calc();
  </script>
</body>
</html>
