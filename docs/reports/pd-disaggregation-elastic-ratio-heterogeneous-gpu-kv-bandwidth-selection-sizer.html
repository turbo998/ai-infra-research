<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PD 分离动态配比与跨机 KV 带宽计算器 (#396)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"], select { width: 100%; padding: 6px; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 PD 分离动态 P:D 配比、异构 GPU 与跨机 KV 带宽计算器 (#396)</h1>
    <label>注意力机制与 KV 精度：</label>
    <select id="m" onchange="calc()">
      <option value="35.14">DeepSeek-671B MLA (FP8 KV = 35.14 KB/tok)</option>
      <option value="163.84" selected>Llama-3.3-70B GQA-8 (FP8 KV = 163.84 KB/tok)</option>
      <option value="327.68">Llama-3.3-70B GQA-8 (BF16 KV = 327.68 KB/tok)</option>
    </select>
    <label>输入长度 S_in: <strong id="sinTxt">16384</strong></label>
    <input type="range" id="sin" min="1024" max="65536" step="1024" value="16384" oninput="calc()">
    <label>输出长度 S_out: <strong id="soutTxt">400</strong></label>
    <input type="range" id="sout" min="100" max="8192" step="100" value="400" oninput="calc()">
    <label>跨节点 RDMA 有效带宽 (GB/s):</label>
    <select id="bw" onchange="calc()">
      <option value="47.5">400G GPUDirect RDMA (47.5 GB/s)</option>
      <option value="95.0">800G / 双 400G RDMA (95.0 GB/s)</option>
      <option value="2.4">普通 25G TCP (2.4 GB/s)</option>
    </select>
    <div class="kpis">
      <div class="kpi"><div class="v" id="ratio">20P : 12D</div><div class="l">32卡最佳 P:D 配比</div></div>
      <div class="kpi"><div class="v" id="kv">1.34 GB</div><div class="l">净传输 KV 体积 (50% 缓存)</div></div>
      <div class="kpi"><div class="v" id="exp">5.6 ms</div><div class="l">逐层重叠后净暴露延迟</div></div>
      <div class="kpi"><div class="v" id="cost">$0.26 / 1M</div><div class="l">Tier 4 达标百万 Token 成本</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const kb = parseFloat(document.getElementById('m').value);
      const sin = parseInt(document.getElementById('sin').value, 10);
      const sout = parseInt(document.getElementById('sout').value, 10);
      const bw = parseFloat(document.getElementById('bw').value);
      document.getElementById('sinTxt').textContent = sin;
      document.getElementById('soutTxt').textContent = sout;
      const uncached = sin * 0.5;
      const pW = uncached / 6000.0;
      const dW = sout / 475.0;
      const nP = Math.max(4, Math.min(28, Math.round(32 * (pW / (pW + dW)))));
      const nD = 32 - nP;
      const kvGb = (uncached * kb) / (1024 * 1024);
      const expMs = ((kvGb / bw) * 1000) * (bw < 10 ? 0.85 : 0.20);
      document.getElementById('ratio').textContent = nP + 'P : ' + nD + 'D';
      document.getElementById('kv').textContent = kvGb.toFixed(2) + ' GB';
      document.getElementById('exp').textContent = expMs.toFixed(1) + ' ms';
      document.getElementById('cost').textContent = bw < 10 ? '$0.92 / 1M (禁用跨机PD)' : '$0.26 / 1M';
    }
    calc();
  </script>
</body>
</html>
