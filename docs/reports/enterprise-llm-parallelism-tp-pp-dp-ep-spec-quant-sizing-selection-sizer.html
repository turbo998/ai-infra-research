<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise LLM Parallelism (TP/PP/DP/EP) &amp; Acceleration Sizer (#509)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    select, input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise LLM Parallelism (`TP/PP/DP/EP`) &amp; Acceleration Sizer (#509)</h1>
    <label>Model &amp; Topology Recipe:</label>
    <select id="cfg">
      <option value="bad">Anti-Pattern: DeepSeek-671B Cross-Node TP=16 (680 tok/s/GPU ✕)</option>
      <option value="d70">Dense 70B: Intra-Node NVLink TP=4 × DP=2 + Block-FP8 + EAGLE-3 (3,420 tok/s/GPU ✓)</option>
      <option value="d405">Dense 405B: Intra-Node TP=8 × Cross-Node PP=2 + Block-FP8 (1,180 tok/s/GPU ✓)</option>
      <option value="moe" selected>MoE 671B: Attention DP=16 × Expert EP=16 + DeepEP + Native MTP (3,860 tok/s/GPU 🏆)</option>
    </select>
    <div class="out" id="res"></div>
  </div>
  <script>
    const cfgEl = document.getElementById('cfg');
    function calc() {
      const map = {
        bad: 'Cross-Node TP=16 (122 AllReduces/tok) | Exposed Comm: 21.5 ms/tok | Base P99 TPOT: 44.0 ms | Output: 680 tok/s/GPU (Reject ✕)',
        d70: 'Intra-Node NVLink TP=4 × DP=2 + Block-FP8 + EAGLE-3 | Exposed Comm: 1.4 ms/tok | Base P99 TPOT: 13.8 ms (Eff. 6.4 ms) | Output: 3,420 tok/s/GPU ✓',
        d405: 'Intra-Node TP=8 × Cross-Node PP=2 + Block-FP8 | Exposed Comm: 2.8 ms/tok | Base P99 TPOT: 22.4 ms (Eff. 10.6 ms) | Output: 1,180 tok/s/GPU ✓',
        moe: 'Attention DP=16 × Expert EP=16 + DeepEP IBGDA + Native MTP 🏆 | Exposed Comm: 2.1 ms/tok | Base P99 TPOT: 13.2 ms (Eff. 5.8 ms) | Output: 3,860 tok/s/GPU (5.68x 🏆)'
      };
      document.getElementById('res').textContent = map[cfgEl.value];
    }
    cfgEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
