<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Healthcare Ambient Clinical Scribe &amp; FHIR Sizer (#521)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Healthcare Ambient Clinical Scribe &amp; FHIR Sizer (#521)</h1>
    <label>Active Hospital Clinicians: <span id="dLbl">2000</span> Clinicians</label>
    <input type="range" id="docs" min="200" max="10000" step="200" value="2000" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const docsEl = document.getElementById('docs');
    function calc() {
      const d = parseInt(docsEl.value, 10);
      document.getElementById('dLbl').textContent = d;
      const saas = Math.round(1440000 * d / 2000).toLocaleString();
      const gpus = Math.max(4, Math.ceil(8 * d / 2000));
      const onprem = Math.round(214000 * d / 2000).toLocaleString();
      document.getElementById('res').textContent =
        `Per-Seat Cloud SaaS: $${saas}/yr (74.5% ICD-10 Accuracy) | On-Prem Confidential H200 + Formulary ASR + 24-Specialty S-LoRA + XGrammar FHIR + ICD-10 Grounding: ${gpus}x H200 GPUs, $${onprem}/yr (-85.1% TCO, 97.4% ICD-10 Accuracy, 100% FHIR R4 Validity, 1.6s P95 Latency 🏆)`;
    }
    docsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
