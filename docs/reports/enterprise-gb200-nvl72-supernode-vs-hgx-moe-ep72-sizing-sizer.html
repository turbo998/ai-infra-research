<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#632 GB200 NVL72 Supernode vs. 8-GPU HGX MoE Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#632 `GB200 NVL72` (`EP=72`) vs. `8-GPU HGX` MoE Sizer</h1>
    <label>Number of NVL72 Racks (72 GPUs/rack): <span id="rVal">2</span> racks (144 GPUs)</label>
    <input type="range" id="r" min="1" max="8" step="1" value="2" />
    <p>Total 671B MoE Goodput: <span class="val" id="outTput">1,042,560 tok/s (4.8ms TPOT)</span> · Unit Cost: <span class="val" id="outCost">$0.039 / 1M (-55.7% vs HGX H200)</span></p>
  </div>
  <script>
    function calc(){
      const r = +document.getElementById('r').value;
      const gpus = r * 72;
      document.getElementById('rVal').textContent = r + ' racks (' + gpus + ' GPUs)';
      const tput = gpus * 7240;
      document.getElementById('outTput').textContent = tput.toLocaleString() + ' tok/s (4.8ms TPOT)';
    }
    document.getElementById('r').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
