<title>#561 企业智慧教育 STEM 手写批改与苏格拉底导师 容量计算器 (Sizer)</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#f8fafc;padding:24px}
.box{max-width:920px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:24px}

<body>
<div class="box">
  <h1>#561 企业智慧教育 STEM 手写批改 (7B LaTeX + SymPy + 8B) 容量计算器</h1>
  <p>基线（1,000 万活跃学生）：7B Vision-to-LaTeX + SymPy 符号代数验算 + 8B 苏格拉底导师实现 99.6% 步骤批改准确率、99.4% 防剧透合规率、210ms P95 延迟（16 张 H200）。</p>
  <div class="row">
    <div class="stat">步骤批改率 / 防剧透率<b>99.6% · 99.4%</b></div>
    <div class="stat">P95 延迟 / 提速<b>210 ms · 10.0x</b></div>
    <div class="stat">所需 H200 / 省卡比例<b>16 GPUs · -87.5%</b></div>
  </div>
</div>
