<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#603 E-Commerce AI Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#603 E-Commerce Search &amp; Shopping Agent Sizer</h2>
  <label>Search Bar QPS: <span id="sLbl">1500</span></label>
  <input type="range" id="s" min="300" max="5000" step="100" value="1500">
  <p id="out"></p>
</div>
<script>
const s = document.getElementById('s');
function calc() {
  const v = parseInt(s.value, 10);
  document.getElementById('sLbl').textContent = v;
  const l40s = Math.max(2, Math.ceil(v / 190));
  document.getElementById('out').textContent = `Search + Rerank Fleet: ${l40s}× L40S ($${l40s * 950}/mo) · P95 Latency: 24.0ms`;
}
s.addEventListener('input', calc);
calc();
</script>
</body>
</html>
