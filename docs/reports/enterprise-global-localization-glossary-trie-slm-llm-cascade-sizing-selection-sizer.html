<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Global Localization AI Cascade Sizer (#528)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 880px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Global Localization AI Cascade Sizer (#528)</h1>
    <label>Daily Translation Volume (`Million Words/Day`): <span id="wLbl">500</span>M Words</label>
    <input type="range" id="words" min="100" max="2000" step="100" value="500" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const wordsEl = document.getElementById('words');
    function calc() {
      const w = parseInt(wordsEl.value, 10);
      document.getElementById('wLbl').textContent = w;
      const g70 = Math.ceil(48 * w / 500);
      const gCas = Math.max(4, Math.ceil(8 * w / 500));
      const mtCost = Math.round(1825000 * w / 500).toLocaleString();
      const casCost = Math.round(214000 * w / 500).toLocaleString();
      document.getElementById('res').textContent =
        `Commercial MT API: $${mtCost}/yr (72.4% glossary compliance) | 100% 70B LLM: ${g70}x H200 | Glossary Trie + 88% 7B + COMET -> 12% 70B Cascade: ${gCas}x H200 GPUs (-83.3% GPUs), $${casCost}/yr (-88.3% TCO, 99.8% glossary compliance 🏆)`;
    }
    wordsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
