<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#583 3-Tier IDP Pipeline Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#583 3-Tier IDP Cost Sizer</h2>
  <label>Million Pages/Month: <span id="pLbl">10</span></label>
  <input type="range" id="p" min="1" max="50" step="1" value="10">
  <p id="out"></p>
</div>
<script>
const p = document.getElementById('p');
function calc() {
  const m = parseInt(p.value, 10);
  document.getElementById('pLbl').textContent = m;
  document.getElementById('out').textContent = `3-Tier Cost: $${Math.round(m * 528).toLocaleString()}/mo vs. Cloud OCR: $${(m * 10000).toLocaleString()}/mo`;
}
p.addEventListener('input', calc);
calc();
</script>
</body>
</html>
