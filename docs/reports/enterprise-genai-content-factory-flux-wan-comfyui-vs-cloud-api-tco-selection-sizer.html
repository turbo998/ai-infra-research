<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业多模态营销内容生成工厂计算器 (#435)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 营销内容工厂 (Flux.1 + Wan2.1 xDiT) 成本计算器 (#435)</h1>
    <label>月度生成商品主图 (百万张): <strong id="mTxt">3.0M 张/月</strong></label>
    <input type="range" id="m" min="0.5" max="10" step="0.5" value="3.0" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="pass">96.4%</div><div class="l">前景锁死后商标过审率</div></div>
      <div class="kpi"><div class="v" id="vid">14.2 秒</div><div class="l">5s 720p 视频生成耗时</div></div>
      <div class="kpi"><div class="v" id="unit">$0.0018 / 张</div><div class="l">单张商品海报成本</div></div>
      <div class="kpi"><div class="v" id="tco">$21,500 / 月</div><div class="l">月度总成本 (-92.5%)</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const m = parseFloat(document.getElementById('m').value);
      document.getElementById('mTxt').textContent = m.toFixed(1) + 'M 张/月';
      document.getElementById('tco').textContent = '$' + Math.round(21500 * (m / 3.0)).toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
