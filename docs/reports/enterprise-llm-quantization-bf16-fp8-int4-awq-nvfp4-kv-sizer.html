<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#651 大模型量化精度与 KV Cache 容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #651 企业大模型量化选型与 FP8 KV 并发容量计算器</h1>
    <label><span>并发 Batch Size (B)</span><span id="l-b">64</span></label>
    <input type="range" id="r-b" min="8" max="128" step="8" value="64" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-win">W8A8KV8 FP8</div><div>当前并发最佳精度</div></div>
      <div class="box"><div class="val" id="o-tps">5,520 tok/s</div><div>4×H200 实测吞吐</div></div>
      <div class="box"><div class="val" id="o-cost">$0.123 / 1M</div><div>单百万 Token 成本</div></div>
    </div>
  </div>
<script>
function run() {
  const b = +document.getElementById('r-b').value;
  document.getElementById('l-b').textContent = b;
  const win = b < 24 ? 'W4A16 AWQ (低并发)' : 'W8A8KV8 FP8';
  const tps = b < 24 ? Math.round(900 + b * 72) : Math.round(800 + b * 73.75);
  document.getElementById('o-win').textContent = win;
  document.getElementById('o-tps').textContent = tps.toLocaleString() + ' tok/s';
}
run();
</script>
</body>
</html>
