<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>#642 结构化输出 XGrammar / llguidance 与 Jump-Forward 容量计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#38BDF8; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #642 企业 Agent 结构化输出 Jump-Forward 与 GPU/CPU 容量计算器</h1>
    <label><span>JSON 固定样板字符占比 β (%)</span><span id="l-b">54%</span></label>
    <input type="range" id="r-b" min="20" max="75" step="2" value="54" oninput="run()">
    <label><span>峰值 Tool Call 并发 (RPS)</span><span id="l-r">200 RPS</span></label>
    <input type="range" id="r-r" min="50" max="500" step="25" value="200" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-tok">2.18 tok/step</div><div>平均每步产出 Token</div></div>
      <div class="box"><div class="val" id="o-gpu">8× H200</div><div>所需 H200 卡数</div></div>
      <div class="box"><div class="val" id="o-cpu">32 vCPU</div><div>配套异步掩码绑核数</div></div>
    </div>
  </div>
<script>
function run() {
  const b = +document.getElementById('r-b').value / 100;
  const r = +document.getElementById('r-r').value;
  document.getElementById('l-b').textContent = Math.round(b*100) + '%';
  document.getElementById('l-r').textContent = r + ' RPS';
  const tok = 1 / (1 - b);
  const gpus = Math.max(2, Math.ceil((r * 320 / tok) / 4000 / 2) * 2);
  document.getElementById('o-tok').textContent = tok.toFixed(2) + ' tok/step';
  document.getElementById('o-gpu').textContent = gpus + '× H200';
  document.getElementById('o-cpu').textContent = (gpus * 4) + ' vCPU';
}
run();
</script>
</body>
</html>
