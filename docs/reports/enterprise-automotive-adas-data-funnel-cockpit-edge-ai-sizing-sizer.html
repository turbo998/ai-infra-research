<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#617 Automotive ADAS Data Funnel &amp; Edge Cockpit Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#617 Automotive ADAS 0.5% Corner-Case Funnel &amp; Edge Cockpit Sizer</h1>
    <label>Active Connected Fleet Size: <span id="cVal">100,000</span> vehicles</label>
    <input type="range" id="c" min="10000" max="500000" step="10000" value="100000" />
    <label>Shadow-Mode + SigLIP Upload Ratio: <span id="fVal">0.5</span>%</label>
    <input type="range" id="f" min="0.1" max="5.0" step="0.1" value="0.5" />
    <p>Monthly Fleet AI TCO: <span class="val" id="outCost">$324,000 / mo</span> (vs. <span id="outBase">$2,850,000 / mo</span> legacy upload + manual labeling)</p>
  </div>
  <script>
    function calc(){
      const c = +document.getElementById('c').value;
      const f = +document.getElementById('f').value / 100;
      document.getElementById('cVal').textContent = c.toLocaleString();
      document.getElementById('fVal').textContent = (f*100).toFixed(1);
      const base = Math.round((c/100000)*2850000);
      const opt = Math.round((c/100000)*((f/0.005)*156800 + 122000 + 45200));
      document.getElementById('outCost').textContent = '$' + opt.toLocaleString() + ' / mo';
      document.getElementById('outBase').textContent = '$' + base.toLocaleString() + ' / mo';
    }
    document.getElementById('c').addEventListener('input', calc);
    document.getElementById('f').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
