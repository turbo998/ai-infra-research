<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业模型蒸馏与合成数据 ROI 计算器 (#420)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级模型蒸馏与 90/10 级联 ROI 计算器 (#420)</h1>
    <label>月度垂域 Token 总量 (十亿 Tokens): <strong id="vTxt">10.0B</strong></label>
    <input type="range" id="v" min="1" max="30" step="1" value="10" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="acc">95.4%</div><div class="l">拒绝采样蒸馏准确率</div></div>
      <div class="kpi"><div class="v" id="once">$480</div><div class="l">一次性蒸馏训练费</div></div>
      <div class="kpi"><div class="v" id="yr">$198,000 / 年</div><div class="l">蒸馏后年度总 TCO</div></div>
      <div class="kpi"><div class="v" id="save">$1,122,000 / 年</div><div class="l">对比纯教师年净省</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const v = parseInt(document.getElementById('v').value, 10);
      document.getElementById('vTxt').textContent = v.toFixed(1) + 'B';
      document.getElementById('yr').textContent = '$' + (v * 19800).toLocaleString() + ' / 年';
      document.getElementById('save').textContent = '$' + (v * 112200).toLocaleString() + ' / 年';
    }
    calc();
  </script>
</body>
</html>
