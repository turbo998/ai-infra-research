<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise MCP + A2A Multi-Agent Context & GPU Sizer (#498)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise MCP + A2A Multi-Agent Context &amp; GPU Sizer (#498)</h1>
    <label>Concurrent Multi-Agent Throughput (`Tasks / Sec`): <span id="tLbl">20</span> TPS</label>
    <input type="range" id="tps" min="5" max="100" step="5" value="20" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const tpsEl = document.getElementById('tps');
    function calc() {
      const t = parseInt(tpsEl.value, 10);
      document.getElementById('tLbl').textContent = t;
      const gNaive = Math.max(2, Math.ceil(48 * t / 20));
      const gOpt = Math.max(1, Math.ceil(6 * t / 20));
      document.getElementById('res').textContent = `Naive 200-MCP-Tool + Full A2A History: ${gNaive}x H200 (245k tok/task, 61.5% Tool Acc, 19.4s) | Top-8 Tail MCP + Scoped A2A Artifacts: ${gOpt}x H200 (-87.5% GPUs, 26.5k tok/task, 94.6% Tool Acc, 3.1s)`;
    }
    tpsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
