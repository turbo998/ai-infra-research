<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Hybrid / Multi-Cloud GPU Bursting & Egress Sizer (#487)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Hybrid Multi-Cloud GPU Bursting Sizer (#487)</h1>
    <label>Annual Peak GPU Demand: <span id="pLbl">128</span> GPUs</label>
    <input type="range" id="peak" min="32" max="512" step="32" value="128" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const peakEl = document.getElementById('peak');
    function calc() {
      const p = parseInt(peakEl.value, 10);
      document.getElementById('pLbl').textContent = p;
      const s = p / 128;
      const base = Math.round(p * 0.375);
      document.getElementById('res').textContent = `On-Prem P80 Base: ${base} GPUs + Cloud Burst: ${p - base} GPUs | Annual TCO: $${(1.185*s).toFixed(2)}M vs $${(2.765*s).toFixed(2)}M (-57.1%)`;
    }
    peakEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
