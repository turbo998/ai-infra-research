<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>🏆 #665 供应商 PoC 虚标泡沫挤水计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#FDE68A; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #665 供应商 PoC 宣称吞吐泡沫挤水与真实卡数还原器</h1>
    <label><span>供应商 PPT 宣称单机吞吐 (tok/s)</span><span id="l-t">42,000 tok/s</span></label>
    <input type="range" id="r-t" min="15000" max="60000" step="1000" value="42000" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-real">11,111 tok/s</div><div>挤干 3.78x 水分后真实 Goodput</div></div>
      <div class="box"><div class="val" id="o-rps">24.7 RPS</div><div>单机真实可承载并发 (4K In)</div></div>
      <div class="box"><div class="val" id="o-gap">3.78× 缺口</div><div>若按 PPT 买卡的容量缺口</div></div>
    </div>
  </div>
<script>
function run() {
  const t = +document.getElementById('r-t').value;
  document.getElementById('l-t').textContent = t.toLocaleString() + ' tok/s';
  const real = Math.round(t / 3.78);
  document.getElementById('o-real').textContent = real.toLocaleString() + ' tok/s';
  document.getElementById('o-rps').textContent = (real / 450).toFixed(1) + ' RPS';
}
run();
</script>
</body>
</html>
