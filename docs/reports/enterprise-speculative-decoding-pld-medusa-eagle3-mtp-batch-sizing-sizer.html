<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#637 Speculative Decoding (`PLD / Medusa / EAGLE-3 / MTP`) Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#637 Speculative Decoding (`EAGLE-3 / MTP`) &amp; `B*=32` Gate Sizer</h1>
    <label>Token Acceptance Probability (α): <span id="aVal">0.84</span></label>
    <input type="range" id="a" min="0.50" max="0.95" step="0.02" value="0.84" />
    <p>Expected Tokens / Step (`γ=4`): <span class="val" id="outTau">3.63 tok/step</span> · Effective TPOT: <span class="val" id="outTpot">9.0 ms (2.42× speedup)</span></p>
  </div>
  <script>
    function calc(){
      const a = +document.getElementById('a').value;
      document.getElementById('aVal').textContent = a.toFixed(2);
      const tau = (1 - Math.pow(a, 5)) / (1 - a);
      const sp = (tau * 0.95) / 1.42;
      const tpot = 21.8 / sp;
      document.getElementById('outTau').textContent = tau.toFixed(2) + ' tok/step';
      document.getElementById('outTpot').textContent = tpot.toFixed(1) + ' ms (' + sp.toFixed(2) + '× speedup)';
    }
    document.getElementById('a').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
