<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#625 Milestone: AI High-Speed Fabric, PFC Headroom &amp; busbw Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#625 Milestone: `algbw ↔ busbw` &amp; Lossless PFC Headroom Sizer</h1>
    <label>Cluster GPUs (N): <span id="nVal">512</span> GPUs</label>
    <input type="range" id="n" min="16" max="2048" step="16" value="512" />
    <label>Measured AllReduce `algbw`: <span id="aVal">24.0</span> GB/s</label>
    <input type="range" id="a" min="5" max="25" step="0.5" value="24.0" />
    <p>Effective `busbw`: <span class="val" id="outBus">47.9 GB/s (95.8% line rate)</span> · Rail Optics Saved: <span class="val" id="outSave">$1,420,000</span></p>
  </div>
  <script>
    function calc(){
      const n = +document.getElementById('n').value;
      const a = +document.getElementById('a').value;
      document.getElementById('nVal').textContent = n;
      document.getElementById('aVal').textContent = a.toFixed(1);
      const bus = a * (2 * (n - 1) / n);
      const eff = (bus / 50.0) * 100;
      const saved = Math.round((n / 512) * 1420000);
      document.getElementById('outBus').textContent = bus.toFixed(1) + ' GB/s (' + eff.toFixed(1) + '% line rate)';
      document.getElementById('outSave').textContent = '$' + saved.toLocaleString();
    }
    document.getElementById('n').addEventListener('input', calc);
    document.getElementById('a').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
