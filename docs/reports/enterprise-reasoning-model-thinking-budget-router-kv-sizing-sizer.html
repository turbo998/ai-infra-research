<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#592 Reasoning Model &lt;think&gt; Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#592 Reasoning Model &lt;think&gt; Budget Sizer</h2>
  <label>Peak QPS: <span id="qLbl">50</span></label>
  <input type="range" id="q" min="10" max="200" step="10" value="50">
  <p id="out"></p>
</div>
<script>
const q = document.getElementById('q');
function calc() {
  const v = parseInt(q.value, 10);
  document.getElementById('qLbl').textContent = v;
  const opt = Math.max(2, Math.ceil((v * 940) / 6000));
  const unc = Math.max(4, Math.ceil((v * 3850) / 6000));
  document.getElementById('out').textContent = `55/30/15 Effort Router Fleet: ${opt}× H200 vs. Unconstrained <think>: ${unc}× H200`;
}
q.addEventListener('input', calc);
calc();
</script>
</body>
</html>
