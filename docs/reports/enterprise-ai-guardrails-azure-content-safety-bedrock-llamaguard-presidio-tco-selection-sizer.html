<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业 AI 安全护栏与 PII 脱敏计算器 (#416)</title>
<style>
  body { background: #0b1120; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; max-width: 980px; margin: 0 auto; padding: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 14px; padding: 20px; margin-bottom: 18px; }
  h1 { font-size: 22px; color: #38bdf8; margin-top: 0; }
  label { display: block; margin: 10px 0 4px; font-size: 13.5px; color: #cbd5e1; }
  input[type="range"] { width: 100%; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; text-align: center; }
  .kpi .v { font-size: 20px; font-weight: 800; color: #34d399; }
  .kpi .l { font-size: 12px; color: #94a3b8; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 企业级 AI 安全护栏与 PII 脱敏 TCO 计算器 (#416)</h1>
    <label>月度请求调用量 (百万次): <strong id="rTxt">50M 次/月</strong></label>
    <input type="range" id="r" min="5" max="150" step="5" value="50" oninput="calc()">
    <div class="kpis">
      <div class="kpi"><div class="v" id="ttft">+12 ms</div><div class="l">异步并行附加首字延迟</div></div>
      <div class="kpi"><div class="v" id="blk">99.4%</div><div class="l">间接注入拦截率</div></div>
      <div class="kpi"><div class="v" id="pii">0.0%</div><div class="l">明文 PII 出网率</div></div>
      <div class="kpi"><div class="v" id="tco">$9,650 / 月</div><div class="l">混合护栏月度 TCO</div></div>
    </div>
  </div>
  <script>
    function calc() {
      const r = parseInt(document.getElementById('r').value, 10);
      document.getElementById('rTxt').textContent = r + 'M 次/月';
      const cost = 6800 + Math.round(r * 0.05 * 770) + Math.floor(r / 25) * 462;
      document.getElementById('tco').textContent = '$' + cost.toLocaleString() + ' / 月';
    }
    calc();
  </script>
</body>
</html>
