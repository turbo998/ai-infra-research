<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise Text-to-SQL & MDL Semantic Layer Sizer (#499)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise Text-to-SQL &amp; MDL Semantic Layer Sizer (#499)</h1>
    <label>Conversational BI Traffic (`QPS`): <span id="qLbl">30</span> QPS</label>
    <input type="range" id="qps" min="10" max="150" step="10" value="30" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const qpsEl = document.getElementById('qps');
    function calc() {
      const q = parseInt(qpsEl.value, 10);
      document.getElementById('qLbl').textContent = q;
      const gRaw = Math.max(2, Math.ceil(48 * q / 30));
      const gMdl = Math.max(1, Math.ceil(4 * q / 30));
      document.getElementById('res').textContent = `Raw 500-Table DDL Stuffing: ${gRaw}x H200 (38.5% SQL Acc, 6,800ms) | MDL Semantic Layer + FK-Subgraph + AST Gate: ${gMdl}x H200 (-91.7% GPUs, 95.4% SQL Acc, 620ms, $0 Runaway Scans)`;
    }
    qpsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
