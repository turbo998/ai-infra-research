<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>#591 Browser &amp; Computer-Use Agent Sizer</title>
<style>
body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; max-width: 840px; margin: 0 auto; }
.box { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
input { width: 100%; }
</style>
</head>
<body>
<div class="box">
  <h2>#591 Browser-Use &amp; Computer-Use Agent Pool Sizer</h2>
  <label>Concurrent Browser Sessions: <span id="sLbl">200</span></label>
  <input type="range" id="s" min="50" max="1000" step="50" value="200">
  <p id="out"></p>
</div>
<script>
const s = document.getElementById('s');
function calc() {
  const n = parseInt(s.value, 10);
  document.getElementById('sLbl').textContent = n;
  const cpu = Math.ceil(n / 16);
  const h100 = Math.max(1, Math.ceil((n * 0.85) / 90));
  const l40s = Math.max(1, Math.ceil((n * 0.15) / 18));
  document.getElementById('out').textContent = `Fleet: ${cpu}× CPU Nodes + ${h100}× H100 (AXTree) + ${l40s}× L40S (Vision Fallback)`;
}
s.addEventListener('input', calc);
calc();
</script>
</body>
</html>
