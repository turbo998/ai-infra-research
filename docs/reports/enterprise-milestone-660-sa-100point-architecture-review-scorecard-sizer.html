<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>🏆 #660 Cloud & AI SA 100 分制架构评审计算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#FDE68A; margin-top:0; }
  label { display:flex; justify-content:space-between; font-size:13px; margin:10px 0 4px; }
  input[type=range] { width:100%; accent-color:#10B981; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:16px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #660 Cloud &amp; AI SA 架构评审 100 分制量表速算器</h1>
    <label><span>通过的架构审计项数 (共 20 项 × 5 分)</span><span id="l-c">20 / 20 项 (100 分)</span></label>
    <input type="range" id="r-c" min="8" max="20" step="1" value="20" oninput="run()">
    <div class="res">
      <div class="box"><div class="val" id="o-sc">100 分</div><div>评审总分 (&gt;=90 准予上线)</div></div>
      <div class="box"><div class="val" id="o-gp">99.6%</div><div>双 SLA 有效吞吐 Goodput</div></div>
      <div class="box"><div class="val" id="o-cost">$0.045/1M</div><div>单百万达标 Token 成本</div></div>
    </div>
  </div>
<script>
function run() {
  const c = +document.getElementById('r-c').value;
  const sc = c * 5;
  document.getElementById('l-c').textContent = c + ' / 20 项 (' + sc + ' 分)';
  document.getElementById('o-sc').textContent = sc + ' 分';
  document.getElementById('o-gp').textContent = Math.min(99.6, 54 + c * 2.28).toFixed(1) + '%';
  document.getElementById('o-cost').textContent = '$' + (0.48 * Math.pow(0.888, c)).toFixed(3) + '/1M';
}
run();
</script>
</body>
</html>
