<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>#633 Reasoning Model (&lt;think&gt;) Budget Router &amp; KV Stripping Sizer</title>
  <style>
    body { background:#0b1120; color:#f8fafc; font-family:system-ui,-apple-system,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
    .card { background:#111827; border:1px solid #334155; border-radius:12px; padding:20px; margin-bottom:16px; }
    h1 { font-size:22px; color:#38bdf8; }
    label { display:block; margin:10px 0 4px; font-size:13px; color:#cbd5e1; }
    input[type=range] { width:100%; }
    .val { font-size:20px; font-weight:700; color:#10b981; }
  </style>
</head>
<body>
  <div class="card">
    <h1>#633 Reasoning Model (`&lt;think&gt;`) `55/30/15` Budget Router Sizer</h1>
    <label>Peak Arrival Rate (QPS): <span id="qVal">20</span> req/s</label>
    <input type="range" id="q" min="5" max="60" step="5" value="20" />
    <p>Sized H200 GPUs: <span class="val" id="outG">8× H200 (-75.0% vs 32 Unconstrained)</span> · Truncation Error: <span class="val">0.0%</span></p>
  </div>
  <script>
    function calc(){
      const q = +document.getElementById('q').value;
      document.getElementById('qVal').textContent = q;
      const opt = Math.max(4, Math.ceil((q / 20) * 8 / 4) * 4);
      const raw = opt * 4;
      document.getElementById('outG').textContent = opt + '× H200 (-75.0% vs ' + raw + ' Unconstrained)';
    }
    document.getElementById('q').addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
