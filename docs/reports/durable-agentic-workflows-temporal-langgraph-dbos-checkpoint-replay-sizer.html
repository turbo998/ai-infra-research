<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>长周期持久化 Agent 工作流 (Temporal / Restate / LangGraph) 可靠性与 TCO 计算器</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0B1220; color: #F8FAFC; margin: 0; padding: 24px; }
  .container { max-width: 1080px; margin: 0 auto; background: #111C33; border: 1px solid #334155; border-radius: 14px; padding: 24px; }
  h1 { margin-top: 0; font-size: 22px; color: #FDE68A; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin: 20px 0; }
  .control { background: #0F172A; padding: 14px; border-radius: 10px; border: 1px solid #1E293B; }
  label { display: block; font-size: 13px; color: #94A3B8; margin-bottom: 6px; }
  input[type=range], select { width: 100%; }
  .val { font-weight: 700; color: #6EE7B7; float: right; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
  .kpi { background: #1E293B; padding: 14px; border-radius: 10px; text-align: center; }
  .kpi .num { font-size: 22px; font-weight: 700; color: #38BDF8; margin-top: 4px; }
  .note { margin-top: 16px; font-size: 12px; color: #94A3B8; }
</style>
</head>
<body>
<div class="container">
  <h1>企业级长周期持久化智能体工作流（Temporal / Restate / LangGraph）可靠性与 TCO 计算器</h1>
  <div class="grid">
    <div class="control">
      <label>单工作流平均步骤数 (Steps) <span id="v_steps" class="val">25</span></label>
      <input type="range" id="steps" min="5" max="80" step="5" value="25" oninput="calc()">
    </div>
    <div class="control">
      <label>单步瞬态报错/中断概率 (%) <span id="v_err" class="val">1.2%</span></label>
      <input type="range" id="err" min="0.2" max="4.0" step="0.2" value="1.2" oninput="calc()">
    </div>
    <div class="control">
      <label>月度工作流执行总量 (万次) <span id="v_wf" class="val">50万</span></label>
      <input type="range" id="wf" min="5" max="200" step="5" value="50" oninput="calc()">
    </div>
    <div class="control">
      <label>工作流持久化编排架构</label>
      <select id="mode" onchange="calc()">
        <option value="1">Tier 1: 无状态 Pod 内存 while 循环</option>
        <option value="2">Tier 2: Celery / Redis 整任务从头重试</option>
        <option value="3">Tier 3: LangGraph + Postgres 节点 Checkpointer</option>
        <option value="4" selected>Tier 4: Temporal / Restate / DBOS 事件重放 + 幂等键 (推荐)</option>
      </select>
    </div>
  </div>
  <div class="kpi-row">
    <div class="kpi"><div>端到端工作流完结率</div><div id="k_suc" class="num">99.98%</div></div>
    <div class="kpi"><div>失败重算 Token 浪费率</div><div id="k_waste" class="num">0.1%</div></div>
    <div class="kpi"><div>外部写工具重复触发率</div><div id="k_dup" class="num">0.0%</div></div>
    <div class="kpi"><div>月度平台总成本 (TCO)</div><div id="k_tco" class="num">$68,500</div></div>
  </div>
  <div class="note">Provenance: synthetic + anonymized_reported (independently_reproduced=false, physical_gpu_cluster_measurement=not_measured).</div>
</div>
<script>
function calc() {
  const steps = parseFloat(document.getElementById('steps').value);
  const err = parseFloat(document.getElementById('err').value) / 100.0;
  const wf = parseFloat(document.getElementById('wf').value);
  const mode = document.getElementById('mode').value;
  document.getElementById('v_steps').textContent = steps;
  document.getElementById('v_err').textContent = (err * 100).toFixed(1) + '%';
  document.getElementById('v_wf').textContent = wf + '万';

  const firstPassSurvival = Math.pow(1 - err, steps);
  let suc = 99.98, waste = 0.1, dup = 0.0;
  if (mode === '1') {
    suc = +(firstPassSurvival * 100).toFixed(1);
    waste = +((1 - firstPassSurvival) * 148).toFixed(1);
    dup = +((1 - firstPassSurvival) * 44).toFixed(1);
  } else if (mode === '2') {
    suc = +(Math.min(96.0, (1 - Math.pow(1 - firstPassSurvival, 2.5)) * 100)).toFixed(1);
    waste = +((1 - firstPassSurvival) * 112).toFixed(1);
    dup = +((1 - firstPassSurvival) * 31.5).toFixed(1);
  } else if (mode === '3') {
    suc = 98.8;
    waste = 2.4;
    dup = 1.2;
  } else {
    suc = 99.98;
    waste = 0.1;
    dup = 0.0;
  }
  const tco = Math.round((wf / 50.0) * (steps / 25.0) * 68000 * (1 + waste / 100.0 * 3.0));
  document.getElementById('k_suc').textContent = suc + '%';
  document.getElementById('k_waste').textContent = waste + '%';
  document.getElementById('k_dup').textContent = dup + '%';
  document.getElementById('k_tco').textContent = '$' + tco.toLocaleString();
}
calc();
</script>
</body>
</html>
