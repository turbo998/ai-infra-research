<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>Enterprise IDE Code Completion (FIM) GPU Sizer (#491)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0b1120; color: #f8fafc; margin: 0; padding: 24px; }
    .box { max-width: 860px; margin: 0 auto; background: #111827; border: 1px solid #334155; border-radius: 12px; padding: 20px; }
    h1 { font-size: 20px; margin-top: 0; color: #38bdf8; }
    label { display: block; margin: 12px 0 4px; font-size: 13px; }
    input, select { width: 100%; padding: 6px; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; }
    .out { margin-top: 16px; padding: 14px; background: #1e293b; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; color: #6ee7b7; }
  </style>
</head>
<body>
  <div class="box">
    <h1>🧮 Enterprise 10,000-Developer IDE FIM GPU Sizer (#491)</h1>
    <label>Total Developer Seats: <span id="dLbl">10000</span></label>
    <input type="range" id="devs" min="1000" max="50000" step="1000" value="10000" />
    <div class="out" id="res"></div>
  </div>
  <script>
    const devsEl = document.getElementById('devs');
    function calc() {
      const d = parseInt(devsEl.value, 10);
      document.getElementById('dLbl').textContent = d.toLocaleString();
      const s = d / 10000;
      const gpus = Math.max(2, Math.ceil(8 * s));
      document.getElementById('res').textContent = `Peak FIM RPS = ${Math.round(72*s)} | Little's Law Active Batch = ${Math.max(1, Math.round(10*s))} | Dedicated 7B/14B PLD Pool = ${gpus}x H200 GPUs (138ms P99, 38.6% Acceptance)`;
    }
    devsEl.addEventListener('input', calc);
    calc();
  </script>
</body>
</html>
