<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:;">
<title>🏆 #650 六大垂直行业 AI 基础设施 BoM 与 TCO 速算器</title>
<style>
  body { background:#0F172A; color:#F8FAFC; font-family:system-ui,sans-serif; padding:24px; max-width:960px; margin:0 auto; }
  .card { background:#1E293B; border:1px solid #334155; border-radius:14px; padding:20px; }
  h1 { font-size:20px; color:#FDE68A; margin-top:0; }
  select { width:100%; padding:10px; background:#0F172A; color:#F8FAFC; border:1px solid #334155; border-radius:8px; margin-bottom:14px; }
  .res { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .box { background:#0F172A; border:1px solid #334155; border-radius:10px; padding:12px; text-align:center; }
  .val { font-size:22px; font-weight:800; color:#10B981; }
</style>
</head>
<body>
  <div class="card">
    <h1>🧮 #650 六大垂直行业标准配置单 (Turnkey BoM) 与 3 年 TCO 速算器</h1>
    <select id="s" onchange="run()">
      <option value="0">1. 金融银行核心风控 (48×H200 + 8×L40S)</option>
      <option value="1">2. 三甲医院临床多模态 (16×H200 + 8×L40S)</option>
      <option value="2">3. 车企 1,024 卡智驾工厂 (1,024×H200 + 3FS + 液冷)</option>
      <option value="3">4. 跨境电商导购与大促弹性 (24×H200 + 云溢出)</option>
      <option value="4">5. 政务主权云 1M 长公文 (32×H200 2D USP)</option>
      <option value="5">6. 万人软件研发中心 (16×L40S + 16×H200 + MicroVM)</option>
    </select>
    <div class="res">
      <div class="box"><div class="val" id="o-bom">48×H200 + 8×L40S</div><div>标准 GPU 配置单</div></div>
      <div class="box"><div class="val" id="o-tco">$4.28M</div><div>优化后 3 年 TCO</div></div>
      <div class="box"><div class="val" id="o-save">-$3.42M (-44.4%)</div><div>相比传统基线净省</div></div>
    </div>
  </div>
<script>
const ITEMS = [
  ["48×H200 + 8×L40S", "$4.28M", "-$3.42M (-44.4%)"],
  ["16×H200 + 8×L40S", "$1.64M", "-$5.95M (-78.4%)"],
  ["1,024×H200 + 3FS", "$66.20M", "-$28.40M (-30.0%)"],
  ["24×H200 + 云爆发", "$2.15M", "-$3.43M (-61.5%)"],
  ["32×H200 (2D USP)", "$2.82M", "-$8.93M (-76.0%)"],
  ["16×L40S + 16×H200", "$1.38M", "-$5.46M (-79.8%)"]
];
function run() {
  const row = ITEMS[+document.getElementById('s').value];
  document.getElementById('o-bom').textContent = row[0];
  document.getElementById('o-tco').textContent = row[1];
  document.getElementById('o-save').textContent = row[2];
}
run();
</script>
</body>
</html>
