<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 600" width="1080" height="600">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="600" rx="16" fill="url(#bg3)"/>
  <text x="32" y="42" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">磐久 AL128 高密训推超节点：“算-存-网”平头哥五芯全自研数据通路图</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">单机柜集成 128 张 AI 卡 · 正交背板无源铜缆互联 · 消除外置进口 PCIe Switch 与存储 I/O 瓶颈</text>

  <rect x="32" y="82" width="1016" height="492" rx="14" fill="#0F172A" fill-opacity="0.85" stroke="#3B82F6" stroke-width="2"/>
  <text x="52" y="110" fill="#60A5FA" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">PANJIU AL128 SUPER-NODE RACK (128 GPUs/PPUs · Liquid Cooled · High-Radix Orthogonal Backplane)</text>

  <!-- Box 1: Yitian 710 / 750 Host CPU -->
  <rect x="56" y="132" width="270" height="185" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="1.8"/>
  <text x="74" y="158" fill="#38BDF8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">CHIP #1 · HOST CPU</text>
  <text x="74" y="182" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="700">平头哥 倚天 710 / 750</text>
  <text x="74" y="206" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 128 核 ARMv9 @ 3.2GHz (SVE2)</text>
  <text x="74" y="226" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 8 通道 DDR5 + 88 Lanes PCIe 5.0</text>
  <text x="74" y="246" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 倚天 750 支持 ARM CCA 机密计算</text>
  <text x="74" y="272" fill="#7DD3FC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">职责：DataLoader 预处理、分词、</text>
  <text x="74" y="290" fill="#7DD3FC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">分布式调度控制面与异步 Checkpoint</text>

  <!-- Box 2: Zhenwu PPU Array -->
  <rect x="396" y="132" width="310" height="185" rx="10" fill="#1E293B" stroke="#F97316" stroke-width="2"/>
  <text x="414" y="158" fill="#FB923C" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">CHIP #2 · AI ACCELERATOR (×128)</text>
  <text x="414" y="182" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="700">平头哥 真武 810E / M890 / V900</text>
  <text x="414" y="206" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 单卡 96GB / 144GB / 216GB HBM</text>
  <text x="414" y="226" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 整柜显存池高达 12.2 TB – 27.6 TB</text>
  <text x="414" y="246" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 自研 AI 栈全量兼容 PyTorch / vLLM</text>
  <text x="414" y="272" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">职责：大模型 Tensor/Pipeline/Expert</text>
  <text x="414" y="290" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">并行矩阵运算与 KV Cache 常驻</text>

  <!-- Box 3: ICN Switch 1.0 (Scale-Up) -->
  <rect x="766" y="132" width="258" height="185" rx="10" fill="#1E293B" stroke="#A855F7" stroke-width="2"/>
  <text x="784" y="158" fill="#C084FC" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">CHIP #3 · SCALE-UP SWITCH</text>
  <text x="784" y="182" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="700">平头哥 ICN Switch 1.0</text>
  <text x="784" y="206" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 25.6 Tbps 交换容量 (128×200G)</text>
  <text x="784" y="226" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 端口转发延迟 &lt; 150 ns (纳秒级)</text>
  <text x="784" y="246" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 支持高阶 Dragonfly / Torus 拓扑</text>
  <text x="784" y="272" fill="#D8B4FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">职责：柜内 128 卡无损高速显存</text>
  <text x="784" y="290" fill="#D8B4FE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">语义直连 (TP / EP All-to-All)</text>

  <!-- Box 4: Panmai 920 SmartNIC (Center-Right Bottom) -->
  <rect x="396" y="366" width="628" height="184" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <text x="414" y="392" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">CHIP #4 · PCIe SWITCH + SMARTNIC SoC (KEY ARCHITECTURAL INNOVATION)</text>
  <text x="414" y="418" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="700">平头哥 盘脉 920 (Panmai 920) — 400G 智能网卡暨 PCIe 5.0 交换芯片</text>
  <text x="414" y="444" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 架构突破：单芯片同时集成 400G 高速网络接口与 PCIe 5.0 Switch，无需外挂博通 PEX 交换芯片</text>
  <text x="414" y="466" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 硬件卸载：内置 Solar-RDMA 硬件多路径喷洒引擎、拥塞控制与 CIPU 虚拟化安全隔离</text>
  <text x="414" y="488" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• HPN 7.0 接入：单卡输出 2 × 200G 双上联分别接入双平面 ToR 交换机，直通 GPUDirect RDMA / Storage</text>
  <rect x="414" y="502" width="590" height="34" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="709" y="524" text-anchor="middle" fill="#A7F3D0" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">机间 Scale-Out 出口：8 × 400G = 3.2 Tbps / 节点 → HPN 7.0 双平面 51.2T 胖树</text>

  <!-- Box 5: Zhenyue 510 SSD Controller (Bottom Left) -->
  <rect x="56" y="366" width="270" height="184" rx="10" fill="#1E293B" stroke="#FACC15" stroke-width="1.8"/>
  <text x="74" y="392" fill="#FDE047" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">CHIP #5 · STORAGE SILICON</text>
  <text x="74" y="418" fill="#FFFFFF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="17" font-weight="700">平头哥 镇岳 510 SSD 主控</text>
  <text x="74" y="444" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 内置玄铁 910 RISC-V 多核处理器</text>
  <text x="74" y="464" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• PCIe 5.0 · 顺序读 14 GB/s</text>
  <text x="74" y="484" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">• 3400K IOPS · 读延迟低至 4 μs</text>
  <text x="74" y="510" fill="#FEF08A" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">职责：本地 NVMe 缓存 + 远端 CPFS</text>
  <text x="74" y="528" fill="#FEF08A" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">(2 TB/s) 支撑秒级 Checkpoint 落盘</text>

  <!-- Connecting Datapath Arrows & Labels -->
  <line x1="326" y1="220" x2="396" y2="220" stroke="#38BDF8" stroke-width="3"/>
  <text x="361" y="210" text-anchor="middle" fill="#7DD3FC" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="700">PCIe 5.0</text>

  <line x1="706" y1="220" x2="766" y2="220" stroke="#C084FC" stroke-width="4"/>
  <text x="736" y="208" text-anchor="middle" fill="#E9D5FF" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="700">700~1200</text>
  <text x="736" y="236" text-anchor="middle" fill="#E9D5FF" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="700">GB/s ICN</text>

  <line x1="550" y1="317" x2="550" y2="366" stroke="#34D399" stroke-width="3.5"/>
  <text x="635" y="346" text-anchor="middle" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">GPUDirect RDMA (PCIe 5.0 直通)</text>

  <line x1="191" y1="317" x2="191" y2="366" stroke="#FACC15" stroke-width="3"/>
  <line x1="326" y1="458" x2="396" y2="458" stroke="#FACC15" stroke-width="3"/>
  <text x="361" y="448" text-anchor="middle" fill="#FEF08A" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10" font-weight="700">GDS直通</text>
</svg>
