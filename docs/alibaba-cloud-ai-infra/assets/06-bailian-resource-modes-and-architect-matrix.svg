<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" width="1080" height="650">
  <defs>
    <linearGradient id="bg6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="650" rx="16" fill="url(#bg6)"/>
  <text x="32" y="42" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">百炼平台四大算力阶梯对比 &amp; AI Infra 架构师 6 大核心场景选型矩阵</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">上半部：百炼 Token / PTU / DTU / MU 四级算力模式定位 · 下半部：从万卡预训练到高并发推理的实战选型手册</text>

  <!-- Top Half: 4 Bailian Compute Modes -->
  <rect x="32" y="82" width="242" height="196" rx="10" fill="#0B1120" stroke="#475569" stroke-width="1.5"/>
  <text x="48" y="108" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">MODE 1 · SERVERLESS</text>
  <text x="48" y="130" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="700">按 Token 后付费 + 节省计划</text>
  <text x="48" y="154" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 隔离级别：公共多租户共享池</text>
  <text x="48" y="174" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 吞吐保障：受账号 RPM/TPM 限流</text>
  <text x="48" y="194" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 成本优化：Batch 异步调用 50% 折扣</text>
  <text x="48" y="214" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 显式缓存：命中部分仅按 20% 计费</text>
  <rect x="48" y="232" width="210" height="30" rx="5" fill="#1E293B"/>
  <text x="153" y="251" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">适用：PoC、波动流量、夜间批处理</text>

  <rect x="290" y="82" width="242" height="196" rx="10" fill="#0B1120" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="306" y="108" fill="#60A5FA" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">MODE 2 · PROVISIONED (PTU)</text>
  <text x="306" y="130" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="700">预留吞吐 PTU (包月/包天)</text>
  <text x="306" y="154" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 隔离级别：逻辑容量预留 + 弹性溢出</text>
  <text x="306" y="174" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 吞吐保障：承诺确定性 KTPM 吞吐</text>
  <text x="306" y="194" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">• 杀手锏：Prefix Cache 命中仅按</text>
  <text x="306" y="212" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">  0.08x~0.25x 折算，实测省 43% 容量</text>
  <rect x="306" y="232" width="210" height="30" rx="5" fill="#1E3A8A"/>
  <text x="411" y="251" text-anchor="middle" fill="#BFDBFE" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">适用：中高并发企业 Agent 生产主力</text>

  <rect x="548" y="82" width="242" height="196" rx="10" fill="#0B1120" stroke="#A855F7" stroke-width="1.5"/>
  <text x="564" y="108" fill="#C084FC" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">MODE 3 · DEDICATED (DTU)</text>
  <text x="564" y="130" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="700">微调模型专属部署 DTU</text>
  <text x="564" y="154" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 隔离级别：租户级独立模型实例</text>
  <text x="564" y="174" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 模型支持：SFT / LoRA / DPO 私有权重</text>
  <text x="564" y="194" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 运维免托管：无需自管底层 vLLM 容器</text>
  <text x="564" y="214" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 计费方式：按实例规格与运行时长</text>
  <rect x="564" y="232" width="210" height="30" rx="5" fill="#3B0764"/>
  <text x="669" y="251" text-anchor="middle" fill="#E9D5FF" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">适用：百炼托管微调后的私有模型上线</text>

  <rect x="806" y="82" width="242" height="196" rx="10" fill="#0B1120" stroke="#10B981" stroke-width="2"/>
  <text x="822" y="108" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">MODE 4 · MODEL UNIT (MU)</text>
  <text x="822" y="130" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="700">模型单元 MU (物理隔离池)</text>
  <text x="822" y="154" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 隔离级别：物理算力独占 + SLA 承诺</text>
  <text x="822" y="174" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">• 杀手锏 1：原生 PD 分离 (xPyD 配比)</text>
  <text x="822" y="194" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">• 杀手锏 2：零拷贝 Prefix Cache 加速</text>
  <text x="822" y="214" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">• 消除长 Prompt 阻塞 Decode 抖动</text>
  <rect x="822" y="232" width="210" height="30" rx="5" fill="#064E3B"/>
  <text x="927" y="251" text-anchor="middle" fill="#A7F3D0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="700">适用：金融/政企核心生产与严苛 TPOT</text>

  <!-- Bottom Half: Architect 6-Scenario Decision Matrix -->
  <rect x="32" y="296" width="1016" height="326" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="324" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="700">AI Infra 架构师 6 大核心业务场景选型矩阵</text>

  <rect x="48" y="338" width="984" height="32" rx="6" fill="#1E293B"/>
  <text x="64" y="359" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">业务场景</text>
  <text x="270" y="359" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">推荐阿里云技术栈组合 (L0 – L3)</text>
  <text x="680" y="359" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">关键架构收益与避坑指南</text>
  <text x="960" y="359" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">锁定风险</text>

  <line x1="48" y1="408" x2="1032" y2="408" stroke="#1E293B"/>
  <text x="64" y="394" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">1. 千卡/万卡 Foundation 预训练</text>
  <text x="270" y="394" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">灵骏智算 + HPN 7.0 双平面 + CPFS + PAI-DLC + AIMaster</text>
  <text x="680" y="394" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">HPN 7.0 消除哈希碰撞 (+14.9%)；务必开启 EasyCKPT 异步存盘</text>
  <text x="965" y="394" fill="#FBBF24" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">中 (中度)</text>

  <line x1="48" y1="446" x2="1032" y2="446" stroke="#1E293B"/>
  <text x="64" y="432" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">2. 7B–72B 行业后训练 (SFT/RLHF)</text>
  <text x="270" y="432" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">PAI 父子配额树 (DLC + EAS 训推共池) + 倚天 710 DataLoader</text>
  <text x="680" y="432" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">利用夜间推理低谷借卡跑训练，集群利用率从 ~40% 提至 &gt;85%</text>
  <text x="965" y="432" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">低 (开源栈)</text>

  <line x1="48" y1="484" x2="1032" y2="484" stroke="#1E293B"/>
  <text x="64" y="470" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">3. 超高并发低延迟推理 (&gt;500 QPS)</text>
  <text x="270" y="470" fill="#60A5FA" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">PAI-EAS (vLLM/SGLang) + Prefix-Cache 路由 + 真武 M890/H20</text>
  <text x="680" y="470" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">144GB HBM3e 减少跨卡 TP；一致性哈希路由降低 25%~41% TTFT</text>
  <text x="965" y="470" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">低~中</text>

  <line x1="48" y1="522" x2="1032" y2="522" stroke="#1E293B"/>
  <text x="64" y="508" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">4. 企业级多轮 Agent / RAG 应用</text>
  <text x="270" y="508" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">百炼平台 (PTU 预留吞吐 + 节省计划 + 显式 Context Cache)</text>
  <text x="680" y="508" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">固定 System Prompt 放最前，享受 0.08x~0.25x PTU 容量抵扣</text>
  <text x="965" y="508" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">低 (OpenAI兼容)</text>

  <line x1="48" y1="560" x2="1032" y2="560" stroke="#1E293B"/>
  <text x="64" y="546" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">5. 供应链安全与全国产化智算中心</text>
  <text x="270" y="546" fill="#F87171" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">磐久 AL128 超节点 + 平头哥五芯全栈 (真武+倚天+盘脉+镇岳+ICN)</text>
  <text x="680" y="546" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">主流 Qwen/Llama 开箱即用；自定义 Triton/CUDA C++ 算子需预留适配</text>
  <text x="965" y="546" fill="#F87171" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">高 (硬件绑定)</text>

  <text x="64" y="588" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">6. 跨云可移植 / Multi-Cloud 优先</text>
  <text x="270" y="588" fill="#C4B5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">ACK (K8s) + 开源 vLLM/SGLang/Ray + 标准 PyTorch + 对象存储</text>
  <text x="680" y="588" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">规避 BladeLLM / Solar-RDMA 专有依赖，用统一 OpenAI API 网关抽象</text>
  <text x="965" y="588" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">极低</text>
</svg>
