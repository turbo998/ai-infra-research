<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" width="1080" height="620">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="620" rx="16" fill="url(#bg4)"/>
  <text x="32" y="42" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">阿里云 HPN 7.0 (SIGCOMM 2024)：双上联 × 多轨 × 双平面网络架构与性能收益</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">左图：两层 51.2T Clos 直连 15,000 卡的物理拓扑 · 右图：相比传统 RoCEv2 + ECMP 的消除哈希冲突与训练提速实效</text>

  <!-- Left Panel: HPN 7.0 Topology -->
  <rect x="32" y="84" width="580" height="508" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="112" fill="#60A5FA" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="700">HPN 7.0 物理拓扑：两层 51.2T 盒式交换机无阻塞互联 15,000 卡</text>

  <rect x="60" y="132" width="240" height="72" rx="8" fill="#1E3A8A" fill-opacity="0.7" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="180" y="158" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Plane A · Spine 交换矩阵</text>
  <text x="180" y="178" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">51.2 Tbps 盒式 Spine 组 (无核心层)</text>
  <text x="180" y="194" text-anchor="middle" fill="#60A5FA" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">独立故障域 A · 消除第 3 层光模块成本</text>

  <rect x="344" y="132" width="240" height="72" rx="8" fill="#065F46" fill-opacity="0.7" stroke="#10B981" stroke-width="1.5"/>
  <text x="464" y="158" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Plane B · Spine 交换矩阵</text>
  <text x="464" y="178" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">51.2 Tbps 盒式 Spine 组 (无核心层)</text>
  <text x="464" y="194" text-anchor="middle" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">独立故障域 B · 单平面故障自动无缝降级</text>

  <rect x="60" y="254" width="240" height="76" rx="8" fill="#1E293B" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="180" y="278" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Plane A · ToR / Leaf (Rail 1..8)</text>
  <text x="180" y="298" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">51.2T 交换机 · 同号 GPU 同轨直连</text>
  <text x="180" y="316" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">承接每张 400G 网卡的第 1 路 200G</text>

  <rect x="344" y="254" width="240" height="76" rx="8" fill="#1E293B" stroke="#34D399" stroke-width="1.5"/>
  <text x="464" y="278" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">Plane B · ToR / Leaf (Rail 1..8)</text>
  <text x="464" y="298" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">51.2T 交换机 · 同号 GPU 同轨直连</text>
  <text x="464" y="316" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">承接每张 400G 网卡的第 2 路 200G</text>

  <line x1="140" y1="204" x2="140" y2="254" stroke="#3B82F6" stroke-width="2.5"/>
  <line x1="220" y1="204" x2="220" y2="254" stroke="#3B82F6" stroke-width="2.5"/>
  <line x1="424" y1="204" x2="424" y2="254" stroke="#10B981" stroke-width="2.5"/>
  <line x1="504" y1="204" x2="504" y2="254" stroke="#10B981" stroke-width="2.5"/>
  <text x="322" y="234" text-anchor="middle" fill="#FBBF24" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">1:1 无收敛全双工</text>

  <rect x="60" y="394" width="524" height="176" rx="10" fill="#172554" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="322" y="418" text-anchor="middle" fill="#FDE047" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">灵骏智算节点 (8 × GPU/PPU + 8 × 400G 盘脉 920 / CX-7 网卡)</text>

  <rect x="82" y="434" width="136" height="60" rx="6" fill="#0F172A" stroke="#F97316"/>
  <text x="150" y="456" text-anchor="middle" fill="#FDBA74" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">GPU0 + NIC0 (400G)</text>
  <text x="150" y="476" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">200G(A) + 200G(B) 双活</text>

  <rect x="254" y="434" width="136" height="60" rx="6" fill="#0F172A" stroke="#F97316"/>
  <text x="322" y="456" text-anchor="middle" fill="#FDBA74" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">GPU1 + NIC1 (400G)</text>
  <text x="322" y="476" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">200G(A) + 200G(B) 双活</text>

  <rect x="426" y="434" width="136" height="60" rx="6" fill="#0F172A" stroke="#F97316"/>
  <text x="494" y="456" text-anchor="middle" fill="#FDBA74" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">GPU7 + NIC7 (400G)</text>
  <text x="494" y="476" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="10">200G(A) + 200G(B) 双活</text>

  <line x1="130" y1="434" x2="150" y2="330" stroke="#60A5FA" stroke-width="2"/>
  <line x1="170" y1="434" x2="430" y2="330" stroke="#34D399" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="302" y1="434" x2="180" y2="330" stroke="#60A5FA" stroke-width="2"/>
  <line x1="342" y1="434" x2="464" y2="330" stroke="#34D399" stroke-width="2" stroke-dasharray="5,3"/>
  <line x1="474" y1="434" x2="210" y2="330" stroke="#60A5FA" stroke-width="2"/>
  <line x1="514" y1="434" x2="500" y2="330" stroke="#34D399" stroke-width="2" stroke-dasharray="5,3"/>

  <rect x="82" y="508" width="480" height="46" rx="6" fill="#0F172A" stroke="#475569"/>
  <text x="322" y="528" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">机内全互联：NVLink / 平头哥 ICN Switch (700 ~ 1,200 GB/s)</text>
  <text x="322" y="546" text-anchor="middle" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">蓝实线 = 200G 上联至平面 A · 绿虚线 = 200G 上联至平面 B (单网卡双上联)</text>

  <!-- Right Panel: Quantitative Comparison -->
  <rect x="632" y="84" width="416" height="508" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <text x="652" y="112" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="15" font-weight="700">传统 RoCEv2 + ECMP vs 阿里云 HPN 7.0 实测对比</text>
  <text x="652" y="132" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">数据来源：ACM SIGCOMM 2024 论文 (Alibaba HPN)</text>

  <text x="652" y="166" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">① 大象流哈希冲突下的有效带宽利用率</text>
  <text x="652" y="190" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">传统 RoCEv2 + ECMP (五元组哈希极易碰撞)</text>
  <rect x="652" y="198" width="230" height="22" rx="4" fill="#EF4444"/>
  <text x="890" y="214" fill="#F87171" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">~65%-70% (折损&gt;30%)</text>

  <text x="652" y="240" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">HPN 7.0 + Solar-RDMA (多路径喷洒 + 零单流碰撞)</text>
  <rect x="652" y="248" width="320" height="22" rx="4" fill="#10B981"/>
  <text x="980" y="264" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">&gt;95%</text>

  <text x="652" y="306" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">② 千亿参数大模型分布式训练端到端效率</text>
  <rect x="652" y="320" width="376" height="86" rx="8" fill="#1E293B" stroke="#10B981"/>
  <text x="840" y="356" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="28" font-weight="700">+14.9%</text>
  <text x="840" y="380" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">SIGCOMM 2024 生产实测端到端训练吞吐提升</text>
  <text x="840" y="397" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">尤其在 MoE All-to-All 与跨机 AllReduce 阶段优势显著</text>

  <text x="652" y="438" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13" font-weight="700">③ 关键网络工程特性对比</text>
  <rect x="652" y="450" width="376" height="122" rx="8" fill="#1E293B" stroke="#475569"/>
  <text x="668" y="474" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">• 单 Pod 直连规模：</text>
  <text x="790" y="474" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">两层 Clos 直连 15,000 卡 (省去第3层核心层)</text>
  <text x="668" y="500" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">• 单光模块故障：</text>
  <text x="790" y="500" fill="#34D399" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">双上联平面毫秒级自愈，训练零中断</text>
  <text x="668" y="526" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">• 拥塞死锁免疫：</text>
  <text x="790" y="526" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">Solar-RDMA 选择性重传，摆脱 PFC 死锁风暴</text>
  <text x="668" y="552" fill="#93C5FD" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">• 普惠云网络：</text>
  <text x="790" y="552" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">CIPU eRDMA 为通用 ECS 提供 ~8μs 弹性 RDMA</text>
</svg>
