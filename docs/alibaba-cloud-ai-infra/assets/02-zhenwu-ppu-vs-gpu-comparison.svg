<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" width="1080" height="650">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="aliBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="aliNextBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="nvBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="650" rx="16" fill="url(#bg2)"/>
  <text x="32" y="42" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="21" font-weight="700">平头哥真武 PPU 四代演进 (810E → M890 → V900 → J900) 与主流 GPU 关键指标对比</text>
  <text x="32" y="64" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="13">左图：单卡 HBM 显存容量对比 (GB) · 右上图：卡间 Scale-Up 互连带宽对比 (GB/s) · 右下图：真武家族单卡相对算力代际跃迁</text>

  <!-- Legend -->
  <rect x="740" y="24" width="14" height="14" rx="3" fill="url(#aliBar)"/>
  <text x="760" y="35" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">平头哥真武 PPU (量产/部署)</text>
  <rect x="920" y="24" width="14" height="14" rx="3" fill="url(#nvBar)"/>
  <text x="940" y="35" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">NVIDIA 对标 GPU</text>

  <!-- Panel 1: HBM Capacity Comparison (Left) -->
  <rect x="32" y="84" width="500" height="534" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <text x="52" y="114" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="700">1. 单卡 HBM 显存容量对比 (GB，越大越利于大参数/长上下文)</text>
  <text x="52" y="134" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">针对 LLM Memory-Bound 瓶颈，真武全系采用大容量 HBM 路线</text>

  <text x="52" y="175" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600">NVIDIA H100 SXM</text>
  <text x="52" y="191" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">HBM3 · 3.35 TB/s</text>
  <rect x="190" y="162" width="100" height="26" rx="4" fill="url(#nvBar)"/>
  <text x="298" y="180" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">80 GB</text>

  <text x="52" y="235" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600">NVIDIA H20 (初代)</text>
  <text x="52" y="251" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">HBM3 · 4.0 TB/s</text>
  <rect x="190" y="222" width="120" height="26" rx="4" fill="url(#nvBar)"/>
  <text x="318" y="240" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">96 GB</text>

  <text x="52" y="295" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">平头哥 真武 810E</text>
  <text x="52" y="311" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">HBM2e · 官方披露主力卡</text>
  <rect x="190" y="282" width="120" height="26" rx="4" fill="url(#aliBar)"/>
  <text x="318" y="300" fill="#FDBA74" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">96 GB (已大规模量产)</text>

  <text x="52" y="355" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600">NVIDIA H200 / H20-3e</text>
  <text x="52" y="371" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">HBM3e · 4.8 TB/s</text>
  <rect x="190" y="342" width="176" height="26" rx="4" fill="url(#nvBar)"/>
  <text x="374" y="360" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">141 GB</text>

  <text x="52" y="415" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">平头哥 真武 M890</text>
  <text x="52" y="431" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">HBM3e · 原生 FP8 · 训推主力</text>
  <rect x="190" y="402" width="180" height="26" rx="4" fill="url(#aliBar)"/>
  <text x="378" y="420" fill="#FDBA74" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">144 GB (+50% vs 810E)</text>

  <text x="52" y="475" fill="#CBD5E1" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600">NVIDIA B200 (Blackwell)</text>
  <text x="52" y="491" fill="#64748B" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">HBM3e · 8.0 TB/s</text>
  <rect x="190" y="462" width="240" height="26" rx="4" fill="url(#nvBar)"/>
  <text x="438" y="480" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">192 GB</text>

  <text x="52" y="535" fill="#FDE047" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">平头哥 真武 V900</text>
  <text x="52" y="551" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="10">HBM3e · FP8/FP4 · 新一代训推</text>
  <rect x="190" y="522" width="270" height="26" rx="4" fill="url(#aliNextBar)"/>
  <text x="468" y="540" fill="#FDE047" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="13" font-weight="700">216 GB</text>

  <text x="52" y="594" fill="#64748B" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">*注：810E 数据源自平头哥官网与创智披露；M890/V900/J900 容量与带宽源自 2026 行业与供应链技术披露。</text>

  <!-- Panel 2: Scale-Up Interconnect Bandwidth (Top Right) -->
  <rect x="552" y="84" width="496" height="268" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <text x="572" y="114" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="700">2. 卡间 Scale-Up 互连带宽对比 (GB/s)</text>
  <text x="572" y="134" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">平头哥自研 ICN 协议 + ICN Switch 1.0 (25.6T) 支撑单柜 128 卡高速互联</text>

  <text x="572" y="168" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12">PCIe 5.0 x16 基线</text>
  <rect x="720" y="154" width="20" height="20" rx="3" fill="#475569"/>
  <text x="748" y="169" fill="#94A3B8" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12">128 GB/s</text>

  <text x="572" y="202" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">真武 810E (7×100G ICN)</text>
  <rect x="720" y="188" width="105" height="20" rx="3" fill="url(#aliBar)"/>
  <text x="833" y="203" fill="#FDBA74" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">700 GB/s (官方披露)</text>

  <text x="572" y="236" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">真武 M890 (升级 ICN)</text>
  <rect x="720" y="222" width="120" height="20" rx="3" fill="url(#aliBar)"/>
  <text x="848" y="237" fill="#FDBA74" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">800 GB/s</text>

  <text x="572" y="270" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="600">NVIDIA H100 / H20 (NVLink4)</text>
  <rect x="720" y="256" width="135" height="20" rx="3" fill="url(#nvBar)"/>
  <text x="863" y="271" fill="#6EE7B7" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">900 GB/s</text>

  <text x="572" y="304" fill="#FDE047" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">真武 V900 (新一代 ICN)</text>
  <rect x="720" y="290" width="180" height="20" rx="3" fill="url(#aliNextBar)"/>
  <text x="908" y="305" fill="#FDE047" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">1,200 GB/s</text>

  <text x="572" y="336" fill="#FDE047" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="12" font-weight="700">真武 J900 / NVLink 5</text>
  <rect x="720" y="322" width="240" height="20" rx="3" fill="url(#aliNextBar)" opacity="0.85"/>
  <text x="968" y="337" fill="#FDE047" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="12" font-weight="700">1,600+ GB/s</text>

  <!-- Panel 3: Relative Compute & Precision Evolution (Bottom Right) -->
  <rect x="552" y="368" width="496" height="250" rx="12" fill="#0B1120" stroke="#334155" stroke-width="1.5"/>
  <text x="572" y="398" fill="#F8FAFC" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="16" font-weight="700">3. 真武 PPU 代际相对算力跃迁与精度演进 (以 810E = 1.0× 计)</text>

  <rect x="572" y="418" width="142" height="178" rx="8" fill="#1E293B" stroke="#FB923C"/>
  <text x="643" y="442" text-anchor="middle" fill="#FDBA74" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">真武 810E</text>
  <text x="643" y="476" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="26" font-weight="700">1.0×</text>
  <text x="643" y="498" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">初代自研量产基线</text>
  <text x="643" y="524" text-anchor="middle" fill="#E2E8F0" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11">FP16 / BF16 / INT8</text>
  <text x="643" y="544" text-anchor="middle" fill="#F87171" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">无原生硬件 FP8</text>
  <text x="643" y="574" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">主力：中大型模型推理</text>

  <rect x="729" y="418" width="142" height="178" rx="8" fill="#1E293B" stroke="#F97316" stroke-width="1.8"/>
  <text x="800" y="442" text-anchor="middle" fill="#FB923C" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">真武 M890</text>
  <text x="800" y="476" text-anchor="middle" fill="#FDBA74" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="26" font-weight="700">~3.0×</text>
  <text x="800" y="498" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">对标 H20-3e 升级版</text>
  <text x="800" y="524" text-anchor="middle" fill="#34D399" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">+ 原生 FP8 Tensor</text>
  <text x="800" y="544" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">144GB HBM3e 显存</text>
  <text x="800" y="574" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">主力：千问训推一体</text>

  <rect x="886" y="418" width="142" height="178" rx="8" fill="#1E293B" stroke="#FACC15" stroke-width="1.8"/>
  <text x="957" y="442" text-anchor="middle" fill="#FDE047" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="14" font-weight="700">真武 V900</text>
  <text x="957" y="476" text-anchor="middle" fill="#FDE047" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="26" font-weight="700">~9.0×</text>
  <text x="957" y="498" text-anchor="middle" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">约 M890 的 3 倍算力</text>
  <text x="957" y="524" text-anchor="middle" fill="#FDE047" font-family="'JetBrains Mono', 'Cascadia Code', Consolas, monospace" font-size="11" font-weight="700">+ FP8 / FP4 低精度</text>
  <text x="957" y="544" text-anchor="middle" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11">216GB HBM3e · 1.2TB/s</text>
  <text x="957" y="574" text-anchor="middle" fill="#6EE7B7" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="11" font-weight="600">主力：万亿 MoE 超节点</text>
</svg>
